name: Deploy Jekyll site to Pages

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    # Ruby 3.3.0 is unavailable on Ubuntu 26.04; keep the working build image.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          ruby-version: '3.3.0'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Validate narration sources and generated speech
        run: node scripts/narration.js check

      - name: Install Chromium for preview rendering
        run: npx playwright install --with-deps chromium

      # The previews depend only on these inputs. Two runs on the same inputs
      # differ only in attribute order and a few units of crop on a handful
      # of thumbnails, so a cached run is as good as a fresh one, and its
      # content-hashed file names stay the same from one deploy to the next.
      - name: Restore hero choice previews
        id: hero-previews
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: assets/se-gym-hero-choice-previews
          key: hero-previews-${{ hashFiles('package-lock.json', '_includes/se-gym-hero.svg', 'js/se-gym-hero-avatar.js', 'scripts/build_se_gym_hero_choice_previews.js') }}

      - name: Pre-render hero choice previews
        if: steps.hero-previews.outputs.cache-hit != 'true'
        run: make hero-choice-previews
        env:
          JEKYLL_ENV: production

      # .uml_cache holds the pre-rendered diagram SVGs. Each file name hashes
      # the renderer sources and the diagram text (_plugins/uml_static.rb), so
      # a restored file is exactly what a fresh render would draw. Without it,
      # every page with a diagram launches its own headless Chromium. The key
      # starts over when ArchUML or Chromium (package-lock.json) changes, so
      # SVGs from an older renderer are not carried along.
      - name: Restore rendered diagrams
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .uml_cache
          key: uml-svg-${{ hashFiles('package-lock.json', 'js/ArchUML/**', 'js/git-graph.js') }}-${{ github.run_id }}
          restore-keys: |
            uml-svg-${{ hashFiles('package-lock.json', 'js/ArchUML/**', 'js/git-graph.js') }}-

      - name: Build with Jekyll
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3

  deploy:
    if: |
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/master'
      && needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
