    narration: "Verse 5, the State Machine Diagram. A library copy of The UML Reference Manual, copy 42, stands at the left with a status tag, Available, and a sticker: its response depends on its state. Across the top, its state machine: a black start dot, then Available, Borrowed, and Overdue. Borrow, slash set due date, moves Available to Borrowed; return goes back; day passes, with the guard today greater than due, slash send reminder, moves Borrowed to Overdue; and return, slash charge fee, goes from Overdue back to Available. The states are ringed one by one. A small Sequence Diagram below shows one run, a member borrowing the book, while dots run along every transition of the state machine: its whole life. A marker for copy 42 then walks that life, through Borrowed and Overdue and back to Available. Each state lights up as the architect, at the bottom right, runs the pencil along them, and a dot leaves each one. Three cards take one label apart: day passes is the trigger, when; today greater than due is the guard, if; slash send reminder is the action, do. Both return labels are ringed as the same trigger, charge fee as the different end, a coin pops up, and a sticker says: the current state decides, as the architect points at Overdue, whose return charges the fee, and nods. Last, a function that turns 100 Celsius into 212 Fahrenheit, twice, with the same answer each time, and a pointless one-state diagram for it, crossed out: no history, skip it."
