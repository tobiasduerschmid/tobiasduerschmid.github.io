sections:
  - id: intro
    title: "Intro"
    delivery: spoken
    narration: "Audio-described version: before each section, the picture pauses while I describe it. The whole song plays on an architect's blueprint. The intro: a brick wall goes up in a hurry; one brick in the bottom row is laid crooked, and every row above leans a little further. Your hero types at a laptop while a colleague beside them says: just keep coding, we'll fix it later, and sticky notes slap onto the wall: TODO fix later, hack sorry, FIXME, and refactor later. A desk calendar shows week 1 and five laptops are linked peer-to-peer, every pair connected; at week 9 a server drops into the middle, the peer links turn red and fade, and new links run to the server; the rewired network stays up while the next line begins. Then a three-storey building in section rests on one ground-floor wall labelled peer-to-peer. A sticker says every floor rests on it, gold arrows carry every floor's weight down into it, a stamp says load-bearing, and the wall cracks. Then your hero steps in as the architect, in a white shirt and a camel knit vest, with a pencil and a rolled drawing, and shakes their head at the cracked building. Last, the architect draws the building again in the air, and a pencil copies each stroke onto the sheet as a white-on-blue blueprint, under the words: draw it out first."
    lines:
      - id: intro-1
        start: 1.18
        end: 4.62
        text: "Your colleague says: just keep coding, we'll fix it later!"
        marks: {"your": 1.18, "colleague": 1.74, "says": 2.14, "just": 2.76, "keep": 3.06, "coding": 3.28, "well": 3.88, "fix": 3.96, "it": 4.2, "later": 4.34}
        visual: "Through the opening bars, a brick wall is laid brick by brick; one brick in the bottom row goes down crooked, and each row above sits a little further to the right. Your hero, or the default Bruin, types at a laptop while a bearded colleague beside them says “Just keep coding, we’ll fix it later!” in a speech bubble. Four sticky notes slap onto the wall, “TODO: fix later”, “hack, sorry”, “FIXME”, and “refactor later?”, and a red ring circles the crooked brick."
      - id: intro-2
        start: 5.0
        end: 10.52
        text: "In week one, we implement peer-to-peer. In week nine, we need a server."
        marks: {"in": 5.0, "week": 5.56, "one": 5.74, "we": 6.2, "implement": 6.28, "peer": 6.68, "to": 7.04, "peer_2": 7.16, "in_2": 8.54, "week_2": 9.1, "nine": 9.3, "we_2": 9.78, "need": 9.86, "a": 10.0, "server": 10.1}
        visual: "A desk calendar shows week 1. Five laptops appear in a ring and every pair is linked by a line, with the sticker “Peer-to-peer”. The calendar tears to week 9, a server rack drops into the middle, every peer link turns red and fades, and new gold links run from each laptop to the server."
      - id: intro-3
        start: 10.88
        end: 13.24
        text: "That first choice is a load-bearing wall now."
        marks: {"that": 10.88, "first": 11.2, "choice": 11.44, "is": 11.8, "a": 12.0, "load": 12.12, "bearing": 12.34, "wall": 12.68, "now": 12.98}
        visual: "A three-storey building in section: a red roof, two upper floors with furniture, and a ground floor whose middle wall carries the plate “peer-to-peer”. A gold sticker reads “Every floor rests on it”, gold arrows carry the weight of every floor down into that wall, which turns gold, and a red stamp says “Load-bearing”. The wall cracks, dust falls, and the floors above shudder."
      - id: intro-4
        start: 13.62
        end: 16.56
        text: "This time, we draw it out first."
        marks: {"this": 13.62, "time": 14.18, "we": 14.5, "draw": 15.66, "it": 15.88, "out": 16.02, "first": 16.14}
        visual: "Your hero steps in from the right as the architect, in a white shirt with rolled sleeves, buttoned to the collar, and a camel knit vest, a yellow pencil in one hand and a rolled drawing in the other, and shakes their head at the cracked building. Then the architect draws the building in the air, and a pencil copies every stroke onto the sheet as a white-on-blue blueprint, line by line, under the big words “Draw it out first”; the architect nods."
  - id: verse-1
    title: "Verse 1"
    delivery: sung
    narration: "Verse 1. Four teammates, like the four on the lecture's slides, stand at the edges of the stage. Their thought bubbles show four different buildings: a tower, a mall, a factory, and a museum. A clear house drawn on the whiteboard between them makes all four bubbles show that same house, with green checks; a rough, wobbly outline of a house with no windows or chimney turns them into a shed, a garage, a doghouse, and a warehouse, with puzzled faces. Next, a floor plan drops its furniture, wiring, sizes, and labels until only the pipes are left, glowing, for the question: where do the pipes run? Beside it the architect sweeps the pencil across the plan as the details drop, nods, and circles the pipes in the air. A flaw on a paper sketch, a door that swings into a wall, is circled, rubbed out with an eraser, and redrawn with a check, while the architect taps the pencil at it and nods; beside it, a shipped library app on a phone has a bug crawling on it, and four worried teammates face a stamp: rework for everyone. Then the four teammates come back around the whiteboard, which now holds a UML class box for House under the letters U M L, the Unified Modeling Language, and every bubble shows that same class box. Last, the architect points at the plan, the House class diagram, and hands it on: it goes to the four teammates and to a coding-agent robot, and the architect ticks off a checklist that tests what comes back against the plan: three checks."
    lines:
      - id: verse-1-1
        start: 18.36
        end: 24.66
        text: "Ask for a building: four teammates see a tower, a mall, a factory, a museum."
