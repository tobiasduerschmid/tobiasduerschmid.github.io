        visual: "A gold speech bubble says “Build us a building!”. Four teammates rise in at the edges of the stage: a young man in a blue hoodie, a woman with curly hair in a yellow shirt, a bearded man in a brown sweater, and a woman in a green hijab. Their thought bubbles fill one by one: a glass tower, a mall with a “MALL” sign, a factory with a chimney, and a museum with columns."
      - id: verse-1-2
        start: 22.42
        end: 26.92
        text: "Draw it clearly: all four see one house. Draw it vague: they're lost again."
        marks: {"draw": 22.42, "it": 23.16, "clearly": 23.18, "all": 23.72, "four": 24.04, "see": 24.34, "one": 24.64, "house": 24.92, "draw_2": 25.44, "it_2": 25.54, "vague": 25.7, "theyre": 25.92, "lost": 26.3, "again": 26.6}
        visual: "A marker draws a clear house on a whiteboard between them; all four bubbles switch to that same house, each with a green check, and the teammates smile. Then the board shows only a vague outline, a roof and a door arch: the bubbles become a shed, a garage, a doghouse, and a warehouse, each with a yellow question mark, and the teammates look puzzled."
      - id: verse-1-3
        start: 26.94
        end: 32.22
        text: "So: UML, the Unified Modeling Language, one notation for all of them."
        marks: {"so": 26.94, "uml": 27.36, "the": 28.6, "unified": 28.66, "modeling": 29.12, "language": 29.64, "one": 30.2, "notation": 30.68, "for": 31.26, "all": 31.64, "of": 31.9, "them": 31.98}
        visual: "Gold letters U, M, L slam in above “Unified Modeling Language”. The whiteboard now holds a UML class diagram: class House with −floors: int, −rooms: int, and +build(). All four bubbles show the same class box with green checks, and the teammates smile."
      - id: verse-1-4
        start: 32.22
        end: 34.94
        text: "A model leaves some details out on purpose:"
