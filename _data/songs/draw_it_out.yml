  - id: verse-2
    title: "Verse 2"
    delivery: sung
    narration: "Verse 2, the Class Diagram. A Python file, book dot py, sits beside the class box it becomes: Book, with private title and copies, and public borrow and getTitle. Rings and labels mark the name, the attributes, what each object stores, and the operations, what you can ask. The minus signs light up red: private. A padlock snaps shut beside the hidden fields, and the private copies field changes from an Integer to a List of Copy, in the code and in the box, with a label: no one outside sees it. The plus signs light up green: public, callers rely on them, and Catalog and Checkout call those operations. Next, abstract class Shape, its name in italics, above Rectangle. A code card tries to make a plain Shape and is stamped: no plain Shape. The hollow triangle that points up to the parent is ringed: every Rectangle is a Shape. Last, interface BookStore with getBook and addBook, operations only, beside a contract on parchment. Dashed lines with a hollow triangle join SqlStore and MemoryStore to it: implements, and each store signs the contract."
    lines:
      - id: verse-2-1
        start: 65.92
