# Storyboard for "Draw It Out While It’s Cheap to Change", the UML song on the SE Book page
# SEBook/uml.md (embedded with _includes/song-video.html).
#
# This file is the single source of truth for the song's words and timing:
#   - js/song-video/songs/draw_it_out.js choreographs the live vector player
#     (/assets/song-player/draw-it-out.html) against each line's `start` and
#     its `marks` (the times of the words the visuals hit). ArchUML
#     (js/ArchUML/uml-bundle.js) draws the UML notation through
#     js/song-video/model-kit.js, js/song-video/sketch-kit.js draws the
#     pictures beside it, and js/song-video/drafting-room.js the room;
#   - render.js writes the captions and the audio-described soundtrack from
#     `text`, `answer`, and `narration` (`node scripts/song-video/render.js
#     draw_it_out`). This song has no MP4: it plays only in the live player;
#   - _includes/song-video.html prints every line with its `visual`
#     description as the on-page transcript (WCAG 1.2.1 / 1.2.3);
#   - each section's `narration` is spoken in the audio-described track,
#     where the picture holds at the start of the section while the narrator
#     describes what it shows (extended audio description, WCAG 1.2.5).
# Editing text or descriptions here updates the transcript and the player on
# the next Jekyll build, but the captions and described audio only after
# re-running render.js.
#
# Times are seconds into take 2 of the rewritten sheet, the Suno take
# "Draw It Out First" (normalized to about -16 LUFS, AAC at 192 kb/s). Line
# boundaries and word marks come from local Whisper word timestamps (mlx
# whisper-large-v3-turbo) aligned to the lyric sheet in
# docs/draw-it-out-song-lyrics.md, then refined with short clip passes around
# each line. Where the sheet splits a sentence across lyric lines to slow the
# singing, the storyboard keeps the sentence as one line. Captions follow the
# recording where it differs from the sheet: verse 5's chant drops the
# shouted "Guard:"; the quiz intro drops "Think, then shout it!"; question 6
# is sung "Where does the price attribute live"; question 7 is sung "Your
# payment provider"; the final chorus ends "Ask your question and draw it
# out"; and the take ends with the hook sung once more. A short backing
# ad-lib after "Does A reference B?" in verse 3 is not captioned, because its
# words are unclear. Suno left little gap between a quiz question and its
# answer, so each `pause_at` sits right after the question's last word.
# Beats were tracked with librosa and smoothed over ±5 beats.

