sections:
  - id: intro
    title: "Intro"
    delivery: spoken
    narration: "Audio-described version: before each section, the picture pauses while I describe it. The whole song plays on an architect's blueprint. The intro: your hero types at a laptop and says, we'll fix it later, while sticky notes pile up: TODO fix later, hack sorry, FIXME, and refactor later. A desk calendar shows week 1 and five laptops are linked peer-to-peer, every pair connected; at week 9 a server drops into the middle, the peer links turn red and fade, and new links run to the server. Then a three-storey building in section rests on one ground-floor wall labelled peer-to-peer. A sticker says every floor rests on it, gold arrows carry every floor's weight down into it, a stamp says load-bearing, and the wall cracks. Last, a pencil drafts the same building as a white-on-blue blueprint under the words: draw it out first."
    lines:
      - id: intro-1
        start: 2.94
        end: 5.18
        text: "Just keep coding, we'll fix it later!"
        marks: {"just": 2.94, "keep": 3.46, "coding": 3.66, "well": 4.34, "fix": 4.52, "it": 4.76, "later": 4.92}
        visual: "Your hero, or the default Bruin, types at a laptop and says “We’ll fix it later!” in a speech bubble, while four sticky notes slap onto the wall one by one: “TODO: fix later”, “hack, sorry”, “FIXME”, and “refactor later?”."
      - id: intro-2
        start: 6.06
        end: 9.54
        text: "Week one: peer-to-peer. Week nine: we need a server."
        marks: {"week": 6.06, "one": 6.83, "peer": 7.26, "to": 7.52, "peer_2": 7.68, "week_2": 8.18, "nine": 8.56, "we": 8.82, "need": 8.92, "a": 9.06, "server": 9.18}
        visual: "A desk calendar shows week 1. Five laptops appear in a ring and every pair is linked by a line, with the sticker “Peer-to-peer”. The calendar tears to week 9, a server rack drops into the middle, every peer link turns red and fades, and new gold links run from each laptop to the server."
      - id: intro-3
        start: 10.08
        end: 13.08
        text: "That first choice is a load-bearing wall now."
        marks: {"that": 10.08, "first": 10.7, "choice": 11.02, "is": 11.42, "a": 11.7, "load": 11.8, "bearing": 12.08, "wall": 12.46, "now": 12.76}
        visual: "A three-storey building in section: a red roof, two upper floors with furniture, and a ground floor whose middle wall carries the plate “peer-to-peer”. A gold sticker reads “Every floor rests on it”, gold arrows carry the weight of every floor down into that wall, which turns gold, and a red stamp says “Load-bearing”. The wall cracks, dust falls, and the floors above shudder."
      - id: intro-4
        start: 13.26
        end: 15.46
        text: "This time, we draw it out first."
        marks: {"this": 13.26, "time": 13.72, "we": 14.22, "draw": 14.64, "it": 14.86, "out": 15.0, "first": 15.14}
        visual: "A pencil sweeps across the stage and drafts the same building as a white-on-blue blueprint, line by line, under the big words “Draw it out first”."
  - id: verse-1
    title: "Verse 1"
    delivery: sung
    narration: "Verse 1. Four teammates, like the four on the lecture's slides, stand at the edges of the stage. Their thought bubbles show four different buildings: a tower, a mall, a factory, and a museum. A clear house drawn on the whiteboard between them makes all four bubbles show that same house, with green checks; a vague outline, just a roof and a door, turns them into a shed, a garage, a doghouse, and a warehouse, with puzzled faces. Then the letters U M L, the Unified Modeling Language, and a UML class box for House on the board, and every bubble shows the same class box. Next, a floor plan drops its furniture, wiring, sizes, and labels until only the pipes are left, glowing, for the question: where do the pipes run? A flaw on a paper sketch, a door that swings into a wall, is circled, rubbed out with an eraser, and redrawn with a check; beside it, a shipped library app on a phone has a bug crawling on it, and four worried teammates face a stamp: rework for everyone. Last, the plan, a class diagram of House, goes to the four teammates and to a coding-agent robot, and a checklist tests what comes back against the plan: three checks."
    lines:
      - id: verse-1-1
        start: 16.98
        end: 22.42
        text: "Ask for a building: four teammates see a tower, a mall, a factory, a museum."
