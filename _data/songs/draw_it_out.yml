    narration: "Verse 4, the Sequence Diagram: one scenario, get book 42, with a time arrow pointing down beside it. Client calls getBook 42 on the server, the server calls find 42 on the database, a row comes back, the book comes back, and then the client sends viewed 42 to analytics. Red bands show the client waiting on the server while the server waits on the database; the architect, at the left, leans in and circles the database, which is ringed: bottleneck, both callers wait. The architect thinks, pencil to chin, and points at the solid getBook line with its filled head, ringed: synchronous. Dots travel the calls and the replies, while a red band says caller waits, and the architect checks a wristwatch and waits until the dashed reply comes back, then nods. The open-headed viewed message is ringed, asynchronous: the architect raises the pencil and flings it out, a paper plane flies along the message, and the architect carries straight on, writing in the air, as the client's bar keeps going. Next, one client and one server, drawn large, while only the fragment around their messages changes: alt, with a found branch and an else branch; opt, around one call, if logged in; and loop, for each book, where a dot repeats the renew call three times. Beside them a code card for each one stacks up, alt is if else, opt is if, and loop is for or while, and each card's code lights up as its fragment is named."
