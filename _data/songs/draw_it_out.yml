# Storyboard for "Draw It Out While It’s Cheap to Change", the UML song on the SE Book page
# SEBook/uml.md (embedded with _includes/song-video.html).
#
# This file is the single source of truth for the song's words and timing:
#   - js/song-video/songs/draw_it_out.js choreographs the live vector player
#     (/assets/song-player/draw-it-out.html) against each line's `start` and
#     its `marks` (the times of the words the visuals hit). ArchUML
#     (js/ArchUML/uml-bundle.js) draws the UML notation through
#     js/song-video/model-kit.js, js/song-video/sketch-kit.js draws the
#     pictures beside it, and js/song-video/drafting-room.js the room;
#   - render.js writes the captions and the audio-described soundtrack from
#     `text`, `answer`, and `narration` (`node scripts/song-video/render.js
#     draw_it_out`). This song has no MP4: it plays only in the live player;
#   - _includes/song-video.html prints every line with its `visual`
#     description as the on-page transcript (WCAG 1.2.1 / 1.2.3);
#   - each section's `narration` is spoken in the audio-described track,
#     where the picture holds at the start of the section while the narrator
#     describes what it shows (extended audio description, WCAG 1.2.5).
# Editing text or descriptions here updates the transcript and the player on
# the next Jekyll build, but the captions and described audio only after
# re-running render.js.
#
# Times are seconds into take 7 of the rewritten sheet, the Suno take "Draw It
# Out" (1) (about 122 BPM). Its vocals swing between left and right from verse 5
# on, so the soundtrack merges the two channels into mono: each frequency band
# keeps their in-phase sum, raised to the power the two channels had together,
# so a part panned to one side keeps its loudness. It is normalized to -16 LUFS
# with one linear gain and stored as mono AAC at 160 kb/s. Its
# verses say when to use each diagram and element, checked against Lecture 7
# and the SEBook (docs/draw-it-out-song-lyrics.md, "Take 7"). Line boundaries
# and word marks come from local Whisper word timestamps (mlx
# whisper-large-v3-turbo) aligned to that sheet and checked with short clip
# passes; where Whisper misheard a word ("Opt" as "Alt", "orders kept: filled
# diamond"), the mark takes the time of the word it heard instead. Where the
# sheet splits a sentence across lyric lines to slow the singing, the
# storyboard keeps the sentence, or a clause of a long one, as one line.
# Captions follow the recording where it differs from the sheet: quiz
# question 4 drops the "a" of "refund or a fee", and the outro sings the hook
# twice. Sung, "that's asynchronous" sounds like "that's a synchronous"; the
# caption and the picture say which. Suno left no bar between a quiz question
# and its answer, despite the sheet's [instrumental bar] cues, so each
# `pause_at` sits right after the question's last word. Beats were tracked
# with librosa and smoothed over ±5 beats.

