        start: 35.28
        end: 36.94
        text: "it shows the part your question is about."
        marks: {"it": 35.28, "shows": 35.52, "the": 35.7, "part": 35.84, "your": 36.02, "question": 36.14, "is": 36.42, "about": 36.66}
        visual: "The blue pipes, the only layer left besides the walls, glow thicker: the part the question is about."
      - id: verse-1-6
        start: 36.94
        end: 38.9
