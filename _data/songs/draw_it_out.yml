  - id: chorus-1
    title: "Chorus"
    delivery: sung
    narration: "The chorus: big gold words, draw it out, while it's cheap to change. Then each question appears on a card at the top, and when its answer is sung, that diagram's sheet slams in, large, with the diagram's name as its title, before it shrinks into a corner. Which classes, how they relate: a Class Diagram, where a Member borrows many Books. Who calls whom, in what order: a Sequence Diagram, where client calls getBook 42 on the server and gets a book back. What state's it in, what event moves it on: a State Machine Diagram, from Available to Borrowed on borrow, and back on return. What runs, how it plugs together: a Component Diagram, where Client requires Books and LibraryServer provides it, a socket around a ball. Last, with all four in the corners, a card asks: what do you need to know? Then: draw it out."
