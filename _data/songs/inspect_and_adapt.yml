sections:
  - id: intro
    title: "Intro"
    delivery: sung
    voice: "New Developer"
    narration: "Audio-described version: before each section, the picture pauses while I describe it. The Found It team's office: a big display on a warm white wall, a team sign above it reading Inspect and Adapt, a window over the city on the left, and the team's task board on the right. The display shows a lost wallet, then the Found It app on a phone: the wallet pinned on a map and a notification, Your wallet was found. The New Developer, a young man in a blue hoodie, walks in, and a badge beside him reads New on the team. The display shows the Scrum Team as six discs with their roles' emblems, a whistle, a compass, and four hard hats, then an org chart whose top box holds only a question mark."
    lines:
      - id: intro-1
        start: 1.82
        end: 5.16
        text: "Somebody lost a wallet, left it in the hall."
        marks: {"somebody": 1.82, "lost": 2.34, "a": 2.76, "wallet": 3.02, "left": 3.64, "it": 4.24, "in": 4.5, "the": 4.62, "hall": 4.72}
        visual: "Lights up on the Found It team's office: a big display on a warm white wall, a team sign above it reading “Inspect and Adapt”, a window over the city on the left, and the team's task board, its sticky notes in three columns, on the right. The New Developer, a young man in a blue hoodie, walks in from the left. The display shows a lost wallet with a tag: “Lost in the hall”."
      - id: intro-2
        start: 5.36
        end: 8.86
        text: "Our app, Found It, finds it — we bring it back, that’s all."
        marks: {"our": 5.36, "app": 5.66, "found": 5.94, "it": 6.38, "finds": 6.64, "it_2": 6.9, "we": 7.26, "bring": 7.5, "it_3": 7.72, "back": 7.86, "thats": 8.16, "all": 8.6}
        visual: "Beside it, the Found It app opens on a phone: a pin, “Wallet · Hall B”, then a notification, “Your wallet was found”."
      - id: intro-3
        start: 9.36
        end: 13.08
        text: "I just joined the team — six of us, one product too."
        marks: {"i": 9.36, "just": 9.88, "joined": 10.14, "the": 10.48, "team": 10.64, "six": 11.16, "of": 11.34, "us": 11.5, "one": 11.9, "product": 12.06, "too": 12.82}
        visual: "A badge beside the New Developer's face reads “New on the team”. The screen shows the Scrum Team as six discs, each with its role's emblem: a whistle for the Scrum Master, a compass for the Product Owner, and a hard hat for each of four Developers, one of them marked “you”. A caption reads “Scrum Master · Product Owner · 4 Developers”."
      - id: intro-4
        start: 13.14
        end: 17.0
        text: "So who’s the boss around here? Who tells me what to do?"
        marks: {"so": 13.14, "whos": 13.46, "the": 13.68, "boss": 13.8, "around": 14.1, "here": 14.38, "who": 14.9, "tells": 15.2, "me": 15.52, "what": 15.72, "to": 16.04, "do": 16.52}
        visual: "An org chart appears whose top box holds only a question mark, labeled “Boss?”. The New Developer shrugs."
  - id: scrum-master
    title: "The Scrum Master"
    delivery: sung
    voice: "Scrum Master"
    narration: "The Scrum Master, a man dressed as a coach, walks in from the right: a teal track jacket with striped sleeves, a whistle on a lanyard, and a clipboard. The slide reads Scrum Master, the team coach, with a list of what the Scrum Master is accountable for and a Not row. On a basketball court seen from above, the Developers play while the coach stays on the sideline: they draw their own plays and huddle, a game clock runs the Daily Scrum's fifteen minutes down to zero, a project manager's pyramid is crossed out beside a servant-leader's inverted one, and the coach clears a wall from a player's path."
    lines:
      - id: sm-1
        start: 17.52
        end: 20.84
        text: "No boss here, my friend — I’m the Scrum Master, the coach."
        marks: {"no": 17.52, "boss": 18.04, "here": 18.36, "my": 18.64, "friend": 18.7, "im": 19.18, "the": 19.4, "scrum": 19.56, "master": 19.94, "the_2": 20.42, "coach": 20.5}
        visual: "The Scrum Master, a man dressed as a coach, walks in from the right: a teal track jacket with striped sleeves, a whistle on a lanyard, and a clipboard. The org chart's “Boss?” box is crossed out. A slide opens, “Scrum Master · the team coach”, with a list headed “Accountable for” and a “Not” row that strikes out “boss”. On a basketball court seen from above, four Developers stand on the court, labeled “Developers: on the court”, and the coach stands on the sideline, labeled “Scrum Master: on the sideline”."
      - id: sm-2
        start: 21.14
        end: 24.16
        text: "I won’t assign your tasks; the team picks its approach."
        marks: {"i": 21.14, "wont": 21.48, "assign": 21.66, "your": 21.98, "tasks": 22.18, "the": 22.88, "team": 22.96, "picks": 23.28, "its": 23.66, "approach": 23.78}
        visual: "Each Developer draws an arrow for their own play: “The team picks its own plays”. The Not row strikes out “task assigner”."
      - id: sm-3
        start: 24.16
        end: 27.6
        text: "I coach you to self-manage and help you all learn Scrum."
        marks: {"i": 24.16, "coach": 24.76, "you": 25.02, "to": 25.26, "self": 25.4, "manage": 25.7, "and": 26.12, "help": 26.24, "you_2": 26.44, "all": 26.58, "learn": 26.78, "scrum": 27.04}
        visual: "The Developers move into a huddle: “Self-management: the team decides”. On the sideline, a label with a book reads “The Scrum Guide”. The list adds “coaches self-management” and “teaches Scrum”."
      - id: sm-4
        start: 27.74
        end: 31.16
        text: "I keep each event timeboxed — a fixed time, then it’s done."
        marks: {"i": 27.74, "keep": 28.0, "each": 28.24, "event": 28.5, "timeboxed": 29.21, "a": 29.62, "fixed": 29.72, "time": 29.96, "then": 30.42, "its": 30.72, "done": 30.92}
        visual: "A game clock over the court reads “Daily Scrum” and runs from 15:00 down to 00:00, then stops; a label reads “Timebox: a fixed maximum time”. The list adds “timeboxes events”."
      - id: sm-5
        start: 31.5
        end: 35.0
        text: "No project manager — a servant-leader, serving you."
        marks: {"no": 31.5, "project": 32.06, "manager": 32.54, "a": 33.22, "servant": 33.42, "leader": 33.9, "serving": 34.22, "you": 34.7}
        visual: "The court gives way to two pyramids: a project manager's, with the manager on top directing the team, is crossed out; beside it an inverted pyramid has the Developers on top and the Scrum Master underneath, serving them. The Not row strikes out “project manager”, and the list adds “servant-leader”."
      - id: sm-6
        start: 35.3
        end: 38.88
        text: "I chase each impediment, a wall you can’t break through."
        marks: {"i": 35.3, "chase": 35.5, "each": 35.9, "impediment": 36.24, "a": 37.06, "wall": 37.3, "you": 37.64, "cant": 37.84, "break": 38.24, "through": 38.48}
        visual: "Back on the court, a brick wall drops in front of a running Developer: “Impediment: e.g. a missing license”. The coach comes off the sideline to the wall, the wall lifts, and the run goes on. The list adds “removes impediments”."
  - id: product-owner
    title: "The Product Owner"
    delivery: sung
    voice: "Product Owner"
    narration: "The Product Owner, a woman dressed as a navigator, walks in from the right: a navy double-breasted sea coat with brass buttons and gold cuff braid over a striped shirt, a compass pin, and a spyglass. The slide reads Product Owner, the value navigator. A sea chart unrolls: its compass reads Value and points to the product vision, users on the shore speak to the ship directly, the user stories become numbered waypoints on a course ordered by value, a cool idea off the course is crossed out, a Developer's question gets an answer, and the ship sails to the first waypoint, where its acceptance criteria are ticked."
    lines:
      - id: po-1
        start: 39.16
        end: 42.82
        text: "I’m the Product Owner — one person, value’s my call."
        marks: {"im": 39.16, "the": 39.6, "product": 39.84, "owner": 40.48, "one": 41.1, "person": 41.22, "values": 41.68, "my": 42.18, "call": 42.42}
        visual: "The Scrum Master leaves, and the Product Owner, a woman dressed as a navigator, walks in from the right: a navy double-breasted sea coat with brass buttons and gold braid at the cuffs over a striped Breton shirt, a gold compass pin, and a spyglass. A slide opens, “Product Owner · the value navigator”. A sea chart unrolls; its compass rose reads “Value”, and its needle swings toward an island flagged “Product vision”. The list adds “one person, maximizes value”."
      - id: po-2
        start: 43.12
        end: 46.68
        text: "I talk with users directly, not secondhand at all."
        marks: {"i": 43.12, "talk": 43.16, "with": 43.46, "users": 43.66, "directly": 44.1, "not": 44.54, "secondhand": 45.06, "at": 45.96, "all": 46.4}
        visual: "Two users stand on the shore with speech bubbles, “We lose things!” and “Tell us fast!”; a line runs from them straight to the ship, labeled “talks directly”. The list adds “talks with users directly”."
      - id: po-3
        start: 46.82
        end: 50.44
        text: "Needs become user stories; I order them, value on top."
        marks: {"needs": 46.82, "become": 47.04, "user": 47.36, "stories": 48.12, "i": 48.86, "order": 48.94, "them": 49.2, "value": 49.38, "on": 49.82, "top": 50.12}
        visual: "The requests become three flagged islands, the user stories “Post an item”, “Ping the owner”, and “Search by place”, numbered 1, 2, and 3; a dashed course runs from the ship through them in that order to the product vision. A label reads “Product Backlog: ordered by value”. The list adds “writes user stories” and “orders the Product Backlog”."
      - id: po-4
        start: 50.64
        end: 54.32
        text: "Not on the Product Backlog? Nobody builds it. Stop."
        marks: {"not": 50.64, "on": 50.92, "the": 51.14, "product": 51.32, "backlog": 51.84, "nobody": 52.66, "builds": 53.4, "it": 53.8, "stop": 54.1}
        visual: "A fog-ringed island, “Cool idea!”, appears off the course; a red course toward it is crossed out: “Not on the Product Backlog: not built”. The list adds “the single source of work”."
      - id: po-5
        start: 54.82
        end: 56.68
        text: "I answer all your questions,"
        marks: {"i": 54.82, "answer": 55.18, "all": 55.62, "your": 55.88, "questions": 56.08}
        visual: "A card shows a question and its answer: “Developer: exact spot or just the building?” and “Product Owner: the exact spot!”. The list adds “answers questions”."
      - id: po-6
        start: 56.68
        end: 62.36
        text: "and when a story’s done, I check acceptance criteria one by one."
        marks: {"and": 56.68, "when": 57.08, "a": 57.28, "storys": 57.48, "done": 58.1, "i": 58.3, "check": 58.52, "acceptance": 58.84, "criteria": 59.5, "one": 60.44, "by": 61.3, "one_2": 61.78}
        visual: "The ship sails to the first waypoint, and a checklist, “Acceptance criteria · Post an item”, ticks “description entered”, “pinned on the map”, and “posted in under a minute” one by one. The list adds “checks acceptance criteria”."
  - id: developers
    title: "The Developers"
    delivery: sung
    voice: "Developers"
    narration: "Three Developers, two men and a woman, walk in and stand under the screen: a man in a painter's apron with a palette, a man in a green hoodie with a code tag, and a woman in a lab coat with a magnifier; the New Developer joins them. The slide reads Developers, the builders, over a building site: the Increment rises block by block, design, code, and test; a toolbox holds every skill; a task board reads We pick our tasks, then Our Sprint plan, re-planned every day; and a Definition of Done seal stamps the stack."
