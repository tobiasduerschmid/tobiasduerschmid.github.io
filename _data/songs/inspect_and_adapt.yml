# Storyboard for "Inspect and Adapt", the Scrum musical: a New Developer
# joins the team behind the Found It app and asks who the boss is; the Scrum
# Master, the Product Owner, and the Developers each answer with their
# accountabilities, and the second act runs one Sprint through its events
# (lyrics, learning design, and Suno brief: docs/scrum-song-lyrics.md).
#
# This file is the single source of truth for the song's words and timing:
#   - js/song-video/songs/inspect_and_adapt.js choreographs the live vector
#     player (/assets/song-player/inspect-and-adapt.html) against each line's
#     `start` and its `marks` (the times of the words the visuals hit). The
#     cast are the singers of js/song-video/opera-cast.js in the team's
#     office of js/song-video/team-room.js. js/song-video/scrum-scenes.js
#     draws the roles in the CS 130 lecture's metaphors (the team coach on a
#     basketball court, the value navigator on a sea chart, the builders
#     stacking the Increment), empiricism's three pillars, and the role
#     cards; js/song-video/pattern-kit.js and js/song-video/scrum-kit.js
#     draw the cards, the Sprint strip, the Scrum board, and the quiz;
#   - render.js writes the captions and the audio-described soundtrack from
#     `text`, `answer`, and `narration`. This song has no MP4: it plays only
#     in the live player;
#   - the player page prints every line with its `visual` description as the
#     transcript (WCAG 1.2.1 / 1.2.3), and each section's `narration` is
#     spoken in the audio-described track (WCAG 1.2.5).
# Each section names its singer (`voice`), so the captions and transcript say
# who sings: the New Developer, the Scrum Master, the Product Owner, the
# Developers, or the Whole Scrum Team.
#
# Times are seconds into the Suno take "Inspect and Adapt" (take 5, about 125
# BPM). Suno sang the Scrum Master and the New Developer in one voice, so the
# Scrum Master's four sections are coloured slightly warmer and darker: a
# zero-phase EQ (+3 dB below 250 Hz, -3 dB above 3 kHz) on the Demucs vocal
# stem, added to the mix as the difference it makes, with a 0.3 s crossfade
# centred on each cut. Nothing else in the recording changes. The result is
# about -16 LUFS, stored as stereo AAC at 192 kb/s with its index first. Line boundaries and word
# marks come from local Whisper word timestamps (mlx whisper-large-v3-turbo)
# aligned to the lyric sheet: 686 of 705 sheet words matched, and the rest
# are interpolated between their neighbours. Captions follow the sheet. The
# take sings each quiz answer right after its question, so each `pause_at`
# sits just before the answer. Beats were tracked with librosa on the
# instrumental stem and smoothed over +-5 beats.
title: "Inspect and Adapt: a Scrum musical"   # the player's accessible name
credit: Lyrics written for this page; music and vocals generated with Suno.
theme: team-room   # stage look: the team's office of js/song-video/team-room.js
