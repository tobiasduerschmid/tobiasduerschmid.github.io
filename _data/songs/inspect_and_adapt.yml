    - /css/song-video-opera-cast.css
    - /css/song-video-pattern-kit.css
    - /css/song-video-scrum-kit.css
    - /css/song-video-scrum-scenes.css
  scripts:
    - /js/song-video/team-room.js
    - /js/song-video/figure-geometry.js
    - /js/song-video/opera-cast.js
    - /js/song-video/pattern-kit.js
    - /js/song-video/scrum-kit.js
    - /js/song-video/scrum-scenes.js
player: /assets/song-player/inspect-and-adapt.html
