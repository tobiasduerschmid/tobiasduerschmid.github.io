# Storyboard for "It Works on My Machine", a comic opera about one teammate
# who keeps "helping", in the CS 35L video playlist (_data/song_playlists.yml).
# It has no chapter page: its player page (/assets/song-player/it-works-on-my-machine.html)
# prints the transcript itself.
#
# This file is the single source of truth for the song's words and timing:
#   - js/song-video/songs/it_works_on_my_machine.js choreographs the live
#     vector player against each line's `start` and its `marks` (the time
#     of every sung word, which the singers' mouths also follow). The stage
#     is js/song-video/opera-house.js, the singers js/song-video/opera-cast.js,
#     and the pictures beside them js/song-video/machine-kit.js;
#   - render.js writes the captions and the audio-described soundtrack from
#     `text`, `voice`, and `narration` (`node scripts/song-video/render.js
#     it_works_on_my_machine`). This song has no MP4: it plays only in the
#     live player;
#   - _layouts/song-player.html prints every line with its `visual`
#     description as the transcript (WCAG 1.2.1 / 1.2.3);
#   - each section's `narration` is spoken in the audio-described track,
#     where the picture holds at the start of the section while the narrator
#     describes what it shows (extended audio description, WCAG 1.2.5).
# Editing text or descriptions here updates the transcript and the player on
# the next Jekyll build, but the captions and described audio only after
# re-running render.js.
#
# Seven voices sing: the Teammate (a tenor) and the six teammates who answer
# him; all six sing the last line together (`voice: All six teammates`).
# `voice` names the singer of a section, or of a single line within it; the
# captions name the singer whenever the voice changes. The lyric sheet and
# the Suno prompt behind this take are in docs/it-works-on-my-machine-song-lyrics.md.
#
# Times are seconds into the third Suno take, "It Works on My Machine(2)"
# (rewritten lyrics: a concert-ticket app instead of a coffee app; about
# 148 BPM by the percussion; stereo, kept as recorded: balanced, 95% of
# half-second windows within 1.6 dB). It sings "Requirements?" twice and
# the closing line twice, so the sheet does too. Line boundaries and word
# marks come from local Whisper word timestamps (mlx whisper-large-v3-turbo)
# aligned to the lyric sheet, with each word's onset refined on the vocal
# stem (Demucs htdemucs) and each line's end where the voice falls silent;
# Whisper missed "shared" (verse 5) and "main" (the Back-End Developer's
# first line), whose marks sit between their neighbours. Clip passes on the
# vocal stem confirmed the doubtful words and set the final refrain's "It"
# (251.2 s, after the held "again"), its last "green" (held to 270.6 s), and
# the sung ending (278.3-284.2 s), followed by the closing chord.

