  - id: outro
    title: "Outro"
    delivery: spoken
    voice: Teammate
    narration: "Outro, spoken. The music stops. His laptop now shows a red cross and the words Fatal error; he frowns at it, puzzled. He steps to the desk and reaches for the keyboard with a sly smile, and the Security Engineer slips off to the right. Then the Security Engineer glides in from the left, between him and the desk, palm out; he jumps back with both hands up, and the teammates nod. On the closing chord the curtain falls, and the moral of the opera is posted on it: Ask your users what they need. Lock your dependencies. Test behaviour, not implementation. Hide details behind interfaces. Never force-push a shared branch. Keep secrets out of Git."
