sections:
  - id: intro
    title: "Intro"
    delivery: sung
    voice: Teammate
    narration: "Audio-described version: before each section, the picture pauses while I describe it. The song is a comic opera on the stage of an opera house dressed as a software team's office: red velvet drapes, a gilded arch, footlights, and a conductor in the pit. On the back wall are an arched window onto the city, a wall clock beside it, and a board headed Build status with six lamps, all green with ticks. The curtain rises, and a follow spot picks up the Teammate, the tenor, gliding in from the left: a towering brown pompadour, a twirled moustache, a teal quarter-zip pullover over a white tee, studio headphones round his neck, jeans, and orange sneakers. At a desk on the right, your hero, or the default Bruin, types at a laptop. He raises a calming palm to them and pats his chest. A sprint calendar sheds its fourteen days down to: ship today. A toy ship flagged v1.0 by 3:00 is flown in from the rafters on two wires, the clock spins to three, and he salutes it. Each teammate who answers him later wears your hero's face, or the SE Gym's default hero's."
    lines:
      - id: intro-1
        start: 1.62
        end: 7.48
        text: "No need to worry! Just leave it to me!"
        marks: {"no": 1.62, "need": 2.16, "to": 2.78, "worry": 3.14, "just": 5.17, "leave": 5.66, "it": 6.16, "to_2": 6.4, "me": 6.66}
        visual: "The curtain rises on the opera-house office: an arched window onto a sunny city, a wall clock at nine, and a “Build status” board with six green lamps, each with a tick. A follow spot picks up the Teammate, the tenor, gliding in from the left: a towering brown pompadour with a curl, a twirled moustache, a teal quarter-zip pullover over a white tee with a rocket on the chest, studio headphones round his neck, jeans, and orange sneakers. At a desk on the right, your hero, or the default Bruin, types at a laptop. On “No need to worry” he raises a calming palm toward them; on “leave it to me” he pats his chest twice."
      - id: intro-2
        start: 8.49
        end: 14.84
        text: "I'll save us a fortnight— We'll ship it by three!"
        marks: {"ill": 8.49, "save": 9.14, "us": 9.62, "a": 9.84, "fortnight": 10.04, "well": 12.1, "ship": 12.76, "it": 13.18, "by": 13.42, "three": 13.74}
        visual: "A wall calendar headed “Sprint” shows 14 days left; on “save” he points at it and its pages tear off one after another until it reads “Ship today!”. On “We’ll”, a toy galleon on wheels, its pennant tagged “v1.0 by 3:00”, is flown in from the rafters on two wires and swings to a stop on the floor; on “ship” the clock spins to three, and on “three” he salutes it, then flings both arms wide."
  - id: verse-1
    title: "Verse 1: Requirements"
    delivery: sung
    voice: Teammate
    narration: "Act one, Requirements. A long scroll of requirements unrolls behind the Teammate, and he snaps it shut with one raised finger. A giant phone running the coffee app, CoffeeGo, shows a cup to go, then one big order button and a latte, gleaming. Silhouetted hands in the audience go up with question marks; he shushes them and taps his temple. A card for a meeting with users, What do they need?, appears, and he tears it in two and tosses the halves away. He bows to a lit Applause sign, and the house stays silent but for a cricket."
    lines:
      - id: verse-1-1
        start: 17.29
        end: 20.24
        text: "Requirements? Quite simple! It's coffee to go!"
        marks: {"requirements": 17.29, "quite": 17.82, "simple": 18.06, "its": 18.74, "coffee": 19.0, "to": 19.4, "go": 19.54}
        visual: "A badge reads “Act I · Requirements”. A long scroll titled “Requirements”, ruled with line after line, unrolls down the back wall; on “simple” he raises one finger and it rolls shut. On “It’s”, a giant phone running the “CoffeeGo” app pops up in the middle, showing a coffee cup to go, and he presents it with an open palm."
      - id: verse-1-2
        start: 20.26
        end: 23.7
        text: "No need to ask users— I'm certain I know!"
        marks: {"no": 20.26, "need": 20.6, "to": 20.84, "ask": 21.06, "users": 21.36, "im": 22.04, "certain": 22.22, "i": 22.72, "know": 22.96}
        visual: "Along the bottom of the picture, silhouetted heads in the audience raise hands holding question marks. He puts a finger to his lips, and the hands go down; on “certain” he taps his temple, smiling."
      - id: verse-1-3
        start: 23.72
        end: 27.1
        text: "One button! One latte! How sleek! How refined!"
        marks: {"one": 23.72, "button": 23.9, "one_2": 24.58, "latte": 24.72, "how": 25.32, "sleek": 25.5, "how_2": 25.94, "refined": 26.22}
        visual: "The phone shows one big green “ORDER” button, and on “latte” a latte with a heart in its foam. He points at the button; a gleam sweeps the screen on “sleek” and again on “refined”, with sparkles, and he blows a chef’s kiss."
      - id: verse-1-4
        start: 27.12
        end: 31.1
        text: "I'll save them a meeting— They'll thank me in time!"
        marks: {"ill": 27.12, "save": 27.4, "them": 27.86, "a": 28.08, "meeting": 28.26, "theyll": 28.88, "thank": 29.22, "me": 29.6, "in": 29.9, "time": 30.38}
        visual: "A card pops up above the phone: “Meeting with users: Monday 10:00. What do they need?”. On “meeting” he tears it in two and tosses the halves away over his shoulders. On “thank” a theatre sign lit with bulbs, “APPLAUSE”, glows, and he takes a deep bow; the house is silent, and a green cricket on the floor chirps three times."
  - id: pm
    title: "The Product Manager"
    delivery: sung
    voice: Product Manager
    narration: "The Product Manager glides in from the right, with your hero's face, a navy blazer over a coral tee, a lanyard and badge, grey trousers, white sneakers, and a clipboard, and stands with hands on hips. The Teammate freezes with a sheepish grin and a bead of sweat while they sing. The phone steps back behind a long counter, where twenty empty cups line up; the clock turns to ten. One cup slides out of the phone, and twenty straws fan into it. The Product Manager shows a card: Demo today, group order, 20 lattes for 10:00. Then the phone fans out into six small phones, red, orange, gold, green, blue, and violet, each with the same one button, and the Product Manager facepalms."
    lines:
      - id: pm-1
        start: 33.71
        end: 37.38
        text: "They need twenty coffees For meetings at ten!"
        marks: {"they": 33.71, "need": 34.24, "twenty": 34.8, "coffees": 35.18, "for": 35.72, "meetings": 35.98, "at": 36.44, "ten": 36.8}
        visual: "The Product Manager glides in from the right: your hero’s face, a navy blazer open over a coral tee, a lanyard and badge, grey trousers, white sneakers, and a clipboard in hand; they stand with hands on hips. The Teammate freezes with a sheepish grin, a bead of sweat on his brow. The phone shrinks back to stand behind a long counter, where twenty empty cups pop up in two rows as the Product Manager points at them. A sticker “Meeting at 10:00” appears, and the clock turns to ten."
      - id: pm-2
        start: 37.4
        end: 40.8
        text: "Your app sends one NOW— Shall they share it, then?"
        marks: {"your": 37.4, "app": 37.74, "sends": 38.1, "one": 38.28, "now": 38.56, "shall": 39.08, "they": 39.22, "share": 39.71, "it": 39.94, "then": 40.22}
        visual: "On “NOW” one coffee cup slides out of the phone onto the counter, and on “share” twenty straws fan into it. The Product Manager shrugs, palms up."
      - id: pm-3
        start: 40.82
        end: 44.36
        text: "I promised a demo Of what they could use."
        marks: {"i": 40.82, "promised": 41.22, "a": 41.74, "demo": 42.15, "of": 42.5, "what": 42.88, "they": 43.12, "could": 43.36, "use": 43.6}
        visual: "The Product Manager pats their chest, then presents a gold card above the phone: “Demo today. Group order: 20 lattes for 10:00”."
      - id: pm-4
        start: 44.38
        end: 48.12
        text: "You've built the wrong product— In six lovely hues!"
        marks: {"youve": 44.38, "built": 44.7, "the": 44.98, "wrong": 45.18, "product": 45.38, "in": 45.98, "six": 46.36, "lovely": 46.76, "hues": 47.28}
        visual: "The Product Manager points at the phone. On “six” it fans out into six small phones, red, orange, gold, green, blue, and violet, each with the same one ORDER button; the Teammate presents them proudly, and on “hues” the Product Manager facepalms."
  - id: verse-2
    title: "Verse 2: Reuse and lockfiles"
    delivery: sung
    voice: Teammate
    narration: "Act two, Reuse. A wall shelf of package boxes slides in: auth, charts, orders, emoji, dates, and payments, each with its version number. A sticker says Reuse!, and a red card says Build it anew: no, thanks. The orders package flies off the shelf into the phone, which now sends a group order. He flicks away a padlocked document, package-lock.json, and new versions of the orders package march in from the right on little legs, each getting a sticker: fixes! He holds a gold trophy high, beaming."
    lines:
      - id: verse-2-1
        start: 48.65
        end: 52.32
        text: "Group orders? Quite simple! I'll borrow the code!"
        marks: {"group": 48.65, "orders": 49.1, "quite": 49.7, "simple": 49.86, "ill": 50.6, "borrow": 50.82, "the": 51.22, "code": 51.46}
        visual: "A badge reads “Act II · Reuse”, and the Product Manager slides off to the right. On “simple” the Teammate raises one finger; on “borrow” a wall shelf of six package boxes slides in: “auth 1.2.0”, “charts 4.0.1”, “orders 2.4.1”, “emoji 9.0.0”, “dates 2.1.3”, and “payments 7.7.0”."
      - id: verse-2-2
        start: 52.34
        end: 55.42
        text: "Design with reuse! Why build it anew?"
        marks: {"design": 52.34, "with": 52.74, "reuse": 53.08, "why": 53.84, "build": 54.14, "it": 54.66, "anew": 54.82}
        visual: "A gold sticker “Reuse!” appears above the shelf, and he presents it; on “build” a red card says “Build it anew: No, thanks!”, and on “anew” he wags a finger."
      - id: verse-2-3
        start: 55.44
        end: 58.9
        text: "A package for orders Will know what to do!"
        marks: {"a": 55.44, "package": 55.8, "for": 56.38, "orders": 56.74, "will": 57.22, "know": 57.58, "what": 57.82, "to": 58.16, "do": 58.4}
        visual: "The phone returns at the right. The “orders 2.4.1” box flies off the shelf into it, and its screen changes to “Group order, 20 × latte, for 10:00, Sent ✓”; he points at it."
      - id: verse-2-4
        start: 58.92
        end: 62.38
        text: "No lockfile to fuss with! Let new versions in!"
        marks: {"no": 58.92, "lockfile": 59.22, "to": 59.84, "fuss": 60.06, "with": 60.4, "let": 60.72, "new": 60.9, "versions": 61.22, "in": 61.78}
