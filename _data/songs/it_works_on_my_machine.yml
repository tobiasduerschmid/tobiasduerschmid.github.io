  - id: outro
    title: "Outro"
    delivery: spoken
    voice: Teammate
    narration: "Outro. The music stops. His laptop now shows a red cross and the words Fatal error; he frowns at it, puzzled. He steps to the desk and reaches for the keyboard with a sly smile, and the Security Engineer slips off to the right. Then all six teammates sing together: the Security Engineer glides in from the left, between him and the desk, palm out, the five in the line-up hold out their palms too, and he jumps back with both hands up. On the closing chord the curtain falls, and the moral of the opera is posted on it: Ask your users what they need. Pin your dependency versions. Test behavior, not implementation. Hide decisions likely to change. Never force-push a shared branch. Keep secrets out of Git."
