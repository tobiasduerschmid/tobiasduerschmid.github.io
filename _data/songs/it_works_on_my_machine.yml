sections:
  - id: intro
    title: "Intro"
    delivery: sung
    voice: Teammate
    narration: "Audio-described version: before each section, the picture pauses while I describe it. The song is a comic opera on the stage of an opera house dressed as a software team's office: red velvet drapes, a gilded arch, footlights, and a conductor in the pit. On the back wall are an arched window onto the city, a wall clock beside it, and a board headed Build status with six lamps, all green with ticks. The curtain rises, and a follow spot picks up the Teammate, the tenor, gliding in from the left: a towering brown pompadour, a twirled moustache, a teal quarter-zip pullover over a white tee, studio headphones round his neck, jeans, and orange sneakers. At a desk on the right, your hero, or the default Bruin, types at a laptop. He raises a calming palm to them and pats his chest. A sprint calendar sheds its fourteen days down to: ship today. A toy ship flagged v1.0 by 3:00 is flown in from the rafters on two wires, the clock spins to three, and he salutes it. Each teammate who answers him later wears your hero's face, or the SE Gym's default hero's."
    lines:
      - id: intro-1
        start: 2.04
        end: 7.17
        text: "No need to worry! Just leave it to me!"
        marks: {"no": 2.04, "need": 2.4, "to": 3.02, "worry": 3.56, "just": 5.02, "leave": 5.8, "it": 6.2, "to_2": 6.52, "me": 6.76}
        visual: "The curtain rises on the opera-house office: an arched window onto a sunny city, a wall clock at nine, and a “Build status” board with six green lamps, each with a tick. A follow spot picks up the Teammate, the tenor, gliding in from the left: a towering brown pompadour with a curl, a twirled moustache, a teal quarter-zip pullover over a white tee with a rocket on the chest, studio headphones round his neck, jeans, and orange sneakers. At a desk on the right, your hero, or the default Bruin, types at a laptop. On “No need to worry” he raises a calming palm toward them; on “leave it to me” he pats his chest twice."
      - id: intro-2
        start: 8.22
        end: 14.43
        text: "I'll save us a whole sprint— We'll ship it by three!"
        marks: {"ill": 8.22, "save": 8.94, "us": 9.3, "a": 9.48, "whole": 9.52, "sprint": 9.7, "well": 11.62, "ship": 12.34, "it": 12.76, "by": 13.26, "three": 13.56}
        visual: "A wall calendar headed “Sprint” shows 14 days left; on “save” he points at it and its pages tear off one after another until it reads “Ship today!”. On “We’ll”, a toy galleon on wheels, its pennant tagged “v1.0 by 3:00”, is flown in from the rafters on two wires and swings to a stop on the floor; on “ship” the clock spins to three, and on “three” he salutes it, then flings both arms wide."
  - id: verse-1
    title: "Verse 1: Requirements"
    delivery: sung
    voice: Teammate
    narration: "Act one, Requirements. A long scroll of requirements unrolls behind the Teammate, and he snaps it shut with one raised finger. A giant phone running a ticket app, SeatSwap, shows a concert ticket, then one big Buy button, then the ticket locked to one name, gleaming. Silhouetted hands in the audience go up with question marks; he shushes them and taps his temple. A card for a meeting with users, What do they need?, appears, and he tears it in two and tosses the halves away. He bows to a lit Applause sign, and the house stays silent but for a cricket."
    lines:
      - id: verse-1-1
        start: 15.92
        end: 20.0
        text: "Requirements? Requirements? Quite simple! Tickets: buy and go!"
        marks: {"requirements": 15.92, "requirements_2": 16.7, "quite": 17.4, "simple": 17.76, "tickets": 18.62, "buy": 18.92, "and": 19.24, "go": 19.38}
        visual: "A badge reads “Act I · Requirements”. A long scroll titled “Requirements”, ruled with line after line, unrolls down the back wall; on “simple” he raises one finger and it rolls shut. On “Tickets”, a giant phone running a ticket app, “SeatSwap”, pops up in the middle, showing a concert ticket: “Jazz Night, Fri 8:00 PM, Row F, seat 12”, and he presents it with an open palm."
      - id: verse-1-2
        start: 20.02
        end: 23.18
        text: "No need to ask users— I'm certain I know!"
        marks: {"no": 20.02, "need": 20.18, "to": 20.42, "ask": 20.72, "users": 20.9, "im": 21.56, "certain": 21.97, "i": 22.28, "know": 22.52}
        visual: "Along the bottom of the picture, silhouetted heads in the audience raise hands holding question marks. He puts a finger to his lips, and the hands go down; on “certain” he taps his temple, smiling."
      - id: verse-1-3
        start: 23.2
        end: 25.96
        text: "One ticket! One name! How sleek! How refined!"
        marks: {"one": 23.2, "ticket": 23.36, "one_2": 23.92, "name": 24.18, "how": 24.72, "sleek": 25.0, "how_2": 25.38, "refined": 25.58}
        visual: "The phone shows one big green “BUY” button as he points at it, and on “name” the ticket again, now “Seat F12, Name: Alex, Locked to you”. A gleam sweeps the screen on “sleek” and again on “refined”, with sparkles, and he blows a chef’s kiss."
      - id: verse-1-4
        start: 25.98
        end: 30.25
        text: "I'll save them a meeting— They'll thank me in time!"
        marks: {"ill": 25.98, "save": 26.64, "them": 26.86, "a": 27.28, "meeting": 27.56, "theyll": 28.2, "thank": 28.61, "me": 28.92, "in": 29.22, "time": 29.64}
        visual: "A card pops up above the phone: “Meeting with users: Monday 10:00. What do they need?”. On “meeting” he tears it in two and tosses the halves away over his shoulders. On “thank” a theatre sign lit with bulbs, “APPLAUSE”, glows, and he takes a deep bow; the house is silent, and a green cricket on the floor chirps three times."
  - id: pm
    title: "The Product Manager"
    delivery: sung
    voice: Product Manager
    narration: "The Product Manager glides in from the right, with your hero's face, a navy blazer over a coral tee, a lanyard and badge, grey trousers, white sneakers, and a clipboard. The Teammate freezes with a sheepish grin and a bead of sweat while they sing. A gold card headed User story writes itself out, part by part: As a fan, I want to pass my ticket on, so a friend can use my seat when I can't come along. The phone answers: Transfer? Not allowed. One name only. The Product Manager shows a card: Demo today, send a ticket to a friend. Then the phone fans out into six small phones, red, orange, gold, green, blue, and violet, each with the same one button, and the Product Manager facepalms."
    lines:
      - id: pm-1
        start: 30.63
        end: 34.0
        text: "As a fan, I want To pass my ticket on,"
        marks: {"as": 30.63, "a": 31.08, "fan": 31.28, "i": 32.08, "want": 32.14, "to": 32.38, "pass": 32.52, "my": 32.78, "ticket": 32.94, "on": 33.3}
        visual: "The Product Manager glides in from the right: your hero’s face, a navy blazer open over a coral tee, a lanyard and badge, grey trousers, white sneakers, and a clipboard in hand. The Teammate freezes with a sheepish grin, a bead of sweat on his brow, and the phone steps back to the left. A gold card headed “User story” writes itself out as they sing: “As a fan,” then “I want to pass my ticket on,”."
      - id: pm-2
        start: 34.02
        end: 37.66
        text: "So a friend can use my seat When I can't come along!"
        marks: {"so": 34.02, "a": 34.38, "friend": 34.6, "can": 34.82, "use": 35.02, "my": 35.22, "seat": 35.4, "when": 35.74, "i": 35.94, "cant": 36.04, "come": 36.36, "along": 36.64}
        visual: "The card adds “so a friend can use my seat when I can’t come along.”, and the Product Manager presents it. On “can’t” the phone’s screen answers “Transfer? ✗ Not allowed. One name only”; the Product Manager points at it, then shrugs."
      - id: pm-3
        start: 37.68
        end: 41.0
        text: "I promised a demo Of what they could use."
        marks: {"i": 37.68, "promised": 37.9, "a": 38.62, "demo": 38.98, "of": 39.3, "what": 39.52, "they": 39.68, "could": 39.96, "use": 40.18}
        visual: "The user story goes. The Product Manager pats their chest, then presents a gold card above the phone: “Demo today: Send a ticket to a friend”."
      - id: pm-4
        start: 41.02
        end: 45.38
        text: "You've built the wrong product— In six lovely hues!"
        marks: {"youve": 41.02, "built": 41.42, "the": 41.78, "wrong": 42.0, "product": 42.2, "in": 42.78, "six": 43.32, "lovely": 43.9, "hues": 44.64}
        visual: "The Product Manager points at the phone. On “six” it fans out into six small phones, red, orange, gold, green, blue, and violet, each with the same one BUY button; the Teammate presents them proudly, and on “hues” the Product Manager facepalms."
  - id: verse-2
    title: "Verse 2: Reuse and lockfiles"
    delivery: sung
    voice: Teammate
    narration: "Act two, Reuse. A wall shelf of package boxes slides in: auth, charts, transfers, emoji, dates, and payments, each with its version number. A sticker says Reuse!, and a red card says Build it anew: no, thanks. The transfers package, version 1.4.2, flies off the shelf into the phone, which now sends a ticket to Sam. He flicks away a padlocked document, package-lock.json, and new versions of the transfers package, 1.5.0, 2.0.0, and 2.1.0, march in from the right on little legs, each getting a sticker: fixes! He holds a gold trophy high, beaming."
    lines:
      - id: verse-2-1
        start: 45.4
        end: 49.52
        text: "Transfers? Quite simple! I'll borrow the code!"
        marks: {"transfers": 45.4, "quite": 46.14, "simple": 46.44, "ill": 47.58, "borrow": 48.21, "the": 48.52, "code": 48.72}
        visual: "A badge reads “Act II · Reuse”, and the Product Manager slides off to the right. On “simple” the Teammate raises one finger; on “borrow” a wall shelf of six package boxes slides in: “auth 1.2.0”, “charts 4.0.1”, “transfers 1.4.2”, “emoji 9.0.0”, “dates 2.1.3”, and “payments 7.7.0”."
      - id: verse-2-2
        start: 50.2
        end: 53.51
        text: "Design with reuse! Why build it anew?"
        marks: {"design": 50.2, "with": 50.7, "reuse": 51.0, "why": 51.86, "build": 52.04, "it": 52.44, "anew": 52.68}
        visual: "A gold sticker “Reuse!” appears above the shelf, and he presents it; on “build” a red card says “Build it anew: No, thanks!”, and on “anew” he wags a finger."
      - id: verse-2-3
        start: 53.53
        end: 56.44
        text: "A package for transfers Will know what to do!"
        marks: {"a": 53.53, "package": 53.66, "for": 54.04, "transfers": 54.3, "will": 54.84, "know": 55.22, "what": 55.5, "to": 55.78, "do": 56.0}
        visual: "The phone returns at the right, showing the locked ticket. The “transfers 1.4.2” box flies off the shelf into it, and its screen changes to “Transfer, Seat F12, To: Sam, Sent ✓”; he points at it."
      - id: verse-2-4
        start: 56.46
        end: 59.68
