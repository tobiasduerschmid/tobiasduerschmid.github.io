    delivery: sung
    voice: Teammate
    narration: "Finale. All six teammates come back as a chorus line behind him, hands on hips; the UI Developer is still silver-haired. He lifts his laptop high on one palm once more, then sets it back on the desk. The Tiny fixes counter jumps from 1 to 96, and the six teammates facepalm, one after another. His laptop's lamps and the footlights turn green, confetti bursts, and he holds the last note, arms high, while the teammates despair and the board stays red."
