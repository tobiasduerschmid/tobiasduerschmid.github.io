# Storyboard for "Design It In", the security song on the SE Book page
# SEBook/systems/security.md (embedded with _includes/song-video.html).
#
# This file is the single source of truth for the song's words and timing:
#   - js/song-video/songs/design_it_in.js choreographs the live vector player
#     (/assets/song-player/design-it-in.html) against each line's `start` and
#     its `marks` (the times of the words the visuals hit), with the artwork
#     in js/song-video/western-kit.js (the plan board, posters, slates, and
#     the sheriff) and js/song-video/frontier.js (the town behind them);
#   - render.js writes the captions and the audio-described soundtrack from
#     `text`, `answer`, and `narration` (`node scripts/song-video/render.js
#     design_it_in`). This song has no MP4: it plays only in the live player;
#   - _includes/song-video.html prints every line with its `visual`
#     description as the on-page transcript (WCAG 1.2.1 / 1.2.3);
#   - each section's `narration` is spoken in the audio-described track,
#     where the picture holds at the start of the section while the narrator
#     describes what it shows (extended audio description, WCAG 1.2.5).
# Editing text or descriptions here updates the transcript and the player on
# the next Jekyll build, but the captions and described audio only after
# re-running render.js.
#
# Times are seconds into the Suno take "Design It In" (2) (about 123 BPM) of
# the lyric sheet in docs/design-it-in-song-lyrics.md. Word marks come from
# local Whisper word timestamps (mlx whisper-large-v3-turbo) aligned to the
# sheet (751 of 772 words matched; the rest are interpolated between their
# neighbours); unprompted clip passes confirmed the doubtful words. Quiz
# `answer_at` is the answer's first vocal onset (spectral flux in the vocal
# band of the mix, or Whisper's start where that is earlier), and `pause_at`
# sits in the quiet just before it. The stereo balance stays within 2 dB, so
# the soundtrack keeps both channels; it is normalized to -16 LUFS with one
# linear gain (true peak -3.6 dBFS) and stored as AAC at 192 kb/s. Where the
# sheet splits a sentence across short lines, the storyboard keeps it as one
# line. The take ends on the instrumental after "That's security, designed
# in."

