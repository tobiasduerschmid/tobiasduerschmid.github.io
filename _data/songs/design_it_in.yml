  - id: verse-2
    title: "Verse 2: Threat Model"
    delivery: sung
    narration: "Verse 2, the Threat Model. A wanted poster for an unknown attacker, with four fields: knowledge, actions, resources, and incentive. Knowledge fills in: has read your code. On the porch, a key hides under a flowerpot, and in the app's code a search finds a secret admin link; the masked outlaw lifts the flowerpot, pockets the key, and slips in through the door as it swings open. A sign: security through obscurity lasts till someone looks. Then three tested padlocks, AES, RSA, and TLS, with their public blueprints, and a brass key the sheriff keeps. A version number on an error page is blacked out, an extra layer but never alone. The stamp: Open Design Principle. Below it, the lock's blueprint hangs in public, and a see-through padlock shows every pin and spring; its shackle rattles but stays shut. Only the key is secret."
    lines:
      - id: v2-1
        start: 84.24
        end: 88.22
        text: "Who might be attacking, and what are they after?"
        marks: {"who": 84.24, "might": 84.8, "be": 85.18, "attacking": 85.52, "and": 86.54, "what": 86.8, "are": 87.0, "they": 87.14, "after": 87.44}
