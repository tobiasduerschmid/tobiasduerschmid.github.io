sections:
  - id: intro
    title: "Intro"
    delivery: spoken
    narration: "Audio-described version: before each section, the picture pauses while I describe it. The song plays in a frontier town at dusk, built of computing: saloons that are server racks with blinking lights, general stores stacked from software modules, a water tower whose tank is a database, a radio mast, and a router shack, all joined by one network cable, against a desert sky. Your hero is the town sheriff, in a white felt hat, a leather vest with a silver star, a bandana, boots, and a holstered revolver. A browser window shows your web app: the lecture's post, liked by 999 others, with one comment, Facts. A masked outlaw in a long coat tiptoes in from the desert, and a red attack arrow strikes the comment box. The outlaw turns to you: the tester you hired to break in first. Then a board of four blank posters slides in: the Security Plan."
    lines:
      - id: intro-1
        start: 8.9
        end: 10.98
        text: "So, you built a web app."
        marks: {"so": 8.9, "you": 9.46, "built": 9.98, "a": 10.22, "web": 10.34, "app": 10.56}
        visual: "The town at dusk. A browser window: your web app, the lecture's post by Tobias Dürschmid, “UCLA students are by far the best students. Go Bruins!”, liked by David Smallberg, Sandra Batista, and 999 others, with 5 comments, Like, Comment, and Share buttons, Paul Eggert's comment “Facts”, and a box: “Write a comment …”. Your hero stands by as the town sheriff, in a white felt hat, a leather vest with a silver star, a bandana, boots, and a holstered revolver, and tips the hat."
      - id: intro-2
        start: 12.34
        end: 14.6
        text: "Somebody out there might try to break in."
        marks: {"somebody": 12.34, "out": 12.9, "there": 13.14, "might": 13.36, "try": 13.58, "to": 13.84, "break": 13.98, "in": 14.2}
        visual: "A masked outlaw in a long dark coat tiptoes in from the desert at the left and peeks at the app. On “break”, the outlaw points, and a red attack arrow strikes the comment box. The sheriff glances over."
      - id: intro-3
        start: 16.08
        end: 18.22
        text: "You hired me to break in first."
        marks: {"you": 16.08, "hired": 16.64, "me": 16.94, "to": 17.1, "break": 17.22, "in": 17.46, "first": 17.64}
        visual: "The outlaw turns to you: the tester you hired to break in first."
      - id: intro-4
        start: 19.52
        end: 23.62
        text: "Let's design security in, before they do."
        marks: {"lets": 19.52, "design": 20.08, "security": 20.42, "in": 21.0, "before": 22.54, "they": 23.1, "do": 23.28}
        visual: "The outlaw tiptoes away, and the Security Plan board slides in: four blank posters nailed to a wooden frame, numbered 1 to 4. On “design” the sheriff points at it; a plank sign reads “Design security in”."
  - id: verse-1
    title: "Verse 1: Security Model"
    delivery: sung
    narration: "Verse 1, the Security Model. Padlocks slide aside and a strongbox opens. Out come a password, a post, a photo, and a lantern marked site up. Cards pin beside them: Confidentiality, read by authorized users only; Integrity, changed by authorized users only; Availability, there when it's needed. They stand on a gold triangle, the CIA triad. Red attack arrows strike each corner while the sheriff's hand goes to the holstered revolver, with real cases: Equifax's stolen data, a post overwritten, and a hospital's files locked for ransom."
    lines:
      - id: v1-1
        start: 27.04
        end: 30.76
        text: "Before you choose the locks, ask what's in the box:"
        marks: {"before": 27.04, "you": 27.6, "choose": 27.82, "the": 28.12, "locks": 28.28, "ask": 28.72, "whats": 29.48, "in": 29.86, "the_2": 30.06, "box": 30.2}
        visual: "A plank sign at the top: “1 · Security Model”. Three padlocks on a shelf slide aside on “locks”; on “box”, a strongbox in the middle opens."
      - id: v1-2
        start: 30.88
        end: 32.64
        text: "What are you defending?"
        marks: {"what": 30.88, "are": 31.4, "you": 31.56, "defending": 31.8}
        visual: "The sign adds the question: “What are you defending?” The open strongbox glows."
      - id: v1-3
        start: 32.86
        end: 38.38
        text: "The data users are sending, passwords, posts, and photos, and the site that must stay up."
        marks: {"the": 32.86, "data": 32.94, "users": 33.4, "are": 33.78, "sending": 34.02, "passwords": 34.9, "posts": 35.64, "and": 35.88, "photos": 36.0, "and_2": 36.42, "the_2": 36.72, "site": 36.84, "that": 37.18, "must": 37.38, "stay": 37.68, "up": 37.98}
        visual: "Out of the strongbox come the assets, one per word: a password field (••••••) on “passwords”, a post on “posts”, a photo on “photos”, and a lantern labelled “site: up” on “site”."
      - id: v1-4
        start: 39.18
        end: 42.26
        text: "Confidentiality means only those allowed may read;"
        marks: {"confidentiality": 39.18, "means": 39.78, "only": 40.3, "those": 40.68, "allowed": 40.98, "may": 41.48, "read": 41.72}
        visual: "A Confidentiality card with an eye pins beside the password: “read: authorized users only”."
      - id: v1-5
        start: 43.04
        end: 46.16
        text: "Integrity means only those allowed may change;"
        marks: {"integrity": 43.04, "means": 43.64, "only": 44.18, "those": 44.52, "allowed": 44.84, "may": 45.26, "change": 45.5}
        visual: "An Integrity card with a quill pins beside the post: “change: authorized users only”."
      - id: v1-6
        start: 46.8
        end: 49.96
        text: "Availability means it's there when it is needed."
        marks: {"availability": 46.8, "means": 47.4, "its": 48.0, "there": 48.28, "when": 48.66, "it": 49.02, "is": 49.24, "needed": 49.34}
        visual: "An Availability card with a clock pins beside the lantern: “there when it’s needed”."
      - id: v1-7
        start: 50.06
        end: 52.34
        text: "That's the CIA triad."
        marks: {"thats": 50.06, "the": 50.22, "cia": 50.34, "triad": 51.28}
        visual: "The three cards slide into a triangle, joined by gold lines and labelled “CIA triad”."
      - id: v1-8
        start: 52.22
        end: 57.84
        text: "Attackers can hit all three: they might read it, change it, or lock you out for ransom."
        marks: {"attackers": 52.22, "can": 52.66, "hit": 52.82, "all": 52.98, "three": 53.22, "they": 53.86, "might": 53.92, "read": 54.2, "it": 54.52, "change": 55.0, "it_2": 55.24, "or": 55.58, "lock": 56.12, "you": 56.42, "out": 56.58, "for": 56.78, "ransom": 57.08}
        visual: "The masked outlaw tiptoes in at the left and points: three red attack arrows strike the triangle's corners, and the sheriff's hand hovers over the holstered revolver. On “read”, a tag at Confidentiality: “Equifax 2017: data of 147 million people taken”. On “change”, a tag at Integrity: “Post changed: “USC IS BETTER!!!””. On “lock”, a tag at Availability: “Hospital 2016: files locked for ransom”."
  - id: chorus-1
    title: "Chorus"
    delivery: sung
    narration: "The chorus: the Security Plan board under a plank sign, Design it in before they break in. Four posters light one by one, each with a small picture: Security Model, what are you defending, with a treasure chest; Threat Model, who might be attacking, with a wanted poster; Attack Surface, which parts are exposed, with an arrow at a building's door; Protection Mechanisms, how do you stop them, with a padlock. The CIA triangle is pinned under the first. The sheriff points at each."
    lines:
      - id: c1-1
        start: 59.84
        end: 63.38
        text: "Design it in before they break in:"
        marks: {"design": 59.84, "it": 60.64, "in": 60.96, "before": 61.22, "they": 62.08, "break": 62.34, "in_2": 62.94}
        visual: "The Security Plan board fills the frame, under a plank sign: “Design it in before they break in”. Each poster has a small picture: a treasure chest, a wanted poster, a building with an arrow at its door, and a padlock. The CIA triangle is pinned under poster 1. The sheriff stands beside the board."
