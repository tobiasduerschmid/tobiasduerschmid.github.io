# Storyboard for "Unbox the Stack", the networking song on the SE Book page
# SEBook/tools/networking.md (embedded with _includes/song-video.html).
#
# This file is the single source of truth for the song's words and timing:
#   - js/song-video/songs/unbox_the_stack.js choreographs the live vector
#     player (/assets/song-player/unbox-the-stack.html) against each line's
#     `start` and its `marks` (the times of the words the visuals hit);
#   - render.js writes the captions and the audio-described soundtrack from
#     `text` and `narration` (`node scripts/song-video/render.js
#     unbox_the_stack`). This song has no MP4: it plays only in the live
#     player, so render.js skips the frame capture;
#   - _includes/song-video.html prints every line with its `visual`
#     description as the on-page transcript (WCAG 1.2.1 / 1.2.3);
#   - each section's `narration` is spoken in the audio-described track,
#     where the picture holds at the start of the section while the narrator
#     describes what it shows (extended audio description, WCAG 1.2.5).
# Editing text or descriptions here updates the transcript and the player on
# the next Jekyll build, but the captions and described audio only after
# re-running render.js.
#
# Times refer to the replacement "The TCP_IP Stack" recording, with the
# repeated chorus at the end removed and a short fade on the music tail.
# Audio edit: keep 0-312 s, fade 310.5-312 s, normalize to -16 LUFS.
# Line boundaries and word marks were aligned to the performed lyrics with
# local Whisper word alignment; the embedded lyric track is inaccurate in
# the quiz. Captions retain proper notation (TCP, SYN, IP addresses).

title: "Unbox the Stack: a song about networking"   # the player's accessible name
credit: Lyrics written for this chapter; music and vocals generated with Suno.
theme: night-sky   # stage look: the starry sky of js/song-video/night-sky.js
extras:   # the song's own art and styles, loaded before its choreography
  styles:
    - /css/song-video-night-sky.css
    - /css/song-video-net-kit.css
  scripts:
    - /js/song-video/night-sky.js
    - /js/song-video/art/common.js
    - /js/song-video/art/castle.js
    - /js/song-video/art/client.js
    - /js/song-video/art/island.js
    - /js/song-video/art/imp.js
    - /js/song-video/art/map.js
    - /js/song-video/net-kit.js
player: /assets/song-player/unbox-the-stack.html
captions: /assets/audio/unbox-the-stack.vtt
described_captions: /assets/audio/unbox-the-stack-described.vtt
soundtrack: assets/audio/unbox-the-stack.m4a   # repo path, played by the live player
described_soundtrack: assets/audio/unbox-the-stack-described.m4a
described_timeline: /assets/audio/unbox-the-stack-described.json
narrator:
  voice: Samantha   # macOS `say` voice for the audio-described track
  rate: 205         # words per minute
  pronounce:        # how the narrator says notation the captions keep as written
    SYN-ACK: sin ack
    SYN: sin
    FIN-ACK: fin ack
    DMs: D Ms
    ucla.edu: U C L A dot E D U
    IMPs: imps
    IPv6: I P version 6
    TLS: T L S
width: 1920
height: 1080
fps: 30
duration: 312.0
beats:
  bpm: 86.0   # fitted to the replacement recording's beat grid
  first: 0.24

sections:
  - id: intro
    title: "Intro"
    delivery: spoken
    narration: "Audio-described version: before each section, the picture pauses while I describe it. The intro: a student types ucla.edu into a browser window floating in a starry sky, and a beam reaches a castle on a floating rock, the server. The sky fills with machines, and a gold ring picks out the castle. Then four colored layers, Application, Transport, Internet, and Link, each with its job, and the title: Unbox the stack."
    lines:
      - id: intro-1
        start: 1.3
        end: 4.68
        text: "You type ucla.edu and hit enter."
        marks: {type: 1.42, ucla: 1.68, edu: 3.22, enter: 4.38}
        visual: "An ornate browser window floats in a starry sky with the student at a laptop in front of it (sticker: You). The address bar types ucla.edu; on “enter” a gold light beam shoots to a castle on a floating rock, the server, and a packet of light rides there and back."
      - id: intro-2
        start: 5.56
        end: 9.26
        text: "Half a second later: the page. How'd it find the right machine?"
        marks: {half: 5.56, page: 7.34, find: 8.38, right: 8.7, machine: 8.86}
        visual: "A “½ second” tag pops up and the page loads in the browser. Then dozens of tiny machines appear across the sky, a gold ring circles the castle, and a sticker asks “Which one?”."
      - id: intro-3
        start: 10.78
        end: 15.64
        text: "Four layers. Each solves one problem, so the others don't have to."
        marks: {four: 10.78, layers: 11.3, each: 12.02, one: 13.3, problem: 13.56, others: 14.84}
        visual: "A stack of four slabs: Application (gold), Transport (cyan), Internet (violet), Link (green). Each gets its job: what the apps say, which app gets it, which machine, the next hop. Sticker: One job each."
      - id: intro-4
        start: 16.18
        end: 17.28
        text: "Let's unbox it."
        marks: {unbox: 16.7}
        visual: "A box icon pops up and the title slams in: Unbox the stack. Subtitle: How a request finds its server."
  - id: verse-1
    title: "Verse 1: Wrap it on the way down"
    delivery: sung
    narration: "Verse 1: an HTTP GET request flies out of the browser. A DNS panel turns the name ucla.edu into the number 3.33.167.235. Then the request is wrapped in one box per layer: a TCP box with ports, an IP box from the laptop’s address to the server’s, and a Wi-Fi frame. The boxed packet travels across router islands, getting a new frame at every hop, and finally the headers and payload are pointed out, and a big page splits into three packets."
    lines:
      - id: verse-1-1
        start: 18.12
        end: 20.64
        text: "You hit enter. Your browser writes a GET:"
        marks: {enter: 18.9, browser: 19.68, get: 20.46}
        visual: "The four-layer stack stands on the left and the browser on the right. On “enter”, a gold HTTP box flies out of the browser into the middle of the screen: GET / HTTP/1.1, Host: ucla.edu. The Application slab lights up."
      - id: verse-1-2
        start: 21.16
        end: 23.46
        text: "HTTP, “Send me the page.” That’s the request."
        marks: {http: 21.16, send: 22.06, page: 22.48, request: 23.04}
        visual: "Sticker: HTTP request. A chat bubble says “Send me the page.”"
      - id: verse-1-3
        start: 23.6
        end: 26.24
        text: "Routers can’t use names, so DNS gets the call:"
        marks: {routers: 23.6, names: 24.36, dns: 24.94, call: 25.96}
        visual: "A router icon asks “ucla.edu ?” and gets a red cross; sticker: Routers need numbers. A panel opens: DNS, the contacts app."
      - id: verse-1-4
        start: 26.36
        end: 29.02
        text: "name in, IP out, the contacts app for all."
        marks: {name: 26.36, ip: 26.72, out: 27.14, contacts: 27.74}
        visual: "In the DNS panel, ucla.edu → 3.33.167.235 fills in left to right. Sticker: name in, IP out."
      - id: verse-1-5
        start: 29.02
        end: 31.9
        text: "Down to Transport: TCP adds a header,"
        marks: {down: 29.02, transport: 29.46, tcp: 30.16, header: 31.58}
        visual: "The Transport slab lights up and a cyan TCP box closes around the HTTP box, its header tab reading port 52814 → port 80. Sticker: header."
      - id: verse-1-6
        start: 32.3
        end: 34.7
        text: "port to port, so the right app’s gonna get it."
        marks: {port: 32.3, port_2: 32.62, right: 33.32, app: 33.58}
        visual: "The TCP header tab bumps on each “port”. Sticker: Ports pick the app."
      - id: verse-1-7
        start: 34.7
        end: 37.24
        text: "Down to Internet: IP wraps it one more time,"
        marks: {down: 34.7, internet: 35.06, ip: 35.76, wraps: 36.06}
        visual: "The Internet slab lights up; the IP address flies down from the DNS panel and a violet IP box closes around the TCP box: 192.168.1.42 → 3.33.167.235."
      - id: verse-1-8
        start: 37.24
        end: 39.98
        text: "“from my IP to yours,” machine to machine, worldwide."
        marks: {from: 37.24, yours: 38.18, machine: 38.6, machine_2: 39.12, worldwide: 39.64}
        visual: "Stickers: machine → machine, and worldwide."
      - id: verse-1-9
        start: 39.98
        end: 43.06
        text: "Down to Link: a Wi-Fi frame, one hop to your router."
        marks: {down: 39.98, link: 40.64, wi: 41.0, frame: 41.32, hop: 41.92, router: 42.74}
        visual: "The Link slab lights up and a green Wi-Fi frame closes around everything: Wi-Fi → home router. Sticker: one hop. The scene switches to the journey: the browser on the left, the home router and another router on floating islands, the castle on the right, joined by green beams; the boxed packet rides to the home router."
      - id: verse-1-10
        start: 43.06
        end: 45.8
        text: "Each router swaps the frame and sends it further."
        marks: {each: 43.06, swaps: 43.68, frame: 44.22, sends: 44.78, further: 45.4}
        visual: "At each router the green frame comes off and a new one goes on (“new frame: → router”, then “→ server”) before the packet rides on to the castle. Sticker: Frame swapped every hop."
      - id: verse-1-11
        start: 45.8
        end: 48.58
        text: "Each header’s a label for its layer. The payload’s the stuff."
        marks: {header: 46.08, label: 46.6, layer: 47.26, payload: 47.78, stuff: 48.32}
        visual: "The nested packet fills the screen. Its header tabs light up (sticker: Headers: labels), then the HTTP request inside (sticker: Payload: the stuff)."
      - id: verse-1-12
        start: 48.58
        end: 52.04
        text: "Routers only need the outer labels. Too big? Split it up."
        marks: {routers: 48.58, outer: 49.7, labels: 49.98, big: 50.6, split: 51.28}
        visual: "A dashed violet frame covers only the outer two labels: Router reads Link + IP; the inner boxes dim. Then a page too big for one packet splits into three pieces, 1/3, 2/3, and 3/3."
  - id: chorus-1
    title: "Chorus"
    delivery: sung
    narration: "The chorus shows three stacks: your laptop, a router with only the Internet and Link layers, and the server. Each layer lights up as it is sung, with arcs showing who it talks to: one hop, machine to machine, app to app, and the language the apps speak. Then a packet rides down one stack gaining a box per layer, and up the other losing them."
    lines:
      - id: chorus-1-1
        start: 52.04
        end: 56.64
        text: "Link Layer: one hop on the local network. Ethernet, Wi-Fi."
        marks: {link: 52.04, hop: 53.08, local: 53.88, ethernet: 54.58, wi: 55.2}
        visual: "Three stacks of layer slabs: your laptop (four layers), a router (Internet and Link only), and the server (four layers). The Link slabs light up green, and one-hop arcs join laptop to router and router to server. Title: Link Layer, one hop on the local network; chips Ethernet and Wi-Fi."
      - id: chorus-1-2
        start: 56.64
        end: 60.58
        text: "Internet Layer: machine to machine, across networks. IP."
        marks: {internet: 56.64, machine: 57.8, machine_2: 58.56, across: 58.98, ip: 60.04}
        visual: "The Internet slabs light up violet and a long arc joins laptop to server, labeled “machine → machine”. Title: Internet Layer, machine to machine, across networks; chip IP."
      - id: chorus-1-3
        start: 60.58
        end: 65.68
        text: "Transport Layer: app to app, reliable or fast. TCP or UDP."
        marks: {transport: 60.58, app: 61.98, app_2: 62.28, reliable: 62.88, fast: 63.66, tcp: 63.96, udp: 64.98}
        visual: "The Transport slabs on laptop and server light up cyan, joined by an arc labeled “app ↔ app”. Title: Transport Layer, app to app, reliable or fast; chips TCP and UDP."
      - id: chorus-1-4
        start: 65.82
        end: 68.32
        text: "Application Layer: the language the apps speak. HTTP."
        marks: {application: 65.82, language: 66.8, speak: 67.4, http: 67.86}
        visual: "The Application slabs light up gold, joined by an arc labeled GET / HTTP/1.1. Title: Application Layer, the language the apps speak; chip HTTP."
      - id: chorus-1-5
        start: 68.32
        end: 71.16
        text: "Wrap it on the way down, unbox it on the way up."
        marks: {wrap: 68.32, down: 69.44, unbox: 69.84, up: 70.84}
        visual: "Title: Wrap ↓ · Unbox ↑. A packet rides down the laptop’s stack gaining one colored box per layer, crosses through the router, and rides up the server’s stack losing a box per layer."
      - id: chorus-1-6
        start: 71.16
        end: 74.38
        text: "Each layer only uses the one below. That’s the stack!"
        marks: {each: 71.16, uses: 71.96, below: 72.82, stack: 74.06}
        visual: "Small arrows point from each layer to the one below, under the caption “Each layer uses only the one below”. Then “That’s the stack!” slams in and every slab lights up."
  - id: verse-2
    title: "Verse 2: TCP plays it safe"
    delivery: sung
    narration: "Verse 2: TCP, with a shield, and UDP, with a lightning bolt, split at a fork. A sequence diagram shows the handshake: SYN, SYN-ACK, ACK, with starting sequence numbers. Numbered packets reach a receive buffer out of order and are sorted by number; ACKs travel back, and lost or broken packets are sent again when a timer runs out. FIN, FIN-ACK, ACK close the connection, and a receipt lists the price of safe: a round trip of hellos, extra ACKs, and a lost piece blocking the rest."
    lines:
      - id: verse-2-1
        start: 74.48
        end: 77.22
        text: "Transport’s got two vibes. Your app picks the path:"
        marks: {transport: 74.48, two: 75.34, app: 76.08, picks: 76.32, path: 76.92}
        visual: "Title: Transport has two vibes. A “Your app” tag sits at a fork; a cyan road leads down-left and a pink road down-right."
      - id: verse-2-2
        start: 77.34
        end: 80.0
        text: "TCP plays it safe. UDP plays it fast."
        marks: {tcp: 77.34, safe: 78.32, udp: 78.74, fast: 79.74}
        visual: "TCP slams in on the left with a shield (sticker: plays it safe; code: net.connect()), one packet riding the cyan road inside an escort ring. UDP slams in on the right with a lightning bolt (sticker: plays it fast; code: dgram.createSocket('udp4')), three packets darting down the pink road."
      - id: verse-2-3
        start: 80.0
        end: 82.6
        text: "TCP shakes hands first, three steps in a row:"
        marks: {tcp: 80.0, shakes: 80.48, first: 81.08, three: 81.52, row: 82.36}
        visual: "A sequence diagram: the student at a laptop on the left with the “Your laptop” lane, the castle on the right with the “Server” lane. Sticker: Handshake first; step numbers 1, 2, 3 appear on the lanes."
      - id: verse-2-4
        start: 82.6
        end: 85.4
        text: "SYN: “you up?” SYN-ACK: “yeah, you?” ACK: “bet.” Let’s go."
        marks: {syn: 82.6, up: 83.18, syn_2: 83.62, yeah: 83.96, ack_2: 84.48, bet: 84.7, go: 85.16}
        visual: "Three arrows cross between the lanes: SYN (bubble: “you up?”), SYN-ACK back (bubble: “yeah, you?”), ACK (bubble: “bet.”). Sticker: Connected!"
      - id: verse-2-5
        start: 85.4
        end: 88.12
        text: "SYN means “sync”: both sides share where their count begins,"
        marks: {syn: 85.4, sync: 85.88, both: 86.36, share: 86.78, count: 87.38, begins: 87.62}
        visual: "Sticker: SYN = synchronize. Under the arrows the numbers appear: seq 100 on SYN, seq 300 · ack 101 on SYN-ACK, ack 301 on ACK."
      - id: verse-2-6
        start: 88.12
        end: 91.0
        text: "so every byte is numbered and sorted at the end."
        marks: {every: 88.44, byte: 88.72, numbered: 89.14, sorted: 89.68, end: 90.68}
        visual: "A receive buffer panel stands in front of the castle with places for seq 101, 201, and 301. Three TCP packets (bytes 101–200, 201–300, 301–400) leave the laptop at different speeds, 301 arriving first, and each lands in the place for its number. Sticker: Sorted by number. Then all three go to the app in order."
      - id: verse-2-7
        start: 91.0
        end: 93.68
        text: "What lands gets ACKed: “got it,” like a read receipt."
        marks: {lands: 91.22, acked: 91.78, got: 92.26, read: 93.02, receipt: 93.22}
        visual: "A green “ACK 401” packet travels back along the lower track to the laptop: got it all up to 400. A tag at the laptop reads Read ✓✓."
      - id: verse-2-8
        start: 93.68
        end: 96.6
        text: "No ACK in time? Left on read. Resend that piece."
        marks: {"no": 93.68, ack: 94.02, time: 94.38, left: 94.78, read: 95.08, resend: 95.58, piece: 96.2}
        visual: "Packet seq 401 leaves and is crossed out halfway: lost. A timer ring at the laptop drains to red (waiting for ACK); sticker: Left on read. A copy with a resend arrow leaves and lands in the buffer, and ACK 501 comes back."
      - id: verse-2-9
        start: 96.6
        end: 99.44
        text: "Broken checksum? Tossed, no ACK, so it’s sent once more."
        marks: {broken: 96.6, checksum: 97.12, tossed: 97.6, ack: 98.02, sent: 98.62, more: 99.0}
        visual: "Packet seq 501 lands with a red crack (checksum ✗) and drops into the bin. The laptop’s timer runs out: no ACK. A resent copy lands safely."
      - id: verse-2-10
        start: 99.44
        end: 102.32
        text: "Done? FIN, FIN-ACK, ACK: free the memory, close the door."
        marks: {done: 99.44, fin: 99.98, fin_2: 100.32, ack_2: 100.72, free: 100.9, memory: 101.1, close: 101.54, door: 102.02}
        visual: "Back to the lanes: FIN, FIN-ACK, ACK. The “connection memory” tags on both sides turn into “freed”, and the castle’s doors swing shut (door closed). Sticker: Done? Say bye."
      - id: verse-2-11
        start: 102.32
        end: 104.9
        text: "But safe has a price. Here’s what you pay:"
        marks: {safe: 102.68, price: 103.44, pay: 104.5}
        visual: "Title: Safe has a price. A paper receipt titled Receipt · TCP slides up on the left, with a time axis on the right."
      - id: verse-2-12
        start: 104.9
        end: 107.84
        text: "a round trip of hellos before your data’s on its way,"
        marks: {round: 105.24, trip: 105.44, hellos: 105.92, data: 106.9, way: 107.62}
        visual: "Receipt line: 1 round trip of hellos, before any data moves. On the time axis: SYN →, ← SYN-ACK under a bracket “1 round trip, no data yet”, then ACK + data →."
      - id: verse-2-13
        start: 107.84
        end: 109.84
        text: "extra ACKs along the way,"
        marks: {extra: 107.84, acks: 108.28, way: 109.56}
        visual: "Receipt line: Extra ACKs, more packets on the wire. Below, data → and ← ACK alternate along the axis."
      - id: verse-2-14
        start: 109.84
        end: 113.42
        text: "and one lost piece holds up the line. The rest has to wait."
        marks: {lost: 110.3, piece: 110.66, holds: 110.98, line: 111.78, rest: 112.46, wait: 113.18}
        visual: "Receipt line: One lost piece blocks the pieces behind it. Piece 1 is missing (dashed red), pieces 2, 3, 4 wait under hourglasses, and the app shows “App: waiting…”: head-of-line blocking. The receipt’s total: Time."
  - id: verse-3
    title: "Verse 3: UDP plays it fast"
    delivery: sung
    narration: "Verse 3, in pink: UDP skips the handshake, and its header has two rows to TCP’s five. Unnumbered packets arrive out of order, with no ACKs and no resend; broken or lost ones are gone. Two game maps compare sending your position with sending your moves when an update is lost. A live call shows a resent word arriving too late, and a DNS lookup gets one answer, with the app retrying on its own."
    lines:
      - id: verse-3-1
        start: 113.42
        end: 116.24
        text: "UDP skips the hello. The first packet’s data."
        marks: {udp: 113.42, skips: 114.0, hello: 114.6, first: 115.28, data: 116.0}
        visual: "The same delivery scene in pink, with a Server inbox. The handshake (SYN, SYN-ACK, ACK) appears dashed and is struck through; sticker: No hello. The very first packet, “data!”, flies straight into the inbox; sticker: 1st packet = data."
      - id: verse-3-2
        start: 116.24
        end: 119.04
        text: "Tiny header, no connection, nothing to remember later."
        marks: {tiny: 116.24, header: 116.62, connection: 117.18, nothing: 117.8, remember: 118.22}
        visual: "Two header diagrams: TCP’s five rows (ports, sequence number, acknowledgment number, flags and window, checksum and urgent pointer) above UDP’s two rows (ports, length and checksum); sticker: tiny! Tags: no connection, and the server “remembers nothing”."
      - id: verse-3-3
        start: 119.04
        end: 121.74
        text: "No numbers, so no order. No ACKs, so no resend."
        marks: {numbers: 119.28, order: 120.02, acks: 120.52, resend: 121.18}
        visual: "Three UDP packets without numbers carry “see”, “you”, “soon”; they arrive as “soon”, “you”, “see”, and the server asks “soon you see?”. Stickers: no numbers, no order. A grey return track gets the tags no ACKs and no resend."
      - id: verse-3-4
        start: 121.74
        end: 124.46
        text: "Broken checksum? Tossed. Lost? Gone. That’s the end."
        marks: {broken: 121.74, tossed: 122.68, lost: 123.2, gone: 123.28, end: 124.16}
        visual: "A packet “brb” arrives cracked (checksum ✗) and drops into the bin; a packet “gg” vanishes halfway. Stamp: Gone. Sticker: No retry. The end."
      - id: verse-3-5
        start: 124.46
        end: 127.24
        text: "So if losing one would hurt, your app needs a plan:"
        marks: {losing: 124.92, hurt: 125.76, app: 126.3, plan: 127.0}
        visual: "Two game maps side by side, a pink player token on each. Stickers: Lose one?, then Plan for it: send where you are."
      - id: verse-3-6
        start: 127.24
        end: 130.06
        text: "send “I’m at x, y,” not “I moved.” The next one shows where you stand."
        marks: {send: 127.24, x: 127.9, moved: 128.64, next: 128.92, shows: 129.24, stand: 129.76}
        visual: "Left map, titled send “I’m at (x, y)”: updates at (2, 2), at (3, 2) lost, at (4, 2), and the token jumps to (4, 2): back in sync. Right map, titled send “I moved →”: moved →, moved → lost, moved →, and the token stops one square short of a dashed green ghost: off by one, forever."
      - id: verse-3-7
        start: 130.06
        end: 132.94
        text: "Why use it? On a live call, late is as bad as lost:"
        marks: {why: 130.06, live: 131.38, call: 131.58, late: 131.98, lost: 132.74}
        visual: "A live call card (You, a pink waveform, Friend, LIVE 0:42) above a voice track: can, you, …, me, now? A “now playing” marker sweeps along; the word “hear” is missing and the waveform goes silent (lost). Title: Late = lost."
      - id: verse-3-8
        start: 132.94
        end: 135.8
        text: "resend a voice packet, and it lands after the word is gone."
        marks: {resend: 132.94, voice: 133.44, lands: 134.48, after: 134.7, word: 135.14, gone: 135.52}
        visual: "A resent “hear” arrives at its spot after the marker has passed. It greys out; stamp: Too late; tag: that word already played."
      - id: verse-3-9
        start: 135.8
        end: 138.38
        text: "DNS? One tiny question, one tiny reply."
        marks: {dns: 135.8, question: 136.88, reply: 137.88}
        visual: "Lanes again, laptop to DNS server, with the contacts entry ucla.edu → 3.33.167.235. Sticker: DNS rides UDP. One arrow asks “ucla.edu ?”, one arrow answers 3.33.167.235."
      - id: verse-3-10
        start: 138.38
        end: 141.8
        text: "A handshake would double the wait. Lost? The app tries one more time."
        marks: {handshake: 138.68, double: 139.2, wait: 139.68, lost: 140.02, tries: 140.7, time: 141.48}
        visual: "A panel compares time to an answer: UDP is one bar (ask → answer), TCP two (hello, then ask); sticker: 2× the wait. A second question is crossed out, the laptop’s timer runs out (no reply), the app asks again and gets the answer. Sticker: The app tries again."
  - id: hook
    title: "Hook: Which one?"
    delivery: chant
    narration: "The hook: two glowing gates, TCP and UDP, each with its rule. Needs and use cases fly into the gate they belong to: every byte in order, DMs, logins, files, and web pages into TCP; old news, calls, game moves, and quick lookups into UDP; a buffered video into TCP and a live call into UDP."
    lines:
      - id: hook-1
        start: 141.8
