  - id: verse-4
    title: "Verse 4: Addresses and ports"
    delivery: sung
    narration: "Verse 4: the laptop’s address, 192.168.1.42, splits into a network part, the city, and a host part, the street; each of its four numbers runs from 0 to 255. A counter passes four billion, stamped not enough, and an IPv6 address appears. A loop leaves the student’s laptop and comes straight back: localhost. The castle’s windows are apps with port numbers, and packets climb to the window their port names. Last, a full router drops a packet, and TCP sends it again."
    lines:
      - id: verse-4-1
        start: 181.96
        end: 184.4
        text: "Internet Layer: every machine gets an IP address,"
        marks: {internet: 181.96, every: 182.7, machine: 182.8, ip: 183.72, address: 183.98}
        visual: "Tag: Your laptop’s IP address. The address slams in: 192.168.1.42/24."
      - id: verse-4-2
        start: 184.6
        end: 187.44
        text: "network part, then host part: city, then street. No guessing."
        marks: {network: 184.6, host: 185.4, city: 186.06, street: 186.4, guessing: 187.04}
        visual: "192.168.1 turns violet under a bracket “network part” (city: your home network); 42 turns gold under “host part” (street: this laptop). Sticker: No guessing."
      - id: verse-4-3
        start: 187.84
        end: 190.08
        text: "IPv4: four numbers, zero to 255."
        marks: {ipv4: 187.84, four: 188.44, numbers: 188.54, zero: 189.0, 255: 189.24}
        visual: "Tag: IPv4: four numbers, 0 to 255 each. Each number bumps and gets a “0–255” label."
      - id: verse-4-4
        start: 190.32
        end: 193.28
        text: "Four billion addresses? Not enough. So IPv6 arrived."
        marks: {four: 190.32, billion: 190.46, enough: 191.54, ipv6: 192.04, arrived: 192.86}
        visual: "A counter runs up to 4,294,967,296 addresses; stamp: Not enough! Tag: 8 billion people, many devices each. Then IPv6 · 2001:db8::42 and the sticker way more room."
      - id: verse-4-5
        start: 193.48
        end: 195.76
        text: "127.0.0.1?"
        marks: {127: 193.48, 1: 195.1}
        visual: "Title: 127.0.0.1? The student sits at a laptop under an address bar reading localhost:3000."
      - id: verse-4-6
        start: 195.9
        end: 198.36
        text: "There’s no place like home: localhost, your own machine."
        marks: {place: 196.22, home: 196.6, localhost: 196.98, own: 197.66, machine: 197.9}
        visual: "A violet loop leaves the laptop and comes straight back into it, a packet circling it. Stickers and tags: No place like home, localhost = 127.0.0.1, your own machine, never leaves it."
      - id: verse-4-7
        start: 198.36
        end: 201.38
        text: "IP finds the machine, but one machine runs lots of apps,"
        marks: {ip: 198.36, finds: 198.8, machine: 199.36, machine_2: 200.24, lots: 200.78, apps: 201.12}
        visual: "The castle again: a violet packet labeled IP 3.33.167.235 rides to its gate (IP: right machine ✓). Then four windows light up with apps: :443 HTTPS website, :3000 your Node.js app, :22 SSH, :5432 database. Sticker: one machine, lots of apps."
      - id: verse-4-8
        start: 201.38
        end: 204.14
        text: "so the port picks the app: 3000, 443, like that."
        marks: {port: 201.8, picks: 202.04, app: 202.5, 3000: 202.8, 443: 203.28}
        visual: "The packet’s port 3000 tag flashes and it climbs to the :3000 window, which turns green; a second packet with port 443 climbs to the :443 window. Sticker: IP → machine · port → app."
      - id: verse-4-9
        start: 204.14
        end: 206.78
        text: "IP does its best, but packets still get dropped,"
        marks: {ip: 204.14, best: 205.12, packets: 205.62, dropped: 206.44}
        visual: "The student’s laptop sends numbered packets 1, 2, 3 through the home router and a router to the castle. Sticker: IP: best effort. The router shows “queue full”, and packet 2 tumbles off the island: dropped."
      - id: verse-4-10
        start: 206.78
        end: 209.76
        text: "and IP won’t resend. That’s TCP’s job. Full stop."
        marks: {ip: 207.06, resend: 207.6, tcp: 208.1, job: 208.78, full: 209.2, stop: 209.34}
        visual: "Tag: IP won’t resend. A timer at the laptop runs out (no ACK for 2); tag TCP resends 2, and a cyan packet 2 rides all the way to the castle. Sticker: That’s TCP’s job. Stamp: Full stop."
  - id: bridge
    title: "Bridge: HTTP and HTTPS"
    delivery: sung
    narration: "The bridge: requests fly to the server, and a note shows it remembers nothing between them. A request without a token gets: who are you. One that brings everything is answered by any of three server copies. Then HTTPS: a login request is locked in a TLS box and scrambles, so someone on café Wi-Fi sees only noise."
    lines:
      - id: bridge-1
        start: 209.76
        end: 214.32
        text: "Up top, HTTP has no chat history."
        marks: {top: 210.08, http: 210.62, chat: 213.16, history: 213.56}
        visual: "Tag: Application layer · HTTP. The student sends an HTTP box (GET /profile with an Authorization token) to the castle, which answers 200 OK · Hi, Joe! A note under the castle, “server remembers:”, goes from Joe’s request to nothing. Sticker: No chat history."
      - id: bridge-2
        start: 214.32
        end: 219.96
        text: "Every request starts fresh. The server won’t remember me,"
        marks: {every: 214.32, request: 215.54, fresh: 216.76, server: 217.82, remember: 218.78}
        visual: "A second request, GET /cart without the token, flies to the castle. Sticker: Every request starts fresh. The server replies “Who are you?” · 401."
      - id: bridge-3
        start: 219.96
        end: 225.56
        text: "so each request brings all it needs, and any server copy can reply."
        marks: {each: 220.28, brings: 220.86, needs: 222.3, any: 223.12, copy: 223.68, reply: 224.62}
        visual: "A third request brings everything: GET /cart, Authorization: Bearer token, Accept: text/html (sticker: Brings all it needs). The castle becomes three copies; the request goes to copy 2, which answers 200 OK. Sticker: Any copy can reply."
      - id: bridge-4
        start: 226.22
        end: 229.18
        text: "HTTPS: HTTP locked inside TLS."
        marks: {https: 226.22, http: 226.92, locked: 227.34, inside: 227.98, tls: 228.4}
        visual: "Title: HTTPS with a padlock. A login request (POST /login, user, password) is wrapped in a white TLS box marked encrypted, and its lines scramble into hexadecimal. On the right, a stack of HTTP, TCP, IP makes room for TLS between HTTP and TCP."
      - id: bridge-5
        start: 229.18
        end: 231.72
        text: "Nobody on the Wi-Fi reads your passwords."
        marks: {nobody: 229.18, wi: 230.04, reads: 230.44, passwords: 231.1}
        visual: "A café Wi-Fi island with “someone listening” looks at the box and sees only 9f3a 1e0c 77d2…; sticker: Password: safe."
