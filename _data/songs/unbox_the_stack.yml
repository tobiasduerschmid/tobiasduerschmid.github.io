  - id: outro
    title: "Outro"
    delivery: spoken
    narration: "The outro: 1969, Boelter Hall at UCLA. Two steel cabinets called IMPs, the first two nodes of the net, are joined by a leased line. The letters L and O travel from UCLA to SRI, then SRI crashes. Name cards for Vint Cerf and Bob Kahn frame the words TCP slash IP and their 1974 paper. Last: Go Bruins, the full stack lit up, and confetti."
    lines:
      - id: outro-1
        start: 279.57
        end: 285.08
        text: "1969, Boelter Hall: Kleinrock’s lab, the first node on the net."
        marks: {1969: 279.64, boelter: 281.34, kleinrock: 283.16, first: 284.12, node: 284.36, net: 284.84}
        visual: "Title: 1969, Boelter Hall 3420 · UCLA, Leonard Kleinrock’s lab. A steel cabinet with blinking panel lamps rises: the IMP, Node 1 · UCLA. A second one appears, Node 2 · SRI, joined by a leased line at 50 kbit/s."
      - id: outro-2
        start: 285.88
        end: 289.54
        text: "The first message said “LO,” then it crashed. Don’t forget."
        marks: {first: 286.02, message: 286.24, lo: 286.98, crashed: 288.6, forget: 289.22}
        visual: "UCLA’s teletype types L, O, G; the letters L and O travel down the line and print at SRI. G never arrives: SRI’s lamps go dark and a stamp reads Crash! Sticker: Oct 29, 1969 · 10:30 pm."
      - id: outro-3
        start: 290.1
        end: 296.1
        text: "Vint Cerf, a grad student there, later co-designed TCP/IP with Bob Kahn."
        marks: {vint: 290.1, grad: 291.52, later: 292.44, designed: 293.44, tcp: 294.28, bob: 295.44, kahn: 295.7}
        visual: "Name cards: Vint Cerf, grad student in Kleinrock’s lab; Bob Kahn, co-designer of TCP/IP. Between them TCP / IP slams in, tagged Transport and Internet, above the paper “A Protocol for Packet Network Intercommunication” (1974)."
      - id: outro-4
        start: 296.96
        end: 298.94
        text: "Go Bruins! Now you know the stack."
        marks: {go: 296.96, bruins: 297.2, know: 298.28, stack: 298.56}
        visual: "Go Bruins! The student sits beside the full stack, all four layers lit, as confetti flies; then a packet keeps wrapping down and unboxing up the stack to the end. Credit: SE Book · Networking."
      - id: outro-5
        start: 300.00
        end: 301.24
        text: "That’s HTTP!"
        visual: "The four-layer stack continues wrapping and unboxing the packet beside the student at a laptop."
      - id: outro-6
        start: 304.04
        end: 304.76
        text: "Secure!"
        visual: "The four-layer stack continues wrapping and unboxing the packet, then the music fades out."
