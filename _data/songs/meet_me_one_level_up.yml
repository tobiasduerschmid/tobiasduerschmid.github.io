# Storyboard for "Meet Me One Level Up", the coding-agent song (CS 35L
# Lecture 14, Agentic SWE; SEBook chapter SEBook/development_practices/genAI.md).
#
# This file is the single source of truth for the song's words and timing:
#   - js/song-video/songs/meet_me_one_level_up.js choreographs the live vector
#     player (/assets/song-player/meet-me-one-level-up.html) against each
#     line's `start` and its `marks` (the times of the words the visuals hit),
#     with the teaching pictures in js/song-video/agent-kit.js, the singer in
#     js/song-video/coding-agent.js, and the rooms in js/song-video/agent-campus.js
#     (an old library while the agent trains, an office once it works);
#   - render.js writes the captions and the audio-described soundtrack from
#     `text`, `answer`, and `narration` (`node scripts/song-video/render.js
#     meet_me_one_level_up`). This song plays only in the live player;
#   - the player page prints every line with its `visual` description as the
#     transcript (WCAG 1.2.1 / 1.2.3);
#   - each section's `narration` is spoken in the audio-described track, where
#     the picture holds at the start of the section while the narrator
#     describes what it shows (extended audio description, WCAG 1.2.5).
# Editing text or descriptions here updates the transcript and the player on
# the next Jekyll build, but the captions and described audio only after
# re-running render.js.
#
# Times are seconds into the Suno take "Meet Me One Level Up" (2) (about
# 112 BPM) of the lyric sheet in docs/meet-me-one-level-up-song-lyrics.md,
# whose agent is a misplaced genius: it knows almost everything except your
# project. Word marks come from local Whisper word timestamps (mlx
# whisper-large-v3-turbo, on the Demucs vocal stem) aligned to the sheet;
# Whisper skipped the first half of chorus 2, so an unprompted clip pass of
# 150.5-162.5 s supplied those words, and words Whisper misheard take the times
# of the words it heard in their place. The take sings "And one stayed" where
# the sheet has "One stayed", so that caption follows the recording. Quiz
# `answer_at` is the answer's first vocal onset, read from the vocal stem's
# envelope, and `pause_at` sits in the quiet just before it. The take stays
# centred (left-right balance within about 1 dB for 90% of the song), so the
# soundtrack is the take's stereo, normalized to -16 LUFS with one linear gain
# (peak -2.5 dBFS) and stored as AAC at 160 kb/s. Where the sheet splits a
# sentence across short lines, the storyboard keeps it as one line; the sheet's
# respellings for the singer (Pree-training, IN-fer-ence, ree-JEN-er-ate) are
# captioned in normal spelling.

