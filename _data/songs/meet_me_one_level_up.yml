      - id: v2-6
        start: 50.38
        end: 54.4
        text: "People picked the smoothest talker, so I sound sure to you."
        marks: {"people": 50.38, "picked": 50.7, "the": 51.04, "smoothest": 51.26, "talker": 51.76, "so": 52.32, "i": 52.56, "sound": 52.84, "sure": 53.42, "to": 53.72, "you": 53.9}
