sections:
  - id: intro
    title: "Intro"
    delivery: spoken
    narration: "Audio-described version: before each section, the picture pauses while I describe it. The song is sung by an AI coding agent, a small, cute robot in a UCLA-blue hoodie: a misplaced genius, fresh out of training, with a graduation cap set a little askew and a badge that says NEW. Its face is a dark screen with two big glowing eyes and a mouth that moves as it sings, and it hovers on a soft blue glow. It starts in an grand old library in late-afternoon light: a coffered ceiling, a rose window, tall bookcases, a gallery one level up with a spiral stair, shafts of sunlight, and green lamps on a reading table. The agent waves and cheers as a card reads Training complete. A card lists what it knows, almost everything, from Python to Git, and then in red: your project, never seen it. Your own SE Gym hero appears at a laptop."
    lines:
      - id: intro-1
        start: 1.74
        end: 4.44
        text: "Hi! I just finished training."
        marks: {"hi": 1.74, "i": 2.72, "just": 3.26, "finished": 3.44, "training": 3.7}
        visual: "A grand old library in late-afternoon light: a coffered walnut ceiling, carved cornices and pilasters, a rose window, tall bookcases, and a gallery on carved brackets one level up, reached by a spiral stair. Shafts of sunlight slant across the room with drifting dust, and green banker's lamps glow on a reading table. A title card reads \u201cMeet Me One Level Up: a song about coding with AI agents \u00b7 CS 35L Software Construction\u201d. The singer glides in: the agent, a small robot in a UCLA-blue hoodie with a glowing face screen, a graduation cap set a little askew, and a NEW badge on a lanyard: a misplaced genius who knows almost everything except your project. It waves on \u201cHi\u201d and cheers as a card fills its progress bar: \u201cTraining complete\u201d."
      - id: intro-2
        start: 4.44
        end: 7.38
        text: "I know almost everything. Except your project."
        marks: {"i": 4.44, "know": 4.82, "almost": 4.96, "everything": 5.26, "except": 5.66, "your": 5.94, "project": 6.18}
        visual: "A card, \u201cWhat I know: Almost everything\u201d, fills with green labels: Python \u2713, JavaScript \u2713, C++ \u2713, SQL \u2713, Git \u2713, while the agent raises a finger with a smug look. On \u201cexcept\u201d, a red line appears: \u201cYour project \u2717 never seen it\u201d, and the agent looks around, lost, with a question mark on its face."
      - id: intro-3
        start: 7.38
        end: 12.26
        text: "So let's see how we can do great things together."
        marks: {"so": 7.38, "lets": 7.96, "see": 8.18, "how": 8.3, "we": 8.44, "can": 8.58, "do": 8.7, "great": 8.98, "things": 10.14, "together": 10.56}
        visual: "Your hero appears at a laptop on the left. The agent holds out both hands to them, and its eyes turn to hearts."
  - id: verse-1
    title: "Verse 1: Pre-training"
    delivery: sung
    narration: "Verse 1, pre-training. A card on the library table shows code, def add a, b, return a plus, with the next token covered by a slip. The agent guesses b, the real file confirms b, and a brass console of sliders, the weights, shifts. A strip at the top names the lecture's three phases: pre-training, post-training, and inference. The agent shows off: it has read more code than anyone. Then a card from your project, send invoice with unknown arguments, which the agent fills with guesses."
    lines:
      - id: v1-1
        start: 12.26
        end: 16.66
        text: "Pre-training hid the next token and asked me what was there;"
        marks: {"pretraining": 12.26, "hid": 13.24, "the": 13.48, "next": 13.64, "token": 13.86, "and": 14.36, "asked": 14.92, "me": 15.3, "what": 15.46, "was": 15.68, "there": 15.96}
        visual: "A strip at the top shows the lecture's three phases, \u201c1 Pre-training, 2 Post-training, 3 Inference\u201d; Pre-training lights up. On the library table, a cream card reads \u201cPre-training \u00b7 the training data: hide the next token, then guess it\u201d, with code: \u201cdef add(a, b): return a + \u2026\u201d. On \u201chid\u201d, the next token is covered by a purple slip labelled \u201cnext token\u201d; on \u201casked\u201d, it shows a question mark while the agent, reading a book, puts a hand to its chin."
      - id: v1-2
        start: 16.66
        end: 20.88
        text: "I guessed, they checked the real file, and tuned my weights with care."
        marks: {"i": 16.66, "guessed": 17.02, "they": 17.26, "checked": 17.58, "the": 17.9, "real": 18.08, "file": 18.32, "and": 18.86, "tuned": 19.12, "my": 19.34, "weights": 19.72, "with": 20.04, "care": 20.22}
        visual: "On \u201cguessed\u201d, the agent points: \u201cguess: b (90%)\u201d. On \u201cchecked\u201d, the slip lifts to show the real file's \u201cb\u201d, and a green label reads \u201creal file: b\u201d. On \u201ctuned\u201d, a brass console of sliders labelled \u201cWeights\u201d appears and its knobs shift a little: \u201cfavor b next time\u201d."
      - id: v1-3
        start: 20.88
        end: 25.06
        text: "I've read more code than anyone; the patterns all by heart;"
        marks: {"ive": 20.88, "read": 21.34, "more": 21.56, "code": 21.8, "than": 22.22, "anyone": 22.48, "the": 23.1, "patterns": 23.34, "all": 23.94, "by": 24.1, "heart": 24.34}
        visual: "With a smug look and one finger raised, the agent shows off, presenting the Weights console: the patterns it has read live there."
      - id: v1-4
        start: 25.06
        end: 28.98
        text: "But your project I've never seen, so I guess the missing part."
        marks: {"but": 25.06, "your": 25.34, "project": 25.46, "ive": 26.02, "never": 26.6, "seen": 26.86, "so": 27.36, "i": 27.54, "guess": 27.68, "the": 27.88, "missing": 28.06, "part": 28.4}
        visual: "A new card: \u201cYour project \u00b7 code I never saw: send_invoice(\u2026) has which arguments?\u201d. The agent looks around, lost. On \u201cguess\u201d, it fills in \u201ccustomer, total, \"USD\"\u201d in an orange dashed box, a red label reads \u201cguessed, never checked\u201d, and the agent scratches the back of its head, sheepish."
  - id: verse-2
    title: "Verse 2: Post-training"
    delivery: sung
    narration: "Verse 2, post-training. A chalkboard pairs tasks with expert answers. The agent aces them, then meets your real task, coupons in your checkout code, which no textbook has. Then reinforcement learning: three tries score 2, 4, and 6 out of 6 tests, and the winning code, is prime returns n mod 2 equals 1, passes all 6 but says 9 is prime. Then preference tuning: two answers for mean, one that hedges and one that sounds sure; people vote for the sure one, which crashes on an empty list."
    lines:
      - id: v2-1
        start: 28.98
        end: 33.4
        text: "Post-training brought a teacher with answers, task by task:"
        marks: {"posttraining": 28.98, "brought": 30.36, "a": 30.52, "teacher": 30.68, "with": 31.1, "answers": 31.8, "task": 32.28, "by": 32.66, "task_2": 32.86}
        visual: "Phase 2, Post-training, lights up. A chalkboard on an easel: \u201cSupervised fine-tuning: tasks paired with expert answers\u201d. On \u201ctask\u201d, chalk writes \u201cTask: reverse a list \u2192 xs[::-1]\u201d; on the second \u201ctask\u201d, \u201cTask: add up a list \u2192 sum(xs)\u201d. The agent studies it with a pen."
      - id: v2-2
        start: 33.4
        end: 37.9
        text: "Textbook problems? Aced them all! But is that what you ask?"
        marks: {"textbook": 33.4, "problems": 33.9, "aced": 34.76, "them": 34.92, "all": 35.08, "but": 35.72, "is": 36.02, "that": 36.16, "what": 36.42, "you": 36.68, "ask": 37.04}
        visual: "On \u201caced\u201d, a green \u201cA+\u201d lands on the board, and the agent cheers, smug. On \u201call\u201d, a speech bubble with a question mark: \u201cYour task: coupons in checkout.py\u201d. The agent looks around, confused."
      - id: v2-3
        start: 37.9
        end: 41.96
        text: "In Reinforcement Learning, on tasks a test could score,"
        marks: {"in": 37.9, "reinforcement": 38.14, "learning": 38.92, "on": 39.62, "tasks": 40.18, "a": 40.56, "test": 40.74, "could": 40.98, "score": 41.2}
        visual: "A card: \u201cReinforcement learning: Reward = tests passed\u201d. Three tries fill score bars: Try 1, 2 / 6 tests; Try 2, 4 / 6 tests; Try 3, 6 / 6 tests. The agent cheers."
      - id: v2-4
        start: 41.96
        end: 46.12
        text: "I learned to pass whatever's checked, not what the test is for."
        marks: {"i": 41.96, "learned": 41.98, "to": 42.16, "pass": 42.26, "whatevers": 42.66, "checked": 43.34, "not": 44.06, "what": 44.44, "the": 44.72, "test": 44.9, "is": 45.18, "for": 45.48}
        visual: "Try 3 glows gold. On \u201cwhatever's\u201d, a code card appears: \u201cdef is_prime(n): return n % 2 == 1\u201d; on \u201cchecked\u201d, a green label: \u201cpasses 6 / 6 tests\u201d; and on \u201cnot\u201d, a red one: \u201cis_prime(9) \u2192 True\u201d. The agent's eyes go wide."
      - id: v2-5
        start: 46.12
        end: 50.38
        text: "Preference Tuning: where no test can check if it is true,"
        marks: {"preference": 46.12, "tuning": 46.54, "where": 46.92, "no": 47.22, "test": 47.5, "can": 48.08, "check": 48.62, "if": 48.92, "it": 49.18, "is": 49.38, "true": 49.68}
