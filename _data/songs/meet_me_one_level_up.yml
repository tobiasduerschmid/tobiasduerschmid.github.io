  - id: pre-chorus
    title: "Pre-chorus"
    delivery: sung
    narration: "Pre-chorus. A code file fills faster than you can read it, while the agent strikes a genius pose and then looks lost. A sticky note asks: Did I understand you? Assume I misunderstood. A green check follows once you have checked."
