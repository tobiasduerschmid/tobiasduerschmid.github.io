  - id: verse-2
    title: "Verse 2"
    delivery: sung
    narration: "Verse 2, your first shell script. A script card, hello.sh, whose first line, the shebang, carries an address label naming /bin/bash, the interpreter that runs it. chmod +x opens a padlock and turns on the three execute bits; without it, Permission denied. Running ./hello.sh students drops students into the dollar one blank. Then a variable: a box labeled NAME catching its value, with no spaces around the equals sign, or the shell runs NAME as a command. Quoted, the variable stays one argument; unquoted, scissors split it in two. A scoreboard shows dollar question mark, the last exit code, and an if statement becomes a flowchart that checks a test’s exit code and takes the then branch on zero, ending with fi. A for loop expands star dot jpg, and a rubber stamp renames each photo in turn, three hundred in all. Last, cd homework and-and ls: a boom gate lifts for ls only when cd exits 0."
