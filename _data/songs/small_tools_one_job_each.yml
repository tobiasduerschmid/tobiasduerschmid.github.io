# Storyboard for "Small Tools, One Job Each", the shell scripting song on the
# SE Book page SEBook/tools/shell.md (embedded with _includes/song-video.html).
#
# This file is the single source of truth for the song's words and timing:
#   - js/song-video/songs/small_tools_one_job_each.js choreographs the live
#     vector player (/assets/song-player/small-tools-one-job-each.html)
#     against each line's `start` and its `marks` (the times of the words the
#     visuals hit), with the artwork in js/song-video/shell-kit.js;
#   - render.js writes the captions and the audio-described soundtrack from
#     `text` and `narration` (`node scripts/song-video/render.js
#     small_tools_one_job_each`). This song has no MP4: it plays only in the
#     live player, so render.js skips the frame capture;
#   - _includes/song-video.html prints every line with its `visual`
#     description as the on-page transcript (WCAG 1.2.1 / 1.2.3);
#   - each section's `narration` is spoken in the audio-described track,
#     where the picture holds at the start of the section while the narrator
#     describes what it shows (extended audio description, WCAG 1.2.5).
# Editing text or descriptions here updates the transcript and the player on
# the next Jekyll build, but the captions and described audio only after
# re-running render.js.
#
# Times are seconds into the Suno take, normalized to -16 LUFS. Line
# boundaries and word marks come from local Whisper word timestamps aligned to
# the lyric sheet (a prompted second pass covers the quiz, where the blind
# pass misheard the shouted answers). `text` keeps shell notation (chmod +x, ./hello.sh, $1)
# for what is sung in words ("C-H-mod plus X", "dot-slash", "dollar one").

title: "Small Tools, One Job Each: a song about the Unix shell"   # the player's accessible name
credit: Lyrics written for this chapter; music and vocals generated with Suno.
student:
  laptop_logo: /assets/icons/bash/bash.svg
extras:   # the song's own art and styles, loaded before its choreography
  styles:
    - /css/song-video-shell-kit.css
  scripts:
    - /js/song-video/shell-kit.js
player: /assets/song-player/small-tools-one-job-each.html
captions: /assets/audio/small-tools-one-job-each.vtt
described_captions: /assets/audio/small-tools-one-job-each-described.vtt
soundtrack: assets/audio/small-tools-one-job-each.m4a   # repo path, played by the live player
described_soundtrack: assets/audio/small-tools-one-job-each-described.m4a
described_timeline: /assets/audio/small-tools-one-job-each-described.json
narrator:
  voice: Samantha   # macOS `say` voice for the audio-described track
  rate: 205         # words per minute
  pronounce:        # how the narrator says notation the captions keep as written
    names.txt: names dot text
    notes.txt: notes dot text
    app.log: app dot log
    hello.sh: hello dot S H
    /bin/bash: slash bin slash bash
    /bin: slash bin
    chmod: C H mod
    uniq: unique
    wc -l: W C dash L
    cp: C P
    ls: L S
    htop: H top
    pwd: P W D
width: 1920
height: 1080
fps: 30
duration: 281.2
beats:
  bpm: 91.0   # fitted to the take's onset envelope
  first: 0.087

sections:
  - id: intro
    title: "Intro"
    delivery: spoken
    narration: "Audio-described version: before each section, the picture pauses while I describe it. The intro: twelve vector trip photos named IMG with a number, out of three hundred. Renaming one by hand takes forever, so a terminal types a one-line for loop that moves each file to a name starting with trip underscore, and every photo is renamed at once. Then: exactly what you type, not what you think. A hero wants one folder called trip photos. How many folders does mkdir trip photos create? Two: trip and photos. The unquoted space separates two arguments. With quotes around trip photos, mkdir gets one argument and creates one folder with that full name. The two examples stay visible for comparison."
