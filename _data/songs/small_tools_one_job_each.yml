  - id: chorus-1
    title: "Chorus"
    delivery: sung
    narration: "The chorus: three small machines on a conveyor belt, sort names.txt, uniq, and wc -l, each with one job, with pipe signs between them. Paper slips ride the belt through the machines, and cards above show the text after each step, ending in 3. Labels mark standard out feeding standard in; an error message drops out of a side hatch marked 2 to your screen, as standard error, stream 2; and each machine’s beacon shows its exit code: exit 0, it worked; anything else, it didn’t."
