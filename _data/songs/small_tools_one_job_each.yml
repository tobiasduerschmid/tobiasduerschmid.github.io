  - id: verse-1
    title: "Verse 1"
    delivery: sung
    narration: "Verse 1, how the shell reads a line. A pair of scissors cuts the typed line cp notes.txt backup.txt at its spaces, into a command and two arguments. Tape over the quoted name my notes keeps it one argument; without quotes, it is cut in two. Then the PATH variable becomes a filing cabinet: a magnifier opens its drawers in order and finds ls in /bin, but hello.sh lies on the desk in the current directory, which is not on the PATH, until dot slash points straight at it. Finally a directory tree drawn like a map, with a pin where you are in hw1, tags for dot dot and tilde, an absolute path drawn from the root like a full address, and a relative path drawn from here like directions."
