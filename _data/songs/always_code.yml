  - id: chorus
    title: Chorus
    delivery: sung
    narration: >-
      The lyric is: Always code with clean design. Tilted modules straighten into an orderly row,
      each with one responsibility: parse, calculate, or format. The lyric is: Always code with many
      tests. Test cases for a normal input, a boundary input, and an invalid input receive PASS
      checks in sequence. The lyric is: Always code with a good view of the system. A UML sequence
      diagram traces a request from Client to Service, then load from Service to Storage. Dashed
      returns carry data back to Service and the result back to Client. Messages appear in time
      order. The lyric is: Always code with change in mind. Inside a fixed socket labeled same
      interface, implementation v1 leaves and v2 takes its place. The surrounding connections remain
      unchanged. The lyric is: Always code details behind. A purple curtain closes over cache,
      helpers, and algorithm inside the implementation. The public getResult interface remains
      visible. The lyric is: Always code with refactorings of new code. Before and after code
      windows show duplicated x plus x expressions extracted into a shared double function used by A
      and B. The tests stay green on both sides, emphasizing preserved behavior.
