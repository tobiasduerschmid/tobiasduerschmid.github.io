sections:
  - id: verse
    title: Verse
    delivery: sung
    narration: >-
      This is instrumental karaoke. Each lyric has a separate illustrated scene. The lyric is:
      You're no strangers to code. A smiling terminal in gold headphones waves beside an editor that
      greets you with hello, code. The lyric is: You know commands of shell and git. A shell window
      reveals pwd, git status, and git diff beside a Git history with a feature branch. The lyric
      is: A pull request is what you’re thinking of. A pull request shows an old behavior and a
      proposed fix. An envelope moves toward a review window labeled Discuss before merge. The lyric
      is: You shouldn’t do this without considering…. A large pause sign accompanies a magnifying
      glass that scans three review questions: Callers? Contracts? Failure cases? The lyric is: how
      this impacts all the other modules. A change signal travels from a changed module toward its
      callers. Both callers receive a check-impact reminder; a change can affect other modules. The
      lyric is: Gotta make you understand. A pointer guides a teammate through three questions on a
      whiteboard: What changes? Who is affected? Why is it safe?
