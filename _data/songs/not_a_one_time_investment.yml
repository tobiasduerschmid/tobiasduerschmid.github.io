  - id: bridge
    title: "Bridge"
    delivery: sung
    narration: "The bridge, case 4, Ariane 5. Both rockets stand on launch platforms resting on the scene's ground, their names below the platforms. They stay visible through the launch sequence. Ariane 4 carries a gold inertial-reference module inside a cut-away window. Compact labels explain speed stored in 16 bits and the limit, 32,767. Ariane 4 makes a slower ascent at full size and exits the top of the frame; a label confirms its value fits the range. The same module is reused in the larger Ariane 5. It climbs roughly twice as fast at full size, reaching the clouds as an overflow label appears. The second rocket holds that failure moment for the 37-second label; then the rocket veers and breaks apart. Its fairing, tanks, boosters, and gold module separate through an expanding amber fireball. The fire dims as smoke billows upward and disperses. A comparison reads Ariane 4 fits, Ariane 5 overflows, assumes horizontal velocity fits in 16 bits, and cost of failure, 370 million dollars. The principle is identify violated assumptions. Three checkboxes appear in turn: read the documentation and code, check the intended conditions, and test. A ground test catches the overflow before launch. Finally, one module branches into two, 16-bit version 1 and 32-bit version 2, each with its own team: evolve separately, version it, or clone and own."
