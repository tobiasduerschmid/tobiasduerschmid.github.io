sections:
  - id: intro
    title: "Intro"
    delivery: spoken
    narration: "Audio-described version: before each section, the picture pauses while I describe it. The song plays on a toy-brick construction site before sunrise. The studded ground, loose bricks, lamps, and blue-hour sky are there from the first frame. The ground floors and crane assemble during the opening. Each chorus adds another stage: lower floors, upper floors, then belfries, roofs, and the final wall courses. Completed floors stay in place between choruses. The sun rises in an arc to the right. Violet cloud undersides turn rose and coral, then peach and cream, as the upper sky changes from deep blue to azure above a golden horizon. Your hero is the foreman, in a hi-vis vest and gold hard hat, holding a clipboard. On the right, the foreman steps onto the tower as its ground floor rises, then climbs each new course during the choruses. Between builds, the foreman stands on the completed layers, facing the central illustrations. The hero stays on screen, singing with word-timed mouth movements and resting during instrumental gaps and quiz pauses. The buildings stay sharp. Illustrations take turns in the clear space between the towers, with readable text plaques. A terminal types npm install left-pad and waits, while a shelf of reusable package bricks appears. A title introduces a balance scale: three blue bricks of effort saved outweigh one gold brick of effort to adapt. During the instrumental, the crane lifts a prebuilt module off the ground."
    lines:
      - id: intro-1
        start: 2.23
        end: 5.24
        text: "Good news: you don't have to write it all yourself."
        marks: {"good": 2.23, "news": 2.44, "you": 3.04, "dont": 3.46, "have": 3.6, "to": 3.74, "write": 3.86, "it": 4.06, "all": 4.2, "yourself": 4.32}
        visual: "The blue-hour sky, warm horizon, studded ground, loose bricks, and lamps are visible from the start. The foreman starts at ground level on the right with a clipboard, singing in a hi-vis vest and gold hard hat, without a surrounding halo. As the right-hand tower rises, the foreman steps up onto its new brick courses, beside the crane. The hall and building site assemble their ground-floor bases, and the crane rises. The upper floors wait for the choruses. Between the towers, a terminal types `npm install left-pad` and waits. On “yourself”, the hero points as the shelf appears: requests, numpy, React, and Express."
      - id: intro-2
        start: 6.56
        end: 8.8
        text: "Let's learn to reuse it well."
        marks: {"lets": 6.56, "learn": 6.82, "to": 7.0, "reuse": 7.28, "it": 7.88, "well": 8.04}
        visual: "A small title plaque reads “Casebook: Design with Reuse”. Below it, a balance scale floats over the site: three blue bricks of “Effort saved” outweigh one gold brick of “Effort to adapt”. On “well”, the foreman gives a thumbs-up; in the instrumental after it, the foreman points up as the crane lifts a prebuilt module of bricks off the ground."
  - id: verse-1
    title: "Verse 1"
    delivery: sung
    narration: "Verse 1, what reuse saves. The illustrations take turns between the towers; the foreman sings from the completed ground-floor roof of the right-hand tower. Clouds drift gently, their highlights facing the sun; the forklift holds still. First, a shelf of package bricks with an open-source tag. Then requests connects to eight apps, and three bugs are stamped fixed. One card reads higher software quality, fewer defects. It clears before two bars, code to write and code to test, shrink; another card reads higher productivity, faster time to market. The benefits disappear before the catch. Blue Library 1 and tan Library 2 bricks form a neat wall, the vision, then separate into mismatched pieces, the reality. Notes say assumes one thread and assumes low speeds. A glue bottle squeezes glue code into the gaps, one after another."
    lines:
      - id: v1-1
        start: 12.89
        end: 14.86
        text: "Most code I need is out there,"
        marks: {"most": 12.89, "code": 13.14, "i": 13.48, "need": 13.68, "is": 13.96, "out": 14.16, "there": 14.36}
        visual: "Under the top-left “Verse 1 · What reuse saves” banner, a central shelf shows blue package bricks: requests, urllib3, numpy, pandas, and docker. The sharp buildings remain clear on either side; the foreman sings and points inward from the right-hand tower."
      - id: v1-2
        start: 14.86
        end: 16.52
        text: "Written once and shared."
        marks: {"written": 14.86, "once": 15.22, "and": 15.54, "shared": 15.7}
        visual: "A note under the shelf: “Written once, shared”."
      - id: v1-3
        start: 16.52
        end: 18.72
        text: "It's run in working systems,"
        marks: {"its": 16.52, "run": 16.88, "in": 17.34, "working": 17.34, "systems": 17.7}
        visual: "The shelf gives way to the requests brick, with thin lines running from it to eight small apps that use it. Label: “Used in working systems”."
      - id: v1-4
        start: 18.72
        end: 20.56
        text: "So bugs were found and repaired."
        marks: {"so": 18.72, "bugs": 18.82, "were": 19.18, "found": 19.32, "and": 19.62, "repaired": 19.76}
        visual: "Three bugs beside requests receive green “fixed” stamps. One central card appears: “Higher software quality, fewer defects”. The foreman gives a thumbs-up on “repaired”."
      - id: v1-5
        start: 20.56
        end: 22.5
        text: "Less to write and less to test,"
        marks: {"less": 20.56, "to": 20.7, "write": 20.9, "and": 21.22, "less_2": 21.56, "to_2": 21.76, "test": 21.94}
        visual: "The requests picture gives way to two bars that shrink: “Code to write” and “Code to test”. The foreman points at the shrinking bars."
      - id: v1-6
        start: 22.5
        end: 24.98
        text: "So the feature ships sooner."
        marks: {"so": 22.5, "the": 22.78, "feature": 22.98, "ships": 23.44, "sooner": 23.96}
        visual: "After the quality card has cleared, one central card appears beneath the shrinking bars: “Higher productivity, faster time to market”."
      - id: v1-7
        start: 24.98
        end: 27.04
        text: "But modules aren't neat building blocks:"
        marks: {"but": 24.98, "modules": 25.12, "arent": 25.66, "neat": 26.0, "building": 26.2, "blocks": 26.52}
        visual: "The benefit cards and bars clear. In their place between the towers, Library 1 and Library 2 bricks snap into a neat wall: “The vision: compatible blocks”."
      - id: v1-8
        start: 27.04
        end: 29.18
        text: "Each one assumes its world,"
        marks: {"each": 27.04, "one": 27.3, "assumes": 27.52, "its": 28.02, "world": 28.34}
        visual: "The wall gives way to mismatched pieces with gaps between them: a giant blue brick, a thin tan plate, a tilted tan brick, a blue brick on its side, a red brick floating above a gap, and another tan brick. Two notes: “assumes one thread” and “assumes low speeds”. Label: “The reality: they don’t fit”."
      - id: v1-9
        start: 29.18
        end: 32.73
        text: "And glue code joins the pieces"
        marks: {"and": 29.18, "glue": 29.34, "code": 29.72, "joins": 30.26, "the": 30.88, "pieces": 31.16}
        visual: "A glue bottle hops from gap to gap and squeezes glue into each one; the glue fills down from the top, sags into a drip, and sets. Label: “Glue code fills the gaps”."
      - id: v1-10
        start: 32.73
        end: 34.6
        text: "Where those worlds don't fit."
        marks: {"where": 32.73, "those": 32.8, "worlds": 33.04, "dont": 33.32, "fit": 33.64}
        visual: "The glue strips are outlined in red, under the label “Where the assumptions don’t fit”."
  - id: refrain-1
    title: "Refrain"
    delivery: sung
    narration: "The first chorus adds lower floors to both background buildings, brick by brick, above the ground-floor bases. A compact checklist appears in the middle, titled before you reuse, ask. One question appears at a time, with its principle underneath. The crane lowers a gold brick for each onto the tower beside it. What will it save, what will it cost: cost-benefit analysis. What does it assume: identify violated assumptions. What does it pull in: strive for fewer dependencies. Pin it, but update for patches: keep versions fixed, update for security patches. The footer lights: external reuse is not a one-time investment, and the baseplate turns gold."
    lines:
      - id: refrain1-1
        start: 37.04
        end: 38.76
        text: "Before you reuse, ask:"
        marks: {"before": 37.04, "you": 37.3, "reuse": 37.54, "ask": 38.32}
        visual: "One question at a time, with a growing brick tower beside it, under a small title plaque: “Before you reuse, ask:”."
      - id: refrain1-2
        start: 38.76
        end: 41.26
        text: "What will it save? What will it cost?"
        marks: {"what": 38.76, "will": 39.02, "it": 39.36, "save": 39.58, "what_2": 39.94, "will_2": 40.36, "it_2": 40.6, "cost": 40.76}
        visual: "The first question lights, with a gold wallet badge: “What will it save? What will it cost?”, and the lecture’s name beneath it, “Cost-benefit analysis”. The crane’s hook lowers a gold brick with the same badge onto the baseplate beside the checklist."
      - id: refrain1-3
        start: 41.26
        end: 43.02
        text: "What does it assume?"
        marks: {"what": 41.26, "does": 41.4, "it": 41.64, "assume": 41.78}
        visual: "The second question replaces the first, with a gold magnifying-glass badge: “What does it assume?”, and beneath it “Identify violated assumptions”. A second gold brick, with the same badge, stacks on the first."
      - id: refrain1-4
        start: 43.02
        end: 44.96
        text: "What does it pull in?"
        marks: {"what": 43.02, "does": 43.24, "it": 43.48, "pull": 43.66, "in": 44.12}
        visual: "The third question replaces the second, with a gold box badge: “What does it pull in?”, and beneath it “Strive for fewer dependencies”. A third gold brick stacks on top."
      - id: refrain1-5
        start: 46.0
        end: 48.0
        text: "Pin it, but update for patches."
        marks: {"pin": 46.0, "it": 46.32, "but": 46.78, "update": 47.0, "for": 47.38, "patches": 47.6}
        visual: "The fourth question replaces the third, with a gold pin badge: “Pin it, but update for patches.”, and beneath it “Keep versions fixed · Update for security patches”. A fourth gold brick completes the tower."
      - id: refrain1-6
        start: 48.0
        end: 53.24
        text: "External reuse is not a one-time investment."
        marks: {"external": 48.0, "reuse": 48.6, "is": 49.32, "not": 49.8, "a": 50.1, "onetime": 50.82, "investment": 51.84}
        visual: "A separate footer strip, the lecture’s key takeaway, lights in large type: “External reuse is not a one-time investment.”, and the tower’s baseplate turns gold."
  - id: verse-2
    title: "Verse 2"
    delivery: sung
    narration: "Verse 2, case 1, urllib3. Each explanation takes its turn in the middle, with a gold principle brick below. Blue bricks mean reused packages, gold means your own code and lessons to keep, red means broken, and green means fixed. A clean git status gives way to a docker error: request got an unexpected keyword argument chunked. The terminal clears for a dependency tower: docker on requests on urllib3 1.26. In a clean install the crane lifts the upper bricks, the unpinned bottom brick is swapped for red version 2.0.0 with different studs, and the upper bricks are set back down. The tower stays visible while an arrow points to the new studs: a changed API. The break travels upward. A Pipfile pins urllib3 below 2.0.0; a note says a lockfile gives every build the same bricks. The tower returns, the old brick slides back, and green checks appear. The principle is keep versions of your dependencies fixed."
    lines:
      - id: v2-1
        start: 54.25
        end: 56.06
        text: "My code had not changed a line,"
        marks: {"my": 54.25, "code": 54.46, "had": 54.82, "not": 55.0, "changed": 55.14, "a": 55.52, "line": 55.72}
        visual: "Under the top-left section banner, a central terminal shows `git status` and “nothing to commit, working tree clean”."
      - id: v2-2
        start: 56.06
        end: 58.06
        text: "Yet docker broke today."
        marks: {"yet": 56.06, "docker": 56.34, "broke": 56.9, "today": 57.34}
        visual: "The red error from the lecture appears below it: “docker.errors.DockerException: Error while fetching server API version: request() got an unexpected keyword argument 'chunked'”, with the last part highlighted."
      - id: v2-3
        start: 58.06
        end: 60.14
        text: "Docker calls on Requests;"
        marks: {"docker": 58.06, "calls": 58.48, "on": 59.08, "requests": 59.44}
        visual: "The terminal clears. In the middle, a blue docker brick drops onto requests: docker depends on requests. Beside them: “calls ↓”."
      - id: v2-4
        start: 60.14
        end: 62.4
        text: "Requests calls urllib3."
        marks: {"requests": 60.14, "calls": 60.4, "urllib3": 61.36}
        visual: "Under requests, a blue brick “urllib3”, tagged 1.26, completes the tower on its baseplate. Another “calls ↓”."
      - id: v2-5
        start: 62.4
        end: 64.56
        text: "No version had been pinned,"
        marks: {"no": 62.4, "version": 62.64, "had": 63.34, "been": 63.64, "pinned": 63.86}
        visual: "urllib3’s tag turns into a dashed “1.26 · not pinned”, and a note beside it says “nothing pinned”."
      - id: v2-6
        start: 64.56
        end: 66.6
        text: "So a clean install got two;"
        marks: {"so": 64.56, "a": 64.76, "clean": 64.92, "install": 65.18, "got": 65.62, "two": 65.92}
        visual: "A white sticker, “Clean install”. The crane’s hook comes down and lifts docker and requests off the tower; the urllib3 1.26 brick slides out, a red urllib3 2.0.0 brick with different studs slides in, and the hook lowers the pair back onto it: they no longer seat. The foreman points at the crane."
      - id: v2-7
        start: 66.6
        end: 68.93
        text: "Version two changed its API,"
        marks: {"version": 66.6, "two": 66.9, "changed": 67.22, "its": 67.84, "api": 68.14}
        visual: "The dependency tower stays in the middle: requests and docker remain lifted above the red urllib3 2.0.0 brick. A note and arrow point to its incompatible studs: “new studs: a changed API”."
      - id: v2-8
        start: 68.93
