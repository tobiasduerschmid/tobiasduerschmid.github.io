  - id: verse-3
    title: "Verse 3"
    delivery: sung
    narration: "Verse 3, case 2, Heartbleed. A padlock labelled OpenSSL cracks, and a timeline shows the bug unseen for two years. Why: a request asks the server to send back the letter a, with a length of 64 kilobytes. The server trusts the length and sends back a long strip of its memory, including a password and a private key. Your app is a small build: your code brick, with a check, on an OpenSSL brick. An X-ray shows a crack in the OpenSSL brick: reused code brings its bugs. The fix ships on 7 April 2014, and a grid of app bricks turns from red to green as each one updates: one fix, many apps. The principle brick: pinned doesn't mean frozen. The openssl brick moves from 1.0.1f to 1.0.1g, the tests pass, and the principle brick says update to receive security patches."
