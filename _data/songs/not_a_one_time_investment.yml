  - id: bridge
    title: "Bridge"
    delivery: sung
    narration: "The bridge, case 4, Ariane 5. Ariane 4, a white rocket on its launch table, carries a gold module, its inertial reference system, seen through a cut-away window, which stores horizontal velocity in a 16-bit integer, up to 32,767. Ariane 4 flies, and the gauge stays green. The same gold module is reused in Ariane 5, a bigger, faster rocket: the needle passes the limit, overflow. At 37 seconds the rocket veers and breaks apart, its pieces scattering in a slow orange bloom: 370 million dollars. A split card: Ariane 4 fits, Ariane 5 overflows, and a note: assumes horizontal velocity fits in 16 bits. The principle brick: identify violated assumptions, with three boxes ticked in turn: check the documentation and code, check it was designed for your conditions, and test it, where a test bench catches the failure before launch. Last, two arrows branch apart, and the module brick becomes two, version 1, 16-bit, and version 2, 32-bit, each with its own team: evolve separately, version it, or clone and own."
