described_captions: /assets/audio/not-a-one-time-investment-described.vtt
soundtrack: assets/audio/not-a-one-time-investment.m4a   # repo path, played by the live player
described_soundtrack: assets/audio/not-a-one-time-investment-described.m4a
described_timeline: /assets/audio/not-a-one-time-investment-described.json
narrator:
  voice: Samantha   # macOS `say` voice for the audio-described track
  rate: 205         # words per minute
