# Storyboard for "Not a One-Time Investment", the design-with-reuse song on the
# SE Book page SEBook/designprinciples/reuse.md (embedded with
# _includes/song-video.html).
#
# This file is the single source of truth for the song's words and timing:
#   - js/song-video/songs/not_a_one_time_investment.js choreographs the live
#     vector player (/assets/song-player/not-a-one-time-investment.html)
#     against each line's `start` and its `marks` (the times of the words the
#     visuals hit). js/song-video/reuse-kit.js draws the casebook spreads and
#     their brick pictures, and js/song-video/brick-site.js the construction
#     site of toy bricks behind them;
#   - render.js writes the captions and the audio-described soundtrack from
#     `text`, `answer`, and `narration` (`node scripts/song-video/render.js
#     not_a_one_time_investment`). This song has no MP4: it plays only in the
#     live player;
#   - _includes/song-video.html prints every line with its `visual`
#     description as the on-page transcript (WCAG 1.2.1 / 1.2.3);
#   - each section's `narration` is spoken in the audio-described track,
#     where the picture holds at the start of the section while the narrator
#     describes what it shows (extended audio description, WCAG 1.2.5).
# Editing text or descriptions here updates the transcript and the player on
# the next Jekyll build, but the captions and described audio only after
# re-running render.js.
#
# Times are seconds into the Suno take "External Reuse" (about 112 BPM) of the
# lyric sheet in docs/not-a-one-time-investment-song-lyrics.md. The take's
# timed-lyrics track gave each sheet line's start; word marks come from local
# Whisper word timestamps (mlx whisper-large-v3-turbo) aligned to the sheet.
# Quiz `answer_at` is the answer's first vocal onset on the Demucs vocal stem,
# and `pause_at` sits in the quiet just before it. The stereo balance stays
# within 0.5 dB, so the soundtrack keeps both channels; it is normalized to
# -16 LUFS with one linear gain (true peak -3 dBFS) and stored as AAC at
# 192 kb/s. Where the sheet splits a sentence across short lines (the
# refrain's takeaway, the bridge's rule, each quiz question), the storyboard
# keeps it as one line.

title: "Not a One-Time Investment: a song about design with reuse"   # the player's accessible name
credit: Lyrics written for this chapter; music and vocals generated with Suno.
theme: brick-site   # stage look: the toy-brick construction site of js/song-video/brick-site.js
