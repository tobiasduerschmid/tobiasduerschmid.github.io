  - id: verse-4
    title: "Verse 4"
    delivery: sung
    narration: "Verse 4, case 3, left-pad. Left-pad's eleven lines of JavaScript, and what they are for: three numbers, 7, 42, and 317, padded to width 3. Padding bricks drop in on the left of the short ones until all three line up on the right. Why: a tall tower of individual blue blocks in staggered courses. Your app stands on react and babel-core; babel-core stands on a cluster of smaller package blocks, which stand on one tiny brick, left-pad. The path down to it lights: a transitive dependency. The tiny brick strains under the load as the build trembles; then a forklift races in and drives off with it: unpublished in March 2016. The bricks above it hang in the air for a cartoon moment, then crash down, chips flying, and your app seesaws and settles crooked. The broken tower stays visible while three compact terminals below its base print npm error 404, and your app gets a red cross. You only listed react and babel-core; left-pad sat three levels down. Next, eslint-scope 3.7.2, its maintainer's account taken over, and an npm token sliding away. The principle bricks follow in turn: avoid reusing trivial code, beside a one-line isArray; strive for fewer package dependencies, as a shelf of eight package bricks loses its five trivial ones and tags say each can break, be hijacked, or vanish. A homemade encrypt function is crossed out for a vetted crypto library brick: don't roll your own crypto. Last, a well-maintained profile card is ticked over an abandoned one, and at a brick wall with a gap, the popular brick is too wide to fit while a smaller brick fills the gap: fit matters more than popularity."
