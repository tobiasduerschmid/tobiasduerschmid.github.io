    title: "Pre-chorus"
    delivery: sung
    narration: "Pre-chorus: a story card fills in. As a student in the dorms, I want a ping when my wash is done, so that my wet clothes don't get dumped by someone. Its criteria: Given my wash is running, When the cycle ends, Then my phone pings within a minute. The INVEST scanner rises below: I, N, V, E, S, T."
