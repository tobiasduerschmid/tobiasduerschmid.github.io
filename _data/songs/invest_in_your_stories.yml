  - id: verse-3
    title: "Verse 3"
    delivery: sung
    narration: "Verse 3: Estimable, Small, Testable. An estimate dial settles on 3 points: the scope is clear. Then a card reads read handwriting with high accuracy; fog covers the dial while question marks ask how high and which characters. A customer conversation and a time-boxed spike, two days on a stopwatch, clear the fog, and the dial settles on 5 points. For Small, a story card fits inside a one-sprint box; scissors that would cut it once more are stopped, because both halves would break the other five letters. A story wearing a trench coat, I want Piazza, Gradescope, Drive, and Zoom, drops the coat and becomes four stories. Crumb-sized cards, edit date, edit title, edit place, merge into edit an entry. For Testable, a question asks how do we know it's done; acceptance criteria appear before the code editor opens. Vague words, fast, pretty, easy, float as clouds and are replaced by a number and a state. Then three panels: Given it's before the deadline, When I upload a new file, Then my submission shows the new one, and a PASS stamp lands."
