# Storyboard for "Invest in Your Stories", the user stories and INVEST song on
# the SE Book page SEBook/userstories.md (embedded with _includes/song-video.html).
#
# This file is the single source of truth for the song's words and timing:
#   - js/song-video/songs/invest_in_your_stories.js choreographs the live
#     vector player (/assets/song-player/invest-in-your-stories.html) against
#     each line's `start` and its `marks` (the times of the words the visuals
#     hit), with the artwork in js/song-video/story-kit.js;
#   - render.js writes the captions and the audio-described soundtrack from
#     `text` and `narration` (`node scripts/song-video/render.js
#     invest_in_your_stories`). This song has no MP4: it plays only in the
#     live player, so render.js skips the frame capture;
#   - _includes/song-video.html prints every line with its `visual`
#     description as the on-page transcript (WCAG 1.2.1 / 1.2.3);
#   - each section's `narration` is spoken in the audio-described track,
#     where the picture holds at the start of the section while the narrator
#     describes what it shows (extended audio description, WCAG 1.2.5).
# Editing text or descriptions here updates the transcript and the player on
# the next Jekyll build, but the captions and described audio only after
# re-running render.js.
#
# Times are seconds into the Suno take, normalized to -16 LUFS. Line
# boundaries and word marks come from local Whisper word timestamps (mlx
# whisper-large-v3-turbo) aligned to the lyric sheet, with prompted clip
# passes for the choruses, letter openings, and quiz answers. Captions follow
# the recording, which differs from the lyric sheet: the chorus sings
# "S! The smallest slice" and "T! Given, When, Then" without the words Small
# and Testable, and verse 3 opens Small with "It fits in a single sprint" and
# Testable with "How do we know?". The letter tiles still show every term.

title: "Invest in Your Stories: a song about user stories and INVEST"   # the player's accessible name
credit: Lyrics written for this chapter; music and vocals generated with Suno.
student:
  laptop_logo: /assets/icons/story-card/story-card.svg
extras:   # the song's own art and styles, loaded before its choreography
  styles:
    - /css/song-video-story-kit.css
  scripts:
    - /js/song-video/story-kit.js
player: /assets/song-player/invest-in-your-stories.html
captions: /assets/audio/invest-in-your-stories.vtt
described_captions: /assets/audio/invest-in-your-stories-described.vtt
soundtrack: assets/audio/invest-in-your-stories.m4a   # repo path, played by the live player
described_soundtrack: assets/audio/invest-in-your-stories-described.m4a
described_timeline: /assets/audio/invest-in-your-stories-described.json
narrator:
  voice: Samantha   # macOS `say` voice for the audio-described track
  rate: 205         # words per minute
  pronounce:        # how the narrator says notation the captions keep as written
    INVEST: invest
    HTTPS: H T T P S
    TA: T A
    CS 35L: C S 35 L
    QR: Q R
width: 1920
height: 1080
fps: 30
duration: 266.01
beats:
  bpm: 94.96   # fitted with librosa to the take's beats from verse 1 on
  first: 0.108

