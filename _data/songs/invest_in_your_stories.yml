sections:
  - id: intro
    title: "Intro"
    delivery: spoken
    narration: "Audio-described version: before each section, the picture pauses while I describe it. The intro: your hero codes on demo day, and a test bar fills to 128 of 128 tests passed. A user says: Cool… but that's not what I needed, and a stamp reads wrong thing. Stickers follow: built it right, beside the tests, and not the right thing, beside the user. Then a blank ruled story card asks: what should we build?"
    lines:
      - id: intro-1
        start: 0.0
        end: 0.82
        text: "It’s demo day."
        marks: {"its": 0.0, "demo": 0.3, "day": 0.58}
        visual: "Your hero, or the default Bruin, types at a laptop; big type reads “Demo day”."
      - id: intro-2
        start: 1.52
        end: 4.74
        text: "Your app works perfectly. Every test is green."
        marks: {"your": 1.52, "app": 2.0, "works": 2.26, "perfectly": 2.58, "every": 3.84, "test": 3.98, "is": 4.24, "green": 4.46}
        visual: "A test bar fills to “128 / 128 tests passed”, all green, and a green sticker reads “Works perfectly”."
      - id: intro-3
        start: 5.06
        end: 8.82
        text: "And the user says: “Cool… but that’s not what I needed.”"
        marks: {"and": 5.06, "the": 5.44, "user": 5.58, "says": 5.82, "cool": 6.46, "but": 7.56, "thats": 8.04, "not": 8.24, "what": 8.34, "i": 8.48, "needed": 8.58}
        visual: "A user’s speech bubble: “Cool… but that’s not what I needed.” A red stamp lands: “Wrong thing”."
      - id: intro-4
        start: 10.16
        end: 13.48
        text: "Green tests prove we built it right — not that we built the right thing."
        marks: {"green": 10.16, "tests": 10.54, "prove": 10.86, "we": 11.18, "built": 11.38, "it": 11.64, "right": 11.78, "not": 12.24, "that": 12.42, "we_2": 12.56, "built_2": 12.66, "the": 12.88, "right_2": 13.0, "thing": 13.16}
        visual: "A green sticker, “built it right”, appears beside the test bar, and a red one, “not the right thing”, beside the user’s bubble."
      - id: intro-5
        start: 13.84
        end: 17.98
        text: "So before we write a single line, let’s find out what to build."
        marks: {"so": 13.84, "before": 14.12, "we": 14.34, "write": 14.54, "a": 14.72, "single": 14.86, "line": 15.12, "lets": 15.72, "find": 16.48, "out": 16.68, "what": 16.94, "to": 17.42, "build": 17.58}
        visual: "A blank ruled index card titled “User story” drops in, with empty lines for As a, I want, so that, and Given, When, Then; a gold note asks “What should we build?”, and a sticker reads “not a single line yet”."
  - id: verse-1
    title: "Verse 1"
    delivery: sung
    narration: "Verse 1, why user stories. Notes for who, what, and why pop up; how is parked for later. Then one ruled story card stays all verse: As a user, I want to see my car on a map, so that I can see my car. Jargon chips fall off it: in their own plain words, a ticket to talk. User is struck out; name tags show a rider and a driver seeing different things, and the card now says rider. The I want line is marked the need and the so that line the real why; novelty glasses mock the so that, the same feature in disguise, until it's rewritten: so that I'm outside when it pulls up. Then acceptance criteria fill the card's lines: Given I booked a ride, When my driver is on the way, Then I see the car and minutes away, with a check: done means the criteria pass, clear enough to test, but not the code you run."
    lines:
      - id: verse-1-1
        start: 18.26
        end: 20.8
        text: "Before you ask how, ask who, what, and why,"
        marks: {"before": 18.26, "you": 18.66, "ask": 18.82, "how": 19.14, "ask_2": 19.42, "who": 19.68, "what": 20.06, "and": 20.2, "why": 20.48}
        visual: "Three notes pop up on their words: “Who?”, “What?”, “Why?”; a grey “How?” note slides aside under a sticker: “later”."
