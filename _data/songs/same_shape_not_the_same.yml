# Storyboard for "Same Shape, Not the Same", the design patterns song: a
# short hip-hop musical about patterns that share a class diagram but solve
# different problems (lyrics, review, and Suno brief: design_patterns_rap.md).
#
# This file is the single source of truth for the song's words and timing:
#   - js/song-video/songs/same_shape_not_the_same.js choreographs the live
#     vector player (/assets/song-player/same-shape-not-the-same.html) against
#     each line's `start` and its `marks` (the times of the words the visuals
#     hit). The cast are the singers of js/song-video/opera-cast.js on the
#     Broadway stage of js/song-video/review-stage.js; ArchUML
#     (js/ArchUML/uml-bundle.js) draws every pattern's class or state diagram
#     through js/song-video/model-kit.js, and js/song-video/pattern-kit.js
#     draws the app screens, name plates, price tags, verdict cards, and quiz;
#   - render.js writes the captions and the audio-described soundtrack from
#     `text`, `answer`, and `narration`. This song has no MP4: it plays only
#     in the live player;
#   - the player page prints every line with its `visual` description as the
#     transcript (WCAG 1.2.1 / 1.2.3), and each section's `narration` is
#     spoken in the audio-described track (WCAG 1.2.5).
# Each section names its singer (`voice`), so the captions and transcript say
# who sings: the Intern, the Lead, the six patterns, or the Crowd.
#
# Times are seconds into the Suno take "Same Shape, Not the Same" (about 92
# BPM), decoded, normalized to -16 LUFS, and stored as stereo AAC at 160 kb/s
# with its index first. Line boundaries and word marks come from local Whisper
# word timestamps (mlx whisper-large-v3-turbo) aligned to the lyric sheet:
# 748 of 765 sheet words matched, and the rest are interpolated between their
# neighbours. Captions follow the sheet, which the take sings as written;
# Whisper's mishearings ("Stay" for "State", "same trick" for "same trip")
# are its own. The take sings each quiz answer right after its question, so
# each `pause_at` sits just before the answer. Beats were tracked with librosa
# on the percussion and smoothed over ±5 beats.

title: "Same Shape, Not the Same: a song about design patterns"   # the player's accessible name
credit: Lyrics written for this page; music and vocals generated with Suno.
theme: review-stage   # stage look: the Broadway stage of js/song-video/review-stage.js
extras:   # the song's own art and styles, loaded before its choreography
  styles:
    - /css/song-video-review-stage.css
    - /css/song-video-opera-cast.css
    - /css/song-video-model-kit.css
    - /css/song-video-pattern-kit.css
  scripts:
    - /js/song-video/review-stage.js
    - /js/song-video/figure-geometry.js
    - /js/song-video/opera-cast.js
    - /js/ArchUML/uml-bundle.js
    - /js/song-video/model-kit.js
    - /js/song-video/pattern-kit.js
# ArchUML views the choreography draws: each pattern's structure and the
# look-alikes the song compares. The build draws them into the player page
# (_plugins/song_diagrams.rb), so the browser doesn't route their connectors
# while the player loads. ArchUML stacks a class chain top to bottom.
diagrams:
  status_twin:
    kind: class
    spec: |
      @startuml
      layout vertical
      class Order
      interface OrderStatus
      class Placed
      class Cooking
      Order o--> OrderStatus
      Placed ..|> OrderStatus
      Cooking ..|> OrderStatus
      @enduml
  split_twin:
    kind: class
    spec: |
      @startuml
      layout vertical
      class Checkout
      interface SplitRule
      class Even
      class ByItem
      Checkout o--> SplitRule
      Even ..|> SplitRule
      ByItem ..|> SplitRule
      @enduml
  payment:
    kind: class
    spec: |
      @startuml
      layout vertical
      class Checkout
      interface Payment {
        + pay(total)
      }
      class CardPayment
      class WalletPayment
      Checkout --> Payment
      CardPayment ..|> Payment
      WalletPayment ..|> Payment
      @enduml
  split:
    kind: class
    spec: |
      @startuml
      layout vertical
      class Checkout
      interface SplitRule {
        + split(bill)
      }
      class Even
      class ByItem
      class OneTreats
      Checkout o--> SplitRule
      Even ..|> SplitRule
      ByItem ..|> SplitRule
      OneTreats ..|> SplitRule
      @enduml
  split_grown:   # `split` after the new rule
    kind: class
    spec: |
      @startuml
      layout vertical
      class Checkout
      interface SplitRule {
        + split(bill)
      }
      class Even
      class ByItem
      class OneTreats
      class ByPercent
      Checkout o--> SplitRule
      Even ..|> SplitRule
      ByItem ..|> SplitRule
      OneTreats ..|> SplitRule
      ByPercent ..|> SplitRule
      @enduml
  stage:
    kind: class
    spec: |
      @startuml
      layout vertical
      class Order
      interface Stage
      class Placed
      class Cooking
      class OnTheWay
      Order o--> Stage
      Placed ..|> Stage
      Cooking ..|> Stage
      OnTheWay ..|> Stage
      @enduml
  stage_machine:
    kind: state
    spec: |
      @startuml
      [*] --> Placed
      Placed --> Cooking : kitchen starts
      Cooking --> OnTheWay : driver picks up
      @enduml
  adapter:
    kind: class
    spec: |
      @startuml
      layout vertical
      interface Kitchen {
        + send(order)
      }
      class TabletAdapter {
        + send(order)
      }
      class Tablet {
        + ticket(cents)
      }
      TabletAdapter ..|> Kitchen
      TabletAdapter --> Tablet : converts
      @enduml
  tangle:
    kind: class
    spec: |
      @startuml
      layout vertical
      class Phone
      class Web
      class Payment
      class Kitchen
      class Driver
      class Receipt
      Phone --> Payment
      Phone --> Kitchen
      Phone --> Driver
      Phone --> Receipt
      Web --> Payment
      Web --> Kitchen
      Web --> Driver
      Web --> Receipt
      @enduml
  facade:
    kind: class
    spec: |
      @startuml
      layout vertical
      class Phone
      class Web
      class OrderFacade
      class Payment
      class Kitchen
      class Driver
      class Receipt
      Phone --> OrderFacade
      Web --> OrderFacade
      OrderFacade --> Payment
      OrderFacade --> Kitchen
      OrderFacade --> Driver
      OrderFacade --> Receipt
      @enduml
  observer:
    kind: class
    spec: |
      @startuml
      layout vertical
      class Order
      interface Observer {
        + update(status)
      }
      class Phone
      class Tablet
      class DriverApp
      Order o--> Observer : followers
      Phone ..|> Observer
      Tablet ..|> Observer
      DriverApp ..|> Observer
      @enduml
  observer_grown:   # `observer` after the watch subscribes
    kind: class
    spec: |
      @startuml
      layout vertical
      class Order
      interface Observer {
        + update(status)
      }
      class Phone
      class Tablet
      class DriverApp
      class Watch
      Order o--> Observer : followers
      Phone ..|> Observer
      Tablet ..|> Observer
      DriverApp ..|> Observer
      Watch ..|> Observer
      @enduml
  mesh:
    kind: class
    spec: |
      @startuml
      layout vertical
      class Kitchen
      class Drivers
      class Customer
      Kitchen --> Drivers
      Drivers --> Customer
      Customer --> Kitchen
      Kitchen --> Customer
      Drivers --> Kitchen
      @enduml
  hub:
    kind: class
    spec: |
      @startuml
      layout vertical
      class Kitchen
      class Drivers
      class Customer
      class DispatchHub {
        + notify(event)
      }
      Kitchen --> DispatchHub
      Drivers --> DispatchHub
      Customer --> DispatchHub
      @enduml
  exporter:   # the first format
    kind: class
    spec: |
      @startuml
      layout vertical
      class Exporter
      interface Format {
        + write(report)
      }
      class CSV
      Exporter --> Format
      CSV ..|> Format
      @enduml
  exporter_grown:   # three formats, when the pattern has earned its place
    kind: class
    spec: |
      @startuml
      layout vertical
      class Exporter
      interface Format {
        + write(report)
      }
      class CSV
      class PDF
      class Excel
      Exporter --> Format
      CSV ..|> Format
      PDF ..|> Format
      Excel ..|> Format
      @enduml
