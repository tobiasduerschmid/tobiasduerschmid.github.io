  - id: strategy
    title: "Round 1: Strategy"
    delivery: sung
    voice: "Strategy"
    narration: "Round 1. Strategy sings; the marquee reads Strategy. A phone shows the app's Split the check sheet with three options, beside a sixty-dollar bill for three friends split each way. Then a class diagram: Checkout holds an interface, SplitRule, with Even, ByItem, and OneTreats; a token runs from Checkout toward the picked class, ByItem. A new class, ByPercent, joins, and a badge says checkout.py, zero lines changed. Strategy's roast hangs a price tag on State: stages know each other."
