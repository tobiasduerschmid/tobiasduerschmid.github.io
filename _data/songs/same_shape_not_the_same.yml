sections:
  - id: intro
    title: "Intro"
    delivery: spoken
    voice: "Intern"
    narration: "Audio-described version: before each section, the picture pauses while I describe it. The song is a hip-hop musical on a Broadway stage: a gold proscenium, red velvet drapes, footlights, and a big screen upstage under a lit marquee. The intro: the intern, your own hero in a blue hoodie, opens a pull request titled Order status: Strategy pattern, with a class diagram of Order and its status classes. The tech lead, in a blazer, comments: That's not Strategy. That's State. A Strategy diagram appears beside it: the same boxes and arrows."
    lines:
      - id: intro-1
        start: 1.32
        end: 4.62
        text: "Internship, week one: a food-delivery app."
        marks: {"internship": 1.32, "week": 2.1, "one": 2.54, "a": 3.1, "food": 3.56, "delivery": 3.84, "app": 4.26}
        visual: "Lights up on a Broadway stage: gold proscenium, red velvet drapes, footlights, and a big screen upstage under a lit marquee reading “Same shape”. The intern, your own SE Gym hero in a blue hoodie, walks in from the left. The screen shows the app's splash card: “Night Bites · Late-night food delivery”."
      - id: intro-2
        start: 5.1
        end: 7.04
        text: "I know all twenty-three patterns!"
        marks: {"i": 5.1, "know": 5.64, "all": 5.78, "twenty": 6.02, "three": 6.02, "patterns": 6.48}
        visual: "The intern thumps their chest. A gold card pops up beside the splash: “23 / 23 patterns”."
      - id: intro-3
        start: 7.44
        end: 10.52
        text: "First PR: \"Order status, Strategy pattern.\""
        marks: {"first": 7.44, "pr": 7.72, "order": 8.7, "status": 8.88, "strategy": 9.66, "pattern": 10.12}
        visual: "The screen opens a pull request: “#1 by intern · Order status: Strategy pattern”, with an ArchUML class diagram: Order holds an «interface» OrderStatus, which Placed and Cooking realize."
      - id: intro-4
        start: 11.36
        end: 12.46
        text: "Review comes back:"
        marks: {"review": 11.36, "comes": 11.86, "back": 12.16}
        visual: "The tech lead, in a blazer, walks in from the right, and a review card appears beside the PR: “Lead commented”."
      - id: intro-5
        voice: "Lead"
        start: 12.7
        end: 14.62
        text: "That's not Strategy. That's State."
        marks: {"thats": 12.7, "not": 13.12, "strategy": 13.26, "thats_2": 14.06, "state": 14.34}
        visual: "The comment reads “That's not Strategy.”, then, larger, “That's State.” The lead points at the PR, and “Strategy” in its title is struck through."
      - id: intro-6
        voice: "Lead"
        start: 15.26
        end: 18.24
        text: "Same shape, sure. But not the same."
        marks: {"same": 15.26, "shape": 15.82, "sure": 16.54, "but": 17.24, "not": 17.6, "the": 17.76, "same_2": 17.92}
        visual: "The comment gives way to a second class diagram titled “A Strategy”: Checkout holds an «interface» SplitRule, which Even and ByItem realize. A gold sticker on the floor reads “Same boxes, same arrows”, and a red stamp lands on the PR: “Changes requested”."
  - id: verse-1
    title: "Verse 1: what a pattern is"
    delivery: sung
    voice: "Lead"
    narration: "Verse 1, sung by the lead. The marquee reads Design patterns. Three apps share one problem, and one name sums up the plan: Observer. Copy-paste code is crossed out; a card of roles gets a price tag. A class diagram shows Checkout using an interface, Payment, with two payment classes behind it that are likely to change, while Checkout stays the same. Then the Strategy and State diagrams stand side by side: the boxes show how; the problem gives the name."
    lines:
      - id: verse-1-1
        start: 20.38
        end: 23.14
        text: "A pattern's a fix for a problem that comes back,"
        marks: {"a": 20.38, "patterns": 20.94, "a_2": 21.36, "fix": 21.48, "for": 21.7, "a_3": 21.96, "problem": 22.16, "that": 22.4, "comes": 22.56, "back": 22.82}
        visual: "The marquee lights up: “Design patterns”. On the screen, three app cards (Food app, Music app, Game) each show the same problem: “When this changes, tell the others.”"
      - id: verse-1-2
        start: 23.28
        end: 25.54
        text: "named, so one word gives the team the plan of attack,"
        marks: {"named": 23.28, "so": 23.52, "one": 23.56, "word": 23.74, "gives": 24.12, "the": 24.24, "team": 24.38, "the_2": 24.64, "plan": 24.84, "of": 25.08, "attack": 25.22}
        visual: "Below them, a card titled “One name for the whole plan” reads “Observer” and “problem · roles · price”. The lead presents it."
      - id: verse-1-3
        start: 25.76
        end: 28.1
        text: "not code to copy: roles, and a price to track."
        marks: {"not": 25.76, "code": 25.88, "to": 26.36, "copy": 26.46, "roles": 26.74, "and": 27.1, "a": 27.32, "price": 27.46, "to_2": 27.7, "track": 27.9}
        visual: "A copy_paste.py code card is struck through; a Roles card appears (“who holds what”, “who calls whom”) with a price tag hanging from it: “+ classes · + hops to trace”."
      - id: verse-1-4
        start: 28.14
        end: 30.82
        text: "Lots of patterns hide the part that's likely to change"
        marks: {"lots": 28.14, "of": 28.6, "patterns": 28.76, "hide": 29.08, "the": 29.26, "part": 29.42, "thats": 29.66, "likely": 29.94, "to": 30.32, "change": 30.52}
        visual: "An ArchUML class diagram: Checkout uses an «interface» Payment with pay(total), realized by CardPayment and WalletPayment. The two payment classes are ringed in amber: “likely to change”."
