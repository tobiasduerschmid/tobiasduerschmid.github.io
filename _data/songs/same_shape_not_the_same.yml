        visual: "Two class diagrams stand side by side, titled Strategy and State: Checkout holds an «interface» SplitRule realized by Even and ByItem; Order holds an «interface» OrderStatus realized by Placed and Cooking. The same shape."
      - id: verse-1-7
        start: 36.1
        end: 40.12
        text: "the boxes show how; the problem gives the name."
        marks: {"the": 36.1, "boxes": 36.36, "show": 36.78, "how": 37.12, "the_2": 37.54, "problem": 37.82, "gives": 38.36, "the_3": 38.82, "name": 38.98}
        visual: "Stickers land on the floor below: “The boxes show how” and, in gold, “The problem gives the name”. The lead raises both arms; the intern gives a thumbs-up."
  - id: chorus-1
    title: "Chorus"
    delivery: sung
    voice: "Crowd"
    narration: "Chorus. The words Same shape? Not the same! What's it for? That's the name! slam onto the screen. Then a boxing card: Round 1, Strategy versus State. Twins in identical rust hoodies walk in under glowing name plates, Strategy on the left and State on the right."
    lines:
      - id: chorus-1-1
        start: 41.12
        end: 43.32
        text: "Same shape? Not the same!"
        marks: {"same": 41.12, "shape": 41.64, "not": 42.42, "the": 42.8, "same_2": 43.02}
