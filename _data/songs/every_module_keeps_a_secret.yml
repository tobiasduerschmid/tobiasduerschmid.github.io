        marks: {"not": 116.02, "by": 116.18, "the": 116.38, "steps": 116.52, "it": 116.9, "runs": 117.12, "first": 117.68, "this": 117.9, "then": 118.48, "that": 118.54}
        visual: "A flowchart of steps rides a conveyor belt as icon cards (1 · Read input → 2 · Process → 3 · Print), then a red stamp: “Not by steps”."
      - id: pre-chorus-1-3
        start: 118.82
        end: 123.22
        text: "In 1972, David Parnas wrote:"
        marks: {"in": 118.82, "1972": 119.18, "david": 121.34, "parnas": 122.14, "wrote": 122.82}
        visual: "In a searchlight, a paper-clipped card: Communications of the ACM · December 1972, “On the Criteria To Be Used in Decomposing Systems into Modules”, David L. Parnas · Carnegie-Mellon University, Vol. 15, No. 12 · pp. 1053–1058."
  - id: chorus-1
    title: "Chorus"
    delivery: sung
    narration: "The chorus: a teleprinter sheet decrypts Parnas’s sentence line by line, with difficult design decisions marked gold and likely to change marked cyan. Three case files, Dates, PaymentGateway, and UserRepository, each get a sealed top secret envelope, red laser walls switch on between them, and a decrypted stamp lands. Then one module, Dates, is a steel vault: its brass nameplate, the interface, reads year of date; its X-ray window shows the secret, how the year is stored. The dial spins and the secret changes from 85 to 1985, the nameplate stays the same, the callers stay unchanged, and a stamp says only one module changed."
    lines:
      - id: chorus-1-1
        start: 125.0
        end: 127.46
        text: "We propose that one begins"
        marks: {"we": 125.0, "propose": 125.68, "that": 126.22, "one": 126.52, "begins": 126.86}
        visual: "A cream teleprinter sheet headed “On the Criteria To Be Used in Decomposing Systems into Modules · CACM · 1972” decrypts its first line from scrambled letters as it is sung: “We propose that one begins”."
