        start: 79.38
        end: 81.72
        text: "Apollo’s code, printed out,"
        marks: {"apollos": 79.38, "code": 80.22, "printed": 80.62, "out": 81.16}
        visual: "Bound software listings stand beside a vector portrait based on the 1969 photograph of Margaret Hamilton. The record reads “Apollo 11 · 1969”, “≈80,000 lines of code”, and “Command + lunar modules; comments excluded”. This rounded count excludes blank lines too; it is not a count of every page in the photographed stack."
