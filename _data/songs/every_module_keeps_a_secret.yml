    narration: "Verse 2, the PayPal tangle. Your hero builds a store with three service case files, OrderService, RefundService, and WalletService; pink couriers carry envelopes from each straight to the PayPal SDK, and each holds the same sealed PayPal decision envelope. The boss says we’re switching to Stripe, and an intercept console finds PayPal everywhere. Then the tangle disappears: a gold PaymentGateway interface badge with charge and refund sits between the services and the provider, and the services' couriers now carry their envelopes, along arrows, to the badge. A suave secret agent in a dinner jacket and bow tie, martini in hand, appears in a spotlight and says: Gateway, Payment Gateway. He is Agent 007, the Payment Gateway, and his secret is which provider. Only a PayPalGateway file below it holds the PayPal secret; a dashed line ending in a hollow triangle shows that it implements the interface, and an arrow carries its calls to PayPal. A StripeGateway plugs in beside it with its own dashed implements line, and all three services stay unchanged."
