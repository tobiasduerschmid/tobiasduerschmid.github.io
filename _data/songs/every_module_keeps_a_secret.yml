# Storyboard for "Every Module Keeps a Secret", the information hiding song
# on the SE Book page SEBook/designprinciples/informationhiding.md (embedded
# with _includes/song-video.html).
#
# This file is the single source of truth for the song's words and timing:
#   - js/song-video/songs/every_module_keeps_a_secret.js choreographs the
#     live vector player (/assets/song-player/every-module-keeps-a-secret.html)
#     against each line's `start` and its `marks` (the times of the words the
#     visuals hit), with the artwork in js/song-video/ih-kit.js;
#   - render.js writes the captions and the audio-described soundtrack from
#     `text` and `narration` (`node scripts/song-video/render.js
#     every_module_keeps_a_secret`). This song has no MP4: it plays only in
#     the live player, so render.js skips the frame capture;
#   - _includes/song-video.html prints every line with its `visual`
#     description as the on-page transcript (WCAG 1.2.1 / 1.2.3);
#   - each section's `narration` is spoken in the audio-described track,
#     where the picture holds at the start of the section while the narrator
#     describes what it shows (extended audio description, WCAG 1.2.5).
# Editing text or descriptions here updates the transcript and the player on
# the next Jekyll build, but the captions and described audio only after
# re-running render.js.
#
# Times are seconds into the Suno take, normalized to -16 LUFS. Line
# boundaries and word marks come from local Whisper word timestamps (mlx
# whisper-large-v3-turbo) aligned to the lyric sheet; clip-level passes cover
# the final chorus tag and the last quiz answer. Captions follow the
# recording, which differs from the lyric sheet in a few places: choruses 2
# and 3 sing "Each module has been designed … from the other", and the
# choruses add echoes ("From the others!", "but keep the what!"). The quote
# card on screen always shows Parnas's own sentence.

title: "Every Module Keeps a Secret: a song about information hiding"   # the player's accessible name
credit: Lyrics written for this chapter; music and vocals generated with Suno.
student:
  laptop_logo: /assets/icons/iceberg/iceberg.svg
theme: spy   # stage look: the noir operations room of js/song-video/spy-noir.js
extras:   # the song's own art and styles, loaded before its choreography
  styles:
    - /css/song-video-spy-noir.css
    - /css/song-video-ih-kit.css
    - /css/song-fireworks.css
  scripts:
    - /js/song-video/spy-noir.js
    - /js/song-video/ih-kit.js
    - /js/song-video/fireworks.js
player: /assets/song-player/every-module-keeps-a-secret.html
captions: /assets/audio/every-module-keeps-a-secret.vtt
described_captions: /assets/audio/every-module-keeps-a-secret-described.vtt
soundtrack: assets/audio/every-module-keeps-a-secret.m4a   # repo path, played by the live player
described_soundtrack: assets/audio/every-module-keeps-a-secret-described.m4a
described_timeline: /assets/audio/every-module-keeps-a-secret-described.json
narrator:
  voice: Samantha   # macOS `say` voice for the audio-described track
  rate: 205         # words per minute
  pronounce:        # how the narrator says notation the captions keep as written
    Y2K: Y 2 K
    YY: Y Y
    MongoDB: Mongo D B
    Supabase: soopa base
    PayPalCharge: PayPal charge
    PayPalAccount: PayPal account
    PayPalGateway: PayPal gateway
    StripeGateway: Stripe gateway
    PaymentGateway: payment gateway
    UserRepository: user repository
    OrderService: order service
    RefundService: refund service
    WalletService: wallet service
width: 1920
height: 1080
fps: 30
duration: 375.24
beats:
  bpm: 85.22   # fitted with librosa to the take's beats from verse 1 on
  first: 0.252

sections:
  - id: intro
    title: "Intro"
    delivery: spoken
    narration: "Audio-described version: before each section, the picture pauses while I describe it. The intro: a huge Y2K, then a red stamp, the bug. A memory chip with a price tag shows that memory was expensive, so the year 1985 loses its first two digits and only 85 is stored. A two-digit field rolls from 99 to 00, and a code card shows the computer reading 19 plus 00 as 1900. Another code card computes an age as 00 minus 85, which is minus 85 years old. Twelve programs, from payroll to grades, all carry the same two-digit year tag and turn red; a search for YY finds it in file after file. A clock turns over to January 1, 2000, celebratory fireworks bloom around it, almost nothing breaks, and an invoice totals billions of dollars. A case-file folder gives the title, Every module keeps a secret, while your hero sits at a laptop."
