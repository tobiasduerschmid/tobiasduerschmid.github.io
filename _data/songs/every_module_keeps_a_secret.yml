  - id: verse-2
    title: "Verse 2"
    delivery: sung
    narration: "Verse 2, the PayPal tangle. Your hero builds a store with three services, OrderService, RefundService, and WalletService; each calls the PayPal SDK directly and carries the same red PayPal decision tab. The boss says we’re switching to Stripe, and a search for PayPal finds it everywhere. Then the tangle disappears: a PaymentGateway interface with charge and refund sits between the services and the provider. Only a PayPalGateway module, below it, carries the PayPal secret. A StripeGateway plugs in beside it, and all three services stay unchanged."
