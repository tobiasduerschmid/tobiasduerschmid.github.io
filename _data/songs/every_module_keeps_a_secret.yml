        marks: {"back": 8.02, "in": 8.72, "the": 8.86, "sixties": 8.98, "memory": 9.74, "was": 10.0, "expensive": 10.3}
        visual: "A “1960s” label, a memory chip labeled 4 KB, and a red sticker: “Memory: $$$”."
      - id: intro-3
        start: 11.76
        end: 13.96
        text: "So programmers saved space:"
        marks: {"so": 11.76, "programmers": 12.46, "saved": 13.21, "space": 13.4}
        visual: "Four flip digits labeled “The year” read 1985; a red slash strikes out the 1 and the 9."
      - id: intro-4
        start: 14.34
        end: 16.98
        text: "they stored the year with just two digits."
        marks: {"they": 14.34, "stored": 15.05, "the": 15.2, "year": 15.38, "with": 15.64, "just": 15.88, "two": 16.16, "digits": 16.48}
        visual: "An arrow leads to a two-digit field labeled “What gets stored”: 85, and a green sticker: “2 digits saved”."
      - id: intro-5
