sections:
  - id: intro
    title: "Intro"
    delivery: spoken
    narration: "Audio-described version: before each section, the picture pauses while I describe it. The setting is a dark spy operations room with slow searchlights. It opens on a manila case file, number 001: Every module should keep a secret, a song about information hiding, stamped classified. The intro: a huge Y2K, then a red stamp, the most famous bug, as a beetle crawls in. A vintage 1960s mainframe has two large tape reels and a small enlarged cutaway of its core memory: rings threaded on crossing wires. Memory was expensive: dollar bills fly into its core memory. Split-flap digits for 1985 lose their first two digits, only 85 is stored, and a few bills drop back out of the memory. A two-digit field rolls from 99 to 00, and a green-phosphor terminal shows the computer reading 19 plus 00 as 1900, and a desk calendar tears from December 31, 1999 to January 1, 1900. Another terminal file computes an age as 00 minus 85, which is minus 85 years old, while a young man born in 85 rewinds into a teen, a kid, a baby, a newborn, an egg cell, and then a puff of smoke with a question mark. Twelve case files, from payroll to grades, all carry the same red YY secret tag and turn red; an intercept console searches for YY and finds it in file after file. A mission clock turns over to January 1, 2000, celebratory fireworks bloom around it, almost nothing breaks, and red dollar bills fly away from behind a classified expense sheet that totals billions of dollars, stamped paid. A case file gives the title, Every module should keep a secret, stamped top secret, while your hero sits at a laptop. Then the title shrinks into a corner and, as your hero watches, a spy caper plays: two module agents, case files in fedoras and sunglasses, tiptoe in and hide behind newspapers from a searchlight. Agent 007, the Payment Gateway, drops in upside down on a rope, backflips down, and builds a laser barrier between them and the rest of the system, then stands guard beside it. A nosy third agent tries to peek, gets zapped, and asks the gateway agent instead. Everyone says shh, the agent raises his martini, and the scene is stamped classified."
    lines:
      - id: intro-1
        start: 4.4
        end: 7.12
        text: "Y2K. Maybe the most famous bug."
        marks: {"y2k": 4.4, "maybe": 5.12, "the": 5.84, "most": 6.02, "famous": 6.24, "bug": 6.66}
        visual: "In a searchlight’s pool, huge gold “Y2K”. Below it a red stamp lands: “The most famous bug”, and a red beetle crawls in beside it."
      - id: intro-2
        start: 7.96
        end: 10.92
        text: "Back in the sixties, memory was expensive."
        marks: {"back": 7.96, "in": 8.68, "the": 8.82, "sixties": 8.94, "memory": 9.76, "was": 10.02, "expensive": 10.32}
        visual: "A vintage metal cabinet labeled “1960s mainframe” has two large tape reels. Beneath them, a small core-memory cutaway shows ferrite rings on crossing wires. Dozens of dollar bills fly into the mainframe’s core memory, which glows brighter as it fills: memory was expensive."
      - id: intro-3
        start: 11.68
        end: 13.52
        text: "So programmers saved space:"
        marks: {"so": 11.68, "programmers": 12.08, "saved": 12.62, "space": 12.98}
        visual: "Split-flap digits labeled “The year” read 1985; a red slash strikes out the 1 and the 9."
      - id: intro-4
        start: 13.88
        end: 16.6
        text: "they stored the year with just two digits."
        marks: {"they": 13.88, "stored": 14.6, "the": 14.88, "year": 15.04, "with": 15.26, "just": 15.46, "two": 15.72, "digits": 16.08}
        visual: "A courier carries an envelope along a gold route to a two-digit split-flap field labeled “What gets stored”: 85. A moment later a few bills drop out of the bottom of the core memory and fall away, and right beside them a green oval label reads “Success: Memory saved”."
      - id: intro-5
        start: 17.88
        end: 19.76
        text: "1985? Became “85.”"
        marks: {"1985": 17.88, "became": 18.56, "85": 19.24}
        visual: "The full year 1985 bumps beside the two-digit stored year, 85."
      - id: intro-6
        start: 20.54
        end: 23.52
        text: "Then comes the year 2000: “double-zero.”"
        marks: {"then": 20.54, "comes": 21.16, "the": 21.46, "year": 21.6, "2000": 21.78, "double": 22.8, "zero": 23.16}
        visual: "A big two-digit split-flap field, “Stored year”, reads 99 beside a “Year 2000” sticker, then rolls over to 00, turning red; a tear-off desk calendar shows DEC 31, 1999. For a moment a secret agent in a white dinner jacket, tagged “Agent 00”, steps in beside the 00 and raises his martini to it."
      - id: intro-7
        start: 24.1
        end: 26.52
        text: "And the computer reads it as… 1900."
        marks: {"and": 24.1, "the": 24.78, "computer": 24.86, "reads": 25.2, "it": 25.54, "as": 25.7, "1900": 25.88}
        visual: "A green-phosphor mainframe terminal: YEAR = 19 + \"00\" = 1900, with the 00 and the 1900 outlined in red; on “reads”, the calendar page starts tearing off to reveal JAN 1, 1900, with 1900 underlined in red, and a red stamp lands on “1900”: “1900?!”."
      - id: intro-8
        start: 27.24
        end: 30.06
        text: "Born in ’85? Zero minus 85:"
        marks: {"born": 27.24, "in": 27.74, "85": 27.9, "zero": 29.06, "minus": 29.26, "85_2": 29.58}
        visual: "A green-phosphor terminal file, AGE.CBL: BORN = 85, NOW = 00, AGE = NOW - BORN. Beside it stands a young man tagged “Born ’85”. On “zero minus”, he slowly dissolves backwards through life: a teen, then a kid."
      - id: intro-9
        start: 30.76
        end: 32.74
        text: "you’re negative 85 years old."
        marks: {"youre": 30.76, "negative": 31.28, "85": 31.6, "years": 32.08, "old": 32.36}
        visual: "The rewind continues: a baby with a pacifier, a swaddled newborn, a single egg cell, and then a puff of smoke with a big “?”. The last line reads = -85, outlined in red, and a stamp lands: “−85 years old?”."
      - id: intro-10
        start: 33.06
        end: 35.84
        text: "Nobody thought this code would still run in 2000."
        marks: {"nobody": 33.06, "thought": 33.58, "this": 33.8, "code": 34.02, "would": 34.34, "still": 34.54, "run": 34.8, "in": 35.06, "2000": 35.24}
        visual: "The puff and its “?” clear away, and on “Nobody” a thought bubble from a 1970s programmer appears: “This code will be replaced long before 2000.”"
      - id: intro-11
        start: 36.42
        end: 37.02
        text: "It did."
        marks: {"it": 36.42, "did": 36.78}
        visual: "A gold stamp: “Still running”."
      - id: intro-12
        start: 37.66
        end: 40.42
        text: "And the two-digit year wasn’t hidden in one module."
        marks: {"and": 37.66, "the": 38.34, "two": 38.46, "digit": 38.62, "year": 38.92, "wasnt": 39.12, "hidden": 39.46, "in": 39.66, "one": 39.82, "module": 40.02}
        visual: "Twelve manila case files appear in a grid (Payroll, Billing, Interest, Bookings, Reports, Pensions, Insurance, Loans, Taxes, Shipping, Inventory, Grades), and each gets the same red “YY” secret tag, with a red note: “Not hidden in one module”."
      - id: intro-13
        start: 40.7
        end: 42.88
        text: "It was copied into every calculation."
        marks: {"it": 40.7, "was": 41.16, "copied": 41.32, "into": 41.68, "every": 41.9, "calculation": 42.24}
        visual: "Every file is outlined in red one after another, and a red sticker reads “Copied into every calculation”."
      - id: intro-14
        start: 43.54
        end: 45.92
        text: "So engineers spent years hunting down"
        marks: {"so": 43.54, "engineers": 43.94, "spent": 44.34, "years": 44.74, "hunting": 45.14, "down": 45.52}
        visual: "A green-phosphor intercept console types the search \"YY\"."
      - id: intro-15
        start: 45.92
        end: 47.74
        text: "every line that touched a year."
        marks: {"every": 45.92, "line": 46.36, "that": 46.76, "touched": 46.96, "a": 47.26, "year": 47.44}
        visual: "Hits print from COBOL files (payroll.cbl, interest.cbl, billing.cbl, reports.cbl, bookings.cbl), each with YY highlighted, while a magnifying glass sweeps down them."
      - id: intro-16
        start: 48.24
        end: 50.96
        text: "Midnight came… and almost nothing broke,"
        marks: {"midnight": 48.24, "came": 48.92, "and": 49.52, "almost": 49.9, "nothing": 50.16, "broke": 50.62}
        visual: "A digital clock counts 23:59:5x on Dec 31, 1999, turns over to 00:00:00 on Jan 1, 2000 in gold, gold, teal, and rose fireworks bloom around the clock, and a green sticker reads “Almost nothing broke”."
      - id: intro-17
        start: 51.28
        end: 53.02
        text: "because they fixed it in time."
        marks: {"because": 51.28, "they": 51.88, "fixed": 52.02, "it": 52.4, "in": 52.56, "time": 52.72}
        visual: "A gold sticker: “Fixed in time”."
      - id: intro-18
        start: 53.78
        end: 55.72
        text: "The bill? Billions."
        marks: {"the": 53.78, "bill": 54.22, "billions": 55.0}
        visual: "On “Billions”, red dollar bills burst out from behind it and fly away off every edge of the frame. On it, a classified expense sheet, “Operation Y2K”: 1. Find every two-digit year; 2. Fix it, test it, ship it; Total: billions of dollars, and a red “Paid” stamp."
      - id: intro-19
        start: 56.54
        end: 60.78
        text: "Lesson one: every module should keep a secret."
        marks: {"lesson": 56.54, "one": 57.34, "every": 58.28, "module": 59.06, "should": 59.5, "keep": 60.0, "a": 60.22, "secret": 60.42}
        visual: "“Lesson one” in gold, then, in a searchlight, a manila case file titled “Every module should keep a secret”, subtitled “A secret is a design decision that might change.”, and a red “Top secret” stamp, beside your saved hero, or the default Bruin, at a laptop. On the next beat the case file glides and shrinks smoothly into the top-left corner, still readable, and the hero watches from the top-right corner through the instrumental’s spy caper: “Meanwhile, at Module HQ…”. Two module agents, manila case files with fedoras, sunglasses, and their sealed secret envelopes, tiptoe in one step per beat, and freeze behind newspapers with eyeholes when a searchlight sweeps in; one holds his upside down. A secret agent tagged “Agent 00”, the Payment Gateway, in a white dinner jacket with a martini, drops in on a rope and, hanging upside down, calmly straightens his bow tie; he rolls over to land in a crouch, sets a laser detector on the floor, flicks another up into place, and glides over to stand guard right beside the barrier, where he straightens his tie again. A nosy third agent sneaks up with a magnifying glass, the red laser beams snap on, ZAP!, and he hops back in a puff of smoke. So he asks properly: an envelope flies along an arrow over the barrier to Agent 00, who answers with a two-finger salute, and the snoop gives a thumbs-up. 00 twirls and buttons his jacket while the others put a finger to their lips, Shh…, then he raises his martini high with a wink, and a red CLASSIFIED stamp slams down."
  - id: verse-1
    title: "Verse 1"
    delivery: sung
    narration: "Verse 1, why it matters. A vector portrait recreates Margaret Hamilton’s 1969 pose beside the bound Apollo listings: long hair, round glasses, patterned dress, and one hand on the stack. Her record credits her as lead software engineer for Apollo’s onboard flight software at MIT. Apollo 11, 1969: about 80 thousand lines of code across the command and lunar modules, excluding comments and blank lines. Modern car, 2021: about 100 million lines across the vehicle, a Bosch estimate. The counts use different scopes, not a precise complexity ratio. A head opens like a hinged lid; three case files fit, then more cram in and papers burst out: no one can hold it all. On a detective’s corkboard, red string joins every pair of four pinned modules, 6 connections; eight modules make 28. When everything depends on everything, the strings pull taut, the cards tremble, and the whole board collapses into one Big Ball of Mud that lands with a splatter and stays beside the next scene. One changed file gets eleven more stamped hit, and stamping out one bug brings two more crawling in."
    lines:
      - id: verse-1-1
        start: 72.74
        end: 74.74
        text: "Apollo’s code, printed out,"
        marks: {"apollos": 72.74, "code": 73.4, "printed": 73.8, "out": 74.3}
        visual: "Bound software listings stand beside a vector portrait based on the 1969 photograph of Margaret Hamilton. On “printed”, she counts the listing: its 17 bound volumes light up gold one by one from the floor to her raised hand while a gold chip beside the stack ticks from 1 to 17 and the record counts up to “≈80,000 lines of code”. The record also reads “Apollo 11 · 1969” and “Command + lunar modules; comments excluded”. This rounded count excludes blank lines too; it is not a count of every page in the photographed stack."
      - id: verse-1-2
        start: 74.74
        end: 77.32
        text: "stood as tall as Margaret Hamilton."
        marks: {"stood": 74.74, "as": 75.2, "tall": 75.44, "as_2": 75.7, "margaret": 76.0, "hamilton": 76.48}
        visual: "The count reaches the top volume in her hand: the uneven stack is as tall as she is. Her record reads “Margaret Hamilton”, “Lead software engineer”, and “Apollo onboard flight software · MIT”. The portrait follows her long hair, wire glasses, smiling profile, patterned dress, raised hand, and buckled shoes in the 1969 reference photo."
      - id: verse-1-3
        start: 78.32
        end: 80.76
        text: "A modern car? A hundred million lines."
        marks: {"a": 78.32, "modern": 78.62, "car": 78.94, "a_2": 79.72, "hundred": 79.78, "million": 80.02, "lines": 80.36}
        visual: "A car appears beside “Modern car · 2021”, and a counter reaches “≈100,000,000 lines of code”. The figure is a Bosch estimate for a whole vehicle’s software, so it uses a different counting scope from the Apollo count; the comparison shows scale, not a precise ratio."
      - id: verse-1-4
        start: 80.76
        end: 83.48
        text: "We’re not a thousand times smarter than back then,"
        marks: {"were": 80.76, "not": 80.96, "a": 81.08, "thousand": 81.26, "times": 81.6, "smarter": 81.98, "than": 82.54, "back": 82.8, "then": 83.1}
        visual: "The Apollo and modern-car records stay visible. The car gives way to a head in profile; the top of its skull lifts open like a hinged lid, and three case files drop into the open head, all it can hold. A sticker reads “×1000 smarter? No.”"
      - id: verse-1-5
        start: 83.78
        end: 86.6
