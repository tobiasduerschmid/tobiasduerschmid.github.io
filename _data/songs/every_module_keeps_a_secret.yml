        visual: "The uneven stack reaches Hamilton’s height. Her record reads “Margaret Hamilton”, “Lead software engineer”, and “Apollo onboard flight software · MIT”. The portrait follows her long hair, wire glasses, smiling profile, patterned dress, raised hand, and buckled shoes in the 1969 reference photo."
