  - id: verse-1
    title: "Verse 1"
    delivery: sung
    narration: "Verse 1, why it matters. A vector portrait recreates Margaret Hamilton’s 1969 pose beside the bound Apollo listings: long hair, round glasses, patterned dress, and one hand on the stack. Her record credits her as lead software engineer for Apollo’s onboard flight software at MIT. Apollo 11, 1969: about 80 thousand lines of code across the command and lunar modules, excluding comments and blank lines. Modern car, 2021: about 100 million lines across the vehicle, a Bosch estimate. The counts use different scopes, not a precise complexity ratio. A head overflows with pages: no one can hold it all. Four modules with every connection drawn make 6 connections; eight make 28. When everything depends on everything, the web clumps into a Big Ball of Mud. One changed file turns eleven more red, and squashing one bug makes two more appear."
