        end: 20.48
        text: "1985? Just “85.”"
        marks: {"1985": 18.22, "just": 19.62, "85": 19.94}
        visual: "The full year 1985 bumps, then a note: 1985 → “85”."
      - id: intro-6
        start: 21.8
        end: 24.78
