# Storyboard for "Every Module Keeps a Secret", the information hiding song
# on the SE Book page SEBook/designprinciples/informationhiding.md (embedded
# with _includes/song-video.html).
#
# This file is the single source of truth for the song's words and timing:
#   - js/song-video/songs/every_module_keeps_a_secret.js choreographs the
#     live vector player (/assets/song-player/every-module-keeps-a-secret.html)
#     against each line's `start` and its `marks` (the times of the words the
#     visuals hit), with the artwork in js/song-video/ih-kit.js;
#   - render.js writes the captions and the audio-described soundtrack from
#     `text` and `narration` (`node scripts/song-video/render.js
#     every_module_keeps_a_secret`). This song has no MP4: it plays only in
#     the live player, so render.js skips the frame capture;
#   - _includes/song-video.html prints every line with its `visual`
#     description as the on-page transcript (WCAG 1.2.1 / 1.2.3);
#   - each section's `narration` is spoken in the audio-described track,
#     where the picture holds at the start of the section while the narrator
#     describes what it shows (extended audio description, WCAG 1.2.5).
# Editing text or descriptions here updates the transcript and the player on
# the next Jekyll build, but the captions and described audio only after
# re-running render.js.
#
# Times are seconds into the Suno take, normalized to -16 LUFS. Line
# boundaries and word marks come from local Whisper word timestamps (mlx
# whisper-large-v3-turbo) aligned to the lyric sheet; clip-level passes cover
# the final chorus tag and the last quiz answer. Captions follow the
# recording, which differs from the lyric sheet in a few places: choruses 2
# and 3 sing "Each module has been designed … from the other", and the
# choruses add echoes ("From the others!", "but keep the what!"). The quote
# card on screen always shows Parnas's own sentence.

title: "Every Module Keeps a Secret: a song about information hiding"   # the player's accessible name
credit: Lyrics written for this chapter; music and vocals generated with Suno.
student:
  laptop_logo: /assets/icons/iceberg/iceberg.svg
theme: spy   # stage look: the noir operations room of js/song-video/spy-noir.js
extras:   # the song's own art and styles, loaded before its choreography
  styles:
    - /css/song-video-spy-noir.css
    - /css/song-video-ih-kit.css
    - /css/song-fireworks.css
  scripts:
    - /js/song-video/spy-noir.js
    - /js/song-video/ih-kit.js
    - /js/song-video/fireworks.js
player: /assets/song-player/every-module-keeps-a-secret.html
captions: /assets/audio/every-module-keeps-a-secret.vtt
described_captions: /assets/audio/every-module-keeps-a-secret-described.vtt
soundtrack: assets/audio/every-module-keeps-a-secret.m4a   # repo path, played by the live player
described_soundtrack: assets/audio/every-module-keeps-a-secret-described.m4a
described_timeline: /assets/audio/every-module-keeps-a-secret-described.json
narrator:
  voice: Samantha   # macOS `say` voice for the audio-described track
  rate: 205         # words per minute
  pronounce:        # how the narrator says notation the captions keep as written
    Y2K: Y 2 K
    YY: Y Y
    MongoDB: Mongo D B
    Supabase: soopa base
    PayPalCharge: PayPal charge
    PayPalAccount: PayPal account
    PayPalGateway: PayPal gateway
    StripeGateway: Stripe gateway
    PaymentGateway: payment gateway
    UserRepository: user repository
    OrderService: order service
    RefundService: refund service
    WalletService: wallet service
width: 1920
height: 1080
fps: 30
duration: 375.24
beats:
  bpm: 85.22   # fitted with librosa to the take's beats from verse 1 on
  first: 0.252

sections:
  - id: intro
    title: "Intro"
    delivery: spoken
    narration: "Audio-described version: before each section, the picture pauses while I describe it. The setting is a dark spy operations room with slow searchlights. The intro: a huge Y2K, then a red stamp, the bug, as a beetle crawls in. A vintage 1960s mainframe has two large tape reels and a small enlarged cutaway of its core memory: rings threaded on crossing wires. Memory was expensive, so split-flap digits for 1985 lose their first two digits and only 85 is stored. A two-digit field rolls from 99 to 00, and a green-phosphor terminal shows the computer reading 19 plus 00 as 1900, and a desk calendar tears from December 31, 1999 to January 1, 1900. Another terminal file computes an age as 00 minus 85, which is minus 85 years old. Twelve case files, from payroll to grades, all carry the same red YY secret tag and turn red; an intercept console searches for YY and finds it in file after file. A mission clock turns over to January 1, 2000, celebratory fireworks bloom around it, almost nothing breaks, and a classified expense sheet totals billions of dollars, stamped paid. A case file gives the title, Every module keeps a secret, stamped top secret, while your hero sits at a laptop."
    lines:
      - id: intro-1
        start: 4.26
        end: 7.14
        text: "Y2K. No, not the aesthetic. The bug."
        marks: {"y2k": 4.26, "no": 5.16, "not": 5.72, "the": 5.98, "aesthetic": 6.12, "the_2": 6.76, "bug": 6.8}
        visual: "In a searchlight’s pool, huge gold “Y2K”. A pink sticker, “Not the aesthetic” (with a sparkle), gives way to a red “The bug” stamp as a red beetle crawls in."
      - id: intro-2
        start: 8.02
        end: 10.9
        text: "Back in the sixties, memory was expensive."
        marks: {"back": 8.02, "in": 8.72, "the": 8.86, "sixties": 8.98, "memory": 9.74, "was": 10.0, "expensive": 10.3}
        visual: "A vintage metal cabinet labeled “1960s mainframe” has two large tape reels. Beneath them, a small core-memory cutaway shows ferrite rings on crossing wires. Labels read “Core memory inside”, “Enlarged cutaway”, and “Memory was expensive”."
      - id: intro-3
        start: 11.76
        end: 13.96
        text: "So programmers saved space:"
        marks: {"so": 11.76, "programmers": 12.46, "saved": 13.21, "space": 13.4}
        visual: "Split-flap digits labeled “The year” read 1985; a red slash strikes out the 1 and the 9."
      - id: intro-4
        start: 14.34
        end: 16.98
        text: "they stored the year with just two digits."
        marks: {"they": 14.34, "stored": 15.05, "the": 15.2, "year": 15.38, "with": 15.64, "just": 15.88, "two": 16.16, "digits": 16.48}
        visual: "A courier carries an envelope along a gold route to a two-digit split-flap field labeled “What gets stored”: 85, and a green sticker reads “2 digits saved”."
      - id: intro-5
        start: 18.22
        end: 20.48
        text: "1985? Just “85.”"
        marks: {"1985": 18.22, "just": 19.62, "85": 19.94}
        visual: "The full year 1985 bumps beside the two-digit stored year, 85."
      - id: intro-6
        start: 21.8
        end: 24.78
        text: "Then comes the year 2000: “double-zero.”"
        marks: {"then": 21.8, "comes": 22.5, "the": 22.78, "year": 22.9, "2000": 23.08, "double": 24.08, "zero": 24.42}
        visual: "A big two-digit split-flap field, “Stored year”, reads 99 beside a “Year 2000” sticker, then rolls over to 00, turning red; a tear-off desk calendar shows DEC 31, 1999."
      - id: intro-7
        start: 25.38
        end: 27.9
        text: "And the computer reads it as… 1900."
        marks: {"and": 25.38, "the": 26.06, "computer": 26.14, "reads": 26.52, "it": 26.92, "as": 27.08, "1900": 27.26}
        visual: "A green-phosphor mainframe terminal: YEAR = 19 + \"00\" = 1900, with the 00 and the 1900 outlined in red; on “reads”, the calendar page starts tearing off to reveal JAN 1, 1900, with 1900 underlined in red, and a red stamp lands on “1900”: “1900?!”."
      - id: intro-8
        start: 28.54
        end: 31.98
        text: "Born in ’85? Zero minus 85:"
        marks: {"born": 28.54, "in": 29.12, "85": 29.32, "zero": 30.4, "minus": 31.08, "85_2": 31.48}
        visual: "A green-phosphor terminal file, AGE.CBL: BORN = 85, NOW = 00, AGE = NOW - BORN."
      - id: intro-9
        start: 32.66
        end: 35.02
        text: "you’re negative 85 years old."
        marks: {"youre": 32.66, "negative": 33.34, "85": 33.78, "years": 34.28, "old": 34.6}
        visual: "The last line reads = -85, outlined in red, and a stamp lands: “−85 years old”."
      - id: intro-10
        start: 35.02
        end: 38.88
        text: "Nobody thought this code would still run in 2000."
        marks: {"nobody": 35.02, "thought": 36.38, "this": 36.66, "code": 36.9, "would": 37.2, "still": 37.5, "run": 37.78, "in": 38.0, "2000": 38.2}
        visual: "A thought bubble from a 1970s programmer: “This code will be replaced long before 2000.”"
      - id: intro-11
        start: 39.6
        end: 40.54
        text: "It did."
        marks: {"it": 39.6, "did": 40.28}
        visual: "A gold stamp: “Still running”."
      - id: intro-12
        start: 41.58
        end: 44.64
        text: "And the two-digit year wasn’t hidden in one module."
        marks: {"and": 41.58, "the": 42.26, "two": 42.38, "digit": 42.56, "year": 42.9, "wasnt": 43.16, "hidden": 43.56, "in": 43.78, "one": 43.98, "module": 44.18}
        visual: "Twelve manila case files appear in a grid (Payroll, Billing, Interest, Bookings, Reports, Pensions, Insurance, Loans, Taxes, Shipping, Inventory, Grades), and each gets the same red “YY” secret tag, with a red note: “Not hidden in one module”."
      - id: intro-13
        start: 44.64
        end: 47.32
        text: "It was copied into every calculation."
        marks: {"it": 44.64, "was": 45.56, "copied": 45.7, "into": 46.06, "every": 46.3, "calculation": 46.62}
        visual: "Every file is outlined in red one after another, and a red sticker reads “Copied into every calculation”."
      - id: intro-14
        start: 48.02
        end: 50.56
        text: "So engineers spent years hunting down"
        marks: {"so": 48.02, "engineers": 48.7, "spent": 49.1, "years": 49.48, "hunting": 49.84, "down": 50.18}
        visual: "A green-phosphor intercept console types the search \"YY\"."
      - id: intro-15
        start: 50.56
        end: 52.72
        text: "every line that touched a year."
        marks: {"every": 50.56, "line": 51.32, "that": 51.72, "touched": 51.94, "a": 52.2, "year": 52.38}
        visual: "Hits print from COBOL files (payroll.cbl, interest.cbl, billing.cbl, reports.cbl, bookings.cbl), each with YY highlighted, while a magnifying glass sweeps down them."
      - id: intro-16
        start: 52.72
        end: 55.94
        text: "Midnight came… and almost nothing broke,"
        marks: {"midnight": 52.72, "came": 54.02, "and": 54.42, "almost": 54.96, "nothing": 55.22, "broke": 55.6}
        visual: "A digital clock counts 23:59:5x on Dec 31, 1999, turns over to 00:00:00 on Jan 1, 2000 in gold, gold, teal, and rose fireworks bloom around the clock, and a green sticker reads “Almost nothing broke”."
      - id: intro-17
        start: 55.94
        end: 58.18
        text: "because they fixed it in time."
        marks: {"because": 55.94, "they": 57.02, "fixed": 57.22, "it": 57.52, "in": 57.7, "time": 57.86}
        visual: "A gold sticker: “Fixed in time”."
      - id: intro-18
        start: 58.18
        end: 61.36
        text: "The bill? Billions."
        marks: {"the": 58.18, "bill": 59.34, "billions": 60.52}
        visual: "A classified expense sheet, “Operation Y2K”: 1. Find every two-digit year; 2. Fix it, test it, ship it; Total: billions of dollars, and a red “Paid” stamp."
      - id: intro-19
        start: 62.1
        end: 65.74
        text: "Lesson one: every module keeps a secret."
        marks: {"lesson": 62.1, "one": 62.94, "every": 63.62, "module": 64.32, "keeps": 64.72, "a": 65.12, "secret": 65.34}
        visual: "“Lesson one” in gold, then, in a searchlight, a manila case file titled “Every module keeps a secret”, subtitled “A secret is a design decision that might change.”, and a red “Top secret” stamp. Your saved hero, or the default Bruin, sits at a laptop with an iceberg emblem through the instrumental; the credit reads “SE Book · Information Hiding”."
  - id: verse-1
    title: "Verse 1"
    delivery: sung
    narration: "Verse 1, why it matters. A vector portrait recreates Margaret Hamilton’s 1969 pose beside the bound Apollo listings: long hair, round glasses, patterned dress, and one hand on the stack. Her record credits her as lead software engineer for Apollo’s onboard flight software at MIT. Apollo 11, 1969: about 80 thousand lines of code across the command and lunar modules, excluding comments and blank lines. Modern car, 2021: about 100 million lines across the vehicle, a Bosch estimate. The counts use different scopes, not a precise complexity ratio. A head opens like a hinged lid; three case files fit, then more cram in and papers burst out: no one can hold it all. On a detective’s corkboard, red string joins every pair of four pinned modules, 6 connections; eight modules make 28. When everything depends on everything, the strings pull taut, the cards tremble, and the whole board collapses into one Big Ball of Mud that lands with a splatter and stays beside the next scene. One changed file gets eleven more stamped hit, and stamping out one bug brings two more crawling in."
    lines:
      - id: verse-1-1
        start: 79.38
        end: 81.72
        text: "Apollo’s code, printed out,"
        marks: {"apollos": 79.38, "code": 80.22, "printed": 80.62, "out": 81.16}
        visual: "Bound software listings stand beside a vector portrait based on the 1969 photograph of Margaret Hamilton. The record reads “Apollo 11 · 1969”, “≈80,000 lines of code”, and “Command + lunar modules; comments excluded”. This rounded count excludes blank lines too; it is not a count of every page in the photographed stack."
      - id: verse-1-2
        start: 81.9
        end: 84.1
        text: "stood as tall as Margaret Hamilton."
        marks: {"stood": 81.9, "as": 82.02, "tall": 82.26, "as_2": 82.5, "margaret": 82.84, "hamilton": 83.38}
        visual: "The uneven stack reaches Hamilton’s height. Her record reads “Margaret Hamilton”, “Lead software engineer”, and “Apollo onboard flight software · MIT”. The portrait follows her long hair, wire glasses, smiling profile, patterned dress, raised hand, and buckled shoes in the 1969 reference photo."
      - id: verse-1-3
        start: 84.1
        end: 87.5
        text: "A modern car? A hundred million lines."
        marks: {"a": 84.1, "modern": 85.4, "car": 85.76, "a_2": 86.48, "hundred": 86.56, "million": 86.78, "lines": 87.14}
        visual: "A car appears beside “Modern car · 2021”, and a counter reaches “≈100,000,000 lines of code”. The figure is a Bosch estimate for a whole vehicle’s software, so it uses a different counting scope from the Apollo count; the comparison shows scale, not a precise ratio."
      - id: verse-1-4
        start: 87.5
        end: 90.16
        text: "We’re not a thousand times smarter than back then,"
        marks: {"were": 87.5, "not": 87.68, "a": 87.78, "thousand": 87.96, "times": 88.26, "smarter": 88.56, "than": 88.98, "back": 89.42, "then": 89.84}
        visual: "The Apollo and modern-car records stay visible. The car gives way to a head in profile; the top of its skull lifts open like a hinged lid, and three case files drop into the open head, all it can hold. A sticker reads “×1000 smarter? No.”"
      - id: verse-1-5
        start: 90.16
        end: 93.14
        text: "so no one holds the whole thing in their head."
        marks: {"so": 90.16, "no": 90.48, "one": 91.02, "holds": 91.4, "the": 91.76, "whole": 91.88, "thing": 92.06, "in": 92.3, "their": 92.52, "head": 92.72}
        visual: "With both code records still visible, a pink sticker reads “Too much for one head” as more files cram in, the lid rattles, papers keep bursting out of the top, steam puffs from the ear, a bead of sweat appears, and the brow turns worried."
      - id: verse-1-6
        start: 93.14
        end: 95.4
        text: "Four modules? Six connections."
        marks: {"four": 93.14, "modules": 93.54, "six": 94.4, "connections": 94.62}
        visual: "A framed corkboard labeled “Case: 4 modules” with four pinned cards (Cart, Order, Pay, Ship); red string joins every pair of pins, and a sticky note counts 6 connections."
      - id: verse-1-7
        start: 95.4
        end: 98.02
        text: "Eight modules? Twenty-eight."
        marks: {"eight": 95.4, "modules": 96.32, "twenty": 97.28, "eight_2": 97.52}
        visual: "A bigger corkboard, “Case: 8 modules”, adds Auth, Mail, Tax, and Stock; red string joins every pair, and the sticky note counts to 28 connections."
      - id: verse-1-8
        start: 98.02
        end: 101.04
        text: "Let every part depend on every other part,"
        marks: {"let": 98.02, "every": 98.34, "part": 98.62, "depend": 98.98, "on": 99.44, "every_2": 99.8, "other": 100.12, "part_2": 100.48}
        visual: "The eight-module board moves to the center under a red note: “everything depends on everything”. Its strings pull taut and the pinned cards tremble harder and harder."
      - id: verse-1-9
        start: 101.04
        end: 103.86
        text: "and you’ve built a Big Ball of Mud:"
        marks: {"and": 101.04, "youve": 101.88, "built": 102.26, "a": 102.5, "big": 102.64, "ball": 102.86, "of": 103.22, "mud": 103.46}
        visual: "The cards are yanked inward onto a sculpted ball of wet mud with layered folds and creases that grows beneath them. It lands with a squash and a wobble, mud splatters across the cork, the cards sink in, and the red strings end up wound into its surface. A stamp lands: “Big Ball of Mud”."
      - id: verse-1-10
        start: 103.86
        end: 106.86
        text: "change one thing, touch dozens of files;"
        marks: {"change": 103.86, "one": 104.68, "thing": 104.96, "touch": 105.46, "dozens": 105.74, "of": 106.16, "files": 106.36}
        visual: "The same ball of mud glides down and shrinks beside a “Big Ball of Mud” label as a grid of twelve source files arrives: auth.js is outlined gold and stamped “Changed”, then the other eleven are outlined red and stamped “Hit”, and a counter runs to 12 “files touched”."
      - id: verse-1-11
        start: 106.86
        end: 111.08
        text: "fix one bug, and two more appear."
        marks: {"fix": 106.86, "one": 107.48, "bug": 107.86, "and": 108.38, "two": 109.26, "more": 109.74, "appear": 110.44}
        visual: "The labeled mud ball remains beside the affected files while a beetle crawls in and a rubber stamp marked FIXED squashes it flat; two more beetles crawl in from the sides, and a red sticker reads “+2 bugs”."
  - id: pre-chorus-1
    title: "Pre-chorus"
    delivery: sung
    narration: "Pre-chorus: how to split a system. A flowchart of steps rides a conveyor belt, read, process, print, and gets a red stamp: not by steps. Then, in a searchlight, the title page of Parnas’s 1972 paper, On the Criteria To Be Used in Decomposing Systems into Modules."
    lines:
      - id: pre-chorus-1-1
        start: 112.26
        end: 115.64
        text: "So how do you split a system into modules?"
        marks: {"so": 112.26, "how": 112.94, "do": 113.16, "you": 113.32, "split": 113.56, "a": 114.0, "system": 114.44, "into": 114.76, "modules": 115.08}
        visual: "A heading: “How do you split a system into modules?”"
      - id: pre-chorus-1-2
        start: 116.02
        end: 118.82
