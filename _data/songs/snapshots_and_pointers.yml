      - id: intro-3
        start: 9.02
        end: 12.76
        text: "There's a better way: the software engineer's Time Stone."
        marks: {better: 9.54, time: 12.22}
        visual: "The pile spirals into a glowing green gem in a golden ring, the Time Stone, and “The software engineer’s Time Stone” appears under it."
      - id: intro-4
        start: 13.80
        end: 17.94
        text: "And here's how the magic works: snapshots… and pointers."
        marks: {magic: 14.78, snapshots: 16.88, pointers: 17.62}
        visual: "The Time Stone spins while “Snapshots” (with a camera icon) and “& pointers” (with a pointer icon) slam in."
