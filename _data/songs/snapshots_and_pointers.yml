    title: "Verse 1: Where your work lives"
    delivery: sung
    narration: "Verse 1 shows three panels: working tree, staging area, and repository, with a terminal in the corner. The terminal runs git add app.py, and a copy of the file flies into the staging area. Then git commit with the message Add login page, and a snapshot flies into the repository. Two more commits follow: Fix login bug, and Clean up styles. Last, git status shows a commit graph under three columns: untracked, not staged, and staged."
