    delivery: sung
    narration: "Verse 2 shows a snapshot card listing every file, with who, when, and why, and a frozen look. Its ID is a long hexadecimal hash, and changing one byte gives a different hash. In a commit graph, git commit --amend adds a new commit beside the old one and moves main to it; the old commit turns grey but stays. Then git log lists the commits newest first, and git show marks one line dropped and one line added. Last, two chat messages share the hash a3f2."
