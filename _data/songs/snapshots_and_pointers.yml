        start: 19.52
        end: 22.04
        text: "So let Git track your versions. First, the working tree:"
        marks: {git: 20.12, working: 21.54}
        visual: "Three panels line up: Working tree, Staging area, and Repository. The Working tree lights up."
      - id: verse-1-2
        start: 22.24
        end: 24.54
        text: "the files in your editor — what you type is what you see."
        marks: {files: 22.46, type: 23.72}
        visual: "File cards app.py v1 and README.md v1 appear in the Working tree; app.py’s badge flips to v2 under an “Edited” sticker."
      - id: verse-1-3
        start: 24.66
        end: 27.22
        text: "Next, the staging area: your next commit, lined up for the shot."
        marks: {staging: 25.02, next_2: 25.92, shot: 27.00}
        visual: "The Staging area lights up with camera-viewfinder corners and a “Next commit” sticker."
      - id: verse-1-4
        start: 27.38
        end: 29.60
        text: "It starts out as a copy of the last commit you've got;"
        marks: {copy: 28.16, last: 28.76}
        visual: "Snapshot C1, “Initial commit”, sits in the Repository; copies of app.py v1 and README.md v1 fly from it into the Staging area."
      - id: verse-1-5
        start: 29.70
        end: 32.26
        text: "git add copies in the new version of each file you choose —"
        marks: {add: 29.90, new: 30.74}
        visual: "Terminal: git add app.py. A copy of app.py v2 flies from the Working tree into the Staging area and replaces v1 there (“Copy”); the Working tree keeps its app.py v2."
      - id: verse-1-6
        start: 32.26
        end: 34.76
        text: "the rest stay as they were. That's what the next commit will use."
        marks: {rest: 32.56, next: 33.82}
        visual: "README.md v1 stays in the Staging area with an “Unchanged” sticker."
      - id: verse-1-7
        start: 34.71
        end: 37.36
        text: "git commit takes the picture of the staging area, just so,"
        marks: {commit: 34.96, picture: 35.44}
        visual: "Terminal: git commit -m \"Add login page\". A shutter blinks over the Staging area and snapshot C2 flies into the Repository."
      - id: verse-1-8
        start: 37.36
        end: 39.72
        text: "and stamps it with a message, so that future you will know."
        marks: {stamps: 37.58, future: 38.86}
        visual: "The message “Add login page” types onto snapshot C2."
      - id: verse-1-9
        start: 39.72
        end: 42.58
        text: "Fixed a bug and cleaned up, too? Stage the fix, commit, then the rest:"
        marks: {fixed: 39.72, cleaned: 40.46, stage: 41.32, commit: 41.90, rest: 42.40}
        visual: "auth.py (fix) and style.css (tidy) appear in the Working tree. Terminal: git add auth.py, then git commit -m \"Fix login bug\" (snapshot C3), then git add style.css."
      - id: verse-1-10
        start: 42.58
        end: 45.12
        text: "two small commits, one job each — that's the history that reads best."
        marks: {two: 42.58, one: 43.54, history: 44.24}
        visual: "Terminal: git commit -m \"Clean up styles\" (snapshot C4). Stickers under the Repository: “1 job each” and “Reads best”."
      - id: verse-1-11
        start: 45.12
        end: 47.56
        text: "Not sure what's where? Run git status — it lays it out for you:"
        marks: {run: 46.04, status: 46.28}
        visual: "Terminal: git status. The SE Book Git graph appears (C2, C3, C4, with HEAD and main on C4) under a status strip with Untracked, Not staged, and Staged columns."
      - id: verse-1-12
        start: 47.56
        end: 50.32
        text: "what's staged, what's changed but isn't staged, and which files are new."
        marks: {staged: 47.92, changed: 48.36, new: 50.12}
        visual: "Rows drop into the strip as they are sung: modified app.py under Staged, modified README.md under Not staged, then notes.txt under Untracked."
