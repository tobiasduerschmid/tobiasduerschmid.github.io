    title: "Intro"
    delivery: spoken
    narration: "Audio-described version: before each section, the video pauses while I describe what it shows. The intro: cards for files named homework_final.txt, homework_final_2.txt, and more pile up, then spiral into the Time Stone, a green gem in a golden ring, under the title Snapshots and pointers."
