# Storyboard for "Snapshots and Pointers", the Git song on the SE Book page
# SEBook/tools/git.md (embedded with _includes/song-video.html).
#
# This file is the single source of truth for the song's words and timing:
#   - scripts/song-video/songs/snapshots_and_pointers.js choreographs the
#     music video against each line's `start` and its `marks` (the times of
#     the words the visuals hit), and render.js renders the MP4 and writes the
#     captions file from `text` (re-render everything with
#     `node scripts/song-video/render.js snapshots_and_pointers`);
#   - _includes/song-video.html prints every line with its `visual`
#     description as the on-page transcript (WCAG 1.2.1 / 1.2.3);
#   - each section's `narration` is spoken in the audio-described cut, where
#     the video pauses at the start of the section while the narrator
#     describes what it shows (extended audio description, WCAG 1.2.5).
# Editing text or descriptions here updates the transcript on the next Jekyll
# build, but the video and captions only after a re-render.
#
# Times are seconds into the recording. Line `start`/`end` and `marks` come
# from Whisper word timestamps aligned to the lyrics; `text` is what is
# actually sung, written in Git notation (e.g. "reset --hard" for the sung
# "reset dash-dash hard"). Two spots in this take differ from the lyric
# sheet: chorus 2 ends on "moves" (the verse cuts in over "with it"), and the
# last quiz answer skips "Never!".

title: "Snapshots and Pointers: a song about Git"   # the video's accessible name
credit: Lyrics written for this chapter; music and vocals generated with Suno.
video: /assets/video/snapshots-and-pointers.mp4
captions: /assets/video/snapshots-and-pointers.vtt
described_video: /assets/video/snapshots-and-pointers-described.mp4
described_captions: /assets/video/snapshots-and-pointers-described.vtt
poster: /assets/video/snapshots-and-pointers-poster.jpg
soundtrack: scripts/song-video/songs/snapshots_and_pointers.m4a   # repo path; render input only
narrator:
  voice: Samantha   # macOS `say` voice for the audio-described cut
  rate: 205         # words per minute
width: 1920
height: 1080
fps: 30
duration: 247.97
poster_time: 18.6
beats:
  bpm: 95.11   # tracked with librosa; the grid drifts by under 50 ms
  first: 0.815

sections:
