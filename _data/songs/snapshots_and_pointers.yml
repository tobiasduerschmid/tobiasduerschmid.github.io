    title: "Chorus"
    delivery: sung
    narration: "The chorus shows four panels: working tree, staging area, local repo, and remote. Arrows labeled git add, git commit, git push, and git pull carry the file and its snapshot along. Then the words: Commits never change, only pointers move. Finally, a commit graph shows the main label and HEAD; after git commit, both slide up to the new commit."
