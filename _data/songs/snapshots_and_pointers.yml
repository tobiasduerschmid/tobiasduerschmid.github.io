      - id: chorus-4-2
        start: 216.08
        end: 219.00
        text: "add it to the staging area — your next commit to be;"
        marks: {add: 216.08, staging: 217.04, next: 218.04}
        visual: "An arrow labeled git add carries a copy of app.py into the Staging area, tagged “Next commit”."
      - id: chorus-4-3
        start: 219.00
        end: 221.74
        text: "commit snapshots the staging area on your machine;"
        marks: {commit: 219.00, snapshots: 219.48, machine: 221.32}
        visual: "An arrow labeled git commit: a shutter blinks and snapshot C lands in the Local repo. A bracket under the first three panels reads “On your machine”."
      - id: chorus-4-4
        start: 221.74
        end: 224.24
        text: "push shares your commits, pull brings in your team's."
        marks: {push: 221.74, pull: 223.06}
        visual: "An arrow labeled git push copies the snapshot to the Remote; an arrow labeled git pull brings a teammate’s snapshot T back."
      - id: chorus-4-5
        start: 224.24
        end: 226.72
        text: "Commits never change — only pointers move:"
        marks: {commits: 224.24, never: 224.80, only: 225.68, pointers: 225.88, move: 226.32}
        visual: "Big kinetic type: a padlock and “Commits never change”, then “only pointers move” with a pointer icon."
      - id: chorus-4-6
        start: 226.72
        end: 229.22
        text: "a branch is just a label on a commit,"
        marks: {branch: 227.02, label: 227.82}
        visual: "A Git graph with commits A and B, and HEAD and main on B. A “Label” sticker points at main."
      - id: chorus-4-7
        start: 229.22
        end: 231.24
        text: "and HEAD is where you are —"
        marks: {head: 229.60, are: 230.78}
        visual: "A “You are here” map-pin sticker points at the HEAD label."
      - id: chorus-4-8
        start: 231.24
        end: 234.74
