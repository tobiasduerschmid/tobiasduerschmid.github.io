  - id: bridge
    title: "Bridge: Remotes and safety"
    delivery: sung
    narration: "The bridge shows two graphs: your laptop and the remote. git push copies your commit up. After a teammate pushes, git fetch moves only the origin/main label, and git pull moves main too. A later push is rejected with the message: fetch first. After git pull, git push works. git push --force appears crossed out. In a what-if, force-pushing slams the remote’s main label onto your commit, and your teammates’ commits fall away. Last, unsaved edits to app.py are wiped by git restore and git reset --hard, while the history graph stays the same."
    lines:
      - id: bridge-1
        start: 166.34
        end: 168.44
        text: "Your commits stay on your laptop till you push them up."
        marks: {laptop: 167.28, push: 167.90}
        visual: "Two graphs side by side: Your laptop (B and C, HEAD and main on C, origin/main on B) and Remote (B). Terminal: git push. C appears on the Remote and origin/main moves to C."
      - id: bridge-2
        start: 168.44
        end: 170.90
        text: "git fetch downloads your team's commits but doesn't touch your stuff:"
        marks: {fetch: 168.84, teams: 169.48, touch: 170.44}
        visual: "A teammate’s commit T lands on the Remote (“Teammate pushed”). Terminal: git fetch. T appears on your laptop under origin/main (“Files untouched”)."
      - id: bridge-3
        start: 171.00
        end: 173.82
        text: "your files and your branch stay put; it just moves origin/main."
        marks: {stay: 171.75, origin: 172.90}
        visual: "Your main label stays on C (“Stays put”) while origin/main sits on T (“Moved”)."
      - id: bridge-4
        start: 173.82
        end: 176.36
        text: "Pull is fetch, then merge — and that's when your files change."
        marks: {pull: 173.82, merge: 174.76, change: 176.06}
        visual: "Terminal: git pull (“pull = fetch + merge”). main and HEAD move up to T (“Files change”)."
      - id: bridge-5
        start: 176.36
        end: 178.80
        text: "Push rejected, \"fetch first\"? The remote has commits you haven't got:"
        marks: {push: 176.36, rejected: 176.60, remote: 177.62, havent: 178.32}
        visual: "New state: your commit L on your laptop, a teammate’s commit U on the Remote. Terminal: git push, answered by “! [rejected] (fetch first)”, and a “Rejected” stamp (“You don’t have U”)."
      - id: bridge-6
        start: 178.80
        end: 181.34
        text: "pull them in, then push again. Force-push a shared branch? Better not!"
        marks: {pull: 178.80, push: 179.58, force: 179.88, better: 180.82}
        visual: "Terminal: git pull, and your laptop gets U and a merge commit M; git push, and the Remote gets L and M. Then git push --force appears struck through, with a “Better not” stamp."
      - id: bridge-7
        start: 181.34
        end: 183.82
        text: "It slams the remote's pointer onto your commit,"
        marks: {slams: 181.76, commit: 183.54}
        visual: "A what-if graph of the Remote after git push --force: its main label slams onto your commit X and the screen shakes."
      - id: bridge-8
        start: 183.82
        end: 186.24
        text: "and your teammates' work falls off the branch. Don't do it."
        marks: {falls: 184.80, dont: 185.52}
        visual: "The teammates’ commits U and V fall off the graph and out of the frame (“Teammates’ work”), and a “Don’t do it” stamp lands."
      - id: bridge-9
        start: 186.24
        end: 188.40
        text: "And if it isn't committed, it isn't safe:"
        marks: {committed: 187.18, safe: 188.10}
        visual: "A Working tree panel holds app.py with “unsaved edits” in a dashed red border, shaking under a “Not safe” sticker; beside it, a History graph (A, B, C)."
      - id: bridge-10
        start: 188.40
        end: 192.82
        text: "restore and reset --hard can wipe it, and your history holds no trace."
        marks: {restore: 188.40, reset: 189.02, wipe: 190.48, history: 191.26, trace: 192.40}
        visual: "Terminal: git restore app.py, then git reset --hard. The app.py card blurs away (“Wiped”) while the History graph stays the same (“No trace”)."
  - id: quiz
    title: "Call and response"
    delivery: call
    narration: "Pop quiz: each question appears on a card, and its answer appears when the crowd sings it."
    lines:
      - id: quiz-1
        start: 192.82
        end: 195.74
        text: "Where do you type?"
        answer: "The working tree!"
        answer_at: 194.14
        visual: "Quiz card 1 of 6 shows the question; the answer slams in on a green bar when the crowd sings it."
      - id: quiz-2
        start: 195.74
        end: 198.20
        text: "What's in the staging area?"
        answer: "My next commit!"
        answer_at: 196.98
        visual: "Quiz card 2 of 6 shows the question; the answer slams in on a green bar when the crowd sings it."
      - id: quiz-3
        start: 198.20
        end: 203.10
        text: "What does commit save?"
        answer: "The staging area, on my machine!"
        answer_at: 199.34
        visual: "Quiz card 3 of 6 shows the question; the answer slams in on a green bar when the crowd sings it."
      - id: quiz-4
        start: 203.10
        end: 206.64
        text: "You commit. What moves?"
        answer: "My branch, and HEAD rides along!"
        answer_at: 204.54
        visual: "Quiz card 4 of 6 shows the question; the answer slams in on a green bar when the crowd sings it."
      - id: quiz-5
        start: 206.64
        end: 210.82
        text: "Does fetch change your files?"
        answer: "No! Pull does: fetch, then merge!"
        answer_at: 208.44
        visual: "Quiz card 5 of 6 shows the question; the answer slams in on a green bar when the crowd sings it."
      - id: quiz-6
        start: 210.82
        end: 214.32
        text: "Can a commit change?"
        answer: "Make a new one, move a pointer!"
        answer_at: 212.28
        visual: "Quiz card 6 of 6 shows the question; the answer slams in on a green bar when the crowd sings it."
  - id: chorus-4
    title: "Final chorus"
    delivery: sung
    narration: "The final chorus, as before, ending in confetti."
    lines:
