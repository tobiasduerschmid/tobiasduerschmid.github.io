  - id: verse-3
    title: "Verse 3: Pointers"
    delivery: sung
    narration: "Verse 3 shows a commit graph with branch labels. git branch feature adds a label instantly, and git commit moves main up. git switch feature moves HEAD, and git switch -c ui creates a new branch and switches to it. git merge ui makes a commit with two parents. A second graph shows a fast-forward: main slides up to feature. Then two versions of the same line collide, the file shows conflict markers, and it is fixed, added, and committed."
