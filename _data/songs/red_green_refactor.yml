        marks: {"a": 102.42, "cleaner": 102.48, "routine": 102.86}
        visual: "A docstring, \"A last-in, first-out stack.\", is added to the same code; the terminal runs again: still ✓ 1 passed. Code’s gown lines tidy up and Code twirls."
  - id: verse-3
    title: "Verse 3"
    delivery: sung
    narration: "Verse 3, rule 3: just enough code. The code is_empty returns True, the simplest code that passes. Extra features, peek, size, sort, and undo, park in a lot labeled later: needs its own test. An untested extra peek method with a bug, a ladybug, and 0 tests is struck out. Then a pytest list runs all three tests, old and new, all passed, and a notepad test list collects new ideas: pop on an empty stack, push many and pop in order, and peek."
