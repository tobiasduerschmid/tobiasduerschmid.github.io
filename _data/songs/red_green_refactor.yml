        start: 90.22
        end: 91.64
        text: "let the tests lead."
        marks: {"let": 90.22, "the": 90.48, "tests": 90.76, "lead": 91.16}
        visual: "Test takes Code’s hand and leads; the cycle shrinks to the corner and the test arrives first: test_new_stack_is_empty, line by line."
      - id: chorus-1-3
        start: 92.08
        end: 93.6
        text: "First a test fails"
        marks: {"first": 92.08, "a": 92.6, "test": 92.86, "fails": 93.14}
        visual: "Red: pytest runs it — ✗ 1 failed; Test’s lamp turns red."
      - id: chorus-1-4
        start: 93.62
        end: 95.76
        text: "for the change that we need."
        marks: {"for": 93.62, "the": 93.94, "change": 94.14, "that": 94.66, "we": 94.94, "need": 95.28}
        visual: "A note names the change: “needed: is_empty()”."
      - id: chorus-1-5
        start: 95.78
        end: 97.84
        text: "Write just enough code;"
        marks: {"write": 95.78, "just": 96.28, "enough": 96.7, "code": 97.18}
        visual: "Green: the code replaces the test — class MyStack with is_empty returning True; the dancers step to the green tile."
      - id: chorus-1-6
        start: 98.18
