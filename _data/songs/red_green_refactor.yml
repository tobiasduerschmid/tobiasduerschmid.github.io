  - id: verse-4
    title: "Verse 4"
    delivery: sung
    narration: "Verse 4, refactor. The dancers begin to bow but a stamp says Not done yet; the cycle moves to Refactor and Code's gown lines line up neatly. A violet panel gives the lecture's definition and stays for the whole verse: Refactor: make the design more elegant, cleaner, and potentially faster while not changing the functionality of the program. A three-line pop method is struck through and replaced by one line, return self dot elements dot pop, while a black box shows push 1, push 2, pop gives 2, pop gives 1, outputs unchanged. Code twirls. Next, two tests that each repeat stack equals MyStack are refactored into one pytest fixture. Finally, a timeline of small refactoring steps, rename, fixture, shorter pop, docstring, each followed by a green test run, and a badge reads tests passing."
