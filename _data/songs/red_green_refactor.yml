# Storyboard for "Red, Green, Refactor", the test-driven development song on
# the SE Book page SEBook/testing/tdd.md (embedded with
# _includes/song-video.html).
#
# This file is the single source of truth for the song's words and timing:
#   - js/song-video/songs/red_green_refactor.js choreographs the live vector
#     player (/assets/song-player/red-green-refactor.html) against each
#     line's `start` and its `marks` (the times of the words the visuals
#     hit), with the dancers in js/song-video/tdd-dancers.js and the teaching
#     artwork in js/song-video/tdd-kit.js and js/song-video/tdd-props.js;
#   - render.js writes the captions and the audio-described soundtrack from
#     `text` and `narration` (`node scripts/song-video/render.js
#     red_green_refactor`). This song has no MP4: it plays only in the live
#     player, so render.js skips the frame capture;
#   - _includes/song-video.html prints every line with its `visual`
#     description as the on-page transcript (WCAG 1.2.1 / 1.2.3);
#   - each section's `narration` is spoken in the audio-described track,
#     where the picture holds at the start of the section while the narrator
#     describes what it shows (extended audio description, WCAG 1.2.5).
# Editing text or descriptions here updates the transcript and the player on
# the next Jekyll build, but the captions and described audio only after
# re-running render.js.
#
# Times are seconds into the Suno take, normalized to -16 LUFS. Line
# boundaries and word marks come from local Whisper word timestamps (mlx
# whisper-large-v3-turbo) aligned to the lyric sheet, with prompted section
# passes and short unprompted clips for the onsets Whisper stretched over
# rests. Captions follow the recording, which differs from the lyric sheet
# once: verse 5 sings "Three comes back to you" without the word "Assert"
# (the code on screen still shows `assert element == 3`).

title: "Red, Green, Refactor: a song about test-driven development"   # the player's accessible name
credit: Lyrics written for this chapter; music and vocals generated with Suno.
student:
  laptop_logo: /assets/icons/tdd-cycle/tdd-cycle.svg
theme: ballroom   # stage look: the evening ballroom of js/song-video/ballroom.js
extras:   # the song's own art and styles, loaded before its choreography
  styles:
    - /css/song-video-ballroom.css
    - /css/song-video-tdd-dancers.css
    - /css/song-video-tdd-kit.css
    - /css/song-video-tdd-props.css
    - /css/song-fireworks.css
  scripts:
    - /js/song-video/ballroom.js
    - /js/song-video/tdd-dancers.js
    - /js/song-video/tdd-kit.js
    - /js/song-video/tdd-props.js
    - /js/song-video/fireworks.js
player: /assets/song-player/red-green-refactor.html
captions: /assets/audio/red-green-refactor.vtt
described_captions: /assets/audio/red-green-refactor-described.vtt
soundtrack: assets/audio/red-green-refactor.m4a   # repo path, played by the live player
described_soundtrack: assets/audio/red-green-refactor-described.m4a
described_timeline: /assets/audio/red-green-refactor-described.json
narrator:
  voice: Samantha   # macOS `say` voice for the audio-described track
  rate: 205         # words per minute
  pronounce:        # how the narrator says notation the captions keep as written
    MyStack: my stack
    is_empty: is empty
    test_pop: test pop
    test_push: test push
    test_create_stack: test create stack
    pytest: pie test
    ImportError: import error
    NameError: name error
    CI: C I
width: 1920
height: 1080
fps: 30
duration: 346.41
