sections:
  - id: intro
    title: "Intro"
    delivery: sung
    narration: "Audio-described version: before each section, the picture pauses while I describe it. The setting is an evening ballroom with velvet drapes, a chandelier, and a polished floor. Two dancers: Test, in a tailcoat, whose head is a glass lamp that glows red with an X on its badge when a test fails and green with a check mark when tests pass; and Code, a page with curly-brace hair clips, whose gown is made of colored code lines. The title reads Red, Green, Refactor, a song about test-driven development. Code asks, Shall we take a chance; Test answers, Let me lead this dance. A test file appears: test new stack is empty creates MyStack and asserts the stack is empty. Then the dancers join hands and begin to waltz."
    lines:
      - id: intro-1
        start: 8.48
        end: 12.02
        text: "Code said, “Shall we take a chance?”"
        marks: {"code": 8.48, "said": 9.32, "shall": 10.3, "we": 10.7, "take": 10.9, "a": 11.14, "chance": 11.34}
        visual: "In a ballroom, Code (a page with curly-brace clips and a gown of code lines) asks in a bubble: “Shall we take a chance?” and offers a hand."
      - id: intro-2
        start: 12.98
        end: 16.32
        text: "Test said, “Let me lead this dance."
        marks: {"test": 12.98, "said": 13.8, "let": 14.8, "me": 14.96, "lead": 15.12, "this": 15.44, "dance": 15.76}
        visual: "Test (a tailcoat and a glass-lamp head) answers: “Let me lead this dance,” bows, and offers a hand."
      - id: intro-3
        start: 17.18
        end: 20.56
        text: "First say what the code should do."
        marks: {"first": 17.18, "say": 18.02, "what": 18.6, "the": 19.14, "code": 19.3, "should": 19.68, "do": 20.04}
        visual: "A test file appears before any code: test_new_stack_is_empty creates MyStack() and asserts stack.is_empty()."
      - id: intro-4
        start: 21.1
        end: 25.1
        text: "One small step; I’ll guide you through.”"
        marks: {"one": 21.1, "small": 22.08, "step": 22.48, "ill": 23.32, "guide": 23.96, "you": 24.34, "through": 24.68}
        visual: "The dancers step together, join hands, and begin to waltz."
  - id: verse-1
    title: "Verse 1"
    delivery: sung
    narration: "Verse 1, the rules of the dance. Rule 1: a test file with test push appears line by line and turns red, and a pytest terminal prints AttributeError, no attribute push, 1 failed, while an empty my stack file is labeled production code waits. Next, the same test seen as the caller, with an arrow to MyStack seen from outside: push, and is empty. Rule 2: test pop is written line by line only until it fails; a stop sign appears as Test raises a hand. A fan of three test cards is stamped No batch, and a giant leap is stamped No giant hop. Finally, a track of small footsteps, each with a green check, versus one giant hop; when the last small step turns red, only that step needs tracing, while the hop asks which change broke it."
    lines:
      - id: verse-1-1
        start: 28.5
        end: 31.54
        text: "First, a failing unit test;"
        marks: {"first": 28.5, "a": 29.38, "failing": 29.72, "unit": 30.14, "test": 30.78}
        visual: "“Rule 1”: test_push appears line by line; pytest prints E AttributeError: no attribute 'push', 1 failed; Test’s lamp turns red with a ✗."
      - id: verse-1-2
        start: 32.14
        end: 35.64
        text: "till then, production code must rest."
        marks: {"till": 32.14, "then": 32.96, "production": 33.7, "code": 34.12, "must": 34.7, "rest": 35.1}
        visual: "An empty my_stack.py (class MyStack: pass) is labeled “production code waits”; Code puts hands on hips."
      - id: verse-1-3
        start: 36.48
        end: 39.76
        text: "The test says what we need to do,"
        marks: {"the": 36.48, "test": 37.2, "says": 37.5, "what": 37.88, "we": 38.14, "need": 38.36, "to": 38.86, "do": 39.28}
        visual: "In the test, the lines stack.push(3) and assert not stack.is_empty() are highlighted."
      - id: verse-1-4
        start: 40.0
        end: 43.76
        text: "from a caller’s point of view."
        marks: {"from": 40.0, "a": 40.86, "callers": 41.26, "point": 42.24, "of": 42.7, "view": 43.3}
        visual: "An arrow from the test (“the caller”) to “MyStack · seen from outside”: push(item) and is_empty() → bool."
      - id: verse-1-5
        start: 44.3
        end: 47.68
        text: "Write test code till it fails, then stop."
        marks: {"write": 44.3, "test": 44.96, "code": 45.34, "till": 45.7, "it": 45.92, "fails": 46.08, "then": 46.76, "stop": 47.08}
        visual: "“Rule 2”: test_pop is typed line by line; at element = stack.pop() pytest fails, and a STOP sign appears as Test raises a hand."
      - id: verse-1-6
        start: 48.2
        end: 51.74
        text: "No batch of tests; no giant hop."
        marks: {"no": 48.2, "batch": 48.8, "of": 49.16, "tests": 49.36, "no_2": 50.22, "giant": 50.48, "hop": 51.24}
        visual: "A fan of three test cards (test_peek, test_size, test_sort) is stamped “No batch”; a giant leap arc is stamped “No giant hop”."
      - id: verse-1-7
        start: 52.18
        end: 55.8
        text: "Small steps bring feedback; stay on track,"
        marks: {"small": 52.18, "steps": 52.68, "bring": 53.06, "feedback": 53.38, "stay": 54.64, "on": 55.08, "track": 55.34}
        visual: "Footprints labeled “small steps” land one by one along a track, each with a green ✓ flag."
      - id: verse-1-8
        start: 56.5
        end: 60.32
        text: "with less to trace when red comes back."
        marks: {"with": 56.5, "less": 56.88, "to": 57.16, "trace": 57.4, "when": 57.92, "red": 58.48, "comes": 58.84, "back": 59.48}
        visual: "The last small step turns red (“trace 1 small step”), while a giant hop below asks “which change broke it?”"
  - id: verse-2
    title: "Verse 2"
    delivery: sung
    narration: "Verse 2, testing the test. Two pytest terminals both show 1 error. Test A imports MyStack before it exists and fails with ImportError: expected, MyStack does not exist yet. Test B misspells MyStak and fails with NameError: a typo, red for the wrong reason. Then two timelines: red first, then green, stamped Trusted, because the test saw the missing step; and a test that was green from the start, asking can it fail at all. The dancers' lamp turns red, then green, and Code twirls."
    lines:
      - id: verse-2-1
        start: 60.57
        end: 64.1
        text: "Run it first; find what’s to blame."
        marks: {"run": 60.57, "it": 61.14, "first": 61.36, "find": 62.3, "whats": 62.62, "to": 63.22, "blame": 63.48}
        visual: "“Why is it red?” Two pytest terminals each show 1 error."
      - id: verse-2-2
        start: 64.7
        end: 68.18
        text: "Not every failure means the same."
        marks: {"not": 64.7, "every": 65.08, "failure": 65.5, "means": 66.36, "the": 67.26, "same": 67.56}
        visual: "A note: “same red, different reasons”."
      - id: verse-2-3
        start: 68.78
        end: 71.8
        text: "A missing class can make it red;"
        marks: {"a": 68.78, "missing": 69.08, "class": 69.42, "can": 70.16, "make": 70.58, "it": 71.08, "red": 71.3}
        visual: "Test A, from my_stack import MyStack, fails with E ImportError: no 'MyStack' — “expected: MyStack doesn’t exist yet”."
      - id: verse-2-4
        start: 72.62
        end: 76.0
        text: "a typo leads astray instead."
        marks: {"a": 72.62, "typo": 73.18, "leads": 73.88, "astray": 74.46, "instead": 75.28}
        visual: "Test B, stack = MyStak(), fails with E NameError: 'MyStak' not defined — “a typo: red for the wrong reason”."
      - id: verse-2-5
        start: 76.62
        end: 80.18
        text: "See red before we trust the green:"
        marks: {"see": 76.62, "red": 76.78, "before": 77.26, "we": 78.14, "trust": 78.72, "the": 79.3, "green": 79.8}
        visual: "A timeline goes ✗ (no code yet) then ✓ (code written); another is ✓ from the start (“never red”)."
      - id: verse-2-6
        start: 80.78
        end: 84.54
        text: "we know the missing step was seen."
        marks: {"we": 80.78, "know": 81.68, "the": 81.98, "missing": 82.78, "step": 83.1, "was": 83.64, "seen": 84.0}
        visual: "The first timeline is stamped “Trusted”; the other asks “can it fail at all?”"
  - id: chorus-1
    title: "Chorus"
    delivery: sung
    narration: "The chorus, the same in all three choruses. A cycle of three tiles, Red: write a failing test, Green: make it pass, and Refactor: clean the structure, lights word by word while the dancers step onto red, green, and violet floor tiles. On let the tests lead, the cycle shrinks to the top corner as a map and the test arrives first. Red: the test fails in a terminal below, and a note names the change needed. Green: just enough code replaces the test, and the terminal shows every test passing. Refactor: the same code is rewritten more cleanly, the old line struck through above the new one, and the terminal runs the tests again: they still pass, while Code's gown lines tidy up. This chorus: test new stack is empty, then is empty returns True, then a docstring documents the contract."
    lines:
      - id: chorus-1-1
        start: 87.7
        end: 89.8
        text: "Red, green, refactor—"
        marks: {"red": 87.7, "green": 88.68, "refactor": 89.12}
        visual: "The Red ✗, Green ✓, and Refactor ↻ tiles of the cycle light word by word as the dancers step onto red, green, and violet floor tiles."
