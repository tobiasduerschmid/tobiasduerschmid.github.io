    delivery: sung
    narration: "Pre-chorus, messages. A name card for Alan Kay and Smalltalk, 1970s. Three living cells, each with a nucleus labeled state, turn into three small computers joined by network cables, and envelopes travel between them. A hand reaching into one computer is crossed out, and a paper-plane envelope launches toward you."
