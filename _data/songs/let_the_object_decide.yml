sections:
  - id: intro
    title: "Intro"
    delivery: spoken
    narration: "Audio-described version: before each section, the picture pauses while I describe it. The setting is a city-builder game at dusk, with a faint skyline and a glowing game board. The intro: you sit at a laptop beside a game window showing a little town with two crossing roads, a traffic light, a bus stop, a bike lane, a car, a bus, and a bike. Version one stores the town as a table with columns x, y, speed, and type, and the vehicles become grey tokens. A code card builds one big loop with an if-chain on the type: if the type is CAR, drive the lane; if BUS, stop at the stop; if BIKE, use the bike lane. Two more copies of the same chain, for drawing and braking, stack behind it. Arrows from scattered code write into the speed column, the bus's speed becomes minus 10, and the bus rolls backward. The mayor sends a feature request for ambulances, and a search for type checks finds 37. The town's buildings turn into towers of else-if lines. A name card shows Ole-Johan Dahl and Kristen Nygaard, Norway, 1960s; an inspector lens sweeps the town and every vehicle pops up its own object name, like car colon Car; then the title, Let the Object Decide."
    lines:
      - id: intro-1
        start: 1.58
        end: 3.84
        text: "You’re coding a city-builder game."
        marks: {"youre": 1.58, "coding": 2.1, "a": 2.42, "city": 2.66, "builder": 2.84, "game": 3.1}
        visual: "Dusk. You sit at a laptop on the left; on the right, a game window titled “City Builder” opens on a little town: two crossing roads, a traffic light, a bus stop, a bike lane, and a car, a bus, and a bike driving."
      - id: intro-2
        start: 3.84
        end: 6.74
        text: "A table: x, y, speed, type."
        marks: {"a": 3.84, "table": 4.1, "x": 4.62, "y": 4.99, "speed": 5.36, "type": 5.96}
        visual: "Version one is a table with columns x, y, speed, and type, and one row each for the car, the bus, and the bike. In the game window the vehicles turn into plain grey tokens labeled CAR, BUS, and BIKE."
      - id: intro-3
        start: 6.74
        end: 9.1
        text: "Every frame, one big loop:"
        marks: {"every": 6.74, "frame": 7.2, "one": 7.86, "big": 8.0, "loop": 8.22}
        visual: "A code card starts the loop: for (int i = 0; i < n; i++) {. A frame counter ticks in the game window."
      - id: intro-4
        start: 9.1
        end: 11.2
        text: "if it’s a car, drive the lane;"
        marks: {"if": 9.1, "its": 9.54, "a": 9.66, "car": 9.72, "drive": 10.24, "the": 10.5, "lane": 10.66}
        visual: "The branch if (type[i] == CAR) driveLane(i); types in, and the CAR token drives along its lane."
      - id: intro-5
        start: 11.2
        end: 13.32
        text: "if it’s a bus, stop at the stop;"
        marks: {"if": 11.2, "its": 11.64, "a": 11.76, "bus": 11.84, "stop": 12.4, "at": 12.58, "the": 12.72, "stop_2": 12.8}
        visual: "else if (type[i] == BUS) stopAtStop(i); types in, and the BUS token pulls into the bus stop."
      - id: intro-6
        start: 13.32
        end: 15.18
        text: "if it’s a bike, take the bike lane."
        marks: {"if": 13.32, "its": 13.54, "a": 13.66, "bike": 13.76, "take": 14.2, "the": 14.4, "bike_2": 14.54, "lane": 14.78}
        visual: "else if (type[i] == BIKE) useBikeLane(i); types in, and the BIKE token rides the bike lane."
      - id: intro-7
        start: 15.18
        end: 18.2
        text: "Drawing? Same if-chain. Braking? Same again."
        marks: {"drawing": 15.18, "same": 15.66, "if": 16.02, "chain": 16.2, "braking": 16.44, "same_2": 17.06, "again": 17.4}
        visual: "Two more cards, draw() and brake(), stack behind the loop with the same three branches, CAR, BUS, and BIKE, highlighted in all three."
      - id: intro-8
        start: 18.2
        end: 21.92
        text: "Any code can set any speed, even minus ten!"
        marks: {"any": 18.2, "code": 18.58, "can": 18.86, "set": 19.06, "any_2": 19.28, "speed": 19.48, "even": 20.18, "minus": 20.48, "ten": 20.96}
        visual: "Arrows from three scattered lines of code all write into the table’s speed column; the bus’s speed becomes −10, the BUS token rolls backward, and a stamp asks “−10?!”."
      - id: intro-9
        start: 21.92
        end: 25.0
        text: "And the mayor drops a feature request: ambulances."
        marks: {"and": 21.92, "the": 22.4, "mayor": 22.52, "drops": 22.76, "a": 23.08, "feature": 23.2, "request": 23.44, "ambulances": 24.28}
        visual: "A ticket slides in from the Mayor’s office: “Feature request: ambulances”."
      - id: intro-10
        start: 25.0
        end: 28.26
        text: "Search the type checks: thirty-seven to change!"
        marks: {"search": 25.0, "the": 25.26, "type": 25.46, "checks": 25.64, "thirty": 26.4, "seven": 26.64, "to": 26.88, "change": 27.26}
        visual: "A search box for type[i] == counts its matches up to 37."
      - id: intro-11
        start: 28.26
        end: 30.56
        text: "That’s not a city. That’s a switch statement."
        marks: {"thats": 28.26, "not": 28.74, "a": 28.82, "city": 28.96, "thats_2": 29.36, "a_2": 29.62, "switch": 29.68, "statement": 29.9}
        visual: "The town’s buildings turn into towers of stacked else if lines: a skyline made of one giant if-chain."
      - id: intro-12
        start: 30.56
        end: 33.42
        text: "In the sixties, two Norwegians had a better idea:"
        marks: {"in": 30.56, "the": 30.68, "sixties": 30.78, "two": 31.52, "norwegians": 31.66, "had": 32.26, "a": 32.42, "better": 32.54, "idea": 32.76}
        visual: "A name card: Ole-Johan Dahl and Kristen Nygaard, Norway, 1960s."
      - id: intro-13
        start: 33.42
        end: 36.92
        text: "make every thing in the world a thing in the code,"
        marks: {"make": 33.42, "every": 33.79, "thing": 33.97, "in": 34.24, "the": 34.42, "world": 34.5, "a": 34.84, "thing_2": 35.1, "in_2": 35.24, "the_2": 35.36, "code": 35.44}
        visual: "The town returns with real vehicles; an inspector lens sweeps across it, and each vehicle pops up its own object name: car : Car, bus : Bus, bike : Bike."
      - id: intro-14
        start: 36.92
        end: 38.61
        text: "and let the object decide."
        marks: {"and": 36.92, "let": 37.4, "the": 37.56, "object": 37.72, "decide": 38.12}
        visual: "The title: Let the Object Decide."
  - id: verse-1
    title: "Verse 1"
    delivery: sung
    narration: "Verse 1, from record to object. A record card for Car holds only fields: x, y, and speed. It idles like a game NPC, with a floating NPC tag and a speech bubble with three dots, while an outside function reads its speed. Then a card for Simula 67, short for simulation language, and the record grows a second compartment for methods, steer and brake, and becomes an object card. A car on a strip of road steers and brakes as its methods light. Last, a blueprint for class Car, and a rubber stamp labeled new makes three cars, each with its own object card: same methods, different values. Car 2 speeds up to 80; car 1 is still at 20."
    lines:
      - id: verse-1-1
        start: 39.66
        end: 42.36
        text: "Sixty-six: Tony Hoare’s record."
        marks: {"sixty": 39.66, "six": 39.9, "tony": 40.74, "hoares": 40.92, "record": 41.6}
        visual: "A name card, “Tony Hoare · record · 1966”, and a record card for Car with a single compartment of fields."
      - id: verse-1-2
        start: 42.36
        end: 44.58
        text: "A car was just fields: x, y, speed."
        marks: {"a": 42.36, "car": 42.38, "was": 42.5, "just": 42.68, "fields": 42.86, "x": 43.46, "y": 43.84, "speed": 44.28}
        visual: "Its fields x, y, and speed light up one by one."
      - id: verse-1-3
        start: 44.58
        end: 47.4
        text: "No moves of its own. NPC energy. (NPC!)"
        marks: {"no": 44.58, "moves": 44.76, "of": 45.16, "its": 45.32, "own": 45.46, "npc": 45.88, "energy": 46.16, "npc_2": 46.98}
        visual: "The record card idles like a game NPC: a floating “NPC” tag above it, a “…” speech bubble, and a slow sway."
      - id: verse-1-4
        start: 47.4
        end: 49.78
        text: "Waiting for other code to read."
        marks: {"waiting": 47.4, "for": 47.96, "other": 48.2, "code": 48.52, "to": 48.98, "read": 49.24}
        visual: "An outside function, updateCar(), reaches over with an arrow and reads car.speed; the record does not react."
      - id: verse-1-5
        start: 49.78
        end: 52.84
        text: "Then Dahl and Nygaard, in Simula. (Simulation!)"
        marks: {"then": 49.78, "dahl": 49.94, "and": 50.38, "nygaard": 50.72, "in": 51.18, "simula": 51.48, "simulation": 52.16}
        visual: "A card reads “Simula 67”; on “Simulation!” the letters SIMU and LA light up in “SIMUlation LAnguage”."
      - id: verse-1-6
        start: 52.84
        end: 54.5
        text: "Gave each record work to do."
        marks: {"gave": 52.84, "each": 53.0, "record": 53.14, "work": 53.38, "to": 53.64, "do": 53.94}
        visual: "The record card grows a second compartment for methods and becomes an object card; a label reads “data + behavior”."
      - id: verse-1-7
        start: 54.5
        end: 57.1
        text: "Now a car knows its place and speed,"
        marks: {"now": 54.5, "a": 55.06, "car": 55.22, "knows": 55.48, "its": 55.84, "place": 56.04, "and": 56.3, "speed": 56.56}
        visual: "The state compartment glows (x, y, speed), and a car on a strip of road shows a position pin and a speedometer."
      - id: verse-1-8
        start: 57.1
        end: 59.66
        text: "and it can steer and brake, too."
        marks: {"and": 57.1, "it": 57.42, "can": 57.54, "steer": 57.78, "and_2": 58.28, "brake": 58.78, "too": 59.16}
        visual: "steer() and brake() light up on their words: the car steers into the next lane, then brakes with its brake lights on."
      - id: verse-1-9
        start: 59.66
        end: 61.64
        text: "Write the class once: the blueprint."
        marks: {"write": 59.66, "the": 59.8, "class": 59.94, "once": 60.24, "the_2": 60.86, "blueprint": 60.92}
        visual: "A blueprint sheet for class Car shows the two compartments with names but no values."
      - id: verse-1-10
        start: 61.64
        end: 64.12
        text: "“New” builds a car, and a car, and a car:"
