# Storyboard for "Let the Object Decide", the object-oriented programming
# song on the SE Book page SEBook/oop-song.md (embedded with
# _includes/song-video.html).
#
# This file is the single source of truth for the song's words and timing:
#   - js/song-video/songs/let_the_object_decide.js choreographs the live
#     vector player (/assets/song-player/let-the-object-decide.html) against
#     each line's `start` and its `marks` (the times of the words the visuals
#     hit), with the town and its vehicles in js/song-video/object-city.js
#     and the object cards, envelopes, and flags in js/song-video/oop-kit.js;
#   - render.js writes the captions and the audio-described soundtrack from
#     `text` and `narration` (`node scripts/song-video/render.js
#     let_the_object_decide`). This song has no MP4: it plays only in the
#     live player, so render.js skips the frame capture;
#   - _includes/song-video.html prints every line with its `visual`
#     description as the on-page transcript (WCAG 1.2.1 / 1.2.3);
#   - each section's `narration` is spoken in the audio-described track,
#     where the picture holds at the start of the section while the narrator
#     describes what it shows (extended audio description, WCAG 1.2.5).
# Editing text or descriptions here updates the transcript and the player on
# the next Jekyll build, but the captions and described audio only after
# re-running render.js.
#
# Times are seconds into the Suno take "Let the Object Decide" (2) (about 92
# BPM) of the lyric sheet in docs/let-the-object-decide-song-lyrics.md, which
# revises six lines of the first take so they make sense by ear. Word marks
# come from local Whisper word timestamps (mlx whisper-large-v3-turbo) on the
# Demucs vocal stem, aligned to the sheet (781 of 819 words heard; the rest,
# mostly quiet backing echoes, are interpolated between their neighbours); an
# unprompted clip pass confirmed the last quiz answer, whose "fine" is held.
# Quiz `answer_at` is the answer's first vocal onset, read from the vocal
# stem's envelope, and `pause_at` sits in the quiet just before it. The stereo
# balance stays within 2 dB, so the soundtrack keeps both channels; it is
# normalized to -16 LUFS with one linear gain (true peak -3.3 dBFS) and stored
# as AAC at 192 kb/s. Where the sheet splits a sentence across short lines,
# the storyboard keeps it as one line. The take sings the sheet as written,
# with one final chorus (the first take repeated it with an ad-lib).
title: "Let the Object Decide: a song about object-oriented programming"   # the player's accessible name
credit: Lyrics written for this page; music and vocals generated with Suno.
student:
  laptop_logo: /assets/icons/object-card/object-card.svg
theme: object-city   # stage look: the city-builder game at dusk of js/song-video/object-city.js
extras:   # the song's own art and styles, loaded before its choreography
  styles:
    - /css/song-video-object-city.css
    - /css/song-video-oop-kit.css
  scripts:
    - /js/song-video/object-city.js
    - /js/song-video/oop-kit.js
player: /assets/song-player/let-the-object-decide.html
captions: /assets/audio/let-the-object-decide.vtt
described_captions: /assets/audio/let-the-object-decide-described.vtt
soundtrack: assets/audio/let-the-object-decide.m4a   # repo path, played by the live player
described_soundtrack: assets/audio/let-the-object-decide-described.m4a
described_timeline: /assets/audio/let-the-object-decide-described.json
narrator:
  voice: Samantha   # macOS `say` voice for the audio-described track
  rate: 205         # words per minute
  pronounce:        # how the narrator says notation the captions keep as written
    NPC: N P C
    vptr: V pointer
    vtable: V table
    C++: C plus plus
    toF: to F
    getX: get X
    setX: set X
    getY: get Y
    setY: set Y
    getSpeed: get speed
    setSpeed: set speed
    updateCar: update car
    HybridCar: hybrid car
    driveLane: drive lane
    stopAtStop: stop at stop
    useBikeLane: use bike lane
    takeAction: take action
width: 1920
height: 1080
fps: 30
duration: 306.01
