  - id: bridge
    title: "Bridge"
    delivery: sung
    narration: "Bridge, plot twist. A record-scratch freeze on a square. In a math notebook, squares sit inside rectangles, so Square extends Rectangle, and a test sets the width to 100 and asserts the height is still 20. A 50 by 20 rectangle stretches to 100 by 20 and the test passes. The same test with a 20 by 20 square stretches it to 100 by 100, and the test fails. Rectangle's promise card tears; same messages, but not the same meaning: Barbara Liskov's substitution principle. The inheritance arrow is struck out; instead, Square and Rectangle both implement a Shape interface, and a Set holds a Collection inside and delegates to it."
