# Presentation settings for video narrations (docs/video-narration.md).
# Speech, scenes, slides, and diagrams stay in _data/explainers/<topic>.yml,
# so editing these settings never changes a narration's audio fingerprint.
#
# parts and parts_label name the strip that shows where a scene sits in the
# lesson. animation, when present, is the stage frame for scenes with
# `animation: true`: its page, the song-video stage theme, and the styles and
# scripts (artwork kits, then the topic's choreography) the frame loads.
scrum:
  name: Scrum
  summary: Follow a student team through one sprint to learn Scrum's <strong>roles, artifacts, and events</strong>, and the theory that ties them together.
  prerequisites: Assumes familiarity with user stories.
  chapter: /SEBook/process/scrum.html
  views: /SEBook/process/scrum
  parts: [Theory, Roles, Artifacts, Events]
  parts_label: Part of Scrum
  animation:
    page: /assets/video-narration/scrum.html
    theme: story-wall
    styles:
      - /css/song-video-story-wall.css
      - /css/song-video-story-kit.css
      - /css/video-narration-scrum.css
    scripts:
      - /js/song-video/story-wall.js
      - /js/song-video/story-kit.js
      - /js/video-narration/scrum-kit.js
      - /js/video-narration/scrum.js
