title: "Design Patterns Fundamentals"
description: "Core concepts, categories, and principles of design patterns in software engineering."
active: true
cards:
  - id: 1
    difficulty: basic
    question: "What is a design pattern?"
    answer: "A common, acceptable solution to a recurring design problem in a specific context."
    explanation: "A design pattern includes a name, problem, context, forces, solution, and consequences. Patterns are not invented—they are distilled from best practices of experienced practitioners."
  - id: 2
    difficulty: basic
    question: "What are the three GoF pattern categories?"
    answer: "**Creational** (object creation), **Structural** (class/object composition), **Behavioral** (object interaction and responsibility distribution)."
    explanation: "If the problem is about *creating* objects flexibly, look at creational patterns. If it is about *structuring* relationships, look at structural. If it is about *coordinating behavior*, look at behavioral."
  - id: 3
    difficulty: basic
    question: "When applying a design pattern, what is context tailoring?"
    answer: "The process of taking an abstract pattern and adapting it to fit the concrete problem, context, and constraints of a specific application."
    explanation: "Use the pattern as a design model, then check its participants and contracts against the concrete context. A library implementation can still be reused where its supported variations fit."
  - id: 4
    difficulty: intermediate
    question: "In design patterns, what is a pattern compound?"
    answer: "A reoccurring set of patterns with overlapping roles from which additional emergent properties arise."
    explanation: "Classic Smalltalk MVC illustrates Observer for notifications, Strategy for input handling, and Composite for nested views. Merely using several patterns in one program does not make their combination a recurring compound."
  - id: 5
    difficulty: basic
    question: "In design-pattern practice, what is the 'Hammer and Nail' syndrome?"
    answer: "The tendency for developers who just learned patterns to apply them to every problem, even when simple code would be a better solution."
    explanation: "Software quality is not measured by the number of patterns used. Often, keeping the code simple and avoiding a pattern entirely is the best solution."
  - id: 6
    hint: >-
      Identify what is expected to vary: recipients, their lifetimes, or the notification behavior. Compare the changes needed with a direct call and with a subscription mechanism.
    difficulty: intermediate
    question: "A team wants to introduce Observer because one object needs to update one other object after a change. What should they evaluate before applying the pattern?"
    answer: "Whether subscribers should vary independently or need managed lifetimes, and whether those benefits justify a registry compared with a direct call. One current observer does not rule out Observer."
    explanation: "The useful version of the Rule of Three is design judgment, not memorizing the number three. Patterns earn their keep when they make concrete evolution cheaper; without that pressure, they are speculative abstraction."
  - id: 7
    difficulty: intermediate
    question: "What is the difference between architectural patterns and design patterns?"
    answer: "Architectural patterns are *strategic* (constrain the overall system structure); design patterns are *tactical* (solve class/object-level problems)."
    explanation: "As Taylor, Medvidović, and Dashofy frame it (*Software Architecture: Foundations, Theory, and Practice*, 2009): architectural styles constrain the overall architectural decisions, while design patterns provide concrete, parameterized solution fragments."
  - id: 8
    difficulty: advanced
    question: "What does the 'Before and After' technique for teaching design patterns involve?"
    answer: "Comparing a working solution *without* a pattern to a refactored version *with* the pattern, especially when extending both with a new requirement."
    explanation: "Compare the changes needed in both versions. A pattern helps only for the variation it accommodates; the exercise can also reveal when its extra abstraction is not worthwhile."
  - id: 9
    hint: >-
      Keep the current output unchanged while replacing one collaborator’s private representation. Would every supposedly independent client still work?
    difficulty: advanced
    question: "Why does correct program output not establish that a pattern preserves its intended modularity?"
    answer: "A program can produce the expected result while depending on private representation details or concrete collaborators that the design intended to hide."
    explanation: "Cai, Iannuzzi, and Wong’s 2011 study found unexpected dependencies in 74% of 85 functioning student submissions. The transferable lesson is to inspect dependencies and change scenarios, not memorize the percentage as a universal rate."
  - id: 10
    hint: >-
      Choose a plausible extension and compare modifying a small existing design with understanding an abstraction added for a hypothetical future.
    difficulty: advanced
    question: "Why do experienced engineers prefer 'do the simplest thing that could possibly work'?"
    answer: "A small working design gives feedback before speculative abstractions accumulate. Refactor toward a pattern when actual variation or a clear extension requirement justifies its cost."
    explanation: "Simplicity is a design heuristic, not a theorem that every complex design must evolve in one prescribed sequence. Evaluate known requirements as well as today’s implementation."
  - id: 11
    hint: >-
      Identify the concrete change that is painful before choosing a pattern. Does the proposed structure make that particular change easier?
    difficulty: intermediate
    question: "What is the relationship between code smells and design patterns?"
    answer: "Code smells identify design questions; patterns are possible responses, not automatic prescriptions."
    explanation: "Repeated state checks may justify State; a small stable switch may be clearer. Compare a candidate pattern with smaller refactorings against concrete future changes."
  - id: 12
    difficulty: basic
    question: "What does 'polymorphism over conditions' mean?"
    answer: "Replace complex if/else or switch statements with polymorphic objects that each handle one case."
    explanation: "This can localize a changing behavior behind a stable interface. Wiring or transition rules may still need updates, and a short stable conditional may remain simpler."
