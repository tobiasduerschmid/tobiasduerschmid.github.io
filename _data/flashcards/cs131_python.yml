title: "CS 131: Python Object Semantics"
description: "Explain aliasing and copying, then design small examples that expose them."
active: true
# Essential Python slide 11 (OpenCL showcase) is excluded.
cards:
  # Source: essential_python.pptx, slides 4, 6, 13.
  - id: names-objects-mutation
    difficulty: basic
    bloom: understand
    question: "Explain the difference between rebinding a Python name and mutating an object. Include the effect on another name referring to the old object."
    answer: "Rebinding changes which object one name refers to; other names retain their bindings. Mutation changes the object itself, so every alias to that object can observe the change."

  # Sources: essential_python.pptx, slides 14–16; Homework Problems, PYTHON2.
  - id: object-reference-is-not-variable-alias
    difficulty: intermediate
    bloom: analyze
    question: A Python function receives a dictionary, saves `pending = jobs["pending"]`, then runs `jobs.clear()`
      and `pending.append("retry")`. The caller also holds a separate reference to the old pending list.
      What does each caller reference observe?
    answer: The caller's dictionary becomes empty. Its separate list reference observes the appended retry
      entry, even though the dictionary no longer contains that list. Clearing the dictionary removes its
      reference; it does not invalidate the other references to the list.

  # Sources: essential_python.pptx, slide 7; Homework Problems, PYTHON4; F24 midterm Q4 pp. 7–8.
  - id: explain-copy-depth
    difficulty: intermediate
    bloom: understand
    question: "For an ordinary nested list, distinguish assignment, a shallow copy, and a deep copy. Which mutable objects remain shared with the original?"
    answer: "Assignment shares the original outer and inner lists. A shallow copy creates another outer list while sharing the inner lists. A deep copy recursively copies the inner mutable lists, isolating their later edits from the original."

  # Sources: essential_python.pptx, slides 8, 10.
  - id: demonstrate-equality-without-identity
    difficulty: intermediate
    bloom: apply
    question: "Give a short Python example where two lists compare equal but have different identities. Explain why neither result is contradictory."
    answer: "`a = [8]; b = [8]` makes `a == b` true and `a is b` false. Equality compares the lists' values; identity distinguishes the separately constructed objects."

  # Source: essential_python.pptx, slides 5, 17.
  - id: diagnose-unintended-sharing
    difficulty: advanced
    bloom: analyze
    question: "Two instances unexpectedly share a list, and two calls unexpectedly share a default list. Where was each list likely created, and how should per-instance or per-call state be created?"
    answer: "A class-body list is shared through the class, so create per-instance lists inside `__init__` on `self`. A mutable default is created when the function definition executes; use a sentinel such as `None` and allocate inside each call that omits the argument."

  # Sources: essential_python.pptx, slide 17; Homework Problems, PYTHON2.
  - id: create-safe-optional-list
    difficulty: advanced
    bloom: create
    question: Write `include_missing(required, selected=None)` in Python. Append each missing required label
      in order, skip labels already selected, and return the same list when one is supplied. Omitted calls
      must start fresh. Give checks for repeated labels, an explicit empty list, and independent omitted
      calls.
    answer: |-
      ```python
      def include_missing(required, selected=None):
          if selected is None:
              selected = []
          for label in required:
              if label not in selected:
                  selected.append(label)
          return selected
      ```

      Self-checks: `include_missing(["a", "a", "b"], ["b"])` returns `["b", "a"]`. For `supplied = []`, the call `include_missing(["c"], supplied)` returns that same list with `["c"]`. Separate calls with `["a"]` and `["b"]` return `["a"]` and `["b"]` independently.
    explanation: 'Self-check: a truthiness test would replace an explicitly supplied empty list. Use a sentinel
      comparison so omission and emptiness stay distinct.'

  # Sources: essential_python.pptx, slides 10, 13; Homework Problems, PYTHON4 A.4–A.5.
  - id: immutable-container-mutable-child
    difficulty: intermediate
    bloom: analyze
    question: A Python function accepts a tuple of task lists and promises to preserve it. The function
      creates `working = list(tasks)` and clears one task list through working. Has it kept the promise
      that all task contents remain unchanged? Explain the copy boundary.
    answer: No. Converting the outer tuple to a list creates new outer storage but preserves references
      to the task lists. Clearing an inner list changes contents still reachable through the original tuple.
      The function needs independent inner lists, or a contract that explicitly permits their mutation.

  # Sources: essential_python.pptx, slide 9; Homework Problems, PYTHON5 A.
  - id: explain-missing-base-initialization
    difficulty: intermediate
    bloom: analyze
    question: A Python base initializer sets `self.limit = 10`. A subclass sets `self.limit = 30` and then
      calls `super().__init__()`. An inherited method later sees 10. Explain the result and propose an initialization
      order that preserves the intended limit.
    answer: Both initializers write the same instance attribute. The base initializer runs last and overwrites
      30 with 10. Call the base initializer first and then set the specialized limit, or let the base initializer
      accept the intended limit as an argument.

  # Sources: essential_python.pptx, slide 7; Homework Problems, PYTHON4.
  - id: evaluate-copy-policy
    difficulty: advanced
    bloom: evaluate
    question: "A view needs its own sort order but must show live edits to the same records as the original list. Explain which copy depth fits and what it deliberately leaves shared."
    answer: "Use a shallow copy of the outer list. The view can reorder its own reference slots while both lists still refer to the same mutable records. A deep copy would isolate the record edits that the view needs to observe."

  # Sources: essential_python.pptx, slides 6–7, 13; Homework Problems, PYTHON3.
  - id: create-aliasing-counterexample
    difficulty: advanced
    bloom: create
    question: Create two Python lists that initially share a task dictionary. Remove the task from one list,
      then edit it through the other. Show that removing a reference changes membership without destroying
      the object or undoing its shared identity.
    answer: |-
      ```python
      task = {"done": False}
      queue = [task]
      history = queue.copy()
      queue.clear()
      history[0]["done"] = True
      print(queue, task)
      ```

      This prints `[] {"done": True}`. The queue has no members, but history and task still refer to the same dictionary. Self-check: the example must separate a container edit from an object edit.
    explanation: 'Self-check: identify the shared child object and the separate outer lists. One edit must
      mutate the shared child; the other must replace a slot only in the copied outer list.'
