title: 'CS 131: Python References and Parameters'
description: Predict mutation, rebinding, returned aliases, and immutable arguments.
active: true
# Reviewed against the supplied CS131 lectures, homework, and past assessments (2026-10-14).
cards:
  # Taught / practice evidence: Essential Python handout pp. 9, 20–24; Homework PYTHON2–3; Quiz 1 Problem 2A–D; F23 Midterm Problem 1, pp. 2–3.
  - id: cs131-v2-python-card-track-container-slot
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: |-
      Predict the output, then name the assignment that disconnects one path.

      ```python
      entry = [4]
      left = [entry]
      right = left
      left[0] = [9]
      print(entry, right)
      ```
    answer: '`[4] [[9]]`. The assignment `left[0] = [9]` replaces the shared outer list''s slot.'
    explanation: '`left` and `right` share the outer list; `entry` still reaches the old inner list.'

  # Taught / practice evidence: Essential Python handout pp. 9, 20–24; Homework PYTHON2–3; Quiz 1 Problem 2A–D; F23 Midterm Problem 1, pp. 2–3.
  - id: cs131-v2-python-card-repair-reset-procedure
    difficulty: intermediate
    bloom: create
    estimated_seconds: 45
    question: A function runs `values = []` and returns nothing. Its caller wants an empty list after the call. Give a
      two-line repair that returns the replacement and explicitly stores it at the call site.
    answer: 'Inside the function: `return []`. At the call site: `values = reset(values)`.'
    explanation: Returning a new reference and assigning it in the caller replaces the caller's binding. Merely assigning
      to the parameter cannot do that.

  # Taught / practice evidence: Essential Python handout pp. 9, 20–24; Homework PYTHON2–3; Quiz 1 Problem 2A–D; F23 Midterm Problem 1, pp. 2–3.
  - id: cs131-v2-python-card-method-result-alias
    difficulty: basic
    bloom: understand
    estimated_seconds: 30
    question: A method returns `self.entries` directly. The caller executes `saved = obj.get_entries()` and then `saved.append(5)`.
      Why does `obj.entries` change even though the caller never assigns to that field?
    answer: The returned value is a reference to the field's list. `append` mutates that same list through the caller's
      reference.
    explanation: Returning an object reference does not copy the object or turn it into a reference to the field variable.

  # Taught / practice evidence: Essential Python handout pp. 9, 20–24; Homework PYTHON2–3; Quiz 1 Problem 2A–D; F23 Midterm Problem 1, pp. 2–3.
  - id: cs131-v2-python-card-create-two-observable-results
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 30
    question: |-
      Complete the return expression so `finish(values)` appends 2 to the original list but returns a separate list with a final 9.

      ```python
      def finish(values):
          values.append(2)
          return ...
      ```
    answer: '`return values + [9]`'
    explanation: The append mutates the shared object. Concatenation then constructs the distinct returned list, keeping
      9 out of the caller's original list.

  # Taught / practice evidence: Essential Python handout pp. 9, 20–24; Homework PYTHON2–3; Quiz 1 Problem 2A–D; F23 Midterm Problem 1, pp. 2–3.
  - id: cs131-python-card-holder-local
    difficulty: intermediate
    question: |-
      Explain why the number stays unchanged while the holder changes.

      ```python
      def spend(number, holder):
          number -= 4
          holder["number"] -= 4
      number = 10
      holder = {"number": number}
      spend(number, holder)
      print(number, holder["number"])
      ```
    answer: '`10 6`. The integer parameter is rebound, while the shared holder dictionary is mutated.'
    explanation: The caller and function begin with references to the same objects in both cases. The operations differ;
      there is no separate primitive-parameter rule.

  # Taught / practice evidence: Essential Python handout pp. 17–18, 22–24, 28; Homework PYTHON2.
  - id: cs131-python-card-string-argument
    difficulty: intermediate
    question: A function runs text = text + "!" and returns nothing. After mark(label), why is the caller’s label unchanged?
      Give a repair that makes the new string available to the caller.
    answer: Return text + "!" from mark and assign label = mark(label) at the call site.
    explanation: Strings cannot be mutated. The concatenation creates a new string; local rebinding alone does not change
      the caller’s binding.

  # Taught / practice evidence: Essential Python handout pp. 9, 20–24; Homework PYTHON2–3; Quiz 1 Problem 2A–D; F23 Midterm Problem 1, pp. 2–3.
  - id: cs131-python-card-two-parameter-child
    difficulty: advanced
    question: |-
      Predict the output and explain why a locally rebound parameter still changes input.

      ```python
      def change(a, b):
          a = a + [9]
          b.append(8)
          a[0].append(3)
          return a
      data = [[1]]
      result = change(data, data)
      print(data, result)
      ```
    answer: '`[[1, 3], 8] [[1, 3], 9]`'
    explanation: Concatenation creates another outer list but retains the inner list reference. The two outer appends/rebindings
      are separate; nested mutation remains shared.
