title: "Null Object Pattern Flashcards"
description: "Key concepts, roles, applicability, and trade-offs of the Null Object design pattern."
active: true
cards:
  - id: 1
    difficulty: basic
    question: "What is the *intent* of the Null Object pattern?"
    answer: "Provide a surrogate for another object that shares the same interface but does nothing. The Null Object encapsulates *how to do nothing* and hides those details from collaborators."
    explanation: "Also known as 'Stub' or 'Active Nothing.' The keyword is *encapsulates*: do-nothing behavior gets a named, polymorphic home instead of scattered `null` checks."

  - id: 2
    difficulty: basic
    question: "What problem does Null Object solve?"
    answer: "It represents a legitimately absent collaborator with a real no-op implementation, allowing uniform calls once construction guarantees a non-null collaborator."
    explanation: "The pattern removes repeated guards; it does not prevent callers from passing null or None. Enforce the collaborator contract at the wiring boundary."
  - id: 3
    difficulty: basic
    question: "What are the four roles in the Null Object pattern?"
    answer: "**Client** (uses the collaborator), **AbstractObject** (the interface the client expects), **RealObject** (does useful work), **NullObject** (implements the same interface but does nothing)."
    explanation: "Real and Null implementations must satisfy the same behavioral contract. A no-op is not substitutable for a method that promises a required state change merely because the signatures match."
  - id: 4
    difficulty: advanced
    question: "When should you use Null Object? Name the Applicability criteria."
    answer: "(1) An object already requires a collaborator. (2) Some legitimate instances should do nothing. (3) Clients should not have to check for null. (4) The do-nothing behavior is reusable. (5) All do-nothing behavior fits in a single class."
    explanation: "These criteria identify a useful fit. They are not a numerical Rule of Three; compare the benefit of a named no-op with the cost of extra types in the actual design."
  - id: 5
    difficulty: advanced
    question: "When should you NOT use Null Object?"
    answer: "Avoid it when absence carries information the client must act on, neutral behavior violates the contract, or a simple explicit check is clearer. A stand-in that lazily creates and forwards to a real subject is instead a Proxy."
    explanation: "Client count is a cost-benefit clue, not a prerequisite. Null Object is useful only when its no-op or neutral results are valid for the collaboration; it must not hide required errors."
  - id: 6
    difficulty: intermediate
    question: "When can a Null Object be shared, and does sharing require Singleton?"
    answer: "A stateless or safely immutable Null Object can be shared when clients do not depend on its identity. Sharing by injection or a module-level binding does not require enforced Singleton construction."
    explanation: "The Python module-level instance is shared by convention; another SilentLogger() is still allowed. A Singleton adds a construction restriction and a point of access."
  - id: 7
    difficulty: intermediate
    question: "What is a *Null Strategy*? Give an example."
    answer: "A ConcreteStrategy whose implementation does nothing — the Strategy pattern with a Null Object playing one of the strategy roles. Example: `FlyNullObject` implements `FlyBehavior` so that `RubberDuck` can `setFlyBehavior(new FlyNullObject())` without overriding `fly()` to do nothing."
    explanation: "From the SimUDuck example in *Head First Design Patterns*. The duck's call site stays uniform (`flyBehavior.fly()`), and 'this duck does not fly' becomes a real, named behavior instead of an absent reference."

  - id: 8
    difficulty: intermediate
    question: "What is a *Null State*? Give an example."
    answer: "A ConcreteState whose operations all do nothing or return null results — the State pattern with a Null Object playing one of the state roles. Example: a `NotLoggedInState` whose `viewProfile()` does nothing because the user has no profile to show yet."
    explanation: "All operations covered by the Null State contract must have valid no-op or neutral-result behavior. A state with an active login or start transition is not wholly null just because other operations do nothing."
  - id: 9
    difficulty: advanced
    question: "Why is a pass-through Decorator different from a Null Object?"
    answer: "A pass-through Decorator adds no behavior but still invokes its component. A Null Object itself supplies the valid no-op or neutral result."
    explanation: "A decorator can wrap a Null Object. Classify the collaboration and call behavior, not whether a class name contains Null."
  - id: 10
    difficulty: intermediate
    question: "What is the most dangerous *liability* of the Null Object pattern?"
    answer: "Its valid no-op or neutral-result behavior can hide an incorrect binding. If a service requires recorded diagnostics but receives a SilentLogger, missing behavior may go unnoticed."
    explanation: "Use a descriptive name, inspect configuration, and test required behavior. Startup logs aid diagnosis but do not ensure an incorrect binding is noticed or rejected."
  - id: 11
    difficulty: advanced
    question: "How is Null Object different from a Proxy?"
    answer: "Proxy controls access to another subject. Null Object supplies no-op behavior instead of forwarding to a real subject. The client may later replace its Null Object reference without the Null Object itself transforming."
    explanation: "Distinguish replacing a collaborator reference from a stable proxy switching its underlying subject."
  - id: 12
    difficulty: advanced
    question: "How does Null Object relate to Fowler's *Special Case* pattern?"
    answer: "Special Case handles exceptional instances uniformly through a common interface. Null Object is the specialization for an absent collaborator with valid no-op or neutral-result behavior."
    explanation: "A default such as Unknown does not by itself distinguish the patterns: neutral results can be valid Null Object behavior too. Examine the role of the absent collaborator and its contract."
  - id: 13
    difficulty: advanced
    question: "How does Null Object relate to `Optional` / `Maybe` types?"
    answer: "Optional or Maybe represents presence or absence explicitly. Null Object supplies uniform behavior after absence has been resolved to a no-op collaborator. Use the former when callers must distinguish absence; combine them at a wiring boundary when useful."
    explanation: "Exhaustive matching can require handling both cases. Java Optional.get() can still throw on an empty value, so Optional does not universally force safe handling."
  - id: 14
    difficulty: advanced
    question: "What's a `NullIterator`, and where does it appear in real codebases?"
    answer: "An `Iterator` whose `hasNext()` always returns `false`. A leaf node in a tree returns one when asked for an iterator over its (non-existent) children, so clients iterate uniformly over leaves and composites."
    explanation: "Java Collections.emptyIterator() and Python iter([]) are empty iterators. C++ std::ranges::empty_view is an empty range, not itself an iterator. Exhausted iterators still obey their language-specific end-of-iteration contract."
  - id: 15
    difficulty: intermediate
    question: "Why should a Null Object be *named for what it does*, not labeled as 'default'?"
    answer: "SilentLogger or EmptyPermissions describes the behavior directly. DefaultLogger only describes its selection policy, which may conceal a surprising no-op. A Null Object can be a legitimate default, but its behavior should still be clear."
    explanation: "A descriptive name supports review; it cannot prove configuration is correct. Validate required bindings and test their behavior."
