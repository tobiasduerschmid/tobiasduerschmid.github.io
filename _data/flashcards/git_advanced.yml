title: "Advanced Git Flashcards"
description: "Which Git command would you use for the following advanced scenarios?"
active: true
cards:
  - id: 1
    difficulty: basic
    question: "You have some uncommitted, incomplete changes in your working directory, but you need to switch to another branch to urgently fix a bug. Which Git command temporarily saves your current work without making a messy commit?"
    answer: "`git stash`"
    explanation: "`git stash` temporarily shelves your staged and unstaged changes for tracked files. To include brand new, untracked files in the stash, you must use `git stash -u`."
  - id: 2
    difficulty: basic
    question: "You know a bug was introduced recently, but you aren't sure which commit caused it. Which Git command performs a binary search through your commit history to find the exact commit that broke the code?"
    answer: "`git bisect`"
    explanation: "`git bisect` systematically halves your commit history, asking you to test if the bug is present at each step, making it highly efficient for tracking down regressions."
  - id: 3
    difficulty: basic
    question: "You are looking at a file and want to know exactly who last modified a specific line of code, and in which commit they did it. Which Git command shows this?"
    answer: "`git blame`"
    explanation: "`git blame` annotates each line of a file with the author and the commit hash of the last modification, which is very useful for figuring out who to ask about a piece of code."
  - id: 4
    difficulty: basic
    question: "You have a feature branch with several experimental commits, but you only want to move one specific, completed commit over to your main branch. Which Git command does this?"
    answer: "`git cherry-pick`"
    explanation: "`git cherry-pick` allows you to selectively grab a specific commit from one branch and apply it onto your current branch, without merging the entire branch history."
  - id: 5
    difficulty: intermediate
    question: "You want to integrate a feature branch into main, but instead of bringing over all 15 tiny incremental commits, you want them combined into one clean commit on the main branch. Which Git command does this?"
    answer: "`git merge --squash`"
    explanation: "Squashing collapses every patch from the feature branch into one set of changes, so a single clean commit lands on the target branch. It only **stages** those changes, though — you must follow it with `git commit` to materialise the squashed commit."
  - id: 6
    difficulty: intermediate
    question: "You are building a massive project and want to include an entirely separate external Git repository as a subdirectory within your project, while keeping its history independent. Which Git command does this?"
    answer: "`git submodule add <url> <path>`"
    explanation: "`git submodule add` clones the external repo into `<path>` and records a gitlink (mode `160000`) pointing at its current commit SHA, plus a `.gitmodules` entry with the URL. The outer repo stores just that pinned SHA — no file duplication. Teammates get the content via `git clone --recursive` (or `git submodule update --init` after a plain clone)."
  - id: 7
    difficulty: intermediate
    question: "Instead of creating a merge commit, you want to take the commits from your feature branch and re-apply them directly on top of the latest 'main' branch to create a clean, linear history. Which Git command does this?"
    answer: "`git rebase main`"
    explanation: "Rebasing with `git rebase` rewrites history by moving the base of your current branch to the tip of another, which creates a cleaner history but should be avoided on public/shared branches."
  - id: 8
    difficulty: intermediate
    question: "You want to safely inspect the codebase at a specific older commit without modifying any branch. Which Git command does this?"
    answer: "`git checkout <commit-hash>` (or `git switch --detach <commit-hash>`)"
    explanation: "Checking out a commit directly (rather than a branch) places you in 'detached HEAD' state, where HEAD points to a specific commit rather than a branch. You can look around freely, but any commits made here are not anchored to a branch and can be lost when switching away. Use `git switch -c <name>` to anchor them to a new branch if needed."

  - id: 9
    difficulty: intermediate
    question: '`git reflog` reveals a lost fix at `abc1234`. Create a branch named `recovered-fix` at that commit
      without changing your current checkout.'
    answer: '`git branch recovered-fix abc1234`'
    explanation: A branch keeps the still-existing commit reachable. Inspect it before deciding whether to merge or
      cherry-pick its changes; reflogs and unreachable objects are not retained forever.

  - id: 10
    difficulty: advanced
    question: A regression detector is stored outside the repository at `/tmp/check_export.sh`. Write a bisect sequence
      using known revisions `bad_rev` and `good_rev`.
    answer: |-
      ```sh
      git bisect start bad_rev good_rev
      git bisect run /bin/sh /tmp/check_export.sh
      git bisect reset
      ```
    explanation: The detector must exercise the current checkout, remain compatible across candidates, and return
      0 for good or 1 for the targeted regression. Keeping it outside the checkout prevents historical checkouts from
      removing it.

  - id: 11
    difficulty: advanced
    question: What extra rule makes squash-merged TDD work useful for bisecting `main`?
    answer: Merge only a completed, passing feature, and use a consistent detector for the particular regression.
    explanation: Squashing combines commits but does not make broken code pass. Keeping intentional red steps off
      main removes one confounder; the chosen good/bad property must still hold consistently across the searched history.
