title: "Python — Explain the Code"
description: "Predict Python results and explain the bindings, shared objects, and language rules behind them."
active: true
cards:
  - id: 1
    difficulty: basic
    question: |
      You are shown Python code. Explain what it does and what it returns or prints.

      ```python
      score = 95
      gpa = 3.82
      print(f"Score: {score}, GPA: {gpa:.1f}")
      ```
    answer: "Prints `Score: 95, GPA: 3.8` — the `f\"...\"` is an **f-string** that embeds variables inside `{}`. The `:.1f` format specifier rounds the float to 1 decimal place."
  - id: 2
    difficulty: intermediate
    question: |
      You are shown Python code. Explain what it does and what it returns or prints.

      ```python
      7 / 2
      7 // 2
      ```
    answer: "`7 / 2` → `3.5`; division of built-in integers produces a float. `7 // 2` → `3`; floor division rounds down. For negative integers, Python flooring differs from C++ truncation: `-7 // 2` is `-4`."
  - id: 3
    difficulty: basic
    question: |
      You are shown Python code. Explain what it does and what it returns or prints.

      ```python
      x = "5" + 3
      ```
    answer: "Raises `TypeError`: this addition cannot concatenate a string and an integer. Choose the intended operation explicitly: `int(\"5\") + 3` → `8` or `\"5\" + str(3)` → `\"53\"`. Dynamic typing does not promise automatic conversion."
  - id: 4
    difficulty: basic
    question: |
      You are shown Python code. Explain what it does and what it returns or prints.

      ```python
      squares = [x**2 for x in range(1, 6)]
      ```
    answer: "Produces `[1, 4, 9, 16, 25]` — a **list comprehension** that squares each number from 1 to 5. `range(1, 6)` is exclusive of the stop value. `**` is the exponentiation operator."
  - id: 5
    difficulty: intermediate
    question: |
      You are shown Python code. Explain what it does and what it returns or prints.

      ```python
      nums = [4, 8, 15, 16, 23, 42]
      big = [x for x in nums if x > 20]
      ```
    answer: "Produces `[23, 42]` — a list comprehension with a **filter condition**. Only elements where `x > 20` are included."
  - id: 6
    difficulty: intermediate
    question: |
      You are shown Python code. Explain what it does and what it returns or prints.

      ```python
      with open("data.txt") as f:
          for line in f:
              print(line.strip())
      ```
    answer: "Opens `data.txt`, reads it line by line, and prints each line with leading/trailing whitespace removed. The `with` statement is a **context manager** that automatically closes the file when the block exits, even if an exception occurs."
  - id: 7
    difficulty: intermediate
    question: |
      You are shown Python code. Explain what it does and what it returns or prints.

      ```python
      for i, fruit in enumerate(["apple", "banana", "cherry"]):
          print(f"{i}: {fruit}")
      ```
    answer: "Prints `0: apple`, `1: banana`, `2: cherry`. `enumerate()` yields `(index, value)` pairs — the Pythonic way to get both index and element without using `range(len(...))`."
  - id: 8
    difficulty: advanced
    question: |
      You are shown Python code. Explain what it does and what it returns or prints.

      ```python
      import re
      codes = re.findall(r'\d+', "Error 404 and 500")
      ```
    answer: "Returns `['404', '500']` — a **list of strings** matching all non-overlapping occurrences of one or more digits (`\\d+`). The `r'...'` is a raw string that preserves backslashes for the regex engine."
  - id: 9
    difficulty: advanced
    question: |
      You are shown Python code. Explain what it does and what it returns or prints.

      ```python
      import re
      clean = re.sub(r'\d+\.\d+\.\d+\.\d+', 'x.x.x.x', text)
      ```
    answer: "Replaces each match of four digit groups separated by dots with `'x.x.x.x'`. This simple pattern can redact address-shaped text but does not validate IPv4 ranges; it would also match `999.999.999.999`. `re.sub` returns the changed string."
  - id: 10
    difficulty: advanced
    question: |
      You are shown Python code. Explain what it does and what it returns or prints.

      ```python
      import sys
      print("Error: file not found", file=sys.stderr)
      sys.exit(1)
      ```
    answer: "Prints the error message to **stderr** (not stdout), then exits with code 1 (failure). `file=sys.stderr` is like C++'s `std::cerr`. `sys.exit(1)` is like C's `exit(1)`."
  - id: 11
    difficulty: advanced
    question: |
      You are shown Python code. Explain what it does and what it returns or prints.

      ```python
      2 ** 8
      2 ^ 8
      ```
    answer: "`2 ** 8` → `256` (exponentiation — two to the eighth power). `2 ^ 8` → `10` (**bitwise XOR** — NOT exponentiation!). This is a common mistake from math notation."
  - id: 12
    difficulty: advanced
    question: |
      You are shown Python code. Explain what it does and what it returns or prints.

      ```python
      import sys
      filename = sys.argv[1]
      ```
    answer: "Gets the first command-line argument. `sys.argv[0]` is the script name itself (like C's `argv[0]`). If no argument is provided, this raises an `IndexError`."

  - id: 13
    difficulty: intermediate
    question: |
      Predict the output. Which objects change, and which names are rebound?
      ```python
      samples = 1024
      archived = samples
      samples += 1
      samples = None
      print(archived, samples is None)
      ```
    answer: "Prints `1024 True`. Integers are immutable objects. Incrementing samples binds that name to a different integer; assigning None rebinds it again. archived still refers to the original integer, so that object remains reachable."

  - id: 14
    difficulty: advanced
    question: |
      Predict the output and distinguish attribute assignment from member mutation.
      ```python
      class WeatherLog:
          zone = "north"
          alerts = []

      first = WeatherLog()
      second = WeatherLog()
      first.zone = "roof"
      WeatherLog.zone = "south"
      first.alerts.append("rain")
      print(first.zone, second.zone, second.alerts)
      ```
    answer: "Prints `roof south ['rain']`. first.zone shadows the class default; second still looks up the current class value. Neither instance owns an alerts attribute, so both find and share the class list. append mutates that list rather than creating an instance attribute."

  - id: 15
    difficulty: advanced
    question: |
      Predict the output. Why do the two copied slots still refer to the same inner list?
      ```python
      import copy
      samples = [5]
      live = [samples, samples]
      saved = copy.deepcopy(live)
      saved[0].append(8)
      print(live, saved, saved[0] is saved[1])
      ```
    answer: "Prints `[[5], [5]] [[5, 8], [5, 8]] True`. Deepcopy creates one independent inner list and remembers that both original slots referred to it. The copied graph preserves that sharing without sharing its mutable samples with live."

  - id: 16
    difficulty: advanced
    question: |
      Predict the output. Does the super call operate on a second object?
      ```python
      class Counter:
          def __init__(self):
              self.total = 0
          def tick(self):
              self.total += 1
          def sample(self):
              self.tick()

      class RainCounter(Counter):
          def tick(self):
              super().tick()
              self.total += 2

      rain = RainCounter()
      rain.sample()
      print(rain.total)
      ```
    answer: "Prints `3`. RainCounter inherits the initializer. The inherited sample method receives the RainCounter instance and dispatches to its tick override. super().tick() changes the same instance by 1, then the override adds 2; no second Counter is constructed."

  - id: 17
    difficulty: advanced
    question: |
      Predict the output. How does choosing one copy operation or two affect sharing?
      ```python
      import copy

      samples = [6]
      together = copy.deepcopy([samples, samples])
      apart = [copy.deepcopy(samples), copy.deepcopy(samples)]
      print(together[0] is together[1], apart[0] is apart[1])
      ```
    answer: "Prints `True False`. One deepcopy operation remembers objects already copied, so together preserves the two references to one copied list. The two independent calls use separate copy tracking and produce separate lists for apart. All of these copied inner lists are independent of samples."

  - id: 18
    difficulty: advanced
    question: |
      Predict the output. Does using None as the default prohibit all sharing?
      ```python
      class SampleBatch:
          def __init__(self, readings=None):
              self.readings = [] if readings is None else readings

      supplied = []
      first = SampleBatch(supplied)
      second = SampleBatch(supplied)
      third = SampleBatch()
      first.readings.append(6)
      print(second.readings, third.readings)
      ```
    answer: "Prints `[6] []`. The None default prevents accidental reuse of an omitted list argument. This constructor deliberately keeps any supplied list, so the first two batches share supplied. The third batch creates its own list. To forbid that deliberate sharing too, the constructor would need a different ownership contract and an appropriate copy."
  - id: 19
    difficulty: intermediate
    question: |
      Predict the output and explain why the two aliases differ.
      ```python
      label = "dark"
      saved_label = label
      label += " frame"

      frames = ["dark"]
      saved_frames = frames
      frames += ["flat"]
      print(saved_label, saved_frames)
      ```
    answer: "Prints `dark ['dark', 'flat']`. A string cannot change, so `label += \" frame\"` builds a new string and rebinds only `label`. A list supports in-place extension, so `frames += [\"flat\"]` mutates the object that `saved_frames` also names. The same `+=` spelling has different effects on immutable and mutable objects."
  - id: 20
    difficulty: intermediate
    question: |
      Predict the output. Does the tuple prevent the change?
      ```python
      batch = ([], "north")
      batch[0].append("dust")
      print(batch)
      ```
    answer: "Prints `(['dust'], 'north')` without an error. A tuple fixes which objects occupy its slots, not whether those objects can change; `append` mutates the list and never assigns to the tuple. By contrast, `batch[0] += [\"dust\"]` would extend the list and then raise `TypeError` when it tried to store the result back into the tuple's slot."
  - id: 21
    difficulty: advanced
    question: |
      Predict the output and explain it.
      ```python
      squares = []
      for n in range(3):
          def square():
              return n * n
          squares.append(square)
      print(squares[0]())
      ```
    answer: "Prints `4`, not `0`. The body of `square` looks up `n` when it is called. By then the loop has finished and `n` is still bound to `2`, because a `for` loop does not create a scope. Capture the current value with a default argument, `def square(n=n):`, because defaults are evaluated when `def` executes."
  - id: 22
    difficulty: intermediate
    question: |
      Predict the output. Why does this loop remove every `3`?
      ```python
      readings = [7, 3, 3, 9]
      for value in readings[:]:
          if value == 3:
              readings.remove(value)
      print(readings)
      ```
    answer: "Prints `[7, 9]`. `readings[:]` makes a shallow copy, so the loop steps through a list that never changes while `remove` edits the original. Looping over `readings` itself would print `[7, 3, 9]`: each removal shifts later items into positions the loop has already visited."
  - id: 23
    difficulty: intermediate
    question: |
      Predict both lines of output.
      ```python
      temps = [3, 1, 2]
      print(sorted(temps), temps)
      print(temps.sort(), temps)
      ```
    answer: "Prints `[1, 2, 3] [3, 1, 2]`, then `None [1, 2, 3]`. `sorted()` returns a new list and leaves `temps` alone. `temps.sort()` reorders `temps` in place and returns `None`, the usual sign of a mutating method. The second argument is evaluated after that call, so it shows the sorted list."
  - id: 24
    difficulty: intermediate
    question: |
      Predict the output. What would happen without the `global` line?
      ```python
      count = 0

      def record():
          global count
          count += 1

      record()
      record()
      print(count)
      ```
    answer: "Prints `2`. Without `global count`, the assignment in `count += 1` would make `count` local to the whole function, and reading it before it has a value would raise `UnboundLocalError`. The declaration makes the function rebind the module-level name instead. Returning the new value is often clearer than relying on a global."
  - id: 25
    difficulty: intermediate
    question: |
      Predict the output. Why is there no `ZeroDivisionError`?
      ```python
      print("" or "anonymous", "Ann" or "anonymous")
      print(0 and 10 / 0)
      ```
    answer: "Prints `anonymous Ann`, then `0`. `or` returns its first truthy operand and `and` returns its first falsy one; neither converts the result to `bool`. `0 and 10 / 0` stops at the falsy `0`, so the division never runs."
  - id: 26
    difficulty: advanced
    question: |
      Predict the output.
      ```python
      print(round(0.5), round(1.5), round(-2.5))
      ```
    answer: "Prints `0 2 -2`. `round()` resolves exact halves to the nearest even integer, for negative values too. C++'s `std::round` rounds halves away from zero and would give 1, 2, and -3."
  - id: 27
    difficulty: intermediate
    question: |
      Predict the output.
      ```python
      x = 7
      print(1 < x < 10, 10 > x > 8)
      ```
    answer: "Prints `True False`. A chained comparison checks each adjacent pair and combines the results with `and`: `1 < x and x < 10` is true, while `10 > x and x > 8` is false. C++ would instead compare the Boolean result of the first comparison with the third operand."
  - id: 28
    difficulty: intermediate
    question: |
      Predict the output. How would `dict.fromkeys` change it?
      ```python
      logs = {dome: [] for dome in ["north", "south"]}
      logs["north"].append("dust")
      print(logs)
      ```
    answer: "Prints `{'north': ['dust'], 'south': []}`. A comprehension evaluates `[]` once per key, so each dome gets its own list. `dict.fromkeys([\"north\", \"south\"], [])` would store one shared list under both keys, and the append would appear under both."
