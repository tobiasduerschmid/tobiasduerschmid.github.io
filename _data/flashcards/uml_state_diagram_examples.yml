title: "UML State Machine Diagram Flashcards"
description: "Quick review of UML State Machine Diagram notation and transitions."
active: true
cards:
  - id: 1
    difficulty: basic
    question: "What is the syntax for a **transition label** in a state machine diagram?"
    answer: "`Event [Guard] / Effect`"
    explanation: >
      All three parts are optional. The **Event** is the trigger, the **Guard** (in square brackets) is a boolean condition that must be true, and the **Effect** (after `/`) is the action executed during the transition. Example: `buttonPressed [isEnabled] / playSound()`.

  - id: 2
    difficulty: basic
    question: "What do the **initial pseudostate** and **final state** look like?"
    answer: "Initial = solid black circle. Final = solid circle inside a hollow circle (bullseye)."
    explanation: >
      The **initial pseudostate** (<span class="uml-sym" data-diagram="state" data-sym="[*]"></span>) is the entry point — it may have at most one outgoing transition, with no trigger or guard. The **final state** (◎) indicates that its enclosing region has completed; it does not itself destroy the context object.

      <div data-uml-type="state" data-uml-spec="[*] --> Active&#10;Active --> [*] : destroy()"></div>

  - id: 3
    difficulty: intermediate
    question: "What happens when a transition's **guard condition** evaluates to false?"
    answer: "That transition does **not** fire. Another enabled transition may still be taken."
    explanation: >
      A guard acts as a gatekeeper. Even if the triggering event occurs, the transition is only taken if the guard is true. If false, this transition is disabled. The object stays put only if no other enabled transition handles the event.

  - id: 4
    difficulty: intermediate
    question: "How should states be **named** according to UML conventions?"
    answer: "Use **present-participial phrases** (e.g., *Processing*, *WaitingForInput*) or **noun phrases** (e.g., *Active*, *Idle*)."
    explanation: >
      A state name should answer "what condition is the object in?" — so use *LoggedIn*, *Authenticating*, *Idle*, not action verbs like *Login* or *doPayment*.

  - id: 5
    difficulty: intermediate
    question: "When should you use a **state machine diagram** instead of a **sequence diagram**?"
    answer: "When modeling the **lifecycle of a single object** whose behavior depends on its current state."
    explanation: >
      State machines focus on **one object** reacting differently to events based on its state. Sequence diagrams show **interactions between multiple objects** over time. Use state machines for objects with complex, state-dependent behavior (e.g., a UI component, order lifecycle, hardware controller).

  - id: 6
    difficulty: advanced
    question: "What are the three types of **internal activities** a state can have?"
    answer: "`entry /` (runs on entering), `exit /` (runs on leaving), `do /` (runs while in the state)."
    explanation: >
      Internal activities execute at specific points: **entry/** runs every time the state is entered (regardless of which transition was taken), **exit/** runs every time the state is exited, and **do/** starts after entry and may finish while the state remains active; if still running when the state exits, it is aborted. These are different from transition effects, which only execute during a specific transition.

  - id: 7
    difficulty: intermediate
    question: "Does a state machine always need a **final state**?"
    answer: "No. Final states mark region completion. Initial pseudostates mark default entry, with at most one per region; other explicit entry paths are possible."
    explanation: >
      Many real-world objects run indefinitely (e.g., a server, a hardware controller). Their state machines have an initial state but no final state. An order workflow can use a final state to mark completion after delivery or cancellation without implying that the stored order object is destroyed.
