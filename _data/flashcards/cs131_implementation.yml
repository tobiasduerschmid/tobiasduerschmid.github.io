title: 'CS 131: Language Implementation'
description: Produce token traces, small grammar repairs, and interpreter state updates before revealing
  the answer.
active: true
# Source-aligned review against lecture notes and homework. Times are author estimates.
cards:
  # Taught: [02] Programming Implementation Palooza (Public).docx, Tokenizing (aka Lexing).
  # Practice: Fall 2025 Quiz 1 v2, Problem 1 (Parser Panic); trace longest matches and rule-order ties.
  - id: cs131-v2-implementation-card-longest-match
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 35
    question: Rules are `"in" → IN` then `[a-z]+ → ID`, with longest match before rule order. Give the
      tokens for `in ink`. Spaces are ignored.
    answer: '`IN`, then `ID("ink")`.'
    explanation: 'Self-check: use rule order for in, but match length for ink.'

  # Taught: [02] Programming Implementation Palooza (Public).docx, Tokenizing (aka Lexing).
  # Practice: Fall 2025 Quiz 1 v2, Problem 1 (Parser Panic); trace longest matches and rule-order ties.
  - id: cs131-v2-implementation-card-keyword-fix
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: The parser needs a WHILE token, but `while` becomes ID because the ID rule is earlier. Longest-match
      ties use rule order. Give the smallest rule-order repair and one identifier that should still stay
      ID.
    answer: Move the exact while keyword rule before ID. For example, whileloop must remain one ID because
      its full match is longer.
    explanation: 'Self-check: fix the tie without splitting identifiers that contain the keyword.'

  # Taught: [02] Programming Implementation Palooza (Public).docx, Tokenizing (aka Lexing); Parsing.
  # Practice: Homework TOOLS1; Fall 2025 Quiz 1 v2, Problem 1 (Parser Panic); identify the first failing stage.
  - id: cs131-v2-implementation-card-phase-reason
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 40
    question: A lexer produces `ID ASSIGN ID` for `item=pear`, but the only assignment rule is `ID ASSIGN
      NUM`. Name the failing stage and the precise mismatch.
    answer: 'Parsing fails: the third token is ID where the assignment production requires NUM.'
    explanation: 'Self-check: pear is a valid identifier token, so this is not a lexical failure.'

  # Taught: [02] Programming Implementation Palooza (Public).docx, Parsing.
  # Practice: Homework TOOLS2; Fall 2025 Quiz 1 v2, Problem 1 (Parser Panic); determine membership and justify missing/repeated symbols.
  - id: cs131-v2-implementation-card-optional-language
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 35
    question: Using `items = ID { COMMA ID } ;`, give the minimum number of IDs and explain whether an
      empty list of tokens is accepted.
    answer: At least one ID is required. The braces permit zero additional comma–ID pairs, but do not
      remove the leading ID.
    explanation: 'Self-check: separate the required prefix from the repeated suffix.'

  # Taught: [02] Programming Implementation Palooza (Public).docx, Parsing.
  # Practice: Homework TOOLS2; Fall 2025 Quiz 1 v2, Problem 1 (Parser Panic); determine membership and justify missing/repeated symbols.
  - id: cs131-v2-implementation-card-build-grammar
    difficulty: intermediate
    bloom: create
    estimated_seconds: 50
    question: Write one grammar rule for `args` that allows either no arguments or a comma-separated list
      of one or more ID tokens. Use optional brackets and repetition braces.
    answer: '`args = [ ID { COMMA ID } ] ;`'
    explanation: 'Self-check: accept empty, ID, and ID COMMA ID; reject COMMA ID and ID COMMA. Equivalent
      grammars meeting these cases are acceptable.'

  # Taught: [02] Programming Implementation Palooza (Public).docx, Parsing is tricky.
  # Practice: Lecture expression-grouping exercise; supports grammar reasoning in Homework TOOLS2. No exact past-exam counterpart claimed.
  - id: cs131-v2-implementation-card-parse-witness
    difficulty: intermediate
    bloom: create
    estimated_seconds: 50
    question: For `expr = expr MINUS expr | NUM ;`, give two groupings of `9 - 4 - 1` that demonstrate
      ambiguity, and their values.
    answer: '`(9 - 4) - 1 = 4`; `9 - (4 - 1) = 6`.'
    explanation: 'Self-check: preserve the original token order while changing only grouping. Different
      grouping is possible because no associativity rule is supplied.'

  # Taught: [02] Programming Implementation Palooza (Public).docx, Parsing is tricky.
  # Practice: Lecture expression-grouping exercise; supports grammar reasoning in Homework TOOLS2. No exact past-exam counterpart claimed.
  - id: cs131-v2-implementation-card-precedence-tree
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: For `4 * 3 + 2`, multiplication binds more tightly than addition. What is the root operator
      of the syntax tree, and what expression is its left child?
    answer: The root is `+`; its left child is the subtree for `4 * 3`.
    explanation: 'Self-check: the higher-precedence operation forms a nested subtree; the lower-precedence
      operation combines its result.'

  # Taught: [02] Programming Implementation Palooza (Public).docx, Semantic analysis.
  # Practice: Homework TOOLS1: distinguish semantic checks from token and grammar checks.
  - id: cs131-v2-implementation-card-semantic-evidence
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 35
    question: A parser accepts `deliver(5, 6)`. What additional information is needed to decide whether
      the number of arguments is valid?
    answer: The declared parameter list or signature of deliver, including how many arguments it accepts.
    explanation: 'Self-check: a valid call shape alone does not prove that this function accepts two arguments.'

  # Taught: [02] Programming Implementation Palooza (Public).docx, Code generation.
  # Practice: Homework TOOLS3: identify changed stages when source or target changes.
  - id: cs131-v2-implementation-card-target-backend
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 35
    question: A compiler shares its intermediate code across two machine-code targets. For a new processor,
      which parts can be reused, and which target stages are needed?
    answer: Reuse the source frontend and shared intermediate code. The new target needs code generation
      for its assembly and an assembler that turns those instructions into machine code.
    explanation: 'Self-check: separate source-language processing from target instruction generation,
      including the assembler.'

  # Taught: [02] Programming Implementation Palooza (Public).docx, Interpreters.
  # Practice: Homework TOOLS5: implement commands using variable state; Fall 2024 Midterm V1 Problem 5 (PDF pp. 9–12) extends this to scoped interpreter state.
  - id: cs131-v2-implementation-card-map-update
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: 'The toy interpreter stores `level: 8`. It executes `add level -3`, then `set level 2`.
      What is stored after each instruction?'
    answer: 'After add: `level: 5`. After set: `level: 2`.'
    explanation: 'Self-check: add uses the prior value; set replaces it.'

  # Taught: [02] Programming Implementation Palooza (Public).docx, Interpreters.
  # Practice: Homework TOOLS5: implement commands using variable state; Fall 2024 Midterm V1 Problem 5 (PDF pp. 9–12) extends this to scoped interpreter state.
  - id: cs131-v2-implementation-card-program-repair
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: |-
      Repair one line so this toy program prints 9. Preserve the starting value and the use of add.

      ```text
      set value 4
      add value 9
      print value
      end
      ```
    answer: Change the update to `add value 5`.
    explanation: 'Self-check: the operand of add is the increment, not the desired final value.'

  # Taught: [02] Programming Implementation Palooza (Public).docx, Semantic analysis.
  # Practice: Homework TOOLS1: distinguish semantic checks from token and grammar checks.
  - id: cs131-v2-implementation-card-declaration-diagnostic
    difficulty: intermediate
    bloom: evaluate
    estimated_seconds: 45
    question: A student says an undeclared variable must be a lexer error. Give a short counterexample
      using a valid identifier and identify the check that actually needs its declaration.
    answer: For example, `count + 1` can tokenize with count as ID even if count is undeclared. Semantic
      name checking consults declarations and rejects that use.
    explanation: 'Self-check: explain why a word can be a valid identifier token without naming a declared
      variable.'
