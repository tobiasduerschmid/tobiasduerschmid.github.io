title: "Factory Method & Abstract Factory Flashcards"
description: "Key concepts and comparisons for creational design patterns."
active: true
cards:
  - id: 1
    difficulty: basic
    question: "What problem does Factory Method solve?"
    answer: "Lets subclasses vary which product a creator uses without changing the creator's workflow."
    explanation: "The creation hook may be abstract or have a default implementation. A concrete creator overrides it to select a product; a parameterized override may still contain a conditional. Application setup must select the appropriate creator."
  - id: 2
    difficulty: basic
    question: "What are the four roles in Factory Method?"
    answer: "**Product** (interface), **Concrete Product** (implementation), **Creator** (declares factory method + business logic), **Concrete Creator** (implements factory method)."
    explanation: "The Creator may contain a high-level workflow (a Template Method) that calls the factory method. Subclasses provide the concrete product without the Creator knowing which type it gets."
  - id: 3
    hint: >-
      In the pizza examples, compare varying the pizza created by a store with selecting matching dough and sauce. Locate the decision that must vary in each case.
    difficulty: intermediate
    question: "Factory Method vs. Abstract Factory: when to use which?"
    answer: "Factory Method: vary a creator's creation hook through subclasses. Abstract Factory: supply a factory object responsible for a coordinated product family."
    explanation: "Factory Method uses inheritance (subclass overrides). Abstract Factory uses composition (client receives a factory object). Factory methods lurk inside Abstract Factories."
  - id: 4
    difficulty: advanced
    question: "What is a parameterized factory method?"
    answer: "A single factory method that takes a parameter (string/enum) to decide which product to create. Convenient when the product set is stable, but the conditional must be modified to add a new product type unless a subclass overrides the method."
    explanation: "GoF presents parameterized factory methods as a polymorphic-extension variation: subclasses can override the method, add new IDs, and fall through to `super` for known types. The base creator is open to extension through that hook. A small stable conditional may still be preferable to a hierarchy; choose the extension mechanism for the changes the system needs."
  - id: 5
    difficulty: advanced
    question: "How does Factory Method relate to Abstract Factory?"
    answer: "Abstract Factory is often implemented using Factory Methods: concrete factories override operations such as `createDough()` and `createSauce()`."
    explanation: "Those overrides choose products in one family. This is not mandatory: a prototype-based Abstract Factory may clone configured product instances instead."
  - id: 6
    hint: >-
      Add a new ingredient category to a factory that already supplies several regional families. Trace which existing contracts and implementations must respond.
    difficulty: advanced
    question: "What is the 'Rigid Interface' drawback of Abstract Factory?"
    answer: "Adding a new product type to the family requires changing the interface and modifying *every* concrete factory."
    explanation: "The pattern has an asymmetry: adding new families is easy (pure addition), but adding new product types is hard (changes ripple). This is a fundamental design trade-off."
  - id: 7
    difficulty: intermediate
    question: "Abstract Factory uses ___ ; Factory Method uses ___."
    answer: "Abstract Factory uses **object composition** (client receives a factory). Factory Method uses **inheritance** (subclass overrides a method)."
    explanation: "This is the key structural difference. The mechanisms can coexist. Switching a factory affects future creation; existing products are not automatically replaced. Neither pattern alone prescribes instance count or overall complexity."
