cards:
  # Lecture: oop_palooza_v7_handouts.pdf pp.41–42.
  # Assessment: Fall 2025 Quiz 3, Problem 1; identify the receiver whose state a call changes.
  - id: cs131-v2-oop-card-receiver-call
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 30
    question: |
      Rewrite `bag.put("pen")` as a call through the Python class name `Bag`. Which argument becomes self?

      ```python
      class Bag:
          def put(self, item): self.item = item
      ```
    answer: '`Bag.put(bag, "pen")`; bag becomes self.'
    explanation: "The receiver before the dot is supplied as the instance method's first argument. The item argument remains pen."

  # Lecture: oop_palooza_v7_handouts.pdf pp.33–34.
  # Assessment: [Final] S23 V1 (Public).pdf, Problem 11 pp.21–22; reason about which operations remain accessible.
  - id: cs131-v2-oop-card-access-reason
    difficulty: basic
    bloom: understand
    estimated_seconds: 30
    question: "In C++, Base has private data n and public get(). Child publicly inherits Base. Why can Child call get() even though Child's methods cannot directly read n?"
    answer: "get() is inherited as a public operation. Its Base-defined body is allowed to access Base's private n."
    explanation: "Access control is checked where a member is accessed. Using a public method does not give the caller direct access to its private implementation."

  # Lecture: oop_palooza_v7_handouts.pdf pp.96–100.
  # Assessment: [Final] F22 (Public).pdf, Problem 15 p.8; trace lifecycle effects in execution order.
  - id: cs131-v2-oop-card-lifetime-trace
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 30
    question: "A C++ Leaf publicly derives from Middle, which publicly derives from Root. Their constructor bodies print R, M, L respectively; their destructor bodies print r, m, l respectively. A scope creates one Leaf and then ends. Give the six-character output."
    answer: "`RMLlmr`"
    explanation: "Construction executes base bodies before derived bodies: Root, Middle, Leaf. Destruction reverses that order: Leaf, Middle, Root."

  # Lecture: oop_palooza_v7_handouts.pdf pp.54,66,69,85–86.
  # Assessment: Fall 2025 Quiz 4, Problem 1(c–e); infer transitive subtype guarantees.
  - id: cs131-v2-oop-card-subtype-chain
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 45
    question: "C is a subtype of B, and B is a subtype of A. A exposes public ping(). Can code expecting A accept a C, and can it rely on ping()? Answer both parts with one reason."
    answer: "Yes to both. The subtype chain preserves A's public operations and permits C wherever A is expected."
    explanation: "Subtype relationships are transitive. This conclusion uses subtype inheritance; implementation reuse by itself would not establish it."

  # Lecture: oop_palooza_v7_handouts.pdf pp.135,140.
  # Assessment: Fall 2025 Quiz 4, Problem 1(f); identify dispatch even when the dynamic type equals the base type.
  - id: cs131-v2-oop-card-base-virtual
    difficulty: basic
    bloom: understand
    estimated_seconds: 30
    question: "C++ Base declares virtual ping(). A function receives Base& b and calls b.ping(); this time b refers to an actual Base object. In the course model, is this a static or dynamic call, and which implementation runs? Ignore compiler optimizations."
    answer: "Dynamic dispatch; Base::ping() runs."
    explanation: "The method's virtual status determines the dispatch semantics. Finding that the actual receiver is a Base still selects the Base implementation through those semantics."

  # Lecture: oop_palooza_v7_handouts.pdf pp.109,135.
  # Assessment: [Final] S23 V1 (Public).pdf, Problem 8 p.17; trace an inherited wrapper and an explicit base-method call.
  - id: cs131-v2-oop-card-explicit-base
    difficulty: advanced
    bloom: analyze
    estimated_seconds: 60
    question: |
      What is printed? Explain the difference between the two calls in wrap.

      ```cpp
      struct B {
        virtual void f() { cout << "B"; }
        void wrap() { f(); B::f(); }
      };
      struct D : B { void f() override { cout << "D"; } };
      D d;
      d.wrap();
      ```
    answer: "`DB`. The ordinary virtual call uses D::f(); the qualified B::f() call explicitly selects the base implementation."
    explanation: "Both calls use the same receiver. Explicitly qualifying the base method chooses that implementation rather than the override."

  # Lecture: oop_palooza_v7_handouts.pdf pp.98–99.
  # Assessment: [Final] F22 (Public).pdf, Problem 15 p.8; complete initialization before observing an object's fields.
  - id: cs131-v2-oop-card-init-completion
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: |
      Fill the one missing line so a new NamedScore stores both fields on the same object.

      ```python
      class Named:
          def __init__(self, name): self.name = name
      class NamedScore(Named):
          def __init__(self, name, score):
              # missing line
              self.score = score
      ```
    answer: "`super().__init__(name)`"
    explanation: "`Named.__init__(self, name)` is also valid here. Constructing a separate Named(name) object would not initialize this receiver."

  # Lecture: function_palooza_v8_handouts.pdf pp.85–86,90–94.
  # Assessment: Fall 2025 Quiz 3, Problem 5(a,b); explain a compile-time difference between templates and unbounded generics.
  - id: cs131-v2-oop-card-generic-diagnosis
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 45
    question: "A template function calls x.play(), and its only instantiation uses a Player that supports play(). Moving the same body into an unbounded generic is rejected, even though all current calls still use Player. Explain in one sentence."
    answer: "The unbounded generic body must work for every permitted T, and its declaration does not guarantee play(), while the template can check that operation for the chosen Player instantiation."
    explanation: "A generic bound declaring play() would supply the missing guarantee. The current call sites alone do not add a bound to the generic declaration."

  # Lecture: function_palooza_v8_handouts.pdf pp.92–94,101; oop_palooza_v7_handouts.pdf p.56.
  # Assessment: Fall 2025 Quiz 3, Problem 5(b,c); supply a sufficient generic interface bound.
  - id: cs131-v2-oop-card-design-bound
    difficulty: intermediate
    bloom: create
    estimated_seconds: 60
    question: "Design the smallest interface bound for a generic job that must call start() and then stop() on its T argument. Both operations return void and take no arguments. Write the interface declaration and name the bound on T; pseudocode is fine."
    answer: |
      ```text
      interface Switchable {
          void start();
          void stop();
      }
      T must implement Switchable.
      ```
    explanation: "Self-check: both required operations are declared, no method body is required, and the generic restricts T to implementations of that interface. A different interface name is equally valid."

  # Lecture: oop_palooza_v7_handouts.pdf pp.78–80,82–84.
  # Assessment: [Final] F23 (Public).pdf, Problem 6(c) p.17; distinguish implementation reuse from a public subtype interface.
  - id: cs131-v2-oop-card-delegation-method
    difficulty: intermediate
    bloom: create
    estimated_seconds: 60
    question: "Write a short add(x) method for UniqueBox. It privately contains a Collection c with public contains(x) and insert(x). UniqueBox must insert x only when absent and must expose no Collection interface to clients. Use delegation; pseudocode is fine."
    answer: |
      ```text
      add(x):
          if not c.contains(x):
              c.insert(x)
      ```
    explanation: "Self-check: consult c, insert only when the value is absent, and call the contained object's operations. No inheritance or public access to c is needed."
