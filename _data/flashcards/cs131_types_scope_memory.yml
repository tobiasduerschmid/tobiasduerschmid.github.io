title: 'CS 131: Types, Scope, and Memory'
description: Predict, explain, and construct small examples of lecture type and memory rules.
active: true
# Reviewed against the supplied lecture notes, homework, and past assessments.
# Time estimates are planning estimates, not time limits.
cards:
  # Lecture: [04] Data Palooza (Public).docx — Type Inference
  # Assessment: Homework Problems (Public).docx TYPING7(A)
  - id: cs131-v2-types-card-infer
    hint: >-
      Determine the type from the initial expression first. Then check the later value against that type, rather than inferring again from each assignment.
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 25
    question: A fixed-type language infers `n` from `var n = 12` and has no conversions. Predict whether `n = "12"` is accepted, and explain in one sentence.
    answer: 'Rejected: n has inferred integer type, so a string assignment violates its fixed type.'
    explanation: 'Self-check: Omitting an annotation does not make the variable dynamically typed.'

  # Lecture: [04] Data Palooza (Public).docx — Static typing; Type Inference
  # Assessment: Homework Problems (Public).docx TYPING7(A) (infer constraints)
  - id: cs131-v2-types-card-constraints
    hint: >-
      For each branch, write its result type rather than its value. Choose results that force incompatible requirements on the function’s one result type.
    difficulty: intermediate
    bloom: create
    estimated_seconds: 45
    question: Write a two-branch function body that cannot have one fixed result type when the only permitted result types are Int and String, with no union, common supertype, or conversion. Use `flag` as the Boolean condition.
    answer: 'Example: `if flag then 1 else "one"`. One branch returns an integer and the other a string.'
    explanation: 'Self-check: Both branches must be possible, their result types must differ, and the problem permits neither conversion nor a common union result type.'

  # Lecture: [04] Data Palooza (Public).docx — Switching between types
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P2(e,f)
  - id: cs131-v2-types-card-narrowing-witness
    hint: >-
      Treat A and B as sets of representable values. For each arrow, look for a member of its source set that is missing from its destination set.
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: Type A stores integers −3 through 3; type B stores multiples of 0.5 from 0 through 2.5. Give one value proving A → B is narrowing and one proving B → A is narrowing.
    answer: 'A → B: −1 (or 3) is not representable in B. B → A: 0.5 (or another noninteger B value) is not representable in A.'
    explanation: 'Self-check: Each witness must belong to the source type and be absent from the destination type.'

  # Lecture: [04] Data Palooza (Public).docx — Lexical Scoping; Dynamic Scoping
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P3(a,b)
  - id: cs131-v2-types-card-lexical-dynamic
    hint: >-
      Draw two different lookup paths: one through the environments surrounding show’s definition, and one through the active calls. Locate x along each path.
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 40
    question: A global `x` is 4. A globally defined function `show` prints `x`. Its caller defines a local `x` as 10. Give show’s output under lexical scope and under dynamic scope.
    answer: 'Lexical: 4, from the defining environment. Dynamic: 10, from the active caller.'
    explanation: 'Self-check: Explain which environment supplies the binding, rather than only naming the two values.'

  # Lecture: [04] Data Palooza (Public).docx — Variable lifetime and scope; Lifetime
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P2(b)
  - id: cs131-v2-types-card-hidden-live
    hint: >-
      Pause a call-stack trace while the callee is running. Ask separately whether the caller will resume with its stored value and whether the callee can use that variable’s name.
    difficulty: basic
    bloom: understand
    estimated_seconds: 25
    question: In one sentence, explain how a caller’s local variable can remain alive while being out of scope inside the callee.
    answer: The caller’s frame remains active during the call, but the callee cannot name the variable unless its scoping rules make that binding visible.
    explanation: 'Self-check: Being unable to name a variable is not evidence that its storage was destroyed.'

  # Lecture: [04] Data Palooza (Public).docx — Mark and Sweep: Mark
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P4(a-c)
  - id: cs131-v2-types-card-marking
    hint: >-
      Start your graph walk only from the global reference, following outgoing arrows. Do not begin a second walk at an object merely because it has a self-loop.
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: A global points to A; A points to B; C points to itself. No other references exist. Name the root objects, all marked objects, and the objects reclaimed by mark and sweep.
    answer: 'Roots: A. Marked: A and B. Reclaimed: C.'
    explanation: 'Self-check: A self-reference cannot make C reachable from a root.'

  # Lecture: [04] Data Palooza (Public).docx — Reference Counting
  # Assessment: Homework Problems (Public).docx DATA3(A,B)
  - id: cs131-v2-types-card-cycle
    hint: >-
      On the same two-object graph, count incoming references and then attempt a walk from the program’s roots. Compare what those two procedures can observe.
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 40
    question: Two otherwise unreachable objects point to each other. Explain in at most two sentences why pure reference counting retains them while tracing collection can reclaim them.
    answer: Each incoming reference from the other object keeps its count above zero. A tracing collector starts at roots, reaches neither object, and reclaims both.
    explanation: 'Self-check: Separate the count of incoming references from reachability from roots.'

  # Lecture: [04] Data Palooza (Public).docx — Rust’s Ownership Model: Move Semantics
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P5
  - id: cs131-v2-types-card-owner
    hint: >-
      Keep an ownership ledger after each operation. Distinguish temporary permission to read an object from transferring responsibility for that object.
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 25
    question: An object starts owned by `a`. The program reads it with `borrow(a)`, then executes `b = move(a)`. Which variable can now be borrowed, and did the earlier borrow transfer ownership?
    answer: b can be borrowed; a is invalid after moving. The earlier read-only borrow did not transfer ownership.
    explanation: 'Self-check: Borrowing preserves ownership; moving transfers it and invalidates the old owner.'

  # Lecture: [04] Data Palooza (Public).docx — Object Reference Semantics
  # Assessment: Homework Problems (Public).docx DATA4; CS131 Fall 25 Quiz 3 Solutions (Public).docx P1
  - id: cs131-v2-types-card-alias-example
    difficulty: intermediate
    bloom: create
    estimated_seconds: 40
    question: Write three Python statements that create a one-item list in `a`, make `b` an alias, and mutate the shared item through `b` so `a` contains `[8]`.
    answer: |-
      Example:
      ```python
      a = [1]
      b = a
      b[0] = 8
      ```
    explanation: 'Self-check: Both names must refer to one list; assigning `b = [8]` would rebind b instead of changing a.'

  # Lecture: [04] Data Palooza (Public).docx — Mark and copy; Mark and compact
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P2(g); Homework Problems (Public).docx DATA3(A.3)
  - id: cs131-v2-types-card-collector-choice
    hint: >-
      Sketch the heap immediately before and after two collections. Identify which objects survive both rounds and account for the collector’s operations on them.
    difficulty: advanced
    bloom: evaluate
    estimated_seconds: 45
    question: Almost every allocated object survives for the whole program. In one or two sentences, explain the repeated work that makes two-space mark and copy unattractive.
    answer: Each collection copies those same survivors to the other half of the heap and adjusts references. A compacting scheme may leave already-packed long-lived objects in place.
    explanation: 'Self-check: Tie the argument to the survivor workload, rather than claiming copying is always worse.'
