title: "Basic RegEx Syntax Flashcards (Production/Recall)"  
description: "Test your ability to produce the exact Regular Expression metacharacter or syntax based on its functional description."  
active: true
cards:  
  - id: 1  
    difficulty: basic
    question: "In a Python regular expression, what metacharacter asserts the start of a string?"
    answer: "`^` (Caret)"  
    explanation: "Placed at the very beginning of a pattern, it constrains the match to the start of the string."  

  - id: 2  
    difficulty: basic
    question: "In a Python regular expression, what metacharacter matches the end of a string or the position just before its final newline?"
    answer: "`$` (Dollar sign)"  
    explanation: "`$` also matches just before a final newline; with `re.MULTILINE`, it matches before each newline. Use `re.fullmatch()` for strict whole-input validation."

  - id: 3  
    difficulty: basic
    question: "In a Python regular expression, what syntax defines a character class (matching any single character from a specified group)?"
    answer: "`[...]` (Square brackets)"  
    explanation: "Wrapping characters in square brackets tells the engine to match exactly one of the characters found inside."  

  - id: 4  
    difficulty: intermediate
    question: "In a Python regular expression, what syntax is used inside a character class to act as a negation operator (matching any character NOT in the group)?"
    answer: "`[^...]` (Caret immediately after the opening bracket)"  
    explanation: "If the caret is the very first character inside the brackets, it inverts the character class."  

  - id: 5
    difficulty: basic
    question: "In a Python regular expression, what metacharacter matches any single digit?"
    answer: "`\\d`"
    explanation: "Python 3 string patterns match Unicode decimal digits, including Devanagari `९`. Use `[0-9]` or pass `re.ASCII` when only ASCII digits are allowed."

  - id: 6  
    difficulty: basic
    question: "In a Python regular expression, what metacharacter matches any 'word' character (alphanumeric plus underscore)?"
    answer: "`\\w`"  
    explanation: "Python 3 string patterns include Unicode alphanumeric characters and underscore. With `re.ASCII`, this is equivalent to `[a-zA-Z0-9_]`."

  - id: 7  
    difficulty: basic
    question: "In a Python regular expression, what metacharacter matches any whitespace character (spaces, tabs, line breaks)?"
    answer: "`\\s`"  
    explanation: "This quickly targets formatting and spacing characters."  

  - id: 8  
    difficulty: basic
    question: "In a Python regular expression, what metacharacter acts as a wildcard, matching any single character except a newline?"
    answer: "`.` (Dot)"  
    explanation: "To match a literal dot, you would need to escape it (\\.)."  

  - id: 9  
    difficulty: basic
    question: "In a Python regular expression, what quantifier specifies that the preceding element should match '0 or more' times?"
    answer: "`*` (Asterisk)"  
    explanation: "This allows the preceding character or group to be completely absent or repeat infinitely."  

  - id: 10  
    difficulty: basic
    question: "In a Python regular expression, what quantifier specifies that the preceding element should match '1 or more' times?"
    answer: "`+` (Plus sign)"  
    explanation: "This guarantees the character or group appears at least once, but allows it to repeat infinitely."  

  - id: 11  
    difficulty: basic
    question: "In a Python regular expression, what quantifier specifies that the preceding element should match '0 or 1' time?"
    answer: "`?` (Question mark)"  
    explanation: "This essentially makes the preceding character, class, or group optional."  

  - id: 12  
    difficulty: basic
    question: "In a Python regular expression, what syntax specifies that the preceding element must repeat exactly n times?"
    answer: "`{n}` (Curly braces with a number)"  
    explanation: "You can also specify a range of repetitions using `{n,m}`."  

  - id: 13
    difficulty: basic
    question: "In a Python regular expression, what syntax creates a group?"
    answer: "`(...)` (Parentheses)"
    explanation: "This groups tokens together as a single unit. You can apply quantifiers to the whole group and access the matched substring by number (e.g., `match.group(1)`)."

  - id: 14
    difficulty: advanced
    question: "In a Python regular expression, what syntax creates a named group?"
    answer: "`(?P<name>pattern)`"
    explanation: "A named group labels the captured text. After a successful match, use `match.group('name')` to retrieve it. Named groups also retain their numeric group positions."
