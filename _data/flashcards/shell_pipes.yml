title: "Shell Pipelines"
description: "Practice connecting UNIX commands together with pipes to solve real tasks."
active: true
cards:
  - id: 1
    hint: >-
      Describe the intermediate stream just before counting. Should it still contain the non-error lines?
    difficulty: intermediate
    question: "Write a shell pipeline to count how many lines in `server.log` contain the word 'ERROR'."
    answer: "`grep 'ERROR' server.log | wc -l`"
    explanation: "`grep` filters and prints only the matching lines; `wc -l` counts them. An equivalent single-command solution is `grep -c 'ERROR' server.log`; the pipeline demonstrates composing a filter with a counter."

  - id: 2
    hint: >-
      Try the input Alice, Bob, Alice. What arrangement would let a tool that compares neighboring lines notice both copies?
    difficulty: advanced
    question: "You have a file `names.txt` with one name per line. Write a shell pipeline that prints only the unique names, sorted alphabetically."
    answer: "`sort names.txt | uniq`"
    explanation: "`uniq` only removes *adjacent* duplicates, so `sort` must come first to bring duplicates together. Then `uniq` collapses consecutive identical lines into one."

  - id: 3
    hint: >-
      Use a small example in which a name appears in separated places. What must be true of the input before adjacent runs can represent total frequencies?
    difficulty: advanced
    question: "You have a file `names.txt` with one name per line. Write a shell pipeline that prints each unique name alongside a count of how many times it appears."
    answer: "`sort names.txt | uniq -c`"
    explanation: "`sort` brings duplicates together so they are adjacent; `uniq -c` then collapses consecutive identical lines into one and prefixes each with its count."

  - id: 4
    hint: >-
      Identify the field that determines ownership. Could a match elsewhere in the command line accidentally include a process owned by someone else?
    difficulty: advanced
    question: "Write a shell pipeline that lists all running processes and shows only those belonging to user `tobias`."
    answer: "`ps aux | awk '$1 == \"tobias\"'`"
    explanation: "`ps aux` prints every running process with its owner; `awk` selects rows whose first field (the owner) is exactly `tobias`. A plain `grep tobias` would also match other users' command arguments."

  - id: 5
    hint: >-
      First consider a stream containing only the prefix ending at the desired line. What remains to extract from that shorter stream?
    difficulty: advanced
    question: "Write a shell pipeline that prints the 3rd line of `config.txt` without using `sed` or `awk`."
    answer: "`head -3 config.txt | tail -1`"
    explanation: "`head -3` keeps only the first three lines; `tail -1` then takes the very last of those — which is line 3 of the original file."

  - id: 6
    hint: >-
      Separate choosing an ordering from limiting the number of results. In which order must those operations happen?
    difficulty: advanced
    question: "Assume the current directory contains only regular files with no newlines in their names. Write a shell pipeline that lists up to 5 largest non-hidden files, with the biggest first, showing only their names."
    answer: "`ls -S | head -5`"
    explanation: "`ls -S` sorts directory entries by file size (largest first); `head -5` keeps only the first 5 lines of that output."

  - id: 7
    hint: >-
      Identify which slashes belong to the text and which would delimit the replacement expression. Also decide where the transformed stream should go.
    difficulty: advanced
    question: "Write a shell command to replace every occurrence of `http://` with `https://` in `links.txt` and save the result to `links_secure.txt`."
    answer: "`sed 's|http://|https://|g' links.txt > links_secure.txt`"
    explanation: "Here we redirect `sed`'s stdout to a file instead of piping it onward, but `sed` reads from a file argument, transforms the stream, and writes to stdout — which the shell redirects with `>`."

  - id: 8
    hint: >-
      Sketch the stream after filtering and after ordering. When can duplicate lines be recognized by comparing neighbors?
    difficulty: advanced
    question: "Write a shell pipeline that prints only the unique error lines from `access.log` that contain the word 'ERROR', sorted alphabetically."
    answer: "`grep 'ERROR' access.log | sort | uniq`"
    explanation: "`grep` filters to matching lines; `sort` brings identical lines together; `uniq` collapses consecutive duplicates into one — a classic 3-step de-duplication pipeline."

  - id: 9
    hint: >-
      Decide what one output line should represent before counting. How can you ensure directories do not contribute to the count?
    difficulty: intermediate
    question: "Write a shell pipeline that counts regular files inside the current directory tree. Assume filenames contain no newlines."
    answer: "`find . -type f | wc -l`"
    explanation: "`find . -type f` recursively lists every regular file, one per line; `wc -l` counts those lines."

  - id: 10
    hint: >-
      Compare ordering by a filename with ordering by a timestamp. Which ordering must happen before truncating the list?
    difficulty: advanced
    question: "Assume the current directory contains only regular files with no newlines in their names. Write a shell pipeline that shows up to 10 most recently modified non-hidden files, newest first."
    answer: "`ls -t | head -10`"
    explanation: "`ls -t` sorts directory entries by modification time (newest first); `head -10` keeps only the first 10 lines of that output."

  - id: 11
    hint: >-
      Write a two-row example with repeated second fields but different first fields. At what stage should equality between output values be tested?
    difficulty: advanced
    question: "Assume comma-separated `data.csv` has at least two fields per line and no quoted commas or embedded newlines. Write a shell pipeline that extracts its second column, sorts the values, and prints only the unique ones."
    answer: "`cut -d',' -f2 data.csv | sort | uniq`"
    explanation: "`cut -d','` splits each line on commas; `-f2` keeps the second field; `sort` brings duplicates together; `uniq` removes consecutive duplicates."

  - id: 12
    difficulty: advanced
    question: "Write a shell pipeline that converts the contents of `readme.txt` to uppercase and saves the result to `readme_upper.txt`."
    answer: "`cat readme.txt | tr 'a-z' 'A-Z' > readme_upper.txt`"
    explanation: "`cat` reads the file and feeds it into the pipeline; `tr 'a-z' 'A-Z'` translates every lowercase letter to uppercase; `>` redirects the final output to a new file."

  - id: 13
    difficulty: intermediate
    question: "Write a shell command that prints every line from `app.log` that does NOT contain the word 'DEBUG'."
    answer: "`grep -v 'DEBUG' app.log`"
    explanation: "The `-v` flag inverts the match — `grep` prints every line that does *not* match the pattern. No pipe is needed here, but `grep -v ... | ...` is a common pipeline building block."

  - id: 14
    hint: >-
      Consider whether a matching line will be prefixed by its source filename. Would two otherwise identical lines then still compare equal?
    difficulty: expert
    question: "You have two files, `file1.txt` and `file2.txt`. Write a shell pipeline that prints all lines from both files that contain the word 'success', sorted alphabetically with duplicates removed."
    answer: "`grep -h 'success' file1.txt file2.txt | sort | uniq`"
    explanation: "`grep` can take multiple file arguments and searches all of them. By default it prefixes each match with the filename (`file1.txt:success!`), which would defeat `uniq` — identical match lines from different files would compare as different strings. The `-h` flag suppresses the filename prefix so `sort | uniq` can dedupe by content."

  - id: 15
    difficulty: intermediate
    question: In Bash, run `./build.sh` so stdout and stderr appear on the terminal and are also saved in `build.log`.
    answer: '`./build.sh 2>&1 | tee build.log`'
    explanation: '`2>&1` joins stderr to stdout; `tee` copies the combined stream to the file and terminal.'
