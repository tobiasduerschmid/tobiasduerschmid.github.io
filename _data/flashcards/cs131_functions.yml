title: "CS 131: Functions"
description: "Explain calling semantics and failure contracts, then design small function interfaces and closures."
active: true
# Sources: function_palooza_v8.pptx; Homework Problems (Public), FUNC sections;
# CS131 Fall 25 Quiz 3. Slide/question locators accompany each card.
# Exclude Language of the Week: slides 3 (Forth), 72 (Lean), 73 (Rust).
cards:
  # Source: Functions slide 9; Quiz 3, Problem 1.
  - id: cs131-functions-card-mutation-rebinding
    difficulty: basic
    bloom: understand
    question: 'A Python helper receives a dictionary representing a cache. It calls `cache.clear()` and then assigns `cache = {"ready": True}`.
      What does an existing alias held by the caller see, and why?'
    answer: The alias sees the original dictionary, now empty. clear mutates that shared object. The later assignment points only the local parameter
      at a different dictionary, so it does not put ready into the original object.
    explanation: 'Self-check: identify the two dictionaries and distinguish an object mutation from changing the local name. The original object
      does not recover its previous contents when the local name is rebound.'

  # Source: Functions slides 10–13.
  - id: cs131-functions-card-copy-out-conflict
    difficulty: advanced
    bloom: analyze
    question: "A value-result function has two separate local parameters whose results are copied back to the same caller variable. Explain why making local copies does not eliminate every aliasing problem. What additional rule would make the final value predictable?"
    answer: "The parameters do not alias during the body, but their copy-out destinations do. Copying either result last overwrites the other. A specified copy-out order makes the result predictable; rejecting calls with overlapping destinations can prevent this conflict instead."
    explanation: "Self-check: locate the conflict at return, rather than during local assignments. Equal local results also happen to avoid observable disagreement, but they do not solve the general design problem."

  # Source: Functions slides 16–23; Homework FUNC1 A.
  - id: cs131-functions-card-default-interface-design
    difficulty: expert
    bloom: create
    question: A library exposes `schedule(job, delay=0)`, used as both `schedule(task, 5)` and `schedule(job=task, delay=5)`. Design a backward-compatible
      way to add an optional priority and deprecate the name delay in favor of wait. Define what happens if a caller supplies both names.
    answer: Keep the second positional slot as the delay/wait value. Add priority as a named-only optional argument. Temporarily accept either delay
      or wait as names for the same slot, but reject a call that supplies both instead of silently choosing one. Existing calls retain their bindings;
      new calls can use wait and priority.
    explanation: 'Self-check: preserve both existing call forms, give each supplied value exactly one destination, and specify the conflicting-name
      case. Supporting an old name during migration is separate from choosing a default value.'

  # Source: Functions slides 27 and 34–43; Homework FUNC2.
  - id: cs131-functions-card-error-information
    difficulty: intermediate
    bloom: evaluate
    question: "A parser returns a value or fails because input is empty, malformed, or unsupported. The caller needs a different message for each reason. Explain why an optional value is insufficient and propose the information its return type should carry."
    answer: "An optional communicates only value versus absence. A result type should carry either the parsed value or a failure variant such as Empty, Malformed, or Unsupported, with location details when needed."
    explanation: "Self-check: the design must distinguish every failure that requires different caller behavior, and legitimate parsed values must not collide with error sentinels."

  # Source: Functions slides 52–65; Homework FUNC3 A; Quiz 3, Problem 4.
  - id: cs131-functions-card-propagation-cleanup
    difficulty: advanced
    bloom: analyze
    question: "Function `load` acquires a resource and calls `decode`. Decoding raises an exception caught by `main`, which called `load`. Why is a release statement immediately after `decode` insufficient, and where should release belong? Assume cleanup succeeds."
    answer: "Propagation leaves the rest of the ordinary `load` body unexecuted, so the release statement can be skipped. Release should be guaranteed by a finally block or a scoped resource manager established after successful acquisition. The original failure should still reach `main`."
    explanation: "Self-check: cover both normal and exceptional exits, release only an acquired resource, and avoid a return in cleanup that would replace the pending failure."

  # Source: Functions slides 75–85; Homework FUNC4 C.
  - id: cs131-functions-card-closure-factory
    difficulty: advanced
    bloom: create
    question: "Write a Python function `make_minimum(limit)` that returns a predicate accepting numbers at least `limit`. Create two predicates with different limits and give a check demonstrating they keep independent configurations."
    answer: |
      ```python
      def make_minimum(limit):
          return lambda value: value >= limit

      small = make_minimum(3)
      large = make_minimum(10)
      assert small(6) is True
      assert large(6) is False
      assert large(10) is True
      ```
    explanation: "Self-check: the factory must return a callable rather than the result of calling it, each factory call must retain its own limit, and the comparison must include equality. A nested named function is equally valid."

  # Source: Functions slides 82–85; Homework FUNC4 B.
  - id: cs131-functions-card-capture-lifetime
    difficulty: intermediate
    bloom: analyze
    question: A C++ factory returns a closure that captures a raw pointer to a local `std::vector<int>` by value. The factory then returns, destroying
      the vector. Explain why value capture is insufficient and propose a capture that lets the closure retain the vector contents.
    answer: Value capture copies the pointer value, leaving it pointing at a destroyed vector. Capture the vector object itself by value instead,
      so the closure owns a separate vector whose lifetime lasts with the closure.
    explanation: 'Self-check: distinguish copying an address from copying the object at that address. The captured variable''s type matters as well
      as the capture syntax.'

  # Source: Functions slides 89–104; Homework FUNC5 A–C.
  - id: cs131-functions-card-polymorphism-distinction
    difficulty: basic
    bloom: understand
    question: "Contrast two ways to support a `combine` operation on several types: separate implementations selected by argument type, and one definition parameterized by a type. What kind of reuse does each provide?"
    answer: "Ad-hoc polymorphism supplies type-specific implementations, such as overloads. Parametric polymorphism expresses a shared definition using a type parameter, with constraints for any operations it requires. Both can share an operation name, but only the latter directly shares the parameterized algorithm."
    explanation: "Self-check: distinguish reuse of an interface or name from reuse of a common algorithm. A generic implementation may still be specialized during compilation."

  # Source: Functions slides 100–109; Homework FUNC5 C; Quiz 3, Problem 5.
  - id: cs131-functions-card-generic-bound
    difficulty: advanced
    bloom: create
    question: A generic `first_expired(items, now)` must return the first item whose deadline is earlier than now, or explicit absence. Items may
      have unrelated concrete types. State a minimal capability bound and write pseudocode preserving the returned item's type. Integer comparison
      is built in.
    answer: |
      Require `deadline(): Integer` on T; return Optional<T>.

      ```text
      function first_expired<T supports deadline(): Integer>(items: List<T>, now: Integer): Optional<T>
          for item in items:
              if item.deadline() < now:
                  return Some(item)
          return None
      ```
    explanation: 'Self-check: justify deadline access with the bound, retain T in the result, stop at the first qualifying item, and cover an empty
      list. Equality with now does not count as expired under this contract.'

  # Source: Functions slides 95–109; Homework FUNC5 C, explanatory note.
  - id: cs131-functions-card-monomorphization
    difficulty: advanced
    bloom: analyze
    question: "A generic function is statically checked against its declared capabilities, then compiled into versions specialized for integer and string arguments. Why is this consistent? Name one tradeoff specialization can introduce."
    answer: "Checking validates the definition's permitted operations; specialization chooses how to generate code for uses of that validated definition. These are separate decisions. Specialized versions may enable type-specific optimization while increasing compiled code size."
    explanation: "Self-check: do not infer a language's checking rules solely from the number of generated code versions. Specialization is not proof that all operations were deferred to runtime."
