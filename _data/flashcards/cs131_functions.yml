title: 'CS 131: Functions'
description: Compact predictions, explanations, and small function repairs grounded in the lectures.
active: true
# Reviewed against the supplied lecture notes, homework, and past assessments.
# Time estimates are planning estimates, not time limits.
cards:
  # Lecture: [05] Function Palooza (Public).docx — Pass by Value; Pass by Reference
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P1
  - id: cs131-v2-functions-card-reference
    hint: >-
      Draw the parameter’s storage relationship to x before performing the assignment. Use a separate copy in one model and a second name for the same location in the other.
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 25
    question: A caller has `x = 5`. A function receives x as parameter p and executes `p = 9`. Give the final x under pass by value and under pass by reference.
    answer: 'Value: 5, because p is a separate copy. Reference: 9, because p aliases x.'
    explanation: 'Self-check: Trace which storage the assignment changes: the copy or the caller’s variable.'

  # Lecture: [05] Function Palooza (Public).docx — Pass by Object Reference
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P1
  - id: cs131-v2-functions-card-rebind
    hint: >-
      Trace the original list object and the local name p separately. For each statement, identify whether its left side selects a list slot or the parameter binding.
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 40
    question: A Python function receives a list as `p`, executes `p[0] = 4`, then executes `p = [8]`. Which change can the caller observe through its original list variable, and why?
    answer: The caller observes the first element become 4. The later assignment only rebinds the local parameter to another list.
    explanation: 'Self-check: Distinguish changing the shared object from changing which object the parameter refers to.'

  # Lecture: [05] Function Palooza (Public).docx — Pass by Name/Need
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P2
  - id: cs131-v2-functions-card-name-need
    hint: >-
      Make one trace entry for each use of x. In each evaluation model, check whether that use evaluates the argument expression again or can reuse an earlier result.
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: '`tick()` prints T and returns 3. A lazy parameter x is used in `x + x + x`. How often does tick run under name semantics and under need semantics?'
    answer: 'Name: three times. Need: once, with the result cached for the remaining two uses.'
    explanation: 'Self-check: Caching is per bound computation here; the prompt uses one parameter binding, not three separate calls.'

  # Lecture: [05] Function Palooza (Public).docx — Pass by Reference; Pass by Object Reference
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P1(a)
  - id: cs131-v2-functions-card-distinguish-passing
    hint: >-
      A field mutation can be visible under both strategies. Choose an operation that tests whether the parameter names the caller’s variable itself.
    difficulty: intermediate
    bloom: create
    estimated_seconds: 50
    question: A parameter can be either a reference to a caller’s value variable or an object reference to its mutable Box. Give a one-statement function body that distinguishes the strategies by inspecting the caller afterward.
    answer: 'Example: `p = new Box(value=9)`. With reference semantics, assignment changes the caller’s Box value; with object-reference semantics, it rebinds only the local pointer.'
    explanation: 'Self-check: Use assignment of a new object. A field mutation alone changes the original Box under both strategies.'

  # Lecture: [05] Function Palooza (Public).docx — Capture by Value
  # Assessment: Homework Problems (Public).docx FUNC4(A.3)
  - id: cs131-v2-functions-card-value-capture
    hint: >-
      Write down the closure’s saved state at the moment the lambda is created, before applying the later assignment to the original variable.
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 25
    question: A C++ lambda captures integer `k` by value when k is 2 and returns `k + x`. The original k is later set to 20. What does the lambda return for x = 5, and what does its closure retain?
    answer: It returns 7. Its closure retains a copy of k’s value 2, alongside the lambda’s code.
    explanation: 'Self-check: The captured copy is taken when the closure is created, not when it is later called.'

  # Lecture: [05] Function Palooza (Public).docx — First Class Functions; Capture by Environment
  # Assessment: [Final] F23 Solutions (Public).pdf pp.2-3
  - id: cs131-v2-functions-card-closure-make
    hint: >-
      Distinguish the input known when make_scale runs from the input that will arrive when its returned function is called. The returned computation needs access to both.
    difficulty: intermediate
    bloom: create
    estimated_seconds: 45
    question: |-
      Complete this Python function with a single return statement so `make_scale(3)(4)` is 12:
      ```python
      def make_scale(factor):
          # return a function of x
      ```
    answer: '`return lambda x: factor * x`'
    explanation: 'Self-check: Return a function, not a numeric result; x is its parameter, and factor comes from the enclosing call.'

  # Lecture: [05] Function Palooza (Public).docx — The Exception Hierarchy
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P4
  - id: cs131-v2-functions-card-unwind
    hint: >-
      Draw the active call stack A → B → C. Mark the matching handler and identify which activations lie between the throw and that handler.
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 25
    question: A calls B inside a try. B calls C. C throws, and only A has a matching handler. B has a print after its call to C. Does B’s print run, and where does execution go?
    answer: B’s print is skipped. The exception unwinds C and B and transfers control to A’s matching handler.
    explanation: 'Self-check: A handler does not resume the abandoned function at its next statement.'

  # Lecture: [05] Function Palooza (Public).docx — Finally
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P4
  - id: cs131-v2-functions-card-cleanup
    difficulty: intermediate
    bloom: create
    estimated_seconds: 40
    question: A resource is opened successfully, `work()` may raise, and a following `close()` is skipped on error. In at most four pseudocode lines, show how to guarantee close runs; omit the already-completed open.
    answer: |-
      Example:
      ```text
      try:
          work()
      finally:
          close()
      ```
    explanation: 'Self-check: The cleanup must run on both success and failure, including an exception that this function does not catch.'

  # Lecture: [05] Function Palooza (Public).docx — Exception handling guarantees
  # Assessment: [Final] F23 Solutions (Public).pdf Error Handling p.19
  - id: cs131-v2-functions-card-basic-strong
    hint: >-
      Compare two separate properties: whether the queue is still usable and whether it is identical to its pre-call state. Resource cleanup answers a third, separate question.
    difficulty: advanced
    bloom: evaluate
    estimated_seconds: 40
    question: A failed operation leaves a valid queue with one extra item and releases all acquired resources. Explain whether it meets the basic exception-safety guarantee, the strong guarantee, both, or neither.
    answer: It meets the basic guarantee because state remains valid and resources do not leak. It fails the strong guarantee because the extra item changes the pre-call state.
    explanation: 'Self-check: Valid state and unchanged state are different promises.'

  # Lecture: [05] Function Palooza (Public).docx — Optionals; Result Object
  # Assessment: Homework Problems (Public).docx FUNC3(B)
  - id: cs131-v2-functions-card-result-optional
    hint: >-
      Imagine writing the caller’s two recovery branches. What observation in the returned value would let it distinguish those branches?
    difficulty: basic
    bloom: understand
    estimated_seconds: 30
    question: A caller must choose different recovery actions for a missing file and a permission failure. Why does an Optional alone provide less useful information than a Result carrying error details?
    answer: An empty Optional only reports absence of a value. A Result can identify which failure occurred, allowing different recovery actions.
    explanation: 'Self-check: The key requirement is distinguishing failure reasons, not simply detecting failure.'
