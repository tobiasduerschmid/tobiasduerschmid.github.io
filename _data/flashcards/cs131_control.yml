title: 'CS 131: Control and Concurrency'
description: Retrieve and apply short-circuit, iterator, generator, and scheduling rules from the lectures.
active: true
# Original replacement practice. Page references are physical PDF pages.
# Time estimates are planning estimates, not time limits.
cards:
  # Lecture: control_palooza_v7_handouts.pdf pp.9–15
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P2 (demanded evaluation; supporting prerequisite)
  - id: cs131-v2-control-card-short-circuit
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 25
    question: '`A()` prints A and returns true; `B()` prints B and returns false. With left-to-right short circuit, what is printed while evaluating `A() || B()` and what is the result?'
    answer: Only A is printed; the result is true. B is skipped because the left operand already determines the OR result.
    explanation: 'Self-check: OR can skip its right operand when the left one is true.'

  # Lecture: control_palooza_v7_handouts.pdf pp.12–15
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P2 (demanded evaluation; supporting prerequisite)
  - id: cs131-v2-control-card-safe-guard
    difficulty: intermediate
    bloom: create
    estimated_seconds: 30
    question: Using short-circuit `&&`, write one condition that tests whether `10 / n > 2` but never divides by zero. Put the safety check before the division.
    answer: '`n != 0 && 10 / n > 2`'
    explanation: 'Self-check: When n is zero, the left operand must be false so the right operand is skipped.'

  # Lecture: control_palooza_v7_handouts.pdf pp.4–8
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P2 (evaluation-rule reasoning; supporting prerequisite)
  - id: cs131-v2-control-card-grouping
    difficulty: basic
    bloom: understand
    estimated_seconds: 30
    question: Why does knowing that `a() - b() - c()` groups as `(a() - b()) - c()` not alone determine which function prints first?
    answer: Grouping determines which values are subtracted together. The language’s operand-evaluation rules separately determine when the calls run.
    explanation: 'Self-check: Do not infer temporal execution order just from an expression’s grouping.'

  # Lecture: control_palooza_v7_handouts.pdf pp.21–22
  # Assessment: [Final] F24 Solutions (Public).pdf P6(A,B) pp.19–20 (iteration control prerequisite)
  - id: cs131-v2-control-card-loop-transfer
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 25
    question: In a loop over `[1, 2, 3]`, the body skips to the next iteration when the item is 2 and otherwise prints it. Give the output and name the required control statement.
    answer: 'Output: 1, 3. Use continue; break would terminate the loop at 2.'
    explanation: 'Self-check: Continue leaves the current iteration; break leaves the loop.'

  # Lecture: control_palooza_v7_handouts.pdf pp.48–53
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P2(b,d)
  - id: cs131-v2-control-card-iterator-state
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 25
    question: Two loops share the same list but each receives a new iterator. After the first loop advances twice, does the second iterator also move? Explain in one sentence.
    answer: No. Each iterator stores its own traversal position, so advancing one does not advance the other.
    explanation: 'Self-check: The shared collection and each iterator’s independent position play different roles.'

  # Lecture: control_palooza_v7_handouts.pdf pp.63–65
  # Assessment: [Final] F24 Solutions (Public).pdf P6(B) p.20
  - id: cs131-v2-control-card-generator-pause
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: A Python generator body is `yield 4`, then `print("next")`, then `yield 6`. What is produced or printed by its first two calls to next?
    answer: 'First call: yields 4 without printing. Second call: prints next, then yields 6.'
    explanation: 'Self-check: Execution resumes after the previous yield; it does not restart.'

  # Lecture: control_palooza_v7_handouts.pdf pp.63–67
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P2; [Final] F24 Solutions (Public).pdf P6(A) p.19
  - id: cs131-v2-control-card-range-generator
    difficulty: intermediate
    bloom: create
    estimated_seconds: 40
    question: Write a Python generator `even_three()` using three yield statements so successive calls to next produce 2, 4, and 6.
    answer: |-
      ```python
      def even_three():
          yield 2
          yield 4
          yield 6
      ```
    explanation: 'Self-check: Each next should produce only one value; using return for the first value would stop the generator.'

  # Lecture: control_palooza_v7_handouts.pdf pp.56,59–60
  # Assessment: [Final] F24 Solutions (Public).pdf P6(C.1) p.21
  - id: cs131-v2-control-card-iterator-boundary
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 30
    question: An iterator indexes a list using pos. The list has length 3 and pos is 3. What should Python __next__ do, and why should it check before indexing?
    answer: Raise StopIteration. Index 3 is past the last element, so indexing first would produce an indexing error rather than the iteration-completion signal.
    explanation: 'Self-check: Completion should use the iterator protocol’s expected signal rather than an unrelated error.'

  # Lecture: control_palooza_v7_handouts.pdf pp.104–107
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P3(a,b)
  - id: cs131-v2-control-card-inline-scheduled
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 40
    question: A child prints C before its first suspension. The caller spawns it and immediately prints M. Give the first two prints for inline spawn and for scheduled spawn under the lecture’s single-threaded runtime.
    answer: 'Inline: C, M. Scheduled: M, C, provided the caller then yields or finishes so the queued child can run.'
    explanation: 'Self-check: Inline runs the child immediately; scheduled spawn queues it until control returns to the runtime.'

  # Lecture: control_palooza_v7_handouts.pdf pp.108–110
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P3(a,b)
  - id: cs131-v2-control-card-await-purpose
    difficulty: advanced
    bloom: evaluate
    estimated_seconds: 40
    question: A scheduled job returns a number. A proposed program reads its unfinished result immediately after spawning it. Give the missing operation and explain what other queued work can do while the caller waits.
    answer: Await the job’s handle. The caller suspends until the result is ready, while the runtime can execute other ready operations.
    explanation: 'Self-check: Await suspends this operation; it does not require freezing the entire runtime.'
