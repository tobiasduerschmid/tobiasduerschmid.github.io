title: "Node.js/JavaScript Syntax — Write the Code (Basic)"
description: "You are given a task description. Write the JavaScript code that accomplishes it."
active: true
cards:
  - id: 1
    difficulty: basic
    question: "In JavaScript, declare a mutable variable `count` set to `0` and an immutable constant `MAX` set to `200`."
    answer: |
      ```javascript
      let count = 0;
      const MAX = 200;
      ```
    explanation: "Use `let` for mutable variables and `const` for constants. Never use `var` — it has hoisting/scoping issues."
  - id: 2
    difficulty: intermediate
    question: "In JavaScript, check if a variable `userInput` (which might be a string) equals the number `42`, without being tricked by type coercion."
    answer: "`userInput === 42`"
    explanation: "Strict equality checks the value and type without implicit conversion. The string '42' therefore does not match. If numeric strings are permitted by a different input contract, validate and convert them explicitly before comparing."
  - id: 3
    difficulty: basic
    question: "In JavaScript, create a string that says `Hello, Alice! Score: 95` using variables `name = \"Alice\"` and `score = 95`, with interpolation."
    answer: "`` `Hello, ${name}! Score: ${score}` ``"
    explanation: "Template literals use backticks and `${expression}`. This is the JS equivalent of Python's f-strings. Single/double quotes do NOT support interpolation."
  - id: 4
    difficulty: basic
    question: "Write a JavaScript arrow function `add` that takes two parameters and returns their sum."
    answer: "`const add = (a, b) => a + b;`"
    explanation: "Arrow functions use `=>`. For a single expression, the `return` keyword and braces can be omitted."
  - id: 8
    difficulty: intermediate
    question: "In JavaScript, extract `name` and `grade` from `const student = { name: \"Alice\", grade: 95 }` into separate variables in one line."
    answer: "`const { name, grade } = student;`"
    explanation: "Object destructuring extracts named properties. This pattern is used in every React component to destructure props."
  - id: 9
    difficulty: intermediate
    question: "In JavaScript, schedule a function to run after the current call stack empties (with minimal delay)."
    answer: "`setTimeout(() => { /* code */ }, 0);`"
    explanation: "`setTimeout(fn, 0)` does NOT run immediately — it queues `fn` in the Task Queue. The Event Loop only dequeues it when the Call Stack is completely empty."
  - id: 10
    difficulty: advanced
    question: "Write a JavaScript async function `loadUser` that fetches user data from `/api/user`, handles errors, and logs the result."
    answer: |
      ```javascript
      async function loadUser() {
          try {
              const res = await fetch('https://example.com/api/user');
              const data = await res.json();
              console.log(data);
          } catch (err) {
              console.error(err);
          }
      }
      ```
    explanation: "`async`/`await` makes async code look synchronous. `await` suspends the function (non-blocking) until the Promise resolves. `try/catch` handles rejections."
  - id: 11
    difficulty: advanced
    question: "In JavaScript, fetch two independent API endpoints in parallel (not sequentially) and assign the results to `a` and `b`."
    answer: "`const [a, b] = await Promise.all([fetchA(), fetchB()]);`"
    explanation: "`Promise.all()` runs both Promises concurrently. Total time = max(A, B). Sequential `await` would take A + B."
  - id: 12
    difficulty: intermediate
    question: "Write a JavaScript function that accepts an object parameter with `name` and `grade` properties, using destructuring in the parameter list."
    answer: |
      ```javascript
      function printStudent({ name, grade }) {
          console.log(`${name}: ${grade}`);
      }
      ```
    explanation: "Object destructuring in parameters is the standard pattern for React component props: `function Card({ title, color }) { ... }`."

  - id: 14
    difficulty: advanced
    question: "Write a JavaScript `delay(ms)` function that returns a Promise which resolves after `ms` milliseconds."
    answer: |
      ```javascript
      function delay(ms) {
          return new Promise(resolve => setTimeout(resolve, ms));
      }
      ```
    explanation: "`new Promise(resolve => ...)` creates a Promise. Passing `resolve` as the `setTimeout` callback means: 'resolve this Promise after `ms` ms.' Usage: `await delay(1000)` pauses for 1 second without blocking the Event Loop."

  - id: 16
    difficulty: advanced
    question: "In JavaScript, safely read `response.data.user.name` where any part of the chain might be `null` or `undefined`. Fall back to `'Anonymous'` if missing."
    answer: |
      ```javascript
      const name = response?.data?.user?.name ?? 'Anonymous';
      ```
    explanation: "`?.` short-circuits to `undefined` if any link is null/undefined — no TypeError thrown. `??` uses the fallback only for `null`/`undefined`, so a real empty string `''` would be preserved. Using `||` instead of `??` would incorrectly replace an empty string with `'Anonymous'`."

  - id: 17
    difficulty: basic
    question: "Create a JavaScript object with properties `name` (\"Alice\") and `grade` (95), then convert it to a JSON string."
    answer: |
      ```javascript
      const student = { name: "Alice", grade: 95 };
      const json = JSON.stringify(student);
      ```
    explanation: "Object literals use `{ key: value }` syntax. `JSON.stringify()` converts to a JSON string for sending over HTTP. `JSON.parse()` does the reverse."

  - id: 19
    difficulty: intermediate
    question: "In JavaScript, declare a variable with no initial value. What is its value? Then set a different variable explicitly to 'nothing'."
    answer: |
      ```javascript
      let x;          // x is undefined
      let y = null;   // y is null (intentionally empty)
      ```
    explanation: "`undefined` means 'no value assigned yet'. `null` means 'intentionally empty'. JavaScript has both — unlike Python which only has `None`."

  - id: 20
    difficulty: intermediate
    question: "Write a JavaScript `for...of` loop that iterates over `const names = ['Alice', 'Bob', 'Carol']` and logs each name."
    answer: |
      ```javascript
      for (const name of names) {
          console.log(name);
      }
      ```
    explanation: "`for...of` is JavaScript's equivalent of Python's `for name in names`. Use `const` (not `let`) since the loop variable isn't reassigned within the body."
