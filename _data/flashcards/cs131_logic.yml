title: "CS 131: Logic Programming Flashcards"
description: "Explain and construct small relations, trace proof search, and check assumptions behind negation and list recursion."
active: true
cards:
  # Sources: logic_palooza_v6.pptx slides 6–7; Homework Problems (Public).docx LOGIC2 B.
  - id: relation-contract-explanation
    bloom: understand
    difficulty: basic
    question: Two teams exchange Prolog facts. One documents `assigned(Person, Task)`; the other documents `assigned(Task, Person)`. Why does using
      the same predicate name and arity fail to guarantee a compatible exchange, and what must an adapter do?
    answer: Name and arity describe structural compatibility, not the intended roles of the arguments. An adapter must swap the argument positions
      when converting between these two conventions, or translate into a new shared relation whose roles both teams document.
    explanation: 'Self-check: a fact can parse and unify yet describe the wrong real-world relation. The adapter must apply one consistent mapping
      to facts and the corresponding queries.'

  # Sources: logic_palooza_v6.pptx slides 7–8; Homework Problems (Public).docx LOGIC3; [Final] S23 V1 (Public).pdf p11 question 5.
  - id: construct-shared-resource-rule
    bloom: create
    difficulty: advanced
    question: "Write a Prolog rule `shares_resource(A, B)` using `needs(Task, Resource)`. It should hold when the two tasks need at least one common resource. Self-pairs are allowed. Explain what enforces a common resource."
    answer: |
      One solution is:

      ```prolog
      shares_resource(A, B) :- needs(A, R), needs(B, R).
      ```

      The same R appears in both subgoals, so one successful proof must use the same resource for both tasks.
    explanation: "Self-check: the two needs calls must share their resource variable. Using two unrelated variables would merely show that both tasks need something; multiple shared resources may produce duplicate task pairs."

  # Sources: logic_palooza_v6.pptx slides 21–30; Homework Problems (Public).docx LOGIC4 A.6–A.10.
  - id: explain-repeated-variable-failure
    bloom: analyze
    difficulty: intermediate
    question: Explain why `[parcel(X), receipt(X)] = [parcel(code(red)), receipt(code(blue))]` fails. What changes if the receipt pattern uses a
      fresh Y?
    answer: The parcel match binds X to the entire term code(red). The repeated X would then require receipt(code(red)), which disagrees with receipt(code(blue)).
      A fresh Y allows X = code(red) and Y = code(blue).
    explanation: 'Self-check: the repeated variable equates entire compound terms across separate list elements. Replacing one occurrence with a
      new variable removes that equality requirement.'

  # Sources: logic_palooza_v6.pptx slides 18–20, 30–31; [Final] F22 (Public).pdf p11 question 21.
  - id: explain-unification-resolution
    bloom: understand
    difficulty: basic
    question: "Why can a goal successfully unify with a rule head but still have no solution through that rule? Distinguish unification from resolution."
    answer: "Unification only finds a consistent match between the goal and the rule head. Resolution must also prove every body subgoal using the resulting bindings; a body subgoal may fail or its search may not terminate."
    explanation: "Self-check: a local match identifies a candidate proof step, not a complete proof. Resolution coordinates further matches and backtracking."

  # Sources: logic_palooza_v6.pptx slides 14–19, 31; CS131 Fall 25 Quiz 4 (with solutions).docx Problem 4.
  - id: trace-conjunction-backtracking
    bloom: apply
    difficulty: intermediate
    question: |
      Predict all `(Job, Machine)` pairs produced by `can_run(Job, Machine)` in order. Explain why one candidate job produces no result.

      ```prolog
      requires(draw, color). requires(scan, mono).
      requires(bind, staples).
      machine(west, mono). machine(east, color).
      can_run(J, M) :- requires(J, Feature), machine(M, Feature).
      ```
    answer: The answers are (draw, east), then (scan, west). For each job, the shared Feature must match a machine's capability. Bind produces no
      result because neither machine fact supplies staples.
    explanation: 'Self-check: search chooses a job first, then searches machines for its bound capability. Backtracking restores Feature between
      jobs; it does not accumulate incompatible capabilities.'

  # Sources: logic_palooza_v6.pptx slides 11–12; [Final] F23 (Public).pdf p24 question 8c.
  - id: negation-data-completeness
    bloom: evaluate
    difficulty: advanced
    question: "A finite database has no `unpaid(jo)` fact or rule proving it. Why can `not(unpaid(jo))` succeed without establishing that Jo has paid? State an assumption that would justify using this result."
    answer: "Negation succeeds because the search for unpaid(jo) fails. Missing evidence could instead be an incomplete record. Using this to conclude paid requires a complete, current unpaid relation and a domain policy in which the alternatives really are paid or unpaid."
    explanation: "Self-check: separate failure to prove a database predicate from knowledge about the world. Negation as failure also depends on the inner search terminating."

  # Sources: logic_palooza_v6.pptx slides 8–9, 32; [Final] S23 V1 (Public).pdf p11 question 5.
  - id: repair-path-search
    bloom: create
    difficulty: intermediate
    question: Write a terminating Prolog recognizer `alternating(Words)` for finite ground lists containing zero or more repetitions of the pair
      tap, rest. It should accept [] and [tap,rest,tap,rest] but reject [tap] and [rest,tap]. Include a base clause and explain the progress measure.
    answer: |
      One solution is:

      ```prolog
      alternating([]).
      alternating([tap, rest | Tail]) :- alternating(Tail).
      ```

      Each recursive step matches and consumes a complete two-element pair. The remaining finite list becomes shorter by two.
    explanation: 'Self-check: reject incomplete or reversed pairs, and explain termination using a strictly shorter ground list. Checking the input
      pattern before recursion avoids an unconstrained recursive search.'

  # Sources: logic_palooza_v6.pptx slides 34–38, 47; Homework Problems (Public).docx LOGIC7 A.2.
  - id: generate-list-prefix-splits
    bloom: apply
    difficulty: intermediate
    question: "Without treating append as a one-directional function, give every pair of lists P and S satisfying `append(P, S, [sun, moon])`."
    answer: "P = [], S = [sun, moon]; P = [sun], S = [moon]; P = [sun, moon], S = []."
    explanation: "Self-check: include both empty-list boundaries, preserve element order, and verify that concatenating each pair reconstructs the same whole list."

  # Sources: logic_palooza_v6.pptx slides 38–46; Homework Problems (Public).docx LOGIC7–8; [Final] F23 (Public).pdf p22 question 8a.
  - id: construct-double-elements
    bloom: create
    difficulty: advanced
    question: "Write `double_items(Input, Output)` for finite ground lists. Each input element should appear twice consecutively in the output, in the original order. Give the empty-list case and one recursive clause."
    answer: |
      One solution is:

      ```prolog
      double_items([], []).
      double_items([H|T], [H,H|R]) :- double_items(T, R).
      ```

      For example, double_items([red, blue], Out) yields Out = [red, red, blue, blue].
    explanation: "Self-check: the empty input produces [], the recursive call consumes the input tail, and exactly two copies of the head precede the recursively produced tail. A nested [H,H] element would produce a different shape."

  # Sources: logic_palooza_v6.pptx slides 39–46; [Final] F23 (Public).pdf pp22–24 question 8; CS131 Fall 25 Quiz 4 (with solutions).docx Problem 5.
  - id: list-filter-counterexample
    bloom: analyze
    difficulty: advanced
    question: A ground command-list relation has a special recursive clause that converts go to tick and a catch-all recursive clause that copies
      any head unchanged. Give a smallest input exposing an incorrect extra answer, then state a condition for the catch-all clause that prevents
      it.
    answer: Input [go] can yield both [tick] and [go], because the catch-all clause also matches go. Require the catch-all head to differ from go
      before copying it, so the two cases are exclusive for ground input.
    explanation: 'Self-check: request all answers rather than only the first successful result. The condition belongs on the branch that retains
      the original value.'
