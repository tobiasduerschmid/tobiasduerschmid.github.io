title: "CS 131: Logic Programming"
description: "Practice short Prolog traces, explanations, repairs, and rule construction."
active: true
# Reviewed against the supplied lecture notes, homework, and past assessments.
# Time estimates are planning estimates, not measured student completion times.
cards:
  # Lecture: [08] Logic Palooza (Public).docx — Matching a Goal and a Fact/Rule
  # Assessment: Homework Problems (Public).docx LOGIC4(A.6)
  - id: cs131-v2-logic-card-unify-repeated
    hint: >-
      Match corresponding term positions and keep one binding table. Every occurrence of the same variable must remain consistent with the binding already recorded.
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 30
    question: "In Prolog, unify `record(X, tag(X))` with `record(blue, tag(Y))`. Give bindings for X and Y."
    answer: "X = blue and Y = blue."
    explanation: "The first position fixes X as blue. Its repeated occurrence inside tag(...) then forces Y to match blue too."

  # Lecture: [08] Logic Palooza (Public).docx — Negation in Rules
  # Assessment: Lecture Negation in Rules example; CS131 Fall 25 Quiz 4 (with solutions).docx P4(a) practices ground-query reasoning
  - id: cs131-v2-logic-card-ground-negation
    hint: >-
      Try proving the inner blocked goal using only the supplied facts. Decide what a completed search with no proof means for the surrounding not.
    difficulty: basic
    bloom: understand
    estimated_seconds: 30
    question: |
      Does the Prolog query `allowed(kai)` succeed? Explain using the database, without assuming anything about the real person.

      ```prolog
      blocked(ren).
      allowed(X) :- not(blocked(X)).
      ```
    answer: "Yes. The database cannot prove blocked(kai), so not(blocked(kai)) succeeds."
    explanation: "This is negation as failure for a ground query. It reports what this program can prove, not independent evidence about the world."

  # Lecture: [08] Logic Palooza (Public).docx — Resolution: How Prolog Answers Queries
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P4(b,c)
  - id: cs131-v2-logic-card-two-step-order
    hint: >-
      Choose the first edge from a in database order, then finish its second-edge search before returning to the next choice for the intermediate node.
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |
      Give all Y values in order for the Prolog query `hop(a,Y)`.

      ```prolog
      edge(a,c).
      edge(a,b).
      edge(b,z).
      edge(c,y).
      hop(X,Y) :- edge(X,M), edge(M,Y).
      ```
    answer: "Y = y, then Y = z."
    explanation: "The first subgoal chooses M = c before M = b. Its second subgoal reaches y; after backtracking, the b branch reaches z. The later location of edge(c,y) does not reverse the branch order."

  # Lecture: [08] Logic Palooza (Public).docx — Resolution Continued
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P4(c)
  - id: cs131-v2-logic-card-duplicate-reason
    hint: >-
      Trace the two clauses as separate proof attempts. Count successful paths through the rules before considering whether their final variable bindings happen to match.
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 45
    question: |
      Why does the Prolog query `pick(X)` produce X = a twice when all answers are requested?

      ```prolog
      red(a).
      round(a).
      pick(X) :- red(X).
      pick(X) :- round(X).
      ```
    answer: "There are two successful proofs: one through red(a), then one through round(a). Each proof yields X = a."
    explanation: "Resolution enumerates successful proofs in clause order. It does not automatically turn their bindings into a set of unique answers."

  # Lecture: [08] Logic Palooza (Public).docx — Prolog Lists: Example 2
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P5
  - id: cs131-v2-logic-card-list-decomposition
    hint: >-
      Count top-level list elements, treating a nested list as one element. Match the two explicit head positions before collecting the remaining suffix.
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 30
    question: "In Prolog, unify `[A,B|Rest]` with `[[red],blue,green,yellow]`. Give A, B, and Rest."
    answer: "A = [red], B = blue, Rest = [green,yellow]."
    explanation: "A matches one whole element, even when that element is a list. Rest matches the list remaining after the first two elements."

  # Lecture: [08] Logic Palooza (Public).docx — Prolog Lists; Example 4: Deleting an atom from a list
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P5
  - id: cs131-v2-logic-card-squeeze-equal
    hint: >-
      Test your smaller recursive input on three consecutive equal elements. It must still compare the retained representative with the third element.
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: |
      The Prolog predicate squeeze(Input,Output) removes consecutive duplicates. Complete its equal-head clause so one copy remains available for comparison with the rest of the list.

      ```prolog
      squeeze([X,X|T], R) :- MISSING.
      ```
    answer: "`squeeze([X|T], R)`"
    explanation: "Self-check: exactly one repeated X is dropped, but one X stays at the front of the recursive input. Recursing on T would lose both copies; recursing on [X,X|T] would make no progress."

  # Lecture: [08] Logic Palooza (Public).docx — Prolog Rules
  # Assessment: Homework Problems (Public).docx LOGIC3
  - id: cs131-v2-logic-card-shared-team-rule
    hint: >-
      Use one membership fact for each person. Which argument position needs the same variable in both goals to connect the two memberships?
    difficulty: intermediate
    bloom: create
    estimated_seconds: 60
    question: "The fact on_team(Person,Team) records membership. Write one Prolog rule same_team(A,B) that succeeds when A and B share a team. Allow A and B to be the same person."
    answer: "`same_team(A,B) :- on_team(A,T), on_team(B,T).`"
    explanation: "Self-check: both membership subgoals use the same team variable. Using unrelated team variables would allow people on different teams. Reversing the two subgoals preserves this relation's meaning."

  # Lecture: [08] Logic Palooza (Public).docx — Example 4: Deleting an atom from a list
  # Assessment: Homework Problems (Public).docx LOGIC5; CS131 Fall 25 Quiz 4 (with solutions).docx P5
  - id: cs131-v2-logic-card-list-repair
    hint: >-
      Assume the recursive call has correctly removed an item from the tail. Account for the head that this clause passed over without removing.
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 45
    question: |
      The recursive Prolog clause loses the prefix before the removed item. Replace only `R` in its head to repair that problem.

      ```prolog
      remove_one(X,[X|T],T).
      remove_one(X,[H|T],R) :- remove_one(X,T,R).
      ```
    answer: "Use `remove_one(X,[H|T],[H|R]) :- remove_one(X,T,R).`"
    explanation: "The recursive result R describes the processed tail. The current head H must be put back before it. For remove_one(b,[a,b,c],Out), the repaired rule first produces Out = [a,c]."

  # Lecture: [08] Logic Palooza (Public).docx — Recursive Rules; Resolution Continued
  # Assessment: Homework Problems (Public).docx LOGIC6 (resolution algorithm)
  - id: cs131-v2-logic-card-recursion-repair
    hint: >-
      Substitute a for X in each candidate’s first goal. Check whether the recursive call has reached a new node before it asks another path question.
    difficulty: advanced
    bloom: evaluate
    estimated_seconds: 60
    question: |
      For this finite, acyclic Prolog edge database, which recursive body avoids repeatedly asking the same path question before making progress: `path(X,M), edge(M,Y)` or `edge(X,M), path(M,Y)`? Justify the choice for path(a,Y).

      ```prolog
      edge(a,b).
      edge(b,c).
      path(X,Y) :- edge(X,Y).
      ```
    answer: "Use `edge(X,M), path(M,Y)`. It first chooses an actual next node, so path(a,Y) recurses on b and then c rather than immediately re-entering a path search from a."
    explanation: "The acyclic database makes this progress finite. This is an operational search-order argument, even though both bodies describe connected paths."

  # Lecture: [08] Logic Palooza (Public).docx — Prolog Lists; Example 4: Deleting an atom from a list
  # Assessment: Homework Problems (Public).docx LOGIC7(A); [Final] F24 V1 (Public).pdf P7(C) p.25
  - id: cs131-v2-logic-card-double-elements
    hint: >-
      Assume recursion has produced the doubled tail. Decide what this call must place before that result, then handle the input with no head separately.
    difficulty: advanced
    bloom: create
    estimated_seconds: 60
    question: "Write two Prolog clauses for double_each(Input,Output) on finite lists: [] produces [], and each element appears twice in the output. For example, double_each([a,b],R) yields R = [a,a,b,b]. Use head/tail matching and recursion."
    answer: |
      ```prolog
      double_each([], []).
      double_each([H|T], [H,H|R]) :- double_each(T,R).
      ```
    explanation: "Self-check: the empty case ends recursion, the recursive call processes only T, and the output places two copies of H before the processed tail R. Equivalent variable names are valid."
