title: "CS 131: Logic Programming"
description: "Practice short Prolog traces, explanations, repairs, and rule construction."
active: true
# Complete replacement. Page references below are physical PDF pages.
# Time estimates are planning estimates, not measured student completion times.
cards:
  # Lecture: logic_palooza_v6_handouts.pdf pp.25–27,36,47–48.
  # Assessment: [Final] F23 (Public).pdf, Problem 8(a)(ii) p.22; infer a query variable using repeated-variable constraints.
  - id: cs131-v2-logic-card-unify-repeated
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 30
    question: "Unify `record(X, tag(X))` with `record(blue, tag(Y))`. Give bindings for X and Y."
    answer: "X = blue and Y = blue."
    explanation: "The first position fixes X as blue. Its repeated occurrence inside tag(...) then forces Y to match blue too."

  # Lecture: logic_palooza_v6_handouts.pdf pp.16–19.
  # Assessment: Fall 2025 Quiz 4, Problem 4(a); evaluate a ground query using only the displayed database.
  - id: cs131-v2-logic-card-ground-negation
    difficulty: basic
    bloom: understand
    estimated_seconds: 30
    question: |
      Does `allowed(kai)` succeed? Explain using the database, without assuming anything about the real person.

      ```prolog
      blocked(ren).
      allowed(X) :- not(blocked(X)).
      ```
    answer: "Yes. The database cannot prove blocked(kai), so not(blocked(kai)) succeeds."
    explanation: "This is negation as failure for a ground query. It reports what this program can prove, not independent evidence about the world."

  # Lecture: logic_palooza_v6_handouts.pdf pp.20–23,42.
  # Assessment: [Final] F23 (Public).pdf, Problem 8(b) p.23; enumerate ordered answers across a shared middle node.
  - id: cs131-v2-logic-card-two-step-order
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |
      Give all Y values in order for `hop(a,Y)`.

      ```prolog
      edge(a,c).
      edge(a,b).
      edge(b,z).
      edge(c,y).
      hop(X,Y) :- edge(X,M), edge(M,Y).
      ```
    answer: "Y = y, then Y = z."
    explanation: "The first subgoal chooses M = c before M = b. Its second subgoal reaches y; after backtracking, the b branch reaches z. The later location of edge(c,y) does not reverse the branch order."

  # Lecture: logic_palooza_v6_handouts.pdf pp.13–14,22,42.
  # Assessment: Fall 2025 Quiz 4, Problem 4(c); preserve duplicate solutions from distinct proofs.
  - id: cs131-v2-logic-card-duplicate-reason
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 45
    question: |
      Why does `pick(X)` produce X = a twice when all answers are requested?

      ```prolog
      red(a).
      round(a).
      pick(X) :- red(X).
      pick(X) :- round(X).
      ```
    answer: "There are two successful proofs: one through red(a), then one through round(a). Each proof yields X = a."
    explanation: "Resolution enumerates successful proofs in clause order. It does not automatically turn their bindings into a set of unique answers."

  # Lecture: logic_palooza_v6_handouts.pdf pp.46,48–49.
  # Assessment: Fall 2025 Quiz 4, Problem 5; fill list-pattern variables consistently.
  - id: cs131-v2-logic-card-list-decomposition
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 30
    question: "Unify `[A,B|Rest]` with `[[red],blue,green,yellow]`. Give A, B, and Rest."
    answer: "A = [red], B = blue, Rest = [green,yellow]."
    explanation: "A matches one whole element, even when that element is a list. Rest matches the list remaining after the first two elements."

  # Lecture: logic_palooza_v6_handouts.pdf pp.47–49,52–54.
  # Assessment: Fall 2025 Quiz 4, Problem 5; construct the equal-head case for consecutive duplicate removal.
  - id: cs131-v2-logic-card-squeeze-equal
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: |
      squeeze(Input,Output) removes consecutive duplicates. Complete its equal-head clause so one copy remains available for comparison with the rest of the list.

      ```prolog
      squeeze([X,X|T], R) :- MISSING.
      ```
    answer: "`squeeze([X|T], R)`"
    explanation: "Self-check: exactly one repeated X is dropped, but one X stays at the front of the recursive input. Recursing on T would lose both copies; recursing on [X,X|T] would make no progress."

  # Lecture: logic_palooza_v6_handouts.pdf pp.9–10,22–23.
  # Assessment: [Final] S23 V1 (Public).pdf, Problem 5 p.11; build a relation by joining facts through a shared variable.
  - id: cs131-v2-logic-card-shared-team-rule
    difficulty: intermediate
    bloom: create
    estimated_seconds: 60
    question: "The fact on_team(Person,Team) records membership. Write one rule same_team(A,B) that succeeds when A and B share a team. Allow A and B to be the same person."
    answer: "`same_team(A,B) :- on_team(A,T), on_team(B,T).`"
    explanation: "Self-check: both membership subgoals use the same team variable. Using unrelated team variables would allow people on different teams. Reversing the two subgoals preserves this relation's meaning."

  # Lecture: logic_palooza_v6_handouts.pdf pp.48,51–54.
  # Assessment: Fall 2025 Quiz 4, Problem 5; complete the output list after a recursive call.
  - id: cs131-v2-logic-card-list-repair
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 45
    question: |
      The recursive clause loses the prefix before the removed item. Replace only `R` in its head to repair that problem.

      ```prolog
      remove_one(X,[X|T],T).
      remove_one(X,[H|T],R) :- remove_one(X,T,R).
      ```
    answer: "Use `remove_one(X,[H|T],[H|R]) :- remove_one(X,T,R).`"
    explanation: "The recursive result R describes the processed tail. The current head H must be put back before it. For remove_one(b,[a,b,c],Out), the repaired rule first produces Out = [a,c]."

  # Lecture: logic_palooza_v6_handouts.pdf pp.13–14,42–44.
  # Assessment: [Final] F24 V1 (Public).pdf, Problem 7(A.1) p.23; explain how subgoal order affects recursive progress.
  - id: cs131-v2-logic-card-recursion-repair
    difficulty: advanced
    bloom: evaluate
    estimated_seconds: 60
    question: |
      For this finite, acyclic edge database, which recursive body avoids repeatedly asking the same path question before making progress: `path(X,M), edge(M,Y)` or `edge(X,M), path(M,Y)`? Justify the choice for path(a,Y).

      ```prolog
      edge(a,b).
      edge(b,c).
      path(X,Y) :- edge(X,Y).
      ```
    answer: "Use `edge(X,M), path(M,Y)`. It first chooses an actual next node, so path(a,Y) recurses on b and then c rather than immediately re-entering a path search from a."
    explanation: "The acyclic database makes this progress finite. This is an operational search-order argument, even though both bodies describe connected paths."

  # Lecture: logic_palooza_v6_handouts.pdf pp.48–50,52–54.
  # Assessment: [Final] F24 V1 (Public).pdf, Problem 7(C) p.25; construct a recursive list output from head elements and a recursive tail.
  - id: cs131-v2-logic-card-double-elements
    difficulty: advanced
    bloom: create
    estimated_seconds: 60
    question: "Write two clauses for double_each(Input,Output) on finite lists: [] produces [], and each element appears twice in the output. For example, double_each([a,b],R) yields R = [a,a,b,b]. Use head/tail matching and recursion."
    answer: |
      ```prolog
      double_each([], []).
      double_each([H|T], [H,H|R]) :- double_each(T,R).
      ```
    explanation: "Self-check: the empty case ends recursion, the recursive call processes only T, and the output places two copies of H before the processed tail R. Equivalent variable names are valid."
