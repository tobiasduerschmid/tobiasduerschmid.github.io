title: "Observer Pattern Flashcards"
description: "Key concepts, design decisions, and trade-offs of the Observer design pattern."
active: true
cards:
  - id: 1
    difficulty: basic
    question: "What problem does the Observer pattern solve?"
    answer: "Maintaining a one-to-many dependency between objects efficiently and without tight coupling—when one object changes state, all dependents are notified automatically."
    explanation: "The Subject maintains a dynamic list of Observers and notifies them via `update()`. This avoids polling and avoids hardcoding the subject to specific dependents."
  - id: 2
    difficulty: advanced
    question: "In the Observer pattern, which variant requires observers to know the subject's query interface?"
    answer: "The **Pull model** adds that dependency. Push instead couples observers to the event payload format; neither variant is universally less coupled."
    explanation: "Push supplies a chosen payload; it need not contain the subject's entire state. Pull sends a minimal notification and observers query. A hybrid can push the event type and let observers pull additional data."
  - id: 3
    hint: >-
      After a view closes, draw the references still held by the long-lived subject. Which objects remain reachable?
    difficulty: advanced
    question: "What is the **lapsed listener problem**?"
    answer: "A memory leak where observers register with a subject but are never unsubscribed, causing the subject's reference to keep them alive in memory."
    explanation: "Solutions: explicit unsubscribe (disciplined but error-prone), weak references (language-dependent), or scoped subscriptions tied to lifecycle management."
  - id: 4
    hint: >-
      Start at the unexpected screen update and work backward. Where was its callback registered, and what later invoked it?
    difficulty: advanced
    question: "Why can Observer-pattern callbacks require extra work to trace?"
    answer: "Subscription and notification occur at different sites. To explain an update, trace the registration, the subject's notification, and the observer callback."
    explanation: "Observers or client setup code may register the subscription. Pull observers can also hold an explicit subject reference; their dependency is not inherently invisible."
  - id: 5
    difficulty: basic
    question: "Name three contexts where the Observer pattern is highly applicable."
    answer: "Classic GUI/MVC (model notifies views), event listeners, and in-process subscriptions to a news source."
    explanation: "Swing listeners and Node.js EventEmitter illustrate related notification designs. Distributed feeds additionally require transport, delivery, and retry policies that Observer itself does not supply."

  - id: 6
    difficulty: intermediate
    question: In the Observer pattern, a sensor calls `chart.draw()` and `table.draw()` directly. How would
      you let it support a new display without changing the sensor?
    hint: >-
      Imagine adding a third display. Which class should need a new implementation, and which code should stay the same?
    answer: Notify each subscriber through a common `update()` operation. Each display implements its own rendering.
  - id: 7
    difficulty: intermediate
    question: An Observer subject stores `[chart, table]`. Its notify method calls only `observers[0].update()`.
      What change makes both displays receive updates?
    hint: >-
      Trace which list elements the indexing expression visits before deciding how to repair the notification.
    answer: Loop over the registered observers and call `update()` on each.
