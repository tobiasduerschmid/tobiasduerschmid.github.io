        pause_after: 0.25
        step: Build the skill AI will amplify
        visual: >-
          An experienced user's plan and inspection frame the AI's contribution. A staircase at
          the end represents how AI builds on skills you keep practicing.
        note: Experienced AI users often plan, guide, and check the work.
      - id: p10
        say: >-
          The concern is that students who keep building these skills will get more value from
          AI, while those who skip that practice risk falling behind.
        pause_after: 0.52
        step: Build the skill AI will amplify
        visual: >-
          An experienced user's plan and inspection frame the AI's contribution. A staircase at
          the end represents how AI builds on skills you keep practicing.
        note: The same tool can deliver more value as your skills grow.
      - id: p11
        say: >-
          This means that as a college student, your main goal should be to maximize your skills
          so that, when you then add AI on top, you amplify a larger base of skills and keep
