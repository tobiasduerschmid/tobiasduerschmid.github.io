          expertise, the picture shifts to a focused hint for the specific step they still need.
        note: >-
          Detailed guidance helps beginners but can add unnecessary effort as learners gain
          expertise.
      - id: p02
        say: >-
          As your knowledge grows, adjust the support. CLT calls this the expertise reversal
          effect: detailed guidance that helps when you are new can become unnecessary or get in
          the way once you know what you are doing.
        pause_after: 0.25
        step: Use less guidance as your skills grow
        visual: >-
          A complete explanation gives a new learner a starting point. As a learner gains
          expertise, the picture shifts to a focused hint for the specific step they still need.
        note: >-
          Detailed guidance helps beginners but can add unnecessary effort as learners gain
          expertise.
      - id: p03
        say: >-
          As familiar patterns take less working-memory capacity, explanations you no longer
          need can add extraneous load. A complete recursion trace may help on your first
          attempt; later, try tracing the calls yourself and ask for feedback only where you are
          unsure.
        pause_after: 0.52
        step: Try a related problem without AI later
        visual: >-
