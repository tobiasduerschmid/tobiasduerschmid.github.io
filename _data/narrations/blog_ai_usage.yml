        note: Use AI to expand what you can learn while keeping responsibility for your reasoning.
      - id: p03
        say: >-
          In my opinion, this will fundamentally impact how much the current generation of
          college students will take out of their educational experience, because AI
          capabilities are growing at a very fast pace.
        pause_after: 0.25
        step: Use AI to strengthen your own thinking
        visual: >-
          A student is the central figure, with a robot beside them representing the help they
          can choose to use.
        note: Use AI to expand what you can learn while keeping responsibility for your reasoning.
      - id: p04
        say: >-
          In Math, within just four years, AI has grown from barely passing grade school math
          tests to solving the hardest math problems that the world’s leading experts were
          unsuccessfully trying to solve for decades.
        pause_after: 0.25
        step: Prepare for a higher skills bar
        visual: >-
