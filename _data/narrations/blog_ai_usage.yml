  - id: motivation-build-the-skills-to-use-ai-well
    label: Build the skills
    title: 'Motivation: Build the Skills to Use AI Well'
    part: Why skills matter
    purpose: Both edits belong in the file.
    takeaway: Practice resolving the hard part of an assignment before asking AI to do it.
    cues:
      - id: p01
        say: 'Motivation: Build the Skills to Use AI Well'
        pause_after: 0.5
        step: A good merge preserves both edits
        visual: >-
          A clock reads Friday at seven in the evening, setting the scene for the merge
          conflict.
        note: A merge conflict can require combining two edits to a shared section.
      - id: p02
        say: >-
          It’s 7:00 PM on a Friday. Your friends want to watch a movie, but you’re stuck
          resolving a Git merge conflict in your group project. You and a teammate changed the
          same section of a file.
        pause_after: 0.25
        step: A good merge preserves both edits
        visual: >-
          Two cards show your version and your teammate’s version of the same code block. Each
          edit has a different line pattern.
        note: The conflict is practice in reasoning about both changes.
      - id: p03
        say: >-
          Keeping your version would lose their changes; keeping theirs would lose yours. You’ve
          spent an hour figuring out how to combine them, and the temptation to paste the
          conflict into AI and just prompting it “fix this” is overwhelming.
        pause_after: 0.25
        step: A good merge preserves both edits
        visual: >-
          On “combine,” copies of both differently marked edits slide into the combined file.
          Both contributions are preserved.
        note: A merge conflict can require combining two edits to a shared section.
      - id: p04
        say: >-
          A professional might just ask AI for a fix. So why should you not just take this
          tempting short cut? Because skipping the learning phase means you’re not growing your
          skills — the main goal of education!
        pause_after: 0.52
        step: Strong foundations make AI more useful
        visual: >-
          A student's practice anchors the scene. Code and blocks show the coding and design
          foundations that help individuals benefit from AI and the team habits AI can amplify.
        note: >-
          Strong coding and design foundations helped professionals gain more speed in Google's
          study.
      - id: p05
        say: >-
          Several studies point to a useful lesson for your degree: strong technical skills can
          help you get more out of AI.
        pause_after: 0.25
        step: Strong foundations make AI more useful
        visual: >-
          A student's practice anchors the scene. Code and blocks show the coding and design
          foundations that help individuals benefit from AI and the team habits AI can amplify.
        note: AI can strengthen good team habits or compound existing problems.
      - id: p06
        say: >-
          In Google’s study of professional developers, those with stronger coding foundations
          and more system design experience gained more speed from AI tools. There is a similar
          pattern in teams: AI can strengthen good working habits, but it can also make existing
          problems worse.
        pause_after: 0.25
        step: Strong foundations make AI more useful
        visual: >-
          A student's practice anchors the scene. Code and blocks show the coding and design
          foundations that help individuals benefit from AI and the team habits AI can amplify.
        note: >-
          Strong coding and design foundations helped professionals gain more speed in Google's
          study.
      - id: p07
        say: >-
          Studies in programming education help explain why fundamentals matter. Learners with
          stronger foundations could follow generated code, spot mistakes, and recognize cases
          the AI had missed. Those are the same skills you practice when you trace an algorithm,
          choose a data structure, or debug an assignment.
        pause_after: 0.25
        step: Foundations help you check AI’s work
        visual: >-
          Three peer items show how programming foundations help you follow generated code, spot
          missed cases, and use subject knowledge to evaluate an AI’s work.
        note: >-
          Practice tracing, choosing data structures, and debugging so you can evaluate
          AI-generated work.
      - id: p08
        say: >-
          Anthropic also found that people with more knowledge of the task’s subject were more
          likely to succeed in their Claude Code sessions.
        pause_after: 0.25
        step: Foundations help you check AI’s work
        visual: >-
          Three peer items show how programming foundations help you follow generated code, spot
          missed cases, and use subject knowledge to evaluate an AI’s work.
        note: >-
          Practice tracing, choosing data structures, and debugging so you can evaluate
          AI-generated work.
      - id: p09
        say: >-
          A recurring difference was how people used the tool: more experienced users planned,
          guided, and checked its work, while beginners more often turned to it simply to get
