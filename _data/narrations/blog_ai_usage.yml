        note: Brown's in-person final scores were generally lower among students who took it.
      - id: p20
        say: >-
          Learning research calls some useful challenges “desirable difficulties”: recalling an
          idea without your notes, for example, can help you remember it later even though it
          feels harder than rereading. The useful part is the mental practice, rather than
          frustration for its own sake.
        pause_after: 0.25
        step: Rereading is weaker for retention
        visual: >-
          Rereading sits beside recall from memory, a more demanding activity that can
          strengthen retention. As the narration points to further reading, the caption names
