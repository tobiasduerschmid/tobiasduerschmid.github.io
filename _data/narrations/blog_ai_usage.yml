        pause_after: 0.25
        step: Build the skill AI will amplify
        visual: >-
          An experienced user's plan and inspection frame the AI's contribution. A staircase at
          the end represents how AI builds on skills you keep practicing.
        note: Experienced AI users often plan, guide, and check the work.
      - id: p12
        say: >-
          Unfortunately, AI as a technology often incentivizes behavior that reduces skill
          formation, if used inappropriately. To use an analogy: Using AI to do the heavy
          lifting in your coursework is like sending a robot to the gym instead of working out
          yourself.
        pause_after: 0.52
        step: You build skill by doing the hard reps
        visual: >-
          A student stays on the sideline as a robot raises a barbell. The student's speech
          bubble says, “Wow, I just discovered this AI that makes my workout so much easier and
          faster!”
        note: >-
          Delegating the hard part can make an assignment easier while removing the practice
          that builds skills.
      - id: p13
        say: In the illustration, a student watches a robot lift weights.
        pause_after: 0.18
        step: You build skill by doing the hard reps
        visual: >-
          A student stays on the sideline as a robot raises a barbell. The student's speech
          bubble says, “Wow, I just discovered this AI that makes my workout so much easier and
