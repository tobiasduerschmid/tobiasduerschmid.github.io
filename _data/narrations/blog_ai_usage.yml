  - id: fading-the-scaffold-the-goal-is-independence
    label: Fade toward independence
    title: 'Fading the Scaffold: The Goal is Independence'
    part: Study patterns
    purpose: Guidance changes with skill
    takeaway: Reduce guidance as your skill grows and check again without AI after a delay.
    cues:
      - id: p01
        say: 'Fading the Scaffold: The Goal is Independence'
        pause_after: 0.5
