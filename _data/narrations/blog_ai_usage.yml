  - id: cognitive-offloading-beneficial-vs-detrimental-use
    label: Cognitive offloading
    title: 'Cognitive Offloading: Beneficial vs. Detrimental Use'
    part: Cognitive load
    purpose: Working memory has limited capacity.
    takeaway: Remove avoidable friction while keeping the reasoning that serves your learning goal.
    cues:
      - id: p01
        say: 'Cognitive Offloading: Beneficial vs. Detrimental Use'
        pause_after: 0.5
        step: Both kinds of load share one limit
        visual: An outline labeled Working memory marks the space available for mental work.
        note: >-
          Cognitive Load Theory distinguishes intrinsic and extraneous demands on limited
          working memory.
      - id: p02
        say: >-
          Before diving into the actionable tips, I think it is useful to understand the theory
          behind what makes you learn effectively. Whether AI helps or harms learning depends on
          what you offload.
        pause_after: 0.25
        step: Both kinds of load share one limit
        visual: >-
          The shared space for mental work is still empty as the narration asks which effort to
          offload.
        note: >-
          Cognitive Load Theory distinguishes intrinsic and extraneous demands on limited
          working memory.
      - id: p03
        say: >-
          Cognitive Load Theory (CLT) differentiates different kinds of cognitive load:
          intrinsic and extraneous with a total cap of how much combined load you can keep in
          your brain at a time.
        pause_after: 0.52
        step: Both kinds of load share one limit
        visual: >-
          Intrinsic load and extraneous load enter the same tray. A bracket below the labels
          makes clear that both draw on one shared limit.
        note: >-
          Cognitive Load Theory distinguishes intrinsic and extraneous demands on limited
          working memory.
      - id: p04
        say: >-
          Intrinsic load is the cognitive effort that actually helps you learn. It comes from
          the ideas you need to understand together, relative to what you already know.
        pause_after: 0.25
        step: Recursion requires tracking ideas together
        visual: >-
          Three side-by-side cards show calls, variables, and return values. You must track all
          three together when learning recursion.
        note: >-
          Intrinsic load reflects the ideas you must reason about together, given what you
          already know.
      - id: p05
        say: >-
          When you first learn recursion, tracking calls, variables, and return values are the
          intrinsic load that makes your mental muscle grow.
        pause_after: 0.52
        step: Recursion requires tracking ideas together
        visual: >-
          Three side-by-side cards show calls, variables, and return values. You must track all
          three together when learning recursion.
        note: >-
          Intrinsic load reflects the ideas you must reason about together, given what you
          already know.
      - id: p06
        say: >-
          Extraneous load is avoidable effort added by how the material is presented, such as
          confusing instructions, searching for an explanation, challenges of installing
          required packages, or debugging a rare bug in your local step that prevents you from
          working on the actual homework problem.
        pause_after: 0.52
        step: Offload friction and keep the reasoning
        visual: The working-memory tray holds target reasoning and a second card for setup friction.
        note: Offload obstacles that are incidental to the learning goal.
      - id: p07
        say: >-
          Cognitive offloading means using tools to reduce mental effort, whether that’s a
          calculator, a calendar reminder, or AI debugging a script.
        pause_after: 0.25
        step: Offload friction and keep the reasoning
        visual: >-
          The setup card slides out of working memory into the tool’s tray. The target reasoning
          stays in working memory.
        note: Keep the attention-demanding reasoning that the assignment is meant to teach.
      - id: p08
        say: Your aim should be to reduce extraneous load while keeping intrinsic load high.
        pause_after: 0.85
        step: Offload friction and keep the reasoning
        visual: >-
          The empty slot in working memory shows the space that opened up when the tool took
          over the setup friction.
        note: Offload obstacles that are incidental to the learning goal.
