scenes:
  - id: introduction
    label: Introduction
    title: Introduction
    part: Why skills matter
    purpose: A guide for computer science students
    takeaway: Use AI in ways that strengthen the thinking you will need on your own.
    cues:
      - id: p01
        say: How Should I Use AI as a College Student? — A Science-Backed Guide for CS Students
        pause_after: 0.6
        step: Use AI to strengthen your own thinking
        visual: >-
          A student is the central figure, with a robot beside them representing the help they
          can choose to use.
        note: Use AI to expand what you can learn while keeping responsibility for your reasoning.
      - id: p02
        say: >-
          Many of my students come to me with this wonderful question: “How can I leverage AI as
          a tool to supercharge my education without accidentally outsourcing my own
          intelligence?”
        pause_after: 0.25
        step: Use AI to strengthen your own thinking
        visual: >-
          A student is the central figure, with a robot beside them representing the help they
