# Edit speech and teaching text here. Visual state lives in ../narration_visuals/therac25.json.
version: 1
id: therac25
kind: case-study
title: "Therac-25: follow the evidence"
description: >-
  Start with the machine and a normal setup. Then use the evidence to reproduce, locate, explain,
  and repair a failure. No radiotherapy knowledge is assumed.
references:
  - title: "Leveson and Turner (1993): investigation and technical reconstruction"
    url: https://web.stanford.edu/class/cs240/old/sp2014/readings/therac-25.pdf
  - title: "Silvis-Cividjian (2024): interviews with physicist Fritz Hager"
    url: >-
      https://research.vu.nl/ws/portalfiles/portal/399472131/Therac-25_Accidents_We_Keep_on_Learning_From_Them.pdf
  - title: "Jonathan Jacky: machine configuration and safety engineering"
    url: https://staff.washington.edu/jon/pubs/safety-critical.html
  - title: "The Debugging Book: diagnosis, causality, and incorrectness"
    url: https://www.debuggingbook.org/html/Intro_Debugging.html
lesson:
  name: "Therac-25: follow the evidence"
speech:
  voice: af_heart
  speed: 0.95
  pronunciations:
    Therac-25: Therack twenty five
    Class3: class three
    Ptime: pee time
    Datent: data entry
    F$mal: malfunction status
    Chkcol: check collimator
media:
  audio: /assets/audio/therac25-case-study.mp3
  captions: /assets/narration/therac25-case-study.vtt
  script: /assets/narration/therac25-case-study.txt
scenes:
  - id: orientation
    label: "Start here: people and purpose"
    title: What is Therac-25 supposed to do?
    purpose: Identify the request, the controller, and the physical output.
    evidence: Historical system context; simplified teaching diagram.
    sources:
      - title: "Jacky: machine modes and physical hazard"
        url: https://staff.washington.edu/jon/pubs/safety-critical.html
      - title: "Leveson and Turner: software responsibilities"
        url: https://web.mit.edu/6.033/2004/wwwdocs/papers/Side_bar_1.html
    cues:
      - id: cue-1
        say: >-
          Therac-25 was a computer-controlled machine used to treat cancer with radiation. A
          therapist entered a prescribed treatment at a keyboard and screen, called the console. The
          patient received radiation from the treatment head. Follow the arrows: the first arrows
          carry information; the last arrow represents a physical beam.
        step: Meet the people and the machine
        note: ""
        visual: >-
          Therapist, console, controller, treatment head, and patient form an information-to-output
          chain.
      - id: cue-2
        say: >-
          The prescription specified the intended treatment, including the kind of radiation and the
          dose. Absorbed dose is radiation energy deposited per unit mass of tissue. The controller
          was the software that prepared the equipment and managed delivery. Typing a request did
          not itself deliver radiation. Our debugging question will be how a reasonable request
          could lead to an incorrect physical result.
        step: Separate a request from a result
        note: ""
        visual: The request enters through the console; the delivered radiation leaves the treatment head.
  - id: modes
    label: "Understand: two treatment modes"
    title: The beam settings and beam path must match
    purpose: Explain why a mode change needs coordinated preparation.
    evidence: Historical system context; simplified teaching diagram.
    sources:
      - title: "Jacky: machine modes and physical hazard"
        url: https://staff.washington.edu/jon/pubs/safety-critical.html
    cues:
      - id: cue-1
        say: >-
          An accelerator gives electrons energy, producing an energetic beam. Both treatment modes
          began with that electron beam. In electron mode, abbreviated E, the machine spread that
          electron beam across the treatment field at appropriate settings. In this diagram, read
          each arrow as the path of the beam. We show only the parts needed to understand the
          difference between modes.
        step: Electron treatment
        note: ""
        visual: An electron treatment beam passes through beam spreading to the treatment field.
      - id: cue-2
        say: >-
          In X-ray mode, abbreviated X, the electrons instead struck a metal target inside the
          treatment head, producing X-rays. Here, target means a machine part, not the tumor. This
          conversion required a substantially more intense electron beam. Changing between E and X
          therefore required changing both beam settings and the physical arrangement.
        step: X-ray treatment
        note: ""
        visual: A more intense electron beam strikes a metal target, producing X-rays.
      - id: cue-3
        say: >-
          If X-ray-production settings remained while the required metal target was absent, intense
          electrons could reach the patient inappropriately. That is the mismatch we need to
          understand. Remember two questions: what settings has the machine applied, and what is
          actually in the beam path? The displayed choice alone cannot answer both.
        step: Identify the dangerous combination
        note: ""
        visual: Beam setup and positioning separately influence physical output.
  - id: normal
    label: "Understand: normal preparation"
    title: Walk through a successful setup first
    purpose: Read a sequence diagram and distinguish preparation from permission.
    evidence: Historical system context; simplified teaching diagram.
    sources:
      - title: "Leveson and Turner: software responsibilities"
        url: https://web.mit.edu/6.033/2004/wwwdocs/papers/Side_bar_1.html
    cues:
      - id: cue-1
        say: >-
          This sequence diagram shows a successful setup with an unchanged E request. Each vertical
          lane represents a responsibility. Read events from top to bottom. An arrow shows an
          interaction; a return arrow reports a result. Our simplified example first prepares the
          beam settings, then the physical arrangement. It does not claim the historical program
          used these exact calls.
        step: Learn to read the sequence
        note: ""
        visual: One E request is followed by preparation of E settings and E positioning.
      - id: cue-2
        say: >-
          Both preparations must be suitable for the current request before treatment proceeds. A
          ready indication means the controller is allowing the next step; it is a claim to examine,
          not independent proof of physical correctness. The operator's command to turn the beam on
          comes after preparation. None of the setup arrows in this diagram delivers radiation. Keep
          three facts separate: requested mode, applied configuration, and permission to operate.
        step: Preparation is not permission
        note: ""
        visual: The diagram stops at the configuration check, before permission or beam-on.
      - id: cue-3
        say: >-
          So far the request stayed unchanged. But the interface allowed the therapist to correct an
          entry. Setup took time, and software could handle keyboard input while other preparation
          remained unfinished. We will first establish what happened, then compare ordinary setup
          with a correction during that work. The first decision begins with the reported evidence.
        step: Now introduce the debugging problem
        note: ""
        visual: The same successful baseline remains available for comparison with later edited requests.
  - id: report
    label: "Investigate: the report"
    title: A report the display cannot explain
    purpose: Separate an observation from an explanation.
    evidence: >-
      Published Tyler observations; the reported warning was Malfunction 54. The diagram groups
      evidence sources.
    sources:
      - title: Tyler incidents, March and April 1986
        url: https://web.mit.edu/6.033/2004/wwwdocs/papers/Therac_2.html
    cues:
      - id: cue-1
        say: >-
          In Tyler, Texas, two incidents occurred in 1986. Patients reported unexpected painful
          effects during treatment, while the console displayed a low dose and a cryptic numbered
          warning. The machine paused, but its interface allowed the operator to proceed. A low
          reading could suggest little radiation had been delivered; the patient's experience
          challenged that interpretation.
        step: Open the Tyler case
        note: ""
        visual: Patient reports and console indications reach the investigation through separate paths.
      - id: cue-2
        say: >-
          We are reviewing an investigation after treatment has stopped. A symptom is an observation
          needing explanation: the patient's report, the reading, and the warning are symptoms. They
          do not yet identify a defective routine. Which investigation would test whether the
          displayed account agreed with the machine's physical output? Choose an observation that
          adds a different source of evidence.
        step: Choose what to establish first
        note: ""
        visual: The evidence map shows two information sources without selecting a cause.
        prediction: true
    checkpoint:
      question: >-
        A patient's report conflicts with a low console reading. Which investigation best tests the
        reading independently?
      options:
        - Repeat the console reading under the same conditions.
        - Measure physical output in a controlled investigation.
        - Trace the warning text to identify the defective routine.
      correct_index: 1
      explanation: >-
        Independent physical evidence can test the console account. Investigators must also
        establish the measurement instrument's valid range; a saturated instrument cannot supply a
        reliable dose. This does not mean reenacting exposure with a patient.
      option_feedback:
        "0": Repeating a display checks its repeatability, not its agreement with physical output.
        "2": >-
          The routine displaying a warning may only report a downstream symptom. First establish
          what happened.
  - id: configuration
    label: "Investigate: the machine"
    title: One request changes several responsibilities
    purpose: State the requirement before diagnosing a failure.
    evidence: Machine context with a conceptual responsibility diagram.
    sources:
      - title: "Jacky: How Did It Happen?"
        url: https://staff.washington.edu/jon/pubs/safety-critical.html
    cues:
      - id: cue-1
        say: >-
          Before following the software, state what correct operation requires. The request
          expresses the intended treatment. Beam setup chooses operating settings. Positioning
          selects the arrangement in the beam path. These are different responsibilities. A
          completed setup routine tells us about its own work; it does not automatically tell us
          what another responsibility has done.
        step: Use the machine model
        note: ""
        visual: The request feeds two preparation paths, both of which influence output.
      - id: cue-2
        say: >-
          Imagine the console now says E. We need evidence about whether treatment may proceed, not
          just evidence that the text on screen changed. Use the two preparation paths in the
          diagram to decide what must be established for the current request.
        step: Decide what permission requires
        note: ""
        visual: Both configuration paths remain visible as the learner chooses evidence for permission.
        prediction: true
    checkpoint:
      question: Which evidence justifies operation under the configuration requirement?
      options:
        - The current request and displayed mode agree.
        - The beam-setup routine has completed its work.
        - The current request and verified configuration agree.
      correct_index: 2
      explanation: >-
        Permission requires a suitable applied configuration for the current request. A display or
        one completed routine cannot by itself establish that agreement.
      option_feedback:
        "0": Both values can describe intent while the apparatus retains settings from earlier work.
        "1": >-
          One completed responsibility does not establish consistency with positioning or later
          edits.
  - id: reproduce
    label: "Reproduce: choose an experiment"
    title: Ordinary checks do not explain this history
    purpose: Design a comparison that can distinguish explanations.
    evidence: Published investigative context; comparison traces are teaching scenarios.
    sources:
      - title: Tyler investigation and reproduction
        url: https://web.mit.edu/6.033/2004/wwwdocs/papers/Therac_2.html
      - title: "Hager interview: reproduction and collaboration"
        url: >-
          https://research.vu.nl/ws/portalfiles/portal/399472131/Therac-25_Accidents_We_Keep_on_Learning_From_Them.pdf
    cues:
      - id: cue-1
        say: >-
          Routine checks initially failed to reproduce the reported event. Investigators also
          considered an electrical shock, without substantiating that explanation. A machine working
          normally during a check does not explain a different history. Reproducing means finding
          repeatable conditions that produce the relevant failure, with an observable result that
          tells us whether it happened. The therapists contributed the keyboard history; physicist
          Fritz Hager helped investigate physical output. Their different observations were needed
          together.
        step: Why the first checks were not enough
        note: ""
        visual: The comparison contains direct E entry and an X request corrected to E.
      - id: cue-2
        say: >-
          Look at the two branches. The top branch enters E directly. The lower branch enters X,
          begins setup, then corrects the entry to E. The word alternative means these are separate
          trials, not one combined run. Both end with E on the request, but the earlier work is
          different. The diagram deliberately withholds the outcomes.
        step: Compare two paths to the same screen
        note: ""
        visual: Separate branches show direct entry and correction during outstanding setup.
      - id: cue-3
        say: >-
          Keep the equipment and intended final treatment the same. Which comparison would help
          determine whether the order and timing of the correction matter? Think about what another
          investigator would have to record to repeat your trial. We are designing controlled
          investigation conditions, not repeating exposure with a patient.
        step: Choose a comparison that can teach us something
        note: ""
        visual: >-
          The two histories have the same final request and potentially different preparation
          histories.
        prediction: true
    checkpoint:
      question: >-
        Two trials end with the same E request. Which comparison best tests a history-dependent
        explanation?
      options:
        - Hold the final request fixed; vary and record edit timing.
        - Repeat the final request; omit the earlier interactions.
        - Change the machine and request together in each trial.
      correct_index: 0
      explanation: >-
        Control the initial conditions and final request while comparing event order and timing.
        Record entry, edits, outstanding setup, and completion so another investigator can reproduce
        the relevant history.
      option_feedback:
        "1": >-
          Earlier work can retain state after the final display changes. Omitting history removes
          the proposed cause from the experiment.
        "2": >-
          Changing multiple factors together makes it harder to identify which difference explains
          the result.
  - id: reads
    label: "Locate: predict the next read"
    title: Pause between two decisions
    purpose: Trace what each consumer can know.
    evidence: Reconstruction of published relationships, not a recovered execution log.
    sources:
      - title: Tyler software mechanism
        url: https://web.mit.edu/6.033/2004/wwwdocs/papers/Therac_2.html
    cues:
      - id: cue-1
        say: >-
          Reconstructing a rapid change from X to E helped investigators reproduce the Tyler
          problem. We now ask how that history could matter. The controller had one computer, but
          several software tasks took turns running. A task could pause while input handling changed
          a shared value, then resume. Two processors are not required for this kind of timing
          problem.
        step: Input history becomes reproducible
        note: ""
        visual: Beam setup and positioning are different lanes around a shared request.
      - id: cue-2
        say: >-
          The Shared request lane stands for information in memory. Beam setup reads X and uses it
          to select settings. The therapist then changes the shared request to E. Changing that
          memory value does not undo a decision already made from its earlier value. Follow the
          arrows down to the correction; the positioning read has not yet happened.
        step: Follow a read, then a write
        note: ""
        visual: >-
          Beam setup has selected from X; the shared request is now E; positioning has not read it
          yet.
      - id: cue-3
        say: >-
          Positioning is about to read the current request. No step recomputing earlier settings is
          shown. What combination of decisions is now possible? Also separate internal preparation
          from physical output: inhibited means operation is not permitted.
        step: Predict the next decision
        note: ""
        visual: The positioning read and authorization outcome are deliberately withheld.
        prediction: true
    checkpoint:
      question: >-
        Setup used X; the request then changed to E. Positioning is about to read it. Before earlier
        settings are updated, what can be true?
      options:
        - Both decisions automatically become E when input changes.
        - The decisions differ, but output may still be inhibited.
        - The discrepancy proves that output has already occurred.
      correct_index: 1
      explanation: >-
        Decisions can refer to different versions of intent. A temporary mismatch is not by itself
        proof of output; operation must remain inhibited until the relevant configuration is
        verified.
      option_feedback:
        "0": >-
          A read already used to select parameters is not automatically recomputed when shared input
          changes.
        "2": >-
          Internal state and externally observable behavior are different boundaries. Inspect what
          authorizes progression.
  - id: missing_check
    label: "Locate: inspect change detection"
    title: The correction was accepted—was it noticed?
    purpose: Follow a control dependency, not only data values.
    evidence: >-
      Teaching reconstruction. Historical routine names: Datent, Hand, Magnet, and Ptime. The shared
      encoding is not itself measured position.
    sources:
      - title: Published Tyler flag and edit-check analysis
        url: https://web.mit.edu/6.033/2004/wwwdocs/papers/Therac_2.html
    cues:
      - id: cue-1
        say: >-
          Positioning can select the E arrangement while the beam settings still come from X. The
          next question is why the controller failed to notice and reconcile the correction.
          Reconcile here means revisiting earlier work so that it agrees with the current request.
          The diagram explains inconsistent decisions; it does not yet show permission to deliver a
          beam.
        step: Reveal the different reads
        note: ""
        visual: Beam setup selects from X and positioning from E.
      - id: cue-2
        say: >-
          Part of setup adjusted bending magnets that steer the electron beam. This took several
          seconds. During the wait, a delay-checking routine could look for corrected input. A
          software flag is a stored value used as a yes-or-no condition. Here, flag on meant magnet
          setup was in progress, and later edit checks depended on that flag being on.
        step: Understand the flag before inspecting it
        note: ""
        visual: Setup, delay checks, and shared state are the three responsibilities in the trace.
      - id: cue-3
        say: >-
          Now follow the sequence. The first delay clears the flag, meaning it sets the flag to off,
          although magnet setup continues. An input correction arrives afterward. A later delay
          checks for edits only when the flag is on. What can happen to this accepted correction?
          The corrected input and the flag are separate stored values.
        step: Predict the consequence of clearing it early
        note: ""
        visual: An early clear precedes a correction and a later conditional edit check.
        prediction: true
    checkpoint:
      question: >-
        Later edit checks require a flag that the first delay has already cleared. What can happen
        during continuing setup?
      options:
        - The input handler must reject every subsequent correction.
        - Every correction automatically restarts all setup work.
        - A correction is accepted but escapes those later checks.
      correct_index: 2
      explanation: >-
        The edit can update input while change detection fails to reconcile earlier derived
        settings. The flag no longer represents the activity it was meant to protect.
      option_feedback:
        "0": Accepting an edit and detecting it in another routine are separate responsibilities.
        "1": >-
          The diagram shows the condition that would enable checking has become false. Automatic
          restart is not established.
  - id: diagnosis
    label: "Explain: connect cause to requirement"
    title: A suspicious flag is not yet a complete diagnosis
    purpose: Explain both causality and incorrectness.
    evidence: Published mechanism with a retrospective application of The Debugging Book.
    sources:
      - title: Tyler analysis and completion weakness
        url: https://web.mit.edu/6.033/2004/wwwdocs/papers/Therac_2.html
      - title: "The Debugging Book: Checking Diagnoses"
        url: https://www.debuggingbook.org/html/Intro_Debugging.html
    cues:
      - id: cue-1
        say: >-
          The later edit check can be skipped because the flag is already off. There was also a
          completion problem. The interface had an area for commands after treatment entry. Reaching
          it once was treated as evidence of completion, even if the therapist went back to edit.
          Past completion did not establish that editing was finished now.
        step: Connect the two coordination problems
        note: ""
        visual: >-
          A skipped edit check can leave earlier parameters in use; the separate completion weakness
          is described in narration.
      - id: cue-2
        say: >-
          Use The Debugging Book's terms. The implementation defect is the incorrect rule, such as
          clearing the setup flag too early. The resulting incorrect runtime state is a fault, also
          called an infection. Incorrect physical output is a failure; injury is its consequence. A
          wrong internal state can exist before any external failure occurs.
        step: Name the levels of the problem
        note: ""
        visual: The flag trace shows an internal mechanism, not physical output or patient injury.
      - id: cue-3
        say: >-
          A diagnosis needs two parts: how this sequence causes the invalid state, and why accepting
          that state violates the requirement. Recall the requirement: applied settings and
          positioning must be suitable for the current request before operation. Which explanation
          connects the mechanism to that requirement? Typing speed identifies a trigger; it does not
          itself explain an implementation defect.
        step: Build a diagnosis, not just a label
        note: ""
        visual: The skipped check is compared with the previously established configuration requirement.
        prediction: true
    checkpoint:
      question: Which diagnosis supplies both causality and incorrectness for the reconstructed Tyler path?
      options:
        - An edit escapes reconciliation; progression accepts incompatible configuration.
        - The operator typed quickly; the speed itself is the software defect.
        - The delay routine looks suspicious; replacing it should prevent the message.
      correct_index: 0
      explanation: >-
        The missed reconciliation explains how earlier settings survive a changed request.
        Progression violates the requirement to establish a suitable current configuration before
        operation. Neither a trigger nor a routine name supplies both parts.
      option_feedback:
        "1": >-
          Speed helps identify a triggering schedule. The system still has to handle its permitted
          correction workflow safely.
        "2": >-
          A location and a hoped-for result are not evidence of the mechanism or its violated
          requirement.
  - id: repair
    label: "Repair: choose a contract"
    title: What should completion be allowed to authorize?
    purpose: Repair the obligation, not just the observed timing.
    evidence: Proposed teaching state machine; not recovered Therac software.
    sources:
      - title: "The Debugging Book: Asserting Expectations"
        url: https://www.debuggingbook.org/html/Assertions.html
    cues:
      - id: cue-1
        say: >-
          To reason about a repair, switch to a state diagram. Each box describes a condition of our
          proposed controller. Inhibited means operation is blocked. Preparing means setup is
          underway. Ready means permission has been granted. Arrows show changes of state. Text in
          square brackets is a guard: a condition that must be true for that change to happen.
        step: Read a state diagram
        note: ""
        visual: Inhibited, Preparing, and Ready are states, with an unfinished guard on completion.
      - id: cue-2
        say: >-
          This is a new teaching design, not a recovered diagram of Therac-25. Starting setup moves
          from Inhibited to Preparing. Completing work might move to Ready, but the guard is
          deliberately missing. An edit after Ready revokes permission. Work based on an older
          request is obsolete: finishing it does not make it suitable for the newer request.
        step: Specify what completion should mean
        note: ""
        visual: Completion is possible, but its authorization guard remains unknown.
      - id: cue-3
        say: >-
          Adding a delay might avoid one observed timing. It would not explain what to do if another
          correction arrived. What must the completion rule establish before granting permission?
          Choose a relationship between the work, the current request, and the equipment, rather
          than a waiting time.
        step: Choose the rule that survives another edit
        note: ""
        visual: The learner fills the missing readiness condition.
        prediction: true
    checkpoint:
      question: Which proposed completion rule addresses acceptance of obsolete work?
      options:
        - Authorize after a fixed additional delay has elapsed.
        - Authorize only a verified configuration for the current request.
        - Authorize when the displayed request matches the prescription.
      correct_index: 1
      explanation: >-
        The contract must relate authorization to the current request and verified configuration. In
        a concurrent implementation, the relevant checks and state changes must be protected from
        intervening edits. A diagram alone does not enforce this.
      option_feedback:
        "0": >-
          A delay changes a schedule without guaranteeing the necessary relationship between
          request, configuration, and permission.
        "2": >-
          A display can be current while derived parameters or physical positioning remain
          inconsistent.
  - id: verify
    label: "Verify: try to defeat the repair"
    title: Blocking the bad history is only one obligation
    purpose: Test both prevention and retained functionality.
    evidence: Historical repair summary and a separate proposed verification contract.
    sources:
      - title: Reported Tyler corrections
        url: https://web.mit.edu/6.033/2004/wwwdocs/papers/Therac_3.html
    cues:
      - id: cue-1
        say: >-
          The proposed rule authorizes only a current, consistent configuration. The larger box
          groups Preparing and Ready: an edit in either state invalidates permission. Text after a
          slash names the action taken. Historically, the Tyler corrections kept the magnet flag on
          until setup ended and added shared editing status to prevent premature progression. Those
          were specific changes implementing related obligations.
        step: Compare the contract with the historical changes
        note: ""
        visual: The state model shows current completion, obsolete completion, editing, and inhibition.
      - id: cue-2
        say: >-
          Suppose the original bad sequence is now blocked. That is necessary, but a controller that
          never permits anything would pass that test too. Which additional test establishes that
          intended use still works? After answering, consider edits after readiness and old work
          finishing late. Old results must not displace a newer valid setup.
        step: Test useful behavior as well as prevention
        note: ""
        visual: Both a blocked path and a path to valid readiness remain visible.
        prediction: true
    checkpoint:
      question: >-
        The repaired design blocks the original bad history. Which additional test checks retained
        functionality?
      options:
        - Repeat only the same bad history many more times.
        - Accept the old outcome by changing the expected result.
        - Complete fresh current setup and confirm valid operation.
      correct_index: 2
      explanation: >-
        A repair must prevent the failure and preserve intended use. Also test edits after
        readiness, overlapping preparations, and obsolete completions arriving after newer work;
        keep their expected outcomes tied to the requirement.
      option_feedback:
        "0": >-
          Repetition strengthens evidence about that history, but never demonstrates the valid-use
          path.
        "1": >-
          Changing the oracle to accept a defective outcome abandons the requirement instead of
          verifying it.
  - id: yakima_boundary
    label: "Transfer: a different defect"
    title: Yakima, January 1987
    purpose: Inspect a boundary without assuming the same cause.
    evidence: >-
      Published Yakima mechanism. The one-byte check-required value was Class3. The
      return-to-treatment request was SET.
    sources:
      - title: The January 1987 Yakima software problem
        url: https://web.mit.edu/6.033/2004/wwwdocs/papers/Therac_3.html
    cues:
      - id: cue-1
        say: >-
          A later accident at Yakima in 1987 involved a different defect. Inside the treatment head,
          a turntable selected components in the beam path. This was not the patient's table. Its
          field-light position used visible light to help align the treatment field; it was not a
          treatment position. A SET request asked the mechanism to return toward the treatment
          configuration. SET did not turn the beam on.
        step: Introduce a different physical position
        note: ""
        visual: The checking chain will determine whether positioning permits progression.
      - id: cue-2
        say: >-
          Before progressing, software needed to check position. Follow three separate steps: setup
          requests a check; the checker inspects position and records a blocking problem if needed;
          progression consults that recorded status. The check request was stored in a one-byte
          value. Nonzero meant perform the check. A byte can represent 256 different values, here
          zero through 255.
        step: Learn the normal checking chain
        note: ""
        visual: >-
          A nonzero request enables physical inspection; unsuitable position records a blocking
          problem.
      - id: cue-3
        say: >-
          The program repeatedly added one to that value during setup passes. These are repetitions
          inside preparation, not counts of patients. The arithmetic wraps: adding one beyond the
          largest representable value starts again at zero. In our paused trace the value is 255,
          and the next pass increments it. Predict the next value and what the nonzero guard will
          do.
        step: Predict the boundary behavior
        note: ""
        visual: The next value after 255 is hidden; only nonzero enables the position check.
        prediction: true
    checkpoint:
      question: >-
        An increment wraps a value ranging from 0 to 255; a check runs only when it is nonzero. What
        follows at 255?
      options:
        - It becomes zero, so the required check can be skipped.
        - It remains 255, so the position check must execute.
        - It proves that every 256th treatment causes an overdose.
      correct_index: 0
      explanation: >-
        The arithmetic produces zero. That can suppress the check if observed in the relevant
        schedule. Unsafe progression additionally depends on physical position, SET timing, and
        malfunction status.
      option_feedback:
        "1": The specified arithmetic wraps rather than saturating at its maximum.
        "2": >-
          The variable changes during setup-loop passes. The hazardous execution requires additional
          conditions; it is not a treatment probability.
  - id: yakima_check
    label: "Explain: the skipped check"
    title: No fault indication is not proof of a completed check
    purpose: Connect a representation defect to the decision using it.
    evidence: >-
      Representative Yakima path. Class3 controlled Chkcol; blocking status was held in F$mal. The
      exact instruction schedule and origin of SET are not recovered.
    sources:
      - title: Published Yakima check and status analysis
        url: https://web.mit.edu/6.033/2004/wwwdocs/papers/Therac_3.html
    cues:
      - id: cue-1
        say: >-
          The value becomes zero, so the position check can be skipped. The later decision uses a
          separate blocking-status value. Think of that status as stored yes-or-no problem
          indicators. If no blocking indicator is set, the software may advance. But that does not
          tell us whether a required check just ran or was skipped.
        step: Follow the missing check into a decision
        note: ""
        visual: The zero request skips the check; later progression reads a separate clear status.
      - id: cue-2
        say: >-
          In the published explanation, the turntable was still in field-light position. A SET
          request occurred during the zero interval, while other blocking indicators remained clear.
          Under those conditions, setup could advance to the next phase with the wrong physical
          arrangement. Wrapping alone does not explain an overdose. Skipping a check also does not
          erase a problem already recorded.
        step: State the conditions of this reconstructed path
        note: ""
        visual: >-
          Field-light position, SET timing, and clear blocking status are explicit conditions of
          this representative path.
      - id: cue-3
        say: >-
          The value was being used to say check required, not to count useful events. If every setup
          pass must leave it nonzero, how should that value be updated? Compare enforcing its
          intended meaning with merely making the wraparound take longer. This repairs one local
          obligation; the complete machine needs more evidence.
        step: Repair what the value is meant to say
        note: ""
        visual: The update and the guard are linked by the check-required value.
        prediction: true
    checkpoint:
      question: >-
        Every setup pass must leave the check-required value nonzero. Which update enforces that
        narrow contract?
      options:
        - Use a wider wrapping counter for the same increments.
        - Assign a fixed nonzero value on each request.
        - Run the existing increment less frequently during setup.
      correct_index: 1
      explanation: >-
        A fixed nonzero assignment preserves the stated meaning; this was the reported local Yakima
        correction. It repairs this update obligation, not the complete medical system.
      option_feedback:
        "0": A wider wrapping counter postpones zero without making it impossible.
        "2": >-
          Changing frequency changes how often the boundary is reached, not whether the contract can
          be violated.
  - id: assurance
    label: "Verify: state the limit of the evidence"
    title: A patch and a safety argument make different claims
    purpose: Match the breadth of a conclusion to its evidence.
    evidence: Published corrective-action requirements; conceptual protection diagram.
    sources:
      - title: Corrective-action review and independent protection
        url: https://web.mit.edu/6.033/2004/wwwdocs/papers/Therac_4.html
    cues:
      - id: cue-1
        say: >-
          A software repair addresses a known mechanism. A protective function adds another way to
          prevent unsafe output. In this diagram the controller requests operation, while a separate
          function observes configuration and can block it. Independence means a controller mistake
          must not automatically defeat that protection too; drawing two boxes does not establish
          that property.
        step: Explain a protective function
        note: ""
        visual: A protective function has configuration evidence and a path to inhibit output.
      - id: cue-2
        say: >-
          The historical corrective process included software changes, protective hardware, clearer
          recovery behavior, documentation, and testing of installed machines. For our proposed
          model, suppose known failing histories and ordinary uses now pass. What conclusion do
          those observations support? Distinguish evidence about those cases from a claim about
          every possible failure.
        step: Match the claim to the evidence
        note: ""
        visual: The learner chooses the scope of the conclusion about passing tests.
        prediction: true
    checkpoint:
      question: >-
        Known failing histories and ordinary cases pass after a model repair. Which conclusion is
        justified?
      options:
        - Every possible software and hardware failure is eliminated.
        - The passing cases provide no evidence about the repair.
        - These cases pass; broader claims require further evidence.
      correct_index: 2
      explanation: >-
        The checks provide useful evidence within their stated model and coverage. Wider safety
        claims require additional requirements, analysis, independent protection, and deployment
        evidence.
      option_feedback:
        "0": >-
          Finite examples do not enumerate every state, schedule, sensor failure, or independent
          defect.
        "1": Tests can support a bounded claim without proving every stronger claim.
  - id: transfer
    label: "Apply: investigate a new symptom"
    title: One copy arrives when two were requested
    purpose: Choose evidence before assigning responsibility.
    evidence: Original transfer exercise; not Therac history.
    sources:
      - title: "The Debugging Book: scientific diagnosis"
        url: https://www.debuggingbook.org/html/Intro_Debugging.html
    cues:
      - id: cue-1
        say: >-
          A print interface displays two copies, but the printer sometimes produces one after a
          last-moment edit. A worker is the software that prepares the print job. It starts before
          the edit and later sends a job to the printer. We do not know the copy count it sends. Two
          explanations remain: an old prepared job, or a printer ignoring a correct job.
        step: Apply the method in a familiar setting
        note: ""
        visual: The request changes while a worker prepares a job; the submitted count is unknown.
      - id: cue-2
        say: >-
          Which observation would distinguish those explanations? For each possible result, say what
          it would support and what would remain unknown. Then name one test that repeats the
          failure history and one that checks ordinary successful use. Your task is to transfer the
          investigation method, not assume this new case has the same cause as Therac-25.
        step: Choose evidence that separates explanations
        note: ""
        visual: The worker-to-printer boundary is visible, but its payload is withheld.
        prediction: true
    checkpoint:
      question: >-
        The interface requests two copies but one is printed. Which observation separates a stale
        job from a printer ignoring a correct job?
      options:
        - Compare the submitted count with the request and output.
        - Confirm only that the interface still displays two copies.
        - Measure only how long the final printing operation took.
      correct_index: 0
      explanation: >-
        A submitted count of one points upstream of printing; a submitted count of two with one
        produced points toward the receiving/output path. Neither observation alone proves a
        particular source line. Preserve the edit/submission history and test both corrected and
        ordinary jobs.
      option_feedback:
        "1": >-
          The visible request does not reveal what the worker submitted or what the printer
          received.
        "2": Duration alone does not distinguish the two stated payload-handling hypotheses.
