# Edit speech and teaching text here. Visual state lives in ../narration_visuals/scrum.json.
version: 1
id: scrum
kind: video
title: Scrum in one sprint
lesson:
  name: Scrum
  summary: >-
    Follow a student team through one sprint to learn Scrum's <strong>roles, artifacts, and
    events</strong>, and the theory that ties them together.
  prerequisites: Assumes familiarity with user stories.
  chapter: /SEBook/process/scrum.html
  views: /SEBook/process/scrum
  parts:
    - Theory
    - Roles
    - Artifacts
    - Events
  parts_label: Part of Scrum
speech:
  voice: af_heart
  speed: 0.95
  pronunciations:
    timeboxed: time boxed
    timebox: time box
    p.m.: PM.
    plan lives: plan livs
    Retrospective close it: Retrospective cloze it
    only uses color: only yoozes color
media:
  audio: /assets/audio/scrum-narration.mp3
  captions: /assets/narration/scrum-narration.vtt
  script: /assets/narration/scrum-narration.txt
scenes:
  - id: intro
    label: Scrum at a glance
    title: Two weeks to fix dinner
    purpose: See why Scrum works in short loops, and what it is made of.
    takeaway: >-
      Scrum gives a team three roles, three artifacts, and five events, all built on learning from
      experience.
    cues:
      - id: cue-1
        say: >-
          It's six fifty-eight p.m. You're starving, and the dining-hall line is out the door.
          Again. A student team wants to fix that with Hall Hopper, an app that shows tonight's
          menus and how packed each hall is right now. They have two weeks to ship something real.
        step: A two-week promise
        note: A student team wants a working feature in students' hands in two weeks.
        visual: >-
          A long line snakes out of a dining-hall door under a clock reading 6:58 p.m. Then a phone
          slides in with the Hall Hopper app: three halls, each with a crowd meter reading Quiet,
          Busy, or Packed. A sticker slaps on: Two weeks.
      - id: cue-2
        say: >-
          One way to build it: plan the whole app up front, build for months, then launch. By then,
          students might want something else, and it's too late to change course. Scrum takes the
          other path: deliver a small, working piece every few weeks, learn from real users, and
          adjust.
        step: Plan everything, or learn as you go
        note: A small, working piece every few weeks beats one big launch at the end.
        visual: >-
          On the left, a staircase of phases, Requirements, Design, Build, and Test, is hit by a
          wave labeled Change, with the caption Too late to change course. On the right, a loop of
          Plan, Build, Show, and Improve keeps turning around the phone.
      - id: cue-3
        say: >-
          Scrum is the most popular way agile teams work, and it's deliberately small: three roles,
          who is accountable for what; three artifacts, the work everyone can see; and five events,
          the rhythm that keeps the team learning. The team decides everything else. Let's follow
          Hall Hopper's team through one sprint.
        step: Three roles, three artifacts, five events
        note: Roles say who is accountable, artifacts make the work visible, and events set the rhythm.
        visual: >-
          A heading reads Deliberately small, with a sticker: Most popular. Three cards fill in: 3
          roles, who is accountable for what (Developers, Product Owner, Scrum Master); 3 artifacts,
          the work everyone can see (Product Backlog, Sprint Backlog, Increment); and 5 events, the
          rhythm of learning (Sprint, Sprint Planning, Daily Scrum, Sprint Review, Sprint
          Retrospective). Stickers add: The team decides the rest, and Next: one sprint.
  - id: theory
    outline: Empiricism
    part: Theory
    label: "Theory: empiricism"
    title: Learn by looking, not by guessing
    purpose: Understand the idea that every part of Scrum serves.
    takeaway: Transparency makes inspection possible, and inspection pays off only when the team adapts.
    cues:
      - id: cue-1
        say: >-
          Why work in short loops? Because building software for real people is a complex problem:
          you can't predict everything by thinking harder. Will students actually trust a crowd
          meter? No meeting can answer that. So Scrum runs on empiricism: decide from experience and
          observation, not from up-front predictions.
        step: Empiricism
        note: Decide from experience and observation, not from detailed predictions.
        visual: >-
          A crystal ball labeled Predict everything up front gets a stamp: Too complex. A student
          checks the crowd meter on the phone, and a loop appears around them: Try it, Watch,
          Adjust.
      - id: cue-2
        say: >-
          Empiricism stands on three pillars. Pillar one, transparency: the important facts about
          the work are visible to everyone doing it and everyone receiving it. The work is on the
          wall, not hidden in someone's head or a private spreadsheet.
        step: Transparency
        note: The work is on the wall, visible to everyone who does or receives it.
        visual: >-
          A temple appears with the roof Scrum and the base Empiricism: decide from what you
          observe. Its first pillar rises and lights up: Transparency, work visible to all. Beside
          it, a column titled On the wall holds three cards, Crowd meter, Tonight's menus, and Hall
          photos, seen by two badges, Developers and Students, with the sticker Visible to all.
      - id: cue-3
        say: >-
          Pillar two, inspection: the team checks its progress and its artifacts often, so problems
          show up while they're still small. Transparency makes this possible. Inspecting work you
          can't actually see is misleading.
        step: Inspection
        note: Frequent checks catch problems while they are small.
        visual: >-
          The second pillar rises and lights up: Inspection, check often. A sticker labeled Inspect
          slides down the wall's cards, and a red note appears, Bug: the meter shows the wrong hall,
          with the sticker Caught early. A sticker on the first pillar reads Makes inspection
          possible, and a dashed box labeled Hidden work is stamped Misleading.
      - id: cue-4
        say: >-
          Pillar three, adaptation: when something drifts off course, the team adjusts as soon as it
          can. Inspecting without adapting is pointless, like checking a map and then ignoring it.
          Every Scrum event you're about to meet is a built-in moment to inspect and adapt.
        pause_after: 2.5
        step: Adaptation
        note: Adjust as soon as something drifts; inspecting without adapting is pointless.
        visual: >-
          The third pillar rises and lights up: Adaptation, adjust quickly. On a dashed course line,
          a dot drifts off course and comes back, with the stickers Off course, then Adjusted. A
          note, Inspect without adapting, is stamped Pointless, and a last note reads Every event:
          inspect and adapt, as all three pillars light up.
  - id: team
    outline: Team and Developers
    part: Roles
    label: "Roles: the team and its Developers"
    title: One small team with every skill it needs
    purpose: See what makes a Scrum Team different, and what its Developers do.
    takeaway: >-
      A Scrum Team is cross-functional and self-managing, and its Developers build a usable
      Increment every sprint.
    cues:
      - id: cue-1
        say: >-
          Meet Hall Hopper's Scrum Team: seven people, one product. The team is cross-functional:
          together, they have every skill needed to ship working software each sprint, from design
          and app screens to the server and testing. No tossing work over the wall to another
          department.
        step: Cross-functional
        note: Together, the team has every skill needed to deliver each sprint.
        visual: >-
          Seven name badges drop into a dashed frame labeled One Scrum Team. Skill tags snap onto
          them: Design, App screens, Server, and Testing.
      - id: cue-2
        say: >-
          The team is also self-managing, often called self-organizing: the team decides who does
          what, when, and how. Inside it, Scrum defines three roles, officially called
          accountabilities: the Developers, the Product Owner, and the Scrum Master. No ranks, and
          no sub-teams.
        step: Self-managing, with three accountabilities
        note: The team decides who does what; Scrum names three accountabilities.
        visual: >-
          The skill tags leave, and a sticker reads Self-managing. Notes ask Who does what?, When?,
          and How?, with the sticker The team decides. A sticker reads 3 accountabilities, and the
          badges get theirs: a bracket under five badges reads Developers, Ana's tag reads Product
          Owner, and Ben's reads Scrum Master. Stickers add No ranks and No sub-teams.
      - id: cue-3
        say: >-
          Think of it like a character-select screen. Player one: the Developers, the builders.
          That's everyone who creates part of the usable product each sprint. On Hall Hopper, a
          designer, a tester, and three programmers. Not only the people who write code.
        step: Developers build
        note: Designers and testers are Developers too.
        visual: >-
          A character-select screen shows three role cards: Developers, Product Owner, and Scrum
          Master. The Developers card lights up, showing five badges, a Designer, a Tester, and
          three Programmers, and its power: Ship a usable Increment.
      - id: cue-4
        say: >-
          The Developers own three things. They create the sprint's plan, called the Sprint Backlog.
          They build quality in by meeting the Definition of Done, the team's shared checklist of
          quality standards, and by holding each other accountable. And every day, they adapt their
          plan to hit the sprint's goal.
        pause_after: 2.5
        step: What Developers own
        note: The plan, the quality, and the daily adjustments are theirs.
        visual: >-
          The other role cards fade, leaving the Developers card. Around it appears what the
          Developers own: a Sprint Backlog column of task notes, with the sticker The plan; a
          Definition of Done checklist being checked (Code reviewed, Automated tests pass, Tested on
          a real phone), with the sticker Quality and a note, Hold each other accountable; and an
          Inspect and Adapt loop beside a Sprint Goal flag, with the sticker Every day.
  - id: product_owner
    outline: Product Owner
    part: Roles
    label: "Roles: Product Owner"
    title: The Product Owner steers toward value
    purpose: Learn how the Product Owner decides what the team builds next.
    takeaway: >-
      The Product Owner maximizes value by learning what customers need, ordering the backlog, and
      accepting finished work.
    cues:
      - id: cue-1
        say: >-
          Player two: the Product Owner, the value navigator. One person, accountable for maximizing
          the value the team's work creates. Hall Hopper's Product Owner skips the guesswork and
          talks directly with students and dining-hall staff to learn what they actually need, and
          why.
        step: The value navigator
        note: One person who learns needs from real customers.
        visual: >-
          On the character-select screen, the Product Owner card lights up, with a compass and the
          power: Maximize value. Speech bubbles pop up from a student, Which hall is quiet right
          now?, and a dining-hall manager, We can share live swipe counts.
      - id: cue-2
        say: >-
          They turn those needs into user stories and order the Product Backlog, so the most
          valuable work comes first. They answer the Developers' questions, and when work is
          finished, they check its acceptance criteria to decide whether it does what was asked.
        step: Ordering the work
        note: Most valuable first; acceptance criteria decide whether a story is met.
        visual: >-
          The speech bubbles turn into story cards in a Product Backlog column, which reorder, most
          valuable first: 1, See how crowded each hall is; 2, Tonight's menus; 3, Hall photos; 4,
          Favorite halls. A Developer asks, When is a hall Packed? The Product Owner answers, When
          the line is out the door. An Acceptance criteria checklist gets checked, Given I open the
          app, Then every hall shows Quiet, Busy, or Packed, with the sticker What was asked.
      - id: cue-3
        say: >-
          Product Owners fall into three classic traps. Needs reach them through a long chain of
          people, like a game of telephone: so talk with customers directly. Managers dictate the
          vision: so give the Product Owner real authority. Little domain knowledge: so choose
          someone who understands both the users and development.
        pause_after: 2.5
        step: Three classic traps
        note: Each trap has a direct fix.
        visual: >-
          A heading reads Three classic traps. Three pink trap cards each get a green fix card. Long
          chains: needs pass through many people, and four people pass on Quiet hall? until it
          arrives as Quiz hall?; fix: talk with customers directly. A dictated vision: a Manager's
          note says Build a leaderboard!; fix: give the Product Owner real authority. Little domain
          knowledge: the Product Owner asks, What's a swipe count?; fix: someone who knows users and
          development.
  - id: scrum_master
    outline: Scrum Master
    part: Roles
    label: "Roles: Scrum Master"
    title: The Scrum Master coaches and clears the way
    purpose: Learn what the Scrum Master does, and what they are not.
    takeaway: >-
      The Scrum Master coaches the team and removes impediments; they serve the team rather than
      manage it.
    cues:
      - id: cue-1
        say: >-
          Player three: the Scrum Master, the team coach. They help everyone understand Scrum, coach
          the team in managing itself, and make sure every event is effective, productive, and kept
          within its time limit, which Scrum calls a timebox.
        step: The team coach
        note: Events stay effective and inside their timeboxes.
        visual: >-
          Player three: the Scrum Master card lights up, the team coach, with the power Clear
          impediments. A sticker reads Explains Scrum. The Scrum Master asks three team members, How
          do you want to split this? A card titled Every event lists Effective, Productive, and Kept
          within its time limit, and a sticker lands on it: Timebox.
      - id: cue-2
        say: >-
          Their other superpower: removing impediments, blockers the team can't clear alone. Hall
          Hopper's crowd meter needs live data from dining services, and that needs a data agreement
          signed by the legal office. The Scrum Master chases the signature, so the Developers can
          keep building.
        step: Removing an impediment
        note: An impediment is a blocker the team cannot remove alone.
        visual: >-
          A task card, Connect live swipe data, gets a red stamp: Blocked, waiting for a data
          agreement. The Scrum Master's badge, with a whistle, carries the agreement to the legal
          office and back. A green Signed stamp lands, and the Blocked stamp falls away.
      - id: cue-3
        say: >-
          Two common mix-ups. The Scrum Master is not a product manager: deciding what to build is
          the Product Owner's job. And they are not a project manager or anyone's boss. A Scrum
          Master shields and supports the team; they don't command it.
        step: Not a manager
        note: Product decisions belong to the Product Owner; the team manages its own work.
        visual: >-
          A heading reads Two mix-ups. A card, A product manager?, is stamped Nope, with the sticker
          Product Owner's job. A card, A project manager or boss?, is stamped Nope. On the right,
          the Scrum Master's badge stands in front of three team members, with the stickers Shields,
          Supports, and No commands.
      - id: cue-4
        say: >-
          Expect a healthy tension between these two roles. The Scrum Master speaks up for internal
          quality: maintainable code, the Developers' needs, and a better process. The Product Owner
          pushes for external quality: the features customers want, on schedule. Great teams balance
          both.
        pause_after: 2.5
        step: A healthy tension
        note: Internal quality and external quality, balanced by the team.
        visual: >-
          A heading reads A healthy tension. A balance holds two pans: the Scrum Master's, Internal
          quality (Maintainable code, The Developers' needs, A better process), and the Product
          Owner's, External quality (Features customers want, On schedule). The beam tips one way,
          then the other, and levels out under the sticker Great teams balance both.
  - id: product_backlog
    outline: Product Backlog
    part: Artifacts
    label: "Artifacts: Product Backlog"
    title: One ordered list of what the product needs
    purpose: Learn how the Product Backlog collects and orders the work.
    takeaway: >-
      The Product Backlog is the single, ordered, ever-changing source of work, aimed at the Product
      Goal.
    cues:
      - id: cue-1
        say: >-
          Now the artifacts, the work everyone can see. Artifact one: the Product Backlog, an
          ordered list of what's needed to improve the product. It's the team's single source of
          work. If an idea isn't on the Product Backlog, nobody works on it. Not even if the dean
          asks nicely.
        step: The single source of work
        note: If it is not on the Product Backlog, the team does not work on it.
        visual: >-
          A board with three columns, Product Backlog, Sprint Backlog, and Increment, slides onto
          the wall. Five story cards stack into the Product Backlog column, numbered 1 to 5. A note
          from the dean is redirected to the Product Owner with a sticker: Only through the backlog.
      - id: cue-2
        say: >-
          Most items are user stories with acceptance criteria. Hall Hopper's top story: as a hungry
          student, I want to see how crowded each dining hall is, so that I can skip the long lines.
          The Product Owner keeps the most valuable stories at the top.
        step: User stories, in order
        note: Each item says who wants what, and why, with acceptance criteria.
        visual: >-
          The top card grows: As a hungry student, I want to see how crowded each dining hall is, so
          that I can skip the long lines. Its acceptance criteria read: Given I open the app, Then
          every hall shows Quiet, Busy, or Packed.
      - id: cue-3
        say: >-
          The backlog is emergent: it keeps changing as the team learns. Refinement splits big,
          fuzzy items into smaller, clearer ones and adds details like order and size. And the whole
          list points at a Product Goal, the long-term target. Hall Hopper's: every student picks a
          dining hall in under a minute.
        pause_after: 2.5
        step: Emergent, refined, aimed at a goal
        note: Refinement splits and details items; the Product Goal is the long-term target.
        visual: >-
          A Product Backlog column holds three ranked cards and a dashed, fuzzy card, Make dining
          better. Stickers read Emergent and Refinement, with the line It keeps changing as the team
          learns. The fuzzy card splits into two smaller, clearer cards, Favorite halls and Hall
          opening hours, and a size appears beside each card, with the sticker Order and size. A
          gold banner types in the Product Goal, Every student picks a dining hall in under a
          minute, with the sticker Long-term target.
  - id: sprint_backlog
    outline: Sprint Backlog
    part: Artifacts
    label: "Artifacts: Sprint Backlog"
    title: The Developers' plan for one sprint
    purpose: Learn the three parts of the Sprint Backlog.
    takeaway: >-
      The Sprint Backlog is the Developers' plan, with a Sprint Goal (why), selected items (what),
      and tasks (how).
    cues:
      - id: cue-1
        say: >-
          Artifact two: the Sprint Backlog, the Developers' plan for one sprint. It answers three
          questions. Why does this sprint matter? That's the Sprint Goal. What will we build? The
          Product Backlog items chosen for the sprint. How will we build them? A plan of tasks.
        step: Why, what, and how
        note: A goal, the selected items, and a plan of tasks.
        visual: >-
          A frame labeled Sprint Backlog fills in three rows. Why? Sprint Goal: Students can check
          how crowded a hall is before walking over. What? Selected items: See how crowded each hall
          is, Tonight's menus, and Hall photos. How? Plan of tasks: Read swipe counts, Draw the
          meter, Write meter tests, and Hall list screen. A sticker reads The Developers' plan.
      - id: cue-2
        say: >-
          Hall Hopper's Sprint Goal: students can check how crowded a hall is before walking over.
          The plan lives on the wall in real time, updated by the Developers, for the Developers.
          Anyone can glance at it and see exactly where the sprint stands.
        step: A plan on the wall
        note: Visible in real time, by and for the Developers.
        visual: >-
          In the Sprint Backlog column, a banner shows the Sprint Goal: Students can check how
          crowded a hall is before walking over. Under it, task notes move across To do, Doing, and
          Done.
      - id: cue-3
        say: >-
          Plot twist: one item turns out way bigger than expected. The Developers renegotiate the
          scope with the Product Owner, maybe saving the hall photos for later, but the Sprint Goal
          stays locked. One shared goal keeps the team pulling together instead of drifting into
          side quests.
        pause_after: 2.5
        step: Scope bends, the goal holds
        note: Scope is renegotiated with the Product Owner; the Sprint Goal stays.
        visual: >-
          A story card, Hall photos, grows too big for the sprint. After a speech bubble from the
          Product Owner's badge, it slides back to the Product Backlog. The Sprint Goal banner stays
          put, with a lock.
  - id: increment
    outline: Increment
    part: Artifacts
    label: "Artifacts: Increment"
    title: Done means usable
    purpose: Learn when work becomes part of the Increment.
    takeaway: >-
      An Increment is a usable, verified step toward the Product Goal, and only work that meets the
      Definition of Done counts.
    cues:
      - id: cue-1
        say: >-
          Artifact three: the Increment, a concrete stepping stone toward the Product Goal. Each
          Increment adds to all the earlier ones, is verified so everything works together, and must
          be usable. A pretty mockup or a half-built screen doesn't count.
        step: A usable step
        note: Each Increment adds to the earlier ones and works with them.
        visual: >-
          The phone shows the first working crowd meter, a colored dot for each hall. Increments
          stack like steps toward a flag labeled Product Goal, and a half-built screen is stamped:
          Not usable.
      - id: cue-2
        say: >-
          So who decides what finished means? The Definition of Done: the team's shared quality
          standard. Hall Hopper's says code reviewed, automated tests pass, and tested on a real
          phone. The moment an item meets it, an Increment is born.
        step: The Definition of Done
        note: A shared quality standard; meeting it makes an Increment.
        visual: >-
          A Definition of Done checklist appears: Code reviewed, Automated tests pass, Tested on a
          real phone. A story card passes each check, gets a Done stamp, and joins the Increment.
      - id: cue-3
        say: >-
          Prediction time. It's the sprint's last day. One story is ninety percent finished, but its
          tests still fail. Does it count toward the Increment? And where does it go next? Pause
          here if you want more thinking time.
        step: Predict
        note: Ninety percent done, with failing tests. What happens to it?
        visual: >-
          A board with the columns Product Backlog, Sprint Backlog, and Increment. The Increment
          holds See how crowded each hall is, marked Done. In the Sprint Backlog, the story
          Tonight's menus shows 90% finished, with the stickers Tests fail and Last day. Dashed
          arrows lead from it to two empty slots marked with question marks, one in the Increment
          and one in the Product Backlog, under the stickers Predict and Pause and think.
        prediction: true
        pause_after: 4
      - id: cue-4
        say: >-
          It doesn't count: ninety percent done is not done. Work that misses the Definition of Done
          can't be released or shown as finished. It returns to the Product Backlog, where the
          Product Owner orders it again. Notice that each artifact comes with a commitment: the
          Product Goal, the Sprint Goal, and the Definition of Done.
        pause_after: 2.5
        step: Unfinished work goes back
        note: Unfinished work returns to the Product Backlog to be ordered again.
        visual: >-
          The story is stamped Not done, the Increment's slot disappears, and a sticker there reads
          Not released. The story slides back into the Product Backlog, takes rank 4, and a sticker
          reads Ordered again. Then each column gets its commitment flag: Product Goal, Sprint Goal,
          and Definition of Done.
  - id: sprint
    outline: Sprint
    part: Events
    label: "Events: the Sprint"
    title: A fixed timebox that holds every other event
    purpose: Learn what makes a sprint a sprint.
    takeaway: >-
      A Sprint is a fixed timebox, typically two to three weeks, that contains every other event;
      the next one starts as soon as it ends.
    cues:
      - id: cue-1
        say: >-
          Now the events, the rhythm of Scrum. First, the Sprint itself: a fixed timebox, usually
          two to three weeks and never more than a month, of focused work toward the Sprint Goal.
          When one sprint ends, the next one begins immediately. No gaps, no off-season.
        step: A fixed timebox
        note: Two to three weeks, never more than a month, and back to back.
        visual: >-
          A calendar strip of ten workdays is bracketed as Sprint 1, two weeks. Right after it, a
          second bracket, Sprint 2, begins with no gap.
      - id: cue-2
        say: >-
          The Sprint is a container for the other four events. Sprint Planning opens it, a Daily
          Scrum happens every working day, and the Sprint Review and Sprint Retrospective close it.
          Inside the sprint, nobody makes changes that would endanger the Sprint Goal.
        pause_after: 2.5
        step: A container for the other events
        note: Planning opens it, Daily Scrums fill it, and the Review and Retrospective close it.
        visual: >-
          Markers land on the calendar: Sprint Planning on day 1, a Daily Scrum dot on every day,
          and the Sprint Review and Sprint Retrospective on day 10.
  - id: sprint_planning
    outline: Sprint Planning
    part: Events
    label: "Events: Sprint Planning"
    title: Why, what, and how
    purpose: Learn the three questions Sprint Planning answers.
    takeaway: >-
      Sprint Planning creates the Sprint Backlog by answering why the sprint is valuable, what can
      be done, and how.
    cues:
      - id: cue-1
        say: >-
          Sprint Planning kicks off the sprint, with the whole Scrum Team in the room. Topic one:
          why is this sprint valuable? The Product Owner pitches how the product could gain value,
          and together the team writes the Sprint Goal.
        step: "Why: the Sprint Goal"
        note: The Product Owner proposes the value; the whole team writes the goal.
        visual: >-
          The team's badges gather around the board. The Product Owner's badge points at the top of
          the Product Backlog, and an empty Sprint Goal banner fills in: Students can check how
          crowded a hall is before walking over.
      - id: cue-2
        say: >-
          Topic two: what can we get done? The Developers pull top items from the Product Backlog
          and size them, for example with planning poker. Topic three: how will we do it? They break
          each item into tasks that take a day or less.
        step: What, and how
        note: The Developers select items and split them into tasks of a day or less.
        visual: >-
          Three story cards slide from the Product Backlog into the Sprint Backlog. Planning poker
          cards flip to 3, 5, and 8. Each story splits into small task notes marked one day or less.
      - id: cue-3
        say: >-
          Notice that the three questions build the three parts of the Sprint Backlog: the goal
          answers why, the selected items answer what, and the tasks answer how.
        pause_after: 2.5
        step: Three questions, three parts
        note: Why, what, and how become the Sprint Backlog.
        visual: >-
          The Sprint Backlog frame fills in again, under the sticker Built in Sprint Planning: the
          Sprint Goal answers Why?, the selected items answer What?, and the task notes answer How?
  - id: daily_scrum
    outline: Daily Scrum
    part: Events
    label: "Events: Daily Scrum"
    title: Fifteen minutes to re-plan the day
    purpose: Learn what the Daily Scrum is for, and what it is not.
    takeaway: >-
      In the Daily Scrum, the Developers inspect progress toward the Sprint Goal and adapt their
      plan, in fifteen minutes.
    cues:
      - id: cue-1
        say: >-
          Every working day, the Developers hold the Daily Scrum, also called the daily stand-up:
          fifteen minutes, same time, same place, and standing keeps it short. The point: inspect
          progress toward the Sprint Goal and adapt the plan for the next day of work.
        step: Inspect and adapt, daily
        note: Fifteen minutes, standing, for the Developers.
        visual: >-
          The Developers' badges stand in a half circle in front of the board, and a fifteen-minute
          timer counts down.
      - id: cue-2
        say: >-
          Many teams answer three questions: what did I do yesterday, how will I help reach the
          Sprint Goal today, and what's blocking me? On day four, a Developer says the dining data
          is still blocked. The Scrum Master grabs that impediment, and the stand-up moves on.
        step: Three questions, one blocker
        note: A blocker surfaces, and the Scrum Master takes it.
        visual: >-
          Three speech bubbles appear: Yesterday, Today, and Blockers. A task note turns red,
          Blocked: no data agreement, and the Scrum Master's badge takes it off the board, with the
          sticker Scrum Master has it.
      - id: cue-3
        say: >-
          One thing it's not: a status report for managers. The Daily Scrum is the Developers
          talking to each other, sharing what they know so they can change today's plan.
        pause_after: 2.5
        step: Not a status report
        note: The Developers talk to each other, not to managers.
        visual: >-
          A Manager's badge holds a Status report, stamped Not this. Four Developers' badges talk to
          each other: Can you pair with me on the meter?, and Sure! I'll write its tests. In a
          column titled Today's plan, a new note appears, Pair up: meter and its tests, with the
          sticker Plan changed.
  - id: sprint_review
    outline: Sprint Review
    part: Events
    label: "Events: Sprint Review"
    title: Show the real thing, then decide what's next
    purpose: Learn how the Sprint Review turns feedback into backlog changes.
    takeaway: The Sprint Review inspects the Increment with stakeholders and adapts the Product Backlog.
    cues:
      - id: cue-1
        say: >-
          End of the sprint: demo time. The Sprint Review inspects the outcome. The team shows the
          Increment to key stakeholders and talks about progress toward the Product Goal. It's a
          working session with live demos, ideally with real customers. Not a slideshow.
        step: A working session
        note: Live demos with real users, not a slide show.
        visual: >-
          Students and a dining-hall manager crowd around the phone, which shows the live crowd
          meter as a colored dot for each hall. A slide deck off to the side is stamped: Not a
          slideshow.
      - id: cue-2
        say: >-
          Students try the crowd meter live, and they love it. Then the feedback lands. Several want
          to filter menus by allergens, and one student who uses a screen reader can't tell how busy
          a hall is, because the meter only uses color. The Product Owner adds both to the Product
          Backlog, near the top.
        step: Feedback changes the backlog
        note: New requests become Product Backlog items, ordered by the Product Owner.
        visual: >-
          Two speech bubbles: Can I filter menus by allergens? and My screen reader can't tell how
          busy a hall is. A sticker points out that the meter uses color only, and two new cards,
          Filter menus by allergens and Crowd level in words too, join the Product Backlog near the
          top.
      - id: cue-3
        say: >-
          The Product Owner also judges whether the Increment delivers the value its stories
          promised. The review's real output is an updated Product Backlog, ready for the next
          Sprint Planning.
        pause_after: 2.5
        step: An updated Product Backlog
        note: The review adapts the Product Backlog.
        visual: >-
          The phone shows the colored-dot crowd meter, and the Product Owner's badge appears beside
          a Value check card: Did the stories deliver? Most students: yes. Screen-reader users: not
          yet. A Product Backlog column lists Crowd level in words too and Filter menus by
          allergens, both new and on top, then Tonight's menus and Hall photos, with the sticker
          Updated and a note, Ready for the next Sprint Planning.
  - id: sprint_retrospective
    outline: Sprint Retrospective
    part: Events
    label: "Events: Sprint Retrospective"
    title: Improve how the team works
    purpose: Learn how the retrospective improves the team's process.
    takeaway: >-
      The Sprint Retrospective inspects how the team worked and picks the most helpful improvements,
      including changes to the Definition of Done.
    cues:
      - id: cue-1
        say: >-
          The final event: the Sprint Retrospective. The review inspected the product; the
          retrospective inspects the process: individuals, interactions, processes, tools, and the
          Definition of Done. What went well? What problems did we hit? How did we solve them, or
          not?
        step: Inspect the process
        note: What went well, what went wrong, and how it was handled.
        visual: "Three columns of sticky notes appear: Went well, Problems, and Try next."
      - id: cue-2
        say: >-
          So why did the screen-reader problem reach users? Nobody checked accessibility. User
          stories focus on features, so qualities like accessibility and performance easily slip
          through. The team's most helpful change: add checked with a screen reader to the
          Definition of Done. Then the next sprint starts.
        step: Change the Definition of Done
        note: Qualities like accessibility belong in the Definition of Done.
        visual: >-
          A Problems note reads: Nobody checked accessibility. A new line is written onto the
          Definition of Done: Checked with a screen reader. The calendar flips to Sprint 2.
      - id: cue-3
        say: >-
          The review changes what the team builds next. The retrospective changes how the team
          works. Both feed straight into the next Sprint Planning.
        pause_after: 2.5
        step: Product versus process
        note: The retrospective adapts the process; the review adapts the Product Backlog.
        visual: >-
          Two cards, Sprint Review, which changes what the team builds next, and Sprint
          Retrospective, which changes how the team works, each send an arrow into a gold banner:
          Next, Sprint Planning.
  - id: inspect_adapt
    outline: Inspect and adapt
    part: Theory
    label: "Theory: every event inspects and adapts"
    title: Four events, one feedback loop
    purpose: Connect each event back to the three pillars.
    takeaway: >-
      Each event inspects one thing and adapts another, so the team learns every day, every sprint,
      and across the product.
    cues:
      - id: cue-1
        say: >-
          Zoom out, and the pattern clicks. The artifacts provide transparency, and every event is a
          scheduled moment to inspect something and adapt something. Sprint Planning inspects the
          Product Backlog and the Product Goal, and adapts the plan by creating a new Sprint
          Backlog.
        step: Sprint Planning
        note: It inspects the Product Backlog and creates the plan.
        visual: >-
          A board fills in under the stickers Artifacts: transparency, Inspects, and Adapts. Its
          first row: Sprint Planning inspects the Product Backlog and the Product Goal, and an arrow
          points to what it adapts: the plan, a new Sprint Backlog.
      - id: cue-2
        say: >-
          Your turn. What does the Daily Scrum inspect, and what does it adapt? What about the
          Sprint Review? Pause here if you want more thinking time.
        step: Predict the next rows
        note: What do the Daily Scrum and the Sprint Review inspect and adapt?
        visual: >-
          Rows for the Daily Scrum and the Sprint Review appear, with empty dashed slots marked with
          question marks where their answers go, under the stickers Your turn and Pause and think.
        prediction: true
        pause_after: 4
      - id: cue-3
        say: >-
          The Daily Scrum inspects progress toward the Sprint Goal and adapts the day's plan. The
          Sprint Review inspects the Increment and adapts the Product Backlog. The Sprint
          Retrospective inspects how the team worked and adapts its process and Definition of Done.
        step: Daily Scrum, Review, and Retrospective
        note: The plan, the Product Backlog, and the process.
        visual: >-
          The slots fill in: the Daily Scrum inspects progress toward the Sprint Goal and adapts the
          day's plan; the Sprint Review inspects the Increment and adapts the Product Backlog. A
          fourth row adds the Sprint Retrospective, which inspects how the team worked and adapts
          its process and the Definition of Done.
      - id: cue-4
        say: >-
          And the Sprint contains them all, so the team learns at three speeds: every day, every
          sprint, and across the whole product. That's empiricism, built right into the calendar.
        pause_after: 2.5
        step: Learning at three speeds
        note: Every day, every sprint, and across the product.
        visual: >-
          A bracket under all four rows reads The Sprint holds them all. Stickers name three speeds,
          Every day, Every sprint, and Whole product, and a gold stamp reads Empiricism.
  - id: summary
    label: Summary
    title: Scrum in one minute
    purpose: Recall every part, then apply Scrum to a new team.
    takeaway: >-
      Roles say who is accountable, artifacts make the work visible, and events turn what the team
      sees into change.
    cues:
      - id: cue-1
        say: >-
          Quick recap. Scrum runs on empiricism and its three pillars: transparency, inspection, and
          adaptation. Three roles share the work: the Developers build a usable Increment, the
          Product Owner maximizes value, and the Scrum Master coaches the team and clears
          impediments.
        step: Theory and roles
        note: Empiricism and its pillars, then three roles.
        visual: >-
          Two recap cards fill in. Theory: Empiricism, with Transparency, Inspection, and
          Adaptation. Roles, three share the work: Developers build, Product Owner maximizes value,
          Scrum Master coaches.
      - id: cue-2
        say: >-
          Three artifacts keep the work visible, each with a commitment: the Product Backlog and its
          Product Goal, the Sprint Backlog and its Sprint Goal, and the Increment and its Definition
          of Done. And five events keep the team inspecting and adapting, sprint after sprint.
        step: Artifacts and events
        note: Three artifacts with their commitments, and five events.
        visual: >-
          Two more cards complete the recap. Artifacts, each with a commitment: Product Backlog,
          Product Goal; Sprint Backlog, Sprint Goal; Increment, Definition of Done. Events, inspect
          and adapt: Sprint, Planning, Daily Scrum, Review, and Retrospective.
      - id: cue-3
        say: >-
          Now level up: the summary quiz drops you into a brand-new team. For each situation, decide
          which part of Scrum it calls for.
        pause_after: 2.5
        step: Try it on a new team
        note: The summary quiz describes a different project.
        visual: >-
          The recap clears for big words, Level up!, and confetti. A card reads Summary quiz: a
          brand-new team, a study-room booking app, with Seven situations and Which part of Scrum
          fits?
