# Sources for every claim: docs/publish-subscribe-narration.md.
version: 1
id: publish_subscribe
kind: video
title: Who is listening?
lesson:
  name: Publish-Subscribe
  summary: >-
    Follow Mochi, a campus delivery robot, as its camera stops calling every program by name and
    starts publishing to a topic. Learn the four rules of the <strong>publish-subscribe</strong>
    style, and what they buy and cost: extensibility and run-time flexibility, paid for in
    robustness and understandability.
  prerequisites: >-
    Assumes you have written functions that call each other and passed a function as a callback.
  chapter: /SEBook/architectural_styles/pubsub.html
  views: /SEBook/architectural_styles/pubsub
  parts:
    - Motivation
    - Rules
    - Consequences
    - In practice
  parts_label: Part of the lesson
speech:
  voice: drama3-female6
  speed: 1
  pronunciations:
    publish-subscribe: publish subscribe
    MQTT: M Q T T
media:
  audio: /assets/audio/publish-subscribe-narration.mp3
  captions: /assets/narration/publish-subscribe-narration.vtt
  script: /assets/narration/publish-subscribe-narration.txt
scenes:
  - id: intro
    part: Motivation
    outline: Mochi
    label: "Motivation: lunch by robot"
    title: Twelve fifty, lab until two
    purpose: Meet the robot this lesson takes apart, and the request that exposes its design.
    takeaway: >-
      Several of Mochi's programs need every camera frame, and new ones keep asking for them.
    cues:
      - id: lunch
        say: >-
          It's twelve fifty. Your lab runs until two, and you're starving. You order a sandwich on
          your phone, and across campus, a cooler-sized robot named Mochi rolls out of the student
          union, weaves between scooters on the main walkway, and parks at your building's door.
        step: Lunch by robot
        note: Mochi is a delivery robot that drives itself across campus.
        visual: >-
          A sticker reads 12:50, lab until 2:00. A paper campus map shows the Student union at the
          top left, the Engineering building at the bottom right, and the Main walkway between them,
          with two scooters on it. Mochi, a cooler-sized robot on six wheels with a camera on its
          lid, two glowing eyes on its face panel, and a safety flag, leaves the union, follows
          the walkway past the scooters, and stops at the engineering building. A phone app, Campus
          Eats, shows Order placed: Sandwich, then Mochi is here: At your door, above a small map
          where Mochi drives to the pin at the door.
      - id: inside
        say: >-
          Inside Mochi, six programs work together. A camera driver grabs thirty frames a second. An
          obstacle detector finds people and scooters in each frame. A planner picks the path, and a
          motor controller turns the wheels. A logger records the trip, and an operator dashboard
          shows the camera's view.
        step: Six programs
        note: The camera's frames feed several of the robot's programs.
        visual: >-
          A C&C view frame titled inside Mochi, with a key: program, a component. Six programs
          appear as UML components, each with a line about its job: Camera driver, 30 frames a
          second; Obstacle detector, finds people and scooters; Planner, picks the path; Motor
          controller, turns the wheels; Logger, records the trip; and Operator dashboard, shows the
          camera's view. A drawing of Mochi sits below the frame.
      - id: ticket
        say: >-
          You've just joined Mochi's software team, and your first ticket sounds easy. Campus
          planning wants to know how crowded the main walkway gets, so add a pedestrian counter
          that reads the camera's frames. Those frames keep finding new fans: first the logger,
          then the dashboard, now this.
        pause_after: 2.5
        step: One more program wants frames
        note: New programs keep asking for the camera's frames.
        source: >-
          Buschmann et al. 1996, Publisher-Subscriber, p. 339: the number and identities of dependent
          components is not known a priori, or may even change over time.
        visual: >-
          A badge reads You, with the tag New on the Mochi team. A card reads Ticket 1: Count
          pedestrians, for campus planning: how crowded the main walkway gets, from the camera's
          frames. A C&C view frame titled Who has wanted the frames, with a key: program, holds
          three components: Logger, last year; Dashboard, this spring; and Pedestrian counter, now,
          highlighted as new.
  - id: direct_calls
    part: Motivation
    outline: Direct calls
    label: "Motivation: the camera calls everyone"
    title: Every frame, every listener, by name
    purpose: See what goes wrong when a sender calls every receiver directly.
    takeaway: >-
      With direct calls, the sender must know every receiver, change for each new one, and wait
      for the slowest.
    cues:
      - id: calls
        say: >-
          Here's the camera driver's loop. For every frame, it calls each program by name: the
          detector, the logger, the dashboard, one after another. Each call waits until that
          program returns. The camera knows exactly who gets its frames, and in what order.
        step: Read the loop
        note: The sender calls each receiver by name and waits for each one.
        source: >-
          CMU 17-655 lecture 12, Call-Return Styles: in blocking call-return, the caller waits until
          the invoked service completes, and elements know the identity of the elements they rely on.
        visual: >-
          A C&C view frame titled direct calls, with a key: program, and call, waits for the return.
          A Python code card titled camera.py shows a loop: while True, frame = sensor.read(), then
          detector.find_obstacles(frame), logger.save(frame), and dashboard.show(frame). As each
          call is named, its line lights up and a call arrow runs from it to the component it calls:
          Obstacle detector, Logger, and Operator dashboard. A sticker reads Each call waits for its
          return.
      - id: edit_camera
        say: >-
          Adding the pedestrian counter changes the camera driver too: you add a call to the
          camera's loop, then retest and redeploy the most critical code on the robot. The camera
          team now owns a counting feature it never asked for, and every future fan means another
          edit.
        step: Every listener edits the sender
        note: Each new receiver means editing, retesting, and redeploying the sender.
        source: >-
          CS 130 lecture 17, slide 22 (publish-subscribe versus direct communication); Buschmann et
          al. 1996, p. 339 (direct calling dependencies are inflexible and not reusable).
        visual: >-
          A new component, Pedestrian counter, appears below the three called components, marked Not
          connected yet. A new line types into the camera.py loop, counter.count(frame), and a call
          arrow joins it to the counter, now marked Called from the loop. A red stamp reads Edit
          camera.py, and red stickers read Retest the camera and Redeploy the camera.
      - id: freeze
        say: >-
          It gets worse. Last week the dashboard's server hung, so the call to show a frame never
          returned. The camera waited at that line, the detector got no new frames, and Mochi froze
          in the middle of the walkway, in front of a campus tour. One slow listener stalled the
          whole robot.
        step: One slow listener stalls all
        note: A blocking call to a hung receiver stops the sender, and everything after it.
        visual: >-
          The direct-calls C&C view again: the camera.py loop's line dashboard.show(frame) is lit,
          and its call arrow runs to the Operator dashboard, which turns grey: Server not
          responding. The Obstacle detector reads No new frames, and frame tokens pile up beside the
          lit line. On a strip of the main walkway, Mochi rolls up to a tour group and stops,
          stamped Frozen. A sticker reads One slow listener stalls all.
      - id: need
        say: >-
          So here's what you need. The camera should announce each frame once, without knowing who
          wants it, and never wait for anyone. That's the publish-subscribe style. Let's meet its
          parts and its four rules, then see what those rules buy, and what they cost.
        pause_after: 2.5
        step: What you need
        note: Announce once, don't know the receivers, never wait.
        visual: >-
          A checklist titled What the camera needs ticks off Announce each frame once, Don't know
          who listens, and Never wait for anyone. A banner reads The style: Publish-subscribe. Three
          cards preview what comes next: Parts and rules, What they buy, and What they cost.
  - id: topic
    part: Rules
    outline: Topics
    label: "Rules: publishers, subscribers, and a topic"
    title: Announce it to a topic
    purpose: Learn the parts of the publish-subscribe style by redesigning Mochi's camera.
    takeaway: >-
      Publishers send events to a topic, and the infrastructure delivers each event to every
      subscriber of that topic, through each subscriber's own queue.
    cues:
      - id: publisher
        say: >-
          Publish-subscribe introduces an intermediary: a topic, a named channel managed by the
          messaging infrastructure. In a component-and-connector view, each program is a component,
          and the topic is the connector between them. The camera becomes a publisher: it announces
          each frame once to the camera image topic and calls no other program.
        step: The camera publishes
        note: A topic is a named channel; the publisher sends each event to it once.
        source: >-
          CS 130 lecture 17, slide 18 (topic, publisher, subscriber, message queues); Clements et al.
          2010, section 4.4.1 (the publish-subscribe runtime infrastructure delivers each event).
        visual: >-
          A C&C view frame whose key reads component, «topic» connector, and publish, deliver. The
          Camera driver appears as a component, with a callout: Publisher. Below it, the topic
          crosses the sheet as a long rounded channel labeled «topic» /camera/image, with a
          callout: Topic: the connector. An attachment runs from the camera's port down to the
          channel, and frame tokens flow along it.
      - id: subscribers
        say: >-
          The other components are subscribers. The detector, logger, and dashboard each register
          with the infrastructure for the camera image topic and supply a callback. Each subscriber
          receives its own message queue. When a frame is published, the connector places a copy in
          every queue, and each callback runs.
        step: Subscribers register
        note: Each subscriber registers a callback and gets its own message queue.
        source: >-
          CS 130 lecture 17, slide 18 (nh.subscribe("topic_name", 10, callback)); Bass et al. 2013,
          section 13.2, Publish-Subscribe Pattern.
        visual: >-
          Below the topic, three subscriber components appear, Obstacle detector, Logger, and
          Dashboard, each attached from the channel to its own port and each with its own row of
          queue slots. Frame copies travel along the topic and down into every subscriber. A callout reads
          Its own queue, and a code card shows node.subscribe("/camera/image", 10, on_frame).
      - id: counter_joins
        say: >-
          Now revisit the ticket. The pedestrian counter subscribes to the same topic, and that is
          the entire change: not one line of the camera driver is modified. With three subscribers,
          four, or none, the camera's code remains identical.
        step: The counter just subscribes
        note: Adding a subscriber changes no publisher.
        closer_look:
          title: The camera never names a subscriber
          notice: >-
            The camera names only a topic; the topic keeps the subscribers and runs their callbacks,
            so adding the counter touches no camera code.
          code: subscribe
          groups:
            - {id: camera, label: "Publisher: Camera driver"}
            - {id: topic, label: "«topic» Messaging infrastructure"}
            - {id: counter, label: "Subscriber: Pedestrian counter"}
          relations:
            - {kind: call, from: topic.deliver, to: counter.callback, label: [calls ↓, at run time]}
            - {kind: dependency, from: counter.subscribe, to: topic.subscribe, label: [subscribes ↑, by topic name]}
          steps:
            - question: What does the camera name?
              focus: [camera.imports, camera.names, camera.publish]
              text: >-
                The sensor, the frame type, the infrastructure, and one topic name,
                <code>/camera/image</code>. No detector, logger, dashboard, or counter appears
                anywhere in the camera driver.
            - question: Who calls the counter?
              focus: [topic.publish, topic.deliver, counter.callback]
              relation: call
              text: >-
                <code>publish()</code> only puts a copy of the frame in every subscriber's queue and
                returns, so the camera never waits. Later, the infrastructure's
                <code>deliver()</code> takes the frame from the counter's queue and runs its
                callback. <strong>The camera never calls the counter.</strong>
            - question: Who keeps the list?
              focus: [counter.subscribe, topic.subscribe, topic.inboxes]
              relation: dependency
              text: >-
                The counter registers its callback under the topic's name, and the topic files it in a
                new inbox. The counter names the topic, not the camera, and the list of subscribers
                lives in the topic, not in the publisher.
            - question: Add or remove the counter
              focus: [counter.subscribe]
              remove: counter
              text: >-
                Delete <code>counter/</code>, or add it for your ticket: the camera driver's diff is
                empty either way. Only the topic's list changes, at run time, one inbox shorter or
                longer.
        visual: >-
          The Pedestrian counter slides in as a fourth subscriber component, attached to the same
          topic with its own queue, and frame copies start reaching it too. Its count rises from
          Counted: 3 to Counted: 7. A green sticker reads 0 lines changed.
      - id: both_roles
        say: >-
          A component may play both roles. The detector subscribes to camera images and publishes
          obstacles. The planner subscribes to obstacles and publishes driving commands, to which
          the motor controller subscribes. Every attachment now connects a component to a topic; no
          component calls another directly.
        pause_after: 2.5
        step: Both roles, many topics
        note: A program may publish and subscribe; programs never connect directly.
        source: >-
          Clements et al. 2010, Table 4.5 (a component may be both a publisher and a subscriber);
          Fairbanks 2010, section 14.11.
        visual: >-
          Mochi as a chain, in a C&C view whose key reads component, «topic» connector, and publish,
          deliver. The Camera driver publishes into the /camera/image topic, and the Obstacle
          detector, the Logger, and the Dashboard are attached below it as subscribers. The detector
          publishes into /obstacles, which the Planner subscribes to; the Planner publishes into
          /cmd_vel, which the Motor controller subscribes to. Every attachment runs between a
          component's port and a topic's channel. Callouts read Topic to component and, in red, No direct
          calls.
  - id: ignorance
    part: Rules
    outline: Ignorance
    label: "Rules: neither side knows the other"
    title: Rules one and two, mutual ignorance
    purpose: Learn the two ignorance rules, and how they set the style apart from the Observer pattern.
    takeaway: >-
      Publishers don't rely on who listens, subscribers don't rely on who published, and only the
      topic connects them.
    cues:
      - id: publisher_rule
        say: >-
          Four rules give the style its power, and each exists for a reason. Rule one, publisher
          ignorance: a publisher must not rely on the presence or identity of any subscriber. The
          camera behaves identically whether five components listen or none. Consequently,
          subscribers can be added or removed without modifying the publisher.
        step: "Rule 1: publisher ignorance"
        note: A publisher must not rely on whether, or which, subscribers exist.
        source: >-
          CS 130 lecture 17, slide 23 (Publisher Ignorance); Bass et al. 2013, section 13.2 (the
          correctness of the producer cannot depend on the recipients).
        visual: >-
          Rule card 1, Publisher ignorance: don't rely on who listens, or whether anyone does. Below
          it, a C&C view frame shows the same publisher twice: under Five subscribers, the Camera
          driver publishes into /camera/image with five small subscriber components attached; under
          No subscribers, the same camera publishes into the same topic, and a label reads Nobody
          subscribed. A green sticker reads Same camera code in both.
      - id: subscriber_rule
        say: >-
          Rule two, subscriber ignorance: a subscriber must not rely on the identity of the
          publisher. The planner subscribes to obstacles, not to the detector. The rule exists so
          that publishers remain replaceable: when the team substitutes a laser-based detector that
          publishes the same obstacles topic, the planner is unaffected.
        step: "Rule 2: subscriber ignorance"
        note: Subscribers depend on the event, not on which program sent it.
        source: >-
          CS 130 lecture 17, slide 23 (Subscriber Ignorance: they subscribe to the event, not the
          source); Fairbanks 2010, section 14.11.
        visual: >-
          Rule card 2, Subscriber ignorance: subscribe to the event, not to its source, joins Rule
          card 1. In a C&C view frame, the Camera detector component, which publishes into
          /obstacles, leaves, and a Laser detector slides into its place, marked Same topic. Below
          the topic, the Planner, labeled Subscribes to: /obstacles, turns green: Nothing changed. A
          green label reads Publishers stay replaceable.
      - id: observer
        say: >-
          The Observer pattern resembles this, with one important difference. Observer operates
          between objects within one program: the subject keeps its own list of observers and calls
          each one. In publish-subscribe, neither side holds a reference to the other. The topic
          maintains the list, and it may even run in another process or on another machine.
        pause_after: 2.5
        step: Not quite Observer
        note: In Observer the subject holds its observers; here only the topic does.
        source: >-
          Buschmann, Henney, and Schmidt 2007 (POSA5), p. 68 (Observer implemented with
          publisher-subscriber middleware decouples the subject completely); Buschmann et al. 1996,
          p. 341 (Event Channel variant).
        visual: >-
          Two frames side by side. Observer pattern, a C&C view with a key reading object and
          call: the object subject: Subject keeps observers = [a, b, c] and notify(), and call
          arrows run straight from it to three objects, a, b, and c: Observer, labeled The subject
          calls each one. Publish-subscribe, a C&C view: a Publisher component over the «topic»
          channel events, over a Subscriber component, each attached only to the topic, with a
          callout under the channel: Keeps the list. A sticker reads No reference either way.
  - id: one_way
    part: Rules
    outline: One way
    label: "Rules: one way, no waiting"
    title: Rules three and four, one way and asynchronous
    purpose: Learn why publishing returns no answer and never blocks.
    takeaway: >-
      Events flow one way with no return value, and publishing never waits; a slow subscriber only
      falls behind in its own queue.
    cues:
      - id: no_return
        say: >-
          Rule three, one-way propagation: information flows from publisher to subscriber and never
          back, so publishing returns no value. The rule exists because a publisher that awaited an
          answer would again depend on its subscribers. The camera cannot ask whether anyone saw an
          obstacle; any answer travels as a new event on another topic.
        step: "Rule 3: one way"
        note: Publishing returns nothing; any answer is a new event on another topic.
        source: CS 130 lecture 17, slide 23 (One-Way Propagation; there are no return values).
        visual: >-
          Rule card 3, One-way propagation: no return values; information flows only to subscribers.
          In a C&C view frame, the Camera driver asks in a speech bubble, Did anyone see an
          obstacle?, a red cross appears, and a sticker reads No reply channel. The Obstacle
          detector, marked Publishes what it found, sends its finding as a new event into the
          /obstacles topic.
      - id: async
        say: >-
          Rule four, asynchronous publishing: a publisher never blocks. Publishing places a copy of
          the frame in each subscriber's queue and returns immediately, so no subscriber can delay
          the publisher. Each subscriber drains its own queue at its own pace, while the camera
          continues at thirty frames a second.
        step: "Rule 4: asynchronous"
        note: Publishing returns at once; each subscriber drains its own queue.
        source: >-
          CS 130 lecture 17, slide 23 (Asynchronous: the sender does not block); CMU 17-655 lecture
          11, Message Passing (asynchronous messages require buffering).
        visual: >-
          Rule card 4, Asynchronous: the publisher never waits; publish() returns at once. In a C&C
          view frame, the Camera driver, 30 frames a second, publishes into /camera/image, and
          frames flow to three subscriber components: Detector, Logger, and Dashboard. Each has a
          queue of ten slots that fills and drains at its own pace, the dashboard's the fullest. A
          callout beside the camera reads publish() returns.
      - id: predict_hang
        say: >-
          Now replay last week's disaster. The dashboard's server hangs again, and its callback
          stops returning. Predict: what happens to Mochi this time? And what happens to the frames
          meant for the dashboard?
        prediction: true
        pause_after: 4
        step: Predict the hang
        note: The dashboard hangs again. What happens to Mochi, and to its frames?
        visual: >-
          The Dashboard component turns grey: Not responding, and its queue starts to climb. A strip
          of the main walkway shows Mochi, and a dashed box asks: Freeze again?
      - id: hurts_itself
        say: >-
          Mochi keeps moving. The camera still publishes, and the detector still receives every
          frame. Only the dashboard falls behind. Its queue holds ten frames; when it is full, the
          oldest frames are dropped. Because publishing is asynchronous, a slow subscriber now harms
          no component but itself.
        pause_after: 2.5
        step: A slow subscriber hurts itself
        note: The full queue drops its oldest frames; other subscribers are unaffected.
        source: >-
          CS 130 lecture 17, slide 18 (queue size 10 in nh.subscribe); ROS subscriber queues discard
          the oldest messages when full.
        visual: >-
          On the walkway strip, Mochi drives on. The Detector's and the Logger's queues keep
          draining, while the Dashboard's queue fills all ten slots, and a red label reads Full:
          oldest dropped. A green sticker reads Slow subscriber hurts only itself.
  - id: buys
    part: Consequences
    outline: What it buys
    label: "Consequences: what the rules buy"
    title: Add, swap, and plug in while it runs
    purpose: Connect each benefit of the style to the rule that produces it.
    takeaway: >-
      Publisher ignorance makes adding subscribers free, subscriber ignorance makes swapping
      publishers free, and connections can change while the system runs.
    cues:
      - id: extensibility
        say: >-
          Now the consequences, each traceable to a rule. First, extensibility. Campus planning's
          counter, a battery monitor, and the research lab's recorder each simply subscribe. Because
          of publisher ignorance, adding a subscriber requires no change to any publisher.
        step: Extensibility
        note: New subscribers join without any change to publishers.
        source: >-
          CS 130 lecture 17, slide 22 (easier to add new publishers and subscribers:
          extensibility); Fairbanks 2010, section 14.11.
        visual: >-
          A quality card reads Extensibility, promoted, wired to Rule card 1, Publisher ignorance.
          In a C&C view frame, the Camera driver publishes into /camera/image and a Battery sensor
          into /battery. New subscriber components drop in under the topics one after another, each
          marked Just subscribes: Pedestrian counter, Research recorder, and Battery monitor. A
          green sticker reads Publishers: 0 lines changed.
      - id: late_binding
        say: >-
          Second, run-time flexibility. Since publishers do not rely on who is listening,
          connections can be established late, while the robot runs. When an operator opens the
          dashboard, it subscribes to the camera topic; when the operator closes it, it
          unsubscribes. The recorder joins only during experiments, and Mochi never restarts.
        step: Run-time flexibility
        note: Programs subscribe and unsubscribe while the system runs.
        source: >-
          CS 130 lecture 17, slide 22 (components can dynamically subscribe and unsubscribe: run-time
          flexibility); CS 130 lecture 15, slide 26 (flexible connection via late binding).
        visual: >-
          A quality card reads Run-time flexibility, promoted, beside a clock that runs through an
          afternoon, from 1:00 p.m. to 4:40 p.m., and Rule card 1. In a C&C view frame, the Camera
          driver publishes into /camera/image. Below the topic, the Operator dashboard switches from
          Not subscribed to Subscribed, attached to the topic, when an operator opens it, and to
          Unsubscribed when it closes; the Research recorder switches to Subscribed for an
          experiment.
      - id: swap
        say: >-
          Third, replaceability and fault isolation. Because of subscriber ignorance, any publisher
          can be replaced by one that sends the same events, such as the laser detector. And because
          publishing never waits, a slow or crashed subscriber cannot stall the others. Each benefit
          follows directly from one of the four rules.
        pause_after: 2.5
        step: Each benefit has a rule behind it
        note: Add subscribers, swap publishers, isolate slow subscribers, each thanks to a rule.
        source: >-
          CMU 17-655 lecture 11, Quality Attribute Considerations 3 (modifiability promoted since
          elements work independently); CS 130 lecture 16, slide 19 notes (the constraints give the
          style its power).
        visual: >-
          A card titled Each benefit follows from a rule lists Add subscribers freely: Rule 1,
          publisher ignorance; Replace publishers freely: Rule 2, subscriber ignorance; and A slow
          subscriber can't stall others: Rule 4, asynchronous. Below, in a C&C view frame, the Laser
          detector is marked Swapped in, same events, and the Operator dashboard is marked Crashed:
          no one stalls. A banner reads Rule of the style: The benefits come from the rules.
  - id: nobody_listens
    part: Consequences
    outline: Nobody listening
    label: "Consequences: nobody's listening"
    title: The bug that compiles
    purpose: See how the style trades robustness for decoupling.
    takeaway: >-
      Programs still share topic names and event formats, and a publisher never learns whether
      anyone received its event, so a renamed topic fails in silence.
    cues:
      - id: rename
        say: >-
          The same rules also impose costs. A teammate renames a topic: the detector now publishes
          to obstacles instead of obstacle list, but the planner still subscribes to the old name.
          Everything compiles, and every component starts. Read in isolation, each file looks
          correct, and the change is approved.
        step: A tidy rename
        note: The publisher's topic is renamed; the subscriber keeps the old name.
        source: >-
          CS 130 lecture 17, slides 19 and 20 (a real bug from an open-source self-driving framework:
          an inconsistent topic rename).
        visual: >-
          A diff card, detector.py, tidy names, changes advertise("/obstacle_list") to
          advertise("/obstacles"). Green readouts say Code review: Approved, Build: Compiles, and
          Launch: Starts. In a C&C view frame, the Obstacle detector publishes into a lit /obstacles
          topic, while the Planner, marked Subscribes: /obstacle_list, stays attached to the old
          topic, now empty.
      - id: predict_rename
        say: >-
          So predict. On the next delivery, a skateboarder cuts across Mochi's path, and the
          detector spots the board right away. What does the planner do about it? And which of
          Mochi's programs reports an error?
        prediction: true
        pause_after: 4
        step: Predict the delivery
        note: A skateboarder cuts across. What does the planner do? What reports an error?
        visual: >-
          The detector reads Found: skateboard, and an event token travels into /obstacles. A
          walkway strip shows Mochi with a skateboarder ahead. Dashed boxes ask Planner? and Errors?
      - id: silent
        say: >-
          The planner does nothing: it never learns of the skateboard. And no component reports an
          error. The detector publishes into a topic that nobody reads, and by publisher ignorance,
          it cannot detect this. Only the safety bumper stops Mochi. A renamed topic of this kind
          remained hidden for two months in a popular self-driving framework.
        step: Silent failure
        note: Events sent to a topic no one reads vanish without any error.
        source: >-
          CS 130 lecture 17, slides 19 and 20 and their notes (the bug stayed in the repository for
          two months; the topic implementation was functionally correct).
        visual: >-
          The event sits in /obstacles with no subscriber, and a red sticker reads Nobody's
          listening. The Planner reads Hears nothing: goes straight. On the walkway, Mochi rolls
          toward the skateboarder, and readouts say Error log: 0 errors and Bumper: Stop!
      - id: robustness
        say: >-
          What still couples the components? Each topic's name, and its events' format and meaning;
          change one, and every subscriber must follow or quietly fail. That is the cost to
          robustness: a direct call fails loudly when its receiver is missing, but under publisher
          ignorance and one-way propagation, a publisher never learns who received an event.
        pause_after: 2.5
        step: What still couples them
        note: Topic names and event formats and meanings are the shared contract; delivery is never confirmed.
        source: >-
          CS 130 lecture 17, slide 22 (direct communication: the sender can detect if the listener is
          not available); Fairbanks 2010, section 14.11 (publishers and subscribers define the event
          vocabulary); CMU 17-655 lecture 11 (changing event types or semantics affects many
          elements).
        visual: >-
          A card titled What still couples them lists Topic name: /obstacles, Event format:
          Obstacle(x, y, kind), and Event meaning: x and y in meters. A quality card reads
          Robustness, inhibited, labeled From Rules 1 and 3. Two C&C view frames compare: direct
          call, where a Sender calls a Receiver that is down and the readout says Receiver missing:
          Call failed: error; and publish, where a Publisher publishes into an empty topic, events,
          and the readout says No subscriber: Delivered to 0, no error.
  - id: who_talks
    part: Consequences
    outline: Who talks to whom
    label: "Consequences: harder to follow"
    title: Who talks to whom?
    purpose: See why publish-subscribe systems are harder to understand, test, and time.
    takeaway: >-
      The flow of events is spread across subscriptions, notification order isn't fixed, and the
      extra hop adds latency; teams make the flow visible again on purpose.
    cues:
      - id: scattered
        say: >-
          The second cost is understandability, the flip side of publisher and subscriber ignorance.
          The camera's old loop listed every receiver in one place. Now, to determine who receives
          frames, one must search every component for the topic's name. A diagram of boxes on one
          bus shows only that any component might communicate with any other.
        step: Understandability
        note: Who receives an event is spread across every program's subscriptions.
        source: >-
          CS 130 lecture 17, slide 22 (direct communication is easier to understand); Fairbanks 2010,
          section 14.11 (a diagram of components on one bus hides who talks to whom).
        visual: >-
          A search panel queries /camera/image and finds 5 programs subscribe: detector.py,
          logger.py, dashboard.py, counter.py, and recorder.py. Beside it, a C&C view frame with a
          key reading component and topic shows six components, Camera, Detector, Planner, Logger,
          Counter, and Motor, all attached to one topic, events, three above and three below, and a
          sticker asks Who talks to whom? Rule card 1 sits above a quality card: Understandability,
          inhibited.
      - id: order
        say: >-
          Asynchronous publishing also complicates reasoning about timing. When several subscribers
          receive the same event, the order of notification is not fixed, and each queue drains at
          its own pace. A test that passes today may fail tomorrow, so teams trace events at run
          time to observe what actually happened.
        step: No fixed order
        note: Notification order isn't fixed, so tests and timing are harder to reason about.
        source: >-
          CMU 17-655 lecture 11 (the order of notification is non-deterministic; tracing events from
          announcement to receipt can be difficult).
        visual: >-
          Rule card 4, Asynchronous. Two cards list the order in which subscribers got the same
          event: Run 1, Logger, Planner, Dashboard; Run 2, Planner, Dashboard, Logger. Readouts say
          Today: Test passed and Tomorrow: Test failed. An Event trace lists each delivery with its
          time: frame 812 published, then received by the Planner, then by the Logger.
      - id: visible
        say: >-
          Teams therefore restore the visibility of the flow. They design topic names and event
          formats early, as carefully as any interface. They maintain a list of the publishers and
          subscribers of each topic. And they test publishers and subscribers together, not only
          each file in isolation.
        step: Make the flow visible
        note: Design topics early, keep a topic list, and test programs together.
        source: >-
          CMU 17-655 lecture 11, Event Binding and Structure (event structure must be designed early
          because changing it after implementation is costly).
        visual: >-
          A card titled Topic list: who publishes, who subscribes lists /camera/image: Camera driver
          to Detector, Logger, Dashboard, and Counter; /obstacles: Detector to Planner; and
          /cmd_vel: Planner to Motor controller. A checklist, Make the flow visible, ticks off
          Design names and formats early, Keep the topic list current, and Test programs together,
          and a readout says Detector + Planner: Integration test passed.
      - id: latency
        say: >-
          Third, latency. Every message takes a detour through the connector's infrastructure, which
          adds delay compared with a direct call. If that infrastructure is a single central broker,
          it also becomes a single point of failure: when it fails, every conversation stops at
          once.
        pause_after: 2.5
        step: Latency and a single point of failure
        note: The extra hop adds latency; one central broker can fail for everyone.
        source: >-
          Bass et al. 2013, section 13.2 (publish-subscribe adds a layer of indirection and latency;
          a failed connector is a single point of failure).
        visual: >-
          A C&C view frame with a key reading component and connector. The Camera driver and the
          Obstacle detector are joined by a short connector labeled «call». A longer path runs down
          through a Broker component and back up, labeled + latency, and a quality card reads
          Latency, inhibited. The Broker turns grey, marked Down, with the sticker Single point of
          failure and the label Broker down: every topic stops.
  - id: when
    part: Consequences
    outline: Publish or call?
    label: "Consequences: when to publish, when to call"
    title: Facts to publish, requests to call
    purpose: Decide when publish-subscribe fits, and when a direct call is the better choice.
    takeaway: >-
      Publish facts that many programs may want; call directly when the sender needs an answer or a
      guarantee. Real systems use both.
    cues:
      - id: brake
        say: >-
          When, then, should a component not publish? When the sender requires an answer or a
          guarantee of completion. Consider the emergency stop. If the safety monitor merely
          published brake now and nobody received it, Mochi would keep moving. That command is
          therefore a direct call, which fails loudly if the motor controller is unavailable.
        step: The brake is a call
        note: Commands that need a guarantee go as direct calls, which fail loudly.
        source: >-
          Bass et al. 2013, section 13.2 (delivery is not guaranteed because the sender cannot know
          if a receiver is listening; unsuitable for hard real-time deadlines).
        visual: >-
          A C&C view frame with a key reading component, topic, and call. A Safety monitor component
          reads Brake now! A dashed red attachment sends it toward a /brake topic, labeled Did
          anyone hear it?, and a red cross stops it. Instead, a green «call» connector joins the
          Safety monitor directly to the Motor controller, shown in code as motor.stop(), which
          waits for a reply, and the controller answers Reply: stopped. A sticker reads Needs a
          guarantee: call directly.
      - id: rule_of_thumb
        say: >-
          A useful rule of thumb follows. Publish facts that many components may want, such as a new
          camera frame, the battery level, or arrival at a building. Call directly for requests that
          require a reply or a guarantee, such as stopping the motors or charging a card. Most real
          systems, Mochi included, combine both.
        step: Facts or requests
        note: Publish facts many may want; call for requests needing a reply or guarantee.
        source: >-
          Clements et al. 2010, section 4.4.1 (implicit invocation is often combined with
          call-return); CS 130 lecture 17, slide 22.
        visual: >-
          Two cards. Publish: facts, listing New camera frame, Battery level, and Arrived at a
          building. Call: requests, listing Stop the motors and Charge the card. A banner reads Rule
          of thumb: Facts many may want: publish. Requests that need an answer: call.
      - id: frameworks
        say: >-
          In practice, the infrastructure is rarely built from scratch. Robot middleware, messaging
          protocols for small devices, and event-streaming platforms all implement this style, with
          its trade-offs built in. Selecting one means accepting extensibility and flexibility,
          together with the costs to robustness and understandability that accompany them.
        pause_after: 2.5
        step: Frameworks package the trade-off
        note: Adopting a publish-subscribe framework adopts the style's trade-offs.
        source: >-
          CS 130 lecture 17, slide 24 (DDS in ROS 2, MQTT for resource-constrained IoT devices,
          Apache Kafka for high-throughput event streaming).
        visual: >-
          Three cards: Robot middleware, DDS, used in ROS 2; Tiny-device messaging, MQTT; and Event
          streaming, Apache Kafka. Below them, a quality card reads Extensibility, run-time
          flexibility, promoted, and another reads Robustness, understandability, inhibited. A
          sticker reads Pick a framework, pick its trade-off.
  - id: in_practice
    part: In practice
    outline: Real-world examples
    label: "In practice: where events flow"
    title: Real-world examples
    purpose: Recognize publish-subscribe in systems from many domains, and explain why the style fits them.
    takeaway: >-
      Publish-subscribe fits systems whose consumers come and go without changing the producers;
      each pays for the missing delivery receipt in its own way.
    cues:
      - id: phone_chat
        say: >-
          Publish-subscribe runs much of the software you use every day. When you switch on airplane
          mode, Android publishes one broadcast, and every app that registered for it reacts, though
          the code that sends it never names those apps. When you post in Slack, a channel server
          pushes the message to every subscribed gateway.
        step: Phones and chat
        note: Android broadcasts reach unknown apps; Slack fans each message out to subscribed gateways.
        source: >-
          Android broadcasts overview,
          https://developer.android.com/develop/background-work/background-tasks/broadcasts (similar
          to the publish-subscribe design pattern; the system routes each broadcast to the apps
          subscribed to it; airplane mode as the example; normal broadcasts reach receivers in an
          undefined order); Android ConnectivityService,
          https://android.googlesource.com/platform/packages/modules/Connectivity/+/refs/heads/main/service/src/com/android/server/ConnectivityService.java
          (setAirplaneMode sends one ACTION_AIRPLANE_MODE_CHANGED intent to all users, naming no
          receiver); implicit broadcast exceptions,
          https://developer.android.com/develop/background-work/background-tasks/broadcasts/broadcast-exceptions
          (airplane mode is not exempt, so current apps register for it at run time); Slack
          Engineering, Real-time Messaging, April 2023,
          https://slack.engineering/real-time-messaging/ (a message goes through the web app to the
          channel server, which sends it to every gateway server subscribed to the channel, in
          several regions; each gateway pushes it to its connected clients).
        visual: >-
          Two C&C view frames, each with a key reading component, topic, and event. Android, phones:
          the Connectivity service publishes to the topic AIRPLANE_MODE, delivered to Messaging app,
          Music app, and Navigation app, labeled Rule 1: no idea who listens. Slack, team chat: the
          Slack web app publishes to the topic #cs130, delivered to gateways in the US, Europe, and
          Asia, labeled Channel server fans out to gateways.
      - id: games_feeds
        say: >-
          Game servers in Roblox publish announcements to topics that subscribed servers usually
          hear within a second or two, although delivery is explicitly not guaranteed. At LinkedIn,
          clicks and page views become events on Kafka topics, and new teams consume them without
          changing the website, even replaying events from days earlier.
        step: Games and social networks
        note: Roblox servers share best-effort announcements; LinkedIn teams consume and replay Kafka events.
        source: >-
          Roblox MessagingService,
          https://create.roblox.com/docs/reference/engine/classes/MessagingService (PublishAsync and
          SubscribeAsync on developer-defined topics; delivery is typically within one to two
          seconds; delivery is best effort and not guaranteed); Roblox cross-server messaging,
          https://create.roblox.com/docs/cloud-services/cross-server-messaging (global announcements
          as a use case); Kreps, Narkhede, and Rao 2011, NetDB,
          https://people.csail.mit.edu/matei/courses/2015/6.S897/readings/kafka.pdf (activity events
          such as page views and clicks, published by the front-end services; consumers can rewind
          to an old offset and re-consume data, kept typically seven days); Goodhope et al. 2012,
          IEEE Data Engineering Bulletin, http://sites.computer.org/debull/A12june/pipeline.pdf
          (Kafka is a publish/subscribe system; adding subscribers costs very little; most real-time
          consumers were built by other teams); Kreps 2013, The Log,
          https://www.linkedin.com/blog/engineering/distributed-systems/log-what-every-software-engineer-should-know-about-real-time-datas-unifying
          (the producing page knows none of its consumers, which can be added without changing it).
        visual: >-
          Two C&C view frames. Roblox, games: Game server 1 publishes to the topic Announcements,
          delivered to game servers 2, 3, and 4, labeled in red Best effort: no guarantee. Kafka at
          LinkedIn: Front-end services publish to the topic page views, delivered to Live services,
          Hadoop and the warehouse, and A new team, labeled New teams, no producer change.
      - id: home_grid
        say: >-
          In smart homes, a temperature sensor publishes its readings over MQTT, and a dashboard, a
          heating automation, and a logger subscribe without the sensor knowing them. In power
          substations, protection relays publish trip messages that other relays receive within
          milliseconds; since nobody acknowledges them, each relay keeps repeating its message.
        step: Homes and power grids
        note: Smart-home tools subscribe to sensor topics; substation relays repeat unacknowledged trip messages.
        source: >-
          OASIS MQTT 5.0, https://docs.oasis-open.org/mqtt/mqtt/v5.0/os/mqtt-v5.0-os.html (a
          client-server publish/subscribe messaging transport; section 3.3.4, the server sends each
          message to every client whose subscription matches); Home Assistant MQTT sensor,
          https://www.home-assistant.io/integrations/sensor.mqtt/ (a sensor publishes its
          temperature to a topic); Zigbee2MQTT,
          https://www.zigbee2mqtt.io/guide/usage/mqtt_topics_and_messages.html (a bridge publishes
          each Zigbee device's state to its own topic); IEC 61850-7-2 Ed. 2.0 preview,
          https://ocp-api.iec.ch/api/publications/6015/view?hasAccess=false&language=en&previewLanguage=en&media=PDF
          (fast event distribution from one device to many, publisher/subscriber); Dolezilek et al.
          2017, SEL, https://selinc.com/api/download/119752 (transfer time class TT6, 3 ms, for
          trips and blockings); Loenders, Beerten, and Van Hertem 2018,
          https://lirias.kuleuven.be/retrieve/515363 (GOOSE: no acknowledgement, no guaranteed
          delivery; repetition at growing intervals instead); Bhamare, ABB,
          https://library.e.abb.com/public/dc853877595c4086ae649ca29924c0ec/Paper_GOOSE%20Utilisation%20in%20Protection.pdf
          (repetition slows to a heartbeat; a subscriber that hears nothing for about two heartbeat
          intervals raises an alarm).
        visual: >-
          Two C&C view frames. MQTT, smart homes: a Temperature sensor publishes to the topic
          living_room/temperature, delivered to Dashboard, Heating automation, and Data logger,
          labeled One subscription per new tool. IEC 61850, power grid: a Protection relay publishes
          to the topic trip (multicast), delivered to relays A, B, and C, labeled in red No ack:
          repeat, then heartbeat.
      - id: common_thread
        say: >-
          Most of these systems need what publisher and subscriber ignorance provide: consumers that
          come and go without any change to the producers. Each also pays for publisher ignorance
          and one-way propagation, since no publisher learns who received an event; Roblox accepts
          the loss, LinkedIn keeps a replayable log, and substations repeat every message.
        pause_after: 2.5
        step: What they share
        note: Rules 1 and 2 let consumers change freely; missing receipts are handled in different ways.
        source: >-
          Roblox MessagingService (best effort, not guaranteed); Kreps, Narkhede, and Rao 2011
          (consumers rewind offsets to re-consume data; a producer's acknowledgements come from
          brokers, not consumers); Loenders, Beerten, and Van Hertem 2018 and Bhamare, ABB (repeated
          GOOSE messages and heartbeats); MQTT 5.0 (a server may tell a publisher that nobody
          subscribed, but never who did).
        visual: >-
          Rule cards 1 and 2 sit over a card titled Consumers come and go, listing Android apps,
          Slack gateways, LinkedIn teams, and smart-home tools. Rule cards 1 and 3 sit over a pink
          card titled No receipt: three answers: Roblox: accept the loss; LinkedIn: a replayable
          log; Substations: repeat it.
  - id: summary
    label: Summary
    title: Announce, don't call
    purpose: Recall the problem, the parts, the four rules, and the trade-offs.
    takeaway: >-
      A topic between publishers and subscribers, plus four rules, buys extensibility and run-time
      flexibility at the price of robustness and understandability.
    cues:
      - id: recap_problem
        say: >-
          Let's recap. Mochi's camera once called every listener by name, so each new listener meant
          editing the camera, and one slow listener froze the robot. Publish-subscribe places a
          topic, a connector, between the components: publishers announce events to it, and the
          infrastructure delivers them to every subscriber's queue.
        step: The problem and the parts
        note: Direct calls couple senders to receivers; a topic sits between them instead.
        visual: >-
          Two frames. Before: direct calls, with the camera.py loop calling every listener and two
          red labels, Each new listener: edit the camera, and One slow listener: the robot froze.
          After: a C&C view, where the Camera driver publishes into the /camera/image topic and four
          subscriber components, Detector, Logger, Dashboard, and Counter, are each attached below
          it.
      - id: recap_rules
        say: >-
          Four rules give the style its power: publishers do not rely on who listens, subscribers do
          not rely on who published, information flows one way, and publishing never waits. The
          ignorance rules promote extensibility and replaceability, even while the system runs.
          One-way, asynchronous publishing promotes fault isolation: a slow subscriber cannot stall
          the rest.
        step: Four rules
        note: Publisher ignorance, subscriber ignorance, one way, and asynchronous.
        visual: >-
          Four rule cards line up: Rule 1, Publisher ignorance; Rule 2, Subscriber ignorance; Rule
          3, One-way propagation; and Rule 4, Asynchronous. Brackets read Rules 1 and 2 and Rules 3
          and 4, and promoted quality cards sit under the rules they follow from: Extensibility and
          Replaceability under Rules 1 and 2, Fault isolation under Rules 3 and 4. A sticker reads
          Add, swap, and plug in while it runs.
      - id: recap_costs
        say: >-
          The same rules inhibit three qualities. Robustness: nobody confirms delivery, so a renamed
          topic fails silently. Understandability: to find who receives an event, one must search
          every component. Latency: every event passes through the infrastructure, which adds delay.
        step: What it costs
        note: It inhibits robustness, understandability, and latency.
        visual: >-
          A balance with two pans in the quality cards' colors, each quality with the rule it
          follows from and why. The green Promoted pan lists Extensibility, Rule 1: add a
          subscriber, change no publisher; Replaceability, Rule 2: swap a publisher that sends the
          same events; and Fault isolation, Rules 3, 4: a slow subscriber stalls no one else. The
          pink Inhibited pan fills: Robustness, Rules 1, 3: nobody confirms delivery;
          Understandability, Rules 1, 2: finding receivers means searching every component; and
          Latency: every event passes through the infrastructure.
      - id: recap_choice
        say: >-
          So choose per message. Publish facts that many components may want; call directly when you
          need an answer or a guarantee. Next time you write a call, ask who is listening, and
          whether you need to know.
        pause_after: 2.5
        step: Choose per message
        note: Publish facts that many may want; call when you need an answer.
        visual: >-
          A banner reads Choose per message: publish facts, call when you need an answer or a
          guarantee. Two cards from earlier return: Publish: facts, listing New camera frame,
          Battery level, and Arrived at a building; and Call: requests, listing Stop the motors and
          Charge the card. A last sticker asks Who's listening, and do you need to know?
