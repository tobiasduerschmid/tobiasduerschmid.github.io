        note: Start early. Build the static front end and practice database queries separately.
  - id: growth-mindset-the-foundation-for-desirable-difficulties
    label: Growth mindset
    title: 'Growth Mindset: The Foundation for Desirable Difficulties'
    part: Put it to work
    purpose: What does a struggle mean?
    takeaway: Add “yet” when you get stuck, then adjust your strategy or ask for help.
    cues:
      - id: p01
        say: 'Growth Mindset: The Foundation for Desirable Difficulties'
        pause_after: 0.55
        step: A fixed mindset treats struggle as a limit
        visual: >-
          A difficult concept appears next to the thought I’m not smart enough, illustrating the
          fixed-mindset interpretation of a setback.
        note: A fixed mindset interprets struggle as evidence of an unchangeable limit on ability.
      - id: p02
        say: >-
          Adopting all of the strategies listed above is nearly impossible if you operate with a
          “fixed mindset”—the belief that your intelligence and abilities are static traits you
          are simply born with.
        pause_after: 0.25
        step: A fixed mindset treats struggle as a limit
        visual: >-
          A difficult concept appears next to the thought I’m not smart enough, illustrating the
          fixed-mindset interpretation of a setback.
        note: A fixed mindset interprets struggle as evidence of an unchangeable limit on ability.
      - id: p03
        say: >-
          If you have a fixed mindset, struggling with a new concept feels like terrifying proof
          that you just aren’t smart enough.
        pause_after: 0.25
        step: A fixed mindset treats struggle as a limit
        visual: >-
          A difficult concept appears next to the thought I’m not smart enough, illustrating the
          fixed-mindset interpretation of a setback.
        note: A fixed mindset interprets struggle as evidence of an unchangeable limit on ability.
      - id: p04
        say: >-
          However, decades of psychological research demonstrate that a “growth mindset” is far
          more accurate: your brain is highly plastic, and intellectual abilities are absolutely
          developed through effort, strategic practice, and perseverance.
        pause_after: 0.25
        step: Abilities grow with strategic practice
        visual: >-
          A brain labeled Growth mindset is followed by a practice checklist and a staircase for
          progress through strategic effort and perseverance.
        note: A growth mindset treats effort, strategy and perseverance as ways to develop ability.
      - id: p05
        say: >-
          To effectively use desirable difficulties, you have to let go of the need for learning
          to feel “easy” and instead recognize that mental friction is the physical sensation of
          your brain growing stronger.
        pause_after: 0.52
        step: Abilities grow with strategic practice
        visual: >-
          A brain labeled Growth mindset is followed by a practice checklist and a staircase for
          progress through strategic effort and perseverance.
        note: A growth mindset treats effort, strategy and perseverance as ways to develop ability.
      - id: p06
        say: >-
          Actionable Advice: Pay attention to your internal monologue and add the word “yet”.
          Change “I don’t understand this” to “I don’t understand this yet”. When you hit a
          roadblock, do not view it as a limit of your natural ability.
        pause_after: 0.25
        step: “Yet” leaves room to change strategies
        visual: >-
          The word yet joins the thought I don’t understand this in one speech bubble.
        note: Add ‘yet’ to the thought ‘I don’t understand this,’ then choose a next step.
      - id: p07
        say: >-
          View it as a cue that you need to adjust your study strategies, increase your effort,
          or seek out office hours. If you’ve done well in a class, don’t assume you’re a
          “natural” at the subject.
        pause_after: 0.25
        step: “Yet” leaves room to change strategies
        visual: >-
          The sentence I don’t understand this yet branches to two next steps: Adjust your
          strategy and Ask for help.
        note: Add ‘yet’ to the thought ‘I don’t understand this,’ then choose a next step.
      - id: p08
        say: >-
          Instead, recognize that your success is the result of effective strategies and
          consistent effort, which you can replicate in more challenging courses. And if you
          struggle too much, don’t be afraid to ask for help and visit office hours or email
          your instructor(s).
        pause_after: 0.25
        step: You can reuse successful strategies
        visual: >-
          A checklist captures the strategies that worked, and an office-hours conversation
          begins with what you tried and where you are stuck.
        note: Reuse strategies that helped in earlier courses.
      - id: p09
        say: >-
          All of them are always willing to help, especially if you let them know how hard
          you’ve tried already.
        pause_after: 0.52
        step: You can reuse successful strategies
        visual: >-
          A checklist captures the strategies that worked, and an office-hours conversation
          begins with what you tried and where you are stuck.
        note: When asking for help, share what you’ve tried so far.
      - id: p10
        say: >-
          Computer Science Examples: There is a pervasive and toxic myth in software engineering
          that some people are just naturally born with a “coding gene”. This is entirely false.
        pause_after: 0.25
        step: Coding ability develops with practice
        visual: >-
          A laptop labeled Learning to code is joined by two debugging setbacks that can make
          learners doubt their ability: a C program’s segfault and a messy Git rebase.
        note: >-
          Setbacks such as segfaults and difficult rebases are common experiences while learning
          to program.
      - id: p11
        say: >-
          When your C program segfaults for the fiftieth time, or you are trying to untangle a
          messy git rebase, it is easy to feel like an imposter. A fixed mindset tells you to
          give up because you aren’t cut out for computer science.
        pause_after: 0.25
        step: Coding ability develops with practice
        visual: >-
          A laptop labeled Learning to code is joined by two debugging setbacks that can make
          learners doubt their ability: a C program’s segfault and a messy Git rebase.
        note: >-
          Setbacks such as segfaults and difficult rebases are common experiences while learning
          to program.
      - id: p12
        say: >-
          A growth mindset reminds you that every single expert developer started exactly where
          you are. Bugs and compiler errors are not indictments of your intelligence. They are
          simply the mechanism by which you build mastery.
        pause_after: 0.25
        step: Debugging practice builds mastery
        visual: >-
          A compiler error leads to another debugging attempt and to asking for help when the
          learner needs it.
        note: Use bugs and compiler errors as opportunities to practice. Seek help along the way.
      - id: p13
        say: >-
          You are entirely capable of conquering these complex systems, provided you embrace the
          resilient, effortful struggle required to learn them and you are not afraid to ask for
          help when you need it.
        pause_after: 0.85
        step: Debugging practice builds mastery
        visual: >-
          A compiler error leads to another debugging attempt and to asking for help when the
          learner needs it.
        note: Use bugs and compiler errors as opportunities to practice. Seek help along the way.
