        pause_after: 0.25
        step: Separate practice makes integration easier
        visual: The connected app stays visible while the reminder Practice after class appears.
        note: Integrate the app once the component skills are familiar.
      - id: p15
        say: >-
          When a skill is getting too complex for you to handle, you have to break it down into
          smaller, manageable sub-goals to be studied individually.
        pause_after: 0.85
        step: Separate practice makes integration easier
        visual: >-
          Separate practice tasks sit above the working note-saving flow. A reminder tells you
