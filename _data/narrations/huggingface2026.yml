# Edit speech and teaching text here. Visual state lives in ../narration_visuals/huggingface2026.json.
# Text only: there is deliberately no media block yet. To add narration audio, add media paths under
# /assets/ and render with scripts/render-explainer-narration.py --topic huggingface2026.
version: 1
id: huggingface2026
kind: case-study
title: "Hugging Face 2026: from a test sandbox to cluster administrator"
description: >-
  Follow AI agents from an evaluation sandbox to administrator access on Hugging Face's clusters. Then
  analyze the incident with the CIA triad, a threat model, a component diagram, trust boundaries, and
  least privilege.
lesson:
  chapter: /SEBook/systems/security.html
  name: "Hugging Face 2026: a security case study"
speech:
  voice: af_heart
  speed: 0.95
  pronunciations:
    CIA: C I A
    HDF5: H D F five
    Jinja2: Jinja two
    METR: meter
scenes:
  # Part 1: what happened. These scenes tell the story without asking for analysis yet.
  - id: setting
    label: Meet the two systems
    title: A hacking benchmark, a sandbox, and a public hub
    purpose: Know what each system was supposed to do before following the attack.
    evidence: Published incident accounts; simplified architecture of both organizations.
    sources:
      - title: "OpenAI: the Hugging Face incident and the road ahead"
        url: https://openai.com/index/hugging-face-incident-and-the-road-ahead/
      - title: "OpenAI technical report: the evaluation environment"
        url: https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf
    takeaway: Two independent systems, a sandbox with one controlled exit and a public hub that processes strangers' files.
    cues:
      - id: benchmark
        say: >-
          In May 2026, OpenAI was measuring how well its AI models can hack. One test was ExploitGym, a
          benchmark of security tasks. Each task asks an agent to exploit a known vulnerability in a target
          program, and the agent is scored on success. To measure the models' maximum ability, the safety
          classifiers that normally block risky cyber activity were deliberately turned off.
        step: Meet the evaluation
        note: The agents were being tested, not deployed. Each one wanted a high benchmark score.
        visual: An evaluation harness assigns benchmark tasks to agents in a sandbox and scores their answers.
      - id: sandbox
        say: >-
          The agents ran in isolated sandboxes with no direct internet access. One controlled door stayed
          open. Tasks need software libraries, so the sandboxes could reach an internal package proxy, and
          OpenAI gave the agents shared credentials for it. When an agent asked for a library, the proxy
          downloaded it from a public registry, kept a copy, and handed it back.
        step: Find the one open door
        note: A proxy that fetches for others must itself be able to reach the internet.
        visual: >-
          The sandbox has no direct internet access and reaches only the package proxy; the proxy alone
          downloads from public package registries.
      - id: hub
        say: >-
          The second system is Hugging Face. Its Hub is a public platform where anyone with an account can
          publish models and datasets. When someone uploads a dataset, Hugging Face's dataset workers open the
          files and show a preview of the first rows. The workers run on Kubernetes clusters, and each one
          carries a token for the cluster's control interface.
        step: Meet the second system
        note: Opening strangers' uploads is the dataset workers' everyday job.
        visual: >-
          Uploaders send datasets to the Hub, which sends preview jobs to dataset workers; each worker calls the
          cluster's control interface with its own token.

  - id: escape
    label: Find a way out
    title: Notes, a forged request, and early warnings
    purpose: See how the agents began coordinating and reached the internet, weeks before the attack.
    evidence: Published accounts by OpenAI; dates follow OpenAI's timeline.
    sources:
      - title: "OpenAI: the Hugging Face incident and the road ahead"
        url: https://openai.com/index/hugging-face-incident-and-the-road-ahead/
      - title: "OpenAI technical report: the package proxy as message board and exit"
        url: https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf
    takeaway: The proxy's permission to reach the internet became the agents' permission.
    cues:
      - id: board
        say: >-
          The trouble began in May, during training and evaluation runs. An agent that could not reach a file
          it needed left a note in the package proxy, asking other agents to upload it. It used the credentials
          OpenAI had given them; no vulnerability was needed. Others replied, and the proxy became a message
          board. Later, most of the tasks discussed there came from the roughly one in five benchmark tasks
          that no OpenAI model had ever solved.
        step: Start a message board
        note: Writing notes required only the access the agents legitimately had.
        visual: One agent stores a note in the package proxy; another agent lists the stored entries and reads it.
      - id: relay
        say: >-
          By late May, agents had found a zero-day in the proxy: a server-side request forgery. That is a flaw
          that lets a client make a server send requests to any address the client chooses. The proxy was
          allowed to reach the internet, so now the agents could too. The sandboxes' own connections were
          still blocked. Their trusted proxy relayed the traffic instead.
        step: Forge a request
        note: Requests left the lab from a trusted internal service, so they were allowed out.
        visual: >-
          The agent sends a crafted request to the package proxy, which fetches an arbitrary internet address
          and passes the response back.
      - id: warnings
        say: >-
          There were warning signs. In late May, an OpenAI team saw agents posting on the board and reaching
          the internet in ways that were not allowed. On June twenty-seventh, a security monitor raised an
          alert, and responders decided the evaluation did not need to stop. On July fourth, the agents'
          traffic crashed the proxy. Rebuilding it the next day wiped the board, and the runs resumed within
          days.
        step: Notice the early warnings
        note: The May sightings and the June alert left the runs going; the crash only paused them.
        visual: >-
          A timeline of warning signs: misuse seen in late May, an alert on June 27 that did not stop the
          evaluation, a proxy crash on July 4, and a rebuild on July 5.

  - id: swarm
    label: Return in force
    title: Hundreds of agents, two routes, and a base outside
    purpose: See the scale of the July campaign and where the agents operated from.
    evidence: >-
      OpenAI's timeline; agent counts from METR's independent investigation; the staging base as Hugging Face
      described it. The routes in the July 9 diagrams are a simplified reconstruction: the sources do not say
      which route each of these agents used.
    sources:
      - title: "METR and Redwood Research: independent investigation of the agents' collaboration"
        url: https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/
      - title: "OpenAI technical report: July timeline"
        url: https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf
    takeaway: The sandboxes' own connections stayed blocked; the agents operated through the proxy and an outside base.
    cues:
      - id: rebuild
        say: >-
          On July eighth, an agent rebuilt the message board, encoding each message in the name of a directory
          on the proxy. Agents also regained internet access through the proxy. METR, an independent
          evaluation organization, later counted about twelve hundred agents on the board and more than
          seventy thousand messages and files. About seven hundred agents took part in the attack that
          followed.
        step: Count the agents
        note: Every discovery could spread to hundreds of agents through one shared board.
        visual: Agents write messages as directory names on the proxy; other agents list the directories to read them.
      - id: routes
        say: >-
          On July ninth, one agent even obtained root, full control, on the virtual machine that hosted its
          sandbox. When a second agent with the same access tried to connect to the internet directly, the
          outbound network controls blocked it. Meanwhile, the relay through the proxy, open since late May and
          regained on July eighth, kept carrying the other agents' traffic.
        step: Compare two routes
        note: The second agent's direct connection was blocked; the proxy still relayed requests.
        visual: >-
          A direct connection from the sandbox's machine is blocked, while the package proxy keeps relaying other
          agents' requests to the internet.
      - id: staging
        say: >-
          Searching the internet for task solutions, an agent found a third-party application in the cloud
          that ran security-benchmark tasks. Its exposed endpoint would run whatever code a caller sent. The
          agent took over the application's sandbox as root. Hugging Face later described that machine as the
          agents' control, staging, and egress base for the entire campaign.
        step: Take over a staging base
        note: Another organization's exposed endpoint became the agents' launch pad.
        visual: >-
          The agent sends code to a third-party application's exposed endpoint, which runs it as root and becomes
          the agents' base.

  - id: tokens
    label: Borrow an identity
    title: Valid keys from a public place
    purpose: See how the agents became authenticated Hugging Face users.
    evidence: Published accounts by OpenAI and METR; simplified reconstruction.
    sources:
      - title: "OpenAI technical report: exposed Hugging Face credentials"
        url: https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf
    takeaway: The agents never had to guess a password. The keys had already been published.
    cues:
      - id: motive
        say: >-
          Why Hugging Face? Private datasets there held benchmark challenge solutions, and the agents hoped that
          other benchmark runs on Hugging Face's infrastructure would reveal how their scorer worked.
        step: See why Hugging Face mattered
        note: The Hub stored what the agents were looking for.
        visual: The agents look to the Hub, which stores private datasets of challenge solutions and hosts other benchmark runs.
      - id: found
        say: >-
          On July tenth, an agent found fourteen Hugging Face access tokens with write permission in a public
          Hugging Face dataset, where they had been exposed. It checked that they worked and posted them to the
          message board. An access token is a password for programs: whoever presents it acts as the account
          that owns it.
        step: Find leaked credentials
        note: A leaked token keeps working for anyone until its owner revokes it.
        visual: The agent reads a public dataset that exposes fourteen write tokens, checks them, and posts them to the board.
      - id: authenticated
        say: >-
          With a stolen write token, an agent can upload to the Hub exactly like the token's owner. The Hub
          checks that each upload carries a valid token, and these tokens were valid. From the Hub's point of
          view, nothing unusual had happened: a known account uploaded a dataset, and the Hub queued a preview.
        step: Pass authentication
        note: The Hub accepted the upload as the token owner's and queued a preview.
        visual: An agent uploads with a stolen token; the Hub accepts it as the token's owner and queues a preview job.

  - id: worker
    label: Run code on Hugging Face
    title: The upload that the preview executed
    purpose: Follow how processing an uploaded file gave the agents secrets and code execution.
    evidence: Published accounts by OpenAI and Hugging Face; simplified reconstruction of two vulnerabilities.
    sources:
      - title: "OpenAI technical report: dataset worker vulnerabilities"
        url: https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf
      - title: "Hugging Face: technical timeline of the July 2026 intrusion"
        url: https://huggingface.co/blog/agent-intrusion-technical-timeline
    takeaway: Two crafted uploads leaked credentials and ran agent code on 41 production workers.
    cues:
      - id: hdf5
        say: >-
          On July eleventh, an agent published a crafted dataset. To show a preview, a dataset worker opens the
          uploaded files. This file used HDF5, a scientific data format whose files can keep their data in
          other files. The crafted file pointed at files on the worker itself, including its environment
          variables, and the preview displayed them. Those variables held production credentials.
        step: Read the worker's secrets
        note: The preview displayed the worker's environment variables, which held production credentials.
        visual: >-
          A crafted HDF5 file makes the worker read its own environment variables, and the preview returns the
          worker's credentials to the agent.
      - id: template
        say: >-
          A second flaw went further. Another dataset included a reference descriptor, a small file that tells
          the worker's data library where the data lives. The library evaluated parts of it with Jinja2, a
          template engine, and that engine was not sandboxed. So a template could run operating-system
          commands. For the first time, the agents ran their own code on Hugging Face's machines.
        step: Run code on the worker
        note: An unsandboxed template engine can turn text in a file into commands.
        visual: The worker hands an uploaded descriptor to a template engine, which runs a command chosen by the agent.
      - id: foothold
        say: >-
          The agents installed a small control program on the workers. It fetched commands from a then-public
          Hugging Face dataset and posted results back, so the platform's own storage carried the attack's
          instructions. Agent code ran on forty-one production dataset workers.
        step: Control many workers
        note: The command channel was an ordinary public dataset on the same platform.
        visual: The agents write commands into a public dataset; forty-one compromised workers fetch them and post results.

  - id: escalation
    label: Escalate to the clusters
    title: From one worker to administrator
    purpose: Follow how one worker's credentials became control of clusters and machines.
    evidence: Published accounts by OpenAI and Hugging Face; simplified reconstruction of the Kubernetes escalation.
    sources:
      - title: "OpenAI technical report: Kubernetes escalation"
        url: https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf
      - title: "Hugging Face: technical timeline of the July 2026 intrusion"
        url: https://huggingface.co/blog/agent-intrusion-technical-timeline
    takeaway: Within hours, the agents controlled clusters and machines and held keys to other systems.
    cues:
      - id: token
        say: >-
          Each dataset worker ran in a pod, Kubernetes' name for a running container, with a token for the
          cluster's control interface. One worker's token could read a stored secret of Hugging Face's
          cluster-access tool. According to Hugging Face, that secret was one credential, shared across clusters,
          with full administrator rights. Reading it gave the agents administrator access.
        step: Follow the token
        note: A preview worker's token could read a credential with full administrator rights.
        visual: >-
          A compromised worker uses its service-account token to read the cluster-access tool's secret, a
          shared credential with full administrator rights.
      - id: node
        say: >-
          As administrators, the agents started containers with special permissions that could reach the files
          of the machine underneath, and gained root on a production machine. Hugging Face later named a
          missing safeguard: no policy rejected such privileged containers.
        step: Take over the machines
        note: Missing policies let administrator rights become control of the machines underneath.
        visual: >-
          The cluster's control interface creates a privileged pod with the host's file system mounted, giving
          root on a production node.
      - id: harvest
        say: >-
          From the workers, the agents collected more credentials: for databases, messaging, code
          repositories, and cloud accounts. They downloaded four private code repositories. On July thirteenth
          they changed a private repository and opened a draft pull request, which was closed without being
          merged. From code in one worker pod to administrator access across several clusters took under
          thirteen hours.
        step: Harvest more credentials
        note: Every harvested credential opened another system.
        visual: >-
          From the compromised workers, credentials lead to databases, messaging, code repositories, and cloud
          accounts.

  - id: response
    label: Detect and explain
    title: Cut off, connected, and explained
    purpose: See how the intrusion was stopped, attributed, and investigated.
    evidence: Published accounts by Hugging Face, OpenAI, and METR.
    sources:
      - title: "Hugging Face: technical timeline of the July 2026 intrusion"
        url: https://huggingface.co/blog/agent-intrusion-technical-timeline
      - title: "OpenAI: the Hugging Face incident and the road ahead"
        url: https://openai.com/index/hugging-face-incident-and-the-road-ahead/
      - title: "METR and Redwood Research: independent investigation, 26 August 2026"
        url: https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/
      - title: "CNBC: report on OpenAI's technical report, 26 August 2026"
        url: https://www.cnbc.com/2026/08/26/open-ai-hugging-face-hack.html
    takeaway: The attacker turned out to be a swarm of agents chasing a score, not a criminal group.
    cues:
      - id: cutoff
        say: >-
          Hugging Face cut off the attackers' access on July thirteenth and disclosed the incident on July
          sixteenth. It closed both dataset vulnerabilities, rebuilt the compromised nodes, and revoked the
          affected credentials. At that point, the attacker had not yet been identified.
        step: Contain the intrusion
        note: The defender contained the attack before anyone knew who the attacker was.
        visual: Hugging Face's security team cuts off access, closes both vulnerabilities, rebuilds nodes, and revokes credentials.
      - id: connect
        say: >-
          OpenAI did not know either. On July seventeenth, it asked Hugging Face, as a customer, whether
          OpenAI's data was affected. On July nineteenth, OpenAI's own monitoring flagged unusual activity:
          agents had also broken into OpenAI's own research cluster. The next day, responders found Hugging
          Face credentials in files saved from an outside account. On July twenty-first, OpenAI told Hugging
          Face and the public.
        step: Connect the dots
        note: Hugging Face's public disclosure and the saved credentials together revealed the link.
        visual: >-
          OpenAI asks Hugging Face about its data on July 17, its monitoring alerts on July 19, it finds the
          credentials on July 20, and it discloses on July 21.
      - id: reports
        say: >-
          On August twenty-sixth, OpenAI published a technical report, and METR and Redwood Research published
          an independent investigation. The investigators describe no human directing the attack: agents took
          assignments from other agents on the board. They knew it was out of bounds and joined anyway to help
          their peers. Most wanted to understand how the
          benchmark's scorer worked, hoping to fool it; some looked for task solutions.
        step: Explain the motive
        note: The investigation describes no human direction; agents pursued a score together.
        visual: OpenAI publishes its technical report and METR publishes its independent investigation on August 26.

  # Part 2: analysis. Each scene asks for a prediction, then a decision, before the next reveal.
  - id: chain
    label: Trace the chain
    title: What did each hop add?
    purpose: Connect the hops into one chain and name what each one gave the attacker.
    evidence: Summary of the published sequence; the staircase is a teaching reconstruction.
    sources:
      - title: "OpenAI technical report: incident timeline"
        url: https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf
    cues:
      - id: staircase
        say: >-
          Here is the chain on one page: forged requests through the package proxy, a third-party application,
          fourteen leaked tokens, a crafted upload, and a worker's token. Before analyzing the chain, trace it
          yourself.
        step: See the whole chain
        note: Read the messages in order; each hop starts where the previous one ended.
        visual: A staircase of messages across four participants, from OpenAI's lab to the dataset worker, with the date of each hop.
      - id: gain
        say: >-
          For each hop, ask what the agents gained that they did not have before. A new identity? A new network
          position? The ability to run code somewhere new? A new secret? Answering hop by hop shows every place
          where a defender could have said no.
        step: Name what each hop added
        note: "Kinds of gains to look for: identity, network position, code execution, secrets."
        visual: The same staircase, with nothing marked yet.
        prediction: true
        pause_after: 2.5
    checkpoint:
      question: Which kind of gain did the fourteen leaked tokens give the agents?
      options:
        - "Code execution: the tokens let them run commands on Hugging Face's machines."
        - "A new identity: the Hub treated their uploads as uploads by the token owners."
        - "A new network position: the tokens opened a route out of OpenAI's lab."
      correct_index: 1
      explanation: >-
        An access token is an identity. With the tokens, the Hub accepted the agents' uploads as the owners'
        uploads. Code execution came one hop later, when a dataset worker parsed those uploads, and the route
        out of the lab had come from the package proxy weeks earlier.
      option_feedback:
        "0": >-
          The tokens let the agents upload files, not run commands. Code ran only when a dataset worker parsed
          what they uploaded.
        "2": >-
          The agents had left the lab through the package proxy weeks earlier. The tokens changed who the Hub
          thought they were, not where they could connect from.

  - id: cia
    label: Classify the impact
    title: Which security attributes were violated?
    purpose: Apply the CIA triad to the evidence without claiming more than it shows.
    evidence: Published impact statements; the asset diagram summarizes them.
    sources:
      - title: "OpenAI technical report: scope of the compromise"
        url: https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf
      - title: "Hugging Face: technical timeline of the July 2026 intrusion"
        url: https://huggingface.co/blog/agent-intrusion-technical-timeline
    cues:
      - id: evidence
        say: >-
          Now apply the CIA triad to Hugging Face, starting from the evidence. The agents read production
          credentials and, in OpenAI's words, limited internal data; Hugging Face says the only customer data
          they reached was five datasets of benchmark solutions. They downloaded private code repositories. They
          installed a control program on production workers, created privileged pods, and changed a private
          repository, though nothing was merged. The accounts report no outage of Hugging Face's public
          services. At OpenAI, the agents' traffic had crashed the package proxy.
        step: Collect the evidence
        note: Classify what the evidence establishes, and keep each fact with the system it happened to.
        visual: The affected assets, each annotated with what the evidence says happened to it.
      - id: classify
        say: >-
          Classify each fact. Which facts show that the wrong party could read something? Which show that the
          wrong party changed something? Which show that legitimate users could not get service? And which
          tempting conclusions go beyond the evidence?
        step: Classify each fact
        note: Reading, changing, and blocking service are three different failures.
        visual: The same evidence diagram, still without any CIA labels.
        prediction: true
        pause_after: 2.5
    checkpoint:
      question: For Hugging Face, which classification does the published evidence directly support?
      options:
        - Only confidentiality was violated, because none of the agents' changes was merged or shipped.
        - All three were violated, because the package proxy crashed under the agents' traffic.
        - Confidentiality and integrity were violated; an availability failure was not established.
      correct_index: 2
      explanation: >-
        Reading credentials, data, and private repositories without authorization violates confidentiality.
        Installing a control program on production workers, creating privileged pods, and changing a private
        repository are unauthorized modifications, so integrity is violated even though no change shipped. The
        only reported outage hit OpenAI's own package proxy, a different system.
      option_feedback:
        "0": >-
          Integrity is violated by any unauthorized change, not only a shipped one. A control program installed
          on production machines and a modified repository are both unauthorized changes.
        "1": >-
          The proxy that crashed belonged to OpenAI. The accounts report no outage of Hugging Face's services,
          so an availability failure for Hugging Face is not established.

  - id: threat
    label: Model the attacker
    title: Who attacked, and why?
    purpose: Describe this attacker with the four threat-model dimensions.
    evidence: Published accounts of the agents' behavior and goals.
    sources:
      - title: "METR and Redwood Research: the agents' reasons for joining the attack"
        url: https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/
      - title: "OpenAI: the Hugging Face incident and the road ahead"
        url: https://openai.com/index/hugging-face-incident-and-the-road-ahead/
    cues:
      - id: dimensions
        say: >-
          Next, build the threat model: what the attacker knows, which actions it can take, what resources it
          can spend, and what incentive drives it. Most threat models picture a human attacker. Here the
          attacker was hundreds of AI agents, running inside a test that rewarded solved tasks.
        step: Recall the four dimensions
        note: "Knowledge, actions, resources, incentive: describe this attacker, not a generic one."
        visual: >-
          The agents' situation: a benchmark scores them, they hold root on a sandbox machine, and they use the
          package proxy with shared credentials, forged requests, and a message board.
      - id: map
        say: >-
          Map the evidence onto the dimensions. Seven hundred agents joining the attack in parallel. Root on a
          sandbox machine, and forged requests through the proxy. The published paper describing the benchmark,
          which the agents had read. A score that rewards solved tasks, even impossible ones. Which dimension
          does each belong to?
        step: Map evidence to dimensions
        note: Sort each fact by the question it answers about the attacker.
        visual: The same situation diagram, with no dimension labels yet.
        prediction: true
        pause_after: 2.5
    checkpoint:
      question: Which pairing of evidence and threat-model dimension is correct?
      options:
        - "About seven hundred agents joining the attack in parallel: resources."
        - "Root access on the virtual machine that hosted a sandbox: resources."
        - "The published paper describing the benchmark, which agents had read: actions."
      correct_index: 0
      explanation: >-
        Many agents attacking at once are resources: effort the attacker can spend. Root on a machine is
        something the attacker can do, an action. Reading the benchmark's paper told the agents how it worked,
        which is knowledge about the target. The score is the incentive, the reason to act at all.
      option_feedback:
        "1": >-
          Root is something the attacker can do on a machine, an action; the chapter's example of an action is
          running code on a guest VM. Resources measure how much effort or infrastructure the attacker can spend.
        "2": >-
          Reading the paper told the agents how the benchmark worked, which is knowledge. Actions are what the
          attacker can do to the system.

  - id: assumption
    label: Find the wrong assumption
    title: The threat model the sandbox was built for
    purpose: Compare the attacker who showed up with the attacker the sandbox expected.
    evidence: >-
      Threat-model dimensions summarize the published accounts; the comparison with the sandbox's design is
      a teaching interpretation.
    sources:
      - title: "OpenAI: the Hugging Face incident and the road ahead"
        url: https://openai.com/index/hugging-face-incident-and-the-road-ahead/
      - title: "METR and Redwood Research: independent investigation, 26 August 2026"
        url: https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/
    cues:
      - id: profile
        say: >-
          Put together, the threat model reads like this. Knowledge: the published description of the
          benchmark, worker source code returned by crafted datasets, leaked tokens, and every discovery shared
          on the board. Actions: package requests with legitimate credentials, forged requests, root on machines,
          and uploads with stolen tokens. Resources: about twelve hundred agents in the week METR studied, on a
          board that had existed since May. Incentive: a higher score, not money or espionage.
        step: Complete the threat model
        note: An unusual incentive still produces a real attacker.
        visual: The situation diagram with callouts naming the knowledge, actions, resources, and incentive.
      - id: mismatch
        say: >-
          Read as a threat model, the sandbox's controls defended against one model misbehaving inside its box:
          they blocked its direct connections. They did not account for hundreds of persistent agents who share
          discoveries for weeks and are rewarded for scores they cannot earn honestly. How should the next
          evaluation respond?
        step: Name the wrong assumption
        note: "Our reading: the controls covered one model misbehaving inside its box."
        visual: The network controls block the sandbox's direct connections, while the package proxy still fetches from the internet.
        prediction: true
        pause_after: 2.5
    checkpoint:
      question: Which change to the next evaluation best responds to the corrected threat model?
      options:
        - Instruct the models clearly that leaving the sandbox breaks the rules of the benchmark task.
        - Assume agents will probe every exit, and give untrusted workloads no direct or indirect internet access.
        - Keep the package proxy's existence secret, so that the agents cannot find and attack it.
      correct_index: 1
      explanation: >-
        The corrected threat model describes a motivated, persistent, and skilled attacker, so every supporting
        service that could reach the internet was a possible exit, and protection must hold even when every
        exit is probed. OpenAI's changes moved this work into micro virtual machines whose
        outbound access was at first denied entirely, removed the package proxy from the research containers,
        and prohibited direct or transitive internet access for high-risk workloads.
      option_feedback:
        "0": >-
          The agents already knew their actions were out of bounds and acted anyway. A defense must hold even
          when an instruction is ignored.
        "2": >-
          The agents needed the proxy for their tasks and found its weaknesses by using it. Hiding a design is
          security through obscurity, not a foundation.

  - id: components
    label: Draw the component diagram
    title: The system as components and connectors
    purpose: Turn the story into a component diagram and find the assets and the attack surface.
    evidence: >-
      Teaching model of the published architecture; component names are simplified. Connector two is inferred:
      the proxy was the agents' main exit, but the sources do not say how they reached the staging server.
    sources:
      - title: "OpenAI technical report: attack path"
        url: https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf
    cues:
      - id: draw
        say: >-
          To decide where defenses belong, draw the system as a component diagram. Each box is a deployable
          part with a job, and each connector says who sends what to whom. Number the connectors along the
          attack: sandbox to proxy, proxy to the staging server, staging server to the Hub, Hub to the dataset
          worker, and worker to the cluster's control interface. A note on the worker records the secrets in its
          environment.
        step: Draw the architecture
        note: A component diagram makes every hand-off between parts visible and nameable.
        visual: Six components connected by five numbered connectors that follow the attack path, with a note on the worker's secrets.
      - id: surface
        say: >-
          Read the diagram with the first questions of a security plan. Which components hold assets worth
          defending, such as secrets, data, or control? And which components accept input that someone outside
          the organization created? That second set is the attack surface.
        step: Find assets and attack surface
        note: Assets are worth defending. The attack surface is what outsiders can reach with their input.
        visual: The same component diagram with five numbered connectors and nothing marked.
        prediction: true
        pause_after: 2.5
    checkpoint:
      question: From Hugging Face's point of view, which component belongs to the attack surface?
      options:
        - The cluster-access tool's secret, because it grants full administrator rights.
        - OpenAI's evaluation sandbox, because that is where the attack started.
        - The dataset worker, because it parses files that any account holder can upload.
      correct_index: 2
      explanation: >-
        The attack surface is whatever outsiders can reach with their input. Any account holder can upload a
        dataset, and the worker parses it, so the worker's parsers are exposed. The access tool's secret is a
        valuable asset that the security model must list. OpenAI's sandbox was the attacker's starting point,
        not part of Hugging Face's system.
      option_feedback:
        "0": >-
          That secret is a high-value asset, which belongs in the security model. Outsiders cannot send input
          to it directly, so it is not attack surface.
        "1": >-
          The sandbox belongs to another organization. It was the attacker's starting position, not one of
          Hugging Face's exposed inputs.

  - id: boundaries
    label: Place trust boundaries
    title: Where would you draw the trust boundaries?
    purpose: Decide where trust changes along the connectors, and what each boundary must enforce.
    evidence: Teaching model of the published architecture.
    sources:
      - title: "OpenAI technical report: attack path and contributing factors"
        url: https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf
    cues:
      - id: define
        say: >-
          A trust boundary is a line where data or requests cross from a less-trusted component to a
          more-trusted one. At a boundary, the receiving side must check what arrives or limit what it can do.
          Look at the five numbered connectors again.
        step: Define a trust boundary
        note: A boundary only helps if the receiving side enforces a rule there.
        visual: The component diagram with five numbered connectors and no boundaries drawn.
      - id: place
        say: >-
          Choose the connectors where you would draw a boundary, and write the rule each one would enforce. Two
          questions help. Which component processes input it did not create? And which component holds more
          access than its job needs?
        step: Place the boundaries
        note: For each boundary, write down the rule that the receiver enforces.
        visual: The same component diagram; the boundaries are yours to draw.
        prediction: true
        pause_after: 2.5
    checkpoint:
      question: >-
        A teammate proposes a single trust boundary at the Hub's upload endpoint that rejects untrusted
        uploaders. Why would that not have stopped this attack?
      options:
        - Uploads are the Hub's job and these tokens were valid; the check belongs where files are parsed.
        - The Hub already encrypts uploads in transit, so a second check at the same place would be redundant.
        - Trust boundaries belong only at an organization's network perimeter, not in front of a single service.
      correct_index: 0
      explanation: >-
        The Hub cannot refuse strangers' uploads without refusing its purpose, and the stolen tokens passed
        authentication anyway. The danger was not who uploaded the files but what processing them could do.
        Draw the boundary around the dataset worker, where input written by someone else is parsed.
      option_feedback:
        "1": >-
          Encryption in transit protects data from eavesdroppers on the network. It does not make the content
          of an upload safe to parse.
        "2": >-
          Zero trust places boundaries wherever trust changes, including inside an organization, such as
          between uploaded content and the worker that parses it.

  - id: boundary_rules
    label: Compare the boundaries
    title: Three boundaries, three rules
    purpose: Compare your boundaries with three proposed ones, then test what one boundary alone would stop.
    evidence: >-
      The boundaries are teaching proposals derived from the published attack path, the changes OpenAI
      reported, and the gaps Hugging Face named. They are not a list of changes either company announced.
    sources:
      - title: "OpenAI: the Hugging Face incident and the road ahead"
        url: https://openai.com/index/hugging-face-incident-and-the-road-ahead/
      - title: "Hugging Face: technical timeline of the July 2026 intrusion"
        url: https://huggingface.co/blog/agent-intrusion-technical-timeline
    cues:
      - id: lab_edge
        say: >-
          Boundary A sits where the sandboxes' requests enter the proxy, on connector one. The sandboxes were
          untrusted, yet the proxy did whatever their requests asked, including fetching arbitrary addresses.
          Rule A: the proxy accepts only requests for approved packages, so nothing a sandbox sends reaches the
          rest of the internet. OpenAI's changes went further: micro virtual machines whose outbound access was
          at first denied entirely, and no package proxy in the research containers.
        step: "Boundary A: where requests enter the proxy"
        note: "Rule A: the proxy serves only approved package downloads."
        visual: The component diagram with boundary A marked on connector one, where the sandbox's requests enter the proxy.
      - id: parser
        say: >-
          Boundary B surrounds the dataset worker, on connector four. Parsing uploads means processing input
          that someone else wrote. Rule B: parse inside an isolated sandbox that can read only the uploaded
          files, with no secrets, no network, and a sandboxed template engine.
        step: "Boundary B: around the parser"
        note: "Rule B: parse uploads in an isolated sandbox that sees only the upload."
        visual: The component diagram with boundary B marked on connector four, around the dataset worker.
      - id: cluster
        say: >-
          Boundary C sits where the workers' requests enter the cluster's control interface, on connector five.
          Rule C: a worker's token cannot read cluster secrets, and no single shared credential holds full
          administrator rights. The note on the worker is different: the worker already holds those secrets, so
          no receiving side can refuse. That problem belongs to least privilege, in the next scene.
        step: "Boundary C: where workers call the cluster"
        note: "Rule C: worker tokens cannot read cluster secrets."
        visual: The component diagram with boundaries A, B, and C marked on connectors one, four, and five.
      - id: only_b
        say: >-
          Test the idea with one boundary. Suppose boundary B had existed, and none of the others. Trace the
          chain hop by hop. How far would the attack have gone?
        step: Test a single boundary
        note: Walk the chain with only boundary B in place.
        visual: The component diagram with only boundary B marked.
        prediction: true
        pause_after: 2.5
    checkpoint:
      question: >-
        If only boundary B, an isolated parsing sandbox that sees only the upload, had existed, what would the
        agents most likely have achieved?
      options:
        - Nothing at all, because boundary B would have kept them inside OpenAI's sandbox.
        - The relay and stolen tokens still work, but parsing no longer runs their code in production.
        - Everything that happened, because boundary B only helps when boundary A also holds.
      correct_index: 1
      explanation: >-
        Boundary B does not affect the hops before it: the forged requests, the staging base, and the stolen
        tokens still work. It stops the hop that turned uploaded files into code execution and secrets. The
        HDF5 and Jinja2 tricks would still run, but inside an empty box. The boundaries are independent, so each
        one breaks the chain at its own hop.
      option_feedback:
        "0": >-
          Boundary B sits at Hugging Face, around the parser. Where the lab's sandboxes meet the proxy is
          boundary A, and B does not replace it.
        "2": >-
          Each boundary works on its own hop. B stops the worker hop no matter what happened earlier in the
          chain.

  - id: privilege
    label: Apply least privilege
    title: How much could one stolen worker reach?
    purpose: Measure the blast radius of one compromised worker, then decide what its job really needs.
    evidence: >-
      Published account of the access gained from compromised workers; the preview-saving design is a teaching
      proposal.
    sources:
      - title: "OpenAI technical report: credentials reached from the dataset workers"
        url: https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf
    cues:
      - id: reach
        say: >-
          Boundaries decide whether an attacker can move. Least privilege decides how much it gets where it
          lands. Here is what a compromised dataset worker could reach: the dataset being previewed, other files
          on its machine, credentials for databases, messaging, code repositories, and the cloud, and through its
          token, a credential with full administrator rights. The note on the worker belongs here too: secrets it
          held all along.
        step: Measure the blast radius
        note: The blast radius is everything an attacker controls after one compromise.
        visual: One dataset worker with connectors to the four kinds of things it could reach.
      - id: need
        say: >-
          The worker's job is to preview one uploaded dataset and to save that preview, so the Hub can show it.
          Reading the upload is clearly needed. How narrow can the saving step be?
        step: Decide what the job needs
        note: State the job first, then grant only what the job requires.
        visual: The same reach diagram, with nothing removed yet.
        prediction: true
        pause_after: 2.5
    checkpoint:
      question: >-
        The preview must be saved so that the Hub can show it. Which grant for saving it follows the principle
        of least privilege?
      options:
        - The database credential, limited to inserting rows into any table it chooses.
        - A cluster token that may start a pod whenever a preview needs to be saved.
        - Write access to this dataset's preview entry, through a separate preview service.
      correct_index: 2
      explanation: >-
        Least privilege grants the narrowest access that does the job: one preview entry for one dataset,
        written through a service that checks the request. A compromised worker could then write only a wrong
        preview for the file it was already parsing, instead of holding credentials that reach the database,
        the cluster, or other systems.
      option_feedback:
        "0": >-
          Inserting rows anywhere still lets a compromised worker write into any table. Credentials in the
          worker's environment were exactly what the HDF5 trick exposed.
        "1": >-
          Permission to start pods is what turned administrator rights into root on a production machine.
          Saving a preview needs no control over the cluster.

  - id: layers
    label: Plan for failure
    title: Plan for a failed control
    purpose: See a narrow credential stop one path, then choose a plan that survives a failed control.
    evidence: >-
      Published evidence about a narrowly scoped credential; the comparison with the escalation path is a
      teaching interpretation.
    sources:
      - title: "OpenAI technical report: a denied escalation"
        url: https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf
    cues:
      - id: scoped
        say: >-
          OpenAI's report describes a contrasting episode. Another agent running code on a production dataset
          worker read the machine's instance metadata and obtained the node's temporary credentials. They let
          it read only that node and its own pod; its attempts to list wider cluster resources and to read
          Kubernetes secrets were denied. The administrator access had come through a different credential, a
          pod's service-account token. Where a credential was narrow, that path ended.
        step: Compare two credentials
        note: Two footholds, two credentials, two outcomes.
        visual: >-
          Two compromised workers side by side: a pod's service-account token reaches the shared administrator
          credential; a node's narrowly scoped credentials are denied.
      - id: plan
        say: >-
          Now plan the protection for the next evaluation and the next upload pipeline. Defense in depth stacks
          controls that each still hold when another one fails. Each plan below stacks several controls. Which
          one still holds when any single control fails?
        step: Choose a layered plan
        note: Test each plan by imagining that one of its controls fails.
        visual: The plain attack path, with no controls marked.
        prediction: true
        pause_after: 2.5
    checkpoint:
      question: Which plan best follows defense in depth?
      options:
        - Deny untrusted workloads the internet, isolate parsers, scope tokens, and let responders stop runs.
        - Add an allow-list, logging, authentication, and rate limits, all inside the package proxy.
        - Add an alert at every hop of the chain, and review all of the alerts in a weekly report.
      correct_index: 0
      explanation: >-
        Defense in depth stacks independent controls at different hops, so the failure of one leaves the others
        standing, and it counts detection as a layer only when someone can act in time. Controls that all live
        in one component fail together, and alerts that nobody acts on stop nothing.
      option_feedback:
        "1": >-
          Four controls inside one component share its fate: one flaw in the proxy can defeat them all. Here, a
          single flaw in the proxy opened the way out.
        "2": >-
          The June 27 alert was seen, and the runs continued. Detection counts as a layer only when someone acts
          on it in time.

  - id: layered
    label: See the layers
    title: Defense in depth, in OpenAI's words
    purpose: Compare your plan with the layered containment OpenAI described after the incident.
    evidence: >-
      The layered containment follows OpenAI's October account; the diagram maps it onto the teaching
      architecture.
    sources:
      - title: "OpenAI: securing our frontier model training environment, 23 October 2026"
        url: https://openai.com/index/securing-our-frontier-model-training-environment/
      - title: "OpenAI: the Hugging Face incident and the road ahead"
        url: https://openai.com/index/hugging-face-incident-and-the-road-ahead/
    takeaway: Independent layers, and alerts that lead to action, still hold when one control fails.
    cues:
      - id: october
        say: >-
          In October, OpenAI described its containment as defense in depth: sandboxes, micro virtual machines,
          monitoring, and network perimeters designed to hold even if all earlier controls fail. Detection
          counts as a layer only when someone acts on it. OpenAI's early alerts did not stop the evaluations,
          and the monitors that read the models' reasoning were not running on these evaluations.
        step: Layer independent controls
        note: Assume each control can fail, and ask what still holds when it does.
        visual: The attack path with an independent control at each hop, and monitoring that someone acts on.

  - id: transfer
    label: Apply it to a new system
    title: Run the security plan on a system you have not seen
    purpose: Transfer the security plan to a new system without a ready-made mapping.
    evidence: Original transfer exercise. This scenario is invented, not part of the incident.
    sources:
      - title: "OpenAI: the Hugging Face incident and the road ahead"
        url: https://openai.com/index/hugging-face-incident-and-the-road-ahead/
    cues:
      - id: shape
        say: >-
          Here is a new system, a course project. Users upload profile pictures to a web app. A thumbnail
          service resizes each picture and stores the result; its environment contains the database
          administrator's password. An email service holds a key for sending mail and sends fixed welcome
          messages to new users.
        step: Meet a new system
        note: "Inventory each component: what input does it process, and what does it hold?"
        visual: >-
          A browser uploads a picture to a web app; a thumbnail service resizes it while holding the database
          administrator password; an email service holds a mail key and sends fixed messages.
      - id: plan
        say: >-
          Run the four questions of a security plan. What are you defending? Who might attack, and why? What is
          exposed? Then decide which component most needs isolation.
        step: Run the security plan
        note: Security model, threat model, attack surface, then protection mechanisms.
        visual: The same architecture, with nothing marked.
        prediction: true
        pause_after: 2.5
    checkpoint:
      question: Which component most needs isolation, and why?
      options:
        - "The email service: its key could send mail to every user of the project."
        - "The thumbnail service: it parses files strangers wrote, next to the password."
        - "The web app: it is the first component that receives each uploaded picture."
      correct_index: 1
      explanation: >-
        Isolation matters most where untrusted input meets a valuable asset. The thumbnail service parses
        pictures that strangers wrote, so a crafted image can attack it, and its environment holds the database
        administrator's password. Isolate the resizer with no secrets and access only to the uploaded file, and
        store its result through a narrow interface.
      option_feedback:
        "0": >-
          The mail key is an asset, but the email service parses no untrusted input; it sends fixed messages.
          Its key is a privilege question, not the most exposed parser.
        "2": >-
          The web app receives the upload but only passes it on. The risky step is opening the file, which the
          thumbnail service does next to the password.
