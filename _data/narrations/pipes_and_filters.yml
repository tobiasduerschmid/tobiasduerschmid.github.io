# Sources for every claim: docs/pipes-and-filters-narration.md.
version: 1
id: pipes_and_filters
kind: video
title: Do one thing, pass it on
lesson:
  name: Pipes and Filters
  summary: >-
    Follow game-day photos through a student newspaper's pipeline, from the sideline camera to the
    website, and learn the rules of the <strong>pipes-and-filters</strong> style: independent
    filters that transform a stream and pass it on through pipes. See what the rules buy, reuse,
    easy recombination, and throughput, and what they cost in interactivity, latency, and error
    handling.
  prerequisites: >-
    Assumes you have written a loop that processes a list of items and passed one function's
    result into another function.
  chapter: /SEBook/architectural_styles/pipes_and_filters.html
  views: /SEBook/architectural_styles/pipes_and_filters
  parts:
    - Motivation
    - Rules
    - Consequences
    - In practice
  parts_label: Part of the lesson
speech:
  voice: drama3-female6
  speed: 1
  pronunciations:
    GNU: Guh-noo
    QC: Q C
media:
  audio: /assets/audio/pipes-and-filters-narration.mp3
  captions: /assets/narration/pipes-and-filters-narration.vtt
  script: /assets/narration/pipes-and-filters-narration.txt
scenes:
  - id: intro
    part: Motivation
    outline: Game night
    label: "Motivation: three thousand photos"
    title: Fourth quarter, three thousand photos
    purpose: Meet the photo desk's processing job, and the deadline that tests it.
    takeaway: >-
      Every photo goes through the same fixed series of steps, from the camera to the website.
    cues:
      - id: sideline
        say: >-
          Fourth quarter, rivalry game, and the stadium is shaking. Your roommate shoots for the
          student paper from the sideline, and by the final whistle, the camera will hold three
          thousand photos. Fans want them tonight. The editor wants the best ones online while the
          game is still on.
        step: Game night
        note: Thousands of photos arrive during the game, and readers want them fast.
        visual: >-
          A readout for the sideline camera counts up, 1,212 photos, 1,213, then reads 3,000 by the
          whistle. A scoreboard reads 4th quarter, 2:41. A photo straight off the camera, a receiver
          leaping for the catch in front of the stands, is dark and speckled with noise. A phone-
          sized website card reads Game photos, Coming soon, and a sticker reads Fans want them
          tonight.
      - id: steps
        say: >-
          Every photo needs the same steps. Remove the noise from shooting at night. Brighten it.
          Crop it to the action. Blur the faces of fans in the stands, for privacy. Stamp the
          paper's watermark. Then publish it to the website. You're the one who keeps the photo
          desk's code running.
        pause_after: 2.5
        step: Same steps for every photo
        note: "Each photo: denoise, brighten, crop, blur faces, watermark, publish."
        visual: >-
          The same photo six times, changing step by step: Noisy; Denoised; Brightened; Cropped, to
          the catch; Faces blurred, the fans' faces turned to blocks; and Watermarked, with the
          paper's logo in the corner. A card reads Published: on the website, beside a badge, You,
          and the tag Photo desk developer.
  - id: monolith
    part: Motivation
    outline: The big script
    label: "Motivation: one script does it all"
    title: Nothing online until midnight
    purpose: See what goes wrong when one program runs each step on the whole batch.
    takeaway: >-
      A single script that finishes each step for every photo before the next step starts delays
      every result, clutters folders, and can't be reused or rearranged.
    cues:
      - id: script
        say: >-
          Here's the photo desk's script. Step one denoises all three thousand photos and saves them
          in a folder. Step two reads that folder, brightens every photo, and saves another folder.
          And so on, until the last step uploads everything. It all lives in one file, sharing a
          dozen global settings.
        step: One script, step by step
        note: Each step finishes the whole batch and saves a folder before the next starts.
        source: >-
          CMU 17-655 lecture 10, Batch Sequential (each step runs to completion, and its output file
          becomes the next step's input).
        visual: >-
          A Python code card titled process_all.py: for photo in all_photos, save(denoise(photo),
          "step1/"); for photo in folder("step1/"), save(brighten(photo), "step2/"); a comment for
          crop, blur faces, and watermark; then upload(folder("step5/")). Folder cards appear one
          after another, step1/ to step5/, each holding 3,000 files, and a card titled Shared global
          settings lists SETTINGS, LAST_BRIGHTNESS, and FACES_FOUND.
      - id: midnight
        say: >-
          The camera finishes at ten p.m., and each step takes the script twenty minutes for the
          whole batch, so no photo goes online until every step has finished every photo: at
          midnight. The second-quarter catch waits behind three thousand others, five folders fill
          with in-between files, and fans post blurry phone shots instead.
        step: Nothing until the end
        note: Nothing is published until every step has processed every photo.
        source: >-
          Buschmann et al. 1996, Pipes and Filters, Consequences (intermediate files clutter
          directories and rule out incremental and parallel computation).
        visual: >-
          A clock reads 10:00 p.m., with the label 20 minutes per step, all photos. Six bars,
          Denoise, Brighten, Crop, Blur faces, Watermark, and Upload, fill one after another, and
          the clock jumps to 12:00 a.m. Only then does the website card, Website at midnight, show
          its first photo. A readout says Touchdown catch, 2nd quarter: waits behind 3,000 others;
          another says In-between files: 5 folders, 15,000. A sticker reads Fans posted blurry
          shots.
      - id: change_requests
        say: >-
          And change hurts too. The editor wants a new step that straightens tilted shots, right
          after the crop. The robotics club wants your denoiser for its robot's camera. Both mean
          surgery on one giant file, where every step reads the same global settings. You need steps
          that work alone and pass each photo on.
        pause_after: 2.5
        step: Change hurts
        note: New steps and reuse requests both mean editing one tangled script.
        source: >-
          CS 130 lecture 17, slide 15 (problem: process data streams in a reusable, composable,
          flexible, and independently developable way).
        visual: >-
          Two cards point into one card, process_all.py, one giant file, which turns pink: New step,
          straighten tilted shots, after the crop; and Reuse request, the robotics club wants the
          denoiser. A label reads Every step reads the globals, and a banner reads What you need:
          steps that work alone and pass each photo on.
  - id: filters
    part: Rules
    outline: Filters and pipes
    label: "Rules: filters, pipes, source, and sink"
    title: Filters and pipes, source to sink
    purpose: Learn the parts of the pipes-and-filters style by rebuilding the photo desk.
    takeaway: >-
      Filters transform a stream of data item by item; pipes carry the stream between them, from a
      source to a sink.
    cues:
      - id: filter
        say: >-
          The pipes-and-filters style rebuilds the job as a chain of small programs called filters.
          In a component-and-connector view, which shows the system at run time, each filter is a
          component. It reads data through an input port, applies exactly one transformation to each
          item, and writes the result through an output port.
        step: Filters
        note: A filter reads a stream, transforms each item, and writes a stream.
        source: >-
          CS 130 lecture 16, slide 18 (a filter reads and processes data from an input stream and
          writes the result into an output stream); CS 130 lecture 17, slide 16 (each filter does only
          one thing).
        visual: >-
          A UML diagram frame labeled cmp, C&C view, with a key: «filter» component, port, «pipe»
          connector. Inside, five components stereotyped «filter», each with the component icon, an
          input port on its left edge, and an output port on its right: Denoise, Brighten, Crop,
          Blur faces, and Watermark. Callouts point at Brighten, Filter: a component; at Denoise's
          left port, Input port; and at its right port, Output port. A label reads A filter reads a
          stream, transforms each item, writes a stream.
      - id: pipe
        say: >-
          Filters are joined by pipes, the connectors of this view. A pipe carries data from one
          filter's output port to the next filter's input port: in one direction, in order, and
          unchanged. Its small buffer decouples neighboring filters, so a fast producer and a slower
          consumer need not proceed in lockstep.
        step: Pipes
        note: A pipe carries the stream one way, in order, unchanged, with a small buffer.
        source: >-
          CS 130 lecture 16, slide 18 (a pipe buffers data from a stream and preserves its order); CMU
          17-655 lecture 10 (pipes are one-way, order-preserving, and data-preserving); Buschmann et
          al. 1996, Pipes and Filters, Dynamics, scenario IV (a buffering pipe synchronizes adjacent
          filters: the reader waits on an empty buffer, the writer on a full one).
        visual: >-
          Connectors appear between the filters, each running from an output port to the next input
          port and ending in an arrowhead, and small photos slide along them left to right. A
          callout on the second connector reads Pipe: a connector, and a label reads A pipe: one
          way, in order, unchanged, buffered.
      - id: source_sink
        say: >-
          The chain begins at a source, which feeds in photos as the camera uploads them, and ends
          at a sink, the website gallery. In between, a filter enriches data, as Watermark adds a
          logo; refines it, as Denoise removes noise; or transforms it, from a raw file into a web
          image.
        pause_after: 2.5
        step: Source and sink
        note: A source feeds the line, a sink consumes it; filters enrich, refine, or transform.
        source: >-
          Buschmann et al. 1996, Pipes and Filters, Structure (data source, data sink; a filter
          enriches, refines, or transforms its input); CMU 17-655 lecture 10.
        visual: >-
          A component stereotyped «source», Camera uploads, sends a pipe down and into Denoise's
          input port, and a pipe runs from Watermark's output port down to a component stereotyped
          «sink», Website gallery. Three labels read Enrich: Watermark adds the logo; Refine:
          Denoise removes noise; and Transform: raw file to web image.
  - id: alone
    part: Rules
    outline: Working alone
    label: "Rules: filters work alone"
    title: A filter only sees its own pipes
    purpose: Learn the rules that keep filters independent of each other.
    takeaway: >-
      Filters share no state, don't know their neighbors, and interact only through pipes that carry
      one agreed kind of data.
    cues:
      - id: independent
        say: >-
          These parts obey four rules, and each rule protects a property. Rule one, independence:
          filters share no state; they interact only through pipes. The global settings therefore
          become parameters of each filter. Because a filter depends on nothing outside its ports,
          it can be understood, tested, and reused in isolation.
        step: "Rule 1: independence"
        note: Filters share no state; settings arrive as each filter's own parameters.
        source: >-
          CS 130 lecture 16, slide 18 (strict independence: filters must not share state or memory and
          interact only via pipes); CS 130 lecture 17, slide 17 (configuration parameters increase
          reusability).
        visual: >-
          Rule card 1, Independence: no shared state; filters interact only through pipes. Below it,
          in a C&C view frame with its key, photos flow along the line of five filters, and Brighten
          has a dial below it, amount=1.3. A card titled Shared global settings is struck by a red
          cross, a green sticker reads Parameters, not globals, and a label reads Testable and
          reusable alone.
      - id: agnostic
        say: >-
          Rule two, agnosticism: a filter must not know which filters come before or after it. Blur
          faces knows only its contract: a photo arrives at its input, and a photo leaves at its
          output. Since no filter names its neighbors, filters can be inserted, removed, or
          reordered without editing any of them.
        step: "Rule 2: agnosticism"
        note: A filter doesn't know its neighbors, only its input and output.
        source: >-
          CS 130 lecture 16, slide 18 (agnosticism: a filter must not know the identity of its
          upstream or downstream neighbors); Fairbanks 2010, section 14.8.
        closer_look:
          title: Blur faces never names its neighbors
          notice: >-
            Each filter sees only the stream it receives and the stream it returns; only the
            pipeline builder knows which filter feeds which.
          code: agnostic
          groups:
            - {id: builder, label: "Pipeline builder"}
            - {id: filters, label: "«filter» Crop, Blur faces, Watermark"}
          relations:
            - {kind: call, from: builder.chain, to: filters.blur_in, label: [calls ↓, with crop's stream]}
          steps:
            - question: What does Blur faces know?
              focus: [filters.blur_in, filters.blur_body]
              text: >-
                One stream of images comes in as its only parameter, and one stream of images goes
                out. Nothing in the file names Crop, Watermark, or any other filter. A photo comes
                in, a photo goes out.
            - question: What does each filter import?
              focus: [filters.imports]
              text: >-
                Only the shared <code>Image</code> type, the one format every pipe carries. No filter
                imports another filter, so each one builds, runs, and tests alone.
            - question: Who decides what feeds Blur faces?
              focus: [builder.chain, filters.blur_in]
              relation: call
              text: >-
                The pipeline builder. Its <code>run()</code> passes the stream that Crop returns
                into Blur faces, and Blur faces' stream into Watermark. <strong>The connections live
                in the builder, not in any filter.</strong>
            - question: Move it anywhere
              focus: [builder.chain]
              text: >-
                To blur faces before cropping, swap two lines of <code>run()</code>. Not one line of
                any filter changes: knowing only its input and output is what lets a filter move.
        visual: >-
          Rule card 2, Agnosticism, joins Rule 1 at the top: a filter doesn't know its neighbors,
          item in, item out. In a C&C view frame, a large Blur faces component, marked Knows: in,
          out, sits between dashed Crop and Watermark components, each marked Unknown. Photos slide
          in and out along pipes labeled A photo arrives and A photo leaves, and a sticker reads
          Insert, remove, reorder.
      - id: common_format
        say: >-
          Agnosticism has one precondition: neighboring filters must agree on the type of data that
          flows between them. Here, every pipe carries an image in one common file format. Because
          each filter accepts and produces that same type, any filter can follow any other, and the
          composition remains well formed.
        pause_after: 2.5
        step: One agreed format
        note: Connected filters agree on the data in the pipe; a common format connects any two.
        source: >-
          Clements et al. 2010, Table 4.1 (connected filters must agree on the type of data); CS 130
          lecture 17, slide 16 (pipes have simple interfaces, such as 2D pixel graphics).
        visual: >-
          Both rule cards stay at the top. In a C&C view frame, the line of five filters carries
          photos, labeled Every pipe carries: Image (JPEG). Below it, the same filters in a new
          order, Brighten, Denoise, Watermark, Crop, and Blur faces, still pass photos along,
          labeled Any order still connects.
  - id: stream
    part: Rules
    outline: Streams
    label: "Rules: a stream, not a batch"
    title: Pass each photo on right away
    purpose: Learn why filters process items one at a time, and why data flows one way.
    takeaway: >-
      Each filter passes each item on as soon as it's done, so all filters work at once and results
      arrive early; data flows one way, from source to sink, without loops.
    cues:
      - id: incremental
        say: >-
          Rule three, incremental processing: a filter transforms each item as it arrives and passes
          it on immediately, rather than waiting for the complete batch. As a result, the filters
          run concurrently: while Watermark stamps photo one, Blur faces processes photo two, and
          Crop processes photo three.
        step: "Rule 3: incremental"
        note: Each filter passes each item on as soon as it's done.
        source: >-
          CMU 17-655 lecture 10, Pipe-and-Filter 2 (incrementally read, transform, and write data);
          Fairbanks 2010, section 14.8.
        visual: >-
          Rule card 3, Incremental: pass each item on as soon as it is done. In a C&C view frame,
          all five filters turn cyan, each marked Busy, with photo numbers beneath them, from Photo
          5 at Denoise to Photo 1 at Watermark, while photos keep sliding along the pipes.
      - id: predict_online
        say: >-
          Replay game night with the pipeline. Each filter takes about half a second per photo, and
          the camera uploads photos as they're shot. Predict: when does the second-quarter catch
          reach the website now?
        prediction: true
        pause_after: 4
        step: Predict the catch
        note: Five filters, half a second each. When does the catch reach the website?
        visual: >-
          Rule card 3 stays up over the busy line. Below it are the Touchdown catch photo, a dashed
          box asking On the website when?, and a scoreboard reading 2nd quarter, 9:12.
      - id: seconds
        say: >-
          Within seconds. The photo passes through five filters at about half a second each, and
          reaches the gallery while the crowd is still cheering. This is the purpose of incremental
          processing: it lowers the delay until the first result and keeps all five filters busy, so
          the line keeps pace with the camera.
        step: Seconds, not hours
        note: Results arrive seconds after their input, because every filter works at once.
        source: >-
          Buschmann et al. 1996, Pipes and Filters, Solution (a filter consumes and delivers data
          incrementally to achieve low latency and enable parallel processing).
        visual: >-
          The catch hops along the pipes, filter by filter. A readout says Shot to website: 2.5
          seconds, a website card shows the catch, captioned 2nd quarter, and a label reads Rule 3:
          first result early, all filters busy.
      - id: acyclic
        say: >-
          Rule four, acyclic flow: data moves in one direction, from the source to the sink, and no
          filter sends items back upstream. This constraint makes the pipeline easy to reason about.
          Its overall behavior is simply the composition of its filters: watermark of blur of crop
          of brighten of denoise of the raw shot.
        pause_after: 2.5
        step: "Rule 4: acyclic"
        note: Data flows one way, without loops, so the output is a composition of filters.
        source: >-
          CS 130 lecture 16, slide 18 (acyclic pathways from a stream source to a data sink); Clements
          et al. 2010, section 4.2.1 (the overall computation is the functional composition of the
          filters' computations).
        visual: >-
          Rule card 4, Acyclic, joins Rule 3: data flows one way, from source to sink, without
          loops. Under the line, a dashed red connector trying to run back from Watermark to Crop is
          struck by a cross, with a callout: A pipe back upstream: forbidden. A code card reads
          photo = watermark(blur(crop(brighten(denoise(raw))))), labeled The pipeline's behavior: a
          composition of its filters.
  - id: order
    part: Rules
    outline: Order
    label: "Rules: building the line"
    title: Same filters, different order
    purpose: See why filter order matters, and who decides it.
    takeaway: >-
      The order of filters changes the result; filter developers ignore the big picture, while the
      pipeline builder chooses the filters and their order.
    cues:
      - id: order_matters
        say: >-
          Although filters are independent, their order still determines the result, because
          function composition is not commutative. Placing Crop after Watermark can cut the logo off
          the edge, just as adding one and then doubling differs from doubling and then adding one.
          The same filters in a different order form a different pipeline.
        step: Order matters
        note: Composing the same filters in another order can change the output.
        source: >-
          CMU 17-655 lecture 10, Pipe-and-Filter 4a (the order of filters in a pipeline does matter:
          add one then double differs from double then add one).
        visual: >-
          In a C&C view frame, two short lines: Crop, then Watermark, which ends in a photo with the
          paper's logo in its corner; and Watermark, then Crop, whose photo has the logo cut in
          half, stamped Logo cut off. A code card shows 3, add 1, double, equals 8, and 3, double,
          add 1, equals 7.
      - id: roles
        say: >-
          The rules therefore separate two responsibilities. A filter developer implements one
          filter against its input and output types, without knowledge of the surrounding line. The
          pipeline builder selects the filters and their order. To straighten tilted shots, the
          builder inserts a new filter after Crop, and no existing filter is modified.
        pause_after: 2.5
        step: Two jobs
        note: Filter developers build one filter; the pipeline builder picks filters and order.
        source: >-
          Fairbanks 2010, section 14.8 (the roles of filter developer and pipe-and-filter network
          developer).
        visual: >-
          Two badges: Filter developer, tagged One filter, its input and output types; and Pipeline
          builder, tagged Picks the filters and their order. Below, in a C&C view frame, a new
          Straighten filter drops into the line between Crop and Blur faces, marked New, while
          Brighten, Crop, Blur faces, and Watermark turn green, marked Unchanged.
  - id: buys
    part: Consequences
    outline: What it buys
    label: "Consequences: reuse, recombine, speed up"
    title: What independent filters buy
    purpose: Connect each benefit of the style to the rule that produces it.
    takeaway: >-
      Independent filters that ignore their neighbors and share a format are easy to reuse, add,
      replace, and test; incremental processing raises throughput.
    cues:
      - id: reuse
        say: >-
          Now the consequences, each of which follows from a rule. First, reusability. The robotics
          club inserts your denoise filter into its own pipeline, and it works unchanged.
          Independence guarantees that it shares no state with your other filters, and agnosticism
          guarantees that it never referred to its neighbors.
        step: Reusability
        note: Independent, neighbor-agnostic filters can be reused in other pipelines.
        source: >-
          CS 130 lecture 15, slide 20 (decoupling of filters and a universal interface promote
          reusability); Bass et al. 2013, section 13.2.
        visual: >-
          A quality card, Reusability, promoted, beside compact rule cards for Rule 1, Independence,
          and Rule 2, Agnosticism. Two C&C view frames: the photo desk's line, with photos flowing;
          and the robotics club's line: a «source» Robot camera, Denoise marked Unchanged, Detect
          obstacles, and a «sink» Steer. A label reads Rules 1 and 2: no shared state, no named
          neighbors.
      - id: change
        say: >-
          Second, modifiability and extensibility. Inserting Straighten required one new filter and
          one new pipe, and replacing Brighten with an auto-exposure filter of the same type changed
          nothing else, because no filter names its neighbors. Testability follows: since a filter
          shares no state, a test can feed it a known photo and check its output.
        step: Extensibility and modifiability
        note: Add or replace a filter without touching others; test each filter alone.
        source: >-
          CS 130 lecture 15, slide 20 (extensibility: insert a filter; modifiability: replace a filter
          without affecting the rest).
        visual: >-
          Quality cards read Modifiability and Extensibility, promoted, beside rule cards for Rule 2
          and Rule 1. In a C&C view frame, Brighten is replaced by Auto-exposure, marked Swapped in,
          in a line with Crop, a new Straighten filter marked Inserted, and Blur faces. A readout
          says Test, Blur faces alone: in, 3 faces; out, 3 blurred; passed. A sticker reads Changed
          nothing else, and a quality card reads Testability, promoted.
      - id: throughput
        say: >-
          Third, throughput, which follows from incremental processing. Because each filter passes
          every item on immediately, all filters work on different photos at once. In an allocation
          view that assigns each filter to its own processor core, the line completes up to five
          times as many photos per minute. The slowest filter sets the pace.
        pause_after: 2.5
        step: Throughput
        note: Filters run in parallel on different items; the slowest one sets the pace.
        source: >-
          CS 130 lecture 15, slide 21 (deploying active filters as separate threads or processes
          allows parallel processing); Clements et al. 2010, Table 4.1 (improving throughput with
          parallelization); Buschmann et al. 1996, Pipes and Filters, Consequences (parallel gains
          are often smaller than hoped). A pipeline's rate is limited by its slowest stage.
        visual: >-
          A quality card reads Performance: throughput, promoted, beside Rule 3, Incremental. An
          allocation view frame, labeled deployment, with a key: five nodes stereotyped «core», Core
          1 to Core 5, each holding one busy filter: Denoise, Brighten, Crop, Blur faces, and
          Watermark. A readout changes from One program: 30 photos per minute to The line: up to
          150, a label reads The slowest filter sets the pace, and a card titled Each benefit
          follows from a rule lists Reusability: Rules 1 and 2; Modifiability, testability: Rules 1
          and 2, one format; and Throughput: Rule 3.
  - id: costs
    part: Consequences
    outline: What it costs
    label: "Consequences: what pipelines are bad at"
    title: A slider, a slowdown, and a broken photo
    purpose: See the qualities the style inhibits, interactivity, latency, and error handling.
    takeaway: >-
      Pipelines resist interactive feedback, pay to convert data at every step, and make errors hard
      to handle.
    cues:
      - id: slider
        say: >-
          The same rules also inhibit some qualities. First, interactivity. The editor wants a
          brightness slider that updates every photo live, but each adjustment would have to travel
          back upstream to Brighten. Acyclic flow forbids such feedback loops: data flows only from
          source to sink. Interactive tools therefore fit this style poorly.
        step: Interactivity
        note: Each change re-runs items through the rest of a one-way line; feedback loops fit badly.
        source: >-
          CS 130 lecture 15, slide 20 (processing sequential streams without feedback loops cannot
          easily accommodate interactive user interfaces); Bass et al. 2013, Table 13.4.
        visual: >-
          An editor's Brightness slider moves back and forth beside Rule card 4, Acyclic. In a C&C
          view frame whose key adds not allowed, a dashed red connector tries to run from the slider
          back into Brighten in the middle of the line and is struck by a cross, labeled Rule 4: no
          feedback loops. A quality card reads Interactivity, inhibited.
      - id: latency
        say: >-
          Second, latency. Under independence, filters share nothing except the data in the pipes,
          so each filter must decode the image, perform its one task, and encode a new file for the
          next pipe. Five filters mean five decodes and five encodes: each photo takes longer than
          in one program, and repeated encoding degrades quality.
        step: Latency
        note: Converting to and from the common format at every filter adds time.
        source: >-
          CS 130 lecture 15, slide 21 (a lowest-common-denominator format forces every filter to parse
          and unparse data); Buschmann et al. 1996, Pipes and Filters, Consequences (data
          transformation overhead). Repeated lossy encoding degrades a JPEG image.
        visual: >-
          Rule card 1, Independence, at the top. In a C&C view frame, five filter components each
          list the same three steps in a compartment: decode, job, and encode. A readout says One
          photo through the line: 5 decodes, 5 encodes, then Slower than one program. A photo
          labeled After 5 encodes shows blocky patches, and a quality card reads Performance:
          latency, inhibited.
      - id: errors
        say: >-
          Third, error handling. Midway through the game, one corrupted photo crashes Blur faces.
          Which photos have left the line, and which remain in the pipes? Under independence and
          agnosticism, no filter holds shared state or knows its neighbors, so no component knows
          the global state. A restart may publish some photos twice.
        pause_after: 2.5
        step: Error handling
        note: With no shared state, recovering from a failed filter is hard.
        source: >-
          Buschmann et al. 1996, Pipes and Filters, Consequences (error handling is the Achilles' heel
          of the pattern); Bass et al. 2013, section 13.2 (the failure of any filter can cause the
          entire pipeline to fail).
        visual: >-
          Compact rule cards for Rule 1 and Rule 2 at the top. In a C&C view frame, a garbled photo
          slides into Blur faces, which turns red and dashed, marked Crashed. Dashed question marks
          sit below the pipes on both sides, a label reads No component knows the global state, a
          website card titled After a restart shows the same photo twice, captioned Posted and
          Twice, and a quality card reads Error handling, inhibited.
  - id: limits
    part: Consequences
    outline: Bent rules
    label: "Consequences: when rules bend"
    title: The best shot of the burst
    purpose: Recognize filters that break the style's rules, and decide when to choose pipes and filters.
    takeaway: >-
      A filter that needs all of its input, or state shared with another filter, breaks a rule and
      loses its benefit; choose pipes and filters for streams of independent steps.
    cues:
      - id: best_shot
        say: >-
          Some computations cannot be incremental. To keep only the best shot of each burst of ten,
          a filter must buffer all ten before it emits one, and a sort filter must read its entire
          input before producing any output. Downstream filters remain idle meanwhile, and the
          pipeline degrades toward a batch.
        step: Filters that must wait
        note: A filter that needs all its input stalls everything downstream.
        source: >-
          Fairbanks 2010, section 14.8 (sort must see the entire input before writing output, which
          breaks incremental computation); Buschmann et al. 1996, Pipes and Filters, Consequences.
        visual: >-
          A tray titled Best shot of the burst fills with photos, 1 of 10 up to 10 of 10, before
          passing anything on, and Rule card 3, Incremental, gets a crack. In a C&C view frame, Blur
          faces and Watermark wait, marked Waiting. A code card reads sort, which reads all input
          before writing any, and a sticker reads Back to a batch.
      - id: shared_state
        say: >-
          Other rules are bent deliberately. To caption players, a new filter reads the face
          filter's internal list of faces. This works, but it violates independence, and the two
          filters can no longer be reused separately or reordered freely. Each violated rule
          forfeits exactly the benefit that the rule provided.
        step: Bending independence
        note: Filters that share state can't be reused alone or reordered freely.
        source: >-
          Fairbanks 2010, section 14.2 (embodied styles violate constraints and lose the properties
          derived from them); Buschmann et al. 1996, Pipes and Filters, Consequences (sharing state
          information is expensive or inflexible).
        visual: >-
          Rule card 1, Independence, gets a crack. In a C&C view frame whose key adds hidden
          dependency, a Caption players filter, marked Reads its faces, sends a dashed red
          dependency arrow into the Blur faces filter, whose compartment lists faces_found, labeled
          Shared state. Red stickers read Can't reuse alone and Can't reorder.
      - id: when
        say: >-
          In summary, pipes and filters suits workloads that form a stream of items processed by
          steps that need no shared state: photos, audio, logs, sensor data, or lines of text. It
          suits interactive applications poorly, as well as computations whose steps must share
          large amounts of data.
        pause_after: 2.5
        step: When to choose it
        note: Choose it for streams of independent steps; avoid it for interactive or shared-state work.
        source: >-
          Clements et al. 2010, section 4.2.1 (data transformation systems broken into independent
          steps); Bass et al. 2013, Table 13.4 (not a good choice for interactive systems).
        visual: >-
          A green card, Good fit, lists Photos and video, Audio, Server logs, Sensor data, and Lines
          of text. A pink card, Poor fit, lists Interactive applications and Steps sharing lots of
          data. A banner reads Choose it for: streams of items through independent steps.
  - id: in_practice
    part: In practice
    outline: Real-world examples
    label: "In practice: where pipelines run"
    title: Real-world examples
    purpose: Recognize pipes and filters in systems from many domains, and explain why the style fits them.
    takeaway: >-
      Pipes and filters fits workloads that stream items through independent steps; real systems
      bend a rule only where a step cannot obey it.
    cues:
      - id: shell_gpu
        say: >-
          Pipes and filters appears beyond the photo desk. In a Unix shell, agnostic one-job tools
          are joined by pipes to count the most common words in a text. A graphics card renders
          every game frame as a pipeline: vertices are shaded, triangles rasterized into pixels, and
          pixels colored, many in parallel.
        step: Shell and graphics card
        note: A Unix shell pipeline and a GPU graphics pipeline are both chains of filters.
        source: >-
          McIlroy's 1964 memo on connecting programs like garden hose,
          https://www.nokia.com/bell-labs/about/dennis-m-ritchie/mdmpipe.html; The Bell System
          Technical Journal 57(6), 1978, UNIX foreword, p. 1902,
          https://archive.org/details/bstj57-6-1899 (make each program do one thing well; expect its
          output to become another, as yet unknown, program's input); Bentley, Knuth, and McIlroy
          1986, CACM 29(6), p. 480, https://doi.org/10.1145/5948.315654 (the word-count pipeline tr,
          tr, sort, uniq -c, sort -rn, sed, for the most common words of a text file); Garlan and
          Shaw 1994, CMU-CS-94-166, section 3.1,
          https://www.cs.cmu.edu/afs/cs/project/able/ftp/intro_softarch/intro_softarch.pdf (Unix
          shell programs as the best-known example; filters do not know their neighbors); Microsoft
          Direct3D 10 pipeline stages,
          https://learn.microsoft.com/en-us/windows/win32/direct3d10/d3d10-graphics-programming-guide-pipeline-stages
          (input assembler, vertex shader, rasterizer, pixel shader, output merger); rasterizer
          stage,
          https://learn.microsoft.com/en-us/windows/win32/direct3d11/d3d10-graphics-programming-guide-rasterizer-stage
          (each primitive becomes pixels); Owens 2005, GPU Gems 2, chapter 29,
          https://developer.nvidia.com/gpugems/gpugems2/part-iv-general-purpose-computation-gpus-primer/chapter-29-streaming-architectures
          (stages linked by data flow; each stage's output consumed at once; many independent
          elements in parallel).
        visual: >-
          Two C&C view frames, each with a key reading «filter» component, port, and «pipe»
          connector. Unix shell, operating systems: six filters joined by pipes, tr, tr, sort, uniq
          -c, sort -rn, and sed, labeled Rule 2: agnostic tools, reused in any text pipeline. GPU,
          games: Input assembler, Vertex shader, Rasterizer, Pixel shader, and Output merger,
          labeled Rule 3: each stage passes vertices and pixels straight on.
      - id: search_fraud
        say: >-
          Elasticsearch passes every document's text through an analyzer: character filters, a
          tokenizer, and token filters that can lowercase and stem words. By default the same chain
          processes each full-text query, so a search for running shoes can find a running shoe.
          Fraud detectors on Apache Flink judge each card payment as it streams in.
        step: Search and fraud detection
        note: One analyzer chain serves documents and queries; fraud detection judges each payment on arrival.
        source: >-
          Elastic, Anatomy of an analyzer,
          https://www.elastic.co/docs/manage-data/data-store/text-analysis/anatomy-of-an-analyzer
          (character filters, exactly one tokenizer, token filters, applied in order); Elastic,
          Specify an analyzer,
          https://www.elastic.co/docs/manage-data/data-store/text-analysis/specify-an-analyzer (by
          default a search uses the field's index analyzer); Elastic, term-level queries,
          https://www.elastic.co/docs/reference/query-languages/query-dsl/term-level-queries (not
          analyzed); Elastic, stemmer token filter,
          https://www.elastic.co/docs/reference/text-analysis/analysis-stemmer-tokenfilter (English
          by default, Porter); Apache Flink, Fraud detection with the DataStream API,
          https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/getting-started/datastream/
          (a transaction source, keyed by account, a fraud detector called for every transaction, an
          alert sink); Learn Flink,
          https://nightlies.apache.org/flink/flink-docs-release-1.20/docs/learn-flink/overview/
          (streaming dataflows of operators from sources to sinks; keyed state is local to each
          key).
        visual: >-
          Two C&C view frames. Elasticsearch, search: Char filter, Tokenizer, Lowercase, Stop words,
          and Stemmer, with a note, Same chain for full-text queries, labeled Reuse: indexing and
          search share one chain. Fraud detection, finance: a «source» Card payments, a pipe labeled
          keyed by account, a Fraud detector, and a «sink» Alerts, labeled Rule 3: each payment
          judged as it arrives.
      - id: radio_genomes
        say: >-
          Software radios turn antenna samples into music through a channel filter, a demodulator,
          and an audio filter, and GNU Radio has long enforced acyclic flow: its flowgraphs may
          contain no loops. Genomics labs run Nextflow pipelines for RNA sequencing, in which steps
          share no state, so each step can be tested and reused alone.
        step: Radios and genomes
        note: Software radios enforce acyclic flowgraphs; genome pipelines keep steps independent and testable.
        source: >-
          Blossom 2004, Linux Journal, https://www.linuxjournal.com/article/7319 (a radio as a graph
          of signal-processing blocks joined by data flow, from sources to sinks; the broadcast FM
          receiver: channel filter, quadrature demodulator, audio filter, sound card); GNU Radio 3
          flowgraph, https://www.gnuradio.org/doc/doxygen/classgr_1_1flowgraph.html and
          https://github.com/gnuradio/gnuradio/blob/main/gnuradio-runtime/lib/flowgraph.cc (a
          directed acyclic graph; the scheduler refuses a flow graph with loops); GNU Radio issue
          7908, https://github.com/gnuradio/gnuradio/issues/7908 (GNU Radio 3 is designed around
          acyclic graphs); GNU Radio 4, https://github.com/fair-acc/gnuradio4 (adds basic feedback
          loops); Garlan and Shaw 1994, section 3.1 (signal processing as a classic domain);
          Nextflow training, https://training.nextflow.io/2.2/basic_training/intro/ (processes are
          isolated, share no writable state, and communicate only through asynchronous FIFO
          channels); nf-core/rnaseq, https://nf-co.re/rnaseq/ (an RNA-sequencing pipeline: FastQC,
          Trim Galore!, STAR, Salmon, MultiQC on its default route, simplified here); nf-core module
          testing, https://nf-co.re/docs/developing/tutorials/writing-nf-core-modules/6-testing
          (every module has unit tests).
        visual: >-
          Two C&C view frames. GNU Radio, software radio: a «source» Antenna samples, Channel
          filter, FM demodulator, Audio filter, and a «sink» Sound card, labeled Rule 4: GNU Radio 3
          forbids loops. nf-core, RNA sequencing, simplified: FastQC, Trim Galore!, STAR, Salmon,
          and MultiQC, labeled Rule 1: no shared state, so each step is tested alone.
      - id: common_thread
        say: >-
          These systems share the workload the four rules assume: a stream of items transformed by
          independent steps. Where a step cannot obey them, the system bends a rule and pays for it:
          sort and the QC report wait for all their input, and the graphics card's last stage reads
          and writes shared buffers.
        pause_after: 2.5
        step: What they share
        note: Streams through independent steps fit the rules; steps that need all input or shared buffers bend them.
        source: >-
          GNU Coreutils, sort invocation,
          https://www.gnu.org/software/coreutils/manual/html_node/sort-invocation.html (sort
          normally reads all input before writing); nf-core/rnaseq MultiQC subworkflow (collects
          every step's QC files before the report); Nextflow collect operator,
          https://www.nextflow.io/docs/latest/reference/operator.html; MultiQC,
          https://docs.seqera.io/multiqc (a reporting tool for the end of a pipeline); Direct3D
          output-merger stage,
          https://learn.microsoft.com/en-us/windows/win32/direct3d11/d3d10-graphics-programming-guide-output-merger-stage
          (merges pixel output with the shared render target and depth buffer); Garlan and Shaw
          1994, p. 7 (a filter that needs all its input turns the system into a batch).
        visual: >-
          A card titled The shared workload reads A stream of items through independent steps. Below
          it, Rule card 3 sits over a card titled Waits for all its input, listing sort, in the Unix
          shell, and MultiQC, the QC report; Rule card 1 sits over a card titled Shared buffers,
          listing the GPU's output merger.
  - id: summary
    label: Summary
    title: One job each, one way through
    purpose: Recall the problem, the parts, the four rules, and the trade-offs.
    takeaway: >-
      Independent filters joined by one-way pipes buy reuse, easy change, and throughput, at a cost
      in interactivity, latency, and error handling.
    cues:
      - id: recap_problem
        say: >-
          Let's recap. The photo desk's script ran each step on all three thousand photos, saved
          folders of in-between files, and published nothing until midnight. Pipes and filters
          decomposes the job into filters, components that each perform one transformation, joined
          by pipes, connectors that carry a stream from a source to a sink.
        step: The problem and the parts
        note: A batch script becomes a line of filters joined by pipes.
        visual: >-
          The batch timeline, with the note Nothing online until midnight, is struck by a cross.
          Below it, in a C&C view frame, the line of five filters runs with photos flowing, with
          callouts Filter: a component and Pipe: a connector, and a website card fills with finished
          photos.
      - id: recap_rules
        say: >-
          Four rules give the style its power: filters share no state, ignore their neighbors, pass
          each item on immediately, and send data one way only. Independence and agnosticism promote
          reusability and modifiability; incremental processing promotes throughput; and acyclic
          flow promotes simple reasoning: the line's behavior is the composition of its filters.
        step: Four rules
        note: Independence, agnosticism, incremental processing, and acyclic flow.
        visual: >-
          Four compact rule cards in a row: Rule 1, Independence; Rule 2, Agnosticism; Rule 3,
          Incremental; and Rule 4, Acyclic. A bracket under the first two reads Rules 1 and 2, and
          promoted quality cards sit under the rules they follow from: Reusability and Modifiability
          under Rules 1 and 2, Throughput under Rule 3, and Simple reasoning under Rule 4. A sticker
          reads As long as you keep the rules.
      - id: recap_costs
        say: >-
          The same rules inhibit three qualities. Interactivity: acyclic flow forbids feedback
          upstream. Latency: under independence, every filter decodes and re-encodes each item.
          Error handling: no filter knows the global state when one fails. Next time you write one
          giant loop over a list, ask: could each step be its own filter?
        pause_after: 2.5
        step: The trade-off
        note: It inhibits interactivity, latency, and error handling.
        visual: >-
          A balance with two pans in the quality cards' colors, each quality with the rule it
          follows from and why. The green Promoted pan lists Reusability, Rules 1, 2: a filter needs
          only its input and output; Modifiability, Rule 2: change one filter, and no neighbor
          changes; Throughput, Rule 3: all filters work at once on different items; and
          Simple reasoning, Rule 4: the line's behavior composes its filters. The pink Inhibited
          pan fills: Interactivity, Rule 4: no feedback upstream; Latency, Rule 1: every filter
          decodes and re-encodes; and Error handling, Rules 1, 2: no filter knows the global state.
          A last sticker asks Could each step be its own filter?
