title: The State pattern in a game companion
audio: /assets/audio/state-pattern.mp3
captions: /assets/narration/state-pattern.vtt
script: /assets/narration/state-pattern.txt
voice: af_heart
speed: 0.95
pronunciations:
  UML: U M L
  C++: C plus plus
  enum: E num
  ConcreteState: concrete state
  DogState: dog state
  throwBall: throw ball
  setState: set state
languages: [python, java, cpp, typescript]
default_language: python
example_order: [state, context, states, wire]
diagrams:
  lifecycle:
    type: state
    label: Companion dog state machine
    description: A new dog starts in Following. throwBall() moves it to Fetching. In Fetching, tick() returns it to Following while it has energy left and moves it to Napping when no energy is left. In Napping, whistle() returns it to Following.
    caption: 'Each rounded box is a state; each arrow is a transition labeled with its event and, in square brackets, a guard on the dog''s data. Events that leave the state unchanged, such as whistle() in Fetching, are not drawn.'
    source: |
      @startuml
      layout horizontal
      state Following
      state Fetching
      state Napping
      [*] --> Following
      Following --> Fetching : throwBall()
      Fetching --> Following : tick() [energy left]
      Fetching --> Napping : tick() [no energy left]
      Napping --> Following : whistle()
      @enduml
  roles:
    label: State pattern role diagram
    description: Context holds exactly one current State and offers request() and setState(next). State declares handle(context). ConcreteState implements State and calls setState(next) on the Context to make a transition.
    source: |
      @startuml
      layout horizontal
      class Context {
        - state: State
        + request()
        + setState(next)
      }
      interface State {
        + handle(context)
      }
      class ConcreteState {
        + handle(context)
      }
      Context --> "1" State : current
      ConcreteState ..|> State
      ConcreteState ..> Context : setState(next)
      @enduml
  solution:
    label: State solution structure
    description: Dog holds its energy and one current DogState, and forwards throwBall(), whistle(), and tick() to it. Following, Fetching, and Napping each implement DogState. Dog does not depend on the concrete state classes.
    caption: 'Dog plays Context; DogState plays State; Following, Fetching, and Napping play Concrete State. The Context depends only on the State interface.'
    source: |
      @startuml
      class Dog {
        + energy
        - state: DogState
        + throwBall()
        + whistle()
        + tick()
        + setState(next)
      }
      interface DogState {
        + throwBall(dog)
        + whistle(dog)
        + tick(dog)
      }
      class Following
      class Fetching
      class Napping
      Dog --> "1" DogState : current
      Following ..|> DogState
      Fetching ..|> DogState
      Napping ..|> DogState
      @enduml
  sequence:
    type: sequence
    label: Sequence of the traced inputs
    description: The game calls throwBall() on dog, and dog forwards it to the shared Following object, which calls setState(fetching) on dog. The game calls throwBall() again, and dog forwards it to the Fetching object, which changes nothing. The game calls tick(), and dog forwards it to the Fetching object, which calls setState(following) on dog.
    caption: 'Each input goes to whichever state object is current. The messages appear as the narration reaches them; the panel below shows each reaction.'
    # A diagram with steps lists its lifelines in source; each cue shows the
    # first diagram_steps message groups (all of them by default).
    source: |
      @startuml
      participant game
      participant dog: Dog
      participant following as : Following
      participant fetching as : Fetching
    steps:
      - |
        game -> dog: throwBall()
        activate dog
        dog -> following: throwBall(dog)
        activate following
        following -> dog: setState(fetching)
        activate dog
        deactivate dog
        deactivate following
        deactivate dog
      - |
        game -> dog: throwBall()
        activate dog
        dog -> fetching: throwBall(dog)
        activate fetching
        deactivate fetching
        deactivate dog
      - |
        game -> dog: tick()
        activate dog
        dog -> fetching: tick(dog)
        activate fetching
        fetching -> dog: setState(following)
        activate dog
        deactivate dog
        deactivate fetching
        deactivate dog
scenes:
  - id: intro
    label: How a pattern is described
    title: A pattern is more than its classes
    purpose: Preview the parts of every pattern description.
    takeaway: A pattern pairs a problem that recurs in a context with a solution and its consequences.
    ui: true
    cues:
      - text: "Imagine you are building the companion dog in a video game. The dog is following the player, and the player throws a ball. The dog sprints after it."
        step: A throw while following
        note: 'Following: throwBall() → runs after the ball'
        visual: A companion panel shows the dog Biscuit, now Fetching with energy 2 of 2. The last input was Throw ball, and Biscuit runs after the ball.
        ui_state: throw_following
      - text: "Later, after two rounds of fetch, the dog is out of energy and naps. The player throws again, and the dog keeps snoring. Same input, different reaction: the reaction depends on the dog's current state."
        step: The same throw while napping
        note: 'Napping: throwBall() → keeps snoring'
        visual: The panel now shows Biscuit Napping with energy 0 of 2. The last input was Throw ball, and Biscuit keeps snoring.
        ui_state: throw_napping
      - text: "Design patterns capture proven solutions to problems like this one. Every pattern description has the same backbone. The context is the situation in which a problem recurs. The problem states what makes it hard. The solution describes abstract roles and how they collaborate. And the consequences state what the solution costs and buys. We will learn the State pattern in exactly that order. Choose a code language above; the explanation is the same in every language."
        step: Context, problem, solution, consequences
        note: Context → Problem → Solution (roles, collaborations) → Consequences
        visual: The napping panel remains visible. The language selector changes only the code, not the narration.
        ui_state: throw_napping
  - id: context
    part: Context
    label: 'Context: behavior that depends on state'
    title: When does the State pattern apply?
    purpose: Recognize the situation that the State pattern addresses.
    diagram: lifecycle
    takeaway: 'The context: several operations of one object depend on a state that changes at runtime.'
    cues:
      - text: "First, the context. The State pattern applies when an object's behavior depends on its state, and that state changes at runtime. A UML state machine diagram shows such an object. Rounded boxes are states, arrows are transitions labeled with events, and a new dog starts in Following."
        step: An object with changing states
        note: A new dog starts in Following.
        visual: A UML state machine diagram shows Following, Fetching, and Napping. An arrow from the initial pseudostate points to Following, which is hatched and highlighted.
        diagram_focus: Following
      - text: "Throwing a ball moves the dog to Fetching. On the next game tick, a guard in square brackets decides the transition: with energy left, the dog returns to Following; with no energy left, it naps. A whistle wakes a napping dog."
        step: Events and guarded transitions
        note: Fetching –tick() [energy left]→ Following · Fetching –tick() [no energy left]→ Napping
        visual: Fetching is highlighted. Two tick() transitions leave it, one guarded by energy left and one by no energy left.
        diagram_focus: Fetching
      - text: "Two more signs place us in this context. Several operations, not just one, react differently in each state. And new states keep arriving, as designers add swimming, guarding, or begging. One warning about words: the pattern also names one of its roles Context. The pattern's context is a situation; the Context role is an object."
        step: Signs of this context
        note: Several state-dependent operations · new states keep arriving · context ≠ the Context role
        visual: Napping is highlighted, with its whistle() transition back to Following.
        diagram_focus: Napping
  - id: problem
    part: Problem
    label: 'Problem: state checks everywhere'
    title: Every method checks the mode
    purpose: Name the forces that make state-dependent code hard to change.
    code: problem
    table: true
    takeaway: 'The problem: change behavior with state without scattering state checks through every operation.'
    cues:
      - text: "Now the problem. Here is a direct implementation. The dog stores its mode as a value, and throwBall checks it: a following dog starts to fetch, a fetching dog keeps chasing the first ball, and a napping dog keeps snoring."
        step: throwBall() checks the mode
        note: Each branch of throwBall() fills one cell of the throwBall() column.
        visual: The throwBall method's three branches are marked beside a table of reactions by state and input. The throwBall() column of the table is marked.
        focus: throw
        table_focus: {column: throw_ball}
      - text: "Whistle repeats the same three-way check with different reactions, and only its napping branch changes the mode."
        step: whistle() repeats the check
        note: Only the napping branch of whistle() changes the mode.
        visual: The whistle method is marked. The whistle() column of the table is marked.
        focus: whistle
        table_focus: {column: whistle}
      - text: "Tick repeats the check a third time. Notice the shape: in the table of reactions, each method is one column, and every mode appears in every column. The rules for one state, a single row of the table, are scattered across all three methods."
        step: tick() repeats it again
        note: Three methods × three modes — one state's rules sit in three places.
        visual: The tick method is marked. The tick() column of the table is marked.
        focus: tick
        table_focus: {column: tick}
      - text: "Your team wants a zoomies mode: after a nap, the dog sometimes races around in circles. Before continuing, predict which methods you must edit, and what the dog does if someone forgets one of them. Pause here if you want more thinking time."
        step: Predict the cost of a new mode
        note: Which methods change when a zoomies mode is added?
        visual: The whole class remains beside the table. Nothing is marked while the learner predicts.
        prediction: true
        pause_after: 6
      - text: "Every method changes, and the else branches are a trap: each one treats an unknown mode as napping, so a forgotten branch makes a dog with the zoomies snore. That is the problem in pattern terms: how can an object change its behavior when its state changes, without scattering state checks through every operation? The forces: keep each state's rules together, make transitions explicit, add states without editing every operation, and avoid classes that do not pay for themselves."
        step: The problem and its forces
        note: Keep each state's rules together · explicit transitions · add states locally · no needless classes
        visual: The three else branches are marked. The Napping row of the table is marked, because each else branch supplies one of its cells.
        focus: fallback
        table_focus: {row: napping}
        pause_after: 3
  - id: solution
    part: Solution
    label: 'Solution: one object per state'
    title: Delegate to an object that represents the state
    purpose: Learn the solution's three abstract roles before reading the code.
    diagram: roles
    takeaway: 'The solution: a Context delegates state-dependent requests to its current State object.'
    cues:
      - text: "The solution: represent each state as an object, and let the object whose behavior changes delegate to its current state object. A pattern describes its solution with abstract roles, not concrete classes. The Context role is the object clients use. It holds exactly one current state and forwards every state-dependent request to it."
        step: Context — the object clients use
        note: Context holds exactly one current State and delegates to it.
        visual: A UML class diagram shows the State pattern's roles. Context is hatched and highlighted; its association points to exactly one State.
        diagram_focus: Context
      - text: "The State role is an interface with one operation for each request that the Context forwards. The Context passes itself along, so a state object can read the Context's data or change its state."
        step: State — one operation per request
        note: Every state object answers the same operations.
        visual: The State interface is hatched and highlighted, including its handle(context) operation.
        diagram_focus: State
      - text: "The ConcreteState role implements those operations for one state. To make a transition, a ConcreteState calls the Context's setState with the next state object. The dashed arrow with a hollow triangle shows that a ConcreteState fulfills the State interface. Many classes can play this one role."
        step: Concrete State — one state's behavior
        note: A Concrete State may call setState(next) to make a transition.
        visual: ConcreteState is highlighted. Its realization arrow points to State, and a dependency labeled setState(next) points to Context.
        diagram_focus: ConcreteState
      - text: "Roles let you recognize the pattern in any code. In our game, Dog will play Context, DogState plays State, and Following, Fetching, and Napping play ConcreteState. To the player, the dog seems to change its class, yet only one reference changes."
        step: Map roles to classes
        note: Dog → Context · DogState → State · Following, Fetching, Napping → Concrete State
        visual: Context is highlighted again; its single association to State is the reference that changes.
        diagram_focus: Context
  - id: state_role
    part: Solution
    label: 'Solution: the State role in code'
    title: One operation for each state-dependent request
    purpose: See how the State role becomes an interface.
    code: state
    diagram: solution
    takeaway: The State role lists every request whose behavior depends on the state.
    cues:
      - text: "Now the solution in code, one role at a time. DogState plays the State role. It declares one operation for each input: throwBall, whistle, and tick. Each receives the dog and returns its reaction, which the game can animate."
        step: DogState plays State
        note: throwBall(dog), whistle(dog), and tick(dog) each return the dog's reaction.
        visual: The DogState declaration and its three operations are marked. DogState is highlighted in the solution class diagram beside the code.
        focus: contract
        diagram_focus: DogState
      - text: "Every Concrete State must implement all three operations. Java, C++, and TypeScript check this when compiling, and Python refuses to create a state object with a missing operation. The else branches, by contrast, silently accepted any mode."
        step: A missing reaction becomes an error
        note: An unimplemented operation is reported; an else branch hid it.
        visual: The three operation signatures stay marked. DogState remains highlighted in the solution class diagram.
        focus: contract
        diagram_focus: DogState
  - id: context_role
    part: Solution
    label: 'Solution: the Context role in code'
    title: Forward requests to the current state
    purpose: See how the Context role delegates instead of checking modes.
    code: context
    diagram: solution
    takeaway: The Context role holds the current state and forwards requests; it no longer checks modes.
    cues:
      - text: "Dog plays the Context role. It keeps the data that belongs to the dog, its energy, and a reference to its current state object, initially the shared Following object."
        step: Dog plays Context
        note: One state field replaces the mode value; energy stays in the dog.
        visual: The energy and state fields are marked. Dog is highlighted in the solution class diagram.
        focus: field
        diagram_focus: Dog
      - text: "Each request is now a single line that forwards the call to the current state, passing the dog along. No mode check is left, and the Context no longer knows what a whistle means in any state."
        step: Forward with no conditions
        note: throwBall(), whistle(), and tick() each delegate to the current state.
        visual: The three forwarding methods are marked. Dog is highlighted in the solution class diagram.
        focus: delegate
        diagram_focus: Dog
      - text: "setState replaces the current state object. Concrete States call it to make transitions, while clients only send inputs. A transition is one assignment of one reference."
        step: setState for transitions
        note: Concrete States call setState(next); clients only send inputs.
        visual: The setState method is marked. Dog is highlighted in the solution class diagram.
        focus: set_state
        diagram_focus: Dog
  - id: concrete_roles
    part: Solution
    label: 'Solution: the Concrete State role'
    title: Each state class owns its rules
    purpose: Move each mode's branches into the class that plays its Concrete State role.
    code: states
    table: true
    takeaway: Each Concrete State is one row of the table, one state's reaction to every request.
    cues:
      - text: "Following, Fetching, and Napping each play the ConcreteState role. Following collects every following branch from the old methods: a throw switches to the shared Fetching object, while a whistle and a tick only animate. It is one row of the table. Moving the branches one method at a time, with tests after each move, keeps every reaction the same."
        step: Following — the first row
        note: throwBall() moves to Fetching; whistle() and tick() only react.
        visual: The Following class is marked. The Following row of the table is marked.
        focus: following
        table_focus: {row: following}
      - text: "Fetching ignores throws and whistles. Its tick spends one energy and then calls setState with Napping or Following. That energy check is a guard on data, not a state check, so it rightly stays."
        step: Fetching — a guard stays
        note: tick() spends energy, then moves to Napping or Following.
        visual: The Fetching class is marked, including its energy check and two setState calls. The Fetching row of the table is marked.
        focus: fetching
        table_focus: {row: fetching}
      - text: "Napping snores through throws and ticks, and its whistle restores the energy and returns to Following. Each transition now sits in the state it leaves."
        step: Napping — the third row
        note: whistle() restores energy and moves to Following.
        visual: The Napping class is marked. The Napping row of the table is marked.
        focus: napping
        table_focus: {row: napping}
      - text: "These state objects store no data of their own, because the energy lives in the dog. So every dog can share one object per state, as the marked lines show. Creating a new state object on each transition would also work. Sharing is safe only while states stay stateless, which is also why each operation receives the dog as a parameter."
        step: Share stateless state objects
        note: No per-dog data → one shared object per state; the dog arrives as a parameter.
        visual: The lines that create one shared object per state are marked. No row of the table is marked.
        focus: shared
  - id: collaborations
    part: Solution
    label: 'Solution: how the roles collaborate'
    title: The same call reaches a different object
    purpose: Predict which state object answers each request at runtime.
    code: wire
    diagram: sequence
    ui: true
    takeaway: The Context delegates to its current state, and a transition changes which object that is.
    cues:
      - text: "A solution also describes how its roles collaborate at runtime. The game creates a dog, and the player throws a ball. The sequence diagram shows the delegation: Dog forwards throwBall to the Following object, which calls setState with the Fetching object and answers: runs after the ball."
        step: throwBall() reaches Following
        note: 'Following calls setState(fetching) · the dog runs after the ball'
        visual: The first throw is marked. A UML sequence diagram shows game, dog, and the shared Following and Fetching objects; dog forwards throwBall to the Following object, which is highlighted and calls setState(fetching) on dog. The panel shows Biscuit Fetching.
        focus: first_throw
        diagram_focus: following
        diagram_steps: 1
        ui_state: throw_following
      - text: "The player throws a second ball, exactly as before. Predict which object answers, and what the dog does. Pause the narration if you want more thinking time."
        step: Predict the second throwBall()
        note: The same call as before. Which object answers now?
        visual: The second throw is marked. The sequence diagram still ends after the first throw, so the answer is not shown yet. The panel shows Biscuit Fetching.
        focus: second_throw
        diagram_steps: 1
        ui_state: throw_following
        prediction: true
        pause_after: 6
      - text: "This time Dog forwards throwBall to the Fetching object, which changes nothing and answers: keeps chasing the first ball. The same call reached a different object, and the client never asked which state the dog was in."
        step: The same call, a different object
        note: 'Fetching answers · the dog keeps chasing the first ball'
        visual: The second throw is marked. The sequence diagram adds the second throwBall, which dog forwards to the Fetching object; it is highlighted and changes nothing. The panel shows Biscuit still Fetching.
        focus: second_throw
        diagram_focus: fetching
        diagram_steps: 2
        ui_state: throw_fetching
      - text: "On the next tick, Fetching spends one energy and, with energy left, calls setState with the Following object. Three collaborations define the pattern: the Context delegates, the Context passes itself along, and the current state decides what comes next."
        step: Three collaborations
        note: Context delegates · Context passes itself · the current state picks the next state
        visual: The tick call is marked. The sequence diagram adds tick, which dog forwards to the Fetching object; it calls setState(following) on dog. The panel shows Biscuit Following with energy 1 of 2.
        focus: tick
        diagram_focus: fetching
        diagram_steps: 3
        ui_state: tick_fetching
  - id: consequences
    part: Consequences
    label: 'Consequences: benefits and liabilities'
    title: Localized states, more classes
    purpose: Weigh what the pattern makes easy against what it makes harder.
    takeaway: Every pattern trades benefits for liabilities; State favors adding states over adding requests.
    cards:
      - title: 'Benefit: localized states'
        text: Each state's reactions live in one class; a new state is one class plus its incoming transitions.
      - title: 'Benefit: explicit transitions'
        text: Each transition is a named call in the state it leaves; changing state swaps one reference.
      - title: 'Liability: more classes, spread transitions'
        text: States depend on their successors, and a new request must be added to every state.
    cues:
      - text: "Finally, the consequences, which every pattern description must state. The first benefit: State localizes state-specific behavior. Each state's reactions live in one class, so adding a state means writing one class and editing only the transitions that lead into it."
        step: 'Benefit: localized states'
        note: One new class, plus the transitions into it.
        visual: The first card states the benefit of localized states.
      - text: "The second benefit: transitions become explicit. Each one is a named call in the state it leaves, and switching states replaces one reference, so the object never holds half of an old state and half of a new one. Stateless state objects can even be shared."
        step: 'Benefit: explicit transitions'
        note: A transition is one named call that swaps one reference.
        visual: The second card states the benefit of explicit transitions.
      - text: "The liabilities: more classes, with transitions spread across them, so states depend on their successors and no single class shows the whole lifecycle. Keep the state machine diagram as the map. And a new request, such as feeding a treat, must be added to the interface and to every state. State is a bet that states will change more often than requests."
        step: 'Liabilities: more classes, spread transitions'
        note: Group by state when states change more often than requests.
        visual: The third card states the liabilities — more classes, dependent states, and a costly new request.
  - id: applicability
    part: Context
    label: 'Context revisited: when to use State'
    title: Does behavior really vary by state?
    purpose: Decide whether the State pattern's context holds before applying it.
    takeaway: Apply State only where its context holds; otherwise choose a simpler design.
    cards:
      - title: A good fit
        text: Several states with distinct behavior across several requests, and states that keep being added.
      - title: Simpler alternatives
        text: A few stable states — extracted methods or exhaustive, checked switches. States that differ only in where they go next — a transition table.
      - title: Not Strategy
        text: A client chooses a Strategy; State objects replace one another as events occur.
    cues:
      - text: "Consequences tell us when a pattern pays off, so revisit the context. State fits when several states have distinct behavior across several requests and new states keep arriving, as with game characters that gain swimming, guarding, or fleeing."
        step: When the context holds
        note: Several states × several requests × states that keep being added.
        visual: The first card describes a good fit for the State pattern.
      - text: "With a few stable states, conditionals can be clearer, especially an enum with switches that your compiler or type checker can prove exhaustive. Try simpler refactorings first, such as extracting a method. If states differ only in where they go next, a transition table may be simpler. And if effects can stack, such as soaked and sleepy at once, one current state cannot represent them."
        step: When a simpler design wins
        note: Few stable states, transition-only behavior, or stacking effects — start simpler.
        visual: The second card describes simpler alternatives — checked switches and transition tables.
      - text: "State and Strategy share the same structure, a Context delegating through an interface, but their contexts differ. A client chooses a Strategy, while State objects replace one another as events occur, usually without the client noticing."
        step: State versus Strategy
        note: Same structure, different context — State objects drive their own replacement.
        visual: The third card contrasts State with Strategy.
  - id: transfer
    label: Apply the pattern
    title: Add the zoomies
    purpose: Apply the pattern's roles to a new state before seeing an answer.
    takeaway: A new state is one new Concrete State plus the transitions into it.
    cards:
      - title: Zoomies
        text: A whistle wakes a napping dog into the zoomies instead of a calm walk.
      - title: Its reactions
        text: Tick races one lap, then follows. Throw starts fetching at once. Whistle is ignored.
      - title: Your task
        text: Name the class you add and every existing line that changes.
    cues:
      - text: "One last design check. A whistle should now wake a napping dog into the zoomies. A dog with the zoomies races one lap on its next tick and then follows. It chases a thrown ball at once and ignores whistles. Which class do you add, and which existing code changes? Explain your answer before continuing."
        step: Plan the change
        note: Name the new class and every existing line that changes.
        visual: Three cards describe the zoomies, its reactions, and the task. No answer is shown.
        prediction: true
        pause_after: 6
      - text: "Add a Zoomies class that plays the ConcreteState role with all three reactions. The only existing line that changes is the transition into it: Napping's whistle now calls setState with the Zoomies object. DogState, Dog, Following, and Fetching stay unchanged, because no new request was needed."
        step: One new class, one changed transition
        note: Zoomies plays Concrete State; only Napping.whistle() changes.
        visual: The three cards remain; the narration names the Zoomies class and the one changed transition.
  - id: summary
    label: 'Summary: the whole pattern'
    title: Context, problem, solution, consequences
    purpose: Recall every part of the State pattern before the summary quiz.
    takeaway: Context, problem, solution, and consequences make up the mental model for every pattern.
    cards:
      - title: Context
        text: Several operations of one object depend on a state that changes at runtime, and new states keep arriving.
      - title: Problem
        text: State checks scattered through every operation keep one state's rules apart and make every new state touch every method.
      - title: Solution
        text: A Context delegates to its current State object; Concrete States implement one state each and choose the next state.
      - title: Consequences
        text: Localized states and explicit transitions, at the cost of more classes, spread transitions, and costly new requests.
    cues:
      - text: "To finish, recall the whole pattern. Context: one object's behavior in several operations depends on a state that changes at runtime. Problem: state checks scattered through every operation. Solution: a Context delegates to its current State object, and each Concrete State implements one state and chooses the next. Consequences: localized states and explicit transitions, at the cost of more classes, spread transitions, and costly new requests. The summary quiz checks each part on a new example. Bring this mental model to every pattern you learn."
        step: The State pattern in four parts
        note: Context → Problem → Solution → Consequences
        visual: Four cards summarize the State pattern's context, problem, solution, and consequences.
