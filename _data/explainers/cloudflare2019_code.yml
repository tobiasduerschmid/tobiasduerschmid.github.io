    skips_rule:
      file: waf/rule.h
      source: |
        #pragma once
        #include <regex>
        #include <string>

        // Teaching model of the rule's core, not the real rule:
        // two skips over any characters, then an equals sign.
        inline const std::regex skipsThenEquals(".*.*=");

        inline bool inspect(const std::string& text) {
            // match_continuous keeps the starting position fixed.
            return std::regex_search(text, skipsThenEquals,
                std::regex_constants::match_continuous);
        }
      focus: {pattern: [7], match: [11, 12]}
    skips_search:
      file: waf/backtrack.h
      source: |
        #pragma once
        #include <string>

        struct Result { bool found; int checks; };

        // The search a backtracking engine runs for .*.*=
        inline Result backtrack(const std::string& text) {
            int checks = 0;
            const int n = static_cast<int>(text.size());
            for (int first = n; first >= 0; --first) {
                const int rest = n - first;
                for (int second = rest; second >= 0; --second) {
                    ++checks;  // one candidate equals check
                    const int at = first + second;
                    if (at < n && text[at] == '=')
                        return {true, checks};
                }
            }
            return {false, checks};  // absent
        }
      focus: {first: [10], second: [11, 12], count: [8, 13], check: [14, 15, 16], absent: [19]}
typescript:
  label: TypeScript
  blocks:
    skips_rule:
      file: waf/rule.ts
      source: |
        // Teaching model of the rule's core, not the real rule:
        // two skips over any characters, then an equals sign.
        export const SKIPS_THEN_EQUALS = /^.*.*=/;

        export function inspect(text: string): boolean {
          // ^ keeps the starting position fixed.
          return SKIPS_THEN_EQUALS.test(text);
        }
      focus: {pattern: [3], match: [7]}
    skips_search:
      file: waf/backtrack.ts
      source: |
        // The search a backtracking engine runs for .*.*=
        export function backtrack(text: string) {
          let checks = 0;
          const n = text.length;
          for (let first = n; first >= 0; first--) {
            const rest = n - first;
            for (let second = rest; second >= 0; second--) {
              checks++; // one candidate equals check
              const at = first + second;
              if (at < n && text[at] === "=")
                return { found: true, checks };
            }
          }
          return { found: false, checks }; // absent
        }
      focus: {first: [5], second: [6, 7], count: [3, 8], check: [9, 10, 11], absent: [14]}
