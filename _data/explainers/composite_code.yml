typescript:
  label: TypeScript
  filename: composite-demo.ts
  note: Playable is a TypeScript interface. Readonly fields keep a song unchanged, so several playlists can share one.
  imports: |
    export {};
  blocks:
    problem:
      source: |
        class Song {
          readonly title: string;
          readonly seconds: number;

          constructor(title: string, seconds: number) {
            this.title = title;
            this.seconds = seconds;
          }
        }

        class Playlist {
          readonly name: string;
          private readonly songs: Song[] = [];
          private readonly playlists: Playlist[] = [];

          constructor(name: string) {
            this.name = name;
          }

          addSong(song: Song): void { this.songs.push(song); }
          addPlaylist(playlist: Playlist): void { this.playlists.push(playlist); }

          duration(): number {
            let total = 0;
            for (const song of this.songs) total += song.seconds;
            for (const playlist of this.playlists) total += playlist.duration();
            return total;
          }

          play(queue: string[]): void {
            for (const song of this.songs) queue.push(song.title);
            for (const playlist of this.playlists) playlist.play(queue);
          }
        }

        class PlayButton {
          private readonly item: Song | Playlist;

          constructor(item: Song | Playlist) {
            this.item = item;
          }

          press(): string[] {
            const queue: string[] = [];
            if (this.item instanceof Song) {
              queue.push(this.item.title);
            } else {
              this.item.play(queue);
            }
            return queue;
          }
        }
