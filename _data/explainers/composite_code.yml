java:
  label: Java
  filename: CompositeDemo.java
  note: Tile is our own interface, and records let two stories share one photo. draw adds one text line per tile, which the collage paints as a tile.
  imports: |
    import java.util.ArrayList;
    import java.util.List;
  blocks:
    area:
      source: |
        enum Direction { SIDE_BY_SIDE, STACKED }

        record Area(int x, int y, int width, int height) {
            static final Area STORY = new Area(0, 0, 1080, 1920);

            Area part(int index, int count, Direction direction) {
                if (direction == Direction.SIDE_BY_SIDE) {
                    int partWidth = width / count;
                    return new Area(x + index * partWidth, y, partWidth, height);
                }
                int partHeight = height / count;
                return new Area(x, y + index * partHeight, width, partHeight);
            }

            @Override
            public String toString() {
                return width + "x" + height + " at " + x + "," + y;
            }
        }
      focus:
        part: [6, 7, 8, 9, 10, 11, 12, 13]
    problem:
      source: |
        record Photo(String name) {}

        final class Split {
            private final Direction direction;
            private final List<Object> items = new ArrayList<>();

            Split(Direction direction) {
                this.direction = direction;
            }

            void add(Object item) {
                items.add(item);
            }

            void draw(Area area, List<String> canvas) {
                for (int index = 0; index < items.size(); index++) {
                    Area part = area.part(index, items.size(), direction);
                    Object item = items.get(index);
                    if (item instanceof Photo photo) {
                        canvas.add(photo.name() + " " + part);
                    } else if (item instanceof Split split) {
                        split.draw(part, canvas);
                    }
                }
            }

            int photoCount() {
                int count = 0;
                for (Object item : items) {
                    if (item instanceof Photo) {
                        count += 1;
                    } else if (item instanceof Split split) {
                        count += split.photoCount();
                    }
                }
                return count;
            }
        }

        final class ShareButton {
            private final Object selection;

            ShareButton(Object selection) {
                this.selection = selection;
            }

            List<String> press() {
                List<String> canvas = new ArrayList<>();
                if (selection instanceof Photo photo) {
                    canvas.add(photo.name() + " " + Area.STORY);
                } else if (selection instanceof Split split) {
                    split.draw(Area.STORY, canvas);
                }
                return canvas;
            }
        }
