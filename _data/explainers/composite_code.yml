python:
  label: Python
  filename: composite_demo.py
  note: An abstract base class makes the Playable role explicit. Songs are frozen dataclasses, so they never change and several playlists can share one.
  imports: |
    from __future__ import annotations

    from abc import ABC, abstractmethod
    from dataclasses import dataclass
  blocks:
    problem:
      source: |
        @dataclass(frozen=True)
        class Song:
            title: str
            seconds: int


        class Playlist:
            def __init__(self, name: str) -> None:
                self.name = name
                self.songs: list[Song] = []
                self.playlists: list[Playlist] = []

            def add_song(self, song: Song) -> None:
                self.songs.append(song)

            def add_playlist(self, playlist: Playlist) -> None:
                self.playlists.append(playlist)

            def duration(self) -> int:
                total = 0
                for song in self.songs:
                    total += song.seconds
                for playlist in self.playlists:
                    total += playlist.duration()
                return total

            def play(self, queue: list[str]) -> None:
                for song in self.songs:
                    queue.append(song.title)
                for playlist in self.playlists:
                    playlist.play(queue)


        class PlayButton:
            def __init__(self, item: Song | Playlist) -> None:
                self.item = item

            def press(self) -> list[str]:
                queue: list[str] = []
                if isinstance(self.item, Song):
                    queue.append(self.item.title)
                else:
                    self.item.play(queue)
                return queue
