python:
  label: Python
  filename: composite_demo.py
  note: An abstract base class makes the Tile role explicit, and frozen dataclasses let two stories share one photo. draw adds one text line per tile, which the collage paints as a tile. Plain Python reports add on a Photo when the call runs; a type checker reports it earlier.
  imports: |
    from __future__ import annotations

    from abc import ABC, abstractmethod
    from dataclasses import dataclass
    from enum import Enum
  blocks:
    area:
      source: |
        class Direction(Enum):
            SIDE_BY_SIDE = "side by side"
            STACKED = "stacked"


        @dataclass(frozen=True)
        class Area:
            x: int
            y: int
            width: int
            height: int

            def part(self, index: int, count: int, direction: Direction) -> Area:
                if direction is Direction.SIDE_BY_SIDE:
                    width = self.width // count
                    return Area(self.x + index * width, self.y, width, self.height)
                height = self.height // count
                return Area(self.x, self.y + index * height, self.width, height)

            def __str__(self) -> str:
                return f"{self.width}x{self.height} at {self.x},{self.y}"


        STORY = Area(0, 0, 1080, 1920)
      focus:
        part: [13, 14, 15, 16, 17, 18]
    problem:
      source: |
        @dataclass(frozen=True)
        class Photo:
            name: str


        class Split:
            def __init__(self, direction: Direction) -> None:
                self.direction = direction
                self.items: list[Photo | Split] = []

            def add(self, item: Photo | Split) -> None:
                self.items.append(item)

            def draw(self, area: Area, canvas: list[str]) -> None:
                for index, item in enumerate(self.items):
                    part = area.part(index, len(self.items), self.direction)
                    if isinstance(item, Photo):
                        canvas.append(f"{item.name} {part}")
                    elif isinstance(item, Split):
                        item.draw(part, canvas)

            def photo_count(self) -> int:
                count = 0
                for item in self.items:
                    if isinstance(item, Photo):
                        count += 1
                    elif isinstance(item, Split):
                        count += item.photo_count()
                return count


        class ShareButton:
            def __init__(self, selection: Photo | Split) -> None:
                self.selection = selection

            def press(self) -> list[str]:
                canvas: list[str] = []
                if isinstance(self.selection, Photo):
                    canvas.append(f"{self.selection.name} {STORY}")
                elif isinstance(self.selection, Split):
                    self.selection.draw(STORY, canvas)
                return canvas
      focus:
        area: [15, 16]
        types: [2, 3, 8, 9, 11, 12]
        branches: [17, 18, 19, 20, 25, 26, 27, 28]
        client: [38, 39, 40, 41]
        changes: [17, 19, 25, 27, 38, 40]
    tile:
      source: |
        class Tile(ABC):
            @abstractmethod
            def draw(self, area: Area, canvas: list[str]) -> None: ...

            @abstractmethod
            def photo_count(self) -> int: ...
      focus:
        interface: [1, 2, 3, 5, 6]
        draw: [3]
    photo:
      source: |
        @dataclass(frozen=True)
        class Photo(Tile):
            name: str

            def draw(self, area: Area, canvas: list[str]) -> None:
                canvas.append(f"{self.name} {area}")

            def photo_count(self) -> int:
                return 1
      focus:
        requests: [5, 6, 8, 9]
