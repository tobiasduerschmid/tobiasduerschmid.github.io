java:
  label: Java
  filename: CompositeDemo.java
  note: Playable is our own interface. Song is a record, so it never changes and several playlists can share one.
  imports: |
    import java.util.ArrayList;
    import java.util.List;
  blocks:
    problem:
      source: |
        record Song(String title, int seconds) {}

        final class Playlist {
            private final String name;
            private final List<Song> songs = new ArrayList<>();
            private final List<Playlist> playlists = new ArrayList<>();

            Playlist(String name) {
                this.name = name;
            }

            void addSong(Song song) { songs.add(song); }
            void addPlaylist(Playlist playlist) { playlists.add(playlist); }

            int duration() {
                int total = 0;
                for (Song song : songs) total += song.seconds();
                for (Playlist playlist : playlists) total += playlist.duration();
                return total;
            }

            void play(List<String> queue) {
                for (Song song : songs) queue.add(song.title());
                for (Playlist playlist : playlists) playlist.play(queue);
            }
        }

        final class PlayButton {
            private final Object item; // a Song or a Playlist

            PlayButton(Object item) {
                this.item = item;
            }

            List<String> press() {
                List<String> queue = new ArrayList<>();
                if (item instanceof Song song) {
                    queue.add(song.title());
                } else if (item instanceof Playlist playlist) {
                    playlist.play(queue);
                }
                return queue;
            }
        }
      focus:
        lists: [5, 6, 12, 13]
        loops: [17, 18, 23, 24]
        order: [22, 23, 24, 25]
        client: [37, 38, 39, 40, 41]
        changes: [5, 6, 12, 13, 17, 18, 23, 24, 37]
    playable:
      source: |
        interface Playable {
            /** Total length in seconds. */
            int duration();

            /** Adds every title to the queue, in play order. */
            void play(List<String> queue);
        }
      focus:
        interface: [1, 3, 6]
        play: [5, 6]
    song:
      source: |
        record Song(String title, int seconds) implements Playable {
            @Override
            public int duration() {
                return seconds;
            }

            @Override
            public void play(List<String> queue) {
                queue.add(title);
            }
        }
      focus:
        requests: [3, 4, 8, 9]
        fields: [1]
    playlist:
      source: |
        final class Playlist implements Playable {
            private final String name;
            private final List<Playable> items = new ArrayList<>();

            Playlist(String name) {
                this.name = name;
            }

            String name() {
                return name;
            }

            void add(Playable item) {
                items.add(item);
            }

            @Override
            public int duration() {
                return items.stream().mapToInt(Playable::duration).sum();
            }

            @Override
            public void play(List<String> queue) {
                for (Playable item : items) item.play(queue);
            }
        }

        final class PlayButton {
            private final Playable item;

            PlayButton(Playable item) {
                this.item = item;
            }

            List<String> press() {
                List<String> queue = new ArrayList<>();
                item.play(queue);
                return queue;
            }
        }
      focus:
        items: [3, 13, 14]
        duration: [18, 19]
        play: [23, 24]
        add: [13, 14, 15]
        press: [29, 36, 37]
        result: [37, 38]
    wire:
      source: |
        public class CompositeDemo {
            public static void main(String[] args) {
                Playlist throwbacks = new Playlist("Throwbacks");
                throwbacks.add(new Song("Mixtape Summer", 240));
                throwbacks.add(new Song("Cassette Heart", 210));

                Playlist roadTrip = new Playlist("Road Trip");
                roadTrip.add(new Song("Sunroof Down", 180));
                roadTrip.add(throwbacks);
                roadTrip.add(new Song("Last Exit", 210));

                PlayButton button = new PlayButton(roadTrip);
                System.out.println(roadTrip.name() + ": " + roadTrip.duration() + " seconds");
                System.out.println(String.join(", ", button.press()));
            }
        }
      focus:
