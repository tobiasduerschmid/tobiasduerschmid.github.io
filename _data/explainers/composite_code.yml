java:
  label: Java
  filename: CompositeDemo.java
  note: Playable is our own interface. Song is a record, so it never changes and several playlists can share one.
  imports: |
    import java.util.ArrayList;
    import java.util.List;
  blocks:
    problem:
      source: |
        record Song(String title, int seconds) {}

        final class Playlist {
            private final String name;
            private final List<Song> songs = new ArrayList<>();
            private final List<Playlist> playlists = new ArrayList<>();

            Playlist(String name) {
                this.name = name;
            }

            void addSong(Song song) { songs.add(song); }
            void addPlaylist(Playlist playlist) { playlists.add(playlist); }

            int duration() {
                int total = 0;
                for (Song song : songs) total += song.seconds();
                for (Playlist playlist : playlists) total += playlist.duration();
                return total;
            }

            void play(List<String> queue) {
                for (Song song : songs) queue.add(song.title());
                for (Playlist playlist : playlists) playlist.play(queue);
            }
        }

        final class PlayButton {
            private final Object item; // a Song or a Playlist

            PlayButton(Object item) {
                this.item = item;
            }

            List<String> press() {
                List<String> queue = new ArrayList<>();
                if (item instanceof Song song) {
                    queue.add(song.title());
                } else if (item instanceof Playlist playlist) {
                    playlist.play(queue);
                }
                return queue;
            }
        }
      focus:
        lists: [5, 6, 12, 13]
        loops: [17, 18, 23, 24]
        order: [22, 23, 24, 25]
