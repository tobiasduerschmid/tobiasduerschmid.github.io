typescript:
  label: TypeScript
  filename: composite-demo.ts
  note: Tile is a TypeScript interface, and readonly fields let two stories share one photo. draw adds one text line per tile, which the collage paints as a tile.
  imports: |
    export {};
  blocks:
    area:
      source: |
        type Direction = "side by side" | "stacked";

        class Area {
          readonly x: number;
          readonly y: number;
          readonly width: number;
          readonly height: number;

          constructor(x: number, y: number, width: number, height: number) {
            this.x = x;
            this.y = y;
            this.width = width;
            this.height = height;
          }

          part(index: number, count: number, direction: Direction): Area {
            if (direction === "side by side") {
              const width = Math.floor(this.width / count);
              return new Area(this.x + index * width, this.y, width, this.height);
            }
            const height = Math.floor(this.height / count);
            return new Area(this.x, this.y + index * height, this.width, height);
          }

          toString(): string {
            return `${this.width}x${this.height} at ${this.x},${this.y}`;
          }
        }

        const STORY = new Area(0, 0, 1080, 1920);
      focus:
        part: [16, 17, 18, 19, 20, 21, 22, 23]
    problem:
      source: |
        class Photo {
          readonly name: string;

          constructor(name: string) {
            this.name = name;
          }
        }

        type Item = Photo | Split;

        class Split {
          readonly direction: Direction;
          private readonly items: Item[] = [];

          constructor(direction: Direction) {
            this.direction = direction;
          }

          add(item: Item): void {
            this.items.push(item);
          }

          draw(area: Area, canvas: string[]): void {
            this.items.forEach((item, index) => {
              const part = area.part(index, this.items.length, this.direction);
              if (item instanceof Photo) {
                canvas.push(`${item.name} ${part}`);
              } else if (item instanceof Split) {
                item.draw(part, canvas);
              }
            });
          }

          photoCount(): number {
            let count = 0;
            for (const item of this.items) {
              if (item instanceof Photo) {
                count += 1;
              } else if (item instanceof Split) {
                count += item.photoCount();
              }
            }
            return count;
          }
        }

        class ShareButton {
          readonly selection: Item;

          constructor(selection: Item) {
            this.selection = selection;
          }

          press(): string[] {
            const canvas: string[] = [];
            if (this.selection instanceof Photo) {
              canvas.push(`${this.selection.name} ${STORY}`);
            } else if (this.selection instanceof Split) {
              this.selection.draw(STORY, canvas);
            }
            return canvas;
          }
        }
