cpp:
  label: C++
  filename: composite_demo.cpp
  note: Playlists hold their items through shared_ptr to const Playable, so one Song object can sit in several playlists. Each class lists its data members first.
  imports: |
    #include <cstddef>
    #include <iostream>
    #include <memory>
    #include <string>
    #include <utility>
    #include <variant>
    #include <vector>
  blocks:
    problem:
      source: |
        struct Song {
            std::string title;
            int seconds;
        };

        class Playlist {
            std::string name_;
            std::vector<Song> songs_;
            std::vector<std::shared_ptr<const Playlist>> playlists_;

        public:
            explicit Playlist(std::string name) : name_(std::move(name)) {}
            const std::string& name() const { return name_; }

            void addSong(Song song) { songs_.push_back(std::move(song)); }
            void addPlaylist(std::shared_ptr<const Playlist> playlist) {
                playlists_.push_back(std::move(playlist));
            }

            int duration() const {
                int total = 0;
                for (const Song& song : songs_) total += song.seconds;
                for (const auto& playlist : playlists_) total += playlist->duration();
                return total;
            }

            void play(std::vector<std::string>& queue) const {
                for (const Song& song : songs_) queue.push_back(song.title);
                for (const auto& playlist : playlists_) playlist->play(queue);
            }
        };

        // A button holds either a song or a playlist.
        using Selection = std::variant<Song, std::shared_ptr<const Playlist>>;

        class PlayButton {
            Selection item_;

        public:
            explicit PlayButton(Selection item) : item_(std::move(item)) {}

            std::vector<std::string> press() const {
                std::vector<std::string> queue;
                if (const auto* song = std::get_if<Song>(&item_)) {
                    queue.push_back(song->title);
                } else {
                    std::get<std::shared_ptr<const Playlist>>(item_)->play(queue);
                }
                return queue;
            }
        };
      focus:
