    playlist:
      source: |
        class Playlist : public Playable {
            std::string name_;
            std::vector<std::shared_ptr<const Playable>> items_;

        public:
            explicit Playlist(std::string name) : name_(std::move(name)) {}
            const std::string& name() const { return name_; }

            void add(std::shared_ptr<const Playable> item) {
                items_.push_back(std::move(item));
            }

            int duration() const override {
                int total = 0;
                for (const auto& item : items_) total += item->duration();
                return total;
            }

            void play(std::vector<std::string>& queue) const override {
                for (const auto& item : items_) item->play(queue);
            }
        };

        class PlayButton {
            std::shared_ptr<const Playable> item_;

        public:
            explicit PlayButton(std::shared_ptr<const Playable> item)
                : item_(std::move(item)) {}

            std::vector<std::string> press() const {
                std::vector<std::string> queue;
                item_->play(queue);
                return queue;
            }
        };
