cpp:
  label: C++
  filename: composite_demo.cpp
  note: In the composite design, splits hold their tiles through shared_ptr to const Tile, so two stories can share one photo. draw adds one text line per tile, which the collage paints as a tile. Each class lists its data members first.
  imports: |
    #include <iostream>
    #include <memory>
    #include <string>
    #include <utility>
    #include <variant>
    #include <vector>
  blocks:
    area:
      source: |
        enum class Direction { SideBySide, Stacked };

        struct Area {
            int x;
            int y;
            int width;
            int height;

            Area part(int index, int count, Direction direction) const {
                if (direction == Direction::SideBySide) {
                    const int partWidth = width / count;
                    return {x + index * partWidth, y, partWidth, height};
                }
                const int partHeight = height / count;
                return {x, y + index * partHeight, width, partHeight};
            }

            std::string str() const {
                return std::to_string(width) + "x" + std::to_string(height) + " at " +
                       std::to_string(x) + "," + std::to_string(y);
            }
        };

        constexpr Area kStory{0, 0, 1080, 1920};
      focus:
        part: [9, 10, 11, 12, 13, 14, 15, 16]
    problem:
      source: |
        struct Photo {
            std::string name;
        };

        class Split;
        using SplitPtr = std::shared_ptr<const Split>;
        using Item = std::variant<Photo, SplitPtr>;

        class Split {
            Direction direction_;
            std::vector<Item> items_;

        public:
            explicit Split(Direction direction) : direction_(direction) {}

            void add(Item item) { items_.push_back(std::move(item)); }

            void draw(const Area& area, std::vector<std::string>& canvas) const {
                const int count = static_cast<int>(items_.size());
                for (std::size_t index = 0; index < items_.size(); ++index) {
                    const Area part = area.part(static_cast<int>(index), count, direction_);
                    if (const auto* photo = std::get_if<Photo>(&items_[index])) {
                        canvas.push_back(photo->name + " " + part.str());
                    } else if (const auto* split = std::get_if<SplitPtr>(&items_[index])) {
                        (*split)->draw(part, canvas);
                    }
                }
            }

            int photoCount() const {
                int count = 0;
                for (const Item& item : items_) {
                    if (std::holds_alternative<Photo>(item)) {
                        count += 1;
                    } else if (const auto* split = std::get_if<SplitPtr>(&item)) {
                        count += (*split)->photoCount();
                    }
                }
                return count;
            }
        };

        class ShareButton {
            Item selection_;

        public:
            explicit ShareButton(Item selection) : selection_(std::move(selection)) {}

            std::vector<std::string> press() const {
                std::vector<std::string> canvas;
                if (const auto* photo = std::get_if<Photo>(&selection_)) {
                    canvas.push_back(photo->name + " " + kStory.str());
                } else if (const auto* split = std::get_if<SplitPtr>(&selection_)) {
                    (*split)->draw(kStory, canvas);
                }
                return canvas;
            }
        };
      focus:
        area: [20, 21]
        types: [1, 2, 3, 6, 7, 11, 16]
        branches: [22, 23, 24, 25, 33, 34, 35, 36]
        client: [51, 52, 53, 54]
        changes: [22, 24, 33, 35, 51, 53]
    tile:
      source: |
        class Tile {
        public:
            virtual ~Tile() = default;
            virtual void draw(const Area& area, std::vector<std::string>& canvas) const = 0;
            virtual int photoCount() const = 0;
        };
      focus:
        interface: [1, 2, 3, 4, 5, 6]
        draw: [4]
