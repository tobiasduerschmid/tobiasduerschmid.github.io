# Code for the Module Blood Groups lesson's closer looks (scripts/narration/closer-look.js).
# A look's `code: <name>` uses the blocks `<name>_<group>` in every language.
# Focus keys name line numbers; lines stay within 60 characters, and Python
# is fully type-hinted. `payapi` stands for the third-party payment API.
python:
  label: Python
  blocks:
    plugs_rules:
      file: rides/rules.py
      source: |
        from abc import ABC, abstractmethod
        from rides.model import Ride, Rider

        class Payments(ABC):
            @abstractmethod
            def charge(self, rider: Rider, amount: float) -> None:
                ...

        class RideRules:
            def __init__(self, payments: Payments) -> None:
                self.payments: Payments = payments

            def price(self, ride: Ride) -> float:
                cost = 1.00 + 0.30 * ride.minutes
                return cost * 0.8 if ride.rider.student else cost

            def end_ride(self, ride: Ride) -> None:
                self.payments.charge(ride.rider, self.price(ride))
      focus: {contract: [4, 5, 6, 7], call: [18]}
    plugs_adapter:
      file: adapters/payment_adapter.py
      source: |
        from payment.client import PaymentClient
        from rides.model import Rider
        from rides.rules import Payments

        class PaymentAdapter(Payments):
            def __init__(self, client: PaymentClient) -> None:
                self.client: PaymentClient = client

            def charge(self, rider: Rider, amount: float) -> None:
                card = self.client.card_on_file(rider.id)
                self.client.charge(card, round(amount * 100))
      focus: {imports: [1, 2, 3], implements: [5], charge: [9], translate: [10, 11]}
    plugs_client:
      file: payment/client.py
      source: |
        import payapi

        class PaymentClient:
            def __init__(self, key: str) -> None:
                self.api: payapi.Api = payapi.Api(key)

            def card_on_file(self, customer: str) -> payapi.Card:
                return self.api.customers.get(customer).card

            def charge(self, card: payapi.Card, cents: int) -> None:
                self.api.charges.create(card=card, amount=cents)
      focus: {api: [1], charge: [10, 11]}
java:
  label: Java
  blocks:
    plugs_rules:
      files:
        - file: rides/Payments.java
          source: |
            package rides;

            public interface Payments {
                void charge(Rider rider, double amount);
            }
          focus: {contract: [3, 4, 5]}
        - file: rides/RideRules.java
          source: |
            package rides;

            public class RideRules {
                private final Payments payments;

                public RideRules(Payments payments) {
                    this.payments = payments;
                }

                double price(Ride ride) {
                    double cost = 1.00 + 0.30 * ride.minutes();
                    return ride.rider().isStudent() ? cost * 0.8 : cost;
                }

                public void endRide(Ride ride) {
                    payments.charge(ride.rider(), price(ride));
                }
            }
          focus: {call: [16]}
    plugs_adapter:
      file: adapters/PaymentAdapter.java
      source: |
        package adapters;

        import payment.PaymentClient;
        import rides.Payments;
        import rides.Rider;

        public class PaymentAdapter implements Payments {
            private final PaymentClient client;

            public PaymentAdapter(PaymentClient client) {
                this.client = client;
            }

            @Override
            public void charge(Rider rider, double amount) {
                var card = client.cardOnFile(rider.id());
                client.charge(card, Math.round(amount * 100));
            }
        }
      focus: {imports: [3, 4, 5], implements: [7], charge: [15], translate: [16, 17]}
    plugs_client:
      file: payment/PaymentClient.java
      source: |
        package payment;

        import payapi.Api;
        import payapi.Card;

        public class PaymentClient {
            private final Api api;

            public PaymentClient(String key) { api = new Api(key); }

            public Card cardOnFile(String customer) {
                return api.customers().get(customer).card();
            }

            public void charge(Card card, long cents) {
                api.charges().create(card, cents);
            }
        }
      focus: {api: [3, 4], charge: [15, 16, 17]}
