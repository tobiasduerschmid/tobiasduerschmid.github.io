typescript:
  label: TypeScript
  blocks:
    plugs_rules:
      file: rides/rules.ts
      source: |
        import type { Ride, Rider } from "./model";

        export interface Payments {
          charge(rider: Rider, amount: number): void;
        }

        export class RideRules {
          constructor(private readonly payments: Payments) {}

          price(ride: Ride): number {
            const cost = 1.0 + 0.3 * ride.minutes;
            return ride.rider.student ? cost * 0.8 : cost;
          }

          endRide(ride: Ride): void {
            this.payments.charge(ride.rider, this.price(ride));
          }
        }
      focus: {contract: [3, 4, 5], call: [16]}
    plugs_adapter:
      file: adapters/payment-adapter.ts
      source: |
        import type { PaymentClient } from "../payment/client";
        import type { Rider } from "../rides/model";
        import type { Payments } from "../rides/rules";

        export class PaymentAdapter implements Payments {
          constructor(private readonly client: PaymentClient) {}

          charge(rider: Rider, amount: number): void {
            const card = this.client.cardOnFile(rider.id);
            this.client.charge(card, Math.round(amount * 100));
          }
        }
      focus: {imports: [1, 2, 3], implements: [5], charge: [8], translate: [9, 10]}
    plugs_client:
      file: payment/client.ts
      source: |
        import { Api, type Card } from "payapi";

        export class PaymentClient {
          private readonly api: Api;

          constructor(key: string) {
            this.api = new Api(key);
          }

          cardOnFile(customer: string): Card {
            return this.api.customers.get(customer).card;
          }

          charge(card: Card, cents: number): void {
            this.api.charges.create({ card, amount: cents });
          }
        }
      focus: {api: [1], charge: [14, 15, 16]}
