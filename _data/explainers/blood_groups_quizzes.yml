# One knowledge check per section, from the intro on: each question puts the
# section's central idea to work on a new system, not the scooter example, and
# its distractors are the wrong reasoning a partial understanding produces,
# phrased in the lesson's own words so the key never stands out by vocabulary.
# Every key, and every reason to reject a distractor, is said in the narration
# before its check. Keys sit in varied positions because the print and notes
# views keep this order. The summary lists several questions, about one new
# system, under `questions`.
intro:
  question: A campus parking app also applies rules, talks to technology, and does plain math. Which of these jobs is plain math?
  options:
    - Price parking at $2 an hour, half off for students
    - Compute a lot's area from its corner points
    - Ask the map service how far a car is from a lot
  correct_index: 1
  explanation: Computing an area from corner points is geometry. It holds no parking rule and talks to no service, like Glide's check whether a point lies inside a zone.
  option_feedback:
    0: This job does arithmetic, but the rate and the student discount are the parking business's own decisions. That makes it a rule, like what a Glide ride costs.
    2: The distance comes from talking to the map service, so this job is technology work, like Glide asking the map service where a scooter is.
tangle:
  question: "A dining hall's swipe function tangles meal-plan rules and card-reader API calls, line by line. Dining services adds a rule: one free guest meal a week. What does the tangle mean for this change?"
  options:
    - Little; only a card-reader switch would spread through the code
    - Only the reader calls need retesting; the new rule can be tested on its own
    - The rule goes among reader calls; testing it needs a reader
  correct_index: 2
  explanation: When rules and technology share the same lines, a rule change lands among the technology calls. The new rule is edited in between the card-reader calls, and it can't be tested without the reader.
  option_feedback:
    0: Tangled code hurts every kind of change. A new rule has to be written into the lines that call the card reader, just as a new map provider reached Glide's parking rule.
    1: The new rule sits between card-reader calls, so it can't be tested on its own. Any test of it runs the card reader too, as Glide's rules couldn't be tested without the SDK.
two_questions:
  question: In a campus fitness app, one function averages any list of numbers. The workout rules call it to set weekly goals, and the heart-rate sensor's driver calls it to smooth readings. Which group is the function?
  options:
    - Group zero
    - Group A
    - Group T
    - Group AT
  correct_index: 0
  explanation: Averaging numbers knows no workout rules and no sensor; if either one changed, this function would stay the same. What code knows depends on what it uses, not on who calls it.
  option_feedback:
    1: The workout rules depend on the average, not the other way around. If the goal rules changed, the averaging function would not change, so it knows no domain.
    2: The sensor driver depends on the average, not the other way around. If the sensor's API changed, the averaging function would not change, so it knows no technology.
    3: Callers don't lend their knowledge to the code they call. The function would survive a change of rules and a change of sensor, so it knows neither.
group_a:
  question: A library's late-fee module knows the library's fee rules and no technology. Which system can reuse it as it is?
  options:
    - Neither; reuse needs the same rules and the same database
    - "The bookstore's rentals: same database, their own late fees"
    - A branch library with the same fee rules but another database
  correct_index: 2
  explanation: Code in group A goes wherever the same rules apply, on any technology. The branch library charges the same fees, and the module never touches its database.
  option_feedback:
    0: Only the rules have to match. The module knows no database, so a branch library with the same fees can use it on its own database.
    1: Sharing a database doesn't help code that never touches one. The module carries the library's fee rules, and the bookstore's rentals follow late-fee rules of their own.
group_t:
  question: A gym app's SMS client sends any text to any phone number through an SMS provider's API. The gym's rules hand it texts like “Your class starts in 10 minutes.” Can the campus library, which uses the same provider, reuse the client as it is?
  options:
    - No; it sends class reminders, so it knows the gym's domain
    - Yes; it knows the SMS provider and nothing about the gym
    - Yes, but only if the library follows the gym's rules
  correct_index: 1
  explanation: The client knows one technology, the SMS provider's API, and no domain, so it is group T. Any application that uses the same provider can reuse it.
  option_feedback:
    0: The gym's rules write the reminders; the client only passes the text along. It would send a library notice just the same, so it knows no domain.
    2: Matching rules is what group A needs. A group T client only needs the same technology, and the library texts through the same provider.
group_zero:
  question: In a campus delivery app, a function takes two latitude-longitude points and returns the distance between them in meters. Which software could reuse it as it is?
  options:
    - Only delivery apps with the same fee rules
    - Any app that measures distances between map points
    - Only apps that read positions from the same phone GPS
    - None as it is; zero code does nothing useful alone
  correct_index: 1
  explanation: The function knows no deliveries and no device, just coordinates, so it is group zero, the universal donor. Any app that needs distances can reuse it, as long as A or T code gives it a job.
  option_feedback:
    0: Fee rules are domain knowledge, and this function has none. Only group A code is limited to places where the same rules apply.
    2: The function receives its points; it never reads a GPS. Only group T code is limited to places where the same technology runs.
    3: Useless alone means zero code needs a caller to give it a job, such as a delivery app's fee rules. Any app with such a job can still reuse it as it is.
group_at:
  question: Two teams build the same campus food app. Half of Team Red's code is AT; almost none of Team Blue's is. Over a year, the menu rules change every month and the payment provider changes once. Which design is cheaper to maintain?
  options:
    - "Blue's: each change touches less code"
    - Blue's, but only when the provider changes
    - "Red's: AT code is the quickest to write"
    - "Red's: with fewer modules, each change has fewer places to look"
  correct_index: 0
  explanation: AT code changes whenever the rules or the technology change, so Red's large share of AT code is edited and retested with every change. The larger a design's share of AT code, the lower its quality.
  option_feedback:
    1: The menu changes cost more in Red's design too. They land in Red's AT code, among the payment calls, just like the provider switch.
    2: AT code is quick to write, but slow to maintain. Every menu change and the provider switch land in Red's AT code.
    3: Fewer modules didn't help Glide, where one map switch hit forty-seven places in twelve files. Every change still reaches all the AT code that knows both the rules and the provider.
mixing:
  question: A bookstore's checkout module holds discount rules (group A), a sorting helper (group zero), and calls to a payment API (group T). The team wants the module in group A. What must it do?
  options:
    - Nothing; its A and zero parts outnumber its T part
    - Move the payment calls into a module of their own
    - Move the sorting helper out, since zero code blocks group A
    - Add discount rules until they outweigh the payment calls
  correct_index: 1
  explanation: A module has every letter its parts have. Zero adds none, and the payment calls add T, however much A sits beside them. Moving the payment calls out is the only way back to A.
  option_feedback:
    0: Groups don't go by majority. One part that knows the payment API is enough for the whole module to know it, so the module is AT.
    2: Zero adds no letter, so the sorting helper can stay. What keeps the module from group A is its T part, the payment calls.
    3: AT absorbs everything added to it. More rules leave the payment calls in place, so the module stays AT until they move out.
leaks:
  question: A library app's catalog client returns the catalog service's HTTP status code. The hold rules check for 404, meaning “not in the catalog,” and then offer an interlibrary loan. What happened, and what fixes it?
  options:
    - Nothing; the rules only compare an integer, which is zero code
    - The client became AT; move the loan rule into the client
    - The rules became AT; return a found or not-found answer
  correct_index: 2
  explanation: A 404 means something only in HTTP, so rules that test for it depend on the catalog service's protocol and turn AT. A neutral answer, found or not found, keeps HTTP inside the client, as a plain point kept the map SDK inside Glide's map client.
  option_feedback:
    0: The type is a plain integer, but its meaning comes from HTTP. If the catalog service moved off HTTP, the rule would break, so the rules know the technology.
    1: The client still knows only the catalog's API; the leak lands in the code that reads 404. Moving the loan rule into the client would make the client AT instead.
separate:
  question: A campus dining module holds the meal-swipe rules, prints receipts through a thermal printer's API, and charges cards through a payment API. Which redesign minimizes AT?
  options:
    - Rules in one module; printer and payments in a module each
    - One module, with the printer and payment calls in private helpers
    - Printer and payment modules, each holding the swipe rules it needs
  correct_index: 0
  explanation: Separating technology from application concerns leaves no AT module. The rules go in an A module that any dining system with the same rules could reuse, and each technology gets a T module of its own.
  option_feedback:
    1: Private helpers still live in the module that holds the rules. A module knows everything its parts know, so it still knows the printer and the payment API and stays AT.
    2: Splitting along the technologies spreads the rules into both modules, so each one knows a technology and the rules. That makes two AT modules instead of one.
invert:
  question: A pet-adoption app has large adoption rules that change often. They confirm each adoption by email, and the shelter may later text adopters instead. Which design keeps that switch smallest?
  options:
    - An email adapter offers send(EmailMessage); the rules build the message
    - The rules own a confirm(adopter, pet) interface; an adapter calls the email SDK
    - The rules own a confirm(adopter, pet) interface; the adapter also picks who gets an email
  correct_index: 1
  explanation: The rules declare what they need in their own words, so a text adapter can replace the email adapter without touching them. An adapter that translates but never decides is all that changes, and every adoption rule stays in group A.
  option_feedback:
    0: This interface belongs to the adapter and speaks in email terms. The rules build an email message, so they know the email technology, and switching to texts would change the rules themselves.
    2: Choosing who gets a confirmation is a rule. Kept in the adapter, it would have to be rebuilt in the text adapter; a thin adapter translates but never decides.
frameworks:
  question: A chess app's Board class holds hundreds of lines of move rules and extends a GUI toolkit's Widget class to draw itself. The team wants the same rules in a command-line version. What should it do?
  options:
    - Keep Board as it is; the command-line version never calls draw()
    - Copy the move rules into a second Board for the command line
    - Give the rules their own Board class, and let a widget class draw it
  correct_index: 2
  explanation: Extending Widget marries Board's rules to the GUI toolkit, so Board is AT. A Board class that extends nothing keeps the rules in group A, and a thin widget class adapts it to the toolkit.
  option_feedback:
    0: Not calling draw() doesn't cut the tie. Board still extends Widget, so the command-line version, and every test of the rules, still need the GUI toolkit.
    1: Two copies of the rules drift apart, and every rule fix must be made twice. Separating the rules from the toolkit lets both versions share one copy.
change_test:
  question: In a well-separated campus food app, which change should touch only the thin translators?
  options:
    - "Receipts show times as 21:30 instead of 9:30 pm"
    - Delivery becomes free for orders after 9 pm
    - The app moves to a new payment provider
  correct_index: 0
  explanation: A change in how data is shown lands only in the thin translators between the rules and the technology. The rules keep their times, and the printer still prints whatever text it gets.
  option_feedback:
    1: Free delivery is a rule, so it lands in the A rules alone. The payment adapter charges whatever amount the rules ask for, so it doesn't change.
    2: A new provider means a new T module for payments, plus a thin adapter to plug it in, not only a translator.
balance:
  question: A campus events app's team has one week for redesign. Where does separating pay off most?
  options:
    - Wrapping the app's own date-math helpers, in case they change
    - Keeping the ticket rules apart from a provider the team may switch
    - Nowhere, since each extra interface slows the app at runtime
  correct_index: 1
  explanation: Separation pays off where change and reuse are likely, such as rules next to a provider the team may swap. Date math is zero code that business and technology changes never reach, and an extra call through an interface costs next to nothing.
  option_feedback:
    0: Date math is zero code; it doesn't change when the business or the technology does. Wrapping it adds layers that protect nothing.
    2: One extra call through an interface costs next to nothing, except in the tightest embedded code. The real price is design time, which pays back with every change.
summary:
  questions:
    - question: In a campus laundry app, a module decides whether a student may reserve a third washer this week. It calls no API. Which group is it?
      options:
        - Group T, since the washers are machines
        - Group A, since it applies the laundry room's rules
        - Group zero, since it only compares numbers
      correct_index: 1
      explanation: The module knows the laundry room's reservation rule and no technology, so it is group A.
      option_feedback:
        0: The module calls no machine's API. It only applies the reservation rule, which is domain knowledge.
        2: It compares numbers against the laundry room's reservation rule, and knowing that rule is domain knowledge.
    - question: The laundry app will run in every dorm for years. Its status module calls the washer vendor's API and also decides when a student's ten-minute pickup window has expired. What should the team do?
      options:
        - Keep it; the status module is mostly technology, so it's T
        - Move the pickup-window rule into the washer vendor's module
        - Split the vendor calls from the pickup-window rule
      correct_index: 2
      explanation: The module knows both a technology and a domain rule, so it is AT. Splitting it into a T module for the vendor API and an A module for the pickup rule lets each part change, and be reused, on its own.
      option_feedback:
        0: The pickup window is a domain rule, so the module knows both and is AT, not T.
        1: A module that holds the pickup rule and calls the vendor's API is AT wherever it lives. Moving the rule doesn't separate what the code knows.
    - question: A dorm in another city keeps the same laundry rules but buys another vendor's washers. In a well-separated design, what can it reuse as it is?
      options:
        - The reservation rules, and zero code such as date math
        - The washer T module and its adapter
        - Nothing, since its washers speak another API
      correct_index: 0
      explanation: Group A goes wherever the same rules apply, and zero code goes everywhere. The new dorm plugs its own washers in through a new T module and adapter.
      option_feedback:
        1: The T module and its adapter know the old vendor's API, so they move only where the same washers run.
        2: In a well-separated design, the rules never knew the vendor's API, so they stay reusable; only the T module and its adapter are replaced.
    - question: The reservation rules ask an interface about a washer before booking it. Which interface keeps the rules in group A?
      options:
        - status(washer) returning the vendor's DeviceReport
        - status(washer) returning Free or Busy
        - query(sql) returning table rows
      correct_index: 1
      explanation: An interface in neutral or domain words, such as Free or Busy, lets the rules depend on what they need without knowing any technology.
      option_feedback:
        0: Returning the vendor's own type leaks the technology into the rules, so they become AT.
        2: Passing SQL hands the database's language to the rules, so every caller becomes AT.
