cpp:
  label: C++
  filename: state_demo.cpp
  note: 'State objects are const and stateless: each accessor returns one shared object, created on first use. Dog stores a non-owning pointer to it.'
  imports: |
    #include <iostream>
    #include <string>
  blocks:
    problem:
      source: |
        enum class Mode { Following, Fetching, Napping };

        class DogBefore {
            Mode mode = Mode::Following;

        public:
            static constexpr int fullEnergy = 2;
            int energy = fullEnergy;

            std::string throwBall() {
                if (mode == Mode::Following) {
                    mode = Mode::Fetching;
                    return "runs after the ball";
                } else if (mode == Mode::Fetching) {
                    return "keeps chasing the first ball";
                } else { // Napping
                    return "keeps snoring";
                }
            }

            std::string whistle() {
                if (mode == Mode::Following) {
                    return "wags its tail";
                } else if (mode == Mode::Fetching) {
                    return "ignores the whistle";
                } else { // Napping
                    energy = fullEnergy;
                    mode = Mode::Following;
                    return "wakes up and follows you";
                }
            }

            std::string tick() {
                if (mode == Mode::Following) {
                    return "trots beside you";
                } else if (mode == Mode::Fetching) {
                    energy--;
                    if (energy == 0) {
                        mode = Mode::Napping;
                        return "brings the ball back and naps";
                    }
                    mode = Mode::Following;
                    return "brings the ball back";
                } else { // Napping
                    return "snores";
                }
            }
        };
