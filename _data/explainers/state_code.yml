            std::string whistle(Dog& dog) const override {
                dog.energy = Dog::fullEnergy;
                dog.setState(following());
                return "wakes up and follows you";
            }
            std::string tick(Dog&) const override { return "snores"; }
        };

        const DogState& following() { static const Following state{}; return state; }
        const DogState& fetching() { static const Fetching state{}; return state; }
        const DogState& napping() { static const Napping state{}; return state; }
