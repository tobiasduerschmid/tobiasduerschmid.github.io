            static final DogState INSTANCE = new Following();

            public String throwBall(Dog dog) {
                dog.setState(Fetching.INSTANCE);
                return "runs after the ball";
            }

            public String whistle(Dog dog) { return "wags its tail"; }
            public String tick(Dog dog) { return "trots beside you"; }
        }

        final class Fetching implements DogState {
            static final DogState INSTANCE = new Fetching();

            public String throwBall(Dog dog) { return "keeps chasing the first ball"; }
            public String whistle(Dog dog) { return "ignores the whistle"; }

            public String tick(Dog dog) {
                dog.energy--;
                if (dog.energy == 0) {
                    dog.setState(Napping.INSTANCE);
                    return "brings the ball back and naps";
                }
                dog.setState(Following.INSTANCE);
                return "brings the ball back";
            }
        }

        final class Napping implements DogState {
            static final DogState INSTANCE = new Napping();

            public String throwBall(Dog dog) { return "keeps snoring"; }

            public String whistle(Dog dog) {
                dog.energy = Dog.FULL_ENERGY;
                dog.setState(Following.INSTANCE);
                return "wakes up and follows you";
            }

            public String tick(Dog dog) { return "snores"; }
        }
