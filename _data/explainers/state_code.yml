typescript:
  label: TypeScript
  filename: state-demo.ts
  note: DogState describes a structural contract. A method may leave out a parameter it does not use, such as the dog.
  imports: |
    export {};
  blocks:
    problem:
      source: |
        type Mode = "following" | "fetching" | "napping";

        class DogBefore {
          static readonly FULL_ENERGY = 2;
          private mode: Mode = "following";
          energy = DogBefore.FULL_ENERGY;

          throwBall(): string {
            if (this.mode === "following") {
              this.mode = "fetching";
              return "runs after the ball";
            } else if (this.mode === "fetching") {
              return "keeps chasing the first ball";
            } else { // napping
              return "keeps snoring";
            }
          }

          whistle(): string {
            if (this.mode === "following") {
              return "wags its tail";
            } else if (this.mode === "fetching") {
              return "ignores the whistle";
            } else { // napping
              this.energy = DogBefore.FULL_ENERGY;
              this.mode = "following";
              return "wakes up and follows you";
            }
          }

          tick(): string {
            if (this.mode === "following") {
              return "trots beside you";
            } else if (this.mode === "fetching") {
              this.energy--;
              if (this.energy === 0) {
                this.mode = "napping";
                return "brings the ball back and naps";
              }
              this.mode = "following";
              return "brings the ball back";
            } else { // napping
              return "snores";
            }
          }
        }
