        struct Following : DogState {
            std::string throwBall(Dog& dog) const override {
                dog.setState(fetching());
                return "runs after the ball";
            }
            std::string whistle(Dog&) const override { return "wags its tail"; }
            std::string tick(Dog&) const override { return "trots beside you"; }
        };

        struct Fetching : DogState {
            std::string throwBall(Dog&) const override { return "keeps chasing the first ball"; }
            std::string whistle(Dog&) const override { return "ignores the whistle"; }
            std::string tick(Dog& dog) const override {
                dog.energy--;
