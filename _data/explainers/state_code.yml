java:
  label: Java
  filename: StateDemo.java
  note: DogState is our own interface. Each state class keeps one shared INSTANCE because it stores no data of its own.
  imports: ''
  blocks:
    problem:
      source: |
        enum Mode { FOLLOWING, FETCHING, NAPPING }

        final class DogBefore {
            static final int FULL_ENERGY = 2;
            private Mode mode = Mode.FOLLOWING;
            int energy = FULL_ENERGY;

            String throwBall() {
                if (mode == Mode.FOLLOWING) {
                    mode = Mode.FETCHING;
                    return "runs after the ball";
                } else if (mode == Mode.FETCHING) {
                    return "keeps chasing the first ball";
                } else { // NAPPING
                    return "keeps snoring";
                }
            }

            String whistle() {
                if (mode == Mode.FOLLOWING) {
                    return "wags its tail";
                } else if (mode == Mode.FETCHING) {
                    return "ignores the whistle";
                } else { // NAPPING
                    energy = FULL_ENERGY;
                    mode = Mode.FOLLOWING;
                    return "wakes up and follows you";
                }
            }

            String tick() {
                if (mode == Mode.FOLLOWING) {
                    return "trots beside you";
                } else if (mode == Mode.FETCHING) {
                    energy--;
                    if (energy == 0) {
                        mode = Mode.NAPPING;
                        return "brings the ball back and naps";
                    }
                    mode = Mode.FOLLOWING;
                    return "brings the ball back";
                } else { // NAPPING
                    return "snores";
                }
            }
        }
