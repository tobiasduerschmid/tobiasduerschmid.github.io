      source: |
        package camera;

        import msgs.Frame;
        import pubsub.Node;
        import pubsub.Topic;

        public class CameraDriver {
            public static void run(Node node, Sensor sensor) {
                Topic<Frame> pub = node.advertise("/camera/image");
                while (true) {
                    Frame frame = sensor.read();
                    pub.publish(frame);
                }
            }
        }
      focus: {imports: [3, 4, 5], names: [9], publish: [12]}
    subscribe_topic:
      files:
        - file: pubsub/Topic.java
          source: |
            package pubsub;

            import java.util.*;
            import java.util.concurrent.BlockingDeque;
            import java.util.function.Consumer;

            public class Topic<T> {
                record Inbox<T>(BlockingDeque<T> queue,
                                Consumer<T> callback) {
                    void put(T message) {  // full: drop the oldest
                        while (!queue.offerLast(message))
                            queue.pollFirst();
                    }
                    void drain() {  // on its subscriber's thread
                        for (T m; (m = queue.pollFirst()) != null; )
                            callback.accept(m);
                    }
                }
                final List<Inbox<T>> inboxes = new ArrayList<>();

                public void publish(T message) {
                    for (Inbox<T> inbox : inboxes) inbox.put(message);
                }
            }
          focus: {inboxes: [19], publish: [21, 22, 23], drain: [14, 15, 16, 17]}
        - file: pubsub/Node.java
          source: |
            package pubsub;

            import java.util.*;
            import java.util.concurrent.LinkedBlockingDeque;
            import java.util.function.Consumer;

            public class Node {
                private final Map<String, Topic<?>> topics =
                    new HashMap<>();

                @SuppressWarnings("unchecked")
                public <T> Topic<T> advertise(String name) {
                    return (Topic<T>) topics.computeIfAbsent(
                        name, n -> new Topic<T>());
                }

                public <T> void subscribe(String name, int size,
                                          Consumer<T> cb) {
                    var queue = new LinkedBlockingDeque<T>(size);
                    this.<T>advertise(name).inboxes.add(
                        new Topic.Inbox<>(queue, cb));
                }
            }
          focus: {subscribe: [17, 18, 19, 20, 21, 22]}
