# Code for the Publish-Subscribe lesson's closer looks (scripts/narration/closer-look.js).
# A look's `code: <name>` uses the blocks `<name>_<group>` in every language.
# Focus keys name line numbers; lines stay within 60 characters, and Python
# is fully type-hinted. The messaging infrastructure is a minimal in-process
# sketch of the lesson's node.advertise / node.subscribe API: each subscriber
# has its own bounded inbox that drops its oldest message when full, and the
# infrastructure drains each inbox on that subscriber's own thread (in
# TypeScript, its own async task), so a stuck callback stalls only its own
# inbox.
python:
  label: Python
  blocks:
    subscribe_camera:
      file: camera/driver.py
      source: |
        from camera.sensor import Sensor
        from msgs.image import Frame
        from pubsub.node import Node

        def run(node: Node, sensor: Sensor) -> None:
            pub = node.advertise("/camera/image")
            while True:
                frame: Frame = sensor.read()
                pub.publish(frame)
      focus: {imports: [1, 2, 3], names: [6], publish: [9]}
    subscribe_topic:
      files:
        - file: pubsub/topic.py
          source: |
            from collections import deque
            from typing import Callable, Generic, TypeVar

            T = TypeVar("T")

            class Inbox(Generic[T]):
                def __init__(self, size: int,
                             callback: Callable[[T], None]) -> None:
                    # Full, the queue drops its oldest message.
                    self.queue: deque[T] = deque(maxlen=size)
                    self.callback: Callable[[T], None] = callback

                def put(self, message: T) -> None:
                    self.queue.append(message)

                def drain(self) -> None:  # on its subscriber's thread
                    while self.queue:
                        self.callback(self.queue.popleft())

            class Topic(Generic[T]):
                def __init__(self) -> None:
                    self.inboxes: list[Inbox[T]] = []

                def publish(self, message: T) -> None:
                    for inbox in self.inboxes:
                        inbox.put(message)
          focus: {inboxes: [22], publish: [24, 25, 26], drain: [16, 17, 18]}
        - file: pubsub/node.py
          source: |
            from typing import Any, Callable
            from pubsub.topic import Inbox, Topic

            class Node:
                def __init__(self) -> None:
                    self.topics: dict[str, Topic[Any]] = {}

                def advertise(self, name: str) -> Topic[Any]:
                    return self.topics.setdefault(name, Topic())

                def subscribe(self, name: str, size: int,
                              callback: Callable[[Any], None]) -> None:
                    inbox: Inbox[Any] = Inbox(size, callback)
                    self.advertise(name).inboxes.append(inbox)
          focus: {subscribe: [11, 12, 13, 14]}
    subscribe_counter:
      file: counter/pedestrians.py
      source: |
        from counter.vision import find_people
        from msgs.image import Frame
        from pubsub.node import Node

        class PedestrianCounter:
            def __init__(self) -> None:
                self.counted: int = 0

            def on_frame(self, frame: Frame) -> None:
                self.counted += len(find_people(frame))

        def start(node: Node) -> None:
            counter = PedestrianCounter()
            node.subscribe("/camera/image", 10, counter.on_frame)
      focus: {callback: [9, 10], subscribe: [14]}
