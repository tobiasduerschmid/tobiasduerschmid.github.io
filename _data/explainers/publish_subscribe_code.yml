    subscribe_topic:
      files:
        - file: pubsub/topic.ts
          source: |
            export type Callback<T> =
              (message: T) => void | Promise<void>;

            export class Inbox<T> {
              private readonly queue: T[] = [];

              constructor(
                private readonly size: number,
                private readonly callback: Callback<T>,
              ) {}

              put(message: T): void { // full: drop the oldest
                if (this.queue.length === this.size) {
                  this.queue.shift();
                }
                this.queue.push(message);
              }

              async drain(): Promise<void> { // its own async task
                while (this.queue.length > 0) {
                  await this.callback(this.queue.shift()!);
                }
              }
            }

            export class Topic<T> {
              readonly inboxes: Inbox<T>[] = [];

              publish(message: T): void {
                for (const inbox of this.inboxes) inbox.put(message);
              }
            }
          focus: {inboxes: [27], publish: [29, 30, 31], drain: [19, 20, 21, 22, 23]}
        - file: pubsub/node.ts
          source: |
            import { type Callback, Inbox, Topic } from "./topic";

            export class Node {
              private topics = new Map<string, Topic<any>>();

              advertise<T>(name: string): Topic<T> {
                if (!this.topics.has(name)) {
                  this.topics.set(name, new Topic<T>());
                }
                return this.topics.get(name)!;
              }

              subscribe<T>(
                name: string,
                size: number,
                callback: Callback<T>,
              ): void {
                const inbox = new Inbox<T>(size, callback);
                this.advertise<T>(name).inboxes.push(inbox);
              }
            }
          focus: {subscribe: [13, 14, 15, 16, 17, 18, 19, 20]}
