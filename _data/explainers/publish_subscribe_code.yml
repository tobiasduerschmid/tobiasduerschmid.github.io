            pub.publish(frame);
          }
        }
      focus: {imports: [1, 2, 3], names: [9], publish: [12]}
    subscribe_topic:
      files:
        - file: pubsub/topic.ts
          source: |
            export type Callback<T> = (message: T) => void;
            type Inbox<T> = { queue: T[]; callback: Callback<T> };

            export class Topic<T> {
              readonly inboxes: Inbox<T>[] = [];

              publish(message: T): void {
                for (const inbox of this.inboxes) {
                  inbox.queue.push(message);
                }
              }

              deliver(): void { // run by the infrastructure
                for (const { queue, callback } of this.inboxes) {
                  for (const message of queue.splice(0)) {
                    callback(message);
                  }
                }
              }
            }
          focus: {inboxes: [5], publish: [7, 8, 9, 10, 11], deliver: [13, 14, 15, 16, 17, 18, 19]}
        - file: pubsub/node.ts
          source: |
            import { type Callback, Topic } from "./topic";

            export class Node {
              private topics = new Map<string, Topic<any>>();

              advertise<T>(name: string): Topic<T> {
                if (!this.topics.has(name)) {
                  this.topics.set(name, new Topic<T>());
                }
                return this.topics.get(name)!;
              }

              subscribe<T>(name: string, callback: Callback<T>): void {
                const topic = this.advertise<T>(name);
                topic.inboxes.push({ queue: [], callback });
              }
            }
          focus: {subscribe: [13, 14, 15, 16]}
    subscribe_counter:
      file: counter/pedestrians.ts
      source: |
        import type { Frame } from "../msgs/frame";
        import type { Node } from "../pubsub/node";
