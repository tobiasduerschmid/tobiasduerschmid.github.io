    subscribe_topic:
      files:
        - file: pubsub/topic.h
          source: |
            #pragma once
            #include <deque>
            #include <functional>
            #include <utility>
            #include <vector>

            template <typename T>
            struct Topic {
                using Callback = std::function<void(const T&)>;
                std::vector<std::pair<std::deque<T>, Callback>> inboxes;
                void publish(const T& message) {
                    for (auto& [queue, _] : inboxes)
                        queue.push_back(message);
                }
                void deliver() {  // run by the infrastructure
                    for (auto& [queue, callback] : inboxes)
                        for (; !queue.empty(); queue.pop_front())
                            callback(queue.front());
                }
            };
          focus: {inboxes: [10], publish: [11, 12, 13, 14], deliver: [15, 16, 17, 18, 19]}
        - file: pubsub/node.h
          source: |
            #pragma once
            #include <any>
            #include <map>
            #include <string>
            #include "pubsub/topic.h"

            class Node {
                std::map<std::string, std::any> topics;
            public:
                template <typename T>
                Topic<T>& advertise(const std::string& name) {
                    topics.try_emplace(name, Topic<T>{});
                    return std::any_cast<Topic<T>&>(topics[name]);
                }
                template <typename T>
                void subscribe(const std::string& name,
                               typename Topic<T>::Callback cb) {
                    advertise<T>(name).inboxes.push_back({{}, cb});
                }
            };
          focus: {subscribe: [15, 16, 17, 18, 19]}
