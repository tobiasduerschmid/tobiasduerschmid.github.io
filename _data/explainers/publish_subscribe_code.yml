    subscribe_topic:
      files:
        - file: pubsub/topic.h
          source: |
            #pragma once
            #include <cstddef>
            #include <deque>
            #include <functional>
            #include <memory>
            #include <mutex>
            #include <vector>

            template <typename T>
            using Callback = std::function<void(const T&)>;

            template <typename T>
            struct Inbox {
                std::size_t size;
                Callback<T> callback;
                std::deque<T> queue;
                std::mutex lock;
                void put(const T& message) {  // full: drop the oldest
                    std::lock_guard guard(lock);
                    if (queue.size() == size) queue.pop_front();
                    queue.push_back(message);
                }
                void drain() {  // on its subscriber's thread
                    std::deque<T> taken;
                    {
                        std::lock_guard guard(lock);
                        taken.swap(queue);
                    }
                    for (const T& message : taken) callback(message);
                }
            };

            template <typename T>
            struct Topic {
                std::vector<std::shared_ptr<Inbox<T>>> inboxes;
                void publish(const T& message) {
                    for (auto& inbox : inboxes) inbox->put(message);
                }
            };
          focus: {inboxes: [35], publish: [36, 37, 38], drain: [23, 24, 25, 26, 27, 28, 29]}
        - file: pubsub/node.h
          source: |
            #pragma once
            #include <any>
            #include <cstddef>
            #include <map>
            #include <memory>
            #include <string>
            #include "pubsub/topic.h"

            class Node {
                std::map<std::string, std::any> topics;
            public:
                template <typename T>
                Topic<T>& advertise(const std::string& name) {
                    topics.try_emplace(name, Topic<T>{});
                    return std::any_cast<Topic<T>&>(topics[name]);
                }
                template <typename T>
                void subscribe(const std::string& name,
                               std::size_t size, Callback<T> cb) {
                    advertise<T>(name).inboxes.push_back(
                        std::make_shared<Inbox<T>>(size, cb));
                }
            };
          focus: {subscribe: [17, 18, 19, 20, 21, 22]}
