# Code for the Therac-25 lesson's closer looks (scripts/narration/closer-look.js).
# A look's `code: <name>` uses the blocks `<name>_<group>` in every language.
# Focus keys name line numbers; lines stay within 60 characters, and Python
# is fully type-hinted. This is a teaching reconstruction in modern languages,
# not the historical program; only the routine names Magnet, Ptime, and Datent
# are historical.
python:
  label: Python
  blocks:
    flag_setup:
      file: therac/magnet.py
      source: |
        from therac.ptime import ptime
        from therac.settings import Settings, select_settings
        from therac.shared import shared

        def magnet(settings: Settings) -> bool:
            """Set each bending magnet; False on a seen edit."""
            shared.setting_flag = True       # setup in progress
            for m in settings.bending_magnets:
                m.start_moving()
                if ptime(m.settle_seconds):  # several seconds
                    return False             # reconcile the edit
            return True                      # setup finished

        def beam_setup() -> bool:
            settings = select_settings(shared.request)  # reads X
            return magnet(settings)
      focus: {flag_on: [7], loop: [8, 9], call: [10], done: [12], read: [15]}
    flag_delay:
      file: therac/ptime.py
      source: |
        from therac.clock import ticks, wait_tick
        from therac.shared import shared

        def ptime(seconds: float) -> bool:
            """Wait; True if an edit is seen while flag is on."""
            for _ in range(ticks(seconds)):
                wait_tick()                  # other tasks run here
                if shared.setting_flag and shared.edited:
                    return True              # edit seen
            shared.setting_flag = False      # cleared on exit
            return False
      focus: {entry: [4], wait: [7], check: [8, 9], clear: [10]}
    flag_state:
      file: therac/shared.py
      source: |
        from dataclasses import dataclass

        @dataclass
        class Shared:
            """Values shared by the tasks that take turns."""
            request: str = "X"            # the mode entry
            setting_flag: bool = False    # on: magnets being set
            edited: bool = False          # an entry has changed

        shared: Shared = Shared()

        def datent_edit(mode: str) -> None:
            """Data entry: the therapist corrects the mode."""
            shared.request = mode
            shared.edited = True
      focus: {request: [6], flag: [7], edited: [8], edit: [12, 13, 14, 15]}
java:
  label: Java
  blocks:
    flag_setup:
      file: therac/Magnet.java
      source: |
        package therac;

        final class Magnet {
            static boolean magnet(Settings s) {
                Shared.settingFlag = true;     // setup in progress
                for (BendingMagnet m : s.bendingMagnets()) {
                    m.startMoving();
                    if (Ptime.ptime(m.settleSeconds()))
                        return false;          // reconcile the edit
                }
                return true;                   // setup finished
            }

            static boolean beamSetup() {
                var s = Settings.select(Shared.request); // reads X
                return magnet(s);
            }
        }
