    flag_delay:
      file: therac/Ptime.java
      source: |
        package therac;

        final class Ptime {
            /** Wait; true if an edit is seen while flag is on. */
            static boolean ptime(double seconds) {
                for (long t = 0; t < Clock.ticks(seconds); t++) {
                    Clock.waitTick();  // other tasks run here
                    if (Shared.settingFlag && Shared.edited)
                        return true;   // edit seen
                }
                Shared.settingFlag = false;  // cleared on exit
                return false;
            }
        }
