typescript:
  label: TypeScript
  blocks:
    flag_setup:
      file: therac/magnet.ts
      source: |
        import { ptime } from "./ptime";
        import { Settings, selectSettings } from "./settings";
        import { shared } from "./shared";

        export async function magnet(s: Settings) {
          shared.settingFlag = true; // setup in progress
          for (const m of s.bendingMagnets) {
            m.startMoving();
            if (await ptime(m.settleSeconds))
              return false; // reconcile the edit
          }
          return true; // setup finished
        }

        export async function beamSetup() {
          const s = selectSettings(shared.request); // reads X
          return magnet(s);
        }
