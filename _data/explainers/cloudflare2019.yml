title: "Cloudflare 2019: restore the service, explain the failure"
description: "Follow a request, compare evidence, and choose the next debugging action. A narrated investigation with diagrams, decisions, and a clearly labeled miniature model."
audio: /assets/audio/cloudflare2019-case-study.mp3
captions: /assets/narration/cloudflare2019-case-study.vtt
script: /assets/narration/cloudflare2019-case-study.txt
voice: af_heart
speed: 0.95
pronunciations:
  WAF: web application firewall
  CPU: C P U
  UTC: U T C
  PCRE: P C R E
  RE2: R E two
  "502": five oh two

diagrams:
  request_path:
    type: component
    label: Cloudflare sits between a visitor and a website
    description: A visitor sends a request to Cloudflare. Within the simplified request path, the web application firewall inspects it before permitted work continues toward the website's origin server. This diagram omits caching and other services. It does not say every request reaches an origin.
    caption: "Conceptual request path. A shared processing step can affect many unrelated websites."
    source: |
      @startuml
      layout vertical
      component Visitor
      component Cloudflare
      component WAF
      component Origin
      Visitor --> Cloudflare : request
      Cloudflare --> WAF : inspect
      WAF --> Origin : continue
      @enduml
  observations:
    type: component
    label: Symptoms and observations localize the investigation
    description: Requests reach Cloudflare's request workers. Observations identify exhausted serving CPU and activity in the web application firewall. Front-line servers return 502 errors to visitors. This is a synthesis of observations, not an instrument trace or a complete server topology.
    caption: "By 14:00 UTC, CPU observations, traces, and logs implicated the WAF. A component location is still short of a full diagnosis."
    source: |
      @startuml
      layout vertical
      component Requests
      component RequestWorkers
      component WAF
      component FrontLine
      component Visitors
      Requests --> RequestWorkers : work arrives
      RequestWorkers --> WAF : activity implicated
      note right of RequestWorkers : Serving CPU exhausted
      FrontLine --> Visitors : 502 errors
      @enduml
  rollout:
    type: component
    label: A rule change reaches request processing worldwide
    description: An approved rule passes build and functional tests, then Quicksilver distributes it to the WAF across the network. Incoming requests independently reach the WAF for evaluation. Simulate mode changes the action taken on a match, but whether evaluating this rule is expensive remains the question.
    caption: "Configuration distribution and request processing are different paths. A rule update can change computation without a server-binary release."
    source: |
      @startuml
      layout vertical
      component ApprovedRule
      component FunctionalTests
      component Quicksilver
      component WAF
      component Requests
      ApprovedRule --> FunctionalTests : build and test
      FunctionalTests --> Quicksilver : publish rule
      Quicksilver --> WAF : global configuration
      Requests --> WAF : evaluate rule
      @enduml
  blocked_progress:
    type: sequence
    label: Evaluation can consume resources before any blocking decision
    description: A request worker invokes WAF inspection, which calls the pattern matcher. Matching consumes excessive CPU and the worker does not make useful request progress in this simplified sequence. The front line returns 502 to the visitor. No deliberate WAF block decision is shown, and the sequence does not claim a recovered per-request timeout trace.
    caption: "Causal reconstruction of the resource dependency. Simulating a rule's action still requires computing its match."
    source: |
      @startuml
      actor visitor: Visitor
      participant front: Front line
      participant worker: Request worker
      participant waf: WAF
      participant matcher: Matcher
      visitor -> front: request page
      front -> worker: handle request
      worker -> waf: inspect
      waf -> matcher: evaluate pattern
      matcher -> matcher: excessive matching work
      note over worker: Useful progress impaired
      front --> visitor: 502 error
      @enduml
  recovery:
    type: state
    label: Availability returns before WAF protection is restored
    description: The service moves from unavailable to traffic recovered after global WAF termination. At the traffic-recovered state the WAF remains disabled; an outgoing transition toward WAF restoration still requires evidence. These states summarize the service response, not Cloudflare's software state machine.
    caption: "14:07 UTC: global WAF termination. By 14:09: traffic and CPU recovered. Restoring the security function is a separate obligation."
    source: |
      @startuml
      state Unavailable
      state TrafficRecovered
      state WAFRestored
      Unavailable --> TrafficRecovered : terminate WAF
      TrafficRecovered --> WAFRestored : evidence still required
      note right of TrafficRecovered : WAF remains disabled
      @enduml
  causal_test:
    type: sequence
    label: A controlled comparison tests the candidate rule
    description: An investigator evaluates the WAF without the candidate rule, with the candidate rule, and after removing it again, comparing outcomes under controlled conditions. Outcomes are deliberately not supplied here. The diagram represents a proposed experiment; it is not a transcript of historical commands.
    caption: "Keep input and environment comparable while varying the candidate cause. Confine any risky replay to an isolated setting."
    source: |
      @startuml
      actor investigator: Investigator
      participant setup: Isolated setup
      participant observer: Measurements
      investigator -> setup: candidate absent
      setup -> observer: record outcome
      investigator -> setup: candidate present
      setup -> observer: record outcome
      investigator -> setup: candidate removed again
      setup -> observer: record outcome
      @enduml
  outcomes:
    type: state
    label: Matching answers and resource outcomes are different
    description: In a proposed bounded experiment, evaluating a pattern can find a match, exhaust all candidates and report no match, or require another check after using the allowed budget. Only the first two are matching answers. The bounded experiment stops before performing a disallowed check. Budget exceeded is a resource outcome, not a negative matching answer.
    caption: "Teaching test contract. The budget and these states are not recovered production safeguards."
    source: |
      @startuml
      state Evaluating
      state Match
      state NoMatch
      state BudgetExceeded
      [*] --> Evaluating
      Evaluating --> Match : pattern found
      Evaluating --> NoMatch : candidates exhausted
      Evaluating --> BudgetExceeded : another check needed beyond budget
      @enduml
  repeated_candidates:
    type: sequence
    label: Different allocations can retry the same missing character
    description: The teaching matcher starts at the beginning of xxx. A first skip and a second skip can each consume any number of characters. With skip lengths three and zero, it tests for equals at the end and fails. With lengths two and one it tests the same end again and fails. With lengths two and zero it tests before the last x and fails. More allocations remain. These are three illustrative attempts, not the full production regex.
    caption: "Teaching trace: two overlapping skips followed by a required equals sign. The input xxx contains no equals sign."
    source: |
      @startuml
      participant choices: Skip lengths
      participant check: Equals check
      participant input: Input xxx
      choices -> check: first 3, second 0
      check -> input: test at end
      input --> check: missing equals
      choices -> check: first 2, second 1
      check -> input: test at same end
      input --> check: missing equals
      choices -> check: first 2, second 0
      check -> input: test before last x
      input --> check: missing equals
      note over choices: More allocations remain
      @enduml
  allocation_tree:
    type: sequence
    label: Ten allocations for only three characters
    description: For a three-character input and a fixed starting position, first-skip length three leaves one possible second-skip length, length two leaves two, length one leaves three, and length zero leaves four. These branches total ten checks for the required equals sign. Every check fails on xxx. Counts are for this explicit teaching model, not PCRE instructions.
    caption: "The search repeats work because several allocations reach the same input position. The branch counts are 1 + 2 + 3 + 4 = 10."
    source: |
      @startuml
      participant first: First skip
      participant second: Second skip
      first -> second: length 3 leaves 0 characters
      second --> first: 1 possible length
      first -> second: length 2 leaves 1 character
      second --> first: 2 possible lengths
      first -> second: length 1 leaves 2 characters
      second --> first: 3 possible lengths
      first -> second: length 0 leaves 3 characters
      second --> first: 4 possible lengths
      @enduml
  resource_chain:
    type: component
    label: A defect becomes a service failure through resource use
    description: Overlapping repetition in a backtracking pattern permits excessive search. With triggering input and inadequate protection, resource demand interferes with serving requests. Failed request handling becomes visible as 502 errors. This causal model distinguishes a defective implementation choice, an incorrect runtime condition relative to a resource requirement, and an external failure.
    caption: "A hot CPU alone is not a diagnosis. State the progress or resource requirement that the execution violates."
    source: |
      @startuml
      layout vertical
      component OverlappingRepetition
      component ExcessiveSearch
      component ImpairedRequestProgress
      component Visible502
      OverlappingRepetition --> ExcessiveSearch : triggering input
      ExcessiveSearch --> ImpairedRequestProgress : insufficient protection
      ImpairedRequestProgress --> Visible502 : service cannot complete
      @enduml
  repaired_model:
    type: state
    label: A single forward scan for the teaching contract
    description: The proposed teaching repair inspects the next unexamined character. Equals leads to Found. A different character advances to the next character. End of input leads to Absent. No transition revisits an earlier character. This is a specification for the tiny equals-search exercise, not a replacement for Cloudflare's security rule.
    caption: "Preserve the required answer while changing the search structure. This model inspects each input character at most once."
    source: |
      @startuml
      state InspectNext
      state Advance
      state Found
      state Absent
      [*] --> InspectNext
      InspectNext --> Found : equals found
      InspectNext --> Advance : other character
      Advance --> InspectNext : next unexamined position
      InspectNext --> Absent : end of input
      @enduml
  safeguards:
    type: component
    label: Different safeguards interrupt different causal links
    description: A rule enters performance testing, then staged deployment, then request matching. Bounded matching and runtime resource protection limit work at evaluation. A recovery path provides a way to remove a problematic rule. These are conceptual responsibilities drawn from the response measures, not a claim that every measure had already shipped in July 2019.
    caption: "Prevent expensive work, contain rollout exposure, and preserve recovery access. These are complementary obligations."
    source: |
      @startuml
      layout vertical
      component Rule
      component PerformanceTests
      component StagedRollout
      component BoundedMatching
      component RecoveryPath
      Rule --> PerformanceTests : challenge cost
      PerformanceTests --> StagedRollout : limit initial exposure
      StagedRollout --> BoundedMatching : serve requests
      RecoveryPath --> BoundedMatching : remove problematic rule
      @enduml
  restoration:
    type: state
    label: Three milestones establish different claims
    description: Traffic recovered at 14:09 UTC on 2 July. WAF service was restored at 14:52 after the bad rule was removed and isolated checks were performed. A later engine change in July 2019 is retrospectively confirmed by a 2020 article. This milestone diagram is not a complete release history or software state machine.
    caption: "Recovery, restoration, and later hardening are distinct milestones. The follow-up confirms the engine migration; a target date alone would not."
    source: |
      @startuml
      state TrafficRecovered
      state WAFRestored
      state EngineChanged
      TrafficRecovered --> WAFRestored : 14:52 UTC on July 2
      WAFRestored --> EngineChanged : later in July 2019
      note left of TrafficRecovered : 14:09 UTC on July 2
      note right of EngineChanged : Confirmed in 2020 account
      @enduml
  transfer:
    type: component
    label: A new incident with an unknown expensive component
    description: Uploads pass through a validator, then a report builder, before a result is returned. After a rule update, large uploads time out and CPU is high. The diagram does not identify which component consumes the CPU or whether the update caused the timeout. This is an invented transfer scenario.
    caption: "New scenario: preserve the debugging method while withholding the diagnosis. No regex defect has been established here."
    source: |
      @startuml
      layout vertical
      component Uploads
      component Validator
      component ReportBuilder
      component Result
      Uploads --> Validator : inspect content
      Validator --> ReportBuilder : accepted records
      ReportBuilder --> Result : build report
      note right of Uploads : Large uploads time out
      @enduml

scenes:
  - id: understand_service
    label: Understand the service
    title: Many websites fail. What is shared?
    purpose: Establish what a request is supposed to do before interpreting a failure.
    evidence: Published incident context; simplified architecture and original decision prompt.
    sources:
      - title: "Cloudflare: initial incident report, 2 July 2019"
        url: https://blog.cloudflare.com/cloudflare-outage/
      - title: "Cloudflare postmortem: first monitoring alert"
        url: https://blog.cloudflare.com/details-of-the-cloudflare-outage-on-july-2-2019/
    diagram: request_path
    cues:
      - step: Follow one ordinary request
        text: "It is 2 July 2019. Imagine you are helping investigate a major outage. A visitor asks for a web page. For a site using Cloudflare, that request reaches Cloudflare before any needed work continues to the site's own server, called its origin. Cloudflare supplies services shared by many independent websites. We will follow only the request inspection path; caching and other features are outside this diagram."
        note: "Goal: eligible requests should receive a useful response. We have not located a defect."
        visual: A visitor, Cloudflare, the inspection step, and the origin establish the request path.
      - step: Learn the shared responsibility
        text: "The web application firewall, abbreviated WAF, examines requests for suspicious patterns. A rule describes something to recognize and what to do when it is recognized. The processor, or CPU, performs that work. Its capacity is finite: work spent inspecting one request is capacity unavailable for other work. The inspection step therefore has both a security responsibility and a progress obligation."
        note: A permitted request still needs inspection to finish before it can proceed.
        visual: The WAF sits on the request path rather than beside it as an optional report.
      - step: Start from the symptom
        text: "Now visitors to many sites see 502 errors. That status says a gateway could not successfully complete its upstream work; it does not name the defective component. Cloudflare's first synthetic monitoring alert arrived at 13:45 UTC. A synthetic monitor sends test requests to observe the service. You have a symptom and a shared dependency, but you do not yet know whether demand increased, origins failed, or request processing became expensive. Which evidence should you seek first?"
        note: All historical times in this investigation use UTC. The choices are teaching reconstructions, not responder dialogue.
        visual: The same request path supports several competing explanations for a failed response.
        prediction: true
    checkpoint:
      question: What should you compare before selecting an explanation for widespread 502 errors?
      options:
        - Incoming request volume, serving CPU, and where request workers spend their time.
        - The error number alone, because it uniquely identifies an origin-server defect.
        - The number of affected sites alone, because a broad outage establishes an attack.
      correct_index: 0
      explanation: "Compare demand with the cost and location of processing. The shared symptom localizes a concern, but observations along the request path are needed to distinguish competing explanations. Preserve the relevant time window and configuration as well."
      option_feedback:
        1: A 502 identifies a failed gateway interaction. Several failures along the request path can produce it.
        2: Many affected sites share infrastructure. Broad impact does not establish who or what caused it.

  - id: localize
    label: Locate the work
    title: The processors are busy. Busy doing what?
    purpose: Use component evidence and a recent change as leads, without treating correlation as proof.
    evidence: Published timeline and findings; diagram summarizes observations rather than reproducing logs.
    sources:
      - title: "Cloudflare postmortem: investigation timeline and deployment"
        url: https://blog.cloudflare.com/details-of-the-cloudflare-outage-on-july-2-2019/
      - title: "Cloudflare initial report: simulate mode logs matches"
        url: https://blog.cloudflare.com/cloudflare-outage/
    diagram: observations
    cues:
      - step: Use the new evidence
        text: "By 14:00, processor observations, system traces, and logs pointed to the WAF. Front-line servers accept traffic and delegate work to request-handling processes, called workers. The CPU serving web traffic was exhausted. A trace observes execution activity; a profile summarizes where time is spent. Either can narrow an investigation toward expensive work. Neither, by itself, explains why that work is excessive. The failure to visitors remains the 502 response."
        note: "Known: WAF activity is implicated. Unknown: the precise mechanism and the conditions that trigger it."
        visual: Serving CPU and WAF activity narrow the search behind the visible 502 symptom.
      - step: Inspect the change path
        diagram: rollout
        text: "The team had just deployed a new rule intended to improve detection of cross-site scripting, an attack involving unwanted script execution in a web application. The change was merged at 13:31, built and tested at 13:37, and began rolling out at 13:42. Quicksilver distributed the configuration globally. Positive and negative matching tests passed. The rule was in simulate mode: matches would be logged rather than deliberately blocking requests. That is useful context, but what does it actually tell us about evaluation cost?"
        note: Functional tests check expected matching answers. They do not automatically establish a bound on computation.
        visual: Configuration and incoming requests meet at the WAF, even without a new server binary.
        prediction: true
    checkpoint:
      question: Does simulate mode rule out the new rule as a cause of CPU exhaustion?
      options:
        - Yes, because logging a match means the matcher never runs.
        - No; inspect the cost of evaluating the rule before it decides whether there is a match.
        - Yes, because passing positive and negative tests proves acceptable cost on all inputs.
      correct_index: 1
      explanation: Simulate mode changes the consequence of a match. The system must still evaluate the pattern to discover that match. Functional correctness and affordable evaluation are separate questions. The deployed rule is a candidate cause that needs further evidence.
      option_feedback:
        0: Logging a match requires first determining whether a match occurred. Simulation does not remove that computation.
        2: The tests establish results for tested cases. Missing resource checks can leave expensive behavior undetected.

  - id: contain
    label: Contain the outage
    title: Restore progress while the mechanism is still being investigated
    purpose: Distinguish an urgent containment decision from a completed repair.
    evidence: Published WAF resource dependency; simplified causal sequence and reconstructed decision.
    sources:
      - title: "Cloudflare postmortem: global WAF termination"
        url: https://blog.cloudflare.com/details-of-the-cloudflare-outage-on-july-2-2019/
    diagram: blocked_progress
    cues:
      - step: Connect computation to the symptom
        text: "The request worker needs inspection to complete. Inspection invokes a regular-expression matcher: a program that checks text against a pattern. In this incident, excessive matching work consumed the CPU needed to serve requests. The front-line servers consequently produced 502 errors. No intentional rule-based block is needed for that failure. This sequence explains the dependency; it is not a recovered trace of one particular visitor's request."
        note: The rule's action can be harmless while computing its condition is expensive.
        visual: Matching work delays progress before an ordinary inspection result can return.
      - step: Make the operational tradeoff
        text: "Availability is failing now. The WAF is implicated, and responders can terminate its operation globally. A narrower rollback would be desirable if it can be executed promptly, but the postmortem describes delays and obstructed access to recovery systems. The immediate objective is to stop the expensive work and restore request progress. Disabling a security function also has a cost that must be tracked. Choose the strongest immediate action among these options."
        note: Your decision concerns containment under the stated evidence, not a claim that the underlying defect is repaired.
        visual: The dependency diagram shows why continuing matching work can keep the service unavailable.
        prediction: true
    checkpoint:
      question: With the WAF implicated and global termination available, which action best addresses the ongoing outage?
      options:
        - Leave the WAF running until every detail of the matching algorithm has been proved.
        - Switch the rule to simulate mode and assume its evaluation cost disappears.
        - Terminate the WAF, monitor recovery, and track the temporary loss of that protection.
      correct_index: 2
      explanation: "This is containment: remove implicated work from the critical path, check whether service recovers, and keep the missing security function visible as an unresolved obligation. Historically, global termination was proposed at 14:02 and executed at 14:07. Other Cloudflare protections remained active."
      option_feedback:
        0: Detailed diagnosis matters, but waiting preserves the observed service failure when a containment action is available.
        1: The rule was already in simulate mode. Evaluation still runs before the simulated action.

  - id: reproduce
    label: Reproduce safely
    title: Traffic returns. Which claim still needs evidence?
    purpose: Turn a candidate explanation into a controlled comparison.
    evidence: Published recovery milestone; the comparison diagram is an original experimental plan.
    sources:
      - title: "Cloudflare postmortem: recovery and isolated checks"
        url: https://blog.cloudflare.com/details-of-the-cloudflare-outage-on-july-2-2019/
    diagram: recovery
    cues:
      - step: Separate recovery from diagnosis
        text: "By 14:09, traffic and CPU had recovered. That supports the WAF containment decision, but it does not mean the WAF's security function is restored or identify every detail of the defective rule. Removing an entire component changes many things at once. We now need stronger evidence that the particular rule, under relevant inputs, explains the excessive work."
        note: "Known: removing WAF work restored service. Still needed: a more specific causal test."
        visual: Traffic recovery occurs before the transition to WAF restoration.
      - step: Design the comparison before seeing its result
        diagram: causal_test
        text: "A reproducer must specify input, rule version, matching engine, and relevant configuration. An oracle is the criterion that tells us whether the observed outcome satisfies the requirement. In an isolated setup, compare candidate absent, candidate present, and candidate removed again while keeping the other conditions comparable. Observe both the service behavior and resource use. The public account does not publish the actual triggering requests, so we will not invent them."
        note: Isolation prevents a diagnostic replay from recreating the full production outage.
        visual: Three controlled evaluations vary the candidate while preserving comparable conditions.
        prediction: true
    checkpoint:
      question: A colleague tests small requests with the candidate absent and large requests with it present. The second trial is slower. What should you do next?
      options:
        - Repeat with comparable inputs and settings while varying the candidate, including rollback and resource observations.
        - Conclude that the rule caused the slowdown because the two configurations behaved differently.
        - Conclude that request size caused the slowdown because larger requests always require more time.
      correct_index: 0
      explanation: "Both the candidate rule and input size changed, so this comparison cannot separate their effects. Repeat under comparable conditions in isolation. Historically, Cloudflare used an isolated city and traffic excluding paying customers to test the rule's causality and rollback before restoring the WAF. The confounded trial and diagram are teaching examples, not their exact commands."
      option_feedback:
        1: The different result could depend on the changed input, the changed rule, or their interaction. The comparison changed more than one relevant condition.
        2: Size is a plausible factor, but the rule also changed. This observation alone cannot establish which change explains the slowdown.

  - id: define_oracles
    label: Define the failure
    title: A correct answer can still arrive too expensively
    purpose: Specify both a functional oracle and a resource oracle.
    evidence: Historical causal finding; original bounded model for explaining performance debugging.
    sources:
      - title: "Cloudflare postmortem: expensive regular-expression matching"
        url: https://blog.cloudflare.com/details-of-the-cloudflare-outage-on-july-2-2019/
      - title: "The Debugging Book: debugging performance issues"
        url: https://www.debuggingbook.org/html/PerformanceDebugger.html
    diagram: outcomes
    cues:
      - step: Move from the incident to a small model
        text: "The isolated checks supported the new rule as the cause. Its regular expression could make a backtracking matcher explore excessive alternatives. To understand that mechanism without source code, we will use a much smaller teaching task: decide whether a single-line text contains an equals sign. This is not the original security rule, and our example text is not a recovered incident request."
        note: Keep the historical conclusion separate from the simplified mechanism we can trace completely.
        visual: Evaluation can finish with a matching answer or stop at a work limit.
      - step: State two obligations
        text: "For this model, the functional obligation is to answer present if an equals sign exists, and absent otherwise. One candidate check asks whether an equals sign occurs at one proposed input position; revisiting a position counts again. We add a teaching budget: count the characters, add one, and multiply by four. For seven characters, at most thirty-two checks are allowed. This invented budget distinguishes a correct eventual answer from an acceptable execution."
        note: "Teaching budget: 4 × (length + 1) candidate checks. It is not a Cloudflare service limit."
        visual: Match and NoMatch are functional answers; BudgetExceeded is a separate resource outcome.
      - step: Predict the classification
        text: "Suppose the input has no equals sign. Evaluation stops because it reaches the work limit before finishing. We have not established the matching answer merely by stopping. Which result should the experiment record?"
        note: A measurement-tool crash would be another outcome requiring investigation, not evidence that the matcher passed.
        visual: The transition to BudgetExceeded differs from exhausting the candidate set and reaching NoMatch.
        prediction: true
    checkpoint:
      question: How should the bounded experiment classify evaluation stopped at its work limit?
      options:
        - As a successful negative match, because no match was reported before stopping.
        - As budget exceeded, keeping that distinct from a completed negative result.
        - As proof of an infinite loop, because the result was not yet available.
      correct_index: 1
      explanation: "A timeout or work limit is an observation about resources or progress. It is not the matcher answering absent, and it does not prove nontermination. Preserve distinct outcomes so a reducer or regression test cannot silently convert the performance failure into a passing negative case."
      option_feedback:
        0: Absence of an answer is not an answer of absence. The candidate search did not complete within the budget.
        2: A finite computation can be much too expensive. Observing a limit does not prove an infinite loop.

  - id: trace_search
    label: Trace the alternatives
    title: Why can three characters produce repeated work?
    purpose: Explain backtracking with explicit allocations rather than unexplained regex syntax.
    evidence: Original finite teaching trace motivated by the postmortem's simplified pattern analysis.
    sources:
      - title: "Cloudflare postmortem: explanation of backtracking"
        url: https://blog.cloudflare.com/details-of-the-cloudflare-outage-on-july-2-2019/
    diagram: repeated_candidates
    cues:
      - step: Understand the matcher before tracing it
        text: "Our deliberately inefficient matcher starts at the beginning of the text. It lets a first skip consume any number of characters, then lets a second skip do the same, then requires an equals sign. If that requirement fails, it revises earlier choices. Trying alternative earlier choices is backtracking. Both skips can consume the same kinds of characters, so more than one allocation can lead to the same next position."
        note: A skip may consume zero characters. The starting position stays fixed throughout this model.
        visual: Separate allocations determine where the required equals sign is tested.
      - step: Follow three attempts on xxx
        text: "The input is three x characters, with no equals sign. First, the skips consume three and zero characters: the equals check fails at the end. Next, they consume two and one: the check fails at the same end. Next, they consume two and zero: the check fails before the last x. The diagram shows only three attempts. Each attempt is locally understandable, but some revisit a position that was already checked."
        note: We count candidate equals checks, not seconds, processor instructions, or production PCRE calls.
        visual: Two distinct allocations retry the same end position before another position is tested.
      - step: Predict the remaining search
        text: "Hold the first skip at length one. On our three-character input, the second skip can then consume two, one, or zero characters. None produces an equals sign. Once those choices fail, the first skip can become zero and the second has four lengths to try. What does this suggest about shortening the input by one character?"
        note: Think about the number of possible allocations, not just the number of distinct character positions.
        visual: The trace leaves further allocations outstanding; a failed attempt can reopen an earlier choice.
        prediction: true
    checkpoint:
      question: For input xx, keep the starting position fixed and try all valid lengths of both skips. How many candidate equals checks are made before concluding absent?
      options:
        - Three checks, one at each distinct input boundary.
        - Nine checks, because each skip can independently have length zero, one, or two.
        - Six checks, counting the valid allocations of two characters between the skips.
      correct_index: 2
      explanation: "A first skip of length two leaves one possible second length; length one leaves two; length zero leaves three. That gives 1 + 2 + 3 = 6 checks. Three characters allow ten, so deleting one character removes four allocations. This finite branching explains repeated work without an infinite loop."
      option_feedback:
        0: There are three distinct boundaries, but different allocations can revisit a boundary. Count allocations as well as positions.
        1: The skips share the same two characters. An allocation whose combined length exceeds two is invalid, so the choices are not independent.

  - id: minimize
    label: Reduce the reproducer
    title: A smaller example is useful only if it preserves the failure
    purpose: Choose a reduction criterion that retains the expensive behavior.
    evidence: Exact counts for the original fixed-start model; no production timing or instruction counts.
    sources:
      - title: "The Debugging Book: reducing failure-inducing inputs"
        url: https://www.debuggingbook.org/html/DeltaDebugger.html
      - title: "Davis dissertation: Cloudflare analysis, section 3.3"
        url: https://davisjam.github.io/files/publications/Davis-Dissertation-2020.pdf
    diagram: allocation_tree
    cues:
      - step: Count the branching
        text: "For three characters, the four first-skip lengths leave one, two, three, and four choices for the second skip: ten candidate checks in total. More generally, each added character extends several possible allocations. Seven non-equals characters require thirty-six checks; thirty-two require five hundred sixty-one. These counts describe our fixed-start model. They do not measure Cloudflare's full expression, engine optimizations, or actual incident traffic."
        note: The model grows quadratically. The full production pattern has additional structure and can exhibit higher polynomial growth under analyzed assumptions.
        visual: The branches expose how alternative allocations accumulate even when the required symbol is absent.
      - step: Preserve the diagnostic property
        text: "We want a compact reproducer that still exceeds our teaching budget. At length seven, thirty-six candidate checks exceed the budget of thirty-two. At length six, twenty-eight checks equal the budget of twenty-eight, so the run completes within it. Deleting text until the matcher merely returns absent could erase the resource failure. Which property should a reduction attempt preserve?"
        note: Recompute the size-dependent budget for each candidate input. An invalid experiment is unresolved, not a successful reduction.
        visual: Branching counts explain why reducing size can remove the failure even while the matching answer stays unchanged.
        prediction: true
    checkpoint:
      question: What should remain true when minimizing this performance reproducer?
      options:
        - The same resource criterion still fails under the specified matching conditions.
        - The input is shorter, even if the expensive behavior disappears.
        - The eventual matching answer is absent, regardless of how much work is needed.
      correct_index: 0
      explanation: "A reducer needs the failure predicate, not just any observable result. For this family and budget, seven repeated non-equals characters are the first failing length. That restricted result is not proof of the globally smallest reproducer for the original regex. Delta debugging also depends on the oracle and the reductions it is allowed to try."
      option_feedback:
        1: Smaller is useful only while the diagnostic property remains. Otherwise you have minimized away the bug's manifestation.
        2: Absent is a valid functional answer for these inputs. It does not distinguish affordable from excessive evaluation.

  - id: diagnose
    label: Explain the cause
    title: Where does expensive work become an incorrect execution?
    purpose: Connect a causal mechanism to a stated requirement and distinguish defect, infection, and failure.
    evidence: Historical causal account with explicitly separate teaching requirements and terminology.
    sources:
      - title: "The Debugging Book: defects, infections, and failures"
        url: https://www.debuggingbook.org/html/Intro_Debugging.html
      - title: "Cloudflare postmortem: contributing causes"
        url: https://blog.cloudflare.com/details-of-the-cloudflare-outage-on-july-2-2019/
    diagram: resource_chain
    cues:
      - step: Explain both causality and incorrectness
        text: "We now have a causal mechanism: overlapping repetition allows a backtracking engine to explore many allocations; triggering inputs make that work expensive; inadequate protection lets the work interfere with serving requests. We also need incorrectness: which obligation is violated? A CPU being busy can be normal. Failure to make required request progress, or exceeding a specified work budget, supplies the missing requirement."
        note: A hot component is a location. A mechanism plus a violated requirement supports a diagnosis.
        visual: The causal chain separates implementation structure, resource effects, and visible service failure.
      - step: Translate the terminology
        text: "The parent Debugging chapter calls the implementation problem a fault and an incorrect runtime state an error. The Debugging Book calls them a defect and a fault or infection. Both use failure for externally incorrect behavior. On seven characters, a thirty-third check would exceed our model's budget; the bounded experiment stops before performing it. For the real service, visitors saw 502 errors. The public report does not provide one exact instruction where every incident request first became incorrect."
        note: "Parent chapter: fault → error → failure. Debugging Book: defect → infection → failure."
        visual: Each link in the chain answers a different question about what is wrong and where it becomes observable.
      - step: Challenge an incomplete diagnosis
        text: "The full incident also involved missing barriers. A CPU safeguard had been removed during an earlier refactor, cost checks were absent from testing, and rule rollout bypassed ordinary staged deployment. Those conditions help explain why one expensive rule became a global outage. Which statement best captures a defensible diagnosis?"
        note: Do not infer a programmer's thoughts from the defective behavior, or blame an operator for submitting an allowed input.
        visual: Insufficient protection connects expensive local work to widespread inability to serve requests.
        prediction: true
    checkpoint:
      question: Which diagnosis explains the observed failure rather than only renaming a symptom?
      options:
        - The CPU was high, so high CPU must always be a software failure.
        - The input activated excessive backtracking; missing safeguards let it violate request-progress obligations and cause 502 responses.
        - The service returned an error message, so the code constructing that message must contain the original defect.
      correct_index: 1
      explanation: "The diagnosis joins a triggering condition, a computation mechanism, propagation through shared resources, and a violated requirement. The 502 response can be correct error handling by the front line while the overall service still fails its availability obligation."
      option_feedback:
        0: Utilization is a measurement. A requirement and a causal explanation are needed to establish incorrectness.
        2: Reporting a downstream failure is not necessarily the source of it. Follow the dependency that prevented useful work.

  - id: repair
    label: Repair and verify
    title: Change the search while preserving the answer
    purpose: Judge a repair by functional behavior and bounded work, including ordinary successful cases.
    evidence: Original repair specification for the tiny equals-search model; not Cloudflare's production patch.
    sources:
      - title: "The Debugging Book: diagnosis and repair"
        url: https://www.debuggingbook.org/html/Intro_Debugging.html
    diagram: repaired_model
    cues:
      - step: Repair the model's mechanism
        text: "For our small task, a forward scan is enough. Inspect the next unexamined character. If it is equals, report present. Otherwise advance. At the end, report absent. No earlier position is revisited. That preserves the tiny task's intended answer while inspecting each character at most once. This is a teaching repair for finding equals, not a substitute for a security rule that must recognize more complex patterns."
        note: The proposed state machine states a behavior to implement and verify; drawing it does not establish a production fix.
        visual: Every unsuccessful inspection advances to a new character instead of reopening earlier allocations.
      - step: Select evidence for the repair
        text: "Retain the original failing seven-character negative case and longer negative cases. Also challenge behavior on empty input and equals at the beginning, middle, and end. A matcher that always reports absent would be fast but wrong. A repair that merely raises the budget would leave the allocation growth unchanged. Which evidence would justify the strongest bounded claim about this repair?"
        note: Test intended success as well as the failure history; compare answers and work under explicit assumptions.
        visual: The Found and Absent outcomes remain reachable, while repeated searching is removed from this model.
        prediction: true
    checkpoint:
      question: What must verification establish for the proposed forward-scan repair?
      options:
        - That the original negative example runs quickly, even if positive examples now fail.
        - That the timeout is longer, because finishing one run proves the growth is acceptable.
        - That matching answers are preserved and work stays within the stated budget on the chosen test family, supported by the no-revisit reasoning.
      correct_index: 2
      explanation: "Use both oracles. Positive and negative cases check intended function; the old reproducer and growing inputs challenge cost. The state-machine argument explains a linear inspection bound for this model because each advance reaches a new character. This does not prove the correctness of an unexamined implementation or of Cloudflare's entire rule set."
      option_feedback:
        0: A fast wrong answer is still a failure. The original functionality must survive the repair.
        1: Raising a limit can hide one manifestation without changing the excessive search structure.

  - id: harden
    label: Prevent recurrence
    title: Why fixing one rule is not the whole response
    purpose: Match each protection to the causal link it can interrupt.
    evidence: Published completed actions and planned response measures, shown as conceptual responsibilities.
    sources:
      - title: "Cloudflare postmortem: corrective actions and target dates"
        url: https://blog.cloudflare.com/details-of-the-cloudflare-outage-on-july-2-2019/
    diagram: safeguards
    cues:
      - step: Preserve several independent obligations
        text: "Return to the real service. Removing the offending rule addresses that deployed trigger. Performance tests challenge costly inputs before release. A matching engine with appropriate complexity guarantees changes what evaluation can cost. Runtime protection limits damage when work is still too expensive. Staged deployment exposes a smaller portion of traffic before expansion. A recovery path must remain usable when ordinary serving is impaired. These measures address different parts of the chain."
        note: An arrow between conceptual responsibilities does not prove that implementation safeguards are independent.
        visual: Testing, rollout, evaluation, and recovery intervene at different points.
      - step: Keep reported status precise
        text: "The July 12 postmortem reported restoration of CPU protection and inspection of the existing rules as completed. Other measures had future target dates, including performance profiling tests and an engine transition. A promised date is evidence of a plan, not proof it shipped. Suppose a rule passes a small staged rollout. What can that observation establish?"
        note: The diagram groups response obligations. It is not a snapshot proving all changes were deployed at publication.
        visual: A stage of rollout limits initial exposure but does not enumerate every possible input.
        prediction: true
    checkpoint:
      question: What does a successful small rollout establish about a changed rule?
      options:
        - Evidence under that stage's traffic and conditions, with monitoring and rollback still needed as exposure grows.
        - Proof that no unobserved input can cause excessive work.
        - Proof that matching correctness no longer needs testing because rollout was staged.
      correct_index: 0
      explanation: A staged rollout limits initial blast radius and supplies operational evidence. Its input distribution and duration bound the claim. It complements performance analysis, functional tests, runtime limits, and recovery; it does not replace them.
      option_feedback:
        1: A small traffic sample can miss uncommon or longer inputs. Successful observation is not exhaustive proof.
        2: Deployment strategy does not establish matching semantics. A cheaply evaluated rule can still make wrong security decisions.

  - id: verify_history
    label: Check the outcome
    title: Which historical claim is actually supported?
    purpose: Distinguish recovery, restoration, and confirmed later remediation.
    evidence: Published July 2019 milestones and the July 2020 retrospective confirmation.
    sources:
      - title: "Cloudflare postmortem: WAF restoration at 14:52 UTC"
        url: https://blog.cloudflare.com/details-of-the-cloudflare-outage-on-july-2-2019/
      - title: "Cloudflare, 2020: transitioning from PCRE to an RE2-inspired engine"
        url: https://blog.cloudflare.com/making-the-waf-40-faster/
    diagram: restoration
    cues:
      - step: Verify what returned when
        text: "Traffic recovered by 14:09 with the WAF disabled. At 14:52, after removing the bad rule and performing isolated checks, the WAF was re-enabled. The detailed report describes a twenty-seven-minute outage; the longer time until WAF restoration is a different interval. Mixing these milestones would hide the period of reduced security functionality."
        note: Recovery of one service property does not imply restoration of every service responsibility.
        visual: Traffic recovery and WAF restoration occupy different milestones on July 2.
      - step: Use later evidence for a later claim
        text: "A July 2020 follow-up confirms that the WAF migrated in July 2019 from PCRE to an engine inspired by RE2. It reports reduced matching-time outliers, while overall edge CPU consumption did not measurably change. The article also describes a separate optimization yielding its forty-percent headline. We should not attribute that whole headline to the engine migration. Which conclusion fits these sources?"
        note: The later report confirms a migration. It does not prove that every future performance failure is impossible.
        visual: Engine change is a later milestone supported by retrospective evidence.
        prediction: true
    checkpoint:
      question: Which statement respects the evidence and its limits?
      options:
        - At 14:09 the WAF had been fully restored and every long-term remediation was complete.
        - Traffic recovered first, WAF service returned later, and a later account confirms the engine migration.
        - The engine migration alone made the entire edge service forty percent faster.
      correct_index: 1
      explanation: "The sources support distinct claims at distinct times. This is also a debugging habit: record exactly what an observation establishes, and keep unresolved or untested claims separate from completed work."
      option_feedback:
        0: At 14:09 the WAF was still disabled. Its restoration and long-term hardening belong to later milestones.
        2: The follow-up distinguishes the migration's effects from the separate optimization behind that headline.

  - id: transfer
    label: Investigate a new case
    title: Apply the method without copying the diagnosis
    purpose: Transfer evidence-driven debugging to a different service.
    evidence: Original transfer exercise. This is not another reported Cloudflare incident.
    sources:
      - title: "The Debugging Book: scientific investigation of failures"
        url: https://www.debuggingbook.org/html/Intro_Debugging.html
    diagram: transfer
    cues:
      - step: Orient to a new system
        text: "A separate service accepts uploaded records. A validator checks them, then a report builder produces a summary. After a rule update, large uploads time out and CPU usage is high. Smaller uploads often succeed. You have not yet measured where the time goes. The validator might be expensive, the report builder might repeat work, or demand might have changed. Nothing here establishes a regular-expression defect."
        note: "Your goal: identify a discriminating observation and preserve a meaningful failure predicate."
        visual: Validation and report building are separate possible sources of expensive work.
      - step: Choose a defensible next action
        text: "Make an investigation note: state the expected result and resource obligation, preserve a failing upload and configuration, and name at least two explanations. Then choose an observation that could separate them. After the choice, write one positive test and one cost test you would retain when a repair is proposed. Use the four stages: investigate and reproduce, locate, explain, then repair and verify. Evidence can send you back to an earlier stage."
        note: The four-stage structure is a teaching organization of Zeller's methods, not a verbatim list or a claim about the historical responders.
        visual: Follow the work across boundaries before selecting a repair for one box.
        prediction: true
    checkpoint:
      question: Which next action best follows the evidence in this new incident?
      options:
        - Replace the validator's regex engine immediately because the symptoms resemble Cloudflare.
        - Delete records until any upload succeeds, then treat that successful input as the reproducer.
        - Measure time at validation and report-building boundaries, then compare controlled versions while preserving the failing input and cost criterion.
      correct_index: 2
      explanation: "First obtain evidence that distinguishes candidate causes. A repeatable input and explicit oracle let you compare versions and later evaluate a repair. Follow with a changed-input prediction that could falsify your explanation. The transferable result is a method for selecting evidence, not a rule that every high-CPU outage is a regex bug."
      option_feedback:
        0: Similar symptoms do not establish the same cause. The expensive work has not yet been localized.
        1: That produces a passing example. Reduction is useful only while it preserves the failure being investigated.
