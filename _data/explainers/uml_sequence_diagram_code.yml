java:
  label: Java
  filename: Mission.java
  note: Fields that the demo prints are package-private, so the Mission class in the same file can read them.
  imports: |
    import java.util.ArrayList;
    import java.util.List;
  blocks:
    sound:
      source: |
        class SoundPlayer {
            final List<String> queued = new ArrayList<>();

            void play(String sound) {
                // Queue the sound; the audio thread plays it later.
                queued.add(sound);
            }
        }

        class StarMap {
            final int rocks;

            StarMap(int rocks) {
                this.rocks = rocks;
            }
        }
      focus:
        play: [4, 5, 6, 7]
        star_map: [10, 11, 13, 14, 15, 16]
    asteroid:
      source: |
        class Asteroid {
            final String name;
            int unscanned;
            int crystals;
            int tagged = 0;

            Asteroid(String name, int unscanned, int crystals) {
                this.name = name;
                this.unscanned = unscanned;
                this.crystals = crystals;
            }

            int scan(int power) {
                unscanned = Math.max(0, unscanned - power);
                return unscanned;
            }

            int collectSample() {
                int sample = crystals;
                crystals = 0;
                return sample;
            }

            void tag(int passes) {
                tagged = passes;
            }
        }
      focus:
        operations: [13, 18, 24]
    probe:
      source: |
        class Probe {
            private final int level;
            private final SoundPlayer sfx;
            int crystals = 0;
            StarMap starMap;

            Probe(int level, SoundPlayer sfx) {
                this.level = level;
                this.sfx = sfx;
            }

            void scanAll(List<Asteroid> rocks) {
                sfx.play("ping");
                int power = scanPower();
                int scanned = 0;
                for (Asteroid rock : rocks) {
                    int unscanned = rock.scan(power);
                    if (unscanned == 0) {
                        crystals += rock.collectSample();
                        scanned++;
                    } else {
                        rock.tag(2);
                    }
                }
                if (scanned == rocks.size()) {
                    starMap = new StarMap(scanned);
                    sfx.play("chime");
                }
            }

            private int scanPower() {
                return 3 * level;
            }
        }
      focus:
