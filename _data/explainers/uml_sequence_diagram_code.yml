    recharge:
      source: |
        class Drone {
            int battery;
            final int capacity;

            Drone(int battery, int capacity) {
                this.battery = battery;
                this.capacity = capacity;
            }

            boolean lowBattery() {
                return 2 * battery < capacity;
            }

            void recharge(int amount) {
                battery = Math.min(capacity, battery + amount);
            }
        }

        class Dock {
            private final SoundPlayer sfx;

            Dock(SoundPlayer sfx) {
                this.sfx = sfx;
            }

            void rechargeAll(List<Drone> drones) {
                for (Drone drone : drones) {
                    boolean low = drone.lowBattery();
                    if (low) {
                        drone.recharge(5);
                    }
                }
                sfx.play("beep");
            }
        }
