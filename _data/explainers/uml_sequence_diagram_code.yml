        class Asteroid {
        public:
            Asteroid(std::string name, int unscanned, int crystals)
                : name(std::move(name)), unscanned(unscanned), crystals(crystals) {}

            int scan(int power) {
                unscanned = std::max(0, unscanned - power);
                return unscanned;
            }

            int collectSample() {
                return std::exchange(crystals, 0);
            }

            void tag(int passes) {
                tagged = passes;
            }

            std::string name;
            int unscanned;
            int crystals;
            int tagged = 0;
        };
