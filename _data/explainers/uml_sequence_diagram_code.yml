        class Drone:
            def __init__(self, battery: int, capacity: int) -> None:
                self.battery = battery
                self.capacity = capacity

            def low_battery(self) -> bool:
                return 2 * self.battery < self.capacity

            def recharge(self, amount: int) -> None:
                self.battery = min(self.capacity, self.battery + amount)


