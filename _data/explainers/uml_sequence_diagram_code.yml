python:
  label: Python
  filename: probe.py
  note: Python passes the rocks as a list. Every name in a sequence diagram follows the design's camelCase spelling, so scan_all appears there as scanAll.
  imports: |
    from __future__ import annotations
  blocks:
    sound:
      source: |
        class SoundPlayer:
            def __init__(self) -> None:
                self.queued: list[str] = []

            def play(self, sound: str) -> None:
                # Queue the sound; the audio thread plays it later.
                self.queued.append(sound)


        class StarMap:
            def __init__(self, rocks: int) -> None:
                self.rocks = rocks
      focus:
        play: [5, 6, 7]
        star_map: [10, 11, 12]
    asteroid:
      source: |
        class Asteroid:
            def __init__(self, name: str, unscanned: int, crystals: int) -> None:
                self.name = name
                self.unscanned = unscanned
                self.crystals = crystals
                self.tagged = 0

            def scan(self, power: int) -> int:
                self.unscanned = max(0, self.unscanned - power)
                return self.unscanned

            def collect_sample(self) -> int:
                sample, self.crystals = self.crystals, 0
                return sample

            def tag(self, passes: int) -> None:
                self.tagged = passes
      focus:
        operations: [8, 12, 16]
    probe:
      source: |
        class Probe:
            def __init__(self, level: int, sfx: SoundPlayer) -> None:
                self.level = level
                self.sfx = sfx
                self.crystals = 0
                self.star_map: StarMap | None = None

            def scan_all(self, rocks: list[Asteroid]) -> None:
                self.sfx.play("ping")
                power = self.scan_power()
                scanned = 0
                for rock in rocks:
                    unscanned = rock.scan(power)
                    if unscanned == 0:
                        self.crystals += rock.collect_sample()
                        scanned += 1
                    else:
                        rock.tag(2)
                if scanned == len(rocks):
                    self.star_map = StarMap(scanned)
                    self.sfx.play("chime")

            def scan_power(self) -> int:
                return 3 * self.level
