typescript:
  label: TypeScript
  filename: probe.ts
  note: Fields are declared and assigned explicitly, so the example runs with type stripping as well as with tsc.
  imports: ""
  blocks:
    sound:
      source: |
        class SoundPlayer {
          readonly queued: string[] = [];

          play(sound: string): void {
            // Queue the sound; the audio thread plays it later.
            this.queued.push(sound);
          }
        }

        class StarMap {
          readonly rocks: number;

          constructor(rocks: number) {
            this.rocks = rocks;
          }
        }
      focus:
        play: [4, 5, 6, 7]
        star_map: [10, 11, 13, 14, 15, 16]
    asteroid:
      source: |
        class Asteroid {
          readonly name: string;
          unscanned: number;
          crystals: number;
          tagged = 0;

          constructor(name: string, unscanned: number, crystals: number) {
            this.name = name;
            this.unscanned = unscanned;
            this.crystals = crystals;
          }

          scan(power: number): number {
            this.unscanned = Math.max(0, this.unscanned - power);
            return this.unscanned;
          }

          collectSample(): number {
            const sample = this.crystals;
            this.crystals = 0;
            return sample;
          }

          tag(passes: number): void {
            this.tagged = passes;
          }
        }
      focus:
        operations: [13, 18, 24]
    probe:
      source: |
        class Probe {
          crystals = 0;
          starMap: StarMap | null = null;
          private readonly level: number;
          private readonly sfx: SoundPlayer;

          constructor(level: number, sfx: SoundPlayer) {
            this.level = level;
            this.sfx = sfx;
          }

          scanAll(rocks: Asteroid[]): void {
            this.sfx.play("ping");
            const power = this.scanPower();
            let scanned = 0;
            for (const rock of rocks) {
              const unscanned = rock.scan(power);
              if (unscanned === 0) {
                this.crystals += rock.collectSample();
                scanned += 1;
              } else {
                rock.tag(2);
              }
            }
            if (scanned === rocks.length) {
              this.starMap = new StarMap(scanned);
              this.sfx.play("chime");
            }
          }

          private scanPower(): number {
            return 3 * this.level;
          }
        }
