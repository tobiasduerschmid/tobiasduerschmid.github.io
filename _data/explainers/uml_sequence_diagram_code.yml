        class Probe {
        public:
            Probe(int level, SoundPlayer& sfx) : level(level), sfx(sfx) {}

            void scanAll(const std::vector<Asteroid*>& rocks) {
                sfx.play("ping");
                int power = scanPower();
                std::size_t scanned = 0;
                for (Asteroid* rock : rocks) {
                    int unscanned = rock->scan(power);
                    if (unscanned == 0) {
                        crystals += rock->collectSample();
                        ++scanned;
                    } else {
                        rock->tag(2);
                    }
                }
                if (scanned == rocks.size()) {
                    starMap = StarMap(static_cast<int>(scanned));
                    sfx.play("chime");
                }
            }

            int crystals = 0;
            std::optional<StarMap> starMap;

        private:
            int scanPower() const {
                return 3 * level;
            }

            int level;
            SoundPlayer& sfx;
        };
