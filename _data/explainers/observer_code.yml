python:
  label: Python
  filename: observer_demo.py
  note: Abstract base classes make the Observer contract explicit. Widget fields represent UI state; a
    GUI toolkit would display them.
  imports: |
    from abc import ABC, abstractmethod
  blocks:
    problem:
      source: |
        class DocumentBefore:
            def __init__(self, preview, count, save):
                self.text = ""
                self.preview, self.count, self.save = preview, count, save

            def set_text(self, text):
                self.text = text
                if self.preview is not None:
                    self.preview.text = text
                if self.count is not None:
                    self.count.text = str(len(text))
                if self.save is not None:
                    if text == "":
                        self.save.enabled = False
                    else:
                        self.save.enabled = True
      focus:
        state:
        - 7
        preview:
        - 8
        - 9
        count:
        - 10
        - 11
        save:
        - 12
        - 13
        - 14
        - 15
        - 16
    observer:
      source: |
        class Observer(ABC):
            @abstractmethod
            def update(self, text: str) -> None:
                pass
      focus:
        contract:
        - 1
        - 2
        - 3
    subject:
      source: |
        class Subject:
            def __init__(self):
                self._observers: list[Observer] = []

            def attach(self, observer: Observer):
                self._observers.append(observer)

            def detach(self, observer: Observer):
                self._observers.remove(observer)

            def notify_observers(self, text: str):
                for observer in self._observers:
                    observer.update(text)
      focus:
        registry:
