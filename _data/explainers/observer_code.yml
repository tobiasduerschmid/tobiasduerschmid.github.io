typescript:
  label: TypeScript
  filename: observer-demo.ts
  note: The Observer interface describes a structural contract. Widget fields represent UI state; a UI
    framework would display them.
  imports: |
    export {};
  blocks:
    problem:
      source: |
        class DocumentBefore {
          text = "";
          preview?: Preview;
          count?: CharacterCount;
          save?: SaveButton;

          setText(text: string): void {
            this.text = text;
            if (this.preview !== undefined) {
              this.preview.text = text;
            }
            if (this.count !== undefined) {
              this.count.text = String(text.length);
            }
            if (this.save !== undefined) {
              if (text === "") {
                this.save.enabled = false;
              } else {
                this.save.enabled = true;
              }
            }
          }
        }
