java:
  label: Java
  filename: ObserverDemo.java
  note: Observer is our own interface. Widget fields represent UI state; a GUI toolkit would display them.
  imports: |
    import java.util.ArrayList;
    import java.util.List;
  blocks:
    problem:
      source: |
        final class DocumentBefore {
            String text = "";
            Preview preview;
            CharacterCount count;
            SaveButton save;

            void setText(String text) {
                this.text = text;
                if (preview != null) {
                    preview.text = text;
                }
                if (count != null) {
                    count.text = Integer.toString(text.length());
                }
                if (save != null) {
                    if (text.isEmpty()) {
                        save.enabled = false;
                    } else {
                        save.enabled = true;
                    }
                }
            }
        }
      focus:
