cpp:
  label: C++
  filename: observer_demo.cpp
  note: 'Observer uses virtual dispatch. Subject stores non-owning pointers: detach an Observer before
    destroying it. Widget fields represent UI state.'
  imports: |
    #include <algorithm>
    #include <string>
    #include <vector>
  blocks:
    problem:
      source: |
        class DocumentBefore {
        public:
            std::string text;
            Preview* preview = nullptr;
            CharacterCount* count = nullptr;
            SaveButton* save = nullptr;

            void setText(const std::string& value) {
                text = value;
                if (preview != nullptr) {
                    preview->text = text;
                }
                if (count != nullptr) {
                    count->text = std::to_string(text.size());
                }
                if (save != nullptr) {
                    if (text.empty()) {
                        save->enabled = false;
                    } else {
                        save->enabled = true;
                    }
                }
            }
        };
      focus:
        state:
        - 9
        preview:
        - 10
        - 11
        count:
        - 13
        - 14
        save:
        - 16
        - 17
        - 18
        - 19
        - 20
    observer:
      source: |
        struct Observer {
            virtual ~Observer() = default;
            virtual void update(const std::string& text) = 0;
        };
      focus:
        contract:
        - 1
        - 2
        - 3
    subject:
      source: |
        class Subject {
            std::vector<Observer*> observers;
        public:
            void attach(Observer& observer) {
                observers.push_back(&observer);
            }

            void detach(Observer& observer) {
                observers.erase(
                    std::remove(observers.begin(), observers.end(), &observer),
                    observers.end());
            }
        protected:
            void notifyObservers(const std::string& text) {
                for (Observer* observer : observers) {
                    observer->update(text);
                }
            }
        };
      focus:
        registry:
        - 2
        attach:
        - 4
        - 5
        detach:
        - 8
        - 9
        - 10
        - 11
        notify:
        - 14
        - 15
        - 16
    document:
      source: |
        class Document : public Subject {
        public:
            std::string text;

            void setText(const std::string& value) {
                text = value;
                notifyObservers(text);
            }
        };
      focus:
        state:
        - 5
        - 6
        notify:
        - 7
        role:
        - 1
    views:
      source: |
        struct Preview : Observer {
            std::string text;
            void update(const std::string& value) override {
                text = value;
            }
        };

        struct CharacterCount : Observer {
            std::string text = "0";
            void update(const std::string& value) override {
                text = std::to_string(value.size());
            }
        };

        struct SaveButton : Observer {
            bool enabled = false;
            void update(const std::string& value) override {
                if (value.empty()) {
                    enabled = false;
                } else {
                    enabled = true;
                }
            }
        };
      focus:
