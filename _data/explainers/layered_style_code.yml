        import type { Body } from "./body";

        export type { Body };

        export interface CollisionListener {
          onCollision(a: Body, b: Body): void;
        }

        export class Engine {
          private listeners: CollisionListener[] = [];

          register(listener: CollisionListener): void {
            this.listeners.push(listener);
          }

          step(): void {
            for (const [a, b] of this.touchingPairs())
              for (const listener of this.listeners)
                listener.onCollision(a, b);
          }
        }
