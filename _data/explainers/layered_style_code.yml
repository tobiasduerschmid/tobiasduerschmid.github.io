    callbacks_engine:
      file: engine/core.py
      source: |
        from abc import ABC, abstractmethod
        from engine.body import Body

        class CollisionListener(ABC):
            @abstractmethod
            def on_collision(self, a: Body, b: Body) -> None: ...

        class Engine:
            def __init__(self) -> None:
                self.listeners: list[CollisionListener] = []

            def register(self, listener: CollisionListener) -> None:
                self.listeners.append(listener)

            def step(self) -> None:
                for a, b in self.touching_pairs():
                    for listener in self.listeners:
                        listener.on_collision(a, b)
      focus: {imports: [1, 2], contract: [4, 5, 6], register: [12, 13], call: [18]}
