        #pragma once
        #include <vector>
        #include "engine/body.h"

        class CollisionListener {
        public:
            virtual ~CollisionListener() = default;
            virtual void onCollision(Body& a, Body& b) = 0;
        };

        class Engine {
        public:
            void registerListener(CollisionListener& listener) {
                listeners.push_back(&listener);
            }
            void step() {
                for (auto [a, b] : touchingPairs())
                    for (CollisionListener* listener : listeners)
                        listener->onCollision(*a, *b);
            }

        private:
            std::vector<CollisionListener*> listeners;
        };
