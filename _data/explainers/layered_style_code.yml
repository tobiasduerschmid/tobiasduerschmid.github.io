      source: |
        package game;

        import engine.Body;
        import engine.CollisionListener;
        import engine.Engine;

        public class PearlHandler implements CollisionListener {
            private final Score score;

            PearlHandler(Score score) { this.score = score; }

            @Override
            public void onCollision(Body a, Body b) {
                if ((a.is("squirrel") && b.is("pearl"))
                        || (a.is("pearl") && b.is("squirrel")))
                    score.add(10);
            }

            static void start(Engine engine, Score score) {
                engine.register(new PearlHandler(score));
            }
        }
      focus: {imports: [3, 4, 5], implements: [7], handler: [13, 14, 15, 16, 17], start: [19, 20, 21]}
