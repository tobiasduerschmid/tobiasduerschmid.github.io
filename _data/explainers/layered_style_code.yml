      source: |
        from engine.core import Body, CollisionListener, Engine
        from game.score import Score

        class PearlHandler(CollisionListener):
            def __init__(self, score: Score) -> None:
                self.score = score

            def on_collision(self, a: Body, b: Body) -> None:
                if {a.kind, b.kind} == {"squirrel", "pearl"}:
                    self.score.add(10)

        def start(engine: Engine, score: Score) -> None:
            engine.register(PearlHandler(score))
