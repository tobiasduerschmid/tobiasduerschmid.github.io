        import type {
          Body, CollisionListener, Engine,
        } from "../engine";
        import type { Score } from "./score";

        export class PearlHandler implements CollisionListener {
          constructor(private score: Score) {}

          onCollision(a: Body, b: Body): void {
            if ((a.is("squirrel") && b.is("pearl"))
                || (a.is("pearl") && b.is("squirrel")))
              this.score.add(10);
          }
        }

        export function start(engine: Engine, score: Score) {
          engine.register(new PearlHandler(score));
        }
