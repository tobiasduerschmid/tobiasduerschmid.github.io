        type State = "Driving" | "Waiting" | "Unlocked" | "Returning" | "Done";  // Done: the final state

        // The composite state Delivering groups three substates.
        const DELIVERING: ReadonlySet<State> = new Set<State>(["Driving", "Waiting", "Unlocked"]);

        class DeliveryRobot {
          readonly actions: string[] = [];
          state: State = "Driving";  // the initial arrow
          private readonly pin: string;

          constructor(pin: string) {
            this.pin = pin;
          }

          private enter(next: State): void {
            this.state = next;
            if (next === "Waiting") {
              this.actions.push("notify customer");  // entry / notifyCustomer()
              this.actions.push("start 10-minute timer");  // for after(10 min)
            } else if (next === "Unlocked") {
              this.actions.push("unlock lid");  // entry / unlockLid()
            } else if (next === "Returning") {
              this.actions.push("drive to base");  // do / driveToBase()
            }
          }

          private exit(): void {
            if (this.state === "Unlocked") this.actions.push("lock lid");  // exit / lockLid()
            if (this.state === "Waiting") this.actions.push("cancel timer");  // leaving ends after(10 min)
          }

          private transition(target: State, effect?: string): void {
            this.exit();
            if (effect) this.actions.push(effect);
            this.enter(target);
          }

          arrived(): void {
            if (this.state === "Driving") this.transition("Waiting");
          }

          enterPin(code: string): void {
            if (this.state !== "Waiting") return;  // no matching transition: ignored
            if (code === this.pin) {  // [pin matches]
              this.transition("Unlocked");
            } else {  // internal transition: [pin wrong] / beep()
              this.actions.push("beep");
            }
          }

