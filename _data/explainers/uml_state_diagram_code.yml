        enum class State { Driving, Waiting, Unlocked, Returning, Done };  // Done: the final state

        // The composite state Delivering groups three substates.
        const std::set<State> kDelivering{State::Driving, State::Waiting, State::Unlocked};

        class DeliveryRobot {
        public:
            explicit DeliveryRobot(std::string pin) : pin_(std::move(pin)) {}

            State state() const { return state_; }
            const std::vector<std::string>& actions() const { return actions_; }

            void arrived() {
                if (state_ == State::Driving) transition(State::Waiting);
            }

            void enterPin(const std::string& code) {
                if (state_ != State::Waiting) return;  // no matching transition: ignored
                if (code == pin_) {  // [pin matches]
                    transition(State::Unlocked);
                } else {  // internal transition: [pin wrong] / beep()
                    actions_.push_back("beep");
                }
            }

            void extendWait() {  // self-transition
                if (state_ == State::Waiting) transition(State::Waiting);
            }

            void waitTimedOut() {  // after(10 min)
                if (state_ == State::Waiting) transition(State::Returning);
            }

            void lidClosed() {
                if (state_ == State::Unlocked) transition(State::Returning, "play thanks");
            }

            void batteryLow() {  // when(battery < 15%)
                if (kDelivering.count(state_) > 0) transition(State::Returning);
            }

            void baseReached() {  // driveToBase() is done
                if (state_ == State::Returning) transition(State::Done);
            }

        private:
            void enter(State next) {
                state_ = next;
                if (next == State::Waiting) {
                    actions_.push_back("notify customer");  // entry / notifyCustomer()
                    actions_.push_back("start 10-minute timer");  // for after(10 min)
                } else if (next == State::Unlocked) {
                    actions_.push_back("unlock lid");  // entry / unlockLid()
                } else if (next == State::Returning) {
                    actions_.push_back("drive to base");  // do / driveToBase()
                }
            }

            void exit() {
                if (state_ == State::Unlocked) actions_.push_back("lock lid");  // exit / lockLid()
                if (state_ == State::Waiting) actions_.push_back("cancel timer");  // leaving ends after(10 min)
            }

            void transition(State target, const std::string& effect = "") {
                exit();
                if (!effect.empty()) actions_.push_back(effect);
                enter(target);
            }

            std::string pin_;
            State state_ = State::Driving;  // the initial arrow
            std::vector<std::string> actions_;
        };
