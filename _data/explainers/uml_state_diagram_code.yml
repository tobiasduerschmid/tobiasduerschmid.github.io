            if (this.state === "Waiting") this.transition("Returning");
          }

          lidClosed(): void {
            if (this.state === "Unlocked") this.transition("Returning", "play thanks");
          }

          batteryLow(): void {  // when(battery < 15%)
            if (DELIVERING.has(this.state)) this.transition("Returning");
          }

          baseReached(): void {  // driveToBase() is done
            if (this.state === "Returning") this.transition("Done");
          }
        }
