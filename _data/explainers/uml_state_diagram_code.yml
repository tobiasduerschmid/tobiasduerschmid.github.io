        enum State { DRIVING, WAITING, UNLOCKED, RETURNING, DONE }  // DONE: the final state

        class DeliveryRobot {
            // The composite state Delivering groups three substates.
            static final Set<State> DELIVERING = EnumSet.of(State.DRIVING, State.WAITING, State.UNLOCKED);

            private final String pin;
            private final List<String> actions = new ArrayList<>();
            private State state = State.DRIVING;  // the initial arrow

            DeliveryRobot(String pin) {
                this.pin = pin;
            }

            State state() { return state; }
            List<String> actions() { return actions; }

            private void enter(State next) {
                state = next;
                if (next == State.WAITING) {
                    actions.add("notify customer");  // entry / notifyCustomer()
                    actions.add("start 10-minute timer");  // for after(10 min)
                } else if (next == State.UNLOCKED) {
                    actions.add("unlock lid");  // entry / unlockLid()
                } else if (next == State.RETURNING) {
                    actions.add("drive to base");  // do / driveToBase()
                }
            }

            private void exit() {
                if (state == State.UNLOCKED) actions.add("lock lid");  // exit / lockLid()
                if (state == State.WAITING) actions.add("cancel timer");  // leaving ends after(10 min)
            }

            private void transition(State target, String effect) {
                exit();
                if (effect != null) actions.add(effect);
                enter(target);
            }

            private void transition(State target) {
                transition(target, null);
            }

            void arrived() {
                if (state == State.DRIVING) transition(State.WAITING);
            }

            void enterPin(String code) {
                if (state != State.WAITING) return;  // no matching transition: ignored
                if (code.equals(pin)) {  // [pin matches]
                    transition(State.UNLOCKED);
                } else {  // internal transition: [pin wrong] / beep()
                    actions.add("beep");
                }
            }

            void extendWait() {  // self-transition
                if (state == State.WAITING) transition(State.WAITING);
            }

            void waitTimedOut() {  // after(10 min)
                if (state == State.WAITING) transition(State.RETURNING);
            }

            void lidClosed() {
                if (state == State.UNLOCKED) transition(State.RETURNING, "play thanks");
            }

            void batteryLow() {  // when(battery < 15%)
                if (DELIVERING.contains(state)) transition(State.RETURNING);
            }

            void baseReached() {  // driveToBase() is done
                if (state == State.RETURNING) transition(State.DONE);
            }
        }
