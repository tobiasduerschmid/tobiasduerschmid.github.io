        class State(Enum):
            DRIVING = "Driving"
            WAITING = "Waiting"
            UNLOCKED = "Unlocked"
            RETURNING = "Returning"
            DONE = "Done"  # the final state


        # The composite state Delivering groups three substates.
        DELIVERING = {State.DRIVING, State.WAITING, State.UNLOCKED}


        class DeliveryRobot:
            def __init__(self, pin: str) -> None:
                self.state = State.DRIVING  # the initial arrow
                self.pin = pin
                self.actions: list[str] = []

            def _enter(self, state: State) -> None:
                self.state = state
                if state is State.WAITING:
                    self.actions.append("notify customer")  # entry / notifyCustomer()
                    self.actions.append("start 10-minute timer")  # for after(10 min)
                elif state is State.UNLOCKED:
                    self.actions.append("unlock lid")  # entry / unlockLid()
                elif state is State.RETURNING:
                    self.actions.append("drive to base")  # do / driveToBase()

            def _exit(self) -> None:
                if self.state is State.UNLOCKED:
                    self.actions.append("lock lid")  # exit / lockLid()
                elif self.state is State.WAITING:
                    self.actions.append("cancel timer")  # leaving ends after(10 min)

            def _transition(self, target: State, effect: str = "") -> None:
                self._exit()
                if effect:
                    self.actions.append(effect)
                self._enter(target)

            def arrived(self) -> None:
                if self.state is State.DRIVING:
                    self._transition(State.WAITING)

            def enter_pin(self, code: str) -> None:
                if self.state is not State.WAITING:
                    return  # no matching transition: ignored
                if code == self.pin:  # [pin matches]
                    self._transition(State.UNLOCKED)
                else:  # internal transition: [pin wrong] / beep()
                    self.actions.append("beep")

            def extend_wait(self) -> None:  # self-transition
                if self.state is State.WAITING:
                    self._transition(State.WAITING)

            def wait_timed_out(self) -> None:  # after(10 min)
                if self.state is State.WAITING:
                    self._transition(State.RETURNING)

            def lid_closed(self) -> None:
                if self.state is State.UNLOCKED:
                    self._transition(State.RETURNING, effect="play thanks")

            def battery_low(self) -> None:  # when(battery < 15%)
                if self.state in DELIVERING:
                    self._transition(State.RETURNING)

            def base_reached(self) -> None:  # driveToBase() is done
                if self.state is State.RETURNING:
                    self._transition(State.DONE)
