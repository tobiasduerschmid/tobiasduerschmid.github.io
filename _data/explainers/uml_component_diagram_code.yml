typescript:
  label: TypeScript
  blocks:
    offers_service:
      file: service/alert-service.ts
      source: |
        import type { TextMessages, Watches } from "../shared";
        import type { AlertDB } from "./alert-db";

        export class AlertService implements Watches {
          constructor(
            private readonly texts: TextMessages,
            private readonly db: AlertDB,
          ) {}

          create(phone: string, course: string): void {
            this.db.saveWatch(phone, course);
          }
          // cancel(...) deletes the watch the same way

          seatOpened(course: string): void {
            for (const phone of this.db.watchers(course))
              this.texts.send(phone, `Seat open: ${course}`);
          }
        }
