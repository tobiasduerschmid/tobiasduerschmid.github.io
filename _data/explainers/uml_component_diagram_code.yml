python:
  label: Python
  blocks:
    offers_service:
      file: service/alert_service.py
      source: |
        from service.alert_db import AlertDB
        from shared.contracts import TextMessages, Watches


        class AlertService(Watches):
            def __init__(self, texts: TextMessages,
                         db: AlertDB) -> None:
                self.texts: TextMessages = texts
                self.db: AlertDB = db

            def create(self, phone: str, course: str) -> None:
                self.db.save_watch(phone, course)
            # cancel(...) deletes the watch the same way

            def seat_opened(self, course: str) -> None:
                for phone in self.db.watchers(course):
                    self.texts.send(phone, f"Seat open: {course}")
      focus: {imports: [2], provides: [5], answers: [11], requires: [6, 8], request: [17]}
    offers_contracts:
      file: shared/contracts.py
      source: |
        from abc import ABC, abstractmethod


        class Watches(ABC):
            @abstractmethod
            def create(self, phone: str, course: str) -> None: ...

            @abstractmethod
            def cancel(self, phone: str, course: str) -> None: ...


        class TextMessages(ABC):
            @abstractmethod
            def send(self, phone: str, text: str) -> None: ...
