    offers_service:
      file: service/AlertService.java
      source: |
        import shared.TextMessages;
        import shared.Watches;

        public class AlertService implements Watches {
            private final TextMessages texts;
            private final AlertDB db;

            public AlertService(TextMessages texts, AlertDB db) {
                this.texts = texts;
                this.db = db;
            }

            @Override
            public void create(String phone, String course) {
                db.saveWatch(phone, course);
            }
            // cancel(...) deletes the watch the same way

            public void seatOpened(String course) {
                for (String phone : db.watchers(course))
                    texts.send(phone, "Seat open: " + course);
            }
        }
