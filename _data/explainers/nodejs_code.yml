        // A simplified view of Node's event loop.
        type Callback = () => void;
        const ready: Callback[] = [];

        // libuv calls this when a file read has finished.
        export function makeReady(callback: Callback): void {
          ready.push(callback);
        }

        export function runEventLoop(script: Callback): void {
          script(); // your current code runs first
          while (hasPendingWork()) {
            waitForFinishedWork(); // calls makeReady
            while (ready.length > 0) {
              const callback = ready.shift()!;
              callback(); // runs to completion
            }
          }
        }
