      file: main.py
      source: |
        import asyncio
        from asyncio import Future
        from pathlib import Path

        def on_file(read: Future[str]) -> None:
            print(read.result())

        async def main() -> None:
            loop = asyncio.get_running_loop()
            read = loop.run_in_executor(
                None, Path("note.txt").read_text, "utf8")
            read.add_done_callback(on_file)
            print("Next")
            await read  # keep main alive until the read ends

        asyncio.run(main())
      focus: {handler: [5, 6], start: [10, 11, 12], next: [13]}
    ready_loop:
      file: event_loop_sketch.py
      source: |
        # A simplified view of an asyncio event loop.
        from collections import deque
        from typing import Callable

        Callback = Callable[[], None]

        class EventLoop:
            def __init__(self) -> None:
                self.ready: deque[Callback] = deque()

            # A worker thread calls this when its read ends.
            def call_soon_threadsafe(
                self, callback: Callback
            ) -> None:
                self.ready.append(callback)

            def run(self, main: Callback) -> None:
                main()  # your current code runs first
                while self.has_pending_work():
                    self.wait_for_finished_work()
                    while self.ready:
                        callback = self.ready.popleft()
                        callback()  # runs to completion
      focus: {queue: [9], post: [12, 13, 14, 15], first: [18], run: [22, 23]}
java:
  label: Java
  blocks:
    ready_program:
      file: Main.java
      source: |
        import java.util.concurrent.CompletableFuture;

        public class Main {
            static void onFile(String text) {
                System.out.println(text);
            }

            public static void main(String[] args)
                    throws InterruptedException {
                EventLoop loop = new EventLoop();
                loop.run(() -> {
                    CompletableFuture
                        .supplyAsync(() -> readText("note.txt"))
                        .thenAccept(text -> loop.post(
                            () -> onFile(text)));
                    System.out.println("Next");
                });
            }
            // readText wraps Files.readString (not shown).
        }
      focus: {handler: [4, 5, 6], start: [12, 13, 14, 15], next: [16]}
    ready_loop:
      file: EventLoop.java
      source: |
        import java.util.concurrent.BlockingQueue;
        import java.util.concurrent.LinkedBlockingQueue;

        // A minimal event loop: one thread runs every callback.
        public class EventLoop {
            private final BlockingQueue<Runnable> ready =
                new LinkedBlockingQueue<>();

            // Worker threads call this when their read ends.
            public void post(Runnable callback) {
                ready.add(callback);
            }

            public void run(Runnable main)
                    throws InterruptedException {
                main.run(); // your current code runs first
                while (hasPendingWork()) {
                    Runnable callback = ready.take(); // waits
                    callback.run(); // runs to completion
                }
            }
        }
      focus: {queue: [6, 7], post: [10, 11, 12], first: [16], run: [18, 19]}
