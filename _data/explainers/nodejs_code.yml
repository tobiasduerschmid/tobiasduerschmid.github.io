        #pragma once
        #include <deque>
        #include <functional>
        #include <mutex>

        // A minimal event loop: one thread runs every callback.
        class EventLoop {
        public:
            // Worker threads call this when their read ends.
            void post(std::function<void()> callback) {
                std::lock_guard lock(mutex);
                ready.push_back(callback);
            }
            void run(const std::function<void()>& main) {
                main();  // your current code runs first
                while (hasPendingWork()) {
                    auto callback = takeReady();  // waits
                    callback();  // runs to completion
                }
            }
        private:
            std::mutex mutex;
            std::deque<std::function<void()>> ready;
        };
