    channels:
      source: |
        class Channel(Mentionable, ABC):
            def __init__(self, name: str) -> None:
                self._name = name
                self.__messages: list[Message] = []  # owned: deleted with the channel

            def rename(self, name: str) -> None:
                self._name = name

            def mention(self) -> str:
                return "#" + self._name

            def post(self, author: Member, text: str) -> Message:
                message = Message(text, author)
                self.__messages.append(message)
                return message

            @abstractmethod
            def summary(self) -> str:
                """One line for the channel list."""


        class TextChannel(Channel):
            def __init__(self, name: str, topic: str) -> None:
                super().__init__(name)
                self.__topic = topic

            def summary(self) -> str:
                return self.mention() + ": " + self.__topic


        class VoiceChannel(Channel):
            def __init__(self, name: str) -> None:
                super().__init__(name)
                self.__connected: list[Member] = []

            def connect(self, member: Member) -> None:
                self.__connected.append(member)

            def summary(self) -> str:
                return f"{self.mention()}: {len(self.__connected)} talking"
