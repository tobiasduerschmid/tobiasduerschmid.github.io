    server:
      source: |
        class Category:
            def __init__(self, name: str) -> None:
                self.__name = name
                self.__channels: list[Channel] = []  # grouped, not owned

            def add(self, channel: Channel) -> None:
                self.__channels.append(channel)


        class Server:
            def __init__(self, name: str, owner: Member) -> None:
                self.__name = name
                self.__members: list[Member] = [owner]
                self.__channels: list[Channel] = []  # owned: deleted with the server
                self.__categories: list[Category] = []  # owned: deleted with the server

            def add_channel(self, channel: Channel) -> None:
                self.__channels.append(channel)

            def add_category(self, category: Category) -> None:
                self.__categories.append(category)

            def delete_category(self, category: Category) -> None:
                self.__categories.remove(category)  # its channels stay

            def join(self, invite: Invite, nickname: str) -> Member:
                invite.redeem()
                member = Member(nickname)
                self.__members.append(member)
                return member

            def overview(self) -> str:
                return self.__name + ": " + "; ".join(c.summary() for c in self.__channels)
