    invite:
      source: |
        class Invite:
            def __init__(self, uses: int) -> None:
                self.__uses_left = uses

            def redeem(self) -> None:
                if self.__uses_left == 0:
                    raise ValueError("This invite has been used up.")
                self.__uses_left -= 1
