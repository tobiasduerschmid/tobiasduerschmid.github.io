        class Message {
        public:
            Message(std::string text, const Member& author) : text(std::move(text)), author(&author) {}

            void edit(const std::string& text) { this->text = text; }

            std::string preview(std::size_t length) const {
                return author->mention() + ": " + text.substr(0, length);
            }

        private:
            std::string text;
            const Member* author;
        };
