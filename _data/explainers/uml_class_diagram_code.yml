cpp:
  label: C++
  filename: chat_app.cpp
  note: A unique_ptr has exactly one owner, so destroying a server destroys its channels, and destroying a channel destroys its messages. Raw pointers only refer to objects.
  imports: |
    #include <algorithm>
    #include <memory>
    #include <stdexcept>
    #include <string>
    #include <vector>
