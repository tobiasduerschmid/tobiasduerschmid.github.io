    mentionable:
      source: |
        class Mentionable {
        public:
            virtual ~Mentionable() = default;
            // The text that refers to this object in a message.
            virtual std::string mention() const = 0;
        };

        class Member : public Mentionable {
        public:
            explicit Member(std::string nickname) : nickname(std::move(nickname)) {}

            void rename(const std::string& nickname) { this->nickname = nickname; }

            std::string mention() const override { return "@" + nickname; }

        private:
            std::string nickname;
        };
      focus:
        interface: [1, 5]
        realize: [8]
        implement: [14]
    channels:
      source: |
        class Channel : public Mentionable {
        public:
            explicit Channel(std::string name) : name(std::move(name)) {}

            void rename(const std::string& name) { this->name = name; }

            std::string mention() const override { return "#" + name; }

            Message& post(const Member& author, std::string text) {
                messages.push_back(std::make_unique<Message>(std::move(text), author));
                return *messages.back();
            }

            // One line for the channel list.
            virtual std::string summary() const = 0;

        protected:
            std::string name;

        private:
            std::vector<std::unique_ptr<Message>> messages;  // owned: deleted with the channel
        };

        class TextChannel : public Channel {
        public:
            TextChannel(std::string name, std::string topic) : Channel(std::move(name)), topic(std::move(topic)) {}

            std::string summary() const override { return mention() + ": " + topic; }

        private:
            std::string topic;
        };

        class VoiceChannel : public Channel {
        public:
            using Channel::Channel;

            void connect(const Member& member) { connected.push_back(&member); }

            std::string summary() const override {
                return mention() + ": " + std::to_string(connected.size()) + " talking";
            }

        private:
            std::vector<const Member*> connected;
        };
      focus:
        kinds: [1, 24, 34]
        triangle: [5, 18, 24, 34]
        abstract: [1, 15, 17, 18]
        substitution: [28, 40, 41]
      scroll:
        kinds: 24
        triangle: 18
        abstract: 15
        substitution: 40
    invite:
      source: |
        class Invite {
        public:
            explicit Invite(int uses) : usesLeft(uses) {}

            void redeem() {
                if (usesLeft == 0) throw std::runtime_error("This invite has been used up.");
                --usesLeft;
            }

        private:
            int usesLeft;
        };
      focus: {}
    server:
      source: |
        class Category {
        public:
            explicit Category(std::string name) : name(std::move(name)) {}

            void add(Channel& channel) { channels.push_back(&channel); }

        private:
            std::string name;
            std::vector<Channel*> channels;  // grouped, not owned
        };

        class Server {
        public:
            Server(std::string name, std::shared_ptr<Member> owner)
                : name(std::move(name)), members{std::move(owner)} {}

            void addChannel(std::unique_ptr<Channel> channel) { channels.push_back(std::move(channel)); }

            void addCategory(std::unique_ptr<Category> category) { categories.push_back(std::move(category)); }

            void deleteCategory(const Category& category) {  // its channels stay
                categories.erase(std::remove_if(categories.begin(), categories.end(),
                    [&](const auto& kept) { return kept.get() == &category; }), categories.end());
            }

            std::shared_ptr<Member> join(Invite& invite, std::string nickname) {
                invite.redeem();
                members.push_back(std::make_shared<Member>(std::move(nickname)));
                return members.back();
            }

            std::string overview() const {
                std::string text = name + ": ";
                for (std::size_t i = 0; i < channels.size(); ++i) {
                    text += (i > 0 ? "; " : "") + channels[i]->summary();
                }
                return text;
            }

        private:
            std::string name;
            std::vector<std::shared_ptr<Member>> members;
            std::vector<std::unique_ptr<Channel>> channels;     // owned: deleted with the server
            std::vector<std::unique_ptr<Category>> categories;  // owned: deleted with the server
        };
