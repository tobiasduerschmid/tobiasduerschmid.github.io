    invite:
      source: |
        class Invite {
            private int usesLeft;

            Invite(int uses) {
                this.usesLeft = uses;
            }

            public void redeem() {
                if (usesLeft == 0) {
                    throw new IllegalStateException("This invite has been used up.");
                }
                usesLeft--;
            }
        }
