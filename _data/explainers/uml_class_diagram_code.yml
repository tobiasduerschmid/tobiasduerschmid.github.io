    server:
      source: |
        class Category {
            private final String name;
            private final List<Channel> channels = new ArrayList<>(); // grouped, not owned

            Category(String name) {
                this.name = name;
            }

            public void add(Channel channel) {
                channels.add(channel);
            }
        }

        class Server {
            private final String name;
            private final List<Member> members = new ArrayList<>();
            private final List<Channel> channels = new ArrayList<>(); // owned: deleted with the server
            private final List<Category> categories = new ArrayList<>(); // owned: deleted with the server

            Server(String name, Member owner) {
                this.name = name;
                members.add(owner);
            }

            public void addChannel(Channel channel) {
                channels.add(channel);
            }

            public void addCategory(Category category) {
                categories.add(category);
            }

            public void deleteCategory(Category category) {
                categories.remove(category); // its channels stay
            }

            public Member join(Invite invite, String nickname) {
                invite.redeem();
                Member member = new Member(nickname);
                members.add(member);
                return member;
            }

            public String overview() {
                StringJoiner lines = new StringJoiner("; ");
                for (Channel channel : channels) {
                    lines.add(channel.summary());
                }
                return name + ": " + lines;
            }
        }
