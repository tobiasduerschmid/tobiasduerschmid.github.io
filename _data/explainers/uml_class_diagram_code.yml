    channels:
      source: |
        abstract class Channel implements Mentionable {
            protected String name;
            private final List<Message> messages = new ArrayList<>(); // owned: deleted with the channel

            Channel(String name) {
                this.name = name;
            }

            public void rename(String name) {
                this.name = name;
            }

            @Override
            public String mention() {
                return "#" + name;
            }

            public Message post(Member author, String text) {
                Message message = new Message(text, author);
                messages.add(message);
                return message;
            }

            /** One line for the channel list. */
            public abstract String summary();
        }

        class TextChannel extends Channel {
            private final String topic;

            TextChannel(String name, String topic) {
                super(name);
                this.topic = topic;
            }

            @Override
            public String summary() {
                return mention() + ": " + topic;
            }
        }

        class VoiceChannel extends Channel {
            private final List<Member> connected = new ArrayList<>();

            VoiceChannel(String name) {
                super(name);
            }

            public void connect(Member member) {
                connected.add(member);
            }

            @Override
            public String summary() {
                return mention() + ": " + connected.size() + " talking";
            }
        }
