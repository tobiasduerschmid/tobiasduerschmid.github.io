      file: Root.java
      source: |
        package mini.react;

        import java.util.ArrayList;
        import java.util.List;

        // A simplified model of what React does for us.
        public final class Root {
            private final Component component;
            private final Dom dom = new Dom();
            private int likes = 0; // memory kept by React
            private final List<Integer> queue = new ArrayList<>();

            Root(Component c) { component = c; }

            void setLikes(int value) { queue.add(value); }

            void afterHandler() {
                for (int value : queue) likes = value;
                queue.clear();
                var view = component.render(likes, this::setLikes);
                dom.commit(view); // change what differs
            }
        }
