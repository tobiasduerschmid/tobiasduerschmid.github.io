        #include <functional>
        #include <vector>
        #include "mini_dom.h"

        // A simplified model of what React does for us.
        using Setter = std::function<void(int)>;
        using Component = std::function<Element(int, Setter)>;

        class Root {
        public:
            explicit Root(Component c) : component(c) {}
            void setLikes(int value) { queue.push_back(value); }
            void afterHandler() {
                for (int value : queue) likes = value;
                queue.clear();
                auto set = [this](int v) { setLikes(v); };
                Element view = component(likes, set);
                dom.commit(view);  // change what differs
            }
        private:
            Component component;
            Dom dom;
            int likes = 0;  // memory kept by React
            std::vector<int> queue;
        };
