        import mini.react.Element;
        import mini.react.Setter;

        final class LikeButton {
            static Element render(int likes, Setter setLikes) {
                Runnable handleLike = () -> {
                    setLikes.request(likes + 1);
                    System.out.println(likes); // still 0 here
                };
                return new Element("button", "Like: " + likes,
                    handleLike);
            }
        }
