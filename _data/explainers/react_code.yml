    snapshot_react:
      file: mini_react.py
      source: |
        # A simplified model of what React does for us.
        from typing import Callable
        from mini_dom import Dom, Element

        Setter = Callable[[int], None]
        Component = Callable[[int, Setter], Element]

        class Root:
            def __init__(self, component: Component) -> None:
                self.component: Component = component
                self.dom: Dom = Dom()
                self.likes: int = 0  # memory kept by React
                self.queue: list[int] = []

            def set_likes(self, value: int) -> None:
                self.queue.append(value)  # a request only

            def after_handler(self) -> None:
                for value in self.queue:
                    self.likes = value
                self.queue.clear()
                view = self.component(self.likes, self.set_likes)
                self.dom.commit(view)  # change what differs
      focus: {slot: [12], queue: [15, 16], apply: [19, 20, 21], render: [22], commit: [23]}
