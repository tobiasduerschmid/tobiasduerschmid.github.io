      source: |
        // A simplified model of what React does for us.
        import { Dom, type Element } from "./mini-dom";

        export type Setter = (value: number) => void;
        type Component = (likes: number, set: Setter) => Element;

        export class Root {
          private likes = 0; // memory kept by React
          private queue: number[] = [];
          private dom = new Dom();

          constructor(private component: Component) {}

          setLikes = (value: number): void => {
            this.queue.push(value); // a request only
          };

          afterHandler(): void {
            for (const value of this.queue) this.likes = value;
            this.queue = [];
            const view = this.component(this.likes, this.setLikes);
            this.dom.commit(view); // change what differs
          }
        }
