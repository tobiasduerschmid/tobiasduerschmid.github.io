        function receipt(expense: Expense): string {
          const shares = [...expense.shares()].map(([p, cents]) => `${p} ${cents}`).join(", ");
          return `${expense.label()}: ${shares}`;
        }

        const dinner = new Expense(6000, ["Ava", "Ben", "Chloe"], EQUAL); // amounts in cents
        console.log(receipt(dinner));
        dinner.setStrategy(new PercentSplit({ Ava: 50, Ben: 30, Chloe: 20 }));
        console.log(receipt(dinner));
