    strategies:
      source: |
        class EqualSplit : public SplitStrategy {
        public:
            Shares split(int total, const std::vector<std::string>& people) const override {
                Shares shares;
                const int count = static_cast<int>(people.size());
                // The first total % count people pay one more cent, so shares add up.
                for (int i = 0; i < count; ++i) shares[people[i]] = total / count + (i < total % count ? 1 : 0);
                return shares;
            }
            std::string label() const override { return "Split equally"; }
        };

        // EqualSplit stores no data, so every expense can share one object.
        std::shared_ptr<const SplitStrategy> equalSplit() {
            static const auto shared = std::make_shared<const EqualSplit>();
            return shared;
        }

        class PercentSplit : public SplitStrategy {
            std::map<std::string, int> percents;

        public:
            explicit PercentSplit(std::map<std::string, int> percents) : percents(std::move(percents)) {
                int sum = 0;
                for (const auto& entry : this->percents) sum += entry.second;
                if (sum != 100) throw std::invalid_argument("percentages must add up to 100");
            }
            Shares split(int total, const std::vector<std::string>& people) const override {
                Shares shares;
                int assigned = 0;
                for (const auto& person : people) {
                    shares[person] = total * percents.at(person) / 100;
                    assigned += shares[person];
                }
                shares[people.front()] += total - assigned;
                return shares;
            }
            std::string label() const override { return "Split by percentage"; }
        };

        class BirthdaySplit : public SplitStrategy {
            std::string guest;

        public:
            explicit BirthdaySplit(std::string guest) : guest(std::move(guest)) {}
            Shares split(int total, const std::vector<std::string>& people) const override {
                std::vector<std::string> payers;
                for (const auto& person : people) if (person != guest) payers.push_back(person);
                Shares shares = equalSplit()->split(total, payers);
                for (const auto& person : people) shares.try_emplace(person, 0);
                return shares;
            }
            std::string label() const override { return "Birthday treat for " + guest; }
        };
