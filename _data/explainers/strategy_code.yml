typescript:
  label: TypeScript
  filename: strategy-demo.ts
  note: SplitStrategy is a TypeScript interface. Shares maps each person to an amount in whole cents.
  imports: |
    type Shares = Map<string, number>; // person -> cents
  blocks:
    problem:
      source: |
        type Method = "equal" | "percent" | "birthday";

        function splitEvenly(total: number, people: string[]): Shares {
          const base = Math.floor(total / people.length);
          const extra = total % people.length;
          return new Map(people.map((p, i): [string, number] => [p, base + (i < extra ? 1 : 0)]));
        }

        class ExpenseBefore {
          private readonly total: number;
          private readonly people: string[];
          private readonly method: Method;
          private readonly percents: Record<string, number>;
          private readonly guest: string;

          constructor(total: number, people: string[], method: Method,
                      percents: Record<string, number> = {}, guest = "") {
            this.total = total;
            this.people = people;
            this.method = method;
            this.percents = percents;
            this.guest = guest;
          }

          shares(): Shares {
            if (this.method === "equal") {
              return splitEvenly(this.total, this.people);
            } else if (this.method === "percent") {
              const shares: Shares = new Map();
              for (const p of this.people) shares.set(p, Math.floor(this.total * this.percents[p] / 100));
              const assigned = [...shares.values()].reduce((a, b) => a + b, 0);
              shares.set(this.people[0], shares.get(this.people[0])! + this.total - assigned);
              return shares;
            } else { // birthday
              const payerShares = splitEvenly(this.total, this.people.filter(p => p !== this.guest));
              return new Map(this.people.map((p): [string, number] => [p, payerShares.get(p) ?? 0]));
            }
          }

          label(): string {
            if (this.method === "equal") {
              return "Split equally";
            } else if (this.method === "percent") {
              return "Split by percentage";
            } else { // birthday
              return `Birthday treat for ${this.guest}`;
            }
          }
        }
