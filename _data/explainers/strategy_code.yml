        promise: [4]
    context:
      source: |
        class Expense {
            int total;
            std::vector<std::string> people;
            std::shared_ptr<const SplitStrategy> strategy;

        public:
            Expense(int total, std::vector<std::string> people,
                    std::shared_ptr<const SplitStrategy> strategy)
                : total(total), people(std::move(people)), strategy(std::move(strategy)) {}

            Shares shares() const { return strategy->split(total, people); }
            std::string label() const { return strategy->label(); }

            void setStrategy(std::shared_ptr<const SplitStrategy> next) { strategy = std::move(next); }
