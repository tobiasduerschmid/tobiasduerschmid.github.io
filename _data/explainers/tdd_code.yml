cpp:
  label: "C++ · GoogleTest"
  filename: "bill_test.cpp, then bill.h, then bill.cpp"
  note: "The tests come first, then the code they drove; each part starts with its file name."
  blocks:
    tests:
      source: |
        // bill_test.cpp
        #include "bill.h"

        #include <stdexcept>

        #include <gmock/gmock.h>
        #include <gtest/gtest.h>

        using ::testing::ElementsAre;

        TEST(SplitTest, OnePersonPaysItAll) {
            EXPECT_THAT(split(3000, 1),
                        ElementsAre(3000));
        }

        TEST(SplitTest, EvenSplit) {
            EXPECT_THAT(split(3000, 3),
                        ElementsAre(1000, 1000, 1000));
        }

        TEST(SplitTest, FirstPeoplePayExtraCent) {
            EXPECT_THAT(split(8000, 3),
                        ElementsAre(2667, 2667, 2666));
        }

        TEST(SplitTest, ZeroPeopleIsRejected) {
            EXPECT_THROW(split(3000, 0),
                         std::invalid_argument);
        }
    bill:
      source: |
        // bill.h
        #pragma once
        #include <vector>

        std::vector<int> split(int cents, int people);

        // bill.cpp
        #include "bill.h"

        #include <stdexcept>

        std::vector<int> split(int cents, int people) {
            if (people < 1) {
                throw std::invalid_argument(
                    "people must be at least 1");
            }
            const int share = cents / people;
            const int extra = cents % people;
            std::vector<int> shares;
            for (int i = 0; i < people; ++i) {
                shares.push_back(i < extra ? share + 1
                                           : share);
            }
            return shares;
        }
    weak_test_tests:
      file: "bill_test.cpp"
      source: |
        TEST(SplitTest, LeftoverCents) {
            EXPECT_EQ(split(8000, 3).size(), 3u);
        }

        TEST(SplitTest, FirstPeoplePayExtraCent) {
            EXPECT_THAT(split(8000, 3),
                        ElementsAre(2667, 2667, 2666));
        }
      focus: {weak: [1, 2, 3], strong: [5, 6, 7, 8]}
    weak_test_code:
      file: "bill.cpp"
      source: |
        std::vector<int> split(int cents, int people) {
            return std::vector<int>(people, cents / people);
        }
      focus: {divide: [2]}
  stage:
    runner: "GoogleTest"
    files: {tests: "bill_test.cpp", code: "bill.cpp"}
    tests:
      one: "SplitTest.OnePersonPaysItAll"
      even: "SplitTest.EvenSplit"
      extra: "SplitTest.FirstPeoplePayExtraCent"
      weak: "SplitTest.LeftoverCents"
    cards:
      test_one_person:
        - "TEST(SplitTest, OnePersonPaysItAll) {"
        - "    EXPECT_THAT(split(3000, 1),"
        - "                ElementsAre(3000));"
        - "}"
      fake_it:
        - "std::vector<int> split(int cents, int people) {"
        - "    return {3000};"
        - "}"
      test_even:
        - "TEST(SplitTest, EvenSplit) {"
        - "    EXPECT_THAT(split(3000, 3),"
        - "                ElementsAre(1000, 1000, 1000));"
        - "}"
      general:
