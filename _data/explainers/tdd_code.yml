# Code for the Test-Driven Development video narration (docs/tdd-narration.md).
# Every card and runner line was compiled and run with pytest 8.4, JUnit 5.11,
# GoogleTest 1.18 with gMock, and Jest 29 with ts-jest; the runner lines are
# verbatim (an ellipsis marks lines left out). Per language:
#   label, filename, note: the complete example in the control bar and transcript
#   blocks: the complete example (tests, then bill) and the closer look weak_test
#   stage: what the animated stage draws in this language: file names, the code
#     cards by name, the test names, and the runner bar's lines per step

python:
  label: "Python · pytest"
  filename: "test_bill.py, then bill.py"
  note: "The tests come first, then the code they drove; each part starts with its file name."
  blocks:
    tests:
      source: |
        # test_bill.py
        import pytest

        from bill import split


        def test_one_person_pays_it_all() -> None:
            assert split(3000, 1) == [3000]


        def test_even_split() -> None:
            assert split(3000, 3) == [1000, 1000, 1000]


        def test_first_people_pay_extra_cent() -> None:
            assert split(8000, 3) == [2667, 2667, 2666]


        def test_zero_people_is_rejected() -> None:
            with pytest.raises(ValueError):
                split(3000, 0)
    bill:
      source: |
        # bill.py
        def split(cents: int, people: int) -> list[int]:
            if people < 1:
                raise ValueError("people must be at least 1")
            share, extra = divmod(cents, people)
            return [share + 1 if i < extra else share
                    for i in range(people)]
    weak_test_tests:
      file: "test_bill.py"
      source: |
        from bill import split


        def test_leftover_cents() -> None:
            assert len(split(8000, 3)) == 3


        def test_first_people_pay_extra_cent() -> None:
            assert split(8000, 3) == [2667, 2667, 2666]
      focus: {weak: [4, 5], strong: [8, 9]}
    weak_test_code:
      file: "bill.py"
      source: |
        def split(cents: int, people: int) -> list[int]:
            return [cents // people] * people
      focus: {divide: [2]}
  stage:
    runner: "pytest"
    files: {tests: "test_bill.py", code: "bill.py"}
    tests:
      one: "test_one_person_pays_it_all"
      even: "test_even_split"
      extra: "test_first_people_pay_extra_cent"
      weak: "test_leftover_cents"
    cards:
      test_one_person:
        - "def test_one_person_pays_it_all() -> None:"
        - "    assert split(3000, 1) == [3000]"
      fake_it:
        - "def split(cents: int, people: int) -> list[int]:"
        - "    return [3000]"
      test_even:
        - "def test_even_split() -> None:"
        - "    assert split(3000, 3) == [1000, 1000, 1000]"
      general:
        - "def split(cents: int, people: int) -> list[int]:"
        - "    return [cents // people] * people"
      test_extra_cent:
        - "def test_first_people_pay_extra_cent() -> None:"
        - "    assert split(8000, 3) == [2667, 2667, 2666]"
      fill_patch:
        - "def split(cents: int, people: int) -> list[int]:"
        - "    shares = [cents // people] * people"
        - "    for i in range(cents % people):"
        - "        shares[i] += 1"
        - "    return shares"
      refactored:
        - "def split(cents: int, people: int) -> list[int]:"
        - "    share, extra = divmod(cents, people)"
        - "    return [share + 1 if i < extra else share"
        - "            for i in range(people)]"
      test_weak:
        - "def test_leftover_cents() -> None:"
        - "    assert len(split(8000, 3)) == 3"
      tip:
        - "def split(cents: int, people: int,"
        - "          tip_percent: int = 0) -> list[int]:"
        - "    cents += cents * tip_percent // 100"
        - "    shares = [cents // people] * people"
        - "    for i in range(cents % people):"
        - "        shares[i] += 1"
        - "    return shares"
      slip:
        - "def split(cents: int, people: int) -> list[int]:"
        - "    share, extra = divmod(cents, people)"
        - "    return [share + 1 if i <= extra else share"
        - "            for i in range(people)]"
      test_typo:
        - "def test_first_people_pay_extra_cent() -> None:"
        - "    assert splt(8000, 3) == [2667, 2667, 2666]"
    steps:
      sample_red: "1 failed, 1 passed in 0.02s"
      sample_green: "2 passed in 0.01s"
      s1_red:
        status: "1 error in 0.06s"
        detail:
          - "ImportError: cannot import name 'split'"
          - "from 'bill'"
      s1_green:
        status: "1 passed in 0.01s"
      s2_red:
        status: "1 failed, 1 passed in 0.02s"
