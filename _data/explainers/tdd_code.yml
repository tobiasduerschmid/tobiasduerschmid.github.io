          - "expected: <[1000, 1000, 1000]>"
          - "but was: <[3000]>"
      s2_green:
        status: "[         2 tests successful      ]"
      s3_red:
        status: "[         1 tests failed          ]"
        detail:
          - "expected: <[2667, 2667, 2666]>"
          - "but was: <[2666, 2666, 2666]>"
      s3_green:
        status: "[         3 tests successful      ]"
