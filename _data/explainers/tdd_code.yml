typescript:
  label: "TypeScript · Jest"
  filename: "bill.test.ts, then bill.ts"
  note: "The tests come first, then the code they drove; each part starts with its file name."
  blocks:
    tests:
      source: |
        // bill.test.ts
        import { split } from './bill';

        test('one person pays it all', () => {
          expect(split(3000, 1)).toEqual([3000]);
        });

        test('even split', () => {
          expect(split(3000, 3))
            .toEqual([1000, 1000, 1000]);
        });

        test('first people pay the extra cent', () => {
          expect(split(8000, 3))
            .toEqual([2667, 2667, 2666]);
        });

        test('zero people is rejected', () => {
          expect(() => split(3000, 0))
            .toThrow(RangeError);
        });
    bill:
      source: |
        // bill.ts
        export function split(
          cents: number, people: number
        ): number[] {
          if (people < 1) {
            throw new RangeError('people must be at least 1');
          }
          const share = Math.floor(cents / people);
          const extra = cents % people;
          return Array.from({ length: people },
            (_, i) => (i < extra ? share + 1 : share));
        }
    weak_test_tests:
      file: "bill.test.ts"
      source: |
        import { split } from './bill';

        test('leftover cents', () => {
          expect(split(8000, 3)).toHaveLength(3);
        });

        test('first people pay the extra cent', () => {
          expect(split(8000, 3)).toEqual([2667, 2667, 2666]);
        });
      focus: {weak: [3, 4, 5], strong: [7, 8, 9]}
    weak_test_code:
      file: "bill.ts"
      source: |
        export function split(
          cents: number, people: number
        ): number[] {
          return new Array<number>(people)
            .fill(Math.floor(cents / people));
        }
      focus: {divide: [4, 5]}
  stage:
    runner: "Jest"
    files: {tests: "bill.test.ts", code: "bill.ts"}
