java:
  label: "Java · JUnit 5"
  filename: "BillTest.java, then Bill.java"
  note: "The tests come first, then the code they drove; each part starts with its file name."
  blocks:
    tests:
      source: |
        // BillTest.java
        import static org.junit.jupiter.api.Assertions.assertEquals;
        import static org.junit.jupiter.api.Assertions.assertThrows;

        import java.util.List;
        import org.junit.jupiter.api.Test;

        class BillTest {
            @Test
            void onePersonPaysItAll() {
                assertEquals(List.of(3000),
                             Bill.split(3000, 1));
            }

            @Test
            void evenSplit() {
                assertEquals(List.of(1000, 1000, 1000),
                             Bill.split(3000, 3));
            }

            @Test
            void firstPeoplePayExtraCent() {
                assertEquals(List.of(2667, 2667, 2666),
                             Bill.split(8000, 3));
            }

            @Test
            void zeroPeopleIsRejected() {
                assertThrows(IllegalArgumentException.class,
                             () -> Bill.split(3000, 0));
            }
        }
    bill:
      source: |
        // Bill.java
        import java.util.List;
        import java.util.stream.IntStream;

        final class Bill {
            static List<Integer> split(int cents,
                                       int people) {
                if (people < 1) {
                    throw new IllegalArgumentException(
                        "people must be at least 1");
                }
                int share = cents / people;
                int extra = cents % people;
                return IntStream.range(0, people)
                    .map(i -> i < extra ? share + 1 : share)
                    .boxed()
                    .toList();
            }
        }
    weak_test_tests:
      file: "BillTest.java"
      source: |
        class BillTest {
            @Test
            void leftoverCents() {
                assertEquals(3, Bill.split(8000, 3).size());
            }

            @Test
            void firstPeoplePayExtraCent() {
                assertEquals(List.of(2667, 2667, 2666),
                             Bill.split(8000, 3));
            }
        }
      focus: {weak: [2, 3, 4, 5], strong: [7, 8, 9, 10, 11]}
    weak_test_code:
      file: "Bill.java"
      source: |
        final class Bill {
            static List<Integer> split(int cents, int people) {
                return Collections.nCopies(people, cents / people);
            }
        }
      focus: {divide: [3]}
  stage:
    runner: "JUnit 5"
    files: {tests: "BillTest.java", code: "Bill.java"}
    tests:
      one: "onePersonPaysItAll()"
      even: "evenSplit()"
      extra: "firstPeoplePayExtraCent()"
      weak: "leftoverCents()"
    cards:
      test_one_person:
        - "@Test"
        - "void onePersonPaysItAll() {"
        - "    assertEquals(List.of(3000),"
        - "                 Bill.split(3000, 1));"
        - "}"
      fake_it:
        - "static List<Integer> split(int cents,"
        - "                           int people) {"
        - "    return List.of(3000);"
        - "}"
      test_even:
        - "@Test"
        - "void evenSplit() {"
        - "    assertEquals(List.of(1000, 1000, 1000),"
        - "                 Bill.split(3000, 3));"
        - "}"
      general:
        - "static List<Integer> split(int cents,"
        - "                           int people) {"
        - "    return Collections.nCopies(people,"
        - "                               cents / people);"
        - "}"
      test_extra_cent:
        - "@Test"
        - "void firstPeoplePayExtraCent() {"
        - "    assertEquals(List.of(2667, 2667, 2666),"
        - "                 Bill.split(8000, 3));"
        - "}"
      fill_patch:
        - "static List<Integer> split(int cents,"
        - "                           int people) {"
        - "    Integer[] shares = new Integer[people];"
        - "    Arrays.fill(shares, cents / people);"
        - "    for (int i = 0; i < cents % people; i++) {"
        - "        shares[i]++;"
        - "    }"
        - "    return List.of(shares);"
        - "}"
      refactored:
        - "static List<Integer> split(int cents,"
        - "                           int people) {"
        - "    int share = cents / people;"
        - "    int extra = cents % people;"
        - "    return IntStream.range(0, people)"
        - "        .map(i -> i < extra ? share + 1 : share)"
        - "        .boxed()"
        - "        .toList();"
        - "}"
      test_weak:
        - "@Test"
        - "void leftoverCents() {"
        - "    assertEquals(3, Bill.split(8000, 3).size());"
        - "}"
      tip:
        - "// split(cents, people) as before"
        - ""
        - "static List<Integer> split(int cents,"
        - "                           int people,"
        - "                           int tipPercent) {"
        - "    int tip = cents * tipPercent / 100;"
        - "    return split(cents + tip, people);"
        - "}"
      slip:
        - "static List<Integer> split(int cents,"
        - "                           int people) {"
        - "    int share = cents / people;"
        - "    int extra = cents % people;"
        - "    return IntStream.range(0, people)"
        - "        .map(i -> i <= extra ? share + 1 : share)"
        - "        .boxed()"
        - "        .toList();"
        - "}"
      test_typo:
        - "@Test"
        - "void firstPeoplePayExtraCent() {"
        - "    assertEquals(List.of(2667, 2667, 2666),"
        - "                 Bill.splt(8000, 3));"
        - "}"
    steps:
      sample_red: "[         1 tests failed          ]"
      sample_green: "[         2 tests successful      ]"
      s1_red:
        status: "1 error"
        build: true
        runner: "javac"
        detail:
          - "error: cannot find symbol"
          - "symbol:   method split(int,int)"
      s1_green:
        status: "[         1 tests successful      ]"
      s2_red:
        status: "[         1 tests failed          ]"
