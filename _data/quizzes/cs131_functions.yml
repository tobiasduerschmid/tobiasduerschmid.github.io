title: 'CS 131: Functions'
description: Practice argument passing, delayed evaluation, closures, and exception flow from the lectures.
active: true
# Original replacement practice. Page references are physical PDF pages.
# Time estimates are planning estimates, not time limits.
questions:
  # Lecture: data_palooza_v12_handouts.pdf pp.167–172; function_palooza_v8_handouts.pdf p.9
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P1; [Final] F24 Solutions (Public).pdf P3 pp.8–9 (parameter-passing trace)
  - id: cs131-v2-functions-value-reference
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      `value` parameters receive a copy; `ref` parameters alias the caller's variable. What is printed?

      ```text
      function change(value p, ref q) {
          p = p + 2
          q = q + 3
      }
      var a = 4
      var b = 5
      change(a, b)
      print(a, b)
      ```
    options:
    - 6, 8
    - 4, 8
    - 4, 5
    correct_index: 1
    option_feedback:
      0: p is a copy, so updating p does not change a.
      2: q aliases b, so updating q persists in the caller.
    explanation: Assigning p changes only the local copy. Assigning q changes b through the alias.

  # Lecture: data_palooza_v12_handouts.pdf pp.174–177; function_palooza_v8_handouts.pdf p.9
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P1 (mutation versus parameter rebinding)
  - id: cs131-v2-functions-object-reference
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |-
      What does this Python code print?

      ```python
      def change(items):
          items[0] = 6
          items = [9]
          items[0] = 10

      a = [2]
      change(a)
      print(a)
      ```
    options:
    - '[2]'
    - '[6]'
    - '[10]'
    correct_index: 1
    option_feedback:
      0: Passing an object reference does not copy the list itself.
      2: The last mutation targets the replacement list, which a never refers to.
    explanation: The first mutation changes the shared list. Rebinding the parameter makes later changes affect only the new list.

  # Lecture: data_palooza_v12_handouts.pdf pp.167–177,189; function_palooza_v8_handouts.pdf p.9
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P1(a) (infer all compatible bindings)
  - id: cs131-v2-functions-infer-passing
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: A caller owns a mutable Box whose field starts at 2. A function receives that Box and performs only `p.field = 5`. The caller then sees 5. Select every parameter strategy consistent with this observation. For value passing, the Box contains only this integer field and is copied.
    options:
    - Pass by value
    - Pass by reference
    - Pass by object reference
    correct_indices:
    - 1
    - 2
    option_feedback:
      0: A value parameter gets its own Box copy, whose field mutation would not affect the caller.
      1: An alias to the caller’s variable gives access to the original Box.
      2: A separate object reference can still point to the same mutable Box.
    explanation: Both reference passing and object-reference passing let this mutation reach the original Box. The observation does not distinguish them.

  # Lecture: function_palooza_v8_handouts.pdf pp.10–11
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P1 (compare argument-passing traces; value-result extension from lecture)
  - id: cs131-v2-functions-copy-in-out
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      `p` uses value-result: copy in on entry, copy back on normal return. `x` is global. What is printed?

      ```text
      var x = 3
      function change(value_result p) {
          p = 8
          print(x)
      }
      change(x)
      print(x)
      ```
    options:
    - 8, 8
    - 3, 3
    - 3, 8
    correct_index: 2
    option_feedback:
      0: Immediate caller updates describe reference passing; value-result delays the copy back until return.
      1: Pure value passing would leave x unchanged after the call; value-result copies the final value back.
    explanation: Inside change, only p’s private copy has changed, so x is still 3. Returning copies 8 back to x.

  # Lecture: data_palooza_v12_handouts.pdf pp.187–193; function_palooza_v8_handouts.pdf p.9
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P2(a–b); [Final] F23 Solutions (Public).pdf Binding and Parameter Passing pp.7–8 (name/need trace)
  - id: cs131-v2-functions-name-need-count
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |-
      Only the parameter `x` is lazy; execution of the function body and printing are eager. `probe()` prints `P` and returns 4.

      ```text
      function twice(x) { return x + x }
      print(twice(probe()))
      ```
      How many times is `P` printed under name semantics and under need semantics?
    options:
    - 'Name: 1; need: 1'
    - 'Name: 2; need: 1'
    - 'Name: 2; need: 2'
    correct_index: 1
    option_feedback:
      0: Name semantics does not reuse the result of the first evaluation.
      2: Need semantics caches the first result rather than calling probe again.
    explanation: Name reevaluates the argument expression for each use of x. Need evaluates it once and caches its value for the second use.

  # Lecture: data_palooza_v12_handouts.pdf pp.187–193; function_palooza_v8_handouts.pdf p.9
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P2(a–b) (identify demanded arguments)
  - id: cs131-v2-functions-unused-lazy-argument
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: |-
      Both parameters use need semantics; operations in the body are eager once reached. What happens?

      ```text
      function first(x, y) { return x }
      print(first(7, 1 / 0))
      ```
      Division by zero would raise an exception if evaluated.
    options:
    - It prints 7.
    - It raises before first starts.
    - It prints 7, then raises.
    correct_index: 0
    option_feedback:
      1: The unused argument is not evaluated at the call boundary under need semantics.
      2: Returning from a function does not force its unused lazy arguments.
    explanation: first demands x but never y. The deferred division is never evaluated.

  # Lecture: function_palooza_v8_handouts.pdf pp.70–71
  # Assessment: [Final] F24 Solutions (Public).pdf P1(B.3) p.3 (closure/free-variable reasoning)
  - id: cs131-v2-functions-capture-copy
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: |-
      This C++ lambda captures `offset` by value. What is printed?

      ```cpp
      int offset = 3;
      auto add = [offset](int x) { return x + offset; };
      offset = 10;
      cout << add(4);
      ```
    options:
    - '7'
    - '14'
    - A dangling-reference error
    correct_index: 0
    option_feedback:
      1: This would require observing the later value of the original variable rather than the stated value capture.
      2: The lambda stores its own captured value, not a reference to destroyed storage.
    explanation: 'The closure stores a copy of offset’s value at creation: 3. Changing the original variable does not change that copy.'

  # Lecture: function_palooza_v8_handouts.pdf pp.71,74–75; data_palooza_v12_handouts.pdf pp.174–177
  # Assessment: [Midterm] F24 Solutions (Public).pdf P4 pp.7–8 (shared-reference mutation); closure extension from lecture
  - id: cs131-v2-functions-capture-shared-object
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 40
    question: |-
      A closure captures an object reference to the existing Box, without copying the Box itself. What is printed?

      ```text
      box = new Box(value=3)
      change = lambda(): box.value = 8
      box.value = 5
      change()
      print(box.value)
      ```
    options:
    - '3'
    - '5'
    - '8'
    correct_index: 2
    option_feedback:
      0: Creating the closure does not preserve or later restore the Box’s initial field value.
      1: The closure runs after the field is set to 5, and its mutation changes that same Box to 8.
    explanation: The captured object reference reaches the original Box. Mutating its field changes the object later read through box.

  # Lecture: function_palooza_v8_handouts.pdf pp.64,67,70–73
  # Assessment: [Final] F23 Solutions (Public).pdf Before-The-Midterm Concepts pp.2–3 (construct returned closures)
  - id: cs131-v2-functions-return-function
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 75
    question: Arrange the Python lines to define `make_offset`, return its nested function, create a function that adds 6, and print 8. Preserve the shown indentation.
    lines:
    - 'def make_offset(n):'
    - '    def add(x):'
    - '        return x + n'
    - '    return add'
    - f = make_offset(6)
    - print(f(2))
    distractors:
    - '    return add(0)'
    explanation: Returning add preserves a callable closure that uses n. Returning add(0) would return a number instead, so f(2) would fail.

  # Lecture: function_palooza_v8_handouts.pdf pp.70–71
  # Assessment: [Final] F24 Solutions (Public).pdf P1(B.3) p.3 (identify free variables)
  - id: cs131-v2-functions-free-variables
    type: multiple
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 35
    question: |-
      Select every variable that must be captured from the enclosing function to create this lambda. Arithmetic operators and literals do not need capture.

      ```text
      function make(m, b) {
          return lambda(x): m * x + b
      }
      ```
    options:
    - m
    - b
    - x
    correct_indices:
    - 0
    - 1
    option_feedback:
      2: A lambda parameter is supplied when the lambda is called, rather than captured from its enclosing scope.
    explanation: m and b are defined outside the lambda but used in its body. x is the lambda’s own parameter.

  # Lecture: function_palooza_v8_handouts.pdf pp.40–44
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P4; [Final] F23 Solutions (Public).pdf Error Handling pp.16–18 (unwinding trace)
  - id: cs131-v2-functions-exception-unwind
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      `fail()` raises Error immediately. What is printed, in order?

      ```text
      function inner() {
          print("I")
          fail()
          print("J")
      }
      try {
          inner()
          print("K")
      } catch Error {
          print("H")
      }
      print("D")
      ```
    options:
    - I, J, H, D
    - I, H, K, D
    - I, H, D
    correct_index: 2
    option_feedback:
      0: Execution does not continue after fail inside inner.
      1: A catch does not resume the abandoned try block at K.
    explanation: The exception exits inner and skips the rest of the try block. After the handler, execution continues with D.

  # Lecture: function_palooza_v8_handouts.pdf pp.44–46
  # Assessment: [Final] F23 Solutions (Public).pdf Error Handling pp.16–18 (match exception handlers)
  - id: cs131-v2-functions-handler-supertype
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: ReadError is a subtype of IOError; IOError is a subtype of Error. An inner try has only a `catch ArithmeticError`. The surrounding outer try has `catch IOError` followed by `catch Error`. A ReadError is thrown in the inner try. Which handler executes?
    options:
    - The inner ArithmeticError handler
    - The outer IOError handler
    - The outer Error handler
    correct_index: 1
    option_feedback:
      0: Proximity alone is insufficient; a handler must accept the thrown exception’s type.
      2: The earlier IOError handler already matches, so control does not continue to the broader handler.
    explanation: The inner handler is incompatible. The first compatible outer handler accepts IOError and its ReadError subtype.

  # Lecture: function_palooza_v8_handouts.pdf pp.49–51
  # Assessment: [Final] F23 Solutions (Public).pdf Error Handling pp.16–19 (finally and return trace)
  - id: cs131-v2-functions-finally-before-return
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |-
      In this pseudocode, `finally` runs even when the try returns. What is printed?

      ```text
      function f() {
          try {
              print("T")
              return 4
          } finally {
              print("F")
          }
          print("A")
      }
      print(f())
      ```
    options:
    - T, 4, F
    - T, F, A, 4
    - T, F, 4
    correct_index: 2
    option_feedback:
      0: The caller receives the return value only after finally finishes.
      1: Running finally does not cancel the return; A is not reached.
    explanation: The pending return runs finally before leaving f. The statement after the try/finally is skipped.

  # Lecture: function_palooza_v8_handouts.pdf pp.47–50,52–54
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P4; [Final] F23 Solutions (Public).pdf Error Handling pp.18–19 (resource leaks and repair)
  - id: cs131-v2-functions-cleanup-finally
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 75
    question: Arrange the Python-shaped pseudocode to acquire a connection before the try, call send inside the try, and close the connection in finally. Print "done" only after successful sending and cleanup. Opening and closing succeed; send may raise Error. Preserve indentation.
    lines:
    - conn = open_connection()
    - 'try:'
    - '    send(conn)'
    - 'finally:'
    - '    close(conn)'
    - print("done")
    distractors:
    - 'except Error:'
    explanation: The finally block closes the acquired connection on both normal and exceptional paths. If send raises, the exception propagates after cleanup and the final print is skipped. An except block alone would run cleanup only on failure.

  # Lecture: function_palooza_v8_handouts.pdf pp.25–29,61
  # Assessment: [Final] F23 Solutions (Public).pdf Error Handling pp.16–19; Before-The-Midterm Concepts pp.4–6 (error-result representation)
  - id: cs131-v2-functions-result-choice
    type: single
    difficulty: advanced
    bloom: evaluate
    estimated_seconds: 60
    question: A lookup often finds no record; occasionally it finds a record but lacks permission to read it. The caller needs to distinguish these two expected failures from a successful record. Which lecture mechanism most directly represents all three outcomes?
    options:
    - An Optional containing a record or no value
    - A Result containing a record or error details
    - An assertion that a readable record exists
    correct_index: 1
    option_feedback:
      0: An empty Optional alone does not distinguish the two failure reasons.
      2: These are expected outcomes that the caller can handle, not a broken program invariant.
    explanation: A Result distinguishes a successful value from failure details, so the caller can handle missing records and denied access differently.

  # Lecture: function_palooza_v8_handouts.pdf p.58
  # Assessment: [Final] F23 Solutions (Public).pdf Error Handling pp.18–19 (classify exception guarantees)
  - id: cs131-v2-functions-exception-guarantees
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: An operation may throw. On failure it closes all acquired resources and preserves every invariant, but a progress counter may remain incremented. Select every guarantee established by this description.
    options:
    - Basic exception guarantee
    - Strong exception guarantee
    - No-throw guarantee
    correct_indices:
    - 0
    option_feedback:
      1: The strong guarantee restores the pre-call state; the incremented counter violates that promise.
      2: The operation is explicitly allowed to throw.
    explanation: The program remains valid and leaks no resources, satisfying the basic guarantee. The counter prevents a full rollback, and exceptions may escape.
