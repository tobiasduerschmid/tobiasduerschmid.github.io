title: "Strategy Pattern Quiz"
description: "Test your understanding of the Strategy pattern's structure, its composition-over-inheritance principle, and the often-confused boundary with the State pattern."
active: true
questions:
  - id: 1
    difficulty: intermediate
    type: single
    question: |
      A team is designing an e-commerce checkout system. Customers can pay by credit card, PayPal, gift card, or bank transfer, and can change methods on the same checkout. The team wants to add cryptocurrency without changing the shared checkout pipeline. Which design best fits?
    options:
      - "A `Checkout` class with an `if/else` chain on a `paymentType` string parameter, with one new branch per payment method."
      - "A `PaymentMethod` interface with concrete classes `CreditCardPayment`, `PayPalPayment`, etc.; `Checkout` holds one and delegates `pay()` to it."
      - "An abstract `Checkout` class with subclasses `CreditCardCheckout`, `PayPalCheckout`, `GiftCardCheckout`, each overriding the `pay()` method."
      - "A `Checkout` class with one method per payment type (`payByCreditCard`, `payByPayPal`, ...) and the client picks which to call."
    correct_index: 1
    option_feedback:
      0: |
        Adding cryptocurrency means *modifying* the existing `if/else` chain — a violation of the Open/Closed Principle, which is exactly the smell Strategy addresses. Each new payment type becomes another conditional branch in a method that already does too much.
      2: |
        Subclassing `Checkout` per payment type couples checkout-flow logic to payment-method logic. Changing the method requires replacing the checkout instance or adding another selection mechanism. Inherited checkout code can be reused, but the payment variation remains tied to the checkout subtype. Strategy fixes both by composing payment with checkout.
      3: |
        One method per payment type exposes every payment variation in the Checkout API. Adding another type requires changing that class and any callers that select it. The whole point of Strategy is to give the client a single uniform call (`checkout.pay()`) regardless of method.
    explanation: "With `PaymentMethod` as the interface and one concrete class per method, adding cryptocurrency means writing a new `CryptoPayment` class and configuring it — the shared checkout pipeline stays unchanged. The client picks which strategy to construct, and `Checkout` delegates `pay()` to it without knowing the payment type."

  - id: 2
    difficulty: intermediate
    type: single
    question: |
      Consider this UML structure: a `Context` class holds a reference to an interface, and several concrete classes implement that interface. The Context delegates an operation to the held implementation, which can be swapped via a setter. **Both** the State and Strategy patterns have exactly this structure. What actually distinguishes them?
    options:
      - "State has a finite number of concrete classes; Strategy can have unboundedly many."
      - "State uses inheritance for the concrete classes; Strategy uses composition."
      - "State organizes lifecycle behavior; Strategy supplies an algorithm for a task."
      - "State is a creational pattern; Strategy is a behavioral pattern."
    correct_index: 2
    option_feedback:
      0: |
        Both patterns can have any number of concrete classes — that's not the distinguishing axis. A state machine with three states is still State; a sort routine with ten comparators is still Strategy.
      1: |
        Both patterns use composition — the Context *has-a* State or *has-a* Strategy. Concrete State and Concrete Strategy classes typically realize an interface (composition between Context and Strategy/State); subclassing inside the State or Strategy hierarchies is incidental.
      3: |
        Both are behavioral patterns in the GoF catalog. Creational patterns deal with *how objects are created* (Factory Method, Singleton, Builder), not how they delegate behavior.
    explanation: "The intent distinguishes the patterns. State organizes behavior around a Context's lifecycle state and transitions; Strategy makes an algorithm independently interchangeable. Internal transitions and client configuration are useful clues, but State can also let clients select a mode."

  - id: 3
    difficulty: intermediate
    type: multiple
    question: |
      Which of the following are **valid reasons** to use the Strategy pattern? Select all that apply.
    options:
      - "A class has multiple `if`/`switch` branches selecting between alternative algorithms."
      - "Different variants of an algorithm have different time/space trade-offs and the client should be able to choose."
      - "An algorithm uses internal data structures that clients should not know about."
      - "There is only one algorithm today, but management said there *might* be a second one in three years."
      - "Several related classes differ only in how they perform one specific behavior."
    correct_indices: [0, 1, 2, 4]
    option_feedback:
      0: |
        Repeated algorithm-selection branches can justify moving each algorithm into a strategy. Kerievsky's supplied draft calls its calculation example Replace Conditional Calculations with Strategy; a small stable conditional alone does not require the pattern.
      1: |
        Exposing implementation choices with different time/space trade-offs to the client is an explicit Applicability criterion from the GoF catalog.
      2: |
        Hiding algorithm-specific data is a direct Applicability case from the GoF catalog. The Strategy interface gives clients a clean façade while ConcreteStrategies own their internal data structures.
      3: |
        Speculative abstraction is over-engineering. A speculative future variant alone does not justify the extra abstraction. There is no mandatory count of three variants or runtime-swapping requirement. Building flexibility for changes that may never come is the textbook example of premature abstraction.
      4: |
        Several classes that vary only in one behavior is a strong Strategy signal: instead of N subclasses each overriding one method, one Context composes with one of N strategies. This is the Applicability bullet behind the SimUDuck refactoring.
    explanation: "**Strategy is justified by present complexity (conditional dispatch, varying behavior, hidden data, multiple subclasses differing in one axis) — not by speculative future flexibility.** All four 'present complexity' cases are Applicability criteria from the GoF catalog. These are reasons to consider Strategy, not automatic mandates. Two real variants can justify it when independent algorithms simplify maintenance."

  - id: 4
    difficulty: intermediate
    type: single
    question: |
      Several duck classes implement `Flyable`, whose interface declares only `fly()`. Each class contains a copy of the same wing-flapping code. What change would let these ducks reuse that behavior and change it per object?
    options:
      - "Move wing-flapping into a default method and remove per-object behavior fields."
      - "Delegate flying to a `FlyBehavior` object, reusing a `FlyWithWings` implementation."
      - "Copy `fly()` into a common base duck class and override it for each new variation."
      - "Keep the copies and add a `flightType` switch inside each duck's `fly()` method."
    correct_index: 1
    option_feedback:
      0: "A default method can share code, but by itself does not let each duck select and replace a behavior object."
      2: "Inheritance can share implementation, but ties the variation to the duck's class rather than a replaceable collaborator."
      3: "Repeating selection logic preserves the duplication and makes every duck class responsible for each flight variation."
    explanation: "Interfaces specify operations; they do not force code duplication. In this design, delegation shares the flight implementation and lets each duck replace its behavior without changing its class. Java default methods can also share code, but they do not alone provide per-object strategy selection."

  - id: 5
    difficulty: advanced
    type: single
    question: |
      A `Compositor` interface defines `compose(natural[], stretch[], shrink[], width, breaks[])`. Three ConcreteStrategies implement it: `SimpleCompositor` (greedy), `TeXCompositor` (paragraph layout), and `ArrayCompositor` (fixed item count per row). The `SimpleCompositor` ignores the `stretch` and `shrink` arrays entirely. Which Strategy *consequence* does this illustrate?
    options:
      - "Strategies eliminate conditional statements."
      - "Communication overhead between Strategy and Context."
      - "Increased number of objects."
      - "Clients must be aware of different Strategies."
    correct_index: 1
    option_feedback:
      0: |
        The example doesn't show conditional code being eliminated — that's a different consequence. Here the Context uniformly hands every Compositor the same data; the issue is that some of that data is wasted.
      2: |
        The number of Compositor instances isn't what's at stake here — the issue is wasted preparation work for unused parameters, not class count.
      3: |
        Clients must know strategies differ — but that's about *which* strategy to pick, not about wasted parameters in the shared interface. The example illustrates Context-side cost, not client-side cost.
    explanation: "This is the *communication overhead* consequence from the GoF list. Because all ConcreteStrategies share one interface, the Context must prepare data sufficient for the most demanding strategy, and simpler ones like `SimpleCompositor` waste that preparation. One alternative is to pass the Context through a stable query interface, letting each strategy request only the data it needs at the cost of closer coupling."

  - id: 6
    difficulty: intermediate
    type: single
    question: |
      A teammate writes:

      ```java
      class FlyNullObject implements FlyBehavior {
          public void fly() { /* do nothing */ }
      }
      ```

      Why is this preferable to leaving the `flyBehavior` field as `null` and writing `if (flyBehavior != null) flyBehavior.fly();` in the Context?
    options:
      - "It's faster — empty method calls are optimized away by the JIT."
      - "The `null` check would throw `NullPointerException` on the very first call."
      - "Call sites stay uniform — 'does not fly' is a named type, not a missing reference."
      - "It satisfies Java's strict-mode requirement that all interface fields be non-null at construction time."
    correct_index: 2
    option_feedback:
      0: |
        Performance is not the primary motivation — and JIT optimization is unrelated. The Null Object pattern is about *design clarity* (uniform call sites, explicit intent), not micro-optimization. Don't conflate "removes a check" with "is faster overall" — the call still happens.
      1: |
        A correctly-written `if (flyBehavior != null)` guard does not throw — it skips the call. The objection to null checks is design-level (scattered branches, hidden intent), not a runtime crash. If anything, *forgetting* the check is the bug; the Null Object eliminates the need to remember it.
      3: |
        Java has no such "strict-mode" rule. Fields can be `null` by default. Languages such as Kotlin support non-nullable types, but that's not Java behavior, and it's not the reason for using Null Object.
    explanation: "Null Object turns 'absence of behavior' into a real, polymorphic implementation. The call site stays uniform (`flyBehavior.fly()`) with no scattered null guards, and the intent — 'this duck does not fly' — is encoded as a named type (`FlyNullObject`) instead of a missing reference. Unlike Optional, which represents a possibly absent value, a Null Object supplies the behavior interface itself."

  - id: 7
    difficulty: advanced
    type: single
    question: |
      Which of the following common library mechanisms is **NOT** a use of the Strategy pattern?
    options:
      - "Passing a `Comparator<T>` to `Collections.sort()` to control sort order."
      - "Configuring an HTTP client with a `RetryPolicy` (no retry, exponential backoff, fixed-interval)."
      - "Subclassing `JPanel` to override `paintComponent` for custom drawing."
      - "Plugging a custom `AuthenticationProvider` into Spring Security to handle login."
    correct_index: 2
    option_feedback:
      0: |
        `Comparator` is the textbook Strategy: a small interface with one method, multiple ConcreteStrategies (natural order, by-field, custom rules), passed in at the call site to vary behavior. Java's standard library uses Strategy explicitly here.
      1: |
        `RetryPolicy` is Strategy in the 'Policy' sense (the GoF's alternate name). The HTTP client (Context) delegates retry decisions to whichever Policy is configured.
      3: |
        Spring's `AuthenticationProvider` is Strategy: Spring (Context) delegates authentication to whichever provider you plug in, without knowing whether it's LDAP, OAuth, or password-based.
    explanation: "Subclassing `JPanel` to override `paintComponent` is Template Method, not Strategy: the base class fixes the rendering skeleton (`paint`/`paintComponent`/`paintChildren`) and subclasses override individual steps via inheritance. Strategy uses *composition* — the Context holds an external Strategy object selected at construction time or later. Both vary parts of an algorithm, which is why they are easy to confuse."
