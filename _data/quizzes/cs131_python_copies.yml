title: 'CS 131: Python Copies and Nested Objects'
description: Distinguish aliases, shallow copies, deep copies, and mutable children.
active: true
# Reviewed against the supplied CS131 lectures, homework, and past assessments (2026-10-14).
questions:
  # Taught / practice evidence: Essential Python handout p. 10 (copy depth); Homework PYTHON4 A.1–A.5; F24 Midterm V1 Problem 4, pp. 7–8.
  - id: cs131-v2-python-shallow-copy-slot-versus-child
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 75
    question: |-
      What does this Python code print?

      ```python
      from copy import copy
      original = [[1], [2]]
      draft = copy(original)
      draft[0] = [7]
      draft[1].append(8)
      print(original)
      ```
    options:
    - '`[[1], [2]]`'
    - '`[[7], [2, 8]]`'
    - '`[[1], [2, 8]]`'
    correct_index: 2
    option_feedback:
      0: The second inner list is shared after a shallow copy, so its append reaches the original.
      1: The two outer lists have separate slots. Replacing `draft[0]` does not replace `original[0]`.
    explanation: The shallow copy gives `draft` its own outer list while sharing the original children. Rebinding one slot
      is isolated; mutating the other child is shared.

  # Taught / practice evidence: Essential Python handout p. 10 (copy depth); Homework PYTHON4 A.1–A.5; F24 Midterm V1 Problem 4, pp. 7–8.
  - id: cs131-v2-python-deep-copy-before-later-edit
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      What does this Python code print?

      ```python
      from copy import deepcopy
      source = [[4]]
      saved = deepcopy(source)
      source[0].append(5)
      saved.append([6])
      print(source, saved)
      ```
    options:
    - '`[[4, 5], [6]] [[4, 5], [6]]`'
    - '`[[4, 5]] [[4], [6]]`'
    - '`[[4, 5]] [[4, 5], [6]]`'
    correct_index: 1
    option_feedback:
      0: A deep copy creates a separate outer list, so appending to `saved` does not extend `source`.
      2: Deep copying also copies the mutable inner list, so the later append of 5 is isolated.
    explanation: The saved inner list retains `[4]`. The two subsequent changes affect different object graphs.

  # Taught / practice evidence: Essential Python handout p. 10 (copy depth); Homework PYTHON4 A.1–A.5; F24 Midterm V1 Problem 4, pp. 7–8.
  - id: cs131-v2-python-constructor-copy-reference
    type: single
    difficulty: basic
    bloom: understand
    estimated_seconds: 30
    question: A Python constructor uses `self.values = values`. A caller later appends to the supplied list. Which explanation
      accounts for the object seeing that new element?
    options:
    - The field and caller share one list.
    - The field gets an independent list.
    - The field tracks the caller’s variable.
    correct_index: 0
    option_feedback:
      1: Assignment stores the supplied reference; copying must be requested explicitly.
      2: The field stores an object reference, not a link to a caller variable. Rebinding that variable would leave the
        field unchanged.
    explanation: Assigning the argument to a field stores the same list reference. A later mutation is visible along both
      paths.

  # Taught / practice evidence: Essential Python handout p. 10 (copy depth); Homework PYTHON4 A.1–A.5; F24 Midterm V1 Problem 4, pp. 7–8.
  - id: cs131-v2-python-copy-contract-checks
    type: multiple
    difficulty: intermediate
    bloom: evaluate
    estimated_seconds: 60
    question: |-
      A reviewer claims that Python's `b = copy(a)` makes an independent outer list but shares its inner lists. After this setup, which expressions directly confirm that claim? Select all that apply.

      ```python
      from copy import copy
      a = [[3], [8]]
      b = copy(a)
      ```
    options:
    - '`a is not b`'
    - '`a[0] is b[0]`'
    - '`a[1] is not b[1]`'
    - '`a is b`'
    correct_indices:
    - 0
    - 1
    option_feedback:
      0: Different outer identities confirm a new top-level list.
      1: The shared child identity confirms that copying was shallow.
      2: Both original children are reused by the shallow copy.
      3: This would describe an assignment alias, not a shallow copy.
    explanation: Outer identity and child identity test different parts of the copying claim. Equality alone would not
      distinguish copy depths.

  # Taught / practice evidence: Essential Python handout p. 10 (copy depth); Homework PYTHON4 A.1–A.5; F24 Midterm V1 Problem 4, pp. 7–8.
  - id: cs131-v2-python-mutated-argument-and-returned-copy
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 75
    question: |-
      What does this Python code print?

      ```python
      def revise(values):
          values[0] = 4
          return values + [7]
      start = [1, 2]
      end = revise(start)
      end[1] = 9
      print(start, end)
      ```
    options:
    - '`[4, 9] [4, 9, 7]`'
    - '`[1, 2] [4, 9, 7]`'
    - '`[4, 2] [4, 9, 7]`'
    correct_index: 2
    option_feedback:
      0: List concatenation creates a separate outer list; editing its second slot is isolated.
      1: The indexed assignment happens before concatenation and mutates the caller's list.
    explanation: The original list becomes `[4, 2]`. The returned concatenation initially contains `[4, 2, 7]`, then its
      second slot is replaced with 9.

  # Taught / practice evidence: Essential Python handout p. 10 (copy depth); Homework PYTHON4 A.1–A.5; F24 Midterm V1 Problem 4, pp. 7–8.
  - id: cs131-v2-python-build-detached-row-edit
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 75
    question: Arrange a Python function that returns a deep-copied version of a nonempty nested list with 7 appended to its first
      row. The input and all its rows must stay unchanged. Assume `copy` and `deepcopy` are already imported.
    display: block
    lines:
    - 'def edited(rows):'
    - '    result = deepcopy(rows)'
    - '    result[0].append(7)'
    - '    return result'
    distractors:
    - '    result = rows'
    - '    result = copy(rows)'
    explanation: Copy the complete nested structure before mutating its first row. Assignment and shallow copying both
      leave that row shared.

  # Taught / practice evidence: Essential Python handout p. 10 (copy depth); Homework PYTHON4 A.1–A.5; F24 Midterm V1 Problem 4, pp. 7–8.
  - id: cs131-v2-python-repair-nested-copy
    type: single
    difficulty: intermediate
    bloom: evaluate
    estimated_seconds: 60
    question: |-
      This Python function must return an edited copy of a nonempty nested list while leaving every input row unchanged. Which replacement for the marked line meets that contract? Assume ordinary lists of integers.

      ```python
      from copy import copy, deepcopy
      def preview(rows):
          result = copy(rows)  # replace this line
          result[0].append(0)
          return result
      ```
    options:
    - '`result = rows`'
    - '`result = deepcopy(rows)`'
    - '`result = copy(copy(rows))`'
    correct_index: 1
    option_feedback:
      0: Assignment shares the entire input object graph.
      2: Copying the outer list twice still reuses the same inner lists.
    explanation: A deep copy duplicates the mutable rows before the append. Repeated shallow copies only add more independent
      outer containers.

  # Taught / practice evidence: Essential Python handout pp. 20–21 (lists of references); Quiz 1 Problem 2C–D.
  - id: cs131-python-shared-versus-new-rows
    type: single
    difficulty: intermediate
    question: |-
      What does this Python program print?

      ```python
      row = [4]
      repeated = [row, row]
      fresh = [[4], [4]]
      repeated[1].append(9)
      fresh[1].append(9)
      print(repeated, fresh)
      ```
    options:
    - '`[[4], [4, 9]] [[4], [4, 9]]`'
    - '`[[4, 9], [4, 9]] [[4, 9], [4, 9]]`'
    - '`[[4, 9], [4, 9]] [[4], [4, 9]]`'
    correct_index: 2
    option_feedback:
      0: Evaluating the name row twice retains two references to one list.
      1: Each [4] literal creates a distinct row in fresh, so only its second row changes.
    explanation: The repeated list stores the same row reference twice. The fresh list stores two separately constructed
      rows.

  # Taught / practice evidence: Essential Python handout p. 10 (copy depth); Homework PYTHON4 A.1–A.5; F24 Midterm V1 Problem 4, pp. 7–8.
  - id: cs131-python-tuple-child-copy
    type: single
    difficulty: advanced
    question: |-
      What does this Python program print?

      ```python
      from copy import copy, deepcopy
      source = {"entry": ("ok", [6])}
      draft = copy(source)
      saved = deepcopy(source)
      source["entry"][1].append(8)
      source["entry"] = ("new", [])
      print(draft["entry"], saved["entry"])
      ```
    options:
    - '`(''new'', []) (''ok'', [6])`'
    - '`(''ok'', [6, 8]) (''ok'', [6])`'
    - '`(''ok'', [6, 8]) (''ok'', [6, 8])`'
    correct_index: 1
    option_feedback:
      0: The shallow dictionary has its own entry slot, so replacing the source slot does not redirect it.
      2: The deep copy owns a separate mutable child list.
    explanation: The shallow dictionary retains the earlier tuple, including its shared list. The deep copy preserves the
      list’s earlier contents.

  # Taught / practice evidence: Essential Python handout p. 10 (copy depth); Homework PYTHON4 A.1–A.5; F24 Midterm V1 Problem 4, pp. 7–8.
  - id: cs131-python-shallow-parameter-records
    type: write-in
    difficulty: advanced
    question: What does this program print? Separate the values with spaces.
    explanation: 'Identify the object being mutated at each line: an outer list and a dictionary stored inside it have
      different copying boundaries.'
    program:
      language: python
      file: shallow-parameter-records.py
      code: |
        from copy import copy
        def revise(rows):
            rows = copy(rows)
            rows[1]["n"] += 4
            rows[0] = {"n": 0}
            return rows
        original = [{"n": 2}, {"n": 3}]
        edited = revise(original)
        edited.append({"n": 9})
        print(original[0]["n"], original[1]["n"], len(original))
    answer: 2 7 2
