title: "AI & Learning Quiz"
description: "Retrieving what you just learned can strengthen memory. Use this quiz to check your understanding, then revisit the ideas later."
active: true
questions:
  - id: 1
    difficulty: basic
    question: "What is 'cognitive offloading'?"
    options:
      - "Using AI to generate entire essays to save time."
      - "Using physical actions or external aids to reduce a task's mental demands."
      - "Turning off your brain while watching educational videos."
      - "A technique to increase memory capacity through brain exercises."
    correct_index: 1
    option_feedback:
      0: "Generating an entire essay is one possible use of an external tool, but cognitive offloading also includes bodily actions and other external aids that reduce mental demands."
      2: "Offloading uses bodily actions, tools, or representations to reduce a specific mental demand. Passive disengagement does not provide the same support for a task."
      3: "External tools do not increase biological memory capacity. They reduce what must be held or processed mentally by putting some of the work outside the mind."
    explanation: "**Cognitive offloading** uses physical actions or external aids to reduce a task's mental demands. Examples include counting on your fingers, writing a reminder, and using a calculator or AI tool."
  - id: 2
    difficulty: basic
    question: "What does research support about prior knowledge and AI assistance?"
    options:
      - "Greater expertise guarantees a larger AI productivity boost."
      - "Better AI-assisted output demonstrates independent learning."
      - "Prior knowledge can help users evaluate generated output."
      - "Novices should avoid AI assistance until they become experts."
    correct_index: 2
    option_feedback:
      0: "Knowing more can help with verification, but that does not guarantee a larger productivity gain. The Google randomized study did not detect a significant difference in AI's speed benefit by seniority."
      1: "An improved artifact can result from the tool doing the work. Independent and delayed assessments are needed to check what the learner retained."
      3: "Novices can benefit from appropriate guidance and worked examples. The important question is whether the assistance supports the skill being learned and whether its content is checked."
    explanation: "Foundational knowledge can help users guide and check AI, but the size of an AI benefit depends on the task, learner, and instructional design. Research does not establish that experts always gain more than novices."
  - id: 3
    difficulty: intermediate
    question: "A student is practicing algorithm design and testing. Which use of AI best preserves that practice?"
    options:
      - "Accepting an AI-written algorithm without working through its design."
      - "Using AI to format already-designed test data while designing the algorithm."
      - "Letting AI decide the architecture and edge cases of a system."
      - "Copying AI code without understanding how it works."
    correct_index: 1
    option_feedback:
      0: "Accepting the solution without reasoning through it removes the algorithm-design practice targeted here. A worked example can still help when its decisions are studied and followed by practice on a related problem."
      2: "Architecture and edge cases are central design reasoning, not just busywork. AI can help surface possibilities, but the student still needs to make and justify those decisions."
      3: "Copying code without understanding can create a false sense of fluency and hide defects. Beneficial offloading should leave the learner able to explain, test, and revise the result."
    explanation: "Formatting already-designed test data can free capacity for the algorithm design and testing being practiced. Whether a task is incidental depends on the learning goal: formatting data or writing HTML could itself be the skill another assignment is meant to teach."
  - id: 4
    difficulty: basic
    question: "What is the 'desirable difficulty' in the context of learning?"
    options:
      - "Any difficulty that makes a student want to give up."
      - "Challenges that can slow practice while improving later retention or transfer."
      - "Cognitive load that comes from confusing or poorly written course material."
      - "A state of confusion that has no educational benefit."
    correct_index: 1
    option_feedback:
      0: "Difficulty is only desirable when it remains productive and connected to the learning goal. Overload, discouragement, or impossible tasks can block learning instead of deepening it."
      2: "Struggle with badly explained material is *extraneous* cognitive load, not desirable difficulty. Desirable difficulty comes from the structure of the practice itself (retrieval, spacing, interleaving), not from having to decode unclear instruction."
      3: "An unresolved stuck state is not the goal. Productive challenge helps when it leads to retrieval, discrimination, explanation, or other deeper processing."
    explanation: "**Desirable difficulties** are challenges that might slow down initial performance but result in better long-term retention and deeper understanding."
