title: "Null Object Pattern Quiz"
description: "Test your understanding of the Null Object pattern's intent, its relationship to Singleton/Strategy/State, when it applies, and the bug-masking risk it introduces."
active: true
questions:
  - id: 1
    difficulty: basic
    type: single
    question: |
      Which sentence most accurately captures the **intent** of the Null Object pattern?
    options:
      - "Provide a surrogate for another object that shares the same interface but does nothing meaningful."
      - "Wrap an existing object so that all calls to it can be intercepted, controlled, or audited."
      - "Replace a `null` reference with a thrown exception so the caller is forced to handle the error."
      - "Defer creation of a collaborator until the first time a client actually calls a method on it."
    correct_index: 0
    option_feedback:
      1: |
        That's the [Proxy](https://en.wikipedia.org/wiki/Proxy_pattern) pattern, and the two are easy to confuse — a Proxy controls access to a real subject, possibly forwarding calls; a Null Object replaces the real subject and never forwards anywhere.
      2: |
        Throwing on `null` access (e.g., `Objects.requireNonNull`) defends *against* missing collaborators — it does not give clients a do-nothing collaborator they can call uniformly. The Null Object's whole point is to avoid the conditional or exception-handling burden at the call site.
      3: |
        That's lazy initialization (a Proxy variant). A Null Object never wakes up and starts doing real work — it permanently does nothing. If your stand-in transforms into a real collaborator on first use, you have a Proxy, not a Null Object.
    explanation: "A Null Object provides a surrogate that shares the same interface as a real collaborator but does nothing. It encapsulates *how to do nothing* and hides those details from collaborators, so clients call it exactly as they would the real object."

  - id: 2
    difficulty: intermediate
    type: single
    question: "Consider optional diagnostic logging (transfer logic omitted):\n\n```java\nclass BankTransfer {\n    private final DiagnosticLogger logger; // may be null\n\n    BankTransfer(DiagnosticLogger logger) {\n        this.logger = logger;\n    }\n\n    void transfer(int amount, String to) {\n        if (logger != null) {\n            logger.log(\"transfer \" + amount + \" to \" + to);\n        }\n    }\n}\n```\n\nThe refactoring supplies a real or silent logger at construction and rejects null there. What does this primarily improve?"
    options:
      - "Branch prediction at each diagnostic call site."
      - "Uniform collaborator calls without repeated guards."
      - "Thread safety of every supplied logger instance."
      - "Persistence guarantees for transaction records."
    correct_index: 1
    option_feedback:
      0: "Removing a guard may change performance, but the design benefit is uniform delegation; measure runtime effects separately."
      2: "Null Object adds no synchronization. Thread safety depends on the collaborators and their use."
      3: "The diagnostic contract permits dropping messages. A required transaction record cannot use a no-op implementation."
    explanation: "Once construction guarantees a valid collaborator, callers delegate uniformly. SilentLogger encodes deliberately disabled diagnostics. This does not implement a transaction record or guarantee that every Java reference is non-null."
  - id: 3
    difficulty: advanced
    type: single
    question: |
      A teammate proposes adding a `NoController` Null Object to a `Controller` interface that has 30 methods. Currently no view in the codebase actually needs a `NoController`. How should you respond?
    options:
      - "Add it now — having the Null Object available makes future read-only views easier to write."
      - "Push back — no current collaborator actually needs do-nothing behavior, so the 30-method class is speculative."
      - "Add it as a `@Deprecated` placeholder so future code can opt in."
      - "Replace the entire `Controller` interface with `Optional<Controller>` and remove the Null Object plan."
    correct_index: 1
    option_feedback:
      0: "There is no current need for the extra class. Anticipated reuse alone does not justify maintaining 30 unused methods."
      2: "Deprecated means discouraged existing use, not reserved future use. The unused implementation still has a maintenance cost."
      3: "No current view needs absence handling. Changing every caller to Optional introduces another speculative change; Optional is useful when callers actually need to distinguish absence."
    explanation: "The pattern's Applicability requires that *some collaborator instances should do nothing* and that the do-nothing behavior is *reusable*. With no current users, neither holds, so the cost — a 30-method class to maintain — is paid up front while the benefit is hypothetical. Wait until at least one real client needs it."

  - id: 4
    difficulty: intermediate
    type: single
    question: |
      A startup logs `"Audit logger: SilentLogger"` in production for six months before anyone notices that no audit trail has been written. The bug originated in a misconfigured DI binding that wired the test-only `SilentLogger` into the prod build. **Which Null Object liability does this story illustrate?**
    options:
      - "The Null Object's class hierarchy is too deep to debug."
      - "Silent do-nothing collaborators can mask real bugs when one is wired in by mistake."
      - "The Null Object cannot be implemented as a Singleton in DI containers."
      - "Every no-op collaborator is invalid, even for optional behavior."
    correct_index: 1
    option_feedback:
      0: "The failure comes from unnoticed no-op behavior, not inheritance depth."
      2: "Instance lifetime does not fix an incorrect binding. A shared or separately allocated SilentLogger can be misconfigured."
      3: "A no-op may be valid for optional diagnostics or a deliberately isolated test. It is invalid wherever the contract requires recording; classify the contract before choosing the implementation."
    explanation: "A silent collaborator can hide a wiring error. A startup message helps diagnosis but did not prevent this failure; validate production configuration and test required recording behavior. Do not substitute a no-op for a collaborator whose contract requires an audit trail."
  - id: 5
    difficulty: intermediate
    type: single
    question: |
      A `RubberDuck` class is implemented with `flyBehavior = new FlyNullObject()`, where `FlyNullObject implements FlyBehavior` and its `fly()` method does nothing. **Which pattern compound does this illustrate?**
    options:
      - "Null Object + Strategy (a Null Strategy)"
      - "Null Object + Decorator (a Null Decorator)"
      - "Null Object + Proxy (a Null Proxy)"
      - "Null Object + Adapter (a Null Adapter)"
    correct_index: 0
    option_feedback:
      1: "This class does not wrap or forward to another FlyBehavior. A pass-through decorator would still call its component; FlyNullObject directly supplies no-op behavior."
      2: "A Proxy controls access to another subject. This implementation has no subject behind it."
      3: "Adapter makes an existing interface satisfy another contract. This implementation needs no translation."
    explanation: "`FlyNullObject` plays both the Strategy role (a `FlyBehavior` the duck composes with) and the Null Object role (its `fly()` does nothing) — a Null Strategy compound. When one ConcreteStrategy in a Strategy hierarchy consistently does nothing, that strategy *is* a Null Object. The same role-superimposition appears as **Null State** when a do-nothing State sits in a State hierarchy."

  - id: 6
    difficulty: advanced
    type: single
    question: "A wrapper implements `Component.operation()` by calling its wrapped component and doing nothing else. Why is it different from a Null Object for that operation?"
    options:
      - "Decorator is absent from the GoF catalog."
      - "The wrapped component still performs its operation."
      - "Any wrapper without added behavior is an Adapter."
      - "Forwarding automatically makes the wrapper immutable."
    correct_index: 1
    option_feedback:
      0: "Decorator is a GoF structural pattern. Catalog membership is unrelated to this behavior."
      2: "An Adapter translates an interface. A same-interface forwarding wrapper need not translate anything."
      3: "Delegation does not establish immutability. Trace the call to see whether useful work still occurs."
    explanation: "Adding no behavior is different from performing no behavior: the wrapper still delegates. A decorator may wrap a Null Object, but the absence of added behavior alone does not make the wrapper a Null Object."
  - id: 7
    difficulty: advanced
    type: multiple
    question: |
      Which of the following are **valid reasons to apply** the Null Object pattern? Select all that apply.
    options:
      - "An object requires a collaborator, and some legitimate instances should do nothing."
      - "You want clients to ignore the difference between a real collaborator and a do-nothing one (no scattered null checks)."
      - "The do-nothing behavior is reusable across multiple clients."
      - "Modern languages have `Optional`/`Maybe` types, so every nullable field should be replaced by a Null Object regardless of context."
      - "All of the do-nothing behavior fits inside a single class."
    correct_indices: [0, 1, 2, 4]
    option_feedback:
      0: "A real collaboration with a valid no-op case supplies the need for this pattern."
      1: "Uniform calls are useful when clients need not distinguish real and no-op behavior."
      2: "Reusing one named no-op implementation avoids repeating absence-handling policy."
      3: "Optional preserves absence as information. Resolving it to a Null Object is appropriate only when the remaining clients may safely ignore that distinction."
      4: "A Null Object replaces one collaborator. Skipping work across several collaborators may need coordination or several no-op collaborators; it does not automatically require another particular pattern."
    explanation: "Null Object's Applicability requires a real collaboration that needs a do-nothing variant, uniform call sites, reusable do-nothing behavior, and a single-class scope. Blanket replacement of `Optional` is the modern misuse: when absence carries meaning the client must handle (404, no match, opt-out), preserve that signal rather than burying it under a do-nothing surrogate."

  - id: 8
    difficulty: advanced
    type: single
    question: |
      A `LinkedTreeNode` returns `Collections.emptyIterator()` when asked for an iterator over its (non-existent) children. Which pattern compound is at play?
    options:
      - "Null Object + Composite (the empty iterator is a Null Object playing the Composite role)."
      - "Null Object + Iterator (`emptyIterator` is a Null Iterator — a do-nothing `Iterator` impl)."
      - "Null Object + Singleton + Visitor (the empty iterator visits no children)."
      - "Null Object + Factory Method (a factory returning a null result)."
    correct_index: 1
    option_feedback:
      0: |
        Composite is about *treating leaves and composites uniformly through a Component interface* — the iterator returned by `children()` isn't itself the Component. The leaf node still implements Component; the iterator is a separate abstraction.
      2: |
        There's no Visitor in this scenario — no visitor is being applied to the children. `emptyIterator` is just a no-op implementation of the Iterator interface; the Visitor pattern is unrelated here.
      3: |
        Factory Method is about *who decides which subclass to create*. `Collections.emptyIterator()` is a factory call, but the *thing it returns* is what's relevant — and that thing is a Null Iterator, not a Factory Method.
    explanation: "An empty iterator supplies the normal iterator contract with no elements. hasNext() is always false; Java next() still throws NoSuchElementException if called after exhaustion. Uniform iteration checks for an element before retrieving it."
  - id: 9
    difficulty: advanced
    type: single
    question: |
      Which of the following best describes how Null Object **differs from** the Special Case pattern (Fowler, *Patterns of Enterprise Application Architecture*)?
    options:
      - "Special Case and Null Object are different names for the same pattern; the choice is purely terminological."
      - "Null Object is a special case of Special Case — limited to the do-nothing variant."
      - "Special Case is for object-relational mapping; Null Object is only for in-memory objects."
      - "Special Case requires reflection at runtime; Null Object is statically dispatched."
    correct_index: 1
    option_feedback:
      0: |
        Fowler explicitly cites Null Object as related to Special Case in PoEAA — they're related but distinguishable. The names are not interchangeable; collapsing them loses the broader generalization Special Case offers.
      2: |
        Special Case has nothing to do with O/R mapping specifically. It's a general-purpose pattern for representing exceptional instances — useful in any domain (UI, business logic, persistence layers, etc.).
      3: |
        Both patterns dispatch through normal polymorphism (virtual methods). Reflection is not part of either pattern's mechanics.
    explanation: "Special Case is the broader idea of representing exceptional cases behind a common interface. Null Object emphasizes an absent collaborator with valid no-op or neutral-result behavior. Returning a label such as Unknown does not by itself exclude an object from Null Object; the relevant question is the role and contract."
  - id: 10
    difficulty: advanced
    type: single
    question: "A Null Object returns a configured placeholder label, such as \"Unknown\" or \"Not supplied\", and performs no updates. Both labels satisfy the interface contract. What follows?"
    options:
      - "It cannot be a Null Object because it stores configuration."
      - "It can remain a Null Object with a configured neutral result."
      - "It must be a Flyweight because its constructor has a parameter."
      - "It breaks substitutability merely because the labels differ."
    correct_index: 1
    option_feedback:
      0: "No-op behavior can coexist with immutable configuration; statelessness is common but not required."
      2: "Flyweight additionally concerns sharing and externally supplied context. Constructor parameters alone do not establish that pattern."
      3: "Substitutability depends on the promised behavior. The stem explicitly permits either placeholder."
    explanation: "Parameterized neutral results are compatible with Null Object when they satisfy the contract. Check behavior rather than inferring pattern identity from whether the object has fields."
  - id: 11
    difficulty: expert
    type: single
    question: "An API must report when a requested user does not exist. A lookup instead returns a SilentUser whose methods return empty strings, and the response is reported as a successful lookup. What is the design problem?"
    options:
      - "The implementation uses a dynamically typed language."
      - "It hides an absence that the caller is required to report."
      - "The class lacks an explicitly declared interface."
      - "The class allocates an instance instead of using Singleton."
    correct_index: 1
    option_feedback:
      0: "The same contract violation is possible in a statically typed language."
      2: "An explicit interface does not make incorrect absence semantics valid."
      3: "Changing instance lifetime cannot restore the missing error signal."
    explanation: "The API contract requires distinguishing a missing user. Preserve that distinction with an explicit result or error; returning a no-op object as success hides information the caller must act on."
  - id: 12
    difficulty: advanced
    type: multiple
    question: |
      Which of the following are **liabilities (downsides)** of the Null Object pattern that authors should weigh before adopting it? Select all that apply.
    options:
      - "Can mask real bugs by silently swallowing operations that signal misconfigurations."
      - "Class proliferation — each AbstractObject family adds at least one more class."
      - "Inappropriate when monitoring or auditing systems must distinguish 'operation skipped' from 'operation succeeded with no effect.'"
      - "Always slower at runtime than a `null` check, regardless of language or JIT behavior."
      - "Hard to mix do-nothing into multiple collaborators when the do-nothing concern cuts across class boundaries."
    correct_indices: [0, 1, 2, 4]
    option_feedback:
      0: "An unexpected no-op can hide missing required behavior, so validate wiring and contracts."
      1: "A dedicated no-op implementation can add a class or an interface to maintain."
      2: "When callers must distinguish skipped from completed work, uniform silent behavior loses needed information."
      3: "Runtime cost depends on dispatch, allocation, inlining, and workload. Always slower is false; performance can still matter when measured."
      4: "One Null Object does not automatically absorb behavior distributed across several collaborator interfaces."
    explanation: "Weigh bug masking, extra types, observable absence, and the scope of the no-op collaboration. Runtime costs are context-dependent; neither zero overhead nor an inevitable slowdown follows from the pattern."
