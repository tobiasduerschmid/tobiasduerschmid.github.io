title: "Structural Patterns Quiz"
description: "Test your understanding of Adapter, Composite, and Facade — their distinctions, design decisions, and when to apply each."
active: true
questions:
  - id: 1
    difficulty: advanced
    type: single
    question: |
      A `TurkeyAdapter` implements `Duck`. Its `fly()` method calls `turkey.fly()` five times. What must be established before using it wherever a `Duck` is expected?
    options:
      - "The adapter inherits the concrete turkey implementation"
      - "The five calls satisfy the behavior promised by Duck"
      - "The adapter delegates every target call exactly once"
      - "The adapter and turkey expose identical method names"
    correct_index: 1
    option_feedback:
      0: |
        Composition and inheritance are both implementation options. Neither establishes that the adapted behavior satisfies the target contract.
      2: |
        An adapter may combine several adaptee calls to implement one target operation. There is no required one-call-to-one-call mapping.
      3: |
        Different method names are one reason to use Adapter. The required agreement is on the behavior clients are promised, not on the adaptee's method names.
    explanation: "Adapter can perform behavioral translation. The important question is whether five short flights meet the Duck contract. If that contract requires one continuous flight, the adapter is not substitutable even though it implements the right methods. The loop alone proves neither correctness nor a design defect."

  - id: 2
    difficulty: intermediate
    type: single
    question: |
      Your team owns a service and a database library. The service expects a different interface, but existing applications must keep using the library's current contract. Why might an Adapter be appropriate?
    options:
      - "Owning both sides makes behavioral checks unnecessary"
      - "It localizes translation while preserving existing contracts"
      - "It makes the database library depend on the service interface"
      - "It removes the need to maintain the library's existing API"
    correct_index: 1
    option_feedback:
      0: |
        Source ownership does not prove substitutability. Translation must still preserve the service's required behavior, including error handling.
      2: |
        The adapter depends on both interfaces so the database library can remain unaware of this particular service contract.
      3: |
        Existing applications still depend on the library API. The adapter lets the service coexist with them; it does not remove their compatibility requirement.
    explanation: "The constraint is preserving useful existing contracts, not who owns the source. An adapter can serve the new client without forcing unrelated clients to change. If both interfaces can safely be aligned and there is no reason to retain the mismatch, direct refactoring may be simpler. Bridge is justified by independently varying abstraction and implementation, not merely by the possibility of a future replacement."

  - id: 3
    difficulty: intermediate
    type: single
    question: |
      In a Composite pattern for a restaurant menu system, a developer declares `add(MenuComponent)` on the abstract `MenuComponent` class (inherited by both `Menu` and `MenuItem`). The base implementation throws `UnsupportedOperationException`, and only `Menu` overrides it. A tester calls `menuItem.add(anotherItem)`. What happens?
    options:
      - "The call succeeds — items can contain other items in Composite"
      - "A runtime exception — the Transparent Composite trade-off"
      - "A compile-time error prevents the call"
      - "The item silently ignores the call with no error"
    correct_index: 1
    option_feedback:
      0: |
        Composite lets clients treat leaves and containers uniformly for shared operations, but leaves are still leaves. A `MenuItem` containing children would contradict its role in the structure.
      2: |
        Because `add()` is declared on the abstract component, the call type-checks. The failure is deferred to runtime in the transparent version.
      3: |
        Some implementations could choose to ignore unsupported operations, but that hides an invalid call. The stated base implementation rejects the call explicitly.
    explanation: "Putting `add()`/`remove()` on the abstract `Component` gives clients a uniform interface, but leaves inherit methods that are semantically meaningless and must handle them — typically by throwing `UnsupportedOperationException` at runtime. The *Safe Composite* alternative declares those methods only on `Composite`, catching the misuse at compile time in statically typed code. Construction code can retain a Composite reference; downcasting is not always necessary."

  - id: 4
    difficulty: intermediate
    type: single
    question: |
      All three patterns — Adapter, Facade, and Decorator — involve "wrapping" another object. What is the key distinction between them?
    options:
      - "They differ in the number of objects they wrap: Adapter wraps one, Facade wraps many, Decorator wraps one recursively"
      - "Adapter converts an interface; Facade simplifies a set of interfaces; Decorator adds behavior through the same interface"
      - "Adapter is structural; Facade is behavioral; Decorator is creational"
      - "They are interchangeable — the choice depends only on team preference"
    correct_index: 1
    option_feedback:
      0: |
        Object count is not reliable enough to define the patterns. A facade often covers several objects, but the real distinction is whether the wrapper converts, simplifies, or extends behavior.
      2: |
        Adapter, Facade, and Decorator are all structural patterns in the GoF classification. The difference is their design intent.
      3: |
        The wrappers may look similar in code, but they answer different questions. Choosing the wrong intent can preserve the wrong dependency or put behavior in the wrong place.
    explanation: "The distinction is *intent*. Adapter changes *what* the interface looks like (converts incompatible to compatible); Facade changes *how much* of the interface you see (simplifies a complex subsystem); Decorator changes *what the object does* through the same interface (adds behavior). Reading the intent is what separates correct pattern application from cargo-cult usage."

  - id: 5
    difficulty: advanced
    type: single
    question: |
      A `HomeTheaterFacade` exposes `watchMovie()`, `endMovie()`, `listenToMusic()`, `stopMusic()`, `playGame()`, `setupKaraoke()`, and `calibrateSystem()`. Different clients use playback, setup, and calibration, and these responsibilities change independently. What change best addresses that maintenance problem?
    options:
      - "Replace the Facade with a Mediator pattern"
      - "Split it into multiple narrower Facades organized by responsibility"
      - "Add an Adapter between the Facade and each subsystem"
      - "Convert to a Singleton so there is only one Facade instance"
    correct_index: 1
    option_feedback:
      0: |
        Mediator is for coordinating colleagues that communicate through it. A large facade is still a simplification layer; it usually needs narrower interfaces, not bidirectional coordination.
      2: |
        Adapters help with incompatible interfaces. They would add wrappers around subsystem calls without addressing the facade's growing responsibility.
      3: |
        Singleton controls instance count. It does not make a broad interface more cohesive or easier to maintain.
    explanation: "A single Facade over a large subsystem risks becoming a god class. Splitting it into focused Facades — `PlaybackFacade` for movie/music playback, `SetupFacade` for karaoke and game setup, `CalibrationFacade` for tuning — keeps each one cohesive and manageable."

  - id: 6
    difficulty: advanced
    type: single
    question: |
      A facade delegates to subsystem objects that do not refer to it. A mediator owns interaction rules that its colleagues invoke through a mediator interface. Which dependency consequence follows?
    options:
      - "The facade must own the lifetime of every subsystem object"
      - "The subsystem can work without the facade; colleague interactions use the mediator"
      - "The mediator makes its colleagues independent of every coordination interface"
      - "Both designs require the underlying objects to refer back to the intermediary"
    correct_index: 1
    option_feedback:
      0: |
        Dependency direction does not determine ownership. The facade may receive subsystem objects that are created and owned elsewhere.
      2: |
        The colleagues avoid encoding each other's interaction rules, but in this design they still depend on the mediator interface for those interactions.
      3: |
        The facade's subsystem has no reference back to the facade. The mediator example has a different collaboration: colleagues invoke its coordination interface.
    explanation: "Facade supplies a convenient entry point without making subsystem behavior depend on that entry point. Mediator owns the rules for selected interactions among colleagues, so those interactions rely on it. This does not mean colleagues have no useful standalone behavior, nor that callback direction alone identifies a pattern."
