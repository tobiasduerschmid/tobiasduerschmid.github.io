title: 'CS 131: Language Implementation'
description: Classify lexer and parser outcomes, repair small grammars, and trace compiler and interpreter
  steps.
active: true
# Source-aligned review against lecture notes and homework. Times are author estimates.
questions:
  # Taught: [02] Programming Implementation Palooza (Public).docx, Tokenizing (aka Lexing).
  # Practice: Fall 2025 Quiz 1 v2, Problem 1 (Parser Panic); trace longest matches and rule-order ties.
  - id: cs131-v2-implementation-longest-token
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: A lexer has rules `"go" → GO` and `[a-z]+ → ID`, in that order. It chooses the longest match
      and uses rule order only for ties. How does it tokenize `goal`?
    options:
    - One ID token with value goal
    - A GO token followed by ID al
    - A lexical error after GO
    correct_index: 0
    option_feedback:
      1: Rule order breaks ties in match length; it does not beat a longer match.
      2: All four characters are accepted together by the identifier rule.
    explanation: The identifier rule matches all four letters. The keyword rule matches only two, so its
      earlier position does not win.

  # Taught: [02] Programming Implementation Palooza (Public).docx, Tokenizing (aka Lexing).
  # Practice: Fall 2025 Quiz 1 v2, Problem 1 (Parser Panic); trace longest matches and rule-order ties.
  - id: cs131-v2-implementation-keyword-tie
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: A lexer lists `[a-z]+ → ID` before `"send" → SEND`. It uses longest match, then earliest
      rule for ties and ignores spaces. The parser requires `SEND ID`. What happens to the input `send
      parcel`?
    options:
    - It is accepted as SEND ID.
    - It becomes ID ID and the parser rejects it.
    - The lexer rejects send as an unknown word.
    correct_index: 1
    option_feedback:
      0: The ID rule appears first and wins the equal-length tie.
      2: send matches a valid token rule; the failure occurs when parsing the token sequence.
    explanation: Both rules match all of send, so the earlier ID rule wins. Lexing succeeds, but the resulting
      token sequence does not match SEND ID.

  # Taught: [02] Programming Implementation Palooza (Public).docx, Tokenizing (aka Lexing); Parsing.
  # Practice: Homework TOOLS1; Fall 2025 Quiz 1 v2, Problem 1 (Parser Panic); identify the first failing stage.
  - id: cs131-v2-implementation-unmatched-character
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 35
    question: A toy lexer accepts lowercase letters as ID, digits as NUM, and the symbols `=` and `;`.
      It ignores spaces. Which stage first rejects `cost = 7 @;`?
    options:
    - 'Lexer: no rule accepts @.'
    - 'Parser: @ is misplaced in the statement.'
    - 'Semantic analyzer: cost is undeclared.'
    correct_index: 0
    option_feedback:
      1: Parsing checks token arrangement, but @ cannot become a token under these rules.
      2: Even if declaration checks are required, lexing already fails at @.
    explanation: The lexer cannot turn @ into any token, so this input fails before parsing or semantic
      checks.

  # Taught: [02] Programming Implementation Palooza (Public).docx, Tokenizing (aka Lexing); Parsing.
  # Practice: Homework TOOLS1; Fall 2025 Quiz 1 v2, Problem 1 (Parser Panic); identify the first failing stage.
  - id: cs131-v2-implementation-adjacent-tokens
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 50
    question: A lexer accepts lowercase runs as ID and digit runs as NUM; `=` is ASSIGN. Tokens need no
      spaces. The entire statement must match `ID ASSIGN NUM`. What happens to `n=8z`?
    options:
    - The lexer rejects 8z as one bad number.
    - The parser accepts n with value 8.
    - The lexer emits ID ASSIGN NUM ID; parsing fails.
    correct_index: 2
    option_feedback:
      0: The rules allow adjacent tokens; 8 and z match separately.
      1: Accepting a valid prefix is insufficient when an unmatched token remains.
    explanation: The lexer consumes 8 as NUM and z as ID. The parser must consume the entire statement,
      so the extra ID cannot be ignored.

  # Taught: [02] Programming Implementation Palooza (Public).docx, Tokenizing (aka Lexing); Parsing.
  # Practice: Homework TOOLS1; Fall 2025 Quiz 1 v2, Problem 1 (Parser Panic); identify the first failing stage.
  - id: cs131-v2-implementation-required-operand
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 35
    question: The grammar has `expr = ID PLUS NUM | ID ;`. Each named token is valid; the final semicolon
      ends the grammar rule. How is the complete token sequence `ID PLUS` classified?
    options:
    - Accepted using the ID alternative.
    - 'Parser error: PLUS has no following NUM.'
    - 'Lexer error: the token stream is incomplete.'
    correct_index: 1
    option_feedback:
      0: The ID alternative leaves PLUS unconsumed. Accepting the entire expression requires consuming
        every token.
      2: Both tokens are valid; the missing operand violates a production, not a token rule.
    explanation: 'Neither production consumes the entire sequence: the longer alternative lacks NUM, while
      the shorter one leaves PLUS. Therefore parsing fails.'

  # Taught: [02] Programming Implementation Palooza (Public).docx, Parsing.
  # Practice: Homework TOOLS2; Fall 2025 Quiz 1 v2, Problem 1 (Parser Panic); determine membership and justify missing/repeated symbols.
  - id: cs131-v2-implementation-optional-arguments
    type: multiple
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: Use `call = ID LP [ ID { COMMA ID } ] RP ;`. Square brackets mean optional, braces mean
      zero or more repetitions, and the final semicolon ends the grammar rule. Which complete token sequences
      are calls? Select all that apply.
    options:
    - ID LP RP
    - ID LP ID RP
    - ID LP ID COMMA ID RP
    - ID LP COMMA ID RP
    correct_indices:
    - 0
    - 1
    - 2
    option_feedback:
      0: The whole bracketed argument list is optional.
      1: Zero repetitions of COMMA ID leaves one argument.
      2: One repetition adds a second argument.
      3: A comma can follow an initial ID; it cannot start the argument list.
    explanation: The argument list may be absent. If present, it starts with an ID and may continue with
      comma–ID pairs.

  # Taught: [02] Programming Implementation Palooza (Public).docx, Parsing.
  # Practice: Homework TOOLS2; Fall 2025 Quiz 1 v2, Problem 1 (Parser Panic); determine membership and justify missing/repeated symbols.
  - id: cs131-v2-implementation-separator-versus-terminator
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: Use `program = stmt { SEMI stmt } [ SEMI ] ;` and `stmt = ID ASSIGN NUM ;`. Here SEMI is
      a source semicolon; the semicolons ending the rules are grammar notation. What is wrong with `ID
      ASSIGN NUM SEMI SEMI`?
    options:
    - The lexer cannot emit two SEMI tokens.
    - The grammar requires a statement between these semicolons.
    - The grammar forbids all trailing semicolons.
    correct_index: 1
    option_feedback:
      0: SEMI tokens are individually valid; this is a sequence problem.
      2: The [ SEMI ] part explicitly permits one trailing semicolon.
    explanation: After the first statement, a semicolon can either introduce another statement or serve
      as the single optional trailing semicolon. Neither choice consumes two consecutive semicolons.

  # Taught: [02] Programming Implementation Palooza (Public).docx, Parsing.
  # Practice: Homework TOOLS2; Fall 2025 Quiz 1 v2, Problem 1 (Parser Panic); determine membership and justify missing/repeated symbols.
  - id: cs131-v2-implementation-grammar-repair
    type: single
    difficulty: intermediate
    bloom: evaluate
    estimated_seconds: 60
    question: The rule `params = ID { COMMA ID } ;` accepts one or more parameters. Which revision also
      accepts zero parameters while still rejecting a leading comma?
    options:
    - params = [ ID ] { COMMA ID } ;
    - params = [ ID { COMMA ID } ] ;
    - params = { COMMA ID } ;
    correct_index: 1
    option_feedback:
      0: With the initial ID omitted, this rule can still generate COMMA ID.
      2: This rule omits the required first unprefixed ID and permits a leading comma.
    explanation: Make the entire nonempty list optional. Making only its first ID optional would let a
      comma–ID pair appear without that first ID.

  # Taught: [02] Programming Implementation Palooza (Public).docx, Parsing is tricky.
  # Practice: Lecture expression-grouping exercise; supports grammar reasoning in Homework TOOLS2. No exact past-exam counterpart claimed.
  - id: cs131-v2-implementation-two-parses
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: A grammar uses `expr = expr PLUS expr | expr TIMES expr | NUM ;` with no precedence rules.
      Which groupings can it generate for `2 + 5 * 3`? Select all that apply.
    options:
    - 2 + (5 * 3)
    - (2 + 5) * 3
    - (2 * 5) + 3
    correct_indices:
    - 0
    - 1
    option_feedback:
      0: Choosing PLUS at the root leaves 5 * 3 in the right subtree.
      1: Choosing TIMES at the root leaves 2 + 5 in the left subtree.
      2: This changes which operators appear between the numbers; parsing preserves the token sequence.
    explanation: Both original operators can be at the root of a parse tree, so the grammar admits two
      groupings. A grouping does not change the operator sequence.

  # Taught: [02] Programming Implementation Palooza (Public).docx, Parsing is tricky.
  # Practice: Lecture expression-grouping exercise; supports grammar reasoning in Homework TOOLS2. No exact past-exam counterpart claimed.
  - id: cs131-v3-implementation-precedence-tree
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 45
    question: A parser gives multiplication higher precedence than addition. In the syntax tree for `6
      + 2 * 5`, which statements hold? Select all that apply.
    options:
    - The root operator is +.
    - The root operator is *.
    - The right child of + is the * subtree.
    - The left child of * is the + subtree.
    option_feedback:
      0: The root combines 6 with the complete product, so it is addition.
      1: Making multiplication the root would group the expression as (6 + 2) * 5.
      2: The product 2 * 5 is grouped as a unit before it is added to 6.
      3: That tree would group 6 + 2 before multiplying, reversing the stated precedence.
    explanation: The parser groups the expression as 6 + (2 * 5). Addition is the root, with 6 on the
      left and the multiplication subtree on the right.
    correct_indices:
    - 0
    - 2

  # Taught: [02] Programming Implementation Palooza (Public).docx, Parsing is tricky.
  # Practice: Lecture expression-grouping exercise; supports grammar reasoning in Homework TOOLS2. No exact past-exam counterpart claimed.
  - id: cs131-v2-implementation-associativity-rule
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 45
    question: The subtraction operator is left-associative. What does `18 - 7 - 2` produce?
    options:
    - '9'
    - '13'
    - Both values are permitted.
    correct_index: 0
    option_feedback:
      1: 13 comes from the right-associated grouping 18 - (7 - 2).
      2: The explicit associativity rule selects one grouping.
    explanation: Left associativity gives (18 - 7) - 2, which is 9. Precedence alone cannot choose between
      repeated uses of the same operator.

  # Taught: [02] Programming Implementation Palooza (Public).docx, Semantic analysis.
  # Practice: Homework TOOLS1: distinguish semantic checks from token and grammar checks.
  - id: cs131-v2-implementation-semantic-stage
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: A toy language permits `ID LP NUM COMMA NUM RP` as call syntax. The function `twice` is
      declared to take one argument. Which stage rejects `twice(2, 3)` for the stated reason?
    options:
    - The lexer, because commas cannot be tokens.
    - The parser, because the call shape is forbidden.
    - Semantic analysis, because the arity is wrong.
    correct_index: 2
    option_feedback:
      0: The supplied call syntax explicitly includes a comma token.
      1: The question explicitly allows the two-argument call shape.
    explanation: The tokens and call shape are permitted. Checking the argument count against a function
      declaration requires semantic information.

  # Taught: [02] Programming Implementation Palooza (Public).docx, Semantic analysis.
  # Practice: Homework TOOLS1: distinguish semantic checks from token and grammar checks.
  - id: cs131-v2-implementation-undeclared-name
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: A toy language requires declarations before use. `total = missing + 1` has valid tokens
      and an allowed expression shape, but `missing` was never declared. What should the frontend report?
    options:
    - An unrecognized-character error
    - An undeclared-name semantic error
    - A missing-operand parsing error
    correct_index: 1
    option_feedback:
      0: An undeclared name can still match the identifier token rule.
      2: missing is syntactically an operand; the issue is what that name denotes.
    explanation: Name resolution compares identifier uses with declarations during semantic analysis;
      the tokenization and expression shape can still be valid.

  # Taught: [02] Programming Implementation Palooza (Public).docx, How a compiler works.
  # Practice: Homework TOOLS3: reason about the six compiler stages.
  - id: cs131-v2-implementation-compile-pipeline
    type: parsons
    difficulty: basic
    bloom: understand
    estimated_seconds: 50
    question: Arrange the six stages of a classic compiler pipeline for a machine-code target. Each
      stage consumes the preceding stage's result. Use only the valid stages.
    lines:
    - Convert source characters into tokens.
    - Build a syntax tree from the tokens.
    - Check names and types and annotate the tree.
    - Generate intermediate code from the annotated tree.
    - Generate target assembly from the intermediate code.
    - Assemble the target instructions into machine code.
    distractors:
    - Run the source program to produce its machine code.
    explanation: The compiler forms tokens, a syntax tree, an annotated tree, and intermediate code. The
      target code generator produces assembly; the assembler turns that assembly into machine code. Translation
      does not require running the source program.

  # Taught: [02] Programming Implementation Palooza (Public).docx, Code generation.
  # Practice: Homework TOOLS3: identify changed stages when source or target changes.
  - id: cs131-v2-implementation-target-port
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: A compiler already turns a source language into shared intermediate code and then Intel
      assembly. The source language stays the same, but the target becomes ARM. Which component must translate
      the intermediate code into the new assembly?
    options:
    - The source tokenizer
    - The source grammar parser
    - The target code generator
    correct_index: 2
    option_feedback:
      0: The source characters and token rules have not changed.
      1: The source grammar has not changed with the target processor.
    explanation: The frontend can keep producing the same intermediate representation. The target code
      generator must produce ARM assembly; an ARM assembler can then turn it into machine code.

  # Taught: [02] Programming Implementation Palooza (Public).docx, Linking.
  # Practice: Homework TOOLS1: diagnose a declared but undefined function and duplicate definitions.
  - id: cs131-v2-implementation-symbol-resolution
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: The object file for `main` calls `cost()`. Another object file defines `cost()`. Which job
      connects that call to its compiled definition?
    options:
    - Parsing the call expression
    - Linking the object files
    - Tokenizing the function name
    correct_index: 1
    option_feedback:
      0: Parsing identifies a source-level call shape; it does not connect separately compiled definitions.
      2: Recognizing a name as a token does not find its compiled address.
    explanation: The linker combines compiled units and resolves references between them. Tokenizing and
      parsing occur earlier on source text.

  # Taught: [02] Programming Implementation Palooza (Public).docx, Interpreters.
  # Practice: Homework TOOLS5: implement commands using variable state; Fall 2024 Midterm V1 Problem 5 (PDF pp. 9–12) extends this to scoped interpreter state.
  - id: cs131-v2-implementation-interpreter-program
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: Construct a complete program in a toy command language that initializes `count` to 12,
      decreases it by 5, prints the updated value once, and stops. `set` replaces a value; `add` adds
      its number.
    lines:
    - set count 12
    - add count -5
    - print count
    - end
    distractors:
    - set count -5
    explanation: The order initializes the variable before updating it, prints 7 after the update, and
      then terminates.

  # Taught: [02] Programming Implementation Palooza (Public).docx, Interpreters.
  # Practice: Homework TOOLS5: implement commands using variable state; Fall 2024 Midterm V1 Problem 5 (PDF pp. 9–12) extends this to scoped interpreter state.
  - id: cs131-v2-implementation-interpreter-replacement
    type: write-in
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: This interpreter fragment prints the stored value after each command. Type the three values
      in order.
    explanation: The set command stores 6, add reads that value and increases it to 10, and the final
      set replaces it with 3. Each print reads the current dictionary entry.
    program:
      language: python
      file: interpreter.py
      code: |
        values = {}
        program = [("set", 6), ("add", 4), ("set", 3)]
        for command, operand in program:
            if command == "set":
                values["score"] = operand
            elif command == "add":
                values["score"] += operand
            print(values["score"])
    answer: 6 10 3

  # Taught: [02] Programming Implementation Palooza (Public).docx, Interpreters.
  # Practice: Homework TOOLS5: implement commands using variable state; Fall 2024 Midterm V1 Problem 5 (PDF pp. 9–12) extends this to scoped interpreter state.
  - id: cs131-v2-implementation-termination-state
    type: write-in
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 50
    question: This interpreter stops when it reads end. What does it print?
    explanation: The first command prints 4. The end command breaks out of the execution loop before the
      add and second print commands can run.
    program:
      language: python
      file: interpreter.py
      code: |
        values = {"points": 4}
        program = ["print", "end", "add", "print"]
        for command in program:
            if command == "end":
                break
            if command == "add":
                values["points"] += 9
            if command == "print":
                print(values["points"])
    answer: '4'

  # Taught: [02] Programming Implementation Palooza (Public).docx, Tokenizing (aka Lexing).
  # Practice: Fall 2025 Quiz 1 v2, Problem 1 (Parser Panic); trace longest matches and rule-order ties.
  - id: cs131-v2-implementation-lexer-repair-proof
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 75
    question: A lexer uses longest match, then rule order for ties. It lists `[a-z]+ → ID` before `"run"
      → RUN`. A proposed repair moves the keyword rule first. Which checks should succeed after the repair?
      Select all that apply.
    options:
    - run becomes RUN.
    - runner remains one ID token.
    - runner becomes RUN followed by ID ner.
    - An ID can no longer contain the letters run.
    correct_indices:
    - 0
    - 1
    option_feedback:
      0: The keyword now wins the equal-length tie for run.
      1: The ID rule still wins the longer six-character match.
      2: A shorter keyword match cannot beat the full identifier match.
      3: Keywords are recognized by a whole matching token, not by banning substrings in identifiers.
    explanation: Reordering repairs the equal-length keyword tie while leaving a longer identifier match
      intact. The two checks test the repair and a nearby boundary case.
