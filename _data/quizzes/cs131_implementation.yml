title: "CS 131: Language Implementation"
description: "Trace source code through lexing, parsing, semantic analysis, translation, linking, and interpretation."
active: true
questions:
  # Sources: pl_implementation_palooza.pptx slides 3, 16, 28.
  - id: grammar-versus-meaning
    type: single
    bloom: understand
    difficulty: basic
    question: "A language grammar accepts `text + count`, but its specification permits + only on two numbers. Both variables are declared and have known string and integer types. What explains why acceptance by the grammar is insufficient?"
    options:
      - "The lexer must decide which type the plus sign supports."
      - "The grammar establishes form, while semantic rules restrict meaning."
      - "The linker must choose a grammar that accepts these types."
      - "The parser must convert every string token into a numeric token."
    correct_index: 1
    option_feedback:
      0: "Recognizing the + token does not determine whether the operand types are allowed. Type compatibility is a semantic check."
      2: "Linking connects compiled definitions and references; it does not choose the source language's grammar."
      3: "Changing token categories would alter the source rather than validate the operation required by the specification."
    explanation: "Syntactic validity means the construct has an allowed shape. A semantic analyzer can then reject it because a string and an integer do not meet the stated numeric-operand rule."

  # Sources: pl_implementation_palooza.pptx slides 10–13; CS131 Fall 25 Quiz 1 Solutions (Public).docx question 1 answer/rubric.
  - id: lexer-longest-match
    type: single
    bloom: apply
    difficulty: intermediate
    question: A lexer chooses the longest match and recognizes both `>` and `>=`. It also recognizes integers. Whitespace is skipped. How does it
      tokenize `>=7>2`?
    options:
    - '`>`, `=`, `7`, `>`, `2`'
    - '`>=`, `7`, `>=`, `2`'
    - '`>=`, `7`, `>`, `2`'
    - A lexical error because operators touch numbers.
    correct_index: 2
    option_feedback:
      0: At the first position, >= is the longest recognized token, so it is not split into shorter pieces.
      1: The second > is not followed by =. Longest matching uses the actual remaining source characters.
      3: No whitespace requirement was specified; token boundaries can occur between adjacent operators and numbers.
    explanation: Matching restarts after each token. The first two characters form >=; after the integer 7, only > matches before the next integer.

  # Sources: pl_implementation_palooza.pptx slide 13; CS131 Fall 25 Quiz 1 Solutions (Public).docx question 1 print-keyword answer.
  - id: lexer-tie-priority
    type: single
    bloom: analyze
    difficulty: intermediate
    question: A lexer skips whitespace and has an INTEGER rule `[0-9]+` before a generic LABEL rule `[a-z0-9]+`. It chooses the longest match and
      uses earlier rules only for ties. What token categories does `24 24b` produce?
    options:
    - INTEGER, LABEL
    - LABEL, LABEL
    - INTEGER, INTEGER, LABEL
    - A lexical error at the letter b.
    correct_index: 0
    option_feedback:
      1: For 24, both rules match two characters, so the earlier INTEGER rule wins.
      2: For 24b, LABEL matches three characters and beats the shorter INTEGER match.
      3: The LABEL rule explicitly permits letters as well as digits.
    explanation: The first word tests an equal-length tie; the second tests a longer competing match. Rule order chooses INTEGER for 24 but cannot
      defeat the longer LABEL match for 24b.

  # Sources: pl_implementation_palooza.pptx slides 9–14, 31; Homework Problems (Public).docx TOOLS1; CS131 Fall 25 Quiz 1 Solutions (Public).docx question 1.
  - id: lexical-error-boundary
    type: single
    bloom: apply
    difficulty: intermediate
    question: 'A toy language accepts assignments such as `total = 3;`. Its lexer discards # and everything after it on the same line as a comment.
      Outside comments, no token accepts @. What happens to `total = 3; # @`?'
    options:
    - Lexing fails whenever @ appears anywhere in a source file.
    - Parsing fails because the comment follows a semicolon.
    - Semantic analysis must assign a type to @.
    - The assignment is accepted; @ is inside ignored comment text.
    correct_index: 3
    option_feedback:
      0: The comment rule consumes @ as part of the comment instead of asking another token rule to recognize it.
      1: The lexer discards the comment, so it supplies the parser with the valid assignment tokens only.
      2: The comment text does not become an expression node requiring a type.
    explanation: 'Lexical context matters. The # rule consumes the rest of the line as ignored text, leaving the same token sequence as total =
      3;. The same @ outside a comment would fail to begin a token.'

  # Sources: pl_implementation_palooza.pptx slides 16, 31; CS131 Fall 25 Quiz 1 Solutions (Public).docx question 1 NUM followed by ID answer.
  - id: valid-tokens-invalid-sequence
    type: single
    bloom: apply
    difficulty: intermediate
    question: A command language recognizes PUSH, POP, integer tokens, and semicolons. Its grammar allows `PUSH INTEGER ;` or `POP ;`. What happens
      to `POP 8;`?
    options:
    - Lexing fails because POP cannot be followed by a digit.
    - Parsing fails because POP takes no integer in this grammar.
    - It is accepted because every token is individually valid.
    - Semantic analysis must treat 8 as the count of values to pop.
    correct_index: 1
    option_feedback:
      0: POP and 8 are individually recognized tokens. The invalid relationship between them is grammatical.
      2: A valid token sequence must also fit a permitted statement production.
      3: Inventing a count parameter would change the given grammar; no such parameter is defined.
    explanation: The lexer produces valid tokens, but the POP production requires a semicolon immediately after POP. The extra integer is a parse
      error even though PUSH would permit it.

  # Sources: pl_implementation_palooza.pptx slides 18–22; Homework Problems (Public).docx TOOLS2.
  - id: grammar-optional-and-repeated
    type: multiple
    bloom: apply
    difficulty: intermediate
    question: |
      Here brackets mean optional, braces mean zero or more repetitions, and quoted text is literal. Which commands does the grammar generate? Select all that apply.

      ```text
      command = "copy" NAME "to" NAME ["verify"] {"retry" NUMBER} ;
      ```
    options:
    - '`copy a to b`'
    - '`copy a to b verify retry 2 retry 4`'
    - '`copy a to b retry`'
    - '`copy a to b verify verify`'
    correct_indices:
    - 0
    - 1
    option_feedback:
      0: Both the verify part and all retry groups may be omitted.
      1: The command uses verify once and two complete retry-number groups.
      2: Each retry group requires a following NUMBER; the keyword alone is incomplete.
      3: Verify is optional once, not a repeated element.
    explanation: Optionality permits zero or one verify marker. Repetition permits any number of whole retry-number groups, so keywords inside those
      groups cannot be supplied on their own.

  # Sources: pl_implementation_palooza.pptx slides 25–27.
  - id: precedence-is-structural
    type: single
    bloom: analyze
    difficulty: intermediate
    question: A boolean grammar uses `expr = "not" expr | expr "and" expr | BOOL` with no precedence rules. For `not true and false`, what does
      this grammar permit?
    options:
    - Only `(not true) and false`, yielding false.
    - Only `not (true and false)`, yielding true.
    - Both groupings, which produce different boolean values.
    - No parse, because unary and binary operators cannot mix.
    correct_index: 2
    option_feedback:
      0: This grouping is possible, but the recursive expression after not may also span the complete conjunction.
      1: This grouping is possible, but the left expression of and may also be not true.
      3: Both productions can be applied in a single derivation. The problem is ambiguity, not a missing parse.
    explanation: One parse applies not only to true, then combines false and false. Another applies not to the entire false conjunction. Grammar
      structure or explicit precedence must decide the scope of the unary operator.

  # Sources: pl_implementation_palooza.pptx slides 14, 23–24.
  - id: abstract-syntax-retains-grouping
    type: single
    bloom: understand
    difficulty: basic
    question: A parser omits parenthesis and comma tokens from the abstract syntax tree for `trim(join(left, right))`. Which structure must remain?
    options:
    - A trim call whose argument is the join call.
    - A flat list containing trim, join, left, and right.
    - A join call whose first argument is trim(left).
    - The exact number of spaces around the comma.
    correct_index: 0
    option_feedback:
      1: A flat sequence loses which call supplies an argument to which other call.
      2: That structure represents join(trim(left), right), which can behave differently.
      3: Whitespace does not replace the nested call and argument relationships.
    explanation: 'The punctuation establishes nesting: join receives left and right, and its result becomes trim''s single argument. An abstract
      tree can discard punctuation only after retaining those relationships.'

  # Sources: pl_implementation_palooza.pptx slides 28–30; Homework Problems (Public).docx TOOLS1.
  - id: semantic-analysis-responsibilities
    type: multiple
    bloom: analyze
    difficulty: intermediate
    question: "In the lecture's statically checked compiler pipeline, which tasks belong to semantic analysis after parsing? Select all that apply."
    options:
      - "Connect each variable use to its visible declaration."
      - "Verify call arguments against the declared parameter types."
      - "Group consecutive source digits into a numeric token."
      - "Assign types to expressions in the syntax tree."
      - "Combine separate object files into one executable."
    correct_indices: [0, 1, 3]
    option_feedback:
      0: "Resolving a name requires declaration and scope information beyond its syntactic shape."
      1: "Argument compatibility compares the call to a declared signature; grammar alone does not supply that check."
      2: "Grouping source characters into tokens is the lexer's earlier job."
      3: "Type annotations record semantic facts needed by later translation stages."
      4: "Combining object modules and resolving external references is linking."
    explanation: "Semantic analysis checks and records meaning-related constraints such as types, declarations, and scope. Tokenization and linking operate at different representations and boundaries."

  # Sources: pl_implementation_palooza.pptx slides 32–36; Homework Problems (Public).docx TOOLS3 a,c.
  - id: retarget-compiler-backend
    type: single
    bloom: apply
    difficulty: intermediate
    question: A compiler migration preserves its validated machine-independent intermediate representation, but generated assembly still uses instructions
      unavailable on the new processor. Which part must be corrected before assembling for that processor?
    options:
    - The source lexer's character recognition rules.
    - The parser's source-language grammar productions.
    - The semantic analyzer's variable binding rules.
    - The backend's selection of target instructions.
    correct_index: 3
    option_feedback:
      0: The validated intermediate form already establishes that this input passed source recognition.
      1: The source language is unchanged; the failure concerns the instructions emitted afterward.
      2: Resolving source variable bindings does not replace unsupported target instructions.
    explanation: The backend maps the shared representation to instructions available on a particular processor. A correct frontend and valid intermediate
      form do not make an old processor's instruction selection valid for a different one.

  # Sources: pl_implementation_palooza.pptx slide 36; Homework Problems (Public).docx TOOLS3 b,c.
  - id: new-language-shared-backend
    type: single
    bloom: analyze
    difficulty: advanced
    question: Two source languages share a backend. One requires integer overflow to raise an error; the other requires wraparound. The intermediate
      form currently has only a wrapping-add operation. What must the first language's frontend do to reuse that backend correctly?
    options:
    - Change its addition keyword to match the other language.
    - Lower checked addition into operations that detect overflow.
    - Erase integer types so both additions look alike.
    - Let the assembler infer the source language from variable names.
    correct_index: 1
    option_feedback:
      0: Equal token spellings do not reconcile different overflow behavior.
      2: Discarding the semantic distinction would lose a required error case.
      3: The assembler implements its input instructions; source-language overflow rules must already be represented.
    explanation: Backend reuse requires preserving each source language's observable behavior in the intermediate form. If the form can express
      overflow detection and an error path, the frontend can lower checked addition into those operations; otherwise that form must be extended.

  # Sources: pl_implementation_palooza.pptx slides 32–34; Homework Problems (Public).docx TOOLS3.
  - id: shared-optimization-tradeoff
    type: single
    bloom: evaluate
    difficulty: advanced
    question: "A compiler targets three processors. A team wants to implement a transformation that removes computations whose results are unused and whose execution has no observable effect. Why is its shared intermediate representation a useful place for this transformation?"
    options:
      - "It removes the need to preserve each program's behavior."
      - "It makes every processor use identical machine instructions."
      - "One analysis can benefit multiple target backends."
      - "It guarantees that all target-specific optimizations disappear."
    correct_index: 2
    option_feedback:
      0: "Optimization must preserve the required observable behavior at every representation level."
      1: "The shared form is later lowered into different target instructions; it does not make processor instruction sets identical."
      3: "Some optimizations still depend on a target's registers, instructions, or costs. Sharing one pass does not eliminate those opportunities."
    explanation: "A common representation supports reusing semantic analysis and transformations across targets. The stated lack of observable effects is essential: an unused result alone does not justify deleting a computation."

  # Sources: pl_implementation_palooza.pptx slides 6, 35, 40–41; Homework Problems (Public).docx TOOLS1.
  - id: declaration-versus-link-definition
    type: single
    bloom: apply
    difficulty: intermediate
    question: A caller and a codec module each compile successfully. Linking caller.o with codec.o succeeds in a test build. A release command links
      only caller.o and reports an unresolved encode reference. What should be corrected first?
    options:
    - Rename encode in the header so the lexer recognizes it.
    - Change encode's parameter types until the caller compiles again.
    - Copy the function declaration into every source-code block.
    - Include the already compiled codec.o in the release link inputs.
    correct_index: 3
    option_feedback:
      0: The caller already compiles; identifier recognition is not the failing stage.
      1: The successful combined test build demonstrates that the existing caller and definition can be linked together.
      2: Additional declarations describe the interface but do not supply the missing object code.
    explanation: The definition exists and is compatible, as shown by the successful test link. The release build omits its compiled module. Supplying
      that module repairs the build input set without changing source-level types.

  # Sources: pl_implementation_palooza.pptx slides 40–42.
  - id: dynamic-linking-deployment
    type: multiple
    bloom: evaluate
    difficulty: advanced
    question: "A team replaces copying a library's code into its executable with loading a compatible shared library at runtime. Which consequences follow from this design? Select all that apply."
    options:
      - "The executable can omit that library's machine-code body."
      - "A needed shared library must be available at runtime."
      - "Any replacement library is safe if its filename matches."
      - "Some references are resolved when the program is loaded or run."
    correct_indices: [0, 1, 3]
    option_feedback:
      0: "The code can reside in the shared library instead of being copied into this executable."
      1: "The program now depends on finding a suitable library in its execution environment."
      2: "A filename does not guarantee compatible function interfaces or behavior. The library still must honor the expected contract."
      3: "Runtime resolution of at least some library references is the defining distinction here."
    explanation: "Dynamic linking trades embedding library code for a runtime dependency. It can reduce executable size and share library code, while requiring compatible deployed libraries."

  # Sources: pl_implementation_palooza.pptx slides 45–48; Homework Problems (Public).docx TOOLS5 B.
  - id: interpreter-state-across-blocks
    type: single
    bloom: analyze
    difficulty: advanced
    question: "A toy language has one shared variable environment. Its interpreter recursively executes a conditional's body by calling run(body), but run creates a new empty environment every time. Why can the body fail to read a variable set before the conditional?"
    options:
      - "The recursive call discards access to the required environment."
      - "Conditional statements must be translated to machine code first."
      - "Every nested body must create a fresh set of variable bindings."
      - "The parser should replace every variable use with its current value."
    correct_index: 0
    option_feedback:
      1: "An interpreter can directly execute conditionals while preserving the language's specified state."
      2: "Fresh bindings would be a different scoping design. The question specifies one shared variable environment."
      3: "Runtime values can change, so parsing cannot generally substitute the current value into every use."
    explanation: "The language's environment is runtime state that must survive entry into this body. Passing the existing environment to the helper preserves the stated semantics, including updates visible after the conditional."

  # Sources: pl_implementation_palooza.pptx slides 4, 6, 37, 44–49; Homework Problems (Public).docx TOOLS4, HASKELL1 A.4–A.5.
  - id: compilation-and-interpretation-compose
    type: multiple
    bloom: understand
    difficulty: intermediate
    question: "An implementation translates source into portable bytecode, then executes that bytecode in a software interpreter. Which conclusions are justified? Select all that apply."
    options:
      - "Translation and interpretation both occur in this implementation."
      - "A compatible bytecode interpreter is needed to execute the result."
      - "The source language can never have a native-code implementation."
      - "Producing bytecode makes runtime semantic errors impossible."
    correct_indices: [0, 1]
    option_feedback:
      0: "Compiling to an intermediate instruction format and interpreting that format can be successive stages."
      1: "Portable bytecode is targeted at an execution model implemented by the interpreter, not automatically at the physical processor."
      2: "An execution strategy describes an implementation. Another implementation could translate the same language to native code."
      3: "Translation alone does not prove that every execution is error-free; that depends on the language and its checks."
    explanation: "Compilation and interpretation are compatible implementation techniques. Neither bytecode nor a language's usual implementation strategy fixes every possible way the language can be executed."
