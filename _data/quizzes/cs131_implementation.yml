title: 'CS 131: Language Implementation'
description: Classify lexer and parser outcomes, repair small grammars, and trace compiler and interpreter
  steps.
active: true
# Entire replacement bank. Times are author estimates, not enforced limits.
questions:
  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 15–18
  # Assessment: Fall 2025 Quiz 1 v1, Problem 1 (lexer/parser classification)
  - id: cs131-v2-implementation-longest-token
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: A lexer has rules `"go" → GO` and `[a-z]+ → ID`, in that order. It chooses the longest match
      and uses rule order only for ties. How does it tokenize `goal`?
    options:
    - One ID token with value goal
    - A GO token followed by ID al
    - A lexical error after GO
    correct_index: 0
    option_feedback:
      1: Rule order breaks ties in match length; it does not beat a longer match.
      2: All four characters are accepted together by the identifier rule.
    explanation: The identifier rule matches all four letters. The keyword rule matches only two, so its
      earlier position does not win.

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 15–19
  # Assessment: Fall 2025 Quiz 1 v1, Problem 1 (lexer/parser classification)
  - id: cs131-v2-implementation-keyword-tie
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: A lexer lists `[a-z]+ → ID` before `"send" → SEND`. It uses longest match, then earliest rule
      for ties and ignores spaces. The parser requires `SEND ID`. What happens to the input `send parcel`?
    options:
    - It is accepted as SEND ID.
    - It becomes ID ID and the parser rejects it.
    - The lexer rejects send as an unknown word.
    correct_index: 1
    option_feedback:
      0: The ID rule appears first and wins the equal-length tie.
      2: send matches a valid token rule; the failure occurs when parsing the token sequence.
    explanation: Both rules match all of send, so the earlier ID rule wins. Lexing succeeds, but the resulting
      token sequence does not match SEND ID.

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 15–16, 40–41
  # Assessment: Fall 2025 Quiz 1 v1, Problem 1 (lexer/parser classification)
  - id: cs131-v2-implementation-unmatched-character
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 35
    question: A toy lexer accepts lowercase letters as ID, digits as NUM, and the symbols `=` and `;`. It
      ignores spaces. Which stage first rejects `cost = 7 @;`?
    options:
    - 'Lexer: no rule accepts @.'
    - 'Parser: @ has the wrong type.'
    - 'Semantic analyzer: cost is undeclared.'
    correct_index: 0
    option_feedback:
      1: A character must first become a token; the parser does not assign it a type.
      2: Even if declaration checks are required, lexing already fails at @.
    explanation: The lexer cannot turn @ into any token, so this input fails before parsing or semantic
      checks.

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 15–16, 19–28
  # Assessment: Fall 2025 Quiz 1 v1, Problem 1 (lexer/parser classification)
  - id: cs131-v2-implementation-adjacent-tokens
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 50
    question: A lexer accepts lowercase runs as ID and digit runs as NUM; `=` is ASSIGN. Tokens need no
      spaces. The entire statement must match `ID ASSIGN NUM`. What happens to `n=8z`?
    options:
    - The lexer rejects 8z as one bad number.
    - The parser accepts n with value 8.
    - The lexer emits ID ASSIGN NUM ID; parsing fails.
    correct_index: 2
    option_feedback:
      0: The rules allow adjacent tokens; 8 and z match separately.
      1: Accepting a valid prefix is insufficient when an unmatched token remains.
    explanation: The lexer consumes 8 as NUM and z as ID. The parser must consume the entire statement,
      so the extra ID cannot be ignored.

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 19–28
  # Assessment: Fall 2025 Quiz 1 v1, Problem 1 (lexer/parser classification)
  - id: cs131-v2-implementation-required-operand
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 35
    question: Tokens `ID`, `PLUS`, and `NUM` are all valid. The only expression rule is `expr = ID PLUS
      NUM ;`. Classify the token sequence `ID PLUS`.
    options:
    - 'Lexical error: PLUS is invalid.'
    - 'Parse error: the required NUM is missing.'
    - 'Valid expression: NUM is optional.'
    correct_index: 1
    option_feedback:
      0: The question states that PLUS is a valid token.
      2: Only bracketed grammar elements are optional; NUM is unbracketed.
    explanation: A token can be valid on its own while the sequence violates the grammar. NUM is required
      because it is not in optional brackets.

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 24–28
  # Assessment: Fall 2025 Quiz 1 v1, Problem 1 (lexer/parser classification)
  - id: cs131-v2-implementation-optional-arguments
    type: multiple
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: Use `call = ID LP [ ID { COMMA ID } ] RP ;`. Square brackets mean optional, braces mean zero
      or more repetitions, and the final semicolon ends the grammar rule. Which complete token sequences
      are calls? Select all that apply.
    options:
    - ID LP RP
    - ID LP ID RP
    - ID LP ID COMMA ID RP
    - ID LP COMMA ID RP
    correct_indices:
    - 0
    - 1
    - 2
    option_feedback:
      0: The whole bracketed argument list is optional.
      1: Zero repetitions of COMMA ID leaves one argument.
      2: One repetition adds a second argument.
      3: A comma can follow an initial ID; it cannot start the argument list.
    explanation: The argument list may be absent. If present, it starts with an ID and may continue with
      comma–ID pairs.

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 24–28
  # Assessment: Fall 2025 Quiz 1 v1, Problem 1 (lexer/parser classification)
  - id: cs131-v2-implementation-separator-versus-terminator
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: Use `program = stmt { SEMI stmt } [ SEMI ] ;` and `stmt = ID ASSIGN NUM ;`. Here SEMI is a
      source semicolon; the semicolons ending the rules are grammar notation. What is wrong with `ID ASSIGN
      NUM SEMI SEMI`?
    options:
    - The lexer cannot emit two SEMI tokens.
    - The grammar requires a statement between these semicolons.
    - The grammar forbids all trailing semicolons.
    correct_index: 1
    option_feedback:
      0: SEMI tokens are individually valid; this is a sequence problem.
      2: The [ SEMI ] part explicitly permits one trailing semicolon.
    explanation: After the first statement, a semicolon can either introduce another statement or serve
      as the single optional trailing semicolon. Neither choice consumes two consecutive semicolons.

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 24–28
  # Assessment: Fall 2025 Quiz 1 v1, Problem 1 (lexer/parser classification)
  - id: cs131-v2-implementation-grammar-repair
    type: single
    difficulty: intermediate
    bloom: evaluate
    estimated_seconds: 60
    question: The rule `params = ID { COMMA ID } ;` accepts one or more parameters. Which revision also
      accepts zero parameters while still rejecting a leading comma?
    options:
    - params = [ ID ] { COMMA ID } ;
    - params = [ ID { COMMA ID } ] ;
    - params = { COMMA ID } ;
    correct_index: 1
    option_feedback:
      0: With the initial ID omitted, this rule can still generate COMMA ID.
      2: This rule omits the required first unprefixed ID and permits a leading comma.
    explanation: Make the entire nonempty list optional. Making only its first ID optional would let a comma–ID
      pair appear without that first ID.

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 32–35
  # Assessment: Fall 2025 Quiz 1 v1, Problem 1 (lexer/parser classification)
  - id: cs131-v2-implementation-two-parses
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: A grammar uses `expr = expr PLUS expr | expr TIMES expr | NUM ;` with no precedence rules.
      Which groupings can it generate for `2 + 5 * 3`? Select all that apply.
    options:
    - 2 + (5 * 3)
    - (2 + 5) * 3
    - (2 * 5) + 3
    correct_indices:
    - 0
    - 1
    option_feedback:
      0: Choosing PLUS at the root leaves 5 * 3 in the right subtree.
      1: Choosing TIMES at the root leaves 2 + 5 in the left subtree.
      2: This changes which operators appear between the numbers; parsing preserves the token sequence.
    explanation: Both original operators can be at the root of a parse tree, so the grammar admits two groupings.
      A grouping does not change the operator sequence.

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 32–35
  # Assessment: Supporting expression-grouping skill; lecture parsing exercise (no direct past-question match claimed)
  - id: cs131-v2-implementation-precedence-value
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: A language gives multiplication higher precedence than addition. What is the value of `6 +
      2 * 5`?
    options:
    - '16'
    - '40'
    - '60'
    correct_index: 0
    option_feedback:
      1: 40 comes from grouping the addition first, which violates the stated precedence.
      2: The addition operator remains addition; grouping does not replace it with multiplication.
    explanation: 'Multiplication groups first: 6 + (2 * 5) is 16.'

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 32–35
  # Assessment: Prerequisite for expression traces; lecture ambiguity exercise
  - id: cs131-v2-implementation-associativity-rule
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 45
    question: The subtraction operator is left-associative. What does `18 - 7 - 2` produce?
    options:
    - '9'
    - '13'
    - Both values are permitted.
    correct_index: 0
    option_feedback:
      1: 13 comes from the right-associated grouping 18 - (7 - 2).
      2: The explicit associativity rule selects one grouping.
    explanation: Left associativity gives (18 - 7) - 2, which is 9. Precedence alone cannot choose between
      repeated uses of the same operator.

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 36–41
  # Assessment: Fall 2025 Quiz 1 v1, Problem 1 (lexer/parser classification); extends stage classification to a taught semantic check
  - id: cs131-v2-implementation-semantic-stage
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: A toy language permits `ID LP NUM COMMA NUM RP` as call syntax. The function `twice` is declared
      to take one argument. Which stage rejects `twice(2, 3)` for the stated reason?
    options:
    - The lexer, because commas cannot be tokens.
    - The parser, because the call shape is forbidden.
    - Semantic analysis, because the arity is wrong.
    correct_index: 2
    option_feedback:
      0: The supplied call syntax explicitly includes a comma token.
      1: The question explicitly allows the two-argument call shape.
    explanation: The tokens and call shape are permitted. Checking the argument count against a function
      declaration requires semantic information.

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 36–41
  # Assessment: Fall 2025 Quiz 1 v1, Problem 1 (lexer/parser classification); extends stage classification to declaration checking
  - id: cs131-v2-implementation-undeclared-name
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: A toy language requires declarations before use. `total = missing + 1` has valid tokens and
      an allowed expression shape, but `missing` was never declared. What should the frontend report?
    options:
    - An unrecognized-character error
    - An undeclared-name semantic error
    - A missing-operand parsing error
    correct_index: 1
    option_feedback:
      0: An undeclared name can still match the identifier token rule.
      2: missing is syntactically an operand; the issue is what that name denotes.
    explanation: Name resolution compares identifier uses with declarations during semantic analysis; the
      tokenization and expression shape can still be valid.

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 11–13, 19, 36–43
  # Assessment: Supporting knowledge for Fall 2025 Quiz 1, Problem 1
  - id: cs131-v2-implementation-compile-pipeline
    type: parsons
    difficulty: basic
    bloom: understand
    estimated_seconds: 50
    question: Arrange the stages of the lecture's compiler pipeline. Each stage consumes the result of the
      preceding stage. Use only the valid stages.
    lines:
    - Convert source characters into tokens.
    - Build a syntax tree from the tokens.
    - Check names and types and annotate the tree.
    - Generate intermediate code from the annotated tree.
    - Generate target code from the intermediate code.
    distractors:
    - Execute the source to discover every possible output.
    explanation: The representation changes from text to tokens to a tree, then to an annotated tree and
      intermediate code before target code generation.

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 42–48
  # Assessment: Supporting implementation skill; no matching standalone past-exam task claimed
  - id: cs131-v2-implementation-target-port
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: A compiler already translates a source language into shared intermediate code and then Intel
      machine code. The source language stays the same, but the target becomes ARM. Which component needs
      a target-specific replacement?
    options:
    - The source tokenizer
    - The source grammar parser
    - The target code generator
    correct_index: 2
    option_feedback:
      0: The source characters and token rules have not changed.
      1: The source grammar has not changed with the target processor.
    explanation: The frontend can keep producing the same intermediate representation. The backend must
      translate that representation to ARM instructions.

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 53–55
  # Assessment: Supporting implementation skill; no matching standalone past-exam task claimed
  - id: cs131-v2-implementation-symbol-resolution
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: The object file for `main` calls `cost()`. Another object file defines `cost()`. Which job
      connects that call to its compiled definition?
    options:
    - Parsing the call expression
    - Linking the object files
    - Tokenizing the function name
    correct_index: 1
    option_feedback:
      0: Parsing identifies a source-level call shape; it does not connect separately compiled definitions.
      2: Recognizing a name as a token does not find its compiled address.
    explanation: The linker combines compiled units and resolves references between them. Tokenizing and
      parsing occur earlier on source text.

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 60–62
  # Assessment: Fall 2024 Midterm V1, Problem 5, PDF pp. 9–12 (interpreter state); supporting subskill
  - id: cs131-v2-implementation-interpreter-program
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: Construct a complete program in the lecture's toy language that initializes `count` to 12,
      decreases it by 5, prints the updated value once, and stops. `set` replaces a value; `add` adds its
      number.
    lines:
    - set count 12
    - add count -5
    - print count
    - end
    distractors:
    - set count -5
    explanation: The order initializes the variable before updating it, prints 7 after the update, and then
      terminates.

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 60–62
  # Assessment: Fall 2024 Midterm V1, Problem 5, PDF pp. 9–12 (interpreter state); supporting subskill
  - id: cs131-v2-implementation-interpreter-replacement
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: |-
      In the lecture's toy interpreter, `set` replaces and `add` increments a stored integer. What is printed?

      ```text
      set score 6
      add score 4
      set score 3
      print score
      end
      ```
    options:
    - '3'
    - '10'
    - '13'
    correct_index: 0
    option_feedback:
      1: The later set statement overwrites the value obtained by adding.
      2: set replaces the value; it does not add 3 to the previous value.
    explanation: score changes from 6 to 10 and then is replaced by 3. The print operation reads the current
      map entry.

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 60–62
  # Assessment: Fall 2024 Midterm V1, Problem 5, PDF pp. 9–12 (interpreter state); supporting subskill
  - id: cs131-v2-implementation-termination-state
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 50
    question: |-
      The toy interpreter executes lines in order and stops on `end`. What does this program print?

      ```text
      set points 4
      end
      add points 9
      print points
      ```
    options:
    - '4'
    - '13'
    - Nothing
    correct_index: 2
    option_feedback:
      0: The program stops before reaching a print instruction.
      1: Neither the addition nor the print executes after end.
    explanation: Execution stops before the add and print lines are reached. Having a print instruction
      in the source does not mean it executes.

  # Lecture: pl_implementation_palooza_handouts_td.pdf pp. 15–18
  # Assessment: Fall 2025 Quiz 1 v1, Problem 1 (lexer/parser classification)
  - id: cs131-v2-implementation-lexer-repair-proof
    type: multiple
    difficulty: advanced
    bloom: evaluate
    estimated_seconds: 75
    question: A lexer uses longest match, then rule order for ties. It lists `[a-z]+ → ID` before `"run"
      → RUN`. A proposed repair moves the keyword rule first. Which checks should succeed after the repair?
      Select all that apply.
    options:
    - run becomes RUN.
    - runner remains one ID token.
    - runner becomes RUN followed by ID ner.
    - An ID can no longer contain the letters run.
    correct_indices:
    - 0
    - 1
    option_feedback:
      0: The keyword now wins the equal-length tie for run.
      1: The ID rule still wins the longer six-character match.
      2: A shorter keyword match cannot beat the full identifier match.
      3: Keywords are recognized by a whole matching token, not by banning substrings in identifiers.
    explanation: Reordering repairs the equal-length keyword tie while leaving a longer identifier match
      intact. The two checks test the repair and a nearby boundary case.
