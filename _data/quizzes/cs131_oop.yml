questions:
  # Lecture: oop_palooza_v7_handouts.pdf pp.33–34.
  # Assessment: [Final] S23 V1 (Public).pdf, Problem 11 pp.21–22; reason about access and supported operations.
  - id: cs131-v2-oop-access-check
    type: multiple
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: |
      In C++, `Device` declares public `start()`, protected `reset()`, and private `key()`. `Sensor` publicly inherits `Device`. Select every call allowed by access control.
    options:
      - "A Sensor method calls its inherited reset()."
      - "A Sensor method calls Device's private key()."
      - "Client code calls start() on a Sensor object."
      - "Client code calls reset() on a Sensor object."
    correct_indices: [0, 2]
    option_feedback:
      0: "Protected members are available inside derived-class methods."
      1: "Private access belongs to Device's methods; inheritance does not grant Sensor direct access."
      2: "Public inheritance preserves start() in Sensor's public interface."
      3: "Protected access does not extend to ordinary client code."
    explanation: "Sensor's methods may use inherited public and protected members. Clients may use its public interface, including start()."

  # Lecture: oop_palooza_v7_handouts.pdf pp.82,85–86.
  # Assessment: [Final] F22 (Public).pdf, Problem 16 p.9; infer implementation inheritance from a rejected substitution.
  - id: cs131-v2-oop-private-base
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: |
      C++ client code has these declarations. Which statement compiles?

      ```cpp
      class Engine { public: void run() {} };
      class Pump : private Engine {
      public: void start() { run(); }
      };
      void inspect(Engine& e) {}
      Pump p;
      ```
    options:
      - "p.run();"
      - "inspect(p);"
      - "p.start();"
    correct_index: 2
    option_feedback:
      0: "The inherited implementation is usable inside Pump, but private inheritance hides run() from clients."
      1: "Client code cannot implicitly use a privately derived Pump as an Engine reference."
    explanation: "Pump exposes its own public start() operation. Reusing Engine's implementation does not expose Engine's public type or methods to clients."

  # Lecture: oop_palooza_v7_handouts.pdf pp.54,66,69,85–86.
  # Assessment: Fall 2025 Quiz 4, Problem 1(a,c,d); infer an inheritance link from substitutability evidence.
  - id: cs131-v2-oop-infer-link
    type: single
    difficulty: advanced
    bloom: analyze
    estimated_seconds: 60
    question: |
      In a statically typed language, `B` derives from `A`, and `C` derives from `B`. Each link uses interface, subclassing, or implementation-only inheritance. A `B` can be passed where `A` is required, but a `C` cannot. Assume inheritance is the only reason a substitution could fail. What follows about the `C`-from-`B` link?
    options:
      - "It must use interface inheritance."
      - "It must use implementation-only inheritance."
      - "It must use subclassing inheritance."
    correct_index: 1
    option_feedback:
      0: "Interface inheritance preserves a subtype relationship, so C would also be usable as A."
      2: "Subclassing preserves the inherited public interface and subtype relationship."
    explanation: "B already supports substitution for A. The remaining link must break that relationship; among the listed forms, implementation-only inheritance does so."

  # Lecture: oop_palooza_v7_handouts.pdf pp.70–72,107–108.
  # Assessment: [Final] F22 (Public).pdf, Problem 14 p.7; identify an unimplemented abstract operation after a signature mismatch.
  - id: cs131-v2-oop-abstract-signature
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |
      Why does declaring `Printer p;` fail in this C++ program?

      ```cpp
      class Output { public: virtual void write() = 0; };
      class Printer : public Output {
      public: void write(int copies) {}
      };
      ```
    options:
      - "Printer does not implement write() with no arguments."
      - "A derived class cannot add a parameterized method."
      - "An abstract base cannot have a concrete derived class."
    correct_index: 0
    option_feedback:
      1: "Adding write(int) is permitted; it simply does not implement the separate write() operation."
      2: "A derived class can be concrete once it implements all inherited pure virtual operations."
    explanation: "The no-argument pure virtual write() remains unimplemented. A method with an int parameter has a different signature, so Printer remains abstract."

  # Lecture: oop_palooza_v7_handouts.pdf pp.105,107–108.
  # Assessment: [Final] F22 (Public).pdf, Problem 14 p.7; repair a non-overriding signature.
  - id: cs131-v2-oop-override-repair
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: |
      A C++ base class declares `virtual int cost(int n)`. A subclass should replace that operation. Which declaration gives the compiler the intended override check?
    options:
      - "int cost() override;"
      - "int cost(string n) override;"
      - "int cost(int n) override;"
    correct_index: 2
    option_feedback:
      0: "The missing parameter changes the signature rather than overriding cost(int)."
      1: "Changing the parameter type from int to string creates a different signature."
    explanation: "The parameter list matches the inherited operation. The override keyword then asks the compiler to verify that an override exists."

  # Lecture: oop_palooza_v7_handouts.pdf pp.121–124,135.
  # Assessment: [Final] S23 V1 (Public).pdf, Problem 8 p.17; trace a virtual call through a base pointer.
  - id: cs131-v2-oop-virtual-output
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: |
      What does this C++ code print?

      ```cpp
      struct Base { virtual int value() { return 2; } };
      struct Child : Base { int value() override { return 7; } };
      Child c;
      Base& b = c;
      cout << b.value();
      ```
    options:
      - "2"
      - "7"
      - "27"
    correct_index: 1
    option_feedback:
      0: "Base& is the reference's static type. The virtual call uses the actual Child object's implementation."
      2: "Overriding selects a method; it does not automatically run both bodies."
    explanation: "b refers to a Child object, and value() is virtual, so the call runs Child::value() and prints 7."

  # Lecture: oop_palooza_v7_handouts.pdf pp.135,140.
  # Assessment: [Final] F23 (Public).pdf, Problem 6(b) pp.16–17; classify dispatch at individual call sites.
  - id: cs131-v2-oop-dispatch-sites
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |
      In the course's C++ dispatch model, select every call below that uses dynamic dispatch. Ignore compiler optimizations.

      ```cpp
      struct Base {
        void save() {}
        virtual void show() {}
      };
      struct Child : Base { void show() override {} };
      Child c;
      Base& b = c;
      ```
    options:
      - "b.save()"
      - "b.show()"
      - "c.save()"
      - "c.show()"
    correct_indices: [1, 3]
    option_feedback:
      0: "save() is non-virtual, so its implementation is selected statically."
      1: "The virtual call selects show() using the receiver's actual class."
      2: "Inheritance alone does not make a non-virtual method virtual."
      3: "An ordinary call to a virtual method uses the virtual dispatch semantics even when the receiver is declared Child."
    explanation: "The virtual show() calls use dynamic dispatch. The non-virtual save() calls use static dispatch."

  # Lecture: oop_palooza_v7_handouts.pdf pp.78–79,135.
  # Assessment: [Final] S23 V1 (Public).pdf, Problem 8 p.17; trace a virtual call inside an inherited non-virtual method.
  - id: cs131-v2-oop-inherited-wrapper
    type: single
    difficulty: advanced
    bloom: analyze
    estimated_seconds: 60
    question: |
      What does this C++ code print?

      ```cpp
      struct Base {
        virtual void mark() { cout << "B"; }
        void wrap() { cout << "<"; mark(); cout << ">"; }
      };
      struct Child : Base { void mark() override { cout << "C"; } };
      Child c;
      Base& b = c;
      b.wrap();
      ```
    options:
      - "<B>"
      - "<BC>"
      - "<C>"
    correct_index: 2
    option_feedback:
      0: "Running Base::wrap() does not change the receiver into a Base object. Its virtual mark() call still reaches Child."
      1: "The override replaces the selected implementation; the base mark() body is not automatically called."
    explanation: "Base::wrap() runs, prints <, dynamically calls Child::mark() on the same receiver, and then prints >."

  # Lecture: function_palooza_v8_handouts.pdf pp.85–86,90–94.
  # Assessment: Fall 2025 Quiz 3, Problem 5(a,b); distinguish template instantiation from generic-body checking.
  - id: cs131-v2-oop-template-or-generic
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |
      In a mystery language, `show<T>(T x)` calls `x.label()`. No bound is declared, and not every type has label(). The compiler accepts the definition and a use with Badge, but rejects a use with int. Which lecture model explains all three observations?
    options:
      - "Unbounded generics checked before use."
      - "Templates checked for the chosen type."
      - "Dynamic typing checked only at runtime."
    correct_index: 1
    option_feedback:
      0: "An unbounded generic cannot assume every possible T supports label(), even if a particular use supplies Badge."
      2: "The int use fails at compile time, so runtime-only checking does not explain the observations."
    explanation: "The template model permits operations required by its body and checks whether a chosen concrete type supports them when the template is instantiated."

  # Lecture: function_palooza_v8_handouts.pdf pp.91–94,101.
  # Assessment: Fall 2025 Quiz 3, Problem 5(b,c); supply the interface bound needed by a generic body.
  - id: cs131-v2-oop-generic-bound
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |
      A statically checked generic uses this pseudocode. `T` has no universal base class. Which bound is sufficient for every operation in send?

      ```text
      function send<T>(x: T):
          x.encode()
          x.transmit()
      ```
    options:
      - "Requires encode() only."
      - "Requires transmit() only."
      - "Requires both methods."
    correct_index: 2
    option_feedback:
      0: "The bound must justify transmit() as well as encode()."
      1: "The bound must justify encode() as well as transmit()."
    explanation: "A bounded generic may use the operations guaranteed by its bound. Both called methods must be part of that guarantee."

  # Lecture: oop_palooza_v7_handouts.pdf pp.96–100.
  # Assessment: [Final] F22 (Public).pdf, Problem 15 p.8; trace construction and destruction effects.
  - id: cs131-v2-oop-lifetime-order
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |
      Arrange the four printed lines for this C++ scope, from first to last. Leave out the line that is never printed.

      ```cpp
      struct Base {
        Base() { cout << "base starts\n"; }
        ~Base() { cout << "base ends\n"; }
      };
      struct Child : Base {
        Child() { cout << "child starts\n"; }
        ~Child() { cout << "child ends\n"; }
      };
      { Child c; }
      ```
    lines:
      - "base starts"
      - "child starts"
      - "child ends"
      - "base ends"
    distractors:
      - "child starts again"
    explanation: "The base constructor runs before the derived constructor body. At scope exit, destruction proceeds in reverse: Child's destructor body, then Base's. The inherited base part is not a second Child object."

  # Lecture: oop_palooza_v7_handouts.pdf pp.98–99.
  # Assessment: [Final] F22 (Public).pdf, Problem 15 p.8; diagnose initialization from an observed object's state.
  - id: cs131-v2-oop-python-base-init
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |
      `print(c.name)` raises an attribute error. Which statement should be added before `self.score = score`?

      ```python
      class Base:
          def __init__(self): self.name = "ready"
      class Child(Base):
          def __init__(self, score): self.score = score
      c = Child(8)
      ```
    options:
      - "Base()"
      - "self.__init__(score)"
      - "super().__init__()"
    correct_index: 2
    option_feedback:
      0: "Constructing a separate Base object does not initialize the Base fields on self."
      1: "This calls the same Child initializer again and recurses instead of initializing the base part."
    explanation: "Child defines its own __init__, so it must explicitly call the base initializer to set name on this object. super().__init__() does that."

  # Lecture: oop_palooza_v7_handouts.pdf pp.138–139.
  # Assessment: [Final] F23 (Public).pdf, Problem 6(b) pp.16–17; locate implementations selected by virtual calls.
  - id: cs131-v2-oop-vtable-entries
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: "Base provides virtual draw() and erase(). Child publicly derives from Base and overrides only draw(). In the lecture's vtable model, which implementations appear in Child's draw and erase entries?"
    options:
      - "Child::draw and Base::erase"
      - "Base::draw and Base::erase"
      - "Child::draw and an empty erase entry"
    correct_index: 0
    option_feedback:
      1: "Child's override replaces the draw entry in Child's table."
      2: "An inherited implementation remains callable even when Child supplies no new body."
    explanation: "Child's table selects its override for draw and retains the inherited Base implementation for erase."

  # Lecture: oop_palooza_v7_handouts.pdf pp.129–130 (interface and semantic consistency only).
  # Assessment: [Final] S23 V1 (Public).pdf, Problem 11 pp.21–22; evaluate whether inherited operations support substitution.
  - id: cs131-v2-oop-contract-check
    type: multiple
    difficulty: advanced
    bloom: evaluate
    estimated_seconds: 60
    question: "A Clock interface promises public elapsed(), returning a nonnegative number of seconds. Each proposed implementation returns a nonnegative number. Select every implementation that preserves the stated interface and meaning."
    options:
      - "Public elapsed() returns stored seconds."
      - "Public elapsed() returns stored milliseconds unchanged."
      - "Private elapsed() returns stored seconds."
      - "Public elapsed() converts stored milliseconds to seconds."
    correct_indices: [0, 3]
    option_feedback:
      0: "The public operation and its seconds-based result match the contract."
      1: "A valid number alone is insufficient: the client expects seconds, so the units must match."
      2: "Clients promised a public operation cannot use a private one."
      3: "Internal storage units may differ if the public result still meets the contract."
    explanation: "Substitution requires both the promised public operation and its meaning. Storing milliseconds is compatible with the contract if elapsed() converts them to seconds."

  # Lecture: oop_palooza_v7_handouts.pdf pp.78–80.
  # Assessment: [Final] S23 V1 (Public).pdf, Problem 8 p.17; reason about an inherited wrapper's virtual call.
  - id: cs131-v2-oop-fragile-wrapper
    type: single
    difficulty: advanced
    bloom: evaluate
    estimated_seconds: 75
    question: "Logger.addAll(xs) used to call virtual add(x) for each element. CheckedLogger overrides add(x) to reject empty strings. A revision makes addAll write directly to storage, and empty strings now enter CheckedLogger. Which repair restores the established checking behavior for calls to addAll?"
    options:
      - "Make the storage field protected."
      - "Have addAll call virtual add for each element."
      - "Make CheckedLogger.add private."
    correct_index: 1
    option_feedback:
      0: "Changing field access does not cause the checking method to run."
      2: "Changing visibility does not repair the path that bypasses the override."
    explanation: "The derived behavior depends on addAll routing each insertion through the virtual add operation. Restoring that call path restores the checks; direct storage writes bypass them."

  # Lecture: oop_palooza_v7_handouts.pdf pp.109,135.
  # Assessment: [Final] S23 V1 (Public).pdf, Problem 8 p.17; order outputs across inherited and overridden calls.
  - id: cs131-v2-oop-super-trace
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |
      Arrange the four printed lines in execution order. Leave out the unused base-class output.

      ```python
      class Base:
          def run(self):
              print("start")
              self.step()
              print("finish")
          def step(self): print("base step")
      class Child(Base):
          def run(self):
              super().run()
              print("child done")
          def step(self): print("child step")
      Child().run()
      ```
    lines:
      - "start"
      - "child step"
      - "finish"
      - "child done"
    distractors:
      - "base step"
    explanation: "super().run() executes Base's run body with the same Child receiver. self.step() therefore calls Child.step(). After the base body finishes, Child.run() prints child done."
