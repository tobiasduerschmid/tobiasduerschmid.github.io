title: "Singleton Pattern Quiz"
description: "Test your understanding of the Singleton pattern's controversies, thread-safety mechanisms, and modern alternatives."
active: true
questions:
  - id: 1
    type: single
    difficulty: intermediate
    question: |
      A team needs one shared service, but implements it with calls to `Service.getInstance()` throughout the application. Which two design decisions has it bundled together?
    options:
      - "Whether the service is immutable and whether its methods are thread-safe"
      - "Single-instance lifetime and a global access point"
      - "Whether the service is loaded eagerly and whether clients use inheritance"
      - "Whether the service uses a cache and whether its methods are static"
    correct_index: 1
    option_feedback:
      0: |
        An instance may be mutable or immutable, and its operations may or may not be thread-safe. Neither property defines Singleton.
      2: |
        A Singleton can be initialized eagerly or lazily. Client inheritance is not required to obtain its shared instance.
      3: |
        The service need not cache anything, and its useful operations can be ordinary instance methods. Static access selects the object; it does not imply that all operations are static.
    explanation: "Sharing one object does not require global lookup. Application setup can create an ordinary service once and pass it to consumers, with or without a DI container. This makes the dependency explicit and provides a substitution point for tests."

  - id: 2
    type: single
    difficulty: advanced
    question: |
      Two Java threads simultaneously call `getInstance()` on an unsynchronized lazy Singleton. Both find `uniqueInstance == null` and both create a new instance. Which thread-safety approach eliminates this race condition with the **simplest** implementation and **no explicit lock in the accessor** — accepting construction whenever the enclosing class initializes?
    options:
      - "Synchronize the entire `getInstance()` method on every call"
      - "Initialize a static final instance during class initialization"
      - "Use double-checked locking with `volatile`"
      - "Use a global lock around all Singleton access"
    correct_index: 1
    option_feedback:
      0: |
        Synchronizing `getInstance()` is simple and correct, but it pays synchronization cost on calls after the instance already exists. The question asks for a static initialization policy without an explicit lock in the accessor.
      2: |
        Double-checked locking can preserve laziness with `volatile`, but it is easier to get wrong and more complex than eager initialization. It is not the simplest answer in this prompt.
      3: |
        A broad global lock can serialize unrelated access and still adds locking complexity. The race is solved more simply by creating the instance during class initialization.
    explanation: "A static field initializer runs during class initialization, which the JVM synchronizes. Later accessor calls return the published instance without an explicit accessor lock. The object is created if another use initializes the class, even before any `getInstance()` call; merely loading the class need not create it. A synchronized `getInstance()` is also correct but pays a lock on every call; double-checked locking stays lazy with low overhead after init but is significantly harder to get right."

  - id: 3
    type: single
    difficulty: expert
    question: |
      A system uses Singleton for a database connection pool. A new requirement: the system must support multi-tenant deployments with one pool per tenant. What is the fundamental problem?
    options:
      - "The Singleton needs to be made thread-safe for multi-tenant access"
      - "The 'exactly one instance' assumption no longer holds"
      - "The database driver does not support connection pooling"
      - "The Singleton constructor needs to accept a tenant ID parameter"
    correct_index: 1
    option_feedback:
      0: |
        Thread safety may still matter, but it would not solve the changed cardinality. The requirement now needs one pool per tenant, not one process-wide pool.
      2: |
        The prompt gives no evidence that the driver cannot pool connections. The design problem is that the class hardcoded a one-instance assumption that the new requirement contradicts.
      3: |
        Adding a tenant ID to the constructor does not help if `getInstance()` still returns one shared object. The design needs multiple managed instances, usually keyed by tenant or supplied by DI scope.
    explanation: "The new requirement changes the needed scope: one pool per process is no longer sufficient. This does not prove the old requirement was never valid; the implementation must now accommodate multiple tenant-specific pools. Many 'singletons' later need per-tenant, per-thread, or per-test instances. Explicit setup, a tenant-keyed registry, or appropriately configured DI scopes can provide one pool per tenant without making the pool class globally unique."

  - id: 4
    type: single
    difficulty: advanced
    question: |
      Consumers call `Logger.getInstance()` directly. A developer argues that this is harmless because the logger itself needs no tests. Which testing concern remains?
    options:
      - "Loggers should always use the Factory Method pattern instead"
      - "Callers cannot receive a replacement logger through their public API"
      - "Every logger call races because Singleton forbids synchronized methods"
      - "Loggers should use the Observer pattern instead, not Singleton"
    correct_index: 1
    option_feedback:
      0: |
        Factory Method decides how objects are created; it does not by itself make logger dependencies explicit or replaceable in tests. The issue is the hidden global access from consuming classes.
      2: |
        A logger can be implemented thread-safely. The testing problem remains even with a correct thread-safe logger because callers are hardwired to `Logger.getInstance()`.
      3: |
        Observer can distribute events to listeners, but it is not the direct fix for hidden logger dependencies. The key testability move is making the dependency injectable or otherwise replaceable.
    explanation: "The testability problem is not about testing the Logger itself — it is about testing everything that depends on it. Any class that calls `Logger.getInstance()` has a hidden, hardcoded dependency that cannot be swapped for a test double through its constructor or method parameters. That makes verifying or suppressing log output harder than with an explicit dependency."

  - id: 5
    type: multiple
    difficulty: advanced
    question: |
      An application needs one shared configuration object. Which statements correctly distinguish that requirement from the GoF Singleton pattern? Select all that apply.
    options:
      - "Application setup can create one object and pass it to all consumers"
      - "The absence of a DI framework makes a global accessor necessary"
      - "A global accessor adds coupling beyond the single-instance requirement"
      - "Immutable configuration lets every test use its own settings automatically"
    correct_indices: [0, 2]
    option_feedback:
      0: |
        Passing the same ordinary object to consumers implements shared lifetime without making its class globally unique. This is manual dependency injection.
      1: |
        Dependency injection means supplying a dependency. Constructor or function arguments work without a container or framework.
      2: |
        Direct global lookup hardcodes where consumers get their dependency. That choice is separate from deciding to share one instance.
      3: |
        Immutability prevents state mutation, but it does not let consumers select a different configuration for each test. An explicit substitution point may still be needed.
    explanation: "Choose the lifetime and the access mechanism separately. One shared instance can be created in setup and passed explicitly; a framework is optional. A global accessor adds coupling, and immutability removes shared mutation rather than all substitution concerns."
