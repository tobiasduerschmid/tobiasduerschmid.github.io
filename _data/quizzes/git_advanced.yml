title: "Advanced Git Quiz"
description: "Test your knowledge of advanced Git commands, debugging tools, and integration strategies."
active: true
questions:
  - id: 1
    difficulty: basic
    question: "You have some uncommitted, incomplete changes in your working directory, but you need to switch to another branch to urgently fix a bug. Which Git command is best suited to temporarily save your current work without making a messy commit?"
    options:
      - "`git cherry-pick`"
      - "`git bisect`"
      - "`git revert`"
      - "`git stash`"
    correct_index: 3
    option_feedback:
      0: |
        Cherry-pick copies an existing commit onto the current branch; it does not temporarily save
        uncommitted work.
      1: |
        Bisect searches history for the commit that introduced a bug; it is not a work-in-progress
        storage tool.
      2: |
        Revert creates a new commit that undoes an old commit, which is the opposite of keeping
        incomplete work out of history.
    explanation: "**`git stash` shelves your staged and unstaged changes onto a private stack and leaves a clean working tree, so you can switch contexts without committing half-finished work.** Plain `git stash` ignores untracked files; add `-u` to include them. Restore with `git stash pop`."

  - id: 2
    difficulty: basic
    question: "What happens when you enter a 'Detached HEAD' state in Git?"
    options:
      - "A merge conflict occurs that Git cannot resolve automatically."
      - "The HEAD pointer is attached directly to a specific commit rather than a branch name."
      - "You accidentally delete the main branch of your repository."
      - "The remote server goes offline, and your local repository can no longer push updates."
    correct_index: 1
    option_feedback:
      0: |
        Detached HEAD is a pointer state, not an automatic merge conflict.
      2: |
        Checking out a commit directly does not delete `main`; it only makes `HEAD` stop following a
        branch name.
      3: |
        Detached HEAD is local repository state and says nothing about whether a remote server is
        online.
    explanation: "**Checking out a commit by its hash points HEAD directly at that commit instead of a branch — \"detached HEAD.\"** New commits made here advance no branch pointer, so once you switch away nothing references them and they can be garbage-collected."

  - id: 3
    difficulty: basic
    question: "Which Git command utilizes a binary search through your commit history to help you pinpoint the exact commit that introduced a bug?"
    options:
      - "`git blame`"
      - "`git bisect`"
      - "`git diff`"
      - "`git cherry-pick`"
    correct_index: 1
    option_feedback:
      0: |
        `git blame` shows the last commit touching each line, but it does not run a binary search over
        good and bad revisions.
      2: |
        `git diff` compares two states; it does not manage the iterative good/bad testing process.
      3: |
        Cherry-pick applies one known commit elsewhere; it is not for discovering which commit was bad.
    explanation: "**`git bisect` binary-searches commit history to pinpoint the commit that introduced a bug.** You mark one known-good and one known-bad commit; Git checks out the midpoint and you test, repeatedly halving the range until one culprit commit remains — log(n) tests instead of n."

  - id: 4
    difficulty: basic
    question: "What is the primary purpose of Git Submodules?"
    options:
      - "To break a single, massive file into smaller, trackable pieces to improve performance."
      - "To embed an external Git repository as a subdirectory with its own independent history."
      - "To securely store passwords, API keys, and private credentials outside of the main repository."
      - "To automatically squash a long sequence of commits into a single bugfix."
    correct_index: 1
    option_feedback:
      0: |
        Submodules track another repository at a chosen commit; they do not partition large files for
        performance.
      2: |
        A submodule is versioned source history, not a credential vault.
      3: |
        Squashing rewrites or combines commits; submodules preserve an external repository's independent
        history.
    explanation: "**A submodule embeds an external repository as a subdirectory, pinning it to one specific commit while its history stays independent.** The outer repo stores only that pinned SHA, not a copy of the files — useful for sharing a library across projects without vendoring its code."

  - id: 5
    difficulty: intermediate
    type: multiple
    question: "In which of the following scenarios would using `git stash` be considered an appropriate and helpful practice? (Select all that apply)"
    options:
      - "You have uncommitted, incomplete changes but need to switch branches urgently to fix a bug."
      - "You want to temporarily clear your working directory so you can safely pull down new remote changes."
      - "You want to permanently delete unneeded code files from your project's history."
      - "You want to permanently apply a completed commit from a completely different branch."
    correct_indices: [0, 1]
    option_feedback:
      0: |
        Stash is designed for this exact temporary pause: keep unfinished edits without creating a
        misleading commit.
      1: |
        Stashing before pulling avoids mixing local unfinished edits with incoming changes.
      2: |
        Stash stores working changes temporarily; it does not remove files from project history.
      3: |
        Applying a completed commit from another branch is cherry-pick territory, not stash.
    explanation: "**`git stash` shelves staged and unstaged modifications and leaves a clean working tree — ideal for a quick context switch or a clean pull, not for deleting files or moving commits.** It saves work temporarily; it never removes files from history, and applying a finished commit from another branch is `git cherry-pick`'s job."

  - id: 6
    difficulty: intermediate
    type: multiple
    question: "Which of the following are valid methods or strategies for integrating changes from a feature branch back into the main codebase in Git? (Select all that apply)"
    options:
      - "`git merge`"
      - "`git rebase`"
      - "`git merge --squash`"
      - "`git bisect`"
      - "`git blame`"
    correct_indices: [0, 1, 2]
    option_feedback:
      0: |
        A merge preserves the branch topology while bringing feature changes into the target branch.
      1: |
        Rebasing can integrate work by replaying commits onto a new base, with the tradeoff that commit
        identities change.
      2: |
        Squash merge integrates the final content as one new commit rather than preserving every
        feature-branch commit.
      3: |
        `git bisect` identifies a bad commit; it does not combine branch histories.
      4: |
        `git blame` attributes lines to commits; it does not move changes between branches.
    explanation: "**Merging, rebasing, and squash-merging are the three integration techniques — `git bisect` and `git blame` are inspection tools, not integration strategies.** One caveat: `git merge --squash` only *stages* the combined changes, so it must be followed by `git commit` to create the squashed commit."

  - id: 7
    difficulty: advanced
    question: "What does the file `.git/HEAD` contain when you are checked out on a branch, compared to when you are in a detached HEAD state?"
    options:
      - "On a branch, it contains an exact commit hash; in detached HEAD, it contains a symbolic reference to a branch."
      - "Both states contain the same exact commit hash, but the detached HEAD state also includes a warning string."
      - "On a branch: a symbolic ref (e.g., `ref: refs/heads/main`); in detached HEAD: a raw commit hash."
      - "Both states contain `ref: refs/heads/main`, but detached HEAD additionally points to the staging area index."
    correct_index: 2
    option_feedback:
      0: |
        On a branch, `.git/HEAD` usually points to the branch ref; the branch ref points to the commit
        hash.
      1: |
        Detached HEAD changes the pointer representation to a raw hash; Git does not store the state as
        the same hash plus warning text.
      3: |
        `HEAD` identifies the current commit or branch ref, while the staging area is stored separately
        as the index.
    explanation: "**On a branch, `.git/HEAD` holds a symbolic reference like `ref: refs/heads/main` (a pointer to a branch pointer); in detached HEAD it holds a raw commit SHA directly.** Detaching (e.g. `git switch --detach <hash>`) disconnects HEAD from every branch, so commits made there advance no branch pointer and can be lost on switching away."

  - id: 8
    difficulty: intermediate
    question: |
      **Arrange** the Git commands to safely stash your work, pull remote changes, and restore your stashed work.
    type: parsons
    display: inline
    lines:
      - "git stash"
      - "&&"
      - "git pull"
      - "&&"
      - "git stash pop"
    distractors:
      - "git stash drop"
      - "git reset --hard"
    explanation: "**The correct order is stash → pull → pop: shelve local changes first, then pull onto a clean working directory, then restore — drop discards the stash and reset --hard destroys local work.** `git stash` saves uncommitted changes temporarily, `git pull` fetches and merges remote changes onto a clean working directory, and `git stash pop` re-applies the stashed changes on top. `git stash drop` would *discard* the stash without applying it. `git reset --hard` would destroy all local changes — dangerous!"

  - id: 9
    difficulty: advanced
    question: |
      **Arrange** the Git commands to stage a forgotten file and fold it into the last commit without changing the commit message.
    type: parsons
    display: inline
    lines:
      - "git add forgotten.py"
      - "&&"
      - "git commit --amend --no-edit"
    distractors:
      - "git reset --hard HEAD~1"
      - "git commit -m 'Add forgotten file'"
    explanation: "**The correct order is add → amend --no-edit: stage the forgotten file, then fold it into the last commit while keeping the original message.** `reset --hard HEAD~1` would destroy that commit, and a fresh `commit -m` adds a fixup commit that clutters history — amend is cleaner as long as the commit hasn't been pushed."

  - id: 10
    type: single
    difficulty: intermediate
    question: After a teammate force-pushes rewritten history, your committed fix is absent from the branch log. You
      still have the original local clone. What is the best first recovery step?
    options:
      - Inspect `git reflog` for the old tip
      - Repeat `git pull` until it returns
      - Run `git gc --prune=now`
    correct_index: 0
    option_feedback:
      1: Pull follows the current remote history; repeating it does not restore a removed branch tip.
      2: Pruning can remove unreachable objects that are needed for recovery.
    explanation: The local reflog records recent reference movements and may identify the old commit. Inspect it,
      create a branch at the recovered commit, and then choose how to reintegrate the fix.

  - id: 11
    type: single
    difficulty: intermediate
    question: |-
      You start on `main`. Both commands succeed. What is the final HEAD state?

      ```sh
      git switch --detach HEAD~1
      git branch rescue
      ```
    options:
      - Attached to `main`
      - Attached to `rescue`
      - Detached at the older commit
    correct_index: 2
    option_feedback:
      0: The first command stops HEAD from following `main`.
      1: Creating a branch and switching to it are separate operations.
    explanation: '`switch --detach` detaches HEAD. `git branch rescue` creates a name for that commit but does not
      switch to it; `git switch rescue` would attach HEAD.'

  - id: 12
    type: single
    difficulty: intermediate
    question: A regression test was committed only yesterday. Why can `git bisect run pytest tests/regression_test.py`
      fail on older revisions for the wrong reason?
    options:
      - Older checkouts may lack the test file
      - Bisect tests the current branch tip instead
      - Pytest reads only files staged in the index
    correct_index: 0
    option_feedback:
      1: Bisect checks out candidate revisions; it does not keep testing the original branch tip.
      2: Pytest reads files from the working directory, not the Git index.
    explanation: A tracked file appears only in revisions containing it. Keep a compatible regression detector outside
      the searched history, or restore it for every candidate, so every revision receives the same check.

  - id: 13
    type: single
    difficulty: advanced
    question: A branch contains committed red, green, and refactor steps. You are bisecting an export bug. Which check
      best identifies that particular regression?
    options:
      - A focused export-regression test
      - The entire suite at each commit
      - The commit message for each step
    correct_index: 0
    option_feedback:
      1: An unrelated red-step test failure can label a commit bad even when export still works.
      2: A commit message describes intent; it does not test whether export works.
    explanation: A bad result must indicate the specific export regression. A focused detector avoids classifying
      an intentional failure from an unrelated TDD step as the bug being sought.

  - id: 14
    type: single
    difficulty: intermediate
    question: Bisect identifies a squash commit that introduced both CSV export and one export bug. What is the main
      risk of reverting that whole commit?
    options:
      - It removes the useful export feature too
      - It erases the original commit from history
      - It detaches HEAD at the faulty commit
    correct_index: 0
    option_feedback:
      1: Revert adds a new inverse commit and preserves history.
      2: Revert creates an inverse commit on the current branch; it does not check out the old commit.
    explanation: Revert inverses the whole commit, including working feature code. Inspect the change and choose a
      targeted fix or an intentional rollback; identifying the introducing commit does not choose the repair.
