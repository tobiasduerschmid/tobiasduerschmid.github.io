title: "State Pattern Quiz"
description: "Test your understanding of the State pattern's design decisions, its relationship to Strategy, and the principle of polymorphism over conditions."
active: true
questions:
  - id: 1
    difficulty: intermediate
    type: single
    question: |
      A `GumballMachine` built with the State pattern has states: NoQuarter, HasQuarter, Sold, and SoldOut. `NoQuarterState.insertQuarter()` calls `context.setState(new HasQuarterState())` to trigger transitions. What design decision is this an example of?
    options:
      - "Context-driven transitions — the Context centralizes all transition logic"
      - "State-driven transitions — each State object knows its successor and triggers transitions"
      - "Client-driven transitions — the client selects which state to switch to"
      - "Null-state transitions — transitions are handled by the Null Object pattern"
    correct_index: 1
    option_feedback:
      0: |
        Context-driven transition logic would put the state-change rules in `GumballMachine` itself. Here the concrete state method decides the successor and calls `setState()`.
      2: |
        The client asks the machine to perform an operation such as `insertQuarter()`. It should not choose the next internal state directly.
      3: |
        A Null Object can represent harmless do-nothing behavior. It is not the mechanism choosing the next real state in this example.
    explanation: "Because each Concrete State knows its successor(s) and calls `context.setState()` itself, this is **state-driven** transitions. The upside is that each state encapsulates its own transition logic; the downside is that the complete state machine is harder to see at a glance and the state classes become coupled to one another."

  - id: 2
    difficulty: intermediate
    type: single
    question: |
      A Game of Life implementation stores cells in a boolean matrix and uses a small, stable conditional to apply the two cell rules. A reviewer says every boolean state must be replaced with State objects. How should the team evaluate that claim?
    options:
      - "Introduce State because boolean values always violate information hiding."
      - "Keep the conditional unless state-specific complexity justifies the extra structure."
      - "Introduce State because it guarantees faster updates for large grids."
      - "Replace the matrix with inheritance because runtime transitions are unnecessary."
    correct_index: 1
    option_feedback:
      0: "A boolean can be an appropriate representation. Information hiding concerns what clients depend on, not whether internal state is a boolean."
      2: "State adds indirection and objects; it does not guarantee faster execution. Representation and workload determine performance."
      3: "Cells change state while the simulation runs. An inheritance hierarchy alone does not supply that transition behavior."
    explanation: "State is an option for organizing substantial state-dependent behavior. A small stable conditional is not automatically a design violation. Consider State when repeated branches or evolving state-specific behavior create a concrete maintenance problem."

  - id: 3
    difficulty: intermediate
    type: single
    question: |
      The State and Strategy patterns can have nearly identical UML class diagrams. What is the **key behavioral difference** between them?
    options:
      - "State uses abstract classes; Strategy uses interfaces"
      - "State models lifecycle behavior; Strategy varies an algorithm"
      - "Strategy supports more concrete implementations than State"
      - "State is only for GUI applications; Strategy is general-purpose"
    correct_index: 1
    option_feedback:
      0: |
        Either pattern can be implemented with an interface or an abstract class. The structural choice is less important than whether implementations transition internally or are selected by a client.
      2: |
        The number of concrete classes does not separate the patterns. Both can have many implementations.
      3: |
        State is not limited to GUIs; it is useful for protocols, workflows, documents, games, and other objects whose behavior depends on lifecycle state.
    explanation: "Similar structure, different **intent**. State varies behavior with a context's lifecycle state; transitions can be controlled by the context or its states. Strategy varies the algorithm used for a task. Clients often configure a strategy, but the location of the selection code alone does not define the pattern."

  - id: 4
    difficulty: advanced
    type: single
    question: |
      A `Document` class has states: Draft, Review, Published, Archived. Only Review may enter a new Rejected state, which can return to Draft. The team wants to keep each state's outgoing transitions in that state's class. Which approach matches this goal?
    options:
      - "Context-driven — because the new transition logic can be added in one centralized place"
      - "State-driven — because only the Review state needs to know about the new Rejected state"
      - "Neither — the State pattern cannot accommodate new states without major refactoring"
      - "Both handle it equally well"
    correct_index: 1
    option_feedback:
      0: |
        Centralizing transitions can make the whole state machine visible, but it also means editing the context's transition logic. The prompt asks which approach localizes this particular change.
      2: |
        State is specifically meant to make state-dependent behavior extensible. A new state still requires design work, but it does not imply a major rewrite.
      3: |
        The approaches trade off visibility against locality. When only `Review` can transition to `Rejected`, state-driven transitions can keep the change close to the affected state.
    explanation: "With **state-driven** transitions the change is local: create the `RejectedState` class and add one transition to it inside `ReviewState`; `RejectedState` then transitions back to `DraftState`. No other state changes. A centralized transition table could also localize the edit, but would not meet the stated goal of keeping outgoing transition rules in state classes."

  - id: 5
    difficulty: advanced
    type: single
    question: |
      State objects in a `GumballMachine` carry no instance data — they only contain behavior methods. A developer proposes making all state objects Singletons to save memory. What is the **key risk** of this approach?
    options:
      - "Singletons are always an anti-pattern and should never be used"
      - "Shared state objects cannot hold any per-context data later"
      - "It makes state transitions slower due to synchronization overhead"
      - "The Null Object pattern cannot be combined with Singleton"
    correct_index: 1
    option_feedback:
      0: |
        Stateless shared state objects can be a reasonable optimization. The risk is not that Singleton is forbidden; it is that the optimization locks in a no-per-context-data assumption.
      2: |
        Shared stateless objects do not necessarily require synchronization during every transition. The design risk is future flexibility, not inherent transition speed.
      3: |
        A Null Object can be shared as a singleton when it is truly stateless. The compatibility of those patterns is not the issue here.
    explanation: "Because many contexts would share one instance, a Singleton state can no longer hold per-context fields or a per-context reference back to its Context. This **Singleton State** compound is memory-efficient but inflexible — only safe when the states are sure to stay purely behavioral, or when a later refactor away from shared instances is acceptable."

  - id: 6
    type: single
    difficulty: intermediate
    question: A `Printer` uses State objects. Where should “reject a print request while jammed” belong?
    options:
    - In the concrete jammed state.
    - In every client that prints.
    - In a client-side switch over all states.
    correct_index: 0
    option_feedback:
      1: That scatters a state-dependent rule across callers, so each caller must know internal printer states.
      2: A switch in each client recreates the coupling that delegation is intended to remove.
    explanation: The printer delegates state-dependent behavior to its current state. The jammed state owns the response to a print request in that state.
  - id: 7
    type: single
    difficulty: intermediate
    question: A player stores its current State object. Every state uses the same account identifier. What belongs in the context rather than each state?
    options:
    - The rule for moving out of jail.
    - The behavior of a bankrupt turn.
    - The shared account identifier.
    correct_index: 2
    option_feedback:
      0: A state-specific transition rule can belong with that state, depending on the chosen transition design.
      1: Turn behavior that varies for bankrupt players is a state-dependent concern.
    explanation: The context can retain identity and other state-independent data while delegating varying behavior. Copying shared identity into every state risks inconsistent copies.
