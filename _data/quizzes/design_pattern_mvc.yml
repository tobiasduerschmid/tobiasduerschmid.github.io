title: "MVC Pattern Quiz"
description: "Test your understanding of the MVC architectural pattern, its compound structure, and its modern variants."
active: true
questions:
  - id: 1
    difficulty: intermediate
    type: single
    question: "Which three patterns explain the main relationships in classic Smalltalk MVC as discussed by GoF?"
    options:
      - "Observer (model→view notify), Strategy (view delegates to controller), Composite (nested UI tree)"
      - "Singleton (one model), Factory Method (create views), Adapter (controller adapts input)"
      - "State (model states), Mediator (controller mediates), Facade (view simplifies display)"
      - "Iterator (traverse model data), Command (controller commands), Decorator (view decorates output)"
    correct_index: 0
    option_feedback:
      1: |
        MVC does not require one model, nor is its main structure about creating views or adapting input. The classic compound explanation is about notification, delegated input behavior, and nested UI components.
      2: |
        Controllers can coordinate some interaction, but MVC's controller role is not the same as a Mediator owning all colleague coordination. MVC is usually taught as Observer plus Strategy plus Composite.
      3: |
        Commands may appear in some UI architectures, but this is not the classic compound structure of MVC. MVC's central split is model state, view presentation, and controller input handling.
    explanation: "Observer propagates model changes, Strategy varies input handling through controllers, and Composite supports nested views. This is a description of classic Smalltalk MVC, not a requirement for every architecture called MVC."
  - id: 2
    difficulty: intermediate
    type: single
    question: "In an MVC design, the domain model has no dependency on concrete widgets or input devices. What is the main benefit of that separation?"
    options:
      - "It guarantees a smaller model than view or controller."
      - "Domain logic can run and be tested without the UI."
      - "It prevents unrelated domain responsibilities accumulating."
      - "It makes every view portable without platform changes."
    correct_index: 1
    option_feedback:
      0: |
        A model can still be large if the domain is large. MVC's main benefit is not size reduction; it is keeping domain logic independent of presentation and input mechanisms.
      2: |
        Separating the model from the UI helps with responsibilities, but it does not automatically prevent the model from accumulating too much domain behavior. A model can still need its own internal design.
      3: |
        A view may become easier to replace, but MVC's deeper value is that the domain model survives view changes. The architecture protects the core logic from UI churn.
    explanation: "Keeping concrete UI dependencies out of domain logic allows domain tests and other presentations to use it directly. Views and controllers may still depend on the model API, and non-UI platform dependencies remain a separate concern."
  - id: 3
    difficulty: intermediate
    type: single
    question: "A team adds custom MVC plumbing to one small stable form. The new classes only forward calls already handled by its toolkit. Is the criticism that this adds unnecessary complexity reasonable?"
    options:
      - "No — MVC should always be used for any application with a user interface"
      - "Yes — for simple UIs, MVC's three components cost more than they return"
      - "No — MVC is necessary for any application that handles user input"
      - "Yes — but only because CRUD forms should use the State pattern instead"
    correct_index: 1
    option_feedback:
      0: |
        Patterns are trade-offs, not universal upgrades. If there is one stable screen and little domain complexity, the extra separation may cost more than it returns.
      2: |
        Handling user input alone does not require full MVC. MVC is more justified when domain logic, presentation, and interaction are likely to evolve independently.
      3: |
        State is useful when behavior changes with an object's internal state. A simple CRUD form may need neither full MVC nor State; the issue is proportional design.
    explanation: "In this scenario the custom layer duplicates existing mechanisms without an identified benefit. One view alone is not a reason to reject MVC: a framework may already supply it, and domain separation can remain useful."
  - id: 4
    difficulty: intermediate
    type: single
    question: "The Model notifies all 50 registered Views after every small change. Even unchanged or offscreen Views redraw each time, and this unnecessary work degrades performance. What Observer-related problem has MVC inherited?"
    options:
      - "The lapsed listener problem — obsolete observers stay subscribed and leak memory"
      - "Notification storm — broad broadcasts cause unnecessary view updates"
      - "The cyclic dependency problem — every view imports another view"
      - "The god class problem — one class owns unrelated responsibilities"
    correct_index: 1
    option_feedback:
      0: "The scenario concerns active views doing unnecessary work, not subscriptions that should have been removed."
      2: "Notification fan-out does not require dependencies between views. The stem identifies unnecessary redraws as the cost."
      3: "A god class centralizes unrelated responsibilities. The problem here is excessive update work across many views."
    explanation: "Broad notifications can trigger unnecessary work in many views. Measure which updates are expensive, then consider batching, deferral, or more specific events. This differs from failing to unsubscribe obsolete views."
  - id: 5
    difficulty: advanced
    type: single
    question: "A UI framework manages state-triggered rendering. Which architectural responsibility remains with the application developer?"
    options:
      - "Give every component a runtime-swappable controller."
      - "Keep domain decisions separate from display and input code."
      - "Replace every UI component tree with a domain-object tree."
      - "Implement explicit Subject and Observer base classes."
    correct_index: 1
    option_feedback:
      0: |
        Some frameworks do not expose controllers as swappable Strategy objects. The durable MVC idea is broader: separate state, presentation, and interaction even when the mechanism changes.
      2: |
        UI trees are common in modern frameworks, but the question asks for the core MVC principle. A component tree helps structure views; it is not the whole architectural separation.
      3: |
        Modern reactive systems often replace explicit Subject and Observer classes with hooks, signals, or data binding. The mechanism changes while the separation of state, UI, and events remains useful.
    explanation: "Framework-managed rendering does not choose the application’s domain boundaries. The developer still decides where domain rules, presentation state, and input handling belong; using reactivity alone does not enforce MVC."
  - id: 6
    difficulty: intermediate
    type: single
    question: |
      A user clicks "Add Task" in a classic MVC desktop app. In what order do the three components participate, starting with the click?
    options:
      - "View changes domain data, then Controller records it."
      - "Controller changes Model; notified View reads and redraws."
      - "Model handles the click, then Controller changes the View."
      - "Controller builds a screen, then stores it in the Model."
    correct_index: 1
    option_feedback:
      0: "Presentation-only state can belong to a view, but task data in this example belongs to the model. The controller translates the input into a model operation."
      2: "The model exposes domain operations rather than handling raw device events."
      3: "For this classic notification flow, the controller requests a model change and the view refreshes from the model."
    explanation: "**The controller receives input and updates the model; the model then notifies subscribed views, which query the model and redraw.** Classic MVC has a clear input → state → presentation flow. The **controller** translates the raw user event into a domain operation on the **model**. Mutating the model fires an Observer notification, which prompts each registered **view** to query the model for the data it needs and re-render. The view or UI event system may receive the physical event and delegate input handling to the controller; the model remains independent of input devices."

  - id: 7
    difficulty: advanced
    type: single
    question: |
      A team builds a server-side web app in Ruby on Rails. The Controller receives an HTTP request, updates the Model, then selects a template and renders HTML. The View never subscribes to model change events. Which statement best characterizes this architecture relative to classic Smalltalk MVC?
    options:
      - "It has the same persistent view subscriptions as classic MVC."
      - "It renders a response per request without a persistent observing view."
      - "It cannot separate domain logic because it uses HTTP."
      - "It merges controller and view as in Document-View."
    correct_index: 1
    option_feedback:
      0: "The scenario explicitly has no subscription connecting the rendered view to later model changes."
      2: "Request-response applications can still separate domain logic from presentation."
      3: "The controller and template remain separate; the changed mechanism is synchronization."
    explanation: "This is a server-side MVC adaptation: request handling invokes model operations and renders a response. Live browser updates require an additional mechanism. The Java Model 2 terminology describes a related controller-servlet and view-template design; it is not the historical name of every web MVC framework."
  - id: 8
    difficulty: advanced
    type: single
    question: "An MVVM View binds to ViewModel state. How does this differ from a Passive View whose Presenter explicitly calls display setters?"
    options:
      - "A View that forwards all events to a Presenter for explicit display updates"
      - "Presentation state exposed to the View through a configured binding"
      - "A swappable input-handling Strategy that replaces a controller at runtime"
      - "A Composite structure that organizes nested UI components"
    correct_index: 1
    option_feedback:
      0: "This describes the Passive View arrangement in the question. In the MVVM arrangement, the binding reads presentation state instead of a Presenter issuing display setters."
      2: "A swappable controller is a Strategy role in classic MVC. It does not distinguish the given MVVM and Passive View arrangements."
      3: "Both arrangements can use nested UI components; that does not identify how view updates are delivered."
    explanation: "In the given MVVM arrangement, binding observes presentation state and updates the view. A Passive View presenter instead issues view updates explicitly. Automatic refresh still requires a correctly configured binding or subscription; merely naming a class ViewModel does not provide it."
