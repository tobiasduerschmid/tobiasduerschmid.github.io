  # Lecture: essential_python_handouts_td.pdf, pp. 10
  # Assessment: [Midterm] F24 V1 (Public).pdf, Problem 4 Part D, p. 7 (nested mutation survives a shallow copy).
  - id: cs131-v2-python-repair-nested-copy
    type: single
    difficulty: intermediate
    bloom: evaluate
    estimated_seconds: 60
    question: |-
      This function must return an edited copy of a nonempty nested list while leaving every input row unchanged. Which replacement for the marked line meets that contract? Assume ordinary lists of integers.

      ```python
      from copy import copy, deepcopy
      def preview(rows):
          result = copy(rows)  # replace this line
          result[0].append(0)
          return result
      ```
    options:
      - '`result = rows`'
      - '`result = deepcopy(rows)`'
      - '`result = copy(copy(rows))`'
    correct_index: 1
    option_feedback:
      0: Assignment shares the entire input object graph.
      2: Copying the outer list twice still reuses the same inner lists.
    explanation: A deep copy duplicates the mutable rows before the append. Repeated shallow copies only add more independent outer containers.

  # Lecture: essential_python_handouts_td.pdf, pp. 9,22–24
  # Assessment: [Midterm] F23 (Public).pdf, Problem 1, pp. 2–3 (returned aliases outlive local rebinding).
  - id: cs131-v2-python-return-reference-before-rebind
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      What does this code print?

      ```python
      def keep_first(values):
          saved = values
          values = [0]
          return saved
      original = [6]
      returned = keep_first(original)
      returned.append(8)
      print(original is returned, original)
      ```
    options:
      - '`False [6]`'
      - '`True [0, 8]`'
      - '`True [6, 8]`'
    correct_index: 2
    option_feedback:
      0: Returning `saved` passes back the original reference, not a copy.
      1: Only the local name `values` is rebound to `[0]`; `saved` keeps the original reference.
    explanation: The local assignment does not affect `saved` or `original`. The returned list is the original object, so the later append changes it.

  # Source concepts: Homework Problems, PYTHON2; Essential Python handouts pp. 22–24.
  - id: cs131-python-holder-rebinding
    type: single
    difficulty: intermediate
    question: |-
      What does this program print?

      ```python
      class Meter:
          def __init__(self, value):
              self.value = value
      def lower(value, meter):
          value -= 3
          meter.value -= 3
          meter = Meter(0)
          return value
      number = 11
      meter = Meter(number)
      result = lower(number, meter)
      print(number, meter.value, result)
      ```
    options:
    - '`8 8 8`'
    - '`11 8 8`'
    - '`11 0 8`'
    correct_index: 1
    option_feedback:
      0: Rebinding the integer parameter does not rebind the caller’s number.
      2: The final assignment changes only the parameter meter; the caller retains the mutated original instance.
    explanation: The integer parameter is rebound to 8, the shared Meter receives an attribute update to 8, and the return supplies 8 separately.

  # Source concepts: Essential Python pp. 17–21; Quiz 1 Problem 2C–D (slot replacement).
  - id: cs131-python-slice-write
    type: single
    difficulty: intermediate
    question: |-
      What does this program print?

      ```python
      slots = [2, 4, 6]
      alias = slots
      tail = slots[1:]
      slots[1:] = [9]
      tail[0] = 7
      print(alias, tail)
      ```
    options:
    - '`[2, 9] [7, 6]`'
    - '`[2, 4, 6] [7, 6]`'
    - '`[2, 7, 6] [7, 6]`'
    correct_index: 0
    option_feedback:
      1: Slice assignment edits the existing slots list, which alias still names.
      2: The tail slice has its own slots; assigning tail[0] does not edit slots.
    explanation: A slice expression constructs a shallow list; slice assignment mutates its target list. Replacing integer slots in the two outer lists is independent.

  # Source concepts: Essential Python pp. 17–21; Quiz 1 Problem 2C–D.
  - id: cs131-python-comprehension-shares-row
    type: single
    difficulty: intermediate
    question: |-
      What does this program print?

      ```python
      row = [4]
      repeated = [row for _ in range(2)]
      fresh = [[4] for _ in range(2)]
      repeated[1].append(9)
      fresh[1].append(9)
      print(repeated, fresh)
      ```
    options:
    - '`[[4], [4, 9]] [[4], [4, 9]]`'
    - '`[[4, 9], [4, 9]] [[4, 9], [4, 9]]`'
    - '`[[4, 9], [4, 9]] [[4], [4, 9]]`'
    correct_index: 2
    option_feedback:
      0: Evaluating the name row twice retains two references to one list.
      1: The literal [4] is evaluated separately on each iteration, creating distinct rows in fresh.
    explanation: Comprehension syntax alone does not ensure independent children. Its element expression either reuses an object or constructs one.

  # Source concepts: Homework PYTHON4; Midterm F24 V1 Problem 4, pp. 7–8.
  - id: cs131-python-tuple-child-copy
    type: single
    difficulty: advanced
    question: |-
      What does this program print?

      ```python
      from copy import copy, deepcopy
      source = {"entry": ("ok", [6])}
      draft = copy(source)
      saved = deepcopy(source)
      source["entry"][1].append(8)
      source["entry"] = ("new", [])
      print(draft["entry"], saved["entry"])
      ```
    options:
    - '`(''new'', []) (''ok'', [6])`'
    - '`(''ok'', [6, 8]) (''ok'', [6])`'
    - '`(''ok'', [6, 8]) (''ok'', [6, 8])`'
    correct_index: 1
    option_feedback:
      0: The shallow dictionary has its own entry slot, so replacing the source slot does not redirect it.
      2: The deep copy owns a separate mutable child list.
    explanation: The shallow dictionary retains the earlier tuple, including its shared list. The deep copy preserves the list’s earlier contents.

  # Source concepts: Essential Python pp. 25–27 (default evaluation and mutation).
  - id: cs131-python-default-dictionary-rebind
    type: single
    difficulty: advanced
    question: |-
      What does this program print?

      ```python
      def count(label, totals={}):
          totals[label] = totals.get(label, 0) + 1
          result = totals
          totals = {}
          return result
      first = count("x")
      separate = count("x", {})
      last = count("x")
      print(first["x"], separate["x"], last["x"], first is last)
      ```
    options:
    - '`1 1 1 False`'
    - '`2 2 2 True`'
    - '`2 1 2 True`'
    correct_index: 2
    option_feedback:
      0: Rebinding the local parameter does not replace the default retained by the function.
      1: The explicit empty dictionary belongs only to the middle call.
    explanation: Calls omitting totals share its definition-time dictionary. The first result remains an alias and observes the later increment.

