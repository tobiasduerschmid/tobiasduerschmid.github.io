  # Source concepts: Essential Python p. 10; Homework PYTHON4 (copy-depth transfer).
  - id: cs131-python-deepcopy-operation-boundary
    type: single
    difficulty: advanced
    question: |-
      What does this program print?

      ```python
      from copy import deepcopy
      item = {"marks": []}
      pair = deepcopy([item, item])
      singles = [deepcopy(item), deepcopy(item)]
      pair[0]["marks"].append(5)
      singles[0]["marks"].append(7)
      print(pair[1]["marks"], singles[1]["marks"], item["marks"])
      ```
    options:
    - '`[5] [] []`'
    - '`[] [] []`'
    - '`[5] [7] [5, 7]`'
    correct_index: 0
    option_feedback:
      1: One deepcopy remembers that both original slots reached the same dictionary, preserving that sharing within pair.
      2: Separate copying calls do not share their copies, and none of these mutations reaches the original.
    explanation: A deep copy isolates the copied graph from the original while preserving repeated references within one copying operation.

  # Source concepts: Midterm F23 Problem 1, pp. 2–3 (returned member aliases).
  - id: cs131-python-returned-list-detaches
    type: single
    difficulty: intermediate
    question: |-
      What does this program print?

      ```python
      class Inbox:
          def __init__(self):
              self.messages = ["a", "b"]
          def drain(self):
              result = self.messages
              self.messages = []
              return result
      box = Inbox()
      watching = box.messages
      batch = box.drain()
      batch.pop(0)
      box.messages.append("c")
      print(watching, box.messages)
      ```
    options:
    - '`[''b'', ''c''] [''b'', ''c'']`'
    - '`[''a'', ''b''] [''c'']`'
    - '`[''b''] [''c'']`'
    correct_index: 2
    option_feedback:
      0: drain installs a new member list; the returned reference still reaches the old one.
      1: watching and batch share the old list, so the pop is visible through watching.
    explanation: An earlier alias keeps its object alive after member replacement. It does not follow the member’s later binding.

  # Source concepts: Homework PYTHON3; Midterm S23 V1 Problem 6, pp. 6–7.
  - id: cs131-python-shallow-parameter-records
    type: single
    difficulty: advanced
    question: |-
      What does this program print?

      ```python
      from copy import copy
      def revise(rows):
          rows = copy(rows)
          rows[1]["n"] += 4
          rows[0] = {"n": 0}
          return rows
      original = [{"n": 2}, {"n": 3}]
      edited = revise(original)
      edited.append({"n": 9})
      print([r["n"] for r in original], [r["n"] for r in edited])
      ```
    options:
    - '`[0, 7, 9] [0, 7, 9]`'
    - '`[2, 7] [0, 7, 9]`'
    - '`[2, 3] [0, 7, 9]`'
    correct_index: 1
    option_feedback:
      0: The local outer copy isolates slot replacement and appending from the original list.
      2: Both outer lists still reach the second dictionary, so its field mutation is shared.
    explanation: 'Identify the object being mutated at each line: an outer list and a dictionary stored inside it have different copying boundaries.'

