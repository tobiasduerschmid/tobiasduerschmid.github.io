title: "CS 131: Python Object Semantics"
description: "Trace identity, mutation, copying, parameters, and shared state."
active: true
# Essential Python slide 11 (Language of the Week: OpenCL) is excluded.
questions:
  # Sources: essential_python.pptx, slides 4, 6; Homework Problems, PYTHON2.
  - id: assignment-shares-object
    type: single
    difficulty: basic
    bloom: understand
    question: "After Python executes `b = a` for a list `a`, what relationship holds immediately afterward?"
    options:
      - "The names refer to separate lists with equal elements."
      - "Both names refer to the same list object."
      - "Rebinding either name will rebind the other name."
    correct_index: 1
    option_feedback:
      0: "Assignment copies a reference, without making another list."
      2: "Names remain separate bindings even when they refer to the same object."
    explanation: "Object sharing and name binding are distinct. Mutating the shared list can be observed through either name, while rebinding one name leaves the other binding alone."

  # Sources: essential_python.pptx, slides 10, 13; Homework Problems, PYTHON4.
  - id: string-rebinding
    type: single
    difficulty: intermediate
    bloom: apply
    question: |
      What does this Python code print?

      ```python
      label = "go"
      saved = label
      label += "!"
      print(saved, label)
      ```
    options: ["`go go`", "`go! go!`", "`go go!`"]
    correct_index: 2
    option_feedback:
      0: "The augmented assignment updates the `label` binding to the concatenated string."
      1: "Strings are immutable; updating `label` does not change the string observed through `saved`."
    explanation: "`saved` retains the original string. `label` refers to the concatenated string after the assignment."

  # Sources: essential_python.pptx, slides 14–16; Homework Problems, PYTHON2–3.
  - id: mutation-then-parameter-rebinding
    type: single
    difficulty: advanced
    bloom: analyze
    question: |
      What does this Python code print?

      ```python
      def route(queue):
          queue = queue[1:]
          queue[0].append("ready")
          queue.append(["new"])
      batches = [["old"], ["next"]]
      route(batches)
      print(batches)
      ```
    options:
      - '`[["old"], ["next"]]`'
      - '`[["old"], ["next", "ready"]]`'
      - '`[["next", "ready"], ["new"]]`'
    correct_index: 1
    option_feedback:
      0: Slicing separates the outer list but keeps its inner lists shared. The append to an inner list
        remains visible.
      2: The sliced outer list belongs to the local parameter. Removing the first slot and appending a new
        slot do not change the caller's outer list.
    explanation: Rebinding first can still leave reachable objects shared. The slice contains a reference
      to the original second inner list, so its mutation propagates; changes to the new outer list do not.

  # Sources: essential_python.pptx, slide 7; Homework Problems, PYTHON4; F24 midterm, Q4 pp. 7–8.
  - id: shallow-copy-two-level-trace
    type: single
    difficulty: advanced
    bloom: analyze
    question: |
      What does this Python code print?

      ```python
      from copy import copy
      task = {"steps": []}
      queue = [task, task]
      preview = copy(queue)
      preview.pop()
      preview[0]["steps"].append("check")
      print(len(queue), queue[0] is queue[1], queue[1]["steps"])
      ```
    options:
      - '`2 False []`'
      - '`1 True ["check"]`'
      - '`2 True ["check"]`'
    correct_index: 2
    option_feedback:
      0: A shallow copy does not split the two references to the shared task. The nested steps list is still
        shared.
      1: The pop removes a slot from preview only. The original queue retains both of its slots.
    explanation: There are two outer lists but only one task object. Both original slots still reach that
      task and its edited steps list.

  # Sources: essential_python.pptx, slide 7; Homework Problems, PYTHON4.
  - id: deep-copy-snapshot
    type: single
    difficulty: intermediate
    bloom: apply
    question: "A snapshot of a nested list of integers must remain unchanged when any original inner list is edited. Which operation provides that isolation? Assume ordinary built-in lists."
    options: ["`snapshot = original`", "`snapshot = copy.copy(original)`", "`snapshot = copy.deepcopy(original)`"]
    correct_index: 2
    option_feedback:
      0: "Assignment keeps the entire original object shared."
      1: "Copying only the outer list leaves the mutable inner lists shared."
    explanation: "A deep copy recursively copies the nested mutable lists. Sharing immutable integer values does not undermine isolation from later list edits."

  # Sources: essential_python.pptx, slide 8; Homework Problems, PYTHON4.
  - id: list-equality-versus-identity
    type: multiple
    difficulty: intermediate
    bloom: analyze
    question: "After `a = [5]`, `b = [5]`, and `c = a` in Python, which expressions are true? Select all that apply."
    options: ["`a == b`", "`a is b`", "`a is c`", "`b is c`"]
    correct_indices: [0, 2]
    option_feedback:
      0: "List equality compares corresponding elements, which are equal here."
      1: "The separate list literals create distinct objects even though their elements are equal."
      2: "Assignment binds `c` to the same object as `a`."
      3: "`c` shares `a`'s object; it does not share the separately created list `b`."
    explanation: "Equality asks whether list contents compare equal; identity asks whether two references designate the same object."

  # Source: essential_python.pptx, slide 8.
  - id: default-user-class-equality
    type: single
    difficulty: intermediate
    bloom: apply
    question: |
      What does this Python code print? `Ticket` has no custom equality behavior.

      ```python
      from copy import copy
      class Ticket:
          pass
      issued = Ticket()
      issued.code = "R7"
      replacement = copy(issued)
      queue = [issued]
      print(replacement in queue, issued in queue)
      ```
    options:
      - '`True True`'
      - '`False False`'
      - '`False True`'
    correct_index: 2
    option_feedback:
      0: Copying the fields does not give the replacement the original identity or add value-based equality.
      1: The original object is a member of the list containing that same object.
    explanation: List membership compares against its elements. For this class, the copied ticket is distinct
      and does not compare equal to the original; the original ticket matches itself.

  # Sources: essential_python.pptx, slide 5; Homework Problems, PYTHON5.
  - id: shared-class-list
    type: single
    difficulty: intermediate
    bloom: apply
    question: |
      What does this Python code print?

      ```python
      class Group:
          members = []
      left, right = Group(), Group()
      left.members.append("Ada")
      print(right.members)
      ```
    options: ["`[]`", "`['Ada']`", "An attribute lookup error."]
    correct_index: 1
    option_feedback:
      0: "Neither instance has its own `members` binding; both attribute lookups find the class's list."
      2: "Instance lookup can find an attribute defined on its class."
    explanation: "The append mutates the shared class attribute. Per-instance collections should normally be initialized on `self` for each instance."

  # Source: essential_python.pptx, slide 5.
  - id: instance-shadowing-class-attribute
    type: single
    difficulty: advanced
    bloom: analyze
    question: |
      What does this Python code print?

      ```python
      class Meter:
          unit = "m"
      a, b = Meter(), Meter()
      a.unit = "cm"
      Meter.unit = "km"
      print(a.unit, b.unit)
      ```
    options: ["`km km`", "`cm m`", "`cm km`"]
    correct_index: 2
    option_feedback:
      0: "Assigning `a.unit` creates an instance attribute that shadows the class attribute for `a`."
      1: "`b` has no instance attribute named `unit`; its lookup sees the current class value."
    explanation: "`a` owns its overriding attribute. `b` continues to find `Meter.unit`, whose value changes to `km`."

  # Source: essential_python.pptx, slide 17.
  - id: mutable-default-timing
    type: single
    difficulty: intermediate
    bloom: apply
    question: |
      What does this Python code print?

      ```python
      def visit(page, counts={}):
          counts[page] = counts.get(page, 0) + 1
          return counts[page]
      print(visit("help"), visit("help", {}), visit("help"))
      ```
    options:
      - '`1 1 1`'
      - '`1 1 2`'
      - '`1 2 3`'
    correct_index: 1
    option_feedback:
      0: The first and third calls reuse the dictionary created with the function definition.
      2: The middle call supplies its own dictionary, so it does not update the default dictionary.
    explanation: Omitted and explicit arguments take different sharing paths. The two omitted calls share
      their counter; the explicit empty dictionary is independent.

  # Sources: essential_python.pptx, slide 17; Homework Problems, PYTHON2, PYTHON4.
  - id: sentinel-preserves-explicit-empty-list
    type: single
    difficulty: advanced
    bloom: evaluate
    question: "A function uses `items=None` as its default. It should allocate a list when omitted, but mutate an explicitly supplied empty list. Which initialization preserves that contract?"
    options:
      - "`if items is None: items = []`"
      - "`if not items: items = []`"
      - "`items = list(items or [])`"
    correct_index: 0
    option_feedback:
      1: "An empty list is false in a condition, so this replaces a caller-supplied list and breaks sharing."
      2: "Constructing a new list replaces the caller's object, even when preserving its elements."
    explanation: "The sentinel test distinguishes omission from a valid empty collection. The parameter retains the caller's object when one was explicitly provided."

  # Sources: essential_python.pptx, slides 10, 13; Homework Problems, PYTHON4.
  - id: tuple-containing-mutable-list
    type: single
    difficulty: advanced
    bloom: analyze
    question: |
      A Python function unpacks a tuple containing a mutable list. What does the caller observe?

      ```python
      def finish(job):
          label, notes = job
          notes.clear()
          label = "done"
      job = ("waiting", ["retry"])
      finish(job)
      print(job)
      ```
    options:
      - '`("done", [])`'
      - '`("waiting", ["retry"])`'
      - '`("waiting", [])`'
    option_feedback:
      0: Unpacking creates a separate local label binding. Reassigning it does not replace the tuple's first
        slot.
      1: The local notes binding refers to the list stored in the tuple. Clearing that list mutates the
        shared object.
    explanation: Tuple immutability protects its slots. Unpacking copies references into local bindings,
      so a local can mutate the referenced list without replacing a tuple slot.
    correct_index: 2

  # Sources: essential_python.pptx, slide 9; Homework Problems, PYTHON5 A.
  - id: subclass-initialization
    type: single
    difficulty: advanced
    bloom: analyze
    question: |
      This Python subclass does call the base initializer. Why does construction still fail?

      ```python
      class Encoder:
          def __init__(self):
              self.preview = self.encode("x")
          def encode(self, text):
              return text
      class Framed(Encoder):
          def __init__(self):
              super().__init__()
              self.marker = "#"
          def encode(self, text):
              return self.marker + text
      Framed()
      ```
    options:
      - The base initializer cannot call any instance method.
      - The override runs before its required field is initialized.
      - Calling super selects the base implementation of every method.
    correct_index: 1
    option_feedback:
      0: The method call is legal. The failure comes from a missing attribute read inside the selected override.
      2: super selects Encoder.__init__, but self still refers to a Framed instance. Its ordinary method
        call can dispatch to the override.
    explanation: Initialization order must satisfy the fields used by methods that run during construction.
      Set marker before calling the base initializer, or avoid calling an overridable method from initialization.

  # Sources: essential_python.pptx, slides 12–13; Homework Problems, PYTHON4.
  - id: alias-through-container
    type: single
    difficulty: intermediate
    bloom: analyze
    question: |
      What does this Python code print?

      ```python
      row = [1]
      active = [row]
      archived = active.pop()
      archived.append(2)
      print(row, active)
      ```
    options:
      - '`[1] []`'
      - '`[1, 2] []`'
      - '`[1, 2] [[1, 2]]`'
    option_feedback:
      0: pop returns a reference to the removed object, not a copy. archived and row still share the list.
      2: Removing the outer-list slot is permanent here. Mutating the removed object does not put it back
        into active.
    explanation: Container membership and object identity are separate. The outer list becomes empty while
      row and archived keep the removed object available.
    correct_index: 1

  # Source: essential_python.pptx, slide 12.
  - id: list-operation-costs
    type: single
    difficulty: intermediate
    bloom: apply
    question: "A Python list contains n ordinary integers. Compare reading a valid `items[j]` with checking `target in items` when the target is absent. Assume the standard array-backed list and constant-time integer comparisons."
    options:
      - "Both operations take constant time."
      - "Indexing is constant time; membership is linear."
      - "Both operations scan all n elements."
    correct_index: 1
    option_feedback:
      0: "A list has no membership index that can prove an element absent without searching."
      2: "Array-backed storage can compute an element's location directly from its index."
    explanation: "Indexing accesses one slot, O(1). An unsuccessful membership check examines all n values, O(n), under the stated comparison-cost assumption."

  # Sources: essential_python.pptx, slide 7; Homework Problems, PYTHON3–4; Quiz 1 solutions, Q2 C–D.
  - id: choose-copy-boundary
    type: single
    difficulty: advanced
    bloom: evaluate
    question: "A function must reorder a list of mutable records without reordering the caller's list. Updates to each record must remain shared with the caller. Which copying policy matches both requirements?"
    options:
      - "Copy only the outer list before reordering."
      - "Deep-copy the records before reordering."
      - "Reorder the caller's original list directly."
    correct_index: 0
    option_feedback:
      1: "Copying the records breaks the required sharing of record updates."
      2: "Reordering the original list changes the caller's order, violating the other requirement."
    explanation: "A shallow copy separates the sequence of references while retaining the referenced records. Copy depth should follow the ownership and sharing contract."

  # Source concepts: essential_python.pptx, slide 7; Homework Problems, PYTHON3–4.
  # Original transfer task: independently copy nested rows before marking a row.
  - id: cs131-python-parsons-isolated-row-update
    type: parsons
    display: block
    difficulty: intermediate
    bloom: apply
    question: |
      Arrange the Python lines to implement `mark_first(rows)`. The input is a nonempty list of lists of strings. Return a new nested list with `"checked"` appended to its first row. Every returned row must be independent of the input rows, and the input must remain unchanged. Leave the extra line unused; indentation is supplied.
    lines:
      - "def mark_first(rows):"
      - "    updated = [row.copy() for row in rows]"
      - "    updated[0].append('checked')"
      - "    return updated"
    distractors:
      - "    updated = rows.copy()"
    explanation: |
      Copy the outer list and each row before appending the marker. A copy of only the outer list still shares its rows, so appending through `updated[0]` would also change the input. Copying the strings themselves is unnecessary because strings are immutable.
