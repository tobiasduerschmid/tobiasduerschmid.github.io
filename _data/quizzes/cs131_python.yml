questions:
  # Lecture: essential_python_handouts_td.pdf, pp. 22–24
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 2B (parameter mutation and rebinding).
  - id: cs131-v2-python-two-parameters-one-list
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      What does this code print?

      ```python
      def edit(left, right):
          left.append(3)
          right = [9]
          return right
      items = [1]
      result = edit(items, items)
      print(items, result)
      ```
    options:
      - '`[1, 3] [9]`'
      - '`[9] [9]`'
      - '`[1] [9]`'
    correct_index: 0
    option_feedback:
      1: The parameters are separate local names. Rebinding `right` does not replace the object named by `items` or `left`.
      2: Both parameters initially refer to the caller's list, so the append is visible through `items`.
    explanation: Both arguments share one list initially. The append changes that list; the assignment gives only `right` a new list, which is returned.

  # Lecture: essential_python_handouts_td.pdf, pp. 20–21
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 2C–D (nested references and replacement).
  - id: cs131-v2-python-old-row-still-reachable
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      What does this code print?

      ```python
      row = [2]
      grid = [row]
      grid[0] = [6]
      row.append(4)
      print(row, grid)
      ```
    options:
      - '`[2, 4] [[6, 4]]`'
      - '`[2, 4] [[6]]`'
      - '`[2] [[6, 4]]`'
    correct_index: 1
    option_feedback:
      0: Replacing `grid[0]` disconnects that slot from the old row before the append.
      2: '`row` still names the original list; replacing the grid slot does not rebind `row`.'
    explanation: The assignment replaces one reference inside `grid`. The old list is still reachable through `row` and receives the append.

  # Lecture: essential_python_handouts_td.pdf, pp. 10,20–21
  # Assessment: [Midterm] F24 V1 (Public).pdf, Problem 4 Parts B–D, p. 7 (top-level assignment versus nested mutation).
  - id: cs131-v2-python-shallow-copy-slot-versus-child
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 75
    question: |-
      What does this code print?

      ```python
      from copy import copy
      original = [[1], [2]]
      draft = copy(original)
      draft[0] = [7]
      draft[1].append(8)
      print(original)
      ```
    options:
      - '`[[1], [2]]`'
      - '`[[7], [2, 8]]`'
      - '`[[1], [2, 8]]`'
    correct_index: 2
    option_feedback:
      0: The second inner list is shared after a shallow copy, so its append reaches the original.
      1: The two outer lists have separate slots. Replacing `draft[0]` does not replace `original[0]`.
    explanation: The shallow copy gives `draft` its own outer list while sharing the original children. Rebinding one slot is isolated; mutating the other child is shared.

  # Lecture: essential_python_handouts_td.pdf, pp. 10
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 2E (deep copy followed by field and slot changes).
  - id: cs131-v2-python-deep-copy-before-later-edit
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      What does this code print?

      ```python
      from copy import deepcopy
      source = [[4]]
      saved = deepcopy(source)
      source[0].append(5)
      saved.append([6])
      print(source, saved)
      ```
    options:
      - '`[[4, 5], [6]] [[4, 5], [6]]`'
      - '`[[4, 5]] [[4], [6]]`'
      - '`[[4, 5]] [[4, 5], [6]]`'
    correct_index: 1
    option_feedback:
      0: A deep copy creates a separate outer list, so appending to `saved` does not extend `source`.
      2: Deep copying also copies the mutable inner list, so the later append of 5 is isolated.
    explanation: The saved inner list retains `[4]`. The two subsequent changes affect different object graphs.

  # Lecture: essential_python_handouts_td.pdf, pp. 9,20–24
  # Assessment: [Midterm] F23 (Public).pdf, Problem 1, pp. 2–3 (returned list references and later member replacement).
  - id: cs131-v2-python-returned-alias-after-field-change
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 90
    question: |-
      What does this code print?

      ```python
      class Notes:
          def __init__(self):
              self.lines = [1]
          def replace(self):
              previous = self.lines
              self.lines = [2]
              return previous
      book = Notes()
      saved = book.replace()
      saved.append(3)
      print(book.lines, saved)
      ```
    options:
      - '`[2, 3] [1, 3]`'
      - '`[1, 3] [1, 3]`'
      - '`[2] [1, 3]`'
    correct_index: 2
    option_feedback:
      0: The returned reference points to the old list, not to the member variable itself.
      1: The method replaces `book.lines` even though another reference keeps the old list alive.
    explanation: '`previous` captures the old list reference before the member is rebound. Appending through the returned reference changes only that old list.'

  # Lecture: essential_python_handouts_td.pdf, pp. 9,20–21
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 2C–D (shared children versus replacing a child).
  - id: cs131-v2-python-edits-through-two-paths
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 75
    question: |-
      After this setup, consider each option independently. Which statements make `other[0]` equal to `[5, 7]`? Select all that apply.

      ```python
      child = [5]
      outer = [child]
      other = [child]
      ```
    options:
      - '`outer[0].append(7)`'
      - '`outer[0] = outer[0] + [7]`'
      - '`child.append(7)`'
      - '`child = [5, 7]`'
    correct_indices:
      - 0
      - 2
    option_feedback:
      0: '`outer[0]` and `other[0]` reach the same child, so mutation through either path is visible.'
      1: This replaces a slot in `outer`; it does not replace the slot in `other`.
      2: The original child is still referenced by `other[0]`.
      3: Rebinding the name `child` leaves existing container references pointing to the old list.
    explanation: Only the append operations mutate the shared child. The two assignments replace one binding or slot without changing the child.

  # Lecture: essential_python_handouts_td.pdf, pp. 6–7
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 2A (object-state trace family; class counters are a lecture extension).
  - id: cs131-v2-python-class-counter-instance-stamp
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      What does this code print?

      ```python
      class Ticket:
          issued = 0
          def __init__(self):
              Ticket.issued += 1
              self.number = Ticket.issued
      first = Ticket()
      second = Ticket()
      print(first.number, second.number, Ticket.issued)
      ```
    options:
      - '`1 2 2`'
      - '`2 2 2`'
      - '`1 1 1`'
    correct_index: 0
    option_feedback:
      1: Each `number` is an instance field holding the integer assigned during that particular construction.
      2: '`Ticket.issued` belongs to the class and is incremented by both constructions.'
    explanation: 'The shared counter ends at 2. The instance fields retain the values they received: 1 for `first`, 2 for `second`.'

  # Lecture: essential_python_handouts_td.pdf, pp. 13
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 2A (object-state reasoning family; custom equality is a lecture extension).
  - id: cs131-v2-python-custom-equality-projection
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      What does this code print? Assume both operands of `==` are `Label` objects.

      ```python
      class Label:
          def __init__(self, text):
              self.text = text
          def __eq__(self, other):
              return self.text == other.text
      a = Label("ready")
      b = Label("ready")
      print(a == b, a is b)
      ```
    options:
      - '`False False`'
      - '`True False`'
      - '`True True`'
    correct_index: 1
    option_feedback:
      0: The supplied `__eq__` method compares the text fields, which have equal values.
      2: '`is` checks object identity and does not call `__eq__`; these are two separate constructions.'
    explanation: The equality method makes the two labels equal by value. Identity remains different because `a` and `b` refer to distinct objects.

  # Lecture: essential_python_handouts_td.pdf, pp. 14–16
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 2A (method/output-trace family; dispatch is a lecture extension).
  - id: cs131-v2-python-inherited-method-calls-hook
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      What does this code print?

      ```python
      class Writer:
          def publish(self):
              print(self.word())
          def word(self):
              return "draft"
      class Editor(Writer):
          def word(self):
              return "final"
      Editor().publish()
      ```
    options:
      - '`draft`'
      - '`final`'
      - An attribute error
    correct_index: 1
    option_feedback:
      0: The inherited method calls `self.word()` on an `Editor` instance, so it uses the override.
      2: '`publish` is inherited from `Writer`; it can be called on an `Editor` instance.'
    explanation: Inheritance supplies `publish`, and the runtime object determines the implementation used for `self.word()`.

  # Lecture: essential_python_handouts_td.pdf, pp. 8–10
  # Assessment: [Midterm] F24 V1 (Public).pdf, Problem 4, p. 7 (constructor stores a supplied list reference).
  - id: cs131-v2-python-constructor-copy-reference
    type: single
    difficulty: basic
    bloom: understand
    estimated_seconds: 30
    question: A constructor uses `self.values = values`. A caller later appends to the supplied list. Which explanation accounts for the object seeing that new element?
    options:
      - The field and caller share one list.
      - The constructor runs again on append.
      - The field receives a copy on every read.
    correct_index: 0
    option_feedback:
      1: Construction happens when the object is created, not when the external list later changes.
      2: Reading an instance field retrieves its stored reference; it does not create a refreshed copy.
    explanation: Assigning the argument to a field stores the same list reference. A later mutation is visible along both paths.

  # Lecture: essential_python_handouts_td.pdf, pp. 10
  # Assessment: [Midterm] F24 V1 (Public).pdf, Problem 4 Parts A–D, p. 7 (distinguish aliases, shallow copies and deep copies).
  - id: cs131-v2-python-copy-contract-checks
    type: multiple
    difficulty: intermediate
    bloom: evaluate
    estimated_seconds: 60
    question: |-
      A reviewer claims that `b = copy(a)` makes an independent outer list but shares its inner lists. After this setup, which expressions directly confirm that claim? Select all that apply.

      ```python
      from copy import copy
      a = [[3], [8]]
      b = copy(a)
      ```
    options:
      - '`a is not b`'
      - '`a[0] is b[0]`'
      - '`a[1] is not b[1]`'
      - '`a is b`'
    correct_indices:
      - 0
      - 1
    option_feedback:
      0: Different outer identities confirm a new top-level list.
      1: The shared child identity confirms that copying was shallow.
      2: Both original children are reused by the shallow copy.
      3: This would describe an assignment alias, not a shallow copy.
    explanation: Outer identity and child identity test different parts of the copying claim. Equality alone would not distinguish copy depths.

  # Lecture: essential_python_handouts_td.pdf, pp. 22–24
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 2B (mutation before local concatenation).
  - id: cs131-v2-python-mutated-argument-and-returned-copy
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 75
    question: |-
      What does this code print?

      ```python
      def revise(values):
          values[0] = 4
          return values + [7]
      start = [1, 2]
      end = revise(start)
      end[1] = 9
      print(start, end)
      ```
    options:
      - '`[4, 9] [4, 9, 7]`'
      - '`[1, 2] [4, 9, 7]`'
      - '`[4, 2] [4, 9, 7]`'
    correct_index: 2
    option_feedback:
      0: List concatenation creates a separate outer list; editing its second slot is isolated.
      1: The indexed assignment happens before concatenation and mutates the caller's list.
    explanation: The original list becomes `[4, 2]`. The returned concatenation initially contains `[4, 2, 7]`, then its second slot is replaced with 9.

  # Lecture: essential_python_handouts_td.pdf, pp. 10,20–21
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 2E (deep copying before edits).
  - id: cs131-v2-python-build-detached-row-edit
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 75
    question: Arrange a function that returns a deep-copied version of a nonempty nested list with 7 appended to its first row. The input and all its rows must stay unchanged. Assume `copy` and `deepcopy` are already imported.
    display: block
    lines:
      - 'def edited(rows):'
      - '    result = deepcopy(rows)'
      - '    result[0].append(7)'
      - '    return result'
    distractors:
      - '    result = rows'
      - '    result = copy(rows)'
    explanation: Copy the complete nested structure before mutating its first row. Assignment and shallow copying both leave that row shared.

  # Lecture: essential_python_handouts_td.pdf, pp. 22–24
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 2B (mutation and local list concatenation).
  - id: cs131-v2-python-build-mutate-then-detach
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 75
    question: Arrange a function that appends 4 to the caller's list, then returns a separate list with an additional 8. For input `[1]`, the caller must hold `[1, 4]` and the result must be `[1, 4, 8]`.
    display: block
    lines:
      - 'def extend(items):'
      - '    items.append(4)'
      - '    items = items + [8]'
      - '    return items'
    distractors:
      - '    items.append(8)'
      - '    items = items + [4]'
    explanation: 'Append before concatenating: the first step must mutate the shared input, and the second must create a distinct result. Reversing them would append 4 only to the detached list.'

  # Lecture: essential_python_handouts_td.pdf, pp. 10
  # Assessment: [Midterm] F24 V1 (Public).pdf, Problem 4 Part D, p. 7 (nested mutation survives a shallow copy).
  - id: cs131-v2-python-repair-nested-copy
    type: single
    difficulty: intermediate
    bloom: evaluate
    estimated_seconds: 60
    question: |-
      This function must return an edited copy of a nonempty nested list while leaving every input row unchanged. Which replacement for the marked line meets that contract? Assume ordinary lists of integers.

      ```python
      from copy import copy, deepcopy
      def preview(rows):
          result = copy(rows)  # replace this line
          result[0].append(0)
          return result
      ```
    options:
      - '`result = rows`'
      - '`result = deepcopy(rows)`'
      - '`result = copy(copy(rows))`'
    correct_index: 1
    option_feedback:
      0: Assignment shares the entire input object graph.
      2: Copying the outer list twice still reuses the same inner lists.
    explanation: A deep copy duplicates the mutable rows before the append. Repeated shallow copies only add more independent outer containers.

  # Lecture: essential_python_handouts_td.pdf, pp. 9,22–24
  # Assessment: [Midterm] F23 (Public).pdf, Problem 1, pp. 2–3 (returned aliases outlive local rebinding).
  - id: cs131-v2-python-return-reference-before-rebind
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      What does this code print?

      ```python
      def keep_first(values):
          saved = values
          values = [0]
          return saved
      original = [6]
      returned = keep_first(original)
      returned.append(8)
      print(original is returned, original)
      ```
    options:
      - '`False [6]`'
      - '`True [0, 8]`'
      - '`True [6, 8]`'
    correct_index: 2
    option_feedback:
      0: Returning `saved` passes back the original reference, not a copy.
      1: Only the local name `values` is rebound to `[0]`; `saved` keeps the original reference.
    explanation: The local assignment does not affect `saved` or `original`. The returned list is the original object, so the later append changes it.
