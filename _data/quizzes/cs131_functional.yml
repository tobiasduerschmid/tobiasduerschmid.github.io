title: 'CS 131: Functional Programming and Haskell'
description: Complete recursion, infer types, trace folds, predict evaluation results, and assemble short Haskell expressions.
active: true
# All items are newly authored. Times are planning estimates, not learner-calibrated limits.
questions:
  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 67–69
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 3b (complete recursion on a count and list).
  - id: cs131-v2-functional-skip-recursive-step
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      Complete `skip`, which discards the first `n` items, or all items if the list is shorter. Assume `n >= 0`.

      ```haskell
      skip _ [] = []
      skip 0 xs = xs
      skip n (x:xs) = ___
      ```
    options:
      - '`x : skip (n-1) xs`'
      - '`skip (n-1) xs`'
      - '`skip (n-1) (x:xs)`'
    correct_index: 1
    option_feedback:
      0: Consing the removed head back onto the result preserves an item that the function must discard.
      2: Decreasing the count without removing the head eventually returns the original list.
    explanation: Each recursive step removes one input item and consumes one unit of the count. When the count reaches zero, the unprocessed suffix is returned.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 67–69
  # Assessment: [Midterm] F24 V1 (Public).pdf, Problem 1, p. 2 (trace list recursion and base cases).
  - id: cs131-v2-functional-pairwise-recursion-trace
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      What is `groupSums [2,5,4,1,8]`?

      ```haskell
      groupSums [] = []
      groupSums [x] = [x]
      groupSums (x:y:rest) = (x+y) : groupSums rest
      ```
    options:
      - '`[7, 5, 8]`'
      - '`[7, 9, 5, 9]`'
      - '`[7, 5]`'
    correct_index: 0
    option_feedback:
      1: The pattern removes two items per call; the pairs do not overlap.
      2: The singleton case retains an unpaired final element instead of discarding it.
    explanation: The calls process `[2,5]`, then `[4,1]`, then the singleton `[8]`. Their contributions are 7, 5, and 8.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 67–69,89
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 3b (recursive completion).
  - id: cs131-v2-functional-recursive-selection-repair
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |-
      `positives` should retain positive integers in order. Which expression fills the blank?

      ```haskell
      positives [] = []
      positives (x:xs)
        | x > 0 = x : positives xs
        | otherwise = ___
      ```
    options:
      - '`xs`'
      - '`positives (x:xs)`'
      - '`positives xs`'
    correct_index: 2
    option_feedback:
      0: Returning the tail unchanged can leave later nonpositive elements in the result.
      1: This repeats the same input and cannot progress past a nonpositive head.
    explanation: Dropping the current head is only one step. The remaining tail still needs the same selection rule.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 35,65–68
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 3b (list patterns in recursive code).
  - id: cs131-v2-functional-nested-pattern-bindings
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: The Haskell pattern `(first:second:rest)` is matched against `[[1,2], [], [3]]`. Which bindings result? Select all that apply.
    options:
      - '`first = [1,2]`'
      - '`second = []`'
      - '`rest = [[3]]`'
      - '`rest = [3]`'
    correct_indices:
      - 0
      - 1
      - 2
    option_feedback:
      0: The first element of the outer list is itself the list `[1,2]`.
      1: An empty inner list is still a complete element of the outer list.
      2: The remaining outer list contains one inner list, `[3]`.
      3: The tail keeps the outer list level; pattern matching does not flatten it.
    explanation: Each colon removes one element from the outer list. `rest` contains whatever outer elements remain, retaining their nested structure.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 86,88
  # Assessment: [Midterm] F23 (Public).pdf, Problem 3a–b, p. 6 (choose map versus filter).
  - id: cs131-v2-functional-map-boolean-results
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      What is the pair of results?

      ```haskell
      map (\x -> x > 3) [2,5,4]
      filter (\x -> x > 3) [2,5,4]
      ```
    options:
      - '`[5,4]` and `[True,True]`'
      - '`[False,True,True]` and `[5,4]`'
      - '`[False,True,True]` and `[True,True]`'
    correct_index: 1
    option_feedback:
      0: '`map` keeps one result per input element and uses the predicate''s Boolean return values.'
      2: '`filter` returns the original elements for which the predicate succeeds, not the returned Booleans.'
    explanation: Mapping transforms all three elements into Booleans. Filtering retains two original integers.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 86,88,106–107
  # Assessment: [Midterm] F23 (Public).pdf, Problem 3, pp. 6–7 (compose selection and transformation).
  - id: cs131-v2-functional-pipeline-order-counterexample
    type: single
    difficulty: intermediate
    bloom: evaluate
    estimated_seconds: 60
    question: Here `abs` returns the absolute value of its argument. For `xs = [-2,3]`, compare `map abs (filter (\x -> x > 0) xs)` with `filter (\x -> x > 0) (map abs xs)`. Which conclusion is justified?
    options:
      - Both produce `[3]`; these operations commute.
      - Both produce `[2,3]`; absolute value runs first.
      - They produce `[3]` and `[2,3]`; order matters.
    correct_index: 2
    option_feedback:
      0: The second expression transforms -2 to 2 before testing positivity, so it retains that element.
      1: The first expression removes -2 before `abs` ever receives it.
    explanation: Selection tests different values in the two pipelines. A negative input supplies a counterexample to freely swapping these stages.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 91–94
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 3c and Problem 4b (accumulator recursion and folding).
  - id: cs131-v2-functional-fold-positional-accumulator
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      What does this expression evaluate to?

      ```haskell
      foldl (\acc digit -> 10*acc + digit) 0 [2,4,1]
      ```
    options:
      - '`7`'
      - '`241`'
      - '`142`'
    correct_index: 1
    option_feedback:
      0: The accumulator is multiplied by 10 before each new digit is added; this is not a simple sum.
      2: '`foldl` processes the input left to right, so 2 contributes before 4 and 1.'
    explanation: The accumulator takes the values 0, 2, 24, and 241. Its update rule determines the result, not merely the presence of a fold.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 39–40,91–94
  # Assessment: [Midterm] F23 (Public).pdf, Problem 3d, p. 7 (build a list with a fold).
  - id: cs131-v2-functional-fold-string-order
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      What does this expression evaluate to?

      ```haskell
      foldl (\acc word -> word ++ acc) "" ["go", "up", "now"]
      ```
    options:
      - '`"goupnow"`'
      - '`"nowupgo"`'
      - '`"now"`'
    correct_index: 1
    option_feedback:
      0: Each incoming word is placed before the accumulated string, not after it.
      2: The new word is concatenated with the existing accumulator; it does not replace it.
    explanation: The successive accumulators are `"go"`, `"upgo"`, and `"nowupgo"`. Left-to-right folding can still build output in reverse order.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 35,73–74,86
  # Assessment: [Midterm] F24 V1 (Public).pdf, Problem 3B–C, p. 5 (infer polymorphic higher-order types).
  - id: cs131-v2-functional-same-element-type-constraint
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |-
      What is the most general type of this function?

      ```haskell
      collect f x = [x, f x]
      ```
    options:
      - '`(a -> b) -> a -> [b]`'
      - '`(a -> a) -> a -> [a]`'
      - '`a -> (a -> a) -> [a]`'
    correct_index: 1
    option_feedback:
      0: Both `x` and `f x` occupy one homogeneous list, so they must have the same type.
      2: The first parameter is applied as a function; the second is its argument.
    explanation: 'If `x :: a`, the list forces `f x :: a` too. Thus `f :: a -> a`, and the result is `[a]`.'

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 91–92,114,122–123
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 3c (type after partial application of accumulator recursion).
  - id: cs131-v2-functional-partially-applied-fold-type
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      Given these signatures, what is the type of `build`?

      ```haskell
      combine :: [Int] -> Int -> [Int]
      foldl :: (b -> a -> b) -> b -> [a] -> b
      build = foldl combine []
      ```
    options:
      - '`Int -> [Int]`'
      - '`[Int] -> [Int]`'
      - '`[[Int]] -> [Int]`'
    correct_index: 1
    option_feedback:
      0: The combining function handles one integer at a time, but the partially applied fold still expects a whole input list.
      2: The accumulator is a list, but each input element is the second argument of `combine`, an `Int`.
    explanation: The accumulator type `b` is `[Int]`, and the element type `a` is `Int`. Supplying the function and seed leaves `[Int] -> [Int]`.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 122–123
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 5 (remove only redundant curry parentheses).
  - id: cs131-v2-functional-function-argument-parentheses
    type: single
    difficulty: basic
    bloom: understand
    estimated_seconds: 30
    question: Which type is equivalent to `(String -> Int) -> ([String] -> Int)` with only redundant parentheses removed?
    options:
      - '`String -> Int -> [String] -> Int`'
      - '`(String -> Int) -> [String] -> Int`'
      - '`String -> (Int -> [String]) -> Int`'
    correct_index: 1
    option_feedback:
      0: Removing the first pair changes one function-valued argument into separate `String` and `Int` arguments.
      2: This groups a different function type as an argument and changes the contract.
    explanation: Arrows associate to the right. Parentheses around the result function are redundant, while those around the function-valued first argument are necessary.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 120–123
  # Assessment: [Midterm] F24 V1 (Public).pdf, Problem 3D, p. 6 (write an explicitly curried body).
  - id: cs131-v2-functional-assemble-explicit-currying
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 75
    question: Arrange the fragments after `decorate =` to rewrite `decorate f x suffix = f x ++ suffix` as nested single-argument lambdas. Preserve the argument order `f`, `x`, then `suffix`. You may assume `f x` and `suffix` are strings.
    display: inline
    lines:
      - '\f -> '
      - '\x -> '
      - '\suffix -> '
      - 'f x '
      - ++ suffix
    distractors:
      - 'suffix ++ '
      - f suffix
    explanation: Each arrow introduces exactly the next argument. The body must apply `f` to `x` before appending `suffix`; swapping those roles changes the function.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 132,141
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 4a; [Midterm] F23 (Public).pdf, Problem 2a, p. 4 (construct a recursive algebraic value).
  - id: cs131-v2-functional-recursive-constructor-values
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |-
      For this definition, which expressions are complete values of type `Chain`? Select all that apply.

      ```haskell
      data Chain = End | Link String Chain
      ```
    options:
      - '`Link "a" End`'
      - '`Link "a" (Link "b" End)`'
      - '`Link End "a"`'
      - '`Link "a"`'
    correct_indices:
      - 0
      - 1
    option_feedback:
      0: '`Link` receives a string followed by a complete tail value.'
      1: A nested `Link` is a valid value for the recursive tail field.
      2: 'The constructor fields have a fixed order: the string precedes the `Chain`.'
      3: Supplying only the string leaves a function expecting its `Chain` argument.
    explanation: The constructor has type `String -> Chain -> Chain`. A complete node supplies both fields, ending eventually in `End` for these finite examples.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 91–92,132,141–142
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 4b (combine the current node with recursive child results).
  - id: cs131-v2-functional-tree-fold-recursive-contribution
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 75
    question: |-
      Complete `total`, which sums the integer weights of a finite tree.

      ```haskell
      data Tree = Branch Int [Tree]
      total (Branch weight children) =
        foldl (\acc child -> ___) weight children
      ```
    options:
      - '`acc + total child`'
      - '`weight + total child`'
      - '`total child`'
    correct_index: 0
    option_feedback:
      1: Using the original weight each time discards earlier children's accumulated contributions.
      2: Returning only the current child's total loses the parent and previously processed children.
    explanation: The seed counts the current node once. Each fold step adds one child subtree's total to the accumulated sum.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 86,88,91–94,106–107
  # Assessment: [Midterm] F23 (Public).pdf, Problem 3, pp. 6–7 (compose map, filter and fold).
  - id: cs131-v2-functional-assemble-select-square-sum
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 75
    question: Arrange one expression that sums the squares of only the positive integers in `values`. Negative integers must be discarded before squaring. Use all four required fragments.
    display: inline
    lines:
      - 'foldl (+) 0 '
      - '(map (\x -> x*x) '
      - '(filter (\x -> x > 0) '
      - values))
    distractors:
      - '(map (\x -> x+x) '
      - '(filter (\x -> x*x > 0) '
    explanation: The innermost filter removes nonpositive inputs, map squares what remains, and fold adds the squares. Squaring before checking positivity would incorrectly admit negative inputs.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 132,139–142
  # Assessment: [Midterm] F24 V1 (Public).pdf, Problem 2, pp. 3–4 (skip a node's own contribution but still visit descendants).
  - id: cs131-v2-functional-tree-pruning-counterexample
    type: single
    difficulty: intermediate
    bloom: evaluate
    estimated_seconds: 60
    question: |-
      The function is intended to sum all weights in a finite tree. Which input exposes its faulty zero-weight case?

      ```haskell
      data Tree = Branch Int [Tree]
      total (Branch 0 _) = 0
      total (Branch w cs) = foldl (\a c -> a + total c) w cs
      ```
    options:
      - '`Branch 0 []`'
      - '`Branch 5 []`'
      - '`Branch 0 [Branch 5 []]`'
    correct_index: 2
    option_feedback:
      0: A zero-weight node with no children really does have total 0, so it hides the defect.
      1: A nonzero leaf uses the general case and returns its own weight correctly.
    explanation: A zero-weight parent can still have nonzero descendants. The first pattern discards the children instead of recursively summing them.

  # Lecture: intro_to_functional_programming_and_haskell_v10.pptx, slides 19–20 (calling functions)
  # Assessment: none; prediction item paired with the chapter's Puzzles section.
  - id: cs131-v2-functional-puzzle-application-binds-first
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: |-
      What does `half 10 + 4` evaluate to?

      ```haskell
      half :: Int -> Int
      half n = n `div` 2
      ```
    options:
      - '`9`'
      - '`7`'
      - 'A type error: `10 + 4` needs parentheses'
    correct_index: 0
    option_feedback:
      1: Application binds more tightly than `+`, so the expression is `(half 10) + 4`. It would be 7 only as `half (10 + 4)`.
      2: The expression is well typed without parentheses. `half 10` is an `Int`, and adding 4 to it is fine.
    explanation: Function application has higher precedence than every infix operator. `half 10 + 4` computes `half 10`, which is 5, and then adds 4.

  # Lecture: intro_to_functional_programming_and_haskell_v10.pptx, slides 22, 113–117 (prefix operators, partial application)
  # Assessment: none; prediction item paired with the chapter's Puzzles section.
  - id: cs131-v2-functional-puzzle-left-section
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: What does `map (2 ^) [1, 2, 3]` evaluate to?
    options:
      - '`[2,4,8]`'
      - '`[1,4,9]`'
      - '`[2,4,6]`'
    correct_index: 0
    option_feedback:
      1: That result squares each element, which is the section `(^ 2)`. In `(2 ^)` the supplied operand is the base, and each element becomes the exponent.
      2: '`^` is exponentiation, not multiplication; `(2 *)` would double each element.'
    explanation: The left section `(2 ^)` is the function `\x -> 2 ^ x`. Mapping it over `[1, 2, 3]` computes `2 ^ 1`, `2 ^ 2`, and `2 ^ 3`.

  # Lecture: intro_to_functional_programming_and_haskell_v10.pptx, slides 25–27 (guards)
  # Assessment: none; prediction item paired with the chapter's Puzzles section.
  - id: cs131-v2-functional-puzzle-guard-order
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |-
      What does `map grade [95, 70, 40]` evaluate to?

      ```haskell
      grade :: Int -> Char
      grade score
        | score >= 60 = 'D'
        | score >= 90 = 'A'
        | otherwise   = 'F'
      ```
    options:
      - '`"DDF"`'
      - '`"ADF"`'
      - "A compile error: the `'A'` guard is unreachable"
    correct_index: 0
    option_feedback:
      1: "Guards are tried from top to bottom, and 95 already satisfies `score >= 60`, so the `'A'` guard is never consulted."
      2: "The compiler cannot decide in general that one numeric guard makes a later one unreachable, so the program compiles and never returns `'A'`."
    explanation: The first guard that holds selects the result. Because `score >= 60` comes before `score >= 90`, every passing score becomes `'D'`. The result is displayed as a string because a list of `Char` is a `String`.

  # Lecture: intro_to_functional_programming_and_haskell_v10.pptx, slides 57–59 (infinite lists)
  # Assessment: none; prediction item paired with the chapter's Puzzles section.
  - id: cs131-v2-functional-puzzle-lazy-search
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: What does `head (filter (> 10) [1 ..])` evaluate to?
    options:
      - '`11`'
      - 'Nothing: `filter` never finishes the infinite list'
      - '`[11]`'
    correct_index: 0
    option_feedback:
      1: '`head` needs only the first element that `filter` produces, so evaluation stops once 11 is found. The rest of the infinite list is never examined.'
      2: '`head` returns the first element itself, not a one-element list.'
    explanation: Lazy evaluation computes only what the consumer demands. `head` demands one element, so `filter` tests 1 through 11 and stops.

  # Lecture: intro_to_functional_programming_and_haskell_v10.pptx, slides 91–96 (reducers, foldl)
  # Assessment: none; prediction item paired with the chapter's Puzzles section.
  - id: cs131-v2-functional-puzzle-fold-direction
    type: single
    difficulty: advanced
    bloom: analyze
    estimated_seconds: 75
    question: What do `foldr (-) 0 [5, 3, 1]` and `foldl (-) 0 [5, 3, 1]` evaluate to, in that order?
    options:
      - '`3` and `-9`'
      - '`-9` and `3`'
      - '`1` and `1`'
      - '`3` and `3`'
    correct_index: 0
    option_feedback:
      1: The values are swapped. `foldr` nests to the right, `5 - (3 - (1 - 0))`, while `foldl` starts from the left, `((0 - 5) - 3) - 1`.
      2: '`1` is `5 - 3 - 1` without the initial value. Both folds also apply `-` to the starting value 0.'
      3: Subtraction is not associative, so the two groupings produce different results.
    explanation: '`foldr f z [a, b, c]` is `f a (f b (f c z))`, and `foldl f z [a, b, c]` is `f (f (f z a) b) c`. With subtraction, these groupings give 3 and -9.'

  # Lecture: intro_to_functional_programming_and_haskell_v10.pptx, slides 5–7, 29–33 (immutability, let)
  # Assessment: none; prediction item paired with the chapter's Puzzles section.
  - id: cs131-v2-functional-puzzle-let-shadowing
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |-
      What is the value of `result`?

      ```haskell
      result :: Int
      result =
        let rate = 3
            scale x = x * rate
        in let rate = 10 in scale 2
      ```
    options:
      - '`6`'
      - '`20`'
      - 'A compile error: `rate` is defined twice'
    correct_index: 0
    option_feedback:
      1: '`scale` uses the `rate` that was in scope where `scale` was defined. The inner `let` creates a different `rate` that only later expressions can see.'
      2: Nested `let` expressions may reuse a name. The inner binding hides the outer one instead of conflicting with it.
    explanation: Haskell scope is lexical, and bindings never change. The inner `rate = 10` is a new binding, so `scale 2` still computes `2 * 3`.

  # Lecture: intro_to_functional_programming_and_haskell_v10.pptx, slides 118–128 (currying)
  # Assessment: none; prediction item paired with the chapter's Puzzles section.
  - id: cs131-v2-functional-puzzle-curried-map
    type: single
    difficulty: advanced
    bloom: analyze
    estimated_seconds: 60
    question: What does `map (\f -> f 3) (map (*) [1, 2, 3])` evaluate to?
    options:
      - '`[3,6,9]`'
      - '`[1,2,3]`'
      - 'A type error: `(*)` needs two arguments'
    correct_index: 0
    option_feedback:
      1: '`map (*) [1, 2, 3]` produces the functions `(1 *)`, `(2 *)`, and `(3 *)`. Applying each one to 3 multiplies rather than returning the stored number.'
      2: Every Haskell function takes one argument at a time. Applying `(*)` to one number is valid and returns a function waiting for the second.
    explanation: Because `(*)` is curried, mapping it over numbers yields a list of partially applied functions. The lambda then supplies 3 to each one, producing 3, 6, and 9.

  # Lecture: intro_to_functional_programming_and_haskell_v10.pptx, slides 131–148 (algebraic data types, immutable structures)
  # Assessment: none; prediction item paired with the chapter's Puzzles section.
  - id: cs131-v2-functional-puzzle-record-update
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: |-
      What does the last line print?

      ```haskell
      data Point = Point { px :: Int, py :: Int }

      main = do
        let p = Point 1 2
            q = p { px = 5 }
        print (px p, px q)
      ```
    options:
      - '`(1,5)`'
      - '`(5,5)`'
      - 'A compile error: record fields cannot change'
    correct_index: 0
    option_feedback:
      1: A record update builds a new value; it does not modify `p`. Only `q` has the new `px`.
      2: Record update syntax is allowed. It creates a modified copy instead of assigning to the existing record.
    explanation: '`p { px = 5 }` constructs a new `Point` whose `px` is 5 and whose other fields come from `p`. The original `p` is unchanged, so both versions remain available.'
