  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 29–30, 102–107 (let, closures)
  # Assessment: none; prediction item paired with the chapter's Puzzles section.
  - id: cs131-v2-functional-puzzle-let-shadowing
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |-
      What is the value of `result`?

      ```haskell
      result :: Int
      result =
        let rate = 3
            scale x = x * rate
        in let rate = 10 in scale 2
      ```
    options:
      - '`6`'
      - '`20`'
      - 'A compile error: `rate` is defined twice'
    correct_index: 0
    option_feedback:
      1: '`scale` uses the `rate` that was in scope where `scale` was defined. The inner `let` creates a different `rate` that only later expressions can see.'
      2: Nested `let` expressions may reuse a name. The inner binding hides the outer one instead of conflicting with it.
    explanation: Haskell scope is lexical, and bindings never change. The inner `rate = 10` is a new binding, so `scale 2` still computes `2 * 3`.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 106–107 (free and bound variables)
  - id: cs131-functional-free-and-bound
    type: single
    difficulty: intermediate
    bloom: understand
    estimated_seconds: 45
    question: |-
      In the lambda returned by `markup`, which variables are free and which are bound?

      ```haskell
      markup pct = \price -> price + price * pct / 100
      ```
    options:
      - '`price` is bound, and `pct` is free.'
      - '`pct` is bound, and `price` is free.'
      - Both are bound, because both are parameters.
    correct_index: 0
    option_feedback:
      1: A lambda's own parameter, here `price`, is bound; `pct` comes from the enclosing `markup`, so it is free in the lambda.
      2: '`pct` is a parameter of `markup`, not of the lambda, so inside the lambda it is free and must be captured by the closure.'
    explanation: A bound variable is a parameter or local of the function itself; a free variable comes from outside it. The closure created by `markup 20` captures the free variable `pct` with the value 20.

