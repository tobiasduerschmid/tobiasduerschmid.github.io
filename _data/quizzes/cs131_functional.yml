    question: For an immutable linked list with n nodes, which operation must build about n new nodes?
    options:
      - Adding an element at the end
      - Adding an element at the front
      - Removing the first element
    correct_index: 0
    option_feedback:
      1: The new front node can point to the existing list, which is shared unchanged, so only one node is created.
      2: The rest of the list already exists as the tail, so it can be returned without building anything.
    explanation: 'The last node''s link must change to reach the new element, and no node can be modified, so every node on the way is rebuilt. That is why `xs ++ [x]` takes time proportional to the length of `xs`, while `x : xs` takes constant time.'

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slide 146 (inserting into an immutable binary search tree)
