    options:
      - About 20
      - About 1,000,000
      - About 500,000
      - Exactly 1
    correct_index: 0
    option_feedback:
      1: Only the nodes on the path from the root to the new leaf change; every other subtree is shared with the old tree.
      2: An insertion follows one path down the tree; it does not touch half of the nodes.
      3: The new leaf alone is not enough, because every ancestor must be rebuilt to point to its updated child.
    explanation: A balanced tree's height is about log₂ n, and log₂ 1,000,000 is about 20. The insertion rebuilds that path and reuses everything else.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 147–150 (garbage collection; pros and cons of immutability)
  - id: cs131-functional-immutability-tradeoffs
    type: multiple
    difficulty: intermediate
    bloom: evaluate
    estimated_seconds: 60
    question: Which statements about immutable data structures are true? Select all that apply.
    options:
      - Threads can share them without data races.
      - A value cannot change unexpectedly while you debug.
      - Old versions remain available, which simplifies undo.
      - Every update is faster than an in-place update.
      - The programmer must free each unused old version.
    correct_indices:
      - 0
      - 1
      - 2
    option_feedback:
      0: A data race needs a write to shared memory, and an immutable value is never written after it is created.
      1: Only the code that created a value determines it, so no distant code can change it behind your back.
      2: An update returns a new version and leaves the old one intact.
      3: Some updates, such as appending to a list, rebuild part of the structure and cost more than an in-place change.
      4: Garbage collection reclaims versions that nothing refers to anymore.
    explanation: Immutability trades some update cost for safety and simpler reasoning, and functional languages rely on garbage collection to reclaim old versions.
