  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 136–142 (pattern matching on variants; first match wins)
  - id: cs131-functional-constructor-pattern-order
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |-
      What is `describe (Dog "Rex" 0)`?

      ```haskell
      data Pet = Cat String | Dog String Int

      describe :: Pet -> String
      describe (Dog name _) = name ++ " is a dog"
      describe (Dog name 0) = name ++ " is a puppy"
      describe (Cat name)   = name ++ " is a cat"
      ```
    options:
      - '`"Rex is a dog"`'
      - '`"Rex is a puppy"`'
      - An error, because two equations match the value
    correct_index: 0
    option_feedback:
      1: Haskell does not prefer the more specific pattern; it uses the first equation that matches, and `(Dog name _)` matches every dog.
      2: Overlapping equations are allowed. Haskell uses the first match, so the puppy equation can never be reached.
    explanation: Equations are tried from top to bottom. To reach the puppy case, put `describe (Dog name 0)` before the general `Dog` equation.

