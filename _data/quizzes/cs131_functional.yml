  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 91–96 (foldl and foldr)
  # Assessment: none; prediction item paired with the chapter's Puzzles section.
  - id: cs131-v2-functional-puzzle-fold-direction
    type: single
    difficulty: advanced
    bloom: analyze
    estimated_seconds: 75
    question: What do `foldr (-) 0 [5, 3, 1]` and `foldl (-) 0 [5, 3, 1]` evaluate to, in that order?
    options:
      - '`3` and `-9`'
      - '`-9` and `3`'
      - '`1` and `1`'
      - '`3` and `3`'
    correct_index: 0
    option_feedback:
      1: The values are swapped. `foldr` nests to the right, `5 - (3 - (1 - 0))`, while `foldl` starts from the left, `((0 - 5) - 3) - 1`.
      2: '`1` is `5 - 3 - 1` without the initial value. Both folds also apply `-` to the starting value 0.'
      3: Subtraction is not associative, so the two groupings produce different results.
    explanation: '`foldr f z [a, b, c]` is `f a (f b (f c z))`, and `foldl f z [a, b, c]` is `f (f (f z a) b) c`. With subtraction, these groupings give 3 and -9.'

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 83–96 (filter, map, then reduce)
