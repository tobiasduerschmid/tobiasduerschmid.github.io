title: 'CS 131: Functional Programming and Haskell'
description: Explain pure functional ideas, predict Haskell expressions and types, and reason about recursion, higher-order functions, and immutable data.
active: true
# Source: intro_to_functional_programming_and_haskell_td.pptx; each item cites its slides.
# Examples deliberately differ from the lecture's own, so answers require transfer rather than
# recall. Every Haskell answer and distractor outcome was checked with the site's MicroHs runtime.
# "Assessment:" lines name the past problem whose style an item mirrors. Times are planning
# estimates, not learner-calibrated limits. Items appear in lecture order; the quiz shuffles them.
questions:
  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 5–6 (pure functions, side effects)
  - id: cs131-functional-identify-pure-function
    type: single
    difficulty: basic
    bloom: understand
    estimated_seconds: 45
    question: |-
      Which of these C++ functions is pure? Assume that other code may change the globals.

      ```cpp
      int calls = 0;
      double rate = 1.1;
      ```
    options:
      - '`int area(int w, int h) { return w * h; }`'
      - '`int next(int x) { return x + calls++; }`'
      - '`double scaled(double x) { return x * rate; }`'
      - '`int echo(int x) { std::cout << x; return x; }`'
    correct_index: 0
    option_feedback:
      1: '`calls++` changes a variable outside the function, so a second call with the same argument returns a different result.'
      2: '`scaled` changes nothing, but it reads `rate`, which other code may change, so the same argument can give different results.'
      3: Printing to the console is a side effect, even though the returned value depends only on `x`.
    explanation: A pure function computes its result only from its arguments and neither reads nor changes mutable state outside itself. Only `area` meets both conditions.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slide 6 (why purity matters)
  - id: cs131-functional-purity-benefits
    type: multiple
    difficulty: basic
    bloom: understand
    estimated_seconds: 45
    question: Which benefits follow from a function being pure? Select all that apply.
    options:
      - A test can call it without first setting up global state.
      - A compiler may reuse an earlier result for the same arguments.
      - Independent calls can run in parallel without changing results.
      - The function is guaranteed to be free of type errors.
    correct_indices:
      - 0
      - 1
      - 2
    option_feedback:
      0: The result depends only on the arguments, so supplying them is the whole setup.
      1: The same arguments always produce the same result, so a cached result stays correct.
      2: Calls that share no mutable state cannot interfere with one another.
      3: Purity concerns dependencies and effects. A pure function can still be ill-typed; Haskell checks types separately.
    explanation: Purity makes a call's result depend only on its arguments, which supports testing, caching, parallel evaluation, and reasoning about programs. It says nothing about whether the types are correct.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 5, 7 (immutable bindings)
  - id: cs131-functional-binding-twice
    type: single
    difficulty: basic
    bloom: apply
    estimated_seconds: 30
    question: |-
      A Haskell module contains these two lines. What happens when it is loaded?

      ```haskell
      limit = 10
      limit = 20
      ```
    options:
      - The module is rejected because `limit` is defined twice.
      - '`limit` becomes 20 because the later line overwrites it.'
      - '`limit` stays 10 because the first definition wins.'
    correct_index: 0
    option_feedback:
      1: In Haskell, `=` defines a name rather than assigning to a variable, so there is nothing to overwrite.
      2: Haskell does not choose between conflicting definitions; it reports the conflict.
    explanation: A name is bound once and its value never changes, so two top-level definitions of `limit` are a duplicate-definition error.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slide 8 (evaluation follows need)
  - id: cs131-functional-unused-binding
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |-
      What does `classify 5` evaluate to?

      ```haskell
      classify n = if n > 0 then label else failure
        where
          label = "positive " ++ show doubled
          doubled = 2 * n
          failure = error "not positive"
      ```
    options:
      - '`"positive 10"`'
      - An error, because `failure` is defined in the `where` block
      - An error, because `doubled` is used before it is defined
    correct_index: 0
    option_feedback:
      1: A binding is evaluated only when a result needs its value; for a positive `n`, nothing demands `failure`.
      2: The bindings after `where` are equations, not statements, so their order does not matter.
    explanation: The condition selects `label`, which needs `doubled`, so the result is `"positive 10"`. `failure` is never demanded, so its error is never raised.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 19–20 (application groups to the left)
  - id: cs131-functional-nested-call-syntax
    type: single
    difficulty: basic
    bloom: apply
    estimated_seconds: 45
    question: |-
      With these definitions, which expression computes `triple(add1(4))`, that is, 15?

      ```haskell
      triple n = 3 * n
      add1 n = n + 1
      ```
    options:
      - '`triple (add1 4)`'
      - '`triple add1 4`'
      - '`triple add1(4)`'
    correct_index: 0
    option_feedback:
      1: Application groups to the left, so this means `(triple add1) 4`, which passes the function `add1` to `triple`.
      2: Parentheses around a lone argument change nothing, so this still means `(triple add1) 4`.
    explanation: A function is applied to the argument immediately after it. To pass the result of `add1 4` as a single argument, parenthesize that call.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 19–20 (calling functions)
  # Assessment: none; prediction item paired with the chapter's Puzzles section.
  - id: cs131-v2-functional-puzzle-application-binds-first
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: |-
      What does `half 10 + 4` evaluate to?

      ```haskell
      half :: Int -> Int
      half n = n `div` 2
      ```
    options:
      - '`9`'
      - '`7`'
      - 'A type error: `10 + 4` needs parentheses'
    correct_index: 0
    option_feedback:
      1: Application binds more tightly than `+`, so the expression is `(half 10) + 4`. It would be 7 only as `half (10 + 4)`.
      2: The expression is well typed without parentheses. `half 10` is an `Int`, and adding 4 to it is fine.
    explanation: Function application has higher precedence than every infix operator. `half 10 + 4` computes `half 10`, which is 5, and then adds 4.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 19–21 (nested calls with few parentheses)
  - id: cs131-functional-equivalent-groupings
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: '`scale :: Int -> Int -> Int` takes two arguments. Which expressions compute `scale(x, abs(y) + 1)`? Select all that apply.'
    options:
      - '`scale x (abs y + 1)`'
      - '`scale x ((abs y) + 1)`'
      - '`scale x abs y + 1`'
      - '`scale (x, abs y + 1)`'
    correct_indices:
      - 0
      - 1
    option_feedback:
      0: '`abs y` binds before `+`, so the parentheses only need to enclose the second argument.'
      1: The extra parentheses around `abs y` are redundant but harmless; the grouping is unchanged.
      2: Application groups to the left, so this tries to pass the function `abs` as `scale`'s second `Int` argument.
      3: Parentheses with a comma build one tuple argument, but `scale` takes its two arguments separately.
    explanation: Application binds more tightly than `+`, so `abs y + 1` means `(abs y) + 1`. Wrapping it in parentheses makes it the second argument of `scale`.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slide 24 (if is an expression)
  - id: cs131-functional-if-needs-else
    type: single
    difficulty: basic
    bloom: understand
    estimated_seconds: 30
    question: Why does Haskell reject `bonus n = if n > 100 then 5` unless an `else` branch is added?
    options:
      - The `if` is an expression, so it needs a value when the test fails.
      - An `if` statement must always end with a `return` statement.
      - '`else` is required only when the two branches have different types.'
    correct_index: 0
    option_feedback:
      1: Haskell's `if` is not a statement, and there is no `return` here; the whole `if` is the function's result.
      2: The two branches must have the same type, and the `else` branch is required in every case.
    explanation: Every Haskell expression has a value, including `if`. Without `else`, `bonus 50` would have no value, so the branch is mandatory, as in C++'s `? :` operator.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 25–26 (guards)
  # Assessment: none; prediction item paired with the chapter's Puzzles section.
  - id: cs131-v2-functional-puzzle-guard-order
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |-
      What does `map grade [95, 70, 40]` evaluate to?

      ```haskell
      grade :: Int -> Char
      grade score
        | score >= 60 = 'D'
        | score >= 90 = 'A'
        | otherwise   = 'F'
      ```
    options:
      - '`"DDF"`'
      - '`"ADF"`'
      - "A compile error: the `'A'` guard is unreachable"
    correct_index: 0
    option_feedback:
      1: "Guards are tried from top to bottom, and 95 already satisfies `score >= 60`, so the `'A'` guard is never consulted."
      2: "The compiler cannot decide in general that one numeric guard makes a later one unreachable, so the program compiles and never returns `'A'`."
    explanation: The first guard that holds selects the result. Because `score >= 60` comes before `score >= 90`, every passing score becomes `'D'`. The result is displayed as a string because a list of `Char` is a `String`.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 27–28 (recursion with guards, trace-through)
  - id: cs131-functional-recursion-digit-count
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      What is `digits 4096`?

      ```haskell
      digits :: Int -> Int
      digits n
        | n < 10    = 1
        | otherwise = 1 + digits (n `div` 10)
      ```
    options:
      - '`4`'
      - '`3`'
      - '`1`'
    correct_index: 0
    option_feedback:
      1: The base case also contributes 1, for the last remaining digit.
      2: Each recursive step adds 1 to the result for the shorter number, so the ones accumulate.
    explanation: The calls handle 4096, 409, 40, and 4. The base case gives 1 for 4, and each of the three recursive steps adds 1, for a total of 4.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 30–32 (let versus where)
  - id: cs131-functional-where-across-guards
    type: single
    difficulty: intermediate
    bloom: understand
    estimated_seconds: 45
    question: |-
      Why does this definition use `where` instead of `let … in` for `ratio`?

      ```haskell
      grade score total
        | ratio >= 0.9 = "A"
        | ratio >= 0.8 = "B"
        | otherwise    = "C"
        where
          ratio = score / total
      ```
    options:
      - All guards can see a `where` binding; `let … in` covers one expression.
      - '`where` bindings are computed before the guards, and `let` ones after.'
      - '`where` makes `ratio` available to other top-level functions.'
    correct_index: 0
    option_feedback:
      1: Neither form fixes an evaluation order; a binding is computed when a result needs it.
      2: A `where` binding is local to the equation it belongs to.
    explanation: A guarded equation has several result expressions. A `where` clause scopes over all of them, while `let … in` can wrap only a single expression.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 33–34 (nested functions in where)
  - id: cs131-functional-helper-sees-parameter
    type: single
    difficulty: intermediate
    bloom: understand
    estimated_seconds: 45
    question: |-
      Which statement about the helper `describe` is true?

      ```haskell
      label item price = describe price
        where
          describe p = item ++ ": " ++ show p
      ```
    options:
      - It can use `item` because it is defined inside `label`.
      - It must receive `item` as a parameter before it can use it.
      - Any other top-level function can call it.
    correct_index: 0
    option_feedback:
      1: A function defined in `where` can already see the parameters of the equation it belongs to.
      2: A `where` helper is local; it exists only inside the definition of `label`.
    explanation: 'Nested functions see the enclosing function''s parameters, so `label "pen" 3` is `"pen: 3"` without passing `item` to `describe`.'

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 36–37 (tuples, fst and snd)
  - id: cs131-functional-tuple-selection
    type: multiple
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: Which expressions evaluate to `"Oslo"`? Select all that apply.
    options:
      - '`fst ("Oslo", 4)`'
      - '`fst (fst (("Oslo", 4), True))`'
      - '`fst ("Oslo", 4, True)`'
      - '`head ("Oslo", 4)`'
    correct_indices:
      - 0
      - 1
    option_feedback:
      0: '`fst` takes the first component of a pair, so this is `"Oslo"`.'
      1: The inner `fst` extracts the pair `("Oslo", 4)`, and the outer `fst` takes its first component.
      2: '`fst` works only on pairs; a three-component tuple has a different type, so this is a type error.'
      3: A tuple is not a list, so list functions such as `head` do not apply to it.
    explanation: '`fst` and `snd` select the components of a pair. Tuples of other sizes are taken apart with patterns instead.'

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slide 38 (lists hold one element type)
  - id: cs131-functional-valid-lists
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: Which of these are valid Haskell lists? Select all that apply.
    options:
      - '`[[1, 2], []]`'
      - '`[("a", 1), ("b", 2)]`'
      - '`[1, "two"]`'
      - '`[(1, ''a''), (2, "b")]`'
    correct_indices:
      - 0
      - 1
    option_feedback:
      0: Both elements are lists of numbers; the empty list fits any element type.
      1: Both elements are pairs of a string and a number, so they share one type.
      2: A number and a string have different types, and every element of a list must have the same type.
      3: The first pair holds a character and the second a string, so the two pairs have different types.
    explanation: A list may have any length but only one element type. Tuples inside a list must agree component by component.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 39–40 (list operations)
  - id: cs131-functional-zip-after-drop
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: What does `zip "abc" (drop 1 [10, 20, 30])` evaluate to?
    options:
      - "`[('a',20),('b',30)]`"
      - "`[('a',10),('b',20),('c',30)]`"
      - "`[('b',20),('c',30)]`"
    correct_index: 0
    option_feedback:
      1: '`drop 1` removes the first number before `zip` ever sees the list.'
      2: '`drop 1` applies only to the number list; `zip` still starts with `''a''`.'
    explanation: '`drop 1 [10, 20, 30]` is `[20,30]`. `zip` pairs elements in order and stops at the end of the shorter list, so `''c''` has no partner.'

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slide 41 (ranges)
  - id: cs131-functional-range-step
    type: single
    difficulty: basic
    bloom: apply
    estimated_seconds: 30
    question: What does `[3, 7 .. 20]` evaluate to?
    options:
      - '`[3,7,11,15,19]`'
      - '`[3,7,11,15,19,23]`'
      - '`[3,7,11,15,19,20]`'
    correct_index: 0
    option_feedback:
      1: A range stops before passing its bound, and 23 would exceed 20.
      2: The bound is a limit, not an element that is always included; 20 is not 3 plus a multiple of the step 4.
    explanation: The first two values set the step, 7 − 3 = 4. The range continues with 11, 15, and 19, and stops because 23 would pass 20.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 8, 41 (infinite lists)
  # Assessment: none; prediction item paired with the chapter's Puzzles section.
  - id: cs131-v2-functional-puzzle-lazy-search
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: What does `head (filter (> 10) [1 ..])` evaluate to?
    options:
      - '`11`'
      - 'Nothing: `filter` never finishes the infinite list'
      - '`[11]`'
    correct_index: 0
    option_feedback:
      1: '`head` needs only the first element that `filter` produces, so evaluation stops once 11 is found. The rest of the infinite list is never examined.'
      2: '`head` returns the first element itself, not a one-element list.'
    explanation: Lazy evaluation computes only what the consumer demands. `head` demands one element, so `filter` tests 1 through 11 and stops.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slide 42 (: and ++)
  - id: cs131-functional-append-one-element
    type: single
    difficulty: basic
    bloom: apply
    estimated_seconds: 45
    question: 'Given `drinks = ["milk", "juice"]`, which expression produces `["milk","juice","tea"]`?'
    options:
      - '`drinks ++ ["tea"]`'
      - '`drinks ++ "tea"`'
      - '`drinks : "tea"`'
      - '`"tea" : drinks`'
    correct_index: 0
    option_feedback:
      1: '`"tea"` is a list of characters, but `drinks` is a list of strings, so `++` cannot join them.'
      2: '`:` puts one element in front of a list; it cannot attach anything at the end.'
      3: This puts `"tea"` at the front, giving `["tea","milk","juice"]`.
    explanation: '`++` joins two lists of the same type, so a single element must first be wrapped in its own list: `drinks ++ ["tea"]`.'

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 44–48, 66–71 (list recursion)
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 3b (complete recursion on a count and list).
  - id: cs131-v2-functional-skip-recursive-step
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      Complete `skip`, which discards the first `n` items, or all items if the list is shorter. Assume `n >= 0`.

      ```haskell
      skip _ [] = []
      skip 0 xs = xs
      skip n (x:xs) = ___
      ```
    options:
      - '`x : skip (n-1) xs`'
      - '`skip (n-1) xs`'
      - '`skip (n-1) (x:xs)`'
    correct_index: 1
    option_feedback:
      0: Consing the removed head back onto the result preserves an item that the function must discard.
      2: Decreasing the count without removing the head eventually returns the original list.
    explanation: Each recursive step removes one input item and consumes one unit of the count. When the count reaches zero, the unprocessed suffix is returned.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 66–71 (list patterns in recursion)
  # Assessment: [Midterm] F24 V1 (Public).pdf, Problem 1, p. 2 (trace list recursion and base cases).
  - id: cs131-v2-functional-pairwise-recursion-trace
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      What is `groupSums [2,5,4,1,8]`?

      ```haskell
      groupSums [] = []
      groupSums [x] = [x]
      groupSums (x:y:rest) = (x+y) : groupSums rest
      ```
    options:
      - '`[7, 5, 8]`'
      - '`[7, 9, 5, 9]`'
      - '`[7, 5]`'
    correct_index: 0
    option_feedback:
      1: The pattern removes two items per call; the pairs do not overlap.
      2: The singleton case retains an unpaired final element instead of discarding it.
    explanation: The calls process `[2,5]`, then `[4,1]`, then the singleton `[8]`. Their contributions are 7, 5, and 8.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 44–48, 66–69 (list recursion)
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 3b (recursive completion).
  - id: cs131-v2-functional-recursive-selection-repair
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |-
      `positives` should retain positive integers in order. Which expression fills the blank?

      ```haskell
      positives [] = []
      positives (x:xs)
        | x > 0 = x : positives xs
        | otherwise = ___
      ```
    options:
      - '`xs`'
      - '`positives (x:xs)`'
      - '`positives xs`'
    correct_index: 2
    option_feedback:
      0: Returning the tail unchanged can leave later nonpositive elements in the result.
      1: This repeats the same input and cannot progress past a nonpositive head.
    explanation: Dropping the current head is only one step. The remaining tail still needs the same selection rule.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 51–56 (comprehensions with a guard)
  - id: cs131-functional-comprehension-guard
    type: single
    difficulty: basic
    bloom: apply
    estimated_seconds: 45
    question: What does `[x * 10 | x <- [1 .. 6], even x]` evaluate to?
    options:
      - '`[20,40,60]`'
      - '`[10,30,50]`'
      - '`[10,20,30,40,50,60]`'
    correct_index: 0
    option_feedback:
      1: The guard keeps the values for which `even x` is `True`, not those for which it is `False`.
      2: The guard tests the drawn value `x`, not the output `x * 10`. Testing the output would keep everything, because every multiple of 10 is even.
    explanation: The generator supplies 1 to 6, the guard keeps 2, 4, and 6, and the expression before `|` multiplies each kept value by 10.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 57–59 (multiple and dependent generators)
  - id: cs131-functional-dependent-generator-count
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: How many pairs does `[(a, b) | a <- [1 .. 4], b <- [a .. 4]]` contain?
    options:
      - '`10`'
      - '`16`'
      - '`6`'
    correct_index: 0
    option_feedback:
      1: Sixteen would require every `b` to range over 1 to 4; here `b` starts at the current `a`.
      2: '`b` may equal `a`, so pairs such as `(2,2)` are included.'
    explanation: 'The second generator depends on the first: `a = 1` gives four pairs, `a = 2` three, `a = 3` two, and `a = 4` one, for 10 in total.'

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slide 60 (quicksort with comprehensions)
  - id: cs131-functional-quicksort-duplicates
    type: single
    difficulty: advanced
    bloom: evaluate
    estimated_seconds: 90
    question: |-
      What does `qsort [3, 1, 3, 2]` return with this definition?

      ```haskell
      qsort [] = []
      qsort (p:rest) =
        qsort [x | x <- rest, x < p] ++ [p] ++ qsort [x | x <- rest, x > p]
      ```
    options:
      - '`[1,2,3]`'
      - '`[1,2,3,3]`'
      - It never finishes, because the partitions do not get smaller
    correct_index: 0
    option_feedback:
      1: The second 3 is neither less than nor greater than the pivot 3, so neither comprehension keeps it.
      2: Both comprehensions draw only from `rest`, which excludes the pivot, so each recursive call receives a shorter list.
    explanation: Elements equal to the pivot satisfy neither guard and are dropped, so this version silently removes duplicates. A correct quicksort sends them to one side, for example with `x >= p` in the second comprehension.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 63–65 (patterns with constants; first match wins)
  - id: cs131-functional-literal-pattern-order
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 45
    question: |-
      What is `fare 0 "senior"`?

      ```haskell
      fare :: Int -> String -> Int
      fare 0 _        = 0
      fare _ "senior" = 2
      fare age _      = if age < 12 then 1 else 3
      ```
    options:
      - '`0`'
      - '`2`'
      - '`1`'
    correct_index: 0
    option_feedback:
      1: Equations are tried from top to bottom, and the first one already matches, so the `"senior"` equation is never consulted.
      2: The catch-all equation is reached only when neither earlier equation matches.
    explanation: The first equation requires an age of `0` and accepts any second argument with `_`, so it matches and the result is `0`.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 66–70 (list pattern cheat sheet)
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 3b (list patterns in recursive code).
  - id: cs131-v2-functional-nested-pattern-bindings
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: The Haskell pattern `(first:second:rest)` is matched against `[[1,2], [], [3]]`. Which bindings result? Select all that apply.
    options:
      - '`first = [1,2]`'
      - '`second = []`'
      - '`rest = [[3]]`'
      - '`rest = [3]`'
    correct_indices:
      - 0
      - 1
      - 2
    option_feedback:
      0: The first element of the outer list is itself the list `[1,2]`.
      1: An empty inner list is still a complete element of the outer list.
      2: The remaining outer list contains one inner list, `[3]`.
      3: The tail keeps the outer list level; pattern matching does not flatten it.
    explanation: Each colon removes one element from the outer list. `rest` contains whatever outer elements remain, retaining their nested structure.

  # Lecture: intro_to_functional_programming_and_haskell_td.pptx, slides 73–75 (type variables)
