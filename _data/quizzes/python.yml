title: "Python Concepts Quiz"
description: "Practice Python's object model, calls, closures, iteration, exceptions, and concurrency with output predictions and contract checks."
active: true
questions:
  # Source concepts: Homework OOP5; OOP lecture (multiple inheritance and mixins).
  - id: python-course-cooperative-super
    type: single
    difficulty: advanced
    question: |-
      What does this program print?

      ```python
      class End:
          def route(self):
              return "end"
      class Checked(End):
          def route(self):
              return "check>" + super().route()
      class Cached(End):
          def route(self):
              return "cache>" + super().route()
      class Request(Checked, Cached):
          pass
      print(Request().route())
      ```
    options:
      - '`check>end`'
      - '`check>cache>end`'
      - '`cache>check>end`'
    correct_index: 1
    option_feedback:
      0: '`super()` in Checked continues through Request''s method resolution order, so Cached participates before End.'
      2: Request declares Checked before Cached; the method resolution order respects that local ordering.
    explanation: 'The order is Request, Checked, Cached, End, object. Each cooperative call continues along that order, rather than jumping directly to the class''s written base.'

  # Source concepts: Homework HASKELL7 (purity in Python).
  - id: python-course-local-mutation-purity
    type: single
    difficulty: intermediate
    question: |-
      For an ordinary list of integers, which function body returns an extended list without an external mutation or input/output effect?
    options:
      - '`result = values; result.append(2); return result`'
      - '`values.append(2); return values[:]`'
      - '`result = values[:]; result.append(2); return result`'
    correct_index: 2
    option_feedback:
      0: Assignment makes result an alias, so the append mutates the caller's list.
      1: Copying after the append does not undo the earlier mutation of the argument.
    explanation: A shallow copy is sufficient for a list of integers when only the new outer list is extended. Mutating fresh local data does not by itself make a function impure.

  # Source concepts: Homework OOP6 C (explicit interfaces in dynamic languages).
  - id: python-course-abstract-contract
    type: single
    difficulty: intermediate
    question: A Python class inherits from ABC and declares read with @abstractmethod. A subclass implements read with an incompatible parameter list. What does the abstract-method mechanism alone guarantee?
    options:
      - That the implementation returns the documented result.
      - That construction fails while read remains abstract.
      - That calls use a statically checked parameter list.
    correct_index: 1
    option_feedback:
      0: Replacing an abstract method does not prove its behavioral contract.
      2: The abc module does not check method signature compatibility or perform static argument checking.
    explanation: The mechanism prevents ordinary construction while abstract methods remain. Signature compatibility, result semantics, and substitution still need separate validation.
  - id: 1
    difficulty: intermediate
    question: "Python is **dynamically** typed AND **strongly** typed. JavaScript is dynamically typed AND **weakly** typed. What is the practical difference for a developer?"
    options:
      - "There is no practical difference — 'strong' and 'weak' typing are just academic labels"
      - "Python errors on `\"5\" + 3`; JavaScript silently coerces it to `\"53\"`."
      - "Strong typing means Python is faster because the interpreter can optimize known types"
      - "Weak typing means JavaScript variables can change type, while Python variables cannot"
    correct_index: 1
    option_feedback:
      0: |
        Strong and weak typing show up in real bug behavior: Python refuses `"5" + 3`, while JavaScript
        coerces and keeps running.
      2: |
        Strong typing is about whether incompatible operations are coerced, not whether the interpreter
        knows all types early enough to optimize them.
      3: |
        Both Python and JavaScript names can be rebound to values of different types; the difference
        here is coercion between incompatible values.
    explanation: "Here Python rejects mixed string-and-integer addition, while JavaScript converts the integer to text. Strong and weak typing are broad labels, not a claim that Python never converts types: numeric operations can combine an int and a float. Dynamic typing concerns checking operations at runtime; it does not promise automatic conversion."

  - id: 2
    difficulty: basic
    question: "In C++, `'A'` is a character literal and `\"Alice\"` is a string literal. A student writes `name = 'Alice'` in Python. Does the single-quote spelling produce a different type from `\"Alice\"`?"
    options:
      - "Yes — Python's single quotes create a character array, just like C++'s `char[]`"
      - "No — both quote styles produce `str` values."
      - "No — single quotes create byte strings, while double quotes create Unicode strings"
      - "Yes — while both work, single-quoted strings are immutable and double-quoted strings are mutable"
    correct_index: 1
    option_feedback:
      0: |
        Python quote style does not choose between character arrays and strings; both quote styles
        create `str` objects.
      2: |
        Python 3 byte strings require a `b` prefix such as `b'Alice'`; ordinary single and double quotes
        both create Unicode `str` values.
      3: |
        Python strings are immutable regardless of whether single or double quotes were used.
    explanation: "Python has no separate char type. These two spellings produce equal string values; that is not a guarantee of object identity. Choose a quote style that makes embedded quotation marks easy to read."

  - id: 3
    difficulty: intermediate
    question: "A C++ programmer writes `total = sum(scores) / len(scores)` and expects integer division (like C++'s `/`). They get `85.5` instead of `85`. What happened, and how should they get integer division?"
    options:
      - "Python's `sum()` always returns a float, even for integer lists"
      - "In Python 3, `/` is float division; use `//` for floor: `sum(scores) // len(scores)`."
      - "The `len()` function returns a float in Python 3"
      - "Python rounds up by default — use `math.floor()` to get integer results"
    correct_index: 1
    option_feedback:
      0: |
        The float comes from the `/` operator in Python 3, not from `sum()` changing integer lists into
        floats.
      2: |
        `len()` returns an integer count; division semantics decide whether the final average is a float
        or an integer.
      3: |
        Python did not round the result up; `/` produced a floating-point quotient, while `//` is the
        operator for integer floor division.
    explanation: "For built-in integers, `/` produces a float and `//` produces the floor of the quotient as an int. Unlike C++ integer division, flooring rounds toward negative infinity: `-7 // 2` is `-4`, not `-3`. Other numeric types may define their own division results."

  - id: 4
    difficulty: advanced
    question: "A student writes a function that opens a file, but forgets to close it. Their C++ instinct says 'this will leak the file handle.' Is this concern valid in Python, and what is the recommended solution?"
    options:
      - "Not valid — Python's garbage collector will always close the file immediately"
      - "Valid — use the `with` statement (context manager); it guarantees cleanup like C++ RAII."
      - "Not valid — Python files are always auto-closed when the variable goes out of scope"
      - "Valid, but there is no Python equivalent of RAII — you must always use try/finally"
    correct_index: 1
    option_feedback:
      0: |
        Python may eventually close the file, but correctness for files, locks, and sockets needs
        deterministic cleanup at block exit.
      2: |
        Python variables going out of scope is not the portable cleanup guarantee; context managers
        provide the RAII-like boundary.
      3: |
        `with` is the standard Python abstraction for `try/finally` cleanup, and it keeps the resource
        protocol local and readable.
    explanation: "Do not rely on garbage-collection timing to release a file. `with open('file') as f:` closes it when the block exits, including when an exception unwinds the block. Other context managers define their own exit behavior; for example, a database context may manage a transaction without closing the connection."

  - id: 5
    difficulty: intermediate
    question: "A student uses `re.findall(r'ERROR', text)` to count errors in a log. Their teammate suggests `text.count('ERROR')` instead. When is `re.findall()` the better choice?"
    options:
      - "`re.findall()` is always better because it's faster for string searching"
      - "When the target is a pattern (timestamps, IPs, variable text), not a fixed literal."
      - "`text.count()` only works on single characters, not multi-character strings"
      - "They are always interchangeable — use whichever you prefer"
    correct_index: 1
    option_feedback:
      0: |
        Regex carries pattern-matching overhead and complexity; for a fixed literal, `text.count()`
        communicates the intent better.
      2: |
        Python's `str.count()` counts substrings too, so `"ERROR"` is a perfectly valid literal search
        target.
      3: |
        A regex pattern language can mean more than the literal characters typed, so it is not
        interchangeable with substring search.
    explanation: "For a fixed literal like 'ERROR', `text.count('ERROR')` directly expresses the task and avoids regex machinery. `re.findall()` supports **patterns**, such as 'any sequence of digits' (`r'\\d+'`) or a timestamp shape in `HH:MM:SS` format. Use the simplest tool that works."

  - id: 6
    difficulty: advanced
    question: "A script needs to report both results (to stdout) and diagnostics (to stderr). A student puts everything in `print()`. Why is this problematic with output redirection such as `python script.py > results.txt`?"
    options:
      - "It is not problematic — `print()` already separates output and errors"
      - "`print()` writes to stdout, contaminating `results.txt`; use `file=sys.stderr`."
      - "`print()` is too slow for pipelines — use `sys.stdout.write()` instead"
      - "Pipelines only work with Bash scripts, not Python"
    correct_index: 1
    option_feedback:
      0: |
        `print()` writes to stdout unless told otherwise, so diagnostics need `file=sys.stderr` to stay
        out of pipeline data.
      2: |
        The bug is not the speed of `print()`; it is sending diagnostic text down the same channel as
        machine-readable output.
      3: |
        Pipelines connect processes through standard streams, so Python programs participate just like
        Bash, C, or any other executable.
    explanation: "UNIX separates stdout (file descriptor 1) and stderr (fd 2) for exactly this reason. `> results.txt` redirects only stdout, so diagnostics sent to `print()` contaminate the data file. Send them to `file=sys.stderr` instead — downstream tools then receive clean machine-readable output, the same reason C++ separates `std::cout` from `std::cerr`."

  - id: 7
    difficulty: advanced
    question: |
      A student writes this list comprehension:
      ```python
      result = [x**2 for x in range(1000000) if x % 2 == 0]
      ```
      The program only needs one pass through these values. Their teammate says: "Use a **generator expression** to avoid storing them all." What would the generator version look like, and why does it use less memory here?
    options:
      - "Replace `[]` with `()`: `(x**2 for x in range(1000000) if x % 2 == 0)` — values produced lazily."
      - "Use `list()` around the comprehension to make it a generator"
      - "Generators don't exist in Python — the student should use `itertools.imap()` instead"
      - "There is no memory difference — Python automatically optimizes large comprehensions into generators"
    correct_index: 0
    option_feedback:
      1: |
        `list(...)` forces eager materialization; replacing brackets with parentheses is what creates a
        lazy generator expression.
      2: |
        Generator expressions are built into modern Python; `itertools.imap()` is a Python 2 era false
        trail.
      3: |
        Python does not silently turn list comprehensions into generators; brackets mean a list is
        allocated.
    explanation: "Replacing `[...]` with `(...)` creates a generator expression. It produces values one at a time using constant memory, instead of building the 500,000-element list upfront. When you only need to iterate once and don't need to store the full collection, generators are dramatically more memory-efficient."

  - id: 8
    difficulty: intermediate
    question: |
      Each call that omits `items` should start with an empty list. Why does this implementation violate that contract?
      ```python
      def add_item(item, items=[]):
          items.append(item)
          return items
      ```
    options:
      - "No bug — the default empty list is created fresh on each call"
      - "Bug: `items=[]` evaluates once at def time, so calls share one mutated list."
      - "Bug: `append()` doesn't work on lists — you should use `items + [item]`"
      - "Bug: default arguments must be `None` in Python — `[]` causes a SyntaxError"
    correct_index: 1
    option_feedback:
      0: |
        Python evaluates default arguments once when the function is defined, so the same list is reused
        on later calls.
      2: |
        `append()` mutates lists correctly; the problem is which list object is being mutated across
        calls.
      3: |
        Mutable defaults are legal Python; they are dangerous because their shared lifetime is easy to
        miss.
    explanation: "A default argument is evaluated once when the function is defined, not per call, so a mutable default (`list`, `dict`, `set`) is shared across every call that omits it. The fix is to default to `None` and create a fresh list inside: `def add_item(item, items=None): if items is None: items = []; ...`"

  - id: 9
    difficulty: advanced
    question: |
      **Arrange** the lines to define a function that safely reads a file and returns the word count, using `with` for resource management.
    type: parsons
    lines:
      - "def count_words(filename):"
      - "    total = 0"
      - "    with open(filename) as f:"
      - "        for line in f:"
      - "            total += len(line.split())"
      - "    return total"
    distractors:
      - "    f.close()"
      - "    return len(f)"
    explanation: "The function opens the file with `with`, iterates line by line, and accumulates the word count. `return total` sits at function level (one indent), not inside the loop. `f.close()` is a distractor because `with` handles cleanup automatically; `return len(f)` is wrong because file objects have no meaningful `len()`."

  - id: 10
    difficulty: basic
    question: |
      **Arrange** the lines to create a list comprehension that filters and transforms data, then prints the result.
    type: parsons
    lines:
      - "scores = [95, 83, 71, 62, 55]"
      - "passing = [s for s in scores if s >= 70]"
      - "print(f'Passing scores: {passing}')"
    distractors:
      - "passing = scores.filter(s >= 70)"
    explanation: "List comprehensions use the form `[expr for var in iterable if condition]`. Python lists have no `.filter()` method — that distractor is borrowed from JavaScript. The f-string in the print statement automatically converts the list to its string representation."

  # Retrieval moves from bindings to shared members, then revisits both in calls and inheritance.
  - id: 11
    type: single
    difficulty: intermediate
    question: |
      What does this weather-station label update print?
      ```python
      label = "Coastal"
      archived = label
      label += " Station"
      label = None
      print(archived, label is None)
      ```
    options:
      - "`Coastal Station True`"
      - "`Coastal True`"
      - "`None True`"
      - "`Coastal False`"
    correct_index: 1
    option_feedback:
      0: "String concatenation rebinds label; the string reached by archived is unchanged."
      2: "Rebinding one name to None does not redirect the other name or destroy its reachable object."
      3: "The final assignment does bind label to the None singleton."
    explanation: "archived keeps the original immutable string. Each later assignment changes only label's binding; all of these values, including None, are objects."

  - id: 12
    type: single
    difficulty: intermediate
    question: |
      What does this print?
      ```python
      hourly = [18, 20]
      reports = [hourly, hourly]
      reports[0][1] = 22
      hourly = [99]
      print(reports)
      ```
    options:
      - "`[[18, 22], [18, 20]]`"
      - "`[[99], [99]]`"
      - "`[[18, 22], [18, 22]]`"
      - "`[[18, 20], [18, 20]]`"
    correct_index: 2
    option_feedback:
      0: "Both outer slots refer to one inner list, so the indexed mutation appears through both."
      1: "Rebinding hourly does not replace references already stored in reports."
      3: "Replacing an element mutates a list; lists do not have the immutability rule that strings have."
    explanation: "The outer list stores the same inner-list reference twice. Mutation changes that shared inner object, while rebinding hourly changes only a name."

  - id: 13
    type: single
    difficulty: intermediate
    question: |
      Two instruments share a calibration object. What does this print?
      ```python
      class Calibration:
          def __init__(self, offset):
              self.offset = offset

      class Instrument:
          def __init__(self, calibration):
              self.calibration = calibration

      calibration = Calibration(1)
      west = Instrument(calibration)
      east = Instrument(calibration)
      west.calibration.offset = 4
      west.calibration = Calibration(9)
      print(west.calibration.offset, east.calibration.offset)
      ```
    options:
      - "`9 9`"
      - "`9 1`"
      - "`4 4`"
      - "`9 4`"
    correct_index: 3
    option_feedback:
      0: "Replacing west's member reference does not replace east's member reference."
      1: "The earlier offset assignment mutated the original shared Calibration, so east sees 4."
      2: "The final assignment gives west a reference to a newly constructed Calibration."
    explanation: "The nested assignment changes the shared member object. The later assignment replaces one instrument's member reference, leaving the other instrument attached to the original calibration."

  - id: 14
