  - id: 18
    type: single
    difficulty: advanced
    question: |
      This function must append to and return a supplied list, even when it is
      empty. Only an omitted argument or `None` should request a new list.
      Which replacement condition fixes the contract?
      ```python
      def record_alert(alert, alerts=None):
          if not alerts:
              alerts = []
          alerts.append(alert)
          return alerts
      ```
    options:
      - "`alerts is None`"
      - "`alerts == []`"
      - "`len(alerts) == 0`"
      - "`alerts is not None`"
    correct_index: 0
    option_feedback:
      1: "An empty list is a valid destination supplied by the caller; replacing it loses the requested identity."
      2: "None has no length, and emptiness would still be the wrong condition for a supplied list."
      3: "This replaces supplied lists while leaving the missing value as None, which has no append method."
    explanation: "The None singleton distinguishes absence from an empty destination. Create the new list inside the call; a list used as a default would instead be created when the def statement executes."

  - id: 19
    type: single
    difficulty: intermediate
    question: |
      What does this print?
      ```python
      class Sensor:
          def __init__(self):
              print("base")

      class Passive(Sensor):
          pass

      class Active(Sensor):
          def __init__(self):
              print("active")

      Passive()
      Active()
      ```
    options:
      - "`base`, then `base`, then `active`"
      - "`active` only"
      - "`base`, then `active`"
      - "`base` only"
    correct_index: 2
    option_feedback:
      0: "An overriding initializer does not automatically run a separate base initializer first."
      1: "Passive inherits Sensor.__init__, so its construction does print base."
      3: "Active overrides __init__, and its own initializer still executes."
    explanation: "A subclass without its own initializer inherits one. A subclass that overrides it must explicitly call super().__init__ when it needs the base initialization."

  - id: 20
    type: single
    difficulty: advanced
    question: |
      What does this print?
      ```python
      class Sensor:
          def label(self):
              return "reading"
          def report(self):
              return self.label()

      class WindSensor(Sensor):
          def label(self):
              return super().label() + " wind"

      sensor = WindSensor()
      print(sensor.report())
      ```
    options:
      - "`reading`"
      - "`reading wind`"
      - "`wind`"
      - "`RecursionError`"
    correct_index: 1
    option_feedback:
      0: "The inherited report method still receives the WindSensor instance; self.label finds its override."
      2: "The override includes the result of the base label method before adding its suffix."
      3: "super continues lookup after WindSensor rather than calling the same override again."
    explanation: "Inherited methods and super calls operate on the same instance. In this single-inheritance example, dynamic dispatch selects WindSensor.label, and super selects Sensor.label."

  - id: 21
    type: single
    difficulty: intermediate
    question: |
      A CPython list holds n readings, and a second list holds m readings.
      Assume each equality comparison costs O(1). Which cost comparison is correct?
    options:
      - "Indexing: O(n); missing membership: O(1); concatenation: O(m)."
      - "Indexing: O(1); missing membership: O(1); concatenation: O(1)."
      - "Indexing: O(n); missing membership: O(n); concatenation: O(1)."
      - "Indexing: O(1); missing membership: O(n); concatenation: O(n + m)."
    correct_index: 3
    option_feedback:
      0: "Array-style indexing reaches a slot directly, whereas establishing that a value is absent may visit every slot."
      1: "A membership search can inspect all n values; a new concatenated list needs n + m references."
      2: "Indexed access does not traverse earlier slots, and concatenation must populate its new outer list."
    explanation: "CPython lists use an array of references. Concatenation differs from append, which adds one object in amortized O(1), and extend, which adds m references in amortized O(m)."

