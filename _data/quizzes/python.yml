  # Later practice combines ownership decisions with the earlier reference model.
  - id: 23
    type: single
    difficulty: advanced
    question: |
      An ordinary `station` object has a mutable `calibration` member and a
      `readings` list of immutable numbers. Create a separate station whose
      readings list can change independently, but whose calibration stays shared.
      Assume `import copy` and standard copying behavior. Which implementation
      meets all three requirements?
    options:
      - "Deep-copy the station and both of its mutable members."
      - "Shallow-copy the station and leave its members shared."
      - "Shallow-copy the station, then copy its readings list."
      - "Alias the station, then replace its readings with a copy."
    correct_index: 2
    option_feedback:
      0: "Deep copying would also duplicate the mutable calibration, but this contract deliberately keeps that collaborator shared."
      1: "A shallow object copy creates a new station but initially shares its readings list as well as its calibration."
      3: "Assignment aliases the original station. Replacing draft.readings would therefore replace the original station's member too."
    explanation: "Choose copying depth from the required ownership. A shallow station copy preserves the calibration reference; replacing just its readings member with a new list makes those two lists independent. Sharing their immutable numbers is safe."

  - id: 24
    type: single
    difficulty: advanced
    question: |
      What does this print after the name used in the default expression is rebound?
      ```python
      pending = []

      def collect(value, bucket=pending):
          bucket.append(value)
          return bucket

      pending = []
      first = collect(4)
      second = collect(8, pending)
      print(first, second, first is pending)
      ```
    options:
      - "`[4, 8] [4, 8] True`"
      - "`[4] [8] False`"
      - "`[4] [8] True`"
      - "`[4, 8] [] False`"
    correct_index: 1
    option_feedback:
      0: "The default keeps the list selected when def ran; it does not look up the new pending binding on each call."
      2: "The two lists hold different contents here, and first refers to the old default list rather than the new pending list."
      3: "Passing pending explicitly overrides the default, so the second call appends to the new list."
    explanation: "A default expression can be a name, not just a literal. Evaluating pending at definition time stores its current list as the default. Rebinding pending later does not redirect that stored reference."

