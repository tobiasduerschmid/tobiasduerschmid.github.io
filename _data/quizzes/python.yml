    explanation: "The class owns the shared issued counter. Each instance owns its serial, and first later acquires an issued attribute that shadows the class attribute."

  - id: 15
    type: single
    difficulty: advanced
    question: |
      What does this print?
      ```python
      import copy
      measurements = [12]
      live = [measurements, measurements]
      shallow = copy.copy(live)
      saved = copy.deepcopy(live)
      shallow[0].append(15)
      print(live[1], saved[0], saved[0] is saved[1])
      ```
    options:
      - "`[12] [12] False`"
      - "`[12, 15] [12, 15] True`"
      - "`[12, 15] [12] True`"
      - "`[12, 15] [12] False`"
    correct_index: 2
    option_feedback:
      0: "A shallow outer copy still refers to the original inner list, so that list changes."
      1: "The deep copy has its own mutable inner list; the source mutation does not reach it."
      3: "Deepcopy remembers repeated references: both saved slots reach one new inner list."
    explanation: "A shallow copy preserves original member references. A deep copy isolates this mutable list graph while preserving the sharing relationship inside the copied graph."

