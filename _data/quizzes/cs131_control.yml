title: 'CS 131: Control and Concurrency'
description: Short traces and repairs for evaluation, branching, iteration, generators, and asynchronous operations.
active: true
# Original replacement practice. Page references are physical PDF pages.
# Time estimates are planning estimates, not time limits.
questions:
  # Lecture: control_palooza_v7_handouts.pdf pp.2–8
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P2 (evaluate side effects in order; supporting prerequisite)
  - id: cs131-v2-control-operand-order
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 40
    question: A toy language evaluates the operands of `-` from left to right. Each call to `next_value()` increments a global counter and returns the new value. The counter starts at 0. What is `next_value() - next_value()`?
    options:
    - −1
    - '0'
    - '1'
    correct_index: 0
    option_feedback:
      1: Each call executes separately and changes the counter; the operands are not the same value.
      2: This would follow from evaluating the right operand before the left.
    explanation: The left call returns 1, then the right call returns 2, so the result is 1 − 2 = −1.

  # Lecture: control_palooza_v7_handouts.pdf pp.4–8
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P2 (reason about evaluation rules; supporting prerequisite)
  - id: cs131-v2-control-grouping-order
    type: single
    difficulty: basic
    bloom: understand
    estimated_seconds: 40
    question: A language groups subtraction left-associatively, so `f() - g() - h()` means `(f() - g()) - h()`. Which additional fact is still needed to predict the order of messages printed inside f, g, and h?
    options:
    - Whether subtraction returns a number
    - Which operand is evaluated first
    - Whether the expression has parentheses
    correct_index: 1
    option_feedback:
      0: The result’s numeric type does not determine the order in which calls execute.
      2: Parentheses specify grouping, but the language must still define the evaluation order.
    explanation: Associativity fixes grouping; operand-evaluation order fixes when effectful calls run. Grouping alone does not specify that order.

  # Lecture: control_palooza_v7_handouts.pdf pp.9–15
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P2 (demanded evaluation; supporting prerequisite)
  - id: cs131-v2-control-and-short-circuit
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: |-
      The toy language uses left-to-right short circuit for `&&`. `check(tag, result)` prints tag and returns result. What is printed?

      ```text
      if check("A", true) && check("B", false) && check("C", true):
          print("body")
      ```
    options:
    - A, B
    - A, B, C
    - A, B, C, body
    correct_index: 0
    option_feedback:
      1: Once B is false, evaluating C cannot make the conjunction true.
      2: A false operand both stops this conjunction and prevents the if body.
    explanation: A succeeds, but B makes the conjunction false. C and the body are not executed.

  # Lecture: control_palooza_v7_handouts.pdf pp.9–15
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P2 (identify evaluated operations; supporting prerequisite)
  - id: cs131-v2-control-or-demand
    type: multiple
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: |-
      `&&` and `||` short-circuit left to right. Each function prints its name and returns the shown Boolean. Select every function that runs.

      ```text
      A() returns false
      B() returns true
      C() returns false
      D() returns true

      result = A() || (B() && C() && D())
      ```
    options:
    - A
    - B
    - C
    - D
    correct_indices:
    - 0
    - 1
    - 2
    option_feedback:
      3: The false result from C already makes the AND chain false.
      1: A being false forces evaluation of the right operand of OR.
      2: AND skips its right operand only when its left operand is false; B is true.
    explanation: A is false, so the right side of OR is needed. B is true, so C is needed. C is false, so D is skipped.

  # Lecture: control_palooza_v7_handouts.pdf pp.21–22
  # Assessment: [Final] F24 Solutions (Public).pdf P6(A,B) pp.19–20 (loop/generator trace; control prerequisite)
  - id: cs131-v2-control-continue-break
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: |-
      What values does this Python loop print?

      ```python
      for n in [1, 2, 3, 4]:
          if n == 2:
              continue
          if n == 4:
              break
          print(n)
      ```
    options:
    - '1'
    - 1, 3
    - 1, 3, 4
    correct_index: 1
    option_feedback:
      0: continue skips one iteration rather than ending the entire loop.
      2: break leaves the loop before the final print can run.
    explanation: continue skips the rest of the n = 2 iteration. break exits before printing 4.

  # Lecture: control_palooza_v7_handouts.pdf p.34
  # Assessment: CS131 Fall 25 Quiz 3 Solutions (Public).docx P4 (trace control transfers; supporting prerequisite)
  - id: cs131-v2-control-switch-fallthrough
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: |-
      In this C++ switch, what is printed?

      ```cpp
      int level = 2;
      switch (level) {
          case 1: cout << "A "; break;
          case 2: cout << "B ";
          default: cout << "D "; break;
      }
      ```
    options:
    - B
    - D
    - B D
    correct_index: 2
    option_feedback:
      0: A C++ case label does not automatically end a case’s execution.
      1: The matching case executes before control reaches default by fall-through.
    explanation: Execution starts at case 2 and continues into default because there is no intervening break.

  # Lecture: control_palooza_v7_handouts.pdf pp.50–53
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P2(a) (desugar iteration)
  - id: cs131-v2-control-iterator-advance
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: |-
      An iterator starts before the first value in `[4, 7, 9]`. `next()` returns the next value and advances once; `hasNext()` only checks. What is printed?

      ```text
      it.next()
      if it.hasNext():
          print(it.next())
      ```
    options:
    - '4'
    - '7'
    - '9'
    correct_index: 1
    option_feedback:
      0: The first call consumed 4 even though its result was not printed.
      2: hasNext checks availability without consuming an item.
    explanation: The discarded first next returns 4. hasNext does not move the iterator, so the second next returns 7.

  # Lecture: control_palooza_v7_handouts.pdf pp.48–50,59–60
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P2(b,d) (nested and independent traversal)
  - id: cs131-v2-control-independent-iterators
    type: single
    difficulty: advanced
    bloom: evaluate
    estimated_seconds: 60
    question: Two nested loops must each traverse the same reusable range from its beginning. Which design preserves both loops' positions independently?
    options:
    - The range returns one shared iterator.
    - Each loop receives a fresh iterator.
    - Each loop resets the shared iterator.
    correct_index: 1
    option_feedback:
      0: A single position cannot track two simultaneous traversals independently.
      2: Resetting the shared position for the inner loop also resets the outer loop’s position.
    explanation: Each traversal needs its own current position. A shared iterator lets one loop alter the other’s progress.

  # Lecture: control_palooza_v7_handouts.pdf pp.63–65
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P2(c); [Final] F24 Solutions (Public).pdf P6(B) p.20 (generator demand trace)
  - id: cs131-v2-control-generator-first-demand
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: |-
      What does this Python code print?

      ```python
      def values():
          print("start")
          yield 5

      g = values()
      print("ready")
      print(next(g))
      ```
    options:
    - start, ready, 5
    - ready, start, 5
    - ready, 5, start
    correct_index: 1
    option_feedback:
      0: The generator body starts on next, not when values() creates the object.
      2: Statements before yield execute before the yielded value is returned.
    explanation: Calling values creates a generator without running its body. next begins the body, prints start, and yields 5.

  # Lecture: control_palooza_v7_handouts.pdf pp.64–68
  # Assessment: [Final] F24 Solutions (Public).pdf P6(B) p.20 (successive generator calls)
  - id: cs131-v2-control-generator-resume
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 40
    question: |-
      What does this Python code print?

      ```python
      def values(n):
          yield n
          n += 2
          yield n

      g = values(3)
      print(next(g))
      print(next(g))
      ```
    options:
    - 3, 3
    - 3, 5
    - 5, 7
    correct_index: 1
    option_feedback:
      0: A later next resumes saved state instead of restarting the function.
      2: The increment is after the first yield, so it cannot affect the first result.
    explanation: The first next pauses at yield with n = 3. The second resumes after that yield, increments n, and yields 5.

  # Lecture: control_palooza_v7_handouts.pdf pp.56,59–60
  # Assessment: [Final] F24 Solutions (Public).pdf P6(C.1) p.21; [Final] F23 Solutions (Public).pdf Iteration pp.24–25 (complete iterator)
  - id: cs131-v2-control-iterator-repair
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 50
    question: |-
      An iterator's position starts at 0. This Python method keeps returning the first item. Which single line belongs in the blank?

      ```python
      def __next__(self):
          if self.pos >= len(self.items):
              raise StopIteration
          value = self.items[self.pos]
          # blank
          return value
      ```
    options:
    - self.pos = 0
    - self.pos += 1
    - self.items = []
    correct_index: 1
    option_feedback:
      0: Resetting the position repeats the first item.
      2: Emptying the container discards its data rather than advancing this traversal.
    explanation: Advancing the saved position makes the next call retrieve the following item and eventually reach the end.

  # Lecture: control_palooza_v7_handouts.pdf pp.56,59–60
  # Assessment: [Final] F24 Solutions (Public).pdf P6(C.1) p.21; [Final] F23 Solutions (Public).pdf Iteration pp.24–25 (construct iterator)
  - id: cs131-v2-control-iterator-next-body
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 75
    question: Arrange the Python method to return the current list item, advance exactly once, and raise StopIteration when no item remains. `self.pos` is initially 0. Preserve indentation. The method must also work on an empty list.
    lines:
    - 'def __next__(self):'
    - '    if self.pos >= len(self.items):'
    - '        raise StopIteration'
    - '    value = self.items[self.pos]'
    - '    self.pos += 1'
    - '    return value'
    distractors:
    - '    self.pos = 0'
    explanation: Check the boundary before reading. Save the current item before advancing, then return that saved value. Resetting would repeat items instead of progressing.

  # Lecture: control_palooza_v7_handouts.pdf pp.63–67
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P2; [Final] F24 Solutions (Public).pdf P6(A) p.19 (complete a generator)
  - id: cs131-v2-control-countdown-generator
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 75
    question: Arrange the Python lines to make `down(2)` yield `2, 1, 0` and then finish. Preserve indentation; the counter should decrease after each yielded value.
    lines:
    - 'def down(n):'
    - '    while n >= 0:'
    - '        yield n'
    - '        n -= 1'
    distractors:
    - '        return n'
    - '        n += 1'
    explanation: yield suspends while preserving the counter. On resumption, decrement before checking the loop again. return ends the generator, and incrementing moves away from termination.

  # Lecture: control_palooza_v7_handouts.pdf pp.103–104,107–110
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P3(a) (scheduled-spawn/await trace)
  - id: cs131-v2-control-scheduled-spawn
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 50
    question: |-
      Use the lecture's single-threaded runtime. Scheduled spawn queues work without running it immediately; await suspends until that work completes. What is printed?

      ```text
      operation job() { print("J") }
      operation main() {
          h = spawn_scheduled(job())
          print("M")
          await(h)
          print("D")
      }
      ```
    options:
    - J, M, D
    - M, J, D
    - M, D, J
    correct_index: 1
    option_feedback:
      0: Scheduled spawn queues job; it does not run job before returning to main.
      2: Awaiting an unfinished job prevents main from printing D before J.
    explanation: main prints M before yielding at await. The runtime then runs job; only after job finishes can main print D.

  # Lecture: control_palooza_v7_handouts.pdf pp.104–110
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P3(a) (inline versus scheduled work)
  - id: cs131-v2-control-inline-spawn
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 75
    question: |-
      The runtime is single-threaded. `sleep(1)` finishes later; all prints take negligible time. Inline spawn runs the child until it suspends or finishes. What is printed?

      ```text
      operation job() {
          print("J1")
          await(sleep(1))
          print("J2")
      }
      operation main() {
          h = spawn_inline(job())
          print("M")
          await(h)
          print("D")
      }
      ```
    options:
    - J1, J2, M, D
    - M, J1, J2, D
    - J1, M, J2, D
    correct_index: 2
    option_feedback:
      0: Inline spawning returns control when the child suspends; it does not implicitly await the child’s completion.
      1: Inline spawn begins the child immediately, before the caller’s next statement.
    explanation: Inline spawn prints J1, then job suspends on the timer. main prints M and awaits job. The timer permits J2, then main can print D.

  # Lecture: control_palooza_v7_handouts.pdf pp.108–110
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P3(b) (deduce async primitive behavior)
  - id: cs131-v2-control-await-complete
    type: multiple
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: Under the lecture's await rules, h refers to an operation that has already completed successfully with result 6. Select every effect of executing `x = await(h)`.
    options:
    - x receives 6.
    - The operation starts again.
    - The caller continues without suspending.
    correct_indices:
    - 0
    - 2
    option_feedback:
      1: A handle identifies existing work; awaiting its result is not another spawn.
      2: Suspension is needed only when the awaited operation has not finished.
    explanation: Await retrieves a completed operation’s result immediately. It does not start a second execution.
