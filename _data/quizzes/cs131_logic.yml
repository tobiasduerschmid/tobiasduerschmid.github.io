title: "CS 131: Logic Programming"
description: "Reason about relations, unification, search order, negation, and recursive list processing in Prolog."
active: true
questions:
  # Sources: logic_palooza_v6.pptx slides 6–7; Homework Problems (Public).docx LOGIC2 B.1–B.3.
  - id: relation-argument-contract
    type: single
    bloom: understand
    difficulty: basic
    question: A data importer reads columns `(sender, recipient)` and writes facts for a documented relation `receives(Recipient, Sender)`. It currently
      writes those two columns in their original order. Why can its facts be accepted by Prolog but answer delivery queries incorrectly?
    options:
    - Prolog automatically reverses argument order for receives.
    - The facts have legal structure but violate the documented roles.
    - Prolog changes relation meanings to match each query direction.
    - Two-argument predicates cannot represent directed relationships.
    correct_index: 1
    option_feedback:
      0: Predicate names do not tell Prolog which columns to reverse. The importer must apply the documented mapping.
      2: Queries use the relation's existing argument convention; they do not reinterpret its facts.
      3: Ordered arguments can represent directed relationships when facts and rules use them consistently.
    explanation: A structurally valid fact can still encode the wrong intended relationship. The importer must place the recipient column first
      and the sender column second to honor this relation's contract.

  # Sources: logic_palooza_v6.pptx slides 7, 14–19; Homework Problems (Public).docx LOGIC3 A.1–A.2.
  - id: shared-intermediate-variable
    type: single
    bloom: apply
    difficulty: intermediate
    question: '`loaded(Package, Truck)` and `drives(Driver, Truck)` describe deliveries. Which rule finds the driver responsible for a package by
      requiring both facts to name the same truck?'
    options:
    - '`responsible(P, D) :- loaded(P, T), drives(D, U).`'
    - '`responsible(P, D) :- loaded(P, T), drives(T, D).`'
    - '`responsible(P, D) :- loaded(P, T), drives(D, T).`'
    - '`responsible(P, D) :- loaded(T, P), drives(D, T).`'
    correct_index: 2
    option_feedback:
      0: Separate T and U variables allow a package's truck and a driver's truck to differ.
      1: Drives places the driver first and truck second; this subgoal reverses those roles.
      3: Loaded places the package first and truck second; this subgoal reverses those roles.
    explanation: The same T appears in the truck position of both different relations. Unification therefore connects a package to a driver through
      one consistent truck binding.

  # Sources: logic_palooza_v6.pptx slides 22, 26–30; Homework Problems (Public).docx LOGIC4 A.6–A.7.
  - id: nested-term-bindings
    type: single
    bloom: apply
    difficulty: intermediate
    question: Starting with no bindings, what makes `batch([parcel(X)|Tail], Tail)` unify with `batch([parcel(red), parcel(blue)], [parcel(blue)])`?
    options:
    - '`X = parcel(red), Tail = [parcel(blue)]`'
    - '`X = red, Tail = parcel(blue)`'
    - It fails because a variable cannot name a list tail.
    - '`X = red, Tail = [parcel(blue)]`'
    correct_index: 3
    option_feedback:
      0: X is inside the parcel term, so it matches red rather than the complete parcel(red).
      1: Tail matches the remaining list, not its single element.
      2: A variable may bind to a whole list, and the repeated Tail is consistent in both positions.
    explanation: The first list element matches parcel(X), binding X to red. Its remaining list binds Tail to [parcel(blue)], which also matches
      the second argument of batch.

  # Sources: logic_palooza_v6.pptx slides 22–26, 35–36; [Final] F22 (Public).pdf p10 question 20.
  - id: repeated-variable-consistency
    type: multiple
    bloom: analyze
    difficulty: intermediate
    question: "Which independent unifications succeed with no initial bindings? Select all that apply."
    options:
      - "`pair(X, X) = pair(red, red)`"
      - "`pair(X, X) = pair(red, blue)`"
      - "`pair(X, X) = pair([red], red)`"
      - "`pair(X, X) = pair(red, leaf(red))`"
      - "`pair(X, X) = pair(node(red), node(red))`"
    correct_indices: [0, 4]
    option_feedback:
      0: "Both occurrences can take the same atom red, so the repeated-variable constraint is satisfied."
      1: "One X cannot be both red and blue in a single successful unification."
      2: "A one-element list and its element are different terms. X cannot denote both here."
      3: "X would need to equal both red and leaf(red). An atom and a compound term are different structures."
      4: "A variable may bind to a whole compound term. Both positions supply the same node(red) term."
    explanation: "Repeated occurrences of a variable impose equality of the entire corresponding terms, including nested structure. They are not independent wildcards."

  # Sources: logic_palooza_v6.pptx slides 21, 24, 29; [Final] F22 (Public).pdf p10 question 20.
  - id: respect-existing-bindings
    type: single
    bloom: apply
    difficulty: intermediate
    question: "During one proof branch, `Place = east` is already established. What happens when Prolog tries to unify `delivery(Place, Item)` with `delivery(west, book)`?"
    options:
      - "It fails because east and west differ."
      - "It succeeds and changes Place to west."
      - "It succeeds with Place storing both places."
      - "It succeeds but leaves Item unbound."
    correct_index: 0
    option_feedback:
      1: "Unification must respect bindings already required by the current proof branch; it is not assignment that overwrites them."
      2: "A variable has one consistent value within a branch, rather than collecting incompatible matches."
      3: "The mismatch in Place prevents the whole unification from succeeding, regardless of Item."
    explanation: "Applying the existing binding gives delivery(east, Item). Its first argument cannot match west. A later search alternative may undo a branch's bindings, but this comparison cannot overwrite them."

  # Sources: logic_palooza_v6.pptx slides 15, 18–19, 31; CS131 Fall 25 Quiz 4 (with solutions).docx Problem 4.
  - id: backtracking-restores-bindings
    type: single
    bloom: analyze
    difficulty: intermediate
    question: |
      Prolog tries facts top to bottom and subgoals left to right. What does `usable(P)` produce?

      ```prolog
      slot(north, 1). slot(east, 3). slot(west, 4).
      empty(north). empty(west).
      usable(P) :- slot(P, Length), Length >= 2, empty(P).
      ```
    options:
    - It fails permanently when north is too short.
    - It produces east, then west.
    - It backtracks past north and east, then produces west.
    - It changes north's length to 2 and produces north.
    correct_index: 2
    option_feedback:
      0: Failure of the length comparison permits trying later slot facts.
      1: East meets the length condition but fails empty(east); every subgoal must succeed.
      3: The comparison tests a bound numeric value. It does not update the fact or increase the length.
    explanation: North fails the length check. East passes it but lacks an empty fact. Each failed branch is undone; west satisfies both conditions
      and becomes the only successful binding.

  # Sources: logic_palooza_v6.pptx slides 13–19; CS131 Fall 25 Quiz 4 (with solutions).docx Problem 4; [Final] F23 (Public).pdf p23 question 8b.
  - id: proof-order-and-duplicates
    type: single
    bloom: analyze
    difficulty: advanced
    question: |
      With top-to-bottom clauses and left-to-right subgoals, what sequence does `readable(D)` produce when all answers are requested?

      ```prolog
      grant(jo, draft). grant(jo, guide).
      public(guide). public(index).
      readable(D) :- grant(jo, D).
      readable(D) :- public(D).
      ```
    options:
    - '`D = draft; D = guide; D = index`'
    - '`D = draft; D = guide; D = guide; D = index`'
    - '`D = draft; D = guide; D = index; D = guide`'
    - '`D = guide; D = index; D = draft; D = guide`'
    correct_index: 1
    option_feedback:
      0: Guide has two successful proofs. Ordinary search does not automatically deduplicate equal bindings.
      2: The public facts are explored in order, with guide before index.
      3: The grant clause appears before the public clause, so its answers are explored first.
    explanation: The grant clause yields draft and guide. The public clause then yields guide and index. Different proofs of guide each produce
      an answer unless separate deduplication is requested.

  # Sources: logic_palooza_v6.pptx slides 20, 30–31; [Final] F22 (Public).pdf p11 question 21.
  - id: unification-within-resolution
    type: multiple
    bloom: understand
    difficulty: basic
    question: "A query engine matches a goal with a rule head, then tries to prove the rule's body. Which descriptions of its work are correct? Select all that apply."
    options:
      - "Matching the head can establish variable bindings."
      - "Matching the head alone proves every body subgoal."
      - "Proving the body may require more unifications."
      - "Failure in the body can trigger another rule choice."
      - "Unification enumerates the whole proof search tree."
    correct_indices: [0, 2, 3]
    option_feedback:
      0: "The matching step determines substitutions that make the goal and head agree."
      1: "The head identifies a possible rule; its body still imposes conditions that must be proved."
      2: "Body subgoals must themselves match facts or rule heads, carrying forward consistent bindings."
      3: "Resolution includes exploring alternatives after an attempted proof fails."
      4: "Unification compares terms for a match. Resolution coordinates that operation across subgoals and alternative clauses."
    explanation: "Unification supplies consistent substitutions for a local match. Resolution uses such matches to expand goals, prove subgoals, and backtrack through alternative proofs."

  # Sources: logic_palooza_v6.pptx slides 11–12; transfer to incomplete-database reasoning.
  - id: missing-evidence-policy
    type: single
    bloom: evaluate
    difficulty: advanced
    question: "A maintenance database is known to omit some inspection results. A rule marks a machine safe whenever `not(failed_inspection(Machine))` succeeds. What is the strongest criticism of that safety decision?"
    options:
      - "It treats failure to prove danger as evidence of safety."
      - "It needs an explicit negative inspection fact to grant safety."
      - "It waits for every machine to have an inspection record."
      - "It first proves the machine failed, then marks it safe."
    correct_index: 0
    option_feedback:
      1: "Negation as failure does not require an explicit negative fact. An unsuccessful terminating search is enough."
      2: "The rule does not verify database completeness. Missing records are precisely what can make its conclusion unreliable."
      3: "If failed_inspection succeeds, its negation fails and this rule does not mark the machine safe."
    explanation: "Negation as failure reports that a terminating search cannot prove failed_inspection for this machine. An incomplete database does not justify turning that result into a real-world safety guarantee; positive inspection evidence would be needed."

  # Sources: logic_palooza_v6.pptx slides 12, 31–32; [Final] F23 (Public).pdf p24 question 8c.
  - id: bind-before-negation
    type: single
    bloom: analyze
    difficulty: advanced
    question: |
      Why does `free(X)` fail instead of finding ben?

      ```prolog
      person(ada). person(ben).
      busy(ada).
      free(X) :- not(busy(X)), person(X).
      ```
    options:
      - "Negation produces ada, which person then rejects."
      - "An unbound X makes the person facts unavailable."
      - "The comma requires busy and person to be the same predicate."
      - "The unbound busy query succeeds, so its negation fails."
    correct_index: 3
    option_feedback:
      0: "A successful inner proof makes not(busy(X)) fail; it does not export an answer to the next subgoal."
      1: "person(X) could enumerate both people, but search never reaches it because the earlier subgoal fails."
      2: "A comma conjoins goals with shared bindings. Their predicate names need not match."
    explanation: "With X unbound, busy(X) finds ada. Its negation therefore fails before person(X) runs. Writing person(X), not(busy(X)) first generates a concrete person and then checks that person, yielding ben for this finite database."

  # Sources: logic_palooza_v6.pptx slides 8–9, 31–32; [Final] S23 V1 (Public).pdf p11 question 5.
  - id: left-recursive-search
    type: single
    bloom: analyze
    difficulty: advanced
    question: |
      Under Prolog's usual depth-first search, what happens to `echo([ding])`?

      ```prolog
      echo(Words) :- echo(Prefix), append(Prefix, [ding], Words).
      echo([]).
      ```
    options:
    - It returns false because ding is not a declared fact.
    - It recurses indefinitely before reaching echo([]).
    - It returns true after automatically choosing the empty prefix.
    - Append shortens the query before echo(Prefix) starts.
    correct_index: 1
    option_feedback:
      0: Ding is an atom in a list; it needs no separate fact declaration to be used in this relation.
      2: Ordinary depth-first search does not skip a diverging first clause to try the base fact.
      3: The first subgoal is echo(Prefix). Append is not reached before that recursive search returns.
    explanation: The first clause invokes echo again without consuming any part of the known list. It therefore repeats the same unconstrained recursive
      choice. A finite-list recognizer should inspect and remove an input element before recurring.

  # Sources: logic_palooza_v6.pptx slides 34–37; Homework Problems (Public).docx LOGIC4 A.8–A.10.
  - id: list-head-and-tail
    type: single
    bloom: apply
    difficulty: intermediate
    question: "What does `[First, Second | Rest] = [[oak, elm], pine, birch]` bind?"
    options:
      - "`First = oak, Second = elm, Rest = [pine, birch]`"
      - "`First = [oak, elm], Second = pine, Rest = birch`"
      - "`First = [oak, elm], Second = pine, Rest = [birch]`"
      - "`First = [[oak, elm], pine], Second = birch, Rest = []`"
    correct_index: 2
    option_feedback:
      0: "The first element is itself a list. Matching an outer list does not flatten its nested elements."
      1: "Rest is the remaining list, not its sole element. A one-element tail is still a list."
      3: "Each named position before the bar matches one outer element; First does not take a two-element prefix."
    explanation: "The first two outer elements are [oak, elm] and pine. The remaining outer list contains birch, so Rest is [birch]."

  # Sources: logic_palooza_v6.pptx slides 39, 47; Homework Problems (Public).docx LOGIC8 A–B.
  - id: append-as-a-relation
    type: multiple
    bloom: apply
    difficulty: intermediate
    question: "Using the usual list relation `append(Prefix, Suffix, Whole)`, which bindings satisfy `append(Prefix, Suffix, [oak, elm])`? Select all that apply."
    options:
      - "`Prefix = [], Suffix = [oak, elm]`"
      - "`Prefix = [oak], Suffix = [elm]`"
      - "`Prefix = [elm], Suffix = [oak]`"
      - "`Prefix = [oak, elm], Suffix = []`"
    correct_indices: [0, 1, 3]
    option_feedback:
      0: "An empty prefix is permitted; concatenating it with the full suffix gives Whole."
      1: "Splitting between the two elements preserves their order when the lists are concatenated."
      2: "Concatenation preserves sequence. These two lists would produce [elm, oak]."
      3: "An empty suffix is permitted; the full prefix already equals Whole."
    explanation: "A relation can be queried for different unknown arguments. A two-element list has three prefix/suffix splits, including both empty-list boundaries."

  # Sources: logic_palooza_v6.pptx slides 38–46; [Final] F23 (Public).pdf pp22–24 question 8.
  - id: list-filter-overlapping-rules
    type: single
    bloom: analyze
    difficulty: advanced
    question: |
      This predicate should turn each ground command go into tick, retaining other commands. Why can `normalize([go], Out)` also return `Out = [go]`?

      ```prolog
      normalize([], []).
      normalize([go|Tail], [tick|Out]) :- normalize(Tail, Out).
      normalize([Head|Tail], [Head|Out]) :- normalize(Tail, Out).
      ```
    options:
    - The unchanged-head clause also matches go.
    - Prolog cannot put a literal atom in an output list.
    - The empty-list clause restores the original command.
    - Prolog treats go and tick as equal atoms.
    correct_index: 0
    option_feedback:
      1: Literal atoms can occur in list patterns and constructed outputs.
      2: The base clause produces an empty output only for the empty tail; it does not restore earlier input.
      3: Go and tick are distinct atoms. The extra output comes from a separate successful clause.
    explanation: The catch-all recursive clause overlaps the special go clause. For ground input, requiring Head to differ from go makes the unchanged-head
      branch exclusive and prevents an additional incorrect output.

  # Sources: Homework Problems (Public).docx LOGIC5 A.2; arithmetic is explicitly exercised there.
  - id: arithmetic-goal-order
    type: single
    bloom: apply
    difficulty: intermediate
    question: "In ordinary Prolog arithmetic, `is` evaluates its right-hand expression rather than solving equations. Why does `Total is Part + 2, Part = 5` raise an instantiation error?"
    options:
      - "The integer 2 must be written as an atom."
      - "The later equality tries to overwrite Total."
      - "Arithmetic expressions cannot appear in rule bodies."
      - "Part has no numeric value when is runs."
    correct_index: 3
    option_feedback:
      0: "The integer literal is valid. The missing input is the value of Part."
      1: "The error occurs before Part = 5 is reached; Total has not been successfully computed."
      2: "Rule bodies can evaluate arithmetic, but inputs on the right side of is must already be instantiated."
    explanation: "Subgoals execute left to right. Binding Part to 5 before evaluating Total is Part + 2 produces Total = 7; the later binding cannot retroactively supply an earlier arithmetic input."

  # Sources: logic_palooza_v6.pptx slide 49; extends its local cut example to explicit answer-preservation criteria.
  - id: cut-and-query-contract
    type: multiple
    bloom: evaluate
    difficulty: expert
    question: |
      A service promises to enumerate every available color. It uses the facts and rule below. Which review comments are justified? Select all that apply.

      ```prolog
      color(teal). color(amber).
      available(X) :- color(X), !.
      ```
    options:
      - "The cut makes available(X) omit amber on backtracking."
      - "Removing the cut restores enumeration for this database."
      - "The cut makes the underlying color(amber) fact false."
      - "The query available(amber) can still succeed."
    correct_indices: [0, 1, 3]
    option_feedback:
      0: "Once color(X) selects teal, the cut commits this invocation to that earlier choice."
      1: "Without the cut, backtracking can revisit color(X) and obtain amber."
      2: "Cut prunes search alternatives; it does not delete facts or change their logical content."
      3: "With amber already supplied, color(amber) finds that fact before the cut is reached."
    explanation: "The cut changes which proofs this invocation can explore. Its acceptability depends on the query contract: returning the first match can be useful, but it violates a promise to enumerate every match."
