title: "CS 131: Logic Programming"
description: "Short Prolog unification, search-order, and recursive-list problems modeled on course assessments."
active: true
# Reviewed against the supplied lecture notes, homework, and past assessments.
# Time estimates are planning estimates, not measured student completion times.
questions:
  # Lecture: [08] Logic Palooza (Public).docx — Prolog Facts; Prolog Queries
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P4(a)
  - id: cs131-v2-logic-atom-query
    type: single
    difficulty: basic
    bloom: understand
    estimated_seconds: 30
    question: |
      The entire Prolog database is shown. What is the result of `color(x)`?

      ```prolog
      color(red).
      color(blue).
      ```
    options:
      - "x is bound to red, then blue."
      - "The query fails."
      - "The query succeeds without a binding."
    correct_index: 1
    option_feedback:
      0: "Lowercase x is an atom, not a variable. A query using uppercase X would ask for bindings."
      2: "Neither fact establishes color(x); Prolog cannot prove this particular atom query."
    explanation: "The query asks whether the atom x has color. There is no matching fact, so it fails."

  # Lecture: [08] Logic Palooza (Public).docx — Matching a Goal and a Fact/Rule
  # Assessment: Homework Problems (Public).docx LOGIC4(A.10)
  - id: cs131-v2-logic-repeated-variable
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 30
    question: "In Prolog, can `pair(X, X)` unify with `pair(red, blue)`?"
    options:
      - "Yes, with X = red for both positions."
      - "Yes, with a different X in each position."
      - "No, because red and blue conflict."
    correct_index: 2
    option_feedback:
      0: "Binding X to red also requires the second argument to be red."
      1: "Repeated occurrences of the same variable share one consistent binding during a proof."
    explanation: "The first argument would bind X to red, but the second would require that same X to be blue. Unification fails."

  # Lecture: [08] Logic Palooza (Public).docx — Matching a Goal and a Fact/Rule
  # Assessment: Homework Problems (Public).docx LOGIC4(A.6,A.7)
  - id: cs131-v2-logic-nested-bindings
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: "In Prolog, unify `owns(P, bike(Color))` with `owns(lee, bike(green))`. Which bindings result?"
    options:
      - "P = lee; Color = green"
      - "P = lee; Color = bike(green)"
      - "P = owns; Color = green"
    correct_index: 0
    option_feedback:
      1: "Color occupies the argument inside bike(...), so it receives green, not the whole compound term."
      2: "owns is the outer functor. P aligns with the first argument lee."
    explanation: "Matching functors expose corresponding arguments: P matches lee, and the Color inside bike matches green."

  # Lecture: [08] Logic Palooza (Public).docx — Matching a Goal and a Fact/Rule
  # Assessment: Homework Problems (Public).docx LOGIC4(A.2,A.8)
  - id: cs131-v2-logic-existing-binding
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 45
    question: "The current Prolog proof has X = oak. Select every fact that can unify with the next goal `edge(X, Y)` under that binding. Treat each fact as a separate alternative."
    options:
      - "edge(oak, pine)."
      - "edge(pine, oak)."
      - "edge(oak, oak)."
      - "edge(oak)."
    correct_indices: [0, 2]
    option_feedback:
      0: "X remains oak, and this alternative binds Y to pine."
      1: "An existing binding cannot change from oak to pine while continuing the same proof."
      2: "Different variables may have the same value; Y may also be oak."
      3: "The functor's arity must match: edge/1 and edge/2 are different predicates."
    explanation: "Applying X = oak gives edge(oak, Y). Matching requires the same functor, two arguments, and oak in the first position."

  # Lecture: [08] Logic Palooza (Public).docx — Resolution: How Prolog Answers Queries
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P4(d)
  - id: cs131-v2-logic-fact-order
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 30
    question: |
      List all bindings for `Y`, in the order produced by the Prolog query `edge(a, Y)`.

      ```prolog
      edge(b, z).
      edge(a, c).
      edge(a, b).
      ```
    options:
      - "b, c"
      - "c, b"
      - "z, c, b"
    correct_index: 1
    option_feedback:
      0: "Prolog follows matching facts in source order; it does not alphabetize results."
      2: "edge(b, z) does not match the query's first argument a."
    explanation: "The first matching fact binds Y to c. On requesting another solution, the later matching fact binds Y to b."

  # Lecture: [08] Logic Palooza (Public).docx — Prolog Rules
  # Assessment: Homework Problems (Public).docx LOGIC3; CS131 Fall 25 Quiz 4 (with solutions).docx P4
  - id: cs131-v2-logic-shared-middle
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: |
      `two_step(X,Y)` should mean that an edge goes from X to some middle node and another edge goes from that same node to Y. Which body completes the Prolog rule?

      ```prolog
      two_step(X, Y) :- BODY.
      ```
    options:
      - "edge(X, Y), edge(Y, Z)"
      - "edge(X, Z), edge(W, Y)"
      - "edge(X, Z), edge(Z, Y)"
    correct_index: 2
    option_feedback:
      0: "This reaches Y on the first edge, then continues somewhere else. Y should be the endpoint of the second edge."
      1: "Z and W are unrelated variables, so the two edges need not connect."
    explanation: "Using Z in both subgoals forces the endpoint of the first edge to equal the start of the second."

  # Lecture: [08] Logic Palooza (Public).docx — Resolution: How Prolog Answers Queries
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P4(b,c)
  - id: cs131-v2-logic-proof-order
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |
      Arrange these resolution events for the first successful answer to the Prolog query `route(a, Out)`. Leave out the event that never occurs.

      ```prolog
      edge(a, b).
      edge(a, c).
      edge(c, d).
      route(X, Y) :- edge(X, M), edge(M, Y).
      ```
    lines:
      - "Bind X = a and replace route with its two edge subgoals."
      - "Match edge(a, M) using edge(a, b), so M = b."
      - "Fail to prove edge(b, Out), then backtrack."
      - "Retry edge(a, M) using edge(a, c), so M = c."
      - "Match edge(c, Out) using edge(c, d), so Out = d."
    distractors:
      - "Report Out = b after proving only the first subgoal."
    explanation: "A rule succeeds only after every subgoal succeeds. The b branch has no continuation, so its binding is undone and the c branch is tried."

  # Lecture: [08] Logic Palooza (Public).docx — Resolution Continued
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P4(c)
  - id: cs131-v2-logic-duplicate-proofs
    type: single
    difficulty: advanced
    bloom: analyze
    estimated_seconds: 75
    question: |
      What sequence of values does the Prolog query `reach(a, Y)` produce when all solutions are requested? Include duplicates.

      ```prolog
      edge(a, b).
      edge(a, c).
      edge(b, c).
      reach(X, Y) :- edge(X, Y).
      reach(X, Y) :- edge(X, M), edge(M, Y).
      ```
    options:
      - "b, c"
      - "b, c, c"
      - "b, b, c"
    correct_index: 1
    option_feedback:
      0: "The two-step proof through b produces another c. Prolog does not automatically remove duplicate bindings."
      2: "The two-step rule reaches c through b; it does not produce a second proof for b."
    explanation: "The direct rule gives b and c. The two-step rule then follows a to b to c, giving c again."

  # Lecture: [08] Logic Palooza (Public).docx — Resolution: How Prolog Answers Queries
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P4(b)
  - id: cs131-v2-logic-backtrack-binding
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 45
    question: |
      What is the first binding produced by the Prolog query `ready(X)`?

      ```prolog
      item(amber).
      item(teal).
      approved(teal).
      ready(X) :- item(X), approved(X).
      ```
    options:
      - "X = teal"
      - "X = amber"
      - "No binding; the query fails."
    correct_index: 0
    option_feedback:
      1: "item(amber) alone is insufficient: approved(amber) must also succeed."
      2: "A failed amber branch does not end the search. Backtracking allows the alternative item(teal)."
    explanation: "The amber branch fails at approved(amber). Prolog backtracks, replaces that branch's binding with X = teal, and proves both subgoals."

  # Lecture: [08] Logic Palooza (Public).docx — Prolog Lists: Example 2
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P5
  - id: cs131-v2-logic-list-tail
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 30
    question: "In Prolog, when `[H, Next | Tail]` unifies with `[red, blue, green]`, what are H, Next, and Tail?"
    options:
      - "H = red; Next = blue; Tail = green"
      - "H = red; Next = [blue]; Tail = [green]"
      - "H = red; Next = blue; Tail = [green]"
    correct_index: 2
    option_feedback:
      0: "Tail matches the remaining list, even when it contains only one element."
      1: "Next matches one element. Here that element is the atom blue, not a singleton list."
    explanation: "H and Next consume the first two elements. Tail is the list of all remaining elements, [green]."

  # Lecture: [08] Logic Palooza (Public).docx — Prolog Lists
  # Assessment: Homework Problems (Public).docx LOGIC4(A.8,A.9)
  - id: cs131-v2-logic-nested-list
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 45
    question: "Select every true statement after the Prolog list `[H | T]` unifies with `[[a,b], c]`."
    options:
      - "H = a"
      - "H = [a,b]"
      - "T = c"
      - "T = [c]"
    correct_indices: [1, 3]
    option_feedback:
      0: "The first element is itself the entire list [a,b]; head matching does not flatten it."
      1: "A list can be a single element of another list."
      2: "The tail is a list of remaining elements, not its sole element."
      3: "After consuming the first element, the remaining list contains only c."
    explanation: "The outer list has two elements: [a,b] and c. Its head is [a,b], and its tail is [c]."

  # Lecture: [08] Logic Palooza (Public).docx — Example 3: Checking if a list contains a value
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P4(c); Homework Problems (Public).docx LOGIC5
  - id: cs131-v2-logic-membership-trace
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |
      What sequence of bindings for X does the Prolog query `has(X, [a,b,a])` produce when all solutions are requested?

      ```prolog
      has(X, [X|Tail]).
      has(X, [Head|Tail]) :- has(X, Tail).
      ```
    options:
      - "a, b, a"
      - "a, b"
      - "a, a, b"
    correct_index: 0
    option_feedback:
      1: "Each matching position supplies a proof; the repeated a is not removed."
      2: "Search walks the list from its head toward its tail; it does not group equal values."
    explanation: "The first clause returns the head. The second recurses on the tail, producing the values in positional order: a, b, a."

  # Lecture: [08] Logic Palooza (Public).docx — Example 4: Deleting an atom from a list
  # Assessment: CS131 Fall 25 Quiz 4 (with solutions).docx P5
  - id: cs131-v2-logic-squeeze-tail
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |
      The Prolog predicate squeeze(Input,Output) removes consecutive duplicates from a list of atoms. Its empty, singleton, and equal-head cases are already correct. Complete the unequal-head clause below. For ground atoms, X \= Y succeeds when they differ.

      ```prolog
      squeeze([X,Y|T], [X|R]) :- X \= Y, MISSING.
      ```
    options:
      - "squeeze(T, R)"
      - "squeeze([Y|T], R)"
      - "squeeze([X|T], R)"
    correct_index: 1
    option_feedback:
      0: "The second item Y is not a duplicate of X and must still be processed, rather than skipped."
      2: "X is already preserved in the output head. The remaining input starts with Y."
    explanation: "Keep X because it differs from Y, then process the remaining input [Y|T]. The result of that recursive call becomes the output tail R."

  # Lecture: [08] Logic Palooza (Public).docx — Example 4: Deleting an atom from a list
  # Assessment: Homework Problems (Public).docx LOGIC5
  - id: cs131-v2-logic-remove-first-proof
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |
      What is the first result for R from the Prolog query `take_out(b, [a,b,c], R)`?

      ```prolog
      take_out(X, [X|T], T).
      take_out(X, [H|T], [H|R]) :- take_out(X, T, R).
      ```
    options:
      - "[b,c]"
      - "[a,b,c]"
      - "[a,c]"
    correct_index: 2
    option_feedback:
      0: "The first head a does not match b, so it must be kept while the tail is searched."
      1: "When the head b matches X, the first clause returns its tail [c], omitting b."
    explanation: "The recursive clause preserves a. The first clause then removes b from [b,c], giving [c]; combining the preserved head yields [a,c]."

  # Lecture: [08] Logic Palooza (Public).docx — Recursive Rules; Resolution Continued
  # Assessment: Homework Problems (Public).docx LOGIC6 (resolution algorithm)
  - id: cs131-v2-logic-recursive-order
    type: single
    difficulty: advanced
    bloom: analyze
    estimated_seconds: 75
    question: |
      The Prolog query `path(a,Y)` can produce b, but requesting all answers can recurse indefinitely. Why?

      ```prolog
      edge(a,b).
      path(X,Y) :- edge(X,Y).
      path(X,Y) :- path(X,M), edge(M,Y).
      ```
    options:
      - "Each retry can recurse before an edge narrows the search."
      - "The two rules require Y to equal two atoms simultaneously."
      - "The direct rule prevents the recursive rule from running."
    correct_index: 0
    option_feedback:
      1: "Separate proof attempts have separate bindings; the problem is the search's recursive call order."
      2: "When more solutions are requested, Prolog tries later rules after exhausting the direct rule."
    explanation: "The recursive rule's first subgoal asks for path(X,M) again without first moving along an edge. Repeated attempts can keep expanding the same search before the edge subgoal is checked."

  # Lecture: [08] Logic Palooza (Public).docx — Prolog List Processing: Built-in Facts and Rules
  # Assessment: Homework Problems (Public).docx LOGIC8(A)
  - id: cs131-v2-logic-reverse-goals
    type: parsons
    difficulty: advanced
    bloom: analyze
    estimated_seconds: 75
    question: |
      Arrange the successful goal calls for the first Prolog proof of `rev([a,b], R)`. T1 and T2 name fresh variables for the inner results. Leave out the append call with the wrong argument order.

      ```prolog
      rev([], []).
      rev([H|T], R) :- rev(T, Rest), append(Rest, [H], R).
      ```
    lines:
      - "rev([a,b], R)"
      - "rev([b], T1)"
      - "rev([], T2)"
      - "append([], [b], T1)"
      - "append([b], [a], R)"
    distractors:
      - "append([a], [b], R)"
    explanation: "Left-to-right subgoal evaluation descends to rev([],[]) first. It then appends b to the empty result, obtaining T1 = [b], and appends a to that result, obtaining R = [b,a]."
