title: "CS 131: Language Paradigms and Design"
description: "Recognize computational models and evaluate language choices from their semantics."
active: true
questions:
  # Source: intro_lecture_v2.pptx, slides 20–23, 36–38.
  - id: paradigms-within-one-language
    type: single
    difficulty: basic
    bloom: understand
    question: "A programmer replaces a loop and mutable accumulator with a composition of list transformations in the same language. What changed?"
    options:
      - "The implementation strategy and programming style."
      - "The set of problems that the language can compute."
      - "The language's rules for resolving variable names."
    correct_index: 0
    option_feedback:
      1: "A different style can express the same computation; it does not by itself change the language's computational power."
      2: "Changing an algorithm's structure does not change the language's scoping rules."
    explanation: "Languages can support several paradigms. Replacing explicit state updates with transformations changes how the solution is organized."

  # Source: intro_lecture_v2.pptx, slides 21–22.
  - id: classify-relational-solution
    type: single
    difficulty: intermediate
    bloom: apply
    question: "A route planner stores direct connections and defines reachability through intermediate stops. A query asks which destinations are reachable, leaving the search to the runtime. Which approach best describes the solution?"
    options:
      - "Imperative: a sequence of explicit updates to a route table."
      - "Logic: relations and rules used to answer a query."
      - "Object-oriented: route objects dispatching messages to each other."
    correct_index: 1
    option_feedback:
      0: "The description gives relations and inference rules, rather than an explicit update sequence."
      2: "Having entities such as stops does not establish an object-oriented design; message dispatch would be the organizing mechanism."
    explanation: "Logic programming expresses known relations and rules for deriving further relations. Search answers queries against that knowledge."

  # Source: intro_lecture_v2.pptx, slides 23–30.
  - id: independent-language-dimensions
    type: multiple
    difficulty: intermediate
    bloom: analyze
    question: "A new language uses braces for blocks and permits classes. Which conclusions can be justified from that information? Select all that apply."
    options:
      - "It provides syntax for grouping code into blocks."
      - "It uses the same parameter-passing rules as C++."
      - "It offers a class construct for organizing programs."
      - "It reclaims unreachable objects through garbage collection."
    correct_indices: [0, 2]
    option_feedback:
      0: "The block syntax is explicitly given; recognizing it does not settle other semantic rules."
      1: "Similar punctuation does not imply the same parameter semantics."
      2: "Class support is explicitly given, although the details of class behavior remain unknown."
      3: "Memory management is an independent design choice that cannot be inferred from braces or classes."
    explanation: "Syntax and individual features provide limited evidence. Scoping, passing rules, typing, and memory management require their own specifications or observations."

  # Source: intro_lecture_v2.pptx, slides 27–29; Homework Problems, PYTHON2.
  - id: distinguish-mutation-from-rebinding-probe
    type: single
    difficulty: advanced
    bloom: evaluate
    question: "For records containing only numeric fields, an unfamiliar language might make an independent record copy, share its object through a local parameter, or alias the caller's variable. Which experiment best distinguishes these three models?"
    options:
      - "Read a record field twice inside the function."
      - "Pass two records containing the same field values."
      - "Separately test field mutation and parameter rebinding."
    correct_index: 2
    option_feedback:
      0: "All three models can read the same field values; reading does not expose the aliasing differences."
      1: "Equal initial contents do not reveal whether calls copy values, share objects, or alias variables."
    explanation: "Use a fresh record in each trial and inspect the caller afterward. An independent copy exposes neither change, a shared object exposes field mutation only, and an alias for the caller's variable exposes both. The separate trials distinguish object sharing from variable aliasing."

  # Source: intro_lecture_v2.pptx, slides 16, 30, 39–40.
  - id: choose-language-with-constraints
    type: single
    difficulty: advanced
    bloom: evaluate
    question: "A controller must meet a strict response-time bound. A prototype language improves development speed but permits unpredictable runtime pauses. What evidence should drive the language decision?"
    options:
      - "Whether the prototype has fewer source lines."
      - "Whether worst-case execution meets the deadline."
      - "Whether average execution meets the deadline."
    correct_index: 1
    option_feedback:
      0: "Conciseness can improve development effort but does not establish a response-time bound."
      2: "An acceptable average can hide individual runs that miss the strict deadline. A worst-case bound is needed for this requirement."
    explanation: "Language choices should be judged against the problem's constraints. A hard deadline requires evidence about worst-case behavior, alongside development and maintenance costs."

  # Source: intro_lecture_v2.pptx, slides 18, 30, 36–37.
  - id: compactness-versus-quality
    type: single
    difficulty: basic
    bloom: understand
    question: "Two implementations produce the same results on the stated input domain. One is much shorter. What does the shorter length establish?"
    options:
      - "It performs less computation for each input."
      - "It is easier for every maintainer to understand."
      - "It expresses this solution with less source text."
    correct_index: 2
    option_feedback:
      0: "A compact expression can hide expensive traversals or allocations."
      1: "Readability depends on the reader's familiarity and the clarity of the abstractions, not just length."
    explanation: "Conciseness is one design dimension. Runtime cost and maintainability require separate reasoning about operations and intended readers."

  # Source: intro_lecture_v2.pptx, slides 16, 39.
  - id: domain-specific-language-tradeoff
    type: single
    difficulty: advanced
    bloom: evaluate
    question: "Analysts repeatedly express the same few kinds of eligibility rules. A team proposes a small rule language. Which trade-off is most relevant?"
    options:
      - "Domain clarity versus the cost of defining and maintaining semantics."
      - "Domain clarity versus losing the ability to report domain type errors."
      - "Domain clarity versus building a separate interpreter for each rule."
    correct_index: 0
    option_feedback:
      1: "A restricted language can make domain validation easier by limiting the forms of rules and defining their allowed types."
      2: "One implementation of the rule language can execute many rules. New rules are programs for that implementation, not necessarily new interpreters."
    explanation: "Domain concepts can make rules easier to express and inspect, but someone must specify their meaning, implement execution, and maintain tools as requirements change."

  # Source: intro_lecture_v2.pptx, slides 20–23, 38, 43.
  - id: transfer-to-new-language
    type: multiple
    difficulty: intermediate
    bloom: apply
    question: "Before porting an algorithm that mutates shared records and stores callbacks, which questions reveal semantic differences that could change its results? Select all that apply."
    options:
      - "Does assignment copy a record or share its object?"
      - "Which bindings does a callback retain for later use?"
      - "Do both languages spell function declarations the same way?"
      - "Which operations can change objects visible to other callers?"
    correct_indices: [0, 1, 3]
    option_feedback:
      0: "Copying versus sharing determines whether changes propagate to aliases."
      1: "A stored callback's environment determines which values it observes when invoked later."
      2: "Keyword spelling concerns syntax. It does not establish the sharing or binding behavior of a correctly translated program."
      3: "The algorithm depends on observable mutation, so the port must preserve where those effects occur."
    explanation: "Transfer depends on matching semantics: identity, mutation, and retained environments. Translating punctuation alone can silently change the algorithm."
