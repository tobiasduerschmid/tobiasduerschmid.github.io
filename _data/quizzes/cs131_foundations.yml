title: 'CS 131: Language Paradigms and Design'
description: Short language-model predictions and evidence checks. Practice the building blocks used in
  later exam traces.
active: true
# Source-aligned review against lecture notes and homework. Times are author estimates.
questions:
  # Taught: [01] Intro (Public).docx, Paradigms.
  # Practice: Concept prerequisite; the paradigm examples are taught here. Later code traces supply application practice.
  - id: cs131-v2-foundations-accumulator-model
    type: single
    difficulty: basic
    bloom: understand
    estimated_seconds: 30
    question: A program totals scores by setting `total = 0`, visiting each score in a loop, and updating
      `total`. Which paradigm organizes this solution?
    options:
    - Imperative programming
    - Logic programming
    - Functional programming
    correct_index: 0
    option_feedback:
      1: No facts or inference rules are being queried.
      2: This solution uses a loop and changing state rather than composing math-like functions.
    explanation: The solution specifies a sequence of changes to a mutable accumulator. That is the imperative
      model.

  # Taught: [01] Intro (Public).docx, Paradigms.
  # Practice: Concept prerequisite; the paradigm examples are taught here. Later code traces supply application practice.
  - id: cs131-v2-foundations-recursive-model
    type: single
    difficulty: basic
    bloom: understand
    estimated_seconds: 30
    question: A list-processing solution returns 0 for an empty list and otherwise returns the head plus
      the result of processing the tail. It changes no existing data. Which paradigm does this illustrate?
    options:
    - Object-oriented programming
    - Functional programming
    - Logic programming
    correct_index: 1
    option_feedback:
      0: The description does not organize the computation around interacting objects.
      2: A recursive function computes a returned value here; it is not a relation queried through facts
        and rules.
    explanation: The result is built from an expression and a recursive function call without mutable
      accumulation.

  # Taught: [01] Intro (Public).docx, Specifying a Language?; [02] Programming Implementation Palooza (Public).docx, Syntax vs. Semantics.
  # Practice: Homework TOOLS1 (distinguish syntax checks from semantic checks).
  - id: cs131-v3-foundations-syntax-semantics
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 45
    question: Which language-design changes alter semantics, rather than only the written form of a construct?
      Select all that apply.
    options:
    - Require parentheses around an if condition.
    - Require an if condition to have Boolean type.
    - Let parameter assignment replace the caller's variable.
    - Replace block braces with begin and end keywords.
    correct_indices:
    - 1
    - 2
    option_feedback:
      0: Parentheses specify the allowed arrangement of source symbols.
      1: The type required of a condition is a meaning and validity rule beyond its grammatical shape.
      2: This changes the effect of an assignment on the caller, even if the call looks the same.
      3: Changing delimiters changes how a block is written, without specifying a different effect.
    explanation: Syntax specifies the form of constructs. Semantics includes their type requirements and
      behavior, such as the effect of assigning to a parameter.

  # Taught: [01] Intro (Public).docx, Exercise: Classify that Language.
  # Practice: Homework PYTHON2; Fall 2025 Quiz 1 v2, Problem 2 (Widget Woes): predict copy, mutation, and rebinding effects.
  - id: cs131-v2-foundations-copy-observation
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: A toy language passes an independent copy of a record containing only numbers. The caller
      has `box.value = 6`. A function sets its parameter's `value` to 9. After the call, the caller adds
      1 to `box.value`. What does the caller read?
    options:
    - '7'
    - '10'
    - '6'
    correct_index: 0
    option_feedback:
      1: 10 would require the function's update to reach the original record. Its parameter is an independent
        copy.
      2: The call leaves the original at 6, but the caller then increments it.
    explanation: The function changes its copy to 9. The original remains 6 until the caller increments
      it to 7.

  # Taught: [01] Intro (Public).docx, Exercise: Classify that Language.
  # Practice: Homework PYTHON2; Fall 2025 Quiz 1 v2, Problem 2 (Widget Woes): predict copy, mutation, and rebinding effects.
  - id: cs131-v2-foundations-alias-parameter
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: 'A toy language passes a record variable by reference: its parameter aliases the caller''s
      variable. The original record has `value = 3`. The function changes that field to 5, then assigns
      a new record with `value = 8` to its parameter. What value does the caller now read?'
    options:
    - '3'
    - '8'
    - '5'
    correct_index: 1
    option_feedback:
      0: An independent copy would leave the original unchanged; this parameter aliases the caller's variable.
      2: 5 would remain under object-reference passing, where rebinding changes only the local parameter.
        Here the variable itself is aliased.
    explanation: Both operations act through the caller's variable. The field first becomes 5, then assigning
      the new record makes the caller's variable refer to the record containing 8.

  # Taught: [01] Intro (Public).docx, Exercise: Classify that Language.
  # Practice: Homework PYTHON2; Fall 2025 Quiz 1 v2, Problem 2 (Widget Woes): predict copy, mutation, and rebinding effects.
  - id: cs131-v2-foundations-evidence-limit
    type: single
    difficulty: intermediate
    bloom: evaluate
    estimated_seconds: 60
    question: A parameter experiment only reads a record's field. It prints the same value as the caller.
      A student concludes that the language passes records by reference. Is this evidence sufficient?
    options:
    - Yes; equal field values prove a shared record.
    - No; a copy and an alias can read the same value.
    - No; read-only access proves a copied record.
    correct_index: 1
    option_feedback:
      0: Equal values do not reveal whether two names reach one record or equal copies.
      2: A reference can be used only for reading. The operations performed do not establish the passing
        mechanism.
    explanation: A useful experiment must produce different observable outcomes under competing models.
      Reading unchanged data does not distinguish an alias from a copy.

  # Taught: [01] Intro (Public).docx, Exercise: Classify that Language.
  # Practice: Homework PYTHON2; Fall 2025 Quiz 1 v2, Problem 2 (Widget Woes): predict copy, mutation, and rebinding effects.
  - id: cs131-v2-foundations-object-sharing-trace
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      A call passes an object reference. Arrange the events for `change(b)` in execution order. Use only the events that occur.

      ```text
      b = Box(4)
      change(p):
          p.value = 7
          p = Box(2)
      change(b)
      print(b.value)
      ```
    lines:
    - The parameter p initially refers to the same Box(4) as b.
    - The shared box's value becomes 7.
    - Only p is redirected to a new Box(2).
    - The caller prints 7.
    distractors:
    - The assignment to p redirects b to Box(2).
    explanation: The parameter first shares the caller's object. Field mutation affects that shared object,
      while rebinding the parameter affects only the local name.

  # Taught: [01] Intro (Public).docx, Exercise: Classify that Language.
  # Practice: Homework PYTHON2; Fall 2025 Quiz 1 v2, Problem 2 (Widget Woes): predict copy, mutation, and rebinding effects.
  - id: cs131-v2-foundations-probe-rebinding
    type: single
    difficulty: intermediate
    bloom: evaluate
    estimated_seconds: 60
    question: 'Two possible rules both let a function mutate a caller-visible object: the parameter either
      aliases the caller''s variable or holds a local object reference. Which one-step experiment distinguishes
      them?'
    options:
    - Assign a fresh object to the parameter.
    - Read a field through the parameter.
    - Change a field of the shared object.
    correct_index: 0
    option_feedback:
      1: Both models can read the same shared object.
      2: Both proposed models already allow a visible field mutation; repeating it does not distinguish
        them.
    explanation: Rebinding changes the caller's variable under variable aliasing, but changes only the
      local parameter under object-reference passing.
