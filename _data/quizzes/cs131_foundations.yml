title: 'CS 131: Language Paradigms and Design'
description: Short language-model predictions and evidence checks. Practice the building blocks used in
  later exam traces.
active: true
# Entire replacement bank. Times are author estimates, not enforced limits.
questions:
  # Lecture: intro_lecture_td_handouts.pdf pp. 25–27
  # Assessment: Foundation for Fall 2025 Quiz 4, Problem 2 (iteration and generators)
  - id: cs131-v2-foundations-accumulator-model
    type: single
    difficulty: basic
    bloom: understand
    estimated_seconds: 30
    question: A program totals scores by setting `total = 0`, visiting each score in a loop, and updating
      `total`. Which paradigm organizes this solution?
    options:
    - Imperative programming
    - Logic programming
    - Functional programming
    correct_index: 0
    option_feedback:
      1: No facts or inference rules are being queried.
      2: This solution uses a loop and changing state rather than composing math-like functions.
    explanation: The solution specifies a sequence of changes to a mutable accumulator. That is the imperative
      model.

  # Lecture: intro_lecture_td_handouts.pdf pp. 25–27
  # Assessment: Foundation for Fall 2025 Quiz 1, Problem 3 (recursive list processing)
  - id: cs131-v2-foundations-recursive-model
    type: single
    difficulty: basic
    bloom: understand
    estimated_seconds: 30
    question: A list-processing solution returns 0 for an empty list and otherwise returns the head plus
      the result of processing the tail. It changes no existing data. Which paradigm does this illustrate?
    options:
    - Object-oriented programming
    - Functional programming
    - Logic programming
    correct_index: 1
    option_feedback:
      0: The description does not organize the computation around interacting objects.
      2: A recursive function computes a returned value here; it is not a relation queried through facts
        and rules.
    explanation: The result is built from an expression and a recursive function call without mutable accumulation.

  # Lecture: intro_lecture_td_handouts.pdf pp. 28, 36
  # Assessment: Fall 2023 Midterm, Problem 5, PDF p. 10 (reasoning under chosen language rules)
  - id: cs131-v2-foundations-independent-rules
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 45
    question: A language designer changes block delimiters from braces to indentation. The specification
      says no other rules change. Which properties remain unchanged? Select all that apply.
    options:
    - Which variable a name refers to
    - How arguments are passed to functions
    - How block boundaries are written
    - When unused objects are reclaimed
    correct_indices:
    - 0
    - 1
    - 3
    option_feedback:
      0: Name lookup is a separate semantic rule and was not changed.
      1: Parameter passing was explicitly left unchanged.
      2: The block delimiters are exactly what the designer changed.
      3: The rules for reclaiming objects were left unchanged.
    explanation: The change concerns written block boundaries. Scope, parameter passing, and memory management
      retain their specified behavior.

  # Lecture: intro_lecture_td_handouts.pdf pp. 33
  # Assessment: Fall 2025 Quiz 1 v1, Problem 2 (mutation versus rebinding)
  - id: cs131-v2-foundations-copy-observation
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: A toy language passes an independent copy of a record containing only numbers. The caller
      has `box.value = 6`. A function sets its parameter's `value` to 9. What does the caller read afterward?
    options:
    - '6'
    - '9'
    - The record no longer exists
    correct_index: 0
    option_feedback:
      1: Updating an independent copy does not update the original record.
      2: Passing a copy does not destroy the original record.
    explanation: The parameter contains an independent record copy, so its field update does not affect
      the caller's record.

  # Lecture: intro_lecture_td_handouts.pdf pp. 33
  # Assessment: Fall 2025 Quiz 1 v1, Problem 2 (mutation versus rebinding)
  - id: cs131-v2-foundations-alias-parameter
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: 'A toy language passes a record variable by reference: its parameter is an alias for the caller''s
      variable. The function assigns a new record with `value = 8` to that parameter. The caller''s original
      record had `value = 3`. What value does the caller now read?'
    options:
    - '3'
    - '8'
    - '11'
    correct_index: 1
    option_feedback:
      0: A local copy would leave the caller's variable unchanged; the parameter here aliases that variable.
      2: The function replaces a record; it does not add its numeric fields.
    explanation: Assignment through an alias replaces the record held by the caller's variable. It does
      not add the old and new field values.

  # Lecture: intro_lecture_td_handouts.pdf pp. 32–34
  # Assessment: Fall 2023 Midterm, Problem 5, PDF p. 10 (reasoning under chosen language rules); inference from behavior
  - id: cs131-v2-foundations-evidence-limit
    type: single
    difficulty: intermediate
    bloom: evaluate
    estimated_seconds: 60
    question: A parameter experiment only reads a record's field. It prints the same value as the caller.
      A student concludes that the language passes records by reference. Is this evidence sufficient?
    options:
    - Yes; reading the same field proves aliasing.
    - No; an independent copy can give the same reading.
    - Yes; copies must change the field value.
    correct_index: 1
    option_feedback:
      0: Both a copy and an alias can contain the same field value.
      2: Copying preserves the initial value; it need not change it.
    explanation: A useful experiment must produce different observable outcomes under competing models.
      Reading unchanged data does not distinguish an alias from a copy.

  # Lecture: intro_lecture_td_handouts.pdf pp. 34
  # Assessment: Fall 2025 Quiz 1 v1, Problem 2 (mutation versus rebinding)
  - id: cs131-v2-foundations-object-sharing-trace
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      A call passes an object reference. Arrange the events for `change(b)` in execution order. Use only the events that occur.

      ```text
      b = Box(4)
      change(p):
          p.value = 7
          p = Box(2)
      change(b)
      print(b.value)
      ```
    lines:
    - The parameter p initially refers to the same Box(4) as b.
    - The shared box's value becomes 7.
    - Only p is redirected to a new Box(2).
    - The caller prints 7.
    distractors:
    - The assignment to p redirects b to Box(2).
    explanation: The parameter first shares the caller's object. Field mutation affects that shared object,
      while rebinding the parameter affects only the local name.

  # Lecture: intro_lecture_td_handouts.pdf pp. 32–34
  # Assessment: Fall 2025 Quiz 1 v1, Problem 2 (mutation versus rebinding)
  - id: cs131-v2-foundations-probe-rebinding
    type: single
    difficulty: intermediate
    bloom: evaluate
    estimated_seconds: 60
    question: 'Two possible rules both let a function mutate a caller-visible object: the parameter either
      aliases the caller''s variable or holds a local object reference. Which one-step experiment distinguishes
      them?'
    options:
    - Assign a fresh object to the parameter.
    - Read a field through the parameter.
    - Change a field of the shared object.
    correct_index: 0
    option_feedback:
      1: Both models can read the same shared object.
      2: Both proposed models already allow a visible field mutation; repeating it does not distinguish
        them.
    explanation: Rebinding changes the caller's variable under variable aliasing, but changes only the local
      parameter under object-reference passing.
