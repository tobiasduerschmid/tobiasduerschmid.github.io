title: 'CS 131: Types, Scope, and Memory'
description: Short lecture-based traces of type rules, bindings, scope, ownership, and collection.
active: true
# Reviewed against the supplied lecture notes, homework, and past assessments.
# Time estimates are planning estimates, not time limits.
questions:
  # Lecture: [04] Data Palooza (Public).docx — Type Inference
  # Assessment: Homework Problems (Public).docx TYPING7(A)
  - id: cs131-v2-types-inferred-fixed-type
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: |-
      A toy language infers each variable's fixed type from its initializer and permits no implicit conversions. Which line is rejected before execution?

      ```text
      var n = 6       // line 1
      n = n + 2       // line 2
      n = "six"       // line 3
      ```
    options:
    - Line 1
    - Line 2
    - Line 3
    correct_index: 2
    option_feedback:
      0: Inference supplies the type even though no annotation is written.
      1: Both operands and the result are integers.
    explanation: The initializer fixes n as an integer. Integer addition preserves that type, but assigning a string violates it.

  # Lecture: [04] Data Palooza (Public).docx — Static typing; Type Inference
  # Assessment: Homework Problems (Public).docx TYPING7(A) (infer constraints)
  - id: cs131-v2-types-inference-constraints
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |-
      In this statically typed toy language, each function must have one fixed result type, Int or String. There are no conversions, union types, or common-supertype results. Which definition passes type checking? Assume flag is Boolean.

      ```text
      f(flag) = if flag then 6 else 9
      g(flag) = if flag then 6 else "nine"
      ```
    options:
    - Only f
    - Only g
    - Both f and g
    correct_index: 0
    option_feedback:
      1: One possible integer result does not make the string branch type-compatible.
      2: A fixed return type must accommodate both branches under the stated rules.
    explanation: Both branches of f return integers. The possible results of g have different types, so no single
      permitted return type works for both branches.

  # Lecture: [04] Data Palooza (Public).docx — Type Equivalence
  # Assessment: Homework Problems (Public).docx TYPING3(A)
  - id: cs131-v2-types-record-equivalence
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: |-
      Two record types are declared separately:

      ```text
      type Point = { x: Int, y: Int }
      type Pixel = { x: Int, y: Int }
      ```
      There are no conversions or declared relationships. Which rule accepts assigning a `Pixel` value to a `Point` variable?
    options:
    - Name equivalence
    - Structural equivalence
    - Neither equivalence rule
    correct_index: 1
    option_feedback:
      0: The type names differ even though the structures match.
      2: Structural equivalence deliberately ignores the different type names.
    explanation: The field names and field types match, so structural equivalence accepts the assignment. Name equivalence distinguishes Point from Pixel.

  # Lecture: [04] Data Palooza (Public).docx — Strong typing; Checked type casts
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P2(c,d)
  - id: cs131-v2-types-checked-downcast
    type: single
    difficulty: advanced
    bloom: evaluate
    estimated_seconds: 60
    question: 'A compiler accepts a checked cast of an `Animal` reference to a `Cat` reference. At runtime the object is a `Dog`, so the operation raises an exception before any Cat operation runs. A student concludes: "The language must be dynamically typed and weakly typed." Which assessment is justified?'
    options:
    - Both classifications follow.
    - Only dynamic typing follows.
    - Neither classification follows.
    correct_index: 2
    option_feedback:
      0: A runtime check does not establish when the rest of the program is checked or show unsafe execution.
      1: Static typing can coexist with runtime checks when the actual object type is only known at runtime.
    explanation: Static languages can require runtime checks for downcasts. Rejecting an incompatible operation also fits the lecture’s strong-typing safety requirement.

  # Lecture: [04] Data Palooza (Public).docx — Switching between types
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P2(e,f)
  - id: cs131-v2-types-narrowing-both-directions
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: Type `Whole` represents integers from −8 through 8. Type `Half` represents multiples of 0.5 from 0 through 7.5. Select every narrowing conversion, treating a conversion as widening only if it preserves every source value exactly.
    options:
    - Whole → Half
    - Half → Whole
    - Neither direction is narrowing
    correct_indices:
    - 0
    - 1
    option_feedback:
      0: For example, −1 is a Whole value outside Half’s range.
      1: For example, 0.5 is a Half value outside Whole’s set of values.
      2: Both directions have source values that the destination cannot preserve.
    explanation: Whole includes negative numbers and 8, which Half cannot represent. Half includes fractions such as 0.5, which Whole cannot represent.

  # Lecture: [04] Data Palooza (Public).docx — Type conversions; Type casts
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P1(a,b)
  - id: cs131-v2-types-conversion-versus-cast
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: Treat type conversion and type cast as distinct operations, even though some languages spell both with cast syntax. Operation X creates a floating-point value `5.0` from integer `5`. Operation Y views an existing Student object through a Person reference without creating another object. How are X and Y classified?
    options:
    - 'X: cast; Y: conversion'
    - 'X: conversion; Y: cast'
    - 'X: conversion; Y: conversion'
    correct_index: 1
    option_feedback:
      0: Creating a new numeric representation is the conversion; viewing the same object through a related type is the cast.
      2: Y creates no new object or converted value.
    explanation: X creates a new representation of a value. Y changes the type through which the existing object is viewed.

  # Lecture: [04] Data Palooza (Public).docx — Lexical Scoping
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P3(b)
  - id: cs131-v2-types-lexical-caller
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: |-
      What does this pseudocode print under lexical scoping? `show` is defined at global scope.

      ```text
      var x = 3
      function show() { print(x) }
      function run() {
          var x = 8
          show()
      }
      run()
      ```
    options:
    - '3'
    - '8'
    - An undefined-name error
    correct_index: 0
    option_feedback:
      1: The caller’s local x would be used by dynamic scoping, not by the stated lexical rule.
      2: The global x is visible at the definition of show.
    explanation: show looks in its defining environment after its own local scope. The caller’s local x is not in that lexical environment.

  # Lecture: [04] Data Palooza (Public).docx — Dynamic Scoping
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P3(a)
  - id: cs131-v2-types-dynamic-update
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |-
      Under dynamic scoping, what two values are printed, in order? Assignment updates the nearest active binding.

      ```text
      var x = 2
      function bump() { x = x + 1 }
      function run() {
          var x = 7
          bump()
          print(x)
      }
      run()
      print(x)
      ```
    options:
    - 7, 3
    - 8, 2
    - 8, 3
    correct_index: 1
    option_feedback:
      0: This follows the global binding as lexical scoping would; dynamic lookup finds the caller’s x first.
      2: Only the nearest matching binding is updated, not every variable named x.
    explanation: bump finds run’s active local x and changes 7 to 8. The separate global x remains 2.

  # Lecture: [04] Data Palooza (Public).docx — Shadowing
  # Assessment: Homework Problems (Public).docx DATA1(A.2); CS131 Fall 25 Quiz 2 Solutions (Public).docx P3
  - id: cs131-v2-types-shadow-block
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 75
    question: Arrange this pseudocode to print `9` inside a nested block and then `4` after leaving it. Declare the
      outer `x` before opening the inner block. `let` creates a new block-local binding; braces open and close the
      inner block.
    lines:
    - let x = 4
    - '{'
    - '    let x = 9'
    - '    print(x)  // inside the block'
    - '}'
    - print(x)  // after the block
    distractors:
    - '    x = 9'
    explanation: The inner declaration hides the outer binding temporarily. Assigning to the existing outer x would
      leave 9 after the block as well.

  # Lecture: [04] Data Palooza (Public).docx — Variable lifetime and scope; Lifetime
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P2(b)
  - id: cs131-v2-types-live-but-hidden
    type: single
    difficulty: basic
    bloom: understand
    estimated_seconds: 35
    question: In a lexically scoped program, `main` creates a local `score`, calls a separately defined `display`, and then prints `score`. While `display` is running, what is true of main's `score`?
    options:
    - It is alive but not visible by name in display.
    - It is destroyed until display returns to main.
    - It is visible by name in every active function.
    correct_index: 0
    option_feedback:
      1: The caller’s active stack frame retains its local variable while the callee runs.
      2: An active variable need not be in the callee’s lexical scope.
    explanation: Calling another function does not end the lifetime of main’s local variable. Its name is still outside display’s lexical scope.

  # Lecture: [04] Data Palooza (Public).docx — Mark and Sweep: Mark
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P4(a,b)
  - id: cs131-v2-types-roots-reachability
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: At collection time, a global points to object A, a local in an active caller points to B, and A has a field pointing to C. No other references exist. Select every object that a tracing garbage collector treats as a root object.
    options:
    - A
    - B
    - C
    correct_indices:
    - 0
    - 1
    option_feedback:
      1: Roots include locals in every active stack frame, even if their names are out of scope in the current callee.
      2: Reachable through a root is different from directly referenced by a root variable.
    explanation: A and B are directly referenced by global or active-frame variables. C is reachable through A and will be marked, but is not itself a root.

  # Lecture: [04] Data Palooza (Public).docx — Approaches to garbage collection; Object Reference Semantics
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P4(c)
  - id: cs131-v2-types-last-alias
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 75
    question: Arrange the object-reference pseudocode to print 7 through s while r is null. The Box must become unreachable
      only after that print, and collection must reclaim it. `collect()` uses mark and sweep; no hidden references
      exist.
    lines:
    - r = new Box(7)
    - s = r
    - r = null
    - print(s.value)
    - s = null
    - collect()
    explanation: Clearing r leaves the original Box reachable through s. Clearing s after the print removes the last
      reference, so mark and sweep can reclaim the Box.

  # Lecture: [04] Data Palooza (Public).docx — Reference Counting
  # Assessment: Homework Problems (Public).docx DATA3(A,B)
  - id: cs131-v2-types-unreachable-cycle
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: Objects A and B point to each other. The last variable that referred to A is set to null, and no roots reach either object. What happens under pure reference counting versus mark and sweep?
    options:
    - Both reclaim A and B.
    - Only reference counting reclaims them.
    - Only mark and sweep reclaims them.
    correct_index: 2
    option_feedback:
      0: Pure reference counting cannot reduce either count to zero while the cycle remains.
      1: References inside the cycle keep the counts positive; tracing from roots is what reveals the garbage.
    explanation: The cycle leaves each reference count positive. Mark and sweep follows roots, so it leaves both unreachable objects unmarked and reclaims them.

  # Lecture: [04] Data Palooza (Public).docx — Mark and copy; Mark and compact
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P2(g); Homework Problems (Public).docx DATA3(A.3)
  - id: cs131-v2-types-collector-tradeoff
    type: single
    difficulty: advanced
    bloom: evaluate
    estimated_seconds: 60
    question: A program keeps almost all of its heap objects alive across many collections. You want to reduce repeatedly copying those survivors. Which collector property best supports choosing mark and compact over two-space mark and copy?
    options:
    - Compacted survivors may stay in place.
    - Compaction skips the marking phase.
    - Compaction needs no pointer updates.
    correct_index: 0
    option_feedback:
      1: Mark and compact still identifies live objects by marking.
      2: Pointers must be adjusted whenever compaction moves an object.
    explanation: After long-lived objects have been packed together, later compactions may leave them in place. Two-space copying moves all survivors to the other half each collection.

  # Lecture: [04] Data Palooza (Public).docx — Rust’s Ownership Model: Move Semantics
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P5(c,d)
  - id: cs131-v2-types-move-and-borrow
    type: multiple
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      This toy language uses single ownership: move transfers ownership and invalidates the old owner; borrow reads without transferring it. Select every true statement after the code finishes.

      ```text
      function relay(move p) {
          print(borrow(p))
          return move(p)
      }
      owner = new String("map")
      next = relay(move(owner))
      ```
    options:
    - owner is still valid after the move.
    - next owns the original string.
    - Borrowing next leaves it as owner.
    correct_indices:
    - 1
    - 2
    option_feedback:
      0: Returning ownership from relay transfers it to next; it does not restore owner.
      1: Ownership passes from owner to p and then from p to next.
      2: A read-only borrow does not transfer ownership.
    explanation: The string moves into relay’s parameter p and is read there without being consumed by the borrow.
      Returning it transfers ownership to next. The original owner stays invalid.

  # Lecture: [04] Data Palooza (Public).docx — Object Reference Semantics
  # Assessment: Homework Problems (Public).docx DATA4; CS131 Fall 25 Quiz 3 Solutions (Public).docx P1
  - id: cs131-v2-types-alias-mutation
    type: write-in
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: What two values are printed?
    explanation: b initially refers to the same list as a, so the element mutation is shared. Rebinding b later leaves
      a pointing at the original modified list.
    program:
      language: python
      file: types_scope_memory.py
      code: |
        a = [2, 4]
        b = a
        b[0] = 7
        b = [9]
        print(a[0], a[1])
    answer: 7 4
