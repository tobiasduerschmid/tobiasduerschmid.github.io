title: 'CS 131: Types, Scope, and Memory'
description: Short lecture-based traces of type rules, bindings, scope, ownership, and collection.
active: true
# Original replacement practice. Page references are physical PDF pages.
# Time estimates are planning estimates, not time limits.
questions:
  # Lecture: data_palooza_v12_handouts.pdf pp.29–32
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P1(d); [Midterm] F24 Solutions (Public).pdf P6 pp.13–14 (typing from evidence)
  - id: cs131-v2-types-inferred-fixed-type
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: |-
      A toy language infers each variable's fixed type from its initializer and permits no implicit conversions. Which line is rejected before execution?

      ```text
      var n = 6       // line 1
      n = n + 2       // line 2
      n = "six"       // line 3
      ```
    options:
    - Line 1
    - Line 2
    - Line 3
    correct_index: 2
    option_feedback:
      0: Inference supplies the type even though no annotation is written.
      1: Both operands and the result are integers.
    explanation: The initializer fixes n as an integer. Integer addition preserves that type, but assigning a string violates it.

  # Lecture: data_palooza_v12_handouts.pdf pp.29–31
  # Assessment: [Midterm] F24 Solutions (Public).pdf P6 pp.13–14 (infer typing constraints; supporting prerequisite)
  - id: cs131-v2-types-inference-constraints
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |-
      In this statically typed toy language, `+` accepts two integers and returns an integer; each function must return either Int or String, with no union or common-supertype result. No conversions occur. Which definition passes type checking?

      ```text
      f(flag) = if flag then 4 + 2 else 9
      g(flag) = if flag then 4 + 2 else "nine"
      h(flag) = if flag then 4 + "2" else 9
      ```
      Assume `flag` is Boolean.
    options:
    - Only f
    - Only g
    - Both f and g
    correct_index: 0
    option_feedback:
      1: One possible integer result does not make the string branch type-compatible.
      2: A fixed return type must accommodate both branches under the stated rules.
    explanation: Both branches of f return integers. The branches of g disagree, and h applies integer addition to a string.

  # Lecture: data_palooza_v12_handouts.pdf pp.23–24
  # Assessment: [Midterm] F24 Solutions (Public).pdf P6 pp.13–14 (classify unknown-language rules; supporting prerequisite)
  - id: cs131-v2-types-record-equivalence
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: |-
      Two record types are declared separately:

      ```text
      type Point = { x: Int, y: Int }
      type Pixel = { x: Int, y: Int }
      ```
      There are no conversions or declared relationships. Which rule accepts assigning a `Pixel` value to a `Point` variable?
    options:
    - Name equivalence
    - Structural equivalence
    - Neither equivalence rule
    correct_index: 1
    option_feedback:
      0: The type names differ even though the structures match.
      2: Structural equivalence deliberately ignores the different type names.
    explanation: The field names and field types match, so structural equivalence accepts the assignment. Name equivalence distinguishes Point from Pixel.

  # Lecture: data_palooza_v12_handouts.pdf pp.33,57–62
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P2(c–d) (evaluate type-error evidence)
  - id: cs131-v2-types-checked-downcast
    type: single
    difficulty: advanced
    bloom: evaluate
    estimated_seconds: 60
    question: 'A compiler accepts a checked cast of an `Animal` reference to a `Cat` reference. At runtime the object is a `Dog`, so the operation raises an exception before any Cat operation runs. A student concludes: "The language must be dynamically typed and weakly typed." Which assessment is justified?'
    options:
    - Both classifications follow.
    - Only dynamic typing follows.
    - Neither classification follows.
    correct_index: 2
    option_feedback:
      0: A runtime check does not establish when the rest of the program is checked or show unsafe execution.
      1: Static typing can coexist with runtime checks when the actual object type is only known at runtime.
    explanation: Static languages can require runtime checks for downcasts. Rejecting an incompatible operation also fits the lecture’s strong-typing safety requirement.

  # Lecture: data_palooza_v12_handouts.pdf p.79
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P2(e–f) (classify conversions by representable values)
  - id: cs131-v2-types-narrowing-both-directions
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: Type `Whole` represents integers from −8 through 8. Type `Half` represents multiples of 0.5 from 0 through 7.5. Select every narrowing conversion, using the lecture's requirement that widening preserve every source value exactly.
    options:
    - Whole → Half
    - Half → Whole
    - Neither direction is narrowing
    correct_indices:
    - 0
    - 1
    option_feedback:
      0: For example, −1 is a Whole value outside Half’s range.
      1: For example, 0.5 is a Half value outside Whole’s set of values.
      2: Both directions have source values that the destination cannot preserve.
    explanation: Whole includes negative numbers and 8, which Half cannot represent. Half includes fractions such as 0.5, which Whole cannot represent.

  # Lecture: data_palooza_v12_handouts.pdf pp.75–76,83–84
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P1(a–b) (locate conversion/coercion)
  - id: cs131-v2-types-conversion-versus-cast
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: Use the lecture's terminology. Operation X creates a floating-point value `5.0` from integer `5`. Operation Y views an existing Student object through a Person reference without creating another object. How are X and Y classified?
    options:
    - 'X: cast; Y: conversion'
    - 'X: conversion; Y: cast'
    - 'X: conversion; Y: conversion'
    correct_index: 1
    option_feedback:
      0: Creating a new numeric representation is the conversion; viewing the same object through a related type is the cast.
      2: Y creates no new object or converted value.
    explanation: X creates a new representation of a value. Y changes the type through which the existing object is viewed.

  # Lecture: data_palooza_v12_handouts.pdf pp.96–99,102–103
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P3(b) (lexical-scope trace)
  - id: cs131-v2-types-lexical-caller
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 45
    question: |-
      What does this pseudocode print under lexical scoping? `show` is defined at global scope.

      ```text
      var x = 3
      function show() { print(x) }
      function run() {
          var x = 8
          show()
      }
      run()
      ```
    options:
    - '3'
    - '8'
    - An undefined-name error
    correct_index: 0
    option_feedback:
      1: The caller’s local x would be used by dynamic scoping, not by the stated lexical rule.
      2: The global x is visible at the definition of show.
    explanation: show looks in its defining environment after its own local scope. The caller’s local x is not in that lexical environment.

  # Lecture: data_palooza_v12_handouts.pdf p.103
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P3(a) (dynamic lookup and mutation)
  - id: cs131-v2-types-dynamic-update
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: |-
      Under dynamic scoping, what two values are printed, in order? Assignment updates the nearest active binding.

      ```text
      var x = 2
      function bump() { x = x + 1 }
      function run() {
          var x = 7
          bump()
          print(x)
      }
      run()
      print(x)
      ```
    options:
    - 7, 3
    - 8, 2
    - 8, 3
    correct_index: 1
    option_feedback:
      0: This follows the global binding as lexical scoping would; dynamic lookup finds the caller’s x first.
      2: Only the nearest matching binding is updated, not every variable named x.
    explanation: bump finds run’s active local x and changes 7 to 8. The separate global x remains 2.

  # Lecture: data_palooza_v12_handouts.pdf pp.100–102
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P3; [Midterm] F24 Solutions (Public).pdf P5 pp.9–12 (block shadowing)
  - id: cs131-v2-types-shadow-block
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 75
    question: Arrange this pseudocode to print `9` inside a nested block and then `4` after leaving it. Declare the outer `x` before opening the inner block. `let` creates a new block-local binding; braces open and close the inner block.
    lines:
    - let x = 4
    - '{'
    - '    let x = 9'
    - '    print(x)  // inside the block'
    - '}'
    - print(x)  // after the block
    distractors:
    - '    x = 9  // assign instead of declaring'
    explanation: The inner declaration hides the outer binding temporarily. Assigning to the existing outer x would leave 9 after the block as well.

  # Lecture: data_palooza_v12_handouts.pdf pp.94–95,104–105
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P2(b) (scope versus lifetime)
  - id: cs131-v2-types-live-but-hidden
    type: single
    difficulty: basic
    bloom: understand
    estimated_seconds: 35
    question: In a lexically scoped program, `main` creates a local `score`, calls a separately defined `display`, and then prints `score`. While `display` is running, what is true of main's `score`?
    options:
    - It is alive but not visible by name in display.
    - It is destroyed until display returns to main.
    - It is visible by name in every active function.
    correct_index: 0
    option_feedback:
      1: The caller’s active stack frame retains its local variable while the callee runs.
      2: An active variable need not be in the callee’s lexical scope.
    explanation: Calling another function does not end the lifetime of main’s local variable. Its name is still outside display’s lexical scope.

  # Lecture: data_palooza_v12_handouts.pdf pp.118–123
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P4(a–c); [Final] F23 Solutions (Public).pdf Garbage Collection pp.8–10 (roots and marked objects)
  - id: cs131-v2-types-roots-reachability
    type: multiple
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: At collection time, a global points to object A, a local in an active caller points to B, and A has a field pointing to C. No other references exist. Select every root object under the lecture's definition.
    options:
    - A
    - B
    - C
    correct_indices:
    - 0
    - 1
    option_feedback:
      1: Roots include locals in every active stack frame, even if their names are out of scope in the current callee.
      2: Reachable through a root is different from directly referenced by a root variable.
    explanation: A and B are directly referenced by global or active-frame variables. C is reachable through A and will be marked, but is not itself a root.

  # Lecture: data_palooza_v12_handouts.pdf pp.115,118–123,174–177
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P4(c); [Final] F24 Solutions (Public).pdf P2 pp.5–7 (reference lifetime and collection)
  - id: cs131-v2-types-last-alias
    type: parsons
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 75
    question: Arrange the object-reference pseudocode to print 7 through s while r is null. The Box must become unreachable only after that print, and collection must reclaim it. `collect()` uses mark and sweep; no hidden references exist.
    lines:
    - r = new Box(7)
    - s = r
    - r = null
    - print(s.value)
    - s = null
    - collect()
    distractors:
    - delete r.value
    explanation: Clearing r leaves the Box reachable through s. Removing s makes the Box unreachable; collection can then reclaim it. Explicit deletion is not part of this garbage-collected sequence.

  # Lecture: data_palooza_v12_handouts.pdf pp.118–123,130–136
  # Assessment: [Final] F24 Solutions (Public).pdf P2 pp.5–7 (reference counts versus reachability)
  - id: cs131-v2-types-unreachable-cycle
    type: single
    difficulty: intermediate
    bloom: analyze
    estimated_seconds: 60
    question: Objects A and B point to each other. The last variable that referred to A is set to null, and no roots reach either object. What happens under pure reference counting versus mark and sweep?
    options:
    - Both reclaim A and B.
    - Only reference counting reclaims them.
    - Only mark and sweep reclaims them.
    correct_index: 2
    option_feedback:
      0: Pure reference counting cannot reduce either count to zero while the cycle remains.
      1: References inside the cycle keep the counts positive; tracing from roots is what reveals the garbage.
    explanation: The cycle leaves each reference count positive. Mark and sweep follows roots, so it leaves both unreachable objects unmarked and reclaims them.

  # Lecture: data_palooza_v12_handouts.pdf pp.124–128
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P2(g); [Final] F23 Solutions (Public).pdf Garbage Collection p.10(d) (evaluate collector cost)
  - id: cs131-v2-types-collector-tradeoff
    type: single
    difficulty: advanced
    bloom: evaluate
    estimated_seconds: 60
    question: A program keeps almost all of its heap objects alive across many collections. You want to reduce repeatedly copying those survivors. Which of the lecture's collector properties best supports choosing mark and compact over two-space mark and copy?
    options:
    - Compacted survivors may stay in place.
    - Compaction skips the marking phase.
    - Compaction needs no pointer updates.
    correct_index: 0
    option_feedback:
      1: Mark and compact still identifies live objects by marking.
      2: Pointers must be adjusted whenever compaction moves an object.
    explanation: After long-lived objects have been packed together, later compactions may leave them in place. Two-space copying moves all survivors to the other half each collection.

  # Lecture: data_palooza_v12_handouts.pdf pp.139–141
  # Assessment: CS131 Fall 25 Quiz 2 Solutions (Public).docx P5(a–f) (ownership legality trace)
  - id: cs131-v2-types-move-and-borrow
    type: multiple
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 60
    question: |-
      This toy language uses the lecture's single-owner rules: `move` transfers ownership and invalidates the old owner; `borrow` reads without transferring it. After these lines, select every true statement.

      ```text
      owner = new String("map")
      reader = borrow(owner)
      print(reader)          // read-only borrow ends here
      next = move(owner)
      ```
    options:
    - owner is still valid after the move.
    - next owns the original string.
    - Borrowing next leaves it as owner.
    correct_indices:
    - 1
    - 2
    option_feedback:
      0: The earlier borrow has ended, but that does not restore ownership after the later move.
      2: A read-only borrow does not transfer ownership.
    explanation: next owns the string after the move. Read-only borrowing does not consume next, so repeated reads are valid. owner is invalid after moving.

  # Lecture: data_palooza_v12_handouts.pdf pp.174–179
  # Assessment: [Midterm] F24 Solutions (Public).pdf P4 pp.7–8 (object-reference state trace)
  - id: cs131-v2-types-alias-mutation
    type: single
    difficulty: intermediate
    bloom: apply
    estimated_seconds: 40
    question: |-
      What does this Python code print?

      ```python
      a = [2, 4]
      b = a
      b[0] = 7
      b = [9]
      print(a)
      ```
    options:
    - '[2, 4]'
    - '[7, 4]'
    - '[9]'
    correct_index: 1
    option_feedback:
      0: The shared list was mutated before b was rebound.
      2: Rebinding b changes that variable’s reference; it does not rebind a.
    explanation: b initially refers to the same list as a, so the element mutation is shared. Rebinding b later leaves a pointing at the original modified list.
