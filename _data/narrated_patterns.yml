# Presentation settings for narrated design-pattern lessons. Speech, scenes,
# and diagrams stay in _data/explainers/<topic>.yml, so editing these settings
# never changes a narration's audio fingerprint.
#
# visuals maps a scene key to the include that draws it. A scene with that key
# set to true shows the include; the include receives the current cue.
# scripts lists files in js/ that the player loads for live illustrations.
# outline_labels supplies short navigation labels keyed by scene id.
observer:
  name: Observer
  summary: Follow a text editor from conditional-heavy updates to cooperating <strong>Subjects and Observers</strong>.
  prerequisites: Assumes familiarity with objects, methods, and collections.
  chapter: /SEBook/designpatterns/observer.html
  views: /SEBook/designpatterns/observer
  outline_labels:
    context: One change, many dependents
    conditions: Coupled updates
    roles: Subject and Observer
    contract: Observer interface
    subject: Subject
    document: Concrete Subject
    views: Concrete Observers
    trace: Collaborations
    consequences: Benefits and liabilities
    applicability: When to use Observer
  visuals:
    ui: observer-editor-illustration.html
  complete_examples: These toolkit-neutral objects hold UI state. Rendering and input-event wiring are omitted. Register each Observer once; detach only registered Observers. Use one thread, keep registrations stable during notification, and do not recursively edit from update. Exceptions stop notification. The simple example text keeps counts consistent across languages.
state:
  name: State
  summary: Learn the State pattern through its <strong>context, problem, solution, and consequences</strong>, using a video game's companion dog.
  prerequisites: Assumes familiarity with interfaces and polymorphism.
  chapter: /SEBook/designpatterns/state.html
  views: /SEBook/designpatterns/state
  outline_labels:
    context: Behavior depends on state
    problem: Scattered state checks
    solution: One object per state
    state_role: State interface
    context_role: Context role
    concrete_roles: Concrete States
    collaborations: Collaborations
    consequences: Benefits and liabilities
    applicability: When to use State
  visuals:
    ui: state-companion-panel.html
    table: state-behavior-table.html
  complete_examples: The dog models only its behavior state and energy; movement, animation, and rendering are omitted. State objects are stateless and shared by every dog, so they must never store data about one dog. Each operation returns the dog's reaction, which a game would animate. Both designs give identical reactions for every state and input.
mvc:
  name: Model-View-Controller
  summary: Follow a screen-time visualizer from one do-everything class to a <strong>model, views, and controllers</strong> that stay in sync.
  prerequisites: Assumes familiarity with interfaces, inheritance, and the Observer pattern.
  chapter: /SEBook/designpatterns/mvc.html
  views: /SEBook/designpatterns/mvc
  outline_labels:
    context: A changing interface
    problem: Tangled data and interface
    model_role: Model
    view_role: Views
    controller_role: Controllers
    collaborations: One edit through the classes
    setup: Connecting the classes
    solution: Model, View, and Controller
    consequences: Benefits and liabilities
    applicability: When to use MVC
  visuals:
    ui: mvc-dashboard-panel.html
  # In the player, the dashboard is a live MVC app that students can edit.
  scripts: [mvc-dashboard.js]
  complete_examples: Views draw text lines instead of widgets, and the main program delivers the events a toolkit would. Every view attaches once and is never detached while the dataset notifies. Controllers that do not depend on the data are not attached. Both designs print identical lines for the same edits and clicks.
strategy:
  name: Strategy
  summary: Learn the Strategy pattern through its <strong>context, problem, solution, and consequences</strong>, using a bill-splitting app.
  prerequisites: Assumes familiarity with interfaces and polymorphism.
  chapter: /SEBook/designpatterns/strategy.html
  views: /SEBook/designpatterns/strategy
  outline_labels:
    context: One task, many algorithms
    problem: Scattered method checks
    solution: One object per algorithm
    strategy_role: Strategy interface
    context_role: Context role
    concrete_roles: Concrete Strategies
    collaborations: Collaborations
    consequences: Benefits and liabilities
    applicability: When to use Strategy
  visuals:
    ui: strategy-split-panel.html
    table: strategy-method-table.html
  complete_examples: Amounts are whole cents, so every split keeps its contract that the shares add up to the total. The expense models only its total, its people, and its split; payers, currencies, and storage are omitted. EqualSplit is stateless and shared by every expense, while PercentSplit and BirthdaySplit hold one expense's choices. Both designs give identical labels and shares for every case.
