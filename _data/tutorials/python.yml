          assert type(Pass) is type and Pass.created == 0, 'Use an ordinary class with its shared counter initially at zero.'
          first = Pass('Ari')
          second = maker('Bo')
          third = Pass('Cy')
          assert [first.serial, second.serial, third.serial] == [1, 2, 3], 'Both constructor names must allocate consecutive serials beginning at 1.'
          assert Pass.created == 3, 'Update the counter on the class object, not separately on each instance.'
          assert type(first) is Pass and type(second) is Pass, 'Calling either class name must create BackstagePass instances.'
          assert first.holder == 'Ari' and second.holder == 'Bo' and third.holder == 'Cy', 'Each instance must retain its supplied holder.'
          maker('Dee')
          assert first.serial == 1 and second.serial == 2 and third.serial == 3 and Pass.created == 4, 'Later construction must advance the counter without rewriting old serials.'
        hints:
          - text: "Which object should own the number of all passes, and which object should own one issued number?"
          - text: "An augmented assignment through self can create an instance attribute. Update the class attribute, then store its current value as this instance's serial."
          - text: "The initializer needs a class-counter increment followed by `self.serial = ...`; separately bind the factory name to the class object itself."
      - description: "Each pass owns notes while retaining the actual appended note objects"
