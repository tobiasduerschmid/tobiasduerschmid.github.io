  # --------------------------------------------------------------------------
  # STEP 12 — Inheritance and Method Dispatch
  # Pedagogy: PRIMM with worked examples, faded practice, and interleaved retrieval.
  - title: "Inheritance and Method Dispatch"
    key: inheritance
    instructions: |
      ### Why this matters

      A streamed set can reuse stage preparation while changing how its sound and announcement work. Inheritance is easier to reason about when you follow one instance through initialization, inherited methods, and overrides.

      ### 🎯 You will learn to

      - Distinguish an inherited initializer from an overridden initializer that calls `super()`.
      - Trace an inherited method's call to an override on the same instance.
      - Extend a base method while preserving its effects on instance state.

      ### Predict Before You Run

      Open `festival_inheritance.py`. `RehearsalSet` declares no initializer; `BassSet` supplies one. Predict whether `RehearsalSet("Afternoon")` succeeds, and whether `bass.prepare()` reports only `acoustic` or also includes `bass 4`. Read the call inside `prepare()` before running.

      Run and compare. The `pass` statement means “do nothing”; it gives the empty RehearsalSet body valid syntax.

      ### Initialization Follows Method Lookup

      `class BassSet(StageSet):` defines a subclass. `RehearsalSet` has no `__init__`, so it inherits `StageSet.__init__`. `BassSet` overrides `__init__`; Python runs that method and does **not** automatically run a separate base initializer first. Its explicit `super().__init__(title)` initializes the same BassSet instance's `title` and fresh `cues` list before it adds `level`.

      Removing that call would leave the attributes that the base initializer establishes missing. Python does not provide a second, independently initialized “base object” for this example.

      ### An Inherited Method Can Call an Override

      The inherited `prepare()` method receives the BassSet instance as `self`. Its `self.sound()` lookup therefore finds `BassSet.sound`, even though the calling code was written inside StageSet. This runtime choice is called **dynamic dispatch**.

      Inside `BassSet.sound`, `super().sound()` selects the base implementation in this single-inheritance example. It still acts on the **same BassSet instance**. More generally, `super()` continues lookup after the current class in Python's method-resolution order; it does not construct a parent instance.

      <details>
      <summary>Check the initialization and dispatch predictions</summary>

      RehearsalSet succeeds through its inherited initializer and prepares `Afternoon: acoustic`. BassSet prepares `Midnight: acoustic + bass 4`. The inherited method records that complete cue in `bass.cues`; both base and subclass behavior operate on that one instance.

      </details>

      ### Modify, Then Make

      First, change `bass.title` after construction and call `bass.prepare()` again. Predict which title the inherited method will read and whether the cue list grows. This checks that methods read the instance's current state rather than a snapshot taken at construction.

      Complete `StreamSet` using the supplied StageSet base:

      - `StreamSet(title, platform)` initializes the inherited title and a fresh, empty cues list, then stores `platform`. Use `super().__init__` to reuse the base initialization.
      - `sound()` returns `"stream"`. Calling the inherited `prepare()` must therefore return `"<title>: stream"` and append that cue to this instance's list.
      - `announce()` extends the base announcement with `" on <platform>"`, preserving the base method's effect of appending `"announced"` to **this same instance's** cues. Use `super().announce()` to reuse that behavior.

      For example, a set titled `"Sunrise"` on `"Campus Radio"` announces `"Sunrise is next on Campus Radio"`. A second set must have its own cues list. After **Test My Work**, explain how the same-instance rule connects inheritance to the earlier member-object and mutable-default lessons.
    files:
      - path: "festival_inheritance.py"
        language: "python"
        content: |
          class StageSet:
              def __init__(self, title):
                  self.title = title
                  self.cues = []

              def sound(self):
                  return "acoustic"

              def prepare(self):
                  cue = self.title + ": " + self.sound()
                  self.cues.append(cue)
                  return cue

              def announce(self):
                  self.cues.append("announced")
                  return self.title + " is next"


          class RehearsalSet(StageSet):
              pass


          class BassSet(StageSet):
              def __init__(self, title, level):
                  super().__init__(title)
                  self.level = level

              def sound(self):
                  return super().sound() + " + bass " + str(self.level)


          rehearsal = RehearsalSet("Afternoon")
          bass = BassSet("Midnight", 4)
          print("Inherited initializer:", rehearsal.prepare())
          print("Inherited method, overridden sound:", bass.prepare())
          print("One instance owns the cues:", bass.cues)
          class StreamSet(StageSet):
              def __init__(self, title, platform):
                  # TODO: establish the inherited state and remember the platform.
                  self.platform = platform

              def sound(self):
                  # TODO: report this set's sound.
                  return ""

              def announce(self):
                  # TODO: extend the base announcement and preserve its effect.
                  return ""
