    solution:
      files:
        - path: "loops.py"
          content: |
            def running_total(numbers: list[int]) -> list[int]:
                """Return a list of cumulative sums.
                Example: running_total([1, 2, 3]) == [1, 3, 6]
                """
                result = []
                total = 0
                for n in numbers:
                    total += n          # add n to the running sum
                    result.append(total)  # append the current cumulative total
                return result

            # --- Quick self-test ---
            data = [4, 8, 15, 16, 23, 42]
            print(f"Data:          {data}")
            print(f"Running total: {running_total(data)}")

            # Verify your understanding of / vs //
            print(f"7 / 2  = {7 / 2}")    # 3.5
            print(f"7 // 2 = {7 // 2}")   # 3
          language: "python"
      explanation: |
        **Why this is correct:**

        - **`for n in numbers:`** Python's `for` loop iterates over items directly — no index variable needed. This is cleaner than C++'s `for (int i = 0; i < nums.size(); i++)`.
        - **`total += n`:** Adds each element to the running sum before appending.
        - **`result.append(total)`:** `list.append()` is Python's equivalent of `std::vector::push_back()`. Appending `total` (not `n`) gives the cumulative sum at each position.
        - **`result = []`:** Initializes an empty list. `total = 0` is the accumulator. Both must be initialized before the loop.
        - **`7 / 2` → `3.5`:** For these built-in integers, `/` gives a float. `//` floors the quotient: `7 // 2` is `3`, while `-7 // 2` is `-4`. C++ integer division truncates toward zero instead.
        - The test checks `running_total([1, 2, 3]) == [1, 3, 6]` — after the first iteration: `total = 1`, second: `total = 3`, third: `total = 6`.

    tests:
      - description: "running_total uses a for loop and handles empty, signed, and ordinary inputs"
        command: |
          import ast, runpy
          tree = ast.parse(open('/tutorial/loops.py').read())
          function = next((node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == 'running_total'), None)
          assert function is not None and any(isinstance(node, ast.For) for node in ast.walk(function)), 'Use a for loop inside running_total.'
          running_total = runpy.run_path('/tutorial/loops.py')['running_total']
          for values, expected in [([], []), ([7], [7]), ([0, 0], [0, 0]), ([1, 2, 3], [1, 3, 6]), ([10, -12, 5], [10, -2, 3])]:
              original = values.copy()
              result = running_total(values)
              assert isinstance(result, list) and result == expected, f'For {original}, expected {expected}, got {result!r}.'
              assert values == original, 'Leave the input list unchanged.'
              assert result is not values, 'Return a new list, including for an empty input.'
              again = running_total(values)
              assert again == expected and again is not result, 'Each call must return a fresh result.'
        hints:
          - text: "Track one running sum and a separate result list. Add the current input before recording the sum."
          - text: "Start both the sum and the result inside the function, before the for loop. Empty input then needs no special indexing."
          - text: "Inside the loop, update total with the current number, then append total to result."
    quiz:
      title: "Step 14 — Knowledge Check"
      min_score: 0.8
