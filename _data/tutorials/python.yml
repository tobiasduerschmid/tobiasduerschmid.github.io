      questions:

        - question: |
            What is the output of the following code?
            ```python
            def describe(item, label="unknown"):
                return f"{item} is {label}"

            print(describe("gold", "rare"))
            print(describe("rock"))
            ```
          type: single
          options:
            - "`gold is rare` then `rock is unknown`"
            - "`gold is rare` then `rock is rare`"
            - "SyntaxError — default parameters must come before non-default"
            - "`gold is unknown` then `rock is unknown`"
          correct_index: 0
          explanation: |
            `label="unknown"` is a **default parameter**. When `describe("rock")` is called without
            a second argument, `label` falls back to `"unknown"`. When `describe("gold", "rare")` is called,
            `label` is set to `"rare"`.

        - question: |
            A C++ programmer writes a Python function and is confused that it "doesn't return anything":
            ```python
            def double(x):
                x * 2
            print(double(5))  # prints None
            ```

            **Analyze** the bug. What went wrong, and how does this differ from C++?
          type: single
          options:
            - "Python functions cannot perform multiplication — the `*` operator only works for string repetition"
            - "The function is missing `return`. In Python, no `return` means `None`"
            - "`double` is a reserved word in Python (like C++'s `double` type), so it shadows the function definition"
            - "The function needs a type annotation like `def double(x: int) -> int:` before Python will return a value"
          correct_index: 1
          explanation: |
            In C++, forgetting `return` in a non-void function is undefined behavior — the compiler
            may warn you, but the code might *appear* to work. In Python, the behavior is defined but
            surprising: a function without `return` always returns `None`. You **must** explicitly
            write `return x * 2`. This is a common mistake when switching languages.

        - question: |
            What does `mean([10, 20])` return if `mean` is defined as `return sum(numbers) / len(numbers)`?
          type: single
          options:
            - "`15` (an int)"
            - "`15.0` (a float)"
            - "`[15]` (a list)"
            - "TypeError — sum() doesn't work on lists"
          correct_index: 1
          explanation: |
            In Python 3, `/` always performs **float division**: `30 / 2` → `15.0`.
            This differs from C++, where `30 / 2` → `15` (integer division).
            Python uses `//` for integer (floor) division: `30 // 2` → `15`.

        - question: |
            *(Review — Python Execution Model)*

            A teammate is confused: *"I wrote a Python file with a helper function and some test prints, but when I import it from another file, all the test prints run too."* What should they use to prevent this?
          type: single
          options:
            - "Move the test prints into a `main()` function — Python automatically detects and skips `main()` during import"
            - "Wrap them in `if __name__ == '__main__':` — runs only when executed directly"
            - "Use `#pragma once` at the top of the file to prevent double execution, similar to C++ header guards"
            - "Add `import guard` at the top — this is Python's built-in mechanism to prevent code from running during import"
          correct_index: 1
          explanation: |
            Python scripts run top-to-bottom (like Bash). When imported, all top-level code
            executes. `if __name__ == '__main__':` is the standard Python idiom to separate
            "run as script" code from "importable" code. C++ `#include` textually inserts a file's contents before compilation;
            that text is not restricted to declarations. Inclusion and Python module execution are different mechanisms.

        - question: |
            **Arrange** the lines to define a function that returns the larger of two numbers, with a default for `b`.
          type: parsons
          lines:
            - "def max_of(a, b=0):"
            - "    if a >= b:"
            - "        return a"
            - "    else:"
            - "        return b"
          distractors:
            - "    return a, b"
          explanation: |
            The function signature comes first with the default parameter `b=0`.
            The `if`/`else` block must be indented inside the function.
            The `return` statements must be indented inside their respective branches.
            The distractor `return a, b` would return a tuple, not the max.

  # --------------------------------------------------------------------------
  # STEP 6 — Lists of References
  # Pedagogy: PRIMM — nested-reference prediction followed by a small reusable builder.
  - title: "Lists of References"
    key: lists
    instructions: |
      ### Why this matters

      A festival app needs both a list of sets and a flat running order. Confusing those two structures can put an entire set where one track belongs; copying a list can also leave its member objects shared.

      ### 🎯 You will learn to

      - Analyze aliasing through list elements, including nested lists.
      - Apply indexing, concatenation, `append`, and `extend` to the intended structure.
      - Evaluate list operations using their time costs.

      ### A List Stores References

      A Python list is a mutable sequence of references to objects. It can be heterogeneous: `["Opening", 25, None]` holds references to a string, an integer, and `None`. A nested list is another object reached through an element, not an automatically embedded copy.

      CPython, the implementation underlying this tutorial's Python runtime, uses a dynamically allocated array of object references. Its capacity can grow; this is not a C++ array of inline, fixed-type values. The language-level lesson is which objects are shared, independent of the implementation's allocation details.

      ### Predict, Run, Investigate

      ```python
      opening = ["Lantern"]
      sets = [opening, opening]
      sets[0].append("Afterglow")
      opening = ["Side Stage"]
      print(sets)
      print(opening)
      ```

      Predict whether `sets` shows two changed lists, only one changed list, or two `"Side Stage"` lists. Write your prediction and run this snippet before opening the explanation.

      <details markdown="1">
      <summary>Explain the two list slots after predicting</summary>

      Both slots initially refer to the same list, so mutation through either slot is visible through both. Rebinding the name `opening` does not rewrite either slot.

      **After the original snippet:** follow each list slot separately. The two slot arrows end at one object, even though printing the outer list displays that object's contents twice. Values inside the list boxes abbreviate references to strings.

      ```mermaid
      %% caption: Rebinding opening leaves both slots of sets pointing to the same changed list.
      flowchart TB
        accTitle: A nested list keeps two references to one inner list
        accDescr: The name sets refers to an outer list. Its index 0 and index 1 both refer to a single inner list containing Lantern and Afterglow. The name opening now refers to a separate list containing Side Stage.
        sets["name:<br/>sets"] --> outer("list object<br/>two slots")
        outer -->|index 0| shared("list object<br/>Lantern, Afterglow")
        outer -->|index 1| shared
        opening["name:<br/>opening"] --> fresh("list object<br/>Side Stage")
      ```

      </details>

      Try replacing the rebinding line with `sets[0] = ["Side Stage"]`; predict which slot changes before running again.

      ### One Object or Many Elements?

      | Operation | Effect | CPython time cost |
      |---|---|---|
      | `tracks[i]` | Retrieve the reference at index `i` | O(1) |
      | `len(tracks)` | Read the stored number of elements | O(1) |
      | `track in tracks`, `track not in tracks` | Search for a matching member | O(n) worst case |
      | `left + right` | New list containing both sequences' references | O(n + m) |
      | `tracks.append(value)` | Add one object, even if it is a list | O(1) amortized |
      | `tracks.extend(more)` | Add each element from `more` | O(m) amortized |

      Here `n` and `m` are the input lengths; the membership bound assumes each equality comparison is O(1). Expensive custom comparisons add their own cost. "Amortized" averages resize work across a sequence of operations: one append can still take O(n). Concatenation makes a new outer list without cloning the objects it references. `append` and `extend` mutate their receiver and return `None`.

      ### Task: Groups and Running Order

      Complete both functions in `reference_lists.py`. Their inputs are three lists of track objects, possibly empty; tracks may be strings or other objects.

      - `group_sets(opening, late, encore)` returns a **new outer list with three elements**, referring to those exact input lists in that order.
      - `combine_tracks(opening, late, encore)` returns a **new flat list** containing their elements in order, preserving repeated tracks and each element's identity.
      - Neither function changes any input list. Calling either function again returns a fresh outer list.

      Use the operation table to choose a structure before writing code. `append` is useful for one whole set, and `extend` for its tracks; equivalent correct constructions are accepted. After testing, append a track to an input list and explain why the grouped view updates but the combined list does not gain a new slot.
    files:
      - path: reference_lists.py
        language: python
        content: |
          def group_sets(opening, late, encore):
              # Keep each supplied set as one member of a new list.
              return []

          def combine_tracks(opening, late, encore):
              # Build a new running order without changing the supplied sets.
              return []

          opening = ["Lantern"]
          late = ["Afterglow", "Lantern"]
          encore = ["Homeward"]
          print("Grouped:", group_sets(opening, late, encore))
          print("Running order:", combine_tracks(opening, late, encore))
    open_file: reference_lists.py
    run_file: reference_lists.py
    solution:
      files:
        - path: reference_lists.py
          language: python
          content: |
            def group_sets(opening, late, encore):
                sets = [opening, late]
                sets.append(encore)
                return sets

            def combine_tracks(opening, late, encore):
                tracks = opening + late
                tracks.extend(encore)
                return tracks

            opening = ["Lantern"]
            late = ["Afterglow", "Lantern"]
            encore = ["Homeward"]
            print("Grouped:", group_sets(opening, late, encore))
            print("Running order:", combine_tracks(opening, late, encore))
      explanation: |
        `sets.append(encore)` adds one reference to a whole list. `opening + late` makes a new flat outer list, then `extend` adds each encore element to it. The input lists remain unchanged. Both results still reference existing objects: mutating an input list affects a grouped set, while mutating an individual mutable track can be visible through both views. A single expression `[opening, late, encore]` and concatenation `opening + late + encore` are also correct.
    tests:
      - description: "Grouped sets retain the three input-list identities without changing them"
        command: |
          namespace = {}
          exec(open('/tutorial/reference_lists.py').read(), namespace)
          group = namespace['group_sets']
          opening, late, encore = ['Dawn'], [], ['Finale']
          grouped = group(opening, late, encore)
          assert isinstance(grouped, list) and len(grouped) == 3, 'Return a list of exactly three sets, including empty sets.'
          assert grouped[0] is opening and grouped[1] is late and grouped[2] is encore, 'Each slot must refer to its supplied set, in order.'
          assert opening == ['Dawn'] and late == [] and encore == ['Finale'], 'Grouping must not change the input lists.'
          opening.append('Daybreak')
          assert grouped[0] == ['Dawn', 'Daybreak'], 'Mutating a supplied set should be visible through its grouped reference.'
          grouped[0] = ['Replacement']
          assert opening == ['Dawn', 'Daybreak'], 'Replacing a grouped slot must not replace the original list contents.'
          assert group(opening, late, encore) is not grouped, 'Each call must create a fresh outer list.'
        hints:
          - text: "Count sets, not tracks: even an empty set occupies one outer slot."
          - text: "Keep the input lists themselves as members. Extending with a set would add its tracks individually."
          - text: "Start from a list containing two set references, then add the remaining set as one object."
      - description: "The combined order is flat, preserves duplicates and identities, and leaves inputs untouched"
        command: |
          namespace = {}
          exec(open('/tutorial/reference_lists.py').read(), namespace)
          combine = namespace['combine_tracks']
          marker, late_marker, encore_marker = ['editable opening'], ['editable late'], ['editable encore']
          opening, late, encore = [marker, 'Echo'], ['Echo', late_marker], [None, 7, encore_marker]
          combined = combine(opening, late, encore)
          expected = [marker, 'Echo', 'Echo', late_marker, None, 7, encore_marker]
          assert isinstance(combined, list) and combined == expected, 'Combine all tracks in order, preserving duplicates and mixed types.'
          assert all(actual is supplied for actual, supplied in zip(combined, expected)), 'Keep every supplied track object from all three sets; do not clone or stringify it.'
          assert opening == [marker, 'Echo'] and late == ['Echo', late_marker] and encore == [None, 7, encore_marker], 'Do not append into an input list.'
          assert combined is not opening and combined is not late and combined is not encore, 'The result needs its own outer list.'
          opening.append('New track')
          assert combined == expected, 'Appending to an input afterward must not add a slot to the combined list.'
          marker.append('remastered')
          assert combined[0] == ['editable opening', 'remastered'], 'The existing mutable track object remains shared.'
        hints:
          - text: "The flat list should contain tracks rather than entire input lists. A track can itself be a mutable object."
          - text: "Concatenation creates a new outer list. Extending that list preserves track order and identity without editing the inputs."
          - text: "Build from `opening + ...`, then extend the result with the remaining sequence before returning it."
      - description: "Empty sets and repeated calls produce independent outer results"
        command: |
          namespace = {}
          exec(open('/tutorial/reference_lists.py').read(), namespace)
          group, combine = namespace['group_sets'], namespace['combine_tracks']
          empty = []
          grouped = group(empty, empty, empty)
          assert len(grouped) == 3 and all(item is empty for item in grouped), 'Three empty input sets still require three shared references.'
          first, second = combine([], [], []), combine([], [], [])
          assert first == [] and second == [], 'No input tracks should produce an empty running order.'
          assert first is not second, 'Independent calls must not reuse an outer result list.'
          single = ['Solo']
          assert combine([], single, []) == ['Solo'], 'An empty opening or encore must not discard the middle set.'
        hints:
          - text: "Empty inputs distinguish the number of sets from the number of tracks."
          - text: "Construct the result inside each function call so previous results cannot become shared working storage."
          - text: "With three empty inputs, the grouped shape is `[[], [], []]`, while the combined shape is `[]`; the grouped slots must still hold the supplied lists."
    quiz:
