          assert first == equal and equal == first, "Separate Recordings with both fields equal must compare equal in either order."
          assert first is not equal, "Value equality must not imply shared identity."
          assert first == first, "A Recording must compare equal to itself."
          assert not (first == Recording("Blue Hour", "Drift")), "Matching titles alone are not sufficient."
          assert not (first == Recording("Night Bus", "Kite")), "Matching artists alone are not sufficient."
          assert (first.title, first.artist) == ("Blue Hour", "Kite"), "Comparison must leave the first Recording unchanged."
          assert (equal.title, equal.artist) == ("Blue Hour", "Kite"), "Comparison must leave the other Recording unchanged."
        hints:
          - text: "Decide what makes two catalog entries equal without asking whether they occupy the same identity."
          - text: "Once the other operand is a Recording, compare both public fields and combine the two Boolean results."
          - text: "The final return has the shape `return <title comparison> and <artist comparison>`."
      - description: "Unsupported operands return NotImplemented and compare safely"
        command: |
