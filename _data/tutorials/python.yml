          explanation: "Use identity checks or reason through the assignments and copying operations to determine sharing."

  # --------------------------------------------------------------------------
  # STEP 11 — Function Calls and Mutable Defaults
  # Pedagogy: PRIMM with worked examples, faded practice, and interleaved retrieval.
  - title: "Function Calls and Mutable Defaults"
    key: calls-defaults
    instructions: |
      ### Why this matters

      A helper can unexpectedly change a caller's playlist, or silently fail to change it at all. The same reference model explains both outcomes and why a default guest list can retain names between calls.

      ### 🎯 You will learn to

      - Predict which parameter operations change objects visible to a caller.
      - Create an independent result while preserving an input object's member state.
      - Repair mutable defaults while respecting an explicitly supplied empty list.

      ### Predict Before You Run

      Open `playlist_calls.py`. Work through the first six helpers in three small groups: string rebinding, the three list operations, then the two Playlist operations. For each labeled print, predict whether the caller still sees `"Pulse"`, sees an added `"Finale"`, or sees a replaced first track. Pay attention: the three list helpers run on the same list in sequence. Finally, predict the guest calls: will the second result contain one name or both names?

      Run the file once. For every surprise, locate the object that an assignment or method call actually changes.

      ### One Rule for Every Argument

      On a call, each parameter becomes a **local name bound to the argument object**. Python does not automatically copy that object. This is often called *call by sharing* or *pass by assignment*.

      | Helper's operation | What changes | Visible through the caller's existing reference? |
      |---|---|---|
      | `title = "Remix: " + title` | Local name now refers to a new string value | No |
      | `tracks = tracks + ["Finale"]` | Local name now refers to a new outer list | No |
      | `tracks.append("Finale")` | Existing list gains a slot | Yes |
      | `tracks[0] = "Overture"` | Existing list's first slot is replaced | Yes |
      | `playlist = Playlist(["Finale"])` | Local name now refers to a new Playlist | No |
      | `playlist.tracks.append("Finale")` | The referenced member list changes | Yes |

      In C++, a reference parameter can alias a caller's variable. A Python parameter has its **own binding**: assigning a new object to it does not retarget the caller's name. Mutating an object shared by those bindings can still affect the caller. Return a new object when the caller should choose whether to replace its own binding.

      **Pause inside `extend_locally`, just after its assignment:** the caller and the function have separate names, even though both are spelled `tracks`. At function entry both referred to the original list; only the local binding moves after concatenation.

      ```mermaid
      %% caption: Rebinding a parameter changes the function's local name, leaving the caller's binding intact.
      flowchart TB
        accTitle: Caller and local parameter after list concatenation
        accDescr: The caller's tracks name still refers to the original list containing Pulse. Inside extend_locally, the parameter tracks now refers to a new list containing Pulse and Finale. The original list was not mutated.
        caller["caller name:<br/>tracks"] --> original("original list object<br/>Pulse")
        local["local parameter:<br/>tracks"] --> fresh("new list object<br/>Pulse, Finale")
      ```

      <details>
      <summary>Check the six predictions</summary>

      The string stays `Pulse`. List rebinding leaves `["Pulse"]`; appending then produces `["Pulse", "Finale"]`; replacing the first slot produces `["Overture", "Finale"]`. Object rebinding leaves the caller's Playlist with `["Pulse"]`; mutating its member then produces `["Pulse", "Finale"]`.

      </details>

      ### A Default Is Also a Stored Reference

      Compare your guest-call prediction with the final two output lines. In the starter, `guests=[]` is evaluated **once when the `def` statement executes**, and the function keeps a reference to that list. Each call omitting `guests` binds its parameter to the same object. Mutation therefore survives between calls. Dictionaries, sets, and ordinary mutable objects can cause the same problem.

      Here is the repair pattern in a separate helper:

      ```python
      def add_cue(cue, cues=None):
          if cues is None:
              cues = []
          cues.append(cue)
          return cues
      ```

      The immutable `None` singleton marks a missing list. Construction inside the function creates a fresh list for that call. An **explicitly supplied empty list is still the caller's list**: `if not cues` would wrongly replace it because empty lists are false in a Boolean context. Check identity with `None` instead.

      ### Modify, Then Make

      First, change the member-mutation helper to assign a new list to `playlist.tracks`. Predict whether the caller sees that change even though the parameter itself was never rebound. Run and explain which object owns the changed attribute, then restore the helper.

      Complete two small functions:

      1. `preview_track(playlist, title)` returns a **new Playlist with a separate tracks list**, containing the original track strings in order followed by `title`. It must leave the input Playlist and its list unchanged, including when that list is empty.
      2. `register_guest(name, guests=None)` appends `name` and returns the resulting list. An omitted argument or explicit `None` starts a fresh list every call. A supplied list, **even `[]`**, must be mutated and returned as the very same object.

      The first function asks you to choose a copying boundary. The second asks you to choose when sharing is intentional. After testing, compare their contracts: one protects the caller's state; the other deliberately changes caller-supplied state.
    files:
      - path: "playlist_calls.py"
        language: "python"
        content: |
          class Playlist:
              def __init__(self, tracks):
                  self.tracks = tracks


          def rename_locally(title):
              title = "Remix: " + title


          def extend_locally(tracks):
              tracks = tracks + ["Finale"]


          def append_shared(tracks):
              tracks.append("Finale")


          def replace_first(tracks):
              tracks[0] = "Overture"


          def replace_playlist(playlist):
              playlist = Playlist(["Finale"])


          def edit_member(playlist):
              playlist.tracks.append("Finale")


          title = "Pulse"
          rename_locally(title)
          print("String rebinding:", title)
          tracks = ["Pulse"]
          extend_locally(tracks)
          print("List rebinding:", tracks)
          append_shared(tracks)
          print("List append:", tracks)
          replace_first(tracks)
          print("Item replacement:", tracks)
          show = Playlist(["Pulse"])
          replace_playlist(show)
          print("Object rebinding:", show.tracks)
          edit_member(show)
          print("Member mutation:", show.tracks)
          def preview_track(playlist, title):
              """Return an independent Playlist with title added; keep playlist unchanged."""
              # TODO: preserve the caller's tracks while preparing a preview.
              return playlist


          def register_guest(name, guests=[]):
              """Append to a supplied guest list, or start a fresh one when omitted."""
              # TODO: repair unintended sharing between calls that omit guests.
              guests.append(name)
              return guests


          print("First guest call:", register_guest("Ari"))
          print("Second guest call:", register_guest("Sol"))
