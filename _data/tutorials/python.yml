        - path: "recording_equality.py"
          language: "python"
          content: |
            class GuestPass:
                def __init__(self, label):
                    self.label = label


            first = GuestPass("Balcony")
            second = GuestPass("Balcony")
            alias = first
            print("Separate passes:", first == second, first is second)
            print("Alias:", first == alias, first is alias)
            class Recording:
                def __init__(self, title, artist):
                    self.title = title
                    self.artist = artist
                def __eq__(self, other):
                    if not isinstance(other, Recording):
                        return NotImplemented
                    return self.title == other.title and self.artist == other.artist
      explanation: |
        The type guard lets unsupported operands participate in Python's comparison fallback. For two Recordings, comparing both required fields defines the catalog's value policy.

        Equal values do not merge objects. Two independently constructed equal Recordings still have distinct identities, while an alias retains the same identity. Comparing a value with `None` therefore uses `is None` and does not depend on this equality policy.
    tests:
