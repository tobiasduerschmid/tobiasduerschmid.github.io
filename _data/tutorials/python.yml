    solution:
      files:
        - path: "geometry.py"
          content: |
            from dataclasses import dataclass

            class PointManual:
                """The OLD way: hand-written __init__, __eq__, __repr__."""
                def __init__(self, x, y):
                    self.x = x
                    self.y = y
                def __eq__(self, other):
                    return isinstance(other, PointManual) and self.x == other.x and self.y == other.y
                def __repr__(self):
                    return f"PointManual(x={self.x}, y={self.y})"

            @dataclass(frozen=True)
            class Point:
                x: int
                y: int

                @property
                def distance_to_origin(self) -> float:
                    return (self.x ** 2 + self.y ** 2) ** 0.5

            @dataclass(frozen=True)
            class RGB:
                r: int
                g: int
                b: int

                @property
                def as_hex(self) -> str:
                    return f'#{self.r:02x}{self.g:02x}{self.b:02x}'

            # --- Quick self-test ---
            a = Point(3, 4)
            b = Point(3, 4)
            print(a == b)                # True
            print(a)                     # Point(x=3, y=4)
            print(a.distance_to_origin)  # 5.0
            print(RGB(255, 128, 0).as_hex)  # '#ff8000'
          language: "python"
      explanation: |
        **Why this is correct:**

        - **`@dataclass(frozen=True)`** writes three dunder methods for you: `__init__` (so `Point(3, 4)` works), `__eq__` (so `Point(3, 4) == Point(3, 4)` is `True`), and `__repr__` (so `print(p)` shows `Point(x=3, y=4)`). With `frozen=True` it also makes `Point` **hashable** and prevents assignment to fields after construction.
        - **`x: int` / `y: int`** are not just documentation — `@dataclass` reads these type hints (Type Hints) to figure out what fields the class has. Without the annotations, `@dataclass` would not know to generate `__init__`.
        - **`frozen=True`** blocks ordinary field assignment with `FrozenInstanceError`. These points hold immutable integers, so their contents stay stable and their generated hash works. A frozen dataclass with a list field would still allow mutation of that member list.
        - **`@property`** turns `distance_to_origin` into a *read-as-attribute* method. The test reads `p.distance_to_origin` (no parens). Without `@property`, that expression would evaluate to a *bound method object*, not a number — a confusing error mode.
        - **`RGB.as_hex`** reuses every pattern from `Point` — frozen dataclass, typed `int` fields, `@property` returning a typed string. The f-string spec `f'{r:02x}'` (Variables, Types & f-Strings spaced review) formats an int as a two-digit lowercase hex value. Same recipe, different field types and different return type — that's the point of this independent task.
        - **Dataclass defaults have an extra safeguard.** A dataclass rejects an unhashable field default such as `events: list = []`. `field(default_factory=list)` creates a list for each new instance. Ordinary classes and functions have no such safeguard; their shared defaults still need deliberate handling.
        - **`PointManual` stays in the file** as a contrast — it shows what the decorator saved you from writing.

    tests:
      - description: "Point and RGB are frozen dataclasses with the requested int fields"
        command: |
          import sys
          from dataclasses import FrozenInstanceError, is_dataclass
          from typing import get_type_hints
          sys.modules.pop('geometry', None)
          from geometry import Point, RGB
          for cls, names, values in [(Point, ('x', 'y'), (3, 4)), (RGB, ('r', 'g', 'b'), (255, 128, 0))]:
              assert is_dataclass(cls) and cls.__dataclass_params__.frozen, f'{cls.__name__} must be a frozen dataclass.'
              annotations = get_type_hints(cls)
              assert all(annotations.get(name) is int for name in names), f'Annotate every requested {cls.__name__} field with int.'
              instance = cls(*values)
              assert tuple(getattr(instance, name) for name in names) == values, 'Store the supplied field values.'
              for name in names:
                  try:
                      setattr(instance, name, 99)
                  except FrozenInstanceError:
                      pass
                  else:
                      raise AssertionError(f'Assignment to {name} should raise FrozenInstanceError.')
        hints:
          - text: "Define both classes with annotated fields and use the dataclass decorator."
          - text: "Field types are int; frozen=True controls later field assignment, not runtime type enforcement."
          - text: "After trying a deliberate mutation probe, comment that probe out before Test My Work."
      - description: "Point equality compares both fields and distance is a float property for varied coordinates"
        command: |
          import inspect, math, sys
          from typing import get_type_hints
          sys.modules.pop('geometry', None)
          from geometry import Point
          assert Point(3, 4) == Point(3, 4), 'Equal coordinates must compare equal.'
          assert Point(3, 4) != Point(4, 4) and Point(3, 4) != Point(3, 5), 'Both coordinates participate in equality.'
          descriptor = inspect.getattr_static(Point, 'distance_to_origin')
          assert isinstance(descriptor, property), 'Expose distance_to_origin with @property.'
          assert get_type_hints(descriptor.fget).get('return') is float, 'Annotate the distance return type as float.'
          for x, y in [(3, 4), (0, 0), (0, -7), (-3, 4), (1, 1), (2, -5)]:
              distance = Point(x, y).distance_to_origin
              assert isinstance(distance, float) and math.isclose(distance, math.hypot(x, y), rel_tol=1e-12, abs_tol=1e-12), f'Incorrect distance for Point({x}, {y}): {distance!r}.'
        hints:
          - text: "Distance depends on both coordinates and is never negative."
          - text: "Test an axis point and a non-integral distance, not only the 3-4-5 triangle. Do not round the result."
          - text: "Square both coordinates, add the squares, and take the square root; keep the -> float annotation and @property."
      - description: "RGB.as_hex is a property with correct lowercase channels and leading zeroes"
        command: |
          import inspect, sys
          sys.modules.pop('geometry', None)
          from geometry import RGB
          assert isinstance(inspect.getattr_static(RGB, 'as_hex'), property), 'Expose as_hex with @property.'
          for values, expected in [((255, 128, 0), '#ff8000'), ((0, 0, 0), '#000000'), ((15, 15, 15), '#0f0f0f'), ((1, 16, 254), '#0110fe')]:
              result = RGB(*values).as_hex
              assert result == expected, f'For RGB{values}, expected {expected}, got {result!r}.'
        hints:
          - text: "Each channel occupies two lowercase hexadecimal digits, in r, g, b order."
          - text: "Values below 16 require a leading zero, including zero itself."
          - text: "Use the :02x format for each channel and place one # before all three."
    quiz:
      title: "Step 20 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            Which three dunder methods does `@dataclass` write for you **by default** (no extra kwargs)?
          type: single
          options:
            - "`__init__`, `__eq__`, `__repr__`"
            - "`__init__`, `__del__`, `__str__`"
            - "`__init__`, `__eq__`, `__hash__`"
            - "`__new__`, `__copy__`, `__format__`"
          correct_index: 0
          option_feedback:
            1: "`__del__` is for destructors (rare in Python — garbage collection handles it). `@dataclass` doesn't write either of these. `__repr__`, not `__str__`, is what `@dataclass` generates."
            2: "With the default `eq=True`, a non-frozen dataclass is unhashable. Adding `frozen=True` normally generates a hash method, while `eq=False` leaves the inherited hash behavior alone."
            3: "These aren't related. `@dataclass` focuses on the standard data-holder boilerplate: construction, equality, and string representation."
          explanation: |
            `@dataclass` writes `__init__` (so you can write `Point(3, 4)`), `__eq__` (structural
            equality based on fields), and `__repr__` (a readable string like `Point(x=3, y=4)`).
            With the defaults, `__hash__` is disabled; `eq=True, frozen=True` normally generates it, while `eq=False` leaves it unchanged.

        - question: |
            Given:
            ```python
            @dataclass(frozen=True)
            class Point:
                x: int
                y: int

            p = Point(3, 4)
            p.x = 99
            ```
            What does the assignment `p.x = 99` do?
          type: single
          options:
            - "It silently succeeds — `frozen=True` only affects equality, not assignment"
            - "It succeeds — only assigning a list to the field would be blocked"
            - "`FrozenInstanceError` — frozen dataclasses block `__setattr__`"
            - "It raises `TypeError` — `99` is not declared `int` in this context"
          correct_index: 2
          option_feedback:
            0: "`frozen=True` prevents ordinary field assignment. Equality is generated by `eq=True` (the default), separately."
            1: "The frozen restriction applies to field assignment regardless of the assigned value's type. It is separate from the mutability of the object stored in a field."
            3: "Type annotations are not enforced at runtime (Type Hints). The assignment fails because the class is frozen, not because of any type check."
          explanation: |
            `@dataclass(frozen=True)` overrides `__setattr__` to raise `FrozenInstanceError`
            on ordinary field assignment. The exception subclasses `AttributeError`.
            The integer fields in this example also support hashing; a mutable member
            such as a list would not become immutable or hashable just because its
            containing dataclass is frozen.

        - question: |
            Which of these statements about `@property` are **true**? *(Select all that apply.)*
          type: multiple
          options:
            - "It lets you read a method's result as an attribute, without parentheses"
            - "It makes the underlying field private — no callers can read it"
            - "It can be combined with a setter (using `@<name>.setter`) to control writes"
            - "It is a special form of `__getattr__`"
          correct_indices: [0, 2]
          option_feedback:
            1: "`@property` is purely about *interface shape* (`p.x` vs `p.x()`). It doesn't make anything private. Python's privacy convention is the underscore prefix (`_internal`), and even that is only a convention — there are no hard private fields."
            3: "`@property` is implemented as a *descriptor* on the class, not via `__getattr__`. `__getattr__` is the per-instance fallback for missing attributes — completely different mechanism."
          explanation: |
            `@property` lets a method *look like* an attribute on the outside (no parens).
            You can pair it with `@<name>.setter` to also control writes. It does **not**
            make the underlying state private — that's a Java/C# habit that doesn't translate.
            And it is a descriptor, not `__getattr__`.

        - question: |
            *(Spaced review — List Comprehensions)*

            What is `points[2]` after this line?
            ```python
            points = [Point(x, x * 2) for x in range(5)]
            ```
          type: single
          options:
            - "`Point(2, 2)`"
            - "`Point(2, 4)`"
            - "`Point(4, 8)`"
            - "`(2, 4)` — a plain tuple, since list comprehensions don't return objects"
          correct_index: 1
          option_feedback:
            0: "`x * 2` for `x = 2` is `4`, not `2`. The y-coordinate is the doubled value."
            2: "Indexing is 0-based: `points[2]` corresponds to `x = 2`, not `x = 4`."
            3: "List comprehensions can absolutely produce class instances. `Point(x, x*2)` is a function call expression — it constructs a `Point` for each iteration."
          explanation: |
            `range(5)` yields 0, 1, 2, 3, 4. The list comprehension constructs a `Point`
            for each, with `y = x * 2`. So `points[2]` corresponds to `x = 2`, giving
            `Point(2, 4)`. List comprehensions compose just as well with custom classes
            as with primitives.

        - question: |
            **Evaluate.** For which use case is `@dataclass(frozen=True)` the **best** fit?
          type: single
          options:
            - "A shopping cart whose items are added and removed throughout the session"
            - "A 2D grid coordinate `(row, col)` used as a dictionary key"
            - "A database connection that holds a socket and a transaction state"
            - "A logger object that buffers messages and flushes them periodically"
          correct_index: 1
          option_feedback:
            0: "A cart needs deliberate mutable state. Freezing a field that refers to a list would still allow changes to that list, so frozen fields alone do not express an immutable cart."
            2: "Connections have *identity* (this specific socket) and *changing internal state* (buffer, transaction). They are reference objects, not value objects. Frozen dataclasses fit values where two with equal fields are interchangeable — connections aren't."
            3: "Loggers buffer messages — internal state changes constantly. Also, two loggers with equal configuration aren't interchangeable; they have identity."
          explanation: |
            `frozen=True` is the right fit for **value objects**: small, conceptually
            immutable, where `Point(3, 4) == Point(3, 4)` should mean "the same value."
            Coordinates, money amounts, dates, RGB colors all fit this pattern. Things
            with *changing internal state* (carts, connections, loggers) are reference
            objects — use a regular class.

        - question: |
            *(Spaced review — Type Hints)*

            Given:
            ```python
            @dataclass(frozen=True)
            class Point:
                x: int
                y: int
            ```
            What happens when you write `p = Point(3.5, 4.5)`?
          type: single
          options:
            - "Runtime: `TypeError` — Python rejects floats where ints are annotated."
            - "Runtime: constructs with `p.x == 3.5`. `mypy`: flags `float` ≠ `int`."
            - "Runtime: `Point(3, 4)` (Python silently truncates floats). `mypy`: ok."
            - "Runtime: depends on whether `frozen=True` is set."
          correct_index: 1
          option_feedback:
            0: "Type annotations on dataclass fields are not enforced by Python at runtime — same rule as Type Hints. The annotations only tell `@dataclass` what to put in the auto-generated `__init__` signature; they do not gate the values."
            2: "Python does not coerce floats to ints in dataclass construction — `p.x` stays `3.5`. The annotation is documentation, not a converter."
            3: "`frozen=True` controls ordinary field assignment, not what types the constructor accepts. Annotations do not enforce types at runtime regardless of `frozen`."
          explanation: |
            This is the Type Hints lesson applied inside `@dataclass`: the field annotations
            (`x: int`) are read by the decorator to wire up `__init__`, but Python never
            enforces them at runtime. `Point(3.5, 4.5)` constructs cleanly; `mypy` would
            flag it. The runtime-vs-static distinction is the *same rule everywhere*
            annotations appear — function signatures (Type Hints) or dataclass fields (here).

        # Pedagogy: delayed retrieval of the object model in a new context.
        - type: single
          difficulty: intermediate
          question: |
            What does this print?
            ```python
            from dataclasses import dataclass

            @dataclass
            class Ticket:
                seat: str

            first = Ticket("B7")
            second = Ticket("B7")
            alias = first
            print(first == second, first is second, alias is first)
            ```
          options:
          - '`False False True`'
          - '`True True True`'
          - '`True False True`'
          - '`False True False`'
          correct_index: 2
          option_feedback:
            0: The generated __eq__ compares field values, unlike identity equality inherited by an ordinary class.
            1: Equal fields do not merge two constructed instances into one object.
            3: The two constructor calls create separate instances; assignment to alias creates no new instance.
          explanation: Dataclasses generate value equality by default. Construction and assignment still follow the object-reference rules from ordinary classes.
        - type: single
          difficulty: advanced
          question: |
            What does this print?
            ```python
            from dataclasses import dataclass

            @dataclass(frozen=True)
            class Show:
                songs: list[str]

            names = ["Opening"]
            show = Show(names)
            names.append("Finale")
            print(show.songs)
            ```
          options:
          - "`['Opening']`"
          - "`['Opening', 'Finale']`"
          - '`FrozenInstanceError`'
          - '`TypeError`'
          correct_index: 1
          option_feedback:
            0: Construction stores the supplied list reference; it does not make a copy.
            2: The code mutates the member list, without assigning to the frozen songs field.
            3: The annotation permits this list, and annotations do not add runtime checks anyway.
          explanation: Frozen fields prevent ordinary rebinding of the field. They do not recursively freeze the objects those fields reference.
