  # --------------------------------------------------------------------------
  # STEP 8 — Class Objects & Instance Attributes
  # Pedagogy: PRIMM — predict class lookup, then repair shared counter and member ownership.
  - title: "Class Objects & Instance Attributes"
    key: classes
    instructions: |
      ### Why this matters

      A pass issuer needs one shared numbering sequence, but each pass needs its own notes. Python stores both class state and instance state on objects; placing a list in the wrong namespace can quietly share every attendee's notes.

      ### 🎯 You will learn to

      - Analyze a class as a callable object with attributes and methods.
      - Distinguish class attribute lookup, instance shadowing, and shared mutation.
      - Create a shared counter alongside per-instance serials and lists.

      ### The Class Is an Object Too

      Executing a `class` statement creates a class object and binds its name. Its body defines class attributes and functions. Calling the class normally creates an instance, then initializes it with `__init__`.

      ```python
      class StageBadge:
          color = "blue"

      BadgeMaker = StageBadge
      badge = BadgeMaker()
      print(BadgeMaker is StageBadge)       # True: two names, one class
      print(type(badge) is StageBadge)      # True: instance's class
      print(type(StageBadge) is type)       # True: this class's class
      ```

      The final statement describes this ordinary class: `type` is the built-in class used to create it. Class objects can be assigned to names, passed as arguments, and called through aliases just like other callable objects.

      **After the first snippet:** distinguish the two names for the class from the name for its instance. The `__class__` arrow shows which class the instance belongs to; it does not mean the instance contains a copy of the class.

      ```mermaid
      %% caption: A class alias refers to the class object; calling it produces a separate instance.
      flowchart TB
        accTitle: Names for a class object and one of its instances
        accDescr: The name badge refers to a StageBadge instance. That instance's class is the StageBadge class object. Both names StageBadge and BadgeMaker refer to that same class object, whose color attribute is blue.
        badge["name:<br/>badge"] --> instance("StageBadge instance<br/>no own color")
        instance -->|__class__| cls("class object<br/>StageBadge<br/>color: blue")
        className["name:<br/>StageBadge"] --> cls
        alias["name:<br/>BadgeMaker"] --> cls
      ```

      ### Predict Attribute Lookup

      Continue the example:

      ```python
      other = StageBadge()
      badge.color = "gold"
      StageBadge.color = "green"
      print(badge.color, other.color, StageBadge.color)
      ```

      Predict the three colors, then run the two snippets before opening the explanation.

      <details markdown="1">
      <summary>Explain the color lookup after predicting</summary>

      For these ordinary data attributes, lookup first checks the instance and then falls back to its class. Assigning `badge.color` creates an instance attribute that **shadows** the class default. The result is `gold green green`; changing the class default affects instances that still fall back to it.

      **After both assignments:** the class relationship stays the same. Only one instance now has its own `color`. This snapshot omits the class-name bindings from the previous diagram.

      ```mermaid
      %% caption: An instance's own color hides the class default without changing it for other instances.
      flowchart TB
        accTitle: Instance shadowing alongside a shared class default
        accDescr: Name badge refers to an instance with its own color gold. Name other refers to a separate instance without its own color. Both have the StageBadge class object as their class; the class color is green. Reading badge.color finds gold locally, while other.color falls back to green.
        badge["name:<br/>badge"] --> a("StageBadge instance<br/>own color: gold")
        other["name:<br/>other"] --> b("StageBadge instance<br/>no own color")
        a -->|__class__| cls("class object<br/>StageBadge<br/>color: green")
        b -->|__class__| cls
      ```

      </details>

      A mutable class attribute has another consequence: `notes = []` in a class body creates one shared list. `self.notes.append(...)` can find that list through fallback lookup and mutate it; it does not create an instance list. Create `self.notes = []` in `__init__` when each instance should own its notes.

      ### Task: One Issuer, Independent Passes

      Repair `BackstagePass` in `class_passes.py`:

      - `created` is a class counter starting at zero. Each new pass increases it by one and keeps the resulting number as its own `serial`, so serials begin at 1 and older serials never change.
      - `holder` stores the supplied name. Every pass owns a fresh empty `notes` list. `add_note(note)` appends one supplied object and preserves repeated notes.
      - `access = "general"` remains a class default. An instance may override `access`; other instances continue following changes to the class default.
      - Bind `PassMaker` to the same class object as `BackstagePass`, so either name constructs passes in the same sequence.

      The starter runs but has ownership and counter bugs. Use **Test My Work** to observe the effects, then repair the class. Methods may use the class name or `type(self)` for the counter; either is correct for this exercise, which does not involve subclasses. Explain why a shared integer counter is useful but a shared notes list is not.
    files:
      - path: class_passes.py
        language: python
        content: |
          class BackstagePass:
              created = 0
              access = "general"
              notes = []

              def __init__(self, holder):
                  self.holder = holder
                  self.created += 1
                  self.serial = self.created

              def add_note(self, note):
                  self.notes.append(note)

          PassMaker = None
          print("Factory aliases the class:", PassMaker is BackstagePass)
          print("The class is an instance of type:", type(BackstagePass) is type)
    open_file: class_passes.py
    run_file: class_passes.py
    solution:
      files:
        - path: class_passes.py
          language: python
          content: |
            class BackstagePass:
                created = 0
                access = "general"

                def __init__(self, holder):
                    self.holder = holder
                    BackstagePass.created += 1
                    self.serial = BackstagePass.created
                    self.notes = []

                def add_note(self, note):
                    self.notes.append(note)

            PassMaker = BackstagePass
            print("Factory aliases the class:", PassMaker is BackstagePass)
            print("The class is an instance of type:", type(BackstagePass) is type)
      explanation: |
        The class owns one created binding. Incrementing it rebinds the class attribute to the next integer, while each instance serial retains its assigned integer. The starter's self.created increment instead assigned an instance attribute, shadowing the class counter. Initializing self.notes on each construction prevents shared-list mutation. Leaving access on the class lets ordinary instances follow that default until an instance explicitly overrides it. PassMaker and BackstagePass refer to the same callable class object.
