  - title: "Regular Expressions in Python: the re Module"
    key: regex
    instructions: |
      ### Why this matters

      You already know regex from `grep` and `sed`. Python's `re` module brings that same power inside a script — no subprocess, no fragile shell escaping. Whenever you need to extract structured data from text (log lines, HTML, CSV oddities, error messages), `re.findall()`, `re.search()`, and `re.sub()` are the three tools that solve the vast majority of cases.

      ### 🎯 You will learn to

      - Apply `re.findall()`, `re.search()`, and `re.sub()` to extract, test, and transform text patterns
      - Apply raw strings (`r'...'`) to write regex patterns without backslash-escaping headaches

      ## From grep to Python

      In the RegEx tutorial you used patterns with `grep -E` and `sed`. Python's built-in
      `re` module gives you the same power inside a script — no subprocess needed:

      | Shell operation | Corresponding Python operation |
      |---|---|
      | `grep -E 'pattern' file` (matching lines) | `[line for line in text.splitlines() if re.search(r'pattern', line)]` |
      | `grep -c 'pattern' file` (count matching lines) | `sum(1 for line in text.splitlines() if re.search(r'pattern', line))` |
      | `sed 's/old/new/g' file` | `re.sub(r'old', 'new', text)` |
      | Test if a match exists | `re.search(r'pattern', text)` |

      `re.findall()` returns **matches**, not whole matching lines: two matches on one line count twice. The table compares operations; regex syntax differs between shell tools and Python, so patterns are not always interchangeable.

      ### The three essential functions

      ```python
      import re

      text = "Error 404: page not found. Error 500: server crash."

      # SUB-GOAL: Find the first match
      m = re.search(r'Error \d+', text)
      if m:
          print(m.group())     # "Error 404"

      # SUB-GOAL: Find all matches
      codes = re.findall(r'\d+', text)
      print(codes)             # ['404', '500']

      # SUB-GOAL: Replace all matches
      clean = re.sub(r'Error \d+', 'ERR', text)
      print(clean)             # "ERR: page not found. ERR: server crash."
      ```

      Raw strings (`r'...'`) are the standard for regex patterns in Python —
      they prevent Python from interpreting backslashes before `re` sees them.

      ### Predict Before You Code

      Before implementing: what does `re.findall(r'\d+', 'boot in 3... 2... 1...')` return? Write your prediction, then check in the editor.

      ### Task

      Complete `log_parser.py`. The log file is already loaded as a string for you.

      1. Use `re.findall()` to collect all timestamps (HH:MM:SS pattern) and print `Timestamps found: <count>`.
      2. Use `re.findall()` to collect matches from `ERROR` to the end of its line and print `Errors: <count>`. Count a line once even if ERROR occurs twice.
      3. Use `re.sub()` to redact all dotted IP addresses with `"x.x.x.x"` and print the full redacted log after the two counts. Preserve other text. Here addresses are four digit groups separated by literal dots; validating IPv4 octet ranges is outside this task.

    files:
      - path: "log_parser.py"
        content: |
          import re

          with open("log.txt") as f:
              text = f.read()

          # 1. Extract all timestamps (HH:MM:SS) and print count
          # Hint: pattern is r'\d{2}:\d{2}:\d{2}'
          # Expected output: Timestamps found: 6

          # 2. Extract all ERROR lines and print count
          # Hint: pattern is r'ERROR.*'
          # Expected output: Errors: 2

          # 3. Redact IPv4 addresses and print redacted log
          # Hint: pattern is r'\d+\.\d+\.\d+\.\d+'

        language: "python"

      - path: "log.txt"
        content: |
          2024-01-15 09:23:11 INFO  Server started on port 8080
          2024-01-15 09:23:45 ERROR Connection failed: timeout
          2024-01-15 09:24:02 INFO  Request from 192.168.1.42
          2024-01-15 09:24:18 WARNING Slow response: 2345ms
          2024-01-15 09:24:33 ERROR Disk usage at 94%
          2024-01-15 09:24:51 INFO  Request from 10.0.0.7
        language: "plaintext"

    open_file: "log_parser.py"

    setup_commands:
      - "import os; os.chdir('/tutorial')"

    solution:
      files:
        - path: "log_parser.py"
          content: |
            import re

            with open("log.txt") as f:
                text = f.read()

            # 1. Extract all timestamps (HH:MM:SS) and print count
            timestamps = re.findall(r'\d{2}:\d{2}:\d{2}', text)
            print(f"Timestamps found: {len(timestamps)}")

            # 2. Extract all ERROR lines and print count
            errors = re.findall(r'ERROR.*', text)
            print(f"Errors: {len(errors)}")

            # 3. Redact IPv4 addresses and print redacted log
            redacted = re.sub(r'\d+\.\d+\.\d+\.\d+', 'x.x.x.x', text)
            print(redacted)
          language: "python"
      explanation: |
        **Why this is correct:**

        - **`re.findall(r'\d{2}:\d{2}:\d{2}', text)`:** `\d{2}` matches exactly two digits; the colons are literal. This finds all 6 sample timestamps. Checks compare the complete count record and also use a different log.
        - **`re.findall(r'ERROR.*', text)`:** `ERROR` matches the literal text; `.*` consumes everything to the end of the line (`.` does not match `\n` by default). This returns 2 sample suffixes starting with ERROR and counts each matching line once.
        - **`re.sub(r'\d+\.\d+\.\d+\.\d+', 'x.x.x.x', text)`:** `\d+` matches one or more digits; `\.` matches a literal dot. With no replacement limit, every address is redacted. Checks compare the complete redacted log so a second unredacted address or a changed non-IP sequence cannot pass.
        - **Raw strings (`r'...'`):** The `r` prefix keeps backslashes literal. For example, `r'\b'` reaches the regex engine as a word boundary, while `'\b'` is a backspace character. An unrecognized string escape such as `'\d'` keeps its backslash but can trigger a warning; raw strings avoid that ambiguity and double escaping.
        - **`f.read()` vs line-by-line:** This step uses `f.read()` to load the entire file as a string, because `re.findall()` and `re.sub()` operate on a string. This is fine for small log files; for very large files, you'd process line by line.

    tests:
      - description: "Uses the requested re.findall and re.sub operations, including imported aliases"
        command: |
          import ast
          tree = ast.parse(open('/tutorial/log_parser.py').read())
          modules, functions = set(), {}
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  modules.update(alias.asname or alias.name for alias in node.names if alias.name == 're')
              elif isinstance(node, ast.ImportFrom) and node.module == 're':
                  functions.update({alias.asname or alias.name: alias.name for alias in node.names})
          used = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name):
                      used.add(functions.get(node.func.id))
                  elif isinstance(node.func, ast.Attribute) and isinstance(node.func.value, ast.Name) and node.func.value.id in modules:
                      used.add(node.func.attr)
          assert {'findall', 'sub'} <= used, 'Use re.findall for extraction and re.sub for redaction; aliases are welcome.'
        hints:
          - text: "Finding matches and replacing matches are separate operations."
          - text: "findall returns the extracted matches; sub returns a new string with replacements."
          - text: "Call both operations on the log text, then print the counts and the returned redacted string."
      - description: "Reports complete counts and redacts every IP while preserving the rest of each log"
        command: |
          import os, re
          from pathlib import Path
          os.chdir('/tutorial')
          log = Path('/tutorial/log.txt')
          original = log.read_text()
          varied = '12:34:56 INFO peers 1.2.3.4 and 5.6.7.8; marker 1x2x3x4\n12:35:00 ERROR retry ERROR 1.2.3.4\n12:36:00 WARNING id 123-45-67-89\n'
          try:
              for contents, timestamps, errors in [(original, 6, 2), (varied, 3, 1), ('INFO no addresses here\n', 0, 0)]:
                  log.write_text(contents)
                  output = __run_capture('/tutorial/log_parser.py')
                  lines = output.splitlines()
                  assert len(lines) >= 2, 'Print both count records before the redacted log.'
                  assert re.fullmatch(r'Timestamps found:\s*' + str(timestamps), lines[0].strip()), f'Incorrect timestamp count: {output!r}.'
                  assert re.fullmatch(r'Errors:\s*' + str(errors), lines[1].strip()), f'Count ERROR lines, including each line only once: {output!r}.'
                  expected = re.sub(r'\d+\.\d+\.\d+\.\d+', 'x.x.x.x', contents)
                  assert '\n'.join(lines[2:]).rstrip('\n') == expected.rstrip('\n'), 'Redact every dotted IP and preserve all other log text, including non-IP digit sequences.'
          finally:
              log.write_text(original)
        hints:
          - text: "Check the counts separately from the redacted text. A line containing ERROR twice is still one ERROR line."
          - text: "An unescaped dot matches any character. A literal dot requires an escape in the regex."
          - text: "Do not limit sub to one replacement; print its complete returned string after the two count records."
    quiz:
