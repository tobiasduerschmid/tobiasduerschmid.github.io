            - "Splits the line into a list of characters"
          correct_index: 1
          explanation: |
            When you read a line from a file, it includes the trailing newline `\n`.
            `.strip()` removes **leading and trailing whitespace** (spaces, tabs, `\n`, `\r`).
            This is analogous to trimming a C++ `std::string`.

        - question: |
            A teammate proposes reading a 2 GB log file with `text = f.read()` (loading the entire file into memory). Another proposes `for line in f:` (iterating line by line).

            **Evaluate** both approaches. Which is better for a 2 GB file, and why?
          type: single
          options:
            - "Both are identical in behavior and memory usage — Python handles buffering automatically regardless of which method you use"
            - "`f.read()` is better because reading the entire file into one string is faster than processing line by line due to fewer I/O calls"
            - "`for line in f:` avoids retaining the whole file; memory depends on the longest line and retained results"
            - "Neither works — Python can't handle files over 1 GB"
          correct_index: 2
          explanation: |
            `f.read()` loads the **entire decoded text** into a string, whose memory size can differ
            from the file's byte size. Iterating lines avoids retaining that whole string, but the
            longest line, buffering, and saved results still consume memory. Collecting every line
            into a list loses that advantage. C++'s `std::getline` supports the same streaming approach.

        - question: |
