          assert first.notes is not second.notes, 'A class-level list must not become every pass notes list.'
          note = ['Needs microphone']
          other_note = ['Soundcheck at six']
          first.add_note(note)
          first.add_note(note)
          first.add_note(other_note)
          assert len(first.notes) == 3 and all(actual is supplied for actual, supplied in zip(first.notes, [note, note, other_note])), 'Append each supplied note in call order, preserving identities and duplicates.'
          assert second.notes == [] and Pass('Gia').notes == [], 'A note must not appear on existing or future unrelated passes.'
        hints:
          - text: "The bug appears when a second pass looks up notes and reaches the same class-level list."
          - text: "Each initializer call should allocate and assign its own list before add_note is used."
          - text: "Put an empty-list assignment on `self.notes` inside `__init__`; keep adding one note through the receiver's list."
      - description: "Class defaults update unshadowed instances without replacing a personal override"
        command: |
          namespace = {}
          exec(open('/tutorial/class_passes.py').read(), namespace)
          Pass = namespace['BackstagePass']
          first, second = Pass('Hal'), Pass('Ira')
          assert first.access == second.access == Pass.access == 'general', 'New passes should read the shared general-access default.'
          first.access = 'crew'
          Pass.access = 'guest'
          assert first.access == 'crew', 'An instance override should shadow later changes to the class default.'
          assert second.access == 'guest' and Pass('Jae').access == 'guest', 'Unshadowed existing and new instances should follow the changed class default.'
          assert Pass.access == 'guest', 'An instance override must not overwrite the class default.'
        hints:
          - text: "The shared access value is a default, not a value to stamp onto every instance at construction."
          - text: "Keep access on the class. An instance should acquire its own access attribute only when explicitly overridden."
          - text: "The initializer needs holder, serial, and notes assignments; leave access to normal fallback lookup."
    quiz:
      title: "Step 8 — Knowledge Check"
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
        - type: single
          difficulty: basic
          question: "For an ordinary class `Ticket` and `make = Ticket`, what is `make`?"
          options:
            - "A separate class with a copy of Ticket's attributes"
            - "A new Ticket instance waiting to be initialized"
            - "Another name for the same callable class object"
            - "A function that creates a different class on each call"
          correct_index: 2
          option_feedback:
            0: "Assignment does not duplicate a class any more than it duplicates a list."
            1: "An instance is created by calling the class, using parentheses. This assignment just binds a name."
            3: "No wrapper function is defined here; make directly refers to the existing class object."
          explanation: "Class names obey the same binding rules as other names. `make is Ticket` is true, and `make(...)` calls that class."
        - type: single
          difficulty: intermediate
          question: |
            What does this print?
