            print(queues)
            ```
          options:
          - '`[[], []]`'
          - "`[['intro'], ['solo']]`"
          - "`[['intro', 'end'], ['solo', 'end']]`"
          - "`[['intro', 'end'], []]`"
          correct_index: 2
          option_feedback:
            0: Assigning to the loop variable does not assign to an entry in queues.
            1: The loop variable refers to each actual inner list, so append changes those lists.
            3: Rebinding the loop variable leaves both outer-list entries untouched, including the last one.
          explanation: Each append mutates an inner list. Each queue = [] only rebinds the local name queue.

