  - title: "sys.argv & stderr"
    key: argv
    has_args: true
    has_stderr: true
    instructions: |
      ### Why this matters

      Real Python scripts do not run from a hard-coded `print` — they take input from the command line, just like every CLI tool you use daily. `sys.argv` is the equivalent of `argc/argv` in C++, and routing error output to `sys.stderr` lets your scripts compose cleanly with shell pipelines (so users can redirect logs separately from data). Get this right and your scripts behave like proper Unix citizens.

      ### 🎯 You will learn to

      - Apply `sys.argv` to read and validate command-line arguments in a Python script
      - Apply `sys.stderr` (via `print(..., file=sys.stderr)`) to route error and diagnostic output away from stdout

      ## Command-Line Arguments with `sys.argv`

      ```python
      import sys

      # SUB-GOAL: Parse command-line arguments
      # sys.argv is a list: ["script.py", "arg1", "arg2", ...]
      # C++ equivalent:  argv[0], argv[1], ...

      # SUB-GOAL: Validate arguments
      if len(sys.argv) < 2:
          print("Usage: python3 script.py <filename>", file=sys.stderr)
          sys.exit(1)              # Exit with non-zero code — just like in C++

      # SUB-GOAL: Use the argument
      filename = sys.argv[1]
      ```

      `sys.argv[0]` is always the script name itself. Extra arguments start at index 1.
      `sys.exit(1)` terminates the process with exit code 1 — the same convention as C's `exit(1)`.

      ### Writing to `stderr` with `print()`

      By default `print()` writes to **stdout**. Error and diagnostic messages should go to **stderr**,
      matching C++'s `std::cerr` and Bash's `>&2` redirect:

      ```python
      import sys

      # C++: std::cout << "Done." << std::endl;
      print("Done.")                                    # → stdout

      # C++: std::cerr << "Warning: file not found" << std::endl;
      print("Warning: file not found", file=sys.stderr) # → stderr
      ```

      Separating them lets callers redirect each stream independently:

      ```bash
      python3 script.py > output.txt 2> errors.txt
      ```

      ### Predict Before You Code

      Before writing any code, predict: if you run `python3 script.py` with no arguments, what is `sys.argv`? Is it an empty list, or does it contain something? Verify by adding `print(sys.argv)` to a test script.

      ### Task

      Write `safe_word_count.py` **from scratch**. (Note: type `data.txt` into the "args: " input box in the Output panel to add it to the program args to read this file). It should:
      1. If no filename argument is provided (`len(sys.argv) < 2`), print `Error: no filename given` to `sys.stderr` and call `sys.exit(1)`
      2. Read `filename = sys.argv[1]` and print `Reading: <filename>` to `sys.stderr`
      3. Count words and print `Total words: <count>` to stdout

    files:
      - path: "safe_word_count.py"
        content: |
          import sys

          # Write the complete script from scratch.
          # Requirements:
          #   1. Check sys.argv — error to stderr + exit(1) if no filename
          #   2. Print "Reading: <filename>" to stderr
          #   3. Count words, print "Total words: <count>" to stdout
        language: "python"

      - path: "data.txt"
        content: |
          the quick brown fox jumps over the lazy dog
          pack my box with five dozen big liquor jugs
          how vexingly quick daft zebras jump
        language: "plaintext"

    open_file: "safe_word_count.py"

    setup_commands:
      - "import os; os.chdir('/tutorial')"

    solution:
      files:
        - path: "safe_word_count.py"
          content: |
            import sys

            # 1. Check sys.argv — error to stderr + exit(1) if no filename
            if len(sys.argv) < 2:
                print("Error: no filename given", file=sys.stderr)
                sys.exit(1)

            # 2. Print "Reading: <filename>" to stderr
            filename = sys.argv[1]
            print(f"Reading: {filename}", file=sys.stderr)

            # 3. Count words, print "Total words: <count>" to stdout
            total = 0
            with open(filename) as f:
                for line in f:
                    total += len(line.split())

            print(f"Total words: {total}")
          language: "python"
      explanation: |
        **Why this is correct:**

        - **`sys.argv`:** A list where index `0` is the script name and index `1` onwards are the arguments. `len(sys.argv) < 2` means no filename was given. This mirrors C/C++'s `argc < 2` check.
        - **`print(..., file=sys.stderr)`:** The `file=` keyword argument redirects the print to `sys.stderr` instead of `sys.stdout`. This is Python's equivalent of C++'s `std::cerr` and Bash's `echo "error" >&2`. Mixing error messages into stdout would corrupt pipelines.
        - **`sys.exit(1)`:** Terminates the process with exit code 1 — the Unix convention for failure. The test captures this as a `SystemExit` exception.
        - **`print(f"Reading: {filename}", file=sys.stderr)`:** Diagnostic/progress messages go to stderr. The test captures stderr separately and checks for `'Reading: data.txt'`.
        - **`print(f"Total words: {total}")`:** Normal output goes to stdout (the default). The test checks stdout for `'Total words: 24'` when `data.txt` is passed. The word count logic is identical to the Reading Files exercise.

    tests:
      - description: "Reads the supplied filename and keeps totals on stdout and diagnostics on stderr"
        command: |
          import contextlib, io, os, re, runpy, sys, tempfile
          from pathlib import Path
          os.chdir('/tutorial')
          old_argv = sys.argv
          try:
              with tempfile.TemporaryDirectory(dir='/tutorial') as directory:
                  alternate = Path(directory) / 'different words.txt'
                  for filename, contents, expected in [('data.txt', None, 24), (str(alternate), 'one  two\tthree\n\nfour\n', 4), (str(alternate), '', 0)]:
                      if contents is not None:
                          alternate.write_text(contents)
                      sys.argv = ['safe_word_count.py', filename]
                      out, err = io.StringIO(), io.StringIO()
                      with contextlib.redirect_stdout(out), contextlib.redirect_stderr(err):
                          runpy.run_path('/tutorial/safe_word_count.py', run_name='__main__')
                      assert re.fullmatch(r'Total words:\s*' + str(expected) + r'\s*', out.getvalue().strip()), f'Only the correct total belongs on stdout; got {out.getvalue()!r}.'
                      assert err.getvalue().strip() == f'Reading: {filename}', f'Report the supplied filename on stderr; got {err.getvalue()!r}.'
          finally:
              sys.argv = old_argv
        hints:
          - text: "The filename comes from sys.argv[1], so reading data.txt unconditionally cannot handle another file."
          - text: "Count the contents of that filename; empty input has zero words."
          - text: "Print Reading to stderr and the final Total words record to stdout. Do not print a diagnostic to both streams."
      - description: "Missing arguments produce an error only on stderr and exit with code 1"
        command: |
          import contextlib, io, runpy, sys
          old_argv = sys.argv
          out, err = io.StringIO(), io.StringIO()
          exit_code = None
          try:
              sys.argv = ['safe_word_count.py']
              with contextlib.redirect_stdout(out), contextlib.redirect_stderr(err):
                  try:
                      runpy.run_path('/tutorial/safe_word_count.py', run_name='__main__')
                  except SystemExit as error:
                      exit_code = error.code
          finally:
              sys.argv = old_argv
          assert exit_code == 1, 'Exit with code 1 when the filename is missing.'
          assert err.getvalue().strip() == 'Error: no filename given', 'Print the requested error on stderr.'
          assert out.getvalue() == '', 'A missing filename must not produce normal output on stdout.'
        hints:
          - text: "Check the number of arguments before indexing sys.argv."
          - text: "Report the missing filename through stderr, then exit before trying to read a file."
          - text: "Use the no-argument branch to print Error: no filename given and exit with status 1."
