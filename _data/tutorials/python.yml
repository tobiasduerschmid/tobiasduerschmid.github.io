            1: "Truthiness also treats values such as an empty list or empty string as false."
            3: "The string \"None\" is a text value, not the missing-value singleton."
          explanation: "`is None` identifies the singleton directly, regardless of any overloaded equality operation."
        - type: "single"
          question: |
            Recall copying: two separate nested lists compare equal. What can you conclude about whether their inner lists are shared?
          options:
            - "Every equal inner list has the same identity."
