  - title: "Capstone: Build a Log Analyzer"
    key: capstone
    has_args: true
    has_stderr: true
    instructions: |
      ### Why this matters

      You have practiced functions, file I/O, regex, list comprehensions, and command-line arguments. One small tool below — a set — will let you count distinct addresses. Then this capstone asks you to compose these skills into a complete script.

      ### 🎯 You will learn to

      - Create a complete Python script that integrates functions, file I/O, regex, list comprehensions, and command-line arguments
      - Apply your judgment to structure code without step-by-step guidance

      ## Putting It All Together

      ### One New Tool: Sets Keep Distinct Values

      A `set` keeps each distinct hashable value once. Strings are hashable, so repeated IP strings are a good fit:

      ```python
      visitors = ['192.0.2.4', '192.0.2.4', '198.51.100.7']
      unique_visitors = set(visitors)
      print(len(visitors))         # 3 observations
      print(len(unique_visitors))  # 2 distinct addresses
      ```

      A set does not promise a display order; count its elements instead of depending on that order. Predict the two counts after appending `'192.0.2.4'` to `visitors`, then rebuild the set and run the example. Explain why only the observation count grows.

      Now integrate the practiced components and this set operation into a single
      script. You decide how to structure the code.

      ### Task

      Build `log_analyzer.py` — a command-line tool that analyzes a server log. (Note: type `server.log` into the "args: " input box in the Output panel to add it to the program args to read this file).

      **Requirements:**

      1. Accept a filename via `sys.argv[1]`. If missing, print an error to `stderr` and exit with code 1.
      2. Read the file and extract:
         - The total number of log lines (an empty file has zero)
         - All unique dotted IP addresses (use `re.findall()` and a `set`; use the four-digit-group pattern from the regex lesson, without octet-range validation)
         - The number of lines containing ERROR (count each matching line once)
         - The number of lines containing WARNING (count each matching line once)
      3. Print a summary report to **stdout** in this exact format:
         ```
         Log Analysis Report
         ===================
         Total lines:    6
         Unique IPs:     2
         Errors:         2
         Warnings:       1
         ```
      4. Print `Reading: <filename>` to **stderr** at the start.

      **Hints** (only if you're stuck):
      - Use a function for each sub-task (e.g., `count_by_level()`, `extract_ips()`)
      - Use list comprehensions or `re.findall()` to filter lines
      - Use `len(set(...))` to count unique items
      - f-string format specifiers like `{value:>8}` right-align in 8 characters

    files:
      - path: "log_analyzer.py"
        content: |
          # Capstone: Build a complete log analyzer.
          # No scaffolding — use everything you have learned.
          import sys
          import re
        language: "python"

      - path: "server.log"
        content: |
          2024-01-15 09:23:11 INFO  Server started on port 8080
          2024-01-15 09:23:45 ERROR Connection failed: timeout
          2024-01-15 09:24:02 INFO  Request from 192.168.1.42
          2024-01-15 09:24:18 WARNING Slow response: 2345ms
          2024-01-15 09:24:33 ERROR Disk usage at 94%
          2024-01-15 09:24:51 INFO  Request from 10.0.0.7
        language: "plaintext"

    open_file: "log_analyzer.py"

    setup_commands:
      - "import os; os.chdir('/tutorial')"

    solution:
      files:
        - path: "log_analyzer.py"
          content: |
            import sys
            import re

            def count_by_level(text: str, level: str) -> int:
                """Return the number of lines matching the given log level."""
                return len(re.findall(rf'{level}.*', text))

            def extract_ips(text: str) -> set[str]:
                """Return all unique IP addresses found in text."""
                return set(re.findall(r'\d+\.\d+\.\d+\.\d+', text))

            def parse_args() -> str:
                """Validate and return the filename argument."""
                if len(sys.argv) < 2:
                    print("Error: no filename given", file=sys.stderr)
                    sys.exit(1)
                return sys.argv[1]

            def read_log(filename: str) -> str:
                """Read and return the full log file as a string."""
                print(f"Reading: {filename}", file=sys.stderr)
                with open(filename) as f:
                    return f.read()

            def print_report(text: str) -> None:
                """Print the analysis report to stdout."""
                lines = text.splitlines()
                total = len(lines)
                unique_ips = len(extract_ips(text))
                errors = count_by_level(text, 'ERROR')
                warnings = count_by_level(text, 'WARNING')

                print("Log Analysis Report")
                print("===================")
                print(f"Total lines:    {total}")
                print(f"Unique IPs:     {unique_ips}")
                print(f"Errors:         {errors}")
                print(f"Warnings:       {warnings}")

            # Main flow
            filename = parse_args()
            text = read_log(filename)
            print_report(text)
          language: "python"
      explanation: |
        **Why this is correct:**

        - **`parse_args()`:** Validates `sys.argv`, prints an error to `sys.stderr`, and calls `sys.exit(1)` if no argument is given. The check requires status 1 and no normal report on stdout.
        - **`read_log()`:** Prints `"Reading: <filename>"` to `sys.stderr` (the test captures stderr and checks for this). Returns the full file content as a string for regex processing.
        - **`count_by_level(text, 'ERROR')`:** Uses `re.findall(r'ERROR.*', text)` — `.*` consumes the rest of that line, so another ERROR on the same line does not add a match. The sample has 2 ERROR and 1 WARNING line. Checks compare the complete report, including its header.
        - **`extract_ips(text)` with `set(...)`:** `re.findall()` returns all IP matches including duplicates. Wrapping in `set()` removes duplicates. `len(set(...))` is the Pythonic one-liner for counting unique items. The log has 2 unique IPs.
        - **`total = len(text.splitlines())`:** `splitlines()` counts lines without adding an extra empty entry for a final newline. An empty string gives an empty list, and internal blank lines still count as lines. The sample has 6 lines.
        - **Function decomposition:** These helpers give each subtask one responsibility. This is a suggested design, not a grading requirement; another clear structure is also valid.
        - **Type hints on every helper:** Each function carries the annotation pattern from Type Hints (`text: str`, `-> int`, `-> set[str]`, `-> None`). They don't change runtime behavior, but `mypy` would flag a caller that passed the wrong type.

    tests:
      - description: "Uses re.findall and a set for unique IP extraction"
        command: |
          import ast
          tree = ast.parse(open('/tutorial/log_analyzer.py').read())
          modules, functions = set(), {}
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  modules.update(alias.asname or alias.name for alias in node.names if alias.name == 're')
              elif isinstance(node, ast.ImportFrom) and node.module == 're':
                  functions.update({alias.asname or alias.name: alias.name for alias in node.names})
          used = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name):
                      used.add(functions.get(node.func.id))
                  elif isinstance(node.func, ast.Attribute) and isinstance(node.func.value, ast.Name) and node.func.value.id in modules:
                      used.add(node.func.attr)
          assert 'findall' in used, 'Use re.findall to extract IP addresses; importing it under an alias is also valid.'
          set_names = {'set'}
          for node in ast.walk(tree):
              if isinstance(node, ast.ImportFrom) and node.module == 'builtins':
                  set_names.update(alias.asname or alias.name for alias in node.names if alias.name == 'set')
          assert any(isinstance(node, (ast.Set, ast.SetComp)) or (isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id in set_names) for node in ast.walk(tree)), 'Use a set to remove repeated IP addresses.'
        hints:
          - text: "Finding addresses can return repeated strings; a set keeps distinct values."
          - text: "Use the regex extraction operation, then build a set from its matches."
          - text: "Count the set's elements, rather than the length of the original match list."
      - description: "Reports complete counts for the supplied file, including repeated IPs and empty logs"
        command: |
          import contextlib, io, os, runpy, sys, tempfile
          from pathlib import Path
          os.chdir('/tutorial')
          old_argv = sys.argv
          varied = '10:00:00 INFO peer 1.2.3.4\n10:00:01 ERROR retry ERROR 1.2.3.4\n10:00:02 WARNING peers 5.6.7.8 and 1.2.3.4\n10:00:03 WARNING no address\n'
          try:
              with tempfile.TemporaryDirectory(dir='/tutorial') as directory:
                  alternate = Path(directory) / 'different server.log'
                  for filename, contents, counts in [('server.log', None, (6, 2, 2, 1)), (str(alternate), varied, (4, 2, 1, 2)), (str(alternate), 'INFO started\n', (1, 0, 0, 0)), (str(alternate), '\nINFO start\n\n', (3, 0, 0, 0)), (str(alternate), '', (0, 0, 0, 0))]:
                      if contents is not None:
                          alternate.write_text(contents)
                      sys.argv = ['log_analyzer.py', filename]
                      out, err = io.StringIO(), io.StringIO()
                      with contextlib.redirect_stdout(out), contextlib.redirect_stderr(err):
                          runpy.run_path('/tutorial/log_analyzer.py', run_name='__main__')
                      total, unique, errors, warnings = counts
                      expected = ['Log Analysis Report', '===================', f'Total lines:    {total}', f'Unique IPs:     {unique}', f'Errors:         {errors}', f'Warnings:       {warnings}']
                      assert out.getvalue().splitlines() == expected, f'Use the requested complete report and exact counts; got {out.getvalue()!r}.'
                      assert err.getvalue().strip() == f'Reading: {filename}', f'Report the supplied filename on stderr; got {err.getvalue()!r}.'
          finally:
              sys.argv = old_argv
        hints:
          - text: "Read the filename supplied by the caller; do not always open server.log."
          - text: "Count lines, distinct IP strings, and lines containing each level. Repeated addresses must not increase the unique count."
          - text: "Keep the report header and four complete count records on stdout. The Reading diagnostic belongs only on stderr."
      - description: "Missing filenames produce stderr feedback and exit code 1 without a report"
        command: |
          import contextlib, io, runpy, sys
          old_argv = sys.argv
          out, err = io.StringIO(), io.StringIO()
          exit_code = None
          try:
              sys.argv = ['log_analyzer.py']
              with contextlib.redirect_stdout(out), contextlib.redirect_stderr(err):
                  try:
                      runpy.run_path('/tutorial/log_analyzer.py', run_name='__main__')
                  except SystemExit as error:
                      exit_code = error.code
          finally:
              sys.argv = old_argv
          assert exit_code == 1, 'Exit with code 1 when no filename is provided.'
          assert err.getvalue().strip(), 'Explain the missing filename on stderr.'
          assert out.getvalue() == '', 'Do not print a normal report when the filename is missing.'
        hints:
          - text: "Validate sys.argv before attempting to read the filename."
          - text: "A missing argument is an error, so send feedback to stderr."
          - text: "Exit with status 1 after the error, before entering the normal report path."
    quiz:
      title: "Step 19 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            You need to count the number of **unique** IP addresses in a log file.
            You have a list of all IP addresses (with duplicates): `ips = ['10.0.0.1', '10.0.0.2', '10.0.0.1']`.

            Which approach is most Pythonic?
          type: single
          options:
            - "Use a for-loop to check each IP against a list of already-seen IPs"
            - "`len(set(ips))` — convert to a set (which removes duplicates) and count"
            - "`ips.unique()` — lists have a built-in unique method"
            - "`len(ips) - len(duplicates)` — count total minus duplicates"
          correct_index: 1
          explanation: |
            `set(ips)` creates a set with only unique elements: `{'10.0.0.1', '10.0.0.2'}`.
            `len(...)` gives the count. This is the Pythonic one-liner for "count unique items."
            Lists do not have a `.unique()` method (that's pandas, not base Python).

        - question: |
            **Evaluate** this code for a log analyzer. What is the bug?
            ```python
            import sys, re

            filename = sys.argv[1]
            with open(filename) as f:
                text = f.read()

            errors = re.findall(r'ERROR.*', text)
            warnings = re.findall(r'WARNING.*', text)
            ips = re.findall(r'\d+\.\d+\.\d+\.\d+', text)

            print(f"Errors: {len(errors)}")
            print(f"Warnings: {len(warnings)}")
            print(f"Unique IPs: {len(ips)}")
            ```
          type: single
          options:
            - "The regex patterns are wrong — `ERROR.*` only matches the literal characters E-R-R-O-R, not the full line"
            - "Two bugs: no `sys.argv` check (IndexError if no arg), and `len(ips)` counts duplicates"
            - "The file is never properly closed because `with` blocks do not support the `.read()` method on the file handle"
            - "There is no bug — the `with` statement, regex patterns, and f-string formatting are all correct as written"
          correct_index: 1
          explanation: |
            Two bugs: (1) No argument validation — `sys.argv[1]` will raise `IndexError` if the user
            runs the script without arguments. (2) `len(ips)` counts *all* IPs including duplicates;
            `len(set(ips))` would count unique IPs. Good code validates inputs and uses the right
            data structure for the task.

        - question: |
            **Analyze** the design of a log analyzer script. A student puts all logic in one long script with no functions. Another student breaks it into functions: `parse_args()`, `read_log()`, `count_by_level()`, `extract_ips()`, `print_report()`.

            Which approach is better, and why?
          type: single
          options:
            - "The single-script approach is better — functions add unnecessary complexity for a short script"
            - "Both are equivalent — it's purely a matter of style"
            - "The function-based approach is better — each function is testable, reusable, and clearly named"
            - "The function-based approach is worse — Python functions are slower than inline code"
          correct_index: 2
          explanation: |
            Breaking code into functions improves **readability** (the main flow reads like an outline),
            **testability** (each function can be tested independently), and **reusability** (functions
            can be imported by other scripts). This is the same principle as C++'s function decomposition,
            and it becomes even more important as scripts grow. Even for short scripts, named functions
            act as documentation.

        - question: |
            *(Spaced review — Loops)*

            You need to process a list of log lines and print each line's number alongside it (starting from 1). Which approach is most Pythonic?
          type: single
          options:
            - "`for i in range(len(lines)): print(f'{i+1}: {lines[i]}')` — use range to generate index numbers"
            - "`for n, line in enumerate(lines, 1): print(f'{n}: {line}')` — yields (index, value) pairs"
            - "`i = 0; for line in lines: i += 1; print(f'{i}: {line}')` — manually track the counter like in C++"
            - "`for line in lines: print(f'{lines.index(line)+1}: {line}')` — use index() to find the position"
          correct_index: 1
          option_feedback:
            0: "This works but is unpythonic — `range(len(...))` then indexing is the C/Java pattern. `enumerate()` is the idiomatic Python way to get both index and value."
            2: "Manually tracking a counter variable is C-style — verbose and error-prone. `enumerate()` handles this automatically."
            3: "`.index()` scans the entire list each iteration — O(n²) overall — and returns the first match, so it breaks silently on duplicate lines. Use `enumerate()` instead."
          explanation: |
            `enumerate(lines, 1)` is the Pythonic way: it yields `(index, value)` pairs without
            manual indexing. The `start=1` parameter avoids the `+1` hack.

        - question: |
            *(Spaced review — Regular Expressions)*

            A log analyzer needs to extract all timestamps matching the pattern `2024-01-15 14:30:22` from a log string. Which `re` call is correct?
          type: single
          options:
            - "`re.search(r'\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}', log)` — search finds the first match only"
            - "`re.findall(r'\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}', log)` — findall returns a list of all matching strings"
            - "`re.match(r'\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}', log)` — match scans the entire string for all occurrences"
            - "`re.split(r'\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}', log)` — split extracts everything that matches the pattern"
          correct_index: 1
          explanation: |
            `re.findall()` returns a list of ALL non-overlapping matches — exactly what you need
            to extract every timestamp. `re.search()` finds only the first match. `re.match()` only
            checks the start of the string. `re.split()` splits the string AT the pattern,
            returning the parts between matches, not the matches themselves.

        # Pedagogy: delayed retrieval of the object model in a new context.
        - type: single
          difficulty: advanced
          question: |
            A report groups messages in an instance attribute:
            ```python
            class Report:
                def __init__(self):
                    self.messages = []

            import copy
            live = Report()
            live.messages.append("ready")
            saved = copy.copy(live)
            live.messages.append("finished")
            ```
            The saved report must keep an independent snapshot of these strings.
            Which single change achieves that?
          options:
          - Replace the copy with `saved = live`.
          - Replace the copy with `saved = copy.deepcopy(live)`.
          - Move `messages = []` into the class body.
          - Add a type hint to `self.messages`.
          correct_index: 1
          option_feedback:
            0: Assignment would share the Report itself, as well as its member list.
            2: A class attribute would share one messages list across instances and would not make a snapshot.
            3: Type hints document a value’s expected type; they do not copy the object.
          explanation: For this ordinary object containing a list of strings, deepcopy makes an independent report and member list. A shallow report copy still refers to the live report’s list.

  # --------------------------------------------------------------------------
  # STEP 20 — Data Classes: Structs with Auto-Generated Plumbing
  # Pedagogy:
  #   Generation Effect  — see hand-written boilerplate first; feel the pain.
  #   Worked Example     — fade across @dataclass → frozen=True → @property.
  #   Variation Theory   — fields held constant; only the decorator level varies.
  #   Negative Transfer  — @property is NOT a private modifier (Java/C# habit).
  #   Desirable Difficulty — predict-before-run on FrozenInstanceError.
  #   Spaced Review      — quiz revisits List Comprehensions list comprehensions in OO context.
  #   Type Hints         — uses Type Hints annotation pattern on fields and properties.
  #   Bloom's level      — Apply (write dataclass) / Evaluate (when to use frozen).
  # --------------------------------------------------------------------------
  - title: "Data Classes"
    key: dataclasses
    instructions: |
      ### Why this matters

      You have already written initializers and value comparisons for ordinary classes. `@dataclass` generates these common methods for data holders. Its instances still follow the same reference rules: `frozen=True` prevents ordinary field assignment, but does not freeze objects stored in those fields.

      ### 🎯 You will learn to

      - Create value-object classes using `@dataclass` to eliminate `__init__` / `__eq__` / `__repr__` boilerplate
      - Analyze the difference between frozen fields and immutable member objects
      - Create computed attributes with `@property`
      - Evaluate when each tool is the right choice

      ## A Bridge from C++ Structs

      In C++ you might describe a 2D point with a `struct` and define its comparison behavior explicitly:

      ```cpp
      struct Point {
          const int x;          // immutable field
          const int y;
          bool operator==(const Point& o) const { return x == o.x && y == o.y; }
      };
      ```

      Plain Python classes work for this, but you have to write all the boilerplate yourself — `__init__`, `__eq__`, `__repr__`. The starter file shows that pain on purpose. Then `@dataclass` writes those three methods for you.

      ```python
      from dataclasses import dataclass

      @dataclass
      class Point:
          x: int
          y: int
      ```

      That tiny declaration is roughly equivalent to a 10-line hand-written class. It uses the type hints from Type Hints (`x: int`) — that's how `@dataclass` knows what fields exist and what their types are.

      ### `frozen=True`: Immutability as a Design Tool

      Add `frozen=True` and ordinary field assignment is blocked. With immutable integer fields, this gives our point stable contents. Trying to assign raises `FrozenInstanceError`:

      ```python
      @dataclass(frozen=True)
      class Point:
          x: int
          y: int

      p = Point(3, 4)
      p.x = 99       # ❌ FrozenInstanceError — Point is immutable
      ```

      The default `eq=True` generates value equality whether or not the class is
      frozen. With `eq=True` and `frozen=True`, dataclasses also generate a hash
      method; using it requires every participating field to be hashable.
      Integer fields qualify, so these points can be set members or dictionary keys.

      **Member-object review:** a frozen field can still refer to a mutable list.

      ```python
      @dataclass(frozen=True)
      class SetList:
          songs: list[str]

      songs = ["Intro"]
      show = SetList(songs)
      songs.append("Finale")       # show.songs now contains both titles
      show.songs.append("Encore")  # mutates the same list; allowed
      ```

      Assigning a different list to `show.songs` would be blocked. Mutating the
      referenced list is allowed, and hashing this `SetList` fails because a
      list is unhashable. Freezing the outer object is not a deep freeze.

      ### Value Equality and Identity

      All Python instances have identity and are accessed through references.
      A **value object** is a design choice: two values with equal fields can
      stand for the same domain value, while still being distinct objects.
      A coordinate is a good example. A connection or a live audio channel
      usually needs identity because two separate resources are not interchangeable.

      `@dataclass` uses field equality by default. Use `eq=False` when a
      dataclass should retain its inherited comparison behavior (identity for
      a direct subclass of `object`). `frozen=True` controls field assignment;
      it does not choose between equality and identity. `is` always checks
      identity, just as it did in the earlier ordinary-class lesson.

      ### `@property`: a Method That Looks Like an Attribute

      What about derived values, like the distance from the origin? You could write a method `distance_to_origin()`. But callers would have to remember the parens. `@property` lets you define a method that is **read as an attribute** — no parens at the call site:

      ```python
      @dataclass(frozen=True)
      class Point:
          x: int
          y: int

          @property
          def distance_to_origin(self) -> float:
              return (self.x ** 2 + self.y ** 2) ** 0.5

      p = Point(3, 4)
      print(p.distance_to_origin)   # 5.0  — no parens!
      ```

      `@property` does **not** make a field private (a common Java/C# habit to drop). It just lets a computation *look* like an attribute on the outside.

      *(C++ analogy note: `@property` has no exact C++ counterpart. The closest is a const getter member function — but C++ would still require parens at the call site. `@property` erases the parens.)*

      ### Predict Before You Run

      Once you have made `Point` frozen, what do you predict happens when this runs?

      ```python
      p = Point(3, 4)
      p.x = 99
      ```

      Predict the exception type, then try it. Comment the deliberate failing assignment back out before Test My Work. After running, compare: `FrozenInstanceError` is a subclass of `AttributeError`; its more specific name identifies the frozen-dataclass restriction.

      ### Task

      Complete `geometry.py`. The starter shows `PointManual` — the hand-written boilerplate version — so you can feel the contrast.

