  # --------------------------------------------------------------------------
  # STEP 9 — Aliases, Shallow Copies, and Deep Copies
  # Pedagogy: PRIMM with worked examples, faded practice, and interleaved retrieval.
  - title: "Aliases, Shallow Copies, and Deep Copies"
    key: copies
    instructions: |
      ### Why this matters

      A rehearsal plan should not accidentally change the live show. Deciding what to copy means deciding which objects should stay shared, including objects reached through attributes or list slots.

      ### 🎯 You will learn to

      - Analyze which changes cross an alias, a shallow copy, or a deep copy.
      - Apply the same copying rules to nested lists and objects with member objects.
      - Explain why a deep copy can preserve sharing inside its own object graph.

      ### Predict Before You Run

      Open `copy_studio.py`. The first example starts with **two references to one inner list**, then makes an alias, a shallow copy, and a deep copy. Before running, choose a prediction: appending `"Orbit"` through `shallow[0]` changes (a) only `shallow`, (b) `lineup`, `alias`, and `shallow`, or (c) all four outer lists, including `deep`.

      Run the file. Explain why **both slots** in the original show the added track. Here, `is` asks whether two expressions refer to the very same object; the next step explores that operator in more detail.

      <details markdown="1">
      <summary>Explain the shared inner list</summary>

      The alias is the original outer list. The shallow copy has a new outer list, but its slots refer to the original inner list. Both slots in each list still reach that one inner list, so both display `["Pulse", "Orbit"]`. The deep copy has its own inner list and still displays `[["Pulse"], ["Pulse"]]`.

      **After appending through `shallow[0]`:** compare the outer lists before following their slots. Each arrow labeled "slots 0 and 1" abbreviates two references with the same destination. String values are abbreviated inside the inner list.

      ```mermaid
      %% caption: A shallow copy separates the outer list while keeping its member references shared.
      flowchart TB
        accTitle: Alias and shallow copy share one mutable inner list
        accDescr: Names lineup and alias both refer to the original outer list. Name shallow refers to a different outer list. Slots 0 and 1 in each outer list all refer to one inner list containing Pulse and Orbit.
        lineup["name:<br/>lineup"] --> original("original list object")
        alias["name:<br/>alias"] --> original
        shallow["name:<br/>shallow"] --> copied("new list object")
        original -->|slots 0 and 1| shared("inner list object<br/>Pulse, Orbit")
        copied -->|slots 0 and 1| shared
      ```

      ```mermaid
      %% caption: Deep copying separates mutable state while preserving repeated references inside the copy.
      flowchart TB
        accTitle: The deep copy preserves internal sharing
        accDescr: Name deep refers to a third outer list. Both its index 0 and index 1 refer to one new inner list containing only Pulse. Neither list is one of the mutable objects in the preceding alias and shallow-copy diagram.
        deep["name:<br/>deep"] --> outer("new outer list object")
        outer -->|index 0| inner("new inner list object<br/>Pulse")
        outer -->|index 1| inner
      ```

      </details>

      ### The Copying Boundary

      `import copy` makes Python's copying module available.

      | Operation | Outer object | Referenced member objects |
      |---|---|---|
      | `alias = original` | The same object | The same objects |
      | `copy.copy(original)` | A new ordinary object or list | Existing references are reused |
      | `copy.deepcopy(original)` | A new ordinary object or list | Supported nested state is copied recursively |

      Inspect the second worked example. `Show` has a `Mixer` member object. `rehearsal.mixer.level = 7` reaches the mixer that `live` also uses. In contrast, `rehearsal.title = "Soundcheck"` changes an attribute **on the copied Show**. It does not change `live.title`. Predict the live and archived mixer levels, then compare with Run.

      Deep copying remembers the objects it has already copied. Because `live.mixer` and `live.backup` refer to one mixer, `archive.mixer` and `archive.backup` refer to **one new mixer**, too. It preserves that relationship inside the copy. Immutable leaves such as strings may be reused safely; a deep copy does not promise a distinct identity for every reachable value. Some special objects customize copying or cannot be copied.

      ### Modify, Then Make

      First, change only `rehearsal.mixer.level = 7` to `rehearsal.mixer = Mixer(7)`. Predict whether the live mix still changes. Run, explain the difference between replacing a member reference and mutating its referent, then restore the line.

      Complete `versions(original)`. It must return a three-element list containing, in order:

      1. The original object itself.
      2. A distinct shallow copy that shares the original's referenced members.
      3. A deep copy whose mutable member state is independent of the original, while preserving repeated references within the copied graph.

      The same function must work for the supplied `Show` objects and for nested lists, including an empty list. It must not change its input. The first binding is provided; choose the remaining boundaries yourself. Use **Test My Work** to check your choices, then explain which later edits each version would expose to the caller.
    files:
      - path: "copy_studio.py"
        language: "python"
        content: |
          import copy

          # Worked example: two slots refer to one inner list.
          opening = ["Pulse"]
          lineup = [opening, opening]
          alias = lineup
          shallow = copy.copy(lineup)
          deep = copy.deepcopy(lineup)
          shallow[0].append("Orbit")
          print("Original:", lineup)
          print("Alias:", alias)
          print("Deep:", deep)
          print("Deep keeps shared inner list:", deep[0] is deep[1])


          class Mixer:
              def __init__(self, level):
                  self.level = level


          class Show:
              def __init__(self, title, mixer):
                  self.title = title
                  self.mixer = mixer
                  self.backup = mixer


          # Worked example: an ordinary object has another object as a member.
          live = Show("Night Stage", Mixer(4))
          live_alias = live
          rehearsal = copy.copy(live)
          archive = copy.deepcopy(live)
          rehearsal.mixer.level = 7
          rehearsal.title = "Soundcheck"
          print("Live:", live.title, live.mixer.level)
          print("Alias level:", live_alias.mixer.level)
          print("Archive:", archive.title, archive.mixer.level)
          def versions(original):
              """Return [the original, a shallow copy, a deep copy]."""
              shared = original
              # TODO: choose the two different copying boundaries.
              return [shared, original, original]
    open_file: "copy_studio.py"
    run_file: "copy_studio.py"
    solution:
      files:
