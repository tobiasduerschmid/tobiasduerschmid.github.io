  # STEP 10 — Identity and Value Equality
  # Pedagogy: PRIMM with worked examples, faded practice, and interleaved retrieval.
  - title: "Identity and Value Equality"
    key: equality
    instructions: |
      ### Why this matters

      A music catalog may load the same recording into two separate objects. Deduplicating by title and artist asks a different question from checking whether two names reach the exact same object.

      ### 🎯 You will learn to

      - Distinguish object identity from a class's definition of equal values.
      - Implement `__eq__` with an explicit policy for unsupported operands.
      - Choose identity checks for shared objects and the `None` singleton.

      ### Predict Before You Run

      In `recording_equality.py`, two `GuestPass` objects both say `"Balcony"`. Predict the two Booleans on the **Separate passes** line: `True True`, `True False`, or `False False`. Then predict the **Alias** line and run the file.

      <details>
      <summary>Explain the default comparison</summary>

      The separate objects print `False False`. This ordinary class inherits the default equality behavior from `object`; matching attributes do not automatically define value equality. The alias line prints `True True` because both names reach one instance.

      </details>

      ### A Comparison Contract

      `left is right` always checks **identity**. A class cannot overload `is`. `left == right` uses the objects' equality behavior, which classes can define with the special method `__eq__`. Lists and strings already have useful value comparisons; ordinary classes need a policy when the default does not fit.

      Here is a separate worked example of that policy:

      ```python
      class Seat:
          def __init__(self, code):
              self.code = code

          def __eq__(self, other):
              if not isinstance(other, Seat):
                  return NotImplemented
              return self.code == other.code
      ```

      `isinstance(other, Seat)` checks whether the other object is a Seat instance. The type check prevents attribute access on an incompatible object. `NotImplemented` is a special return value telling Python that this method does not handle that operand type; Python can try the other operand's comparison. If neither handles equality, it falls back to identity. Do not confuse this return value with raising an exception.

      `None` is a singleton object used to represent a missing value. Check `value is None` or `value is not None`, because the question is whether this is that singleton, independent of any custom equality method. Use `==` for string or numeric values; implementation choices about reusing immutable objects must not determine your program's answer.

      ### Modify, Then Make

      First, give `GuestPass` the same comparison policy as `Seat`, using its `label`. Predict which printed Boolean changes and which stays the same, then run it. This experiment is not graded.

      Complete `Recording.__eq__` in the provided class:

      - Two Recordings are equal exactly when **both** their `title` and `artist` values match.
      - Comparing the same object still gives equality.
      - For a non-Recording operand, the method returns `NotImplemented` instead of reading attributes that may not exist.
      - Comparing objects must not change either recording.

      The Boolean operator `and` requires both conditions to hold. Try equal titles with different artists, then different titles with the same artist. Finally, make an alias and explain why `is` still distinguishes that alias from a separately constructed equal Recording.
