      questions:

        - question: |
            Which of the following iterates over a list and gives both the index and the item?
          type: single
          options:
            - "`for i, x in index(nums):`"
            - "`for i, x in enumerate(nums):`"
            - "`for i in nums.keys():`"
            - "`for i in range(nums):`"
          correct_index: 1
          explanation: |
            `enumerate(iterable)` yields `(index, value)` pairs. Unpacking them into `i, x` gives you both
            at once. This is the Pythonic replacement for C++'s index-based `for (int i = 0; i < nums.size(); i++)`.

        - question: |
            What does `list(range(2, 8, 2))` evaluate to?
          type: single
          options:
            - "`[2, 4, 6, 8]`"
            - "`[2, 4, 6]`"
            - "`[2, 3, 4, 5, 6, 7]`"
            - "`[2, 8]`"
          correct_index: 1
          explanation: |
            `range(start, stop, step)` generates numbers from `start` up to but not including `stop`,
            counting by `step`. So `range(2, 8, 2)` → 2, 4, 6 (8 is excluded because stop is exclusive).
            This matches C++'s `for (int i = 2; i < 8; i += 2)`.

        - question: |
            A C++ programmer expects `6 / 2` to return the integer `3` in Python. What actually happens?
          type: single
          options:
            - "It returns the integer `3` — Python division works just like C++"
            - "It returns `3.0` — Python's `/` always gives a float; use `//` for integer division"
            - "It raises a TypeError because both operands are integers"
            - "It returns the fraction object `fractions.Fraction(6, 2)` — Python automatically converts integer division to a rational number"
          correct_index: 1
          option_feedback:
            0: "Python 3 deliberately split the operator: `/` is *always* float division, `//` is *always* floor division — regardless of whether the operands are int or float. C/C++/Java pick the operator's behavior based on the operand types, but PEP 238 broke that link in Python 3 precisely because too many learners were surprised by integer truncation."
            2: "Python is happy to mix `int` and `float`; the result is just promoted to `float`. The TypeError pattern shows up for non-numeric mixing (`\"5\" + 3`), not for arithmetic between two numbers."
          explanation: |
            In Python 3, `/` is **always** float division: `6 / 2` → `3.0`.
            `//` floors: `7 // 2` → `3`, but `-7 // 2` → `-4`.
            C++ integer division truncates toward zero, giving `-3` for the latter quotient.

        - question: |
            What are the values of `a` and `b` after this line?
            ```python
