          explanation: "`==` uses the Recording value policy; `is` still checks object identity."
        - type: "single"
          question: |
            Why should this `__eq__` method return `NotImplemented` for a non-Recording operand?
          options:
            - "It asks Python to try comparison fallback."
            - "It makes the two operands compare equal."
