            print("List rebinding:", tracks)
            append_shared(tracks)
            print("List append:", tracks)
            replace_first(tracks)
            print("Item replacement:", tracks)
            show = Playlist(["Pulse"])
            replace_playlist(show)
            print("Object rebinding:", show.tracks)
            edit_member(show)
            print("Member mutation:", show.tracks)
            def preview_track(playlist, title):
                """Return an independent Playlist with title added; keep playlist unchanged."""
                return Playlist(playlist.tracks + [title])


            def register_guest(name, guests=None):
                """Append to a supplied guest list, or start a fresh one when omitted."""
                if guests is None:
                    guests = []
                guests.append(name)
                return guests


            print("First guest call:", register_guest("Ari"))
            print("Second guest call:", register_guest("Sol"))
      explanation: |
        List concatenation in `preview_track` creates a new outer list; constructing a Playlist around it also creates a new outer object. Sharing immutable track strings is safe. Returning that result gives the caller control over its own binding.

        `register_guest` replaces only the missing-value sentinel. Every missing argument gets a fresh list, while a supplied empty or populated list retains its identity and receives the appended name. The identity test keeps “missing” distinct from “empty.”
