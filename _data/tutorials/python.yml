  # STEP 16 — Reading Files with open() and with
  # Pedagogy:
  #   Transfer Tutor     — C++ file I/O → Python `open()` + `with`.
  #   Lay of the Land    — Python's "batteries included" stdlib.
  #   Sub-Goal Labels    — worked example annotated with sub-goals.
  #   Fading: Less       — skeleton provided, fewer inline hints.
  #   Spaced Review      — quiz includes indentation (The Indentation Trap) and loop (Loops).
  #   Bloom's level      — Understand / Evaluate (quiz) + spaced review.
  # --------------------------------------------------------------------------
  - title: "Reading Files with open() and with"
    key: files
    instructions: |
      ### Why this matters

      Reading files is something every program eventually has to do, and resource leaks (forgotten `fclose()`) are a classic C/C++ bug. Python's `with` statement is the language's elegant answer: a context manager that guarantees cleanup, even on exceptions. The same pattern (RAII in C++ terms) extends to network sockets, locks, and database connections — learning it here pays off everywhere.

      ### 🎯 You will learn to

      - Apply `with open()` to read files line-by-line in idiomatic Python
      - Analyze how Python's context manager pattern relates to C++'s RAII

      ## Python's "Batteries Included" Philosophy

      One of Python's greatest strengths is its **standard library** — hundreds of modules
      ready to use with no installation:

      | Module | What it does | C++ / Bash equivalent |
      |---|---|---|
      | `os`, `pathlib` | File paths, directory traversal | `<filesystem>` / `ls`, `find` |
      | `sys` | Command-line args, exit codes | `argc/argv` / `$@` |
      | `json` | Parse/write JSON | Requires a library |
      | `re` | Regular expressions | `<regex>` / `grep` |
      | `csv` | Read/write CSV | Manual parsing |
      | `subprocess` | Run shell commands | `system()` / direct Bash |

      ### Reading Files with `open()` and `with`

      C-style file handling pairs `fopen` with `fclose`; modern C++ typically uses an
      `std::ifstream` whose destructor closes the file at scope exit. Python's `with`
      provides an explicit block for automatic cleanup, including when an exception occurs:

      ```python
      # SUB-GOAL: Open the file (with ensures automatic close)
      with open("data.txt") as f:
          # SUB-GOAL: Process each line
          for line in f:
              # SUB-GOAL: Clean and display
              print(line.strip())   # removes leading and trailing whitespace
      ```

      The `with` statement is Python's **resource management** idiom — just like RAII in C++,
      the file is guaranteed to be closed when the block exits.

      ### Predict Before You Code

      Before writing any code, look at `data.txt` and predict: how many total words does it contain? Record your count, implement the task, then click Run to compare. The unfinished starter does not yet print a count.

      ### Task

      Complete `word_count.py`. It should:
      1. Read every line from `data.txt`
      2. Split each line into words (`.split()` splits on whitespace)
      3. Count the **total number of words** across all lines
      4. Print: `Total words: <count>`

      The file `data.txt` is already created for you.

    files:
      - path: "word_count.py"
        content: |
          # SUB-GOAL: Initialize the counter
          total = 0

          # SUB-GOAL: Open and read the file
          with open("data.txt") as f:
              for line in f:
                  words = line.split()
                  # SUB-GOAL: Accumulate the count
                  # TODO: add len(words) to total
                  pass

          # SUB-GOAL: Report the result
          # TODO: print "Total words: <count>"
          pass
        language: "python"

      - path: "data.txt"
        content: |
          the quick brown fox jumps over the lazy dog
          pack my box with five dozen big liquor jugs
          how vexingly quick daft zebras jump
        language: "plaintext"

    open_file: "word_count.py"

    setup_commands:
      - "import os; os.chdir('/tutorial')"

    solution:
      files:
        - path: "word_count.py"
          content: |
            # SUB-GOAL: Initialize the counter
            total = 0

            # SUB-GOAL: Open and read the file
            with open("data.txt") as f:
                for line in f:
                    words = line.split()
                    # SUB-GOAL: Accumulate the count
                    total += len(words)

            # SUB-GOAL: Report the result
            print(f"Total words: {total}")
          language: "python"
      explanation: |
        **Why this is correct:**

        - **`with open("data.txt") as f:`** The file context manager closes the file when the block exits, even on an exception. This resembles C++ RAII. Without `with` or equivalent cleanup, closure is no longer tied reliably to this block's exit; relying on eventual garbage collection is poor resource management.
        - **`for line in f:`** Files are directly iterable. A line includes its trailing newline when present. Iteration avoids retaining the entire file; working memory depends on buffering, the longest line, and any results your program retains.
        - **`line.split()`** without arguments splits on any whitespace and discards empty strings, so `len(words)` correctly counts the words per line.
        - **`total += len(words)`:** Accumulates the count across all lines. The three lines in `data.txt` have 9 + 9 + 6 = 24 words. The checks compare the complete total record, including on empty and mixed-whitespace files.
        - **No `line.strip()` needed here:** `split()` without arguments already handles the trailing `\n` by splitting on all whitespace.

    tests:
      - description: "Counts every word and prints one complete total for ordinary, empty, and mixed-whitespace files"
        command: |
          import os, re
          from pathlib import Path
          os.chdir('/tutorial')
          data = Path('/tutorial/data.txt')
          original = data.read_text()
          try:
              for contents, expected in [(original, 24), ('', 0), ('one  two\tthree\n\n four\n', 4), ('last line has five words', 5)]:
                  data.write_text(contents)
                  output = __run_capture('/tutorial/word_count.py')
                  assert re.fullmatch(r'Total words:\s*' + str(expected) + r'\s*', output.strip()), f'Expected one Total words: {expected} record, got {output!r}.'
          finally:
              data.write_text(original)
        hints:
          - text: "Count words across every line, rather than counting lines or replacing the total each time."
          - text: "split() without arguments handles repeated spaces, tabs, and newlines; an empty file has zero words."
          - text: "Initialize total before reading, add len(line.split()) for each line, and print the final count after reading."
    quiz:
      title: "Step 16 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            A student writes this code and asks which Python features make it concise:
            ```python
            with open("log.txt") as f:
                errors = [line for line in f if "ERROR" in line]
            ```
