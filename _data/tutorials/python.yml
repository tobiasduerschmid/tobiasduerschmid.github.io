  # STEP 5 — Functions
  # Pedagogy:
  #   Transfer Tutor     — C++ function signatures → Python `def`.
  #   Guide-and-Release  — partially-written function to complete.
  #   Component Skills   — functions isolated from loops (split from old Functions).
  #   Fading: Medium     — function signatures given, body needs implementing.
  #   Bloom's level      — Remember / Apply / Analyze (quiz).
  # --------------------------------------------------------------------------
  - title: "Functions"
    key: functions
    instructions: |
      ### Why this matters

      Functions are how you compose larger programs. Python's `def` syntax is briefer than C++'s — no return type, no parameter types required — but the trade-off is that mistakes surface at runtime instead of compile time. Default parameters let you write APIs that are short to call in the common case and explicit when callers need control.

      ### 🎯 You will learn to

      - Apply `def` syntax to implement Python functions with optional type hints
      - Create functions with default parameter values and use them with positional or keyword arguments
      - Contrast Python's `def` signature with C++ function signatures

      ## Functions: `def` vs C++ Signatures

      In C++ you must specify return types and parameter types:
      ```cpp
      int add(int a, int b) { return a + b; }
      ```

      In Python you just use `def`. Types are optional (you can add them as **type hints**, but they are not enforced):
      ```python
      # SUB-GOAL: Define the function with its parameters
      def add(a, b):
          # SUB-GOAL: Compute and return the result
          return a + b          # No type declarations required

      # With optional type hints (documents intent, not enforced at runtime):
      def add(a: int, b: int) -> int:
          return a + b
      ```

      ### Default Parameters

      A parameter can have a **default value**, used when the caller omits that argument.
      For the ordinary positional parameters used here, parameters with defaults come *after* required ones — the same rule as in C++.

      ```python
      def greet(name, greeting="Hello"):
          print(f"{greeting}, {name}!")

      greet("Alice")             # → Hello, Alice!   (uses default)
      greet("Bob", "Welcome")    # → Welcome, Bob!   (overrides default)
      greet("Bob", greeting="Welcome")  # same call using a keyword argument
      ```

      A keyword argument names the parameter receiving the value. After implementing your functions, try `label_score(75, threshold=80)` and compare it with the positional call `label_score(75, 80)`.

      ### Division Before Averaging

      For integers and floats, `/` performs true division: `5 / 2` is `2.5`. `//` performs floor division: `5 // 2` is `2`, and `-5 // 2` is `-3`. C++ integer division truncates toward zero instead. A mean may contain a fraction even when all input numbers are integers, so choose the operator that preserves it.

      ### Predict Before You Code

      Before writing any code, predict the mean of `[4, 7]`. Would floor division give the same answer? Write down both results, then check them after implementing.

      ### Keep Script Examples Separate from Imports

      Python executes a module's top-level statements when it first imports that module. A guard lets you keep a demonstration in the file without running it during import:

      ```python
      # A reusable helper and its demonstration, in greetings.py
      def welcome(name):
          return f"Welcome, {name}!"

      if __name__ == '__main__':
          print(welcome("Sam"))
      ```

      Running `python3 greetings.py` sets `__name__` to `'__main__'` and prints the greeting. In another file, `import greetings` defines the helper but skips the guarded print; the caller can use `greetings.welcome("Sam")`. No function named `main` runs automatically.

      ### Task

      Complete two functions in `functions.py`:

      1. `mean(numbers)` — returns the arithmetic mean of a nonempty list of numbers.
         *Hint: `sum()` and `len()` are **built-in** Python functions — no `import` is needed. See the [built-in functions reference](https://docs.python.org/3/library/functions.html) for other functions available directly.*
      2. `label_score(score, threshold=50)` — returns `"pass"` if `score >= threshold`, otherwise `"fail"`.

      > **What does `pass` mean?** In Python, `pass` is a do-nothing placeholder that makes an otherwise empty function or block body syntactically valid — the same idea as leaving a C++ function body as `{ }`. The starter code uses `pass` to mark every spot you need to fill in. **Replace every `pass` with your real implementation — no `pass` statements should remain in your final solution.**

    files:
      - path: "functions.py"
        content: |
          def mean(numbers):
              """Return the arithmetic mean of a list of numbers."""
              # TODO: implement using sum() and len()
              pass

          def label_score(score, threshold=50):
              """Return 'pass' if score >= threshold, else 'fail'."""
              # TODO: implement using an if/else
              pass

          # --- Quick self-test ---
          data = [4, 8, 15, 16, 23, 42]
          print(f"Data: {data}")
          print(f"Mean: {mean(data)}")
          print(f"Score 75: {label_score(75)}")
          print(f"Score 30: {label_score(30)}")
          print(f"Score 75 (threshold=80): {label_score(75, 80)}")
        language: "python"

    open_file: "functions.py"

    solution:
      files:
        - path: "functions.py"
          content: |
            def mean(numbers):
                """Return the arithmetic mean of a list of numbers."""
                return sum(numbers) / len(numbers)

            def label_score(score, threshold=50):
                """Return 'pass' if score >= threshold, else 'fail'."""
                if score >= threshold:
                    return 'pass'
                else:
                    return 'fail'

            # --- Quick self-test ---
            data = [4, 8, 15, 16, 23, 42]
            print(f"Data: {data}")
            print(f"Mean: {mean(data)}")
            print(f"Score 75: {label_score(75)}")
            print(f"Score 30: {label_score(30)}")
            print(f"Score 75 (threshold=80): {label_score(75, 80)}")
          language: "python"
      explanation: |
        **Why this is correct:**

        - **`mean`:** `sum(numbers)` and `len(numbers)` are Python built-ins. In Python 3, `/` always performs **float division** (`sum / len` returns a `float`), so `mean([4, 8, 15, 16, 23, 42])` returns `18.0`, not `18`. The test checks `== 18.0`. This is different from C++ where `int / int` would be integer division.
        - **`label_score` with default parameter:** `threshold=50` is a default parameter — calling `label_score(75)` uses `50` as the threshold (returns `'pass'`), while `label_score(75, 80)` or `label_score(75, threshold=80)` overrides it with `80` (returns `'fail'`). Among ordinary positional parameters, those with defaults must follow those without defaults.
        - **`return` is explicit:** A Python function that reaches its end without returning a value returns `None`. In C++, reaching the end of an ordinary non-void, non-`main` function without a return has undefined behavior. Here you need an explicit return for each result.
        - **`def` vs C++:** Python's `def` requires no return type or parameter types — Python infers types dynamically at runtime.

    tests:
      - description: "No unfinished 'pass' placeholders remain"
        command: |
          import ast
          src = open('/tutorial/functions.py').read()
          tree = ast.parse(src)
          pass_nodes = [n for n in ast.walk(tree) if isinstance(n, ast.Pass)]
          assert len(pass_nodes) == 0, \
              f"Remove all 'pass' placeholders — {len(pass_nodes)} pass statement(s) still found in functions.py"
        hints:
          - text: "The `pass` keyword is a placeholder that does nothing. Replace it with the actual logic the function needs."
      - description: "mean([4, 8, 15, 16, 23, 42]) == 18.0"
        command: |
          g = {}
