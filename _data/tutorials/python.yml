          recording = ns['Recording']("Signal", "Mira")
          assert recording.__eq__(None) is NotImplemented, "Decline a missing operand with NotImplemented."
          assert recording.__eq__("Signal") is NotImplemented, "A matching title string is not a Recording."
          assert recording.__eq__(42) is NotImplemented, "Check the operand type before accessing its attributes."
          class CatalogLabel:
              title = "Signal"
              artist = "Mira"
          assert recording.__eq__(CatalogLabel()) is NotImplemented, "Matching attributes do not turn an unrelated object into a Recording."
          assert not (recording == None) and not (recording == "Signal"), "Normal equality should fall back safely for these unsupported operands."
        hints:
          - text: "The other operand may have no title or artist attribute. Decide whether your method supports it before reading either."
          - text: "Use a type guard and Python’s special comparison return value to decline an unsupported operand."
          - text: "Before the field comparisons, add `if <other is not a Recording>:` followed by the decline return value."
      - description: "Equality follows current values, including empty field values"
        command: |
          import runpy
          ns = runpy.run_path('/tutorial/recording_equality.py')
          Recording = ns['Recording']
          first = Recording("", "")
          second = Recording("", "")
          assert first == second, "Empty strings are valid equal field values."
          second.artist = "Unknown"
          assert not (first == second), "Changing one required field must change the comparison result."
          first.artist = "Unknown"
          assert first == second and first is not second, "Restored matching values give equality without changing identity."
        hints:
          - text: "Equality depends on the two current fields, not whether those strings are nonempty."
          - text: "Compare field values directly. Truthiness and cached comparison answers lose required cases."
          - text: "Read `self.<field>` and `other.<field>` inside the method on every comparison."
