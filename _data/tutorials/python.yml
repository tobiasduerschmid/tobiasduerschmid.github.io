            class StageSet:
                def __init__(self, title):
                    self.title = title
                    self.cues = []

                def sound(self):
                    return "acoustic"

                def prepare(self):
                    cue = self.title + ": " + self.sound()
                    self.cues.append(cue)
                    return cue

                def announce(self):
                    self.cues.append("announced")
                    return self.title + " is next"


            class RehearsalSet(StageSet):
