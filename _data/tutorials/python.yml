    solution:
      files:
        - path: "functions.py"
          content: |
            def mean(numbers: list[float]) -> float:
                """Return the arithmetic mean of a list of numbers."""
                return sum(numbers) / len(numbers)

            def label_score(score: int, threshold: int = 50) -> str:
                """Return 'pass' if score >= threshold, else 'fail'."""
                if score >= threshold:
                    return 'pass'
                else:
                    return 'fail'
          language: "python"
        - path: "listcomp.py"
          content: |
            from functions import mean

            def above_average(numbers: list[float]) -> list[float]:
                """Return a list of numbers strictly greater than the mean."""
                avg = mean(numbers)
                return [x for x in numbers if x > avg]

            def squares_up_to(n: int) -> list[int]:
                """Return [1**2, 2**2, ..., n**2] using range() and **."""
                return [x**2 for x in range(1, n + 1)]

            # --- Quick self-test ---
            data = [4, 8, 15, 16, 23, 42]
            print(f"Data:          {data}")
            print(f"Above average: {above_average(data)}")
            print(f"Squares to 5:  {squares_up_to(5)}")
          language: "python"
      explanation: |
        **Why this is correct:**

        - **`above_average`:** The general form is `[expression for variable in iterable if condition]`. The condition `x > avg` is strictly greater than (not `>=`), as the test checks `above_average([4, 8, 15, 16, 23, 42]) == [23, 42]`. The mean is `18.0`; only `23` and `42` are strictly above it.
        - **AST check:** The test uses Python's `ast` module to verify that `above_average` contains a `ListComp` node. A manual `for` loop with `append` would pass functionally but fail this test — you must use list comprehension syntax.
        - **`squares_up_to`:** `range(1, n + 1)` generates `1` through `n` inclusive (stop is exclusive, so we need `n + 1`). `x**2` uses the `**` exponentiation operator — not `^` which is bitwise XOR in Python. The test checks `squares_up_to(5) == [1, 4, 9, 16, 25]`.
        - **`**` operator check:** The test also uses AST inspection to confirm `squares_up_to` contains a `BinOp` with `Pow` — you must use `**`, not `math.pow()`.

    tests:
      - description: "above_average uses a comprehension and preserves strictly above-mean values in order"
        command: |
          import ast, runpy
          tree = ast.parse(open('/tutorial/listcomp.py').read())
          function = next((node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == 'above_average'), None)
          assert function is not None and any(isinstance(node, ast.ListComp) for node in ast.walk(function)), 'Use a list comprehension in above_average.'
          above_average = runpy.run_path('/tutorial/listcomp.py')['above_average']
          for values, expected in [([4, 8, 15, 16, 23, 42], [23, 42]), ([2, 4, 6], [6]), ([5, 5], []), ([-3, 1, 1], [1, 1])]:
              assert above_average(values) == expected, f'For {values}, keep exactly {expected}, including repeated values.'
        hints:
          - text: "Compute the mean, then use it as the filter threshold."
          - text: "The condition must exclude values equal to the mean without deduplicating the remaining values."
          - text: "Use the shape [x for x in numbers if x > ...], filling in the computed mean."
      - description: "squares_up_to uses a comprehension, range(), and ** and covers 1 through n"
        command: |
          import ast, runpy
          tree = ast.parse(open('/tutorial/listcomp.py').read())
          function = next((node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == 'squares_up_to'), None)
          assert function is not None, 'Define squares_up_to.'
          nodes = list(ast.walk(function))
          assert any(isinstance(node, ast.ListComp) for node in nodes), 'Use a list comprehension in squares_up_to.'
          assert any(isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == 'range' for node in nodes), 'Use range() to generate the numbers.'
          assert any(isinstance(node, ast.BinOp) and isinstance(node.op, ast.Pow) for node in nodes), 'Use ** for exponentiation.'
          squares = runpy.run_path('/tutorial/listcomp.py')['squares_up_to']
          for n, expected in [(0, []), (1, [1]), (2, [1, 4]), (5, [1, 4, 9, 16, 25]), (7, [1, 4, 9, 16, 25, 36, 49])]:
              assert squares(n) == expected, f'For n={n}, expected {expected}.'
        hints:
          - text: "Use n to determine the range; a fixed range only works for one input."
          - text: "range excludes its stop value. Include n, and do not include zero among the values being squared."
          - text: "Combine an expression using ** with a for clause over range; n=0 should naturally produce an empty list."
