  # --------------------------------------------------------------------------
  # STEP 7 — Objects & Member References
  # Pedagogy: PRIMM — worked constructor, shared-collaborator prediction, then ownership repair.
  - title: "Objects & Member References"
    key: members
    instructions: |
      ### Why this matters

      Two festival playlists may intentionally share one artist profile while owning separate track queues. Object attributes use the same reference rules as names and list slots; a constructor must make the intended sharing explicit.

      ### 🎯 You will learn to

      - Apply `__init__`, `self`, and instance methods to initialize and change objects.
      - Analyze references stored in an object's attributes.
      - Create shared collaborators alongside independently owned member lists.

      ### Construction and Method Calls

      An ordinary class groups state with methods that use it:

      ```python
      class Artist:
          def __init__(self, name):
              self.name = name

          def rename(self, new_name):
              self.name = new_name

      artist = Artist("Silver Current")
      artist.rename("Silver Current Trio")
      ```

      `Artist(...)` creates an instance and calls its `__init__` initializer. Python supplies that instance as the first argument, conventionally named `self`. `artist.rename("...")` supplies `artist` as `self`; for this ordinary method it is equivalent to `Artist.rename(artist, "...")`.

      `self.name = name` stores a reference in an **instance attribute** (a member). A bare `name = ...` inside the method only binds a local name. The object holds a reference to the string; it does not physically embed a mutable string value. Reassigning `self.name` changes that attribute's reference.

      ### Predict the Shared Member

      The starter includes the `Artist` class above and a partial `Playlist` class. A correct constructor will receive an `artist` object and store it. Predict what should happen after two playlists receive the same artist and the artist is renamed: both show the new artist name, one does, or neither does?

      Write your prediction before opening the explanation.

      <details markdown="1">
      <summary>Explain the shared artist after predicting</summary>

      Both should see the change, because their `artist` attributes refer to one shared custom object. In contrast, calling `Playlist(...)` twice should create two independent `tracks` lists. A reference member does not decide ownership for you: creating a new list inside `__init__` is an explicit choice to give each playlist its own queue.

      **Target state after completing `Playlist` and running the starter's demonstration:** trace `first.artist` and `second.artist`, then trace their `tracks` attributes. Edge labels name the attribute that stores each reference; omitted attributes do not affect this comparison.

      ```mermaid
      %% caption: Sharing an artist does not require sharing the playlists' track queues.
      flowchart TB
        accTitle: Two playlists share one artist and have separate queues
        accDescr: Names first and second refer to separate Playlist objects. Both artist attributes refer to the same Artist object named Silver Current. The first Playlist's tracks attribute refers to a list containing Open Water; the second refers to a different empty list. The separate name artist, omitted here, also refers to that Artist.
        first["name:<br/>first"] --> a("Playlist object<br/>Afternoon Live")
        second["name:<br/>second"] --> b("Playlist object<br/>Afterparty")
        a -->|artist| artist("Artist object<br/>Silver Current")
        b -->|artist| artist
        a -->|tracks| left("list object<br/>Open Water")
        b -->|tracks| right("list object<br/>empty")
      ```

      </details>

      ### Task: Shared Artist, Separate Queues

      Complete `Playlist` in `member_playlists.py`:

      - `Playlist(name, artist)` stores `name`, refers to the exact supplied `Artist` object in `artist`, and starts with a fresh empty `tracks` list for every instance.
      - `add_track(track)` appends the supplied object once, preserving its identity and allowing duplicates.
      - `rename(new_name)` updates only this playlist's `name`.

      Keep the provided `Artist` behavior. Run the starter once to see the missing behavior, then implement the methods and run the checks. The inputs are ordinary names, Artist objects, and track objects; no validation is required.

      ### Investigate One Reference at a Time

      After the checks pass, create two playlists for the same artist. Add a track to one and rename their artist. Explain why only one queue changes but both artist names change. Finally assign a different `Artist` to one playlist's `artist` attribute: this rebinds one member reference and does not redirect the other playlist's member.
    files:
