steps:
  # ===========================================================================
  # STEP 1: The Headliner Codebase (orientation and tool warm-up)
  # ===========================================================================
  # Pedagogy: orientation and instruction first. Element interactivity is high
  # (Ashman et al. 2020), so the system, the loop of every later step, and the
  # tools come before any struggle. The knowledge check is retrieval practice
  # with the tree and search on neutral targets (spec §16), so that Part A
  # difficulty later comes from the system's structure, never from the editor.
  - key: headliner
    title: "The Headliner Codebase"
    open_file: README.md
    instructions: |
      ### Why this matters

      In a codebase too large to keep in your head, a folder tree and a project-wide search are how you find evidence quickly, and the right diagram can put scattered evidence side by side.

      ### 🎯 You will learn to

      - **Navigate** a multi-service Python project with **Files** and **Search files**
      - **Explain** how each diagram challenge in this tutorial works

      ### Meet Headliner

      Headliner sells festival weekends as trip packages: a festival pass, a place to sleep, shuttle rides, and add-on experiences. Headliner owns none of these. Suppliers provide them, a bank charges the fans, and Headliner's Order Processing Center (OPC) coordinates every order.

      - `services/` holds Headliner's own services.
      - `stubs/` holds stand-ins for systems that other organizations run.
      - `infra/` holds shared code for calls, messages, databases, and time.
      - `deploy/` holds the deployment settings.

      Start with `README.md`. Every file is read-only, so a line you cite stays the same line.

      ### How each challenge works

      Each of the next five steps brings one design question; the last step brings five.

      1. **From the code.** Write a one-sentence hypothesis, pin a line that supports it, and say what you would want a diagram to show. Then answer, rate your confidence, and lock in. About 7 minutes is enough, and there is no time limit.
      2. **With the diagram.** An AI coding agent's diagram of this code arrives in the **Diagram** pane. Answer again, then answer one new question with it.
      3. **Compare.** See both answers side by side, and what hid the answer in the code.

      ### Warm up with the tools

      Expand a folder in **Files**, open **Search files** (<kbd><abbr data-platform-modifier title="Control" data-no-tooltip="true">Ctrl</abbr>+Shift+F</kbd>), then choose **Next** for a short knowledge check. It only practices these tools; from step 2 on, finding a line serves a decision.
    quiz:
      title: "Step 1 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: basic
          question: "Use **Files** and `README.md`: which command reproduces support ticket `SUP-2291`?"
          options:
            - "`python3 -m scenarios.failed_trip`"
            - "`python3 -m scenarios.slow_group_checkout`"
            - "`python3 -m pytest`"
            - "`python3 devstack.py`"
          correct_index: 0
          option_feedback:
            1: "That script reproduces ticket `PERF-118`, the slow group checkout."
            2: "The tests check Headliner's behavior; they do not replay a support ticket."
            3: "`devstack.py` defines `build_stack()`; the repro scripts call it, and it prints nothing itself."
          explanation: "`README.md` lists both repro scripts under **Running Headliner**. A repro script prints a ticket's symptoms, not its cause."
        - type: single
          difficulty: basic
          question: "Use **Search files**: which function starts every Headliner service and every stand-in on the devstack?"
          options:
            - "`build_stack()`"
            - "`start_opc()`"
            - "`start_stubs()`"
            - "`create_app()`"
          correct_index: 0
          option_feedback:
            1: "`start_opc()` starts only the Order Processing Center; `build_stack()` calls it along with the rest."
            2: "`start_stubs()` starts only the stand-ins for other organizations' systems."
            3: "`create_app()` builds only the Trip Website."
          explanation: "`build_stack()` in `devstack.py` reads the deployment settings and starts every service and stand-in. The repro scripts and several test modules call it."
        - type: single
          difficulty: intermediate
          question: "Search for `2027`: which file sets the moment that the devstack's fake clock starts at?"
          options:
            - "`devstack.py`"
            - "`tests/test_infra.py`"
            - "`infra/clock.py`"
            - "`README.md`"
          correct_index: 0
          option_feedback:
            1: "Its `START` names the same moment, but only the infra tests' own clocks use it; `build_stack()` uses the one in `devstack.py`."
            2: "`FakeClock` takes its start time as an argument; it does not choose one."
            3: "`README.md` describes the start time, but no code reads it."
          explanation: "`START = datetime(2027, 6, 11, 9, 0, tzinfo=timezone.utc)` in `devstack.py` is the moment `build_stack()` passes to `FakeClock`. A search often finds several candidates; each one is a claim to check."

  # ===========================================================================
  # STEP 2: Event Consumers and Change Impact (component, publish-subscribe)
  # ===========================================================================
  # Pedagogy: experienced contrast with retrieval practice (spec §16, review
  # M1). Generation first: a hypothesis, a pinned line, and a view wish before
  # the options; then the agent's view, the same questions again, and one new
  # question that the view answers at a glance. Round 1: the request is given
  # in the reply card, with no view to predict.
  # Redesign (2026-11-21, redesign spec §3.1): the question is a decision, can
  # Jordan's patch ship and how should it roll out. Finding the receivers is
  # the step toward it (two pinned lines); the view gives the complete set, and
  # its evidence opens the handlers that show what each receiver reads.
  - key: event-consumers
    title: "Event Consumers and Change Impact"
    open_file: services/opc/events.py
    instructions: |
      ### Why this matters

      An event that several services consume is a contract. Before you change its fields, you need every consumer and what each one does with them, including any that passes the data on to another company.

      ### 🎯 You will learn to

      - **Analyze** a publish-subscribe system to find what a change to an event breaks
      - **Evaluate** rollout plans for a contract that several services share

      ### The message

      > **Jordan, OPC team:** Fans keep asking us to print their names in the right order. My patch is two lines in `TripEvents._trip`: it replaces `fan_name` with `given_name` and `family_name`. Can I ship it on Friday, and if not, how should I roll it out?

      ### Your task

      1. **Scope.** `services/opc/events.py` is open. Use **Files** and **Search files** to find every component that receives an event built by `_trip`. Pin the line that proves your least obvious receiver.
      2. **Consequence.** Open each receiver's handler, note what it does with the event's body, and pin one line that reads the name.
      3. **Decide.** Answer the challenge below from the code alone, then lock in.
      4. **Compare.** Answer again with the agent's diagram, then answer its two new questions.
    diagram_challenge:
      mode: code-first
      budget_minutes: 7
      min_score: 0.8
      attempt:
        hypothesis: true
        evidence_pins: 2
        view_wish: true
      questions:
        - id: breaks
          type: multiple
          question: "Jordan ships the patch as written. Which components raise an error on a trip event they receive afterwards?"
          options:
            - "Trip Website"
            - "OPC"
            - "Notifications"
            - "Loyalty"
            - "Warehouse ETL"
            - "Affiliate Relay"
            - "Support Console"
            - "Shuttle Planner"
          correct_indices: [2, 5, 6]
          option_feedback:
            0: "The Trip Website submits orders to the OPC and asks it for their status; it consumes no events."
            1: "The OPC publishes these events; its own queues, `orders.received` and `supplier.answered`, carry other messages."
            2: "Notifications builds each e-mail's greeting from `trip['fan_name']`, for all three trip events (`services/notifications/consumers.py:31`)."
            3: "Loyalty receives `trip.confirmed` but reads only `fan_id` and `total`, so the patch does not touch it."
            4: "Warehouse ETL receives every event and copies each field without naming any, so it keeps running. Its rows silently change columns, which is a different problem."
            5: "Affiliate Relay's binding `trip.*` never spells an event's name, and its webhook request copies `fan_name` (`services/affiliates/relay.py:16`)."
            6: "`_trip` builds the body of `trip.cancelled` too, and the Support Console keeps `fan_name` for its follow-up list (`services/support_console/app.py:16`)."
            7: "Shuttle Planner binds `supplier.shuttle.*`; those events have their own body, without a fan's name."
          explanation: "`_trip` builds the body of all three trip events (`services/opc/events.py:36`), and three of their consumers read `fan_name` by key. A handler that raises leaves its event at the head of its queue (`infra/broker.py:162`). So fans get no e-mails, partners get no commission reports, and support gets no follow-ups until someone fixes each handler."
        - id: rollout
          type: single
          question: "Which rollout changes the names without breaking a consumer?"
          options:
            - "Ship the patch; each team fixes its handler when errors appear"
            - "Add the two fields, and keep `fan_name` until every reader has moved"
            - "Split the name in `trip.confirmed` only, since Loyalty alone binds that key"
            - "Update Notifications and Loyalty first: a search for the event finds only them"
          correct_index: 1
          option_feedback:
            0: "Three handlers raise on their first event, and each failed event stays at the head of its queue, so fans get no e-mails in the meantime."
            2: "Four queues receive `trip.confirmed`: `#` and `trip.*` match it, and Notifications lists it in its own code."
            3: "Affiliate Relay and Support Console read `fan_name` too. The relay passes it to another company, which needs notice before the field goes away."
          # Judgment key (redesign spec §5.1): the additive half is a fact
          # (no consumer raises); removing fan_name later is the design choice.
          explanation: "Adding fields breaks no reader here, because every consumer picks fields by name. Removing `fan_name` is a second, later change, made once each consumer has moved and the affiliate partners have agreed to a new webhook body: expand first, contract later."
      reply:
        request: "Draw a UML component diagram of who publishes to and consumes from the `trips` exchange, with each binding key."
        summary: "The view shows the OPC publishing to the `trips` topic exchange and every queue bound to it, each labeled with its binding, plus the external systems that the consumers call."
        diagrams:
          - id: trip-events
            type: component
            label: "Trip events"
            source: *d_event_consumers
            links: *l_event_consumers
        evidence:
          - text: "Notifications binds its queue in code with `@consumes`"
            ref: services/notifications/consumers.py:25
          - text: "`loyalty.trips` binds `trip.confirmed`"
            ref: deploy/broker.toml:16
          - text: "`warehouse.all` binds `#`"
            ref: deploy/broker.toml:21
          - text: "`affiliates.trips` binds `trip.*`"
            ref: deploy/broker.toml:26
          - text: "`support.cancellations` binds `trip.cancelled`"
            ref: deploy/broker.toml:31
          - text: "`shuttle.planning` binds `supplier.shuttle.*`"
            ref: deploy/broker.toml:36
          - text: "In a binding, `*` matches one word and `#` matches zero or more"
            ref: infra/broker.py:48
          - text: "Affiliate Relay calls the partners' `webhook`"
            ref: services/affiliates/relay.py:13
          - text: "`Mailer` calls the Mail Relay's `send`"
            ref: services/notifications/mailer.py:14
          - text: "`_trip` builds the body of every trip event"
            ref: services/opc/events.py:36
          - text: "Notifications handles the three trip events in `on_trip_event`"
            ref: services/notifications/consumers.py:26
          - text: "Affiliate Relay builds its webhook request in `on_trip_event`"
            ref: services/affiliates/relay.py:11
          - text: "Support Console handles the event it receives in `on_trip_cancelled`"
            ref: services/support_console/app.py:12
        files_read:
          - deploy/broker.toml
          - infra/broker.py
          - infra/subscriptions.py
          - devstack.py
          - services/opc/events.py
          - services/notifications/consumers.py
          - services/notifications/mailer.py
          - services/loyalty/points.py
          - services/reporting/warehouse_etl.py
          - services/affiliates/relay.py
          - services/support_console/app.py
          - services/shuttle_planner/planner.py
        left_out: "The OPC's work queues `orders.received` and `supplier.answered`, which no exchange feeds, and what each consumer does with an event's fields."
        label: "Prepared in advance by an AI coding agent from this repository's code and verified against the code."
      follow_up:
        - id: versioned-key
          type: single
          question: "Jordan's other idea: leave `trip.confirmed` alone and publish the new body under a new routing key, `trip.confirmed.v2`, until everyone has moved. Which components receive `trip.confirmed.v2` today?"
          options:
            - "Every consumer of `trip.confirmed`"
            - "Affiliate Relay and Warehouse ETL"
            - "Warehouse ETL only"
            - "None of the six consumers"
          correct_index: 2
          option_feedback:
            0: "A binding matches whole words, not a prefix: `trip.confirmed` is a different key from `trip.confirmed.v2`."
            1: "`*` stands for exactly one word, and `confirmed.v2` is two, so `trip.*` does not match."
            3: "`#` matches any number of words, so Warehouse ETL's queue receives the new key."
          explanation: "Only `#` matches a three-word key. A versioned key is a workable migration path, but each consumer needs a new binding before it sees the new events, and the diagram lets you check that connector by connector."
        - id: privacy
          type: single
          question: "Privacy review: a fan's name may leave Headliner only inside that fan's own e-mail or booking. Which component breaks this rule?"
          options:
            - "Notifications"
            - "Affiliate Relay"
            - "Warehouse ETL"
            - "Support Console"
          correct_index: 1
          option_feedback:
            0: "Notifications sends the name to the Mail Relay only inside the body of the fan's own e-mail."
            2: "Warehouse ETL keeps the name, but in Headliner's own reporting warehouse; the diagram shows it calling no other organization."
            3: "Support Console keeps the name for its follow-up list and calls only the OPC."
          explanation: "Two connectors cross the `Headliner` package: Notifications to the Mail Relay, and Affiliate Relay to the Affiliate Partners. The relay's webhook request carries `fan_name` next to the order total (`services/affiliates/relay.py:16`), although a commission report needs no name."
      debrief:
        hidden_by: "Bindings live in `deploy/broker.toml` and in Notifications' own code, and two of them use wildcards, so a search for `trip.confirmed` misses Warehouse ETL and Affiliate Relay."
        find_in_code: "List every binding, the `[[bindings]]` in the configuration and every `consumes(` in the code, then match each pattern against the event's routing key."
        view_shows: "Every consumer of the `trips` exchange with its binding, in one place, so the question of who is affected has a complete answer. The view did not say which fields a consumer reads; its evidence took you to the handlers that do. A view scopes the search, and the code confirms. A view also has an edge over asking the agent your question directly: you can reuse it (both new questions took one look), inspect it, and check it one connection at a time."
        consolidation_prompt: "Which receiver would you have missed without the diagram, and what would shipping the patch have cost?"
        mechanism_question:
          id: mechanism
          type: single
          question: "Which mechanism hid the answer in the code?"
          options:
            - &m_workflow "One workflow spread over work queues and tasks, with a step missing"
            - &m_names "Connections resolved by service name from configuration"
            - &m_loops "Remote calls that look local, inside loops and a decorator"
            - &m_bindings "Event bindings declared outside the code, with wildcards"
          correct_index: 3
          option_feedback:
            0: "The broker does queue each copy, but nothing is missing here: each consumer's binding decides what it receives, and the bindings are what a search misses."
            1: "Services do find each other by name, but who receives an event is decided by bindings, two of them wildcards."
            2: "Nothing repeats a remote call here; the receivers come from bindings."

  # ===========================================================================
  # STEP 3: Failure Paths in an Order Workflow (sequence, trace)
  # ===========================================================================
  # Pedagogy: PRIMM. Read the repro script and its output, Predict the cause from the code,
  # Investigate with the trace, then Modify (what the rejection path must
  # add). The evidence check is the first of three and the most scaffolded:
  # it names what to check, because an absence in a diagram is a hypothesis
  # (spec §16, review C3). The knowledge check interleaves view choice with
  # retrieval of steps 2 and 3.
  # Redesign (2026-11-21, redesign spec §3.2): the questions are what happens
  # to the fan's money and which fix holds in every order of supplier answers;
  # tracing the workflow (two pinned lines) is the step toward them.
  - key: failed-trips
    title: "Failure Paths in an Order Workflow"
    open_file: scenarios/failed_trip.py
    instructions: |
      ### Why this matters

      Workflows that span queues and services fail in pieces. Tracing one scenario in time order shows what each failure leaves behind, and what a fix has to undo.

      ### 🎯 You will learn to

      - **Trace** an asynchronous workflow through work queues and tasks
      - **Evaluate** which fix leaves the money and the bookings consistent

      ### The escalation

      > **Support team:** Three fans were charged for Neon Nights trips that ended up Failed. One says their glamping tent is still booked. What happens to their money, and what do we ask engineering to fix?

      ### Your task

      1. **Read the repro.** `scenarios/failed_trip.py` (it is open) reproduces one of these trips; the script itself is evidence of what the trip contained. On the devstack it prints the symptoms, not the cause:

         ```text
         Trip HL-1001 for Neon Nights: failed
         Charged to the fan's card: $1,136.80
         Bookings at the suppliers:
           HL-1001-box-office: confirmed
           HL-1001-glampingco: confirmed
           HL-1001-shuttle: rejected
         ```
      2. **Trace.** Follow the trip order from the moment the OPC receives it to the supplier's rejection. Pin the line where the card is charged and the line that handles a rejection.
      3. **Decide** what happens to the money and which fix to ask for, then lock in.
      4. **Compare.** Answer again with the agent's diagram. A short knowledge check follows.
    diagram_challenge:
      mode: code-first
      budget_minutes: 7
      min_score: 0.8
      attempt:
        hypothesis: true
        evidence_pins: 2
        view_wish: true
      questions:
        - id: money
          type: single
          question: "The trip is Failed and Priya's card was charged $1,136.80. What happens to that money?"
          options:
            - "The OPC refunds it as soon as the trip is marked Failed"
            - "It stays captured until Priya cancels the trip under My trips"
            - "It was only reserved: the website validates the card, and nothing captures it"
            - "It stays captured: nothing refunds a Failed trip, and it cannot be cancelled"
          correct_index: 3
          option_feedback:
            0: "The rejection path marks the order Failed and publishes `trip.failed`; it calls nothing at the bank."
            1: "`CancellationTask.cancel` refuses any order that is not processing or confirmed, so a Failed trip cannot be cancelled (`services/opc/cancellation_task.py:35`)."
            2: "The website's check is for an amount of 0. The OPC's workflow captures the full amount right after it takes the order from `orders.received`."
          explanation: "`WorkflowManager.on_order_received` captures the payment, then places the supplier orders (`services/opc/workflow.py:25`). A rejection reaches `InvoiceTask._settle`, which only marks the order Failed and publishes `trip.failed` (`services/opc/invoice_task.py:35`). The only caller of `PaymentTask.refund` is a fan's cancellation, and a Failed order is refused one. Only a person at Headliner can return this money."
        - id: fix
          type: single
          question: "Which fix leaves no fan charged for a Failed trip and no booking open, in whatever order the suppliers answer?"
          options:
            - "Refund the capture when a supplier rejects"
            - "Refund, and cancel every supplier order not yet rejected"
            - "Refund, and cancel the supplier orders confirmed so far"
            - "Capture the payment only after the last supplier confirms"
          correct_index: 1
          option_feedback:
            0: "The money comes back, but the suppliers that confirmed keep their bookings, like the glamping tent."
            2: "A supplier that answers after the rejection still confirms and keeps its booking: the loop over the answers goes on after the trip has failed."
            3: "No fan is charged for a Failed trip then, but the suppliers that confirmed before the rejection still hold their bookings."
          explanation: "A workflow that fails partway needs one compensating step for each step that may have succeeded, including steps whose outcome is still unknown. When the box office rejects first, the lodging and shuttle confirmations arrive after `trip.failed` and are still recorded (`services/opc/invoice_task.py:27`). `CancellationTask.cancel` already treats `placed` and `confirmed` supplier orders alike (`services/opc/cancellation_task.py:43`); the rejection path needs the same."
      reply:
        request: "Draw a UML sequence diagram of a trip order from submission until every supplier has answered, including the rejection path."
        summary: "The view traces one trip order from submission to the suppliers' answers: the calls each sender waits for, the messages that go through work queues, and both outcomes of a supplier's decision."
        diagrams:
          - id: trip-order
            type: sequence
            label: "One trip order"
            source: *d_failed_trips
            links: *l_failed_trips
        evidence:
          - text: "`on_order_received` handles `orders.received`"
            ref: services/opc/workflow.py:23
          - text: "`on_supplier_answered` hands each answer to `on_answer`"
            ref: services/opc/workflow.py:29
          - text: "`Intake.accept` queues each new order with `send`"
            ref: services/opc/intake.py:21
          - text: "`SupplierCallbackService.answer` queues each answer with `send`"
            ref: services/opc/api.py:55
          - text: "`orders.received` is a work queue in the broker"
            ref: deploy/broker.toml:8
          - text: "`supplier.answered` is a work queue in the broker"
            ref: deploy/broker.toml:11
          - text: "`RETRY_INTERVAL_S`: a placement that fails is sent again every 60 seconds"
            ref: services/opc/supplier_task.py:10
          - text: "An answer changes the trip order only while it is `processing`"
            ref: services/opc/invoice_task.py:33
          - text: "Each answer is saved on its supplier order with `save_supplier_order`"
            ref: services/opc/invoice_task.py:27
          - text: "The website's card check asks the bank about `amount=0`"
            ref: services/website/payments.py:18
        files_read:
          - services/opc/api.py
          - services/opc/intake.py
          - services/opc/service.py
          - services/opc/workflow.py
          - services/opc/payment_task.py
          - services/opc/supplier_task.py
          - services/opc/invoice_task.py
          - services/opc/events.py
          - stubs/supplier.py
          - services/website/payments.py
          - deploy/broker.toml
        left_out: "The Trip Website's checks before it submits, the supplier orders' invoices, and the e-mail that Notifications sends."
        label: "Prepared in advance by an AI coding agent from this repository's code and verified against the code."
      follow_up:
        # Judgment key (redesign spec §5.1): the bank's stand-in never declines
        # a capture, so this failure is reasoned from the amount-0 card check.
        - id: capture-last
          type: single
          question: "Mina, from the product team, prefers the other order: move `capture` below the last confirmation, so that a rejected trip is never charged. Which new failure does that order of steps allow?"
          options:
            - "Every supplier confirms, then the capture is declined: bookings nobody paid for"
            - "The fan waits for every supplier's answer before getting an order id"
            - "The card is charged twice when two suppliers confirm in the same pass"
            - "The suppliers are asked before the trip order is stored"
          correct_index: 0
          option_feedback:
            1: "The reply with the order id goes back before the workflow starts; moving `capture` does not change what the fan waits for."
            2: "`PaymentTask.capture` returns early once the payment has a `capture_id`, so a second call charges nothing."
            3: "`Intake.accept` stores the order before it queues it, whatever the workflow does afterwards."
          explanation: "The checkout only asks the bank whether the card is open (an amount of 0), so a capture can still be declined. Charging first needs a refund when a booking fails; charging last needs cancellations when the charge fails. Either order works only with its compensating steps, and the diagram lets you slide one message down and read off what now comes before it."
      evidence_check:
        prompt: "Before you ask for the fix: the diagram shows no refund and no cancellation on the reject path. An absence in a diagram is a hypothesis. Open the reject branch in `services/opc/invoice_task.py` and check what it does."
        question:
          id: reject-branch
          type: single
          question: "Besides recording the supplier's rejection, what does the reject branch do?"
          options:
            - "It also refunds the captured payment through `PaymentTask.refund`"
            - "It marks the trip order Failed and publishes `trip.failed`, nothing else"
            - "It also cancels the confirmed supplier orders through their gateways"
          correct_index: 1
          option_feedback:
            0: "`PaymentTask.refund` exists, but only `CancellationTask.cancel` calls it, after a fan cancels a trip."
            2: "Gateways cancel supplier orders only in `CancellationTask.cancel_supplier_orders`, which handles trips that fans cancel."
          explanation: "`InvoiceTask._settle` (`services/opc/invoice_task.py:35`) marks the order Failed, saves it, and publishes `trip.failed`. The code agrees with the diagram: nothing refunds the capture or cancels the confirmed supplier orders."
      debrief:
        hidden_by: "The workflow is spread over work queues and tasks, and the defect is a missing step, which a search cannot find."
        find_in_code: "Follow each queue name from the code that sends to it to the code that consumes it, then read each branch for what it undoes."
        view_shows: "One scenario in time order across every lifeline: you see the capture near the start of the trace, and you can look in the reject branch for the message that undoes it. The loop frame around the answers shows that a fix must also cover answers that arrive after the failure."
        consolidation_prompt: "What did the diagram put side by side that you had to search for?"
        mechanism_question:
          id: mechanism
          type: single
          question: "Which mechanism hid the answer in the code?"
          options:
            - *m_workflow
            - *m_bindings
            - *m_names
            - *m_loops
          correct_index: 0
          option_feedback:
            1: "Bindings decide who hears `trip.failed`, but the defect is a step that the rejection path never runs."
            2: "The services do call each other by name, but the answer turned on a step missing from the workflow."
            3: "The supplier orders are placed in a loop, but nothing here is slow; the problem is a missing step."
    quiz:
      title: "Step 3 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "A music app's team asks: when a listener taps **Play**, in what order do the app, the licensing service, and the audio server talk, and which calls does the app wait for? Which UML view answers this best?"
          options:
            - "A sequence diagram of one Play tap"
            - "A class diagram of the app's player classes"
            - "A component diagram of the app's services"
            - "A deployment diagram of the servers"
          correct_index: 0
          option_feedback:
            1: "A class diagram shows how the code is structured, not the order of calls in one interaction."
            2: "A component diagram shows which services connect, not in what order they talk during one interaction."
            3: "A deployment diagram shows where things run, not the order of the calls."
          explanation: "A sequence diagram lays one scenario out in time order, and its arrows show which calls wait for a reply and which are asynchronous."
        - type: single
          difficulty: intermediate
          question: "A food delivery company wants a new service that reacts to the *order delivered* events on its message broker. Which UML view best shows which running services already receive those events?"
          options:
            - "A component diagram of the broker's publishers and subscribers"
            - "A class diagram of the event classes"
            - "A sequence diagram of one delivery"
            - "No diagram: search the code for the event's name"
          correct_index: 0
          option_feedback:
            1: "The classes show the event's fields, but who receives it is decided by subscriptions at run time."
            2: "One delivery's trace shows the consumers of that one run, not every subscription."
            3: "A search finds the event's name, but not subscriptions whose patterns use wildcards or live in configuration."
          explanation: "A publish-subscribe component view puts every subscriber of an exchange next to its subscription, which is the list you need before adding another."
        - type: single
          difficulty: intermediate
          question: "Searching Headliner for `trip.confirmed` finds the publisher, Notifications, and Loyalty's binding, but not Warehouse ETL or Affiliate Relay. Why?"
          options:
            - "Their bindings are wildcards, `#` and `trip.*`, which never spell `trip.confirmed`"
            - "They read `trip.confirmed` from Loyalty's queue instead of the exchange"
            - "Their bindings are declared with `@consumes`, which search doesn't read"
            - "Search skips the configuration files in `deploy/`"
          correct_index: 0
          option_feedback:
            1: "Each bound queue gets its own copy from the exchange; no consumer reads another consumer's queue."
            2: "Notifications uses `@consumes`, and the search found it; Warehouse ETL and Affiliate Relay bind in the broker's configuration."
            3: "Search covers every file, TOML included: it found Loyalty's binding in `deploy/`."
          explanation: "A text search matches spelled-out strings. A wildcard binding receives `trip.confirmed` without containing those characters, so you must list every binding and match each pattern."
        - type: single
          difficulty: advanced
          question: "In the failed-trips bug, why couldn't a project-wide search point you to the defect?"
          options:
            - "The defect is a step that is missing, and a search finds only code that exists"
            - "The refund code is in the bank's stub, which the search skips"
            - "The search cannot follow calls from one file into another"
            - "The rejection path is generated at run time, so no file contains it"
          correct_index: 0
          option_feedback:
            1: "Search covers `stubs/` too, and it finds the bank's refund endpoint; the OPC just never calls it when a supplier rejects."
            2: "True, but even following every call by hand, you find no refund on the rejection path: there is none to find."
            3: "The rejection path is ordinary code in the OPC; it just lacks a step."
          explanation: "An absence has no text to match. You find it by reading each branch for what it should undo, and a sequence view lays that branch out in order."

  # ===========================================================================
  # STEP 4: What the Data Model Allows (class, data model)
  # ===========================================================================
  # Pedagogy: round 2 fades the scaffold. Students predict which view to ask
  # for before the reply arrives; the reply is the data model view of DSA
  # Table 2.6, which gathers multiplicities spread over four files. The
  # follow-up is a Modify move: the one multiplicity a feature would change.
  # Redesign (2026-11-21, redesign spec §3.3): the yes-or-no list stays; the
  # follow-up now asks what kind of change the refused favorite is, and what
  # a view of one package cannot say about its cost (the capstone picks it up).
  - key: data-model
    title: "What the Data Model Allows"
    open_file: services/opc/model/orders.py
    instructions: |
      ### Why this matters

      A data model decides what a product can sell. Reading its multiplicities and rules lets you say yes or no to a feature idea before anyone writes code.

      ### 🎯 You will learn to

      - **Analyze** a data model's multiplicities and constraints across several files
      - **Choose** the view to request before you see it

      ### The message

      > **Mina, product team:** Big festival weekend coming up. Before we put anything on the landing page: which of these can we sell without changing the data model? And for whichever one we can't sell: how big a change is it?

      ### Your task

      1. **Investigate** the trip-order model in `services/opc/model/`.
      2. **Commit.** Answer from the code, choose the view you would ask an agent for, and lock in.
      3. **Compare.** Answer again with the expert's view, then answer its new question.
    diagram_challenge:
      mode: code-first
      budget_minutes: 7
      min_score: 0.8
      predict_view: true
      attempt:
        hypothesis: true
        evidence_pins: 1
        view_wish: true
      questions:
        - id: ideas
          type: multiple
          question: "Which of these trips can Headliner sell without changing the data model?"
          options:
            - "A fan buys a trip for three friends and doesn't go"
            - "Ten friends travel on one trip order"
            - "Two friends share a tent while a third gets a cabin"
            - "A group splits the payment across two cards"
            - "A meet-and-greet for an attendee without a festival pass"
            - "Two trip orders share one shuttle supplier order"
          correct_indices: [0, 2]
          option_feedback:
            0: "The buyer is a `Fan`, and the attendees are a separate list; nothing requires the buyer to be one of them."
            1: "`TripOrder.__post_init__` allows 1 to 8 attendees (`MAX_ATTENDEES = 8`)."
            2: "Each `LodgingStay` has its own attendees, so two stays can split three friends between a tent and a cabin."
            3: "`TripOrder.payment` holds one `Payment`, with one card token."
            4: "`check_experience_attendees` requires every attendee of an `Experience` to hold a `FestivalPass` on the same order."
            5: "A `SupplierOrder` has one `trip_order_id`, so it belongs to exactly one trip order."
          explanation: "The model allows a buyer who does not travel and items with their own attendees. The other ideas each break a multiplicity or a rule: at most 8 attendees, one `Payment`, a festival pass for every experience attendee, and one trip order per supplier order."
      reply:
        request: "Draw a UML class diagram of the trip-order data model in `services/opc/model`: multiplicities, composition, and the constraints the code enforces."
        summary: "The view shows the trip-order classes, which parts each order owns, the multiplicity at both ends of every association, and the two rules that relate items to attendees."
        diagrams:
          - id: data-model
            type: class
            label: "Trip-order data model"
            source: *d_data_model
            links: *l_data_model
        evidence:
          - text: "`payment: Payment`"
            ref: services/opc/model/orders.py:50
          - text: "The attendee check uses `MAX_ATTENDEES`"
            ref: services/opc/model/orders.py:57
          - text: "An order needs at least one item: `if not self.items`"
            ref: services/opc/model/orders.py:59
          - text: "An item needs an attendee: `if not self.attendees`"
            ref: services/opc/model/items.py:24
          - text: "`trip_order_id: str` names one trip order"
            ref: services/opc/model/suppliers.py:21
          - text: "`check_item_attendees`"
            ref: services/opc/model/rules.py:13
          - text: "`check_experience_attendees`"
            ref: services/opc/model/rules.py:22
        files_read:
          - services/opc/model/orders.py
          - services/opc/model/items.py
          - services/opc/model/suppliers.py
          - services/opc/model/rules.py
        left_out: "`Invoice`, the classes' operations, and how the Order DB stores an order."
        label: "Prepared in advance by an AI coding agent from this repository's code and verified against the code."
      follow_up:
        - id: split-scope
          type: single
          question: "Mina's favorite is the split payment. Going by this view, what kind of change is it?"
          options:
            - "A limit to raise, like the cap of 8 attendees"
            - "A rule to drop from the model's constraints"
            - "One association from 1 to 1..*, plus readers this view omits"
            - "No model change: one `Payment` can hold two cards"
          correct_index: 2
          option_feedback:
            0: "The association ends in exactly one `Payment` object; no number in a validator stands between the model and a second payment."
            1: "Neither constraint mentions payments; what stops a second card is the multiplicity 1 at the `Payment` end."
            3: "`Payment` has one `card_token` and one `capture_id` (`services/opc/model/orders.py:37`)."
          explanation: "`TripOrder.payment` becomes a list, and everything that reads `order.payment` follows: the capture and the refund, the JSON form that the Order DB keeps, and the `total` in every trip event. This view covers `services/opc/model` only, so it cannot show who else reads a stored payment. The last step picks that question up."
      debrief:
        hidden_by: "The multiplicities are spread over type hints, `__post_init__` validators, and the rules in `rules.py`, across four files."
        find_in_code: "As you read the model files, write down each field's multiplicity and each validator's rule."
        view_shows: "Every class of the data model with each association's multiplicity and the rules the code enforces, so each idea becomes a check against one line or one constraint. A class view of one package shows what the model allows; it does not show who depends on the model from outside."
        consolidation_prompt: "What did the diagram put side by side that you had to search for?"
        mechanism_question:
          id: mechanism
          type: single
          question: "Which mechanism hid the answer in the code?"
          options:
            - *m_bindings
            - &m_overrides "Subclass overrides in another package that break a contract"
            - *m_workflow
            - &m_multiplicities "Multiplicities spread over type hints and validators"
          correct_index: 3
          option_feedback:
            0: "No event or binding decides what the model allows; its type hints and validators do."
            1: "The item classes do form a hierarchy, but each idea turned on how many of something the model allows."
            2: "No queue or task is involved: the model's rules apply whenever a trip order is built."

  # ===========================================================================
  # STEP 5: Outages and Synchronous Dependencies (module view, then C&C)
  # ===========================================================================
  # Pedagogy: contrasting cases (Schwartz & Bransford 1998). The reply first
  # shows the package view an agent draws for "dependencies", which cannot
  # answer a runtime question (DSA §1.3), then the component view. The
  # evidence check fades: it names the claim, and students find the file.
  # The follow-up is a Modify move toward an availability tactic.
  # Redesign (2026-11-21, redesign spec §3.4): four yes-or-no questions became
  # the scheduling decision (which windows to move) and what happens to an
  # order and a card during another window; a follow-up finds a dependency
  # that nobody asked about.
  - key: outages
    title: "Outages and Synchronous Dependencies"
    open_file: services/website/app.py
    instructions: |
      ### Why this matters

      A service is only as available as the calls it makes while a user waits. Knowing which dependencies sit on a request's path tells you what an outage stops.

      ### 🎯 You will learn to

      - **Identify** the synchronous dependencies on a request's path
      - **Explain** why a view of the imports cannot answer a question about run time

      ### The message

      > **Alex, operations:** Maintenance windows on Friday, one at a time: the Bank, the Lodging Provider, the message broker, and the Mail Relay. The Sunset Sessions presale opens at noon. Which windows do I have to move away from the presale, and what happens to orders placed during the others?

      ### Your task

      1. **Trace** what the Trip Website does when a fan presses **Book now**, and follow the order into the OPC until the request returns. Pin two lines where the request waits for another system.
      2. **Decide.** Answer from the code, choose the view you would ask for, and lock in.
      3. **Compare.** The agent replies twice. Judge whether its first view fits the question, then answer with the second.
    diagram_challenge:
      mode: code-first
      budget_minutes: 7
      min_score: 0.8
      predict_view: true
      attempt:
        hypothesis: true
        evidence_pins: 2
        view_wish: true
      questions:
        - id: windows
          type: multiple
          question: "Which of the four windows must Alex move away from the presale, because fans cannot submit trip orders during them?"
          options:
            - "Bank"
            - "Lodging Provider"
            - "Message broker"
            - "Mail Relay"
          correct_indices: [0, 2]
          option_feedback:
            0: "`@requires_valid_card` asks the bank to validate the card before `submit` runs, so the checkout stops there (`services/website/checkout.py:44`)."
            1: "The website never calls the Lodging Provider; the OPC orders the stay after the fan's request has returned."
            2: "`Intake.accept` sends the order to `orders.received` inside the submit request, and that call fails while the broker is down (`services/opc/intake.py:21`)."
            3: "Only Notifications calls the Mail Relay, after the OPC has finished; an e-mail that cannot be sent waits in its queue."
          explanation: "A fan's request waits for the bank (the card check in a decorator) and, inside the OPC's `submit`, for the broker. While either is down, the website shows its try-again message. The other two systems are reached only by queued work."
        - id: lodging-order
          type: single
          question: "A fan books during the Lodging Provider's window. What happens to the order and the fan's card?"
          options:
            - "The checkout refuses the order with a try-again message"
            - "Accepted and charged; the trip is marked Failed when the stay cannot be placed"
            - "Accepted; the card is charged only once the provider is back"
            - "Accepted and charged now; the stay is ordered once the provider is back"
          correct_index: 3
          option_feedback:
            0: "No part of the checkout calls the Lodging Provider, so the fan's request never notices the outage."
            1: "Unreachable is not a rejection: `SupplierOrderTask` keeps the order unsent and sends it again every 60 seconds (`services/opc/supplier_task.py:38`)."
            2: "The workflow captures the payment before it places any supplier order, reachable or not."
          explanation: "The fan's request ends when the order is stored and queued. The workflow then captures the payment and tries each supplier; an order a supplier could not take is sent again every 60 seconds, so the trip completes after the window. Until then, the fan's card is charged for a trip that is not yet confirmed."
      reply:
        contrast:
          request: "Draw a UML class diagram of the dependencies between Headliner's Python packages."
          diagram:
            id: imports
            type: class
            label: "Package dependencies"
            source: *d_outages_imports
            links: *l_outages_imports
          question:
            id: fits
            type: single
            question: "Can this package view tell you whether fans can submit trip orders while the broker is down?"
            options:
              - "Yes: only the OPC uses `Broker`, so a broker outage stops only the OPC's work"
              - "Yes: the website uses nothing from the OPC, so problems in the OPC cannot reach checkout"
              - "No: it shows which code imports which, not which calls a fan's request waits for"
            correct_index: 2
            option_feedback:
              0: "True of the imports, but whether the OPC's work happens while the fan waits is a fact about run time, which a package view cannot show."
              1: "The website imports nothing from the OPC because it calls the OPC by service name at run time; imports show neither that call nor what the OPC does during it."
            explanation: "Imports do not reveal runtime connections: Headliner's services reach each other by name while they run. Only the OPC imports the broker client, and the website imports nothing from the OPC, yet the website calls the OPC on every checkout."
        request: "Draw a UML component diagram of the runtime path of a trip order: every component and external system involved, each connector's protocol, and whether the fan waits for it."
        summary: "The view shows each component a trip order passes through: the calls a caller waits for as ball and socket, and the queued messages as «consume» connectors."
        diagrams:
          - id: trip-order-path
            type: component
            label: "Trip order path"
            source: *d_outages
            links: *l_outages
        evidence:
          - text: "`@requires_valid_card` wraps the checkout's `submit`"
            ref: services/website/checkout.py:44
          - text: "`BankClient.validate` calls the bank's `validate`"
            ref: services/website/clients.py:29
          - text: "`OpcClient.submit` calls `PurchaseOrderService.submit`"
            ref: services/website/clients.py:62
          - text: "`Intake.accept` stores the order, then calls `send`"
            ref: services/opc/intake.py:21
          - text: "`on_order_received` captures the payment and places the supplier orders"
            ref: services/opc/workflow.py:23
          - text: "`RETRY_INTERVAL_S`: orders a supplier could not take are sent again every 60 seconds"
            ref: services/opc/supplier_task.py:10
          - text: "A consumer that raises `ServiceUnavailable` keeps its message for later"
            ref: infra/broker.py:139
          - text: "Services reach each other by name: the `[internal]` addresses"
            ref: deploy/services.toml:4
          - text: "The `broker` is an `amqp://` service"
            ref: deploy/services.toml:16
          - text: "The `mail_relay` is an `smtp://` service"
            ref: deploy/services.toml:24
        files_read:
          - services/website/app.py
          - services/website/checkout.py
          - services/website/payments.py
          - services/website/clients.py
          - services/opc/api.py
          - services/opc/intake.py
          - services/opc/workflow.py
          - services/opc/supplier_task.py
          - services/notifications/consumers.py
          - services/notifications/mailer.py
          - infra/broker.py
          - infra/http.py
          - deploy/services.toml
          - deploy/broker.toml
        left_out: "The other consumers of trip events: Loyalty, Warehouse ETL, Affiliate Relay with the affiliate partners, Shuttle Planner, and Support Console."
        label: "Prepared in advance by an AI coding agent from this repository's code and verified against the code."
      follow_up:
        - id: unlisted
          type: single
          question: "The presale carts hold passes, a stay, and a shuttle ride. Which system that is missing from Alex's list would also stop these fans from submitting?"
          options:
            - "Shuttle Provider"
            - "Box Office"
            - "Experience Provider"
            - "None: the four windows cover every call a fan waits for"
          correct_index: 1
          option_feedback:
            0: "Only the OPC calls the Shuttle Provider, to book the ride, after the fan's request has returned."
            2: "The website checks capacity only for experiences in the cart, and these carts hold none."
            3: "The website has five sockets, and Alex's list names the owner of only one of them."
          explanation: "Every checkout prices its passes with a `Quotes` call to the Box Office before it submits. Alex asked about four systems; the view shows every system on the path, including the ones nobody thought to ask about."
        - id: outbox
          type: single
          question: "Which single change keeps fans ordering while the broker is down?"
          options:
            - "Retry the broker call inside the submit request until it succeeds"
            - "Run the message broker on the same machine as the OPC"
            - "Let the website send the order to the broker directly"
            - "Save the message with the order, and send it once the broker is back"
          correct_index: 3
          option_feedback:
            0: "Retrying inside the request keeps the fan waiting through the whole window, and the request still fails when it times out."
            1: "A broker on the OPC's machine still goes down for maintenance; moving it changes where it runs, not whether submit waits for it."
            2: "Then the website waits for the broker instead of the OPC: the dependency is still on the fan's path."
          explanation: "This is a transactional outbox: the Order DB stores the order and its message in one transaction, and a separate job sends stored messages when the broker is available. The submit request then waits only for the database. The price is a second delivery path: a job that sends stored messages and may send one twice, so the workflow must stay safe to repeat, as `PaymentTask.capture` already is."
      evidence_check:
        prompt: "Your broker answer rests on one claim: the OPC hands a new order to the broker while the fan's submit request is still waiting. A diagram can be wrong; find the code that hands the order over and check."
        question:
          id: request-waits
          type: single
          question: "Does the submit request wait for the broker before it returns?"
          options:
            - "No: a scheduled job sends stored orders to the broker later"
            - "No: the website sends the order to the broker after the OPC answers"
            - "Yes: the order goes to the broker before the request returns"
          correct_index: 2
          option_feedback:
            0: "No job reads stored orders: `Intake.accept` stores the order and calls `send` on the broker within the same request."
            1: "The website calls only the OPC's `PurchaseOrderService.submit`; it has no broker client."
          explanation: "`PurchaseOrderService.submit` returns the order id from `Intake.accept`, which stores the order and then sends it to `orders.received` (`services/opc/intake.py:21`). The code agrees with the diagram's ball and socket between the OPC and the broker."
      debrief:
        hidden_by: "Services call each other by name from `deploy/services.toml`, and the call to the broker during the submit request looks like any method call."
        find_in_code: "From the website's checkout, list every client call made before the response, and follow each one into the service it reaches."
        view_shows: "Which connections sit on the fan's path (ball and socket) and which work is queued for later («consume»), so each outage reads off one connector. A sequence diagram is defensible too, but you would need one trace per outage."
        consolidation_prompt: "What did the diagram put side by side that you had to search for?"
        mechanism_question:
          id: mechanism
          type: single
          question: "Which mechanism hid the answer in the code?"
          options:
            - *m_bindings
            - *m_workflow
            - *m_names
            - *m_loops
          correct_index: 2
          option_feedback:
            0: "Bindings decide who consumes events, but the outage answers turned on which calls the fan's request makes."
            1: "The work queues explain why the lodging and Mail Relay outages only delay work, but the broker answer turned on a call made by name during the request."
            3: "Latency is not the question here: each outage stops or delays an order depending on whether the request waits for the call."

  # ===========================================================================
  # STEP 6: Latency on the Checkout Path (sequence, performance)
  # ===========================================================================
  # Pedagogy: PRIMM. Read the repro script and its output, Investigate the request's calls,
  # then Modify: choose the change that meets the target from the per-call
  # durations in the notes. The knowledge check is spaced practice: one
  # question per earlier task's view, each in a new context.
  # Redesign (2026-11-21, redesign spec §3.5): counting calls became a step
  # (pinned lines) toward a time budget and the fix; the follow-up is a
  # trade-off point, where the faster alternative reopens step 3's failure.
  - key: checkout-latency
    title: "Latency on the Checkout Path"
    open_file: scenarios/slow_group_checkout.py
    instructions: |
      ### Why this matters

      A response-time target fails one remote call at a time. Seeing every call a request makes, in order, tells you which change can meet the target.

      ### 🎯 You will learn to

      - **Analyze** a request's path for the remote calls it waits for
      - **Evaluate** which change meets a latency target

      ### The message

      > **Mina, product team:** Checkouts for a group of 5 attendees with 3 experiences at Lakeside Fest take over 8 seconds. Our target is 2 seconds. Which change gets us there?

      ### Your task

      1. **Read the repro.** `scenarios/slow_group_checkout.py` (it is open) times this checkout on the devstack's clock; the script itself is evidence of what the group ordered. It prints:

         ```text
         5 attendees, 3 experiences: Order received
         Time until the fan saw it: 8.4 s (target: 2.0 s)
         ```
      2. **Trace** the request from **Book now** to **Order received**, and find how long each kind of call takes. Pin two lines where a call to another system sits inside a loop.
      3. **Decide, then compare.** Answer from the code, choose your view, lock in, and answer again with the expert's view. A short knowledge check follows.
    diagram_challenge:
      mode: code-first
      budget_minutes: 7
      min_score: 0.8
      predict_view: true
      attempt:
        hypothesis: true
        evidence_pins: 2
        view_wish: true
      questions:
        - id: budget
          type: single
          question: "Where do most of the 8.4 seconds go?"
          options:
            - "In the OPC's submit, which captures the card and places the supplier orders"
            - "In nine calls of about equal length, spread over the checkout"
            - "In pass quotes, one per attendee, then capacity checks, one per experience"
            - "In the bank's card check, which runs once for each attendee"
          correct_index: 2
          option_feedback:
            0: "Submit only stores and queues the order, in 200 milliseconds; the capture and the supplier orders come after the fan has the order id."
            1: "The nine calls differ: one pass quote takes 1,100 milliseconds, and the card check takes 300."
            3: "`@requires_valid_card` validates the card once per checkout."
          explanation: "Five pass quotes take 5.5 seconds and three capacity checks take 2.25 seconds: 7.75 of the 8.37. The card check (0.3 seconds), the submit (0.2), and six catalog queries (0.12) share the rest."
        - id: fix
          type: single
          question: "Which change brings this checkout under 2 seconds?"
          options:
            - "One bulk pass quote, and a cached card check"
            - "One bulk pass quote, and capacity checks in parallel"
            - "Capacity checks in parallel, and a second OPC worker"
            - "Pricing moved into the OPC's submit request"
          correct_index: 1
          option_feedback:
            0: "The bulk quote saves 5.1 seconds, but the three capacity checks still run one after another: about 3 seconds in all."
            2: "Parallel checks save 1.35 seconds, but the five pass quotes still take 5.5 seconds, and the OPC already answers submit in 200 milliseconds."
            3: "The five pass quotes stay remote calls, now made while the website waits for submit, so the checkout still takes about 8 seconds."
          explanation: "The loops cost the most. One bulk quote (400 milliseconds instead of 5.5 seconds) and parallel capacity checks (the slowest, 900 milliseconds, instead of 2.25 seconds) bring the checkout to about 1.9 seconds, with the card check, the submit, and the catalog queries."
      reply:
