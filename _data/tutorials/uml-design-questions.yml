          option_feedback:
            0: "`OrderHistoryPage`, the My trips page, calls `connect(settings[\"ORDER_HISTORY_DSN\"])`, the Order DB replica from `deploy/website.toml`, without `OpcClient`."
            1: "True, but imports show no connections: the website reaches the OPC by service name, and the My trips page reaches the Order DB replica through a setting."
          explanation: "`services/website/order_history.py` opens `ORDER_HISTORY_DSN`, so the agent's diagram missed a connection and the rule is broken. An estimate for the split payment must therefore include the My trips page. You can change your answer to question 1 and check it again."
      debrief:
        hidden_by: "A connection made from a setting, `ORDER_HISTORY_DSN` in `deploy/website.toml`, outside the website's client classes; the agent's diagram left it out."
        find_in_code: "For a rule about connections, search the settings and the code for every way a service connects, such as `connect(` and `_DSN`, not only its client classes."
        view_shows: "Your plan for question 1 still counts: the component view was the right request, and its reply was incomplete. Agents recover classes more reliably than relationships, so before you rely on a diagram, open the evidence for the one connection your answer depends on. Absent from a diagram does not mean absent from the code. And for the service fee, one file was faster than any view. Across the tutorial, the views did not answer the teams' questions for you; they made each decision checkable: a complete set of consumers, an ordering with a missing step, a path with its waits, a hierarchy with its contract."
        consolidation_prompt: "When was reading one file faster than asking for a diagram, and why?"
        mechanism_question:
          id: mechanism
          type: single
          question: "Which mechanism hid the order-history connection from the agent's diagram?"
          options:
            - *m_bindings
            - *m_names
            - *m_loops
            - *m_overrides
