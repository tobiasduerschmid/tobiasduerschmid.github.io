    language: python
    readonly: true
    content: |
      """Starting the OPC: its parts, its endpoints on the network, and its scheduled jobs."""

      from dataclasses import dataclass
      from functools import partial

      from infra.broker import Broker
      from infra.clock import Clock
      from infra.db import Database
      from infra.http import Network, ServiceClient
      from infra.scheduler import Scheduler
      from services.opc.api import (
          OrderTrackingService,
          PurchaseOrderService,
          SupplierCallbackService,
          endpoints,
      )
      from services.opc.cancellation_task import CANCEL_INTERVAL_S, CancellationTask
      from services.opc.events import TripEvents
      from services.opc.gateways.registry import gateway_for
      from services.opc.intake import Intake
      from services.opc.invoice_task import InvoiceTask
      from services.opc.payment_task import PaymentTask
      from services.opc.repository import OrderRepository
      from services.opc.supplier_task import RETRY_INTERVAL_S, SupplierOrderTask
      from services.opc.workflow import WorkflowManager

      LATENCY_MS = {"PurchaseOrderService.submit": 200}  # typical response times


      @dataclass
      class Opc:
          orders: OrderRepository
          workflow: WorkflowManager


      def start_opc(
          network: Network,
          broker: Broker,
          scheduler: Scheduler,
          clock: Clock,
          order_db: Database,
      ) -> Opc:
          """Serve the OPC's endpoints and schedule its jobs. The caller wires its queues."""
          orders = OrderRepository(order_db)
          events = TripEvents(broker)
          gateways = partial(gateway_for, network=network, clock=clock)
          payments = PaymentTask(ServiceClient("bank", network, caller="opc"), orders)
          supplier_orders = SupplierOrderTask(orders, gateways)
          invoices = InvoiceTask(orders, gateways, events)
          cancellations = CancellationTask(orders, payments, gateways, events, clock)
          services = endpoints(
              PurchaseOrderService(Intake(orders, broker), cancellations),
              OrderTrackingService(orders),
              SupplierCallbackService(broker),
          )
          for name, handler in services.items():
              network.register("opc", name, handler, LATENCY_MS.get(name, 0))
          scheduler.every(RETRY_INTERVAL_S, supplier_orders.resend_unsent, "opc-resend")
          scheduler.every(
              CANCEL_INTERVAL_S, cancellations.cancel_supplier_orders, "opc-cancellations"
          )
          return Opc(orders, WorkflowManager(orders, payments, supplier_orders, invoices))
  - path: services/opc/supplier_task.py
    language: python
    readonly: true
    content: |
      """Ordering each item of a trip from its supplier."""

      from collections.abc import Callable

      from services.opc.gateways.base import SupplierGateway, SupplierUnavailable
      from services.opc.model.orders import TripOrder
      from services.opc.model.suppliers import SupplierOrder
      from services.opc.repository import OrderRepository

      RETRY_INTERVAL_S = 60  # how often to resend orders a supplier could not take

      GatewayLookup = Callable[[str], SupplierGateway]


      class SupplierOrderTask:
          """Splits a trip order into one supplier order per supplier and sends each one."""

          def __init__(self, orders: OrderRepository, gateways: GatewayLookup) -> None:
              self._orders = orders
              self._gateways = gateways

          def place_all(self, order: TripOrder) -> None:
              for supplier_order in split_by_supplier(order):
                  self._orders.add_supplier_order(supplier_order)
                  self._place(supplier_order)
              order.mark_processing()
              self._orders.save(order)

          def resend_unsent(self) -> None:
              """Send again every order a supplier could not take; runs on a schedule."""
              unsent = self._orders.supplier_orders_where(status="placed", sent=False)
              for supplier_order in unsent:
                  self._place(supplier_order)

          def _place(self, supplier_order: SupplierOrder) -> None:
              try:
                  self._gateways(supplier_order.supplier_id).place(supplier_order)
              except SupplierUnavailable:
                  return  # still unsent; resend_unsent tries again
              self._orders.mark_sent(supplier_order)


      def split_by_supplier(order: TripOrder) -> list[SupplierOrder]:
          """One supplier order per supplier, with that supplier's items in order."""
          items_by_supplier: dict[str, list] = {}
          for item in order.items:
              items_by_supplier.setdefault(item.supplier_id, []).append(item)
          return [
              SupplierOrder(supplier_id, order.order_id, items)
              for supplier_id, items in items_by_supplier.items()
          ]
