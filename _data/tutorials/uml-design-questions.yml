    quiz:
      title: "Step 6 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "A team versions an event by publishing it with the routing key `order.placed.v2`. On the topic exchange, a reporting queue is bound with the pattern `order.*` and an audit queue with `#`. Which queues receive `order.placed.v2`?"
          options:
            - "The audit queue only"
            - "Both queues"
            - "The reporting queue only"
            - "Neither queue"
          correct_index: 0
          option_feedback:
            1: "`*` stands for exactly one word, and `placed.v2` is two, so `order.*` does not match."
            2: "`#` matches any number of words, and `order.*` needs exactly one word after `order`."
            3: "`#` matches every routing key, this one included."
          explanation: "In a topic binding, `*` stands for exactly one word and `#` for zero or more words, so a new, longer routing key reaches only the queues whose pattern allows the extra word."
        - type: single
          difficulty: intermediate
          question: "In a UML sequence diagram, `uploads` replies `trackId` to `app`, and after that reply an asynchronous message `transcode` goes from `uploads` to `worker`. What does `app` know when it receives `trackId`?"
          options:
            - "The upload is done; transcoding may not have started"
            - "The track is transcoded and ready to play"
            - "The worker has received `transcode`"
            - "Transcoding failed, so the app must retry"
          correct_index: 0
          option_feedback:
            1: "`transcode` is sent after the reply, so the reply cannot report its result."
            2: "An asynchronous message drawn after the reply may not even have been sent when `app` gets `trackId`."
            3: "Nothing in the diagram reports a failure; the reply means only that the upload step finished."
          explanation: "An asynchronous message drawn after a reply happens later: the caller already has its answer, so whatever that work does, failing included, reaches the caller another way or not at all."
        - type: single
          difficulty: basic
          question: "A UML class diagram shows an association from `Ticket` to `Seat` with multiplicity `0..1` at the `Seat` end. What does it allow?"
          options:
            - "A ticket with no seat, or with one seat"
            - "A ticket with exactly one seat"
            - "A ticket with any number of seats"
            - "Each seat belongs to at most one ticket"
          correct_index: 0
          option_feedback:
            1: "Exactly one would be `1`; `0..1` also allows none, such as a general admission ticket."
            2: "Any number would be `0..*`; `0..1` caps it at one."
            3: "The `0..1` sits at the `Seat` end, so it counts seats per ticket; tickets per seat are the other end's multiplicity."
          explanation: "A multiplicity at one end counts how many objects at that end one object at the other end is linked to: here, zero or one seat per ticket."
        - type: single
          difficulty: intermediate
          question: "In a UML component diagram, a checkout service's socket joins a fraud check's ball, on the path of every checkout request. What happens to checkouts while the fraud check is down?"
          options:
            - "They fail or wait, unless the checkout has a fallback"
            - "They are queued and complete when the fraud check returns"
            - "Nothing changes: ball and socket shows only a code dependency"
            - "Only the fraud reports are delayed"
          correct_index: 0
          option_feedback:
            1: "Queued work would be a messaging connector; ball and socket means the checkout calls and waits."
            2: "Ball and socket here is a runtime call: the socket side calls the ball side and waits for the answer."
            3: "The fraud check is on the request's path, so the checkout itself waits for it."
          explanation: "A synchronous dependency on the request path makes the request only as available as the service it calls, unless the caller has a fallback."
        - type: single
          difficulty: intermediate
          question: "A UML sequence diagram shows `loop [for each song]` around a call to a remote lyrics service that takes 200 milliseconds. What does the loop mean for a 50-song playlist?"
          options:
            - "About 10 seconds, and more for a longer playlist"
            - "About 200 milliseconds: the loop draws one call"
            - "About 200 milliseconds: the calls run in parallel"
            - "Nothing: sequence diagrams show no timing"
          correct_index: 0
          option_feedback:
            1: "A loop frame repeats its messages once per item, so one drawn call means 50 calls here."
            2: "Nothing in a loop frame says its iterations overlap; concurrent calls would be drawn in a `par` fragment."
            3: "The diagram does not time the calls, but the loop tells you how many there are, and each remote call takes time."
          explanation: "A remote call inside a loop costs its latency once per iteration: 50 calls of 200 milliseconds is 10 seconds, and the cost grows with the playlist."

  # ===========================================================================
  # STEP 7: The Right View for the Question (capstone, plan-first)
  # ===========================================================================
  # Pedagogy: Make. Students plan the request for each question, including a
  # control question that needs no diagram (Arisholm et al. 2006: no benefit
  # where local code answers). One reply holds a realistic agent omission
  # (spec §14, decision 1), so checking a diagram against the code can change
  # an answer; the evidence check names no file (spec §16, review M7). The
  # results card supports calibration across the whole tutorial.
  # Redesign (2026-11-21, redesign spec §3.6): each question is a
  # stakeholder's decision. The rule now has a price (step 4's split payment),
  # the gateway question asks where a responsibility should live, and the
  # step ends by choosing a view and a check for a system not seen before.
  - key: choose-the-view
    title: "The Right View for the Question"
    open_file: README.md
    instructions: |
      ### Why this matters

      An agent can draw almost any view on request. Choosing which view to ask for, or deciding that one file answers faster, and checking the claim your answer rests on stay your job.

      ### 🎯 You will learn to

      - **Select** the view that best answers a design question, or no view at all
      - **Evaluate** a diagram against the code for the one claim your answer depends on

      ### Your task

      Five questions from Headliner's teams arrive in the challenge below. Each one needs a decision.

      1. **Plan.** For each question, choose what you would ask the agent for: a class, component, or sequence diagram, or no diagram and one file to read. Then lock in your plan.
      2. **Answer** each question with the expert's views. They open as tabs in the **Diagram** pane.
      3. **Check** the one claim an answer depends on against the code, then review your results across all the challenges.
    diagram_challenge:
      mode: plan-first
      budget_minutes: 5
      min_score: 0.8
      questions:
        - id: rule
          type: single
          question: "Split payments will change how the Order DB stores a `payment`. Headliner's rule says the Trip Website reads order data only through the OPC's `OrderTrackingService`, so only the OPC should have to change. Does the running system keep the rule?"
          options:
            - "Yes: every read of order data goes through `OrderTrackingService`"
            - "No: one website page reads stored orders from a database directly"
            - "No: the website reads order events from the message broker"
          correct_index: 1
          option_feedback:
            0: "The My trips page, `OrderHistoryPage`, connects to `ORDER_HISTORY_DSN`, the Order DB replica, without the OPC."
            2: "The website consumes no broker queues; the order data it reads without the OPC comes from the Order DB replica."
          explanation: "`OrderHistoryPage` opens `ORDER_HISTORY_DSN`, the Order DB replica set in `deploy/website.toml`, and reads the amount out of each stored order's `payment` (`services/website/order_history.py:21`). The rule is broken, so the split payment is not a change to the OPC alone: the My trips page breaks with it. The agent's diagram left that connection out."
        - id: rideshare
          type: single
          question: "Product adds `RidesharePickup`, a new kind of transport that extends `TransportItem`. A contractor quotes three operations to write, the three that `TripItem` declares. Which operations does the new class really have to define?"
          options:
            - "`price()`, `supplier_kind()`, and `cancellation_deadline()`"
            - "`price()` and `supplier_kind()`"
            - "Only `price()`"
            - "None: `TransportItem` implements all three"
          correct_index: 1
          option_feedback:
            0: "`TransportItem` already defines `cancellation_deadline()`, from the ride's departure."
            2: "`supplier_kind()` is abstract in `TripItem`, and `TransportItem` does not define it."
            3: "`TransportItem` defines only `cancellation_deadline()`; it is abstract, like `TripItem`."
          explanation: "`TripItem` declares `price()`, `supplier_kind()`, and `cancellation_deadline()` abstract. `TransportItem` defines `cancellation_deadline()` from the departure time, so a new transport item must define the other two. The class view shows what the class owes. It does not show the two places that list item types by name, `ITEM_TYPES` in `services/opc/payloads.py` and `_item` in the website's checkout, which the estimate also needs."
        - id: cancellation
          type: single
          question: "A fan cancels a GlampingCo trip 2 days before check-in. Where do the money and the tent end up?"
          options:
            - "Refunded; the tent is cancelled on the job's next run"
            - "Not refunded until GlampingCo confirms; the tent stays booked"
            - "The cancellation is refused: check-in is under 72 hours away"
            - "Refunded at once; the tent stays booked, and the job retries without end"
          correct_index: 3
          option_feedback:
            0: "Within 72 hours of check-in, `GlampingCoGateway.cancel` raises `ManualCancellationRequired` on every run of the job."
            1: "`CancellationTask.cancel` refunds the card inside the fan's request, before any supplier is asked."
            2: "The fan's deadline is one day before check-in; the 72-hour rule is GlampingCo's own, inside its gateway."
          explanation: "`CancellationTask.cancel` refunds the card within the fan's request, then marks the supplier orders cancelling; a scheduled job cancels them every 60 seconds. Two days before check-in, `GlampingCoGateway.cancel` raises `ManualCancellationRequired`; the job logs it and tries again on every run (`services/opc/cancellation_task.py:54`). The fan has the money, and GlampingCo still holds the tent. Because the trip never reaches Cancelled, no `trip.cancelled` event tells the Support Console that someone must pick up the phone."
        - id: fee
          type: single
          question: "Marketing wants a lower service fee for Desert Bloom only. What does that take today?"
          options:
            - "A catalog edit: each festival's row holds its rate"
            - "A code change: one rate constant applies to every cart"
            - "A Box Office request: the fee arrives with each pass quote"
          correct_index: 1
          option_feedback:
            0: "The catalog's festival rows hold an id, a name, a start, and a sales date, but no fee."
            2: "The Box Office quotes pass prices; `TripPricer` adds Headliner's fee on top of them."
          explanation: "`SERVICE_FEE_RATE = 0.12` is one constant in `services/website/pricing.py`, which `TripPricer` applies to every cart, whatever the festival. A fee per festival needs a new catalog column and a code change."
        # Judgment key (redesign spec §5.1): the facts are the contract of
        # cancel(), the two overrides that break it, and the retry they cause.
        - id: gateways
          type: single
          question: "Two more partners that cancel only by phone sign next month. Today such cancellations stay in Cancelling for good. Where should the knowledge that a supplier needs a manual cancellation live?"
          options:
            - "In each partner's `cancel()`, raising its own exception as today"
            - "In `CancellationTask`, as a list of phone-only supplier ids"
            - "In the `SupplierGateway` contract, as an outcome every caller handles"
            - "In the registry, by mapping those partners to the base gateways"
          correct_index: 2
          option_feedback:
            0: "The contract of `cancel()` allows only `SupplierUnavailable`. A caller written against that contract cannot tell a partner that wants a phone call from a crash, so it retries forever."
            1: "Then every new partner means editing the task, and a supplier's own rule, like GlampingCo's 72 hours, moves out of its gateway."
            3: "The base gateways cancel through the supplier's interface, so the OPC would record a cancellation that the partner has not agreed to make."
          explanation: "The gateway knows its supplier's rules, so the knowledge belongs there; what is missing is a way to say it that the contract permits. If `cancel()` can report that a person must do this, every gateway states its answer, every caller must handle it, and `CancellationTask` can hand such orders to support instead of retrying. Two classes break the contract today: `GlampingCoGateway` (within 72 hours of check-in) and `MeetAndGreetGateway` (always)."
      plan:
        - for: rule
          question: "What would you ask for to check the rule about order data?"
          options:
            - "A class diagram of the website's classes and their imports"
            - "A sequence diagram of one checkout"
            - "A component diagram of the Trip Website's runtime connections"
            - "No diagram: read `services/website/clients.py`"
          correct_index: 2
          option_feedback:
            0: "Classes and imports show which code uses which, not which running systems the website talks to."
            1: "One checkout's trace shows that scenario's calls; the rule is about every connection the website makes."
            3: "`clients.py` holds the clients the checkout uses, which is not necessarily every connection the website makes."
        - for: rideshare
          question: "What would you ask for to check the contractor's estimate?"
          options:
            - "A class diagram of the `TripItem` hierarchy"
            - "A component diagram of the OPC and its suppliers"
            - "A sequence diagram of pricing a trip"
            - "No diagram: read `services/opc/payloads.py`"
          correct_index: 0
          option_feedback:
            1: "Components show the running systems, not which operations a class inherits."
            2: "A pricing trace shows the calls of one scenario, not which operations each class defines."
            3: "`payloads.py` maps item types to and from JSON; it shows no operations."
        - for: cancellation
          question: "What would you ask for to see where the money and the tent end up?"
          options:
            - "A class diagram of the `SupplierGateway` hierarchy"
            - "A component diagram of the OPC's runtime connections"
            - "No diagram: read `services/opc/partners/glamping_co.py`"
            - "A sequence diagram of a trip cancellation"
          correct_index: 3
          option_feedback:
            0: "The hierarchy shows which gateway raises, but not when the refund happens or what the job does afterwards."
            1: "Components show who talks to whom, not the order of the refund and the cancellations."
            2: "`glamping_co.py` shows the 72-hour rule, but not when the refund happens or what follows a failed cancellation."
        - for: fee
          question: "What would you ask for to see what a fee for one festival takes?"
          options:
            - "A sequence diagram of one checkout"
            - "No diagram: read `services/website/pricing.py`"
            - "A class diagram of the website's pricing classes"
            - "A component diagram of the website's connections"
          correct_index: 1
          option_feedback:
            0: "A checkout trace would show the pricing call, not how the rate is configured."
            2: "A class diagram would show `TripPricer`, but the fee is a module constant on one line of one file."
            3: "A setting inside the website's code is not a connection between components."
        - for: gateways
          question: "What would you ask for to decide where the manual-cancellation knowledge should live?"
          options:
            - "A class diagram of the gateway hierarchy across packages"
            - "A sequence diagram of a trip cancellation"
            - "A component diagram of the OPC and its suppliers"
            - "No diagram: read `services/opc/gateways/base.py`"
          correct_index: 0
          option_feedback:
            1: "One cancellation trace shows the gateways of one order, not the contract or every class that overrides `cancel()`."
            2: "Components show the suppliers, not the gateway classes, their contract, or their overrides."
            3: "`base.py` holds the contract, but the overrides that break it live in another package."
      reply:
        request: "For each question that needs a view, the expert asked for one: a UML component diagram of the Trip Website's runtime connections (question 1), a UML class diagram of the `TripItem` hierarchy (question 2), a UML sequence diagram of a trip cancellation (question 3), and a UML class diagram of the `SupplierGateway` hierarchy across packages (question 5). For question 4, the expert read `services/website/pricing.py`."
        summary: "Four views, which open as tabs in the Diagram pane: the website's connections, the trip items, a cancellation, and the supplier gateways."
        diagrams:
          - id: website-connections
            type: component
            label: "Website connections"
            source: *d_capstone_website_connections
            links: *l_capstone_website_connections
          - id: trip-items
            type: class
            label: "Trip items"
            source: *d_capstone_trip_items
            links: *l_capstone_trip_items
          - id: cancellation
            type: sequence
            label: "Trip cancellation"
            source: *d_capstone_cancellation
            links: *l_capstone_cancellation
          - id: gateways
            type: class
            label: "Supplier gateways"
            source: *d_capstone_gateways
            links: *l_capstone_gateways
        evidence:
          - text: "`CatalogClient` reads the Catalog DB"
            ref: services/website/clients.py:9
          - text: "`BankClient` calls the bank"
            ref: services/website/clients.py:22
          - text: "`BoxOfficeClient` calls the box office"
            ref: services/website/clients.py:32
          - text: "`ExperienceClient` calls the experience provider"
            ref: services/website/clients.py:46
          - text: "`OpcClient` calls the OPC's services"
            ref: services/website/clients.py:55
          - text: "`TripItem` declares its operations abstract"
            ref: services/opc/model/items.py:17
          - text: "`TransportItem` defines `cancellation_deadline`"
            ref: services/opc/model/items.py:92
          - text: "`CancellationTask.cancel` calls `refund`"
            ref: services/opc/cancellation_task.py:39
          - text: "`except Exception` logs the failure and leaves the supplier order for the next run"
            ref: services/opc/cancellation_task.py:54
          - text: "`MANUAL_CANCELLATION_WINDOW`: 72 hours"
            ref: services/opc/partners/glamping_co.py:9
          - text: "The `cancel()` contract allows only `SupplierUnavailable`"
            ref: services/opc/gateways/base.py:36
          - text: "`ManualCancellationRequired` extends `Exception`"
            ref: services/opc/partners/errors.py:4
        files_read:
          - services/website/clients.py
          - services/website/checkout.py
          - services/website/pricing.py
          - services/website/availability.py
          - deploy/services.toml
          - services/opc/model/items.py
          - services/opc/api.py
          - services/opc/cancellation_task.py
          - services/opc/service.py
          - services/opc/gateways/base.py
          - services/opc/gateways/box_office.py
          - services/opc/gateways/lodging.py
          - services/opc/gateways/shuttle.py
          - services/opc/gateways/experiences.py
          - services/opc/partners/errors.py
          - services/opc/partners/glamping_co.py
          - services/opc/partners/meet_and_greet.py
          - services/opc/partners/vip_shuttle.py
        left_out: "In the website view, the OPC's own connections; in the class views, attributes and helper methods."
        label: "Prepared in advance by an AI coding agent from this repository's code."
      follow_up:
        # Judgment key (redesign spec §5.1): transfer of step 5's result to a
        # system the student has not seen.
        - id: transfer
          type: single
          question: "Your team inherits a food-delivery backend. The product manager asks whether customers can still place orders while the payment provider is down for ten minutes. What do you ask the agent for, and what do you do with its reply?"
          options:
            - "A component diagram of the order path; then check its one decisive connector in the code"
            - "A class diagram of the payment classes; read which ones import the provider's client"
            - "A sequence diagram of one successful order; if the provider appears, orders stop"
            - "No diagram: search the code for the payment provider's name"
          correct_index: 0
          option_feedback:
            1: "Imports show which code uses which, not whether placing an order waits for the provider at run time."
            2: "One successful trace shows the call, but not what the caller does when the call fails."
            3: "A search finds the client, but not whether the order request waits for it, or whether a queue sits in between."
          explanation: "Whether an outage stops a request depends on which connectors lie on its path and whether the caller waits. A component view of the path shows that, as it did for Headliner's broker. The answer then rests on one connector, and a diagram can be wrong about one connector, so you open the code behind it."
      evidence_check:
        claim_question:
          id: claim
