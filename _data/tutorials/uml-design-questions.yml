          question: "Your answer to question 1 depends on a claim that this diagram cannot prove. Which one?"
          options:
            - "That the diagram shows every connection the Trip Website makes"
            - "That the OPC provides `OrderTrackingService` to the website"
            - "That the website reads the Catalog DB only for festivals and offers"
          correct_index: 0
          option_feedback:
            1: "The diagram shows that interface, and `OpcClient` confirms it; what it cannot prove is that it shows every connection."
            2: "Your answer is about where the website reads order data; a missing connection elsewhere would matter more than what the catalog holds."
          explanation: "A diagram can only show the connections its author found. An answer of the form *it only goes through X* depends on the diagram missing nothing."
        prompt: "Check that claim in the code."
        question:
          id: complete
          type: single
          question: "Does the code agree that the Trip Website reads order data only through `OrderTrackingService`?"
          options:
            - "Yes: every read of order data goes through `OpcClient`"
            - "Yes: the website imports nothing from the OPC"
            - "No: one website page connects to an order database itself"
