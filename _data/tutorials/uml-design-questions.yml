title: "Answering Design Questions with UML"
description: "Answer design questions about Headliner, a festival-trip system in Python, first from its code and then with a UML diagram drawn from that code, and compare what each showed you. Assumes you can read UML class, sequence, and component diagrams."

# Hidden from the /SEBook/tutorials index until the TA pilot (spec §14). The
# release checklist is plan Task C10 Step 4.
exclude_from_index: true

# Spec §3. Authoring metadata; the runtime ignores it.
learning_objectives:
  - "Analyze a multi-service codebase to judge a proposed change, a failure, or a quality target, and rate your confidence."
  - "Use a class, component, or sequence diagram to make and justify that decision, and check the one claim it rests on against the code."
  - "Explain which code mechanism hid an answer (event bindings outside the code, inheritance across packages, asynchronous work queues, configuration-resolved connections, decorators, or multiplicities spread across files) and why a view brings these pieces together."
  - "Evaluate design alternatives that a view makes comparable: rollout plans for a shared event, compensating steps and their order, availability and latency tactics, and where a responsibility lives."
  - "Select the view that best answers a question (class, component, sequence, or none), including for a system you have not seen."

backend: pyodide
# Students read the code; nothing runs (a TOML file or a module run as a
# script only fails). No Run button and no OUTPUT panel: the editor and the
# diagram get the height. The repro steps show what their scripts print.
run: false
# A narrower instructions column leaves the code and the diagram more room.
instructions_width: narrow
# A passed diagram challenge (or knowledge check) unlocks the next step.
require_tests: true
# Stable step keys identify saved challenge records and deep links.
progress_version: 2
file_tree: true
project_search: true
# Every step shows the same read-only codebase, so the print view shows it once.
print_unchanged_files: false

# BEGIN GENERATED
# Written by scripts/uml_design_questions/build_yaml.py from
# tutorial_sources/uml-design-questions. Edit those files, then run it again.
shared_files:
  - path: README.md
    language: markdown
    readonly: true
    content: |
      # Headliner

      Headliner sells festival weekends as trip packages: a festival pass, a place to
      sleep (a campsite, glamping tent, cabin, or hotel room), shuttle rides, and add-on
      experiences such as sunrise yoga or an artist meet-and-greet. Headliner owns none
      of these. Suppliers provide them, and a bank handles card payments.

      The repository's data covers four festivals: Desert Bloom, Neon Nights, Lakeside
      Fest, and Sunset Sessions.

      ## Services

      Headliner's own services live under `services/`:

      - Trip Website (`website/`): festival pages, checkout, and My trips for fans.
      - Order Processing Center, or OPC (`opc/`): trip-order processing and tracking.
      - Notifications (`notifications/`): e-mail to fans.
      - Loyalty (`loyalty/`): fans' loyalty points.
      - Warehouse ETL (`reporting/`): loads for the reporting warehouse.
      - Affiliate Relay (`affiliates/`): commission reporting for influencer partners.
      - Support Console (`support_console/`): the support team's web app.
      - Shuttle Planner (`shuttle_planner/`): seat counts for each shuttle departure.

      Other organizations run the bank's card service, the festival box office, the
      lodging provider, the shuttle operator, the experience provider, the mail relay,
      and the affiliate partners' webhook. `stubs/` holds deterministic stand-ins for
      them.

      Shared code lives in `infra/`: calls between services, the message broker,
      databases, the clock, and scheduled jobs. Deployment settings live in `deploy/`.

      ## Running Headliner

      Everything runs in one process on the devstack (`devstack.py`), on a fake clock
      that starts at 09:00 UTC on June 11, 2027. It needs Python 3.12 and its standard
      library; the tests also need pytest. From this folder:

      ```sh
      python3 -m pytest                          # the test suite
      python3 -m scenarios.failed_trip           # repro for support ticket SUP-2291
      python3 -m scenarios.slow_group_checkout   # repro for ticket PERF-118
      ```
