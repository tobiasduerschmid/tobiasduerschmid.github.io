        hints:
          - title: Choose contracts before selectors
            text: "Review the allowed changes: CSS class names and words around the count. Decide which user-facing properties must remain stable before choosing your locators and assertions."
            condition: "code_not_matches: \\btest(?:\\s*\\.\\s*(?:only|skip))?\\s*\\("
          - title: Compare the two allowed displays
            text: "Consider 0 items remaining and 0 todos pending. List what stayed the same, then do the same for a toggle whose CSS class was renamed. Use those invariants to guide your observations."
            condition: "code_matches: ^(?=[\\s\\S]*\\btest(?:\\s*\\.\\s*(?:only|skip))?\\s*\\()(?![\\s\\S]*\\bexpect\\s*\\()"
          - title: Find the dependency behind the failure
            text: "Inspect the first failed action or assertion. Class selectors depend on styling names; full status sentences depend on wording. Identify which assumption changed, then choose an observation that still distinguishes the promised outcome from a real regression."
            condition: "code_matches: ^(?=[\\s\\S]*\\btest(?:\\s*\\.\\s*(?:only|skip))?\\s*\\()(?=[\\s\\S]*\\bexpect\\s*\\()"

    quiz:
      title: "Step 8 — Knowledge Check"
      min_score: 0.8
      shuffle: false
      questions:

        - question: |
            **(Cumulative — Steps 3 + 6.)** You're testing a button that the team has *announced* will be renamed from "Submit" to "Place order" next quarter. The action it performs (submitting the order) won't change. Which locator + assertion shape best matches the spec?
          type: single
          options:
            - "`await page.getByRole('button', { name: /submit/i }).click()` + `await expect(page.getByText('Order placed')).toBeVisible()` — survives the wording until next quarter."
            - "`await page.getByTestId('submit-order-action').click()` + `await expect(page.getByRole('status')).toContainText(/order placed|placed your order/i)`"
            - "`await page.locator('.btn-primary.submit').click()` + `await expect(page.locator('.confirmation')).toBeVisible()` — most specific to today's UI."
            - "`await page.getByText('Submit').click()` + `await expect(page.getByText('Order placed')).toBeVisible()` — text on both sides."
          correct_index: 1
          option_feedback:
            0: "It works *until* next quarter, then breaks the day the rename ships — a known wording change *should* push you off the role+name locator. Use `getByTestId` when the action is stable but the wording isn't."
            1: "Right. The action ('submit the order') is the stable contract — `getByTestId('submit-order-action')` honors that. The outcome region is named by role; the regex tolerates wording variants. Both choices are on the diagonal: pin the action, tolerate the wording."
            2: "CSS-class locators are the brittle rung (Step 5). They depend on styling, not behavior. The wording-change-resistance is also accidental, not deliberate."
            3: "`getByText('Submit')` will break next quarter when 'Submit' becomes 'Place order'. Same fate as the role+name approach — the spec said the wording would change, so don't pin it."
          explanation: |
            When the spec tells you wording is going to change but the action is permanent, that's the canonical case for `getByTestId` with a *semantic* test ID. Pair it with a Goldilocks assertion on the outcome region (role + regex) and you've matched specificity to spec on both sides.

        - question: |
            **(Cumulative — Step 5.)** A test using `getByRole('button', { name: 'Add todo', exact: true })` fails after marketing renamed the button to "Add". The behavior is unchanged, and the spec did not require the original wording. What's the most accurate diagnosis?
          type: single
          options:
            - "Real regression — the button no longer adds todos."
            - "False alarm — the locator pinned wording the spec didn't promise."
            - "Flaky — re-running it will probably pass."
            - "Operator error — the developer should have updated the test along with the button."
          correct_index: 1
          option_feedback:
            0: "The behavior didn't change — the user can still add todos. The test broke for a wording change, not a behavior change. That's the textbook false alarm from Step 5."
            1: "The `exact: true` option requires the complete accessible name. A string name without that option uses substring matching, but it would still fail this rename. Choose a stable name pattern or an agreed test ID when the original wording is not part of the contract."
            2: "Flakiness is intermittent. This is a deterministic failure caused by a deterministic UI change — re-running won't help."
            3: "'Update the test along with the button' is the brittle-test trap: every wording change forces a test edit. The fix is to write a locator that doesn't pin the wording in the first place — that's the entire lesson of Step 5."
          explanation: |
            False alarms erode trust in the test suite faster than anything else. The fix isn't to reactively patch the test on every UI change — it's to choose locators whose contract matches what the spec actually promises.

        - question: |
            **(Cumulative — Steps 4 + 7.)** A todo toggle must expose its completed state to assistive technology, and the status must report 2 remaining items. The colors, completion icon, and words around the count may change. Which assertion set checks both promises?
          type: single
          options:
            - "`await expect(item).toHaveCSS('text-decoration', /line-through/)` + `await expect(counter).toHaveText(/\\b2\\b/)`"
            - "`await expect(itemToggle).toHaveAttribute('aria-pressed', 'true')` + `await expect(page.getByRole('status')).toHaveText(/\\b2\\b/)`"
            - "`await expect(item).toBeVisible()` + `await expect(counter).toBeVisible()`"
            - "`await expect(page.locator('.completed')).toBeVisible()` + `await expect(page.locator('.count').first()).toHaveText('2 items remaining')`"
          correct_index: 1
          option_feedback:
            0: "A strikethrough checks one visual treatment. It does not establish that the toggle exposes its completed state to assistive technology, and this requirement permits other visual treatments."
            1: "The pressed-state assertion checks the toggle's exposed state, and the status assertion checks the required count. Neither fixes a color, icon, or full status sentence."
            2: "Both `toBeVisible()` calls are liar-test territory (Step 4): an empty item is still visible, and a counter showing the wrong number is still visible. Neither pins the actual promise."
            3: "`.completed` is a CSS class (brittle, Step 5) and `'2 items remaining'` over-pins the wording (Step 6). Both choices are off-diagonal in the wrong direction."
          explanation: |
            Each assertion checks a separate promise: exposed toggle state and remaining count. `aria-pressed` does not establish visual appearance. If a requirement also promises a visible completion cue, verify that visual requirement separately; a semantic assertion alone cannot prove it.

        - question: |
            A suite passes the correct app and fails every supplied buggy variant. What does this establish?
          type: single
          options:
            - "The suite detects every regression in the feature"
            - "The suite distinguishes the supplied variants from the correct app"
            - "Every failing variant was caught by its intended assertion"
            - "The suite will survive every future interface redesign"
          correct_index: 1
          option_feedback:
            0: "The supplied variants sample particular bugs. An untested regression may still pass the suite."
            2: "A variant can fail during setup or an action before reaching an assertion. Inspect the failure to establish what the test detected."
            3: "The checks exercise particular harmless changes. A redesign can change other assumptions, so review whether the test still matches the required behavior."
          explanation: |
            Passing these checks is evidence about the scenarios they exercise. Review each failure's cause, then consider other inputs and regressions the suite has not tested.
