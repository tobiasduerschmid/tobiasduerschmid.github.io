              with: "[data-bs-theme=\"dark\"] .task-control { background: transparent; color: #e6edf3; border-color: #3a4351; }"
            - path: src/styles.css
              replace: "[data-bs-theme=\"dark\"] .todo-toggle[aria-pressed=\"true\"] { background: #064e3b; border-color: #10b981; }"
              with: "[data-bs-theme=\"dark\"] .task-control[aria-pressed=\"true\"] { background: #064e3b; border-color: #10b981; }"
            - path: src/styles.css
              replace: "[data-bs-theme=\"dark\"] .todo-done .todo-toggle { color: #cbd5e1; }"
