            - path: src/App.jsx
              replace: "{item.text}"
              with: "{items.length === 3 && remainingCount === 0 ? 'Completed todo' : item.text}"
        hints:
          - title: Keep track of item identity
            text: "The promise concerns the original todos. Choose distinct input labels so you can tell preserved items from replacement rows after completion."
            condition: "code_not_matches: \\btest(?:\\s*\\.\\s*(?:only|skip))?\\s*\\("
          - title: Compare names before and after
            text: "Imagine that every completed row is renamed Completed todo. The row count is unchanged. Identify what information from your setup is needed to distinguish that display from the original items."
            condition: "code_matches: ^(?=[\\s\\S]*\\btest(?:\\s*\\.\\s*(?:only|skip))?\\s*\\()(?![\\s\\S]*\\bexpect\\s*\\()"
          - title: Check what a retained locator promises
            text: "A locator retained before a click is a query that runs again, not a stored copy of the original text. Inspect whether your final observations still check the original labels or only that some rows exist."
            condition: "code_matches: ^(?=[\\s\\S]*\\btest(?:\\s*\\.\\s*(?:only|skip))?\\s*\\()(?=[\\s\\S]*\\bexpect\\s*\\()"
      - description: The suite survives status wording and CSS class changes
        playwright:
          test_files:
            - tests/all-done.spec.js
          app_source: starter
          mutations:
            - path: src/App.jsx
              replace: "{remainingCount} items remaining"
              with: "{remainingCount} todos pending"
            - path: src/App.jsx
              replace: className="todo-toggle"
              with: className="task-control"
            - path: src/App.jsx
              replace: "className={item.done ? 'todo-done' : ''}"
              with: "className={item.done ? 'completed-task' : ''}"
            - path: src/styles.css
              replace: ".todo-toggle { width: 100%; text-align: left; background: transparent; border: 1px solid #d9dee8; border-radius: 6px; padding: 10px 12px; font: inherit; cursor: pointer; }"
              with: ".task-control { width: 100%; text-align: left; background: transparent; border: 1px solid #d9dee8; border-radius: 6px; padding: 10px 12px; font: inherit; cursor: pointer; }"
            - path: src/styles.css
              replace: ".todo-toggle[aria-pressed=\"true\"] { background: #ecfdf5; border-color: #10b981; }"
              with: ".task-control[aria-pressed=\"true\"] { background: #ecfdf5; border-color: #10b981; }"
