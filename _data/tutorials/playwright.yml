      files:
        - path: "src/App.jsx"
          language: "javascript"
          content: |
            function App() {
              const [items, setItems] = React.useState([]);
              const [text, setText] = React.useState('');

              function addTodo() {
                const trimmed = text.trim();
                if (!trimmed) return;
                setItems([...items, trimmed]);
                setText('');
              }

              // Off-by-one bug introduced for the brittleness scenario.
              const remainingCount = items.length + 1;

              return (
                <main className="todo-shell">
                  <section className="todo-panel">
                    <p className="eyebrow">Todo Lab</p>
                    <h1>Todo Lab</h1>

                    <div className="todo-form">
                      <label htmlFor="todo-input">Todo item</label>
                      <div className="todo-row">
                        <input
                          id="todo-input"
                          value={text}
                          onChange={(event) => setText(event.target.value)}
                          placeholder="Buy milk"
                        />
                        <button onClick={addTodo}>Add todo</button>
                      </div>
                    </div>

                    <p role="status" className="status-line">
                      {remainingCount} items remaining
                    </p>

                    <ul aria-label="Todo list" className="todo-list">
                      {items.map((item, index) => (
                        <li key={index}>{item}</li>
                      ))}
                    </ul>
                  </section>
                </main>
              );
            }
      explanation: |
        With the off-by-one bug, the brittle and Goldilocks tests both fail — both pinned the count, and the count is now wrong. The loose test still passes — it only verified the status region exists, never the count. That's the lesson: a stronger assertion isn't always better, but an assertion that doesn't pin the spec at all is *worse* than no test. The Goldilocks assertion is on the diagonal: loose enough to survive a wording change, tight enough to catch a real regression.

    quiz:
      title: "Step 6 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            A test asserts:

            ```javascript
            await expect(page.getByRole('status')).toHaveText(
              'Welcome back, Ada! You have 5 unread messages waiting.'
            );
            ```

            The product spec says: *"After login, show the user a welcome message and their unread message count."*

            What's the most accurate critique?
          type: single
          options:
            - "It's correctly strict — it pins everything the spec promises"
            - "It's over-specified — it pins wording the spec doesn't promise"
            - "It's under-specified — it should also pin the URL and page title"
            - "It's wrong because it uses `toHaveText` instead of `toBeVisible`"
          correct_index: 1
          option_feedback:
            0: "Strictness isn't free. The spec promises two things (welcome message, unread count) but this assertion pins about seven (exact wording, name interpolation, plurality grammar, sentence structure). When wording changes, the test breaks for reasons the spec doesn't care about — the over-specification trap."
            1: "Right. The spec is loose (\"show a welcome message and unread count\"); the assertion is tight (exact full-sentence match). When marketing changes \"Welcome back\" to \"Hi\" or \"5 unread messages\" to \"5 messages waiting,\" the test breaks even though the *spec* is still satisfied. False alarm waiting to happen."
            2: "The spec doesn't promise anything about URL or page title. Adding assertions for those pins MORE implementation, not less — making the test more brittle, not less."
            3: "`toHaveText` is the right tool for asserting on specific text content. The problem isn't the matcher — it's *what* is being matched (over-specified text). A better fix is `toContainText` with a regex covering the bits the spec actually cares about."
          explanation: |
            The principle: pin exactly what the spec promises — no more, no less. Stronger assertions aren't always better; they can over-specify and create false alarms. The best assertion *matches* the spec's specificity.

        - question: |
            The spec requires the user's exact order ID; surrounding wording and the timestamp may change. The displayed ID alone has the stable test ID `order-id`:

            ```javascript
            const orderId = '12345';
            const orderValue = page.getByTestId('order-id');
            ```

            Visibility is checked separately. Which assertion checks the ID's value without pinning the surrounding message?
          type: single
          options:
            - "`await expect(orderValue).toContainText(orderId)`"
            - "`await expect(orderValue).toHaveText(orderId)`"
            - "`await expect(orderValue).toBeVisible()`"
            - "`await expect(page.getByRole('status')).toHaveText('Order ID: 12345 — placed at 3:42 PM')`"
          correct_index: 1
          option_feedback:
            0: "Substring matching accepts the wrong ID \"123456\" because it contains \"12345\". The contract requires the complete ID, so this oracle is too weak."
            1: "The value element contains only the ID. Matching its entire text checks that value without pinning the surrounding message or timestamp."
            2: "A visible value element can show the wrong ID or no ID. Visibility alone does not check the required value."
            3: "The exact surrounding sentence and timestamp are not promised. This assertion can fail after a harmless wording or time change."
          explanation: |
            A stable locator for the dedicated value lets `toHaveText(orderId)` reject near matches such as `123456` while ignoring surrounding copy. Exactness belongs on the promised value, not on the entire presentation.

        - question: |
            **(Spaced review — Step 5)** A test fails after a CSS class rename. The behavior is unchanged. The team then changes the class back to silence the test. What's the underlying problem?
          type: single
          options:
            - "The team's solution is correct — keeping CSS class names stable is essential for tests to work"
            - "They patched the symptom; the cause is a test coupled to implementation, not behavior"
            - "The test is correct; the team should add the old CSS class as an alias"
            - "Reverting the CSS rename was the right call — never let a refactor break tests"
          correct_index: 1
          option_feedback:
            0: "This is the brittle-test lock-in trap. If you keep CSS class names stable just for tests, you accumulate technical debt — class names that no longer reflect the design, retained only because tests grip them. The cause isn't the rename; it's the test."
            1: "Right. The test was a CSS-locator test (Step 5 brittleness). Patching the symptom (revert rename) keeps the brittle test passing today but ensures the same trap fires again the next time someone refactors. The fix is to rewrite the locator using a stable contract (`getByRole` or a semantic `getByTestId`)."
            2: "Aliasing is even worse — now you're maintaining two class names, one of which is dead-weight. The spec didn't change; the test should have been written against a stable locator."
            3: "Tests should adapt to the codebase, not freeze it. Refactors are how codebases stay healthy. A test that breaks under a refactor with no behavior change is brittle — fix the test, don't ban the refactor."
          explanation: |
            From Step 5: brittle tests fail under refactors that don't break behavior. The fix is to rewrite the test against a stable contract, not to revert the refactor or freeze internal naming.


  # ==========================================================================
  # STEP 7 — Multi-promise features + scaffolded capstone
  # LO4 deeper + capstone integration of all LOs.
  # CLT element-interactivity: 2 novel elements (multi-promise per-promise
  # specificity decisions, semantic vs visual contract).
  # Variation Theory: fusion — multiple promises varying together; specificity
  # decision per promise.
  # Scaffolded per user feedback: behavior requirements given, test stubs given, student
  # fills in Act + Assert.
  # ==========================================================================
  # Pedagogy: Variation Theory fusion — multiple promises varying together
  - title: "Multi-Promise Features and the Capstone"
    instructions: |
      ### Why this matters

      Real features rarely have a single promise. The "Mark as done" toggle has *three*: state changes, count decrements, item stays visible. Each promise has its own specificity sweet spot — and treating them as one big assertion either over-pins (brittle on harmless changes) or under-pins (misses bugs in two-thirds of the contract). This step is the real-world skill: per-promise specificity decisions, made independently.

      ### 🎯 You will learn to

      - Apply the specificity-matching principle to features with multiple independent promises
      - Analyze each promise separately and choose its locator + assertion shape
      - Create a complete multi-promise Playwright test from behavior requirements and a partial test stub

      ### 🧠 Quick recall — commit before reading on

      **Q.** From Step 6: a stronger assertion is sometimes *worse*. When?

      - (a) When the SUT is slow — strong assertions time out before the page renders.
      - (b) When the spec is loose — pinning more than the spec promises creates false alarms on every harmless wording / styling change.
      - (c) Never — stricter is always safer.
      - (d) When the test runs on Firefox — strong assertions don't work cross-browser.

      <details markdown="1"><summary>Reveal</summary>

      **(b).** This is Step 6's principle: the best assertion lives on the *diagonal* of the (spec specificity × assertion specificity) grid. If the spec is loose ("show the count") but the assertion is tight (`toHaveText('3 items remaining')`), every wording change becomes a false alarm — a test failure that doesn't correspond to a behavior break.

      </details>

      Step 6 had a single promise (the count). Real features usually have **multiple** promises — and you have to make a *separate* specificity decision for each one. That's the skill that distinguishes a maintainable test suite from a brittle one.

      ### 🎯 The feature: "Mark as done" toggle

      The Todo app now supports marking items as done. Click on a todo's button to toggle its done state. Done items have a strikethrough; the remaining-count display only counts items that are *not* done.

      The spec is **three promises**:

      1. **Toggle state.** Clicking a todo toggles its done state.
      2. **Count decrements.** The remaining-count display reflects only un-done items.
      3. **Item stays visible.** Marked-done items remain in the list (not deleted).

      For *each* promise, we make a specificity decision independently. Use these comparisons when choosing observations for the capstone:

      | Promise | Unnecessary constraint | Checks the promise | Too weak |
      | --- | --- | --- | --- |
      | Toggle state | Require a particular CSS class | Check the toggle's `aria-pressed` value | Check only that the toggle exists |
      | Count decrements | Require the full sentence `2 items remaining` | Check the complete count in the status region | Check only that the status is visible |
      | Item stays visible | Require the original row markup | Check that the original item is still visible | Check only the remaining count |

      **Notice the asymmetry.**

      - Promise 2 is the same shape as Step 6: pin the count, not the wording.
      - Promise 1 introduces a new dimension: there's a *right tool* (`aria-pressed`, the semantic contract) and a *wrong tool* (`.todo-done` CSS class). Using the wrong tool isn't more strict — it's *coupled to implementation* in a different way.
      - Promise 3 is binary — the item either stays visible or it doesn't. Loose-spec doesn't apply when the contract is yes/no.

      ### Worked example: one fully written test

      Read this carefully — it applies the table above:

      ```javascript
      test('marking a todo as done decrements the count and keeps it visible', async ({ page }) => {
        // Arrange: three todos.
        await page.goto('/');
        for (const t of ['Milk', 'Bread', 'Eggs']) {
          await page.getByRole('textbox', { name: /todo item/i }).fill(t);
          await page.getByRole('button', { name: /add todo/i }).click();
        }

        // Act: mark "Milk" as done.
        const milkToggle = page.getByRole('button', { name: 'Milk' });
        await milkToggle.click();

        // Assert all three promises:
        // Promise 1 — toggle state is "done" (semantic ARIA contract).
        await expect(milkToggle).toHaveAttribute('aria-pressed', 'true');

        // Promise 2 — count decrements (pin the number, not wording).
        await expect(page.getByRole('status')).toHaveText(/\b2\b/);

        // Promise 3 — Milk is still in the list (not deleted).
        await expect(
          page.getByRole('listitem').filter({ hasText: 'Milk' })
        ).toBeVisible();
      });
      ```

      Each assertion is on the diagonal of its own 2×2 grid. Promise 1 uses the semantic ARIA attribute (not the CSS class). Promise 2 pins the count number (not the wording). Promise 3 verifies presence (the binary contract).

      ### 🎓 Capstone — write the next two tests

      Use the three promises above to complete **two test stubs**. Each todo is a listitem containing a toggle button whose accessible name is the todo text. The button exposes its state through `aria-pressed`; the status region exposes the remaining count.

      Your tests should catch incorrect state, incorrect counts, and lost items while surviving CSS class renames and count-wording changes. The exact colors, icons, and animation are not specified by these checks. An `aria-pressed` assertion checks the exposed toggle state; it does not establish that a visual completion cue is present. A separate visual requirement needs its own verification.

      Your two tests:

      ```javascript
      test('marking and unmarking a todo restores the count', async ({ page }) => {
        // Arrange: one todo "Milk".
        // Act: mark it done.
        // Assert: aria-pressed is true; count is 0.
        // Act: unmark it.
        // Assert: aria-pressed is back to false; count is back to 1.
      });

      test('marking one of two todos shows count of 1', async ({ page }) => {
        // Arrange: two todos "Milk" and "Bread".
        // Act: mark "Milk" as done.
        // Assert: count shows "1"; "Bread" is still un-done; "Milk" is done.
      });
      ```

      Use the worked example as your template. Apply per-promise specificity decisions (semantic locators, pin the count, verify the toggle state).

      Check the intermediate done state before unmarking. A test that only checks the final state after two clicks can pass when neither click changes anything.

      ### 🤔 Metacognitive close

      Before you submit:

      - Rate your confidence on each LO from Step 1 to now. Anything still fuzzy?
      - For your two capstone tests, ask: **what's the smallest change to App.jsx that should make my test fail? What's the smallest change that should NOT make my test fail?**

      That second question is the real test of whether you've internalized the principle. If your test would fail for *anything* you can think of, it's brittle. If it would *not fail* for a real regression you can think of, it's loose. Aim for the diagonal.

      ### 📝 Final house rule

      A durable e2e test isn't a script of clicks. It's an executable **behavioral spec** with a thin adapter that maps user intent onto the current UI.

      ### Next steps beyond this tutorial

      The in-browser sandbox here doesn't host every Playwright feature. In a real Playwright project you'd also use:

      - **Network mocking** (`page.route`) — mock API responses for deterministic tests.
      - **Storage state auth** — sign in once, reuse the session across tests.
      - **Fixtures** — share setup logic without hiding business intent.
      - **Trace viewer** — inspect failed CI runs frame-by-frame.

      The official [Playwright docs](https://playwright.dev/docs/best-practices) are the next learning artifact. Everything you've built here transfers — only the plumbing differs.

