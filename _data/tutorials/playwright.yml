    solution:
      files:
        - path: "src/App.jsx"
          language: "javascript"
          content: |
            function App() {
              const [items, setItems] = React.useState([]);
              const [text, setText] = React.useState('');

              function addTodo() {
                const trimmed = text.trim();
                if (!trimmed) return;
                setItems([...items, { text: trimmed, done: false }]);
                setText('');
              }

              function toggleDone(idx) {
                setItems(items.map((item, i) =>
                  i === idx ? { ...item, done: !item.done } : item
                ));
              }

              const remainingCount = items.filter((item) => !item.done).length;

              return (
                <main className="todo-shell">
                  <section className="todo-panel">
                    <p className="eyebrow">Todo Lab — Capstone</p>
                    <h1>Todo Lab</h1>

                    <div className="todo-form">
                      <label htmlFor="todo-input">Todo item</label>
                      <div className="todo-row">
                        <input
                          id="todo-input"
                          value={text}
                          onChange={(event) => setText(event.target.value)}
                          placeholder="Buy milk"
                        />
                        <button onClick={addTodo}>Add todo</button>
                      </div>
                    </div>

                    <p role="status" className="status-line">
                      {remainingCount} items remaining
                    </p>

                    <ul aria-label="Todo list" className="todo-list">
                      {items.map((item, idx) => (
                        <li key={idx} className={item.done ? 'todo-done' : ''}>
                          <button
                            className="todo-toggle"
                            onClick={() => toggleDone(idx)}
                            aria-pressed={item.done}
                          >
                            {item.text}
                          </button>
                        </li>
                      ))}
                    </ul>
                  </section>
                </main>
              );
            }
        - path: "tests/mark-done.spec.js"
          language: "javascript"
          content: |
            import { test, expect } from '@playwright/test';

            test('marking a todo as done decrements the count and keeps it visible', async ({ page }) => {
              await page.goto('/');
              for (const t of ['Milk', 'Bread', 'Eggs']) {
                await page.getByRole('textbox', { name: /todo item/i }).fill(t);
                await page.getByRole('button', { name: /add todo/i }).click();
              }

              const milkToggle = page.getByRole('button', { name: 'Milk' });
              await milkToggle.click();

              await expect(milkToggle).toHaveAttribute('aria-pressed', 'true');
              await expect(page.getByRole('status')).toHaveText(/\b2\b/);
              await expect(
                page.getByRole('listitem').filter({ hasText: 'Milk' })
              ).toBeVisible();
            });

            test('marking and unmarking a todo restores the count', async ({ page }) => {
              await page.goto('/');
              await page.getByRole('textbox', { name: /todo item/i }).fill('Milk');
              await page.getByRole('button', { name: /add todo/i }).click();

              const milkToggle = page.getByRole('button', { name: 'Milk' });

              // Establish that marking worked before exercising unmarking.
              await milkToggle.click();
              await expect(milkToggle).toHaveAttribute('aria-pressed', 'true');
              await expect(page.getByRole('status')).toHaveText(/\b0\b/);

              await milkToggle.click();

              await expect(milkToggle).toHaveAttribute('aria-pressed', 'false');
              await expect(page.getByRole('status')).toHaveText(/\b1\b/);
            });

            test('marking one of two todos shows count of 1', async ({ page }) => {
              await page.goto('/');
              for (const t of ['Milk', 'Bread']) {
                await page.getByRole('textbox', { name: /todo item/i }).fill(t);
                await page.getByRole('button', { name: /add todo/i }).click();
              }

              const milkToggle = page.getByRole('button', { name: 'Milk' });
              await milkToggle.click();

              await expect(page.getByRole('status')).toHaveText(/\b1\b/);
              await expect(milkToggle).toHaveAttribute('aria-pressed', 'true');
              await expect(
                page.getByRole('button', { name: 'Bread' })
              ).toHaveAttribute('aria-pressed', 'false');
            });
      explanation: |
        The suite uses semantic locators and separate observations for toggle state, count, and item visibility. The single-item test checks the done state before unmarking, so a toggle that ignores both clicks cannot masquerade as a successful round trip. These observations tolerate changes to the strikethrough color, decorative icon, and words around the count while the exposed roles and states stay the same. Each test covers its own path: a bug may be detected by one test while the other tests still pass.

    quiz:
      title: "Step 7 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            A "checkout" feature has three spec'd promises:

            1. After paying, the user sees an order confirmation.
            2. The order ID is shown so the user can reference it later.
            3. A confirmation email is sent (verifiable via a test mailbox).

            Which set of specificity choices BEST matches the spec?
          type: single
          options:
            - "All three pinned with `toHaveText` (exact match) for maximum strictness"
            - "Promise 1 loose, Promise 2 tight on order ID, Promise 3 tight on email arrival"
            - "All three with `toBeVisible()` to keep the test minimal"
            - "Skip Promise 3 because emails are too hard to test"
          correct_index: 1
          option_feedback:
            0: "Pinning Promise 1 with exact `toHaveText` means any wording change to the confirmation message (\"Order confirmed\", \"Thank you for your order\", \"Order placed\") breaks the test for no behavior reason. That's the over-specification trap."
            1: "Right. Each promise gets the specificity its spec demands. Promise 1 (\"user sees confirmation\") is loose-specced — wording isn't promised, so Goldilocks. Promise 2 (\"order ID shown\") IS the contract — the specific ID matters. Promise 3 (\"email is sent\") is binary reality — the email either arrived or didn't, so a tight assertion against the test mailbox is appropriate."
            2: "`toBeVisible()` for Promise 2 (\"order ID shown\") doesn't verify the ID is correct — only that *something* renders. A bug that shows a hardcoded \"ORDER-XXX\" instead of the real ID would pass this assertion. Under-specified."
            3: "Email IS the contract for Promise 3 — skipping it means the test can't catch the most expensive failure mode (the user didn't get their receipt). Use a test mailbox or queue inspection. \"Hard to test\" is a maintenance argument, not a spec argument."
          explanation: |
            Multi-promise features need **per-promise** specificity decisions. Each promise has its own answer to "what exactly is this asserting, and what's allowed to change?" Pinning everything strictly creates a brittle suite; pinning everything loosely creates a leaky one. The skill is judgment: read each promise, decide its specificity independently.

        - question: |
            Your team built a notifications panel with these spec'd behaviors:

            - Unread notifications show a badge with the count; its color is not specified.
            - Clicking the bell icon opens the panel.
            - Notifications are listed in reverse chronological order.

            A designer changes the badge color from red to orange (no spec change). The team's e2e test fails because it asserts `await expect(badge).toHaveCSS('background-color', 'rgb(239, 68, 68)')`.

            What's the right diagnosis?
          type: single
          options:
            - "Real regression — the badge color is part of the spec"
            - "False alarm — the test pinned implementation (RGB color), not the spec's promise (count)"
            - "The team should add `red` and `orange` as accepted values to the assertion"
            - "Designers shouldn't change colors without updating tests"
          correct_index: 1
          option_feedback:
            0: "The spec promises a badge with the count, and explicitly leaves its color open. A different color alone does not violate this contract."
            1: "Right. The test pinned the *RGB color value* (`rgb(239, 68, 68)`) — implementation. The spec's promise is \"badge with the count\" — the count is the contract, not the specific color shade. Using a matcher for the complete unread count would survive any color change while still verifying the user-facing behavior."
            2: "Adding multiple accepted colors is a maintenance smell — every redesign expands the OR-list. The deeper fix is to stop testing the color at all if the color isn't in the spec."
            3: "Tests should adapt to design changes, not vice versa. If the test breaks for a design refresh that didn't change the spec, the test is brittle — that's exactly Step 5's lesson applied to assertions instead of locators."
          explanation: |
            The principle works on both sides — locators (Step 5) and assertions (Step 6). When an assertion pins something the spec doesn't promise (specific color, exact wording, internal classnames), it generates false alarms. The fix is to find the user-facing promise and pin only that.

        - question: |
            **(Spaced review — Steps 1–6, the integration question)** Imagine you're writing an e2e test for a new feature, **before any code exists**. Which is the most useful first step?
          type: single
          options:
            - "Open the Playwright codegen tool and click through a planned flow"
            - "Identify the required outcomes and changes the tests should tolerate"
            - "Look at existing tests for similar features and copy the locator and assertion patterns"
            - "Write the assertion first, then work backward to the actions"
          correct_index: 1
          option_feedback:
            0: "Codegen needs a running interface and records interactions. It cannot decide which requirements those interactions should verify."
            2: "Existing tests may illustrate syntax, but their locators and assertions reflect another feature's requirements."
            3: "Working backward from an assertion is useful once the required outcome is clear. First decide what observation would distinguish correct behavior from a regression."
          explanation: |
            Start with the feature's requirements. Identify observable outcomes, relevant user paths, and harmless changes before choosing the actions, locators, and assertions that test them.


  # ==========================================================================
  # STEP 8 — From-Scratch Capstone (Tutorial Hell escape hatch)
  # Pedagogy:
  #   PRIMM Make rung — student writes a complete Playwright test from
  #     behavior requirements and an empty file (only the `import` line).
  #   No stubs, no TODO comments, no per-line scaffold. Just behavior +
  #     intent + an empty buffer.
  #   This is the moment the training wheels come off. Every prior step
  #     was Read / Predict / Modify; this is Make-from-scratch.
  # ==========================================================================
  - title: "From-Scratch Capstone: Tests From Behavior Requirements"
    instructions: |
      ### Why this matters

      The next challenge is choosing the setup, actions, and assertions yourself. This step starts from behavior requirements and a test file without an implementation, so you can practice combining the decisions from earlier lessons.

      ### 🎯 You will learn to

      - Create a complete Playwright test — from `import` to closing `});` — given only a behavior spec
      - Apply every prior step's discipline (input partitions, locator ladder, web-first assertions, per-promise specificity) without a stub to lean on
      - Evaluate your own test against the gates: does it survive harmless refactors *and* catch real regressions?

      ### 🪜 Plan before writing

      The file contains an import and a reminder of the requirements. Begin by identifying the two user paths and the observations each needs. Try drafting from memory first; if you get stuck, use a hint or revisit an earlier example, then return and explain your own choices.

      ### 📋 The spec — read carefully, don't skim

      The Todo app from Step 7 supports marking items as **done**. The team has just added a small new spec promise:

      > **Promise.** When *every* todo in the list is marked done, the remaining-count display shows the number `0` (the surrounding wording may change), and **all the original todos remain visible** (done items are not deleted from the list).

      Two specific user paths the team wants covered:

      1. *Mark-all-then-check.* Add three todos. Mark all three as done. The count should read 0; all three items should still be in the list.
      2. *Toggle-back-restores.* Add two todos. Mark both done. Then unmark one. The count should be 1; both items still in the list.

      ### ✏️ Write the test

      Open `tests/all-done.spec.js`. Write **two** tests covering the two user paths above. Both must:

      - Use `getByRole` / `getByLabel` for every locator (no CSS classes, no XPath).
      - Use `await expect(...)` for every assertion (no synchronous `expect(await locator.isVisible()).toBe(true)`).
      - Match assertion specificity to spec specificity: the count number IS the contract, but the wording around it ("0 items remaining" vs "0 todos pending") is not.

      ### 📋 What the gates check

      The gates execute your suite against an instructor-owned correct app and several variants. Your tests must pass the correct app, catch broken counts, broken unmarking and lost todos, and survive wording and CSS changes. They use the test file for this step only; test names, quote styles and equivalent assertions are your choice.

      These checks sample important regressions; passing them does not prove that a suite detects every possible bug.

      Use **Test** to inspect your suite's results, then **Test My Work** to check it against the app variants. Before finishing, explain which assertion would detect each broken promise and which harmless changes your suite should tolerate.

