    quiz:
      title: "Step 2 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            Which of these scenarios is the BEST candidate for an **end-to-end** test (rather than a unit or integration test)?
          type: single
          options:
            - "Validating that 47 different email-format edge cases all produce the right error message"
            - "Verifying a guest who tries to checkout is prompted to sign in, and their cart is preserved"
            - "Checking that the cart-total formatter rounds half-up correctly for 30 currency formats"
            - "Confirming the API endpoint returns the right HTTP status for 12 different input shapes"
          correct_index: 1
          option_feedback:
            0: "47 email validation cases is exactly what unit tests are for. Each is cheap and isolated. Running 47 full-browser e2e tests would be slow, flaky, and overkill — a single e2e test (\"invalid email shows an error\") proves the wiring works; the 47 edge cases belong in unit tests."
            1: "Right. This needs the *full stack* — UI, routing, session, cart persistence, sign-in flow. No lower test layer covers all of those at once. This is exactly what e2e tests are best at."
            2: "30 formatter cases are a unit-test job. They're deterministic and fast in isolation. E2E them and you'd burn minutes per CI run for coverage that pytest gets in milliseconds."
            3: "API contract tests are an integration-layer concern, not e2e. They don't need a browser — they need a request library and the API. Doing this through e2e adds cost without adding confidence."
          explanation: |
            E2E tests are *expensive* confidence. Spend that budget on flows where the full integration matters: auth, routing, state-across-pages, cross-service behaviors. Push validation rules, formatters, and API contracts to lower test layers where they're cheaper and clearer.

        - question: |
            A developer renames the Add button's CSS class without changing its role, accessible name, or behavior. What should happen to a behavior-focused test?
          type: single
          options:
            - "It should fail because any UI code change is a regression"
            - "It should pass because the tested contract is unchanged"
            - "It should skip the Add action until the test is updated"
            - "It should pass only after the old CSS class is restored"
          correct_index: 1
          option_feedback:
            0: "A code change is a regression only if it breaks required behavior. The role, name, and outcome are unchanged here."
            2: "Skipping the action removes the behavior the test is meant to verify. A stable locator lets the same test keep exercising it."
            3: "Restoring an incidental class would make the implementation depend on the test. Locate the button through its unchanged semantics instead."
          explanation: |
            A behavior-focused test should survive implementation changes that preserve its contract. The button's role and accessible name still identify the same action after its CSS class changes.

        - question: |
            **(Spaced review — Step 1)** A Playwright test contains the line:

            ```javascript
            expect(await page.getByText('Saved').isVisible()).toBe(true);
            ```

            Which is the most accurate critique?
          type: single
          options:
            - "This is the canonical Playwright pattern — `isVisible()` returns a Promise that we resolve with `await`"
            - "This is an anti-pattern — `isVisible()` does not auto-wait; use `await expect(...).toBeVisible()`"
            - "The test is fine as long as the page loads quickly enough"
            - "The `expect` should be wrapped in `await` for compilation reasons"
          correct_index: 1
          option_feedback:
            0: "The Playwright docs explicitly call this an **anti-pattern**. `isVisible()` is a one-shot check — it returns immediately, with no retry. The web-first form `await expect(locator).toBeVisible()` retries until the timeout."
            1: "Right. `isVisible()` is non-retrying — if the element isn't there *right now*, the assertion fails. The web-first form `await expect(...).toBeVisible()` retries until the condition holds or the timeout expires. The Playwright official best practices specifically call out this exact line as a thing to avoid."
            2: "\"Loads quickly enough\" is the recipe for flaky CI: it works locally, fails on a slow build agent, and nobody can reproduce it. Use `await expect(...)` and let Playwright handle the timing."
            3: "The compilation works either way. The issue isn't compilation — it's *correctness under async*. The non-retrying form silently produces flaky tests, which is the worst kind of failure."
          explanation: |
            `expect(await locator.isVisible()).toBe(true)` is the canonical Playwright anti-pattern. Always use `await expect(locator).toBeVisible()` — the web-first form auto-waits and retries.


  # ==========================================================================
  # STEP 3 — The locator ladder: stable contracts vs incidental UI
  # LO2 part B (locators) + LO4 priming (locator brittleness).
  # CLT element-interactivity: 3 novel elements (locator ladder, name regex,
  # durability dimension).
  # Variation Theory: contrast — same scenario, 5 different locator strategies.
  # ==========================================================================
  # Pedagogy: Variation Theory contrast — same scenario, 5 locator strategies
  - title: "The Locator Ladder: Stable Contracts vs Incidental UI"
    instructions: |
      ### Why this matters

      The locator you choose is the *contract* between your test and the UI — it decides which UI changes will (correctly) break the test and which will (incorrectly) break it. Pick the wrong rung of the ladder and your test either fails on every CSS rename (false alarms that erode trust) or stays green when accessibility regresses (silent failures). The locator ladder is how you make that choice deliberately, not by accident.

      ### 🎯 You will learn to

      - Analyze five locator strategies and identify what each one depends on (semantics vs implementation)
      - Apply the locator ladder to choose the highest rung the UI actually supports
      - Evaluate locator durability against three classes of refactor (CSS rename, text change, DOM restructure)

      ### 🧠 Quick recall — commit before reading on

      **Q.** Which property can identify the Add button while surviving the CSS class rename discussed in Step 2?

      - (a) Its styling class in the current layout.
      - (b) Its unchanged button role and accessible name.
      - (c) Its position as the first button on the page.
      - (d) Its DOM path through the surrounding wrappers.

      <details markdown="1"><summary>Reveal</summary>

      **(b).** The button's role and accessible name identify the action independently of its styling. Class names, button positions, and wrapper structure can change without changing the action.

      </details>

      ### 🎯 The locator ladder

      These examples show common ways to find buttons and form controls in Playwright. Each rung depends on something *different* about the UI.

      ```javascript
      // Button queries, plus a label query for the input:

      // Rung 1 — Role + accessible name. Mirrors how assistive tech finds it.
      page.getByRole('button', { name: /add/i });

      // Rung 2 — Label association (best for form controls).
      page.getByLabel(/todo item/i);   // (this would find the input, not the button)

      // Rung 3 — Text content (visibility is checked separately).
      page.getByText('Add todo');

      // Rung 4 — Author-supplied stable test ID.
      page.getByTestId('add-todo');

      // Rung 5 — Raw CSS/DOM selector (last resort).
      page.locator('.add-todo-btn');
      ```

      **What each rung depends on:**

      | Rung | Locator | Depends on |
      | --- | --- | --- |
      | 1 | `getByRole` + `name:` | The control's role and accessible name |
      | 2 | `getByLabel` | An associated label, `aria-label`, or `aria-labelledby` |
      | 3 | `getByText` | Text content; strings match substrings unless `exact: true` is set |
      | 4 | `getByTestId` | An author-added `data-testid` attribute |
      | 5 | `.locator('.css-class')` | The DOM/CSS structure (implementation detail) |

      Higher rungs depend on **accessible / user-visible** facts. Lower rungs depend on **implementation** decisions (CSS classes, DOM positions). The official Playwright docs put it bluntly: *"Your DOM can easily change … Prefer user-facing attributes to XPath or CSS selectors."*

      ### 🎬 Predict — commit to a letter, then click reveal

      The team is about to ship three independent changes to the Add button: a CSS-class rename (`.add-todo-btn` → `.primary-btn`), a button-text change (`"Add todo"` → `"Add"`), and a DOM restructure (the button moves into a different parent element). The user-visible behavior — clicking it adds a todo — doesn't change.

      **Q.** Of the five locators above, **which two would survive *all three* changes** without a single edit?

      - (a) Rungs 1 and 4 — `getByRole('button', { name: /add/i })` and `getByTestId('add-todo')`.
      - (b) Rungs 1 and 3 — both query user-visible text in some form.
      - (c) Rungs 2 and 5 — both target form-control specifics.
      - (d) None — every locator breaks on at least one change.

      <details markdown="1"><summary>Reveal — pick first, then click</summary>

      **(a).** `getByRole('button', { name: /add/i })` survives all three: regex tolerance covers the text change ("Add" still matches `/add/i`); the role-based query is independent of CSS classes and DOM ancestry. `getByTestId('add-todo')` survives because the data-testid is author-controlled and travels with the element wherever it moves. The exact-text query breaks on the text change and the class query breaks on the CSS rename. The label query targets the input, so it is not another way to find this button. The investigate-table below shows the per-cell answer if you want the full breakdown — but the *lesson* lands in those two rows.

      </details>

      ### ▶ Run

      Click **Test**. All five examples currently work against the Todo app — the file `tests/locator-ladder.spec.js` has one test per rung, all passing.

      ### 🔍 Investigate — reveal the answer table

      ```text
                                  CSS rename    Text change    DOM restructure
      ----------------------------------------------------------------------
      1. getByRole({name:/add/i})    ✓              ✓ (a)         ✓
      2. getByLabel                  ✓              ✓ (b)         ✓
      3. getByText('Add todo')       ✓              ✗              ✓
      4. getByTestId('add-todo')     ✓              ✓              ✓
      5. .locator('.add-todo-btn')   ✗              ✓              ✓ (c)
      ```

      Notes:
      - **(a)** With a regex `/add/i`, the role locator survives "Add todo" → "Add" (regex still matches). With an exact `name: 'Add todo'` it would break. Regex tolerance is a *deliberate design choice*.
      - **(b)** `getByLabel` finds inputs via their `<label>` — button labels don't apply, so this rung doesn't really apply to buttons. Listed for completeness.
      - **(c)** This class-only selector does not depend on ancestry, so moving the button leaves it working. An ancestry-dependent selector such as `.todo-row > button` would break.

      **The pattern**: `getByTestId` and this deliberately tolerant role query both survive the stated button-text change. But `getByTestId` requires the *author* to have added the test ID — a code-level decision. And test IDs done badly (`<button data-testid="blue-btn-right-col">`) are just CSS coupling under another name.

      ### ✏️ Modify

      Open `tests/locator-ladder.spec.js`. The fifth test uses the brittle `.locator('.add-todo-btn')` form. **Rewrite it as a role-based locator** (Rung 1). Run again — your refactored test should still pass.

      ### 📝 House rule

      **Pick the locator that matches the *stable contract* of this UI element.** If the button label is part of the user-visible promise, use `getByRole` with a sensible regex. If the wording will change but the action is permanent, use `getByTestId` with a **semantically named** test ID. Use raw CSS only when nothing else will do — and write a comment explaining why.

