title: "Playwright Tutorial: End-to-End Testing for React Apps"
description: "Translate the testing concepts from Testing Foundations into the browser. Write end-to-end tests in Playwright that test behavior, not implementation — tests that survive harmless refactors and fail for real bugs."

# Authoring-time Bloom-verb objectives. Not yet rendered to students.
learning_objectives:
  - "Apply semantic locators (`getByRole`, `getByLabel`, `getByText`) to write Playwright tests that remain stable across CSS refactors."
  - "Distinguish retrying web-first assertions (`await expect(locator).toBeVisible()`) from a non-retrying visibility snapshot (`expect(await locator.isVisible()).toBe(true)`)."
  - "Analyze a failing test to determine whether the fault is in the test, the locator, or the application code."
  - "Evaluate trade-offs between brittle, goldilocks, and loose locator specificity."
  - "Write a complete Playwright test from a behavior spec, using arrange / act / assert structure."

backend: react
require_tests: true
autosave_type: files
editor_split: true
run_label: "Test"

playwright:
  enabled: true
  test_files:
    - "tests/*.spec.js"
  app_files:
    - "src/App.jsx"
    - "src/main.jsx"
    - "src/styles.css"
  timeout: 3000
  reset_between_tests: true

steps:

  # ==========================================================================
  # STEP 1 — Anatomy of a Playwright test: navigate, interact, assert
  # LO1: Use basic Playwright syntax.
  # CLT element-interactivity audit: 3 novel elements (Playwright API, async/await,
  # AAA → navigate-interact-assert mapping).
  # Faded scaffolding: fully worked annotated test. Predict + modify in PRIMM.
  # ==========================================================================
  # Pedagogy: PRIMM — worked example with Predict + Modify
  - title: "Anatomy of a Playwright Test: Navigate, Interact, Assert"
    instructions: |
      ### Why this matters

      A common Playwright browser test follows three phases: navigate to the page, interact with the UI, and assert what the user sees. Recognizing those phases helps you read a test and decide what behavior it actually verifies.

      ### 🎯 You will learn to

      - Analyze a basic Playwright test and identify how each line maps onto the **Arrange / Act / Assert** pattern from Testing Foundations
      - Apply the navigate-interact-assert rhythm to read unfamiliar Playwright tests at a glance

      In Testing Foundations you wrote tests like this:

      ```python
      def test_valid_name_accepted():
          assert squad_name_valid("epic") is True
      ```

      That test verifies one **function in isolation**. A Playwright test verifies a whole **React app through a real browser, the way a user experiences it**. Same AAA bones, different organism.

      This tutorial runs a supported subset of Playwright's API against the live app in your browser. **Test** runs your test files against the app in your editors. **Test My Work** checks the lesson requirements; later steps also run your suite against reference apps and deliberately faulty variants. Passing those checks enables the next lesson activity.

      ### 🔄 Concept bridge

      | Testing Foundations (pytest) | Playwright (e2e) |
      | --- | --- |
      | Arrange / Act / Assert | Navigate / Interact / Assert |
      | Function inputs | User actions through the UI |
      | Direct return value | Observable outcome on the page |
      | Often synchronous assertions on values | Await browser actions and web-first assertions |
      | Strong oracle = `==` exact match | Strong oracle = `toHaveText`, `toHaveCount`, … |

      The discipline is the same. The mechanics differ.

      ### 🌳 Primer: what `getByRole` actually queries

      Before you read the test, lock in this concept — every locator in the test below depends on it.

      Semantic HTML elements such as buttons and headings have **implicit roles**. Browsers expose roles, names, states, and text to assistive technology through the **accessibility tree**, which is derived from the DOM. A generic container does not acquire button semantics just because it has a click handler.

      | HTML | Implicit role | Accessible name source |
      | --- | --- | --- |
      | `<button>Save</button>` | `button` | the visible text "Save" |
      | `<input type="text">` | `textbox` | a `<label for=...>` or `aria-label` |
      | `<a href="...">Home</a>` | `link` | the visible link text |
      | `<ul><li>X</li></ul>` | `list` containing `listitem` | (none — structural) |
      | `<h2>Settings</h2>` | `heading` | the visible heading text |
      | `<div onclick=...>Click me</div>` | no implicit `button` role | Text can be read, but the element lacks button semantics |

      **`page.getByRole('button', { name: /add todo/i })` locates DOM elements by their accessible role and name.** It matches buttons whose accessible name contains "add todo", ignoring case. CSS classes and wrapper elements do not enter that query.

      Why this matters:
      - **Locators stay stable across CSS refactors** — change the class, change the layout, the locator still works.
      - **Role locators can expose semantic regressions** — replacing `<button>` with a plain `<div onclick="...">` removes its button role and native keyboard behavior. The role locator stops finding the control even though its text remains readable.
      - **Passing a role query is not a complete accessibility audit** — keyboard operation, contrast, and other requirements still need their own checks.

      Creating a locator is synchronous: it describes how to find an element later. Actions and web-first assertions resolve that locator against the current page. See Playwright's [locator guide](https://playwright.dev/docs/locators).

      ### Read this test (don't run yet)

      ```javascript
      import { test, expect } from '@playwright/test';

      test('user can add a todo', async ({ page }) => {
        await page.goto('/');                                                  // Navigate
        await page.getByRole('textbox', { name: /todo item/i }).fill('Milk');  // Interact
        await page.getByRole('button', { name: /add todo/i }).click();         // Interact
        await expect(page.getByRole('listitem')).toHaveText('Milk');           // Assert
      });
      ```

      Annotations that matter:

      - `async ({ page }) => { … }` — this callback uses `await` for asynchronous browser operations. `page` is the browser-page fixture. A test that performs only synchronous checks need not be `async`.
      - `await` waits for each browser operation before continuing. Locator creation and ordinary JavaScript statements do not need it.
      - `getByRole('button', { name: /add todo/i })` — describes a button whose accessible name matches the regular expression.
      - `await expect(...).toHaveText('Milk')` — the matcher retries until the text matches or its timeout expires. Awaiting its Promise keeps the test from finishing before that check completes.

      <details markdown="1"><summary>⚠️ Negative-transfer trap: this is *not* React Testing Library or Jest</summary>

      If you've used **React Testing Library (RTL)** with Jest, the API looks deceptively similar — `getByRole`, `getByText`, `expect(...).toBeVisible()`. The methods have *the same names* but different machinery underneath:

      | Comparison point | React Testing Library + Jest | Playwright |
      | --- | --- | --- |
      | Browser environment | commonly jsdom under Jest | Chromium, Firefox, or WebKit |
      | Typical setup | render the component under test | load the app in a browser |
      | `getByRole(...)` | returns an element or throws immediately | synchronously returns a lazy locator |
      | `expect(x).toBeVisible()` | synchronous Jest matcher | `await expect(locator).toBeVisible()` — async, auto-retries |
      | A failing assertion | matcher diagnostic; helpers may print DOM | matcher diagnostic; screenshots and traces depend on configuration |
      | Snapshot tests | can compare serialized markup | can compare visuals or accessibility structure when those are required |
      | Test focus | observable component behavior | observable application behavior |

      Three habits for these exercises:

      1. **Use web-first assertions for UI outcomes.** `expect(await locator.isVisible()).toBe(true)` checks one observation and can race a changing page. `await expect(locator).toBeVisible()` retries.
      2. **Choose an assertion that matches the requirement.** These exercises need text and count checks. In a real project, [visual comparisons](https://playwright.dev/docs/test-snapshots) are useful when appearance is part of the contract, but require controlled rendering conditions and reviewed baselines.
      3. **Don't probe component internals.** "Was prop X passed?" "Is `useState` set to Y?" — those are unit-test concerns. Playwright sees what the browser renders. If a behavior isn't observable through the UI, it's not Playwright's job to verify.
      </details>

      ### 🎬 Predict — commit to a letter, then click reveal

      Read the test above and pick one answer for each question. **Commit** (out loud, on paper, or in your head) before opening the reveal — predicting *something* is what primes the encoding; skim-and-reveal is no learning.

      **Q1.** If we changed `name: /add todo/i` to `name: /save/i`, what happens?

      - (a) The test still passes — `getByRole` matches buttons by role, not name.
      - (b) The test fails fast — Playwright throws "no such button" on the next line.
      - (c) The click retries until the configured wait expires — 3 seconds in this tutorial.
      - (d) Compile error — `name:` requires a string literal, not a regex.

      <details markdown="1"><summary>Reveal — pick first, then click</summary>

      **(c).** Creating the locator returns immediately; the awaited `click()` waits for a matching, actionable button. No "Save" button appears, so that operation times out. This tutorial configures a 3000 ms limit; a real project's [test and assertion timeouts](https://playwright.dev/docs/test-timeouts) are configurable. The `name` filter is enforced, and it accepts a regular expression.

      </details>

      **Q2.** Which line is the **Assert** step?

      - (a) `await page.goto('/')`
      - (b) `await page.getByRole('textbox', ...).fill('Milk')`
      - (c) `await page.getByRole('button', ...).click()`
      - (d) `await expect(page.getByRole('listitem')).toHaveText('Milk')`

      <details markdown="1"><summary>Reveal</summary>

      **(d).** In this test, the `expect(...)` call checks the outcome. `goto`, `fill`, and `click` set up or change the page; they do not verify that the submitted text appears.

      </details>

      ### ▶ Run

      Click **Test** in the Live Preview toolbar. The test passes against the demo Todo app.

      ### 🔍 Investigate

      Each action and web-first assertion here returns a Promise. `await` makes the test wait for that operation to finish. Awaiting a click sequences the actions; awaiting the retrying assertion then verifies the resulting UI. Omitting `await` does not turn retries off: it lets the test continue without waiting for their result. See Playwright's [assertion guide](https://playwright.dev/docs/test-assertions).

      ### ✏️ Modify — predict the failure shape, then run

      Change the assertion to look for `'Bread'` instead of `'Milk'`. Before you click Test, commit to one of these:

      - (a) Locator-not-found timeout (no element matched).
      - (b) Text mismatch — the failure message names both the *expected* (`Bread`) and *actual* (`Milk`) text.
      - (c) Both — Playwright reports two failures.
      - (d) The test passes — `toHaveText` does a substring match.

      Run, then check your prediction.

      <details markdown="1"><summary>Reveal</summary>

      **(b).** The locator finds the listitem (it exists); the assertion fails on the text comparison and the failure message includes both expected and actual. Building the habit of *predicting the failure message shape* is the difference between debugging by reading and debugging by guessing.

      </details>

      Restore the expected text to `'Milk'` and run **Test** again to confirm it passes. Then click **Test My Work** to complete the step's checks before continuing. The temporary failure was an investigation, not the final submission.

      ### 📝 House rule (carry it forward)

      A Playwright test reads **navigate → interact → assert**. The test title is the *spec* — what user-visible promise we're proving — not a description of clicks.

    files:
      - path: "src/App.jsx"
        reseed: true
        language: "javascript"
        content: |
          function App() {
            const [items, setItems] = React.useState([]);
            const [text, setText] = React.useState('');

            function addTodo() {
              const trimmed = text.trim();
              if (!trimmed) return;

              setItems([...items, trimmed]);
              setText('');
            }

            return (
              <main className="todo-shell">
                <section className="todo-panel">
                  <p className="eyebrow">Playwright tutorial</p>
                  <h1>Todo Lab</h1>

                  <div className="todo-form">
                    <label htmlFor="todo-input">Todo item</label>
                    <div className="todo-row">
                      <input
                        id="todo-input"
                        value={text}
                        onChange={(event) => setText(event.target.value)}
                        placeholder="Buy milk"
                      />
                      <button onClick={addTodo}>Add todo</button>
                    </div>
                  </div>

                  <ul aria-label="Todo list" className="todo-list">
                    {items.map((item, index) => (
                      <li key={index}>{item}</li>
                    ))}
                  </ul>
                </section>
              </main>
            );
          }

      - path: "src/main.jsx"
        reseed: true
        language: "javascript"
        content: |
          const root = ReactDOM.createRoot(document.getElementById('root'));
          root.render(<App />);

      - path: "src/styles.css"
        reseed: true
        language: "css"
        content: |
          body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f6f7fb;
            color: #1f2937;
          }

          .todo-shell {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px;
          }

          .todo-panel {
            width: min(100%, 560px);
            background: white;
            border: 1px solid #d9dee8;
            border-radius: 8px;
            padding: 28px;
            box-shadow: 0 18px 40px rgba(31, 41, 55, 0.08);
          }

          .eyebrow {
            margin: 0 0 8px;
            color: #4b5563;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
          }

          h1 { margin: 0 0 24px; font-size: 2rem; }
          label { display: block; margin-bottom: 8px; font-weight: 700; }
          .todo-row { display: flex; gap: 10px; }

          input {
            flex: 1;
            min-width: 0;
            background: white;
            color: #1f2937;
            border: 1px solid #b8c0cc;
            border-radius: 6px;
            padding: 10px 12px;
            font: inherit;
          }

          button {
            border: 0;
            border-radius: 6px;
            padding: 10px 14px;
            background: #2563eb;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
          }

          .todo-list { margin: 24px 0 0; padding-left: 24px; }
          .todo-list:empty { display: none; }
          .todo-list li { margin: 8px 0; }

          /* Dark mode — the iframe inherits the host page's theme via
             [data-bs-theme="dark"] on <html>. Mirror the site's dark palette
             so the Todo app preview stays legible when students switch themes. */
          [data-bs-theme="dark"] body { background: #1c2533; color: #e6edf3; }
          [data-bs-theme="dark"] .todo-panel {
            background: #232a36;
            border-color: #2a323e;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
          }
          [data-bs-theme="dark"] .eyebrow { color: #9ca3af; }
          [data-bs-theme="dark"] input {
            background: #2a323e;
            color: #e6edf3;
            border-color: #3a4351;
          }
          [data-bs-theme="dark"] input::placeholder { color: #9ca3af; }
          [data-bs-theme="dark"] button { background: #2563eb; }

      - path: "tests/todo.spec.js"
        reseed: true
        language: "javascript"
        content: |
          import { test, expect } from '@playwright/test';

          test('user can add a todo', async ({ page }) => {
            await page.goto('/');
            await page.getByRole('textbox', { name: /todo item/i }).fill('Milk');
            await page.getByRole('button', { name: /add todo/i }).click();
            await expect(page.getByRole('listitem')).toHaveText('Milk');
          });

    open_file: "tests/todo.spec.js"

    tests:
      - description: The test passes on the working Todo app
        playwright:
          test_files:
            - tests/todo.spec.js
          app_source: starter
      - description: The test catches an added todo losing its text
        playwright:
          test_files:
            - tests/todo.spec.js
          app_source: starter
          expected: some_fail
          mutations:
            - path: src/App.jsx
              replace: setItems([...items, trimmed]);
              with: setItems([...items, '']);

    solution:
      files:
        - path: "tests/todo.spec.js"
          language: "javascript"
          content: |
            import { test, expect } from '@playwright/test';

            test('user can add a todo', async ({ page }) => {
              await page.goto('/');
              await page.getByRole('textbox', { name: /todo item/i }).fill('Milk');
              await page.getByRole('button', { name: /add todo/i }).click();
              await expect(page.getByRole('listitem')).toHaveText('Milk');
            });
      explanation: |
        The test reads as **navigate → interact → assert** — the browser version of Arrange / Act / Assert. The title (`'user can add a todo'`) describes a user-visible promise, not a click sequence. Locators use accessible roles (`getByRole`) so the test isn't tied to CSS class names. The assertion uses `await expect(...).toHaveText('Milk')` to verify the submitted text with retries.

    quiz:
      title: "Step 1 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            Which of these test titles best describes a **behavioral spec** (rather than a click-script)?
          type: single
          options:
            - "`clicks add button and waits for list`"
            - "`user can add a todo and see it in the list`"
            - "`test_add_button_click`"
            - "`test 1: form submission flow`"
          correct_index: 1
          option_feedback:
            0: "This describes the *clicks the test performs*, not the *behavior the user can do*. A future developer reading a CI failure on this title can't tell what user-facing promise broke."
            1: "Right. \"user can add a todo and see it in the list\" reads like a product promise. A failure on this test immediately tells the reader what regressed: the user can no longer add a todo."
            2: "The `test_` prefix is fine, but the rest is tied to UI mechanics (a button click) rather than user behavior. If the button becomes a link tomorrow, this title looks wrong even though the spec is unchanged."
            3: "Numbering tells the reader nothing. Imagine 30 of these — debugging a CI failure means opening each test to figure out what it does."
          explanation: |
            Test names should read like product promises, not click sequences. A good rule of thumb: if a future developer sees the test fail in CI, can they tell from the *name alone* what user-facing thing broke? If yes, the name is doing its job.

        - question: |
            Why does this Playwright assertion need `await`?

            ```javascript
            await expect(page.getByText('Milk')).toBeVisible();
            ```
          type: single
          options:
            - "JavaScript requires `await` on every line in async functions"
            - "`await` waits for the retrying matcher to finish"
            - "`await` makes the test go faster"
            - "Without `await`, the test won't compile"
          correct_index: 1
          option_feedback:
            0: "Ordinary statements and locator creation do not need `await`. This matcher returns a Promise, and awaiting it keeps the test waiting for the assertion's result."
            1: "The matcher retries whether or not its Promise is awaited. `await` makes the test wait for success or failure instead of continuing or finishing while that check is still pending."
            2: "`await` doesn't speed anything up — if anything, it pauses execution. Its job is *correctness under async*, not performance."
            3: "The code still parses. The problem is an unawaited Promise: the test may finish before the assertion settles, producing unreliable results or an error after the test has ended."
          explanation: |
            `await expect(locator).matcher()` waits for the web-first matcher's retries to finish. Omitting `await` does not remove retry behavior; it removes the test's wait for the result.

        - question: |
            In the test below, which line is the **Assert** step?

            ```javascript
            test('user can add a todo', async ({ page }) => {
              await page.goto('/');                                                  // Line 1
              await page.getByRole('textbox', { name: /todo item/i }).fill('Milk');  // Line 2
              await page.getByRole('button', { name: /add todo/i }).click();         // Line 3
              await expect(page.getByText('Milk')).toBeVisible();                    // Line 4
            });
            ```
          type: single
          options:
            - "Line 1 — `page.goto('/')` confirms we landed on the right page"
            - "Line 4 — `await expect(...).toBeVisible()` checks the user-visible outcome"
            - "Lines 2 and 3 together — they perform the action under test"
            - "All four lines are assertions in async code"
          correct_index: 1
          option_feedback:
            0: "Line 1 is **Navigate** (the e2e equivalent of Arrange). It puts the page in the starting state but doesn't verify anything."
            1: "Right. Line 4 is the only line whose job is to *check* an outcome. The others set up state (`goto`) or perform actions (`fill`, `click`). The assertion is what confirms the user's promise was met."
            2: "Lines 2 and 3 are **Interact** (Act): the user types into the input and clicks the button. They produce the new state but don't verify it."
            3: "In this example, `expect(...)` checks the required outcome. `goto`, `fill`, and `click` prepare or act on the page without verifying that the todo appears."
          explanation: |
            Playwright's navigate / interact / assert is the same shape as foundations' Arrange / Act / Assert. Each test should have **one assertion phase** that verifies the user-visible promise. If you can't point to which line is the assertion, the test probably isn't proving what you think.


  # ==========================================================================
  # STEP 2 — Choosing what user paths deserve a test
  # LO2 part A: select user-path partitions for an e2e test.
  # CLT element-interactivity: partition-as-user-path mapping.
  # Builds on Step 1 syntax.
  # Faded scaffolding: 3-of-4 tests provided; student writes the 4th.
  # ==========================================================================
  # Pedagogy: worked example with fading — 3 of 4 tests provided, student writes the 4th
  - title: "User Paths and Input Partitions"
    instructions: |
      ### Why this matters

      Choosing representative user paths helps a small test suite catch meaningful bugs. Start with the behavior the feature promises, then identify inputs that should produce different outcomes.

      ### 🎯 You will learn to

      - Apply input-space partitioning from Testing Foundations to user-path partitioning in e2e
      - Evaluate which user paths deserve an e2e test versus a lower test layer

      ### 🧠 Quick recall — commit before reading on

      **Q.** Why does Playwright need `await` in front of `expect(locator).toBeVisible()`?

      - (a) JavaScript requires `await` on every line in async functions.
      - (b) The matcher returns a Promise; `await` keeps the test waiting for its result.
      - (c) `await` makes the test go faster.
      - (d) Without `await`, the test won't compile.

      <details markdown="1"><summary>Reveal</summary>

      **(b).** The matcher retries until the condition holds or the timeout expires. Without `await`, those retries can still run, but the test continues without waiting for their result and may finish too soon.

      </details>

      ### From foundations partitions to user-path partitions

      In Testing Foundations, you partitioned the **input space** of a function and picked one representative input per partition. In e2e, you partition the **user-path space** — the different user behaviors a feature has to support — and pick one representative test per partition.

      Same discipline. Different domain.

      ### The feature's contract

      The app trims the submitted text, rejects an empty result, and adds any non-empty result to the list. After a successful add, it clears the input. A 200-character todo is valid.

      Tests should catch changes to those outcomes while surviving harmless CSS class renames and restyling. The textbox label, Add button's accessible name, and list semantics give you ways to locate the controls without depending on their styling.

      ### 🎬 Predict — which user-path partitions are missing?

      Three tests are pre-written in `tests/add-todo.spec.js`. They cover:

      1. **Happy path** — `"Milk"` is accepted.
      2. **Empty input** — `""` is rejected.
      3. **Very long input** — a 200-character string is accepted.

      The app **trims input before deciding**. Which input case is missing from the tests?

      *(In your head, before reading on…)*

      <details><summary>Reveal</summary>

      The missing partition is **whitespace-only input** (`"   "`). After trimming, it equals `""`, so the spec says it should be rejected — exactly like the empty-string case from the partition perspective, but with a different surface input.

      </details>

      ### ▶ Run

      Click **Test**. Three tests pass; the fourth is a `// TODO` you'll fill in next.

      ### ✏️ Modify — write the missing partition test

      In `tests/add-todo.spec.js`, find the `whitespace-only input is rejected` test. The Arrange / Act / Assert comments are placeholders — fill them in, following the pattern of the three tests above.

      Hints will appear on test failure — work through them in layers if you get stuck.

      ### 🔍 Investigate

      You now have **four tests for one feature**, each covering a different partition. Why not write a test for *every* possible input?

      The foundations answer applies: representative coverage with low cost. We don't need a separate test for `"  "`, `"   "`, `"    "`, `" "`, … — they're all in the same partition (whitespace-only) and the trimming logic processes them identically. **One representative test per partition** is enough.

      ### 📝 House rules added

      - **Use partitions to choose user paths.** You don't need a test for every string. You need one test per behaviorally-distinct partition.
      - **Not every test belongs in e2e.** Many edge cases live more cheaply in unit tests. Reserve e2e tests for behaviors that need full-stack browser confidence.

