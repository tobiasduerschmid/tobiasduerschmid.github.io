    solution:
      files:
        - path: "tests/all-done.spec.js"
          language: "javascript"
          content: |
            import { test, expect } from '@playwright/test';

            test('marking every todo done shows count 0 and keeps all items visible', async ({ page }) => {
              await page.goto('/');

              for (const t of ['Milk', 'Bread', 'Eggs']) {
                await page.getByRole('textbox', { name: /todo item/i }).fill(t);
                await page.getByRole('button', { name: /add todo/i }).click();
              }

              for (const t of ['Milk', 'Bread', 'Eggs']) {
                await page.getByRole('button', { name: t }).click();
              }

              await expect(page.getByRole('status')).toHaveText(/\b0\b/);
              await expect(page.getByRole('listitem')).toHaveCount(3);
              for (const t of ['Milk', 'Bread', 'Eggs']) {
                await expect(page.getByRole('button', { name: t })).toBeVisible();
                await expect(page.getByRole('button', { name: t })).toHaveAttribute('aria-pressed', 'true');
              }
            });

            test('unmarking one todo restores the count to 1, both items still visible', async ({ page }) => {
              await page.goto('/');

              for (const t of ['Milk', 'Bread']) {
                await page.getByRole('textbox', { name: /todo item/i }).fill(t);
                await page.getByRole('button', { name: /add todo/i }).click();
              }

              const milkToggle = page.getByRole('button', { name: 'Milk' });
              const breadToggle = page.getByRole('button', { name: 'Bread' });

              await milkToggle.click();
              await breadToggle.click();
              await milkToggle.click();   // un-mark Milk

              await expect(page.getByRole('status')).toHaveText(/\b1\b/);
              await expect(page.getByRole('listitem')).toHaveCount(2);
              await expect(milkToggle).toBeVisible();
              await expect(breadToggle).toBeVisible();
              await expect(milkToggle).toHaveAttribute('aria-pressed', 'false');
              await expect(breadToggle).toHaveAttribute('aria-pressed', 'true');
            });
      explanation: |
        The two tests use semantic locators, count assertions that tolerate surrounding wording, and checks that the original todos remain visible. The `aria-pressed` assertions verify toggle state without depending on a CSS class.

        An exact assertion on `"0 items remaining"` breaks when product changes the wording to "0 todos pending". Checking only the count of listitems leaves a different gap: replacement items could have the right count. The solution checks both the count and the original items' visibility.

    tests:
      - description: At least two tests pass on the correct app
        playwright:
          test_files:
            - tests/all-done.spec.js
          app_source: starter
          min_tests: 2
        hints:
          - title: Begin with two user paths
            text: "Use Step 1 to recall how a test is registered. Give each required path its own test callback so a failure can identify which path needs attention."
            condition: "code_not_matches: \\btest(?:\\s*\\.\\s*(?:only|skip))?\\s*\\("
          - title: Give each path an observation
            text: "A sequence of clicks can finish even when its result is wrong. For each path, identify what the user should observe at the end and what a broken app could show instead."
            condition: "code_matches: ^(?=[\\s\\S]*\\btest(?:\\s*\\.\\s*(?:only|skip))?\\s*\\()(?![\\s\\S]*\\bexpect\\s*\\()"
          - title: Inspect the first failure
            text: "Use Test to read the first failure on the correct app. Check whether execution reaches your observations: missing awaits, an ambiguous locator, a skipped test, or an incorrect expected result can prevent this baseline check from passing."
            condition: "code_matches: ^(?=[\\s\\S]*\\btest(?:\\s*\\.\\s*(?:only|skip))?\\s*\\()(?=[\\s\\S]*\\bexpect\\s*\\()"
      - description: The suite catches a nonzero count after all three todos are done
        playwright:
          test_files:
            - tests/all-done.spec.js
          app_source: starter
          expected: some_fail
          mutations:
            - path: src/App.jsx
              replace: items.filter((item) => !item.done).length
              with: "items.length === 3 && items.every((item) => item.done) ? 10 : items.filter((item) => !item.done).length"
        hints:
          - title: Separate completion from the count
            text: "The all-done path has several outcomes. Plan an observation of the remaining count after the final toggle; an observation of the heading or the number of rows answers a different question."
            condition: "code_not_matches: \\btest(?:\\s*\\.\\s*(?:only|skip))?\\s*\\("
          - title: Trace the final toggle
            text: "List the remaining count after each of the three items is completed. Identify where your test should observe the final count, then consider whether those observations would distinguish an incorrect display."
            condition: "code_matches: ^(?=[\\s\\S]*\\btest(?:\\s*\\.\\s*(?:only|skip))?\\s*\\()(?![\\s\\S]*\\bexpect\\s*\\()"
          - title: Compare zero with ten
            text: "Imagine the same completed list showing 0 items remaining and 10 items remaining. Would your current assertion distinguish them? Use that comparison to examine how narrowly it matches the number while allowing the surrounding words to change."
            condition: "code_matches: ^(?=[\\s\\S]*\\btest(?:\\s*\\.\\s*(?:only|skip))?\\s*\\()(?=[\\s\\S]*\\bexpect\\s*\\()"
      - description: The suite catches unmarking one of two todos failing to restore the count
        playwright:
          test_files:
            - tests/all-done.spec.js
          app_source: starter
          expected: some_fail
          mutations:
            - path: src/App.jsx
              replace: "i === idx ? { ...item, done: !item.done } : item"
              with: "i === idx ? { ...item, done: true } : item"
        hints:
          - title: Exercise the reverse transition
            text: "The second path tests a transition from done back to not done. Plan how to reach the all-done state before exercising that reverse transition."
            condition: "code_not_matches: \\btest(?:\\s*\\.\\s*(?:only|skip))?\\s*\\("
          - title: Record the intermediate state
            text: "Trace two items through adding, completing both, and unmarking one. Record both toggle states beside the displayed count at each stage; then locate the observation missing from your test."
            condition: "code_matches: ^(?=[\\s\\S]*\\btest(?:\\s*\\.\\s*(?:only|skip))?\\s*\\()(?![\\s\\S]*\\bexpect\\s*\\()"
          - title: Locate the observation after unmarking
            text: "A passing assertion before the last click cannot establish what happened after it. Compare the normal final state with an app that ignores the unmark action, and identify an observation that separates them."
            condition: "code_matches: ^(?=[\\s\\S]*\\btest(?:\\s*\\.\\s*(?:only|skip))?\\s*\\()(?=[\\s\\S]*\\bexpect\\s*\\()"
      - description: The suite catches completed todos disappearing
        playwright:
          test_files:
            - tests/all-done.spec.js
          app_source: starter
          expected: some_fail
          mutations:
            - path: src/App.jsx
              replace: "{items.map((item, idx) => ("
              with: "{(items.length === 3 && remainingCount === 0 ? [] : items).map((item, idx) => ("
        hints:
          - title: Distinguish an empty list from a completed list
            text: "A zero remaining count is compatible with both an empty list and a list of completed items. Plan a separate observation of what remains visible."
            condition: "code_not_matches: \\btest(?:\\s*\\.\\s*(?:only|skip))?\\s*\\("
          - title: Observe the list after the actions
            text: "Your setup establishes that items were added. The preservation promise concerns the state after all three are marked done; identify what evidence you need at that point."
            condition: "code_matches: ^(?=[\\s\\S]*\\btest(?:\\s*\\.\\s*(?:only|skip))?\\s*\\()(?![\\s\\S]*\\bexpect\\s*\\()"
          - title: Consider hidden and removed items
            text: "Compare a correct completed list with one whose rows are removed, and one whose rows remain in the DOM but are hidden. Decide which of your observations would fail in each case."
            condition: "code_matches: ^(?=[\\s\\S]*\\btest(?:\\s*\\.\\s*(?:only|skip))?\\s*\\()(?=[\\s\\S]*\\bexpect\\s*\\()"
      - description: The suite catches completed todos losing their original text
        playwright:
          test_files:
            - tests/all-done.spec.js
          app_source: starter
          expected: some_fail
