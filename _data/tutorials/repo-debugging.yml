      title: Step 4 — Knowledge Check
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "The traceback for #231 ends in `queue()` with `KeyError: 'High'`. What does the location
            of the crash tell you?"
          options:
            - Where the bad value was used, not where it was created
            - That the bug is in `queue()`, the last line in the trace
            - That `PRIORITY_RANK` should also contain `'High'`
            - That the test sent a priority the README does not allow
          correct_index: 0
          option_feedback:
            1: "The last frame is where Python noticed the problem. `queue()` did what it was written to do
              with the data it was given."
            2: "Adding `'High'` would cover one spelling; `'HIGH'` would crash next. Rule 3 says priorities
              are stored in lowercase."
            3: Rule 3 accepts any letter case, so `High` is a valid request. The problem is what the service
              stored afterward.
          explanation: "A traceback shows where a wrong value finally caused an error. Follow the value
            backward: who stored `'High'`, and should they have stored `'high'`?"
        - type: single
          difficulty: advanced
          question: "Two hypotheses fit the 500 in #231: `queue()` mishandles letter case, or the stored
            priority is wrong. Which single observation tells them apart?"
          options:
            - "`GET /tickets/<id>` for the `High` ticket shows `High`, not `high`"
            - "`GET /queue` returns a 500 when a ticket has priority `High`"
            - "`queue()` contains the expression `PRIORITY_RANK[ticket.priority]`"
            - "`test_queue_accepts_mixed_case_priority` fails with `500 == 200`"
          correct_index: 0
          option_feedback:
            1: Both hypotheses predict that 500, so seeing it again cannot decide between them.
            2: The expression shows where the crash happens, which both hypotheses agree on. It cannot show what
              value was stored.
            3: That failure is the symptom you started from, and both hypotheses explain it.
          explanation: A discriminating observation is one the hypotheses predict differently. If the stored
            priority were lowercase, GET would show `high` and the problem would sit in `queue()`. Seeing `High`
            puts the wrong value in the store, before the queue ever runs.
        - type: multiple
          difficulty: intermediate
          question: Which of these functions write a priority into a ticket?
          options:
            - "`TicketService.create_ticket`"
            - "`TicketService.set_priority`"
            - "`TicketService.queue`"
            - "`clean_priority`"
          correct_indices: [0, 1]
          option_feedback:
            0: Creating a ticket stores its first priority, so this path must store the cleaned value.
            1: "`POST /tickets/<id>/priority` changes an existing ticket. No team test calls it, which is why
              its bug stayed hidden."
            2: "`queue()` reads priorities to sort the queue; it never assigns one."
            3: It computes the cleaned value and returns it. Whether that value is stored is up to the caller.
          explanation: Two paths write a priority, creation and the priority change. Both must store what
