        - path: helpdesk/service.py
          language: python
          content: *service_py
        - path: test_regression.py
          language: python
          content: |
            """Regression tests: one test per bug, written before the fix."""
            import pytest

            from helpdesk import create_app


            @pytest.fixture
            def app():
                return create_app()


            def create(app, title="Lost wristband", priority="normal"):
                response = app.post("/tickets", {"title": title, "priority": priority})
                assert response.status == 201, response
                return response.json


            def test_changing_priority_stores_lowercase(app):
                ticket = create(app, "Shuttle times", "low")
                response = app.post(f"/tickets/{ticket['id']}/priority", {"priority": "URGENT"})
                assert response.status == 200, response
                stored = app.get(f"/tickets/{ticket['id']}")
                assert stored.status == 200, stored
                assert stored.json["priority"] == "urgent"
      explanation: |
        **Prediction.** (b): the quick fix stops the crash, but the stored ticket still says `High`, so GET reports `High`.

        **Discrimination.** `GET /tickets/<id>` shows `High`, so the wrong value is already in the store before `queue()` runs; the queue only crashes on it.

        **Cause.** `create_ticket` and `set_priority` call `clean_priority` but ignore its return value, so the raw text (`High`, `URGENT`) is stored. `queue()` then looks up `PRIORITY_RANK['High']` and raises `KeyError`, which the API turns into a 500.

        **Fix.** Store the value that `clean_priority` returns, on both paths. Lowercasing in `queue()` or in `to_dict()` only hides the problem: the store would still break rule 3, and every other reader would need the same workaround.

        **Regression test:** change a priority with `URGENT` and assert that GET returns `urgent`. The team test covers creation only, so this test protects the second path.

  # Pedagogy: contrasting examples with an explain-the-verdict prompt (Alemdag et al. 2025; Dieterich
  # et al. 2025). Three AI patches pass the team suite: A has a visible boundary error, B drops the save,
  # and C is correct; B and C differ in one feature. Learners must accept as well as reject, so the
  # lesson samples calibrated trust rather than reflexive rejection. TiCoder (Fakhoury et al. 2024)
  # motivates judging generated code through tests the reviewer writes.
  - title: Review Three AI Patches
    key: ai-patches
    instructions: |
      ### Why this matters

      AI assistants write plausible patches quickly, and "all tests pass" sounds like proof. Reviewing a patch means judging it against the requirement, accepting it when the evidence supports it and rejecting it when it doesn't, and writing the tests that tell the two apart.

      ### 🎯 You will learn to

      - **Evaluate** AI-generated patches against the specification, not their explanations.
      - **Write** tests that accept correct patches and reject incorrect ones.

      #### The bug report

      > **#240 Can't reopen.** "An attendee found their wristband the day after we closed their ticket. Reopening it gave a 409."

      `test_reopen_next_day` fails. Three AI assistants each proposed a patch to `reopen_ticket` in `helpdesk/service.py`. None is applied yet, and some, all, or none of them may be correct.

      **Assistant A:** "The window check was inverted, so I flipped the comparison. All tests pass ✅"

      ```diff
      -        if day - ticket.closed_on <= REOPEN_WINDOW_DAYS:
      +        if day - ticket.closed_on >= REOPEN_WINDOW_DAYS:
                   raise Conflict(f"ticket {ticket_id} was closed too long ago")
      ```

      **Assistant B:** "I rewrote the end of `reopen_ticket` for readability and fixed the check. I verified that the response shows status `open`. All tests pass ✅"

      ```diff
      -        if day - ticket.closed_on <= REOPEN_WINDOW_DAYS:
      +        days_closed = day - ticket.closed_on
      +        if days_closed > REOPEN_WINDOW_DAYS:
                   raise Conflict(f"ticket {ticket_id} was closed too long ago")
      -        ticket.status = "open"
      -        ticket.closed_on = None
      -        self.store.save(ticket)
      +        ticket.status, ticket.closed_on = "open", None
               return ticket.to_dict()
      ```

      **Assistant C:** "The window check was off by one, so I rewrote it with a clearer name. All tests pass ✅"

      ```diff
      -        if day - ticket.closed_on <= REOPEN_WINDOW_DAYS:
      +        days_closed = day - ticket.closed_on
      +        if days_closed > REOPEN_WINDOW_DAYS:
                   raise Conflict(f"ticket {ticket_id} was closed too long ago")
      -        ticket.status = "open"
      -        ticket.closed_on = None
      +        ticket.status, ticket.closed_on = "open", None
               self.store.save(ticket)
               return ticket.to_dict()
      ```

      All three assistants are telling the truth about the tests.

      #### Your turn

      1. **Review each patch** against rule 7 and the storage contract. For a ticket closed on day 2, which days does each patch allow, and what does a later `GET` show?
      2. **Give a verdict.** In `debugging_log.md`, mark each patch accept, revise, or reject, with one piece of evidence: a README rule, a test result, or a fresh `GET`. Judge the code and the explanation separately.
      3. **Write tests that tell them apart.** In `test_regression.py`, add tests that fail on every patch you reject and pass on every patch you accept. **Test My Work** checks your tests against each patch for you; applying a patch by hand is optional, but undo it before you fix.
      4. **Fix.** Apply the patch you accept, or write your own. Run **Test**, then **Test My Work**.
