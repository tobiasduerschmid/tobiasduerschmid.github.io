# Practice for repository debugging rounds: one service, seven bug reports, three AI reviews.
# Every lesson reseeds the repository except code_map.md, which carries the learner's notes forward.
# Each starter is the reference package in assets/tutorials/helpdesk_grading.py plus that lesson's
# seeded fault; scripts/tests/test_repo_debugging_graders.py checks that correspondence and replays
# the checks.
title: 'Repository Debugging: From Bug Report to Reviewed Patch'
description: Practice the work of a repository debugging interview. Orient yourself in an unfamiliar
  multi-file Python service, reproduce bug reports as failing tests, fix causes instead of symptoms, and
  judge AI-generated patches and diagnoses against the spec, accepting the right ones and rejecting the
  wrong ones. For students comfortable with Python classes, dictionaries, and pytest assertions. Seven
  steps, about three to four sessions of 45–60 minutes each.
learning_objectives:
  - Orient in an unfamiliar repository by reading its documentation and tests, tracing one request end to
    end, and checking a documented claim with a learning test.
  - Reproduce a reported bug as a failing regression test before changing production code.
  - Distinguish where a failure appears from where the wrong state was created, and repair every path
    that creates it.
  - Judge whether a passing test suite establishes a requirement, and add the missing boundary case.
  - Accept or reject AI-generated patches on evidence, and write tests that tell correct patches from
    incorrect ones.
  - Detect a test edit that removes a requirement, and restore the test's intent.
  - Test an assistant's hypotheses with one discriminating observation, write a prompt that asks for
    checkable answers, and fix, test, and document the actual cause independently.
backend: pyodide
linter: true
debugger: true
pytest: true
require_tests: true
autosave_type: files
editor_split: true
output_height: 30%
progress_version: 1
# Lessons share most files; print each unchanged file once.
print_unchanged_files: false
setup_commands:
  - import pyodide_js; await pyodide_js.loadPackage('pytest')
  - import sys; sys.path.insert(0, '/tutorial'); sys.dont_write_bytecode = True
  - |
    import sys, types
    from pyodide.http import pyfetch
    for name, url in (('tutorial_test_grading', '/assets/tutorials/python_test_grading.py'),
                      ('helpdesk_grading', '/assets/tutorials/helpdesk_grading.py')):
        response = await pyfetch(url)
        response.raise_for_status()
        module = types.ModuleType(name)
        exec(await response.string(), module.__dict__)
        sys.modules[name] = module

steps:

  # Pedagogy: worked example with fading. The orientation routine (README, tests, one request traced
  # end to end, code map) is shown once with a worked trace, then practiced in every later step.
  # Shah et al. (ICER 2025) observed final-year students struggling to start from documentation and
  # to read structurally in a large codebase. PRIMM: the rename prediction exposes the response-versus-
  # store gap that later lessons rely on; a learning test then checks the README's claim (Make).
  - title: Orientation Before Debugging
    key: orient
    instructions: |
      ### Why this matters

      In a repository debugging interview, and in your first weeks on any team, you fix code you have never seen. A few minutes of structured reading tells you where to look, so you stop guessing in the wrong file.

      ### 🎯 You will learn to

      - **Trace** one request through every layer of an unfamiliar service.
      - **Verify** a documented claim with a learning test instead of trusting it.

      Every step of this tutorial uses one small repository: the help desk backend for a music festival's info tent. Each later step brings a new bug report against it. Feeling lost for the first few minutes in a new repository is normal, even for senior engineers; this routine exists because everyone starts there.

      #### How an experienced developer orients

      1. **README first.** Read `README.md`: what does the system promise? Its numbered rules are the spec. When code and README disagree, the README decides what a fix must do.
      2. **Tests second.** Skim `test_helpdesk.py` in the **Tests** pane. Tests are executable examples: `app.post("/tickets", {...})` returns a response with `.status` and `.json`.
      3. **Follow one request.** Trace one request through the layers and skip code it never reaches. A worked trace of `app.get("/tickets/1")`:

         1. `App.handle` in `helpdesk/api.py` matches the path against `r"/tickets/(\d+)"` and calls `_get` with the ID `1`.
         2. `TicketService.get_ticket` in `helpdesk/service.py` calls `_load`.
         3. `_load` asks `TicketStore.get` in `helpdesk/store.py`, which returns a deep copy of the stored ticket, or `None`; `_load` turns `None` into `NotFound`.
         4. Back in `handle`, `NotFound` becomes a 404. Otherwise `_get` returns `Response(200, ...)` built from `ticket.to_dict()`.

      4. **Write a code map.** Keep what you learn in `code_map.md`. It stays with you for the whole tutorial.

      #### Your turn

      1. **Run.** Select **Test** in the output toolbar. Every team test should pass; nothing is broken yet.
      2. **Trace.** Using the worked trace as a model, trace `POST /tickets/1/replies`, and list every method that calls `store.save()`. Write both in `code_map.md`.
      3. **Predict.** A teammate adds this method to `TicketService`:

         ```python
         def rename(self, ticket_id, title):
             ticket = self._load(ticket_id)
             ticket.title = clean_title(title)
             return ticket.to_dict()
         ```

         A request renames ticket 1. What do its response and a later `GET /tickets/1` show? (a) the new title, then the new title; (b) the new title, then the old title; (c) the old title both times; (d) a 404. Commit to a letter in `code_map.md` before you open the reveal.

         <details markdown="1"><summary>Open after you've committed to a letter</summary>

         **(b).** `_load` returns a copy. The response is built from the changed copy, but the stored ticket never changes, because nothing calls `self.store.save(ticket)`. A write's response can look right while the store says otherwise.

         </details>

      4. **Check with a learning test.** A *learning test* pins down how unfamiliar code behaves, so you rely on evidence instead of documentation that may have drifted. In `test_learning.py`, add a test that checks what happens to the store when you change a ticket you loaded with `get` and don't save it. Like the example test already in that file, use `TicketStore` directly. Name your test after the behavior it pins down.
      5. **Verify.** Run **Test**, then **Test My Work**.
    files:
      - path: README.md
        language: markdown
        reseed: true
        content: &readme |
          # Festival Help Desk

          The info tent at the Lakeside Sound festival logs attendee problems as
          tickets: lost wristbands, accessibility requests, set-time questions.
          Staff work through a shared queue. Here a *ticket* is a help request,
          not an admission ticket.

          ## Where things live

          - `helpdesk/api.py`: entry point; routes requests, maps errors to status codes
          - `helpdesk/service.py`: the business rules for every request
          - `helpdesk/store.py`: in-memory storage that behaves like a database table
          - `helpdesk/validation.py`: input rules shared by every write path
          - `helpdesk/models.py`: the `Ticket` record and rule constants
          - `helpdesk/errors.py`: errors that become 400, 404, and 409 responses
          - `test_helpdesk.py`: the team's test suite; keep your own tests in a
            separate `test_*.py` file

          ## Rules

          1. Tickets: `POST /tickets` with a `title` and a `priority` creates an open
             ticket (201). A title must contain text; surrounding spaces are removed.
             `GET /tickets/<id>` returns a ticket; `DELETE /tickets/<id>` removes it
             (204).
          2. IDs are never reused, even after a delete. Attendees get their ticket ID
             by text message, so an old ID must never lead to someone else's ticket.
          3. Priorities are `urgent`, `high`, `normal`, and `low`, accepted in any
             letter case and stored in lowercase, whether they arrive with
             `POST /tickets` or `POST /tickets/<id>/priority`. Anything else is
             rejected (400).
          4. Replies: `POST /tickets/<id>/replies` with an `author` and `text` adds a
             reply (201). Both must contain text; surrounding spaces are removed.
             From then on the reply is part of the ticket.
          5. Queue: `GET /queue` lists open tickets only: urgent first, then high,
             normal, and low; oldest first within a priority.
          6. Closing: `POST /tickets/<id>/close` with a festival `day` number closes
             the ticket and records that day. Closing a closed ticket is a conflict
             (409) and keeps the original day.
          7. Reopening: `POST /tickets/<id>/reopen` with a `day` reopens a ticket up
             to 7 days after it closed, day 7 included: closed on day 2, it can reopen
             through day 9. Later is a conflict (409), and so is reopening a ticket
             that is not closed. A reopened ticket is open and has no closing day.
          8. Unknown ticket IDs return 404.

          ## Status codes

          - 200 OK, 201 created, 204 deleted
          - 400 invalid input, 404 unknown ID
          - 409 not allowed in the ticket's current state
          - 500 server error, which always means a bug

          ## Storage contract

          `TicketStore.get()` and `TicketStore.all()` return copies, the way a
          database returns rows. Changing a loaded ticket changes nothing until the
          service calls `store.save(ticket)`.
