    quiz:
      title: Step 2 — Knowledge Check
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: Before the fix, `test_reply_is_returned` passed even though replies vanished. Why?
          options:
            - It reads only the POST response, built from the service's copy
            - pytest reuses the previous run's results for unchanged tests
            - The `app` fixture shares one store across all tests
            - It asserts on the status code instead of the reply text
          correct_index: 0
          option_feedback:
            1: pytest runs every selected test from scratch, and these runs disable its cache. The test passed
              because of what it checks.
            2: "The fixture calls `create_app()` for each test, and `create_app` builds a new store every
              time."
            3: It checks the reply text too, but only in the POST response. That response comes from the copy
              that `add_reply` changed.
          explanation: "`add_reply` appends to the copy from `store.get` and returns `ticket.to_dict()` from that
            copy, so the POST response shows the reply whether or not it was saved. Only a later GET reads the
            store."
        - type: single
          difficulty: advanced
          question: "Your hypothesis: `add_reply` never saves the ticket. Which observation could prove that
            hypothesis wrong?"
          options:
            - "`store.get(id).replies` holds the reply right after the POST"
            - The POST response contains the reply you just sent
            - Your new regression test fails before you change anything
            - "`add_reply` has no `self.store.save(ticket)` line in it"
          correct_index: 0
          option_feedback:
            1: The response comes from the changed copy, so it contains the reply whether or not it was saved.
              It cannot tell the explanations apart.
            2: A failing test shows that the bug exists. Several causes would make it fail, so it does not single
              out the missing save.
            3: This agrees with the hypothesis, so it cannot be the observation that proves it wrong. A save
              hidden in a helper method would also slip past a quick read.
          explanation: A good check could come out against you. If the stored ticket already had the reply right
            after the POST, saving would not be the problem, and you would look elsewhere, for example at how
            GET builds its response.
        - type: single
          difficulty: basic
          question: Why write the regression test before fixing the bug?
          options:
            - Seeing it fail shows that it can detect this bug
            - pytest only records tests that failed at least once
            - A failing test makes the eventual fix shorter
            - It replaces reading the code around the bug
          correct_index: 0
          option_feedback:
            1: pytest records every test the same way. The value of the first failure is what it tells you.
            2: The test does not change the size of the fix. It changes how sure you can be that the fix worked.
            3: You still read code to find the cause. The test pins down the symptom; tracing finds the cause.
          explanation: A test written after the fix might pass even on the buggy code, in which case it proves
            nothing. Watching it fail first, for the reported reason, shows it detects the bug; watching it pass
            after the fix shows the fix removed it.
