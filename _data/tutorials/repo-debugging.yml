            2: That is the prompt that produced the misleading ranking. Without the cache code and the observed
              behavior, the assistant had to guess.
            3: One confident answer hides the uncertainty. Ranked causes, each with a check, tell you what to
              observe next.
          explanation: A useful prompt gives the evidence (expected vs. actual) and the relevant code, and asks
