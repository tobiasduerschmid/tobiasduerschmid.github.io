    open_file: README.md
    run_file: test_learning.py
    run_files: [test_helpdesk.py, test_learning.py]
    tests:
      - description: Your learning tests pass on the real store
        command: |
          from helpdesk_grading import suite_accepts
          suite_accepts('/tutorial/test_learning.py')
        hints:
          - title: Compare with what the store did
            text: Run **Test** and read the failing assertion. Does your test assert what the README promises,
              or what you guessed before reading `helpdesk/store.py`?
      - description: Your learning tests fail on a store that hands out the tickets it keeps instead of copies
        command: |
          from helpdesk_grading import suite_detects
          suite_detects('/tutorial/test_learning.py', 'live-objects')
        hints:
          - title: Change the loaded ticket
            text: The README's claim is about what happens after you change a ticket you loaded. A test that
              only saves and loads cannot tell a copy from the original.
          - title: Ask the store again
            text: After changing the loaded ticket, load the same ID again and assert on what comes back.
              Which title does the README predict?
    quiz:
      title: Step 1 — Knowledge Check
      min_score: 0.8
      questions:
        - type: parsons
          difficulty: intermediate
          question: 'A test sends `app.post("/tickets/3/close", {"day": 2})` for an open ticket. Arrange
            the calls in the order they start. Two of these calls never run for this request.'
          lines:
            - App.post
            - App.handle
            - App._close
            - TicketService.close_ticket
            - TicketService._load
            - TicketStore.get
            - TicketStore.save
            - Ticket.to_dict
          distractors:
            - TicketService.queue
            - clean_priority
          explanation: "`App.post` hands the request to `App.handle`, which matches the route and calls
            `App._close`. The service's `close_ticket` loads the ticket through `_load` and `TicketStore.get`,
            changes that copy, saves it with `TicketStore.save`, and builds the response with
            `Ticket.to_dict`. `queue` and `clean_priority` serve other requests."
        - type: single
          difficulty: basic
          question: You need to know whether a ticket closed on day 2 may be reopened on day 9. Which source
            states the intended behavior?
          options:
            - "Rule 7 in `README.md`"
            - "`reopen_ticket` in `helpdesk/service.py`"
            - "`test_reopen_next_day` in `test_helpdesk.py`"
            - "`REOPEN_WINDOW_DAYS` in `helpdesk/models.py`"
          correct_index: 0
          option_feedback:
            1: The code shows what the program does now. While you debug, that is exactly what may be wrong,
              so it cannot settle what should happen.
            2: That test reopens one day after closing. It says nothing about day 9 or about the edge of the
              window.
            3: The constant supplies the number 7, but not whether day 7 itself is inside the window. Rule 7
              says it is.
          explanation: The README's numbered rules are the spec for this repository. Code and tests are
            evidence about current behavior; when they disagree with the spec, the spec decides what a fix
            must do.
        - type: single
          difficulty: intermediate
          question: |
            A teammate adds this method to `TicketService`. A request to rename ticket 4 returns the new title. What does a later `GET /tickets/4` show?

            ```python
            def rename(self, ticket_id, title):
                ticket = self._load(ticket_id)
                ticket.title = clean_title(title)
                return ticket.to_dict()
            ```
          options:
            - The old title
            - The new title
            - A 404, because the ticket changed without being saved
            - A 500, because the store rejects unsaved changes
          correct_index: 0
          option_feedback:
            1: "That would be true if `_load` returned the stored object. `TicketStore.get` returns a deep
              copy, so only the copy got the new title."
            2: The stored ticket still exists, unchanged; only a delete removes a row.
            3: The store never inspects the copies it hands out, so it cannot reject anything. The changed
              copy is simply discarded.
          explanation: "`_load` returns a copy from `TicketStore.get`. The method changes and returns that copy,
            so the response shows the new title, but the stored ticket keeps the old one until someone calls
            `self.store.save(ticket)`."
    solution:
      files:
        - path: test_learning.py
          language: python
          content: |
            """Learning tests: small experiments that pin down how unfamiliar code behaves."""
            from helpdesk.models import Ticket
            from helpdesk.store import TicketStore


            def test_saved_ticket_can_be_loaded():
                store = TicketStore()
                store.save(Ticket(id=1, title="Lost wristband", priority="normal"))
                assert store.get(1).title == "Lost wristband"


            def test_changing_a_loaded_ticket_does_not_change_the_store():
                store = TicketStore()
                store.save(Ticket(id=1, title="Lost wristband", priority="normal"))
                loaded = store.get(1)
                loaded.title = "Found it"
                assert store.get(1).title == "Lost wristband"
      explanation: |
        **Code map.** Requests enter `App.handle` in `helpdesk/api.py`, which matches the path and calls one `_action` method. The rules live in `TicketService` (`helpdesk/service.py`); tickets are stored by `TicketStore` (`helpdesk/store.py`). `POST /tickets/1/replies` runs `App._reply` → `TicketService.add_reply` → `_load` → `TicketStore.get`, appends a cleaned reply to the copy, then calls `TicketStore.save` and `Ticket.to_dict`.

        **Learning test.** `store.get(1)` returns a deep copy, so changing it leaves the stored ticket alone, and a second `get` returns the original title. A test that only saves and loads would also pass on a store that hands out its own objects, so it would not check the README's claim.

  # Pedagogy: worked example (a teammate's reproduction of another report), then completion: the learner
  # turns a user report into a failing test before touching production code (failing test first;
  # BugSpotter, Padurean et al. 2025). Hypothesis testing requires naming an observation that could
  # refute the hypothesis (Michaeli & Romeike 2019: explicit debugging process instruction).
  - title: Reproduce Before You Repair
    key: reproduce
    instructions: |
      ### Why this matters

      A bug report describes a symptom, not a cause. Turning it into a failing test proves you can trigger the bug on demand; the same test later proves the fix worked and keeps the bug from coming back.

      ### 🎯 You will learn to

      - **Translate** a user's bug report into a failing regression test.
      - **Test** a hypothesis with an observation that could prove it wrong.

      #### The bug report

      > **#212 Replies vanish.** "I replied to an attendee's ticket and saw my reply appear. When I opened the ticket again, the reply was gone." (Priya, info tent staff)

      Every team test passes. The suite has a blind spot, and your first job is to cover it.

      #### A worked example from another report

      This is how a teammate reproduced an earlier report, "Deleted tickets still open":

      ```python
      def test_deleted_ticket_is_404(app):
          ticket = create(app)                                         # the state in the report
          assert app.delete(f"/tickets/{ticket['id']}").status == 204  # what the user did
          assert app.get(f"/tickets/{ticket['id']}").status == 404     # what the user expected
      ```

      It follows the user's steps through the public API, checks each status before trusting `.json`, and asserts the *expected* behavior, so it fails while the bug exists.

      #### Your turn

      1. **Reproduce.** In `test_regression.py`, write one test that follows Priya's steps and asserts what she expected. Run **Test**: your test should fail, and every team test should pass.
      2. **Hypothesize.** In `debugging_log.md`, name the function you suspect and why. Then name one observation that would prove you wrong.
      3. **Check.** Make that observation, for example with a temporary `print` or the debugger, and record the result.
      4. **Fix.** Change production code so the cause is gone. Leave `test_helpdesk.py` and the storage contract as they are.
      5. **Verify.** Run **Test**, then **Test My Work**.
