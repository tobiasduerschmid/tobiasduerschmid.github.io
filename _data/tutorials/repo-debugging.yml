            2: Rejecting the suggestion is worth one sentence of evidence, but the summary should center on
              the actual cause and fix.
            3: A green suite covers only what it checks, as step 3 showed. Say which test now protects the
              behavior and what remains untested.
          explanation: Interviewers listen for a causal story backed by evidence. Say what was wrong and how
            you know, what you changed, which test guards it, and what you would check next.
        - type: multiple
          difficulty: advanced
          question: Which of these can show that a patch is wrong?
          options:
            - A test of a README rule fails on the patched code
            - A fresh GET contradicts the patch's response
            - The assistant reports that all tests pass
            - A second assistant agrees with the first
          correct_indices: [0, 1]
          option_feedback:
            0: A failing test that encodes the spec is direct evidence, like the day-9 reopen test for Patch A.
            1: When the stored state contradicts the response, a change was not saved, as with Patch B and the
              ghost tickets.
            2: A passing suite shows only that the checked cases work. Both reopen patches passed every team
              test.
            3: Agreement between models is not independent evidence; they can share the same misreading of a
              rule.
          explanation: Evidence comes from running the code against the spec, with tests that encode the README's
            rules and observations of the stored state. Claims and agreement are not observations.
    solution:
      files:
        - path: helpdesk/service.py
          language: python
