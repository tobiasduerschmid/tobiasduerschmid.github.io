      files:
        - path: helpdesk/service.py
          language: python
          content: *service_py
        - path: test_regression.py
          language: python
          content: |
            """Regression tests: one test per bug, written before the fix."""
            import pytest

            from helpdesk import create_app


            @pytest.fixture
            def app():
                return create_app()


            def create(app, title="Lost wristband", priority="normal"):
                response = app.post("/tickets", {"title": title, "priority": priority})
                assert response.status == 201, response
                return response.json


            def test_changing_priority_stores_lowercase(app):
                ticket = create(app, "Shuttle times", "low")
                response = app.post(f"/tickets/{ticket['id']}/priority", {"priority": "URGENT"})
                assert response.status == 200, response
                stored = app.get(f"/tickets/{ticket['id']}")
                assert stored.status == 200, stored
                assert stored.json["priority"] == "urgent"
      explanation: |
        **Cause.** `create_ticket` and `set_priority` call `clean_priority` but ignore its return value, so the raw text (`High`, `URGENT`) is stored. `queue()` then looks up `PRIORITY_RANK['High']` and raises `KeyError`, which the API turns into a 500.

        **Fix.** Store the value that `clean_priority` returns, on both paths. Normalizing inside `queue()` only hides the crash: the stored priority would still break rule 3, and every other reader would need the same workaround.

        **Regression test:** change a priority with `URGENT` and assert that GET returns `urgent`. The team test covers creation only, so this test protects the second path.

  # Pedagogy: contrasting erroneous examples with an explain-the-flaw prompt (Alemdag et al. 2025;
  # Dieterich et al. 2025). Two AI patches each pass the team suite; one has a visible boundary error,
  # the other a semantic one that reuses the storage model from steps 1–2 (spaced retrieval). Learners
  # judge both against the spec and write discriminating tests (TiCoder, Fakhoury et al. 2024).
  - title: Review Two AI Patches
    key: ai-patches
    instructions: |
      ### Why this matters

      AI assistants write plausible patches quickly, and "all tests pass" sounds like proof. Reviewing a patch means checking it against the requirement and writing the test that would expose it, because the existing tests already missed the bug once.

      ### 🎯 You will learn to

      - **Evaluate** AI-generated patches against the specification instead of their explanations.
      - **Write** tests that reject each incorrect patch.

      #### The bug report

      > **#240 Can't reopen.** "An attendee found their wristband the day after we closed their ticket. Reopening it gave a 409."

      `test_reopen_next_day` fails. Two AI assistants each proposed a patch to `reopen_ticket` in `helpdesk/service.py`. Neither patch is applied.

      **Assistant A:** "The window check was inverted, so I flipped the comparison. All tests pass ✅"

      ```diff
      -        if day - ticket.closed_on <= REOPEN_WINDOW_DAYS:
      +        if day - ticket.closed_on >= REOPEN_WINDOW_DAYS:
                   raise Conflict(f"ticket {ticket_id} was closed too long ago")
      ```

      **Assistant B:** "I rewrote the end of `reopen_ticket` for readability and fixed the check. I verified that the response shows status `open`. All tests pass ✅"

      ```diff
      -        if day - ticket.closed_on <= REOPEN_WINDOW_DAYS:
      +        days_closed = day - ticket.closed_on
      +        if days_closed > REOPEN_WINDOW_DAYS:
                   raise Conflict(f"ticket {ticket_id} was closed too long ago")
      -        ticket.status = "open"
      -        ticket.closed_on = None
      -        self.store.save(ticket)
      +        ticket.status, ticket.closed_on = "open", None
               return ticket.to_dict()
      ```

      Both assistants are telling the truth about the tests.

      #### Your turn

      1. **Review A.** Compare its condition with rule 7 of the README. For a ticket closed on day 2, which days does A allow? Record any day where A disagrees with the rule.
      2. **Review B.** B's condition is right. What else did the rewrite change? Use what you learned about the store in steps 1 and 2.
      3. **Write the tests that would have caught them.** In `test_regression.py`, add tests that fail on Patch A and fail on Patch B. To check, apply each patch by hand, run **Test**, then undo it.
      4. **Fix.** Write a correct `reopen_ticket`, starting from either patch or from scratch. Run **Test**, then **Test My Work**.
