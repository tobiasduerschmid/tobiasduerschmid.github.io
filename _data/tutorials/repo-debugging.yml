            1: Nothing in this app caches responses; every request runs the service again.
            2: A closed ticket's response shows `closed`, so the field does report what the copy holds. The
              question is whether the copy was saved.
            3: "`to_dict()` includes every field, whether it changed or not."
          explanation: As in step 2, a write's response comes from the copy it changed. Patch B never saves that
            copy, so the stored ticket stays closed; a GET after the reopen exposes it.
    solution:
      files:
        - path: helpdesk/service.py
          language: python
          content: *service_py
        - path: test_regression.py
          language: python
          content: |
            """Regression tests: one test per bug, written before the fix."""
            import pytest

            from helpdesk import create_app


            @pytest.fixture
            def app():
                return create_app()


            def create(app, title="Lost wristband", priority="normal"):
                response = app.post("/tickets", {"title": title, "priority": priority})
                assert response.status == 201, response
                return response.json


            def close_on(app, ticket, day):
                response = app.post(f"/tickets/{ticket['id']}/close", {"day": day})
                assert response.status == 200, response


            def test_reopen_allowed_on_the_seventh_day_after_closing(app):
                ticket = create(app)
                close_on(app, ticket, 2)
                response = app.post(f"/tickets/{ticket['id']}/reopen", {"day": 9})
                assert response.status == 200, response


            def test_reopen_rejected_on_the_eighth_day(app):
                ticket = create(app)
                close_on(app, ticket, 2)
                assert app.post(f"/tickets/{ticket['id']}/reopen", {"day": 10}).status == 409


            def test_reopened_ticket_is_saved_as_open(app):
                ticket = create(app)
                close_on(app, ticket, 2)
                assert app.post(f"/tickets/{ticket['id']}/reopen", {"day": 4}).status == 200
                stored = app.get(f"/tickets/{ticket['id']}")
                assert stored.status == 200, stored
                assert stored.json["status"] == "open"
                assert stored.json["closed_on"] is None
      explanation: |
        **Patch A: reject.** It negates `<=` as `>=`. The opposite of `x <= 7` is `x > 7`, so A rejects day 7, which rule 7 includes: closed on day 2, a reopen on day 9 gets a 409. It did find the right line, which is worth saying in the review.

        **Patch B: reject (or revise).** Its condition is right, but the rewrite dropped `self.store.save(ticket)`. Its response shows `open`, yet the stored ticket stays closed.

        **Patch C: accept, and correct its explanation.** It is B's rewrite with the save kept, and it meets rule 7. Its explanation calls the bug an off-by-one; the check was inverted. The model solution's tests pass on it.

        **Tests that tell them apart:** reopen on day 9 after a day-2 close and expect 200 (rejects A); reopen, then GET, and expect `open` with no closing day (rejects B); both pass on C. The model solution also checks that day 10 is rejected.

  # Pedagogy: code review of an agent's pull request that edits two tests, one legitimately. Mock et al.
  # (2025) observed, in a small study, an AI assistant suggesting a test edit instead of a code fix.
  # Spaced retrieval of step 4: reject bad input where it enters rather than where it crashes.
  - title: The Patch That Edited the Tests
    key: weakened-test
    instructions: |
      ### Why this matters

      When an agent is told to make the tests pass, editing a test is the shortest route. A reviewer has to tell an edit that strengthens a test from one that deletes the requirement it protects, because the suite stays green either way.

      ### 🎯 You will learn to

      - **Distinguish** a test edit that adds a requirement from one that removes it.
      - **Restore** a test's intent and fix the code it protects.

      #### The pull request

      > **#248 Queue page down again.** "Front desk typed priority `ASAP`, and the queue shows a server error."

      An AI agent opened a pull request for #248, and it is checked out in your workspace. Its description:

      > "Fixed the failing `test_unknown_priority_is_rejected` and tightened the reopen test. Staff use informal priorities, so the API is lenient now. All tests pass ✅"

      The pull request edits two team tests:

      ```diff
           response = app.post(f"/tickets/{ticket['id']}/reopen", {"day": 4})
           assert response.status == 200
           assert response.json["status"] == "open"
      +    assert response.json["closed_on"] is None
      ```

      ```diff
       def test_unknown_priority_is_rejected(app):
           response = app.post("/tickets", {"title": "Stage lights", "priority": "asap"})
      -    assert response.status == 400
      +    # Relaxed: staff type informal priorities, so the API accepts them now.
      +    assert response.status in (201, 400)
      ```

      #### Your turn

      1. **Review both edits** against the README. Which edit adds a README rule to a test, and which removes one? Compare the claim "the API is lenient now" with rule 3.
      2. **Restore the requirement.** Keep the edit that encodes the README. Put rule 3 back into `test_unknown_priority_is_rejected` in `test_helpdesk.py`, then run **Test**: it should fail now. This time the restored team test is your reproduction, so `test_regression.py` can stay empty.
      3. **Trace.** Where do unknown priorities slip through, and why does the crash appear in the queue instead of at creation? Record both in `debugging_log.md`.
      4. **Fix the cause.** Run **Test**, then **Test My Work**.
