        - path: test_regression.py
          language: python
          content: |
            """Regression tests: one test per bug, written before the fix."""
            import pytest

            from helpdesk import create_app


            @pytest.fixture
            def app():
                return create_app()


            def create(app, title="Lost wristband", priority="normal"):
                response = app.post("/tickets", {"title": title, "priority": priority})
                assert response.status == 201, response
                return response.json


            def test_closed_ticket_is_saved_and_leaves_the_queue(app):
                ticket = create(app, "Medical tent", "urgent")
                assert app.post(f"/tickets/{ticket['id']}/close", {"day": 2}).status == 200
                stored = app.get(f"/tickets/{ticket['id']}")
                assert stored.status == 200, stored
                assert stored.json["status"] == "closed"
                assert app.get("/queue").json == []
      explanation: |
        **Triage.** The report and both failing tests fit one cause: closing never reaches the store. A second close succeeds because the stored ticket is still open, and a reopen fails because the stored ticket is not closed.

        **Refuting the assistant.** Right after closing, GET returns `status: open`. The queue filters correctly; it is reading tickets that were never saved as closed. Changing the filter would not change any of the three symptoms.

        **Cause and fix.** `close_ticket` calls `save` before changing the copy, so the saved ticket is the unchanged one. Save after setting `status` and `closed_on`.

        **Regression test:** close a ticket, then assert that GET shows it closed and that the queue no longer lists it.

        **Remaining risk (example):** another write path could make the same ordering mistake. A review habit of "change, then save", or one helper that does both, would reduce that risk.
