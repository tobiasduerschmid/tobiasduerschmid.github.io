            - A fresh GET contradicts the patch's response
            - The assistant reports that all tests pass
            - A second assistant agrees with the first
          correct_indices: [0, 1]
          option_feedback:
            0: A failing test that encodes the spec is direct evidence, like the day-9 reopen test for Patch A.
            1: When stored state contradicts what a response showed, a change was not saved, as with Patch B.
            2: A passing suite shows only that the checked cases work. Two of the three reopen patches were wrong,
              and all three passed every team test.
            3: Agreement between models is not independent evidence; they can share the same misreading of a
              rule.
          explanation: Evidence comes from running the code against the spec, with tests that encode the README's
            rules and observations of the stored state. Claims and agreement are not observations.
    solution:
      files:
        - path: helpdesk/service.py
          language: python
          content: |
            """Business rules. Each write loads a ticket, changes that copy, and saves it."""
            import copy

            from helpdesk.errors import Conflict, NotFound
            from helpdesk.models import PRIORITY_RANK, REOPEN_WINDOW_DAYS, Ticket
            from helpdesk.validation import clean_priority, clean_reply, clean_title


            class TicketService:
                def __init__(self, store):
                    self.store = store
                    self._queue = None  # the info tent screen polls GET /queue

                def _changed(self):
                    """Forget the cached queue after any write."""
                    self._queue = None

                def _load(self, ticket_id):
                    ticket = self.store.get(ticket_id)
                    if ticket is None:
                        raise NotFound(f"no ticket {ticket_id}")
                    return ticket

                def create_ticket(self, title, priority):
                    ticket = Ticket(id=self.store.next_id(), title=clean_title(title),
                                    priority=clean_priority(priority))
                    self.store.save(ticket)
                    self._changed()
                    return ticket.to_dict()

                def get_ticket(self, ticket_id):
                    return self._load(ticket_id).to_dict()

                def delete_ticket(self, ticket_id):
                    if not self.store.delete(ticket_id):
                        raise NotFound(f"no ticket {ticket_id}")
                    self._changed()

                def add_reply(self, ticket_id, author, text):
                    ticket = self._load(ticket_id)
                    ticket.replies.append(clean_reply(author, text))
                    self.store.save(ticket)
                    self._changed()
                    return ticket.to_dict()

                def set_priority(self, ticket_id, priority):
                    ticket = self._load(ticket_id)
                    ticket.priority = clean_priority(priority)
                    self.store.save(ticket)
                    self._changed()
                    return ticket.to_dict()

                def close_ticket(self, ticket_id, day):
                    ticket = self._load(ticket_id)
                    if ticket.status == "closed":
                        raise Conflict(f"ticket {ticket_id} is already closed")
                    ticket.status = "closed"
                    ticket.closed_on = day
                    self.store.save(ticket)
                    self._changed()
                    return ticket.to_dict()

                def reopen_ticket(self, ticket_id, day):
                    ticket = self._load(ticket_id)
                    if ticket.status != "closed":
                        raise Conflict(f"ticket {ticket_id} is not closed")
                    if day - ticket.closed_on > REOPEN_WINDOW_DAYS:
                        raise Conflict(f"ticket {ticket_id} was closed too long ago")
                    ticket.status = "open"
                    ticket.closed_on = None
                    self.store.save(ticket)
                    self._changed()
                    return ticket.to_dict()

                def queue(self):
                    if self._queue is None:
                        waiting = [ticket for ticket in self.store.all() if ticket.status == "open"]
                        waiting.sort(key=lambda ticket: (PRIORITY_RANK[ticket.priority], ticket.id))
                        self._queue = [ticket.to_dict() for ticket in waiting]
                    return copy.deepcopy(self._queue)
        - path: test_regression.py
          language: python
          content: |
            """Regression tests: one test per bug, written before the fix."""
            import pytest

            from helpdesk import create_app


            @pytest.fixture
            def app():
                return create_app()


            def create(app, title="Lost wristband", priority="normal"):
                response = app.post("/tickets", {"title": title, "priority": priority})
                assert response.status == 201, response
                return response.json


            def test_closing_a_ticket_updates_a_queue_already_on_screen(app):
                ticket = create(app, "Medical tent", "urgent")
                assert [entry["id"] for entry in app.get("/queue").json] == [ticket["id"]]
                assert app.post(f"/tickets/{ticket['id']}/close", {"day": 2}).status == 200
                assert app.get("/queue").json == []
      explanation: |
        **Discrimination.** Right after closing, GET shows the ticket as `closed`, so the store is correct and the assistant's first hypothesis is refuted. The second one fits: `queue()` returns its cached list, and `close_ticket` saves but never calls `self._changed()`.

        **Reproduction.** The screen loads the queue before anyone closes a ticket, so the test must do the same: view the queue, close the ticket, view it again. A test that closes before ever viewing the queue passes on the buggy code, because the cache is still empty.

        **Fix.** Call `self._changed()` in `close_ticket`, as every other write method does. Removing the cache also meets the README, but it drops the teammate's speed-up.

        **Better prompt (example):** "The queue screen keeps showing tickets after they close; GET /tickets/<id> says closed. Here are `queue()`, `_changed()`, and `close_ticket()`. Give ranked causes, each with one check I can run; don't write the fix."

        **Remaining risk (example):** any future write method that forgets `self._changed()` brings the bug back. A test that views the queue between writes guards against that.
