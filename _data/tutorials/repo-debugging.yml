      files:
        - path: helpdesk/service.py
          language: python
          content: *service_py
        - path: test_regression.py
          language: python
          content: |
            """Regression tests: one test per bug, written before the fix."""
            import pytest

            from helpdesk import create_app


            @pytest.fixture
            def app():
                return create_app()


            def create(app, title="Lost wristband", priority="normal"):
                response = app.post("/tickets", {"title": title, "priority": priority})
                assert response.status == 201, response
                return response.json


            def test_reply_is_still_there_after_reloading_the_ticket(app):
                ticket = create(app)
                reply = app.post(f"/tickets/{ticket['id']}/replies", {"author": "Priya", "text": "Found it!"})
                assert reply.status == 201, reply
                reloaded = app.get(f"/tickets/{ticket['id']}")
                assert reloaded.status == 200, reloaded
                assert reloaded.json["replies"] == [{"author": "Priya", "text": "Found it!"}]
      explanation: |
        **Cause.** `add_reply` appends the reply to the copy returned by `store.get` and returns it without calling `store.save`. The POST response is built from that copy, so it looks right; the next GET reads the unchanged stored ticket.

        **Fix.** Save the ticket after appending, as every other write method does. Removing the deep copies from the store would also make replies persist, but it breaks the README's storage contract and lets any code change stored tickets by accident.

        **A check that could have refuted the hypothesis:** if `store.get(id).replies` had contained the reply right after the POST, the missing save would not explain the bug.

  # Pedagogy: predict before reveal. The visible failing test admits an almost-correct fix
  # (`max(...) + 1`); a gated prediction asks the learner to test that fix against the README before
  # the reveal. Tests as evidence: a passing suite covers only what it checks (EvalPlus, Liu et al. 2023,
  # showed weak tests overstating the correctness of generated code).
  - title: When the Green Bar Lies
    key: green-bar
    instructions: |
      ### Why this matters

      A passing test proves only the cases it checks. Comparing a fix with the written requirement, not just with the failing test, is how you catch the fix that is almost right before a user does.

      ### 🎯 You will learn to

      - **Compare** a fix against the requirement instead of the failing test alone.
      - **Write** a boundary test that rejects an almost-correct fix.

      #### The bug report

      > **#219 Wrong ticket.** "An attendee texted us their ticket number and got someone else's lost-wristband ticket."

      This time a team test fails: `test_new_ticket_does_not_overwrite_existing`.

      #### Your turn

      1. **Reproduce.** Run **Test** and read the failure. Record the expected and actual titles in `debugging_log.md`.
      2. **Localize.** Trace where a new ticket gets its ID. Explain in the log why deleting the *first* ticket makes the next ID collide.
      3. **Predict.** A teammate proposes this one-line fix for `next_id` (`max` over a dictionary compares its keys, the ticket IDs):

         ```python
         return max(self._rows, default=0) + 1
         ```

         It makes the failing test pass. Now read rule 2 of the README. Is there a sequence of creates and deletes for which this fix still breaks the rule? Commit to an answer in the log before you open the reveal.

         <details markdown="1"><summary>Open after you've committed to an answer</summary>

         Delete the **newest** ticket, then create one. The highest remaining ID plus one is the deleted ticket's ID, so an old text message now leads to a stranger's ticket. The team test deletes the *oldest* ticket, which is why it cannot see this.

         </details>

      4. **Test the boundary.** In `test_regression.py`, write a test for that sequence. It should fail on the current code.
      5. **Fix.** Repair the ID logic so rule 2 holds for every sequence of creates and deletes. Run **Test**, then **Test My Work**.
