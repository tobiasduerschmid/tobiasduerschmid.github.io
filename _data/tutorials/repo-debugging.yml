          language: python
          content: |
            """Regression tests: one test per bug, written before the fix."""
            import pytest

            from helpdesk import create_app


            @pytest.fixture
            def app():
                return create_app()


            def create(app, title="Lost wristband", priority="normal"):
                response = app.post("/tickets", {"title": title, "priority": priority})
                assert response.status == 201, response
                return response.json


            def test_deleting_the_newest_ticket_does_not_recycle_its_id(app):
                first = create(app, "Lost wristband")
                newest = create(app, "Locker key")
                assert app.delete(f"/tickets/{newest['id']}").status == 204
                replacement = create(app, "Water refill map")
                assert replacement["id"] not in (first["id"], newest["id"])
      explanation: |
        **Cause.** `next_id` returns `len(self._rows) + 1`. After a delete the count drops, so the next ID can equal a live ticket's ID, and `save` overwrites that ticket.

        **Why `max(...) + 1` is not enough.** It skips the IDs of tickets that still exist, but after the newest ticket is deleted it hands out that ID again, which breaks rule 2. The model fix keeps a counter in the store that only increases. Any approach that remembers every ID issued so far meets the rule.

        **Regression test:** create two tickets, delete the newest, create another, and assert that the new ID differs from both earlier IDs.

  # Pedagogy: tracing a value from its point of use back to its point of creation, and searching for
  # every path that creates it (Shah et al. 2025: finding all relevant code). Predict exposes the
  # symptom fix at the crash site before the learner commits to it.
  - title: Fix the Cause, Not the Crash Site
    key: root-cause
    instructions: |
      ### Why this matters

      A traceback shows where bad data was finally used, which is often far from where it was created. Patching the line that crashed hides the symptom and leaves the bad data spreading through every other path.

      ### 🎯 You will learn to

      - **Trace** a bad value from where it crashed back to where it was created.
      - **Find** every code path that creates the same bad value.

      #### The bug report

      > **#231 Queue page down.** "Someone created a ticket with priority `High`, and now the queue page shows a server error."

      `test_queue_accepts_mixed_case_priority` fails with a 500. The API prints the server's traceback, which pytest shows under **Captured stderr**.

      #### Your turn

      1. **Read the evidence.** Run **Test**. In the captured traceback, find the last line inside `helpdesk/` and the exception. Record both in `debugging_log.md`.
      2. **Ask where the value came from.** The crash is where `'High'` was *used*. Find where it was *stored*, and compare that with rule 3 of the README.
      3. **Predict.** Changing the crashing line to look up `ticket.priority.lower()` makes the failing test pass. Which README rule would still be broken? Write your answer in the log.
      4. **Find every path.** More than one request writes a priority. Check each write against rule 3.
      5. **Test the path the team suite misses.** In `test_regression.py`, write a test for the write path that `test_queue_accepts_mixed_case_priority` does not use. It should fail now.
