  # Pedagogy: independent transfer case with one reflective hint (fading complete), on a new kind of
  # bug: a stale cache. The assistant offers two ranked hypotheses; the wrong one comes first and matches
  # the save bugs of earlier lessons, the right one second. Learners must test both with one
  # discriminating observation instead of accepting or dismissing the assistant wholesale. Hellas et al.
