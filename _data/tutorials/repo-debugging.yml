          # Debugging log

          - Symptom (expected vs. actual):
          - Reproduction (test name, and how it fails before the fix):
          - Hypothesis (where, and why):
          - Check that could prove the hypothesis wrong, and its result:
          - Other candidate causes, and what ruled each out:
          - Cause (file, function, and the wrong state):
          - Fix, and why it removes the cause:
          - What the regression test protects:
