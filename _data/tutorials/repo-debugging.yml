      - path: helpdesk/__init__.py
        language: python
        reseed: true
        content: &init_py |
          """Festival Help Desk: tickets for the info tent at a music festival.

          Requests enter through api.py, which calls service.py for the rules;
          service.py reads and writes tickets through store.py.
          """
          from helpdesk.api import create_app

          __all__ = ["create_app"]
      - path: helpdesk/api.py
        language: python
        reseed: true
        content: &api_py |
          """Entry point: routes requests to the service and turns errors into status codes.

          Paths look like the real HTTP API, e.g. POST /tickets/3/close {"day": 2}.
          """
          import re
          import traceback

          from helpdesk.errors import Conflict, NotFound, ValidationError
          from helpdesk.service import TicketService
          from helpdesk.store import TicketStore

          STATUS_FOR = {ValidationError: 400, NotFound: 404, Conflict: 409}


          class Response:
              def __init__(self, status, json=None):
                  self.status = status
                  self.json = json

              def __repr__(self):
                  return f"Response({self.status}, {self.json!r})"


          class App:
              def __init__(self, service):
                  self.service = service
                  self.routes = [
                      ("POST", r"/tickets", self._create),
                      ("GET", r"/tickets/(\d+)", self._get),
                      ("DELETE", r"/tickets/(\d+)", self._delete),
                      ("POST", r"/tickets/(\d+)/replies", self._reply),
                      ("POST", r"/tickets/(\d+)/priority", self._priority),
                      ("POST", r"/tickets/(\d+)/close", self._close),
                      ("POST", r"/tickets/(\d+)/reopen", self._reopen),
                      ("GET", r"/queue", self._queue),
                  ]

              def get(self, path):
                  return self.handle("GET", path, {})

              def post(self, path, body=None):
                  return self.handle("POST", path, body or {})

              def delete(self, path):
                  return self.handle("DELETE", path, {})

              def handle(self, method, path, body):
                  for route_method, pattern, action in self.routes:
                      match = re.fullmatch(pattern, path)
                      if match and route_method == method:
                          try:
                              return action(body, *map(int, match.groups()))
                          except tuple(STATUS_FOR) as error:
                              return Response(STATUS_FOR[type(error)], {"error": str(error)})
                          except Exception:
                              traceback.print_exc()  # the server log
                              return Response(500, {"error": "internal server error"})
                  return Response(404, {"error": f"no route for {method} {path}"})

              def _create(self, body):
                  ticket = self.service.create_ticket(body.get("title"), body.get("priority"))
                  return Response(201, ticket)

              def _get(self, body, ticket_id):
                  return Response(200, self.service.get_ticket(ticket_id))

              def _delete(self, body, ticket_id):
                  self.service.delete_ticket(ticket_id)
                  return Response(204)

              def _reply(self, body, ticket_id):
                  ticket = self.service.add_reply(ticket_id, body.get("author"), body.get("text"))
                  return Response(201, ticket)

              def _priority(self, body, ticket_id):
                  return Response(200, self.service.set_priority(ticket_id, body.get("priority")))

              def _close(self, body, ticket_id):
                  return Response(200, self.service.close_ticket(ticket_id, body.get("day")))

              def _reopen(self, body, ticket_id):
                  return Response(200, self.service.reopen_ticket(ticket_id, body.get("day")))

              def _queue(self, body):
                  return Response(200, self.service.queue())


          def create_app():
              return App(TicketService(TicketStore()))
      - path: helpdesk/service.py
        language: python
        reseed: true
        content: &service_py |
          """Business rules. Each write loads a ticket, changes that copy, and saves it."""
          from helpdesk.errors import Conflict, NotFound
          from helpdesk.models import PRIORITY_RANK, REOPEN_WINDOW_DAYS, Ticket
          from helpdesk.validation import clean_priority, clean_reply, clean_title


          class TicketService:
              def __init__(self, store):
                  self.store = store

              def _load(self, ticket_id):
                  ticket = self.store.get(ticket_id)
                  if ticket is None:
                      raise NotFound(f"no ticket {ticket_id}")
                  return ticket

              def create_ticket(self, title, priority):
                  ticket = Ticket(id=self.store.next_id(), title=clean_title(title),
                                  priority=clean_priority(priority))
                  self.store.save(ticket)
                  return ticket.to_dict()

              def get_ticket(self, ticket_id):
                  return self._load(ticket_id).to_dict()

              def delete_ticket(self, ticket_id):
                  if not self.store.delete(ticket_id):
                      raise NotFound(f"no ticket {ticket_id}")

              def add_reply(self, ticket_id, author, text):
                  ticket = self._load(ticket_id)
                  ticket.replies.append(clean_reply(author, text))
                  self.store.save(ticket)
                  return ticket.to_dict()

              def set_priority(self, ticket_id, priority):
                  ticket = self._load(ticket_id)
                  ticket.priority = clean_priority(priority)
                  self.store.save(ticket)
                  return ticket.to_dict()

              def close_ticket(self, ticket_id, day):
                  ticket = self._load(ticket_id)
                  if ticket.status == "closed":
                      raise Conflict(f"ticket {ticket_id} is already closed")
                  ticket.status = "closed"
                  ticket.closed_on = day
                  self.store.save(ticket)
                  return ticket.to_dict()

              def reopen_ticket(self, ticket_id, day):
                  ticket = self._load(ticket_id)
                  if ticket.status != "closed":
                      raise Conflict(f"ticket {ticket_id} is not closed")
                  if day - ticket.closed_on > REOPEN_WINDOW_DAYS:
                      raise Conflict(f"ticket {ticket_id} was closed too long ago")
                  ticket.status = "open"
                  ticket.closed_on = None
                  self.store.save(ticket)
                  return ticket.to_dict()

              def queue(self):
                  waiting = [ticket for ticket in self.store.all() if ticket.status == "open"]
                  waiting.sort(key=lambda ticket: (PRIORITY_RANK[ticket.priority], ticket.id))
                  return [ticket.to_dict() for ticket in waiting]
      - path: helpdesk/store.py
        language: python
        reseed: true
        content: &store_py |
          """In-memory storage that behaves like a database table.

          get() and all() return copies, the way a database returns rows. Changing a
          loaded ticket changes nothing here until the service calls save().
          """
          import copy


          class TicketStore:
              def __init__(self):
                  self._rows = {}
                  self._last_id = 0

              def next_id(self):
                  self._last_id += 1
                  return self._last_id

              def get(self, ticket_id):
                  row = self._rows.get(ticket_id)
                  return copy.deepcopy(row) if row is not None else None

              def all(self):
                  return [copy.deepcopy(row) for row in self._rows.values()]

              def save(self, ticket):
                  self._rows[ticket.id] = copy.deepcopy(ticket)

              def delete(self, ticket_id):
                  return self._rows.pop(ticket_id, None) is not None
      - path: helpdesk/validation.py
        language: python
        reseed: true
        content: &validation_py |
          """Input rules shared by every write path. Each function returns the cleaned value."""
          from helpdesk.errors import ValidationError
          from helpdesk.models import PRIORITY_RANK


          def clean_title(title):
              if not isinstance(title, str) or not title.strip():
                  raise ValidationError("title must contain text")
              return title.strip()


          def clean_priority(priority):
              if not isinstance(priority, str) or priority.strip().lower() not in PRIORITY_RANK:
                  raise ValidationError(f"priority must be one of: {', '.join(PRIORITY_RANK)}")
              return priority.strip().lower()


          def clean_reply(author, text):
              if not isinstance(author, str) or not author.strip():
                  raise ValidationError("author must contain text")
              if not isinstance(text, str) or not text.strip():
                  raise ValidationError("reply text must contain text")
              return {"author": author.strip(), "text": text.strip()}
      - path: helpdesk/models.py
        language: python
        reseed: true
        content: &models_py |
          """The ticket record and the constants the README rules refer to."""
          from dataclasses import dataclass, field

          PRIORITY_RANK = {"urgent": 0, "high": 1, "normal": 2, "low": 3}
          REOPEN_WINDOW_DAYS = 7


          @dataclass
          class Ticket:
              id: int
              title: str
              priority: str
              status: str = "open"
              closed_on: int | None = None
              replies: list = field(default_factory=list)

              def to_dict(self):
                  return {
                      "id": self.id,
                      "title": self.title,
                      "priority": self.priority,
                      "status": self.status,
                      "closed_on": self.closed_on,
                      "replies": [dict(reply) for reply in self.replies],
                  }
      - path: helpdesk/errors.py
        language: python
        reseed: true
        content: &errors_py |
          """Errors raised by the service. api.py turns each one into a status code."""


          class ValidationError(Exception):
              """The request breaks an input rule. (400)"""


          class NotFound(Exception):
              """No ticket has that ID. (404)"""


          class Conflict(Exception):
              """The request is valid, but not in the ticket's current state. (409)"""
      - path: test_helpdesk.py
        language: python
        reseed: true
        content: &team_tests |
          """The team's test suite. Comments name the README rule each test protects."""
          import pytest

          from helpdesk import create_app


          @pytest.fixture
          def app():
              return create_app()


          def create(app, title="Lost wristband", priority="normal"):
              response = app.post("/tickets", {"title": title, "priority": priority})
              assert response.status == 201, response
              return response.json


          # Rule 1: tickets
          def test_create_returns_open_ticket(app):
              ticket = create(app, "  Lost wristband  ", "high")
              assert ticket["title"] == "Lost wristband"
              assert ticket["priority"] == "high"
              assert ticket["status"] == "open"
              assert ticket["closed_on"] is None
              assert ticket["replies"] == []


          def test_created_ticket_can_be_fetched(app):
              ticket = create(app)
              response = app.get(f"/tickets/{ticket['id']}")
              assert response.status == 200
              assert response.json == ticket


          def test_blank_title_is_rejected(app):
              assert app.post("/tickets", {"title": "   ", "priority": "low"}).status == 400


          # Rule 2: IDs
          def test_new_ticket_does_not_overwrite_existing(app):
              first = create(app, "Lost wristband")
              second = create(app, "Locker key")
              assert app.delete(f"/tickets/{first['id']}").status == 204
              create(app, "Water refill map")
              assert app.get(f"/tickets/{second['id']}").json["title"] == "Locker key"


          # Rule 3: priorities
          def test_unknown_priority_is_rejected(app):
              response = app.post("/tickets", {"title": "Stage lights", "priority": "asap"})
              assert response.status == 400


          def test_queue_accepts_mixed_case_priority(app):
              low = create(app, "Merch question", "low")
              high = create(app, "Shuttle times", "High")
              urgent = create(app, "Medical tent", "urgent")
              response = app.get("/queue")
              assert response.status == 200
              assert [ticket["id"] for ticket in response.json] == [urgent["id"], high["id"], low["id"]]


          # Rule 4: replies
          def test_reply_is_returned(app):
              ticket = create(app)
              response = app.post(f"/tickets/{ticket['id']}/replies", {"author": "Sam", "text": "On it!"})
              assert response.status == 201
              assert response.json["replies"] == [{"author": "Sam", "text": "On it!"}]


          # Rule 5: queue
          def test_queue_orders_by_priority_then_age(app):
              low = create(app, "Merch question", "low")
              urgent = create(app, "Medical tent", "urgent")
              normal = create(app, "Locker key", "normal")
              later_urgent = create(app, "Lost phone", "urgent")
              ids = [ticket["id"] for ticket in app.get("/queue").json]
              assert ids == [urgent["id"], later_urgent["id"], normal["id"], low["id"]]


          # Rule 6: closing
          def test_close_records_day(app):
              ticket = create(app)
              response = app.post(f"/tickets/{ticket['id']}/close", {"day": 2})
              assert response.status == 200
              assert response.json["status"] == "closed"
              assert response.json["closed_on"] == 2


          def test_closing_twice_is_conflict(app):
              ticket = create(app)
              app.post(f"/tickets/{ticket['id']}/close", {"day": 2})
              response = app.post(f"/tickets/{ticket['id']}/close", {"day": 5})
              assert response.status == 409


          # Rule 7: reopening
          def test_reopen_next_day(app):
              ticket = create(app)
              app.post(f"/tickets/{ticket['id']}/close", {"day": 3})
              response = app.post(f"/tickets/{ticket['id']}/reopen", {"day": 4})
              assert response.status == 200
              assert response.json["status"] == "open"


          # Rule 8: unknown IDs
          def test_unknown_ticket_is_404(app):
              assert app.get("/tickets/99").status == 404


          def test_deleted_ticket_is_404(app):
              ticket = create(app)
              assert app.delete(f"/tickets/{ticket['id']}").status == 204
              assert app.get(f"/tickets/{ticket['id']}").status == 404
      - path: test_learning.py
        language: python
        reseed: true
        content: |
          """Learning tests: small experiments that pin down how unfamiliar code behaves."""
          from helpdesk.models import Ticket
          from helpdesk.store import TicketStore


          def test_saved_ticket_can_be_loaded():
              store = TicketStore()
              store.save(Ticket(id=1, title="Lost wristband", priority="normal"))
              assert store.get(1).title == "Lost wristband"


          # Add your learning test below. Name it after the behavior it pins down.
    open_file: README.md
    run_file: test_learning.py
    run_files: [test_helpdesk.py, test_learning.py]
    tests:
      - description: Your learning tests pass on the real store
        command: |
          from helpdesk_grading import suite_accepts
          suite_accepts('/tutorial/test_learning.py')
        hints:
          - title: Compare with what the store did
            text: Run **Test** and read the failing assertion. Does your test assert what the README promises,
              or what you guessed before reading `helpdesk/store.py`?
      - description: Your learning tests fail on a store that hands out the tickets it keeps instead of copies
        command: |
          from helpdesk_grading import suite_detects
          suite_detects('/tutorial/test_learning.py', 'live-objects')
        hints:
          - title: Change, then ask again
            text: A test that only saves and loads cannot tell a copy from the original. Change the ticket you
              loaded, then load the same ID again and assert on what comes back.
    quiz:
      title: Step 1 — Knowledge Check
      min_score: 0.8
      questions:
        - type: parsons
          difficulty: intermediate
          question: 'A test sends `app.post("/tickets/3/close", {"day": 2})` for an open ticket. Arrange
            the calls in the order they start. Two of these calls never run for this request.'
          lines:
            - App.post
            - App.handle
            - App._close
            - TicketService.close_ticket
            - TicketService._load
            - TicketStore.get
            - TicketStore.save
            - Ticket.to_dict
          distractors:
            - TicketService.queue
            - clean_priority
          explanation: "`App.post` hands the request to `App.handle`, which matches the route and calls
            `App._close`. The service's `close_ticket` loads the ticket through `_load` and `TicketStore.get`,
            changes that copy, saves it with `TicketStore.save`, and builds the response with
            `Ticket.to_dict`. `queue` and `clean_priority` serve other requests."
        - type: single
          difficulty: basic
          question: You need to know whether a ticket closed on day 2 may be reopened on day 9. Which source
            states the intended behavior?
          options:
            - "Rule 7 in `README.md`"
            - "`reopen_ticket` in `helpdesk/service.py`"
            - "`test_reopen_next_day` in `test_helpdesk.py`"
            - "`REOPEN_WINDOW_DAYS` in `helpdesk/models.py`"
          correct_index: 0
          option_feedback:
            1: The code shows what the program does now. While you debug, that is exactly what may be wrong,
              so it cannot settle what should happen.
            2: That test reopens one day after closing. It says nothing about day 9 or about the edge of the
              window.
            3: The constant supplies the number 7, but not whether day 7 itself is inside the window. Rule 7
              says it is.
          explanation: The README's numbered rules are the spec for this repository. Code and tests are
            evidence about current behavior; when they disagree with the spec, the spec decides what a fix
            must do.
        - type: single
          difficulty: intermediate
          question: You find a method, `store.find_by_title()`, that you have never used. Before your fix
            relies on whether it returns copies, what is the most reliable check?
          options:
            - A learning test that changes a returned ticket and reloads it
            - Its docstring, which states whether the method returns copies
            - An AI assistant's answer, which can read the whole file
            - The behavior of `get()`, since both methods share one class
          correct_index: 0
          option_feedback:
            1: A docstring helps you form a prediction, but it can drift from the code. A learning test checks
              the behavior itself.
            2: An assistant's answer is another claim to check, not an observation, and it may not see the
              current code.
            3: Methods in one class often follow one rule, but not always. A two-line test settles it.
          explanation: A learning test turns a claim about unfamiliar code into an observation. It also stays in
            the suite, so it fails if the behavior ever changes.
    solution:
      files:
        - path: test_learning.py
          language: python
          content: |
            """Learning tests: small experiments that pin down how unfamiliar code behaves."""
            from helpdesk.models import Ticket
            from helpdesk.store import TicketStore


            def test_saved_ticket_can_be_loaded():
                store = TicketStore()
                store.save(Ticket(id=1, title="Lost wristband", priority="normal"))
                assert store.get(1).title == "Lost wristband"


            def test_changing_a_loaded_ticket_does_not_change_the_store():
                store = TicketStore()
                store.save(Ticket(id=1, title="Lost wristband", priority="normal"))
                loaded = store.get(1)
                loaded.title = "Found it"
                assert store.get(1).title == "Lost wristband"
      explanation: |
        **Trace.** `POST /tickets/1/replies` runs `App._reply` → `TicketService.add_reply` → `_load` → `TicketStore.get`, appends a cleaned reply to the copy, then calls `TicketStore.save` and `Ticket.to_dict`. Every write method (`create_ticket`, `add_reply`, `set_priority`, `close_ticket`, `reopen_ticket`) changes its copy first and then saves it; `delete_ticket` removes the row instead.

        **Prediction.** (b): the response shows the new title, a later GET the old one, because `rename` never saves.

        **Learning test.** `store.get(1)` returns a deep copy, so changing it leaves the stored ticket alone, and a second `get` returns the original title. A test that only saves and loads would also pass on a store that hands out its own objects, so it would not check the README's claim.

  # Pedagogy: worked example (a teammate's reproduction of another report), then completion: the learner
  # turns a user report into a failing test before touching production code. Michaeli & Romeike (2019)
  # found explicit debugging-process instruction improved debugging in school classes; the "observation
  # that could prove you wrong" follows Zeller's scientific method for debugging (2009). BugSpotter
  # (Padurean et al. 2025) informed the failing-test-first exercise format.
  - title: Reproduce Before You Repair
    key: reproduce
    instructions: |
      ### Why this matters

      A bug report describes a symptom, not a cause. Turning it into a failing test proves you can trigger the bug on demand; the same test later proves the fix worked and keeps the bug from coming back.

      ### 🎯 You will learn to

      - **Translate** a user's bug report into a failing regression test.
      - **Test** a hypothesis with an observation that could prove it wrong.

      #### The bug report

      > **#212 Replies vanish.** "I replied to an attendee's ticket and saw my reply appear. When I opened the ticket again, the reply was gone." (Priya, info tent staff)

      Every team test passes. The suite has a blind spot, and your first job is to cover it.

      #### A worked example from another report

      This is how a teammate reproduced an earlier report, "Deleted tickets still open":

      ```python
      def test_deleted_ticket_is_404(app):
          ticket = create(app)                                         # the state in the report
          assert app.delete(f"/tickets/{ticket['id']}").status == 204  # what the user did
          assert app.get(f"/tickets/{ticket['id']}").status == 404     # what the user expected
      ```

      It follows the user's steps through the public API, checks each status before trusting `.json`, and asserts the *expected* behavior, so it fails while the bug exists.

      #### Your turn

      1. **Reproduce.** In `test_regression.py`, write one test that follows Priya's steps and asserts what she expected. Run **Test**: your test should fail, and every team test should pass.
      2. **Hypothesize.** In `debugging_log.md`, name the function you suspect and why. Then name one observation that would prove you wrong.
      3. **Check.** Make that observation and record the result. From a test, `app.service.store.get(ticket_id)` shows what was saved. A `print` in a test shows up under **Captured stdout call**, but only when that test fails.
      4. **Fix.** Change production code so the cause is gone. Leave `test_helpdesk.py` and the storage contract as they are.
      5. **Verify.** Before **Test My Work**, reread your log: does the cause name the file, the function, and the wrong state? Then run **Test** and **Test My Work**.
