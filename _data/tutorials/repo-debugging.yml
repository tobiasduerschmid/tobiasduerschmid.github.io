          language: python
          content: |
            """Regression tests: one test per bug, written before the fix."""
            import pytest

            from helpdesk import create_app


            @pytest.fixture
            def app():
                return create_app()


            def create(app, title="Lost wristband", priority="normal"):
                response = app.post("/tickets", {"title": title, "priority": priority})
                assert response.status == 201, response
                return response.json


            def close_on(app, ticket, day):
                response = app.post(f"/tickets/{ticket['id']}/close", {"day": day})
                assert response.status == 200, response


            def test_reopen_allowed_on_the_seventh_day_after_closing(app):
                ticket = create(app)
                close_on(app, ticket, 2)
                response = app.post(f"/tickets/{ticket['id']}/reopen", {"day": 9})
                assert response.status == 200, response


            def test_reopen_rejected_on_the_eighth_day(app):
                ticket = create(app)
                close_on(app, ticket, 2)
                assert app.post(f"/tickets/{ticket['id']}/reopen", {"day": 10}).status == 409


            def test_reopened_ticket_is_saved_as_open(app):
                ticket = create(app)
                close_on(app, ticket, 2)
                assert app.post(f"/tickets/{ticket['id']}/reopen", {"day": 4}).status == 200
                stored = app.get(f"/tickets/{ticket['id']}")
                assert stored.status == 200, stored
                assert stored.json["status"] == "open"
                assert stored.json["closed_on"] is None
      explanation: |
        **Patch A** negates `<=` as `>=`. The opposite of `x <= 7` is `x > 7`, so A rejects day 7, which rule 7 includes: closed on day 2, a reopen on day 9 gets a 409.

        **Patch B** has the right condition but dropped `self.store.save(ticket)` in the rewrite. Its response shows `open`, yet the stored ticket stays closed.

        **Tests that reject them:** reopen on day 9 after a day-2 close and expect 200 (rejects A); reopen, then GET, and expect `open` with no closing day (rejects B). The model solution also checks that day 10 is rejected.

        Neither "All tests pass" claim was false. The team suite simply never checked day 7 or a reload after reopening.

  # Pedagogy: code review of an agent's pull request that edits a test instead of the code (Mock et al.
  # 2025 report AI agents changing tests to pass). Spaced retrieval of step 4: reject bad input where
  # it enters rather than where it crashes.
  - title: The Patch That Edited the Test
    key: weakened-test
    instructions: |
      ### Why this matters

      When an agent is told to make the tests pass, editing a test is the shortest route. A reviewer has to notice when a change to a test deletes the requirement it protects, because the suite stays green while the bug ships.

      ### 🎯 You will learn to

      - **Detect** a change that weakens a test instead of fixing the code.
      - **Restore** a test's intent and fix the code it protects.

      #### The pull request

      > **#248 Queue page down again.** "Front desk typed priority `ASAP`, and the queue shows a server error."

      An AI agent opened a pull request for #248, and it is checked out in your workspace. Its description:

      > "Fixed the failing `test_unknown_priority_is_rejected`. Staff use informal priorities, so the API is lenient now and I updated the test to match the current behavior. All tests pass ✅"

      ```diff
       def test_unknown_priority_is_rejected(app):
           response = app.post("/tickets", {"title": "Stage lights", "priority": "asap"})
      -    assert response.status == 400
      +    # Relaxed: staff type informal priorities, so the API accepts them now.
      +    assert response.status in (201, 400)
      ```

      #### Your turn

      1. **Review.** What does the edited test verify now? Compare the claim "the API is lenient now" with rule 3 of the README.
      2. **Restore the requirement.** Put rule 3 back into `test_unknown_priority_is_rejected` in `test_helpdesk.py`. Run **Test**: it should fail now. This time the restored team test is your reproduction, so `test_regression.py` can stay empty.
      3. **Trace.** Where do unknown priorities slip through, and why does the crash appear in the queue instead of at creation? Record both in `debugging_log.md`.
      4. **Fix the cause.** Run **Test**, then **Test My Work**.
