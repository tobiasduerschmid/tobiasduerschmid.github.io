  - title: 'Independent Case: Ghost Tickets'
    key: capstone
    instructions: |
      ### Why this matters

      An assistant's diagnosis is a set of hypotheses, however confident it sounds. Interviewers and teammates want to see you test them with evidence, find the actual cause, and leave a regression test behind, without step-by-step guidance.

      ### 🎯 You will learn to

      - **Discriminate** between an assistant's hypotheses with one observation.
      - **Apply** the whole process on your own: reproduce, localize, fix, test, and document.

      #### The bug report

      > **#255 Ghost tickets.** "We close tickets and they stay on the queue screen at the info tent. Volunteers keep walking to the merch tent for wristbands that were already found." The screen reloads `GET /queue` every few seconds.

      Since the last step, a teammate added a cache to make that screen faster. Every team test passes. You asked an AI assistant about the report and pasted only the bug report and `queue()`:

      > **Assistant:** "Two likely causes, most likely first. (1) `close_ticket` doesn't persist the status change, so the store still says `open`; move the save to the end. (2) `queue()` returns a cached list that closing never clears."

      #### Your turn

      Work this case on your own; it has one reflective hint. Use `debugging_log.md` as your guide.

      1. **Discriminate.** Name one observation that tells the assistant's two hypotheses apart, make it, and record the result.
      2. **Improve the prompt.** The assistant saw only the report and `queue()`. In the log, write the prompt you would send instead, and what you would verify in its reply.
      3. **Reproduce.** In `test_regression.py`, write a test that follows what the screen does and fails now.
      4. **Fix the cause.** Then run **Test** and **Test My Work**.
      5. **Summarize** in the log as you would at the end of an interview: cause, evidence, fix, test, and one remaining risk.
