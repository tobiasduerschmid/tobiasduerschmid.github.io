    quiz:
      title: Step 6 — Knowledge Check
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: What does `assert response.status in (201, 400)` verify about a request with priority
            `asap`?
          options:
            - "Almost nothing: it accepts the correct result and the bug"
            - That the API now accepts informal priorities
            - That the API rejects unknown priorities
            - That creating the ticket does not crash
          correct_index: 0
          option_feedback:
            1: It allows that, but it equally allows a 400. A test that accepts both outcomes cannot tell you
              which one the code produces.
            2: A 201 also passes, so the test no longer requires the rejection that rule 3 demands.
            3: It does rule out a 500, but rule 3 asks for much more, a 400 for every unknown priority.
          explanation: A useful test fails when its requirement is broken. Allowing both 201 and 400 makes it
            pass whether or not rule 3 holds, so it protects nothing.
        - type: single
          difficulty: advanced
          question: When is changing an existing test the right fix?
          options:
            - When the requirement it encodes changed on purpose
            - When it starts failing after your code change
            - When an AI assistant reports that it is flaky
            - Never, because tests must not be edited
          correct_index: 0
          option_feedback:
            1: A test failing after your change is often the test doing its job. Check the change against the
              spec before touching the test.
            2: "Flakiness is a claim you can check: a flaky test passes and fails on the same code. This one
              failed every time, for a real reason."
            3: Tests encode requirements, so when a requirement changes on purpose, its test has to change
              too. What matters is the reason.
          explanation: Edit a test when the spec changed or the test contradicts the spec, and say so in the
            review. Editing a test so failing code passes turns the suite into a description of the bug.
        - type: single
          difficulty: intermediate
          question: "For #248 the crash appears in `queue()`, but the bad priority enters earlier. Where should
            an `ASAP` request be stopped?"
          options:
            - In `clean_priority`, when the ticket is created
            - In `queue()`, by skipping unknown priorities
            - In `App.handle`, by catching `KeyError`
            - In `PRIORITY_RANK`, by adding `asap`
          correct_index: 0
          option_feedback:
            1: Skipping hides the ticket from staff but keeps invalid data in the system, and every other
              reader would need the same guard.
            2: Catching the error changes one route's response; the invalid ticket still exists.
            3: That would change the festival's priority scale, which only a change to the README could
              authorize.
          explanation: Reject invalid input where it enters, so no invalid ticket ever exists. It is the same
            move as in step 4, fixing where the bad value is created instead of where it is used.
    solution:
      files:
        - path: helpdesk/validation.py
          language: python
          content: *validation_py
        - path: test_helpdesk.py
          language: python
          content: *team_tests
      explanation: |
        **Review.** `assert response.status in (201, 400)` accepts both the correct result and the bug, so it no longer tests rule 3. The agent changed the requirement to match the code instead of the other way around.

        **Cause.** `clean_priority` only checks that the text is not empty, so `ASAP` is stored as `asap`, and `queue()` later fails on `PRIORITY_RANK['asap']`.

        **Fix.** Restore `assert response.status == 400`, and make `clean_priority` reject anything outside `PRIORITY_RANK` after stripping spaces and lowering the case. Rejecting at creation keeps bad data away from every reader; a `.get(priority, 99)` in `queue()` would hide the crash and leave invalid tickets in the system.

  # Pedagogy: independent transfer case without hints (fading complete). An AI diagnosis points at the
  # symptom site; the learner must falsify it with a discriminating observation (Hellas et al. 2023:
  # LLM feedback on code includes confident false positives) and apply the whole process alone.
  - title: 'Independent Case: Ghost Tickets'
    key: capstone
    instructions: |
      ### Why this matters

      An assistant's diagnosis is a hypothesis, however confident it sounds. Interviewers and teammates want to see you test it with evidence, find the actual cause, and leave a regression test behind, without step-by-step guidance.

      ### 🎯 You will learn to

      - **Refute** or confirm an AI diagnosis with one discriminating observation.
      - **Apply** the whole process on your own: reproduce, localize, fix, test, and document.

      #### The bug report

      > **#255 Ghost tickets.** "We close tickets and they stay in the queue. Volunteers keep walking to the merch tent for wristbands that were already found."

      Two team tests fail as well. You asked an AI assistant about the report:

      > **Assistant:** "The bug is in `queue()`. Its filter keeps tickets whose status equals `"open"`, which is fragile. Change it to `ticket.status != "closed"` so closed tickets are excluded."

      #### Your turn

      Work this case on your own; it has no hints. Use `debugging_log.md` as your guide.

      1. **Triage.** Could the bug report and both failing tests share one cause?
      2. **Test the diagnosis.** Name one observation that would prove the assistant wrong, make it, and record the result.
      3. **Reproduce.** In `test_regression.py`, write a test for the reported behavior that fails now.
      4. **Fix the cause.** Then run **Test** and **Test My Work**.
      5. **Summarize** in the log as you would at the end of an interview: cause, evidence, fix, test, and one remaining risk.
