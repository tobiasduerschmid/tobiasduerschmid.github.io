      title: Step 3 — Knowledge Check
      min_score: 0.8
      questions:
        - type: single
          difficulty: advanced
          question: |
            Another teammate proposes a different fix. `delete()` now also adds 1 to `self._deleted`, and `next_id` returns this:

            ```python
            return len(self._rows) + self._deleted + 1
            ```

            Does it meet rule 2?
          options:
            - "Yes: the sum counts every ticket ever saved"
            - "No: any formula over the current rows can repeat an ID"
            - No, because `len(self._rows)` drops after every delete
            - Yes, but only until the first ticket is deleted
          correct_index: 0
          option_feedback:
            1: That holds for formulas over the current rows alone, like `max(...) + 1`. Here the deleted count
              makes up for every row a delete removes.
            2: It does drop, but `self._deleted` rises by exactly the same amount, so the sum stays the same.
            3: Deletes are exactly what `self._deleted` accounts for, so the sum never goes back down.
          explanation: Every ticket ever saved is either still in `_rows` or counted in `_deleted`, so the sum
            never goes down and a new ID is always larger than any ID handed out before. Any form of counter that
            remembers issued IDs meets rule 2.
        - type: single
          difficulty: intermediate
          question: After a teammate's `max(...) + 1` fix, every team test passes. What does that green suite
            establish?
          options:
            - The cases the suite checks work; rule 2 has a case it skips
            - Rule 2 now holds for every sequence of creates and deletes
            - Nothing, because the suite already missed this bug once
            - The bug cannot come back, since a test now covers it
          correct_index: 0
          option_feedback:
            1: The suite only deletes the oldest ticket. Deleting the newest one still recycles an ID under this
              fix.
            2: "It does establish something: the overwrite case that the team test checks is fixed. Evidence
              covers what it checks, no more and no less."
            3: The team test protects the overwrite case only. The newest-ticket case can still break without
              any test noticing.
          explanation: A passing test is evidence for exactly the inputs it runs. Rule 2 covers every sequence of
            creates and deletes, so you compare the fix with the rule and add a test for the case the suite
            skips.
        - type: single
          difficulty: intermediate
          question: "You write a regression test for #219, and it passes on its first run, before any fix. What
            should you conclude?"
          options:
            - It does not reproduce the bug yet; change it until it fails
            - Someone already fixed the bug, so the report can be closed
            - pytest is showing a cached result from an earlier run
            - The bug report must describe the problem incorrectly
          correct_index: 0
          option_feedback:
            1: The team test still fails on this code, so the bug is present. A test that passes anyway is not
              exercising it.
            2: These runs disable pytest's cache, and each run imports your current files.
            3: The report may be imprecise, but a failing team test confirms a real bug. Make your test follow
              the report's steps first.
          explanation: A regression test earns trust by failing for the reported reason before the fix. If it
            passes on buggy code, it checks something else, so revise its steps or assertion until it fails,
            then fix the code.
