    quiz:
      title: Step 9 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
        - type: single
          difficulty: intermediate
          question: A weakly fair retry model allows every attempted upload to fail and stops at its budget. Which
            progress claim is justified?
          options:
            - Every clip eventually uploads.
            - This retry policy eventually finishes.
            - Every retry succeeds before its budget.
          correct_index: 1
          option_feedback:
            0: Fair scheduling does not force the nondeterministic network result to be success.
            2: A finite retry budget bounds attempts, not guaranteed success.
          explanation: Completion includes reporting exhausted failure. The model deliberately permits a network
            that never succeeds.
        - type: single
          difficulty: intermediate
          question: TLC checks a retry model with RetryLimit = 3. Which follow-up tests generalization most directly?
          options:
            - Recheck the same model without edits.
            - Compare new limits and their edge cases.
            - Replace the safety requirement with TRUE.
          correct_index: 1
          option_feedback:
            0: Repeating the same completed analysis does not expand its parameter scope.
            2: Weakening the property removes evidence instead of broadening it.
          explanation: Different parameter instances exercise additional cases. Even several successful instances
            do not prove all possible budgets.
    solution:
      files:
        - path: Model.tla
          language: tlaplus
          content: |
            ---- MODULE Model ----
            EXTENDS Naturals
            CONSTANT RetryLimit

            (* --fair algorithm UploadBudget {
            variables attempts = 0, uploaded = FALSE;
            {
              Try:
              while (attempts < RetryLimit /\ ~uploaded) {
                attempts := attempts + 1;
                either { uploaded := TRUE; }
                or { skip; };
              };
            }
            } *)

            BudgetOK == attempts \in 0..RetryLimit
            Finished == <> (pc = "Done" /\ (uploaded \/ attempts = RetryLimit))
            ====
        - path: Model.cfg
          language: plaintext
          content: |
            SPECIFICATION Spec
            CONSTANT RetryLimit = 2
            INVARIANT BudgetOK
            PROPERTY Finished
            CHECK_DEADLOCK FALSE
      explanation: |
        The reference repeats only while a budget remains and no success has occurred. Every iteration increments attempts before choosing success or failure. Both assignments lie within the Try step, so one modeled attempt is atomic. Weak fairness and the finite increasing budget support eventual exit, including all-failure paths. No retry occurs after success. RetryLimit = 0 skips the body immediately. This is one valid model, not a required spelling.
  # Pedagogy: Independent claim evaluation, optional temporal contrast, and delayed transfer; distinguish tool success from learning and model adequacy [L1, L2, F8, P3].
  - title: Evidence You Can Defend
    key: scoped-evidence
    run_file: Model.tla
    open_file: Model.tla
    instructions: |
      ### Why this matters

      A successful check is useful only when its conclusion matches its evidence. Explaining the bounds and assumptions is part of engineering the model, not an optional disclaimer.

      ### 🎯 You will learn to

      - Evaluate a verification claim against its model and assumptions.
      - Transfer temporal reasoning to a fresh complete behavior.

      **Independent reasoning step:** leave the editor closed for these questions first. The workspace contains a reference retry model for later comparison. This reflection has no automatic code grade.

      ### A claim worth making

      For your own capstone, write three short sentences:

      1. **Requirement and scope:** which properties did TLC finish checking, for which RetryLimit values?
      2. **Assumptions:** where did you assume atomic steps or fair scheduling, and what would justify them in an implementation?
      3. **Missing behavior:** give one concrete case your model omits and one model change that would let you investigate it.

      Compare your statement with this pattern: “For the supplied finite model at these parameter values, TLC completed the selected checks under these assumptions.” Add the actual facts. A parse success, an interrupted check, and a chosen successful behavior cannot substitute for that result. Neither can a successful check establish that an implementation conforms to the model.

      ### Two tempting shortcuts

      - A teammate removes the failing `PROPERTY` line and calls the model fixed. State what was actually checked afterward.
      - Another deletes every request transition, obtains a passing response property, and calls the service reliable. Describe an intended scenario now missing from the model and how to expose its absence.

      ### Optional extension: repetition versus settling down

      Once always and eventually feel comfortable, compare their order:

      - `[]<>p` means p keeps occurring: from every position, another true position exists. Common LTL notation is `G F p`.
      - `<>[]p` means p eventually stays true forever. Common LTL notation is `F G p`.

      For an infinite connection indicator that alternates false, true, false, true forever, decide which formula holds. Then invent a different infinite behavior satisfying both. Describe the repeating tail explicitly; a finite prefix is insufficient.

      <details markdown="1">
      <summary>Compare Recurrence and Stabilization</summary>

      Alternation satisfies `[]<>p`, but no suffix stays true, so it fails `<>[]p`. A behavior initially false and then true forever satisfies both. Both also hold if p is always true. The formula order changes the requirement.

      </details>

      ### A later return

      On another day, before rereading, model two players claiming the final team slot. Produce an unsafe interleaving, a justified atomic repair, and one progress assumption. Then classify a fresh response behavior and explain one vacuous success. Compare against your earlier notes only after committing an answer. This is retrieval and transfer practice; today's completion is not a measurement of next week's retention.

      Continue with the [TLA+ and PlusCal exploration](/SEBook/verification/tla-tutorial) to see explicit TLA+ actions. The [PlusCal C-syntax manual](https://lamport.azurewebsites.net/tla/c-manual.pdf) is the language reference.
