    quiz:
      title: Step 10 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
        - type: single
          difficulty: intermediate
          question: TLC finishes checking capacity and completion at RetryLimit = 2 with weak fairness. Which claim
            fits that evidence?
          options:
            - Those properties hold for the configured model.
            - The deployed app is correct under all schedules.
            - Every retry budget is now formally verified.
          correct_index: 0
          option_feedback:
            1: Implementation conformance and schedules excluded by the model were not established.
            2: Checking one finite instance does not prove all values of a parameter.
          explanation: The result is scoped to the supplied finite model, selected requirements, parameter values,
            and fairness assumptions.
        - type: single
          difficulty: intermediate
          question: In a one-request game lobby, join is false initially and true forever from state 2. Admitted
            is false until state 4 and true forever afterward. Which property holds at the start?
          options:
            - '`[](join => <>admitted)` only.'
            - '`[](join => admitted)` only.'
            - Both response properties hold.
          correct_index: 0
          option_feedback:
            1: At states 2 and 3, join is true but admitted is false; the same-state implication fails.
            2: Delayed admission satisfies eventual response, but not the same-state requirement.
          explanation: Every state with join true has admission then or later. The delay is allowed by eventually,
            while the same-state response fails before state 4.
        - type: single
          difficulty: intermediate
          question: A response property passes after every request-producing transition is removed. What should
            a model reviewer ask for?
          options:
            - A witness that an intended request can occur.
            - A longer trace with no request in it.
            - A simpler name for the response property.
          correct_index: 0
          option_feedback:
            1: More quiet states do not establish the missing request scenario.
            2: Renaming a formula does not change the modeled behavior.
          explanation: Validation must check that the model still includes intended behavior. A request-free model
            can satisfy the response implication vacuously.
