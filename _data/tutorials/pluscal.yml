        A defensible statement names the properties, RetryLimit values, completion status, atomicity, and fairness. The reference retries fairly but permits all sends to fail; it does not model hanging network calls, parallel clients, or real-time delays. Deleting a property weakens the checked question. Deleting requests can make response hold vacuously. Alternation demonstrates recurrence without stabilization.
