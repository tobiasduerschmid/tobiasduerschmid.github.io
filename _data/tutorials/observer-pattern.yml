  - title: "Comprehensive Assessment"
    instructions: |
      ### Why this matters

      Comparing unfamiliar cases helps reveal whether you can explain the responsibility split beyond the weather example. Use the results to identify what needs another attempt; an immediate quiz does not establish long-term retention.

      ### 🎯 You will learn to

      - Apply Observer concepts across all earlier steps without scaffolding
      - Analyze your own gaps and revisit specific steps where retrieval fails

      ## Test Your Understanding

      This is a cumulative quiz. The questions are drawn from every step and require you to synthesize what you have learned. You need at least 80% to pass.

      Take your time. If a question stumps you, think about which step covered that concept and what you learned there.

    quiz:
      title: Step 6 — Knowledge Check
      min_score: 0.8
      shuffle: true
      questions:
      - type: single
        difficulty: intermediate
        question: A document model directly chooses how a preview, counter, and save button react to text changes.
          Which refactoring addresses the dependency problem?
        options:
        - Move each reaction into an observer and keep generic notification in the model.
        - Move the widget-specific conditions into a private helper on the model.
        - Rename every widget method to `update` but retain model-owned display rules.
        correct_index: 0
        option_feedback:
          1: A helper changes code organization but leaves the document responsible for concrete views.
          2: A common method name alone does not separate responsibilities if the model still owns the display
            decisions.
        explanation: 'The responsibility boundary matters: the document manages text and announces changes;
          each view owns its response. Renaming or extracting the existing widget-specific decisions would preserve
          the coupling.'
      - type: single
        difficulty: intermediate
        question: A preview observer has displayed "Hi". Client code detaches it and changes the document to
          "Hello". What happens to that preview object in the tutorial's direct Observer design?
        options:
        - It receives one final update and stores "Hello".
        - It receives no update and retains "Hi".
        - It is automatically destroyed by detaching.
        correct_index: 1
        option_feedback:
          0: This detach operation only removes the recipient from future notifications.
          2: Object lifetime and subscription membership are different. Other references may keep the preview
            alive.
        explanation: Detach removes the registration. It neither performs a final update nor destroys the observer;
          any remaining references can still reach the object and its stored state.
      - type: single
        difficulty: intermediate
        question: A Python sensor setter stores 80 but omits notification. Its logger was attached when the
          previous value was 72. Which observation would diagnose the missing call?
        options:
        - The sensor reports 80 while the logger retains its previous readings.
        - The sensor and logger both reject 80 because notification is required.
        - The logger records 80 automatically when the property setter returns.
        correct_index: 0
        option_feedback:
          1: An omitted notification does not roll back an ordinary Python assignment.
          2: A property setter has no automatic notification mechanism unless its implementation supplies one.
        explanation: The state change can succeed without invoking observers. Checking both the source state
          and the observer's recorded state distinguishes the missing-notification path.
      - type: single
        difficulty: intermediate
        question: A weather station already exposes temperature and humidity. A new dew-point display needs
          only those values. What must change to add it using the existing Observer contract?
        options:
        - Add a dew-point branch to the station's notification loop.
        - Add a new station subclass for every dew-point display instance.
        - Implement the display's update operation and attach it from client code.
        correct_index: 2
        option_feedback:
          0: A branch for the new display would restore the concrete dependency the pattern removed.
          1: A new display reaction does not require a new kind of weather station.
        explanation: The existing data and contract are sufficient, so only the new observer and its composition
          code are needed. If a display required new sensor data, the subject API might also need to change.
      - type: single
        difficulty: intermediate
        question: A program writes messages to one fixed log writer. It has no requirement for independent subscribers
          or changing registrations. Which design is the best starting point?
        options:
        - Introduce a subscriber registry because every event needs Observer.
        - Use a direct call through the writer's existing contract.
        - Introduce Observer now because every program eventually adds subscribers.
        correct_index: 1
        option_feedback:
          0: An event can be handled by an ordinary call. Event terminology alone does not require Observer.
          2: Possible future requirements do not establish a present need; reassess if the collaboration changes.
        explanation: A direct call meets the stated need with less indirection. One receiver does not forbid
          Observer, but these requirements provide no reason to add subscription machinery.
      - type: single
        difficulty: intermediate
        question: In a UML class diagram, a solid line with a hollow triangle and a dashed line with a hollow
          triangle have different meanings. Which pairing is correct?
        options:
        - 'Solid: composition; dashed: shared aggregation.'
        - 'Solid: mandatory registration; dashed: optional registration.'
        - 'Solid: generalization; dashed: interface realization.'
        correct_index: 2
        option_feedback:
          0: Composition and aggregation use diamonds, not hollow triangles.
          1: Line style here describes the relationship kind, not whether registration is mandatory.
        explanation: Generalization denotes inheritance; realization denotes fulfillment of an interface contract.
          Python inheritance from an abstract base class is still generalization, even when the base serves
          the Observer role.
      - type: single
        difficulty: intermediate
        question: A weather observer currently receives `update(subject)` and queries getters. It is changed
          to receive `update(temp, humidity, pressure)`. Which dependency changes?
        options:
        - A subject-query API dependency becomes a pushed-payload dependency.
        - All dependencies disappear because the observer receives only values.
        - The subject must now select reactions by each concrete display's class.
        correct_index: 0
        option_feedback:
          1: The observer still depends on the payload's meaning and the update signature.
          2: Every observer can receive the same agreed payload through its own update implementation.
        explanation: Pull couples observers to the available query API. Push couples them to the supplied payload
          and update signature. Either variant can use a common observer contract without naming concrete display
          classes.
      - type: single
        difficulty: intermediate
        question: "A Python weather station stores all three fields, but its pull observer consistently displays\
          \ the previous complete measurement. Trace this implementation:\n\n```python\ndef new_measurement(self,\
          \ temp, humidity, pressure):\n    self.notify()\n    self._temperature = temp\n    self._humidity\
          \ = humidity\n    self._pressure = pressure\n```\n\nWhich repair matches the cause?"
        options:
        - Detach and reattach the display before every measurement.
        - Notify after storing all three fields of the new measurement.
        - Notify after storing temperature but before storing the other fields.
        correct_index: 1
        option_feedback:
          0: The shown error is notification timing, not a missing registration.
          2: The observer could read a new temperature together with old humidity and pressure.
        explanation: The observer queries the station during notification. Announcing before assignment exposes
          the old measurement; announcing midway exposes mixed state. Complete the state change before notifying.
      - type: single
        difficulty: advanced
        question: 'Compare three weather-station designs: Direct calls to concrete displays; Pull with `update(subject)`;
          Push with `update(temp, humidity, pressure)`. Which dependency comparison is accurate?'
        options:
        - Direct knows concrete displays; Pull needs a query API; Push needs a payload contract.
        - Direct knows concrete displays; Pull needs no query API; Push needs a payload contract.
        - Direct knows concrete displays; Pull needs a query API; Push needs no payload contract.
        correct_index: 0
        option_feedback:
          1: A pull observer needs an agreed way to retrieve the state it uses.
          2: A push observer needs an agreed payload format and meaning.
        explanation: Observer removes concrete-display knowledge from generic notification. Pull and Push still
          impose different data contracts, so neither is universally free of coupling.
      - type: multiple
        difficulty: advanced
        question: Which claims hold for the Observer pattern, independent of a particular framework? Select
          all that apply.
        options:
        - Subjects can notify through a shared observer contract.
        - Observer chains can make the effects of a change hard to trace.
        - Every implementation must notify in registration order.
        - Notification automatically provides reliable delivery across processes.
        correct_indices:
        - 0
        - 1
        option_feedback:
          0: The subject can depend on the common operation instead of each concrete observer type.
          1: An update may trigger further changes and notifications, creating a chain that must be traced.
          2: A list-based example can preserve registration order, but Observer itself does not require that
            order.
          3: Persistence, retries, transport, and delivery guarantees do not come from the Observer pattern
            alone.
        explanation: The pattern separates generic notification from concrete reactions, at the cost of indirect
          control flow. Ordering, scheduling, error handling, and cross-process delivery guarantees require
          additional implementation decisions.


