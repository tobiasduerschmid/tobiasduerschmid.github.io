        options:
        - The subject checks each concrete class name to select its reaction.
        - Each observer provides its own implementation of the shared `update()` contract.
        - The property setter returns a different result to each registered observer.
        correct_index: 1
        option_feedback:
          0: Class-name branches would reintroduce the concrete dependencies this refactoring removes.
          2: A setter return value does not broadcast to registered objects. The explicit update calls do.
        explanation: The notification mechanism calls the same operation on every registered observer. Method
          dispatch selects each object's implementation, so the subject need not encode logger- or alert-specific
          behavior.
      - type: single
        difficulty: intermediate
        question: 'A Python temperature logger appends readings only when notified. Trace these calls: attach
          the logger; set the temperature to 72; detach the logger; set it to 95. Which readings does the logger
          retain?'
        options:
        - '`[72]`'
        - '`[72, 95]`'
        - '`[]`'
        correct_index: 0
        option_feedback:
          1: The logger is no longer registered when 95 is assigned, so that update does not reach it.
          2: Detaching removes a registration, not the logger's existing state.
        explanation: The logger receives 72 while registered. Detaching prevents future notifications; it does
          not delete readings already recorded. No initial update is requested by attaching in this implementation.
      - type: single
        difficulty: intermediate
        question: A Python temperature setter stores the new value but never calls the supplied notification
          mechanism. What happens to an attached logger?
        options:
        - It records the new value automatically because the setter is a property.
        - It rejects the state change because no notification occurred.
        - It keeps its earlier readings while the sensor holds the new value.
        correct_index: 2
        option_feedback:
          0: The property decorator supplies accessor behavior, not an automatic observer broadcast.
          1: The state assignment still executes. The missing notification leaves observers uninformed.
        explanation: Python properties invoke getters and setters; they do not automatically implement Observer.
          With no notification call, the logger's update operation is not invoked.
      - type: single
        difficulty: intermediate
        question: 'A UML class diagram shows `TemperatureSensor --|> Subject`: a solid line with a hollow triangle
          pointing to Subject. Which claim does this express?'
        options:
        - TemperatureSensor inherits from Subject.
        - TemperatureSensor owns a separate Subject object.
        - TemperatureSensor only calls a method on Subject.
        correct_index: 0
        option_feedback:
          1: Ownership or a stored reference is a different relationship from inheritance.
          2: A method call alone does not establish an inheritance relationship.
        explanation: 'This is generalization: the sensor is a specialized Subject. The example inherits registration
          and notification behavior; using a separate base class is an implementation choice, not a universal
          requirement of Observer.'


