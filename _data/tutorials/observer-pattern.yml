title: "The Observer Pattern"
description: "Refactor a weather station with Observer, trace notifications, and judge when the extra flexibility is useful. Assumes Python classes, inheritance, abstract base classes, and properties; includes live UML diagrams and scenario knowledge checks."

# Authoring-time Bloom-verb objectives. Not yet rendered to students.
learning_objectives:
  - "Apply the Subject and Observer roles to decouple a system that has tight one-way coupling."
  - "Predict what breaks (and why) when a tightly-coupled implementation gains a new requirement."
  - "Read UML class diagrams to confirm a refactoring preserved Subject/Observer roles."
  - "Distinguish push vs. pull update styles and choose the appropriate trade-off."
  - "Evaluate when Observer is useful and when a direct call suffices; recognize that callbacks can also implement Observer."

backend: pyodide
linter: true  # live pyflakes diagnostics in the Monaco gutter
debugger: true
uml_diagram: true
uml_position: right
uml_default_view: true
require_tests: true
autosave_type: files

setup_commands:
  - "import sys; sys.path.insert(0, '/tutorial'); import abc"

steps:

  # --------------------------------------------------------------------------
  # STEP 1 — "When One Display Breaks the Whole System"
  # Pedagogy:
  #   Productive Failure (DIRR: Design-Implement phase) — students struggle
  #     with tightly coupled code on purpose.
  #   Growth Mindset — errors are expected and the point of the exercise.
  #   UML Inference — students see tight coupling visualized in the diagram.
  #   Bloom's level — Apply (add a class), Analyze (quiz on coupling).
  # --------------------------------------------------------------------------
  - title: "When One Display Breaks the Whole System"
    instructions: |
      ### Why this matters

      A domain model becomes harder to reuse when it creates specific views and controls their updates. Separating those responsibilities lets displays change without repeatedly editing the model.

      ### 🎯 You will learn to

      - Identify the symptoms of tightly coupled code in a real codebase
      - Analyze why direct dependencies create maintenance headaches as systems grow

      ### Diagram Views

      Use the **UML Diagram** tab to inspect the structure of your current Python files. **Implementation details** preserves source names and types; **Design focus** simplifies them. The smaller diagrams in these instructions highlight selected responsibilities and dependencies. Compare their meaning with your code, then use **Test My Work** to check behavior; a diagram alone does not establish correctness.

      ## The Scenario

      > **Prerequisites:** This tutorial assumes you are comfortable with Python **classes**, **inheritance**, **abstract base classes** (`ABC`, `@abstractmethod`), and **`@property` decorators**. If any of these are unfamiliar, review them first — you will need all four.

      You work at a weather company. Your `WeatherStation` collects temperature, humidity, and pressure data from sensors, and updates three displays:

      | Display | What it shows |
      |---|---|
      | **CurrentDisplay** | Current temperature and humidity |
      | **StatisticsDisplay** | Average, min, and max temperature |
      | **ForecastDisplay** | Weather forecast based on pressure |

      ### The Architecture Problem

      Open the **UML Diagram** view. Notice how `WeatherStation` has direct arrows to every single display. That means the station **hard-codes** every display it talks to:

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-role="reference-design" data-uml-caption="Adding a display changes the station because it creates and calls concrete display classes. Parameter lists are abbreviated to keep the dependencies visible." data-uml-spec='@startuml
      layout compact
      skinparam classAttributeIconSize 0
      class WeatherStation {
        + new_measurement(...)
      }
      class CurrentDisplay {
        + show(...)
      }
      class StatisticsDisplay {
        + show(...)
      }
      class ForecastDisplay {
        + show(...)
      }
      WeatherStation --> CurrentDisplay : creates and calls
      WeatherStation --> StatisticsDisplay : creates and calls
      WeatherStation --> ForecastDisplay : creates and calls
      @enduml'></div>

      The code works. Ship it, right? Not so fast. Your manager just dropped a new requirement:

      > **"Add a Heat Index Display that shows the computed heat index based on temperature and humidity."**

      ### Your Task

      Open `weather_station.py` and:

      1. **Create a `HeatIndexDisplay` class** with a `show(self, temp, humidity, pressure)` method. Use this illustrative practice formula (not a meteorological heat-index model):
         ```
         heat_index = temp - 0.55 * (1 - humidity/100) * (temp - 58)
         ```
         Print: `[Heat]     Heat Index: {value:.1f}°F`

      2. **Integrate it into `WeatherStation`** so it gets called whenever new data arrives.

      3. **Run the code** and verify all four displays update.

      ### What to Notice

      Pay attention to **how many places you had to change** just to add one new display. Count them. Then check the **UML Diagram** tab — watch the new dependency arrow appear. That observation is the entire point of this exercise.

      ### Errors Are Expected

      If something breaks, use the error message to locate the dependency that needs attention. The goal is to notice which responsibilities force the station to change.

    uml_files:
      - weather_station.py

    files:
      - path: "weather_station.py"
        content: |
          class CurrentDisplay:
              """Shows current temperature and humidity."""

              def show(self, temp: float, humidity: float, pressure: float) -> None:
                  print(f"[Current]  {temp}°F, {humidity}% humidity")


          class StatisticsDisplay:
              """Shows average, min, max temperature."""

              def __init__(self) -> None:
                  self._temps: list[float] = []

              def show(self, temp: float, humidity: float, pressure: float) -> None:
                  self._temps.append(temp)
                  avg = sum(self._temps) / len(self._temps)
                  lo, hi = min(self._temps), max(self._temps)
                  print(f"[Stats]    Avg={avg:.1f}°F  Min={lo}°F  Max={hi}°F")


          class ForecastDisplay:
              """Shows forecast based on pressure changes."""

              def __init__(self) -> None:
                  self._last_pressure: float = 0.0

              def show(self, temp: float, humidity: float, pressure: float) -> None:
                  if pressure > self._last_pressure:
                      outlook = "Improving weather!"
                  elif pressure < self._last_pressure:
                      outlook = "Cooler, rainy weather"
                  else:
                      outlook = "More of the same"
                  self._last_pressure = pressure
                  print(f"[Forecast] {outlook}")


          class WeatherStation:
              """Collects weather data and updates all displays.

              This class directly creates and calls every display.
              To add a new display, you must modify THIS class."""

              def __init__(self) -> None:
                  self.current: CurrentDisplay = CurrentDisplay()
                  self.stats: StatisticsDisplay = StatisticsDisplay()
                  self.forecast: ForecastDisplay = ForecastDisplay()

              def new_measurement(self, temp: float, humidity: float, pressure: float) -> None:
                  """Called when sensors report new weather data."""
                  print(f"\n--- Measurement: {temp}°F, {humidity}%, {pressure} hPa ---")
                  self.current.show(temp, humidity, pressure)
                  self.stats.show(temp, humidity, pressure)
                  self.forecast.show(temp, humidity, pressure)


          # --- Demo ---
          if __name__ == "__main__":
              station = WeatherStation()
              station.new_measurement(80, 65, 1013.25)
              station.new_measurement(82, 70, 1012.50)
              station.new_measurement(78, 90, 1015.00)
        language: "python"

    open_file: "weather_station.py"

    solution:
      files:
        - path: "weather_station.py"
          content: |
            class CurrentDisplay:
                """Shows current temperature and humidity."""

                def show(self, temp: float, humidity: float, pressure: float) -> None:
                    print(f"[Current]  {temp}°F, {humidity}% humidity")


            class StatisticsDisplay:
                """Shows average, min, max temperature."""

                def __init__(self) -> None:
                    self._temps: list[float] = []

                def show(self, temp: float, humidity: float, pressure: float) -> None:
                    self._temps.append(temp)
                    avg = sum(self._temps) / len(self._temps)
                    lo, hi = min(self._temps), max(self._temps)
                    print(f"[Stats]    Avg={avg:.1f}°F  Min={lo}°F  Max={hi}°F")


            class ForecastDisplay:
                """Shows forecast based on pressure changes."""

                def __init__(self) -> None:
                    self._last_pressure: float = 0.0

                def show(self, temp: float, humidity: float, pressure: float) -> None:
                    if pressure > self._last_pressure:
                        outlook = "Improving weather!"
                    elif pressure < self._last_pressure:
                        outlook = "Cooler, rainy weather"
                    else:
                        outlook = "More of the same"
                    self._last_pressure = pressure
                    print(f"[Forecast] {outlook}")


            class HeatIndexDisplay:
                """Shows the computed heat index."""

                def show(self, temp: float, humidity: float, pressure: float) -> None:
                    heat_index = temp - 0.55 * (1 - humidity / 100) * (temp - 58)
                    print(f"[Heat]     Heat Index: {heat_index:.1f}°F")


            class WeatherStation:
                """Collects weather data and updates all displays."""

                def __init__(self) -> None:
                    self.current: CurrentDisplay = CurrentDisplay()
                    self.stats: StatisticsDisplay = StatisticsDisplay()
                    self.forecast: ForecastDisplay = ForecastDisplay()
                    self.heat_index: HeatIndexDisplay = HeatIndexDisplay()

                def new_measurement(self, temp: float, humidity: float, pressure: float) -> None:
                    """Called when sensors report new weather data."""
                    print(f"\n--- Measurement: {temp}°F, {humidity}%, {pressure} hPa ---")
                    self.current.show(temp, humidity, pressure)
                    self.stats.show(temp, humidity, pressure)
                    self.forecast.show(temp, humidity, pressure)
                    self.heat_index.show(temp, humidity, pressure)


            # --- Demo ---
            if __name__ == "__main__":
                station = WeatherStation()
                station.new_measurement(80, 65, 1013.25)
                station.new_measurement(82, 70, 1012.50)
                station.new_measurement(78, 90, 1015.00)
          language: "python"
      explanation: |
        **Why this matters:**

        To add ONE display, you changed `WeatherStation` in **two** places:
        1. `__init__` — create the new display
        2. `new_measurement` — call its `show()` method

        Check the UML diagram: there are now **four** dependency arrows from `WeatherStation`. Each one is a hard-coded coupling. Imagine 20 displays, or needing to add/remove displays at runtime. This design does not scale.

    tests:
      - description: Heat display follows the supplied calculation across varied inputs
        command: |
          import io, contextlib, re
          source = open('/tutorial/weather_station.py').read()
          ns = {'__name__': 'observer_exercise'}
          with contextlib.redirect_stdout(io.StringIO()):
              exec(source, ns)
          display = ns['HeatIndexDisplay']()
          for temperature, humidity in [(80, 65), (91, 0), (73, 100), (58, 35)]:
              output = io.StringIO()
              with contextlib.redirect_stdout(output):
                  display.show(temperature, humidity, 1000)
              values = re.findall(r'Heat Index:\s*(-?\d+(?:\.\d+)?)', output.getvalue())
              expected = round(temperature - 0.55 * (1 - humidity / 100) * (temperature - 58), 1)
              assert len(values) == 1 and abs(float(values[0]) - expected) < 0.001, 'Check the displayed result for changed temperature and humidity.'
        hints:
          - title: One Display, One Responsibility
            text: Start with the display interface in the task. Which operation receives a measurement, and what result must this display report?
            condition: 'code_not_matches: /^class HeatIndexDisplay\b(?:(?!^class |^def )[\s\S])*?^    def show\([^\n]*\n(?:(?!^class |^def |^    def )[\s\S])*(?:print\s*\()/m'
          - title: Vary the Humidity
            text: Keep temperature fixed and compare humidity 0 with humidity 100. Should the displayed result stay the same? Trace the supplied formula before changing your code.
            condition: 'code_matches: /^class HeatIndexDisplay\b(?:(?!^class |^def )[\s\S])*?^    def show\([^\n]*\n(?=(?:(?!^class |^def |^    def )[\s\S])*(?:print\s*\())(?!(?:(?!^class |^def |^    def )[\s\S])*(?:humidity))/m'
          - title: Trace the Intermediate Values
            text: For one new input, write down the humidity fraction, the correction, and the final value separately. Compare your result with the one-decimal display requirement.
            condition: 'code_matches: /^class HeatIndexDisplay\b(?:(?!^class |^def )[\s\S])*?^    def show\([^\n]*\n(?=(?:(?!^class |^def |^    def )[\s\S])*(?:print\s*\())(?=(?:(?!^class |^def |^    def )[\s\S])*(?:humidity))/m'
      - description: Every new measurement reaches the heat display
        command: |
          import io, contextlib, re
          source = open('/tutorial/weather_station.py').read()
          ns = {'__name__': 'observer_exercise'}
          with contextlib.redirect_stdout(io.StringIO()):
              exec(source, ns)
          station = ns['WeatherStation']()
          output = io.StringIO()
          with contextlib.redirect_stdout(output):
              station.new_measurement(80, 65, 1013.25)
              station.new_measurement(91, 0, 1000)
              station.new_measurement(73, 100, 1010)
          values = re.findall(r'Heat Index:\s*(-?\d+(?:\.\d+)?)', output.getvalue())
          assert [float(value) for value in values] == [75.8, 72.8, 73.0], 'Each new measurement should produce its own heat display result.'
        hints:
          - title: Trace a Measurement
            text: Find the station operation that receives new measurements. Which existing displays receive that measurement?
            condition: 'code_not_matches: /^class WeatherStation\b(?:(?!^class |^def )[\s\S])*?^    def new_measurement\([^\n]*\n(?:(?!^class |^def |^    def )[\s\S])*(?:\.show\s*\()/m'
          - title: Find the Missing Dependent
            text: Compare the display objects created by the station with the displays called for a measurement. Which relationship has not been connected yet?
            condition: 'code_matches: /^class WeatherStation\b(?:(?!^class |^def )[\s\S])*?^    def new_measurement\([^\n]*\n(?=(?:(?!^class |^def |^    def )[\s\S])*(?:\.show\s*\())(?!(?:(?!^class |^def |^    def )[\s\S])*(?:heat|Heat))/m'
          - title: Check More Than One Reading
            text: Run two different measurements. Check that each display reacts once to each, and that the added display uses the new inputs rather than a stored sample.
            condition: 'code_matches: /^class WeatherStation\b(?:(?!^class |^def )[\s\S])*?^    def new_measurement\([^\n]*\n(?=(?:(?!^class |^def |^    def )[\s\S])*(?:\.show\s*\())(?=(?:(?!^class |^def |^    def )[\s\S])*(?:heat|Heat))/m'
      - description: The original three displays still update for each measurement
        command: |
          import io, contextlib, re
          source = open('/tutorial/weather_station.py').read()
          ns = {'__name__': 'observer_exercise'}
          with contextlib.redirect_stdout(io.StringIO()):
              exec(source, ns)
          station = ns['WeatherStation']()
          output = io.StringIO()
          with contextlib.redirect_stdout(output):
              station.new_measurement(80, 65, 1013.25)
              station.new_measurement(82, 70, 1012.50)
          lines = output.getvalue().splitlines()
          for prefix in ['[Current]', '[Stats]', '[Forecast]']:
              assert sum(line.strip().startswith(prefix) for line in lines) == 2, 'Keep each existing display connected to every measurement.'
          assert 'Improving weather!' in output.getvalue() and 'Cooler, rainy weather' in output.getvalue(), 'Existing forecasts must retain their response to changing pressure.'
        hints:
          - title: Trace a Measurement
            text: Find the station operation that receives new measurements. Which existing displays receive that measurement?
            condition: 'code_not_matches: /^class WeatherStation\b(?:(?!^class |^def )[\s\S])*?^    def new_measurement\([^\n]*\n(?:(?!^class |^def |^    def )[\s\S])*(?:\.show\s*\()/m'
          - title: Find the Missing Dependent
            text: Compare the display objects created by the station with the displays called for a measurement. Which relationship has not been connected yet?
            condition: 'code_matches: /^class WeatherStation\b(?:(?!^class |^def )[\s\S])*?^    def new_measurement\([^\n]*\n(?=(?:(?!^class |^def |^    def )[\s\S])*(?:\.show\s*\())(?!(?:(?!^class |^def |^    def )[\s\S])*(?:heat|Heat))/m'
          - title: Check More Than One Reading
            text: Run two different measurements. Check that each display reacts once to each, and that the added display uses the new inputs rather than a stored sample.
            condition: 'code_matches: /^class WeatherStation\b(?:(?!^class |^def )[\s\S])*?^    def new_measurement\([^\n]*\n(?=(?:(?!^class |^def |^    def )[\s\S])*(?:\.show\s*\())(?=(?:(?!^class |^def |^    def )[\s\S])*(?:heat|Heat))/m'

    quiz:
      title: Step 1 — Knowledge Check
      min_score: 0.8
      shuffle: true
      questions:
      - type: single
        difficulty: intermediate
        question: In the original Python weather station, the constructor creates each display and `new_measurement()`
          calls each display directly. What makes adding a display affect the station?
        options:
        - The station names each concrete display in its construction and update code.
        - The displays share one Python file with the station and its demonstration.
        - The displays accept the same three values in their method parameters.
        correct_index: 0
        option_feedback:
          1: Moving classes into separate files would preserve the same construction and call dependencies.
          2: A common parameter list does not force the station to name every concrete display. The hard-coded
            wiring does.
        explanation: The station owns both the concrete display selection and the calls to those displays. A
          new display therefore requires changing that wiring inside the station.
      - type: single
        difficulty: intermediate
        question: Which change demonstrates the coupling problem in the original weather station?
        options:
        - Changing a display's private formatting while keeping its `show()` contract.
        - Adding another display type requires changing the station's update code.
        - Moving a display class to a different location within the same file.
        correct_index: 1
        option_feedback:
          0: A formatting change can remain entirely inside the display when the call contract stays the same.
          2: Source-file order alone does not determine the design dependency.
        explanation: The problem is a change to the set of displays forcing a change to the data-producing class.
          Not every edit to a display requires a station edit; internal changes can stay behind its existing
          method contract.
      - type: single
        difficulty: intermediate
        question: The original Python station always creates `ForecastDisplay` and calls `self.forecast.show(...)`.
          You want it to stop using that display. What must change?
        options:
        - Remove the class definition while retaining both station references.
        - Set the station field to `None` while retaining its method call.
        - Remove the station's forecast construction and update call.
        correct_index: 2
        option_feedback:
          0: The remaining constructor reference would try to create a class that no longer exists.
          1: The remaining call would try to invoke `show()` on `None`.
        explanation: The station must stop both creating and calling the forecast display. The unused class
          definition may remain for another client; deleting it is not required.
      - type: single
        difficulty: intermediate
        question: Users now want to enable and disable weather displays during a session. Why does the original
          station design need revision?
        options:
        - The fixed display fields and calls provide no subscription mechanism.
        - The station sends the same measurement to more than one display.
        - Each display computes a different result from the same measurement.
        correct_index: 0
        option_feedback:
          1: Several displays can legitimately receive the same measurement; that is the intended behavior.
          2: Different display reactions are useful. The problem is the station's fixed knowledge of its recipients.
        explanation: The supplied design has fixed construction and call sites. Dynamic registration could be
          added, but it is not provided by this design; the issue is its structure, not a Python limitation.


  # --------------------------------------------------------------------------
  # STEP 2 — "Design Patterns: A Shared Vocabulary"
  # Pedagogy:
  #   Constructivism — anchor abstract pattern in YouTube subscription schema.
  #   PRIMM: Predict-Run — students predict output before running.
  #   Cognitive scaffolding — conceptual before procedural.
  #   Bloom's level — Remember (vocabulary), Understand (analogy).
  # --------------------------------------------------------------------------
  - title: "Design Patterns: A Shared Vocabulary"
    instructions: |
      ### Why this matters

      Design patterns give collaborators a shared vocabulary for recurring design problems and their trade-offs. Naming the changing object and its dependents makes the responsibility split easier to discuss.

      ### 🎯 You will learn to

      - Define what a design pattern is and where the Gang of Four catalog comes from
      - Apply the YouTube subscription analogy to map Observer's roles onto a familiar mental model

      ## What Are Design Patterns?

      ### The YouTube Analogy

      Imagine a video channel with a subscription list: interested viewers register, the channel announces an upload, and viewers decide how to react. This analogy explains registration and notification; actual platform delivery and user preferences are outside our object-level model.

      | Subscription analogy | Observer role | Weather example |
      |---|---|---|
      | Channel | **Subject** | WeatherStation |
      | Interested viewer | **Observer** | Display object |
      | Subscribe / unsubscribe | **`attach()` / `detach()`** | Register / remove a display |
      | Upload announcement | **`notify()`** | Call registered displays' `update()` |

      The narration uses a **Document** with Preview, Character Count, and Save observers. Here, the station owns measurements while displays own presentation. The same separation matters in both examples.

      ### What Is a "Design Pattern"?

      A **design pattern** is a proven, reusable solution to a common software design problem. Design patterns are not code you copy-paste — they are **blueprints** for structuring your classes and objects to solve specific types of architectural problems.

      The most famous catalog comes from the 1994 book *Design Patterns* by Gamma, Helm, Johnson, and Vlissides — the **Gang of Four (GoF)**. They cataloged 23 patterns in three categories:

      | Category | What It Solves | Examples |
      |---|---|---|
      | **Creational** | How objects are created | Factory Method, Singleton, Builder |
      | **Structural** | How objects are composed | Adapter, Decorator, Facade |
      | **Behavioral** | How objects communicate | **Observer**, Strategy, State |

      The Observer is a **behavioral** pattern — it defines how objects talk to each other in a loosely coupled way.

      ### The Observer Pattern in UML

      Here is the design of the small preview below. Compare it with Step 1: `DataSource` plays the Subject role and refers to the common `Observer` contract instead of specific dashboards.

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-role="reference-design" data-uml-caption="DataSource pushes a value through the Observer contract; adding a dashboard leaves DataSource unchanged." data-uml-spec='@startuml
      skinparam classAttributeIconSize 0
      class DataSource {
        - observers: Sequence<Observer>
        + attach(observer: Observer)
        + set_value(value: Integer)
      }
      interface Observer {
        + update(value: Integer)
      }
      class DashboardA {
        + update(value: Integer)
      }
      class DashboardB {
        + update(value: Integer)
      }
      DataSource --> "0..*" Observer : notifies with value
      DashboardA ..|> Observer
      DashboardB ..|> Observer
      @enduml'></div>

      This preview combines state and notification in `DataSource`; Step 3 extracts reusable registration into a `Subject` base class and adds detachment. Both structures can express Observer.

      **Key UML relationships:**
      - **Generalization** <span class="uml-sym" data-diagram="class" data-sym="--|>"></span> = inheritance ("is-a")
      - **Realization** <span class="uml-sym" data-diagram="class" data-sym="..|>"></span> = implements interface
      - **Association** <span class="uml-sym" data-diagram="class" data-sym="-->"></span> = stores references; ownership is unspecified

      ### Polling vs. Notification

      With **polling**, a display periodically asks whether data changed, including when nothing has happened. Detection may wait until the next check. With Observer, the subject initiates notification. The costs depend on frequency and implementation; notification is not a universal performance guarantee.

      Our preview sends the changed value directly, like the narration sends text. Its callbacks run synchronously in list order. Observer itself does not guarantee that order or create asynchronous tasks.

      ### PRIMM Exercise: Predict, Run, Investigate, Modify

      #### 1. Predict
      Look at `pattern_preview.py`. **Before running it**, predict:
      - Which values does `DashboardA` see now? If its registration moves after the first `set_value`, which values would it see?
      - In the supplied list-based implementation, does A finish its update before B begins?

      #### 2. Run
      Run the unedited preview first. Then move A's registration after the first `set_value` and run again. Compare both results with your predictions; restore that registration before the other experiments.

      #### 3. Investigate
      Try these modifications and observe what changes:
      - **Remove** the line `source.attach(DashboardB())`. What happens to Dashboard B? Why?
      - **Add** a third `source.set_value(30)` at the bottom. How many total lines print?
      - **Move** `source.attach(DashboardA())` to *after* the first `set_value(10)`. Does Dashboard A see the value 10?

      #### 4. Modify
      **Add a `DashboardC`** that implements the shared Observer contract and prints the value squared (e.g., `"Dashboard C sees: 100 (squared)"`). Register it in the composition code without editing `DataSource`. Check two different values, then explain why the source no longer needs the concrete dashboard types.

      This is an **exploratory step**. Run and inspect your changes, then select **Next** for the knowledge check; there is no code-test gate and no need to undo your extension.

    files:
      - path: pattern_preview.py
        content: |
          from __future__ import annotations
          from abc import ABC, abstractmethod


          class Observer(ABC):
              @abstractmethod
              def update(self, value: int) -> None:
                  pass

          # A tiny preview of the Observer pattern in action.
          # PREDICT: What will this print? In what order?

          class DataSource:
              """A simple Subject that notifies observers."""

              def __init__(self) -> None:
                  self._observers: list[Observer] = []
                  self._value: int = 0

              def attach(self, observer: Observer) -> None:
                  self._observers.append(observer)

              def set_value(self, new_value: int) -> None:
                  self._value = new_value
                  print(f"Data changed! New value: {self._value}")
                  for obs in self._observers:
                      obs.update(self._value)


          class DashboardA(Observer):
              def update(self, value: int) -> None:
                  print(f"  Dashboard A sees: {value}")


          class DashboardB(Observer):
              def update(self, value: int) -> None:
                  print(f"  Dashboard B sees: {value * 2} (doubled)")


          source = DataSource()
          source.attach(DashboardA())
          source.attach(DashboardB())

          source.set_value(10)
          source.set_value(20)
        language: python

    open_file: "pattern_preview.py"

    quiz:
      title: Step 2 — Knowledge Check
      min_score: 0.8
      shuffle: true
      questions:
      - type: single
        difficulty: basic
        question: In an Observer collaboration, which responsibility belongs to the Subject role?
        options:
        - Maintain registrations and notify observers through their common contract.
        - Decide how every concrete view should format and display its own values.
        - Periodically ask every observer whether the application state changed.
        correct_index: 0
        option_feedback:
          1: Formatting belongs to the individual view. Moving that responsibility out of the subject is the
            design improvement.
          2: Here the subject initiates notification. Asking observers to discover changes reverses that collaboration.
        explanation: The Subject provides registration and notification. A concrete subject holds the application
          state; each concrete observer owns its reaction to an update.
      - type: single
        difficulty: intermediate
        question: A display currently checks a sensor every five seconds, even when readings are unchanged.
          What can change-driven notification improve?
        options:
        - It guarantees lower memory use than every possible polling design.
        - It avoids periodic checks and the wait until the next polling interval.
        - It guarantees all displays finish their updates at the same instant.
        correct_index: 1
        option_feedback:
          0: Registrations and dispatch also consume resources. Observer does not provide a universal memory
            advantage.
          2: A notification loop may call observers synchronously, one after another.
        explanation: When the sensor can announce relevant changes, displays need not repeatedly check for them.
          This does not guarantee lower total cost or simultaneous delivery; those depend on the implementation
          and workload.
      - type: single
        difficulty: basic
        question: What does a design pattern give a developer?
        options:
        - A fixed source-code implementation to copy unchanged into a project.
        - A reusable design for a recurring problem, adapted to its context.
        - A language feature that enforces the design automatically at runtime.
        correct_index: 1
        option_feedback:
          0: Example code illustrates a pattern, but its details need to fit the new application.
          2: Languages may support convenient implementations, but naming a pattern does not enforce it.
        explanation: A pattern names a recurring problem, a solution structure, and its consequences. Its classes
          and methods are adapted to the application rather than copied as a universal implementation.
      - type: single
        difficulty: intermediate
        question: In a UML class diagram, a concrete view has a dashed line with a hollow triangle pointing
          to an Observer interface. What does it mean?
        options:
        - The view stores a reference to an Observer object.
        - The view inherits concrete method bodies from Observer.
        - The view fulfills the operations in the Observer interface.
        correct_index: 2
        option_feedback:
          0: A stored reference is an association; the triangle here describes a type contract.
          1: Generalization uses a solid line with a hollow triangle. Interface realization expresses fulfillment
            of a contract.
        explanation: A dashed line with a hollow triangle denotes realization of an interface contract. In Python,
          inheriting an Observer abstract base class is instead a generalization relationship, shown with a
          solid line and hollow triangle.
      - type: single
        difficulty: basic
        question: Why does the GoF catalog classify Observer as a behavioral pattern?
        options:
        - Its main concern is selecting which concrete objects to construct.
        - Its main concern is arranging parts into a whole-object structure.
        - Its main concern is communication between subjects and observers.
        correct_index: 2
        option_feedback:
          0: Creation is a creational-pattern concern. Client code may create observers, but that is not Observer's
            central problem.
          1: Observer uses object references, but its central purpose is coordinating change notification.
        explanation: Observer assigns responsibilities for registration, notification, and response. Creational
          patterns focus on creation; structural patterns focus on composition.


