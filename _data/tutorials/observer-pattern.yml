  - title: "The Big Refactor: Observer-Powered Weather Station"
    view: uml_diagram
    instructions: |
      ### Why this matters

      Refactoring can move presentation decisions out of a domain model while preserving observable behavior. When a new display uses state already exposed by the model, registration can replace edits to the model itself.

      ### 🎯 You will learn to

      - Apply the Observer pattern to refactor the tightly coupled Step 1 code
      - Compare the original concrete dependencies with the refactored notification contract

      ## Applying Observer to the Weather Station

      ### Quick Recall

      Think back to Steps 1 and 3:
      - In Step 1, how many places did you change in `WeatherStation` to add one display?
      - In Step 3, what method did the `TemperatureSensor` call to broadcast changes?
      - What is the difference between `attach()` and `detach()`?

      ### Before vs. After

      Here is what the architecture looks like **after** the refactoring. Compare this to Step 1:

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-role="reference-design" data-uml-caption="CurrentDisplay represents the existing displays; StatisticsDisplay and ForecastDisplay use the same contract. The new HeatIndexDisplay queries existing measurements, so the station stays unchanged. Concrete update operations and repeated parameter lists are omitted." data-uml-spec='@startuml
      layout compact
      skinparam classAttributeIconSize 0
      class Subject {
        - observers: Sequence<Observer>
        + attach(observer)
        + detach(observer)
        + notify()
      }
      interface Observer {
        + update(subject: Subject)
      }
      class WeatherStation {
        + new_measurement(...)
        + temperature: Real
        + humidity: Real
        + pressure: Real
      }
      class CurrentDisplay {
      }
      class HeatIndexDisplay {
      }
      Subject --> "0..*" Observer : notifies
      WeatherStation --|> Subject
      CurrentDisplay ..|> Observer
      HeatIndexDisplay ..|> Observer
      CurrentDisplay ..> WeatherStation : queries
      HeatIndexDisplay ..> WeatherStation : queries
      @enduml'></div>

      The station no longer names concrete displays in its notification code. Displays still depend on the station's query API to pull their data. Adding a display needs no station change **when the existing state and contract already supply what it needs**.

      ### The Transformation

      Open `weather_observer.py`. The `WeatherStation` has been refactored to inherit from `Subject`. Study it and notice:
      - It stores all three measurements before calling `self.notify()`
      - It has **zero** references to any specific display class
      - `CurrentDisplay` and `StatisticsDisplay` are already implemented as Observers

      ### Your Task

      1. **Complete `ForecastDisplay.update()`:** compare each pressure with the previous reading (initially 0.0). Print `Improving weather!` for a rise, `Cooler, rainy weather` for a fall, and `More of the same` for equality, prefixed by `[Forecast]`. Retain the current pressure for the next comparison.

      2. **Create `HeatIndexDisplay`:** a new observer that uses the same illustrative practice calculation as Step 1.
         - Formula: `heat_index = temp - 0.55 * (1 - humidity/100) * (temp - 58)`
         - Print: `[Heat]     Heat Index: {heat_index:.1f}°F`

      3. **Complete `main()`:**
         - Attach all four displays to the station
         - Run three measurements: `(80, 65, 1013.25)`, `(82, 70, 1012.50)`, `(78, 90, 1015.00)`
         - Then **detach** the ForecastDisplay and run one more: `(75, 60, 1011.00)`
         - Verify: the forecast should NOT appear in the last measurement

      ### The Key Question

      How many lines of `WeatherStation` did you change to add `HeatIndexDisplay`? Its code and outgoing dependencies stay unchanged. The new display adds a dependency on the station's existing query API; check that arrow's direction in the UML diagram.

      ### Bug Hunt: Debug a Broken Observer

      After completing the main task, open `bug_hunt.py`. Its displays report stale scores, and the mobile observer misses updates. Repair the implementation so both registered displays receive each complete new score and the mobile observer retains the corresponding messages. Run the tests to check your repairs.

      Investigate three possible fault locations:
      1. Notification timing (when does `notify()` get called relative to the state change?)
      2. Observer registration (is the observer actually attached?)
      3. Data flow (is the observer reading the right data?)

