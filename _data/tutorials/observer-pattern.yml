      title: Step 4 — Knowledge Check
      min_score: 0.8
      shuffle: true
      questions:
      - type: single
        difficulty: intermediate
        question: The refactored weather station exposes temperature and humidity. A new dew-point display can
          calculate its result from those values. Where should its display-specific code and registration go?
        options:
        - Put its calculation in a new branch of the station's notification method.
        - Put its calculation in an observer and attach that object from client code.
        - Put its calculation in Subject so every observer inherits the display rule.
        correct_index: 1
        option_feedback:
          0: That would make the station depend on another concrete display rule.
          2: Subject provides shared notification behavior; a particular display's calculation does not belong
            there.
        explanation: The new observer owns its calculation and presentation. Client code creates and attaches
          it, leaving the station's existing state and notification code unchanged.
      - type: multiple
        difficulty: advanced
        question: Which benefits follow from keeping weather displays behind a stable Observer contract? Select
          all that apply.
        options:
        - Add a display without editing the station's notification loop.
        - Change registrations while the program is running.
        - Test a display reaction using a compatible subject.
        - Change the shared update contract without affecting any displays.
        correct_indices:
        - 0
        - 1
        - 2
        option_feedback:
          0: A new display can supply the existing update operation and register with the station.
          1: Attach and detach let client code manage the recipient set during execution.
          2: The display can be exercised with the subject API it consumes, without wiring the whole application.
          3: Observers still depend on the common update contract, so changing it may affect them.
        explanation: 'The shared contract supports extension, dynamic registration, and focused tests. Coupling
          is reduced, not erased: changing the update contract can require coordinated changes.'
      - type: single
        difficulty: intermediate
        question: A teammate argues that the weather example proves Observer always requires two separate abstract
          base classes. Which response is accurate?
        options:
        - Yes; inheriting two named base classes is what defines the pattern.
        - Yes; abstract base classes are what make notification asynchronous.
        - No; the collaboration needs a common contract, which can take other forms.
        correct_index: 2
        option_feedback:
          0: Class names and a particular inheritance arrangement are not the pattern's defining requirement.
          1: Abstract classes do not create threads or asynchronous execution. The supplied loop makes ordinary
            calls.
        explanation: The example uses base classes to make roles explicit and share behavior. The same collaboration
          can use a protocol or callable handlers. The essential separation is a generic notification mechanism
          and independently defined reactions.
      - type: single
        difficulty: intermediate
        question: In a UML class diagram, `Subject --> "*" Observer` records a collection of observer references.
          Which claim does it support?
        options:
        - Subject must create every observer it notifies.
        - Subject can refer to zero or more observer objects.
        - Each observer must belong to exactly one subject.
        - Deleting a subject must delete its observer objects.
        correct_index: 1
        option_feedback:
          0: Client code can create observers and pass them to Subject.
          2: Multiplicity at the Observer end does not constrain how many subjects can refer to one observer.
          3: An association alone does not express composition or a deletion policy.
        explanation: The association records references, and `*` allows zero or more target objects. It establishes
          neither creation, exclusive membership, nor shared lifetimes.


  # Pedagogy: scenario discrimination, transfer, and retrieval of earlier traces.
  - title: "Design Judgment: When and When Not"
    instructions: |
      ### Why this matters

      Observer separates a changing object from the reactions of its dependents. Choosing it well means weighing that independence against the extra registration and control flow you must track.

      ### 🎯 You will learn to

      - Evaluate Observer against a simpler direct call in a stated scenario
      - Compare the dependencies introduced by push and pull notifications
      - Trace subscription timing and synchronous notification failures

      ### When Observer Is Worth It

      Use Observer when dependents should react to changes without the subject naming their concrete types. **Changing subscriptions and independently evolving dependents are reasons to consider it, not requirements that must all hold.** A fixed set of views can still benefit from separation. One stable collaborator with no need for that flexibility may be clearer as a direct call.

      Before opening the knowledge check, write a one-sentence decision rule. Test it against each scenario and revise it when the explanation exposes a missing consideration.

      ### Push and Pull

      The narration's document sends text, and Step 2's preview sends a value: both use **push**. Steps 3–4 use **pull**: the subject initiates notification, then each observer reads the properties it needs. Pull is not polling.

      These two traces show one already-registered observer and one completed state change. The other registered observers would receive their own calls.

      <div class="uml-class-diagram-container" data-uml-type="sequence" data-uml-caption="Push places the selected state in the notification payload; observers depend on that payload contract." data-uml-spec='@startuml
      participant client: Client
      participant document: Document
      participant preview: Preview
      client -> document: set_text("Hi")
      note right of document
        Store text = "Hi"
        before notifying.
      end note
      document -> document: notify("Hi")
      document -> preview: update("Hi")
      @enduml'></div>

      <div class="uml-class-diagram-container" data-uml-type="sequence" data-uml-caption="Pull adds a query back to the subject after notification; observers depend on its query interface." data-uml-spec='@startuml
      participant client: Client
      participant document: Document
      participant preview: Preview
      client -> document: set_text("Hi")
      note right of document
        Store text = "Hi"
        before notifying.
      end note
      document -> document: notify()
      document -> preview: update(document)
      preview -> document: get_text()
      document --> preview: "Hi"
      @enduml'></div>

      These are alternative designs, not additional exercise files. The pull trace uses a getter; the Python weather example uses properties for the same query role.

      | Choice | Useful when | Dependency to manage |
      |---|---|---|
      | **Push** | A defined payload supplies the data observers need | Changing that payload can affect observers |
      | **Pull** | Observers need different parts of available state | Each observer depends on the subject's query API |
      | **Hybrid** | A small change description helps observers select further queries | Both the change description and query API need stable contracts |

      Neither choice removes every dependency or guarantees better performance. A new observer that needs unavailable data may require extending the state or notification contract.

      ### Notification Contracts

      Our small Python implementations make these choices:

      - **Timing:** store the complete new state before notifying. Setters notify on every call, even for a repeated value.
      - **Registration:** attaching does not replay past changes. A newly opened view needs an explicit initial read if it must immediately show existing state.
      - **Dispatch:** calls run synchronously in list order. The pattern itself specifies neither ordering nor asynchronous execution.
      - **Failure:** a slow observer delays the caller; an uncaught exception stops this loop before later observers receive the update.
      - **Lifetime:** detach observers that are no longer needed. A long-lived subject can otherwise retain unused objects; non-owning references can instead outlive their targets.

      The examples assume one thread, no subscription changes during notification, and no recursive updates. A production design needs explicit policies for those cases. Observer alone also supplies no network delivery, persistence, or retry guarantee.

      ### Your Task

      This is a **quiz-only step**: no Python file or code tests are needed. Select **Next** to open the knowledge check. Choose the design **and its reason**, read the feedback, then refine your decision rule before continuing. The pass threshold is 80%.

    quiz:
      title: "Step 5 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:
        - id: stock-dashboard
          type: single
          difficulty: intermediate
          question: |
            A stock-price model feeds optional chart, portfolio, and alert widgets in one application. Users open and close widgets, and new widget types arrive regularly. Relevant price changes must trigger widget updates without periodic checks. Which design meets that requirement while letting widgets evolve independently of the model?
          options:
            - "Have the model branch on the class of each enabled widget."
            - "Register widgets through a shared notification contract."
            - "Have each widget repeatedly check the model on a timer."
          correct_index: 1
          option_feedback:
            0: "The model would still need a new branch for each widget type. Moving the conditions into a loop does not remove concrete dependencies."
            2: "Polling can keep widget code separate from the model, but periodic checks violate this scenario's update requirement."
          explanation: "Observer lets the model announce changes through one contract while widgets own their reactions. Client code creates and registers the concrete widgets."

        - id: fixed-calculator
          type: single
          difficulty: intermediate
          question: |
            A small calculator has one permanent display, no planned alternative views, and no requirement for the model and display to be reused separately. What is the most proportionate design now?
          options:
            - "Add a subscription registry because the display reacts to changes."
            - "Use a polling timer because there is only one display."
            - "Use a direct call while that simple relationship meets the needs."
          correct_index: 2
          option_feedback:
            0: "Reacting to a change alone does not justify registration machinery. Here the requirements give no clear benefit for its extra indirection."
            1: "Having one display does not require polling. A direct call can update it when the result changes."
          explanation: "Choose the simplest design that satisfies the stated needs. One observer is legal, but the pattern's flexibility has little payoff in this scenario; reconsider if reuse or variation becomes a requirement."

        - id: collision-handlers
          type: single
          difficulty: intermediate
          question: |
            Sound, particles, damage, and achievements react to collisions inside a game process. Modders must add reactions without editing the physics engine. Where should the engine's notification code depend?
          options:
            - "On each concrete reaction class, selected by its name."
            - "On a common collision-handler contract used by registrations."
            - "On a list of concrete handler types updated for each new mod."
          correct_index: 1
          option_feedback:
            0: "Naming every concrete reaction keeps the physics engine coupled to features added by modders."
            2: "A collection does not solve the extension problem if its declared contract enumerates every concrete handler type."
          explanation: "Observer can keep reactions outside physics code. Composition code still selects and registers handlers; the engine only needs the shared notification contract."

        - id: startup-config
          type: single
          difficulty: intermediate
          question: |
            A script reads configuration once at startup and passes it to three functions. The configuration never changes while the script runs. Which choice matches this requirement?
          options:
            - "Pass the configuration directly to the functions that need it."
            - "Register the three functions for later configuration notifications."
            - "Make each function poll for changes whenever it is called."
          correct_index: 0
          option_feedback:
            1: "Several consumers do not automatically create an ongoing change-notification problem. These functions only need the initial values."
            2: "The contract says the configuration stays unchanged, so repeated checks add no useful information."
          explanation: "This is initial data distribution, not ongoing synchronization after changes. Ordinary parameters express the dependency directly."

        - id: chat-delivery
          type: single
          difficulty: advanced
          question: |
            A chat server uses an in-process Observer list of connection handlers; handlers register when users join and detach when they leave. A new requirement says messages must survive network outages and reach reconnecting users. What else is needed?
          options:
            - "Change the observer list to a set to retain undelivered messages."
            - "Notify twice so at least one call reaches every remote user."
            - "Add explicit persistence and delivery/retry policies."
          correct_index: 2
          option_feedback:
            0: "Changing the registration collection does not persist messages or establish delivery across the network."
            1: "A second local callback is not proof of remote delivery and can also produce duplicates. Reliability requires a defined protocol."
          explanation: "Observer helps organize local reactions and dynamic subscriptions. Network delivery, replay, and persistence are additional responsibilities, as the narration emphasizes."

        - id: fixed-independent-views
          type: single
          difficulty: advanced
          question: |
            A reusable model has two views that stay registered throughout execution. Different teams evolve the views, and the model must not name their concrete classes. Is the fixed membership a reason to reject Observer?
          options:
            - "Yes; Observer requires attachment changes during execution."
            - "No; independent evolution can justify a shared contract."
            - "Yes; exactly two views should always be called by concrete type."
          correct_index: 1
          option_feedback:
            0: "Dynamic registration is a useful capability, not a mandatory applicability condition. Separate evolution can justify the same responsibility split."
            2: "The number two does not remove the requirement to keep concrete view types out of the model."
          explanation: "The books describe independent variation and unknown or changing dependents as motivations. They are not a checklist requiring every property at once."

        - id: pull-dependency
          type: single
          difficulty: intermediate
          question: |
            Several weather displays need different subsets of state already exposed by the station. You choose pull notifications so each display can select its data. Which dependency does that choice introduce?
          options:
            - "Displays depend on the station's query interface."
            - "The station depends on each concrete display class."
            - "Displays become independent of any shared data contract."
          correct_index: 0
          option_feedback:
            1: "The station can notify through the common Observer contract. A display's query back to the station does not require the station to know that display's concrete type."
            2: "Pull still requires agreement about which data can be queried and what it means. Push would instead couple the observer to a payload contract."
          explanation: "Pull allows observers to select available data, at the cost of depending on the subject's query API. The notification is still initiated by the subject; this is not periodic polling."

        - id: late-subscription
          type: single
          difficulty: intermediate
          question: |
            This Python subject notifies after every setter call. Its attach operation only registers the observer. Trace the calls: which values enter the logger's readings?
            ```python
            sensor.temperature = 50
            sensor.attach(logger)
            sensor.temperature = 70
            sensor.detach(logger)
            sensor.temperature = 90
            ```
          options:
            - "50 and 70"
            - "70 only"
            - "70 and 90"
          correct_index: 1
          option_feedback:
            0: "Registration does not replay the earlier change in this implementation. An initial read would have to be requested explicitly."
            2: "Detaching removes the logger from future notifications, even though the logger object can still exist."
          explanation: "Only the change to 70 occurs while the logger is registered. This combines notification timing from Step 3 with removal from Step 4."

        - id: synchronous-failure
          type: single
          difficulty: advanced
          question: |
            A subject loops over registered observers synchronously in list order. The first observer raises an exception, and the loop has no error handler. What happens to later observers in that notification?
          options:
            - "They finish independently because Observer makes calls asynchronous."
            - "They are retried automatically after the first observer fails."
            - "They miss this notification because the exception leaves the loop."
          correct_index: 2
          option_feedback:
            0: "These are ordinary synchronous calls. The pattern does not create independent tasks or threads."
            1: "Retry and isolation policies must be implemented explicitly; the pattern name supplies neither."
          explanation: "The exception interrupts the current loop. Continuing after failures is possible, but it is an additional error-handling policy rather than an automatic Observer guarantee."


