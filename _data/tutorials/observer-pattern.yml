  - title: "Building Observer: Step by Step"
    view: uml_diagram
    instructions: |
      ### Why this matters

      In the pull example below, an observer must be registered, then read the completed change when notified. A shared update contract lets the subject notify objects without knowing their concrete classes.

      ### 🎯 You will learn to

      - Apply supplied Subject and Observer abstractions to implement a concrete sensor and its dependents
      - Analyze each UML role in your own code and watch the class diagram build up live

      ## Constructing the Observer Pattern

      ### Quick Recall

      Before we start coding, answer these in your head (from Step 2):
      - What are the two main roles in the Observer pattern?
      - What responsibilities do registration, removal, and notification serve? Which are explicit methods in the Step 2 preview?
      - What happens when a Subject's state changes?

      If you are unsure, revisit Step 2 before continuing.

      ### Try First (Generation Challenge)

      Before looking at the blueprint below, **try this on paper or in your head** for 2 minutes:

      > *If you had to build an Observer pattern from scratch for a `TemperatureSensor` that notifies a `TemperatureLogger`, what classes would you create? What methods would each class need?*

      Jot down your answer, then compare it to the blueprint. Use the differences to identify which responsibilities or relationships you need to investigate.

      ### The Blueprint

      The Observer pattern has four roles. Here is the UML for what you are about to build:

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-role="reference-design" data-uml-caption="Pull separates notification from reaction, while each observer still depends on the sensor query it uses." data-uml-spec='@startuml
      layout compact
      skinparam classAttributeIconSize 0
      class Subject {
        - observers: Sequence<Observer>
        + attach(observer)
        + detach(observer)
        + notify()
      }
      interface Observer {
        + update(subject: Subject)
      }
      class TemperatureSensor {
        + temperature: Real
      }
      class TemperatureLogger {
        + readings: Sequence<Real>
      }
      class TemperatureAlert {
        + threshold: Real
      }
      Subject --> "0..*" Observer : notifies
      TemperatureSensor --|> Subject
      TemperatureLogger ..|> Observer
      TemperatureAlert ..|> Observer
      TemperatureLogger ..> TemperatureSensor : queries
      TemperatureAlert ..> TemperatureSensor : queries
      @enduml'></div>

      | Role | Class | Responsibility |
      |---|---|---|
      | **Subject** (base) | `Subject` | Maintains observer list; provides `attach()`, `detach()`, `notify()` |
      | **ConcreteSubject** | `TemperatureSensor` | Holds temperature state; calls `notify()` when it changes |
      | **Observer** (interface) | `Observer` | Declares the `update()` method all observers must implement |
      | **ConcreteObserver** | `TemperatureLogger`, `TemperatureAlert` | Implement `update()` to react to changes |

      ### Your Task — Faded Implementation

      Open `observer_basics.py`. The `Subject` and `Observer` base classes are **fully implemented** for you. Your job:

      1. **Complete `TemperatureSensor`:** after each assignment, including a repeated value, registered observers must see the newly stored temperature.
      2. **Complete `TemperatureLogger`:** retain every notified temperature in `readings` and print `Logger: Recorded <value>°F` for each update.
      3. **Complete `TemperatureAlert`:** when the reading is **strictly above** the configured threshold, print `ALERT: Temperature <value>°F exceeds <threshold>°F!`. For equal or lower values, print `Alert: <value>°F is within safe range`.
      4. **Compose `main()`:** create a sensor and both observers, register them, then set temperatures to 72, 95, and 68.
      5. **Check and explain:** run the demo and **Test My Work**. Explain why the logger sees the new value rather than the previous one.

      The supplied registration methods ignore duplicate attachment; detach expects an already-registered observer. Attaching alone sends no initial value. These are this example's API choices, not rules imposed by Observer. A separate Subject base class is also optional; the pattern is the collaboration. Abstract classes make our teaching contract explicit, but compatible objects or callable handlers can express the same roles without inheriting these particular bases.

      ### Watch the UML

      As you add classes and methods, check the **UML Diagram** tab. Compare the responsibilities and collaborations with the reference design above. The live source diagram preserves Python naming conventions and ABC inheritance: a single underscore maps to `#`, and inheriting from an abstract class uses a solid generalization arrow. A reference design can express an interface role more abstractly; the live views do not silently change those source claims.

