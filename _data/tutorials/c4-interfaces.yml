# Follow-up tutorial "Describe an interface" (spec docs/superpowers/specs/2026-11-08-c4-model-design.md §11, decision D10;
# plan 2026-11-08-c4-tutorial.md, Task 5b). Serves chapter objective 7 (spec §12). About 30 minutes: 4 + 15 + 10 + 3 = 32.
# Assigned with the interoperability lecture, so it spaces the interface practice after the C4 tutorial.
# Grading is structural (spec §8): presence, counts, realizes ids, units present, and checks predicates over interface/* rules.
# The only text lookups that grade are seeded, locked field names (name_any) and step 2's documented unit spelling
# (unit_any: [quarter], spec §8).
# Expected results for every seed, solution, and alternative: scripts/tests/fixtures/c4-tutorial/c4-interfaces/expectations.md.
# Hint ladders are condition-driven: each failed state of a test reaches at least one hint (orient), partial attempts reach
# a diagnosis, and further progress reaches an incomplete scaffold; no hint contains target text. A test with one
# orienting hint says why beside it (a guard, or a faded repeat in the plan-check transfer); the content test lists them.
title: 'Describe an interface'
description: 'Predict what a syntax-only interface description leaves open, complete the semantic view of a REST operation in the C4 editor, describe another team’s message interface from a brief, and check when a valid message is still misread. For readers of the C4 model chapter and the interoperability chapter, after the C4 tutorial. Allow about 30 minutes.'
learning_objectives:
  - Predict how an independently built client could misread an interface description that states only its syntax.
  - Write the semantic view of an operation (purpose, side effects, usage restrictions, errors, and an example) and each field’s meaning, unit, or format.
  - Link an operation to the provider responsibilities it realizes, and a relationship to the operation it uses.
  - Write a complete interface description, syntax and semantics, for a message another team receives.
  - Explain why syntactic agreement alone does not make two systems interoperable and what catches a misreading, and tell a compatible interface change from one that needs a new version.
backend: c4
require_tests: true
progress_version: 1
autosave_type: files
reset_type: files
c4:
  file: design.yml
  profile: novice
  # Credit for consistency comes only from checks: tests (spec §8), so a checks.ignore entry in design.yml must not
  # silence a graded rule. No step teaches justified suppression.
  checks:
    honorFileIgnores: false
steps:
  # Pedagogy: PRIMM — Predict. A commit-then-reveal pretest on a syntax-only card (generation before instruction); step 2
  # revisits the learner's written misreadings and resolves them in the semantic view.
  # Reasoning check: one multiple-answer knowledge check. Objectives: 1 (tutorial), 7 (chapter).
  # Minutes: 4 (spec §11, interface tutorial step 1).
  - title: What Syntax Leaves Open
    key: predict-from-syntax
    instructions: |
      ### Why this matters

      A team that never talks to you builds its client from your interface description alone. Seeing what a description of call syntax and data types cannot tell that team shows you what else to write down before their first wrong guess reaches users.

      ### 🎯 You will learn to

      - Analyze a syntax-only interface description for values another team could read differently.
      - Distinguish what the syntactic view of an interface settles from what it leaves open.

      Course Registration lets students enroll in the sections of a planned term schedule. Its Registration API offers the Enrollment API, and a team outside Course Registration is about to build a new client for it. This card is everything that team has: the interface's **syntactic view**, which says how to call the operation and how each value is written.

      ```c4
      # caption: The Enrollment API as a team outside Course Registration receives it: the syntactic view only.
      # panels: syntax
      view: interface enrollment-api
      name: Course Registration
      systems:
        registration:
          name: Course Registration
          description: Plans term schedules and enrolls students in their sections.
          containers:
            api:
              name: Registration API
              technology: Python, FastAPI
              description: Decides eligibility and enrolls students atomically.
              provides:
                enrollment-api:
                  name: Enrollment API
                  description: Enrolls one student in every section of a planned schedule, or in none.
                  style: rest
                  technology: JSON/HTTPS
                  version: 1
                  operations:
                    submit-plan:
                      syntax: POST /v1/enrollments
                      input: EnrollmentRequest
                      output: EnrollmentOutcome
                  types:
                    EnrollmentRequest:
                      description: One student's plan for one term.
                      fields:
                        student_id:
                          type: string
                        term:
                          type: string
                        section_ids:
                          type: string[]
                          constraints: 1 to 8 items, no duplicates
                    EnrollmentOutcome:
                      description: The decision for the whole plan.
                      fields:
                        status:
                          type: string
                          values: [enrolled, refused]
                        units_enrolled:
                          type: number
                        decided_at:
                          type: datetime
                        reason:
                          type: string
                          required: false
      ```

      1. **Recall, then extend:** From memory, name the two misreadings the chapter found on this card. Then find one more value that the card leaves open and the chapter did not discuss, and say what that misreading would cost a student. Write all three down; step 2 asks for them again.
      2. **Check:** Choose **Next** to open the knowledge check.

      The editor shows the Registration API with the interfaces it provides and requires, and is read-only in this step. This step has no model checks: the knowledge check confirms which questions the card leaves open, but it cannot read the misreadings you wrote down.
    c4:
      view: interfaces of api
      read_only: true
      scaffolds:
        definitions: false
        sentenceFrames: false
        inlineLint: false
        carryDown: false
        trace: false
        emptyStateGuide: false
    files:
      - path: design.yml
        language: yaml
        reseed: true
        content: |
          schema: c4-design/1
          name: Course Registration
          description: Students plan a term schedule and enroll in every section of it, or in none.
          status: proposed
          enterprise: UCLA

          requirements:
            FR-07: A student who lacks a prerequisite or would exceed the unit cap is refused before any seat is held, and is told why.
            FR-09: A student is enrolled in every section of a plan, or in none.
            FR-11: Every completed enrollment is charged tuition, and a billing outage never delays an enrollment.

          vocabulary:
            quarter unit: the UCLA credit unit; most courses are worth 4 quarter units

          people:
            student:
              name: Student
              description: Plans and confirms one term schedule.
              collaborators:
                web: plans a schedule and enrolls using

          systems:
            registration:
              name: Course Registration
              description: Plans term schedules and enrolls students in their sections.
              responsibilities:
                - decide: whether a student may enroll in a section
                  id: sys-eligibility
                  requirements: [FR-07]
                - do: hold a seat in every section of a plan, or in none
                  id: sys-holds
                  requirements: [FR-09]
                - do: request the tuition charge for every completed enrollment
                  id: sys-billing
                  requirements: [FR-11]
              containers:
                web:
                  name: Planner Web App
                  kind: browser_app
                  technology: TypeScript, React
                  description: Lets students compare draft schedules in the browser.
                  responsibilities:
