      explanation: |
        The solution adds the semantic view of the reference model: a purpose that names the caller and the all-or-none result; side effects for both outcomes; two interface-level restrictions (only the Planner Web App, for the signed-in student; at most 10 requests a minute) and two interface-level errors (401, 429), plus two operation errors (422 for a broken constraint or an unknown section), each saying what the client does next; one example whose keys and values match the two types; a meaning for every field; `unit: quarter units` on `units_enrolled`; formats on `student_id`, `term`, `section_ids`, and `decided_at`; a meaning for each `status` value; and the vocabulary terms *section* and *plan*.

        `realizes: [api-eligibility, api-holds, api-billing]` links the operation to what a client relies on: the decision (fulfilled by a refusal too), the all-or-none seat holds, and the tuition request. Linking the refining component responsibilities instead (the Enrollment Policy's decision, the Seat Gateway's holds) also covers them; linking the coordinator's sequencing does not, because it is private to how the API divides its work. The web app's relationship now names `enrollment-api.submit-plan`, so the relationship requests what the operation realizes.

        `check-plan` is the transfer: its purpose says it decides without enrolling; its side effect is that nothing changes (so a client may repeat it); `PlanCheck` has a meaning for each field and `unit: quarter units` on `units_planned`; it realizes only `api-eligibility`; and the web app's relationship names both operations.

        Pair the learner's step 1 prediction with the Mars Climate Orbiter: a schema-valid number, two units, and no test that compared them.

  # Pedagogy: transfer with faded scaffolds (frames off, lint on request) — describe another team's message interface from a
  # prose brief, syntax included; the step 2 solution sits in the model as a worked example of a full description.
  # Reasoning check: one written prompt (an integration test both teams would run) with a gated comparison.
  # Objectives: 2, 3, 4 (tutorial); 7 (chapter). Minutes: 10 (spec §11, interface tutorial step 3).
  - title: A Message Interface From a Brief
    key: describe-billing
    instructions: |
      ### Why this matters

      Sometimes you are the client, and the interface you depend on belongs to another team. Writing their interface down from what they told you, syntax and semantics, is how you find the questions to ask them before you build on a guess.

      ### 🎯 You will learn to

      - Write a complete interface description, syntax and semantics, for a message interface from a prose brief.
      - Make a relationship name the interface it uses.

      Inside the Registration API, the Billing Gateway sends Billing one message per completed enrollment. The Billing System belongs to another university team. In step 2 its queue was only a one-line sketch; Billing's team deleted the sketch from the shared model, which also removed the gateway's use of it, and sent this brief:

      > Registration must tell Billing about each completed enrollment, so that Billing can charge tuition. We accept one message per enrollment on a queue. The message names the student, the term, the number of units, and the amount owed; a repeated message must not charge twice.

      Their answers to your follow-up questions: the queue is `billing.charges`; amounts are in US cents, before financial aid and without fees; a message Billing cannot read, or one that names a student Billing does not know, goes to the queue `billing.charges.rejected`, where Registration's operators review it. Billing receives these messages as commands: one receiver acts on each message. The editor shows the Registration API's components with Billing beside them. The model now holds the reference description of the Enrollment API, an example of a full description if you want one; the reference describes `submit-plan` only, so your plan check is not in it.

      1. **Plan:** On paper, list the message's fields with a type for each, and decide which numbers need a unit.
      2. **Describe:** Select the Billing System, add an interface in its **Interfaces** section, and describe it: its style, its technology, one operation with its syntax line, the message type with its fields, and then the semantic view.
      3. **Connect:** Select the Billing Gateway, and in the inspector under **Relationships in this view** choose its relationship to the Billing System; under **Uses** choose what it sends through.
      4. **Check:** Choose **Check now** and read the Problems panel, then choose **Test My Work**.
      5. **Write it down:** Describe one integration test that Registration and Billing should run together: what Registration sends, and what Billing's side should show if both teams read your description the same way.

      <details markdown="1">
      <summary>Compare your answer (step 3)</summary>

      One test: send a message for a student who enrolled in 8 quarter units, with an amount of 418400, and check that the student's account shows one tuition charge of 4,184.00 US dollars; send the same message again and check that the account still shows one charge. The first half catches a unit that one side reads as dollars; the second checks the promise that a repeated message charges once.

      Compare your description with these questions. Does a field identify each request, so that Billing can recognize a repeated message, and does a side effect say so? Does every number have a unit, and does the amount say what it includes? Does each error say where the message goes and who finds out? Step 4 shows the reference description of Tuition Charges.

      One more thing to remember for step 4: Billing can later add an optional field to this message and every existing sender keeps working; removing or renaming a field, or making an optional one required, breaks messages that senders already send, so it needs a new version.

      </details>

      The checks see that Billing describes an interface whose operation has a purpose, a typed number with a unit, and an error, that every message field has a meaning, that the gateway names what it uses, and that no consistency warnings remain. They cannot judge whether Billing's team would agree with your description: whether your unit and format are the ones Billing expects, whether the error list is complete, or whether a repeated message really charges once. The integration test you just described settles that.
