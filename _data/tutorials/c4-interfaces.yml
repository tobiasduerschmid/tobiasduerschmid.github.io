  - title: The Semantic View
    key: complete-semantic-view
    instructions: |
      ### Why this matters

      A purpose, an error list, and a unit beside every number turn a list of call signatures into a contract that teams can build against without meeting. The cheapest moment to settle what each value means is before two implementations disagree about it.

      ### 🎯 You will learn to

      - Write the semantic view of an operation: purpose, side effects, usage restrictions, errors, and an example.
      - State each field's meaning, and its unit or format where a reader needs one.
      - Link the operation to the responsibilities it realizes, and the client's relationship to the operation it calls.
      - Transfer the description to a second operation whose effects and links differ from the first.

      You are on the registration team now. The editor shows the Enrollment API's description card: its **Syntactic view** is given and locked. A teammate already described `student_id` and `section_ids` (a meaning and a format each) and the 401 error under **All operations**: use them as worked examples. Every other "not stated" line is yours to fill. Your team's meeting notes:

      - **Callers:** only the Planner Web App calls the API, for the student who is signed in, and each student gets at most 10 calls a minute.
      - **Ids and terms:** student ids are the nine-digit university ids; section ids have six digits; a term looks like `2027-winter`.
      - **Time:** the API stamps each decision when it makes it, as ISO 8601 text with the UTC offset, such as `2027-01-05T09:30:00-08:00`.
      - **Credit:** this university counts credit in quarter units; most courses are worth 4.
      - **Failures:** a caller not signed in as that student gets 401; too many calls get 429 with a Retry-After time; a plan that breaks a request constraint, or names a section the term does not have, gets 422.
      - **Outcomes:** a refused plan holds no seat and comes with a reason; an enrolled plan holds a seat in every section of the plan and asks Billing to charge tuition.
      - **Checking a plan:** before submitting, the web app lets a student check a plan. A check answers whether the student may enroll in the whole plan now and how many units the plan adds up to; it holds no seat and asks Billing for nothing.

      Billing appears in the model only as a one-line sketch of its queue; leave it for step 3.

      1. **Recall:** Reread the misreadings you wrote down in step 1.
      2. **Describe the operation:** On the card, choose **Edit submit-plan**, then the **Semantic view** tab. Fill in, in this order:
         - **Purpose:** when a client calls it, and what the API then does.
         - **Errors:** what else can go wrong, and what the client should do then. Limits and errors that apply to every operation go under **All operations**, beside the given 401.
         - **Side effects** (open the disclosure): what has changed after each of the two outcomes.
         - **Restrictions** (open the disclosure): who may call, and how often.
         - **Examples** (open the disclosure): one request with its outcome.
      3. **Describe the data:** Under **Meaning of data**, give every field a meaning, state a unit or a format where a field needs one, and say what each `status` value means for the student. The check accepts the unit of credit the notes name in any spelling.
      4. **Link it:** Under **Realizes**, tick the responsibilities of the Registration API that a client relies on when it calls this operation. Then zoom into the Registration API, select the Planner Web App, and in the inspector under **Relationships in this view** choose its relationship to the Registration Coordinator; under **Uses** choose the operation it calls.
      5. **Transfer:** The card has a second operation, `check-plan`, given as syntax only. Describe it on your own: its purpose, its side effects (what has changed after a check), a meaning for each field of `PlanCheck` and a unit where a number needs one, and under **Realizes** only the responsibilities a check fulfills. Then add `check-plan` to the web app's **Uses** as well.
      6. **Check:** Choose **Test My Work**, or press <kbd><abbr data-platform-modifier title="Control" data-no-tooltip="true">Ctrl</abbr>+Enter</kbd> in the canvas.
      7. **Write it down:** For each misreading from step 1, which line of your description now rules it out? Then name one way two teams could still disagree that no line of a description can prevent.

      <details markdown="1">
      <summary>Compare your answer (step 2)</summary>

      - **The credit unit of `units_enrolled`:** its Unit names quarter units, and the model's shared vocabulary says what a quarter unit is.
      - **The time zone of `decided_at`:** its Format, ISO 8601 with a UTC offset, puts the offset into every value.
      - **The spelling of `term`:** its Format says that the year comes first and names the four seasons as written.
      - **Who `reason` is written for:** its Meaning says who reads it, so a client knows whether it may show the text unchanged.

      A description cannot stop a team from ignoring it. In 1999 the Mars Climate Orbiter was lost although its interface specification stated the unit: it required newton-seconds, the ground software wrote pound-force seconds, and no test compared the file with the specification. Every number was valid syntax on both sides. Here, the remedy is an integration test that sends a real plan through the Planner Web App and checks the units and the time a student sees.

      **The plan check** shows what changes from one operation to the next. Its side effect is that nothing changes, and saying so is what tells a client it may check as often as it likes. It realizes only the eligibility decision: a client that copied `submit-plan`'s links would expect a check to hold seats and request a charge.

      One question the notes left to you: does `units_enrolled` count the units of this plan or the student's total for the term? Either reading passes the checks, but a client that shows the wrong one misleads every student. The reference says the term total.

      </details>

      The checks see which parts of the description are present, how many errors and examples there are, which responsibilities each operation is linked to, and whether a unit names quarter units. They cannot judge whether your purpose is true, whether the error list is complete, whether another team would read a meaning the same way, or whether a unit or format is the one the client expects. An integration test between the two implementations settles that.
    c4:
      view: interface enrollment-api
      scaffolds:
        definitions: true
        sentenceFrames: true
        inlineLint: true
        carryDown: false
        trace: false
        emptyStateGuide: false
      checks:
        display: live
      # Syntactic keys only (controller ruling: dotted paths accept "*" wildcards); meanings, units, formats, value
      # meanings, examples, and every semantic key stay editable. Grading never relies on locks: test 11 guards the syntax.
      locked_fields:
        - systems.registration.containers.api.provides.enrollment-api.style
        - systems.registration.containers.api.provides.enrollment-api.technology
        - systems.registration.containers.api.provides.enrollment-api.version
        - systems.registration.containers.api.provides.enrollment-api.operations.*.syntax
        - systems.registration.containers.api.provides.enrollment-api.operations.*.input
        - systems.registration.containers.api.provides.enrollment-api.operations.*.output
        - systems.registration.containers.api.provides.enrollment-api.types.*.fields.*.type
        - systems.registration.containers.api.provides.enrollment-api.types.*.fields.*.required
        - systems.registration.containers.api.provides.enrollment-api.types.*.fields.*.constraints
    files:
      - path: design.yml
        language: yaml
        reseed: true
        content: |
          schema: c4-design/1
          name: Course Registration
          description: Students plan a term schedule and enroll in every section of it, or in none.
          status: proposed
          enterprise: UCLA

          requirements:
            FR-07: A student who lacks a prerequisite or would exceed the unit cap is refused before any seat is held, and is told why.
            FR-09: A student is enrolled in every section of a plan, or in none.
            FR-11: Every completed enrollment is charged tuition, and a billing outage never delays an enrollment.

          vocabulary:
            quarter unit: the UCLA credit unit; most courses are worth 4 quarter units

          people:
            student:
              name: Student
              description: Plans and confirms one term schedule.
              collaborators:
                web: plans a schedule and enrolls using

          systems:
            registration:
              name: Course Registration
              description: Plans term schedules and enrolls students in their sections.
              responsibilities:
                - decide: whether a student may enroll in a section
                  id: sys-eligibility
                  requirements: [FR-07]
                - do: hold a seat in every section of a plan, or in none
                  id: sys-holds
                  requirements: [FR-09]
                - do: request the tuition charge for every completed enrollment
                  id: sys-billing
                  requirements: [FR-11]
              containers:
                web:
                  name: Planner Web App
                  kind: browser_app
                  technology: TypeScript, React
                  description: Lets students compare draft schedules in the browser.
                  responsibilities:
                    - do: let students compare draft schedules
                  collaborators:
                    coordinator: {description: submits plans to, technology: JSON/HTTPS}
                api:
                  name: Registration API
                  technology: Python, FastAPI
                  description: Decides eligibility and enrolls students atomically.
                  responsibilities:
                    - decide: whether a student may enroll in a section
                      id: api-eligibility
                      refines: sys-eligibility
                    - do: hold a seat in every section of a plan, or in none
                      id: api-holds
                      refines: sys-holds
                    - do: request the tuition charge for every completed enrollment
                      id: api-billing
                      refines: sys-billing
                  provides:
                    enrollment-api:
                      name: Enrollment API
                      description: Enrolls one student in every section of a planned schedule, or in none.
                      style: rest
                      technology: JSON/HTTPS
                      version: 1
                      errors:
                        unauthorized:
                          code: 401
                          when: the caller is not signed in as the student named in the request; the client asks the student to sign in again
                      operations:
                        submit-plan:
                          syntax: POST /v1/enrollments
                          input: EnrollmentRequest
                          output: EnrollmentOutcome
                        check-plan:
                          syntax: POST /v1/plan-checks
                          input: EnrollmentRequest
                          output: PlanCheck
                      types:
                        EnrollmentRequest:
                          description: One student's plan for one term.
                          fields:
                            student_id:
                              type: string
                              meaning: university id of the student who enrolls
                              format: nine digits
                            term:
                              type: string
                            section_ids:
                              type: string[]
                              meaning: the sections the student wants to take together
                              format: six-digit section ids
                              constraints: 1 to 8 items, no duplicates
                        EnrollmentOutcome:
                          description: The decision for the whole plan.
                          fields:
                            status:
                              type: string
                              values: [enrolled, refused]
                            units_enrolled:
                              type: number
                            decided_at:
                              type: datetime
                            reason:
                              type: string
                              required: false
                        PlanCheck:
                          description: The eligibility decision for a whole plan, made without enrolling.
                          fields:
                            eligible:
                              type: boolean
                            units_planned:
                              type: number
                            reason:
                              type: string
                              required: false
                  choices:
                    technology:
                      chosen: FastAPI 0.115 on Python 3.12
                      alternatives: [Django REST Framework, Flask]
                      because: typed request models and async database access
                    styles: [layers]
                  components:
                    coordinator:
                      name: Registration Coordinator
                      technology: Python module
                      stereotypes: [coordinator]
                      responsibilities:
                        - do: sequence one enrollment attempt
                        - decide: which step of the attempt runs next
                      collaborators:
                        policy: asks for an eligibility decision from
                        seats: reserves all seats or none through
                        billing-gateway: asks for tuition charges through
                      invariants: [never decides eligibility or writes seat state]
                      quality: [an enrollment outcome appears within 2 s for 95% of attempts]
                    policy:
                      name: Enrollment Policy
                      technology: Python module
                      stereotypes: [service_provider]
                      responsibilities:
                        - decide: whether prerequisites and unit caps allow enrollment
                          refines: api-eligibility
                      code:
                        EnrollmentPolicy:
                          kind: class
                          operations: ["+ decide(student, section): Decision"]
                          collaborators: {EnrollmentRule: delegates each eligibility check to}
                          choices: {patterns: [{pattern: Strategy, role: Context, instance: eligibility-rules}]}
                        EnrollmentRule:
                          kind: interface
                          operations: ["+ evaluate(student, section): RuleResult"]
                          choices: {patterns: [{pattern: Strategy, role: Strategy, instance: eligibility-rules}]}
                        PrerequisiteRule:
                          kind: class
                          implements: [EnrollmentRule]
                          operations: ["+ evaluate(student, section): RuleResult"]
                          choices: {patterns: [{pattern: Strategy, role: ConcreteStrategy, instance: eligibility-rules}]}
                        UnitCapRule:
                          kind: class
                          implements: [EnrollmentRule]
                          operations: ["+ evaluate(student, section): RuleResult"]
                          choices: {patterns: [{pattern: Strategy, role: ConcreteStrategy, instance: eligibility-rules}]}
                    seats:
                      name: Seat Gateway
                      technology: Python module
                      stereotypes: [interfacer]
                      owns: [seat holds]
                      responsibilities:
                        - know: which seats are held for each attempt
                        - do: hold every requested seat atomically, or none
                          refines: api-holds
                      collaborators:
                        db: {description: writes seat holds to, technology: SQL/TCP}
                    billing-gateway:
                      name: Billing Gateway
                      technology: Python module
                      stereotypes: [interfacer]
                      responsibilities:
                        - do: request tuition charges for a completed enrollment
                          refines: api-billing
                      collaborators:
                        billing:
                          description: requests tuition charges from
                          technology: AMQP
                          connector: message
                          uses: billing
                          choices:
                            technology: {chosen: RabbitMQ, alternatives: [synchronous HTTPS call], because: a billing outage must not block enrollment}
                db:
                  name: Registration Database
                  kind: database
                  technology: PostgreSQL 16
                  description: Durably stores plans, enrollment attempts, and seat holds.
                  responsibilities:
                    - do: durably store plans, enrollment attempts, and seat holds
            billing:
              name: Billing System
              external: true
              description: Charges tuition and fees for the university.
              provides: ["send ChargeRequested to the queue billing.charges"]
          scenarios:
            enroll:
              title: Enroll in a planned schedule
              steps:
                - web -> coordinator: submits the plan to
                - coordinator -> policy: asks for an eligibility decision from
                - alt:
                    - when: eligible
                      steps:
                        - coordinator -> seats: reserves all seats or none through
                        - coordinator -> billing-gateway: asks for tuition charges through
                    - when: not eligible
                      steps:
                        - coordinator -> web: reports the refusal and its reason to

          deployment:
            production:
              name: Production
              nodes:
                laptop:
                  name: Student's computer
                  kind: device
                  nodes:
                    browser:
                      name: Web browser
                      kind: environment
                      technology: "Chrome, Firefox, or Safari"
                      hosts: [web]
                      collaborators:
                        ingress: sends HTTPS requests to
                campus-cloud:
                  name: Campus cloud
                  kind: environment
                  technology: Kubernetes
                  nodes:
                    ingress:
                      name: Ingress load balancer
                      kind: infrastructure
                      technology: NGINX
                      collaborators:
                        api-pod: forwards HTTPS requests to
                    api-pod: {name: API pod, kind: environment, technology: Kubernetes pod, instances: 3, hosts: [api]}
                    postgres: {name: Managed database, kind: environment, technology: PostgreSQL 16, hosts: [db]}
                data-centre:
                  name: University data center
                  kind: environment
                  hosts: [billing]

          decisions:
            one-database:
              title: Keep plans and seat holds in one relational database
              status: accepted
              context: Seat holds and enrollment must commit atomically.
              decision: One PostgreSQL database with serializable transactions for seat holds.
              alternatives: [a separate seat service with its own store]
              consequences: The database is a single point of failure.
              affects: [db, seats]
    tests:
      - description: The operation says what it is for and what it changes, with one example
        c4:
          exists:
            operation: {of: enrollment-api, id: submit-plan, purpose: present, side_effects: present, examples_at_least: 1}
        hints:
          - title: Purpose, side effects, and an example
            text: 'This check reads three parts of the Semantic view: the Purpose, the Side effects, and the Examples. Start with whichever is still not stated; for the Purpose, ask who sends this request and what is true for the student afterwards.'
          - title: What another system can notice
            condition: {c4: {exists: {operation: {of: enrollment-api, id: submit-plan, purpose: present, side_effects: absent}}}}
            text: 'Your purpose says what the operation is for. What can another system notice after an enrolled outcome that was not true before the call? And after a refusal?'
          - title: One request a real client could send
            condition: {c4: {exists: {operation: {of: enrollment-api, id: submit-plan, purpose: present, side_effects: present}}}}
            text: 'Write one request a real client could send, with the outcome it gets back. Use the field names of the two types, and values that fit their types and formats.'
      - description: Clients learn who may call it and what can go wrong
        c4:
          exists:
            operation: {of: enrollment-api, id: submit-plan, restrictions: present, errors_at_least: 2}
        hints:
          - title: Who may call, and how often
            condition: {c4: {exists: {operation: {of: enrollment-api, id: submit-plan, restrictions: absent}}}}
            text: 'Who is allowed to send this request, and how often? Write each limit as a usage restriction, for this operation or under All operations.'
          - title: What else can go wrong
            text: 'The step began with one error under All operations: a caller who is not signed in. What else can go wrong, because of what the client sends or how often it calls, and what should the client do then?'
      - description: Every request field says what it means
        c4:
          absent:
            operation: {of: enrollment-api, id: submit-plan, input_has_field: {meaning: absent}}
        hints:
          - title: Fields still without a meaning
            text: 'Some request fields still have no Meaning. For each one, ask what it identifies or measures, and for whom; the fields that had a Meaning when the step began show the shape. A type says only how a value is written.'
          # Reached only after some request field has a meaning: the `of` filter adds the second field condition.
          - title: A list needs a meaning too
            condition: {c4: {exists: {operation: {of: {id: enrollment-api, has_operation: {input_has_field: {name_any: [section_ids], meaning: absent}}}, id: submit-plan, input_has_field: {meaning: present}}}}}
            text: 'A list field needs a meaning for the list as a whole. Which sections are these, and what do they have in common?'
      - description: Every outcome field says what it means
        c4:
          absent:
            operation: {of: enrollment-api, id: submit-plan, output_has_field: {meaning: absent}}
        hints:
          - title: What the outcome tells the client
            text: 'Read the outcome as the web app’s team would. What does each field tell them about the student’s plan?'
          - title: Fields still without a meaning
            condition: {c4: {exists: {operation: {of: enrollment-api, id: submit-plan, output_has_field: {meaning: present}}}}}
            text: 'Some outcome fields still have no Meaning. An optional field needs one too: say when it is present.'
          # Reached only after some outcome field has a meaning (same pattern as above).
          - title: A field with values
            condition: {c4: {exists: {operation: {of: {id: enrollment-api, has_operation: {output_has_field: {name_any: [status], meaning: absent}}}, id: submit-plan, output_has_field: {meaning: present}}}}}
            text: '`status` has two allowed values. First say what the field as a whole tells the client; the values come next.'
      - description: Each status value says what it means for the student
        c4:
          exists:
            operation: {of: enrollment-api, id: submit-plan, output_has_field: {name_any: [status], values: meaningful}}
        hints:
          - title: What each value promises
            text: 'A client shows the status to a student. After each value, what is true about the student’s seats in this plan?'
          - title: One meaning per value
            condition: {c4: {exists: {operation: {of: enrollment-api, id: submit-plan, output_has_field: {name_any: [status], meaning: present}}}}}
            text: 'Your Meaning describes `status` as a whole. Each allowed value needs a meaning of its own: describe each value separately under the field’s values.'
      - description: The number of units says which kind of unit it counts
        c4:
          exists:
            operation: {of: enrollment-api, id: submit-plan, output_has_field: {name_any: [units_enrolled], type: number, unit_any: [quarter]}}
        hints:
          - title: Numbers in the outcome
            text: 'Look at every number in the outcome. Would a team at another university read it the same way?'
          - title: Units belong in Unit
            condition: {c4: {exists: {operation: {of: enrollment-api, id: submit-plan, output_has_field: {name_any: [units_enrolled], unit: absent, meaning: present}}}}}
            text: 'If your meaning mentions what the number counts, put that in Unit as well, so clients and checks can find it.'
          - title: Which kind of unit
            condition: {c4: {exists: {operation: {of: enrollment-api, id: submit-plan, output_has_field: {name_any: [units_enrolled], type: number, unit: present}}}}}
            text: 'Universities count credit in different kinds of units. Which kind does this university use? The team notes and the shared vocabulary both name it.'
      - description: The term says how it is written
        c4:
          exists:
            operation: {of: enrollment-api, id: submit-plan, input_has_field: {name_any: [term], format: present}}
        hints:
          - title: How the term is written
            text: 'How would a client write the winter term of 2027? Would every team write it the same way?'
          - title: From meaning to format
            condition: {c4: {exists: {operation: {of: enrollment-api, id: submit-plan, input_has_field: {name_any: [term], format: absent, meaning: present}}}}}
            text: 'Your meaning says what a term is. Now say how it is written: which part comes first, and how is each part spelled?'
      - description: The operation is linked to the API responsibilities a client relies on
        c4:
          exists:
            operation: {of: enrollment-api, id: submit-plan, realizes: [api-eligibility, api-holds]}
        hints:
          - title: Obligations a client asks for
            text: 'An operation is how a client asks the Registration API to meet one of its obligations. Which obligations does submitting a plan ask for?'
          - title: Compare the links with the outcomes
            condition: {c4: {exists: {operation: {of: enrollment-api, id: submit-plan, realizes_at_least: 1}}}}
            text: 'Compare your links with the side effects you wrote. Which obligations of the Registration API does an enrolled outcome fulfill, and which one does a refused outcome still fulfill?'
          - title: Before a seat is held
            condition: {c4: {exists: {operation: {of: enrollment-api, id: submit-plan, realizes_any: [api-holds]}}}}
            text: 'Before any seat is held, something has to be decided. Which responsibility of the Registration API decides it?'
          - title: After the decision
            condition: {c4: {exists: {operation: {of: enrollment-api, id: submit-plan, realizes_any: [api-eligibility]}}}}
            text: 'An enrolled outcome changes something for the student that a decision alone does not. Which responsibility promises that change?'
          - title: A link to the inside
            condition: {c4: {exists: {operation: {of: enrollment-api, id: submit-plan, realizes_any: [coordinator-do-1]}}}}
            text: 'One link names how the API divides its work inside, not something a client can notice. Which one?'
      - description: The description passes the interface consistency checks
        c4:
          checks: {max_warnings: 0, rules: [interface/no-unit, interface/no-format, interface/no-purpose, interface/example-mismatch, interface/realizes-internal, interface/undefined-type]}
        hints:
          - title: Read the Problems panel
            text: 'Open Problems. Each warning names the operation, field, example, or link it is about. Fix them one at a time.'
          - title: Check the example against the types
            condition: {c4: {exists: {operation: {of: enrollment-api, id: submit-plan, examples_at_least: 1}}}}
            text: 'If a warning is about your example, compare each key with the field names of the two types, and each value with its field’s type and allowed values.'
          # Holds only when every warning of this check is interface/realizes-internal (wrong-12, wrong-13).
          - title: A link a client cannot notice
            condition: {c4: {checks: {max_warnings: 0, rules: [interface/no-unit, interface/no-format, interface/no-purpose, interface/example-mismatch, interface/undefined-type]}}}
            text: 'Every warning left is about a link. For each link it names, ask whether a client of the Registration API could ever notice that obligation, or whether it describes how the API divides its work inside.'
      - description: The web app names the operation it calls
        c4:
          exists:
            relationship: {from: web, to: api, uses: enrollment-api.submit-plan}
        hints:
          - title: The call the web app makes
            text: 'Select the relationship from the Planner Web App. Which operation does submitting a plan call?'
          - title: The whole interface or one operation
            condition: {c4: {exists: {relationship: {from: web, to: api, uses_interface: whole}}}}
            text: 'Your relationship names the whole Enrollment API. Which single operation does submitting a plan call?'
          - title: Which interface it enters through
            condition: {c4: {exists: {relationship: {from: web, to: api, uses_interface: present}}}}
            text: 'Check what your Uses names. The plan enters the Registration API through one interface and one operation; does your choice name both?'
      # One hint by design: a guard fails only when given syntax was edited, and its one hint says what to undo.
      - description: The given syntactic view is unchanged
        c4:
          same_as_seed: {interface: {id: enrollment-api}, part: syntax}
        hints:
          - title: The given syntax
            text: 'The operation line, its input and output, and every field’s type, required flag, allowed values, and constraints were given. Undo any change to them, and describe meanings on the Semantic view tab.'
      # T12-T15: the plan check (transfer within the step). The checks test above (T9) already requires a unit on units_planned.
      # Hints fade here (cs-tutorial-design, "The Fading Imperative"): T12, the plan check's new decision, keeps a full
      # ladder; T13-T15 repeat what the learner just did for submit-plan with full ladders (T4 outcome meanings, T8 links,
      # T10 the operation the web app calls), so each has one orienting hint and no diagnosis or scaffold.
      - description: The plan check says what it is for, what it changes, and which decision it makes
        c4:
          exists:
            operation: {of: enrollment-api, id: check-plan, purpose: present, side_effects: present, realizes: api-eligibility}
        hints:
          - title: What a check is for
            text: 'This check reads the plan check’s Purpose, its Side effects, and its Realizes links. The second operation answers a question without enrolling anyone: who asks it, when, and what does the answer tell them?'
          - title: What a check changes
            condition: {c4: {exists: {operation: {of: enrollment-api, id: check-plan, purpose: present, side_effects: absent}}}}
            text: 'Compare a check with a submission. What can another system notice after a check? A client needs that answer too, to know whether it may call the operation freely.'
          - title: The obligation a check fulfills
            condition: {c4: {exists: {operation: {of: enrollment-api, id: check-plan, purpose: present, side_effects: present}}}}
            text: 'Which obligation of the Registration API does a check fulfill for the client? Compare it with the links you gave submit-plan.'
      - description: Every field of the plan check’s outcome says what it means
        c4:
          absent:
            operation: {of: enrollment-api, id: check-plan, output_has_field: {meaning: absent}}
        hints:
          - title: Read the check’s outcome as a stranger
            text: 'What does each field of PlanCheck tell the web app’s team about the plan? An optional field needs a meaning too: say when it is present.'
      - description: The plan check promises no seat and no charge
        c4:
          absent:
            operation: {of: enrollment-api, id: check-plan, realizes_any: [api-holds, api-billing]}
        hints:
          - title: What a check never does
            text: 'A check holds no seat and asks Billing for nothing. Which of the plan check’s links promises something a check never does?'
      - description: The web app names the plan check it calls
        c4:
          exists:
            relationship: {from: web, to: api, uses: enrollment-api.check-plan}
        hints:
          - title: Both calls the web app makes
            text: 'The web app lets students check a plan before they submit it. Does its relationship name every operation it calls?'
    solution:
      files:
        - path: design.yml
          language: yaml
          content: |
            schema: c4-design/1
            name: Course Registration
            description: Students plan a term schedule and enroll in every section of it, or in none.
            status: proposed
            enterprise: UCLA

            requirements:
              FR-07: A student who lacks a prerequisite or would exceed the unit cap is refused before any seat is held, and is told why.
              FR-09: A student is enrolled in every section of a plan, or in none.
              FR-11: Every completed enrollment is charged tuition, and a billing outage never delays an enrollment.

            vocabulary:
              quarter unit: the UCLA credit unit; most courses are worth 4 quarter units

            people:
              student:
                name: Student
                description: Plans and confirms one term schedule.
                collaborators:
                  web: plans a schedule and enrolls using

            systems:
              registration:
                name: Course Registration
                description: Plans term schedules and enrolls students in their sections.
                responsibilities:
                  - decide: whether a student may enroll in a section
                    id: sys-eligibility
                    requirements: [FR-07]
                  - do: hold a seat in every section of a plan, or in none
                    id: sys-holds
                    requirements: [FR-09]
                  - do: request the tuition charge for every completed enrollment
                    id: sys-billing
                    requirements: [FR-11]
                containers:
                  web:
                    name: Planner Web App
                    kind: browser_app
                    technology: TypeScript, React
