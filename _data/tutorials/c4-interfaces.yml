    quiz:
      title: 'Step 1 — Knowledge Check'
      min_score: 0.8
      questions:
        - type: multiple
          difficulty: intermediate
          # objective: 7 (chapter), tutorial objective 1; spec §11 interface tutorial step 1 (units_enrolled, decided_at, term,
          # and a distractor about the HTTP method), plus `reason`, which the chapter's reveal does not discuss (transfer
          # beyond recall). Each distractor is settled by a line of the syntactic view.
          question: 'A team that has only the Enrollment API card above builds a client for it. Which of these could that team get wrong, because the card does not settle them? Select all that apply.'
          options:
            - 'Which kind of credit unit `units_enrolled` counts'
            - 'In which time zone `decided_at` reports the decision'
            - 'How to write the winter term of 2027 in `term`'
            - 'Which HTTP method sends a plan to `/v1/enrollments`'
            - 'Whether `section_ids` may list one section twice'
            - 'Which values `status` can take in an outcome'
            - 'Whether `reason` is written for the student or for a developer'
          correct_indices: [0, 1, 2, 6]
          option_feedback:
            0: 'The type `number` says how the value is written, not what a value of 1 counts. Universities count credit in quarter units, semester units, or credit hours, and nothing on the card says which.'
            1: 'The type `datetime` names a kind of value, not a format: the card does not say how the value is written or which time zone it uses, so two clients can show the same decision on different days.'
            2: 'The type of `term` is `string`, and `2027-winter`, `Winter 2027`, and `W27` are all strings. The card does not say which spelling the API accepts.'
            3: 'The syntax line already reads `POST /v1/enrollments`, so every client sends the same method. The syntactic view settles how to call the operation.'
            4: 'The constraints column says `1 to 8 items, no duplicates`, so a client can check this before it sends a plan. A constraint is part of the syntactic view, and a schema can check it.'
            5: 'The allowed values `enrolled` and `refused` are listed on the card. What each value means for the student’s seats is still open, but which values exist is not.'
            6: 'The type `string` says only that `reason` is text. Nothing says who reads it, what language it is in, or whether a client may show it unchanged.'
          explanation: 'The syntactic view settles how to call the operation and how each value is written: the method and path, the types, which fields are required, the allowed values, and the constraints. It leaves open what the values mean: which unit a number counts, which time zone a timestamp uses, how a text value is spelled, and who a text is written for. A schema such as OpenAPI would accept every one of these misreadings, because each is still valid syntax.'
