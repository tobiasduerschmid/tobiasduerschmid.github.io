            condition: {c4: {exists: {interface: {of: billing, has_operation: {input_has_field: {type_any: [integer, number, decimal], unit: absent}}}}}}
            text: 'A number in your message has no Unit. Would Billing’s accountants and Registration’s developers read a value of 1 the same way?'
          - title: Quantities written as text
            condition: {c4: {absent: {interface: {of: billing, has_operation: {input_has_field: {type_any: [integer, number, decimal]}}}}}}
            text: 'No message on the Billing System’s own interface has a number field yet: Billing has no interface of its own, its message type is not described yet, or the amount and the number of units have a type that is not a number, such as text. Which type fits a count, and which fits money? A message described on another element does not count here.'
      - description: The operation says what can go wrong
        c4:
          exists:
            interface: {of: billing, has_operation: {errors_at_least: 1}}
        hints:
          - title: A message that cannot be charged
            text: 'What happens to a message Billing cannot act on, and how does the sender find out?'
          - title: Two kinds of failure
            condition: {c4: {exists: {interface: {of: billing}}}}
            text: 'Think of what can be wrong with the message itself, and of what it can name that Billing does not have. For each, where does the message go, and who finds out?'
      - description: The gateway’s relationship names the interface it uses
        c4:
          exists:
            relationship: {from: billing-gateway, to: billing, uses_interface: present}
        hints:
          - title: The gateway’s side
            text: 'Select the relationship from the Billing Gateway to the Billing System. What does it send?'
          - title: Billing is gone
            condition: {c4: {absent: {element: {type: system, name_any: [billing]}}}}
            text: 'The Billing System is no longer in the model, so the gateway has nothing to send its messages to. Undo the deletion, then name on the gateway’s relationship the interface it uses.'
          - title: Name what it uses
            condition: {c4: {exists: {interface: {of: billing}}}}
            text: 'Billing’s interface has an id now. Under Uses, the gateway’s relationship can name the interface or the operation it sends through.'
      - description: The description passes the interface consistency checks
        c4:
          checks: {max_warnings: 0, rules: [interface/no-syntax, interface/untyped-field, interface/undefined-type, interface/no-unit, interface/no-format, interface/no-purpose, interface/no-errors, interface/example-mismatch]}
        hints:
          - title: Read the Problems panel
            text: 'Choose Check now, then open Problems. Each warning names the field, operation, or example it is about.'
          - title: Check the example against the types
            condition: {c4: {exists: {interface: {of: billing, has_operation: {examples_at_least: 1}}}}}
            text: 'If a warning is about your example, compare each key with your field names, and each value with its field’s type.'
      - description: Every message field says what it means
        c4:
          absent:
            interface: {of: billing, has_operation: {input_has_field: {meaning: absent}}}
        hints:
          - title: A meaning for every field
            text: 'For each field, what does it identify or measure, and for whom?'
          - title: Billing is gone
            condition: {c4: {absent: {element: {type: system, name_any: [billing]}}}}
            text: 'The Billing System is no longer in the model, so its message has no fields to describe. Undo the deletion, then give each field of the message a meaning.'
    solution:
      files:
        - path: design.yml
          language: yaml
          content: |
            schema: c4-design/1
            name: Course Registration
            description: Students plan a term schedule and enroll in every section of it, or in none.
            status: proposed
            enterprise: UCLA

            requirements:
              FR-07: A student who lacks a prerequisite or would exceed the unit cap is refused before any seat is held, and is told why.
              FR-09: A student is enrolled in every section of a plan, or in none.
              FR-11: Every completed enrollment is charged tuition, and a billing outage never delays an enrollment.

            vocabulary:
              quarter unit: the UCLA credit unit; most courses are worth 4 quarter units

            people:
              student:
                name: Student
                description: Plans and confirms one term schedule.
                collaborators:
                  web: plans a schedule and enrolls using

            systems:
              registration:
                name: Course Registration
                description: Plans term schedules and enrolls students in their sections.
                responsibilities:
                  - decide: whether a student may enroll in a section
                    id: sys-eligibility
                    requirements: [FR-07]
                  - do: hold a seat in every section of a plan, or in none
                    id: sys-holds
                    requirements: [FR-09]
                  - do: request the tuition charge for every completed enrollment
                    id: sys-billing
                    requirements: [FR-11]
                containers:
                  web:
                    name: Planner Web App
                    kind: browser_app
                    technology: TypeScript, React
                    description: Lets students compare draft schedules in the browser.
                    responsibilities:
                      - do: let students compare draft schedules
                    collaborators:
                      coordinator: {description: submits plans to, technology: JSON/HTTPS, uses: enrollment-api.submit-plan}
                  api:
                    name: Registration API
                    technology: Python, FastAPI
                    description: Decides eligibility and enrolls students atomically.
                    responsibilities:
                      - decide: whether a student may enroll in a section
                        id: api-eligibility
                        refines: sys-eligibility
                      - do: hold a seat in every section of a plan, or in none
                        id: api-holds
                        refines: sys-holds
                      - do: request the tuition charge for every completed enrollment
                        id: api-billing
                        refines: sys-billing
                    provides:
                      enrollment-api:
                        name: Enrollment API
                        description: Enrolls one student in every section of a planned schedule, or in none.
                        style: rest
                        technology: JSON/HTTPS
                        version: 1
                        restrictions:
                          - Only the Planner Web App may call it, acting for the signed-in student named in the request.
                          - A student may send at most 10 requests per minute.
                        errors:
                          unauthorized:
                            code: 401
                            when: the caller is not signed in as the student named in the request; the client asks the student to sign in again
                          too-many-requests:
                            code: 429
                            when: the student sent more than 10 requests in one minute; the client waits for the Retry-After time and tries again
                        operations:
                          submit-plan:
                            syntax: POST /v1/enrollments
                            input: EnrollmentRequest
                            output: EnrollmentOutcome
                            purpose: When a client submits a student's plan for one term, the API decides whether the student may enroll and then enrolls the student in every section of the plan, or in none.
                            side_effects:
                              - An enrolled outcome holds a seat in every section of the plan and requests the tuition charge from Billing.
                              - A refused outcome changes nothing.
                            errors:
                              invalid-plan:
                                code: 422
                                when: the plan breaks a constraint of EnrollmentRequest, such as a section listed twice; the client shows the broken constraint
                              unknown-section:
                                code: 422
                                when: a section id does not exist in the requested term; the client shows the section and lets the student remove it
                            examples:
                              - input: {student_id: "905123456", term: 2027-winter, section_ids: ["187204", "187310"]}
                                output: {status: enrolled, units_enrolled: 8, decided_at: "2027-01-05T09:30:00-08:00"}
                                note: Two 4-unit sections that do not clash.
                            realizes: [api-eligibility, api-holds, api-billing]
                        types:
                          EnrollmentRequest:
                            description: One student's plan for one term.
                            fields:
                              student_id:
                                type: string
                                meaning: university id of the student who enrolls
                                format: nine digits
                              term:
                                type: string
                                meaning: the academic term of every section in the plan
                                format: "<year>-<fall | winter | spring | summer>"
                              section_ids:
                                type: string[]
                                meaning: the sections the student wants to take together
                                format: six-digit section ids
                                constraints: 1 to 8 items, no duplicates
                          EnrollmentOutcome:
                            description: The decision for the whole plan.
                            fields:
                              status:
                                type: string
                                meaning: whether the plan was accepted
                                values:
                                  enrolled: the student now holds a seat in every section of the plan
                                  refused: the student holds no new seat; reason says why
                              units_enrolled:
                                type: number
                                meaning: total units the student holds in the term after this attempt
                                unit: quarter units
                              decided_at:
                                type: datetime
                                meaning: the moment the API decided the outcome
                                format: ISO 8601 with a UTC offset
                              reason:
                                type: string
                                meaning: the reason for a refusal in words a student understands
                                required: false
                        vocabulary:
                          section: one scheduled offering of a course in one term
                          plan: the sections a student wants to take together in one term
                    choices:
                      technology:
                        chosen: FastAPI 0.115 on Python 3.12
                        alternatives: [Django REST Framework, Flask]
                        because: typed request models and async database access
                      styles: [layers]
                    components:
                      coordinator:
                        name: Registration Coordinator
                        technology: Python module
                        stereotypes: [coordinator]
                        responsibilities:
                          - do: sequence one enrollment attempt
                          - decide: which step of the attempt runs next
                        collaborators:
                          policy: asks for an eligibility decision from
                          seats: reserves all seats or none through
                          billing-gateway: asks for tuition charges through
                        invariants: [never decides eligibility or writes seat state]
                        quality: [an enrollment outcome appears within 2 s for 95% of attempts]
                      policy:
                        name: Enrollment Policy
                        technology: Python module
                        stereotypes: [service_provider]
                        responsibilities:
                          - decide: whether prerequisites and unit caps allow enrollment
                            refines: api-eligibility
                        code:
                          EnrollmentPolicy:
                            kind: class
                            operations: ["+ decide(student, section): Decision"]
                            collaborators: {EnrollmentRule: delegates each eligibility check to}
                            choices: {patterns: [{pattern: Strategy, role: Context, instance: eligibility-rules}]}
                          EnrollmentRule:
                            kind: interface
                            operations: ["+ evaluate(student, section): RuleResult"]
                            choices: {patterns: [{pattern: Strategy, role: Strategy, instance: eligibility-rules}]}
                          PrerequisiteRule:
                            kind: class
                            implements: [EnrollmentRule]
                            operations: ["+ evaluate(student, section): RuleResult"]
                            choices: {patterns: [{pattern: Strategy, role: ConcreteStrategy, instance: eligibility-rules}]}
                          UnitCapRule:
                            kind: class
                            implements: [EnrollmentRule]
                            operations: ["+ evaluate(student, section): RuleResult"]
                            choices: {patterns: [{pattern: Strategy, role: ConcreteStrategy, instance: eligibility-rules}]}
                      seats:
                        name: Seat Gateway
                        technology: Python module
                        stereotypes: [interfacer]
                        owns: [seat holds]
                        responsibilities:
                          - know: which seats are held for each attempt
                          - do: hold every requested seat atomically, or none
                            refines: api-holds
                        collaborators:
                          db: {description: writes seat holds to, technology: SQL/TCP}
                      billing-gateway:
                        name: Billing Gateway
                        technology: Python module
                        stereotypes: [interfacer]
                        responsibilities:
                          - do: request tuition charges for a completed enrollment
                            refines: api-billing
                        collaborators:
                          billing:
                            description: requests tuition charges from
                            technology: AMQP
                            connector: message
                            uses: tuition-charges.charge-tuition
                            choices:
                              technology: {chosen: RabbitMQ, alternatives: [synchronous HTTPS call], because: a billing outage must not block enrollment}
                  db:
                    name: Registration Database
                    kind: database
                    technology: PostgreSQL 16
                    description: Durably stores plans, enrollment attempts, and seat holds.
                    responsibilities:
                      - do: durably store plans, enrollment attempts, and seat holds
              billing:
                name: Billing System
                external: true
                description: Charges tuition and fees for the university.
                provides:
                  tuition-charges:
                    name: Tuition Charges
                    description: Accepts requests to charge tuition to a student's account.
                    style: message
                    technology: AMQP, JSON
                    version: 2
                    restrictions:
                      - Only systems holding a university service credential may send to billing.charges.
                    operations:
                      charge-tuition:
                        syntax: send ChargeRequested to the queue billing.charges
                        input: ChargeRequested
                        purpose: When a registration system reports a completed enrollment, Billing adds the tuition for the enrolled units to the student's account.
                        side_effects:
                          - Adds one charge to the student's account; a repeated message with the same request_id adds nothing.
                        errors:
                          malformed-message: the message does not match ChargeRequested; Billing moves it to the queue billing.charges.rejected, where the sender's operators review it
                          unknown-student: no student account exists for student_id; Billing moves the message to billing.charges.rejected
                        examples:
                          - input: {request_id: 7f3c2a, student_id: "905123456", term: 2027-winter, units: 8, amount: 418400}
                            note: Billing sends no reply; the charge appears on the student's account.
                    types:
                      ChargeRequested:
                        description: One request to charge tuition for one enrollment attempt.
                        fields:
                          request_id:
                            type: string
                            meaning: identifies one charge request so that a repeated message is charged once
                          student_id:
                            type: string
                            meaning: university id of the student to charge
                            format: nine digits
                          term:
                            type: string
                            meaning: the term the tuition is for
                            format: "<year>-<fall | winter | spring | summer>"
                          units:
                            type: number
                            meaning: units the student enrolled in by this attempt
                            unit: quarter units
                          amount:
                            type: integer
                            meaning: tuition owed for these units, before financial aid and without fees
                            unit: US cents

            scenarios:
              enroll:
                title: Enroll in a planned schedule
                steps:
                  - web -> coordinator: submits the plan to
                  - coordinator -> policy: asks for an eligibility decision from
                  - alt:
                      - when: eligible
                        steps:
                          - coordinator -> seats: reserves all seats or none through
                          - coordinator -> billing-gateway: asks for tuition charges through
                      - when: not eligible
                        steps:
                          - coordinator -> web: reports the refusal and its reason to

            deployment:
              production:
                name: Production
                nodes:
                  laptop:
                    name: Student's computer
                    kind: device
                    nodes:
                      browser:
                        name: Web browser
                        kind: environment
                        technology: "Chrome, Firefox, or Safari"
                        hosts: [web]
                        collaborators:
                          ingress: sends HTTPS requests to
                  campus-cloud:
                    name: Campus cloud
                    kind: environment
                    technology: Kubernetes
                    nodes:
                      ingress:
                        name: Ingress load balancer
                        kind: infrastructure
                        technology: NGINX
                        collaborators:
                          api-pod: forwards HTTPS requests to
                      api-pod: {name: API pod, kind: environment, technology: Kubernetes pod, instances: 3, hosts: [api]}
                      postgres: {name: Managed database, kind: environment, technology: PostgreSQL 16, hosts: [db]}
                  data-centre:
                    name: University data center
                    kind: environment
                    hosts: [billing]

            decisions:
              one-database:
                title: Keep plans and seat holds in one relational database
                status: accepted
                context: Seat holds and enrollment must commit atomically.
                decision: One PostgreSQL database with serializable transactions for seat holds.
                alternatives: [a separate seat service with its own store]
                consequences: The database is a single point of failure.
                affects: [db, seats]
      explanation: |
        The reference describes **Tuition Charges** on the Billing System, the element that receives the messages: a `message` interface over `AMQP, JSON`, version 2, with one operation, `charge-tuition`, whose syntax line names the queue (`send ChargeRequested to the queue billing.charges`). `ChargeRequested` has a `request_id` (so a repeated message is charged once, which the side effect states), the student's nine-digit id, the term with its format, `units` in quarter units, and `amount` as an integer in US cents, before financial aid and without fees. Two errors say where an unreadable message or an unknown student goes and who reviews it; an interface restriction says who may send to the queue. The Billing Gateway's relationship uses `tuition-charges.charge-tuition`.

        Describing it on the gateway would make the sender the provider; the provider of a `message` interface is its receiver. Writing `units` and `amount` as text leaves a schema nothing to check and a client nothing to compute with.

  # Pedagogy: transfer and interleaved retrieval (Evaluate): a schema-valid request read in two units (the orbiter pattern in
  # a new domain, a carrier's rate quotes) and a compatible versus a breaking change. Quiz-only step; the read-only editor shows the reference
  # description of Tuition Charges as feedback on step 3. Objectives: 5 (tutorial); 7 (chapter).
  # Minutes: 3 (spec §11, interface tutorial step 4).
  - title: Agreement Beyond the Schema
    key: transfer-check
    instructions: |
      ### Why this matters

      Two systems can exchange messages that pass every schema check and still disagree about what a number means, and a shared interface that changes can break clients its team never met. Telling these cases apart decides whether the fix is a line of description, a test, or a new version.

      ### 🎯 You will learn to

      - Explain why a message that validates can still be misread, and what catches it.
      - Tell a change that keeps existing clients working from one that needs a new version.

      The editor shows the reference description of Billing's **Tuition Charges**, read-only. Compare it with the one you wrote in step 3, which stays saved in that step. Name one line the reference has that yours lacks; go back to step 3 and add it before you continue.

      Remember from step 3 how a shared interface changes: adding an optional field keeps every existing client working; removing or renaming a field, or making an optional one required, breaks messages that clients already send, so it needs a new version. Then choose **Next** to open the knowledge check.

      This step has no model checks: the knowledge check confirms your reasoning about two cases, but it cannot check an interface of your own. For that, take one interface between the client and the server of your team project and draft its description: its syntax, with each parameter's type, and its semantics, with the meaning of the request and of each parameter and the errors that can occur. Then ask which field another team would most likely misread.
