title: "Monopoly State Pattern UML"
description: "Design Monopoly player behavior with the State pattern by drawing class, state machine, and sequence diagrams in the UML editor."

learning_objectives:
  - "Apply the State design pattern to a game-domain behavior problem."
  - "Create class, state machine, and sequence diagrams that describe the same design consistently."
  - "Evaluate whether sequence messages, state transitions, and class operations agree across diagrams."
  - "Use UML labels to document concrete conditions for behavior changes."

backend: uml-editor
require_tests: false
# 5-minute cooldown on the visible "Test My Work" button — encourages students
# to think before testing again. An "I'm sure" button stays clickable during
# cooldown but hides results; passing silently still unlocks Next.
cooldown_seconds: 300

steps:

  # Pedagogy: productive failure — students model first, then structural checks guide consistency.
  - title: "Class Diagram"
    uml_type: class
    instructions: |
      ### Why this matters

      The State pattern replaces a growing pile of turn-condition `if` statements with a `PlayerState` abstraction and one class per behavior. Your class diagram should make that delegation visible.

      ### 🎯 You will learn to

      - Create the State-pattern roles for Monopoly player behavior
      - Show the operations that the sequence diagram will later call

      Draw a class diagram with:

      - `Player`
      - a state abstraction such as `PlayerState` as either an interface or an abstract class
      - three distinct concrete states for normal turns, jail, and bankruptcy; include `normal`, `jail` (or `prison`), and `bankrupt` in their respective class names
      - an abstract operation for taking a turn; expose the same operation name on `Player` so the checks can identify it without requiring a particular verb
      - a state-changing operation on `Player` that accepts the state abstraction as an argument; choose its name freely
      - concrete state classes that implement the abstract turn operation with a compatible signature, directly or through inheritance; mark abstract-class operations `{abstract}` (interface operations are implicitly abstract)
      - an aggregation or composition relationship showing that `Player` holds exactly one current state; the related abstraction may have any name

      The checks use these role words only within the state hierarchy, so unrelated helper classes do not change the roles. They check structural consistency; you still need to review whether the operations represent the intended Monopoly behavior.
    tests:
      - description: "State-pattern classes are present"
        assertions:
          - kind: class
            id: Player
          - kind: class_consistency
            check: state_roles
      - description: "Operations support the later sequence diagram"
        assertions:
          - kind: class_consistency
            check: state_operations
      - description: "Player owns or aggregates its current state"
        assertions:
          - kind: class_consistency
            check: state_ownership
      - description: "Concrete states implement the state abstraction"
        assertions:
          - kind: class_consistency
            check: state_inheritance
      - description: "Concrete states implement abstract operations"
        assertions:
          - kind: class_consistency
            check: abstract_methods_implemented

  # Pedagogy: Make — students create a behavioral model and label transition causes.
  - title: "State Diagram"
    uml_type: state
    instructions: |
      ### Why this matters

      A State-pattern design still needs a precise lifecycle: which condition moves a player from one state object to another? The state diagram records those rules without burying them in code.

      ### 🎯 You will learn to

      - Model Monopoly player-state transitions
      - Label transitions with clear state-change conditions

      Draw a state diagram with the same normal-turn, in-jail, and bankrupt state names you used for the concrete state classes in your class diagram. Label each transition with a clear condition or event. Include normal→jail, jail→normal, and normal→bankruptcy; jail→bankruptcy is optional for this exercise. Additional labeled transitions are allowed.

      Automated checks verify the required paths and that every transition has a nonempty label. They do not judge whether a condition is meaningful or an accurate Monopoly rule; review that separately.
    tests:
      - description: "States reuse the concrete state class names"
        assertions:
          - kind: state
            class_role: normal
            naming_hint: "State nodes should reuse the concrete state class names from your class diagram, not a second set of shorter state-machine-only names."
          - kind: state
            class_role: jail
            naming_hint: "State nodes should reuse the concrete state class names from your class diagram, not a second set of shorter state-machine-only names."
          - kind: state
            class_role: bankrupt
            naming_hint: "State nodes should reuse the concrete state class names from your class diagram, not a second set of shorter state-machine-only names."
      - description: "Required transitions exist and every transition is labeled"
        assertions:
          - kind: state_consistency
            check: transition_labels
          - kind: transition
            from_class_role: normal
            to_class_role: jail
            label_min_length: 1
            naming_hint: "Transition labels should describe the condition or event that causes the state change, and be nonempty; concise meaningful labels are fine."
          - kind: transition
            from_class_role: jail
            to_class_role: normal
            label_min_length: 1
            naming_hint: "Transition labels should describe the condition or event that causes the state change, and be nonempty; concise meaningful labels are fine."
          - kind: transition
            from_class_role: normal
            to_class_role: bankrupt
            label_min_length: 1
            naming_hint: "Transition labels should describe the condition or event that causes the state change, and be nonempty; concise meaningful labels are fine."
          - kind: transition
            from_class_role: jail
            to_class_role: bankrupt
            label_min_length: 1
            optional: true
            naming_hint: "Transition labels should describe the condition or event that causes the state change, and be nonempty; concise meaningful labels are fine."

  # Pedagogy: Make — students connect the static design to one runtime interaction.
  - title: "Sequence Diagram"
    uml_type: sequence
    instructions: |
      ### Why this matters

      The sequence diagram is the consistency check: the calls you show here should be operations from the class diagram, and the participating state object should correspond to a state from the state diagram.

      ### 🎯 You will learn to

      - Show one typical State-pattern turn interaction
      - Keep operation names consistent across UML diagrams

      Draw one typical interaction. Show a `Player` object calling at least two different concrete state objects, with a state-change call between those turn calls. Use the operations declared in your class diagram, with compatible argument counts and known object types. Label calls as `method(arguments)`; the arrow identifies the receiver. Pass the next state object lifeline to the state-changing call, then direct the next turn call to that object. Every illustrated state change must exist in your state diagram.

      A complete turn/change/turn interaction must occur on at least one coherent path; every shown path must respect state changes. You may use `alt`, `opt`, `loop`, `break`, and `critical` fragments. For alternatives, an unlabeled `else` covers all remaining cases; labeled guards may all be false. Numeric loop bounds such as `loop (1, 3)` are checked; the meaning of prose guards still needs human review. Calls in mutually exclusive branches cannot be combined into one interaction, and responses or notes do not count as calls. Other fragments need manual review. Extra lifelines are allowed without requiring messages to them.
    tests:
      - description: "Player and concrete state objects are shown"
        assertions:
          - kind: sequence
            check: player_object
            naming_hint: "Use a typed lifeline for the player object so the diagram can connect messages back to the Player class."
          - kind: sequence
            check: state_objects
            min: 2
            different_types: true
            naming_hint: "Use typed lifelines for concrete state objects; the class side of each lifeline should reuse a concrete state class name from your class diagram."
      - description: "Player calls two state types and changes state on a coherent path"
        assertions:
          - kind: sequence
            check: messages_between_player_and_states
          - kind: sequence
            check: state_change_between_state_calls
            naming_hint: "The message between the two state calls should use the state-changing operation name from the class diagram."
      - description: "State-change call passes the next state object"
        assertions:
          - kind: sequence
            check: state_change_argument_is_next_state
            naming_hint: "The state-changing call should pass the lifeline that receives the following turn call, for example setState(in_jail_state)."
      - description: "Sequence calls use method-call labels"
        assertions:
          - kind: sequence
            check: call_labels_have_argument_lists
            naming_hint: "Write message labels as methodName(arguments), for example takeTurn(player) or setState(in_jail_state). The arrow already names the receiver, so do not prefix the label with self. or an object name."
      - description: "Sequence calls match class operations and known argument types"
        assertions:
          - kind: sequence
            check: called_methods_exist
            naming_hint: "Read each arrow as a method call on the receiving lifeline. The message name should be an operation on that receiver's class or inherited state abstraction."
