title: "Regex in Python"
description: "Parse three tiny game-night files with regular expressions in about 10 minutes. Assumes basic regex syntax and Python loops, functions, and lists."
learning_objectives:
  - "Apply character classes, bounded repetition, and optional signs to parse file lines."
  - "Decide when anchors are needed to reject extra text."
  - "Apply named capture groups to extract fields from a matching line."
  - "Create integer values from captured text while preserving file order."
backend: pyodide
require_tests: false
require_quiz: false
allow_skip_steps: true
instructor_mode: true
instructions_footer_include: regex-tutorial-reference.html
autosave_type: files
reset_type: files

# Deliberately shorter than the normal tutorial: one regex, then two/three
# expressions to fill in. File handling is supplied so practice stays on regex.
# Each check imports this helper afresh: Pyodide clears globals between runs.
# Temporary inputs test the parser without overwriting the learner's data files.
setup_commands:
  - |
    import sys
    from pathlib import Path
    sys.path.insert(0, '/tutorial')
    Path('/tutorial/_regex_checks.py').write_text('''import contextlib
    import io
    import runpy
    import tempfile
    from pathlib import Path

    def load(script):
        with contextlib.redirect_stdout(io.StringIO()):
            return runpy.run_path('/tutorial/' + script)

    def parse(script, text):
        namespace = load(script)
        with tempfile.TemporaryDirectory() as directory:
            path = Path(directory) / 'input.txt'
            path.write_text(text, encoding='utf-8')
            return namespace['parse_file'](str(path))
    ''', encoding='utf-8')

steps:
  # Pedagogy: worked example with fading — supplied file loop, one pattern to derive.
  - title: "Whole-Line Matches"
    instructions: |
      ### Why this matters

      Text processing often requires distinguishing valid records from noise. Python's `re` module lets you apply familiar regex patterns directly inside a file-reading loop.

      ### 🎯 You will learn to

      - Integrate RegEx into Python scripts using the `re` module.

      ### `re` Python Package API Summary

      - `import re` loads Python's regex module; `r"..."` keeps backslashes literal so that you can directly insert the RegEx.
      - `re.search(pattern, text)` finds the first matching part **anywhere** in the text, or returns `None`.

      ### Input File

      `clips.txt` is a text file with one candidate filename per line, including invalid entries. The supplied loop removes surrounding whitespace.

      Example lines from `clips.txt`:

      ```text
      replay_07.txt
      replay_2048.txt
      replay_7.txt
      ```

      ### Task

      Implement the regex-based parser in `filter_clips.py` using the supplied file-reading code. Given a file path, `parse_file(path)` must return a list of valid replay filenames.

      - Match only complete filenames consisting of `replay_`, **2–4 digits**, and `.txt`. Leading zeros are allowed.
      - Reject blank lines and any line containing extra or invalid text.
      - Preserve file order and duplicate filenames. An empty file produces `[]`.
    open_file: filter_clips.py
    run_file: filter_clips.py
    files:
      - path: filter_clips.py
        language: python
        content: |
          import re  # Python's regular-expression module

          pattern = r"FILL_ME"  # Raw strings preserve backslashes; braces limit repetitions.

          def parse_file(path):
              clips = []
              with open(path, encoding="utf-8") as source:
                  for line in source:
                      line = line.strip()
                      if re.search(pattern, line):  # First matching part, or None.
                          clips.append(line)
              return clips

          if __name__ == "__main__":
              print(parse_file("clips.txt"))
      - path: clips.txt
        language: plaintext
        content: |
          replay_07.txt
          replay_2048.txt
          replay_7.txt
          replay_12345.txt
          replay_.txt
          replay_99xtxt
          backup_replay_88.txt
          replay_33.txt.bak
          replay_07.txt
    tests:
      - description: "Two to four digits, including leading zeros and repeats"
        command: |
          from _regex_checks import parse
          result = parse('filter_clips.py', 'replay_00.txt\nreplay_0123.txt\nreplay_4567.txt\nreplay_89.txt\nreplay_315.txt\nreplay_00.txt\n')
          assert result == ['replay_00.txt', 'replay_0123.txt', 'replay_4567.txt', 'replay_89.txt', 'replay_315.txt', 'replay_00.txt'], 'Keep every filename with 2–4 digits in file order, including repeats.'
        hints: &filename_hints
          - title: "Fixed Text and Changing Digits"
            condition: 'code_not_matches: /\bpattern\s*=\s*(?:r?["''](?!FILL_ME)[^"'']+["''])/i'
            text: "Compare replay_07.txt with replay_2048.txt. Which characters stay fixed, and which part has a length limit?"
          - title: "Both Length Limits"
            condition: 'code_matches: /\bpattern\s*=\s*r?["''](?!FILL_ME)[^"''{]+["'']/i'
            text: "Compare numbers with 1, 2, 4, and 5 digits. Your repetition must enforce both the minimum and maximum."
          - title: "Whole Filenames"
            condition: 'code_matches: /\bpattern\s*=\s*r?["''](?!FILL_ME)[^"'']*\{[^"'']*["'']/i'
            text: "Compare replay_99xtxt, backup_replay_88.txt, and replay_88.txt.bak. Does your pattern accept only a complete filename with a literal dot?"
      - description: "Malformed filenames and extra text are skipped"
        command: |
          from _regex_checks import parse
          result = parse('filter_clips.py', 'replay_.txt\nreplay_7.txt\nreplay_12345.txt\nreplay_xx.txt\nreplay_-22.txt\nreplay_88xtxt\nbackup_replay_88.txt\nreplay_88.txt.bak\nreplay_88.txt\n')
          assert result == ['replay_88.txt'], 'Require a complete replay filename with 2–4 digits and a literal dot.'
        hints: *filename_hints
      - description: "Empty files, blank lines, and surrounding whitespace"
        command: |
          from _regex_checks import parse
          assert parse('filter_clips.py', '') == [], 'An empty file has no filenames.'
          assert parse('filter_clips.py', '\n  \n  replay_06.txt  \n\t\n') == ['replay_06.txt'], 'Strip surrounding whitespace and skip blank lines.'
        hints: *filename_hints
    quiz:
      title: "Step 1 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: |
            Which text matches Python's `re.search(r"^item_\d{2,4}$", text)`?
          options:
            - '`item_2`'
            - '`item_24`'
            - '`new_item_24`'
            - '`item_12345`'
          correct_index: 1
          option_feedback:
            0: "The lower bound requires at least two digits; this number has only one."
            2: "The start anchor requires item_ at the beginning, so an extra prefix is rejected."
            3: "The upper bound permits at most four digits; the end anchor prevents leaving a fifth digit unmatched."
          explanation: "The literal prefix must be followed by two to four digits, with no extra text."
    solution:
      files:
        - path: filter_clips.py
          language: python
          content: |
            import re

            pattern = r"^replay_\d{2,4}\.txt$"

            def parse_file(path):
                clips = []
                with open(path, encoding="utf-8") as source:
                    for line in source:
                        line = line.strip()
                        if re.search(pattern, line):
                            clips.append(line)
                return clips

            if __name__ == "__main__":
                print(parse_file("clips.txt"))
      explanation: |
        `\d{2,4}` accepts two to four digits; `\.` requires a dot.
        `^` and `$` require the match to span the stripped line; `search` alone would accept matching fragments.
        The file produces `['replay_07.txt', 'replay_2048.txt', 'replay_07.txt']`.

  # Pedagogy: worked example with fading — add one capture and convert its text.
  - title: "One Named Group"
    instructions: |
      ### Why this matters

      Finding a match is only the first part of parsing. Named capture groups let Python retrieve the value you need without relying on fixed character positions.

      ### 🎯 You will learn to

      - Use RegEx named groups to retrieve specific parts of a match.

      ### `re` Python Package API Summary

      - `(?P<field>...)` names a capture; `match.group("field")` reads its text.

      ### Input File

      `scores.txt` is a text file containing one `label=value` entry per line, along with malformed entries. The supplied loop removes surrounding whitespace.

      Example lines from `scores.txt`:

      ```text
      score=+7
      score=-12
      score=--2
      ```

      ### Task

      Implement the regex-based parser in `read_scores.py` using the supplied file-reading code. Given a file path, `parse_file(path)` must return the valid scores as integers.

      - Match only whole records consisting of `score=` followed by one or more digits, optionally preceded by a **single `+` or `-`**. Internal spaces and extra text are invalid.
      - The named capture **`score`** must represent the signed numeric text, excluding the `score=`.
      - The python script should convert the captured `score` into an `integer`.
      - Skip invalid or blank lines. Preserve file order, repeated scores, and zero. An empty file produces `[]`.
    open_file: read_scores.py
    run_file: read_scores.py
    files:
      - path: read_scores.py
        language: python
        content: |
          import re

          # Parentheses capture text; ? means optional; + means one or more.
          pattern = r"FILL_ME"

          def parse_file(path):
              scores = []
              with open(path, encoding="utf-8") as source:
                  for line in source:
                      match = re.search(pattern, line.strip())
                      if match:  # A failed match is None: don't read its groups.
                          score = ...  # Extract the captured text and convert it to an integer.
                          scores.append(score)
              return scores

          if __name__ == "__main__":
              print(parse_file("scores.txt"))
      - path: scores.txt
        language: plaintext
        content: |
          score=+7
          score=-12
          score=42
          score=0
          score=x
          score=
          score=--2
          bonus=9
          score=3 extra
    tests:
      - description: "The named score group captures the sign and digits without the label"
        command: |
          import re
          from _regex_checks import load
          pattern = load('read_scores.py')['pattern']
          for text, digits in [('score=0', '0'), ('score=-315', '-315'), ('score=+04', '+04'), ('score=-0', '-0')]:
              match = re.search(pattern, text)
              assert match is not None and match.groupdict() == {'score': digits}, 'Name the capture score and keep its sign and all digits, without score=.'
        hints: &score_pattern_hints
          - title: "The Label and the Value"
            condition: 'code_not_matches: /\bpattern\s*=\s*r?["''](?!FILL_ME)[^"'']+["'']/i'
            text: "Compare score=7, score=+7, and score=-12. Identify the fixed label and the complete signed value you need to keep."
          - title: "The Capture Boundary"
            condition: 'code_matches: /\bpattern\s*=\s*r?["''](?!FILL_ME)[^()"'']+["'']/i'
            text: "Use a named capture around the entire signed number. The optional sign belongs inside; the fixed label stays outside."
          - title: "One Value, Several Digits"
            condition: 'code_matches: /\bpattern\s*=\s*r?["''](?!FILL_ME)[^"'']*\([^"'']*["'']/i'
            text: "For score=-315, the score group must hold -315. Check its name and boundaries. Should xscore=2 or score=2 extra be accepted?"
      - description: "Captured scores become integers, including zero and repeats"
        command: |
          from _regex_checks import parse
          result = parse('read_scores.py', 'score=-12\nscore=123456789\nscore=+04\nscore=-0\nscore=+0\nscore=-12\n')
          assert result == [-12, 123456789, 4, 0, 0, -12] and all(type(value) is int for value in result), 'Return signed integer scores in file order, retaining zero and repeated records.'
        hints: &score_value_hints
          - title: "From Match to Value"
            condition: 'code_matches: /^[ \t]+score[ \t]*=[ \t]*\.\.\./m'
            text: "The match object holds the captured text. Retrieve the group named score and make its value numeric."
          - title: "Text Versus Numbers"
            condition: 'code_matches: /^[ \t]+score[ \t]*=[ \t]*(?![ \t]*\.\.\.)(?![^\n]*\bint[ \t]*\()[^\n]+/m'
            text: "A capture such as -04 is still text. Compare the types of '-4' and -4, then decide where conversion belongs."
          - title: "The Whole Record Versus Its Field"
            condition: 'code_matches: /^[ \t]+score[ \t]*=[^\n]*\bint[ \t]*\(/m'
            text: "For score=-04, separate the whole match, signed captured text, and integer result. Which one is your conversion receiving?"
      - description: "Malformed scores are skipped without losing valid records"
        command: |
          from _regex_checks import parse
          result = parse('read_scores.py', 'score=\nscore=x\nscore=-\nscore=+\nscore=--2\nscore=++2\nscore=+-2\nscore=-+2\nscore=|2\nscore=- 2\nscore=2.5\nscore= 2\nbonus=2\nxscore=2\nscore=2 extra\nscore=9\n')
          assert result == [9], 'Require digits after at most one sign, the exact label, and no internal spaces or extra text.'
        hints: *score_pattern_hints
      - description: "Empty files, blank lines, and surrounding whitespace"
        command: |
          from _regex_checks import parse
          assert parse('read_scores.py', '') == [], 'An empty file has no scores.'
          assert parse('read_scores.py', '\n  \n  score=6  \n') == [6], 'Strip surrounding whitespace and skip blank lines.'
        hints: *score_pattern_hints
    quiz:
      title: "Step 2 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: |
            What does this Python code print?

            ```python
            import re
            m = re.search(
                r"^coins=(?P<amount>[+-]?\d+)$",
                "coins=-09")
            print(int(m.group("amount")))
            ```
          options:
            - '`-091`'
            - '`-09`'
            - '`-9`'
            - 'A `ValueError`'
          correct_index: 2
          option_feedback:
            0: "int converts the captured text before addition; this is numeric addition, not string concatenation."
            1: "The string is -09. But The integer conversion removes the 0."
            3: "int accepts a sign followed by digits; the label is outside the amount group."
          explanation: "group('amount') returns '-09'; integer converstion turns that into -9."
    solution:
      files:
        - path: read_scores.py
          language: python
          content: |
            import re

            pattern = r"^score=(?P<score>[+-]?\d+)$"

            def parse_file(path):
                scores = []
                with open(path, encoding="utf-8") as source:
                    for line in source:
                        match = re.search(pattern, line.strip())
                        if match:
                            score = int(match.group("score"))
                            scores.append(score)
                return scores

            if __name__ == "__main__":
                print(parse_file("scores.txt"))
      explanation: |
        `[+-]?` allows zero or one sign inside `(?P<score>...)`, before the required digits.
        `^` and `$` reject extra text before or after the record.
        `group("score")` excludes the label; `int` keeps the sign when converting.
        The file produces `[7, -12, 42, 0]`.

  # Pedagogy: faded practice — combine two captures with a small whitespace rule.
  - title: "Two Named Groups"
    instructions: |
      ### Why this matters

      Records often contain several related values mixed with punctuation and spacing. Multiple named groups let you extract those values together and turn them into structured Python data.

      ### 🎯 You will learn to

      - Use RegEx named groups to retrieve specific parts of a match in a complex RegEx.

      ### Input File

      `players.txt` is a text file containing one `name:score` record per line, along with malformed entries. The supplied loop removes surrounding whitespace.

      Example lines from `players.txt`:

      ```text
      luna_2:+12
      max7 : -7
      bad user:8
      ```

      ### Task

      Implement the regex-based parser in `read_players.py` using the supplied file-reading code. Given a file path, `parse_file(path)` must return `(name, integer_score)` tuples for valid player records.

      - Match only whole records consisting of a name, a colon, and a score, with optional spaces around the colon and no extra text.
      - Names have **2–8 characters**: a letter `a`–`z` first, followed by `a`–`z`, `0`–`9`, or `_`.
      - Scores contain one or more digits with at most one leading `+` or `-`, without spaces between the sign and digits.
      - Named captures **`name`** and **`score`** must represent the two fields, excluding the colon and surrounding spaces but retaining the score's sign.
      - Skip invalid or blank lines. Preserve file order, duplicates, and zero. An empty file produces `[]`.
    open_file: read_players.py
    run_file: read_players.py
    files:
      - path: read_players.py
        language: python
        content: |
          import re

          # Brackets define character classes; braces limit repetitions.
          pattern = r"FILL_ME"

          def parse_file(path):
              players = []
              with open(path, encoding="utf-8") as source:
                  for line in source:
                      match = re.search(pattern, line.strip())
                      if match:
                          name = ...  # Extract the text field.
                          score = ...  # Convert the numeric field to an integer.
                          players.append((name, score))
              return players

          if __name__ == "__main__":
              print(parse_file("players.txt"))
      - path: players.txt
        language: plaintext
        content: |
          luna_2:+12
          max7 : -7
          nova: 0
          bad user:8
          echo:--1
          luna_2:2
          2luna:12
          a:12
          abcdefghi:12
          milo:
    tests:
      - description: "The named groups capture fields without separators or spaces"
        command: |
          import re
          from _regex_checks import load
          pattern = load('read_players.py')['pattern']
          for text, fields in [('ivy:30', ('ivy', '30')), ('q_ : +004', ('q_', '+004')), ('nova  :-0', ('nova', '-0')), ('z9:9', ('z9', '9')), ('abcdefgh:-12', ('abcdefgh', '-12'))]:
              match = re.search(pattern, text)
              assert match is not None and match.groupdict() == dict(zip(('name', 'score'), fields)), 'Capture only the name and signed number in groups named name and score.'
        hints: &player_pattern_hints
          - title: "Fields Versus Separators"
            condition: 'code_not_matches: /\bpattern\s*=\s*r?["''](?!FILL_ME)[^"'']+["'']/i'
            text: "Mark the name, separator, and signed score in max7 : -7. Which pieces should remain after parsing?"
          - title: "Required and Optional Parts"
            condition: 'code_matches: /\bpattern\s*=\s*r?["''](?!FILL_ME)(?![^"'']*\*)[^"'']+["'']/i'
            text: "Compare ivy:30 and ivy : -30. Spaces and signs are optional; the name and digits are required. How many name characters remain after its first letter?"
          - title: "Capture Boundaries"
            condition: 'code_matches: /\bpattern\s*=\s*r?["''](?!FILL_ME)[^"'']*\*[^"'']*["'']/i'
            text: "For q_ : -004, check both group names and boundaries. Keep the underscore and sign but no spaces. Recheck names with 1, 2, 8, and 9 characters, plus extra text before or after a record."
      - description: "Names and integer scores retain file order, zero, and repeats"
        command: |
          from _regex_checks import parse
          result = parse('read_players.py', 'ivy:-30\nq_:+004\nnova:-0\nz9:123456789\na0_9z:2\nabcdefgh:+0\nivy:-30\n')
          expected = [('ivy', -30), ('q_', 4), ('nova', 0), ('z9', 123456789), ('a0_9z', 2), ('abcdefgh', 0), ('ivy', -30)]
          assert result == expected and all(type(score) is int for name, score in result), 'Return each name with its integer score, preserving order and repeated records.'
        hints: &player_value_hints
          - title: "Two Different Fields"
            condition: 'code_matches: /\b(?:name|score)\s*=\s*\.\.\./'
            text: "Find the captures named name and score. Decide which stays text and which needs numeric conversion."
          - title: "A Number Stored as Text"
            condition: 'code_matches: /^(?![\s\S]*\b(?:name|score)\s*=\s*\.\.\.)(?![\s\S]*\bscore\s*=[^\n]*\bint\s*\()[\s\S]*\bscore\s*=/'
            text: "For q_:-004, the final pair must contain the number -4, not the string '-004'. Check the score expression's type."
          - title: "Field Order"
            condition: 'code_matches: /^(?![\s\S]*\b(?:name|score)\s*=\s*\.\.\.)[\s\S]*\bscore\s*=[^\n]*\bint\s*\(/'
            text: "Trace ivy:-30: label the whole match, named captures, and tuple positions. Conversion must receive the signed number; the player's name stays text."
      - description: "Optional spaces around the colon and surrounding whitespace"
        command: |
          from _regex_checks import parse
          result = parse('read_players.py', 'aa:1\nbb :+2\ncc: -3\ndd  :  4\n  echo:-5  \n')
          assert result == [('aa', 1), ('bb', 2), ('cc', -3), ('dd', 4), ('echo', -5)], 'Allow zero or more spaces around the colon; keep them outside both fields.'
        hints: *player_pattern_hints
      - description: "Missing fields, invalid names, and extra text are skipped"
        command: |
          from _regex_checks import parse
          result = parse('read_players.py', ':2\na:2\nabcdefghi:2\nivy:\nIvy:2\niVy:2\n2ivy:2\n_ivy:2\niv-y:2\nbad user:8\nivy:-\nivy:+\nivy:--2\nivy:++2\nivy:+-2\nivy:-+2\nivy:|2\nivy:- 2\nivy:2.5\nivy:2 extra\n!ivy:2\nivy:2!\nivy=2\nivy:2\n')
          assert result == [('ivy', 2)], 'Require a 2–8 character name starting with a lowercase letter and a valid signed integer.'
        hints: *player_pattern_hints
      - description: "Empty files and blank lines"
        command: |
          from _regex_checks import parse
          assert parse('read_players.py', '') == [], 'An empty file has no player records.'
          assert parse('read_players.py', '\n  \n\t\n') == [], 'Skip blank and whitespace-only lines.'
        hints: *player_pattern_hints
    quiz:
      title: "Step 3 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: |
            Which pair contains two names that match this pattern with Python's `re.search`?

            ```python
            r"^(?P<name>[a-z][a-z0-9_]{1,7})$"
            ```
          options:
            - '`a1` and `b1234567`'
            - '`a` and `b1234567`'
            - '`a1` and `b12345678`'
            - '`1a` and `b1234567`'
          correct_index: 0
          option_feedback:
            1: "The first letter is followed by at least one more character, so a one-character name is too short."
            2: "The first letter plus at most seven more characters allows eight total. b12345678 has nine; the end anchor prevents ignoring the final character."
            3: "Digits are allowed after the first character, but the name must start with a lowercase letter."
          explanation: "The name needs one lowercase letter followed by 1–7 lowercase letters, digits, or underscores: 2–8 characters total. a1 and b1234567 meet the two length boundaries."
    solution:
      files:
        - path: read_players.py
          language: python
          content: |
            import re

            pattern = r"^(?P<name>[a-z][a-z0-9_]{1,7})\s*:\s*(?P<score>[+-]?\d+)$"

            def parse_file(path):
                players = []
                with open(path, encoding="utf-8") as source:
                    for line in source:
                        match = re.search(pattern, line.strip())
                        if match:
                            name = match.group("name")
                            score = int(match.group("score"))
                            players.append((name, score))
                return players

            if __name__ == "__main__":
                print(parse_file("players.txt"))
      explanation: |
        One initial letter plus `{1,7}` further characters gives a total length of 2–8.
        `group("name")` reads the name; `group("score")` includes the optional sign.
        `\s*` keeps spacing outside both groups; `^` and `$` require the entire record.
        The file produces `[('luna_2', 12), ('max7', -7), ('nova', 0), ('luna_2', 2)]`.
