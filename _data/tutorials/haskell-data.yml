          - text: "Compare `[Fight 60, Fight 3]` with `[Fight 60, Heal 1, Fight 3]`. Write the starting health of the last fight in each sequence and select its rule from the contract."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)journey\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*100\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)journey\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?=[\\s\\S]*(?:^|\\n)journey\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?(?:40|\\b(?:Fight|Travel)\\b))[\\s\\S]*$/"
          - text: "Build a small table for starting health 39, 40, and 41, with columns for Fight 3 and Travel 4. Derive each entry by hand, then compare those entries with your event-transition expressions. This separates threshold choice from odd-damage rounding."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)journey\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*100\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)journey\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?![\\s\\S]*(?:^|\\n)journey\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?(?:40|\\b(?:Fight|Travel)\\b))[\\s\\S]*$/"
      - description: "Expedition termination and later events"
        command: 'journey [Fight 99] == 1 && journey [Fight 100] == (-1) && journey [Fight 101] == (-1) && journey [Fight 100, Heal 100] == (-1) && journey [Fight 60, Fight 79] == 1 && journey [Fight 60, Fight 80] == (-1) && journey [Fight 60, Fight 81, Heal 100] == (-1) && journey [Fight 60, Fight 82] == (-1)'
        hints:
          - text: "The constant placeholder cannot distinguish fatal and nonfatal events. Predict whether a journey is still active after each event before deciding how to represent its end."
            condition: "code_matches: /(?:(?:^|\\n)journey\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*100\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)journey\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b))/"
          - text: "Compare `[Fight 99, Heal 1]` with `[Fight 100, Heal 1]`. Mark the earliest event at which each trace can still continue under the contract."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)journey\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*100\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)journey\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?=[\\s\\S]*(?:^|\\n)journey\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?(?:-[ \\t]*1|<=[ \\t]*0|<[ \\t]*1))[\\s\\S]*$/"
          - text: "List the decisions needed for an empty input, a nonfatal event result, and a fatal event result. For each row, mark whether inspecting later events is permitted. Use that decision table to locate where your recursion or accumulator admits an extra transition."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)journey\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*100\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)journey\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?![\\s\\S]*(?:^|\\n)journey\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?(?:-[ \\t]*1|<=[ \\t]*0|<[ \\t]*1))[\\s\\S]*$/"
