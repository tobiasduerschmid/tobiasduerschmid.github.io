title: "Haskell 3: Data and Persistent Programs"
description: "Build recursive data structures and a pure expedition simulator. For programmers who have completed the first two Haskell tutorials; allow about 100–115 minutes, with breaks between steps. Optional written rehearsals add about 10 minutes."
learning_objectives:
  - "Apply algebraic variants and record fields to represent different kinds of values."
  - "Analyze type variables and the constraints required by operations on generic function arguments."
  - "Implement recursive transformations of lists, branching trees, and expression trees."
  - "Evaluate how persistent updates preserve old values and reuse unaffected structure."
  - "Create a pure event simulator with explicit boundary and stopping rules."
backend: haskell
debugger: true
# Checks provide optional practice; students may visit any lesson.
require_tests: false
require_quiz: false
allow_skip_steps: true

# Preserve matching saved lessons without crediting replacements at the same index.
progress_version: 2
legacy_step_keys: [variants, records, generic-adts, recursive-data, persistent-trails, branching-data, search-trees, expression-trees, expedition]

# Source map: docs/haskell-course-source-map.md. The supplied documents guide
# concepts and voice; classroom directions and grading rules are source content.
# References below use physical PDF pages of the supplied handout and named exams.
# Pedagogical arc: worked neighboring examples -> guided repair -> independent
# construction. Allocation questions explicitly use a source-constructor model;
# Boolean output checks do not claim to observe physical runtime allocations.
steps:
  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, physical pp. 129–140.
  # Assessment: [Final] F23 (Public).pdf, Problem 1(c), p. 5: construct ADT variants from their uses.
  # Transfer: original event rules; constructor-pattern equations use the lecture notation.
  # Pedagogy: PRIMM — Predict before Run, then Modify; variation across variants.
  - title: "Algebraic Variants"
    key: variants
    instructions: |
      ### Why this matters

      A number such as 7 cannot tell you whether it represents distance,
      damage, or healing. If that meaning lives only in comments or
      loosely coordinated flags, the wrong rule can be applied to a valid
      number. **Named variants carry the kind of event with its data** and
      give your functions explicit cases to handle. This way of modeling
      alternatives also applies to messages, success-or-error results,
      and the different forms of an expression in a compiler.

      ### 🎯 You will learn to

      - Apply constructors to distinguish variants of one type.
      - Analyze each variant with a constructor pattern.
      - Create a two-variant representation from a short specification.

      ### One type, several possibilities

      `data Event = Travel Integer | Fight Integer | Heal Integer` says that an `Event` is one of three alternatives. `Fight 7` is a value of type `Event`. `Fight` is its constructor, with type `Integer -> Event`.

      A function can have one equation per constructor. In `eventDelta (Fight amount) = ...`, the pattern binds `amount` to the stored integer. Haskell uses the first equation whose pattern matches. Each equation returns the same result type. These patterns work just like the list patterns from Foundations, with names chosen for our domain.

      The supplied `deriving Show` lets `print` display event values, as in the lecture. Constructors themselves supply no event behavior. Constructors begin with an uppercase letter; ordinary bindings begin with a lowercase letter.

      ### Thinking time!

      Look at the starter before running it. Will its tuple contain `(2,-7,3)`, `(10,7,3)`, or a type error? Does naming a constructor `Fight` automatically subtract anything?

      Commit to a prediction, then use **Run**. Explain which expression in each branch determines the result.

      <details markdown="1">
      <summary>Check the constructor and result reasoning</summary>

      The starter prints `(10,7,3)`. Each pattern extracts one integer, and each body returns that integer unchanged. `Fight` constructs an event; it does not decide how health changes.

      | Expression | Type | Role |
      | --- | --- | --- |
      | `Fight` | `Integer -> Event` | Constructor awaiting a payload |
      | `Fight 7` | `Event` | One constructed event |
      | `eventDelta (Fight 7)` | `Integer` | Result of interpreting that event |

      </details>

      A pattern can also select a particular payload. Before reading the check, predict both calls to this neighboring function:

      ```haskell
      describeEvent (Heal _) = "restoration"
      describeEvent (Heal 0) = "zero restoration"
      describeEvent _ = "another event"
      -- describeEvent (Heal 0)
      -- describeEvent (Fight 0)
      ```

      <details markdown="1">
      <summary>Check which pattern matches first</summary>

      The calls return `"restoration"` and `"another event"`. `(Heal _)` already matches every Heal payload, so the later `(Heal 0)` equation is never selected. It does not match `Fight 0`: the constructor matters as well as the payload. The final `_` covers the remaining events. Move the specific Heal equation before the general one, then predict again.

      </details>

      ### Your turn

      Repair `eventDelta` so it returns the change in health for one event:

      - `Travel distance` restores one point per four whole distance units: use integer division, rounding down.
      - `Fight damage` loses `damage` points, so the change is negative.
      - `Heal amount` restores `amount` points.

      All event numbers are nonnegative integers. This function reports a change; it does not yet impose a health cap or process a sequence. Change the sample to include a travel distance below four and predict that result before running again.

      ### A model of your own

      Take about five minutes to model a checkpoint. A checkpoint is **either blocked with a reason or open with a distance**, never both at once. A reason is a `String`; a distance is a nonnegative `Integer`.

      1. Declare a type named `Checkpoint`. Choose your own constructor names and the field each alternative needs.
      2. Write `checkpointMessage`, its type signature, and one equation for each alternative. A blocked checkpoint returns `"Blocked: "` followed by its reason; an open checkpoint returns `"Open: "` followed by its distance as text. Use `show` to turn the distance into a string and `++` to join strings.
      3. Add your declarations above `main` in the editor. Keep the event sample, change `main` to a `do` block, and add indented `print` calls for your own checkpoint values. Predict each message before using **Run**.

      Try a blocked checkpoint with reason `"flooded bridge"`, one with an empty reason, and open checkpoints at distances 0 and 9. Their messages should be `"Blocked: flooded bridge"`, `"Blocked: "`, `"Open: 0"`, and `"Open: 9"`.

      **Manual check:** the automatic checks assess `eventDelta`, not your chosen representation or checkpoint equations. Check both alternatives and explain why one Checkpoint value cannot select both constructors. Which pattern binds the reason, and which binds the distance? Your constructor names may differ from an instructor's model; the alternatives, payload types, and messages determine correctness.
    files:
      - path: "Main.hs"
        language: haskell
        reseed: true
        content: |
          module Main where

          data Event = Travel Integer | Fight Integer | Heal Integer
            deriving Show

          eventDelta :: Event -> Integer
          eventDelta (Travel distance) = distance
          eventDelta (Fight damage) = damage
          eventDelta (Heal amount) = amount

          main :: IO ()
          main = print (eventDelta (Travel 10), eventDelta (Fight 7), eventDelta (Heal 3))
    open_file: "Main.hs"
    run_file: "Main.hs"
    tests:
      - description: "Travel behavior at distance boundaries"
        command: 'map (\distance -> eventDelta (Travel distance)) [0, 3, 4, 5, 11] == [0, 0, 1, 1, 2] && eventDelta (Travel 100000000000000000004) == 25000000000000000001'
        hints:
          - text: "Start with the Travel branch. What does its bound number measure, and what is eventDelta supposed to report?"
            condition: "code_matches: /(?:(?:^|\\n)eventDelta\\s+\\(*\\s*Travel\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*\\)*\\s*=\\s*\\(*\\s*\\1\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)eventDelta\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b))/"
          - text: "Compare distances 3, 4, and 5 by hand. Which changes represent a new complete group, and which change only the leftover distance?"
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)eventDelta\\s+\\(*\\s*Travel\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*\\)*\\s*=\\s*\\(*\\s*\\1\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)eventDelta\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?=[\\s\\S]*(?:^|\\n)eventDelta\\b(?![ \\t]*::)[^\\n=]*\\bTravel\\b[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\b(?:div|quot|floor|truncate)\\b)[\\s\\S]*$/"
          - text: "Compare `div 11 3` with `div 3 11` in the interpreter. Identify which argument is the total and which is the group size. Then choose the operands suited to the Travel contract."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)eventDelta\\s+\\(*\\s*Travel\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*\\)*\\s*=\\s*\\(*\\s*\\1\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)eventDelta\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?![\\s\\S]*(?:^|\\n)eventDelta\\b(?![ \\t]*::)[^\\n=]*\\bTravel\\b[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\b(?:div|quot|floor|truncate)\\b)[\\s\\S]*$/"
      - description: "Fight and Heal event interpretation"
        command: 'map eventDelta [Fight 0, Fight 1, Fight 9, Heal 0, Heal 7] == [0, -1, -9, 0, 7] && eventDelta (Fight 100000000000000000001) == (-100000000000000000001) && eventDelta (Heal 101) == 101'
        hints:
          - text: "Inspect the Fight and Heal bodies separately. Returning their payloads unchanged treats two different kinds of event the same way."
            condition: "code_matches: /(?:(?:^|\\n)eventDelta\\s+\\(*\\s*Fight\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*\\)*\\s*=\\s*\\(*\\s*\\1\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)eventDelta\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b))/"
          - text: "Imagine starting with 70 health. For Fight 6 and Heal 6, record the health afterward and the direction of each change before editing either branch."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)eventDelta\\s+\\(*\\s*Fight\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*\\)*\\s*=\\s*\\(*\\s*\\1\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)eventDelta\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?=[\\s\\S]*(?:^|\\n)eventDelta\\b(?![ \\t]*::)[^\\n=]*\\bFight\\b[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?(?:-[ \\t]*damage|\\bnegate\\b|damage[ \\t]*[+*-]))[\\s\\S]*$/"
          - text: "Make a small table with columns for constructor, payload, and signed change. Include zero and two positive payloads for each constructor; use the pattern in your entries to derive each branch's expression."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)eventDelta\\s+\\(*\\s*Fight\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*\\)*\\s*=\\s*\\(*\\s*\\1\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)eventDelta\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?![\\s\\S]*(?:^|\\n)eventDelta\\b(?![ \\t]*::)[^\\n=]*\\bFight\\b[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?(?:-[ \\t]*damage|\\bnegate\\b|damage[ \\t]*[+*-]))[\\s\\S]*$/"
    quiz:
      title: Step 1 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
      - type: single
        bloom: apply
        difficulty: intermediate
        question: Using the repaired event rules, predict `map eventDelta [Travel 7, Fight 5, Heal 2]`. What list
          results? Give a brief reason before selecting, then compare it with the feedback.
        options:
        - '`[7,-5,2]`'
        - '`[1,5,2]`'
        - '`[1,-5,2]`'
        - '`[2,-5,2]`'
        correct_index: 2
        option_feedback:
          0: Travel converts distance into whole groups of four; it does not restore one point per distance unit.
          1: The Fight branch reports a negative change. The constructor supplies the payload, while the branch
            supplies the sign.
          3: Integer division discards the incomplete group. Seven distance units contain one complete group of
            four.
        explanation: 'Each event produces one list element: Travel 7 restores 1, Fight 5 loses 5, and Heal 2 restores
          2. The result is `[1,-5,2]`.'
      - type: multiple
        bloom: analyze
        difficulty: intermediate
        question: 'Two functions handle the same event: `healthChange (Fight n) = 0 - n` and `fightScore (Fight
          n) = n`. Which statements correctly separate the event data from its interpretations?'
        options:
        - '`Fight 6` has type `Event` in either function call.'
        - '`Fight 6` stores a negative payload before either call.'
        - The two calls can return different numbers for `Fight 6`.
        - '`healthChange` changes the payload later read by `fightScore`.'
        correct_indices:
        - 0
        - 2
        option_feedback:
          0: Applying Fight to 6 constructs an Event. The function that later consumes it does not change that
            type.
          1: The stored payload is 6. Subtraction occurs in the healthChange equation, not in the constructor.
          2: 'The branch bodies use the same payload differently: one returns -6 and the other returns 6.'
          3: Both functions read an immutable value. Returning a health change cannot rewrite the input event.
        explanation: A constructor records which variant is present and its payload. Separate functions may assign
          different meanings to that same data without modifying it.
      - type: single
        bloom: evaluate
        difficulty: advanced
        question: A download result is either a failure with a reason or a success with a byte count. The design
          must attach only the relevant payload to each alternative. Which representation best meets that criterion?
        options:
        - '`data Download = Download Bool String Integer`'
        - '`data Download = Failed String | Finished Integer`'
        - '`data Download = Failed String Integer | Finished String Integer`'
        correct_index: 1
        option_feedback:
          0: A flag and both payloads permit combinations such as a success carrying a failure reason. Callers
            must maintain a relationship the type could express directly.
          2: Both alternatives still require both payloads. Naming the cases alone does not remove the irrelevant
            fields.
        explanation: Separate constructors pair each case with its own payload. Functions can handle a failure
          reason or a success count by matching the relevant constructor, as in the checkpoint exercise.
    solution:
      files:
        - path: "Main.hs"
          language: haskell
          content: |
            module Main where

            data Event = Travel Integer | Fight Integer | Heal Integer
              deriving Show

            eventDelta :: Event -> Integer
            eventDelta (Travel distance) = distance `div` 4
            eventDelta (Fight damage) = 0 - damage
            eventDelta (Heal amount) = amount

            main :: IO ()
            main = print (eventDelta (Travel 10), eventDelta (Fight 7), eventDelta (Heal 3))
      explanation: |
        The constructor selects the equation and the pattern gives that rule access to its input. Every equation produces an Integer. The sample now prints `(2,-7,3)`. Constructor names distinguish the alternatives; the equation bodies define their behavior.

        One model for the manually checked checkpoint task is:

        ```haskell
        data Checkpoint = Blocked String | Open Integer

        checkpointMessage :: Checkpoint -> String
        checkpointMessage (Blocked reason) = "Blocked: " ++ reason
        checkpointMessage (Open distance) = "Open: " ++ show distance
        ```

        Each value selects one alternative. `Blocked "flooded bridge"` stores a String reason; `Open 9` stores an Integer distance. The two patterns cover every constructor and bind the field appropriate to that alternative. The equations interpret those fields as messages. Different constructor names with the same alternatives and behavior are equally valid.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, physical pp. 129–138, 143–144.
  # Assessment: [Midterm] F24 V1 (Public).pdf, Problem 2, pp. 3–4: named fields and constructor patterns.
  # Transfer: rebuilding a Hero applies lecture construction and immutability, with supplied health rules.
  # Pedagogy: worked neighboring example, PRIMM — Predict, Modify, Investigate.
  - title: "Records and New Values"
    key: records
    instructions: |
      ### Why this matters

      Changing a shared object can accidentally change what another part
      of a program sees, making a bug depend on who updated it first.
      **Producing a new record keeps the previous value available** and
      makes the intended change something you can compare and test.
      Named fields also make it clear which information belongs to the
      value. Reconstructing a hero while preserving unaffected fields
      practices the update discipline needed for snapshots and reliable
      state transitions.

      ### 🎯 You will learn to

      - Apply constructor patterns and record construction.
      - Analyze which fields a transformation should preserve.

      ### Named fields

      The declaration `data Hero = Hero {heroName :: String, hitPoints :: Integer}` names the constructor and its fields. Both `Hero "Fern" 70` and `Hero {heroName = "Fern", hitPoints = 70}` construct the same value. The supplied sample uses `healthOf h` to read a hero's health; the supplied `healthOf` helper extracts this field with a constructor pattern.

      The supplied `renameHero` is a worked example. Its pattern `(Hero oldName hp)` extracts the two fields. Its result `Hero newName hp` constructs a hero with the new name and the original health. The original record stays unchanged. Reconstructing a value requires preserving each field that should stay the same.

      ### Thinking time!

      The starter attempts to heal Fern by 15 points. Will it print health values `(85,70)`, `(15,70)`, or `(15,15)`? Read the constructor expression, commit to an answer, then run it.

      ### Your turn

      Repair `healHero amount hero` to add the healing amount to the existing health, stopping at 100. Use the supplied constructor pattern to access the fields and return a new Hero. Preserve the name. The original hero must still represent its original values.

      You can express the cap with a guard or with `min x y`, which returns the smaller of two ordered values.

      Assume the original health is between 0 and 100, inclusive, and the amount is nonnegative. Try an ordinary heal, an amount that reaches exactly 100, and an amount that would exceed 100. Explain why using the same hero as the input twice does not apply two cumulative heals.
    files:
      - path: "Main.hs"
        language: haskell
        reseed: true
        content: |
          module Main where

          data Hero = Hero {heroName :: String, hitPoints :: Integer}
            deriving (Eq, Show)

          healthOf :: Hero -> Integer
          healthOf (Hero _ hp) = hp

          renameHero :: String -> Hero -> Hero
          renameHero newName (Hero oldName hp) = Hero newName hp

          healHero :: Integer -> Hero -> Hero
          healHero amount (Hero name hp) = Hero name amount

          main :: IO ()
          main = let before = Hero "Fern" 70
                     after = healHero 15 before
                 in print (healthOf after, healthOf before)
    open_file: "Main.hs"
    run_file: "Main.hs"
    tests:
      - description: "Record contents before and after an ordinary heal"
        command: 'let {observe (Hero name hp) = (name, hp)} in let original = Hero "Fern" 70 in observe (healHero 15 original) == ("Fern", 85) && observe original == ("Fern", 70) && observe (healHero 0 (Hero "Stark" 12)) == ("Stark", 12) && observe (healHero 1 (Hero "" 0)) == ("", 1)'
        hints:
          - text: "Compare the starter's replacement record with the supplied renameHero example. Which old fields does each result still use?"
            condition: "code_matches: /(?:(?:^|\\n)healHero\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*Hero\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*\\)*\\s*=\\s*\\(*\\s*\\(*\\s*Hero\\s*\\)*\\s*\\(*\\s*\\2\\s*\\)*\\s*\\(*\\s*\\1\\s*\\)*\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)healHero\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b))/"
          - text: "Try healing by zero. If health changes, locate the result field whose expression has lost information from the original hero."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)healHero\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*Hero\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*\\)*\\s*=\\s*\\(*\\s*\\(*\\s*Hero\\s*\\)*\\s*\\(*\\s*\\2\\s*\\)*\\s*\\(*\\s*\\1\\s*\\)*\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)healHero\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?=[\\s\\S]*(?:^|\\n)healHero\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\bHero\\b)[\\s\\S]*$/"
          - text: "For an uncapped heal, fill `old name | old health | amount | new name | new health` using two heroes with different starting health but the same amount. Which inputs must influence each result field?"
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)healHero\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*Hero\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*\\)*\\s*=\\s*\\(*\\s*\\(*\\s*Hero\\s*\\)*\\s*\\(*\\s*\\2\\s*\\)*\\s*\\(*\\s*\\1\\s*\\)*\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)healHero\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?![\\s\\S]*(?:^|\\n)healHero\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\bHero\\b)[\\s\\S]*$/"
      - description: "Healing at the upper health boundary"
        command: 'let {observe (Hero name hp) = (name, hp)} in map (\amount -> snd (observe (healHero amount (Hero "Mage" 90)))) [9, 10, 11] == [99, 100, 100] && observe (healHero 5 (Hero "Full" 100)) == ("Full", 100) && observe (healHero 100000000000000000001 (Hero "New" 0)) == ("New", 100) && observe (healHero 0 (Hero "Empty" 0)) == ("Empty", 0)'
        hints:
          - text: "First check an ordinary heal; then compare results near the maximum. Which part of the contract is the replacement record missing?"
            condition: "code_matches: /(?:(?:^|\\n)healHero\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*Hero\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*\\)*\\s*=\\s*\\(*\\s*\\(*\\s*Hero\\s*\\)*\\s*\\(*\\s*\\2\\s*\\)*\\s*\\(*\\s*\\1\\s*\\)*\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)healHero\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b))/"
          - text: "Use one hero at 90 health and try amounts 9, 10, and 11. Predict all three outputs from the contract, then identify the first case where your current expression disagrees."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)healHero\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*Hero\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*\\)*\\s*=\\s*\\(*\\s*\\(*\\s*Hero\\s*\\)*\\s*\\(*\\s*\\2\\s*\\)*\\s*\\(*\\s*\\1\\s*\\)*\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)healHero\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?=[\\s\\S]*(?:^|\\n)healHero\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\+)[\\s\\S]*$/"
          - text: "Write a two-row decision table: proposed health within the permitted range, proposed health beyond it. Fill the required result in each row, then express that decision with a guard or a suitable Prelude operation."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)healHero\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*Hero\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*\\)*\\s*=\\s*\\(*\\s*\\(*\\s*Hero\\s*\\)*\\s*\\(*\\s*\\2\\s*\\)*\\s*\\(*\\s*\\1\\s*\\)*\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)healHero\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?![\\s\\S]*(?:^|\\n)healHero\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\+)[\\s\\S]*$/"
    quiz:
      title: Step 2 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
      - type: single
        bloom: apply
        difficulty: intermediate
        question: With the repaired `healHero`, let `h = Hero "Lark" 60`, `a = healHero 30 h`, and `b = healHero
          30 h`. What is `(healthOf a, healthOf b, healthOf h)`? Give a brief reason before selecting, then compare
          it with the feedback.
        options:
        - '`(90,100,100)`'
        - '`(90,100,60)`'
        - '`(30,30,60)`'
        - '`(90,90,60)`'
        correct_index: 3
        option_feedback:
          0: Neither call modifies h. Both receive the original 60-point record, which remains available afterward.
          1: The second call receives h, not a. A cumulative second heal would need the newer record as its explicit
            argument.
          2: The amount is added to the existing health before applying the cap; it does not replace the health
            field.
        explanation: Both calls independently produce a 90-point hero from the same 60-point input. Explicitly
          passing a newer value is how a pure program carries a change forward.
      - type: single
        bloom: analyze
        difficulty: advanced
        question: One faulty healer replaces health with `min 100 amount`; another adds the amount but omits the
          cap. Which single expected-result check distinguishes the correct healer from both faults?
        options:
        - Healing 20 points from 0 gives 20.
        - Healing 20 points from 90 gives 100.
        - Healing 0 points from 0 gives 0.
        - Healing 10 points from 40 gives 50.
        correct_index: 1
        option_feedback:
          0: Starting from zero hides the difference between adding and replacing. The uncapped result also stays
            below 100.
          2: Both faulty versions return zero here. A boundary value is useful only if it makes the behaviors differ.
          3: This catches replacement, which returns 10, but the uncapped addition also returns 50.
        explanation: From 90 with an amount of 20, capped addition returns 100, replacement returns 20, and uncapped
          addition returns 110. This distinguishes the arithmetic faults; separate checks are still needed for
          preserving the name and original record.
    solution:
      files:
        - path: "Main.hs"
          language: haskell
          content: |
            module Main where

            data Hero = Hero {heroName :: String, hitPoints :: Integer}
              deriving (Eq, Show)

            healthOf :: Hero -> Integer
            healthOf (Hero _ hp) = hp

            renameHero :: String -> Hero -> Hero
            renameHero newName (Hero oldName hp) = Hero newName hp

            healHero :: Integer -> Hero -> Hero
            healHero amount (Hero name hp) = Hero name (min 100 (hp + amount))

            main :: IO ()
            main = let before = Hero "Fern" 70
                       after = healHero 15 before
                   in print (healthOf after, healthOf before)
      explanation: |
        The constructor pattern extracts the original name and health. The result uses that name and a bounded new health value. The sample prints `(85,70)`: returning a new Hero does not modify the original one.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, physical pp. 34–35, 73–75, 87–89.
  # Assessment: CS131 Fall 25 Quiz 1 v1.docx, Problem 3(a,c): type relationships and generic signatures.
  # Pedagogy: PRIMM and variation theory — vary the argument type, preserve inclusive range filtering.
  - title: "Generic Functions and Constraints"
    key: generic-functions
    instructions: |
      ### Why this matters

      Copying a range-selection function for scores, names, and dates
      creates several implementations to maintain when the rule changes.
      **A generic function shares the algorithm; a constraint states what
      its inputs must support**, such as comparison. Learning to distinguish
      that requirement from a particular input type helps you design
      reusable libraries and read their interfaces. It also explains why
      a helper that only rearranges values needs fewer assumptions than
      one that orders them.

      ### 🎯 You will learn to

      - Analyze the relationship between input and output type variables.
      - Apply an `Ord` constraint when a generic function compares values.

      ### One rule, several types

      `withinBand :: Ord a => (a, a) -> [a] -> [a]` accepts a pair of bounds and a list of values. Both bounds and every list element have the same type; the returned list keeps that element type. `Ord a =>` requires that the values support ordering. It does not convert values to a common type.

      The pattern `(low, high)` extracts the two bounds. Comparing each element with those bounds requires `Ord`. In contrast, merely copying list values needs no ordering constraint. Division uses `Fractional`; constraints reflect the operations in a function.

      Haskell orders strings lexicographically, comparing characters from the start. For example, `"z" > "alpha"` is true despite `"z"` being shorter.

      Type-variable names express relationships **within a signature**. Consider two separate declarations:

      ```haskell
      duplicate :: a -> (a, a)
      duplicate x = (x, x)

      box :: a -> [a]
      box x = [x]
      ```

      Predict whether `(duplicate 'x', box True)` has a type error because both signatures use `a`. Explain your choice before opening the check.

      <details markdown="1">
      <summary>Check what the repeated type name relates</summary>

      The expression is valid and produces `(('x','x'),[True])`. In this use of `duplicate`, `a` is `Char`; in this use of `box`, its independently declared `a` is `Bool`. Renaming box's type variable to `b` changes no relationship. Within `duplicate`'s signature, however, all three occurrences must agree: the input and both output fields share one type.

      </details>

      ### Thinking time!

      The starter checks only the lower bound. Predict which out-of-range values it incorrectly keeps in each sample. Run, then explain why preserving input order does not by itself implement the requested selection.

      ### Your turn

      Repair `withinBand bounds values` to keep exactly the values between the two bounds, including both endpoints. Preserve the original order and repeated values. An empty list produces an empty list. Assume the lower bound is no greater than the upper bound. Keep the generic signature so the same function handles integers and strings.

      Repair the predicate supplied to `filter`, or use equivalent list recursion. Try values below, exactly on, between, and above the bounds. Explain why specializing the signature to `(Integer, Integer) -> [Integer] -> [Integer]` would exclude the names example.
    files:
      - path: "Main.hs"
        language: haskell
        reseed: true
        content: |
          module Main where

          withinBand :: Ord a => (a, a) -> [a] -> [a]
          withinBand (low, high) values = filter (\value -> value >= low) values

          main :: IO ()
          main = do
            print (withinBand (2, 6) [7, 2, 5, 1, 6, 5] :: [Integer])
            print (withinBand ("G", "M") ["Z", "G", "J", "A", "M"])
    open_file: "Main.hs"
    run_file: "Main.hs"
    tests:
      - description: "Range selection across numeric boundaries"
        command: 'withinBand (2, 6) [7, 2, 5, 1, 6, 5] == [2, 5, 6, 5] && withinBand (-3, 0) [-4, -3, -1, 0, 1] == [-3, -1, 0] && withinBand (4, 4) [3, 4, 5, 4] == [4, 4] && withinBand (0, 1) [] == [] && withinBand (0.5 :: Double, 1.5) [2, 0.5, 1, 1.5, 0] == [0.5, 1, 1.5]'
        hints:
          - text: "The starter already selects some values. Compare its retained values with the full range contract to identify the missing decision."
            condition: "code_matches: /(?:(?:^|\\n)withinBand\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*,\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*\\(*\\s*filter\\s*\\)*\\s*\\(*\\s*\\\\\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*->\\s*\\(*\\s*\\4\\s*\\)*\\s*>=\\s*\\(*\\s*\\1\\s*\\)*\\s*\\)*\\s*\\(*\\s*\\3\\s*\\)*\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)withinBand\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b))/"
          - text: "For bounds 2 and 6, classify values 1, 2, 4, 6, and 7 as keep or discard. Pay special attention to the endpoints and the value above the range."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)withinBand\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*,\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*\\(*\\s*filter\\s*\\)*\\s*\\(*\\s*\\\\\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*->\\s*\\(*\\s*\\4\\s*\\)*\\s*>=\\s*\\(*\\s*\\1\\s*\\)*\\s*\\)*\\s*\\(*\\s*\\3\\s*\\)*\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)withinBand\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?=[\\s\\S]*(?:^|\\n)withinBand\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\bhigh\\b)[\\s\\S]*$/"
          - text: "For each of those values, make separate columns for its relation to the lower bound, its relation to the upper bound, and the required keep/discard decision. Derive a predicate that matches the last column; do not change the list's order to repair selection."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)withinBand\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*,\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*\\(*\\s*filter\\s*\\)*\\s*\\(*\\s*\\\\\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*->\\s*\\(*\\s*\\4\\s*\\)*\\s*>=\\s*\\(*\\s*\\1\\s*\\)*\\s*\\)*\\s*\\(*\\s*\\3\\s*\\)*\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)withinBand\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?![\\s\\S]*(?:^|\\n)withinBand\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\bhigh\\b)[\\s\\S]*$/"
      - description: "Range selection across nonnumeric inputs"
        command: 'withinBand ("G", "M") ["Z", "G", "J", "A", "M", "J"] == ["G", "J", "M", "J"] && withinBand ("", "B") ["C", "", "A", "B"] == ["", "A", "B"] && withinBand (''b'', ''d'') "edbcba" == "dbcb" && withinBand (False, True) [True, False, True] == [True, False, True]'
        hints:
          - text: "This check uses ordering beyond numbers. Compare the starter predicate with the range contract before trying a numeric-only repair."
            condition: "code_matches: /(?:(?:^|\\n)withinBand\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*,\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*\\(*\\s*filter\\s*\\)*\\s*\\(*\\s*\\\\\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*->\\s*\\(*\\s*\\4\\s*\\)*\\s*>=\\s*\\(*\\s*\\1\\s*\\)*\\s*\\)*\\s*\\(*\\s*\\3\\s*\\)*\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)withinBand\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b))/"
          - text: "Compare `\"z\" > \"alpha\"` with `length \"z\" > length \"alpha\"`. Which comparison matches the ordering described in the lesson?"
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)withinBand\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*,\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*\\(*\\s*filter\\s*\\)*\\s*\\(*\\s*\\\\\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*->\\s*\\(*\\s*\\4\\s*\\)*\\s*>=\\s*\\(*\\s*\\1\\s*\\)*\\s*\\)*\\s*\\(*\\s*\\3\\s*\\)*\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)withinBand\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?=[\\s\\S]*(?:^|\\n)withinBand\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\b(?:length|sort|nub|fromIntegral)\\b)[\\s\\S]*$/"
          - text: "Use bounds `\"\"` and `\"B\"` with `[\"C\",\"\",\"A\",\"B\",\"A\"]`. Mark each original position keep or discard before running. Diagnose missing, reordered, or collapsed entries separately from wrong comparisons."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)withinBand\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*,\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*\\(*\\s*filter\\s*\\)*\\s*\\(*\\s*\\\\\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*->\\s*\\(*\\s*\\4\\s*\\)*\\s*>=\\s*\\(*\\s*\\1\\s*\\)*\\s*\\)*\\s*\\(*\\s*\\3\\s*\\)*\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)withinBand\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?![\\s\\S]*(?:^|\\n)withinBand\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\b(?:length|sort|nub|fromIntegral)\\b)[\\s\\S]*$/"
    quiz:
      title: Step 3 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
      - type: single
        bloom: apply
        difficulty: intermediate
        question: For `rate (before, after) elapsed = (after - before) / elapsed`, which signature preserves the
          generic numeric type? Give a brief reason before selecting, then compare it with the feedback.
        options:
        - '`Ord a => (a, a) -> a -> a`'
        - '`Fractional a => a -> (a, a) -> a`'
        - '`Fractional a => (a, a) -> a -> Bool`'
        - '`Fractional a => (a, a) -> a -> a`'
        correct_index: 3
        option_feedback:
          0: Ordering permits comparisons; it does not supply fractional division.
          1: The first argument is the before/after tuple; the second is the elapsed amount. This signature reverses
            those argument shapes.
          2: Division produces a numeric rate, not a Boolean result.
        explanation: The first argument is a pair and the second is one value. Subtraction and division relate
          their numeric types to the result, and division requires Fractional.
      - type: multiple
        bloom: analyze
        difficulty: advanced
        question: Consider `withinBand (2,4) [4,1,2,4,5]`, whose required result is `[4,2,4]`. Which faulty implementations
          would this check expose?
        options:
        - Checking only the lower bound.
        - Excluding values equal to either bound.
        - Reversing the list after correct filtering.
        - Removing repeated values after correct filtering.
        correct_indices:
        - 0
        - 1
        - 3
        option_feedback:
          0: The value 5 is above the upper bound. A lower-bound-only filter wrongly retains it.
          1: Both 2 and 4 are endpoints, and the contract includes them. Strict comparisons would wrongly remove
            them.
          2: 'The required list is a palindrome: reversing [4,2,4] gives the same list. A second case with an asymmetric
            result is needed to expose reversal.'
          3: The two occurrences of 4 must both remain. Removing duplicates changes the required result.
        explanation: A test distinguishes implementations only when their observed results differ. This case checks
          both endpoints, the upper-bound rejection, and multiplicity, but it cannot establish order preservation
          on its own.
      - type: single
        bloom: evaluate
        difficulty: advanced
        question: A library must keep `withinBand` usable for both numbers and strings, using their ordering and
          only the constraints needed by the filtering body. Which interface choice meets these criteria?
        options:
        - Keep `Ord a => (a, a) -> [a] -> [a]`.
        - Specialize to `(Integer, Integer) -> [Integer] -> [Integer]`.
        - Use `(a, a) -> [a] -> [a]` with no constraint.
        - Require `(Ord a, Show a) => (a, a) -> [a] -> [a]`.
        correct_index: 0
        option_feedback:
          1: Specialization excludes the string client, even though the algorithm can use string ordering.
          2: The predicate compares each value with the bounds. Merely passing it to filter does not remove that
            ordering requirement.
          3: The body does not print values. Requiring Show would restrict callers for an operation performed elsewhere.
        explanation: Ord supplies the comparisons while the repeated a keeps bounds, inputs, and outputs at one
          type per call. Separate calls may choose different ordered types; printing the result is a separate concern.
    solution:
      files:
        - path: "Main.hs"
          language: haskell
          content: |
            module Main where

            withinBand :: Ord a => (a, a) -> [a] -> [a]
            withinBand (low, high) values =
              filter (\value -> value >= low && value <= high) values

            main :: IO ()
            main = do
              print (withinBand (2, 6) [7, 2, 5, 1, 6, 5] :: [Integer])
              print (withinBand ("G", "M") ["Z", "G", "J", "A", "M"])
      explanation: |
        The tuple pattern names both bounds. The predicate requires both inclusive comparisons, and filter retains each successful original value in order. The samples print `[2,5,6,5]` and `["G","J","M"]`. The same comparison rule works across the two element types.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, physical pp. 141–142.
  # Assessment: [Midterm] F23 (Public).pdf, Problem 2(a,b), pp. 4–5: construct and transform a custom list.
  # Transfer: conversion is preparation for the exam's more demanding duplicate-removal task.
  # Pedagogy: worked example with fading — reverse the direction of a supplied conversion.
  - title: "Recursive Data Types"
    key: recursive-data
    instructions: |
      ### Why this matters

      A route can contain more stops than a record with one field per stop
      can accommodate. **A recursive type describes a
      structure of arbitrary finite size** using a small set of cases.
      Those same cases guide the functions that construct and consume it.
      Building a trail from an ordinary list shows how to design your own
      representation and preserve information when converting between the
      forms different parts of a system need.

      ### 🎯 You will learn to

      - Apply base and recursive cases to a user-defined list.
      - Create a conversion that preserves stop names and order.

      ### A trail inside a trail

      `data Trail = End | Stop String Trail` has a nonrecursive base constructor and a recursive constructor. `Stop "Gate" (Stop "Lake" End)` is a `Trail` with two named stops.

      Read the supplied `toList` as a worked example. `End` becomes the empty built-in list. A `Stop` contributes its value and recursively converts the rest. Its pattern has exactly the fields declared by the constructor.

      ### Thinking time!

      Predict `toList (Stop "Gate" (Stop "Lake" End))`. Then predict the starter's round trip `toList (fromList ["Gate","Lake"])`. Will the two results agree? Run and explain the difference.

      ### Your turn

      Implement `fromList :: [String] -> Trail`. It must produce one stop for each input value in the original order and finish with `End`. An empty input produces `End`.

      Keep `toList` as the supplied observation function. The exercise is to derive the conversion in the other direction. Test both one-stop and longer trails, and write down how the empty-list pattern corresponds to a constructor with no remaining stops.
    files:
      - path: "Main.hs"
        language: haskell
        reseed: true
        content: |
          module Main where

          data Trail = End | Stop String Trail deriving (Eq, Show)

          toList :: Trail -> [String]
          toList End = []
          toList (Stop x rest) = x : toList rest

          fromList :: [String] -> Trail
          fromList xs = End

          main :: IO ()
          main = do
            print (toList (Stop "Gate" (Stop "Lake" End)))
            print (toList (fromList ["Gate", "Lake"]))
    open_file: "Main.hs"
    run_file: "Main.hs"
    tests:
      - description: "List-to-trail conversion across input sizes"
        command: 'let {names End = []; names (Stop name rest) = name : names rest} in names (fromList []) == [] && names (fromList ["Gate"]) == ["Gate"] && names (fromList ["Lake", "Lake", "Hill"]) == ["Lake", "Lake", "Hill"]'
        hints:
          - text: "The starter always returns the same trail. Compare empty, one-stop, and two-stop inputs to see which distinctions it currently ignores."
            condition: "code_matches: /(?:(?:^|\\n)fromList\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*End\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)fromList\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b))/"
          - text: "Read the fields of Stop and the input pattern `(x:xs)`. Identify the field each input piece could supply; one piece is already a name, while the other still has the wrong representation."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)fromList\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*End\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)fromList\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?=[\\s\\S]*(?:^|\\n)fromList\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\bStop\\b)[\\s\\S]*$/"
          - text: "Draw the expected constructors for a two-name input without writing equations. Beside each constructor, record which input remains at that point. Use that trace to choose a smaller conversion problem and the value needed when no input remains."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)fromList\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*End\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)fromList\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?![\\s\\S]*(?:^|\\n)fromList\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\bStop\\b)[\\s\\S]*$/"
      - description: "Trail payloads, repetition, and order"
        command: 'let {names End = []; names (Stop name rest) = name : names rest} in names (fromList ["Gate", "Lake", "Gate"]) == ["Gate", "Lake", "Gate"] && names (fromList ["", "North", " ", "South", ""]) == ["", "North", " ", "South", ""] && names (fromList (map show [1..12 :: Int])) == map show [1..12 :: Int]'
        hints:
