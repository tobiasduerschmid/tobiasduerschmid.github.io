          0: journey returns 40 because travel in defensive mode restores nothing. The shortcut adds one travel
            point and returns 41.
          1: journey stops at death and returns -1. The shortcut includes the later healing and returns 20.
          2: journey caps the initial heal at 100, then returns 90 after the fight. The shortcut postpones the
            cap and returns 100.
          3: Both calculations return 84. No defensive-mode, death, or intermediate-cap rule changes this sequence.
        explanation: A sum treats each event as an independent change. The required simulator carries state between
          events, applies caps at each transition, and stops when the terminal condition occurs.
      - type: single
        bloom: evaluate
        difficulty: advanced
        question: A review has time for two checks and wants to expose both a wrong 40-point mode boundary and
          healing after death. Which expected-result pair best targets those requirements?
        options:
        - '`journey [Fight 60, Fight 3] == 39`; `journey [Fight 100, Heal 10] == -1`'
        - '`journey [Fight 59, Fight 3] == 38`; `journey [Fight 90, Heal 10] == 20`'
        - '`journey [Fight 60, Heal 3] == 43`; `journey [Fight 99, Heal 10] == 11`'
        correct_index: 0
        option_feedback:
          1: The fight begins at 41, so this pair does not test the equality boundary. The healing case begins
            above zero and cannot detect revival after death.
          2: Healing behaves the same in both modes, so healing from 40 cannot distinguish the mode boundary. Healing
            from one remaining point is permitted, not revival.
        explanation: A fight starting at exactly 40 distinguishes `<= 40` from `< 40`, and healing after health
          reaches zero tests immediate termination. These targeted cases supplement the other boundary and ordinary-case
          checks; two passing examples are not a proof of the full contract.
    solution:
      files:
        - path: "Main.hs"
          language: haskell
          content: |
            module Main where

            data Event = Travel Integer | Fight Integer | Heal Integer
              deriving Show

            journey :: [Event] -> Integer
            journey events = go 100 events
              where
                go hp [] = hp
                go hp (event:rest) =
                  let next = applyEvent hp event
                  in if next <= 0 then -1 else go next rest

                applyEvent hp (Travel distance)
                  | hp <= 40 = hp
                  | otherwise = min 100 (hp + distance `div` 4)
                applyEvent hp (Fight damage) =
                  hp - (if hp <= 40 then damage `div` 2 else damage)
                applyEvent hp (Heal amount) = min 100 (hp + amount)

            main :: IO ()
            main = print (journey [Fight 60, Travel 40, Heal 1, Fight 3])
      explanation: |
        The helper carries health explicitly. Each constructor describes one state transition; the recursive call passes the resulting state forward. The mode decision reads hp before the event, and the death check happens before any later event is considered. The sample trace is 100, 40, 40, 41, 38. A fold with an absorbing terminal state can also satisfy the value contract; a plain sum cannot represent its state-dependent effects.
