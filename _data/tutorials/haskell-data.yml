            condition: "code_matches: /(?:(?:^|\\n)fromList\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*End\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)fromList\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b))/"
          - text: "Try `[\"\",\"North\",\"North\",\"South\"]`. Track positions as well as names so a lost repetition or reversed pair is visible."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)fromList\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*End\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)fromList\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?=[\\s\\S]*(?:^|\\n)fromList\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\b(?:reverse|sort|nub|filter)\\b)[\\s\\S]*$/"
          - text: "Temporarily label the input positions 0 through 3 on paper. For each output Stop, write the source position of its payload. Find the first missing or out-of-order position and inspect the corresponding construction step."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)fromList\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*End\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)fromList\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?![\\s\\S]*(?:^|\\n)fromList\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\b(?:reverse|sort|nub|filter)\\b)[\\s\\S]*$/"
    quiz:
      title: Step 4 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
      - type: single
        bloom: apply
        difficulty: intermediate
        question: A trail must preserve an empty string as a stop name. Which value should `fromList ["Arch",""]`
          construct? Give a brief reason before selecting, then compare it with the feedback.
        options:
        - '`Stop "Arch" End`'
        - '`Stop "Arch" (Stop "" End)`'
        - '`Stop "" (Stop "Arch" End)`'
        - '`Stop "Arch" (Stop "" (Stop "" End))`'
        correct_index: 1
        option_feedback:
          0: An empty string is still an input element. Dropping it confuses an empty payload with the absence
            of a stop.
          2: Each input head precedes the converted tail. Reversing those positions violates the order requirement.
          3: End marks the absence of further stops; it does not contribute another empty-string stop.
        explanation: The input contains two strings, so the result contains two Stop constructors followed by End.
          The base case concerns the input list being empty, not an individual name being empty.
      - type: single
        bloom: analyze
        difficulty: intermediate
        question: Assume the supplied `toList` is correct. A faulty `fromList` might reverse the names or keep
          only the first name. Which round-trip check distinguishes the correct conversion from both faults?
        options:
        - '`toList (fromList []) == []`'
        - '`toList (fromList ["Arch"]) == ["Arch"]`'
        - '`toList (fromList ["Arch","Dock"]) == ["Arch","Dock"]`'
        - '`toList (fromList ["Arch","Arch"]) == ["Arch","Arch"]`'
        correct_index: 2
        option_feedback:
          0: Both faulty conversions can handle the empty case correctly. There is no order or remaining name to
            lose.
          1: Reversing one name leaves it unchanged, and keeping the first name also produces the whole input.
          3: This detects losing the second name, but reversal leaves two identical names in the same observable
            order.
        explanation: 'Two distinct names expose both ordering and loss: reversal produces ["Dock","Arch"], while
          keeping only the first produces ["Arch"]. Empty and singleton cases remain useful for checking the base
          and smallest recursive cases.'
    solution:
      files:
        - path: "Main.hs"
          language: haskell
          content: |
            module Main where

            data Trail = End | Stop String Trail deriving (Eq, Show)

            toList :: Trail -> [String]
            toList End = []
            toList (Stop x rest) = x : toList rest

            fromList :: [String] -> Trail
            fromList [] = End
            fromList (x:xs) = Stop x (fromList xs)

            main :: IO ()
            main = do
              print (toList (Stop "Gate" (Stop "Lake" End)))
              print (toList (fromList ["Gate", "Lake"]))
      explanation: |
        The input list and output trail have matching recursive structure. Their base cases represent the empty sequence, and their recursive cases pair a current value with the remaining sequence. Both sample lines now print `["Gate","Lake"]`.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, physical pp. 141–145.
  # Assessment: [Midterm] F23 (Public).pdf, Problem 2(b,c), pp. 4–5, and Problem 3(c), p. 7.
  # Transfer: custom-list reconstruction/cost plus indexed deletion; the exam uses different functions.
  # Pedagogy: PRIMM and spaced retrieval — persistence revisits records, types, recursion.
  - title: "Persistent Trail Updates"
    key: persistent-trails
    instructions: |
      ### Why this matters

      Undo and comparisons between alternative plans require earlier
      versions of data to remain usable after an edit. Copying the entire
      structure for every small change can be wasteful. **Persistent data
      structures preserve old versions while sharing unchanged parts**,
      which is safe because those parts cannot be mutated. Updating a
      trail lets you reason about exactly what needs reconstruction,
      connecting immutable programming to the time and space costs you
      study in data structures.

      ### 🎯 You will learn to

      - Create a recursive deletion that preserves the remaining order.
      - Evaluate which part of an immutable trail needs reconstruction.

      ### An update with a boundary

      Stops use zero-based indices. Removing index 1 from `["Gate","Lake","Tower"]` leaves `["Gate","Tower"]`. At the selected stop, its remaining trail is already the result we want. Before that stop, each retained stop needs a link to the updated remainder.

      Use this source-level model when reasoning about cost: count a new `Stop` for each retained prefix stop reconstructed by a direct recursive algorithm. Removing the first stop can return the existing tail. Removing index 2 rebuilds the two stops before it and can share everything after it. Actual compiler allocations are an implementation detail; our output tests do not measure them.

      ### Thinking time!

      Predict both lists in the starter's printed tuple. Does calling `removeStop` alter `original` even if the return value is discarded? Run it, then connect your answer to the record reconstruction from step 2.

      ### Your turn

      Implement `removeStop :: Int -> Trail -> Trail`:

      - Remove exactly the stop at the requested zero-based index.
      - Preserve every other value in its original order.
      - For a negative index or an index outside the trail, return an equal, unchanged trail.

      The conversions are supplied for inspecting results. Aim to process `End` and `Stop` directly so you can explain where sharing is possible. Equivalent results pass the checks; inspect your own definition to judge the reconstruction cost.
    files:
      - path: "Main.hs"
        language: haskell
        reseed: true
        content: |
          module Main where

          data Trail = End | Stop String Trail deriving (Eq, Show)

          fromList :: [String] -> Trail
          fromList [] = End
          fromList (x:xs) = Stop x (fromList xs)

          toList :: Trail -> [String]
          toList End = []
          toList (Stop x rest) = x : toList rest

          removeStop :: Int -> Trail -> Trail
          removeStop index trail = trail

          main :: IO ()
          main = let original = fromList ["Gate", "Lake", "Tower"]
                 in print (toList (removeStop 1 original), toList original)
    open_file: "Main.hs"
    run_file: "Main.hs"
    tests:
      - description: "Indexed trail deletion and original snapshots"
        command: 'let {names End = []; names (Stop name rest) = name : names rest} in let original = Stop "A" (Stop "B" (Stop "A" (Stop "C" End))) in names (removeStop 0 original) == ["B", "A", "C"] && names (removeStop 1 original) == ["A", "A", "C"] && names (removeStop 2 original) == ["A", "B", "C"] && names (removeStop 3 original) == ["A", "B", "A"] && names original == ["A", "B", "A", "C"] && names (removeStop 1 (Stop "" (Stop "" (Stop "X" End)))) == ["", "X"]'
        hints:
          - text: "Identify whether your function is choosing a stop by position or by its name. The repeated-name example distinguishes those decisions."
            condition: "code_matches: /(?:(?:^|\\n)removeStop\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*\\2\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)removeStop\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b))/"
          - text: "On `[\"A\",\"B\",\"A\",\"C\"]`, trace removal at positions 0 and 2. At each visited stop, record the requested position relative to the remaining trail."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)removeStop\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*\\2\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)removeStop\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?=[\\s\\S]*(?:^|\\n)removeStop\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\bStop\\b)[\\s\\S]*$/"
          - text: "For the position-2 trace, draw the result before writing code. Mark unchanged payloads, the missing stop, and each link that now has a different destination. Which fields can come from the old value, and which require a smaller update's result?"
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)removeStop\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*\\2\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)removeStop\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?![\\s\\S]*(?:^|\\n)removeStop\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\bStop\\b)[\\s\\S]*$/"
      - description: "Trail deletion on empty and invalid requests"
        command: 'let {names End = []; names (Stop name rest) = name : names rest} in names (removeStop 0 End) == [] && names (removeStop (-1) (Stop "A" (Stop "B" End))) == ["A", "B"] && names (removeStop (-5) (Stop "A" End)) == ["A"] && names (removeStop 2 (Stop "A" (Stop "B" End))) == ["A", "B"] && names (removeStop 8 (Stop "A" (Stop "B" End))) == ["A", "B"] && names (removeStop 0 (Stop "A" End)) == []'
        hints:
          - text: "Separate requests with no target from requests that remove a valid stop. A failure here may concern an edge case rather than your ordinary deletion rule."
            condition: "code_matches: /(?:(?:^|\\n)removeStop\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*\\2\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)removeStop\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b))/"
          - text: "Compare an empty trail and a two-stop trail at indices -1, 0, 1, and 2. Label each request valid or invalid before checking its result."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)removeStop\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*\\2\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)removeStop\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?=[\\s\\S]*(?:^|\\n)removeStop\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?(?:<[ \\t]*0|\\bEnd\\b))[\\s\\S]*$/"
          - text: "Trace an out-of-range request until the remaining trail is End. Then inspect the result produced at each earlier call. Where would a retained prefix disappear if one case returned the wrong result? Check a negative request separately so it does not accidentally become a valid index."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)removeStop\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*=\\s*\\(*\\s*\\2\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)removeStop\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?![\\s\\S]*(?:^|\\n)removeStop\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?(?:<[ \\t]*0|\\bEnd\\b))[\\s\\S]*$/"
    quiz:
      title: Step 5 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
      - type: single
        bloom: apply
        difficulty: intermediate
        question: Direct persistent deletion removes index 3 from a six-stop trail. Under the lesson's source-constructor
          model, how many new Stop constructors are needed for the retained prefix? Give a brief reason before
          selecting, then compare it with the feedback.
        options:
        - '`0`'
        - '`3`'
        - '`4`'
        - '`6`'
        correct_index: 1
        option_feedback:
          0: Three retained stops precede the removed stop. Their links must lead toward the updated remainder.
          2: The stop at index 3 is skipped, not reconstructed. Only the stops before it form the retained prefix.
          3: The suffix after the deleted stop can be reused; there is no need to rebuild the whole trail.
        explanation: The stops at indices 0, 1, and 2 are reconstructed, and the suffix beginning at index 4 can
          be shared. This is a count in the stated source model, not a measurement of runtime allocation.
      - type: single
        bloom: evaluate
        difficulty: advanced
        question: An undo feature keeps the old trail while removing its first stop. Under the source-constructor
          model, which strategy preserves both versions with the fewest new Stop constructors?
        options:
        - Copy the entire remaining trail.
        - Return the existing remaining trail.
        - Return the whole original trail.
        correct_index: 1
        option_feedback:
          0: Copying can produce the correct contents, but it reconstructs stops whose links already have the required
            shape.
          2: Returning the original keeps the stop that the new version must remove. Preserving the old value does
            not mean the result must have identical contents.
        explanation: The existing tail already is the desired new trail, and immutability lets both versions share
          it safely. Keeping the original also keeps its removed first stop reachable; preserving history can retain
          data that the current version no longer needs.
      - type: multiple
        bloom: analyze
        difficulty: advanced
        question: A check observes that deleting index 1 from `["A","B","A"]` yields `["A","A"]`, then observes
          that the original still yields `["A","B","A"]`. What do these observations establish for this input?
        options:
        - The result preserves both unselected occurrences of "A".
        - The original still has its earlier contents after the call.
        - The result physically shares its last Stop with the original.
        - The compiled execution allocates exactly one new heap node.
        correct_indices:
        - 0
        - 1
        option_feedback:
          0: Both A stops lie outside the selected index. Their presence checks deletion by position rather than
            duplicate removal.
          1: Observing the original separately checks that its earlier contents remain available.
          2: Equal output can come from copying or sharing. These observations do not inspect which runtime nodes
            are shared.
          3: Output equality does not measure heap allocation. Even a source-constructor count is a model of a
            chosen algorithm, not a compiler-allocation measurement.
        explanation: The observations check contents of both versions for one case. Reasoning about reconstruction
          needs the definition and its cost model; claims about physical allocation need different evidence.
    solution:
      files:
        - path: "Main.hs"
          language: haskell
          content: |
            module Main where

            data Trail = End | Stop String Trail deriving (Eq, Show)

            fromList :: [String] -> Trail
            fromList [] = End
            fromList (x:xs) = Stop x (fromList xs)

            toList :: Trail -> [String]
            toList End = []
            toList (Stop x rest) = x : toList rest

            removeStop :: Int -> Trail -> Trail
            removeStop index trail | index < 0 = trail
            removeStop _ End = End
            removeStop 0 (Stop _ rest) = rest
            removeStop index (Stop x rest) = Stop x (removeStop (index - 1) rest)

            main :: IO ()
            main = let original = fromList ["Gate", "Lake", "Tower"]
                   in print (toList (removeStop 1 original), toList original)
      explanation: |
        The zero case returns the existing suffix. Each earlier recursive case retains one value and connects it to the updated remainder. Reaching End without finding the index reconstructs an equal trail. Negative indices return immediately. The decision concerns the index; names are preserved without comparison.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, physical pp. 87–94, 129–142.
  # Assessment: CS131 Fall 25 Quiz 1 v1.docx, Problem 4(a,b): define an n-ary tree and count nonempty nodes.
  # Assessment: [Final] F23 (Public).pdf, Problem 1(c), p. 5: recover nested ADT declarations from constructor uses.
  # Assessment: [Midterm] F24 V1 (Public).pdf, Problem 2, pp. 3–4: traverse children even when this node does not match.
  # Pedagogy: worked-example fading and interleaving — tree recursion plus a fold.
  - title: "Branching Data"
    key: branching-data
    instructions: |
      ### Why this matters

      Searching a directory tree means looking beyond the current folder:
      a folder with no matching files can still have subfolders containing
      matches. **Tree processing separates the current node's contribution
      from the results of processing its children.** Learning to combine
      those results lets you handle arbitrary nesting without writing a
      separate loop for every depth. The route exercise builds this skill
      for searches, summaries, and checks over hierarchical data.

      ### 🎯 You will learn to

      - Analyze the difference between a node's payload and its children.
      - Combine recursive results across an arbitrary number of children.
      - Reconstruct nested and recursive data declarations from their uses.

      ### Two lists with different jobs

      `Route [String] [Route]` stores a list of labels at this node and a list of child routes. `NoRoute` represents no node. A `Route [] children` is still a node, and its children may contain labels even though it has none.

      We want to count **labeled nodes**, not labels. A node with three labels contributes one. A node with no labels contributes zero, but its children must still be visited. Assume the input is a finite tree without cycles.

      ### Thinking time!

      The sample root has two labels and three child entries, one of which is `NoRoute`. One child has no labels but leads to a labeled grandchild. Predict the total number of labeled nodes, then predict the starter's output. Run to distinguish its local count from the required whole-tree count.

      Before opening the check, plan the **repaired** traversal. Write the type of `children`, then the type and expected value of `map countLabeled children`. What single count should those recursive results combine into, and where does the root's own contribution belong? These predictions describe the intended recursive function, not the incomplete starter.

      <details markdown="1">
      <summary>Check the local and whole-subtree contributions</summary>

      The required total is `3`; the starter returns only the root's contribution, `1`. Trace each child separately:

      | Child | Own count | Subtree count |
      | --- | --- | --- |
      | Unlabeled node leading to Lake | `0` | `1` |
      | `NoRoute` | `0` | `0` |
      | Tower node with no children | `1` | `1` |

      Lake is reached through a real node whose labels happen to be empty. `NoRoute` has no descendants. An empty payload and an absent node therefore need different reasoning. The recursive child results count whole subtrees, so counting the child-list entries alone cannot replace them.

      The types track each change in representation:

      | Stage at the sample root | Type | Intended value |
      | --- | --- | --- |
      | `children` | `[Route]` | The three child routes listed above |
      | `map countLabeled children` | `[Int]` | `[1,0,1]` |
      | Combined recursive child counts | `Int` | `2` |
      | Root contribution plus child total | `Int` | `1 + 2 = 3` |

      `map` produces one subtree count per child; combining those counts produces one number. A fold with addition starting at zero is one way to combine them. A recursive helper can express the same relationship without constructing an intermediate list.

      </details>

      ### Your turn

      Repair `countLabeled :: Route -> Int`. Count every node whose own labels list is nonempty. Do not count `NoRoute`, and do not stop traversing a real node just because its labels list is empty.

      The current-node contribution is already supplied. Decide how to turn the child list into a single additional count. You may use a fold over recursive child counts or an equivalent recursive helper. Before testing, draw up two tiny examples that distinguish “number of labels” from “number of labeled nodes,” and predict their intermediate child counts as well as their totals.

      ### Optional written rehearsal: recover the representation

      Allow about three minutes. The following consumers and sample have lost their two `data` declarations. **Write complete declarations for `Load` and `Store` before using Run or opening the model.** Use exactly the constructors shown, in the field order their uses require. Counts have type `Integer`; labels have type `String`. Include `deriving Show` for each type.

      ```haskell
      loadUnits :: Load -> Integer
      loadUnits (Singles n) = n
      loadUnits (Bundle label n) = n

      storedUnits :: Store -> Integer
      storedUnits Vacant = 0
      storedUnits (Rack load children) =
        loadUnits load + foldl (+) 0 (map storedUnits children)

      stock :: Store
      stock = Rack (Bundle "glass" 4) [Vacant, Rack (Singles 5) []]
      ```

      For each constructor, record its field types and result type. Explain why the children of `Rack` must be stores rather than loads, and why `Bundle` is nested inside a field instead of being another Store alternative. Predict `storedUnits stock` and `storedUnits Vacant`.

      Then add your declarations and the supplied code above `main`. Change `main` to print `(storedUnits stock, storedUnits Vacant)` and use **Run**. **Manual check:** expect `(9,0)`; also check the constructor types against every pattern and the sample. **Test My Work** checks `countLabeled`, not these declarations or your written reasoning.

      <details markdown="1">
      <summary>Compare the representation after writing your answer</summary>

      ```haskell
      data Load = Singles Integer | Bundle String Integer
        deriving Show
      data Store = Vacant | Rack Load [Store]
        deriving Show
      ```

      `Singles :: Integer -> Load` and `Bundle :: String -> Integer -> Load` construct payloads. `Vacant :: Store` represents no storage node; `Rack :: Load -> [Store] -> Store` constructs one node with any number of child stores. The recursive `[Store]` field permits arbitrary finite depth. `Rack` receives one Load value, which may choose either Load constructor. Equivalent declarations with these constructor interfaces are valid; layout and ordering of alternatives do not affect the result.

      </details>
    files:
      - path: "Main.hs"
        language: haskell
        reseed: true
        content: |
          module Main where

          data Route = NoRoute | Route [String] [Route] deriving Show

          countLabeled :: Route -> Int
          countLabeled NoRoute = 0
          countLabeled (Route labels children) =
            let own = if labels == [] then 0 else 1
            in own

          sample :: Route
          sample = Route ["Gate", "Start"]
            [Route [] [Route ["Lake"] []], NoRoute, Route ["Tower"] []]

          main :: IO ()
          main = print (countLabeled sample)
    open_file: "Main.hs"
    run_file: "Main.hs"
    tests:
      - description: "Counts across node payload sizes"
        command: 'countLabeled NoRoute == 0 && countLabeled (Route [] []) == 0 && countLabeled (Route ["A", "B", "C"] []) == 1 && countLabeled (Route ["A"] [Route ["B", "C"] [], Route ["D"] []]) == 3 && countLabeled (Route [""] []) == 1'
        hints:
          - text: "The lesson distinguishes labels from labeled nodes. Check which quantity each part of your expression measures."
            condition: "code_matches: /(?:(?:^|\\n)countLabeled\\b(?!\\s*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\blet\\s+([a-z_][A-Za-z0-9_\\x27]*)\\s*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\bin\\s*\\(*\\s*\\1\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)countLabeled\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b))/"
