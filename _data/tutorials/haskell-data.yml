            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)countLabeled\\b(?!\\s*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\blet\\s+([a-z_][A-Za-z0-9_\\x27]*)\\s*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\bin\\s*\\(*\\s*\\1\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)countLabeled\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?=[\\s\\S]*(?:^|\\n)countLabeled\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?(?:labels[ \\t]*==[ \\t]*\\[\\]|\\bnull[ \\t]+labels\\b))[\\s\\S]*$/"
          - text: "For the third case, annotate `current contribution | child inputs | child results | combined result`. Fill the last column from the lesson's contract, then identify which missing relationship in your expression prevents it from reaching that value."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)countLabeled\\b(?!\\s*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\blet\\s+([a-z_][A-Za-z0-9_\\x27]*)\\s*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\bin\\s*\\(*\\s*\\1\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)countLabeled\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?![\\s\\S]*(?:^|\\n)countLabeled\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?(?:labels[ \\t]*==[ \\t]*\\[\\]|\\bnull[ \\t]+labels\\b))[\\s\\S]*$/"
    quiz:
      title: Step 6 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
      - type: single
        bloom: apply
        difficulty: intermediate
        question: Predict `countLabeled (Route ["Root"] [Route [] [Route ["A","B"] []], NoRoute])`. How many labeled
          nodes does it contain? Give a brief reason before selecting, then compare it with the feedback.
        options:
        - '`1`'
        - '`2`'
        - '`3`'
        - '`4`'
        correct_index: 1
        option_feedback:
          0: The root counts, but the traversal must also reach the labeled grandchild through its unlabeled parent.
          2: There are three labels but only two nodes with labels. A and B occupy the same node.
          3: NoRoute is not a node to count, and the real node with an empty labels list contributes zero.
        explanation: The root contributes one and the node holding A and B contributes one. The unlabeled node
          must still pass on its child's recursive count.
      - type: multiple
        bloom: analyze
        difficulty: advanced
        question: A faulty traversal returns 0 immediately for any `Route [] children`; its other cases combine
          recursive counts correctly. Which inputs distinguish it from the required `countLabeled`?
        options:
        - '`Route ["Gate"] [Route ["Lake"] []]`'
        - '`Route [] [Route ["Lake"] []]`'
        - '`Route ["Gate"] [Route [] [Route ["Tower"] []]]`'
        - '`Route [] [Route [] [NoRoute]]`'
        correct_indices:
        - 1
        - 2
        option_feedback:
          0: Both real nodes are labeled, so neither recursive call hits the faulty empty-label case. Both versions
            return 2.
          1: The required result is 1, but the faulty function stops at the unlabeled root and returns 0.
          2: The required result is 2, but the faulty recursive call discards Tower and leaves only Gate, giving
            1.
          3: The faulty function stops early, but every descendant also contributes zero. Both versions return
            0, so the lost traversal is invisible to this check.
        explanation: The distinguishing feature is a labeled descendant below an unlabeled real node. An empty
          labels list describes the current payload; it does not say that the subtree is empty.
    solution:
      files:
        - path: "Main.hs"
          language: haskell
          content: |
            module Main where

            data Route = NoRoute | Route [String] [Route] deriving Show

            countLabeled :: Route -> Int
            countLabeled NoRoute = 0
            countLabeled (Route labels children) =
              let own = if labels == [] then 0 else 1
              in own + foldl (+) 0 (map countLabeled children)

            sample :: Route
            sample = Route ["Gate", "Start"]
              [Route [] [Route ["Lake"] []], NoRoute, Route ["Tower"] []]

            main :: IO ()
            main = print (countLabeled sample)
      explanation: |
        The node's local contribution and its descendants' contributions are separate. That separation prevents the tempting mistake of pruning an entire subtree when its root has no labels. A fold that recursively counts each child and adds to own would satisfy the same contract. The sample has three labeled nodes.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, physical pp. 141–145.
  # Assessment: [Midterm] F23 (Public).pdf, Problem 2(c), p. 5: immutable reconstruction reasoning.
  # Transfer: remove a minimum instead of the lecture's insertion; all deletion rules are supplied.
  # Pedagogy: PRIMM — diagnose discarded structure, then transfer list deletion to a tree.
  - title: "Persistent Search Trees"
    key: search-min-removal
    instructions: |
      ### Why this matters

      Removing the next priority from a scheduler must preserve every
      other queued item and the ordering that makes future searches work.
      Keeping an earlier snapshot adds another requirement: the update
      must leave the old tree usable. **Persistent tree updates meet these
      needs by rebuilding the affected path and sharing unchanged
      branches.** This exercise connects correctness invariants with
      update cost, so you can explain both what an algorithm preserves
      and how much structure it needs to rebuild.

      ### 🎯 You will learn to

      - Apply constructor patterns to locate the smallest key.
      - Analyze which subtrees a persistent deletion must preserve.

      ### The ordering contract

      `Tip` is an empty tree. `Fork value left right` is a node. Every key in `left` is smaller than `value`, and every key in `right` is larger. Keys are unique. Assume a finite input tree that already obeys these rules.

      If a node has no left child, its own key is the smallest in that subtree. Removing that node leaves its **right child**, which may contain other keys. Otherwise, the smallest key is somewhere in the left subtree: update that child while preserving this node and its right child.

      The supplied `toAscList` lists keys in ascending order for checking results. The deletion itself can work directly on constructors, just as the trail deletion did.

      ### Thinking time!

      The sample stores priorities 3, 5, 8, and 12. Predict the repaired function's output after removing the smallest. Then predict the starter's output: its recursive case returns the root's right subtree and discards the rest. Run and identify the unintended losses.

      <details markdown="1">
      <summary>Check the retained keys and reconstruction path</summary>

      The repaired result contains `[5,8,12]`; the starter keeps only `[12]`. Removing key 3 must retain its existing right child, key 5. Root 8 needs a new left child, while its right subtree containing 12 needs no change. The original tree still contains `[3,5,8,12]`.

      In the direct constructor-based algorithm, only retained ancestors on that left path need reconstruction. Compare these cases under the source-constructor model:

      | Position of the removed minimum | Retained ancestors | New `Fork` expressions |
      | --- | --- | --- |
      | At the root | `0` | `0` |
      | Below one ancestor | `1` | `1` |
      | Below two ancestors | `2` | `2` |

      The removed node is replaced by its existing right child, which may be `Tip`. Off-path subtrees can be reused. These counts describe this direct source algorithm; they do not measure GHC or MicroHs allocations or assume the tree is balanced.

      </details>

      ### Your turn

      Repair `removeSmallest :: SearchTree -> SearchTree`:

      - An empty tree stays empty.
      - A nonempty tree loses exactly its smallest key.
      - Every other key remains in the result, with the ordering rule intact.
      - The original tree remains available unchanged.

      The two stopping cases are supplied. Repair the remaining case by following the left child. Explain which right subtrees can be reused, including the removed node's own right child.

      Use the same source-constructor cost model as the trail lesson. If the path reaches the removed node after `k` ancestors, the direct algorithm reconstructs those `k` ancestors and can reuse their off-path children. It creates no replacement for the removed node. The checks establish the keys and order, not physical compiler allocations.
    files:
      - path: "Main.hs"
        language: haskell
        reseed: true
        content: |
          module Main where

          data SearchTree = Tip | Fork Integer SearchTree SearchTree
            deriving Show

          toAscList :: SearchTree -> [Integer]
          toAscList Tip = []
          toAscList (Fork x left right) = toAscList left ++ [x] ++ toAscList right

          removeSmallest :: SearchTree -> SearchTree
          removeSmallest Tip = Tip
          removeSmallest (Fork _ Tip right) = right
          removeSmallest (Fork x left right) = right

          sample :: SearchTree
          sample = Fork 8 (Fork 3 Tip (Fork 5 Tip Tip)) (Fork 12 Tip Tip)

          main :: IO ()
          main = print (toAscList (removeSmallest sample), toAscList sample)
    open_file: "Main.hs"
    run_file: "Main.hs"
    tests:
      - description: "Nested minimum removal and retained search-tree keys"
        command: 'let {keys Tip = []; keys (Fork value left right) = keys left ++ [value] ++ keys right} in let original = Fork 8 (Fork 3 Tip (Fork 5 Tip Tip)) (Fork 12 Tip Tip) in keys (removeSmallest original) == [5, 8, 12] && keys original == [3, 5, 8, 12] && keys (removeSmallest (Fork 9 (Fork 4 (Fork (-2) Tip (Fork 0 Tip Tip)) (Fork 6 Tip Tip)) (Fork 15 Tip Tip))) == [0, 4, 6, 9, 15] && keys (removeSmallest (Fork 10 (Fork 8 (Fork 6 (Fork 4 Tip (Fork 5 Tip Tip)) Tip) Tip) Tip)) == [5, 6, 8, 10]'
        hints:
          - text: "Compare the keys before and after the update. If several disappear, inspect the starter's recursive case rather than the supplied stopping cases."
            condition: "code_matches: /(?:(?:^|\\n)removeSmallest\\s+\\(*\\s*Fork\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*\\)*\\s*=\\s*\\(*\\s*\\3\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)removeSmallest\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b))/"
          - text: "On the sample, mark the path to the minimum and circle keys outside that path. Which of those circled keys disappear from your result?"
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)removeSmallest\\s+\\(*\\s*Fork\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*\\)*\\s*=\\s*\\(*\\s*\\3\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)removeSmallest\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?=[\\s\\S]*(?:^|\\n)removeSmallest\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\bFork\\b)[\\s\\S]*$/"
          - text: "Draw the result that retains every key except the minimum. At one retained ancestor, label the required key, left field, and right field with their sources: old value or updated result. For a constructor-based approach, use that field worksheet to repair the case."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)removeSmallest\\s+\\(*\\s*Fork\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*\\)*\\s*=\\s*\\(*\\s*\\3\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)removeSmallest\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?![\\s\\S]*(?:^|\\n)removeSmallest\\b(?![ \\t]*::)[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\bFork\\b)[\\s\\S]*$/"
      - description: "Search-tree removal at structural boundaries"
        command: 'let {keys Tip = []; keys (Fork value left right) = keys left ++ [value] ++ keys right} in let pair = Fork 5 (Fork 2 Tip Tip) Tip in keys (removeSmallest Tip) == [] && keys (removeSmallest (Fork 4 Tip Tip)) == [] && keys (removeSmallest (Fork 4 Tip (Fork 9 (Fork 7 Tip Tip) Tip))) == [7, 9] && keys (removeSmallest pair) == [5] && keys (removeSmallest (removeSmallest pair)) == [] && keys (removeSmallest (removeSmallest (removeSmallest pair))) == []'
        hints:
          - text: "Check the smallest tree shapes before investigating a long left path: empty, singleton, and a root with only a right child."
            condition: "code_matches: /(?:(?:^|\\n)removeSmallest\\s+\\(*\\s*Fork\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*\\)*\\s*=\\s*\\(*\\s*\\3\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)removeSmallest\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b))/"
          - text: "For a root with a right subtree containing two keys, cross out only the minimum key on paper. Compare the remaining keys with what your stopping case returns."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)removeSmallest\\s+\\(*\\s*Fork\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*\\)*\\s*=\\s*\\(*\\s*\\3\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)removeSmallest\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?=[\\s\\S]*(?:^|\\n)removeSmallest\\b(?![ \\t]*::)[^\\n=]*\\bFork[^\\n=]*\\bTip\\b[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\b(?:Tip|Fork|removeSmallest)\\b)[\\s\\S]*$/"
          - text: "Apply removal repeatedly to a two-key tree and record the expected key set after each call. Match each call's input shape to the equation it selects; identify whether the first mismatch loses keys early or mishandles an exhausted tree."
            condition: "code_matches: /^(?![\\s\\S]*(?:(?:^|\\n)removeSmallest\\s+\\(*\\s*Fork\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s+\\(*\\s*([a-z_][A-Za-z0-9_\\x27]*)\\s*\\)*\\s*\\)*\\s*=\\s*\\(*\\s*\\3\\s*\\)*(?=\\s*(?:\\n[a-zA-Z_]|$))|(?:^|\\n)removeSmallest\\b(?!\\s*::)[^\\n=]*=\\s*\\(*\\s*(?:undefined\\b|error\\b)))(?![\\s\\S]*(?:^|\\n)removeSmallest\\b(?![ \\t]*::)[^\\n=]*\\bFork[^\\n=]*\\bTip\\b[^\\n=]*=(?:(?!\\n[a-z_][A-Za-z0-9_\\x27]*\\b)[\\s\\S])*?\\b(?:Tip|Fork|removeSmallest)\\b)[\\s\\S]*$/"
    quiz:
      title: Step 7 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
      - type: single
        bloom: apply
        difficulty: intermediate
        question: The leftmost path contains five Fork nodes, including the minimum node being removed. Under the
          source-constructor model, how many new Fork constructors does direct persistent removal need? Give a
          brief reason before selecting, then compare it with the feedback.
        options:
        - '`0`'
        - '`1`'
        - '`4`'
        - '`5`'
        correct_index: 2
        option_feedback:
          0: Four retained ancestors need updated left-child links. Only removing a root minimum can return an
            existing child immediately.
          1: Updating only the root is insufficient when the changed child lies below further retained ancestors.
          3: The minimum node is replaced by its existing right child. It is removed rather than reconstructed.
        explanation: The four retained ancestors are reconstructed; their off-path subtrees and the removed node's
          right child can be reused. The cost follows that path length, which the ordering invariant alone does
          not keep short.
      - type: single
        bloom: evaluate
        difficulty: advanced
        question: A proposed deletion replaces the minimum node with Tip, discarding its right child. To judge
          this proposal against the requirement to preserve every other key, which test is most informative?
        options:
        - 'A single root with no children: removing it leaves no keys.'
        - 'A root minimum with a right child: removing it keeps the child.'
        - 'An empty tree: removing its smallest key leaves it empty.'
        correct_index: 1
        option_feedback:
          0: Tip is the correct result when the minimum has no children. This case does not expose the unintended
            loss.
          2: The empty-tree case never encounters a minimum node with a right child, so both implementations can
            pass it.
        explanation: 'A root minimum with a right child isolates the exact preservation obligation: remove the
          root key while retaining the child''s keys. Passing that case would still leave other obligations, such
          as rebuilding ancestors and retaining the original version, to check.'
    solution:
      files:
        - path: "Main.hs"
          language: haskell
          content: |
            module Main where

            data SearchTree = Tip | Fork Integer SearchTree SearchTree
              deriving Show

            toAscList :: SearchTree -> [Integer]
            toAscList Tip = []
            toAscList (Fork x left right) = toAscList left ++ [x] ++ toAscList right

            removeSmallest :: SearchTree -> SearchTree
            removeSmallest Tip = Tip
            removeSmallest (Fork _ Tip right) = right
            removeSmallest (Fork x left right) = Fork x (removeSmallest left) right

            sample :: SearchTree
            sample = Fork 8 (Fork 3 Tip (Fork 5 Tip Tip)) (Fork 12 Tip Tip)

            main :: IO ()
            main = print (toAscList (removeSmallest sample), toAscList sample)
      explanation: |
        A node with no left child is the smallest in its subtree, so removing it returns its right child. Each ancestor retains its key and right subtree while rebuilding its left link from the recursive result. The sample prints `([5,8,12],[3,5,8,12])`; the old snapshot remains intact.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, physical pp. 129–142.
  # Assessment: [Final] S23 V1 (Public).pdf, Problem 2(B), p. 6: recursively transform expression trees.
  # Transfer: evaluation practices constructor/child recursion; optional group reordering
  # makes the parent decision depend on transformed children without copying the optimizer.
  # Pedagogy: transfer with faded scaffolding — new domain, familiar recursive structure.
  - title: "Expression Trees"
    key: expression-trees
    instructions: |
      ### Why this matters

      Compilers and interpreters need a representation of a program that
      they can inspect and process. **Expression trees make the program's
      structure explicit**, including which operations are grouped
      together. Writing an evaluator connects each kind of node to its
      meaning and uses recursion to handle expressions of arbitrary
      finite depth. This small interpreter gives you the foundation for
      understanding how language tools evaluate, check, or transform code.

      ### 🎯 You will learn to

      - Analyze how constructors represent expression grouping.
      - Create an evaluator from the meaning of each constructor.
      - Transform a tree using the results of transforming its children.

      ### Data that describes a computation

      `Number 3` describes the number three. `Plus left right` describes addition of two expressions, while `Times left right` describes multiplication. For example, `Times (Plus (Number 2) (Number 5)) (Number 4)` represents `(2 + 5) * 4`.

      Constructing a `Plus` value does not itself perform addition. It produces data containing two child expressions. `eval` is the function that assigns that data its numerical meaning. As with the branching routes, assume finite trees without cycles.

      ### Thinking time!

      Before running, predict the correct value of the sample. Now predict what the starter actually prints: it currently follows only the left child of each compound expression. Which part of the expression disappears from that behavior?

      Reuse the planning habit from Branching Data, this time without a filled table: write the type and predicted value of each child expression's recursive result at the sample's outer constructor, then explain how that constructor combines them. Keep the child expressions separate from their interpreted results.

      ### Your turn

      Implement `eval :: Expr -> Integer` for every finite expression built from `Number`, `Plus`, and `Times`. A number evaluates to its payload. A compound expression evaluates its child expressions and combines their results using its stated operation.

      Keep the constructors as supplied; choose your own helper structure. Test a number alone, one operation, and nested operations with different grouping. Then explain why adding special cases for the displayed sample would miss the purpose of a recursive evaluator.

      ### Optional written rehearsal: transform children before deciding

      Allow about seven minutes after completing `eval`. A display groups numbered cards into pairs:

      ```haskell
      data Layout = Card Integer | Beside Layout Layout deriving Show

      firstCard :: Layout -> Integer
      firstCard (Card n) = n
      firstCard (Beside left right) = firstCard left

      cards :: Layout -> [Integer]
      cards (Card n) = [n]
      cards (Beside left right) = cards left ++ cards right
      ```

      **Write `arrange :: Layout -> Layout` on paper before using Run or revealing the model.** Assume a finite layout. Keep a lone card unchanged. At every `Beside`, arrange both children first, then put the child whose **arranged first card is smaller** on the left. If those numbers are equal, retain the children's order. Only swap whole children: preserve every card, including duplicates, and retain the grouping within each child apart from its own recursive swaps. Do not flatten and rebuild the layout as a globally sorted list.

      Start by predicting the arranged tree and its `cards` list for each input:

      ```haskell
      display = Beside (Beside (Card 9) (Card 2))
                       (Beside (Card 4) (Card 3))
      tied = Beside (Card 5) (Beside (Card 7) (Card 5))
      ```

      Explain why comparing the original first cards, 9 and 4, would make the wrong decision at the root of `display`. Your implementation may use helper equations, guards, and local bindings; helper names and layout are your choice.

      Add the supplied declarations and your function above `main`, keeping `Expr` and `eval`. Then use a `main = do` block with indented `print` calls for `arrange display`, `(cards display, cards (arrange display))`, and `arrange tied`. **Manual check:** compare both structure and contents with these expected results:

      ```haskell
      Beside (Beside (Card 2) (Card 9)) (Beside (Card 3) (Card 4))
      ([9,2,4,3],[2,9,3,4])
      Beside (Card 5) (Beside (Card 5) (Card 7))
      ```

      The first output retains both groups even though 9 still precedes 3. The second retains all original cards and shows that `display` remains unchanged. The third checks a tie that appears only after arranging a child. Also try `Card (-4)`, which must remain unchanged, and `Beside (Card 8) (Card 2)`, which must swap its children. **Test My Work** checks the expression evaluator only; it does not assess `arrange` or these predictions.

      <details markdown="1">
      <summary>Compare one model after writing and checking your transformation</summary>

      ```haskell
      arrange :: Layout -> Layout
      arrange (Card n) = Card n
      arrange (Beside left right) =
        let arrangedLeft = arrange left
            arrangedRight = arrange right
        in orderChildren arrangedLeft arrangedRight

      orderChildren :: Layout -> Layout -> Layout
      orderChildren left right
        | firstCard left <= firstCard right = Beside left right
        | otherwise = Beside right left
      ```

      Each recursive call returns a Layout, not a number. At the root of `display`, the arranged children begin with 2 and 3, so their order stays as it is. In `tied`, they both begin with 5, so the original left child remains first. The helper examines the transformed children and returns them whole, preserving cards and group structure. A solution that satisfies the same rules with different helpers or equations is equally valid.

      </details>
