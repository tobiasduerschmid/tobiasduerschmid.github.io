title: "Haskell 3: Data and Persistent Programs"
description: "Build recursive data structures and a pure expedition simulator. For programmers who have completed the first two Haskell tutorials; allow about 100–115 minutes, with breaks between steps."
learning_objectives:
  - "Apply algebraic variants and record fields to represent different kinds of values."
  - "Analyze type variables and the constraints required by operations on generic function arguments."
  - "Implement recursive transformations of lists, branching trees, and expression trees."
  - "Evaluate how persistent updates preserve old values and reuse unaffected structure."
  - "Create a pure event simulator with explicit boundary and stopping rules."
backend: haskell
debugger: true
require_tests: true

# Preserve matching saved lessons without crediting replacements at the same index.
progress_version: 2
legacy_step_keys: [variants, records, generic-adts, recursive-data, persistent-trails, branching-data, search-trees, expression-trees, expedition]

# Source map: docs/haskell-course-source-map.md. The supplied documents guide
# concepts and voice; classroom directions and grading rules are source content.
# References below use physical PDF pages of the supplied handout and named exams.
# Pedagogical arc: worked neighboring examples -> guided repair -> independent
# construction. Allocation questions explicitly use a source-constructor model;
# Boolean output checks do not claim to observe physical runtime allocations.
steps:
  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, physical pp. 129–140.
  # Assessment: [Final] F23 (Public).pdf, Problem 1(c), p. 5: construct ADT variants from their uses.
  # Transfer: original event rules; constructor-pattern equations use the lecture notation.
  # Pedagogy: PRIMM — Predict before Run, then Modify; variation across variants.
  - title: "Algebraic Variants"
    key: variants
    instructions: |
      ### Why this matters

      A journey can contain travel, fights, and healing. Each event carries a number, but that number means something different for each event. An algebraic data type keeps the meaning attached to the value.

      ### 🎯 You will learn to

      - Apply constructors to distinguish variants of one type.
      - Analyze each variant with a constructor pattern.

      ### One type, several possibilities

      `data Event = Travel Integer | Fight Integer | Heal Integer` says that an `Event` is one of three alternatives. `Fight 7` is a value of type `Event`. `Fight` is its constructor, with type `Integer -> Event`.

      A function can have one equation per constructor. In `eventDelta (Fight amount) = ...`, the pattern binds `amount` to the stored integer. Haskell uses the first equation whose pattern matches. Each equation returns the same result type. These patterns work just like the list patterns from Foundations, with names chosen for our domain.

      The supplied `deriving Show` lets `print` display event values, as in the lecture. Constructors themselves supply no event behavior. Constructors begin with an uppercase letter; ordinary bindings begin with a lowercase letter.

      ### Thinking time!

      Look at the starter before running it. Will its tuple contain `(2,-7,3)`, `(10,7,3)`, or a type error? Does naming a constructor `Fight` automatically subtract anything?

      Commit to a prediction, then use **Run**. Explain which expression in each branch determines the result.

      <details markdown="1">
      <summary>Check the constructor and result reasoning</summary>

      The starter prints `(10,7,3)`. Each pattern extracts one integer, and each body returns that integer unchanged. `Fight` constructs an event; it does not decide how health changes.

      | Expression | Type | Role |
      | --- | --- | --- |
      | `Fight` | `Integer -> Event` | Constructor awaiting a payload |
      | `Fight 7` | `Event` | One constructed event |
      | `eventDelta (Fight 7)` | `Integer` | Result of interpreting that event |

      </details>

      A pattern can also select a particular payload. Before reading the check, predict both calls to this neighboring function:

      ```haskell
      describeEvent (Heal _) = "restoration"
      describeEvent (Heal 0) = "zero restoration"
      describeEvent _ = "another event"
      -- describeEvent (Heal 0)
      -- describeEvent (Fight 0)
      ```

      <details markdown="1">
      <summary>Check which pattern matches first</summary>

      The calls return `"restoration"` and `"another event"`. `(Heal _)` already matches every Heal payload, so the later `(Heal 0)` equation is never selected. It does not match `Fight 0`: the constructor matters as well as the payload. The final `_` covers the remaining events. Move the specific Heal equation before the general one, then predict again.

      </details>

      ### Your turn

      Repair `eventDelta` so it returns the change in health for one event:

      - `Travel distance` restores one point per four whole distance units: use integer division, rounding down.
      - `Fight damage` loses `damage` points, so the change is negative.
      - `Heal amount` restores `amount` points.

      All event numbers are nonnegative integers. This function reports a change; it does not yet impose a health cap or process a sequence. Change the sample to include a travel distance below four and predict that result before running again.
    files:
      - path: "Main.hs"
        language: haskell
        reseed: true
        content: |
          module Main where

          data Event = Travel Integer | Fight Integer | Heal Integer
            deriving Show

          eventDelta :: Event -> Integer
          eventDelta (Travel distance) = distance
          eventDelta (Fight damage) = damage
          eventDelta (Heal amount) = amount

          main :: IO ()
          main = print (eventDelta (Travel 10), eventDelta (Fight 7), eventDelta (Heal 3))
    open_file: "Main.hs"
    run_file: "Main.hs"
    tests:
      - description: "Travel uses whole quarters, including distances below four"
        command: 'map (\distance -> eventDelta (Travel distance)) [0, 3, 4, 5, 11] == [0, 0, 1, 1, 2] && eventDelta (Travel 100000000000000000004) == 25000000000000000001'
        hints:
          - text: "The number in a Travel event is a distance, not a number of health points."
          - text: "Count how many complete groups of four fit in that distance. Integer division keeps the result an Integer."
          - text: "The Travel equation has the shape `eventDelta (Travel distance) = div distance ...`; choose the group size."
      - description: "Fights lose health while healing restores it"
        command: 'map eventDelta [Fight 0, Fight 1, Fight 9, Heal 0, Heal 7] == [0, -1, -9, 0, 7] && eventDelta (Fight 100000000000000000001) == (-100000000000000000001) && eventDelta (Heal 101) == 101'
        hints:
          - text: "An event's constructor carries meaning, but Haskell will not invent the meaning of its number."
          - text: "A loss is a negative change; a restoration is a positive change."
          - text: "Keep the two constructor patterns. Write each branch's result using its bound payload and the appropriate sign."
    quiz:
      title: "Step 1 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "What are the types of `Fight` and `Fight 12`, respectively?"
          options: ["`Integer -> Event`; `Event`", "`Event`; `Event`", "`Integer -> Event`; `Integer`", "`Event`; `Integer -> Event`"]
          correct_index: 0
          option_feedback:
            1: "Fight still needs its Integer argument. Fight 12 has already received that argument and is an Event value."
            2: "The payload has type Integer, but applying the constructor wraps it in an Event."
            3: "Application consumes the constructor's argument and produces an Event; it does not turn an Event into a constructor."
          explanation: "Fight is a constructor function from Integer to Event. Fight 12 is the result of applying that function, just as an ordinary function's result differs from the function itself."
        - type: single
          difficulty: intermediate
          question: "With the repaired function, what does `map eventDelta [Travel 3, Fight 4, Heal 2]` return?"
          options: ["`[3,-4,2]`", "`[0,4,2]`", "`[0,-4,2]`", "`-2`"]
          correct_index: 2
          option_feedback:
            0: "Three distance units contain no complete group of four. Travel therefore restores zero points."
            1: "Fight reports a loss, so its contribution is negative."
            3: "map returns one result per input event. Combining those results into one number would require another operation."
          explanation: "map preserves the list shape while eventDelta interprets each constructor's payload."
    solution:
      files:
        - path: "Main.hs"
          language: haskell
          content: |
            module Main where

            data Event = Travel Integer | Fight Integer | Heal Integer
              deriving Show

            eventDelta :: Event -> Integer
            eventDelta (Travel distance) = distance `div` 4
            eventDelta (Fight damage) = 0 - damage
            eventDelta (Heal amount) = amount

            main :: IO ()
            main = print (eventDelta (Travel 10), eventDelta (Fight 7), eventDelta (Heal 3))
      explanation: |
        The constructor selects the equation and the pattern gives that rule access to its input. Every equation produces an Integer. The sample now prints `(2,-7,3)`. Constructor names distinguish the alternatives; the equation bodies define their behavior.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, physical pp. 129–138, 143–144.
  # Assessment: [Midterm] F24 V1 (Public).pdf, Problem 2, pp. 3–4: named fields and constructor patterns.
  # Transfer: rebuilding a Hero applies lecture construction and immutability, with supplied health rules.
  # Pedagogy: worked neighboring example, PRIMM — Predict, Modify, Investigate.
  - title: "Records and New Values"
    key: records
    instructions: |
      ### Why this matters

      A tuple can hold a hero's name and health, but remembering which position means what gets old quickly. A record names those fields. Updating a record produces another value, so the original remains available for a before-and-after comparison.

      ### 🎯 You will learn to

      - Apply constructor patterns and record construction.
      - Analyze which fields a transformation should preserve.

      ### Named fields

      The declaration `data Hero = Hero {heroName :: String, hitPoints :: Integer}` names the constructor and its fields. Both `Hero "Fern" 70` and `Hero {heroName = "Fern", hitPoints = 70}` construct the same value. The supplied sample uses `healthOf h` to read a hero's health; the supplied `healthOf` helper extracts this field with a constructor pattern.

      The supplied `renameHero` is a worked example. Its pattern `(Hero oldName hp)` extracts the two fields. Its result `Hero newName hp` constructs a hero with the new name and the original health. The original record stays unchanged. Reconstructing a value requires preserving each field that should stay the same.

      ### Thinking time!

      The starter attempts to heal Fern by 15 points. Will it print health values `(85,70)`, `(15,70)`, or `(15,15)`? Read the constructor expression, commit to an answer, then run it.

      ### Your turn

      Repair `healHero amount hero` to add the healing amount to the existing health, stopping at 100. Use the supplied constructor pattern to access the fields and return a new Hero. Preserve the name. The original hero must still represent its original values.

      You can express the cap with a guard or with `min x y`, which returns the smaller of two ordered values.

      Assume the original health is between 0 and 100, inclusive, and the amount is nonnegative. Try an ordinary heal, an amount that reaches exactly 100, and an amount that would exceed 100. Explain why using the same hero as the input twice does not apply two cumulative heals.
    files:
      - path: "Main.hs"
        language: haskell
        reseed: true
        content: |
          module Main where

          data Hero = Hero {heroName :: String, hitPoints :: Integer}
            deriving (Eq, Show)

          healthOf :: Hero -> Integer
          healthOf (Hero _ hp) = hp

          renameHero :: String -> Hero -> Hero
          renameHero newName (Hero oldName hp) = Hero newName hp

          healHero :: Integer -> Hero -> Hero
          healHero amount (Hero name hp) = Hero name amount

          main :: IO ()
          main = let before = Hero "Fern" 70
                     after = healHero 15 before
                 in print (healthOf after, healthOf before)
    open_file: "Main.hs"
    run_file: "Main.hs"
    tests:
      - description: "Healing adds to existing health and preserves the name and original value"
        command: 'let {observe (Hero name hp) = (name, hp)} in let original = Hero "Fern" 70 in observe (healHero 15 original) == ("Fern", 85) && observe original == ("Fern", 70) && observe (healHero 0 (Hero "Stark" 12)) == ("Stark", 12) && observe (healHero 1 (Hero "" 0)) == ("", 1)'
        hints:
          - text: "The amount is an increment, not a replacement health value."
          - text: "Read the health field from the original record before calculating its replacement."
          - text: "The result has the shape `Hero name (...)`; preserve the bound name and calculate the new health from both amount and hp."
      - description: "Healing respects the 100-point cap at and around its boundary"
        command: 'let {observe (Hero name hp) = (name, hp)} in map (\amount -> snd (observe (healHero amount (Hero "Mage" 90)))) [9, 10, 11] == [99, 100, 100] && observe (healHero 5 (Hero "Full" 100)) == ("Full", 100) && observe (healHero 100000000000000000001 (Hero "New" 0)) == ("New", 100) && observe (healHero 0 (Hero "Empty" 0)) == ("Empty", 0)'
        hints:
          - text: "An ordinary addition is not enough when the result exceeds the maximum."
          - text: "Compare the candidate health with the cap after adding the healing amount."
          - text: "The second argument to Hero has the shape `min ... (...)`; one argument is the cap and the other is the proposed health."
    quiz:
      title: "Step 2 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "Given `h = Hero \"Fern\" 70` and `h2 = healHero 15 h`, what is `healthOf h`?"
          options: ["`85`", "`70`", "`100`", "A constructor-pattern error"]
          correct_index: 1
          option_feedback:
            0: "85 is the health of h2. The update creates a value without changing h."
            2: "The cap limits the new result; it does not fill either record automatically."
            3: "The supplied healthOf helper reads the health using a constructor pattern."
          explanation: "h still refers to the original immutable record. To heal the newer version again, pass h2 explicitly."
        - type: single
          difficulty: basic
          question: "What does `deriving Show` provide for a record whose fields support Show?"
          options: ["An editable reference to each field", "A comparison ordering for records", "A printable representation of records", "A health validation rule for records"]
          correct_index: 2
          option_feedback:
            0: "Deriving Show does not change immutability or introduce references that can be updated in place."
            1: "Ordering belongs to Ord. Show concerns converting values into printable text."
            3: "Validation rules belong in the program's functions; deriving does not infer domain rules from field names."
          explanation: "Show supplies the representation used by show and print."
    solution:
      files:
        - path: "Main.hs"
          language: haskell
          content: |
            module Main where

            data Hero = Hero {heroName :: String, hitPoints :: Integer}
              deriving (Eq, Show)

            healthOf :: Hero -> Integer
            healthOf (Hero _ hp) = hp

            renameHero :: String -> Hero -> Hero
            renameHero newName (Hero oldName hp) = Hero newName hp

            healHero :: Integer -> Hero -> Hero
            healHero amount (Hero name hp) = Hero name (min 100 (hp + amount))

            main :: IO ()
            main = let before = Hero "Fern" 70
                       after = healHero 15 before
                   in print (healthOf after, healthOf before)
      explanation: |
        The constructor pattern extracts the original name and health. The result uses that name and a bounded new health value. The sample prints `(85,70)`: returning a new Hero does not modify the original one.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, physical pp. 34–35, 73–75, 87–89.
  # Assessment: CS131 Fall 25 Quiz 1 v1.docx, Problem 3(a,c): type relationships and generic signatures.
  # Pedagogy: PRIMM and variation theory — vary the argument type, preserve inclusive range filtering.
  - title: "Generic Functions and Constraints"
    key: generic-functions
    instructions: |
      ### Why this matters

      An archive can select scores inside a requested interval or names inside an alphabetical range. One generic function can apply both selection rules while recording which operation the values must support.

      ### 🎯 You will learn to

      - Analyze the relationship between input and output type variables.
      - Apply an `Ord` constraint when a generic function compares values.

      ### One rule, several types

      `withinBand :: Ord a => (a, a) -> [a] -> [a]` accepts a pair of bounds and a list of values. Both bounds and every list element have the same type; the returned list keeps that element type. `Ord a =>` requires that the values support ordering. It does not convert values to a common type.

      The pattern `(low, high)` extracts the two bounds. Comparing each element with those bounds requires `Ord`. In contrast, merely copying list values needs no ordering constraint. Division uses `Fractional`; constraints reflect the operations in a function.

      Haskell orders strings lexicographically, comparing characters from the start. For example, `"z" > "alpha"` is true despite `"z"` being shorter.

      Type-variable names express relationships **within a signature**. Consider two separate declarations:

      ```haskell
      duplicate :: a -> (a, a)
      duplicate x = (x, x)

      box :: a -> [a]
      box x = [x]
      ```

      Predict whether `(duplicate 'x', box True)` has a type error because both signatures use `a`. Explain your choice before opening the check.

      <details markdown="1">
      <summary>Check what the repeated type name relates</summary>

      The expression is valid and produces `(('x','x'),[True])`. In this use of `duplicate`, `a` is `Char`; in this use of `box`, its independently declared `a` is `Bool`. Renaming box's type variable to `b` changes no relationship. Within `duplicate`'s signature, however, all three occurrences must agree: the input and both output fields share one type.

      </details>

      ### Thinking time!

      The starter checks only the lower bound. Predict which out-of-range values it incorrectly keeps in each sample. Run, then explain why preserving input order does not by itself implement the requested selection.

      ### Your turn

      Repair `withinBand bounds values` to keep exactly the values between the two bounds, including both endpoints. Preserve the original order and repeated values. An empty list produces an empty list. Assume the lower bound is no greater than the upper bound. Keep the generic signature so the same function handles integers and strings.

      Repair the predicate supplied to `filter`, or use equivalent list recursion. Try values below, exactly on, between, and above the bounds. Explain why specializing the signature to `(Integer, Integer) -> [Integer] -> [Integer]` would exclude the names example.
    files:
      - path: "Main.hs"
        language: haskell
        reseed: true
        content: |
          module Main where

          withinBand :: Ord a => (a, a) -> [a] -> [a]
          withinBand (low, high) values = filter (\value -> value >= low) values

          main :: IO ()
          main = do
            print (withinBand (2, 6) [7, 2, 5, 1, 6, 5] :: [Integer])
            print (withinBand ("G", "M") ["Z", "G", "J", "A", "M"])
    open_file: "Main.hs"
    run_file: "Main.hs"
    tests:
      - description: "Inclusive bounds retain endpoints, interior values, duplicates, and input order"
        command: 'withinBand (2, 6) [7, 2, 5, 1, 6, 5] == [2, 5, 6, 5] && withinBand (-3, 0) [-4, -3, -1, 0, 1] == [-3, -1, 0] && withinBand (4, 4) [3, 4, 5, 4] == [4, 4] && withinBand (0, 1) [] == [] && withinBand (0.5 :: Double, 1.5) [2, 0.5, 1, 1.5, 0] == [0.5, 1, 1.5]'
        hints:
          - text: "A value must satisfy both bounds. Passing just one comparison is not sufficient."
          - text: "The endpoints count as inside. Keep the inclusive comparisons and connect them with a Boolean operation."
          - text: "The filter predicate has the shape `value >= low && ...`; compare the same value with the upper bound."
      - description: "String ranges use lexicographic ordering while retaining empty and repeated values when in range"
        command: 'withinBand ("G", "M") ["Z", "G", "J", "A", "M", "J"] == ["G", "J", "M", "J"] && withinBand ("", "B") ["C", "", "A", "B"] == ["", "A", "B"] && withinBand (''b'', ''d'') "edbcba" == "dbcb" && withinBand (False, True) [True, False, True] == [True, False, True]'
        hints:
          - text: "The generic function uses the ordering supplied by the value's type. It should not measure string length."
          - text: "Filtering chooses existing values; it should neither sort the names nor remove repetitions."
          - text: "Use the same two comparisons for numeric and string inputs. Retain the `Ord a =>` signature without a conversion."
    quiz:
      title: "Step 3 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "Why does `withinBand` require `Ord a`?"
          options: ["It compares values with the bounds.", "It extracts two fields from a tuple.", "It returns a list of input values.", "It passes its result to print."]
          correct_index: 0
          option_feedback:
            1: "Extracting tuple fields does not require comparing them."
            2: "Returning a list does not require ordering its elements. The comparisons create the constraint."
            3: "Printing is main's job. withinBand returns a list without printing it."
          explanation: "Constraints come from operations performed on the type variable. Comparing values requires an ordering operation."
        - type: single
          difficulty: intermediate
          question: "A function `duplicate x = (x, x)` performs no comparisons. What is its most general type?"
          options: ["`Ord a => a -> (a, a)`", "`a -> (a, b)`", "`a -> (a, a)`", "`Integer -> (Integer, Integer)`"]
          correct_index: 2
          option_feedback:
            0: "That restriction is unnecessary: constructing a tuple does not use an ordering operation."
            1: "Both tuple fields contain the input value, so both must share its type."
            3: "Nothing in duplicate performs an operation specific to Integer."
          explanation: "The repeated type variable records that both result fields preserve the input's type. No type-class constraint is needed."
        - type: single
          difficulty: intermediate
          question: "For `rate (before, after) elapsed = (after - before) / elapsed`, which signature preserves the generic numeric type?"
          options: ["`Ord a => (a, a) -> a -> a`", "`Fractional a => a -> (a, a) -> a`", "`Fractional a => (a, a) -> a -> Bool`", "`Fractional a => (a, a) -> a -> a`"]
          correct_index: 3
          option_feedback:
            0: "Ordering permits comparisons; it does not supply fractional division."
            1: "The first argument is the before/after tuple; the second is the elapsed amount. This signature reverses those argument shapes."
            2: "Division produces a numeric rate, not a Boolean result."
          explanation: "The first argument is a pair and the second is one value. Subtraction and division relate their numeric types to the result, and division requires Fractional."
    solution:
      files:
        - path: "Main.hs"
          language: haskell
          content: |
            module Main where

            withinBand :: Ord a => (a, a) -> [a] -> [a]
            withinBand (low, high) values =
              filter (\value -> value >= low && value <= high) values

            main :: IO ()
            main = do
              print (withinBand (2, 6) [7, 2, 5, 1, 6, 5] :: [Integer])
              print (withinBand ("G", "M") ["Z", "G", "J", "A", "M"])
      explanation: |
        The tuple pattern names both bounds. The predicate requires both inclusive comparisons, and filter retains each successful original value in order. The samples print `[2,5,6,5]` and `["G","J","M"]`. The same comparison rule works across the two element types.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, physical pp. 141–142.
  # Assessment: [Midterm] F23 (Public).pdf, Problem 2(a,b), pp. 4–5: construct and transform a custom list.
  # Transfer: conversion is preparation for the exam's more demanding duplicate-removal task.
  # Pedagogy: worked example with fading — reverse the direction of a supplied conversion.
  - title: "Recursive Data Types"
    key: recursive-data
    instructions: |
      ### Why this matters

      A trail is either finished or has one stop followed by the rest of the trail. That sentence is already a data definition. Recursive types let the structure of the data tell us the structure of its functions.

      ### 🎯 You will learn to

      - Apply base and recursive cases to a user-defined list.
      - Create a conversion that preserves stop names and order.

      ### A trail inside a trail

      `data Trail = End | Stop String Trail` has a nonrecursive base constructor and a recursive constructor. `Stop "Gate" (Stop "Lake" End)` is a `Trail` with two named stops.

      Read the supplied `toList` as a worked example. `End` becomes the empty built-in list. A `Stop` contributes its value and recursively converts the rest. Its pattern has exactly the fields declared by the constructor.

      ### Thinking time!

      Predict `toList (Stop "Gate" (Stop "Lake" End))`. Then predict the starter's round trip `toList (fromList ["Gate","Lake"])`. Will the two results agree? Run and explain the difference.

      ### Your turn

      Implement `fromList :: [String] -> Trail`. It must produce one stop for each input value in the original order and finish with `End`. An empty input produces `End`.

      Keep `toList` as the supplied observation function. The exercise is to derive the conversion in the other direction. Test both one-stop and longer trails, and write down how the empty-list pattern corresponds to a constructor with no remaining stops.
    files:
      - path: "Main.hs"
        language: haskell
        reseed: true
        content: |
          module Main where

          data Trail = End | Stop String Trail deriving (Eq, Show)

          toList :: Trail -> [String]
          toList End = []
          toList (Stop x rest) = x : toList rest

          fromList :: [String] -> Trail
          fromList xs = End

          main :: IO ()
          main = do
            print (toList (Stop "Gate" (Stop "Lake" End)))
            print (toList (fromList ["Gate", "Lake"]))
    open_file: "Main.hs"
    run_file: "Main.hs"
    tests:
      - description: "Empty, single-stop, and longer lists produce the matching trail structure"
        command: 'let {names End = []; names (Stop name rest) = name : names rest} in names (fromList []) == [] && names (fromList ["Gate"]) == ["Gate"] && names (fromList ["Lake", "Lake", "Hill"]) == ["Lake", "Lake", "Hill"]'
        hints:
          - text: "Find the input shape that has no work left. It corresponds to the trail's base constructor."
          - text: "For a nonempty list, keep its head and recursively convert its tail."
          - text: "Use one equation for `[]` and another for `(x:xs)`. The latter creates a Stop whose remaining-trail field comes from the recursive result."
      - description: "The conversion preserves strings, repeated values, and their order"
        command: 'let {names End = []; names (Stop name rest) = name : names rest} in names (fromList ["Gate", "Lake", "Gate"]) == ["Gate", "Lake", "Gate"] && names (fromList ["", "North", " ", "South", ""]) == ["", "North", " ", "South", ""] && names (fromList (map show [1..12 :: Int])) == map show [1..12 :: Int]'
        hints:
          - text: "The conversion changes representation, not the sequence of stops."
          - text: "Do not compare, sort, or deduplicate payloads; the function preserves each stop name."
          - text: "Keep the current head as the outer Stop and recurse only on the input tail. That places each stop before the rest of the trail."
    quiz:
      title: "Step 4 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "When converting a nonempty list to a Trail, what should the remaining-trail field of its outer Stop contain?"
          options: ["The original built-in list tail", "The converted entire input again", "The recursive conversion of the tail", "End regardless of the input tail"]
          correct_index: 2
          option_feedback:
            0: "The field needs a Trail. The built-in list tail must first be converted."
            1: "Recursing on the entire input does not reduce the problem and does not place the next stop in the remaining field."
            3: "End is appropriate only when no input stops remain. Using it here would discard the remaining names."
          explanation: "The current list head supplies the outer name. Recursively converting the tail supplies a smaller Trail ending in End."
        - type: single
          difficulty: intermediate
          question: 'What is `toList (Stop "Gate" (Stop "Lake" End))`?'
          options: ['`["Gate","Lake"]`', '`["Lake","Gate"]`', '`[["Gate"],["Lake"]]`', '`["Gate","Lake",""]`']
          correct_index: 0
          option_feedback:
            1: "The current stop is placed before the recursive conversion of the remaining trail."
            2: "Each Stop holds one payload, and the result is a flat list of those payloads."
            3: "End marks absence of another stop. It carries no extra stop name."
          explanation: "Each Stop becomes one cons cell in the built-in list; End becomes []."
    solution:
      files:
        - path: "Main.hs"
          language: haskell
          content: |
            module Main where

            data Trail = End | Stop String Trail deriving (Eq, Show)

            toList :: Trail -> [String]
            toList End = []
            toList (Stop x rest) = x : toList rest

            fromList :: [String] -> Trail
            fromList [] = End
            fromList (x:xs) = Stop x (fromList xs)

            main :: IO ()
            main = do
              print (toList (Stop "Gate" (Stop "Lake" End)))
              print (toList (fromList ["Gate", "Lake"]))
      explanation: |
        The input list and output trail have matching recursive structure. Their base cases represent the empty sequence, and their recursive cases pair a current value with the remaining sequence. Both sample lines now print `["Gate","Lake"]`.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, physical pp. 141–145.
  # Assessment: [Midterm] F23 (Public).pdf, Problem 2(b,c), pp. 4–5, and Problem 3(c), p. 7.
  # Transfer: custom-list reconstruction/cost plus indexed deletion; the exam uses different functions.
  # Pedagogy: PRIMM and spaced retrieval — persistence revisits records, types, recursion.
  - title: "Persistent Trail Updates"
    key: persistent-trails
    instructions: |
      ### Why this matters

      The party changes its plan, but yesterday's route must stay available. A persistent update returns a new trail while preserving the old value. We can reuse the part after the removed stop because none of its links need to change.

      ### 🎯 You will learn to

      - Create a recursive deletion that preserves the remaining order.
      - Evaluate which part of an immutable trail needs reconstruction.

      ### An update with a boundary

      Stops use zero-based indices. Removing index 1 from `["Gate","Lake","Tower"]` leaves `["Gate","Tower"]`. At the selected stop, its remaining trail is already the result we want. Before that stop, each retained stop needs a link to the updated remainder.

      Use this source-level model when reasoning about cost: count a new `Stop` for each retained prefix stop reconstructed by a direct recursive algorithm. Removing the first stop can return the existing tail. Removing index 2 rebuilds the two stops before it and can share everything after it. Actual compiler allocations are an implementation detail; our output tests do not measure them.

      ### Thinking time!

      Predict both lists in the starter's printed tuple. Does calling `removeStop` alter `original` even if the return value is discarded? Run it, then connect your answer to the record reconstruction from step 2.

      ### Your turn

      Implement `removeStop :: Int -> Trail -> Trail`:

      - Remove exactly the stop at the requested zero-based index.
      - Preserve every other value in its original order.
      - For a negative index or an index outside the trail, return an equal, unchanged trail.

      The conversions are supplied for inspecting results. Aim to process `End` and `Stop` directly so you can explain where sharing is possible. Equivalent results pass the checks; inspect your own definition to judge the reconstruction cost.
    files:
      - path: "Main.hs"
        language: haskell
        reseed: true
        content: |
          module Main where

          data Trail = End | Stop String Trail deriving (Eq, Show)

          fromList :: [String] -> Trail
          fromList [] = End
          fromList (x:xs) = Stop x (fromList xs)

          toList :: Trail -> [String]
          toList End = []
          toList (Stop x rest) = x : toList rest

          removeStop :: Int -> Trail -> Trail
          removeStop index trail = trail

          main :: IO ()
          main = let original = fromList ["Gate", "Lake", "Tower"]
                 in print (toList (removeStop 1 original), toList original)
    open_file: "Main.hs"
    run_file: "Main.hs"
    tests:
      - description: "Deletion removes exactly the indexed stop and preserves the original trail"
        command: 'let {names End = []; names (Stop name rest) = name : names rest} in let original = Stop "A" (Stop "B" (Stop "A" (Stop "C" End))) in names (removeStop 0 original) == ["B", "A", "C"] && names (removeStop 1 original) == ["A", "A", "C"] && names (removeStop 2 original) == ["A", "B", "C"] && names (removeStop 3 original) == ["A", "B", "A"] && names original == ["A", "B", "A", "C"] && names (removeStop 1 (Stop "" (Stop "" (Stop "X" End)))) == ["", "X"]'
        hints:
          - text: "This is deletion by position. Equal payloads elsewhere in the trail must stay."
          - text: "When the index reaches zero, skip this Stop. Before zero, retain the current value and decrease the index for the recursive call."
          - text: "The nonzero case reconstructs `Stop x (...)`; the recursive call works on the remaining trail with an index one smaller."
      - description: "Empty trails and invalid indices remain unchanged"
        command: 'let {names End = []; names (Stop name rest) = name : names rest} in names (removeStop 0 End) == [] && names (removeStop (-1) (Stop "A" (Stop "B" End))) == ["A", "B"] && names (removeStop (-5) (Stop "A" End)) == ["A"] && names (removeStop 2 (Stop "A" (Stop "B" End))) == ["A", "B"] && names (removeStop 8 (Stop "A" (Stop "B" End))) == ["A", "B"] && names (removeStop 0 (Stop "A" End)) == []'
        hints:
          - text: "Check the empty, singleton, and just-outside cases separately."
          - text: "An empty trail has no stop to remove. A negative index has no valid target."
          - text: "Place the invalid-index and End cases before the recursive Stop case. Reaching End after retaining a prefix must preserve that prefix."
    quiz:
      title: "Step 5 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: advanced
          question: "A direct persistent deletion removes index 2 from a five-stop trail. In the stated constructor model, how many new Stop nodes does its retained prefix need?"
          options: ["0", "2", "3", "5"]
          correct_index: 1
          option_feedback:
            0: "Only deleting the first stop can return the old tail immediately. Here two retained prefix links must point toward an updated remainder."
            2: "The removed Stop is skipped. It is not reconstructed as part of the retained prefix."
            3: "The unaffected suffix can be reused rather than copied."
          explanation: "The stops at indices 0 and 1 are reconstructed. The result can reuse the suffix that originally followed index 2."
        - type: single
          difficulty: intermediate
          question: "After `new = removeStop 1 old`, which statement follows from immutability?"
          options: ["old now has one fewer stop.", "new and old have equal contents.", "old still has its original contents.", "Every node in new must be copied."]
          correct_index: 2
          option_feedback:
            0: "removeStop returns a result. It cannot rewrite the existing value bound to old."
            1: "A valid removal changes the result's contents even though old remains available."
            3: "Immutability permits sharing unchanged structure; it does not require a deep copy."
          explanation: "As with the record reconstruction in step 2, the new value and original value can coexist. Unchanged structure can be shared safely."
        - type: single
          difficulty: intermediate
          question: 'After deleting index 1 from `["A","B","A"]`, why must the result still contain two occurrences of "A"?'
          options: ["Only the indexed stop is removed.", "All repeated names must be retained.", "Only the last stop can be removed.", "The output must have unique names."]
          correct_index: 0
          option_feedback:
            1: "Repetition is not the criterion. Deleting index 0 would remove one of the two A stops."
            2: "Any valid position can be removed, including the middle one here."
            3: "This is deletion by position, not duplicate removal. The contract preserves every other stop."
          explanation: "Index 1 identifies B. Both A stops lie outside that position and retain their relative order."
    solution:
      files:
        - path: "Main.hs"
          language: haskell
          content: |
            module Main where

            data Trail = End | Stop String Trail deriving (Eq, Show)

            fromList :: [String] -> Trail
            fromList [] = End
            fromList (x:xs) = Stop x (fromList xs)

            toList :: Trail -> [String]
            toList End = []
            toList (Stop x rest) = x : toList rest

            removeStop :: Int -> Trail -> Trail
            removeStop index trail | index < 0 = trail
            removeStop _ End = End
            removeStop 0 (Stop _ rest) = rest
            removeStop index (Stop x rest) = Stop x (removeStop (index - 1) rest)

            main :: IO ()
            main = let original = fromList ["Gate", "Lake", "Tower"]
                   in print (toList (removeStop 1 original), toList original)
      explanation: |
        The zero case returns the existing suffix. Each earlier recursive case retains one value and connects it to the updated remainder. Reaching End without finding the index reconstructs an equal trail. Negative indices return immediately. The decision concerns the index; names are preserved without comparison.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, physical pp. 87–94, 129–142.
  # Assessment: CS131 Fall 25 Quiz 1 v1.docx, Problem 4(a,b): define an n-ary tree and count nonempty nodes.
  # Assessment: [Midterm] F24 V1 (Public).pdf, Problem 2, pp. 3–4: traverse children even when this node does not match.
  # Pedagogy: worked-example fading and interleaving — tree recursion plus a fold.
  - title: "Branching Data"
    key: branching-data
    instructions: |
      ### Why this matters

      A route can branch into several routes. That changes the recursive question: we need a result from every child, then we combine those results. The same pattern powers document searches and nested menus.

      ### 🎯 You will learn to

      - Analyze the difference between a node's payload and its children.
      - Combine recursive results across an arbitrary number of children.

      ### Two lists with different jobs

      `Route [String] [Route]` stores a list of labels at this node and a list of child routes. `NoRoute` represents no node. A `Route [] children` is still a node, and its children may contain labels even though it has none.

      We want to count **labeled nodes**, not labels. A node with three labels contributes one. A node with no labels contributes zero, but its children must still be visited. Assume the input is a finite tree without cycles.

      ### Thinking time!

      The sample root has two labels and three child entries, one of which is `NoRoute`. One child has no labels but leads to a labeled grandchild. Predict the total number of labeled nodes, then predict the starter's output. Run to distinguish its local count from the required whole-tree count.

      <details markdown="1">
      <summary>Check the local and whole-subtree contributions</summary>

      The required total is `3`; the starter returns only the root's contribution, `1`. Trace each child separately:

      | Child | Own labeled-node contribution | Whole-subtree contribution |
      | --- | --- | --- |
      | Unlabeled node leading to Lake | `0` | `1` |
      | `NoRoute` | `0` | `0` |
      | Tower node with no children | `1` | `1` |

      Lake is reached through a real node whose labels happen to be empty. `NoRoute` has no descendants. An empty payload and an absent node therefore need different reasoning. The recursive child results count whole subtrees, so counting the child-list entries alone cannot replace them.

      </details>

      ### Your turn

      Repair `countLabeled :: Route -> Int`. Count every node whose own labels list is nonempty. Do not count `NoRoute`, and do not stop traversing a real node just because its labels list is empty.

      The current-node contribution is already supplied. Decide how to turn the child list into a single additional count. You may use a fold over recursive child counts or an equivalent recursive helper. Before testing, draw up two tiny examples that distinguish “number of labels” from “number of labeled nodes.”
    files:
      - path: "Main.hs"
        language: haskell
        reseed: true
        content: |
          module Main where

          data Route = NoRoute | Route [String] [Route] deriving Show

          countLabeled :: Route -> Int
          countLabeled NoRoute = 0
          countLabeled (Route labels children) =
            let own = if labels == [] then 0 else 1
            in own

          sample :: Route
          sample = Route ["Gate", "Start"]
            [Route [] [Route ["Lake"] []], NoRoute, Route ["Tower"] []]

          main :: IO ()
          main = print (countLabeled sample)
    open_file: "Main.hs"
    run_file: "Main.hs"
    tests:
      - description: "The count measures labeled nodes rather than individual labels"
        command: 'countLabeled NoRoute == 0 && countLabeled (Route [] []) == 0 && countLabeled (Route ["A", "B", "C"] []) == 1 && countLabeled (Route ["A"] [Route ["B", "C"] [], Route ["D"] []]) == 3 && countLabeled (Route [""] []) == 1'
        hints:
          - text: "A node contributes either zero or one, regardless of how many labels it stores."
          - text: "Keep the current-node contribution separate from the sum of child contributions."
          - text: "The result has the shape `own + ...`; the missing value must summarize recursive calls on the children."
      - description: "Traversal reaches descendants through unlabeled nodes and handles missing children"
        command: 'countLabeled (Route ["Gate", "Start"] [Route [] [Route ["Lake"] []], NoRoute, Route ["Tower"] []]) == 3 && countLabeled (Route [] [Route [] [Route ["Deep"] []], NoRoute]) == 1 && countLabeled (Route ["Root"] [NoRoute, NoRoute]) == 1 && countLabeled (Route [] [Route [] [], Route ["A"] [], Route ["B"] [], Route ["C"] [], Route ["D"] []]) == 4 && countLabeled (Route [] [Route [] [Route [] [Route [] [Route [""] []]]]]) == 1'
        hints:
          - text: "An unlabeled node does not imply an unlabeled subtree."
          - text: "Visit its children even when its own contribution is zero. NoRoute is the case with no children to visit."
          - text: "Apply countLabeled to each child and combine the resulting Int values. Check that the empty child list contributes zero."
    quiz:
      title: "Step 6 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "What should `countLabeled (Route [] [Route [\"A\",\"B\"] [], NoRoute, Route [] [Route [\"C\"] []]])` return?"
          options: ["0", "2", "3", "4"]
          correct_index: 1
          option_feedback:
            0: "The empty root payload contributes zero, but traversal must still reach both labeled descendants."
            2: "There are three labels, but A and B belong to one node and contribute only one count."
            3: "Four real Route nodes occur, but the root and the parent of C have empty labels and do not count."
          explanation: "The node with A and B contributes one; the deeper node with C contributes one. Both unlabeled nodes are traversed, while NoRoute contributes zero."
        - type: single
          difficulty: intermediate
          question: "After `map countLabeled children`, which operation produces the children's combined contribution?"
          options: ["`foldl (+) 1`", "`foldl (*) 1`", "`foldl (+) 0`", "`length`"]
          correct_index: 2
          option_feedback:
            0: "Starting at one adds an extra contribution, even when there are no children."
            1: "Multiplication combines the counts as a product. The required total adds all subtree counts."
            3: "length counts child entries, regardless of how many labeled nodes each child contains."
          explanation: "Each recursive result is already a count for a whole subtree. Adding them with foldl combines those disjoint counts; the zero initial value handles an empty child list."
        - type: single
          difficulty: intermediate
          question: "A Route node holds a list of String labels and zero or more child routes. Which two field types complete `Route ... ...`?"
          options: ["`[String] String`", "`[String] Route`", "`[String] [[String]]`", "`[String] [Route]`"]
          correct_index: 3
          option_feedback:
            0: "The first field correctly stores labels, but a second String field cannot describe recursive child routes."
            1: "Route would store exactly one child, rather than allowing zero or more children."
            2: "A list of label lists omits the route structure that represents each child's further descendants."
          explanation: "The recursive field is a list of values of the same Route type, allowing any finite number of children."
    solution:
      files:
        - path: "Main.hs"
          language: haskell
          content: |
            module Main where

            data Route = NoRoute | Route [String] [Route] deriving Show

            countLabeled :: Route -> Int
            countLabeled NoRoute = 0
            countLabeled (Route labels children) =
              let own = if labels == [] then 0 else 1
              in own + foldl (+) 0 (map countLabeled children)

            sample :: Route
            sample = Route ["Gate", "Start"]
              [Route [] [Route ["Lake"] []], NoRoute, Route ["Tower"] []]

            main :: IO ()
            main = print (countLabeled sample)
      explanation: |
        The node's local contribution and its descendants' contributions are separate. That separation prevents the tempting mistake of pruning an entire subtree when its root has no labels. A fold that recursively counts each child and adds to own would satisfy the same contract. The sample has three labeled nodes.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, physical pp. 141–145.
  # Assessment: [Midterm] F23 (Public).pdf, Problem 2(c), p. 5: immutable reconstruction reasoning.
  # Transfer: remove a minimum instead of the lecture's insertion; all deletion rules are supplied.
  # Pedagogy: PRIMM — diagnose discarded structure, then transfer list deletion to a tree.
  - title: "Persistent Search Trees"
    key: search-min-removal
    instructions: |
      ### Why this matters

      A scheduler can keep priorities in a search tree. After processing the smallest priority, it needs the remaining tree while retaining the old snapshot for inspection. This update can reuse branches that do not change.

      ### 🎯 You will learn to

      - Apply constructor patterns to locate the smallest key.
      - Analyze which subtrees a persistent deletion must preserve.

      ### The ordering contract

      `Tip` is an empty tree. `Fork value left right` is a node. Every key in `left` is smaller than `value`, and every key in `right` is larger. Keys are unique. Assume a finite input tree that already obeys these rules.

      If a node has no left child, its own key is the smallest in that subtree. Removing that node leaves its **right child**, which may contain other keys. Otherwise, the smallest key is somewhere in the left subtree: update that child while preserving this node and its right child.

      The supplied `toAscList` lists keys in ascending order for checking results. The deletion itself can work directly on constructors, just as the trail deletion did.

      ### Thinking time!

      The sample stores priorities 3, 5, 8, and 12. Predict the repaired function's output after removing the smallest. Then predict the starter's output: its recursive case returns the root's right subtree and discards the rest. Run and identify the unintended losses.

      <details markdown="1">
      <summary>Check the retained keys and reconstruction path</summary>

      The repaired result contains `[5,8,12]`; the starter keeps only `[12]`. Removing key 3 must retain its existing right child, key 5. Root 8 needs a new left child, while its right subtree containing 12 needs no change. The original tree still contains `[3,5,8,12]`.

      In the direct constructor-based algorithm, only retained ancestors on that left path need reconstruction. Compare these cases under the source-constructor model:

      | Position of the removed minimum | Retained ancestors | New `Fork` expressions |
      | --- | --- | --- |
      | At the root | `0` | `0` |
      | Below one ancestor | `1` | `1` |
      | Below two ancestors | `2` | `2` |

      The removed node is replaced by its existing right child, which may be `Tip`. Off-path subtrees can be reused. These counts describe this direct source algorithm; they do not measure GHC or MicroHs allocations or assume the tree is balanced.

      </details>

      ### Your turn

      Repair `removeSmallest :: SearchTree -> SearchTree`:

      - An empty tree stays empty.
      - A nonempty tree loses exactly its smallest key.
      - Every other key remains in the result, with the ordering rule intact.
      - The original tree remains available unchanged.

      The two stopping cases are supplied. Repair the remaining case by following the left child. Explain which right subtrees can be reused, including the removed node's own right child.

      Use the same source-constructor cost model as the trail lesson. If the path reaches the removed node after `k` ancestors, the direct algorithm reconstructs those `k` ancestors and can reuse their off-path children. It creates no replacement for the removed node. The checks establish the keys and order, not physical compiler allocations.
    files:
      - path: "Main.hs"
        language: haskell
        reseed: true
        content: |
          module Main where

          data SearchTree = Tip | Fork Integer SearchTree SearchTree
            deriving Show

          toAscList :: SearchTree -> [Integer]
          toAscList Tip = []
          toAscList (Fork x left right) = toAscList left ++ [x] ++ toAscList right

          removeSmallest :: SearchTree -> SearchTree
          removeSmallest Tip = Tip
          removeSmallest (Fork _ Tip right) = right
          removeSmallest (Fork x left right) = right

          sample :: SearchTree
          sample = Fork 8 (Fork 3 Tip (Fork 5 Tip Tip)) (Fork 12 Tip Tip)

          main :: IO ()
          main = print (toAscList (removeSmallest sample), toAscList sample)
    open_file: "Main.hs"
    run_file: "Main.hs"
    tests:
      - description: "Removing a nested minimum preserves its right child and every unaffected ancestor and branch"
        command: 'let {keys Tip = []; keys (Fork value left right) = keys left ++ [value] ++ keys right} in let original = Fork 8 (Fork 3 Tip (Fork 5 Tip Tip)) (Fork 12 Tip Tip) in keys (removeSmallest original) == [5, 8, 12] && keys original == [3, 5, 8, 12] && keys (removeSmallest (Fork 9 (Fork 4 (Fork (-2) Tip (Fork 0 Tip Tip)) (Fork 6 Tip Tip)) (Fork 15 Tip Tip))) == [0, 4, 6, 9, 15] && keys (removeSmallest (Fork 10 (Fork 8 (Fork 6 (Fork 4 Tip (Fork 5 Tip Tip)) Tip) Tip) Tip)) == [5, 6, 8, 10]'
        hints:
          - text: "Returning the root's right child is valid only when the root itself has no left child."
          - text: "When a left child exists, the current key and right subtree must survive. Only the left subtree needs the recursive update."
          - text: "Reconstruct `Fork x (...) right`; the missing field is the result of removing the smallest key from left."
      - description: "Empty trees, singleton trees, roots without left children, and repeated removals reach the right boundary"
        command: 'let {keys Tip = []; keys (Fork value left right) = keys left ++ [value] ++ keys right} in let pair = Fork 5 (Fork 2 Tip Tip) Tip in keys (removeSmallest Tip) == [] && keys (removeSmallest (Fork 4 Tip Tip)) == [] && keys (removeSmallest (Fork 4 Tip (Fork 9 (Fork 7 Tip Tip) Tip))) == [7, 9] && keys (removeSmallest pair) == [5] && keys (removeSmallest (removeSmallest pair)) == [] && keys (removeSmallest (removeSmallest (removeSmallest pair))) == []'
        hints:
          - text: "The smallest node can be the root, even when that root has a right subtree."
          - text: "Removing a node must not remove the keys stored in its right child. An empty tree has no key to remove."
          - text: "Keep separate patterns for Tip and a Fork with Tip as its left child. Only the remaining Fork pattern recurses."
    quiz:
      title: "Step 7 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "The smallest key is in the root's left subtree. In a direct persistent removal, which structure can the result reuse unchanged?"
          options: ["The whole original tree", "The original right subtree", "Only the original root node", "No original subtree"]
          correct_index: 1
          option_feedback:
            0: "The result must exclude one old key, so the entire tree cannot remain unchanged."
            2: "The root must point to the updated left subtree. Its right child needs no change."
            3: "Unchanged immutable subtrees can be shared safely between versions."
          explanation: "The recursive change is confined to the left path. The root's right subtree keeps all its original keys and ordering relationships."
        - type: single
          difficulty: intermediate
          question: "The path to the smallest key contains four Fork nodes, including the node removed. In the stated source-constructor model, how many new Fork nodes does direct removal need?"
          options: ["0", "1", "3", "4"]
          correct_index: 2
          option_feedback:
            0: "Three retained ancestors need links to their updated left children."
            1: "There are three retained ancestors before the removed node, not just the root."
            3: "The smallest node is removed and replaced by its existing right child, so it is not reconstructed."
          explanation: "The three retained ancestors are reconstructed; the removed node's right child and all off-path subtrees can be reused."
    solution:
      files:
        - path: "Main.hs"
          language: haskell
          content: |
            module Main where

            data SearchTree = Tip | Fork Integer SearchTree SearchTree
              deriving Show

            toAscList :: SearchTree -> [Integer]
            toAscList Tip = []
            toAscList (Fork x left right) = toAscList left ++ [x] ++ toAscList right

            removeSmallest :: SearchTree -> SearchTree
            removeSmallest Tip = Tip
            removeSmallest (Fork _ Tip right) = right
            removeSmallest (Fork x left right) = Fork x (removeSmallest left) right

            sample :: SearchTree
            sample = Fork 8 (Fork 3 Tip (Fork 5 Tip Tip)) (Fork 12 Tip Tip)

            main :: IO ()
            main = print (toAscList (removeSmallest sample), toAscList sample)
      explanation: |
        A node with no left child is the smallest in its subtree, so removing it returns its right child. Each ancestor retains its key and right subtree while rebuilding its left link from the recursive result. The sample prints `([5,8,12],[3,5,8,12])`; the old snapshot remains intact.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, physical pp. 129–142.
  # Assessment: [Final] S23 V1 (Public).pdf, Problem 2(B), p. 6: recursively transform expression trees.
  # Transfer: evaluation practices its constructor/child recursion prerequisite; it is not the full optimizer task.
  # Pedagogy: transfer with faded scaffolding — new domain, familiar recursive structure.
  - title: "Expression Trees"
    key: expression-trees
    instructions: |
      ### Why this matters

      The course's language tools manipulate programs as data. Once an expression is a tree, evaluating it becomes another recursive transformation. The tree structure records grouping before evaluation even starts.

      ### 🎯 You will learn to

      - Analyze how constructors represent expression grouping.
      - Create an evaluator from the meaning of each constructor.

      ### Data that describes a computation

      `Number 3` describes the number three. `Plus left right` describes addition of two expressions, while `Times left right` describes multiplication. For example, `Times (Plus (Number 2) (Number 5)) (Number 4)` represents `(2 + 5) * 4`.

      Constructing a `Plus` value does not itself perform addition. It produces data containing two child expressions. `eval` is the function that assigns that data its numerical meaning. As with the branching routes, assume finite trees without cycles.

      ### Thinking time!

      Before running, predict the correct value of the sample. Now predict what the starter actually prints: it currently follows only the left child of each compound expression. Which part of the expression disappears from that behavior?

      ### Your turn

      Implement `eval :: Expr -> Integer` for every finite expression built from `Number`, `Plus`, and `Times`. A number evaluates to its payload. A compound expression evaluates its child expressions and combines their results using its stated operation.

      Keep the constructors as supplied; choose your own helper structure. Test a number alone, one operation, and nested operations with different grouping. Then explain why adding special cases for the displayed sample would miss the purpose of a recursive evaluator.
    files:
      - path: "Main.hs"
        language: haskell
        reseed: true
        content: |
          module Main where

          data Expr = Number Integer | Plus Expr Expr | Times Expr Expr
            deriving Show

          eval :: Expr -> Integer
          eval (Number n) = n
          eval (Plus left right) = eval left
          eval (Times left right) = eval left

          sample :: Expr
          sample = Times (Plus (Number 2) (Number 5)) (Number 4)

          main :: IO ()
          main = print (eval sample)
    open_file: "Main.hs"
    run_file: "Main.hs"
    tests:
      - description: "Numbers and each operation have their specified numerical meanings"
        command: 'map (\n -> eval (Number n)) [-5, 0, 8] == [-5, 0, 8] && eval (Plus (Number 3) (Number 7)) == 10 && eval (Times (Number 3) (Number 7)) == 21 && eval (Times (Number 0) (Number 8)) == 0 && eval (Times (Number (-3)) (Number 4)) == (-12) && eval (Plus (Number (-3)) (Number 4)) == 1 && eval (Number 100000000000000000001) == 100000000000000000001'
        hints:
          - text: "The payload of a Number is already a result. The payloads of Plus and Times are still expressions."
          - text: "Convert both child expressions into numerical results before applying the parent operation."
          - text: "Each compound branch has the shape `eval left <operation> eval right`; choose the operation from the constructor's meaning."
      - description: "Nested evaluation respects the grouping represented by the tree"
        command: 'eval (Times (Plus (Number 2) (Number 5)) (Number 4)) == 28 && eval (Plus (Number 2) (Times (Number 5) (Number 4))) == 22 && eval (Times (Plus (Number 1) (Number 2)) (Plus (Number 3) (Number 4))) == 21 && eval (Plus (Times (Number 2) (Number 3)) (Times (Number 4) (Number 5))) == 26 && eval (Times (Number 2) (Plus (Number 3) (Times (Number 4) (Number 5)))) == 46 && eval (Plus (Number 7) (Times (Number (-2)) (Plus (Number 4) (Number 1)))) == (-3)'
        hints:
          - text: "The same small rule must apply to a child even when that child contains another operation."
          - text: "Do not assume children are Number constructors. Recursive calls handle any valid child expression."
          - text: "The parent keeps only the children's evaluated Integer results; recursion determines how those results were produced."
    quiz:
      title: "Step 8 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "What is `Plus (Number 3) (Number 4)` before it is passed to eval?"
          options: ["An Integer equal to 7", "An Expr containing two children", "An IO action that prints 7", "A function awaiting two numbers"]
          correct_index: 1
          option_feedback:
            0: "The constructor records an addition expression. eval is what interprets that structure as arithmetic."
            2: "The expression value contains no output action. main separately prints eval's result."
            3: "Both constructor arguments are already supplied, so this is a complete value."
          explanation: "Constructors build values of the declared data type. Functions such as eval give those values the behavior required by an application."
        - type: single
          difficulty: intermediate
          question: "What is the type of `Times` before either child is supplied?"
          options: ["`Integer -> Integer -> Integer`", "`(Expr, Expr) -> Expr`", "`Expr -> Integer`", "`Expr -> Expr -> Expr`"]
          correct_index: 3
          option_feedback:
            0: "Times builds expression data; it does not directly multiply numerical arguments."
            1: "The constructor takes two curried arguments. A single tuple argument would require a tuple field in its declaration."
            2: "That is eval's type. Times accepts two expression children and constructs an expression."
          explanation: "The declaration `Times Expr Expr` produces a constructor that takes two Expr arguments and returns an Expr. Constructor application follows the same curried argument rules practiced earlier."
    solution:
      files:
        - path: "Main.hs"
          language: haskell
          content: |
            module Main where

            data Expr = Number Integer | Plus Expr Expr | Times Expr Expr
              deriving Show

            eval :: Expr -> Integer
            eval (Number n) = n
            eval (Plus left right) = eval left + eval right
            eval (Times left right) = eval left * eval right

            sample :: Expr
            sample = Times (Plus (Number 2) (Number 5)) (Number 4)

            main :: IO ()
            main = print (eval sample)
      explanation: |
        The evaluator follows the data definition: one base case and one recursive rule per compound constructor. Each parent receives the meaning of its children and combines those meanings. The tree already determines grouping, so the sample evaluates to 28. A later interpreter can reuse this structure while adding constructors and their semantic rules.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, physical pp. 21–32, 67–69, 129–140.
  # Assessment: [Midterm] F24 V1 (Public).pdf, Problem 1, p. 2: helper carrying an accumulator through a list.
  # Transfer: tutorial-created integration task; all expedition rules are supplied here, not an exam prediction.
  # Pedagogy: Make — independent integration; retrieval of variants, guards, folds,
  # immutable state, and conditional stopping. No new language mechanism is introduced.
  - title: "An Expedition Simulator"
    key: expedition
    instructions: |
      ### Why this matters

      A game can change over time without mutating a variable. A pure simulator receives the events, carries the current state through them, and returns the result. This is where the separate skills become one program.

      ### 🎯 You will learn to

      - Create a pure simulator from a complete behavioral contract.
      - Evaluate boundary cases before trusting a successful sample run.

      ### The expedition contract

      Implement `journey :: [Event] -> Integer`. The explorer starts with 100 hit points and cannot exceed 100. Every event carries a nonnegative integer. Process events in list order:

      - With more than 40 hit points, `Fight damage` subtracts the full damage and `Travel distance` restores ``distance `div` 4`` points.
      - With 40 or fewer hit points, a fight subtracts ``damage `div` 2`` points and travel restores nothing.
      - `Heal amount` restores that amount in either mode, subject to the 100-point cap.
      - Determine the mode from the health **before** the event. The resulting health determines the mode for the next event.
      - If health becomes zero or negative, the journey ends immediately with `-1`. Later healing cannot revive the explorer.
      - If no events remain, return the remaining health. An empty journey returns 100.

      ### A trace before a program

      On paper, trace `[Fight 60, Travel 40, Heal 1, Fight 3]`. Record the health before each event, the mode for that event, and the resulting health. Commit to your final answer before using **Run**. The starter is a runnable placeholder that currently ignores the events; its output is evidence about the placeholder, not the game's rules.

      ### Your turn

      This integration task combines earlier skills using the game rules above. Write the simulator using the supplied type and entry function. Allow about 15–20 minutes and work in two checkpoints:

      1. Decide how one event changes a supplied health value. Use constructor patterns and guards, and try health 40 and 41 before adding list recursion.
      2. Carry that health through the event list. Decide when to return the final health, when to process another event, and when to return the terminal result.

      A helper can receive the health that the public function's signature intentionally hides. Choose recursion or an equivalent folding strategy. Preserve `main` as a sample driver, or change its inputs while experimenting.

      Plan examples that distinguish the boundaries: health 40 versus 41, zero versus one remaining point, and healing exactly to versus beyond the cap. After your tests pass, explain why summing `eventDelta` values from step 1 cannot implement this contract: the effect of a fight or travel depends on the state reached so far.

      ### A return visit

      On another day, hide the solution and recreate one small function from this path: a list conversion, a tree traversal, or this simulator. Change the sample data and predict the result before running. That retrieval gives a better check of what stuck than rereading the completed solution.
    files:
      - path: "Main.hs"
        language: haskell
        reseed: true
        content: |
          module Main where

          data Event = Travel Integer | Fight Integer | Heal Integer
            deriving Show

          journey :: [Event] -> Integer
          journey events = 100

          main :: IO ()
          main = print (journey [Fight 60, Travel 40, Heal 1, Fight 3])
    open_file: "Main.hs"
    run_file: "Main.hs"
    tests:
      - description: "Events preserve order, use whole travel quarters, and cap healing in either mode"
        command: 'journey [] == 100 && journey [Fight 20] == 80 && journey [Fight 20, Travel 3] == 80 && journey [Fight 20, Travel 4] == 81 && journey [Fight 20, Travel 7] == 81 && journey [Fight 20, Heal 19] == 99 && journey [Fight 20, Heal 20] == 100 && journey [Fight 20, Heal 21] == 100 && journey [Fight 20, Travel 100] == 100 && journey [Fight 60, Heal 61] == 100 && journey [Heal 20, Fight 20] == 80 && journey [Fight 20, Travel 76] == 99 && journey [Fight 20, Travel 80] == 100 && journey [Fight 20, Travel 84] == 100 && journey [Travel 0, Fight 0, Heal 0] == 100 && journey [Fight 90, Heal 10] == 20'
        hints:
          - text: "The result depends on both the remaining event list and the current health. Decide where those two values live in your program."
          - text: "Separate the effect of one event from the step that continues through the remaining events. Bound each successful restoration by the maximum health."
          - text: "A recursive helper can have the shape `go currentHealth remainingEvents`; its empty-list case returns currentHealth, and its nonempty case computes the next health first."
      - description: "The defensive boundary is inclusive and mode changes take effect on the next event"
        command: 'journey [Fight 59, Travel 4] == 42 && journey [Fight 60, Travel 4] == 40 && journey [Fight 61, Travel 4] == 39 && journey [Fight 60, Fight 3] == 39 && journey [Fight 59, Fight 3] == 38 && journey [Fight 60, Heal 1, Fight 3] == 38 && journey [Fight 60, Travel 40, Heal 1, Fight 3] == 38 && journey [Fight 60, Heal 0, Fight 1] == 40 && journey [Fight 60, Fight 5] == 38 && journey [Fight 80, Heal 20, Travel 100] == 40 && journey [Fight 80, Heal 21, Travel 4] == 42'
        hints:
          - text: "Write down the health before each event. That value decides which rule the event uses."
          - text: "40 belongs to defensive mode. A heal to 41 restores ordinary mode for the following event, while an odd defensive damage amount is rounded down."
          - text: "Branch on the current health inside the Fight and Travel cases. Do not keep a permanent defensive flag once the explorer has healed above the threshold."
      - description: "Death ends the journey at zero or below and later healing cannot revive it"
        command: 'journey [Fight 99] == 1 && journey [Fight 100] == (-1) && journey [Fight 101] == (-1) && journey [Fight 100, Heal 100] == (-1) && journey [Fight 60, Fight 79] == 1 && journey [Fight 60, Fight 80] == (-1) && journey [Fight 60, Fight 81, Heal 100] == (-1) && journey [Fight 60, Fight 82] == (-1)'
        hints:
          - text: "Check for the end of the expedition when an event's result reaches the death boundary."
          - text: "Zero is already terminal. Continuing through later events would allow a forbidden revival."
          - text: "After calculating nextHealth, choose between the terminal result and processing the rest. The terminal branch must not process later healing."
    quiz:
      title: "Step 9 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: advanced
          question: "After `[Fight 60, Heal 1, Fight 3]`, what health should journey return?"
          options: ["40", "38", "39", "-1"]
          correct_index: 1
          option_feedback:
            0: "Healing from 40 to 41 leaves defensive mode. The next fight therefore subtracts the full three points."
            2: "The final fight starts at 41, so its damage is not halved. Its result is 38."
            3: "None of these events takes health to zero or below."
          explanation: "The states are 100, 40, 41, and 38. Each event reads the mode implied by its starting health."
        - type: single
          difficulty: advanced
          question: "Which list makes `min 100 (100 + foldl (+) 0 (map eventDelta events))`, using step 1's repaired eventDelta, disagree with journey?"
          options: ["`[Fight 20, Travel 4]`", "`[Fight 20, Heal 4]`", "`[Fight 60, Travel 4]`", "`[Fight 10, Fight 20]`"]
          correct_index: 2
          option_feedback:
            0: "Both calculations return 81: the travel starts at 80, so its ordinary recovery rule applies."
            1: "Both calculations return 84: healing has the same effect here and does not reach the cap."
            3: "Both calculations return 70: neither fight starts in defensive mode."
          explanation: "Fight 60 leaves 40 health, so journey gives the following travel no recovery and returns 40. The independent calculation adds one travel point and returns 41. The event's effect depends on the state reached so far."
        - type: single
          difficulty: intermediate
          question: "Two calls to journey receive the same finite event list. What follows from its pure contract?"
          options: ["They return the same result.", "The second starts at the first result.", "The second consumes no events.", "They update a shared hero record."]
          correct_index: 0
          option_feedback:
            1: "Each journey starts from the specified 100 points; there is no stored result that changes the next call."
            2: "The function does not mutate or consume the input list, so both calls receive the same data."
            3: "The simulator's contract has no externally mutable hero state."
          explanation: "The result is determined by the input and the fixed rules. Repeating the call does not change those rules or the input."
    solution:
      files:
        - path: "Main.hs"
          language: haskell
          content: |
            module Main where

            data Event = Travel Integer | Fight Integer | Heal Integer
              deriving Show

            journey :: [Event] -> Integer
            journey events = go 100 events
              where
                go hp [] = hp
                go hp (event:rest) =
                  let next = applyEvent hp event
                  in if next <= 0 then -1 else go next rest

                applyEvent hp (Travel distance)
                  | hp <= 40 = hp
                  | otherwise = min 100 (hp + distance `div` 4)
                applyEvent hp (Fight damage) =
                  hp - (if hp <= 40 then damage `div` 2 else damage)
                applyEvent hp (Heal amount) = min 100 (hp + amount)

            main :: IO ()
            main = print (journey [Fight 60, Travel 40, Heal 1, Fight 3])
      explanation: |
        The helper carries health explicitly. Each constructor describes one state transition; the recursive call passes the resulting state forward. The mode decision reads hp before the event, and the death check happens before any later event is considered. The sample trace is 100, 40, 40, 41, 38. A fold with an absorbing terminal state can also satisfy the value contract; a plain sum cannot represent its state-dependent effects.
