  - title: "Tests and Submission"
    key: tests-submission
    instructions: |
      ### Part 3: Your Tests

      Edit `test_chorus_lapilli.py`, which contains the starter's `TestChorusLapilli` class and two example tests: an empty board on refresh, and X appearing after a top-left click.

      - **Add at least three new test methods** to that class. Keep the two examples.
      - At least one new test must verify that the app prevents further moves after a win.
      - Choose other cases that test your implementation's rules, and record the scenarios, expected results, and actual results in `chorus-lapilli.txt`.

      **The supplied grader checks for three additional methods.** The original task text says these tests will not be checked, but this grader does check their number. Include this file in your submission. Counting test methods does not establish their quality or whether they pass.

      #### Run Locally

      This React workspace lets you edit the Python file, but **does not execute Python/Selenium**. You can download and submit directly from the browser; to also run your tests locally:

      1. **Set up** the [course starter](https://github.com/UCLA-CS-35L/assign3) locally, following its README and your course setup instructions. Run `./helper init` if you have not initialized it already.
      2. **Download ZIP**, then extract its contents into that local repository, replacing the corresponding project files. Keep the starter's `helper` and `requirements.txt` files. Browser Auto-save does not synchronize with local files.
      3. **Preview** with `./helper dev`. Then stop that server before the test runner starts its own server.
      4. **Test** with `./helper test` and inspect the reported results. If your course environment requires Docker, follow its setup instructions for `./helper test-docker`.

      The original handout mentions `./helper test headless` for WSL; the linked starter's current Python parser does not accept that argument. Use the command supported by your installed course version. If WSL reports line-ending errors in `helper`, install `dos2unix` and run `dos2unix helper`. For dependency-related test failures, the handout suggests `./helper clean`; this removes local dependencies, so run `./helper init` again afterward.

      ### Submission Checklist

      Choose **Download ZIP** in the top bar to save **`assign.zip`**, then upload that file directly to Gradescope by the posted course deadline. The download includes your current versions of:

      - Your source files in `src/`, plus `index.html`.
      - `package.json` and `vite.config.js` so the app can be built.
      - `tic-tac-toe.txt` and `chorus-lapilli.txt`, containing substantive, reproducible lab notes.
      - `test_chorus_lapilli.py`, with the original examples and at least three additional tests.

      The files are packaged at the ZIP's top level, with source files inside `src/`, as the grader expects. No local setup or ZIP command is needed to download your browser work. A download captures your files at that moment; **download again after editing** and upload the latest archive. Downloading does not run tests or submit your work. Incomplete work, including empty notebooks, can also be downloaded.

      If you continue editing locally, use **`./helper zip`** in the local starter repository to package those local changes instead. Read its notebook warnings and inspect the archive before uploading.

      You may submit partial work to inspect feedback and resubmit as often as the assignment allows (the supplied handout allows unlimited submissions). Select your best-scoring submission as the active one. All code remains subject to manual inspection under the course policy.

      **There is no automatic completion check in this section.** Verify the actual archive, local test results, and Gradescope feedback before considering the assignment submitted. The page does not upload or submit anything for you.

