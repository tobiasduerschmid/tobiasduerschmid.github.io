  # Pedagogy: independent assignment milestone; retain learner design decisions.
  - title: "Chorus Lapilli"
    key: chorus-lapilli
    instructions: |
      ### Part 2: Chorus Lapilli

      Adapt your tic-tac-toe game into **Chorus Lapilli** ("dancing grains"), a variant of the ancient Roman game terni lapilli. Keep your implementation in `src/App.jsx` and record the work in `chorus-lapilli.txt`.

      #### Game Rules

      - **Board and objective:** two players, X and O, alternate turns on a 3×3 board. Three of your pieces in a row, column, or diagonal wins. X plays first.
      - **Placement:** for each player's first three turns, place a piece on an empty square. A placement can win before both players have placed all three pieces.
      - **Movement:** once a player has three pieces, that player must move an existing piece to an adjacent empty square instead of adding another. Adjacency includes up, down, left, right, and diagonals. Each player retains exactly three pieces in this phase.
      - **Center constraint:** if the player whose turn it is has three pieces and occupies the center, the move must **either win or vacate the center**. This restriction applies to that player's move, not to an opponent who does not occupy the center.
      - **Game over:** after either player wins, further clicks must leave the board unchanged.

      #### Interaction Contract

      From a player's fourth turn onward (normally after six placements), a move uses **two clicks**: select one of that player's pieces, then select its destination. An invalid two-click attempt must leave the board and turn unchanged and clear the attempted selection, ready for a new move. Drag-and-drop is not supported by the grader. Do not use alert dialogs or other pop-up windows.

      The grader finds nine `button` elements whose class contains `square`. Keep them in row-major document order. Their visible text should be blank, X, or O; place instructions, selection messages, and coordinates in accessible labels or outside the buttons.

      | Board row | Left column | Center column | Right column |
      | --- | --- | --- | --- |
      | Top | 0 | 1 | 2 |
      | Middle | 3 | 4 | 5 |
      | Bottom | 6 | 7 | 8 |

      #### Notebook and Checks

      1. **Implement** the variant and describe each significant change and observation in `chorus-lapilli.txt`. Include enough steps for someone else to recreate your game.
      2. **Exercise** both legal moves and rejected attempts yourself. Check that invalid attempts do not give the other player a turn, and that a new two-click attempt works afterward.
      3. **Run Test My Work** to exercise nine independent examples of the game rules. Each scenario starts with a fresh preview; tests do not modify your source files. Failures identify a rule to investigate. Reproduce the attempt, compare the expected and actual board, then revise and rerun your code. You can revisit any section without passing them.

      **These public checks are practice feedback, not a Gradescope score.** They use different scenarios from the Gradescope tests. Use the rules to design your implementation and your own tests; do not special-case these examples. They do not run your Python tests, inspect notebook quality, validate a Vite build or submission ZIP, or apply deadline penalties. Passing a finite set of scenarios does not establish correctness for every possible game. Continue with the testing and submission requirements in the next section.

    files: *assignment_files
    react_files: ["src/styles.css", "src/App.jsx", "src/main.jsx"]
    open_file: "src/App.jsx"
    react_reset_between_tests: true
    tests:
      - description: "Placement alternates players; occupied squares preserve the turn"
        command: |
          const tiles = () => Array.from(frame.contentDocument.querySelectorAll('button[class*="square"]'));
          const click = index => frame.contentWindow.ReactDOM.flushSync(() => tiles()[index].click());
          const expectBoard = (expected, message) => {
            const board = tiles();
            assert(board.length === 9, 'Render nine square buttons in row-major order.');
            const actual = board.map(tile => {
              const text = tile.innerText.trim();
              return text === '' ? '-' : /^[Xx]$/.test(text) ? 'X' : /^[0Oo]$/.test(text) ? 'O' : '?';
            }).join('');
            assert(actual === expected, message + ': expected ' + expected + ', got ' + actual);
          };
          expectBoard('---------', 'A fresh board must be empty');
          [8].forEach(click);
          expectBoard("--------X", "X opens in the bottom-right corner");
          [8].forEach(click);
          expectBoard("--------X", "O cannot overwrite X or lose the turn");
          [3].forEach(click);
          expectBoard("---O----X", "O still places after the rejected click");
          [8].forEach(click);
          expectBoard("---O----X", "X cannot overwrite an occupied square either");
          [1].forEach(click);
          expectBoard("-X-O----X", "X places on 1");
          [6].forEach(click);
          expectBoard("-X-O--O-X", "O places on 6");
          [0].forEach(click);
          expectBoard("XX-O--O-X", "X places on 0");
          [5].forEach(click);
          expectBoard("XX-O-OO-X", "O places on 5");
      - description: "Movement preserves three pieces through horizontal, vertical, and diagonal moves"
        command: |
          const tiles = () => Array.from(frame.contentDocument.querySelectorAll('button[class*="square"]'));
          const click = index => frame.contentWindow.ReactDOM.flushSync(() => tiles()[index].click());
          const expectBoard = (expected, message) => {
