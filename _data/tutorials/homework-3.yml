  - title: "Tic-Tac-Toe"
    key: tic-tac-toe
    instructions: |
      ### Your Assignment

      Build a simple interactive React game, then document how someone else can reproduce it. This is an **assignment workspace**: you choose the implementation. There are no quizzes or supplied solutions. You should already know JavaScript functions and arrays, HTML, and basic React components and state; the [React Essentials tutorial](/SEBook/tools/react-tutorial) is available for review.

      All three sections share your files. **Auto-save** keeps edits in this browser when enabled; keep your own local backup too. **Refresh** restarts the preview with your current code. **Reset Current Step restores the shared starter files**, including both notebooks, so use it only when you intend to discard that work.

      **Download ZIP** in the top bar saves your current files as `assign.zip`, ready to upload to Gradescope. It includes your latest edits even when Auto-save is off. Download again after making further changes.

      ### Part 1: Tic-Tac-Toe

      1. **Build** the game from the [React tic-tac-toe tutorial](https://react.dev/learn/tutorial-tic-tac-toe). The environment is ready here; skip that tutorial's setup instructions. Put your game code in `src/App.jsx`. Keep the default export named `App`; `src/main.jsx` mounts it for you.
      2. **Record** significant actions and outcomes in `tic-tac-toe.txt` as you work. Include setup/configuration, code changes, observations, and the reasons for decisions. Write a lab notebook that someone else could follow, rather than a transcript of commands.
      3. **Review** your own source before adapting it. Identify how components, state, events, and rendering fit together. Use the [React learning reference](https://react.dev/learn) to investigate unfamiliar ideas, including lists, JSX, and state preservation.

      This section has no automatic completion check. Play your game: try different winning rows, columns, and diagonals, and verify that a finished game stops accepting moves. Time travel is optional for the final assignment.

      ### Working in This Browser

      - Edit a file, then choose **Refresh** above the preview to run the current version. The preview starts as an assignment placeholder; constructing the board is your work.
      - Use `React.useState(...)` or declare `const { useState } = React;` in your app. The preview supplies React and ReactDOM globally and removes single-line imports/exports; it does not resolve arbitrary npm packages or module aliases. Keep imports on single lines.
      - The preview uses React 18, while the course starter uses React 19 with Vite. Use the shared basic APIs for this assignment. Verify the downloaded code in Vite or through Gradescope.
      - The supplied `src/styles.css` provides board styling, including keyboard focus and both themes. Use real buttons with accessible names such as their row, column, and current value; keep empty squares visually empty. Announce turn, selection, invalid-move, and winner messages through a status region.

      ### Local Starter

      Use the [Assignment 3 starter repository](https://github.com/UCLA-CS-35L/assign3) for the local testing and submission tools. This workspace adapts its file structure and includes its two-example Python test file. Local commands such as `./helper dev` run in your computer's terminal, not in this preview.

