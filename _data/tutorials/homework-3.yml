            }).join('');
            assert(actual === expected, message + ': expected ' + expected + ', got ' + actual);
          };
          expectBoard('---------', 'A fresh board must be empty');
          [6].forEach(click);
          expectBoard("------X--", "X places on 6");
          [0].forEach(click);
          expectBoard("O-----X--", "O places on 0");
          [1].forEach(click);
          expectBoard("OX----X--", "X places on 1");
          [8].forEach(click);
          expectBoard("OX----X-O", "O places on 8");
          [5].forEach(click);
          expectBoard("OX---XX-O", "X places on 5");
          [3].forEach(click);
          expectBoard("OX-O-XX-O", "O places on 3");
          [2, 4].forEach(click);
          expectBoard("OX-O-XX-O", "A fourth piece cannot be placed on an empty square");
          [5, 2].forEach(click);
          expectBoard("OXXO--X-O", "X moves vertically");
          [8, 7].forEach(click);
          expectBoard("OXXO--XO-", "O moves horizontally");
          [6, 4].forEach(click);
          expectBoard("OXXOX--O-", "X moves diagonally into the center");
          [3, 6].forEach(click);
          expectBoard("OXX-X-OO-", "O can move while X owns the center");
          [4, 8].forEach(click);
          expectBoard("OXX---OOX", "X vacates the center diagonally");
          [7, 4].forEach(click);
          expectBoard("OXX-O-O-X", "O can enter the center");
      - description: "Invalid sources, occupied destinations, and distant moves leave the next attempt usable"
        command: |
          const tiles = () => Array.from(frame.contentDocument.querySelectorAll('button[class*="square"]'));
          const click = index => frame.contentWindow.ReactDOM.flushSync(() => tiles()[index].click());
          const expectBoard = (expected, message) => {
            const board = tiles();
            assert(board.length === 9, 'Render nine square buttons in row-major order.');
            const actual = board.map(tile => {
              const text = tile.innerText.trim();
              return text === '' ? '-' : /^[Xx]$/.test(text) ? 'X' : /^[0Oo]$/.test(text) ? 'O' : '?';
            }).join('');
            assert(actual === expected, message + ': expected ' + expected + ', got ' + actual);
          };
          expectBoard('---------', 'A fresh board must be empty');
          [0].forEach(click);
          expectBoard("X--------", "X places on 0");
          [1].forEach(click);
          expectBoard("XO-------", "O places on 1");
          [5].forEach(click);
          expectBoard("XO---X---", "X places on 5");
          [6].forEach(click);
          expectBoard("XO---XO--", "O places on 6");
          [7].forEach(click);
          expectBoard("XO---XOX-", "X places on 7");
          [8].forEach(click);
          expectBoard("XO---XOXO", "O places on 8");
          [0, 1].forEach(click);
          expectBoard("XO---XOXO", "Cannot move onto an opponent");
          [5, 0].forEach(click);
          expectBoard("XO---XOXO", "Cannot move onto your own piece");
          [0, 2].forEach(click);
          expectBoard("XO---XOXO", "Cannot jump across an empty intermediate square");
          [5, 6].forEach(click);
          expectBoard("XO---XOXO", "Consecutive indices on different rows are not adjacent");
          [1, 4].forEach(click);
          expectBoard("XO---XOXO", "Cannot move an opponent piece");
          [2, 4].forEach(click);
          expectBoard("XO---XOXO", "Cannot move from an empty square");
          [5, 4].forEach(click);
          expectBoard("XO--X-OXO", "A fresh X move succeeds after all rejected attempts");
          [8, 5].forEach(click);
          expectBoard("XO--XOOX-", "The next turn belongs to O");
      - description: "X must vacate the center when no win results"
        command: |
          const tiles = () => Array.from(frame.contentDocument.querySelectorAll('button[class*="square"]'));
          const click = index => frame.contentWindow.ReactDOM.flushSync(() => tiles()[index].click());
          const expectBoard = (expected, message) => {
            const board = tiles();
            assert(board.length === 9, 'Render nine square buttons in row-major order.');
            const actual = board.map(tile => {
              const text = tile.innerText.trim();
              return text === '' ? '-' : /^[Xx]$/.test(text) ? 'X' : /^[0Oo]$/.test(text) ? 'O' : '?';
            }).join('');
            assert(actual === expected, message + ': expected ' + expected + ', got ' + actual);
          };
          expectBoard('---------', 'A fresh board must be empty');
          [4].forEach(click);
          expectBoard("----X----", "X places on 4");
          [0].forEach(click);
          expectBoard("O---X----", "O places on 0");
          [2].forEach(click);
          expectBoard("O-X-X----", "X places on 2");
          [8].forEach(click);
          expectBoard("O-X-X---O", "O places on 8");
          [3].forEach(click);
          expectBoard("O-XXX---O", "X places on 3");
          [7].forEach(click);
          expectBoard("O-XXX--OO", "O places on 7");
          [3, 1].forEach(click);
          expectBoard("O-XXX--OO", "X cannot retain the center without winning");
          [4, 1].forEach(click);
          expectBoard("OXXX---OO", "X can restart the attempt and vacate the center");
          [7, 6].forEach(click);
          expectBoard("OXXX--O-O", "O receives the turn only after the legal move");
      - description: "The center constraint also applies to O"
        command: |
