    quiz:
      title: Step 6 — Knowledge Check
      min_score: 0.6666666666666666
      shuffle: true
      questions:
        - type: single
          difficulty: intermediate
          question: A Python queue stores arrivals in order as `["Zoe", "Ari", "Mika"]`. One seat opens
            under a first-in, first-out policy. What should the resulting state be?
          options:
            - Admit Ari; leave Zoe, Mika waiting.
            - Admit Mika; leave Zoe, Ari waiting.
            - Admit Zoe; leave Ari, Mika waiting.
            - Admit Zoe; leave Mika, Ari waiting.
          correct_index: 2
          option_feedback:
            0: Alphabetical order is different from arrival order.
            1: Mika joined last; admitting that student first implements last-in, first-out.
            3: The remaining students must retain their arrival order for the next allocation.
          explanation: First-in, first-out governs both who leaves next and the order preserved for later
            seats. Names themselves should not affect admission.
        - type: single
          difficulty: intermediate
          question: A Python waitlist test has just one waiting student when a seat opens. Why is that test
            insufficient to establish first-in, first-out behavior?
          options:
            - One waiting student has no arrival time to compare.
            - The test proves only that the course capacity is one.
            - A passing test never provides useful behavioral evidence.
            - Removing from either end gives the same student.
          correct_index: 3
          option_feedback:
            0: The arrival still has an order; the issue is that front and back refer to the same element.
            1: The number waiting does not establish the course’s total capacity.
            2: The test checks allocation in that case, but does not distinguish the competing ordering
              rules.
          explanation: Choose a test with at least two distinct waiting students to distinguish front removal
            from back removal. Also check the remaining order after allocation.
        - type: single
          difficulty: intermediate
          question: A Python event trace shows the expected waitlist immediately before an allocation, and
            the wrong student enrolled immediately afterward. What does that evidence narrow the investigation
            to?
          options:
            - The allocation transition between those snapshots.
            - Every event earlier in the trace equally.
            - The final assertion that reported the mismatch.
            - The spelling of the enrolled students’ names.
          correct_index: 0
          option_feedback:
            1: Earlier events may deserve checking, but these adjacent states give a more specific place
              to investigate first.
            2: The assertion observes a result; it did not perform the allocation.
            3: The policy concerns arrival order. The evidence does not point to names as the cause.
          explanation: Compare the operation executed between a valid before-state and an invalid after-state
            against the policy. This localizes a transition without claiming that every other part of the
            program is correct.

  # Pedagogy: Interleave tool choices, help-seeking, and observer effects without another large codebase.
  - title: Debugging Triage
    instructions: |
      ### Why this matters

      A useful next action depends on the evidence available. Some failures call for a local trace; others need environment details, a log, or careful interpretation of external advice.

      ### 🎯 You will learn to

      - Choose a next experiment that distinguishes plausible causes.
      - Prepare a focused, anonymized error search or help request.
      - Account for observation changing a failure's timing.

      ### Triage and help-seeking practice

      **Exploratory step, about 8 minutes:** write short answers in `notes.txt`, then take the knowledge check. There is no runnable program in this step and no automatic assessment of your notes.

      1. **Prepare a search.** A library reports `FileNotFoundError: [Errno 2] No such file or directory: '/home/maya/private-club/exports/roster.csv'` when an import starts. Draft a search query or help request retaining the exception, operation, relevant path structure, Python/library versions, working directory, and reproduction steps. Replace personal/project identifiers and omit private data. Mark unknown environment facts as unknown; do not invent them.
      2. **Evaluate advice.** One suggestion says “create an empty file at that path”; another says “compare the configured input path and working directory with the report.” Choose an observation that would distinguish a missing export from a wrong directory. Explain why making the exception disappear would not establish that the correct data was imported. If online, compare a relevant documentation/search result with your hypothesis and record its source; offline, use these two suggestions. Treat search or AI output as a proposed explanation to verify. If evidence is still missing, draft a specific question for a teammate with your reproduction and attempted checks.
      3. **Plan for an intermittent failure.** A timing-dependent failure disappears with breakpoints. This is a **heisenbug**: observation changes or hides the behavior. Propose a comparison of runs with and without tracing, controlling inputs, seed, configuration, and versions. Choose a small log of events or state transitions to collect. Explain why a logged successful run cannot prove the original failure fixed; logs can affect timing too. Do not simulate a race with arbitrary sleeps in this tutorial.
      4. **Choose the cheapest useful move.** For each quiz scenario, identify the question the tool would answer and one result that would change your hypothesis. A focused print, assertion, log, or debugger pause can all be appropriate. If stuck, explain expected and actual behavior line by line to a partner or in writing, then choose a new experiment.

      **Lecture connection:** this tutorial practices the debugging portion of Lecture 10. The [Advanced Git tutorial](/SEBook/tools/git-advanced-tutorial) covers executing history tools such as `git blame` and `git bisect`; a changed line is a lead to investigate, not proof that its author caused the failure.
    files:
      - path: notes.txt
        language: plaintext
        content: |
          Triage notes — short answers, no runnable program.

          1. Sanitized query/help request and missing facts:

          2. Advice to investigate; prediction, observation, and source (if used):

          3. Intermittent failure: controlled comparison and minimal observation:

          4. One quiz choice: uncertainty, tool, result that would change my mind:
        reseed: true
    open_file: notes.txt
    require_tests: false
    solution:
      explanation: |
        There is no universal one-to-one mapping between a symptom and a tool. A useful proposal names the uncertainty, the observation that would distinguish explanations, and a practical way to obtain it.

        | Situation | Defensible first investigation |
        | --- | --- |
        | Suspected boundary behavior | Compare neighboring inputs; pause at the decision and inspect the values used there. |
        | One suspicious item in a long stream | Choose a condition that selects relevant executions, or log the relevant fields with a filter. |
        | A wrong later state | Compare earlier state transitions; use recorded history when it contains the needed evidence, or reproduce with focused observations. |
        | Unexplained shared-state change | Compare which references reach the same object, then inspect the operation that mutates or rebinds them. |
        | An intermittent failure | Record the environment and history needed to reproduce it, including relevant timing or nondeterminism. |
        | A difficult investigation losing direction | Write the current hypothesis, prediction, observation, and conclusion; select a test that could reject the hypothesis. |

        Other tools are valid when the explanation identifies how they answer the question. Purposeful logging is an observation technique, not inherently guesswork. Repeated random edits without a predicted consequence do not become systematic merely because a debugger is open.

        For the file error, a focused query can retain `Python FileNotFoundError Errno 2 input path working directory` while replacing the personal directory with a placeholder. A report should add the actual versions, configured path, working directory, triggering steps, and expected versus observed result, marking unavailable facts as unknown. Check whether the expected export exists and which path the process resolves before choosing a repair. An empty replacement file can suppress the exception while importing no useful records. Verify any external suggestion with the reproduction and retain its source.

        For the intermittent case, compare repeated runs under the same known inputs and environment, varying observation deliberately. A small event log may reveal a state transition with less overhead than pausing at every line, but logging can also change timing. Neither failure to reproduce nor a successful logged run establishes a repair. Ask for the missing environment or event sequence when the existing evidence cannot distinguish explanations.
    quiz:
      title: Step 7 — Knowledge Check
      min_score: 0.75
      shuffle: true
      questions:
        - type: single
          difficulty: intermediate
          question: A Python library reports an unfamiliar error containing a private project path. Which
            plan uses outside help responsibly?
          options:
            - Post the unedited log and apply the first suggested command.
            - Redact private details, search the error, and test relevant advice.
            - Search only “Python is broken” to avoid mentioning the library.
            - Keep the error private by replacing its type and message entirely.
          correct_index: 1
          option_feedback:
            0: Private details need not be shared, and advice may depend on a different version or environment.
            2: Removing the technical error and library context makes useful matches less likely.
            3: Preserve the technical meaning while removing project-specific or sensitive details; otherwise
              a helper cannot reason about the same error.
          explanation: Keep the error type, relevant message, library version, and a minimal sanitized example.
            Evaluate suggestions against your environment and test them safely. Ask a teammate with the
            evidence and attempted checks when that would help.
        - type: single
          difficulty: intermediate
          question: A Python test passes locally but fails on an autograder. You have the failing input
            and a traceback. What is the most useful next investigation?
          options:
            - Discard the traceback until local reproduction succeeds.
            - Assume the grader is wrong because local tests pass.
            - Compare the input and environment with the local run.
            - Change the test expectation to match the remote result.
          correct_index: 2
          option_feedback:
            0: The remote failure and traceback are already evidence, even before a local reproduction is
              available.
            1: Different inputs, versions, settings, or dependencies can explain a disagreement.
            3: The expected behavior comes from the contract, not whichever result occurred remotely.
          explanation: Use available evidence to narrow the differences and build a reproduction where practical.
            Debugging can begin with remote logs; a local failure is helpful, not a prerequisite for every
            useful observation.
        - type: single
          difficulty: intermediate
          question: After a Python repair, a previously passing test fails. What does this result justify
            doing next?
          options:
            - Declare the new test failure unrelated without investigating.
            - Change its expected value because the old behavior is obsolete.
            - Declare the repair correct because its original test passes.
            - Investigate a possible regression against the stated contract.
          correct_index: 3
          option_feedback:
            0: The timing makes a regression plausible; evidence is needed before dismissing it.
            1: A test expectation should change only when the intended behavior changes or the expectation
              was wrong.
            2: The original reproduction checks one requirement; other required behaviors still matter.
          explanation: The new failure is a regression signal, not proof of a particular cause. Compare
            the change, test contract, and execution evidence before deciding how to repair it.
        - type: single
          difficulty: intermediate
          question: A Python failure disappears whenever a breakpoint pauses a timing-sensitive operation.
            Which investigation best accounts for this behavior?
          options:
            - Treat debugger success as proof that the failure is repaired.
            - Add arbitrary delays until the ordinary run also passes.
            - Pause every statement to make the failing timing easier to preserve.
            - Compare conditions and collect targeted logs without pausing.
          correct_index: 3
          option_feedback:
            0: Observation can change timing, so success under the debugger does not establish a repair.
            1: A delay may mask the timing window without explaining or fixing the underlying interaction.
            2: More pauses further alter the execution timing you are trying to observe.
          explanation: A failure that changes when investigated is often called a heisenbug. Record inputs,
            configuration, and timing clues; less disruptive observation may help, though logging itself
            can also affect timing.

  # Pedagogy: Independent near transfer: choose the experiment and create a regression test before comparing patterns.
  - title: Independent Case — Article Tags
    instructions: |
      ### Why this matters

      An independent case shows whether you can select evidence and justify a repair when the fault is not labeled. A small, reusable record lets someone else check your conclusion.

      ### 🎯 You will learn to

      - Investigate unfamiliar code with a self-chosen experiment.
      - Separate a repaired symptom from a repaired cause.
      - Verify and explain a fix with a new regression example.

      ### Independent Case: Article Tags

      `tagger.py` reads a nonempty file of `Title|tag` records and returns the most frequent tag in uppercase.

      - Case and whitespace surrounding a tag do not distinguish tags. Spaces **inside** a tag remain meaningful.
      - Each record has a title, one separator, and a nonempty tag; the final line may lack a newline.
      - Test inputs have one unique most frequent tag. Ties, empty files, and malformed records are outside this exercise.
      - Preserve the file's content. Repair the program while retaining the supplied test expectations.

      Use **Test** to run `test_tagger.py` and **Debug** if that supports your chosen experiment. The tools are available; the investigation sequence is yours.

      ### Evidence to leave behind

      Use `debugging_log.md` as a short report, not an essay:

      - A reproducible expected/actual mismatch with relevant environment and inputs.
      - A hypothesis, predicted observation, chosen experiment, actual observation, and conclusion. Include one observation that could have refuted the hypothesis.
      - The causal link from faulty code to incorrect state to observed failure.
      - A focused repair and a new pytest reproduction using different data. Verify it fails for the original fault and passes after the repair; keep the original tests too.
      - A nearby case, regression results, and a brief fix/commit-message draft.

      Run **Test My Work** for independent behavioral checks. Use the failed criterion and **Hints** if needed. These checks do not grade your report or prove that you used a particular tool. Use the report to check whether each conclusion is supported by an observation; ask a peer or instructor to review uncertain links.

      **After the repair:** identify which earlier case shares a causal pattern, cite your evidence, and name a difference in the input source. Then explain the repair to a partner or write it without looking at the implementation. Choose one similar situation to revisit in your next study session.
    files:
      - path: tagger.py
        language: python
        content: |
          """Article tag analyzer.

          Reads a file where each line is `"Title|tag"`, returns the most
          common tag (uppercased) across all articles.

          There is a bug. Both tests in test_tagger.py fail.
          """

          from collections import Counter


          def top_tag(articles_path: str) -> str:
              counts: Counter[str] = Counter()
              with open(articles_path) as f:
                  for line in f:
                      title, tag = line.split("|", 1)
                      counts[tag.upper()] += 1
              return counts.most_common(1)[0][0]
      - path: articles.txt
        language: plaintext
        content: |
          Why Python rocks|python
          JavaScript closures|javascript
          Decorators in Python|python
          Async Python explained|python
          Rust intro|rust
      - path: test_tagger.py
        language: python
        content: |
          from tagger import top_tag


          def test_python_is_most_common() -> None:
              # Three of five articles are tagged "python", so PYTHON should win.
              assert top_tag('/tutorial/articles.txt') == "PYTHON"


          def test_no_whitespace_in_result() -> None:
              result = top_tag('/tutorial/articles.txt')
              assert result == result.strip(), \
                  f"Result {result!r} contains whitespace — the result must satisfy the tag contract."
      - path: debugging_log.md
        language: markdown
        content: |
          # Article-tag investigation

          Write your own concise reproduction, experiment, conclusion, repair,
          and verification record. Include a possible refutation, a new regression
          example, and the limits of your evidence.
        reseed: true
    open_file: tagger.py
    run_file: test_tagger.py
    solution:
      files:
        - path: tagger.py
          language: python
          content: |
            """Article tag analyzer — fixed."""

            from collections import Counter


            def top_tag(articles_path: str) -> str:
                counts: Counter[str] = Counter()
                with open(articles_path) as f:
                    for line in f:
                        title, tag = line.split("|", 1)
                        counts[tag.strip().upper()] += 1
                return counts.most_common(1)[0][0]
      explanation: |
        **Diagnosis:** iterating over a text file usually yields each line with its line ending. In the sample, a tag such as `'python\n'` becomes `'PYTHON\n'`, which violates the required result format. With mixed case and surrounding whitespace, equivalent tag spellings can also be counted separately.

        The displayed repair canonicalizes each extracted tag with `tag.strip().upper()` before adding it to the counter. An equivalent normalization or counting approach is valid. Under this exercise's full contract, removing only a trailing newline is insufficient: surrounding spaces and tabs must also be ignored, while spaces inside a tag remain meaningful.

        Cleaning only the returned winner can conceal the newline in the original example but still select the wrong winner when equivalent spellings were counted separately. A useful regression input gives one tag several equivalent spellings that collectively outnumber a competing tag. Also check a single article with no final newline and a tag containing an internal space.

        This asks learners to apply the ledger's representation lesson to a new file format. Correct code is evidence for the stated behavioral checks. A note explaining the hypothesis and comparison is reviewable evidence of reasoning, not proof of an unaided investigation or durable transfer. Revisiting a different problem after a delay would provide a separate learning check.
    tests:
      - description: The most frequent tag is returned in canonical form
        command: |
          import runpy
          from pathlib import Path
          from tempfile import TemporaryDirectory
          top_tag = runpy.run_path('/tutorial/tagger.py')['top_tag']
          with TemporaryDirectory() as directory:
              fixture = Path(directory) / 'articles.txt'
              fixture.write_text('One|jazz\nTwo|rock\nThree|jazz\n', encoding='utf-8')
              assert top_tag(str(fixture)) == 'JAZZ', 'Return the most frequent tag in the required form.'
              fixture.write_text('Single|folk', encoding='utf-8')
              assert top_tag(str(fixture)) == 'FOLK', 'Handle a single article with no final newline.'
        hints:
          - title: Inspect the counted labels
            text: Open or restore top_tag. Compare a tag as read, as counted, and as returned, using representations
              that show surrounding characters. Include a file whose last line has no newline.
            condition: &top_tag_orientation 'code_matches: /^(?:(?![\s\S]*(?:^|\n)def\s+top_tag\s*\()|(?=[\s\S]*(?:^|\n)def\s+top_tag\s*\((?:(?!\n(?:def|class)\s)[\s\S])*?counts\[\s*tag.upper\(\s*\)\s*\]\s*\+=\s*1(?:(?!\n(?:def|class)\s)[\s\S])*?return\s+counts.most_common\(\s*1\s*\)\[\s*0\s*\]\[\s*0\s*\]\s*(?:\n|$)))[\s\S]*$/'
          - title: Check before the return
            text: A cleaned-looking result can still have been selected from incorrect counts. Compare the
              groups used to choose a winner before judging its returned spelling.
            condition: &top_tag_partial 'code_matches: /^(?=[\s\S]*(?:^|\n)def\s+top_tag\s*\()(?![\s\S]*(?:^|\n)def\s+top_tag\s*\((?:(?!\n(?:def|class)\s)[\s\S])*?counts\[\s*tag.upper\(\s*\)\s*\]\s*\+=\s*1(?:(?!\n(?:def|class)\s)[\s\S])*?return\s+counts.most_common\(\s*1\s*\)\[\s*0\s*\]\[\s*0\s*\]\s*(?:\n|$))(?=[\s\S]*(?:^|\n)def\s+top_tag\s*\((?:(?!\n(?:def|class)\s)[\s\S])*?return[^\n]*\.(?:strip|lstrip|rstrip)\()[\s\S]*$/'
          - title: Separate winner and representation
            text: First establish which logical tag occurs most often; then inspect the returned representation.
              Trace the first boundary where your expected label and the program’s label differ.
            condition: &top_tag_developed 'code_matches: /^(?=[\s\S]*(?:^|\n)def\s+top_tag\s*\()(?![\s\S]*(?:^|\n)def\s+top_tag\s*\((?:(?!\n(?:def|class)\s)[\s\S])*?counts\[\s*tag.upper\(\s*\)\s*\]\s*\+=\s*1(?:(?!\n(?:def|class)\s)[\s\S])*?return\s+counts.most_common\(\s*1\s*\)\[\s*0\s*\]\[\s*0\s*\]\s*(?:\n|$))(?![\s\S]*(?:^|\n)def\s+top_tag\s*\((?:(?!\n(?:def|class)\s)[\s\S])*?return[^\n]*\.(?:strip|lstrip|rstrip)\()[\s\S]*$/'
      - description: Equivalent tag spellings contribute to the same count
        command: |
          import runpy
          from pathlib import Path
          from tempfile import TemporaryDirectory
          top_tag = runpy.run_path('/tutorial/tagger.py')['top_tag']
          with TemporaryDirectory() as directory:
              fixture = Path(directory) / 'articles.txt'
              fixture.write_text('One|rust\nTwo|rust\nThree|rust\nFour| python\nFive|PYTHON \nSix|Python\t\nSeven|python', encoding='utf-8')
              assert top_tag(str(fixture)) == 'PYTHON', 'Select the winner after combining equivalent tags.'
        hints:
          - title: Compare equivalent input records
            text: Open or restore top_tag. Create several allowed spellings of one tag and a competing tag.
              Predict the logical counts before running the analyzer.
            condition: *top_tag_orientation
          - title: Look at the grouping decision
            text: Observe the counts before the winner is selected. Would equivalent spellings sharing their
              contributions change which group wins? Cleaning only the displayed winner cannot answer that
              question.
            condition: *top_tag_partial
          - title: Test a winner that depends on grouping
            text: Choose input where no one spelling wins alone, but the equivalent spellings together outnumber
              a competitor. Record the groups and explain the selected winner.
            condition: *top_tag_developed
      - description: Spaces inside a tag remain part of its name
        command: |
          import runpy
          from pathlib import Path
          from tempfile import TemporaryDirectory
          top_tag = runpy.run_path('/tutorial/tagger.py')['top_tag']
          with TemporaryDirectory() as directory:
              fixture = Path(directory) / 'articles.txt'
              fixture.write_text('One| deep learning \nTwo|DEEP LEARNING\nThree|python', encoding='utf-8')
              assert top_tag(str(fixture)) == 'DEEP LEARNING', 'Preserve meaningful spaces inside a tag.'
        hints:
          - title: Compare outer and inner characters
            text: Open or restore top_tag. Use a tag containing a space inside its name and additional whitespace
              around it. Mark which characters belong to the name under the contract.
            condition: *top_tag_orientation
          - title: Check the scope of cleanup
            text: Inspect the selected label before and after your output transformation. Does that treatment
              distinguish surrounding whitespace from meaningful characters inside the name?
            condition: *top_tag_partial
          - title: Trace one multiword label
            text: Track a multiword tag through reading, grouping, and returning. Identify the first stage
              that changes an internal space, and explain whether the contract permits that change.
            condition: *top_tag_developed
    quiz:
      title: Step 8 — Knowledge Check
      min_score: 0.75
      shuffle: true
      questions:
        - type: single
          difficulty: intermediate
          question: A Python importer counts labels. The format says surrounding whitespace is insignificant.
            Its raw input contains `"robotics\n"` and `"robotics"`, which appear as separate dictionary
            keys. What is the relevant debugging issue?
          options:
            - The arithmetic must compensate for a wrong final total.
            - The input boundary can violate a representation contract.
            - Queued items must be admitted in reverse arrival order.
            - Recursive code must be replaced with an iterative loop.
          correct_index: 1
          option_feedback:
            0: Changing a final count or balance would leave the inconsistent internal values in place.
            2: The observed discrepancy is between string values, independent of arrival order.
            3: No recursion is needed for this failure; the relevant similarity is how input becomes internal
              data.
          explanation: As in the ledger investigation, compare external values with the promised internal
            representation. The correct normalization depends on the format’s contract, not merely on seeing
            whitespace.
        - type: single
          difficulty: intermediate
          question: A Python repair passes its reproduction and regression checks. Which maintenance note
            best explains why the change should be preserved?
          options:
            - “Fixed the issue; the program now has no bugs.”
            - “Changed three lines and removed one temporary print.”
            - “Newlines split label counts; normalize labels when loading.”
            - “Used the debugger and then clicked the test button.”
          correct_index: 2
          option_feedback:
            0: Passing tests supports the cases checked, not the claim that no bugs remain; the note omits
              the cause.
            1: Edit counts do not explain the violated requirement or the reason for the repair.
            3: The tools used do not explain what behavior was wrong or why the fix works.
          explanation: Document the cause and restored contract in the bug report and commit message, with
            a focused code comment when useful. Keep the reproduction test to catch the same failure after
            later changes.
        - type: single
          difficulty: intermediate
          question: You recognize a Python failure that resembles an earlier whitespace bug. Which action
            would test that recognition instead of treating resemblance as proof?
          options:
            - Inspect the actual value and compare it with the format contract.
            - Apply the earlier edit to every string before inspecting any data.
            - Assume the earlier explanation also identifies the same faulty line.
            - Skip regression checks because this bug family is already familiar.
          correct_index: 0
          option_feedback:
            1: Whitespace may be meaningful in some fields. Broad normalization can change valid data.
            2: Similar symptoms can have different causes and occur at different locations.
            3: A familiar repair can still introduce regressions or fail to address this input.
          explanation: A familiar pattern suggests a hypothesis. Inspecting the real value and its contract
            tests that hypothesis before choosing a repair.
        - type: single
          difficulty: intermediate
          question: A Python test shows that a total is wrong. A developer then traces intermediate values,
            explains the cause, and repairs the calculation. How do testing and debugging contribute here?
          options:
            - Testing repairs the fault; debugging reports the final mismatch.
            - Testing checks behavior; debugging explains and repairs the fault.
            - Testing and debugging both mean rerunning the same test unchanged.
            - Testing proves all inputs correct; debugging is unnecessary afterward.
          correct_index: 1
          option_feedback:
            0: The test reveals a discrepancy; the investigation and code change address its cause.
            2: Repeating a test checks whether behavior changed, but does not by itself explain the cause.
            3: Tests cover chosen cases and can miss faults; passing results do not prove universal correctness.
          explanation: Testing provides evidence of behavior against expectations. Debugging uses evidence
            to locate and explain a fault, make a repair, and verify it with tests and other relevant checks.
