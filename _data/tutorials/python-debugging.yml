      files:
        - path: ledger.py
          language: python
          content: |
            """Ledger reconciliation — bug fixed."""

            import csv
            import logging
            from dataclasses import dataclass
            from decimal import Decimal

            logger = logging.getLogger(__name__)

            VALID_KINDS: set[str] = {"DEPOSIT", "WITHDRAWAL", "REFUND", "REVERSAL", "FEE"}


            @dataclass(frozen=True)
            class Transaction:
                id: str
                account: str
                kind: str
                amount_cents: int


            def parse_money(text: str) -> int:
                return int(Decimal(text) * 100)


            def load_transactions(path: str) -> list[Transaction]:
                transactions: list[Transaction] = []
                with open(path, newline="", encoding="utf-8") as csv_file:
                    reader = csv.DictReader(csv_file)
                    for row in reader:
                        transactions.append(
                            Transaction(
                                id=row["id"],
                                account=row["account"],
                                kind=row["type"].strip().upper(),
                                amount_cents=parse_money(row["amount"]),
                            )
                        )
                return transactions


            def apply_transaction(balances: dict[str, int], tx: Transaction) -> None:
                before = balances.get(tx.account, 0)

                if tx.kind == "DEPOSIT":
                    after = before + tx.amount_cents
                elif tx.kind == "WITHDRAWAL":
                    after = before - tx.amount_cents
                elif tx.kind == "FEE":
                    after = before - tx.amount_cents
                elif tx.kind == "REFUND":
                    after = before + tx.amount_cents
                elif tx.kind == "REVERSAL":
                    after = before + tx.amount_cents
                else:
                    after = before - tx.amount_cents

                balances[tx.account] = after


            def reconcile(transactions: list[Transaction]) -> dict[str, int]:
                balances: dict[str, int] = {}
                for tx in transactions:
                    apply_transaction(balances, tx)
                return balances
      explanation: |
        **Diagnosis:** T011's type field contains a leading space. `.upper()` changes letters but preserves that space, so the loaded kind is `' REVERSAL'`. It misses the recognized `REVERSAL` branch and reaches the legacy fallback, subtracting 1800 cents. The contract requires adding 1800 cents, giving a difference of 3600 cents.

        The displayed repair uses `row["type"].strip().upper()` while constructing the `Transaction`. Converting case before stripping, or using a helper with the same behavior, also works. Normalization is required at this boundary because callers are promised canonical kinds from `load_transactions`, not only a corrected final balance.

        `repr(tx.kind)` displays quotes around the value, which makes boundary whitespace easier to notice than an un-delimited `print(tx.kind)`. It does not alter the value or prove that the whitespace caused the failure; connect the loaded value to the branch and resulting balance.

        **Verification:** rerun the original case, then try different accounts, amounts, cases, and surrounding whitespace. Preserve transaction IDs, account IDs, row order, and arithmetic. Adding 3600 cents to one named account would fit the sample without repairing the loader.

        Validation of genuinely unknown kinds is a separate policy decision. This exercise retains the supplied legacy fallback; a production change to reject unknown kinds would need an explicit contract and its own tests. Whitespace normalization is appropriate here because the input contract says surrounding whitespace is insignificant, not because every external string should be stripped.
    tests:
      - description: Loaded transaction kinds follow the input contract
        command: |
          import runpy
          ledger = runpy.run_path('/tutorial/ledger.py')
          from pathlib import Path
