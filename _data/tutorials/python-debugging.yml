  # Pedagogy: Contrast data boundaries using a diagram, targeted logging, and an invariant before repairing.
  - title: Case 2 — Ledger Reconciliation
    instructions: |
      ### Why this matters

      When several functions transform data, the final wrong result may originate at an earlier boundary. Targeted observations can distinguish a loading problem from an arithmetic problem without stepping through every input.

      ### 🎯 You will learn to

      - Use a data-flow view to choose where to collect evidence.
      - Compare a conditional breakpoint with a targeted log record.
      - Check an internal contract and repair its earliest violation.

      ### Case 2: Ledger Reconciliation

      `ledger.py` reads 30 transactions from `transactions.csv`. The importer accepts transaction kinds regardless of letter case or surrounding whitespace and returns canonical uppercase kinds. IDs, accounts, order, and amounts must be preserved. Deposits, refunds, and reversals add cents; withdrawals and fees subtract them. Reconciliation keeps accounts separate. This case covers those five kinds; preserve the existing legacy policy for genuinely unknown kinds.

      ### Where could the mismatch enter?

      Use this map to choose two observations that distinguish a wrong transaction from wrong arithmetic. The arrows show data dependencies, not evidence that either function is faulty.

      <pre><code class="diagram-freeform">
      @startuml
      layout vertical
      box "CSV rows" as rows
      box "Transaction objects" as transactions
      box "Account balances" as balances
      rows --> transactions : load_transactions
      transactions --> balances : reconcile
      @enduml
      </code></pre>

      The file’s rows become transaction objects. `reconcile` passes each object to `apply_transaction` to update balances. Ask whether each boundary's output meets its stated contract before blaming a later consumer.

      1. **Reproduce and hypothesize.** Run `test_ledger.py`. Record the balance mismatch and the loading check's observation separately. Propose two causes consistent with those observations; do not assume the two failures must share a cause.
      2. **Filter observations.** Set a breakpoint beside `before = balances.get(...)`. Use a condition on `tx` to select the affected account, then Debug. The pause is before that assignment: Step Over to assign `before`. Inspect the fields, then step through the update and compare the balance before and after it. `repr(value)` exposes quotes and escaped characters; for example, `repr("tab\t")` distinguishes a tab from ordinary letters. Record the first value that differs from your expectation.
      3. **Compare logging.** Stop. Add one temporary `logger.warning(...)` probe at the boundary you selected. Include a transaction ID, a relevant value using `%r`, and enough context to interpret it. For syntax, `logger.warning("item=%s value=%r", item_id, value)` logs a representation without changing the value. Adapt the fields and location yourself. Run the tests and read pytest's captured log section for a failed test. Explain what the log shows that the final balance does not. Remove the temporary probe after recording the evidence; debug/info are appropriate for routine diagnostics when logging is configured to show them.
      4. **Check an expectation.** Add a temporary assertion for the loader's returned-kind contract before reconciliation. Run it on the failing data: does it detect the incorrect state earlier than the balance check? Explain why detecting a bad state does not repair its cause. Keep a useful check in the test suite rather than relying on a production `assert` for external-data validation.
      5. **Locate and repair.** Trace the first wrong value to the operation that produced it. Stop before editing. Repair that cause while preserving the input fixture and the declared arithmetic. Verify with **Test** and **Test My Work**.

      **Self-check:** add a test of another valid spelling allowed by the importer contract. Explain which other fields need their own contracts; removing whitespace indiscriminately can corrupt meaningful text. Check that your observations connect the faulty operation to the incorrect balance.
    files:
      - path: ledger.py
        language: python
        content: |
          """Ledger reconciliation — applies CSV transactions to running balances."""

          import csv
          import logging
          from dataclasses import dataclass
          from decimal import Decimal

          logger = logging.getLogger(__name__)

          VALID_KINDS: set[str] = {"DEPOSIT", "WITHDRAWAL", "REFUND", "REVERSAL", "FEE"}


          @dataclass(frozen=True)
          class Transaction:
              id: str
              account: str
              kind: str
              amount_cents: int


          def parse_money(text: str) -> int:
              """Convert a dollars-and-cents string to integer cents."""
              return int(Decimal(text) * 100)


          def load_transactions(path: str) -> list[Transaction]:
              transactions: list[Transaction] = []
              with open(path, newline="", encoding="utf-8") as csv_file:
                  reader = csv.DictReader(csv_file)
                  for row in reader:
                      transactions.append(
                          Transaction(
                              id=row["id"],
                              account=row["account"],
                              kind=row["type"].upper(),
                              amount_cents=parse_money(row["amount"]),
                          )
                      )
              return transactions


          def apply_transaction(balances: dict[str, int], tx: Transaction) -> None:
              before = balances.get(tx.account, 0)

              if tx.kind == "DEPOSIT":
                  after = before + tx.amount_cents
              elif tx.kind == "WITHDRAWAL":
                  after = before - tx.amount_cents
              elif tx.kind == "FEE":
                  after = before - tx.amount_cents
              elif tx.kind == "REFUND":
                  after = before + tx.amount_cents
              elif tx.kind == "REVERSAL":
                  after = before + tx.amount_cents
              else:
                  # Realistic but dangerous legacy behavior: old exports used blank
                  # types for card charges, so unknown types are treated as
                  # withdrawals.
                  after = before - tx.amount_cents

              balances[tx.account] = after


          def reconcile(transactions: list[Transaction]) -> dict[str, int]:
              balances: dict[str, int] = {}
              for tx in transactions:
                  apply_transaction(balances, tx)
              return balances
