                return [
                    Event(1, "join_waitlist", "CS201", "Mina Patel"),
                    Event(2, "join_waitlist", "CS201", "Theo Rios"),
                    Event(3, "join_waitlist", "CS201", "Jules Kim"),
                    Event(4, "drop", "CS201", "Ben Ortiz"),
                    Event(5, "join_waitlist", "MATH220", "Noor Ali"),
                    Event(6, "join_waitlist", "CS201", "Kai Morgan"),
                    Event(7, "drop", "MATH220", "Iris Long"),
                    Event(8, "drop", "CS201", "Ava Chen"),
                    Event(9, "join_waitlist", "CS201", "Sam Lee"),
                ]


            def apply_event(state: dict[str, CourseState], event: Event) -> None:
                course = state[event.course]
                if event.kind == "join_waitlist":
                    _handle_join(course, event.student)
                elif event.kind == "drop":
                    _handle_drop(event.course, course, event.student)
                else:
                    raise ValueError(f"unknown event kind {event.kind!r}")


            def _handle_join(course: CourseState, student: str | None) -> None:
                if student in course.enrolled or student in course.waitlist:
                    raise ValueError(f"duplicate student in course state: {student}")

                if course.open_seats > 0:
                    course.enrolled.append(student)
                else:
                    course.waitlist.append(student)


            def _handle_drop(course_name: str, course: CourseState, student: str | None) -> None:
                if student in course.enrolled:
                    course.enrolled.remove(student)
                    allocate_next(course_name, course)
                elif student in course.waitlist:
                    course.waitlist.remove(student)


            def allocate_next(course_name: str, course: CourseState) -> None:
                """Fill open seats from the waitlist (FIFO)."""
                while course.open_seats > 0 and course.waitlist:
                    next_student = course.waitlist.pop(0)
                    course.enrolled.append(next_student)


            def run_events(
                events: list[Event] | None = None,
                state: dict[str, CourseState] | None = None,
            ) -> dict[str, CourseState]:
                if state is None:
                    state = initial_state()
                if events is None:
                    events = sample_events()
                for event in events:
                    apply_event(state, event)
                return state
      explanation: |
        **Diagnosis:** event 4 frees Ben's seat after Mina, Theo, and Jules joined the waitlist in that order. The starter admits Jules. This is the first policy violation; the final enrollment mismatch is a later observation of its consequences.

        The displayed repair uses `pop(0)` so the earliest waiting student is admitted. A `deque` with `popleft()` or another implementation that preserves the stated arrival-order contract is also valid. For a long queue, `deque.popleft()` avoids the shifting cost of removing the first element of a list; changing the representation also requires checking its callers. A list repair keeps this small example's change localized.

        After all sample events, CS201 has Mina and Theo enrolled, with Jules, Kai, and Sam still waiting. MATH220 admits Noor. Sorting by name is a different policy and does not reproduce arrival order. The independent checks use names whose alphabetical order differs from their arrival order, several open seats, an empty queue, and an unrelated course.

        The notes should connect an observed before/after transition to the admission operation and explain why the repair changes that transition. Automatic behavior checks cannot establish whether the learner performed that investigation or can explain it independently.
