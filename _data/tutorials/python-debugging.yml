    quiz:
      title: Step 4 — Knowledge Check
      min_score: 0.6666666666666666
      shuffle: true
      questions:
        - type: single
          difficulty: intermediate
          question: For a Python string `kind`, `print(repr(kind))` displays `' FEE\n'`. What does this
            establish?
          options:
            - The value contains quote characters at both ends.
            - The value contains a leading space and a newline.
            - The value has already been stripped of whitespace.
            - The value literally contains a backslash and an n.
          correct_index: 1
          option_feedback:
            0: The surrounding quotes delimit the string representation; they need not be part of the value.
            2: repr describes the value; it does not normalize or modify it.
            3: The escape sequence represents a newline. A literal backslash would itself be escaped in
              the representation.
          explanation: Quotes make the string boundaries visible, and the escaped newline exposes a character
            that ordinary printing would render as a line break.
        - type: single
          difficulty: intermediate
          question: A Python transaction is misclassified, but pausing the full run is inconvenient. Which
            targeted log best helps connect the input to the resulting balance update?
          options:
            - The transaction ID, represented kind, and before/after balance.
            - The final balances for all accounts, without transaction IDs.
            - The same “processed a transaction” message on every iteration.
            - The source code of the entire module on every iteration.
          correct_index: 0
          option_feedback:
            1: The final aggregate hides which transaction caused a change.
            2: The message shows progress but does not expose the values needed to distinguish classifications.
            3: Repeated source text adds volume without showing the state of this execution.
          explanation: Record the smallest relevant inputs and state transition, using a representation
            that exposes hidden characters. Configure a suitable log level and avoid recording unrelated
            or sensitive fields.
        - type: single
          difficulty: intermediate
          question: A Python import fixture contains only five allowed transaction kinds. An assertion checks
            loaded kinds and fails before balance processing begins. What has it established?
          options:
            - The input has been normalized into a valid transaction kind.
            - The final balance is correct because processing stopped early.
            - The loaded state violates the declared kind invariant.
            - The exact source line responsible for creating the bad value.
          correct_index: 2
          option_feedback:
            0: An assertion checks a condition; it does not transform the value.
            1: Stopping earlier can prevent propagation, but does not calculate or prove the correct result.
            3: The assertion locates where an invariant is already false, not necessarily where the fault
              originated.
          explanation: An assertion can expose an invalid internal state close to a boundary. Investigate
            how that state was produced and repair the cause; the assertion is diagnostic evidence, not
            the repair itself.

  # Pedagogy: Small correct trace prepares backward inspection; distinguish completed events from trace ticks.
  - title: Recorded History
    instructions: |
      ### Why this matters

      Recorded history can show when state changed before a later symptom appeared. To use it reliably, distinguish a source-level trace event from a completed application event.

      ### 🎯 You will learn to

      - Anchor a trace at an inspectable state before execution ends.
      - Use program-state markers to find completed events.
      - Check whether an earlier occurrence contradicts a proposed first divergence.

      ### A short history rehearsal

      **Exploratory step, about 5 minutes:** `counter.py` is correct. Each call to `apply_event` changes `count` and then appends `(event, count_after)` to the program's own `history` list. That list differs from the debugger's **History** trace, which also contains line, call, and return events.

      1. **Predict.** Starting at `count = 1`, trace the listed events on paper. Record the count after event 3, after event 5, and immediately before the reset. Mark the first event whose completed result is negative.
      2. **Anchor.** Set a breakpoint beside `return state` in `main`, then Debug and Continue to it. The loop has finished, but the function has not returned. Read the final `state`. Keep execution paused: this Python debugger clears its history after completion or Stop.
      3. **Compare completed events.** Move the History slider or use Step Back to reach `main` at the `for event in events` line after a call to `apply_event`. Use the length of `state["history"]` to identify how many events have completed. Find the states after events 3 and 5 and check your predictions. Merely finding a particular list length inside `apply_event` is insufficient: count may have changed before its history entry is appended.
      4. **Locate the first occurrence.** Find the boundary between a completed nonnegative state and a completed negative state. Then inspect earlier completed states to check whether this really is the **first** occurrence. A predicate can become true, false, and true again; the first matching state encountered while moving backward need not be the earliest match.
      5. **Return to the anchor.** Move to the latest recorded pause. This revisits the paused state; it does not re-execute events or restart from an edited past. Stop before changing code. A new Debug session runs the program again.

      **Self-check:** give both a domain-event number and a state value as evidence. If the history controls are unfamiliar, repeat this small trace once; do not spend time counting trace ticks.
    files:
      - path: counter.py
        language: python
        content: |
          # Backward Tour — no bug. Exercise the history scrubber.
          #
          # A tiny event-driven counter. Each event modifies `count`.
          # `history` records (event_name, count_after_event) for every step.

          from typing import Any

          CounterState = dict[str, Any]


          def apply_event(state: CounterState, event: str) -> None:
              if event == "inc":
                  state["count"] += 1
              elif event == "dec":
                  state["count"] -= 1
              elif event == "double":
                  state["count"] *= 2
              elif event == "neg":
                  state["count"] = -state["count"]
              elif event == "reset":
                  state["count"] = 0
              else:
                  raise ValueError(f"unknown event {event!r}")
              state["history"].append((event, state["count"]))


          def main() -> CounterState:
              state: CounterState = {"count": 1, "history": []}
              events: list[str] = ["inc", "double", "neg", "double", "inc", "reset", "inc", "inc"]
              for event in events:
                  apply_event(state, event)
              return state


          main()
    open_file: counter.py
    require_tests: false
    solution:
      explanation: |
        This is correct code. Its completed event boundaries are:

        | Events completed | Event | Count afterward |
        | --- | --- | --- |
        | 0 | Initial state | 1 |
        | 1 | `inc` | 2 |
        | 2 | `double` | 4 |
        | 3 | `neg` | -4 |
        | 4 | `double` | -8 |
        | 5 | `inc` | -7 |
        | 6 | `reset` | 0 |
        | 7 | `inc` | 1 |
        | 8 | `inc` | 2 |

        The final count is 2 with eight history entries. After three events it is -4; after five it is -7. Immediately before the reset it is -7. The first positive-to-negative transition is event 3, from 4 to -4.

        Moving backward from the end first encounters the latest negative state, after event 5. That does **not** identify the first negative transition. Continue comparing event boundaries until you locate event 3 and check its predecessor. A single debugger snapshot is not necessarily one complete application event: use the program's history length and source position to identify an event boundary.

        The recorded trace is an observation aid. Moving its slider does not undo I/O or make a source edit resume execution from an earlier state. Start a new run after changing code. Backward inspection can help when a useful later state is known, but it is not always faster or more informative than a well-chosen forward breakpoint.
    quiz:
      title: Step 5 — Knowledge Check
      min_score: 0.6666666666666666
      shuffle: true
      questions:
        - type: single
          difficulty: intermediate
          question: A Python counter appends `(event, count_after)` after each completed event. Which observation
            identifies the state immediately after event 4 in its recorded debugger history?
          options:
            - The fourth tick on the history slider.
            - A pause on source-code line number four.
            - The snapshot just after the fourth append.
            - Any snapshot where the count equals four.
          correct_index: 2
          option_feedback:
            0: A single event can produce several debugger snapshots; tick number is not event number.
            1: Source line numbers are independent of how many events have completed.
            3: The count can reach four at several different moments, or never reach four at all.
          explanation: Use a domain marker and its update point. Once the fourth event record has been appended
            and before the next event begins, the count corresponds to four completed events.
        - type: single
          difficulty: intermediate
          question: A Python trace records counter values `2, -1, 3, -2` after four events. Starting at
            the end, moving backward to the nearest nonnegative state identifies which transition?
          options:
            - The first negative transition in the whole run.
            - The transition from event 3 to event 4.
            - Every transition that produced a negative value.
            - The transition from event 1 to event 2.
          correct_index: 1
          option_feedback:
            0: The run became negative earlier, then recovered. The nearest earlier nonnegative state does
              not identify the earliest failure.
            2: One transition does not account for all earlier occurrences.
            3: That is the first negative transition, but backward search from the end first encounters
              the later one.
          explanation: The nearest change from nonnegative to negative is 3 → -2. To establish the first
            occurrence, inspect earlier history too; state can recover and become wrong again.
        - type: single
          difficulty: intermediate
          question: You move backward in a Python time-travel debugger to inspect a recorded state. What
            has that navigation done?
          options:
            - Replaced the running program’s state with an editable past state.
            - Undone all output and file effects after the selected moment.
            - Applied source edits starting at the selected past statement.
            - Selected a captured snapshot for read-only inspection.
          correct_index: 3
          option_feedback:
            0: Selecting history displays recorded state; it does not create a mutable execution branch.
            1: Inspecting a past snapshot does not undo external effects.
            2: Changed source needs a new execution; moving the slider does not rerun code.
          explanation: History navigation reads captured snapshots. It can help explain an earlier transition
            without executing that code again.
    run_file: counter.py

  # Pedagogy: Fade the process scaffold; reduce a temporal failure, check causal evidence, and document closure.
  - title: Case 3 — Course Waitlist
    instructions: |
      ### Why this matters

      Event-driven failures require reasoning about order as well as final values. A compact reproduction and a before/after observation make a proposed fix easier to explain and preserve.

      ### 🎯 You will learn to

      - Locate a wrong state transition in recorded history.
      - Reduce an event sequence and retain a discriminating regression test.
      - Document a repair with its cause, evidence, and remaining limits.

      ### Case 3: Course Waitlist

      `waitlist.py` processes joins and drops for two courses. The policy is **first in, first out (FIFO)**: when seats open, admit students in waitlist arrival order. Fill available seats without exceeding capacity, preserve the remaining order, and leave other courses unchanged. An empty queue makes no admissions. Student names are distinct within a course; their alphabetical order has no policy meaning.

      1. **Reproduce.** Run `test_waitlist.py`. Record the affected course and the final difference. Choose one competing explanation, such as an incorrect admission versus an incorrect later removal, and predict how their earlier states would differ.
      2. **Anchor before completion.** In `test_waitlist.py`, set a breakpoint beside `cs201 = state["CS201"]`, after `run_events()` has returned. Debug and Continue to that pause. Expand `state` to inspect each course. Keep the session paused while exploring history.
      3. **Find a transition.** Inspect earlier completed events at the loop boundary in `run_events`, using `event.step` and the course's enrollment/waitlist state in **Variables**. Selecting a caller in Call Stack changes Variables; Watch expressions still use the innermost recorded frame. Compare the states immediately before and after a candidate event. Check earlier events too; a later visible mismatch is not necessarily the first incorrect transition. Record the event and the violated policy before selecting a source line to inspect more closely.
      4. **Reduce and test.** Stop. Add a new pytest test with fewer events and your own student names. Retain the same ordering failure. Explain why a candidate with only one waiting student may fail to distinguish two admission policies. Use the smallest sequence you can justify; you need not prove global minimality.
      5. **Repair and check.** Make a focused repair. Rerun the original tests, your reproduction, and Test My Work. Verify your new test fails if you temporarily restore the original fault, then restore the repair. Equivalent queue representations are allowed; compare queue contents as sequences rather than requiring one container type.
      6. **Document.** In `debugging_log.md`, write a concise closure note: cause and causal evidence, repair, test that would catch its return, and one untested limitation. Add a brief code comment only if it explains a non-obvious policy. Draft a commit subject that identifies the behavior restored and a report reference such as `WAITLIST-1`. This browser exercise does not require a Git commit.

      **Self-check:** explain one nearby input you checked and why. Passing these tests is evidence about those cases, not proof that no other bug exists. Ask a peer to check whether your observed transition supports your repair rationale.
    files:
      - path: waitlist.py
        language: python
        content: |
          """Course waitlist simulator with a failing policy test."""

          from dataclasses import dataclass, field


          @dataclass
          class CourseState:
              capacity: int
              enrolled: list[str] = field(default_factory=list)
              waitlist: list[str] = field(default_factory=list)

              @property
              def open_seats(self) -> int:
                  return self.capacity - len(self.enrolled)


          @dataclass(frozen=True)
          class Event:
              step: int
              kind: str
              course: str
              student: str | None = None


          def initial_state() -> dict[str, CourseState]:
              return {
                  "CS201": CourseState(capacity=2, enrolled=["Ava Chen", "Ben Ortiz"]),
                  "MATH220": CourseState(capacity=1, enrolled=["Iris Long"]),
              }


          def sample_events() -> list[Event]:
              """Reproducible event stream.

              CS201 policy: students should be admitted from the waitlist in FIFO order.
              """
              return [
                  Event(1, "join_waitlist", "CS201", "Mina Patel"),
                  Event(2, "join_waitlist", "CS201", "Theo Rios"),
                  Event(3, "join_waitlist", "CS201", "Jules Kim"),
                  Event(4, "drop", "CS201", "Ben Ortiz"),
                  Event(5, "join_waitlist", "MATH220", "Noor Ali"),
                  Event(6, "join_waitlist", "CS201", "Kai Morgan"),
                  Event(7, "drop", "MATH220", "Iris Long"),
                  Event(8, "drop", "CS201", "Ava Chen"),
                  Event(9, "join_waitlist", "CS201", "Sam Lee"),
              ]


          def apply_event(state: dict[str, CourseState], event: Event) -> None:
              course = state[event.course]
              if event.kind == "join_waitlist":
                  _handle_join(course, event.student)
              elif event.kind == "drop":
                  _handle_drop(event.course, course, event.student)
              else:
                  raise ValueError(f"unknown event kind {event.kind!r}")


          def _handle_join(course: CourseState, student: str | None) -> None:
              if student in course.enrolled or student in course.waitlist:
                  raise ValueError(f"duplicate student in course state: {student}")

              if course.open_seats > 0:
                  course.enrolled.append(student)
              else:
                  course.waitlist.append(student)


          def _handle_drop(course_name: str, course: CourseState, student: str | None) -> None:
              if student in course.enrolled:
                  course.enrolled.remove(student)
                  allocate_next(course_name, course)
              elif student in course.waitlist:
                  course.waitlist.remove(student)


          def allocate_next(course_name: str, course: CourseState) -> None:
              """Fill open seats from the waitlist."""
              while course.open_seats > 0 and course.waitlist:
                  next_student = course.waitlist.pop()
                  course.enrolled.append(next_student)


          def run_events(
              events: list[Event] | None = None,
              state: dict[str, CourseState] | None = None,
          ) -> dict[str, CourseState]:
              if state is None:
                  state = initial_state()
              if events is None:
                  events = sample_events()
              for event in events:
                  apply_event(state, event)
              return state
      - path: test_waitlist.py
        language: python
        content: |
          from waitlist import run_events


          def test_cs201_waitlist_is_fifo() -> None:
              state = run_events()
              cs201 = state["CS201"]
              assert cs201.enrolled == ["Mina Patel", "Theo Rios"]
              assert list(cs201.waitlist) == ["Jules Kim", "Kai Morgan", "Sam Lee"]


          def test_math220_single_waitlisted_student_gets_open_seat() -> None:
              state = run_events()
              math220 = state["MATH220"]
              assert math220.enrolled == ["Noor Ali"]
              assert list(math220.waitlist) == []
      - path: debugging_log.md
        language: markdown
        content: |
          # Waitlist investigation

          Record only what another developer needs to check your reasoning:
          reproduction; hypothesis/prediction; event and before/after evidence;
          reduced failing sequence; repair; regression test fail-before/pass-after.

          Finish with a closure note, a useful policy comment if needed, and a
          commit subject referencing WAITLIST-1. State one untested limitation.
        reseed: true
    open_file: waitlist.py
    run_file: test_waitlist.py
    solution:
