    solution:
      files:
        - path: pathfinder.py
          language: python
          content: |
            """Depth-first maze pathfinder — boundary bug fixed."""

            from collections.abc import Iterator

            Position = tuple[int, int]
            Maze = list[str]


            def find_marker(maze: Maze, marker: str) -> Position:
                for row_index, row in enumerate(maze):
                    col_index = row.find(marker)
                    if col_index != -1:
                        return row_index, col_index
                raise ValueError(f"marker {marker!r} not found")


            def is_open(maze: Maze, position: Position) -> bool:
                row, col = position
                return maze[row][col] != "#"


            def neighbors(maze: Maze, position: Position) -> Iterator[Position]:
                row, col = position
                for next_position in [
                    (row, col + 1),
                    (row + 1, col),
                    (row, col - 1),
                    (row - 1, col),
                ]:
                    if is_open(maze, next_position):
                        yield next_position


            def find_path(maze: Maze, max_steps: int) -> list[Position] | None:
                start = find_marker(maze, "S")
                goal = find_marker(maze, "G")
                return _dfs(
                    maze=maze,
                    current=start,
                    goal=goal,
                    max_steps=max_steps,
                    path=[start],
                    seen={start},
                )


            def _dfs(
                maze: Maze,
                current: Position,
                goal: Position,
                max_steps: int,
                path: list[Position],
                seen: set[Position],
            ) -> list[Position] | None:
                steps_used = len(path) - 1

                # The preceding recursion never expands beyond the budget.
                # Accept a goal reached exactly at that budget.
                if current == goal:
                    return path.copy()

                if steps_used >= max_steps:
                    return None

                for next_position in neighbors(maze, current):
                    if next_position in seen:
                        continue
                    seen.add(next_position)
                    path.append(next_position)
                    result = _dfs(maze, next_position, goal, max_steps, path, seen)
                    if result is not None:
                        return result
                    path.pop()
                    seen.remove(next_position)

                return None
      explanation: |
        **Diagnosis:** on an exact-budget route, the recursive call reaches the goal with `steps_used == max_steps`. The starter's cutoff returns `None` before the goal check can accept that state. The maze has a 10-move route, so the returned path should contain 11 positions.

        The displayed repair checks for the goal before the `>=` cutoff. The recursion still stops expanding a non-goal cell once its budget is exhausted. Another correct repair leaves the cutoff first and changes it to `>`; it rejects an over-budget call before checking for success. Both accept the boundary and reject a route requiring too many moves.

        **Verification:** test below, at, and above a required budget; check another maze and an unreachable goal. A non-`None` value alone is insufficient: each returned position must be open, consecutive positions must be adjacent, the endpoints must be the markers, and the path must fit the budget. Raising a test's budget or removing the cutoff only changes which symptom you see.
