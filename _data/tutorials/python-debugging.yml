# Lecture 10 debugging practice; see docs/python-debugging-teaching-review.md.
# Objectives are author metadata; each step exposes its own learner-facing objectives.
title: 'Debugging Python: From Symptom to Fix'
description: Practice systematic debugging with reproducible failures, small experiments, logs, breakpoints,
  and recorded history. For students comfortable with Python functions, lists, dictionaries, basic recursion,
  and pytest assertions; no debugger experience required. Eight steps, two sessions of about 55–75 minutes
  each, with three guided cases and an independent repair.
learning_objectives:
  - Create a reproducible bug report that separates environment, input history, expected behavior, and
    observations.
  - Reduce a failing input and write an automated reproduction without changing the required behavior.
  - Test competing hypotheses using predictions, targeted logs, diagrams, breakpoints, watches, and call-stack
    state.
  - Trace an observed failure back to an incorrect state and its source-code cause.
  - Choose an investigation technique, including cautious use of external advice, that fits the available
    evidence.
  - Repair the cause, check nearby cases, retain regression tests, and document the reason for the change.
  - Apply the process independently and explain what the evidence does and does not establish.
backend: pyodide
linter: true
debugger: true
pytest: true
debugger_options:
  back_in_time: true
  max_history: 20000
  snapshot_depth: 4
  filter_globals: true
require_tests: true
autosave_type: files
editor_split: true
output_height: 30%
setup_commands:
  - import pyodide_js; await pyodide_js.loadPackage('pytest')
  - import sys; sys.path.insert(0, '/tutorial')
  - |
    import pytest as _pytest, sys as _sys
    def _make_pytest_patch():
        _orig = _pytest.main
        _sysmod = _sys
        _ours = ('greet','pathfinder','maze_data','ledger','waitlist','tagger','tour')
        def _patched(*a, **kw):
            for m in list(_sysmod.modules):
                if (m.startswith('test_')
                        or m in _ours):
                    del _sysmod.modules[m]
            return _orig(*a, **kw)
        return _patched
    _pytest.main = _make_pytest_patch()

steps:

  # Pedagogy: Worked example on a different fault, then predict–observe–repair with an explicit evidence limit.
  - title: The Debugging Process
    instructions: |
      ### Why this matters

      A useful bug fix explains why a failure occurred and checks that the repair preserves other behavior. A short record of predictions and observations helps you avoid repeating experiments.

      ### 🎯 You will learn to

      - Distinguish a failure, an incorrect state, and the fault that caused it.
      - Test a proposed cause before repairing a small function.
      - Record a reproducible report and verify a repair.

      ### Your working method

      **Prerequisites:** Python functions, lists, dictionaries, basic recursion, and pytest `assert` statements. The debugger is new material. Plan **two sessions of about 55–75 minutes each**, pausing after the ledger case. These are estimates to check with your class, not time limits. Keep notes to a few lines per experiment; one useful reproduction is enough. If you already use a debugger, make and check the predictions in the two tool rehearsals, then move on once you can explain the observations.

      **Keyboard access:** Use **Tab** / **Shift+Tab** to move between controls and **Enter** / **Space** to activate buttons. Press **Escape** to leave the code editor. In the **Debug** panel, open **Breakpoints → Code Breakpoints**, choose **Breakpoint file**, enter **Breakpoint line**, then activate **Add breakpoint**. Each breakpoint has **Edit condition** and **Remove breakpoint** buttons. Expand variables and select call-stack frames with their buttons; use arrow keys on the history slider. Set breakpoints before starting a debug session.

      Use the lecture's four phases: **reproduce, locate, explain the cause, repair and verify**. Within an investigation, record a hypothesis, predict an observation, collect evidence, and revise the hypothesis if needed. You may loop between these moves. Temporary logging or a smaller input is an experiment; changing production behavior is a proposed repair.

      **Testing** exposes a mismatch with a requirement. **Debugging** investigates and repairs its cause. A **fault** is a defect in code, an **error** is an incorrect runtime state, and a **failure** is the resulting observable behavior.

      ### A worked investigation

      Suppose a sum function starts its accumulator at `1`. For input `[4, 6]`, it returns `11` instead of `10`. Hypothesis: the initial value adds an unwanted offset. Prediction: even `[]` will return `1`. Observing that result supports the hypothesis. Initializing at `0` repairs it; checking empty, positive, and negative inputs tests whether that explanation generalizes. The wrong initialization is the fault, the offset total is the error, and the returned `11` is the failure.

      Now investigate a **different** fault in `greet.py`.

      ### Greeting contract

      `greet(names)` returns `"Hello"`, then each supplied name in order separated by `", "`, then `"!"`. Preserve repeated names. Empty input returns `"Hello!"`; leave the input list unchanged.

      1. **Predict.** Read `greet.py`. Write its predicted result for the three calls in `test_greet.py`, separately from each required result.
      2. **Reproduce.** Activate **Test** in the output toolbar. It runs `test_greet.py` regardless of the selected editor tab. Two checks fail in the starter. In `debugging_log.md`, record one expected/actual mismatch, the input, and the action that reproduces it. Include the browser and Python version: temporarily add `import sys; print(sys.version)` to the test file, run once, then remove that diagnostic.
      3. **Observe.** Set a breakpoint beside `parts.append(names[i])` in `greet.py`, then activate **Debug**. If it pauses at startup, use **Continue** to reach the breakpoint. The marked line is about to execute. Compare `names`, `i`, and `parts` in **Variables** with your prediction. **Step Over** executes that statement.
      4. **Explain.** Name a suspected source of the missing output. Choose a second input that would distinguish that explanation from a formatting problem at the return statement. Observe it before editing the repair.
      5. **Repair and verify.** Activate **Stop** to leave debugging before editing. Make a focused repair, rerun **Test**, then **Test My Work**. Keep the original expectations. Explain the fault → incorrect state → failure chain in one sentence.

      **What completion means:** Test My Work checks production behavior with independent inputs. Your predictions, investigation notes, new tests, and explanations are self-checks; passing automatic checks does not verify those skills. Use the self-checks to review your evidence; ask a peer or instructor whether the observations support your explanation.

      **Knowledge checks:** review feedback on any missed item. The short checks allow one mistake so a single slip does not force a full retake.
    files:
      - path: greet.py
        language: python
        content: |
          def greet(names: list[str]) -> str:
              parts: list[str] = ["Hello"]
              for i in range(1, len(names)):
                  parts.append(names[i])
              return ", ".join(parts) + "!"
      - path: test_greet.py
        language: python
        content: |
          from greet import greet


          def test_three_names_all_appear() -> None:
              assert greet(["Ada", "Linus", "Grace"]) == "Hello, Ada, Linus, Grace!"


          def test_empty_list_just_says_hello() -> None:
              assert greet([]) == "Hello!"


          def test_single_name_appears() -> None:
              assert greet(["Solo"]) == "Hello, Solo!"
      - path: debugging_log.md
        language: markdown
        content: |
          # Greeting investigation

          - Environment and reproduction (browser/Python version, file, input, action):
          - Expected versus observed:
          - Hypothesis and a prediction that could refute it:
          - Experiment and observation:
          - Fault, incorrect state, and failure:
          - Repair and verification:
        reseed: true
    open_file: greet.py
    run_file: test_greet.py
    solution:
      files:
        - path: greet.py
          language: python
          content: |
            def greet(names: list[str]) -> str:
                parts: list[str] = ["Hello"]
                for i in range(0, len(names)):
                    parts.append(names[i])
                return ", ".join(parts) + "!"
      explanation: |
        **Diagnosis:** the loop begins at index 1, so the first name is never appended. The empty-list case passes, but the multi-name and single-name cases fail.

        The displayed repair starts the range at 0. `range(len(names))` or direct iteration over names also meets the contract. Keep a repair focused so its effect is easy to explain and test; a particular spelling or minimum character count is not the goal.

        **Verification:** preserve the original reproductions, then check empty, single-name, and repeated-name inputs. The repeated-name case distinguishes preserving the sequence from removing duplicates or sorting. Explain how the changed iteration affects the first appended name before rerunning the tests.
    tests:
      - description: Greetings preserve names, order, and the input list
        command: |
          import runpy
          greet = runpy.run_path('/tutorial/greet.py')['greet']
          for names, expected in [
              (["Zuri", "Ada", "Zuri"], "Hello, Zuri, Ada, Zuri!"),
              (["Rae", "Bo"], "Hello, Rae, Bo!"),
          ]:
              original = names.copy()
              assert greet(names) == expected, 'Include every supplied name in its original order.'
              assert names == original, 'Leave the supplied name list unchanged.'
        hints:
          - title: Trace the assembled greeting
            text: Open or restore greet. Predict the names represented in parts after each loop iteration;
              compare that sequence with the input before inspecting punctuation.
            condition: &greet_orientation 'code_matches: /^(?:(?![\s\S]*(?:^|\n)def\s+greet\s*\()|(?=[\s\S]*(?:^|\n)def\s+greet\s*\((?:(?!\n(?:def|class)\s)[\s\S])*?for\s+\w+\s+in\s+range\(\s*1\s*,\s*len\())[\s\S]*$/'
          - title: Test more than one position
            text: A greeting that works for one name can still omit others. Trace three distinct names,
              then repeat one name; which input positions reach the output?
            condition: &greet_partial 'code_matches: /^(?=[\s\S]*(?:^|\n)def\s+greet\s*\()(?![\s\S]*(?:^|\n)def\s+greet\s*\((?:(?!\n(?:def|class)\s)[\s\S])*?for\s+\w+\s+in\s+range\(\s*1\s*,\s*len\()(?=[\s\S]*(?:^|\n)def\s+greet\s*\((?:(?!\n(?:def|class)\s)[\s\S])*?return[^\n]*names\s*\[\s*0\s*\])[\s\S]*$/'
          - title: Separate selection from formatting
            text: Record the sequence of names immediately before the return. If that sequence is correct,
              compare separators and punctuation; otherwise trace the first missing, repeated, or reordered
              entry. Compare the supplied list before and after the call as well.
            condition: &greet_developed 'code_matches: /^(?=[\s\S]*(?:^|\n)def\s+greet\s*\()(?![\s\S]*(?:^|\n)def\s+greet\s*\((?:(?!\n(?:def|class)\s)[\s\S])*?for\s+\w+\s+in\s+range\(\s*1\s*,\s*len\()(?![\s\S]*(?:^|\n)def\s+greet\s*\((?:(?!\n(?:def|class)\s)[\s\S])*?return[^\n]*names\s*\[\s*0\s*\])[\s\S]*$/'
      - description: A single name appears in the greeting
        command: |
          import runpy
          greet = runpy.run_path('/tutorial/greet.py')['greet']
          assert greet(["Noor"]) == "Hello, Noor!", 'Include a name even when it is the only item.'
        hints:
          - title: Trace a one-name call
            text: Open or restore greet. With one name, predict whether the loop body executes and what
              parts contains at the return.
            condition: *greet_orientation
          - title: Keep the whole contract in view
            text: Compare your one-name branch with a call containing several names and with an empty call.
              Does the same explanation account for all three?
            condition: *greet_partial
          - title: Locate the missing contribution
            text: For a one-name call, compare the supplied name with the state immediately before formatting.
              Identify the first operation after which it can no longer contribute.
            condition: *greet_developed
      - description: An empty name list retains the greeting
        command: |
          import runpy
          greet = runpy.run_path('/tutorial/greet.py')['greet']
          assert greet([]) == "Hello!", 'Preserve the empty-list greeting.'
        hints:
          - title: Trace no iterations
            text: Open or restore greet. For an empty input, predict the initial state, whether any iteration
              occurs, and the returned punctuation.
            condition: *greet_orientation
          - title: Check assumptions before indexing
            text: Try the empty case separately from the single-name case. Which expression assumes a name
              exists before the function has established that?
            condition: *greet_partial
          - title: Preserve the empty greeting
            text: Trace the return for an empty list. Compare the greeting text and punctuation with the
              contract; also check that preparing the result has not changed the supplied list.
            condition: *greet_developed
    quiz:
      title: Step 1 — Knowledge Check
      min_score: 0.6666666666666666
      shuffle: true
      questions:
        - type: single
          difficulty: intermediate
          question: A Python function omits the first item from its result. Which note distinguishes an
            observation from a proposed explanation?
          options:
            - 'Observation: the first item is missing. Hypothesis: the loop skips its index.'
            - 'Observation: the loop must be wrong. Hypothesis: the result lacks the first item.'
            - 'Observation: the return is faulty. Hypothesis: the loop is faulty instead.'
            - 'Observation: the test failed. Hypothesis: therefore the test must be wrong.'
          correct_index: 0
          option_feedback:
            1: The missing item is observable. A claim about why it disappeared still needs evidence.
            2: Both statements propose locations for a fault; neither records a concrete observed result.
            3: A failing test exposes a disagreement with an expectation. It does not establish whether
              the expectation or implementation is wrong.
          explanation: Record what happened separately from why it might have happened. Then choose an observation
            that could support or rule out the proposed cause.
        - type: single
          difficulty: intermediate
          question: A Python failure occurs only after importing a file and changing a setting. Which bug-report
            content most helps another person reproduce it?
          options:
            - The suspected faulty line and a request to fix it quickly.
            - The expected output, without the inputs that produced it.
            - The output screenshot, without steps or configuration.
            - The input, settings, versions, steps, and expected/actual results.
          correct_index: 3
          option_feedback:
            0: A proposed location can be useful, but it does not supply the environment or actions needed
              to reproduce the failure.
            1: An expectation alone does not show how to obtain the observed failure.
            2: A screenshot can record a symptom, but the reader still needs the environment and triggering
              history.
          explanation: A useful report records both the problem environment and the sequence that triggered
            the failure. Include the concrete expected and actual results so another person can recognize
            the same problem.
        - type: single
          difficulty: intermediate
          question: After changing a Python helper, its previously failing test passes. The helper is also
            used by code covered by other tests. What should happen before calling the repair verified?
          options:
            - Keep only the formerly failing test as the regression suite.
            - Run related checks, including cases that previously passed.
            - Remove the formerly failing test because its job is finished.
            - Treat the passing test as proof that every input now works.
          correct_index: 1
          option_feedback:
            0: Other callers or input categories can regress even when the original failure disappears.
            2: Keeping the reproduction test helps detect the same failure after future changes.
            3: One passing example is evidence for that example, not proof about every input.
          explanation: Rerun the reproduction and the relevant regression suite; this tutorial uses the
            full supplied suite. Passing tests increase confidence within their coverage, without proving
            the absence of all bugs.

  # Pedagogy: Tool rehearsal on correct code separates control learning from diagnosis; predict before stepping.
  - title: Debugger Tour
    instructions: |
      ### Why this matters

      A debugger lets you test a precise question about a running program. Learning its controls on correct code leaves more attention for diagnosing a real fault later.

      ### 🎯 You will learn to

      - Choose Step Into, Step Over, and Step Out for different observations.
      - Inspect values, expressions, and caller scopes at a pause.
      - Filter pauses with a condition and inspect recorded states.

      ### A short tool rehearsal

      **Exploratory step, about 8 minutes:** `tour.py` is correct. Its input is the `scores` list in `main`; negative scores represent penalties. **Run** and **Debug** both execute `tour.py`. Selecting another file is not a run configuration change. In a local editor, the equivalent setup selects a program, arguments, working directory, and interpreter before launching.

      1. **Predict.** Read the four scores. Predict the total before and after the negative score, and the final return value.
      2. **Enter a call.** Set a breakpoint beside `total = process_scores(scores)` in `main`. Click **Debug**, then **Continue** if needed to reach it. **Step Into** enters `process_scores`; **Step Over** would execute the call without stopping in its body. In **Call Stack**, compare the caller's `scores` with the callee's locals, then return to the innermost frame. **Step Out** finishes this call and returns to its caller. Predict where it will stop before trying it.
      3. **Inspect a statement.** Stop, remove the earlier call breakpoint, and start a fresh session with a breakpoint beside `total += score`. Read `score` and `total` in **Variables**. In **Watch**, enter `total + score` in **Watch expression**, then select **+ Add**. Predict what changes after **Step Over**, then check. Use observations without side effects; a watch that mutates a list can change the program.
      4. **Filter.** Stop. Right-click the breakpoint to open **Breakpoint Condition**, enter `score < 0` in **Python expression**, and **Save**. You can also edit an existing condition through **Breakpoints → Code Breakpoints → Edit condition**. Restart Debug and Continue past its initial pause. Read the score at the conditional stop. This predicate selects a negative input; it does not itself establish a bug.
      5. **Look back.** While paused, move the **History** slider backward and forward, or use **Step Back**. Compare the shown values with your recorded prediction. One history tick is a trace event, not necessarily a loop iteration. This is recorded inspection; it does not undo output or let you edit the past.
      6. **Probe a type mismatch.** Stop and temporarily replace the final integer score with the string `"2"`. Predict which operation will fail, then Run and read the exception. Clear the breakpoint condition, Debug, and Continue to that input at the addition. Inspect `type(score)` and explain the mismatch between the value and the operation. Would a broad `except` returning `0` restore the score contract? Restore the original integer, predict the total, and Run again. This intentionally invalid input is a diagnostic experiment; adding validation is outside this rehearsal.

      **Self-check:** explain which control answers “What happens inside this call?”, which finishes the current call, and which revisits an observation already captured. Do not spend time memorizing control names without their purpose.
    files:
      - path: tour.py
        language: python
        content: |
          # Correct program: negative scores represent penalties.

          def process_scores(scores: list[int]) -> int:
              total = 0
              for score in scores:
                  total += score
              return total

          def main() -> int:
              scores = [8, 3, -5, 2]
              total = process_scores(scores)
              print(f"total score: {total}")
              return total

          main()
    open_file: tour.py
    require_tests: false
    solution:
      explanation: |
        This is correct code; there is no repair to apply. For `scores = [8, 3, -5, 2]`, the expected observations at `total += score` are:

        | Iteration | `score` | `total` before the addition | `total` after the addition |
        | --- | --- | --- | --- |
        | 1 | 8 | 0 | 8 |
        | 2 | 3 | 8 | 11 |
        | 3 | -5 | 11 | 6 |
        | 4 | 2 | 6 | 8 |

        A `score < 0` condition on that line stops before the third addition, with `score == -5` and `total == 11`. A watch of `total + score` predicts 6 at that pause. Once that addition has executed, evaluating the same expression again would add the current score again; a watch always means an expression at the displayed program state, not a promise about the next statement.

        The function returns 8. The call stack identifies the active calls that led here; it is not a log of every earlier call. Step Into, Step Over, and Step Out change the granularity of forward execution. History controls inspect snapshots already recorded. Use observations in the notes to explain the difference; clicking a control is not evidence that the distinction is understood.

        The temporary string `"2"` is a different runtime type from the integer `2`. At the final addition, an integer total and a string score cannot be added, so Python raises `TypeError`. A broad handler returning `0` would hide the exception without computing the required total. Restore the valid input and verify its predicted result; input validation would be a separate requirement.
    quiz:
      title: Step 2 — Knowledge Check
      min_score: 0.6666666666666666
      shuffle: true
      questions:
        - type: single
          difficulty: intermediate
          question: An accidental string in a Python score list triggers TypeError during summation. A teammate
            wraps the loop in a broad exception handler that returns 0. What does the new result establish?
          options:
            - The handler has converted every score to an integer.
            - No exception escapes, so the scoring contract is restored.
            - The handler returns a fallback; the type problem remains.
            - The handler proves the input list’s correct total is zero.
          correct_index: 2
          option_feedback:
            0: Returning a number does not convert the input values that caused the operation to fail.
            1: An incorrect fallback is still a failure to produce the required result, even when no traceback
              escapes.
            3: Zero comes from the handler, not a completed calculation. It is not evidence of the intended
              total.
          explanation: Inspect the failing operation and the runtime types of its operands. Correct the
            input or implementation according to the contract, then verify the expected result; suppressing
            an exception alone does not establish a repair.
        - type: single
          difficulty: intermediate
          question: A Python helper is paused during one of several nested calls. You want to know which
            active caller supplied its arguments. What should you inspect first?
          options:
            - The final output from the completed test run.
            - The earliest snapshot in the recorded history.
            - The call stack and the relevant caller frame.
            - The list of source files in the editor tabs.
          correct_index: 2
          option_feedback:
            0: Output may show the symptom without identifying the active call chain.
            1: An early snapshot need not contain the call currently under investigation.
            3: File tabs identify available source, not which invocation led to the current pause.
          explanation: The call stack identifies active invocations. Inspecting the relevant frame connects
            a helper call to its caller and that caller’s local state.
        - type: single
          difficulty: intermediate
          question: A Python debugger pauses before `result = helper(value)`. No other breakpoints are active.
            You want to inspect the statements inside helper. Which action fits that question?
          options:
            - 'Step Over: run the call without entering its body.'
            - 'Step Into: enter the called function’s execution.'
            - 'Step Out: finish the currently active function.'
            - 'Continue: run until another stopping condition.'
          correct_index: 1
          option_feedback:
            0: Step Over is useful when the call’s result is enough; it does not ordinarily stop inside
              the helper.
            2: Step Out leaves the current function rather than entering the helper.
            3: Continue does not request statement-by-statement inspection inside the call.
          explanation: Step Into exposes the called function’s execution. Step Over skips its internal stops,
            while Step Out returns from the current frame; choose the action based on the scope you need
            to inspect.
    run_file: tour.py

  # Pedagogy: Reduce and compare boundary cases, then explain a recursive decision and retain its reproduction.
  - title: Case 1 — Maze Pathfinder
    instructions: |
      ### Why this matters

      A smaller failing example makes it easier to distinguish a boundary mistake from a traversal mistake. Predicting recursive state helps connect a final failure to the decision that caused it.

      ### 🎯 You will learn to

      - Simplify a reproduction while preserving the same failure.
      - Compare recursive frames and boundary cases.
      - Write a regression test and justify a focused repair.

      ### Case 1: Maze Pathfinder

      A delivery robot uses one battery unit per grid move. `find_path(maze, max_steps)` must return **any valid path using at most the budget**, or `None` if none exists. A path includes the start and goal, moves one cell horizontally or vertically at a time, and never crosses a wall. It need not be the shortest path. Inputs here are rectangular mazes enclosed by walls, with one `S`, one `G`, and a nonnegative integer budget.

      1. **Reproduce.** Run the supplied `test_pathfinder.py` with **Test**. Record the failing input and expected/actual result in this case's `debugging_log.md`.
      2. **Reduce.** Keep the original tests. In a new `test_...` function in that same file, construct a smaller enclosed maze that still produces the same kind of failure. Try removing an irrelevant passage or shortening a corridor; rerun after each change. Record one removal that preserves the failure and one change that makes it disappear. A crash from a malformed maze is a different failure.
      3. **Predict and investigate.** For your reduced case, compare budgets just below, exactly at, and above the number of moves needed. Hypothesize whether the discrepancy comes from visiting cells or deciding when to stop. Predict a value that would distinguish them. Set a breakpoint on an executable line inside `_dfs`, then Debug. If pausing before `steps_used` is assigned, Step Over before reading it. Check which test input and `max_steps` the current call belongs to; the first pause may be from an earlier test. Inspect caller frames as recursion deepens.
      4. **Explain aloud or in writing.** Tell a partner or an imaginary rubber duck what each decision does for the reduced input, using the actual values. Identify the first state or decision inconsistent with the contract. Write one observation that would have refuted your hypothesis. A complex-looking function is a place to inspect, not proof of a fault. If you refactor to make it readable, keep that behavior-preserving change separate from the repair.
      5. **Repair.** Stop debugging. Choose a focused change that satisfies all three budgets. Preserve the original tests; equivalent implementations are welcome.
      6. **Verify your new test.** Run all tests in the file and Test My Work. Temporarily restore the original faulty decision: your new reproduction should fail for the original reason. Restore the repair and confirm it passes. Keep the test for future regression checking.

      **Self-check:** state why a budget counts moves rather than cells, and why one successful path cannot establish correct behavior at every boundary. The automated checks assess returned paths and rejection cases; review your new test's fail-before/pass-after evidence yourself.
    files:
      - path: maze_data.py
        language: python
        content: |
          # Mazes used by the pathfinder case.

          # Shortest valid path from S to G is exactly 10 steps.
          BATTERY_LIMIT_MAZE: list[str] = [
              "#########",
              "#S..#..G#",
              "#.#.#.#.#",
              "#.#...#.#",
              "#.#####.#",
              "#.......#",
              "#########",
          ]

          # Sanity maze whose shortest path is 2 steps.
          TINY_MAZE: list[str] = [
              "#####",
              "#S.G#",
              "#####",
          ]
      - path: pathfinder.py
        language: python
        content: |
          """Depth-first maze pathfinder."""

          from collections.abc import Iterator

          Position = tuple[int, int]
          Maze = list[str]


          def find_marker(maze: Maze, marker: str) -> Position:
              for row_index, row in enumerate(maze):
                  col_index = row.find(marker)
                  if col_index != -1:
                      return row_index, col_index
              raise ValueError(f"marker {marker!r} not found")


          def is_open(maze: Maze, position: Position) -> bool:
              row, col = position
              return maze[row][col] != "#"


          def neighbors(maze: Maze, position: Position) -> Iterator[Position]:
              """Yield neighbors in a deterministic order so traces are repeatable."""
              row, col = position
              for next_position in [
                  (row, col + 1),  # east
                  (row + 1, col),  # south
                  (row, col - 1),  # west
                  (row - 1, col),  # north
              ]:
                  if is_open(maze, next_position):
                      yield next_position


          def find_path(maze: Maze, max_steps: int) -> list[Position] | None:
              """Return a path from S to G using at most max_steps moves.

              A path includes both the start and goal positions, so:
                steps_used == len(path) - 1
              """
              start = find_marker(maze, "S")
              goal = find_marker(maze, "G")
              return _dfs(
                  maze=maze,
                  current=start,
                  goal=goal,
                  max_steps=max_steps,
                  path=[start],
                  seen={start},
              )


          def _dfs(
              maze: Maze,
              current: Position,
              goal: Position,
              max_steps: int,
              path: list[Position],
              seen: set[Position],
          ) -> list[Position] | None:
              steps_used = len(path) - 1

              # Stop searching when the path has used the available battery budget.
              if steps_used >= max_steps:
                  return None

              if current == goal:
                  return path.copy()

              for next_position in neighbors(maze, current):
                  if next_position in seen:
                      continue
                  seen.add(next_position)
                  path.append(next_position)
                  result = _dfs(maze, next_position, goal, max_steps, path, seen)
                  if result is not None:
                      return result
                  path.pop()
                  seen.remove(next_position)

              return None
