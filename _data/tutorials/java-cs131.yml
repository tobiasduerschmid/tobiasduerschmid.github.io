    solution:
      files:
        - path: CheckedTypes.java
          language: java
          content: |
            class BonusToken {
                private int amount;
                public BonusToken(int amount) { this.amount = amount; }
                public int bonus() { return amount; }
            }
            class PlainToken { }
            public class CheckedTypes {
                public static int bonusOf(Object item) {
                    if (item instanceof BonusToken) return ((BonusToken) item).bonus();
                    return 0;
                }
                public static void main(String[] args) {
                    Object item = new BonusToken(9);
                    System.out.println(item instanceof BonusToken);
                    System.out.println(bonusOf(item));
                    System.out.println(bonusOf(new PlainToken()));
                }
            }
      explanation: >
        The class check separates the specialized case before the cast and call. No new object is
        constructed by casting. The fallback covers null and every unrelated class; an unchecked
        call would fail on those cases.
