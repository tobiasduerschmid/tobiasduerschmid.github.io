                  SessionItem[] items = {a,null,b,a,c};
                  if (SessionSummary.minutesFor(items,new String("lab")) != 32) throw new RuntimeException("Combine exact content matching, skipped nulls, and repeated positions.");
                  if (SessionSummary.minutesFor(items,"absent") != 0 || SessionSummary.minutesFor(new SessionItem[0],"lab") != 0) throw new RuntimeException("Check no matches and empty input.");
                  if (items[0] != a || items[1] != null || items[2] != b || items[3] != a || items[4] != c || a.minutes() != 12 || b.minutes() != 8 || c.minutes() != 50 || !a.label().equals("lab") || !b.label().equals("lab") || !c.label().equals("Lab")) throw new RuntimeException("Preserve the input array and its objects.");
                  if (SessionSummary.minutesFor(new SessionItem[]{new ComputedSession()},"lab") != 7) throw new RuntimeException("Use the interface for a new implementation.");
