  # Pedagogy: spaced retrieval — old/new reference state in a generic holder
  - title: Parametric Polymorphism
    key: parametric-types
    instructions: >
      ### Why this matters


      A reusable holder should preserve the relationship between the type stored and the type
      returned. A type parameter expresses that relationship without a separate holder class for
      each element type.


      ### 🎯 You will learn to


      - Implement type-independent storage behavior.

      - Distinguish parametric polymorphism from subtyping and overloads.


      ### One Implementation, Related Types


      `TypedShelf<T>` uses a type variable. With `TypedShelf<String>`, constructor inputs, get's
      result, and replace's input/result are Strings. An Object-based holder accepts broadly but
      requires callers to recover a narrower result type. The generic holder expresses the
      relationship for the compiler.


      A type variable does not permit arbitrary operations such as `item.bonus()`: the generic
      definition must be valid for its allowed types. This differs from assuming a C++ template can
      use whatever members happen to exist in one instantiation.


      ### Your Task


      Complete `exchange(next)`:


      - Replace the stored reference with `next` and return the **previously stored reference**.
      Future get/exchange calls use the replacement.

      - Accept null as an ordinary stored reference.

      - Preserve reference identity; do not clone the stored object.


      Predict both lines of `main` after repair. Then trace replacing twice and explain which old
      value each call returns. This is the step 3 old/new-value pattern with a reusable element
      type.


      ### Compiler Reasoning


      `TypedShelf<String>` and `TypedShelf<Object>` are not interchangeable. Allowing the first
      where the second is required could let a client insert a non-String into a String shelf.
      Standard Java rejects that assignment. It also rejects a wrong element type. The browser
      runner erases generic information and does **not** check these restrictions.


      Java generics use reference type arguments: `Integer` is the wrapper used for integer values,
      rather than `TypedShelf<int>`. Type erasure does not mean the standard compiler skips checking
      your source.
    files:
      - path: GenericStorage.java
        language: java
        content: |
          class TypedShelf<T> {
              private T item;
              public TypedShelf(T item) { this.item = item; }
              public T get() { return item; }
              public T exchange(T next) {
                  return null;
              }
          }
          public class GenericStorage {
              public static void main(String[] args) {
                  TypedShelf<String> shelf = new TypedShelf<String>("intro");
                  System.out.println(shelf.exchange("encore"));
                  System.out.println(shelf.get());
              }
          }
    open_file: GenericStorage.java
    run_file: GenericStorage.java
    tests:
      - description: Generic replacement, repeated calls, identity, and null
        command: |
          public class __Test {
              public static void main(String[] args) {
                  TypedShelf<String> text = new TypedShelf<String>("intro");
                  if (!text.exchange("encore").equals("intro") || !text.get().equals("encore")) throw new RuntimeException("Return old and retain new text.");
                  Object first = new Object();
                  Object next = new Object();
                  TypedShelf<Object> objects = new TypedShelf<Object>(first);
                  if (objects.exchange(next) != first || objects.get() != next) throw new RuntimeException("Preserve object identity.");
                  if (objects.exchange(null) != next || objects.get() != null || objects.exchange(first) != null || objects.get() != first) throw new RuntimeException("Check both directions of null replacement.");
              }
          }
        hints:
          - title: One Type Relationship
            text: >-
              The same T appears in the stored field, argument, and result. What old/new-state
              operation works without knowing anything about T?
            condition: 'code_not_matches: /exchange\s*\([^)]*\)\s*\{(?!\s*return\s+null\s*;\s*\})/'
          - title: Two Calls in a Row
            text: >-
              Trace a shelf holding intro, replaced by encore, then by outro. Record each return
              separately from the final stored value.
            condition: 'code_matches: /exchange\s*\([^)]*\)\s*\{(?!\s*return\s+null\s*;\s*\})(?![^}]*item)/'
          - title: A Reference to Keep
            text: >-
              Before overwriting the field, identify which value the caller still needs. No copy of
              the referenced object is required.
            condition: 'code_matches: /exchange\s*\([^)]*\)\s*\{(?!\s*return\s+null\s*;\s*\})(?=[^}]*item)/'
    solution:
      files:
        - path: GenericStorage.java
          language: java
          content: |
            class TypedShelf<T> {
                private T item;
                public TypedShelf(T item) { this.item = item; }
                public T get() { return item; }
                public T exchange(T next) {
                    T previous = item;
                    item = next;
                    return previous;
                }
            }
            public class GenericStorage {
                public static void main(String[] args) {
                    TypedShelf<String> shelf = new TypedShelf<String>("intro");
                    System.out.println(shelf.exchange("encore"));
                    System.out.println(shelf.get());
                }
            }
      explanation: >
        The method saves the old reference, replaces the field, and returns that saved reference. It
        never needs operations specific to String or another concrete type. The behavioral checks
        establish storage behavior; static type restrictions are assessed separately.
    quiz:
      title: Step 9 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
        - id: java-generics-invariance
          type: single
          difficulty: advanced
          question: >
            A mutable `Slot<T>` provides `put(T value)` and `T get()`. Why does standard Java reject
            this assignment?


            ```java

            Slot<String> names = new Slot<String>();

            Slot<Object> anything = names;

            ```
          options:
            - The wider alias could insert a non-string into the same slot.
            - A generic object must contain a primitive rather than a reference.
            - A string stops being an object when used as a type argument.
          correct_index: 0
          option_feedback:
            '1': >-
              Java generic type arguments are reference types, so `String` is an appropriate type
              argument.
            '2': >-
              `String` remains a subtype of `Object`. That relationship does not make `Slot<String>`
              a subtype of `Slot<Object>`.
          explanation: >-
            If the assignment were allowed, `anything.put(new Object())` could violate the promise
            that `names.get()` yields a `String`. These generic instantiations are invariant.
        - id: java-generics-type-preservation
          type: single
          difficulty: intermediate
          question: >
            A plain holder has `Object get()`. A generic holder has `T get()`. In standard Java,
            what does a `Holder<String>` let the compiler establish at a call to `get()`?
          options:
            - A read returns `Object`, so callers must still cast it.
            - A read has type `String`, so callers need no downcast.
            - A read can use any result type chosen by the caller.
          correct_index: 1
          option_feedback:
            '0': >-
              For a `Holder<String>`, substituting the type argument makes the declared result type
              `String`; the caller does not need a downcast.
            '2': >-
              The holder's type argument fixes this result type. Assigning a result to a different
              type does not change the generic contract.
          explanation: >-
            The type parameter preserves the relationship between the holder's element type and its
            method's result type. Returning plain `Object` loses that static information.
  # Pedagogy: worked example with fading — supplied cursor, independently written client
  - title: Iterables and Iterator State
    key: iterator-state
    instructions: >
      ### Why this matters


      A collection or sequence describes what can be visited; an iterator records one traversal’s
      position. Keeping those roles separate makes independent traversals possible.


      ### 🎯 You will learn to


      - Trace independent iterators and non-consuming availability checks.

      - Consume an iterator through its public contract.


      ### The Supplied Cursor


      The worked `BeatRange` represents every second integer from start (inclusive) to end
      (exclusive). Each `iterator()` creates a fresh `BeatCursor`. `hasNext()` inspects availability
      without consuming; `next()` returns one value and advances. Calling next after exhaustion
      throws `NoSuchElementException`.


      `Iterable<Integer>` provides iterator(); `Iterator<Integer>` provides hasNext() and next().
      The Integer wrapper lets these generic interfaces carry integers; Java boxes and unboxes
      values as needed. The cursor implementation is supplied so the task can focus on the client
      contract.


      ### Predict and Run


      Trace the two hasNext calls, first.next(), and second.next() in main. Does asking twice
      consume anything? Does second resume where first stopped? Commit to the four results before
      running.


      ### Your Task


      Implement `sum(cursor)` for any non-null Iterator of non-null Integers:


      - Sum **all remaining values**, leaving the cursor exhausted.

      - Return zero if it is already exhausted; values and total fit in an int.

      - Use only the Iterator contract. Do not assume the starting value, spacing, length, or
      concrete cursor class.


      The tests supply both the worked BeatCursor and a different iterator. Afterward, explain why
      passing the same iterator to sum twice differs from passing two fresh iterators.


      **Standard Java connection:** enhanced `for` over an Iterable obtains an iterator and
      repeatedly checks/advances it. The browser subset does not support enhanced-for over custom
      Iterable implementations; use the explicit calls here.
    files:
      - path: IteratorClient.java
        language: java
        content: |
          import java.util.Iterator;
          import java.util.NoSuchElementException;
          class BeatCursor implements Iterator<Integer> {
              private int current;
              private int end;
              public BeatCursor(int start, int end) { this.current = start; this.end = end; }
              public boolean hasNext() { return current < end; }
              public Integer next() {
                  if (!hasNext()) throw new NoSuchElementException("exhausted");
                  int result = current;
                  current = current + 2;
                  return result;
              }
          }
          class BeatRange implements Iterable<Integer> {
              private int start;
              private int end;
              public BeatRange(int start, int end) { this.start = start; this.end = end; }
              public Iterator<Integer> iterator() { return new BeatCursor(start,end); }
          }
          public class IteratorClient {
              public static int sum(Iterator<Integer> cursor) {
                  return -1;
              }
              public static void main(String[] args) {
                  BeatRange beats = new BeatRange(2,7);
                  Iterator<Integer> first = beats.iterator();
                  Iterator<Integer> second = beats.iterator();
                  System.out.println(first.hasNext());
                  System.out.println(first.hasNext());
                  System.out.println(first.next());
                  System.out.println(second.next());
                  System.out.println(sum(first));
              }
          }
    open_file: IteratorClient.java
    run_file: IteratorClient.java
    tests:
      - description: Remaining-value sum and exhausted cursor state
        command: |
          import java.util.Iterator;
          import java.util.ArrayList;
          public class __Test {
              public static void main(String[] args) {
                  Iterator<Integer> beats = new BeatRange(2,7).iterator();
                  beats.next();
                  if (IteratorClient.sum(beats) != 10 || beats.hasNext() || IteratorClient.sum(beats) != 0) throw new RuntimeException("Consume only the remaining 4 and 6, then stay exhausted.");
                  ArrayList<Integer> values = new ArrayList<Integer>();
                  values.add(-3); values.add(8); values.add(0);
                  Iterator<Integer> other = values.iterator();
                  if (IteratorClient.sum(other) != 5 || other.hasNext()) throw new RuntimeException("Use the contract for a different iterator.");
                  if (IteratorClient.sum(new BeatRange(5,5).iterator()) != 0) throw new RuntimeException("Check an initially empty traversal.");
              }
          }
        hints:
          - title: Availability and Consumption
            text: >-
              Which interface method reports whether a value exists, and which changes the traversal
              position? Both roles matter.
            condition: 'code_not_matches: /sum\s*\([^)]*\)\s*\{(?!\s*return\s+-1\s*;\s*\})/'
          - title: A Partly Used Cursor
            text: >-
              Start with the cursor already past its first element. Your client receives its current
              state, not the original sequence description.
            condition: 'code_matches: /sum\s*\([^)]*\)\s*\{(?!\s*return\s+-1\s*;\s*\})(?![^}]*next\s*\()/'
          - title: A Loop Trace
            text: >-
              For each iteration, write availability, value consumed, and running total. What must
              change so the next availability check can eventually be false?
            condition: 'code_matches: /sum\s*\([^)]*\)\s*\{(?!\s*return\s+-1\s*;\s*\})(?=[^}]*next\s*\()/'
    solution:
      files:
        - path: IteratorClient.java
          language: java
          content: |
            import java.util.Iterator;
            import java.util.NoSuchElementException;
            class BeatCursor implements Iterator<Integer> {
                private int current;
                private int end;
                public BeatCursor(int start, int end) { this.current = start; this.end = end; }
                public boolean hasNext() { return current < end; }
                public Integer next() {
                    if (!hasNext()) throw new NoSuchElementException("exhausted");
                    int result = current;
                    current = current + 2;
                    return result;
                }
            }
            class BeatRange implements Iterable<Integer> {
                private int start;
                private int end;
                public BeatRange(int start, int end) { this.start = start; this.end = end; }
                public Iterator<Integer> iterator() { return new BeatCursor(start,end); }
            }
            public class IteratorClient {
                public static int sum(Iterator<Integer> cursor) {
                    int total = 0;
                    while (cursor.hasNext()) total += cursor.next();
                    return total;
                }
                public static void main(String[] args) {
                    BeatRange beats = new BeatRange(2,7);
                    Iterator<Integer> first = beats.iterator();
                    Iterator<Integer> second = beats.iterator();
                    System.out.println(first.hasNext());
                    System.out.println(first.hasNext());
                    System.out.println(first.next());
                    System.out.println(second.next());
                    System.out.println(sum(first));
                }
            }
      explanation: >
        The client loops while a value is available and consumes exactly one on each iteration. It
        does not reconstruct the source sequence. The predicted lines are true, true, 2, 2;
        sum(first) then returns 10, while second has its own position.
    quiz:
      title: Step 10 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
        - id: java-iterator-peek
          type: single
          difficulty: intermediate
          question: >
            `it` is a fresh iterator over the integers 4, 6, in that order. What does the last line
            print?


            ```java

            it.hasNext();

            it.hasNext();

            System.out.println(it.next());

            ```
          options:
            - '`4`'
            - '`6`'
            - It throws because both elements were consumed.
          correct_index: 0
          option_feedback:
            '1': '`hasNext()` reports whether another element exists; it does not consume an element.'
            '2': >-
              Repeated checks do not advance the iterator. The first call to `next()` still returns
              its first element.
          explanation: >-
            next() returns and consumes the next element. hasNext() can be called repeatedly without
            advancing the iterator, so next() still returns 4.
        - id: java-iterator-alias-and-fresh
          type: single
          difficulty: advanced
          question: >
            `beats` is a BeatRange containing 3, 5, 7. Each iterator() call creates a fresh cursor.
            What is printed?


            ```java

            Iterator<Integer> a = beats.iterator();

            Iterator<Integer> b = a;

            Iterator<Integer> c = beats.iterator();

            a.next();

            System.out.println(b.next() + " " + c.next());

            ```
          options:
            - '`3 3`'
            - '`5 5`'
            - '`5 3`'
          correct_index: 2
          option_feedback:
            '0': b is an alias of a, so it observes the position reached by a.next().
            '1': c is a separate iterator with its own position. Advancing a does not advance c.
          explanation: >-
            a and b refer to one cursor, now positioned at 5. c refers to a fresh cursor, still
            positioned at 3. The iterator state follows object identity.
  # Pedagogy: PRIMM — trace abrupt completion, then repair cleanup
  - title: Exceptions and Cleanup
    key: exception-flow
    instructions: >
      ### Why this matters


      An exception skips the rest of the current path while searching for a matching handler.
      Cleanup must cover both ordinary returns and exceptional exits.


      ### 🎯 You will learn to


      - Trace return, throw, catch, and finally paths.

      - Implement recovery with unconditional cleanup.


      ### A Worked Control-Flow Trace


      ```java

      try {
          System.out.println("start");
          throw new IllegalArgumentException("bad request");
      } catch (IllegalArgumentException problem) {
          System.out.println("recover");
      } finally {
          System.out.println("finish");
      }

      ```


      The trace is start, recover, finish. `throw` transfers control; catch handles a matching
      exception, and finally runs when leaving the try/catch, including through return. This assumes
      normal program execution, not forced process termination. A finally block that itself returns
      or throws can replace a pending result; do not do that in this task.


      ### Your Task


      Complete `quote(seats)` using the supplied `validate` method:


      - For valid input, return validate's result.

      - If validate throws `IllegalArgumentException`, return -1.

      - Increment `completed` **exactly once on either path**. Try expressing the shared cleanup
      with finally.


      Inputs are small integers, so arithmetic overflow is outside this task. `completed` is a
      static field shared by calls; it is a visible stand-in for a cleanup action. Predict all three
      lines in main before running your completed method. Trace where a return value waits while
      finally executes.


      After the tests pass, inspect your code: is the single cleanup increment inside `finally`?
      Explain why it runs after either return. The tests check behavior; this inspection checks
      how you expressed the shared cleanup.


      ### Compiler Reasoning


      A **checked exception** is a compiler-enforced handling obligation; a **checked cast** from
      step 8 performs a runtime type check. These are different uses of “checked”.


      A checked exception must be caught or declared with `throws`. RuntimeException and its
      subclasses, including IllegalArgumentException, are unchecked. `throws` describes possible
      propagation; it does not throw or catch anything. The browser runner does not enforce
      checked-exception declarations, and this exercise uses a single catch type.
    files:
      - path: ExceptionFlow.java
        language: java
        content: |
          public class ExceptionFlow {
              public static int completed = 0;
              public static int validate(int seats) {
                  if (seats < 0) throw new IllegalArgumentException("negative seats");
                  return seats * 2;
              }
              public static int quote(int seats) {
                  return -99;
              }
              public static void main(String[] args) {
                  System.out.println(quote(3));
                  System.out.println(quote(-1));
                  System.out.println(completed);
              }
          }
    open_file: ExceptionFlow.java
    run_file: ExceptionFlow.java
    tests:
      - description: Quote results and cleanup on both exit paths
        command: |
          public class __Test {
              public static void main(String[] args) {
                  ExceptionFlow.completed = 0;
                  if (ExceptionFlow.quote(3) != 6 || ExceptionFlow.completed != 1) throw new RuntimeException("Check the successful result and one cleanup.");
                  if (ExceptionFlow.quote(-1) != -1 || ExceptionFlow.completed != 2) throw new RuntimeException("Check recovery and one cleanup after failure.");
                  if (ExceptionFlow.quote(0) != 0 || ExceptionFlow.completed != 3) throw new RuntimeException("Zero is a valid input and still cleans up.");
              }
          }
        hints:
          - title: Two Exit Paths
            text: >-
              Follow validate once with 3 and once with -1. Where does control leave the ordinary
              path in each case?
            condition: 'code_not_matches: /quote\s*\([^)]*\)\s*\{(?!\s*return\s+-99\s*;\s*\})/'
          - title: Cleanup After Return
            text: >-
              An assignment after a return is unreachable. Which language construct was introduced
              specifically for work that must happen as a path exits?
            condition: >-
              code_matches:
              /quote\s*\([^)]*\)\s*\{(?!\s*return\s+-99\s*;\s*\})(?!(?:(?!public\s+static\s+void\s+main)[\s\S])*\bfinally\b)/
          - title: A Pending Result
            text: >-
              Draw a three-column trace: pending result, handler (if any), cleanup count. Fill both
              the valid and invalid rows before placing the return statements.
            condition: >-
              code_matches:
              /quote\s*\([^)]*\)\s*\{(?!\s*return\s+-99\s*;\s*\})(?=(?:(?!public\s+static\s+void\s+main)[\s\S])*\bfinally\b)/
    solution:
      files:
        - path: ExceptionFlow.java
          language: java
          content: |
            public class ExceptionFlow {
                public static int completed = 0;
                public static int validate(int seats) {
                    if (seats < 0) throw new IllegalArgumentException("negative seats");
                    return seats * 2;
                }
                public static int quote(int seats) {
                    try {
                        return validate(seats);
                    } catch (IllegalArgumentException problem) {
                        return -1;
                    } finally {
                        completed++;
                    }
                }
                public static void main(String[] args) {
                    System.out.println(quote(3));
                    System.out.println(quote(-1));
                    System.out.println(completed);
                }
            }
      explanation: >
        The return value is determined in try or catch, then finally increments completed before
        control returns to the caller. Main prints 6, -1, 2. Tests check observable results and
        cleanup counts; use your explanation and the stated task to review the use of finally
        itself.
