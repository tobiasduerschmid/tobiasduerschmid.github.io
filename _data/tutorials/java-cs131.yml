    solution:
      files:
        - path: SessionSummary.java
          language: java
          content: |
            interface SessionItem {
                String label();
                int minutes();
            }
            class FixedSession implements SessionItem {
                private String name;
                private int length;
                public FixedSession(String name, int length) { this.name = name; this.length = length; }
                public String label() { return name; }
                public int minutes() { return length; }
            }
            public class SessionSummary {
                public static int minutesFor(SessionItem[] items, String wanted) {
                    int total = 0;
                    for (SessionItem item : items) {
                        if (item != null && item.label().equals(wanted)) total += item.minutes();
                    }
                    return total;
                }
                public static void main(String[] args) {
                    SessionItem one = new FixedSession(new String("lab"),12);
                    SessionItem two = new FixedSession(new String("lab"),8);
                    SessionItem[] items = {one, null, two, one};
                    System.out.println(minutesFor(items,"lab"));
                }
            }
      explanation: >
        The guard avoids calling methods on null. String equality selects by content, and interface
        dispatch supplies each duration. Iterating positions preserves multiplicity without changing
        the inputs. Main prints 32. Compile-time permissions, runtime dispatch, and reference
        identity answer different questions.
    quiz:
      title: Step 12 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
        - id: java-transfer-alias-dispatch
          type: single
          difficulty: advanced
          question: >
            In standard Java, `Ticket` has an instance field `int uses = 0` and an instance method
            `use()` that adds 1 to `uses`. `Pass` extends `Ticket` and overrides `use()` to add 2
            instead. What is printed?


            ```java

            Ticket first = new Pass();

            Ticket second = first;

            first.use();

            second.use();

            System.out.println(first.uses);

            ```
          options:
            - '`2`'
            - '`1`'
            - '`4`'
          correct_index: 2
          option_feedback:
            '0': >-
              The two references alias one object, and both calls dispatch to `Pass.use()`. The
              increment is applied twice to the same field.
            '1': >-
              Assigning `first` to `second` does not clone the object, and a `Ticket` reference does
              not force the base implementation of an overridden instance method.
          explanation: >-
            There is one `Pass` object. Both references reach it, and both calls add 2 through its
            override, leaving `uses` equal to 4.
        - id: java-transfer-static-safety
          type: single
          difficulty: advanced
          question: >
            A standard Java method accepts a `Playable` and calls only its declared `play()`
            operation. A proposed revision accepts `Object`, casts it to `Playable`, then calls
            `play()`. What protection is lost?
          options:
            - The compiler's rejection of arguments outside the `Playable` contract.
            - Runtime dispatch to the actual object's implementation of `play()`.
            - The ability for two variables to refer to the same playable object.
          correct_index: 0
          option_feedback:
            '1': >-
              After a successful cast, the instance method call still uses dynamic dispatch. The
              change affects when an unsuitable argument is rejected.
            '2': Changing a parameter type does not stop references from aliasing the same object.
          explanation: >-
            The `Playable` parameter rejects incompatible arguments at compile time. An `Object`
            parameter accepts them and may fail later when the cast executes.
        - id: java-integration-selection
          type: single
          difficulty: intermediate
          question: >-
            A SessionItem object returns `new String("studio")` from label() and 12 from minutes().
            The array holds that object, null, and the same object again. What must
            minutesFor(items, `"studio"`) return under this tutorial’s contract?
          options:
            - '`12`'
            - '`0`'
            - '`24`'
          correct_index: 2
          option_feedback:
            '0': >-
              The contract counts matching array positions, including repeated references. It does
              not deduplicate objects.
            '1': >-
              String content matches even when the label is a distinct String object. The null
              position is skipped.
          explanation: >-
            Two positions have matching label content, and each contributes 12. Null guards, value
            equality, and repeated aliases all matter.
        - id: java-integration-behavioral-contract
          type: single
          difficulty: advanced
          question: >-
            SessionItem promises a non-null label and nonnegative minutes, with no required
            preparation call. Which implementation preserves that client contract?
          options:
            - Returns a label and zero minutes for a free session.
            - Requires prepare() before its label() call is allowed.
            - Returns a label and negative minutes until scheduled.
          correct_index: 0
          option_feedback:
            '1': >-
              The new preparation requirement strengthens a precondition that clients were never
              asked to satisfy.
            '2': >-
              Negative minutes violate the promised result even when the method has the correct Java
              return type.
          explanation: >-
            Zero satisfies the nonnegative-duration promise. Correct method signatures alone do not
            establish behavioral substitutability.
