          option_feedback:
            '1': >-
              Java does not insert a catch. The caller must handle this checked exception or declare
              that it can propagate.
            '2': >-
              The compiler checks this obligation even if a particular execution would not throw.
              This differs from an unchecked exception such as `IllegalArgumentException`.
          explanation: >-
            Because ShowException is checked, the caller must catch it or declare a compatible
            exception in its own throws clause. Declaring it does not itself throw or handle it.
  # Pedagogy: independent transfer — combine contracts, guards, equality, and dispatch
  - title: Semantic Integration
    key: semantic-integration
    instructions: >
      ### Why this matters


      Transfer means choosing the right rule when the prompt no longer names it for you. This final
      client combines shared objects, a common contract, and content-based selection.


      ### 🎯 You will learn to


      - Create an interface-based client from a behavioral contract.

      - Explain how reference state, equality, and dispatch combine.


      ### Independent Challenge


      Read the starter's interface and constructor. Implement `minutesFor(items, wanted)` without
      looking at earlier solutions:


      - `items` and `wanted` are non-null; items may contain null entries.

      - Every non-null entry has a non-null label and a nonnegative duration. Totals fit in an int.

      - Sum minutes for entries whose label **content** exactly matches wanted, including case.

      - Skip null entries. Count every matching position, even repeated references to one object.

      - Return zero for an empty array or no matches. Do not mutate or reorder anything.

      - Work for any implementation of SessionItem, not only FixedSession.


      Predict main's result, implement the method, then test. Create a second small example of your
      own before viewing the solution. The automatic checks sample behavior; they cannot assess your
      explanation.


      ### Explain Your Decisions


      1. Which rule prevents a null dereference?

      2. Which equality relation matches the requirement?

      3. Which type determines the operations the client may call, and which object determines the
      method body?

      4. If the same object appears twice, why is it counted twice?


      ### A Behavioral Contract Check


      A replacement SessionItem must preserve the promised non-null label and nonnegative duration.
      Merely having the right method signatures does not guarantee those behaviors. A subtype must
      not demand stronger preconditions than its client was promised or weaken the promised
      postconditions.


      ### Return Later


      Tomorrow, reconstruct the difference between rebinding a parameter and mutating its object
      before rerunning step 3. Later this week, redo this challenge with a different selection rule
      from your own written contract. Explain one example of each: **overloading**, **subtype
      polymorphism**, and **parametric polymorphism**.


      For further practice, the [Java tutorial with UML](/SEBook/tools/java-tutorial) explores
      broader Java design. Synchronization, bounded generics, and lambda capture are useful
      follow-ups; they are not prerequisites for this practice path.
