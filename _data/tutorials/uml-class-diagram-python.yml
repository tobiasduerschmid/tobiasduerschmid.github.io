    quiz:
      title: "Step 7 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            In UML, `Department "1" --> "1..*" Employee` — where is the `*` placed and why?
          type: single
          options:
            - "Next to Department, because one department has many employees"
            - "Next to Employee, because there are many employees per department"
            - "In the middle of the line, since it describes the whole association"
            - "Above the arrow, away from either class endpoint"
          correct_index: 1
          explanation: |
            The multiplicity is placed **next to the class it quantifies**. There are many **employees** per department, so `1..*` goes next to `Employee`. There is one **department** per group, so `1` goes next to `Department`.

        - question: |
            What does the multiplicity `0..1` mean?
          type: single
          options:
            - "Exactly zero"
            - "Exactly one"
            - "Zero or one (optional)"
            - "Zero or more"
          correct_index: 2
          explanation: |
            `0..1` means the relationship is **optional** — there can be zero or one instance. For example, a `Person` might have `0..1` `Passport` — not everyone has a passport, but no one has two.

        - question: |
            **Review of Step 6.** A `University` has `1..*` `Department`s and a `Department` has `1..*` `Professor`s. Given the lifecycle rules you learned in Step 6, which pair of diamonds is correct?
          type: single
          options:
            - "Both filled (composition) — because both are `1..*`"
            - "Both hollow (aggregation) — because both are collections"
            - "Filled University–Department; hollow Department–Professor"
            - "Hollow between University and Department; filled between Department and Professor"
          correct_index: 2
          explanation: |
            Multiplicity tells you *how many* participate; the diamond tells you *ownership and lifecycle*. They are independent decisions. Here you combine Step 6's lifecycle reasoning with Step 7's multiplicity notation — both pieces of information go on the *same* arrow in the diagram.


  # --------------------------------------------------------------------------
  # STEP 8 — "Abstract Classes: Designing for Extension"
  # Pedagogy:
  #   Constructivism — bridge Python abc to UML italic notation.
  #   Bloom's level — Understand (abstract meaning), Apply (use abc).
  # --------------------------------------------------------------------------
  - title: "Abstract Classes: Designing for Extension"
    key: abstract-classes
    instructions: |
      ## Abstract Classes in UML

      ### Why this matters

      Step 4's `Shape.area()` returned `0.0` — a polite lie that hid a real design flaw: a generic `Shape` should not be instantiable in the first place, because "the area of a shape" is meaningless without knowing which shape. Abstract classes turn that lie into a contract. They let you say "this class is a blueprint; you cannot create one directly, and every subclass *must* fill in these specific methods" — and they let UML show that intent visually with italic class names.

      ### 🎯 You will learn to

      - Apply Python's `abc` module to declare abstract classes and methods
      - Analyze when italic UML notation signals an unimplementable contract

      ### Flashback to Step 4

      Remember Step 4's `Shape`?

      ```python
      class Shape:
          def area(self) -> float:
              return 0.0   # ← wait, what is the area of a generic "shape"?
      ```

      That `0.0` was always a lie. A `Shape` isn't a thing you can actually measure — only *specific* shapes (circles, rectangles) have areas. We hid the lie behind a default value and let `Circle` and `Rectangle` override it. That worked, but it left a bug-shaped hole: if you ever wrote `Shape("red").area()`, Python cheerfully returned `0.0` instead of telling you that you made a design mistake.

      **Abstract classes are how you fix that hole.** By the end of this step, you will know how to say "this class is a blueprint; you must not instantiate it directly, and every subclass *must* implement these methods."

      ### What Is an Abstract Class?

      An abstract class is a class that **cannot be instantiated directly** — it serves as a blueprint that subclasses must complete. In UML, abstract classes and abstract methods are shown in *italics*.

      ### Python's `abc` Module

      Python does not have an `abstract` keyword like Java or C++. Instead, you use the `abc` (Abstract Base Classes) module:

      ```python
      from abc import ABC, abstractmethod

      class Shape(ABC):                    # Inherit from ABC
          @abstractmethod                  # Mark as abstract
          def area(self) -> float:
              pass                         # No implementation
      ```

      Trying to instantiate `Shape()` directly will raise a `TypeError`.

      ### Your Target Diagram

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-spec='@startuml
      layout landscape
      abstract class PaymentMethod {
        + {abstract} process(amount: float): bool
        + {abstract} get_name(): str
      }
      class CreditCard {
        + card_number: str
        + __init__(card_number: str): None
        + process(amount: float): bool
        + get_name(): str
      }
      class BankTransfer {
        + account_number: str
        + __init__(account_number: str): None
        + process(amount: float): bool
        + get_name(): str
      }
      CreditCard --|> PaymentMethod
      BankTransfer --|> PaymentMethod
      @enduml'></div>

      Notice: `PaymentMethod` and its methods appear in *italics* — this signals they are abstract.

      ### Your Task

      The starter code has a concrete `PaymentMethod` base class. Apply the `abc` mechanism from the worked example to match the target:

      1. **Identify** which class and operations the target marks as abstract, then express that contract in Python.
      2. **Complete** both concrete subclasses. Each `process(amount)` prints a payment status message and reports success (`True`) in this simulation; `get_name()` returns `"Credit Card"` or `"Bank Transfer"` for the corresponding subclass.
      3. **Check** that constructing the base class raises `TypeError`, an incomplete subclass cannot be instantiated, and both complete subclasses can be used through the common contract.

    uml_files:
      - payments.py

    files:
      - path: payments.py
        content: |
          # TODO: Express the target's abstract-class contract.


          class PaymentMethod:
              """This should be abstract — you should NOT be able to create
              a plain PaymentMethod()."""

              def process(self, amount: float) -> bool:
                  # TODO: Match this operation's abstract status in the target.
                  return False

              def get_name(self) -> str:
                  # TODO: Match this operation's abstract status in the target.
                  return "Unknown"


          class CreditCard(PaymentMethod):
              def __init__(self, card_number: str) -> None:
                  self.card_number: str = card_number

              # TODO: Fulfill the concrete payment contract in the task.


          class BankTransfer(PaymentMethod):
              def __init__(self, account_number: str) -> None:
                  self.account_number: str = account_number

              # TODO: Fulfill the concrete payment contract in the task.


          if __name__ == "__main__":
              cc = CreditCard("4111-1111-1111-1111")
              bt = BankTransfer("DE89370400440532013000")
              print(f"Paying with {cc.get_name()}: {cc.process(49.99)}")
              print(f"Paying with {bt.get_name()}: {bt.process(150.00)}")
        language: python

    open_file: payments.py

    solution:
      files:
        - path: payments.py
          content: |
            from abc import ABC, abstractmethod


            class PaymentMethod(ABC):
                @abstractmethod
                def process(self, amount: float) -> bool:
                    pass

                @abstractmethod
                def get_name(self) -> str:
                    pass


            class CreditCard(PaymentMethod):
                def __init__(self, card_number: str) -> None:
                    self.card_number: str = card_number

                def process(self, amount: float) -> bool:
                    print(f"Charging ${amount:.2f} to card {self.card_number[-4:]}")
                    return True

                def get_name(self) -> str:
                    return "Credit Card"


            class BankTransfer(PaymentMethod):
                def __init__(self, account_number: str) -> None:
                    self.account_number: str = account_number

                def process(self, amount: float) -> bool:
                    print(f"Transferring ${amount:.2f} from account {self.account_number[-4:]}")
                    return True

                def get_name(self) -> str:
                    return "Bank Transfer"


            if __name__ == "__main__":
                cc = CreditCard("4111-1111-1111-1111")
                bt = BankTransfer("DE89370400440532013000")
                print(f"Paying with {cc.get_name()}: {cc.process(49.99)}")
                print(f"Paying with {bt.get_name()}: {bt.process(150.00)}")
          language: python
      explanation: |
        By making `PaymentMethod` abstract:
        - It **cannot be instantiated** — `PaymentMethod()` raises `TypeError`
        - It **defines a contract** — any subclass MUST implement `process()` and `get_name()`
        - The UML shows this with **italics** on the class name and abstract methods

        This is a powerful design tool: you can write code that works with *any* `PaymentMethod` without knowing the specific type. You could add `PayPal`, `CryptoCurrency`, or `ApplePay` later without changing any code that uses the `PaymentMethod` interface.

    tests:
      - description: "PaymentMethod is abstract (cannot be instantiated)"
        command: |
          source = open('/tutorial/payments.py').read()
          ns = {}
          exec(source, ns)
          try:
              ns['PaymentMethod']()
              assert False, \
                  "PaymentMethod() should raise TypeError — make it inherit from ABC and mark methods with @abstractmethod"
          except TypeError:
              pass  # Good — abstract class cannot be instantiated
        hints:
          - title: Use the abstract-class mechanism
            text: The base class describes a contract for concrete payment types. Revisit the lesson’s abc example and identify the class-level and operation-level parts of that mechanism.
            condition: "code_not_matches: /^class[ \\t]+PaymentMethod[ \\t]*\\(/m"
          - title: Identify incomplete operations
            text: List which PaymentMethod operations require a subclass implementation. Inheriting the abstract-class base alone does not mark those operations as unfinished.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+PaymentMethod[ \\t]*\\())(?![\\s\\S]*(?:^class[ \\t]+PaymentMethod\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?@abstractmethod\\b))[\\s\\S]*$/m"
          - title: Compare base and concrete construction
            text: Try constructing PaymentMethod and a subclass separately. Inspect the abstract markers on both required operations; the base should remain incomplete while concrete subclasses fulfill the contract.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+PaymentMethod[ \\t]*\\())(?=[\\s\\S]*(?:^class[ \\t]+PaymentMethod\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?@abstractmethod\\b))[\\s\\S]*$/m"

      - description: "CreditCard implements all abstract methods"
        command: |
          source = open('/tutorial/payments.py').read()
          ns = {}
          exec(source, ns)
          cc = ns['CreditCard']('4111-1111-1111-1111')
          assert cc.get_name() == 'Credit Card', \
              f"CreditCard.get_name() should return 'Credit Card' but got '{cc.get_name()}'"
          result = cc.process(49.99)
          assert result == True, \
              "CreditCard.process() should return True"
        hints:
          - title: Find the missing concrete behavior
            text: Compare CreditCard's methods with the contract declared by PaymentMethod. Which operations are inherited as requirements rather than usable implementations?
            condition: "code_not_matches: /^class[ \\t]+CreditCard\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+process\\b[^\\n]*/m"
          - title: Check both sides of the contract
            text: Implementing processing alone leaves the display-name operation unresolved. Trace how the driver uses both operations for CreditCard.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+CreditCard\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+process\\b[^\\n]*))(?![\\s\\S]*(?:^class[ \\t]+CreditCard\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+get_name\\b[^\\n]*))[\\s\\S]*$/m"
          - title: Separate side effects from return values
            text: Call each CreditCard operation and record displayed text separately from its returned value. Compare both with the task requirements; printing success does not automatically return success.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+CreditCard\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+process\\b[^\\n]*))(?=[\\s\\S]*(?:^class[ \\t]+CreditCard\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+get_name\\b[^\\n]*))[\\s\\S]*$/m"

      - description: "BankTransfer implements all abstract methods"
        command: |
          source = open('/tutorial/payments.py').read()
          ns = {}
          exec(source, ns)
          bt = ns['BankTransfer']('DE89370400440532013000')
          assert bt.get_name() == 'Bank Transfer', \
              f"BankTransfer.get_name() should return 'Bank Transfer' but got '{bt.get_name()}'"
          result = bt.process(150.00)
          assert result == True, \
              "BankTransfer.process() should return True"
        hints:
          - title: Find the missing concrete behavior
            text: Compare BankTransfer's methods with the contract declared by PaymentMethod. Which operations are inherited as requirements rather than usable implementations?
            condition: "code_not_matches: /^class[ \\t]+BankTransfer\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+process\\b[^\\n]*/m"
          - title: Check both sides of the contract
            text: Implementing processing alone leaves the display-name operation unresolved. Trace how the driver uses both operations for BankTransfer.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+BankTransfer\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+process\\b[^\\n]*))(?![\\s\\S]*(?:^class[ \\t]+BankTransfer\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+get_name\\b[^\\n]*))[\\s\\S]*$/m"
          - title: Separate side effects from return values
            text: Call each BankTransfer operation and record displayed text separately from its returned value. Compare both with the task requirements; printing success does not automatically return success.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+BankTransfer\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+process\\b[^\\n]*))(?=[\\s\\S]*(?:^class[ \\t]+BankTransfer\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+get_name\\b[^\\n]*))[\\s\\S]*$/m"

    quiz:
      title: "Step 8 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            What does italic text on a class name in UML indicate?
          type: single
          options:
            - "The class is deprecated and should not be used"
            - "The class is abstract and cannot be instantiated"
            - "The class is private and only used within its module"
            - "The class is a singleton with exactly one instance"
          correct_index: 1
          explanation: |
            Italic text in UML indicates **abstract** — the class (or method) cannot be used directly and must be implemented by a subclass. In Python, this is achieved using `ABC` and `@abstractmethod`.

        - question: |
            What happens if a Python class inherits from an abstract class but does NOT implement all abstract methods?
          type: single
          options:
            - "The code runs normally with default behavior"
            - "Python prints a warning but allows instantiation"
            - "Python raises a TypeError when you try to instantiate the class"
            - "The methods are automatically implemented as empty"
          correct_index: 2
          explanation: |
            Python raises a `TypeError` at instantiation time if any `@abstractmethod` is not implemented. This enforces the contract defined by the abstract class — you cannot create an incomplete implementation.

        - question: |
            **Review of Step 4.** In the target diagram for this step, which direction does the triangle point between `CreditCard` and `PaymentMethod`?
          type: single
          options:
            - "From `PaymentMethod` down to `CreditCard`"
            - "From `CreditCard` up to `PaymentMethod`"
            - "Both directions — it is bidirectional"
            - "Sideways — direction is not significant in UML"
          correct_index: 1
          explanation: |
            The hollow triangle of a generalisation arrow **always** points at the parent/superclass — here, `PaymentMethod`. The child class (`CreditCard`) is at the non-triangle end. This is one of the most commonly reversed notations in student diagrams (Chren et al., 2019). "*A CreditCard is a PaymentMethod*" — the sentence order mirrors the arrow direction.


  # --------------------------------------------------------------------------
  # STEP 9 — "UML Class Diagram Reference"
  # Pedagogy:
  #   Summary / Retrieval Practice — consolidates all notation learned.
  #   Serves as a reference card students can revisit.
  # --------------------------------------------------------------------------
  - title: "UML Class Diagram Reference"
    key: class-reference
    instructions: |
      ### Why this matters

      You have practiced the main class-diagram notations. This reference collects them and introduces the dependency arrow for temporary use. Keep it available when choosing relationships for your own design in the next step.

      ### 🎯 You will learn to

      - Evaluate a design situation and pick the right UML relationship using the decision flowchart
      - Apply the consolidated notation reference when reading or drawing class diagrams in the future

      You have learned to read and create UML class diagrams. The page below summarizes every notation element covered in this tutorial — use it as a quick reference.

      ---

      ### The Class Box

      Every class is drawn as a box with three compartments:

      | Compartment | Contains | Python |
      |---|---|---|
      | **Top** | Class name | `class ClassName:` |
      | **Middle** | Attributes | `self.x = value` |
      | **Bottom** | Methods | `def method(self):` |

      ---

      ### Visibility

      | UML | Meaning | Python Convention |
      |---|---|---|
      | `+` | **Public** | `self.name` (no prefix) |
      | `-` | **Private** | `self.__name` (double underscore) |
      | `#` | **Protected** | `self._name` (single underscore) |

      ---

      ### Types

      | UML | Python |
      |---|---|
      | `name: str` | `self.name: str = name` |
      | `get_price(): float` | `def get_price(self) -> float:` |
      | `process(amount: float): bool` | `def process(self, amount: float) -> bool:` |

      ---

      ### Relationships

      | Symbol | Name | Design Meaning | Analyzer Pattern |
      |---|---|---|---|
      | <span class="uml-sym" data-diagram="class" data-sym="--&#124;>"></span> | **Inheritance** | Child supports the parent's contract | `class Child(Parent):` |
      | <span class="uml-sym" data-diagram="class" data-sym="-->"></span> | **Association** | "knows-about" — stores a reference | `self.other: OtherClass = other` |
      | <span class="uml-sym" data-diagram="class" data-sym="*--"></span> | **Composition** | Exclusive composite owner; parts deleted with whole unless detached | `self.part = Part(...)`, or append a newly constructed part |
      | <span class="uml-sym" data-diagram="class" data-sym="o--"></span> | **Aggregation** | Shared whole-part grouping; precise meaning is domain-specific | `self.parts.append(part)` with a typed method parameter |
      | <span class="uml-sym" data-diagram="class" data-sym="..>"></span> | **Dependency** | "temporarily uses" — weakest link | Uses a class inside a method body only |

      The analyzer column predicts generated notation for known classes. It cannot prove substitutability, exclusive ownership, or deletion behavior. Use the design meaning to decide whether an inferred relationship fits the requirements.

      ---

      ### Dependency

      A **dependency** <span class="uml-sym" data-diagram="class" data-sym="..>"></span> is the weakest relationship between classes. It means one class *temporarily uses* another — typically as a method parameter or local variable inside a single method — without storing a persistent reference.

      ```python
      class ReportGenerator:
          def generate(self, data: list) -> str:
              formatter = HTMLFormatter()   # Used locally, not stored
              return formatter.format(data)
      ```

      In UML, this is drawn as a **dashed arrow** from `ReportGenerator` to `HTMLFormatter`. The key difference from association: the `ReportGenerator` does NOT have an `HTMLFormatter` attribute — it only creates and uses one temporarily inside `generate()`.

      **Patterns recognized by this analyzer:**
      - `self.x: OtherClass = OtherClass(...)` → **association** (new object retained in an attribute)
      - `self.x: OtherClass = other` → **association** (existing object retained in an attribute)
      - `local_var = OtherClass(...)` inside a method, never retained → **dependency** (temporary use)

      ---

      ### Multiplicity

      | Notation | Meaning |
      |---|---|
      | `1` | Exactly one |
      | `0..1` | Zero or one (optional) |
      | `*` *(preferred shorthand for zero or more)* | Zero or more |
      | `1..*` | One or more |
      | `n..m` | Between n and m |

      **Placement:** the number sits next to the class it *quantifies* — it answers "for *one* of the opposite class, how many of **this** class?"

      **Style (Ambler G117):** Show multiplicity on **both ends** of every relationship; prefer `*` over verbose `0..*`.

      ---

      ### Abstract Classes

      | UML | Meaning | Python |
      |---|---|---|
      | *Italic class name* | Abstract class — cannot be instantiated | `class Name(ABC):` |
      | *Italic method name* / `{abstract}` | Abstract method — must be overridden | `@abstractmethod` |

      ---

      ### Choosing the Right Relationship — a Decision Flowchart

      Start with the domain requirements, then compare them with the generated diagram:

      1. **Should instances of this class be usable wherever the other class's contract is expected, keeping its promises?**
         → **Inheritance** <span class="uml-sym" data-diagram="class" data-sym="--|>"></span> may fit. Shared fields or repeated code alone are insufficient.
      2. **Is this a whole-part relationship with at most one composite owner, where deleting the whole deletes its parts unless detached first?**
         → **Composition** <span class="uml-sym" data-diagram="class" data-sym="*--"></span>. Construction location does not decide it.
      3. **Does the domain call for a shared whole-part grouping with a meaning the team has agreed on?**
         → **Aggregation** <span class="uml-sym" data-diagram="class" data-sym="o--"></span> can express that convention. Use a plain association if the grouping adds no useful meaning.
      4. **Do the objects have a structural link, such as a retained reference, with no additional whole-part contract?**
         → **Association** <span class="uml-sym" data-diagram="class" data-sym="-->"></span>.
      5. **Does the class use the other temporarily without retaining a reference?**
         → **Dependency** <span class="uml-sym" data-diagram="class" data-sym="..>"></span>.

      If you have no evidence for a relationship, leave it out. A generated arrow records what the analyzer recognized; review it against these questions before adopting it as a design claim.

      ### Your Toolkit for the Capstone

      Use this reference while proposing the store design in the next step. It supports these tasks:

      1. **Read** a UML class diagram and understand its structure
      2. **Write** Python code that matches a given diagram
      3. **Evaluate** whether a class groups related responsibilities
      4. **Distinguish** between association, composition, and aggregation
      5. **Communicate** software architecture without showing code
      6. **Recognise the limits of UML** — aggregation's fuzzy semantics, the language-specific gap between Python's `_`/`__` and UML `-`/`#`, and when to leave notation off rather than force it

    files:
      - path: class-reference.md
        content: |
          # Class Diagram Reference

          Use the instructions as a reference for your upcoming store design.
        language: markdown

    open_file: class-reference.md


  # --------------------------------------------------------------------------
  # STEP 10 — "A Store Design Proposal"
  # Pedagogy: generation before comparison; independent design with a self-review rubric.
  # No automatic grade claims to assess the quality of the student's explanation.
  # --------------------------------------------------------------------------
  - title: "A Store Design Proposal"
    key: store-design
    instructions: |
      ### Why this matters

      Choosing responsibilities is a different skill from translating an existing diagram into code. Make a small design proposal first. In the final step you will compare it with a suggested solution, explain what you would revise, and implement that solution.

      ### 🎯 You will learn to

      - Propose classes and relationships from behavior requirements
      - Justify responsibility boundaries using a success case and a rejection case

      ### The Store's Requirements

      Design a small in-memory store. Choose your own class names and allocation of responsibilities; no target diagram is supplied yet.

      - **Catalog assumptions:** supplied product names are unique and prices and starting stocks are nonnegative; input validation for these facts is outside this exercise. A customer has a name and an email address.
      - **Successful purchase:** keep the requested products in order, including repetitions. Each occurrence contributes its price and reduces its stock by one. Record the purchase and confirm the customer email and total to two decimal places.
      - **Rejected purchase:** an unknown product or insufficient stock raises `ValueError` before any stock, recorded purchases, or confirmation output changes. Count repeated names toward the quantity requested.
      - **Empty request:** record an empty purchase with a zero total and confirm it.

      ### Your Design Proposal

      Spend about ten minutes on a first attempt. Open `store-design.md` and use its prompts, or make a sketch and record the reasons in that file. You do not need to run Python in this step.

      1. **Assign responsibilities:** propose classes, each with a one-sentence purpose, the state it holds, and a small set of operations. Decide which facts belong together and which class coordinates a purchase.
      2. **Choose relationships:** describe at least two links, their direction, and their multiplicities. State which references persist and which are temporary. Justify any inheritance or diamond from a contract; do not infer ownership from creation location alone.
      3. **Trace two requests:** a $3 product with stock 2 is requested twice, then three times in a separate fresh store with the same starting stock. Record the expected total or error, final stock, recorded purchases, and confirmation. For each action, name the responsibility that should handle it.
      4. **Stress the design:** explain what happens for an empty request and an unknown product. Identify one uncertainty or trade-off you would want a reviewer to discuss.

      ### Self-Review Before Continuing

      - Can you explain why each class's data and operations belong together?
      - Does every required behavior have a responsible class, including rejecting a whole request before side effects?
      - Do your relationship choices follow the requirements, with assumptions marked where the requirements are silent?

      This proposal has no automatic pass/fail grade. Use the checklist to review your reasoning, then select **Next**. Keep the original proposal: the comparison in the final step is part of the task, and more than one initial design can be reasonable.

