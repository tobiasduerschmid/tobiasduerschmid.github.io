  # --------------------------------------------------------------------------
  # STEP 7 — "Multiplicity: How Many?"
  # Pedagogy:
  #   Reading heuristic — "read it as a sentence."
  #   Common Mistake — reversed multiplicity placement (Chren et al.).
  #   Bloom's level — Understand (read notation), Apply (implement list).
  # --------------------------------------------------------------------------
  - title: "Multiplicity: How Many?"
    key: multiplicity
    instructions: |
      ## Multiplicity Notation

      ### Why this matters

      "A `Playlist` has `Song`s" is not enough information to write the code. Can a playlist be empty? Must a song belong to exactly one playlist? Can the same song appear on many? These cardinality questions are exactly what multiplicity annotations answer — and they are also where students most often flip the numbers, because the placement rule ("next to the class it quantifies") is counter-intuitive at first.

      ### 🎯 You will learn to

      - Apply multiplicity notation (`1`, `0..1`, `*`, `1..*`) to UML associations
      - Analyze whether a Python attribute should be a single object or a list

      ### What Is Multiplicity?

      Multiplicity tells you **how many** instances participate in a relationship. It is written as a number or range next to each end of an association line.

      | Notation | Meaning | Equivalent |
      |---|---|---|
      | `1` | Exactly one | |
      | `0..1` | Zero or one (optional) | |
      | `*` (or `0..*`) | Zero or more | a collection that may be empty |
      | `1..*` | One or more | a collection that must have at least one element |

      > **Style tip:** Prefer `*` over verbose `0..*`. The UML spec defines them as identical, and `*` is the more concise and widely recognized shorthand. Use the explicit `0..*` only when you want to emphasize the lower bound in context (e.g., contrasting it with `1..*` nearby).

      ### Reading Multiplicity as a Sentence

      Read from each end toward the other. Multiplicity sits next to the class end it quantifies:

      Playlist <span class="uml-sym" data-diagram="class" data-sym="-->"></span> **"0..\*"** Song

      - Left-to-right: "One `Playlist` contains **zero or more** `Song`s."
      - Right-to-left: "How many playlists can contain one `Song`?" The blank Playlist end leaves that answer **unspecified**.

      > **⚠ An omitted multiplicity is unspecified.** The code tells us how many songs each playlist stores, but it does not limit how many playlists share a song. A model that allows a song on zero or more playlists could state `Playlist "0..*" --> "*" Song`. Add that reverse bound when the design establishes it.

      **Placement rule:** The number sits next to the class it **quantifies**. The `0..*` goes next to `Song` because *one playlist has many songs*, not because there are "many songs in general."

      > **⚠ Common mistake (Chren et al., 2019):** Beginners flip the multiplicities — putting `*` next to the playlist end to mean "there are many playlists." That is **wrong**. Multiplicity always answers: *"For one instance of the opposite class, how many of **this** class participate?"*

      ### Your Target Diagram

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-spec='@startuml
      layout landscape
      class Song {
        + title: str
        + artist: str
        + duration_sec: int
        + __init__(title: str, artist: str, duration_sec: int): None
      }
      class Playlist {
        + name: str
        + songs: list[Song]
        + __init__(name: str): None
        + add_song(song: Song): None
        + get_total_duration(): int
        + get_song_count(): int
      }
      Playlist --> "*" Song
      @enduml'></div>

      The association records stored references. The `*` describes how many songs a playlist can contain; it establishes neither exclusive ownership nor a limit on how many playlists share a song.

      ### Your Task

      The starter code has a `Playlist` that holds a single `Song`. Refactor it to hold **many** songs:

      1. **Interpret** the target's multiplicity and update the constructor and stored state to match. A new playlist starts empty and retains its name.
      2. **Implement** the target's `add_song` operation so each call retains the supplied song. Adding a song must preserve earlier entries.
      3. **Report** the total duration and song count through the target's query operations. Both must include every added entry and return zero for an empty playlist.
      4. **Check** the UML multiplicity and the behavior of empty and populated playlists. Update the example in `__main__` to use the new interface.

      > **Practice with Rename Symbol:** Use **Refactor: Rename Symbol...** on `self.song` to rename the attribute before changing it to a collection. Review the preview: renaming updates references, while changing the stored value and implementing the collection operations remain your work. Check the UML multiplicity and run **Test My Work** afterward.

      The `*` multiplicity means the playlist can have zero or more songs.

    uml_files:
      - playlist.py

    files:
      - path: playlist.py
        content: |
          class Song:
              def __init__(self, title: str, artist: str, duration_sec: int) -> None:
                  self.title: str = title
                  self.artist: str = artist
                  self.duration_sec: int = duration_sec


          class Playlist:
              """Currently holds a single song. Refactor to hold many songs!"""

              def __init__(self, name: str, song: Song) -> None:
                  self.name: str = name
                  self.song: Song = song  # Currently holds only one song.


          if __name__ == "__main__":
              s1 = Song("Bohemian Rhapsody", "Queen", 354)
              p = Playlist("Road Trip", s1)
              print(f"Playlist: {p.name}")
        language: python

    open_file: playlist.py

    solution:
      files:
        - path: playlist.py
          content: |
            class Song:
                def __init__(self, title: str, artist: str, duration_sec: int) -> None:
                    self.title: str = title
                    self.artist: str = artist
                    self.duration_sec: int = duration_sec


            class Playlist:
                def __init__(self, name: str) -> None:
                    self.name: str = name
                    self.songs: list[Song] = []

                def add_song(self, song: Song) -> None:
                    self.songs.append(song)

                def get_total_duration(self) -> int:
                    return sum(s.duration_sec for s in self.songs)

                def get_song_count(self) -> int:
                    return len(self.songs)


            if __name__ == "__main__":
                p = Playlist("Road Trip")
                p.add_song(Song("Bohemian Rhapsody", "Queen", 354))
                p.add_song(Song("Hotel California", "Eagles", 391))
                p.add_song(Song("Stairway to Heaven", "Led Zeppelin", 482))
                print(f"Playlist: {p.name}")
                print(f"Songs: {p.get_song_count()}")
                print(f"Total duration: {p.get_total_duration()}s")
          language: python
      explanation: |
        The multiplicity `*` maps directly to Python's `list`:
        - `add_song()` allows adding any number of songs (the `*`)
        - In this model, songs can be shared across playlists and have independent lifetimes

        The analyzer infers `*` from the collection and an ordinary association from the stored references. A collection can hold owned parts or independent objects; its type does not establish that distinction. A list fits this exercise; other collection types may fit other designs.

