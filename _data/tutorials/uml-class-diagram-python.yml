          - title: Separate playlist identity from contents
            text: Identify what is needed to create a named playlist before it contains any songs. Compare the constructor parameters with the state you want immediately afterward.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Playlist\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?\\bself\\.(?:songs)\\b))(?![\\s\\S]*(?:^class[ \\t]+Playlist\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+__init__\\b[^\\n]*\\n(?:(?!^\\S|^ {1,4}\\S)[\\s\\S])*?self\\.songs[ \\t]*(?::[^=\\n]+)?=))[\\s\\S]*$/m"
          - title: Check an empty instance
