            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Product\\b))(?![\\s\\S]*(?:^class[ \\t]+Product\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+reduce_stock\\b[^\\n]*\\n(?:(?!^\\S|^ {1,4}\\S)[\\s\\S])*?self\\.stock\\b))[\\s\\S]*$/m"
