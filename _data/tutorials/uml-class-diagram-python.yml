    quiz:
      title: "Step 11 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            Which finding most strongly suggests that a class has become a God Class?
          type: single
          options:
            - "It has several arrows pointing to collaborating classes"
            - "It combines responsibilities that change for unrelated reasons"
            - "It offers many operations for one cohesive responsibility"
            - "It keeps its internal state behind private attributes"
          correct_index: 1
          option_feedback:
            0: "Collaboration alone is not evidence of excessive responsibility. Inspect what the class does and why that work changes."
            2: "A substantial interface can still serve one coherent purpose. Count distinct responsibilities, not just methods."
            3: "Encapsulating state does not tell you whether the class has too many responsibilities."
          explanation: |
            A God Class concentrates responsibilities that would be easier to change separately. A large box can prompt investigation, but size or arrow count alone does not establish the problem. In the starter, product stock, customer identity, and order processing provide concrete responsibilities to examine.

        - question: |
            How does UML help you detect design problems that are hard to see in code?
          type: single
          options:
            - "UML runs the code and finds bugs automatically"
            - "It exposes responsibilities and links for design review"
            - "UML translates the code into a different programming language"
            - "UML counts the lines of code in each class"
          correct_index: 1
          explanation: |
            A diagram makes classes, members, and relationships easier to inspect together. That helps you ask design questions, such as whether responsibilities belong together. The answers still require domain knowledge and behavior checks; the picture alone does not prove quality.

        - question: |
            Match the UML notation to its meaning: a **solid line with a filled diamond** on one end.
          type: single
          options:
            - "Inheritance — one class extends another"
            - "Aggregation — a shared whole-part grouping"
            - "Composition — the part's lifecycle is bound to the whole"
            - "Dependency — one class temporarily uses another"
          correct_index: 2
          explanation: |
            A filled diamond means **composition**: a part has at most one composite owner and is deleted with the whole unless detached first. A hollow diamond marks shared aggregation; its precise ownership and lifecycle meaning comes from the domain.

        - question: |
            A `Course` class stores `self.instructor: Instructor = instructor` where the instructor is passed in from outside and continues to exist independently when a course is deleted. Why is this an **association** rather than composition?
          type: single
          options:
            - "Because Course and Instructor are in different files"
            - "Because the Instructor's lifecycle is independent of Course"
            - "Because Instructor is abstract"
            - "Because there is no multiplicity notation"
          correct_index: 1
          explanation: |
            The stem explicitly says that the `Instructor` exists independently. Passing an object into a constructor alone would not establish that lifecycle rule. Deleting a course does not delete the instructor. This is a reference, not ownership, so it is an **association** (plain arrow) rather than composition (filled diamond).

        - question: |
            What does italic text on a class name in a UML diagram indicate?
          type: single
          options:
            - "The class is deprecated and should not be used"
            - "The class is abstract — it cannot be instantiated directly"
            - "The class is private to the module"
            - "The class is a utility class with only static methods"
          correct_index: 1
          explanation: |
            Italic text in UML indicates **abstract** — the class cannot be instantiated and must be subclassed. In Python, this is achieved with `class Name(ABC):` and `@abstractmethod`.

        - question: |
            In UML, `Department "1" --> "*" Employee` — what does `*` next to Employee mean?
          type: single
          options:
            - "Each employee belongs to zero or more departments"
            - "A department has zero or more employees"
            - "There are zero or more departments"
            - "Employees are optional in the system"
          correct_index: 1
          explanation: |
            The multiplicity `*` is placed next to `Employee` because it quantifies how many employees a department can have: **zero or more**. Read it as a sentence: "One Department has zero or more Employees."

        - question: |
            What is the most important purpose of a UML class diagram?
          type: single
          options:
            - "To generate code automatically from the diagram"
            - "To replace inline code documentation and comments"
            - "To communicate system structure and relationships visually"
            - "To test the code for bugs before runtime"
          correct_index: 2
          explanation: |
            The primary purpose of UML is **communication**. A class diagram lets developers understand and discuss the architecture of a system — what classes exist, how they relate, and what contracts they define — without reading every line of code. It is a thinking and communication tool, not a replacement for code.
