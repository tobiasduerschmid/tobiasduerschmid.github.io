    solution:
      files:
        - path: university.py
          content: |
            class Professor:
                def __init__(self, name: str, field: str) -> None:
                    self.name: str = name
                    self.field: str = field


            class Department:
                def __init__(self, name: str) -> None:
                    self.name: str = name
                    self.professors: list[Professor] = []

                def add_professor(self, prof: Professor) -> None:
                    self.professors.append(prof)


            class University:
                def __init__(self, name: str) -> None:
                    self.name: str = name
                    self.departments: list[Department] = []

                def add_department(self, dept_name: str) -> None:
                    dept = Department(dept_name)
                    self.departments.append(dept)

                def get_department(self, name: str) -> Department:
                    for dept in self.departments:
                        if dept.name == name:
                            return dept
                    raise ValueError(f"Department '{name}' not found")


            if __name__ == "__main__":
                prof_alice = Professor("Dr. Alice", "AI")
                prof_bob = Professor("Dr. Bob", "Systems")

                uni = University("State University")
                uni.add_department("Computer Science")
                uni.add_department("Mathematics")

                cs = uni.get_department("Computer Science")
                cs.add_professor(prof_alice)
                cs.add_professor(prof_bob)

                print(f"{uni.name} has {len(uni.departments)} departments")
                print(f"CS has {len(cs.professors)} professors")
          language: python
      explanation: |
        `add_department` constructs and retains a department; `add_professor` retains the supplied professor. The analyzer emits **associations** for both stored-reference patterns. Neither construction nor injection proves exclusive ownership or deletion behavior.

        The domain rules justify the target diamonds: departments have an exclusive university owner and a lifecycle tied to it, while professors form a staff grouping and have independent lifetimes. The checks confirm construction, storage, and object identity. They do not prove the deletion policy, which this example does not implement.

