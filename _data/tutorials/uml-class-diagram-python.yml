            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Playlist\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+add_song\\b[^\\n]*))(?=[\\s\\S]*(?:^class[ \\t]+Playlist\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+get_song_count\\b[^\\n]*))[\\s\\S]*$/m"

