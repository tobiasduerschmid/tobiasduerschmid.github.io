title: "UML Class Diagrams in Python"
description: "Learn UML class diagrams through Python, then propose a store design before comparing it with and implementing a suggested solution. Explain how responsibilities, contracts, and relationships make the design easier to change."

# Authoring-time Bloom-verb objectives. Not yet rendered to students.
learning_objectives:
  - "Read a UML class diagram and write Python code that matches it (visibility, types, multiplicity, inheritance)."
  - "Distinguish association, aggregation, and composition by their UML notation and life-cycle implications."
  - "Apply UML's visibility modifiers (`+`, `-`, `#`, `~`) and explain how they map to Python's leading-underscore conventions."
  - "Read multiplicity annotations (`1`, `*`, `0..1`, `1..*`) and translate them into the correct Python data structures."
  - "Evaluate a UML class diagram critically and identify design flaws (cyclic dependencies, missing abstractions, over-coupling)."
  - "Propose a class design from behavior requirements, compare it with a suggested solution, and justify a revision."

backend: pyodide
linter: true  # live pyflakes diagnostics in the Monaco gutter
uml_diagram: true
uml_position: bottom-left
uml_default_view: true
uml_class_layout: landscape
require_tests: true
autosave_type: files
progress_version: 1
legacy_step_keys:
  - first-class
  - visibility
  - types
  - inheritance
  - association
  - ownership
  - multiplicity
  - abstract-classes
  - store-capstone
  - class-reference

setup_commands:
  - "import sys; sys.path.insert(0, '/tutorial'); import abc"

steps:

  # --------------------------------------------------------------------------
  # STEP 1 — "Your First Class Diagram"
  # Pedagogy:
  #   Worked Example — walk through the mapping from UML to Python.
  #   Component Skill Isolation (CLT) — only the class box, nothing else.
  #   Bloom's level — Remember (identify compartments), Apply (write class).
  # --------------------------------------------------------------------------
  - title: "Your First Class Diagram"
    key: first-class
    uml_hide:
      - visibility
    instructions: |
      ## Welcome to UML Class Diagrams

      **Which diagram view should I use?** Use **Implementation details** when matching your code to a target diagram or checking an exercise. **Design focus** is for reference only: it simplifies types, names, and expressions to emphasize the design. Target diagrams use the same Python names and types as **Implementation details**. Switching views does not change your code or verify correctness; use **Test My Work** to check the exercise.

      ### Why this matters

      Before you can read a UML class diagram, you have to know how to look at one. The class box is the atom of the entire notation — every other concept (visibility, types, inheritance, multiplicity) is just decoration on this three-compartment shape. Get this single building block solid and the rest of the tutorial clicks into place.

      ### 🎯 You will learn to

      - Identify the three compartments of a UML class box (name, attributes, methods)
      - Apply that mapping to write a Python class that matches a target diagram

      > **💡 Light mode recommended.** The UML diagrams in this tutorial are easier to read on a light background. If you are in dark mode, consider switching with the **Dark mode** toggle in the tutorial navbar.

      > **Heads up — learning UML feels weird at first.** You are about to map two things that look very different: boxes with symbols on one side, Python code on the other. The first few connections take effort to see. If a notation feels arbitrary, that's normal — keep going. By Step 4 you'll be reading diagrams as fluently as you read code.

      ### What Is a UML Class Diagram?

      A UML class diagram is a visual blueprint of your software's structure. It shows what classes exist, what data they hold, what behavior they provide, and how they relate to each other. Think of it as a floor plan — you can understand the building without inspecting every brick.

      ### The Three Compartments

      Every class in UML is drawn as a box with three sections:

      | Compartment | Contains | Python Equivalent |
      |---|---|---|
      | **Top** | Class name | `class ClassName:` |
      | **Middle** | Attributes (data) | Instance variables in `__init__` |
      | **Bottom** | Methods (behavior) | Method definitions |

      ### Your Target Diagram

      Write Python code until the live diagram below matches this target:

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-spec='@startuml
      layout landscape
      class Student {
        name: str
        student_id: str
        __init__(name: str, student_id: str): None
        get_info(): str
      }
      @enduml'></div>

      ### Reading the Diagram

      - **Top:** The class name is `Student` → `class Student:`
      - **Middle:** Two attributes `name` and `student_id` → instance variables set in `__init__`
      - **Bottom:** The initializer accepts the two stored values; `get_info()` provides the information-producing operation

      The target shows Python annotations such as `str` and the initializer `__init__(...)`. Match the required attributes and operations using those spellings.

      > **Check the mapping:** Which Python operation initializes a `Student`, and which values must its caller supply? We will study visibility and type contracts in the next steps.

      ### Your Task

      Open `student.py` and create a `Student` class that:

      1. Defines `__init__(self, name: str, student_id: str) -> None`
      2. Stores both parameters as explicitly annotated `str` instance attributes
      3. Has a `get_info(self) -> str` method returning `"name (student_id)"` — for example `"Alice (S001)"`

      Watch the **UML Diagram** panel — it updates live as you type!

    uml_files:
      - student.py

    files:
      - path: student.py
        content: |
          # Your task: create a Student class that matches the target diagram.
          #
          # The class needs:
          #   - An __init__ that accepts name and student_id
          #   - Both stored as instance attributes
          #   - A get_info() method returning "name (student_id)"
        language: python

    open_file: student.py

    solution:
      files:
        - path: student.py
          content: |
            class Student:
                def __init__(self, name: str, student_id: str) -> None:
                    self.name: str = name
                    self.student_id: str = student_id

                def get_info(self) -> str:
                    return f"{self.name} ({self.student_id})"


            if __name__ == "__main__":
                s = Student("Alice", "S001")
                print(s.get_info())
          language: python
      explanation: |
        Each section of the UML box maps directly to Python:

        - **Top (class name):** `Student` → `class Student:`
        - **Middle (attributes):** `name`, `student_id` → `self.name = name`, `self.student_id = student_id`
        - **Bottom (methods):** `get_info()` → `def get_info(self) -> str:`

        The diagram is simply a visual summary of the class structure. In the next steps we will add visibility markers (who can access what) and type annotations (what kind of data flows where).

    tests:
      - description: "Student class exists"
        command: |
          source = open('/tutorial/student.py').read()
          ns = {}
          exec(source, ns)
          assert 'Student' in ns, \
              "Define a class called Student"
        hints:
          - title: Read the class box
            text: Start with the top compartment of the target. Which declaration gives the remaining attributes and operations a shared owner?
            condition: "code_not_matches: /^class[ \\t]+Student\\b/m"
          - title: Keep members inside the class
            text: A class declaration establishes the owner; indentation places its members inside it. Compare the constructor’s indentation with the class header.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Student\\b))(?![\\s\\S]*(?:^class[ \\t]+Student\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+__init__\\b[^\\n]*))[\\s\\S]*$/m"
          - title: Check the definition loads
            text: Run the file and inspect the first error before testing again. Verify that the class is defined at module level and that its name matches the target.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Student\\b))(?=[\\s\\S]*(?:^class[ \\t]+Student\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+__init__\\b[^\\n]*))[\\s\\S]*$/m"

      - description: "__init__ accepts name and student_id"
        command: |
          import inspect
          source = open('/tutorial/student.py').read()
          ns = {}
          exec(source, ns)
          assert 'Student' in ns, "Define a class called Student first"
          params = list(inspect.signature(ns['Student'].__init__).parameters.keys())
          assert 'name' in params, \
              "__init__ must have a 'name' parameter: def __init__(self, name, student_id)"
          assert 'student_id' in params, \
              "__init__ must have a 'student_id' parameter: def __init__(self, name, student_id)"
        hints:
          - title: Read the constructor operation
            text: Read the initializer signature in the target. Separate the receiver used inside a method from the values a caller supplies.
            condition: "code_not_matches: /^class[ \\t]+Student\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+__init__\\b[^\\n]*/m"
          - title: Trace one construction
            text: For Student("Alice", "S001"), map each supplied argument to a parameter. Which parameter represents each piece of student data?
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Student\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+__init__\\b[^\\n]*))(?![\\s\\S]*(?:^class[ \\t]+Student\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?def[ \\t]+__init__\\([^\\n]*\\bname\\b))[\\s\\S]*$/m"
          - title: Compare the two inputs
            text: "Write a two-row table: caller value → constructor parameter → stored attribute. Check that both rows have distinct parameters before writing the assignments."
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Student\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+__init__\\b[^\\n]*))(?=[\\s\\S]*(?:^class[ \\t]+Student\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?def[ \\t]+__init__\\([^\\n]*\\bname\\b))[\\s\\S]*$/m"

      - description: "Student has name and student_id attributes"
        command: |
          source = open('/tutorial/student.py').read()
          ns = {}
          exec(source, ns)
          s = ns['Student']('Alice', 'S001')
          assert hasattr(s, 'name'), \
              "Student needs a 'name' attribute — use self.name = name in __init__"
          assert s.name == 'Alice', \
              "self.name should store the name passed to __init__"
          assert hasattr(s, 'student_id'), \
              "Student needs a 'student_id' attribute — use self.student_id = student_id"
          assert s.student_id == 'S001', \
              "self.student_id should store the student_id passed to __init__"
        hints:
          - title: From parameters to state
            text: "Constructor parameters are temporary local names. Look back at the middle compartment: which values must still be available after construction finishes?"
            condition: "code_not_matches: /^class[ \\t]+Student\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+__init__\\b[^\\n]*/m"
          - title: Inspect a new student
            text: Construct one Student, then try reading each required attribute. A local assignment and an instance assignment affect different namespaces.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Student\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+__init__\\b[^\\n]*))(?![\\s\\S]*(?:^class[ \\t]+Student\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?\\bself\\.(?:name|student_id)\\b))[\\s\\S]*$/m"
          - title: Try two different students
            text: Create students with different names and IDs. Fill in “first object → values” and “second object → values”; compare that table with what your attributes contain.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Student\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+__init__\\b[^\\n]*))(?=[\\s\\S]*(?:^class[ \\t]+Student\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?\\bself\\.(?:name|student_id)\\b))[\\s\\S]*$/m"

      - description: "get_info() returns the correct format"
        command: |
          source = open('/tutorial/student.py').read()
          ns = {}
          exec(source, ns)
          s = ns['Student']('Alice', 'S001')
          assert hasattr(s, 'get_info'), \
              "Student needs a get_info() method"
          result = s.get_info()
          assert result is not None, \
              "get_info() should return a string — make sure it has a `return` statement"
          assert result == 'Alice (S001)', \
              f"get_info() should return 'Alice (S001)' but got '{result}'"
        hints:
          - title: Connect an operation to its result
            text: The bottom compartment includes an information-producing operation. Add that operation to the class and identify which stored values it needs.
            condition: "code_not_matches: /^class[ \\t]+Student\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+get_info\\b[^\\n]*/m"
          - title: Returned text versus printed text
            text: Call get_info() and assign its result to a variable. Does the variable contain the text, or does the call only display it?
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Student\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+get_info\\b[^\\n]*))(?![\\s\\S]*(?:^class[ \\t]+Student\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+get_info\\b[^\\n]*\\n(?:(?!^\\S|^ {1,4}\\S)[\\s\\S])*?\\breturn\\b))[\\s\\S]*$/m"
          - title: Build a character-level example
            text: For a new name and ID, write the expected text by hand. Mark the variable parts and the literal separators, then compare them with your result.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Student\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+get_info\\b[^\\n]*))(?=[\\s\\S]*(?:^class[ \\t]+Student\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+get_info\\b[^\\n]*\\n(?:(?!^\\S|^ {1,4}\\S)[\\s\\S])*?\\breturn\\b))[\\s\\S]*$/m"

    quiz:
      title: "Step 1 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            What does the **middle** compartment of a UML class box show?
          type: single
          options:
            - "The class name"
            - "The attributes (data) of the class"
            - "The methods (behavior) of the class"
            - "The relationships to other classes"
          correct_index: 1
          explanation: |
            The three compartments are: **top** = class name, **middle** = attributes, **bottom** = methods. Relationships are shown as arrows *between* class boxes, not inside them.

        - question: |
            A Python class has `self.x = 10` inside a `def calculate(self)` method. How many items appear in the UML class box?
          type: single
          options:
            - "1 — just the class name"
            - "2 — the class name and the method"
            - "3 — the class name, one attribute, and one method"
            - "4 — the class name, self, the attribute, and the method"
          correct_index: 2
          explanation: |
            The UML box has three compartments: the class name at the top, `x` in the attributes section (middle), and `calculate()` in the methods section (bottom). `self` is not shown in UML — it is implicit.

        - question: |
            **Predict before you run.** Given this Python code, *how many items* will appear in the **bottom** (methods) compartment of the UML box?

            ```python
            class Timer:
                def __init__(self, seconds: int) -> None:
                    self.seconds: int = seconds
                    self.running: bool = False

                def start(self) -> None:
                    self.running = True

                def stop(self) -> None:
                    self.running = False
            ```
          type: single
          options:
            - "2 — only start() and stop()"
            - "3 — __init__(), start(), and stop()"
            - "4 — __init__(), start(), stop(), and seconds"
            - "0 — none, because methods aren't shown yet"
          correct_index: 1
          explanation: |
            The bottom compartment lists **operations**: `__init__`, `start`, and `stop`. The attributes `seconds` and `running` go in the **middle** compartment, not the bottom.


  # --------------------------------------------------------------------------
  # STEP 2 — "Visibility: Who Can See What?"
  # Pedagogy:
  #   Constructivism — bridge Python _ and __ conventions to UML symbols.
  #   Negative Transfer — Python devs think visibility doesn't matter;
  #     UML forces explicit design decisions about encapsulation.
  #   Bloom's level — Understand (explain mapping), Apply (rename attrs).
  # --------------------------------------------------------------------------
  - title: "Visibility: Who Can See What?"
    key: visibility
    instructions: |
      ## Visibility Markers

      ### Why this matters

      Python lets any caller reach in and grab any attribute, so visibility feels optional — until your codebase grows and you discover three modules monkey-patching the same "internal" field. UML forces you to make the call: which parts are the public contract, and which are implementation details that may change without warning? Naming conventions are how Python communicates that decision.

      ### 🎯 You will learn to

      - Apply Python's `_`/`__` naming conventions to express the four UML visibility levels
      - Analyze why encapsulation is a deliberate design decision rather than a language feature

      ### The Four UML Visibility Levels

      UML uses symbols to show *who* can access each attribute or method:

      | UML Symbol | Meaning | Access Scope |
      |---|---|---|
      | `+` | **Public** | Any object in the system |
      | `-` | **Private** | Only the implementing class itself |
      | `#` | **Protected** | The class and its subclasses |
      | `~` | **Package** | Classes in the same package |

      ### Python Is Different — and That's Part of the Lesson

      Unlike Java or C++, **Python has no `private` or `protected` keywords**. Naming conventions communicate which members belong to the public interface and which are internal. This tutorial uses the following Python-to-UML mapping that the live diagram renderer recognises:

      | UML | Python (as read by this renderer) |
      |---|---|
      | `+` Public | `self.name` (no prefix) |
      | `#` Protected | `self._name` (single leading underscore) |
      | `-` Private | `self.__name` (double leading underscore) |

      ### Encapsulation: Let the Class Manage Its State

      The core idea is **encapsulation**: callers use the public interface, and the class manages its internal state. For `BankAccount`, callers use `deposit`, `withdraw`, and `get_balance`. The account's methods check amounts and reject withdrawals that exceed the balance; directly assigning a new balance would bypass those checks.

      ```python
      account = BankAccount(100.0)
      account.deposit(50.0)
      print(account.get_balance())  # 150.0
      ```

      The visibility choices tell readers how to use the class:

      - **Public operations (`+`):** `deposit`, `withdraw`, and `get_balance` are available to callers.
      - **Internal state:** The balance is managed inside the class, through those operations.
      - **Internal helper:** Amount validation supports the account's methods. Callers should use the public operations instead.

      This boundary also lets the class change how it stores or checks its data without requiring callers to change.

      <details markdown="1">
      <summary>Python detail: name mangling</summary>

      A single leading `_` normally signals any non-public member. This renderer uses `__` for UML private (`-`); Python calls its name-rewriting mechanism **name mangling**, and it does not enforce private access.

      </details>

      > **Key takeaway:** Choose visibility to make the **public contract** clear and keep implementation details internal. The naming convention communicates that design.

      The target retains Python naming markers: `- __balance` corresponds to `self.__balance`, and `# _validate_amount` corresponds to `_validate_amount`. The visibility markers describe conventions and name mangling, not enforced Python privacy.

      ### Your Target Diagram

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-spec='@startuml
      layout landscape
      class BankAccount {
        - __balance: float
        + __init__(initial_balance: float): None
        + deposit(amount: float): None
        + withdraw(amount: float): bool
        + get_balance(): float
        # _validate_amount(amount: float): bool
      }
      @enduml'></div>

      ### Your Task

      The starter code has a `BankAccount` where everything is public. Use the target to decide what needs to change:

      1. **Compare** each attribute and operation's current visibility with its marker in the target diagram.
      2. **Refactor** mismatched members using the Python naming conventions taught above. Preserve the public interface.
      3. **Check** that internal reads, writes, and helper calls still refer to the intended members and that deposits and withdrawals behave as before.

      Compare the resulting visibility markers with the target, then run **Test My Work** to check behavior too.

    uml_files:
      - bank_account.py

    files:
      - path: bank_account.py
        content: |
          class BankAccount:
              """A bank account — but everything is public!
              Your job: apply proper visibility using Python naming conventions."""

              def __init__(self, initial_balance: float) -> None:
                  self.balance: float = initial_balance

              def deposit(self, amount: float) -> None:
                  if self.validate_amount(amount):
                      self.balance += amount

              def withdraw(self, amount: float) -> bool:
                  if self.validate_amount(amount) and self.balance >= amount:
                      self.balance -= amount
                      return True
                  return False

              def get_balance(self) -> float:
                  return self.balance

              def validate_amount(self, amount: float) -> bool:
                  return amount > 0


          if __name__ == "__main__":
              account = BankAccount(100.0)
              account.deposit(50.0)
              print(f"Balance: ${account.get_balance():.2f}")
              account.withdraw(30.0)
              print(f"Balance: ${account.get_balance():.2f}")
        language: python

    open_file: bank_account.py

    solution:
      files:
        - path: bank_account.py
          content: |
            class BankAccount:
                """A bank account with proper visibility."""

                def __init__(self, initial_balance: float) -> None:
                    self.__balance: float = initial_balance

                def deposit(self, amount: float) -> None:
                    if self._validate_amount(amount):
                        self.__balance += amount

                def withdraw(self, amount: float) -> bool:
                    if self._validate_amount(amount) and self.__balance >= amount:
                        self.__balance -= amount
                        return True
                    return False

                def get_balance(self) -> float:
                    return self.__balance

                def _validate_amount(self, amount: float) -> bool:
                    return amount > 0


            if __name__ == "__main__":
                account = BankAccount(100.0)
                account.deposit(50.0)
                print(f"Balance: ${account.get_balance():.2f}")
                account.withdraw(30.0)
                print(f"Balance: ${account.get_balance():.2f}")
          language: python
      explanation: |
        The renaming maps directly to UML visibility:

        - `self.balance` → `self.__balance` makes the UML show `-` (private)
        - `self.validate_amount` → `self._validate_amount` makes the UML show `#` (protected)
        - Public methods keep their names → UML shows `+`

        **Key insight:** Python lets you access *anything*, but that does not mean you *should*. The UML diagram documents your **design intent** — which parts are the public interface and which are internal implementation details.

    tests:
      - description: "Balance visibility matches the target"
        command: |
          source = open('/tutorial/bank_account.py').read()
          ns = {}
          exec(source, ns)
          account = ns['BankAccount'](100.0)
          assert hasattr(account, '_BankAccount__balance'), \
              "Compare the balance attribute's visibility with the target and the naming-convention table."
          assert not hasattr(account, 'balance'), \
              "The balance should no longer be exposed as a public attribute."
        hints:
          - title: Match the visibility marker
            text: Locate balance in the target and consult the visibility mapping for this renderer. Decide which spelling will represent the internal attribute.
            condition: "code_not_matches: /^class[ \\t]+BankAccount\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?\\bself\\.(?:__balance)\\b/m"
          - title: Follow every balance access
            text: After changing the declaration, search the BankAccount methods for accesses to the old attribute. Constructor writes and later reads must refer to the same state.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+BankAccount\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?\\bself\\.(?:__balance)\\b))(?![\\s\\S]*(?:^class[ \\t]+BankAccount\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?def[ \\t]+get_balance\\b[\\s\\S]*?self\\.__balance\\b))[\\s\\S]*$/m"
          - title: Trace state across operations
            text: Make a table with rows “construct”, “deposit”, and “get balance”. Record the attribute each row accesses; compare the spellings and check for an accidental second balance.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+BankAccount\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?\\bself\\.(?:__balance)\\b))(?=[\\s\\S]*(?:^class[ \\t]+BankAccount\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?def[ \\t]+get_balance\\b[\\s\\S]*?self\\.__balance\\b))[\\s\\S]*$/m"

      - description: "Validation helper visibility matches the target"
        command: |
          source = open('/tutorial/bank_account.py').read()
          ns = {}
          exec(source, ns)
          account = ns['BankAccount'](100.0)
          assert hasattr(account, '_validate_amount'), \
              "Compare the validation helper's visibility with the target and the naming-convention table."
        hints:
          - title: Identify the internal helper
            text: Find the validation helper’s marker in the target. The renderer maps a naming convention to that marker; Python does not enforce protected access.
            condition: "code_not_matches: /^class[ \\t]+BankAccount\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+_validate_amount\\b[^\\n]*/m"
          - title: Update the callers too
            text: A renamed definition does not update calls by itself. Trace a deposit from the public method to its validation call and compare the names.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+BankAccount\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+_validate_amount\\b[^\\n]*))(?![\\s\\S]*(?:^class[ \\t]+BankAccount\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?self\\._validate_amount\\s*\\())[\\s\\S]*$/m"
          - title: Compare valid and invalid amounts
            text: Try one positive amount and one negative amount. Record which helper each public operation reaches and whether the balance changes. Use any failing call to locate the remaining mismatch.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+BankAccount\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+_validate_amount\\b[^\\n]*))(?=[\\s\\S]*(?:^class[ \\t]+BankAccount\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?self\\._validate_amount\\s*\\())[\\s\\S]*$/m"

      - description: "Public methods still work correctly"
        command: |
          source = open('/tutorial/bank_account.py').read()
          ns = {}
          exec(source, ns)
          account = ns['BankAccount'](100.0)
          account.deposit(50.0)
          assert account.get_balance() == 150.0, \
              f"After depositing 50 into 100, balance should be 150 but got {account.get_balance()}"
          result = account.withdraw(200.0)
          assert result == False, \
              "Withdrawing more than the balance should return False"
          assert account.get_balance() == 150.0, \
              "Balance should not change after a failed withdrawal"
        hints:
          - title: Preserve the public interface
            text: The naming edit changes internal members. Identify the three public operations clients still call and run them one at a time.
            condition: "code_not_matches: /^class[ \\t]+BankAccount\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?\\bself\\.(?:__balance)\\b/m"
          - title: Check the whole rename
            text: Trace both a balance access and a validation call inside deposit and withdraw. Which internal names still differ from their definitions?
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+BankAccount\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?\\bself\\.(?:__balance)\\b))(?![\\s\\S]*(?:^class[ \\t]+BankAccount\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+_validate_amount\\b[^\\n]*))[\\s\\S]*$/m"
          - title: Use a state table
            text: Start at 100, deposit 50, then request a withdrawal larger than the balance. Record the return value and balance after each action; find the first row that violates the contract.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+BankAccount\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?\\bself\\.(?:__balance)\\b))(?=[\\s\\S]*(?:^class[ \\t]+BankAccount\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+_validate_amount\\b[^\\n]*))[\\s\\S]*$/m"

    quiz:
      title: "Step 2 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            In UML, what does the `-` symbol before an attribute mean?
          type: single
          options:
            - "The attribute is public"
            - "The attribute is private"
            - "The attribute is static"
            - "The attribute is optional"
          correct_index: 1
          explanation: |
            `-` means **private** in UML: the attribute belongs to the class's internal implementation. Callers should use its public operations. This tutorial's renderer maps a double-leading-underscore name (`__`) to `-`.

        - question: |
            In this tutorial's renderer, a Python method named `_calculate_tax` appears with which UML visibility marker?
          type: single
          options:
            - "`+` (public)"
            - "`-` (private)"
            - "`#` (protected)"
            - "`~` (package)"
          correct_index: 2
          explanation: |
            This renderer maps a single leading underscore (`_`) to **protected** (`#`). In Python generally, `_` signals a non-public member; it does not enforce access limited to the class and its subclasses.


  # --------------------------------------------------------------------------
  # STEP 3 — "Types Matter: Explicit Contracts"
  # Pedagogy:
  #   Constructivism — bridge duck typing to explicit UML types.
  #   Desirable Difficulty (Generation) — students must infer types.
  #   Bloom's level — Understand (why types matter), Apply (add hints).
  # --------------------------------------------------------------------------
  - title: "Types Matter: Explicit Contracts"
    key: types
    instructions: |
      ## Explicit Types in UML

      ### Why this matters

      Python's duck typing is convenient when you write the code and a nightmare when someone else has to read it six months later. UML refuses to let you hide the contracts: every attribute and parameter must declare its type. Adding Python type hints serves the same purpose — and as a bonus, the live UML renderer reads them, so the diagram fills in only when your code is honest about its data flow.

      ### 🎯 You will learn to

      - Apply Python type hints to attributes, parameters, and return values
      - Analyze how explicit types act as contracts between components

      ### What Are Type Hints?

      You may not have seen Python **type hints** before. They are optional annotations that tell both humans and tools what type a variable or return value should be:

      ```python
      # Without type hints (what you are used to):
      def __init__(self, name, price):
          self.name = name

      # With type hints:
      def __init__(self, name: str, price: float) -> None:
          self.name: str = name
      ```

      | Syntax | Meaning | Example |
      |---|---|---|
      | `param: Type` | Parameter has this type | `name: str` |
      | `self.x: Type = value` | Attribute has this type | `self.name: str = name` |
      | `-> Type` | Method returns this type | `def get_price(self) -> float:` |
      | `-> None` | Method returns nothing | `def __init__(self, ...) -> None:` |

      Type hints do **not** change how Python runs your code — Python ignores them at runtime. But they serve two critical purposes:

      1. **UML diagrams** — the renderer reads type hints to show types. Missing return annotations remain unknown (`?`), rather than being treated as no result.
      2. **Communication** — type hints document the contracts of your class for other developers.

      *(Type hints can also be enforced at build time with tools like **mypy**. That's a topic for another tutorial — see the reference at the end of this one for a pointer.)*

      ### The Problem with Duck Typing

      Python is dynamically typed — you can write `def get_price(self)` without ever specifying that it returns a `float`. This flexibility is convenient, but it hides the **contracts** between components. Another developer reading your code has to trace through the logic to figure out what types flow where.

      For this detailed design exercise, show attribute, parameter, and return types to make the contracts explicit. UML permits diagrams to omit these details when a higher-level view is more useful.

      ### UML Type Notation

      | UML | Python |
      |---|---|
      | `- __name: str` | `self.__name: str = name` |
      | `+ get_price(): float` | `def get_price(self) -> float:` |
      | `+ apply_discount(percent: float): float` | `def apply_discount(self, percent: float) -> float:` |

      The target uses Python annotations: `str`, `bool`, `int`, and `float`. A Python `float` approximates a real value; it does not promise exact arithmetic. See the [comparison with UML primitive types](/SEBook/uml_class_diagram.html#model-types-and-source-types).

      ### Your Target Diagram

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-spec='@startuml
      layout landscape
      class Product {
        - __name: str
        - __price: float
        - __in_stock: bool
        + __init__(name: str, price: float, in_stock: bool): None
        + get_name(): str
        + get_price(): float
        + is_available(): bool
        + apply_discount(percent: float): float
      }
      @enduml'></div>

      ### Your Task

      The starter code works perfectly — but has **zero type hints**. The UML diagram shows the class without any type information. Add type hints to:

      1. All `__init__` parameters
      2. All instance attributes
      3. All method return types
      4. All method parameters

      Choose each type from the target contract. Watch the UML diagram fill in as you add annotations, and keep the existing behavior unchanged.

    uml_files:
      - product.py

    files:
      - path: product.py
        content: |
          class Product:
              """A product in an online store.
              Everything works — but there are no type hints!
              Add type annotations so the UML diagram shows types."""

              def __init__(self, name, price, in_stock):
                  self.__name = name
                  self.__price = price
                  self.__in_stock = in_stock

              def get_name(self):
                  return self.__name

              def get_price(self):
                  return self.__price

              def is_available(self):
                  return self.__in_stock

              def apply_discount(self, percent):
                  discount = self.__price * (percent / 100)
                  return self.__price - discount


          if __name__ == "__main__":
              p = Product("Laptop", 999.99, True)
              print(f"{p.get_name()}: ${p.get_price():.2f}")
              print(f"After 10% off: ${p.apply_discount(10):.2f}")
              print(f"In stock: {p.is_available()}")
        language: python

    open_file: product.py

    solution:
      files:
        - path: product.py
          content: |
            class Product:
                """A product in an online store — now with full type hints."""

                def __init__(self, name: str, price: float, in_stock: bool) -> None:
                    self.__name: str = name
                    self.__price: float = price
                    self.__in_stock: bool = in_stock

                def get_name(self) -> str:
                    return self.__name

                def get_price(self) -> float:
                    return self.__price

                def is_available(self) -> bool:
                    return self.__in_stock

                def apply_discount(self, percent: float) -> float:
                    discount = self.__price * (percent / 100)
                    return self.__price - discount


            if __name__ == "__main__":
                p = Product("Laptop", 999.99, True)
                print(f"{p.get_name()}: ${p.get_price():.2f}")
                print(f"After 10% off: ${p.apply_discount(10):.2f}")
                print(f"In stock: {p.is_available()}")
          language: python
      explanation: |
        Type hints serve double duty:
        1. They make the UML diagram complete — every attribute and method shows its type.
        2. They document the **contracts** of your class — what goes in and what comes out.

        Without type hints, another developer must read your implementation to know that `apply_discount` expects a percentage as a float and returns a float. With type hints (and the corresponding UML), this is immediately visible.

    tests:
      - description: "Instance attributes have type hints"
        command: |
          import ast
          source = open('/tutorial/product.py').read()
          tree = ast.parse(source)
          product_cls = next((n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'Product'), None)
          assert product_cls is not None, "Product class must exist"
          init_method = next((m for m in product_cls.body if isinstance(m, ast.FunctionDef) and m.name == '__init__'), None)
          assert init_method is not None, "Product must have an __init__ method"
          attr_annotations = {}
          for stmt in init_method.body:
              if (isinstance(stmt, ast.AnnAssign)
                      and isinstance(stmt.target, ast.Attribute)
                      and isinstance(stmt.target.value, ast.Name)
                      and stmt.target.value.id == 'self'
                      and isinstance(stmt.annotation, ast.Name)):
                  attr_annotations[stmt.target.attr] = stmt.annotation.id
          assert attr_annotations.get('__name') == 'str', \
              "Add a type hint: `self.__name: str = name` (annotated assignment with type str)"
          assert attr_annotations.get('__price') == 'float', \
              "Add a type hint: `self.__price: float = price`"
          assert attr_annotations.get('__in_stock') == 'bool', \
              "Add a type hint: `self.__in_stock: bool = in_stock`"
        hints:
          - title: Annotate stored state
            text: Compare the attribute compartment with the assignments in Product.__init__. Which syntax adds type information while keeping the assigned value?
            condition: "code_not_matches: /^class[ \\t]+Product\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?self\\.__\\w+[ \\t]*:/m"
          - title: Separate value from type
            text: "For each attribute, write two columns: an example value and the kind of value it represents. Use that distinction to annotate the remaining assignments."
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Product\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?self\\.__\\w+[ \\t]*:))(?![\\s\\S]*(?:^class[ \\t]+Product\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?self\\.__price[ \\t]*:))[\\s\\S]*$/m"
          - title: Read each annotated assignment
            text: Inspect the name, annotation, and assigned expression independently. Check the target for the price and availability roles, and ensure the annotations describe those roles.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Product\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?self\\.__\\w+[ \\t]*:))(?=[\\s\\S]*(?:^class[ \\t]+Product\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?self\\.__price[ \\t]*:))[\\s\\S]*$/m"

      - description: "Methods have return type hints"
        command: |
          import ast
          source = open('/tutorial/product.py').read()
          tree = ast.parse(source)
          product_cls = next((n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'Product'), None)
          assert product_cls is not None, "Product class must exist"
          returns = {}
          for m in product_cls.body:
              if isinstance(m, ast.FunctionDef) and m.returns is not None and isinstance(m.returns, ast.Name):
                  returns[m.name] = m.returns.id
          assert returns.get('get_name') == 'str', \
              "Add `-> str` to get_name(): `def get_name(self) -> str:`"
          assert returns.get('get_price') == 'float', \
              "Add `-> float` to get_price(): `def get_price(self) -> float:`"
          assert returns.get('is_available') == 'bool', \
              "Add `-> bool` to is_available(): `def is_available(self) -> bool:`"
          assert returns.get('apply_discount') == 'float', \
              "Add `-> float` to apply_discount(): `def apply_discount(self, percent: float) -> float:`"
        hints:
          - title: Trace what leaves each method
            text: Read each method’s return expression before choosing an annotation. A parameter describes an input; a return annotation describes the value sent back.
            condition: "code_not_matches: /^class[ \\t]+Product\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?def[ \\t]+(?:get_name|get_price|is_available|apply_discount)\\([^\\n]*->/m"
          - title: Complete a return-value table
            text: List the four operations, one example returned value for each, and its type. Compare that table with the target’s operation compartment.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Product\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?def[ \\t]+(?:get_name|get_price|is_available|apply_discount)\\([^\\n]*->))(?![\\s\\S]*(?:^class[ \\t]+Product\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?def[ \\t]+apply_discount\\([^\\n]*->))[\\s\\S]*$/m"
          - title: Check outputs rather than action names
            text: A method that changes or calculates something may still return a value. Trace apply_discount and compare its returned expression with its annotation; repeat for any remaining failed operation.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Product\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?def[ \\t]+(?:get_name|get_price|is_available|apply_discount)\\([^\\n]*->))(?=[\\s\\S]*(?:^class[ \\t]+Product\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?def[ \\t]+apply_discount\\([^\\n]*->))[\\s\\S]*$/m"

      - description: "apply_discount parameter has type hint"
        command: |
          source = open('/tutorial/product.py').read()
          ns = {}
          exec(source, ns)
          import inspect
          sig = inspect.signature(ns['Product'].apply_discount)
          params = sig.parameters
          assert 'percent' in params, \
              "apply_discount should have a 'percent' parameter"
          assert params['percent'].annotation == float, \
              "The percent parameter needs a type hint: percent: float"
        hints:
          - title: Distinguish the input from the result
            text: Locate percent inside the target operation’s parentheses. An annotation after the closing parenthesis describes a different part of the contract.
            condition: "code_not_matches: /^class[ \\t]+Product\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?def[ \\t]+apply_discount\\([^\\n]*\\bpercent[ \\t]*:/m"
          - title: Check the parameter position
            text: Compare your method header with the annotated-parameter example in the instructions. Keep the parameter’s name, type, and any default value in their separate positions.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Product\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?def[ \\t]+apply_discount\\([^\\n]*\\bpercent[ \\t]*:))(?![\\s\\S]*(?:^class[ \\t]+Product\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?def[ \\t]+apply_discount\\([^\\n]*\\bpercent[ \\t]*:[^,)]+\\)))[\\s\\S]*$/m"
          - title: Allow a fractional percentage
            text: Imagine passing 12.5 as the percentage. Compare that input’s role with the target’s declared parameter type, without changing the discount calculation.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Product\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?def[ \\t]+apply_discount\\([^\\n]*\\bpercent[ \\t]*:))(?=[\\s\\S]*(?:^class[ \\t]+Product\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?def[ \\t]+apply_discount\\([^\\n]*\\bpercent[ \\t]*:[^,)]+\\)))[\\s\\S]*$/m"

    quiz:
      title: "Step 3 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            Why do we add explicit attribute, parameter, and return types in this detailed design exercise?
          type: single
          options:
            - "Because UML only works with statically typed languages"
            - "To make diagrams look more professional"
            - "To make the contracts between components explicit and unambiguous"
            - "Because Python requires type hints to run"
          correct_index: 2
          explanation: |
            Explicit types document the **contracts** — what data flows between components and in what form. This is a design decision that improves communication, regardless of whether the language enforces it.

        - question: |
            How does the UML notation `+ apply_discount(percent: float): float` map to Python?
          type: single
          options:
            - "`def apply_discount(percent: float) -> float:`"
            - "`def apply_discount(self, percent: float) -> float:`"
            - "`def apply_discount(self, percent) -> float:`"
            - "`float apply_discount(float percent)`"
          correct_index: 1
          explanation: |
            Python methods always include `self` as the first parameter, but UML omits it (it is implied). The return type goes after `->` in Python, and after `:` in UML. Both `percent: float` parameter annotations match directly.


  # --------------------------------------------------------------------------
  # STEP 4 — "Inheritance: Is-A Relationships"
  # Pedagogy:
  #   Desirable Difficulty (Generation) — refactor duplicated code.
  #   Common Mistake — arrow direction (Chren et al., 2019).
  #   Bloom's level — Apply (refactor), Analyze (quiz on arrow direction).
  # --------------------------------------------------------------------------
  - title: "Inheritance: Is-A Relationships"
    key: inheritance
    instructions: |
      ## The Generalization Arrow

      ### Why this matters

      Inheritance lets several kinds of object share a contract: code written for a `Shape` should work with a `Circle` or `Rectangle` and still get the promised behavior. Shared fields and methods can then move to the parent. Duplication is a reason to investigate reuse, but it does not establish an inheritance relationship; unrelated classes may share a helper instead.

      ### 🎯 You will learn to

      - Justify inheritance using the behavior a parent promises its clients
      - Apply inheritance and draw generalization arrows from child to parent

      > **Heads up — the arrow direction trips up almost everyone the first time.** Even developers who use inheritance every day sometimes have to pause and think. Expect to re-read the "Is-a test" below once or twice. That is the skill forming, not a sign you're confused.

      ### Inheritance in UML

      When a class **extends** another class (an "is-a" relationship), UML draws a solid line with a **hollow triangle** pointing at the **parent** (superclass):

      Child <span class="uml-sym" data-diagram="class" data-sym="--|>"></span> Parent

      > **⚠ Common mistake:** Students often draw the triangle pointing **away** from the parent, from superclass down to subclass. The correct direction is the opposite: the **child points up** to the parent.
      >
      > **"Is-a" test:** Start with *"A [Child] is a [Parent]"*, then check the behavior: can a client use the child wherever it expects the parent, without breaking the parent's promises? A plausible sentence or matching field names alone is insufficient. The triangle points at the parent whose contract the child supports.

      For this exercise, a `Shape` has a color, an `area()` operation returning its geometric area, and a `describe()` operation reporting that color and area. `Circle` and `Rectangle` calculate area differently, but both support this contract. A client can call `shape.describe()` without choosing a different operation for each kind of shape.

      ### Your Target Diagram

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-spec='@startuml
      layout landscape
      class Shape {
        + color: str
        + __init__(color: str): None
        + area(): float
        + describe(): str
      }
      class Circle {
        + radius: float
        + __init__(color: str, radius: float): None
        + area(): float
      }
      class Rectangle {
        + width: float
        + height: float
        + __init__(color: str, width: float, height: float): None
        + area(): float
      }
      Circle --|> Shape
      Rectangle --|> Shape
      @enduml'></div>

      Notice: `Circle` and `Rectangle` only list their **own** attributes. They inherit `color` and `describe()` from `Shape` — they do not repeat them.

      ### Your Task

      The starter code has three **independent** classes. Use the shared `Shape` contract above to refactor them while preserving each shape's area and description:

      1. **Compare** the independent classes with the target's generalization relationships. Identify shared state and behavior, and what varies by shape.
      2. **Refactor** the classes to match those relationships. Initialize shared state through the parent constructor and define shared behavior once.
      3. **Check** that both concrete shapes still satisfy the `Shape` contract for area and description.

      Watch the inheritance arrows appear in the live diagram. The analyzer reads declared base classes; it does not verify that a subclass keeps its parent's behavioral promises. Run the checks as well as inspecting the arrows.

    uml_files:
      - shapes.py

    files:
      - path: shapes.py
        content: |
          import math


          class Shape:
              def __init__(self, color: str) -> None:
                  self.color: str = color

              def area(self) -> float:
                  return 0.0

              def describe(self) -> str:
                  return f"{self.color} shape with area {self.area():.2f}"


          class Circle:
              """A circle supports the Shape contract with its own area formula."""

              def __init__(self, color: str, radius: float) -> None:
                  self.color: str = color          # Duplicated!
                  self.radius: float = radius

              def area(self) -> float:
                  return math.pi * self.radius ** 2

              def describe(self) -> str:            # Duplicated!
                  return f"{self.color} shape with area {self.area():.2f}"


          class Rectangle:
              """A rectangle supports the Shape contract with its own area formula."""

              def __init__(self, color: str, width: float, height: float) -> None:
                  self.color: str = color          # Duplicated!
                  self.width: float = width
                  self.height: float = height

              def area(self) -> float:
                  return self.width * self.height

              def describe(self) -> str:            # Duplicated!
                  return f"{self.color} shape with area {self.area():.2f}"


          if __name__ == "__main__":
              c = Circle("red", 5.0)
              r = Rectangle("blue", 3.0, 4.0)
              print(c.describe())
              print(r.describe())
        language: python

    open_file: shapes.py

    solution:
      files:
        - path: shapes.py
          content: |
            import math


            class Shape:
                def __init__(self, color: str) -> None:
                    self.color: str = color

                def area(self) -> float:
                    return 0.0

                def describe(self) -> str:
                    return f"{self.color} shape with area {self.area():.2f}"


            class Circle(Shape):
                def __init__(self, color: str, radius: float) -> None:
                    super().__init__(color)
                    self.radius: float = radius

                def area(self) -> float:
                    return math.pi * self.radius ** 2


            class Rectangle(Shape):
                def __init__(self, color: str, width: float, height: float) -> None:
                    super().__init__(color)
                    self.width: float = width
                    self.height: float = height

                def area(self) -> float:
                    return self.width * self.height


            if __name__ == "__main__":
                c = Circle("red", 5.0)
                r = Rectangle("blue", 3.0, 4.0)
                print(c.describe())
                print(r.describe())
          language: python
      explanation: |
        By using `class Circle(Shape):` and calling `super().__init__(color)`, the subclasses **inherit** `color` and `describe()` from `Shape`. The UML diagram now shows generalization arrows pointing from each subclass up to `Shape`.

        Notice that `describe()` is NOT listed in `Circle` or `Rectangle` in the diagram — they inherit it. Only `area()` appears because they **override** it with their own implementation.

        The reason for this hierarchy is the shared behavioral contract: inherited `describe()` calls each shape's own `area()`. Removing duplication is a benefit of this design, not sufficient evidence for choosing inheritance in another design.

    tests:
      - description: "Circle inherits from Shape"
        command: |
          source = open('/tutorial/shapes.py').read()
          ns = {}
          exec(source, ns)
          assert issubclass(ns['Circle'], ns['Shape']), \
              "Circle should inherit from Shape: class Circle(Shape):"
        hints:
          - title: Read the generalization arrow
            text: Follow the triangle from Circle to its parent in the target. Which class provides behavior this subclass should share?
            condition: "code_not_matches: /^class[ \\t]+Circle[ \\t]*\\(/m"
          - title: Check the parent expression
            text: Compare the class header with Python’s inheritance syntax. The expression naming a parent belongs in the class declaration, while constructor arguments belong in __init__.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Circle[ \\t]*\\())(?![\\s\\S]*(?:^class[ \\t]+Circle\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?super\\s*\\())[\\s\\S]*$/m"
          - title: Separate inheritance from initialization
            text: Calling another constructor does not itself establish an is-a relationship. Inspect Circle's class declaration, then use issubclass to check the relationship independently of object construction.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Circle[ \\t]*\\())(?=[\\s\\S]*(?:^class[ \\t]+Circle\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?super\\s*\\())[\\s\\S]*$/m"

      - description: "Rectangle inherits from Shape"
        command: |
          source = open('/tutorial/shapes.py').read()
          ns = {}
          exec(source, ns)
          assert issubclass(ns['Rectangle'], ns['Shape']), \
              "Rectangle should inherit from Shape: class Rectangle(Shape):"
        hints:
          - title: Read the generalization arrow
            text: Follow the triangle from Rectangle to its parent in the target. Which class provides behavior this subclass should share?
            condition: "code_not_matches: /^class[ \\t]+Rectangle[ \\t]*\\(/m"
          - title: Check the parent expression
            text: Compare the class header with Python’s inheritance syntax. The expression naming a parent belongs in the class declaration, while constructor arguments belong in __init__.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Rectangle[ \\t]*\\())(?![\\s\\S]*(?:^class[ \\t]+Rectangle\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?super\\s*\\())[\\s\\S]*$/m"
          - title: Separate inheritance from initialization
            text: Calling another constructor does not itself establish an is-a relationship. Inspect Rectangle's class declaration, then use issubclass to check the relationship independently of object construction.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Rectangle[ \\t]*\\())(?=[\\s\\S]*(?:^class[ \\t]+Rectangle\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?super\\s*\\())[\\s\\S]*$/m"

      - description: "Inherited describe() still works via polymorphism"
        command: |
          source = open('/tutorial/shapes.py').read()
          ns = {}
          exec(source, ns)
          c = ns['Circle']('red', 5.0)
          result = c.describe()
          assert 'red' in result, \
              "describe() should include the color — make sure you call super().__init__(color)"
          assert '78.5' in result, \
              f"Circle area should be about 78.54 but describe() returned: {result}"
        hints:
          - title: Follow the inherited operation
            text: Locate describe in Shape, then identify the instance on which it executes when called through a Circle. Which implementation should self.area() reach?
            condition: "code_not_matches: /^class[ \\t]+Circle[ \\t]*\\(/m"
          - title: Check inherited state
            text: Trace construction before tracing describe. Does the Circle instance receive the state that Shape.describe reads?
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Circle[ \\t]*\\())(?![\\s\\S]*(?:^class[ \\t]+Circle\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?super\\s*\\())[\\s\\S]*$/m"
          - title: Trace dynamic dispatch
            text: "For a circle of radius 2, fill in: receiver of describe → receiver of area → area result → returned description. A remaining mismatch should point to state setup, overriding, or formatting."
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Circle[ \\t]*\\())(?=[\\s\\S]*(?:^class[ \\t]+Circle\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?super\\s*\\())[\\s\\S]*$/m"

      - description: "Duplicated describe() and color removed from subclasses"
        command: |
          import ast
          source = open('/tutorial/shapes.py').read()
          tree = ast.parse(source)
          for cls in [n for n in tree.body if isinstance(n, ast.ClassDef) and n.name in ('Circle', 'Rectangle')]:
              for m in cls.body:
                  if isinstance(m, ast.FunctionDef):
                      assert m.name != 'describe', \
                          "Remove describe() from " + cls.name + " — it should inherit this method from Shape"
                      if m.name == '__init__':
                          for stmt in m.body:
                              tgt = None
                              if isinstance(stmt, ast.AnnAssign):
                                  tgt = stmt.target
                              elif isinstance(stmt, ast.Assign) and stmt.targets:
                                  tgt = stmt.targets[0]
                              if (tgt is not None and isinstance(tgt, ast.Attribute)
                                      and isinstance(tgt.value, ast.Name)
                                      and tgt.value.id == 'self'
                                      and tgt.attr == 'color'):
                                  assert False, \
                                      "Remove `self.color = color` from " + cls.name + " — it should inherit color from Shape via super().__init__()"
        hints:
          - title: Find repeated responsibilities
            text: Compare each subclass with Shape. Mark which members describe a general shape and which represent only that particular geometry.
            condition: "code_not_matches: /^class[ \\t]+(?:Circle|Rectangle)[ \\t]*\\(/m"
          - title: Compare both subclasses
            text: Refactor one subclass, then compare it with the other. Which repeated method and state initialization should have only one owner?
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+(?:Circle|Rectangle)[ \\t]*\\())(?![\\s\\S]*(?:^class[ \\t]+Circle\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?super\\s*\\())[\\s\\S]*$/m"
          - title: Check declarations and uses separately
            text: "Make two columns for each subclass: members declared here and members available through inheritance. Remove only the repeated declarations; inherited uses can remain."
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+(?:Circle|Rectangle)[ \\t]*\\())(?=[\\s\\S]*(?:^class[ \\t]+Circle\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?super\\s*\\())[\\s\\S]*$/m"

      - description: "Subclasses use super().__init__() to initialize the parent"
        command: |
          import ast
          source = open('/tutorial/shapes.py').read()
          tree = ast.parse(source)
          for cls in [n for n in tree.body if isinstance(n, ast.ClassDef) and n.name in ('Circle', 'Rectangle')]:
              init = next((m for m in cls.body if isinstance(m, ast.FunctionDef) and m.name == '__init__'), None)
              assert init is not None, cls.name + ' must have __init__'
              found_super = False
              for node in ast.walk(init):
                  if (isinstance(node, ast.Call)
                          and isinstance(node.func, ast.Attribute)
                          and node.func.attr == '__init__'
                          and isinstance(node.func.value, ast.Call)
                          and isinstance(node.func.value.func, ast.Name)
                          and node.func.value.func.id == 'super'):
                      found_super = True
                      break
              assert found_super, cls.name + ".__init__ should call super().__init__(color) to initialize Shape"
        hints:
          - title: Find the owner of shared state
            text: The parent constructor initializes color. After adding inheritance, consider what runs when a subclass supplies its own constructor.
            condition: "code_not_matches: /^class[ \\t]+(?:Circle|Rectangle)[ \\t]*\\(/m"
          - title: Plan constructor delegation
            text: For each constructor parameter, mark whether the parent or subclass owns the corresponding state. Use the parent-initialization example from the lesson to delegate the shared work.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+(?:Circle|Rectangle)[ \\t]*\\())(?![\\s\\S]*(?:^class[ \\t]+Circle\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?super\\s*\\())[\\s\\S]*$/m"
          - title: Check both constructor paths
            text: "Trace construction of a Circle and a Rectangle. Fill in: shared input → parent constructor argument → inherited attribute, then check the geometry-specific assignments separately."
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+(?:Circle|Rectangle)[ \\t]*\\())(?=[\\s\\S]*(?:^class[ \\t]+Circle\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?super\\s*\\())[\\s\\S]*$/m"

    quiz:
      title: "Step 4 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            In a UML class diagram, which direction does the inheritance arrow point?
          type: single
          options:
            - "From the parent to the child"
            - "From the child to the parent"
            - "Both directions (bidirectional)"
            - "It depends on the programming language"
          correct_index: 1
          explanation: |
            The generalization arrow always points **from the child to the parent** — the hollow triangle is at the parent end. Think of it as the child "reaching up" to the thing it extends.

        - question: |
            If `Circle` inherits `describe()` from `Shape`, where does `describe()` appear in this tutorial's generated diagram?
          type: single
          options:
            - "In both the Shape and Circle boxes"
            - "Only in the Shape box"
            - "Only in the Circle box"
            - "Nowhere — inherited methods are not shown"
          correct_index: 1
          explanation: |
            This renderer lists `describe()` in the **parent** class box where it is defined. The child box lists the members defined there, including overrides. Follow the inheritance arrow to find inherited behavior.

        - question: |
            Two classes both store a `name` and repeat some formatting code. Which additional evidence would justify making them subclasses of a shared parent?
          type: single
          options:
            - "Their constructors accept the same parameter types."
            - "Both can keep the parent's promises to its clients."
            - "Moving the repeated code would shorten both classes."
          correct_index: 1
          option_feedback:
            0: "Matching input types do not establish matching behavior. Check what clients of the proposed parent can rely on."
            2: "A helper can remove repetition too. Inheritance also commits each child to the parent's contract."
          explanation: |
            A child should be usable through the parent's contract without breaking its promises. Shared spelling or repeated implementation alone cannot establish that. The diagram records the declared inheritance; checking the design requires reasoning about behavior.


  # --------------------------------------------------------------------------
  # STEP 5 — "Association: Classes That Know Each Other"
  # Pedagogy:
  #   Key Insight — UML makes implicit references explicit.
  #   Constructivism — bridge from "storing a string" to "storing an object."
  #   Bloom's level — Understand (when associations arise), Apply (refactor).
  # --------------------------------------------------------------------------
  - title: "Association: Classes That Know Each Other"
    key: association
    uml_hide:
      - multiplicity
    instructions: |
      ## Association Arrows

      ### Why this matters

      In real codebases, the most damaging form of design rot is hiding object relationships behind strings or IDs. A `Course` that stores `instructor_name: str` looks innocent in isolation, but the structural link to `Instructor` is invisible — invisible to UML, invisible to type checkers, invisible to the developer who has to refactor the system three years from now. Association arrows make those links explicit.

      ### 🎯 You will learn to

      - Analyze when a UML association exists between two classes
      - Apply object-typed attributes to surface hidden relationships in code

      ### What Is an Association?

      An association means one class **stores a reference** to another class as an instance variable. In UML, this is drawn as a solid arrow <span class="uml-sym" data-diagram="class" data-sym="-->"></span> from the class that holds the reference to the class it references.

      **The key rule:** If a class stores another object as a persistent instance variable (`self.instructor: Instructor`), that is an **association**. If it only uses another class temporarily inside a method, that is a weaker relationship (a dependency, which we will skip for now).

      ### Your Target Diagram

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-spec='@startuml
      layout landscape
      class Instructor {
        + name: str
        + department: str
        + __init__(name: str, department: str): None
        + get_title(): str
      }
      class Course {
        + name: str
        + __init__(name: str, instructor: Instructor): None
        + get_instructor_name(): str
      }
      Course --> Instructor
      @enduml'></div>

      Notice the association arrow from `Course` to `Instructor` — it appears because `Course` has an `instructor: Instructor` attribute.

      ### Your Task

      The starter code stores the instructor as a plain string (`instructor_name: str`). This hides the relationship — the UML shows no connection between the classes.

      1. **Create an `Instructor` class** with `name: str`, `department: str`, and a `get_title()` method returning `"name (department)"`
      2. **Refactor `Course`** to accept and store an `Instructor` object instead of a string
      3. **Preserve `get_instructor_name()`'s contract:** return the associated instructor's current name, including after that name changes.

      > **Try the refactoring tools:** Place the cursor on `instructor_name` in `self.instructor_name`, then choose **Refactor: Rename Symbol...** from the editor's context menu or Command Palette. Rename the constructor parameter separately. Review the preview before **Apply**, then update the types and object access to match the target diagram. Check the live UML and run **Test My Work**.

      Watch the association arrow appear in the UML diagram!

    uml_files:
      - enrollment.py

    files:
      - path: enrollment.py
        content: |
          class Course:
              """A course — but the instructor is just a string!
              There is no Instructor class, so the UML shows no relationship."""

              def __init__(self, name: str, instructor_name: str) -> None:
                  self.name: str = name
                  self.instructor_name: str = instructor_name  # Just a string!

              def get_instructor_name(self) -> str:
                  return self.instructor_name


          # TODO: Create an Instructor class with name, department, and get_title()
          # TODO: Refactor Course to store an Instructor object instead of a string


          if __name__ == "__main__":
              # After your refactoring, this code should work:
              # instructor = Instructor("Dr. Smith", "Computer Science")
              # course = Course("CS 101", instructor)
              # print(f"{course.name} taught by {course.get_instructor_name()}")

              course = Course("CS 101", "Dr. Smith")
              print(f"{course.name} taught by {course.get_instructor_name()}")
        language: python

    open_file: enrollment.py

    solution:
      files:
        - path: enrollment.py
          content: |
            class Instructor:
                def __init__(self, name: str, department: str) -> None:
                    self.name: str = name
                    self.department: str = department

                def get_title(self) -> str:
                    return f"{self.name} ({self.department})"


            class Course:
                def __init__(self, name: str, instructor: Instructor) -> None:
                    self.name: str = name
                    self.instructor: Instructor = instructor

                def get_instructor_name(self) -> str:
                    return self.instructor.name


            if __name__ == "__main__":
                instructor = Instructor("Dr. Smith", "Computer Science")
                course = Course("CS 101", instructor)
                print(f"{course.name} taught by {course.get_instructor_name()}")
                print(f"Instructor: {instructor.get_title()}")
          language: python
      explanation: |
        **Before:** `Course` stored `instructor_name: str` — the UML showed two isolated boxes with no connection. The relationship was invisible.

        **After:** `Course` stores `instructor: Instructor` — the UML shows an association arrow. The structural relationship is now explicit and visible to anyone reading the diagram.

        This is the core value of UML: **making invisible relationships visible**. In a large codebase, you would have to trace through constructor code to discover that Course depends on Instructor. The UML diagram shows this at a glance.

    tests:
      - description: "Instructor class exists with name and department"
        command: |
          source = open('/tutorial/enrollment.py').read()
          ns = {}
          exec(source, ns)
          assert 'Instructor' in ns, \
              "Create an Instructor class"
          i = ns['Instructor']('Dr. Smith', 'Computer Science')
          assert i.name == 'Dr. Smith', \
              "Instructor needs a 'name' attribute"
          assert i.department == 'Computer Science', \
              "Instructor needs a 'department' attribute"
        hints:
          - title: Give the instructor its own identity
            text: The target contains a second class with its own state. Compare that state with the instructor string in the starter.
            condition: "code_not_matches: /^class[ \\t]+Instructor\\b/m"
          - title: Construct before connecting
            text: Create an instructor on its own. Map the caller’s two values to the attributes shown in its class box before changing Course.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Instructor\\b))(?![\\s\\S]*(?:^class[ \\t]+Instructor\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?\\bself\\.(?:name|department)\\b))[\\s\\S]*$/m"
          - title: Try two instructors
            text: Use different names and departments in two instances. Check that each instance retains its own supplied data instead of a fixed example or a local-only variable.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Instructor\\b))(?=[\\s\\S]*(?:^class[ \\t]+Instructor\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?\\bself\\.(?:name|department)\\b))[\\s\\S]*$/m"

      - description: "Course stores an Instructor object (not a string)"
        command: |
          source = open('/tutorial/enrollment.py').read()
          ns = {}
          exec(source, ns)
          i = ns['Instructor']('Dr. Smith', 'CS')
          c = ns['Course']('CS 101', i)
          assert hasattr(c, 'instructor'), \
              "Course needs an 'instructor' attribute (not 'instructor_name')"
          assert isinstance(c.instructor, ns['Instructor']), \
              "Course.instructor should be an Instructor object, not a string"
        hints:
          - title: Keep the relationship in the state
            text: The arrow represents a link to an object with its own identity. Compare a stored instructor name with a stored instructor object.
            condition: "code_not_matches: /^class[ \\t]+Course\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?\\bself\\.(?:instructor)\\b/m"
          - title: Follow the constructor argument
            text: "Create an Instructor first, then pass it into Course. Trace that argument through the constructor: is it still an object when stored?"
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Course\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?\\bself\\.(?:instructor)\\b))(?![\\s\\S]*(?:^class[ \\t]+Course\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?self\\.instructor[ \\t]*(?::[^=\\n]+)?=[^\\n]*\\binstructor\\b))[\\s\\S]*$/m"
          - title: Test a shared instructor
            text: Give two courses the same Instructor and change that instructor’s name. Predict what each course should observe; this distinguishes a retained reference from copied text.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Course\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?\\bself\\.(?:instructor)\\b))(?=[\\s\\S]*(?:^class[ \\t]+Course\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?self\\.instructor[ \\t]*(?::[^=\\n]+)?=[^\\n]*\\binstructor\\b))[\\s\\S]*$/m"

      - description: "get_instructor_name() returns the instructor's name"
        command: |
          source = open('/tutorial/enrollment.py').read()
          ns = {}
          exec(source, ns)
          i = ns['Instructor']('Dr. Smith', 'CS')
          c = ns['Course']('CS 101', i)
          result = c.get_instructor_name()
          assert result == 'Dr. Smith', \
              f"get_instructor_name() should return 'Dr. Smith' but got '{result}'"
        hints:
          - title: Start from the relationship
            text: First decide what Course retains after construction. The accessor must work with that representation rather than the old standalone string.
            condition: "code_not_matches: /^class[ \\t]+Course\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?\\bself\\.(?:instructor)\\b/m"
          - title: Trace the accessor’s receiver
            text: Inside get_instructor_name, inspect the object reached by the stored relationship. Which piece of that object’s state answers the caller’s question?
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Course\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?\\bself\\.(?:instructor)\\b))(?![\\s\\S]*(?:^class[ \\t]+Course\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+get_instructor_name\\b[^\\n]*\\n(?:(?!^\\S|^ {1,4}\\S)[\\s\\S])*?self\\.instructor\\b))[\\s\\S]*$/m"
          - title: Distinguish an object from its label
            text: "Write two rows: value currently returned, and kind of value the accessor promises. Use a renamed Instructor to check that the result comes from its current state."
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Course\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?\\bself\\.(?:instructor)\\b))(?=[\\s\\S]*(?:^class[ \\t]+Course\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+get_instructor_name\\b[^\\n]*\\n(?:(?!^\\S|^ {1,4}\\S)[\\s\\S])*?self\\.instructor\\b))[\\s\\S]*$/m"

    quiz:
      title: "Step 5 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            When does an association arrow appear between two classes in a UML diagram?
          type: single
          options:
            - "When one class imports another"
            - "When one class stores another as an instance variable"
            - "When two classes are in the same file"
            - "When one class calls a method on another"
          correct_index: 1
          explanation: |
            An association arrow appears when a class **stores** another object as a **persistent instance variable** (e.g., `self.instructor: Instructor`). Simply importing or calling a method creates a weaker *dependency*, not an association.

        - question: |
            Why is storing `instructor_name: str` worse than `instructor: Instructor` from a design perspective?
          type: single
          options:
            - "Strings use more memory than objects"
            - "The structural relationship is hidden from UML"
            - "Python does not allow storing strings as attributes"
            - "Strings cannot be printed"
          correct_index: 1
          explanation: |
            When you use a string, the **relationship between Course and Instructor is invisible** — both in the code and in the UML diagram. Using an `Instructor` object makes the dependency explicit, allowing UML to show the arrow and helping other developers understand the system structure at a glance.

        - question: |
            **Review of Step 3.** Keep the constructor parameter `instructor: Instructor`, but change `self.instructor: Instructor = instructor` to `self.instructor = instructor`. Which distinction matters when interpreting the live diagram?
          type: single
          options:
            - "The stored object stays the same; inferred diagram detail may change"
            - "The stored object becomes a string; the diagram loses the class"
            - "Python rejects the assignment; the diagram keeps the association"
            - "Python checks the type at runtime; the diagram adds enforcement"
          correct_index: 0
          option_feedback:
            1: "Removing an attribute annotation does not convert the assigned value. The constructor still receives and stores an Instructor object."
            2: "Python permits assignment without an annotation. The relationship can still be inferred from the annotated constructor parameter."
            3: "An annotation supplies type information to readers and tools; Python does not enforce that type during this assignment."
          explanation: |
            The stored reference and Python behavior are unchanged. The current renderer still infers the association from the annotated constructor parameter, but loses the target multiplicity label `1` when the attribute annotation is removed. A generated diagram is a tool's interpretation of the source: annotation changes can affect its detail without changing the objects at runtime.


  # --------------------------------------------------------------------------
  # STEP 6 — "Composition vs Aggregation"
  # Pedagogy:
  #   Contrast domain ownership with source-inference heuristics.
  #   Bloom's level — Analyze (distinguish contracts from code patterns).
  #   Note: multiplicity hidden — introduced in the next step.
  # --------------------------------------------------------------------------
  - title: "Composition vs Aggregation"
    key: ownership
    uml_hide:
      - multiplicity
    instructions: |
      ## Ownership and Lifecycle

      ### Why this matters

      A stored reference tells us that two objects are linked. It does not tell us who owns whom or what happens when either object is removed. A plain **association** is enough to show that link. Use a diamond when the domain also calls for a **whole-part** relationship, and choose it from the ownership and lifecycle rules.

      ### 🎯 You will learn to

      - Use domain requirements to distinguish association, composition, and aggregation
      - Explain what the live diagram can infer from Python code and what requires a design decision

      > **Start with the relationship's meaning.** A filled diamond makes an ownership claim. A hollow diamond marks a shared whole-part relationship whose precise meaning depends on the domain. Use a plain association when no extra whole-part meaning is needed.

      ### Warm-Up (Retrieval from Step 5)

      > Before you read on — close your eyes for five seconds and answer: in Step 5, what exactly made the UML association arrow **appear** between `Course` and `Instructor`? Was it *importing* the class, *storing an instance* as an attribute, *calling a method*, or something else? Pick the answer you would bet on, then check the next paragraph.

      In Step 5, `Course` stores an `Instructor` reference, and the type annotations let the analyzer identify the linked class. Importing a class alone would not create that association. This step adds whole-part meaning to stored links.

      ### Two Kinds of Whole-Part Relationship

      Both composition and aggregation model a "whole-part" relationship. The difference is **ownership and lifecycle**:

      | Aspect | Composition (filled diamond) | Aggregation (hollow diamond) |
      |---|---|---|
      | **Symbol** | <span class="uml-sym" data-diagram="class" data-sym="*--"></span> filled diamond | <span class="uml-sym" data-diagram="class" data-sym="o--"></span> hollow diamond |
      | **Ownership** | Part has at most one composite owner at a time | Whole groups parts; precise ownership rules are domain-specific |
      | **Lifecycle** | Deleting the whole deletes its parts, unless detached first | Hollow diamond alone supplies no deletion rule; in our example, parts survive independently |

      Exclusive composite ownership does not forbid other objects from referring to a part. It restricts which whole owns it. UML also does not prescribe where or in what order the objects are constructed: receiving a part as an argument can transfer ownership, and constructing an object internally does not establish ownership by itself.

      ### What the Live Diagram Infers

      The analyzer recognizes these source patterns when `Part` is a known class in the selected files:

      | Python pattern | Generated relationship |
      |---|---|
      | Store a newly constructed object: `self.part: Part = Part(...)` | Plain association |
      | Append a newly constructed object to a typed collection | Plain association |
      | Append an existing typed method parameter: `self.parts.append(part)` where `part: Part` | Plain association |
      | Store an existing object: `self.part: Part = part` | Plain association |
      | Declare `self.parts: list[Part] = []` without a recognized append pattern | Plain association |

      Allocation, injection, and collection storage do not establish a lifecycle contract. Both live views therefore keep ordinary associations for these Python references. A domain model may add diamonds when requirements justify them; changing the view cannot supply missing evidence.

      ### The Domain Rules for This Exercise

      - Each `Department` is a part of at most one `University`. In this model, dissolving a university also dissolves its departments unless they have been detached first. This is **composition**.
      - A department groups `Professor` objects as its teaching staff. Professors can work across departments and continue to exist when a department dissolves. We choose **aggregation** to emphasize that grouping; a plain association would also express the stored references.

      The code below builds these links. It has no operation for dissolving a university, so it does not implement or test the entire lifecycle contract. Deleting a Python variable also does not delete every object reachable through it.

      ### Reference Design for the Domain Rules

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-role="reference-design" data-uml-spec='@startuml
      layout landscape
      class Professor {
        + name: String
        + field: String
        + Professor(name: String, field: String)
      }
      class Department {
        + name: String
        + professors: Sequence<Professor>
        + Department(name: String)
        + add_professor(prof: Professor)
      }
      class University {
        + name: String
        + departments: Sequence<Department>
        + University(name: String)
        + add_department(dept_name: String)
        + get_department(name: String): Department
      }
      University *--> Department
      Department o--> Professor
      @enduml'></div>

      Notice the two different diamonds:
      - **Filled diamond** <span class="uml-sym" data-diagram="class" data-sym="*--"></span> at University → the exclusive ownership and lifecycle contract stated above.
      - **Hollow diamond** <span class="uml-sym" data-diagram="class" data-sym="o--"></span> at Department → our chosen staff-grouping convention, without ownership of the professors' lifetimes.

      > **Note:** You may notice that the live diagram does not show *how many* departments or professors participate. Those numbers (called **multiplicity**) are covered in the next step.

      ### Expected Source Structure

      The target below uses Implementation details and shows the stored links inferred from the source. Compare it with the reference design above: which lifecycle claims are still unverified?

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-role="inferred-target" data-uml-spec='@startuml
      layout landscape
      class Professor {
        + name: str
        + field: str
        + __init__(name: str, field: str): None
      }
      class Department {
        + name: str
        + professors: list[Professor]
        + __init__(name: str): None
        + add_professor(prof: Professor): None
      }
      class University {
        + name: str
        + departments: list[Department]
        + __init__(name: str): None
        + add_department(dept_name: str): None
        + get_department(name: str): Department
      }
      University --> Department
      Department --> Professor
      @enduml'></div>

      ### Your Task

      Complete the starter code:

      1. **`University.add_department(dept_name)`** should establish a new department owned by the university, using the supplied name. It must be retained and discoverable through `get_department()`.
      2. **`Department.add_professor(prof)`** should include the supplied professor in its staff, preserving that object's identity and allowing it to participate in another department too.

      Predict which domain claims the live diagram cannot establish, then compare both views with the reference design. The generated associations establish stored links. Explain what extra lifecycle behavior would be needed to fulfill the university ownership contract.

