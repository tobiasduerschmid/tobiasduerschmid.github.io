  # --------------------------------------------------------------------------
  # STEP 11 — "A Cohesive Store: Suggested Design"
  # Pedagogy:
  #   Generate-then-compare — revise an independent proposal using design reasons.
  #   ICAP Interactive — refactoring forces architectural analysis.
  #   Bloom's level — Analyze (identify anti-pattern), Create (refactor).
  # --------------------------------------------------------------------------
  - title: "A Cohesive Store: Suggested Design"
    key: store-capstone
    instructions: |
      ### Why this matters

      You have proposed a store design from its requirements. Now compare it with one suggested solution, explain the choices, and model it in Python so you can inspect its UML diagram. The aim is to connect a responsibility to the reason it belongs in a class, then verify that the collaboration preserves the required behavior.

      ### 🎯 You will learn to

      - Evaluate your proposal against a suggested design and justify one revision
      - Model collaborating classes with cohesive responsibilities while preserving the store's behavior

      ### Compare Your Proposal

      Reopen `store-design.md` while comparing your code and the design below. Keep your original proposal and complete its **Comparison** section. Record one choice that agrees, one meaningful difference, and a change you would make to either design with a reason tied to a requirement. Different class names or an extra helper are not errors by themselves.

      Your design reasoning is a self-review. **Test My Work** checks the named interfaces and behavior of the suggested solution you implement in this step; it does not grade the quality of your earlier proposal.

      ### Spotting the Problem

      Look at the starter's attributes and methods. Group them by responsibility: product details and stock, customer identity, order totals, and notifications. A **God Class** concentrates too many responsibilities, making changes for different reasons converge on the same class. Here, the parallel lists also require careful coordination to keep each product's name, price, and stock together.

      ### Why It Matters

      Product stock rules and customer contact details change for different reasons. Giving them coherent homes makes those changes easier to reason about. Use the diagram to propose that separation, then use behavior checks to verify that the refactoring preserves the store's contract.

      ### The Suggested Design

      Model this design by refactoring the supplied `OnlineStore`. Use these class names and interfaces for this implementation so the checks can call them.

      | Class | Responsibility | Why it belongs together |
      |---|---|---|
      | `Product` | Name, price, stock, availability, and stock reduction | Stock operations stay with the product state they read and change; parallel product lists disappear. |
      | `Customer` | Customer identity and contact details | Orders refer to one customer object instead of duplicating identity data across order lists. |
      | `Order` | Customer reference, requested products, and total | Items and the total describe the same purchase; adding an item keeps those facts consistent. |
      | `OnlineStore` | Catalog, recorded orders, and request coordination | The store can look up the whole request and reject it before any product's stock changes. |

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-spec='@startuml
        layout landscape
        class Product {
          +name: str
          +price: float
          +stock: int
          +__init__(name: str, price: float, stock: int): None
          +is_available(): bool
          +reduce_stock(): None
        }
        class Customer {
          +name: str
          +email: str
          +__init__(name: str, email: str): None
        }
        class Order {
          +items: list[Product]
          +total: float
          +__init__(customer: Customer): None
          +add_item(product: Product): None
        }
        class OnlineStore {
          +products: list[Product]
          +orders: list[Order]
          +__init__(): None
          +add_product(product: Product): None
          +place_order(customer: Customer, product_names: list): Order
        }
        Order --> "*" Product
        Order --> "1" Customer
        OnlineStore --> "*" Order
        OnlineStore --> "*" Product
        OnlineStore ..> Customer
        @enduml
      '></div>

      **Why this is a cleaner design for this exercise:** each class has a focused responsibility, related data stays together, and the store delegates product and order work through small operations. For example, changing a customer's contact data need not change the stock calculation. The store validates the entire request before committing purchases, so an error cannot leave half an order applied.

      **A trade-off to recognize:** `Order.add_item` also reduces product stock, so orders depend on inventory behavior. That keeps this exercise small. A system with reservations, cancellations, or historical order prices would need a richer design. More classes alone would not solve those requirements; this suggested solution is clean relative to the stated scope.

      This target shows the stored-reference associations inferred from the supplied solution. Creating and retaining an order does not prove exclusive ownership or a shared deletion policy. Neither live view adds those claims: the example does not implement store deletion. Use requirements to decide whether a separate domain model should include composition.

      ### Reading the Dependency

      Recall the **dashed dependency arrow** from the reference step (<span class="uml-sym" data-diagram="class" data-sym="..>"></span>).

      | Symbol | Name | Meaning | Python Pattern |
      |---|---|---|---|
      | <span class="uml-sym" data-diagram="class" data-sym="..>"></span> | **Dependency** | "temporarily uses" — the weakest link | A class appears only as a method parameter or local variable — never stored in `self` |

      In the target diagram, `OnlineStore ..> Customer` means `OnlineStore` *uses* `Customer` only inside `place_order()` — as a method parameter that is immediately handed off to `Order`. There is no `self.customer` attribute on `OnlineStore`; the `Customer` object passes through and leaves.

      **Patterns recognized by this analyzer:**
      - `self.x: Other = other` → **association** (stores an existing object)
      - `def method(self, other: Other)` or `local = Other(...)` inside a method, never stored → **dependency** (temporary use)

      This is the weakest possible relationship — the dashed line signals "I know this class exists, but I do not hold onto it."

      ### Your Task

      The starter code is a single `OnlineStore` class that manages products, customers, orders, and notifications all by itself. Refactor it:

      1. **Extract `Product`** — name, price, stock, `is_available()`, `reduce_stock()`
      2. **Extract `Customer`** — name, email
      3. **Extract `Order`** — stores customer and items, calculates total
      4. **Slim down `OnlineStore`** — coordinates the other classes

      > **Refactor in small steps:** Select a coherent block of complete statements inside `place_order` and try **Refactor: Extract Function/Method...** from the editor's context menu or Command Palette. Review the preview and run the code to check that behavior stays the same. A helper method is an intermediate step; use the target diagram to decide which class should ultimately own that responsibility. Finish with **Test My Work**.

      ### Behavior to Preserve

      The supplied starter already validates the whole request before changing stock. Keep this policy while moving responsibilities between classes; changing a policy is a separate task from refactoring.

      - **Catalog assumptions:** supplied product names are unique and prices and starting stocks are nonnegative; validation of those inputs is outside this exercise.
      - **Successful request:** keep the requested items in order, including repeated names. Each occurrence contributes its price and reduces that product's stock by one. Store the order and print a confirmation containing the customer email and total to two decimal places.
      - **Unknown product or insufficient stock:** raise `ValueError` before changing any stock, recording an order, or printing a confirmation. Repeated names count toward the requested quantity.
      - **Empty request:** create an empty order with a zero total and confirm it.
      - **Extracted interfaces:** `Order(customer)` retains that customer and starts with empty items and zero total. `add_item(product)`, called for an available product, retains the same product object, updates the total, and reduces stock. `OnlineStore.place_order` now receives a `Customer` and returns the resulting `Order`, as shown in the target; update the driver for those interface changes.

      Before editing, run the starter with a valid purchase and a rejected request. After each extraction, check the same outcomes through the new interfaces. The target changes how objects collaborate while preserving these stated outcomes.

      ### Check and Explain

      1. **Model:** implement the suggested classes and inspect their inferred relationships. Use the domain caveat above to distinguish stored links from lifecycle contracts.
      2. **Check:** run your successful and rejected scenarios from `store-design.md`, then run **Test My Work** for the supplied contract.
      3. **Explain:** finish your Comparison section with one concrete change request—such as changing contact details or stock policy—and identify which class should absorb it and why. Revisit your original design rather than replacing it with the target.

    uml_files:
      - store.py

    files:
      - *store_design_notes
      - path: store.py
        reseed: true
        content: |
          class OnlineStore:
              """THE GOD CLASS — does everything, knows everything, fears nothing.
              Look at the UML diagram: one giant box, no collaborators.

              Your mission: extract Product, Customer, and Order classes."""

              def __init__(self) -> None:
                  # Product data (should be its own class)
                  self._product_names: list[str] = []
                  self._product_prices: list[float] = []
                  self._product_stocks: list[int] = []

                  # Order data (should be its own class)
                  self._order_customer_names: list[str] = []
                  self._order_customer_emails: list[str] = []
                  self._order_items: list[list[str]] = []
                  self._order_totals: list[float] = []

              # ── Product management ──────────────────────────────────
              def add_product(self, name: str, price: float, stock: int) -> None:
                  self._product_names.append(name)
                  self._product_prices.append(price)
                  self._product_stocks.append(stock)

              def is_product_available(self, name: str) -> bool:
                  idx = self._product_names.index(name)
                  return self._product_stocks[idx] > 0

              def get_product_price(self, name: str) -> float:
                  idx = self._product_names.index(name)
                  return self._product_prices[idx]

              def reduce_product_stock(self, name: str) -> None:
                  idx = self._product_names.index(name)
                  self._product_stocks[idx] -= 1

              # ── Order management ────────────────────────────────────
              def place_order(self, customer_name: str, customer_email: str,
                              product_names: list) -> int:
                  # Validate the complete request before committing any changes.
                  quantities = {}
                  for pname in product_names:
                      idx = self._product_names.index(pname)  # ValueError for unknown names
                      quantities[pname] = quantities.get(pname, 0) + 1
                      if quantities[pname] > self._product_stocks[idx]:
                          raise ValueError(f"Insufficient stock for {pname}")

                  total = 0.0
                  for pname in product_names:
                      total += self.get_product_price(pname)
                      self.reduce_product_stock(pname)

                  self._order_customer_names.append(customer_name)
                  self._order_customer_emails.append(customer_email)
                  self._order_items.append(product_names)
                  self._order_totals.append(total)

                  order_id = len(self._order_totals) - 1
                  print(f"[EMAIL] To: {customer_email} | Order #{order_id} confirmed: ${total:.2f}")
                  return order_id

              def get_order_total(self, order_id: int) -> float:
                  return self._order_totals[order_id]


          if __name__ == "__main__":
              store = OnlineStore()
              store.add_product("Laptop", 999.99, 5)
              store.add_product("Mouse", 29.99, 50)
              store.add_product("Keyboard", 79.99, 30)

              order_id = store.place_order("Alice", "alice@example.com",
                                           ["Laptop", "Mouse"])
              print(f"Order total: ${store.get_order_total(order_id):.2f}")
        language: python

