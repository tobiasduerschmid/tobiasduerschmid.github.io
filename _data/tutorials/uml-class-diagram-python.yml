          - title: Separate identity from contents
            text: Construct an order before adding anything. Compare its customer with the caller’s object and inspect the state that represents purchases so far.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Order\\b))(?![\\s\\S]*(?:^class[ \\t]+Order\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+__init__\\b[^\\n]*\\n(?:(?!^\\S|^ {1,4}\\S)[\\s\\S])*?self\\.items\\b))[\\s\\S]*$/m"
          - title: Check two fresh orders
            text: Create orders for two customers, add an item to just one, and inspect the other. Use a before/after table to identify shared initial state or incorrect starting values.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Order\\b))(?=[\\s\\S]*(?:^class[ \\t]+Order\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+__init__\\b[^\\n]*\\n(?:(?!^\\S|^ {1,4}\\S)[\\s\\S])*?self\\.items\\b))[\\s\\S]*$/m"
      - description: Order retains product identity and repeated item occurrences
        command: |
          source = open('/tutorial/store.py').read()
          ns = {}
          exec(source, ns)
          order = ns['Order'](ns['Customer']('Alice', 'alice@example.com'))
          first = ns['Product']('Pen', 2.5, 3)
          second = ns['Product']('Book', 7.0, 2)
          for product in (first, second, first):
              order.add_item(product)
          assert len(order.items) == 3, "Every added occurrence should remain in the order"
          assert all(actual is expected for actual, expected in zip(order.items, [first, second, first])), \
              "Order items should retain the supplied Product objects in addition order"
        hints:
          - title: Track an item through add_item
            text: The caller supplies a Product object. Decide what Order must retain so later code can reach that same catalog item.
            condition: "code_not_matches: /^class[ \\t]+Order\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+add_item\\b[^\\n]*/m"
          - title: Distinguish an item from its label
            text: "After one addition, inspect the stored entry: is it the supplied product, copied product data, or just a name? Compare that with the target relationship."
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Order\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+add_item\\b[^\\n]*))(?![\\s\\S]*(?:^class[ \\t]+Order\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+add_item\\b[^\\n]*\\n(?:(?!^\\S|^ {1,4}\\S)[\\s\\S])*?self\\.items\\b))[\\s\\S]*$/m"
          - title: Trace a repeated purchase
            text: Add product A, then B, then A again. Sketch the references after each call; the last call represents another purchased unit even though the object is the same.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Order\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+add_item\\b[^\\n]*))(?=[\\s\\S]*(?:^class[ \\t]+Order\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+add_item\\b[^\\n]*\\n(?:(?!^\\S|^ {1,4}\\S)[\\s\\S])*?self\\.items\\b))[\\s\\S]*$/m"
      - description: Order total includes the price of every added occurrence
        command: |
          source = open('/tutorial/store.py').read()
          ns = {}
          exec(source, ns)
          order = ns['Order'](ns['Customer']('Alice', 'alice@example.com'))
          first = ns['Product']('Pen', 2.5, 3)
          second = ns['Product']('Book', 7.0, 2)
