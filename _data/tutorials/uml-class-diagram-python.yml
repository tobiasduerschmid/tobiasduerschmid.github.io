            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Order\\b))(?=[\\s\\S]*(?:^class[ \\t]+OnlineStore\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+place_order\\b[^\\n]*\\n(?:(?!^\\S|^ {1,4}\\S)[\\s\\S])*?\\bOrder\\s*\\())[\\s\\S]*$/m"
      - description: Unknown products reject the whole request without side effects
        command: |
