    solution:
      files:
        - path: store.py
          content: |
            class Product:
                def __init__(self, name: str, price: float, stock: int) -> None:
                    self.name: str = name
                    self.price: float = price
                    self.stock: int = stock

                def is_available(self) -> bool:
                    return self.stock > 0

                def reduce_stock(self) -> None:
                    self.stock -= 1


            class Customer:
                def __init__(self, name: str, email: str) -> None:
                    self.name: str = name
                    self.email: str = email


            class Order:
                def __init__(self, customer: Customer) -> None:
                    self.customer: Customer = customer
                    self.items: list[Product] = []
                    self.total: float = 0.0

                def add_item(self, product: Product) -> None:
                    self.items.append(product)
                    self.total += product.price
                    product.reduce_stock()


            class OnlineStore:
                def __init__(self) -> None:
                    self.products: list[Product] = []
                    self.orders: list[Order] = []

                def add_product(self, product: Product) -> None:
                    self.products.append(product)

                def place_order(self, customer: Customer, product_names: list) -> Order:
                    selected = []
                    quantities = {}
                    for name in product_names:
                        product = next((p for p in self.products if p.name == name), None)
                        if product is None:
                            raise ValueError(f"Unknown product: {name}")
                        quantities[name] = quantities.get(name, 0) + 1
                        if quantities[name] > product.stock:
                            raise ValueError(f"Insufficient stock for {name}")
                        selected.append(product)

                    order = Order(customer)
                    for product in selected:
                        order.add_item(product)
                    self.orders.append(order)
                    print(f"[EMAIL] To: {customer.email} | Order confirmed: ${order.total:.2f}")
                    return order


            if __name__ == "__main__":
                store = OnlineStore()
                store.add_product(Product("Laptop", 999.99, 5))
                store.add_product(Product("Mouse", 29.99, 50))
                store.add_product(Product("Keyboard", 79.99, 30))

                customer = Customer("Alice", "alice@example.com")
                order = store.place_order(customer, ["Laptop", "Mouse"])
                print(f"Order total: ${order.total:.2f}")
          language: python
      explanation: |
        **Before:** One God Class with 10+ attributes stored as parallel lists — the UML showed a single massive box with no structure.

        **After:** Four cohesive classes with clear responsibilities:
        - `Product` knows about itself (name, price, stock)
        - `Customer` holds identity data
        - `Order` manages a collection of products for a customer
        - `OnlineStore` coordinates the system

        The UML diagram now exposes the classes and their inferred associations and dependencies. Use it to discuss which class should own each responsibility. More boxes and arrows alone do not establish a good design; check cohesion, behavior, and the ownership contracts as well.

        The complete request is validated before Order.add_item changes stock. Unknown names or excess quantities therefore leave the catalog and recorded orders unchanged. Keeping each occurrence in the selected sequence preserves repeated purchases and request order. The original and extracted versions implement the same stated policy; a different error or stock policy would be a separate behavior change.

        Compare this implementation with your original proposal. The useful evidence is that product data stays together, customer identity is shared by reference, order state changes consistently, and rejection happens before effects. Keep or revise your own choices for those reasons, rather than because the suggested diagram has four boxes.

    tests:
