        hints:
          - title: Follow the purchase side effect
            text: The contract gives add_item a stock effect as well as an order effect. Trace which Product instance must observe that change.
            condition: "code_not_matches: /^class[ \\t]+Order\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+add_item\\b[^\\n]*/m"
