            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Playlist\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?\\bself\\.(?:songs)\\b))(?=[\\s\\S]*(?:^class[ \\t]+Playlist\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+__init__\\b[^\\n]*\\n(?:(?!^\\S|^ {1,4}\\S)[\\s\\S])*?self\\.songs[ \\t]*(?::[^=\\n]+)?=))[\\s\\S]*$/m"

      - description: "add_song() works and get_song_count() is correct"
