            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Order\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+add_item\\b[^\\n]*))(?=[\\s\\S]*(?:^class[ \\t]+Order\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+add_item\\b[^\\n]*\\n(?:(?!^\\S|^ {1,4}\\S)[\\s\\S])*?\\b(?:reduce_stock|stock)\\b))[\\s\\S]*$/m"
      - description: OnlineStore records a complete purchase through the extracted classes
        command: |
          source = open('/tutorial/store.py').read()
          ns = {}
          exec(source, ns)
          store = ns['OnlineStore']()
          first = ns['Product']('Pen', 2.5, 3)
          second = ns['Product']('Book', 7.0, 2)
