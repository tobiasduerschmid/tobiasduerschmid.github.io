                  "The total should include all purchases so far, including repeats"
        hints:
          - title: Connect items with the total
            text: Find where the starter calculates the purchase total. Which extracted class now owns the purchases that contribute to it?
            condition: "code_not_matches: /^class[ \\t]+Order\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+add_item\\b[^\\n]*/m"
          - title: Compare one item with two
            text: Add products with unequal prices and inspect the total after each call. Check whether the second call preserves the first item’s contribution.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Order\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+add_item\\b[^\\n]*))(?![\\s\\S]*(?:^class[ \\t]+Order\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+add_item\\b[^\\n]*\\n(?:(?!^\\S|^ {1,4}\\S)[\\s\\S])*?self\\.total\\b))[\\s\\S]*$/m"
          - title: Fill a contribution table
            text: For purchases A, B, A, write each occurrence’s price and the combined total after that row. Compare your implementation with the first row where it diverges.
            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Order\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+add_item\\b[^\\n]*))(?=[\\s\\S]*(?:^class[ \\t]+Order\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+add_item\\b[^\\n]*\\n(?:(?!^\\S|^ {1,4}\\S)[\\s\\S])*?self\\.total\\b))[\\s\\S]*$/m"
      - description: Order consumes stock for every added occurrence
        command: |
          source = open('/tutorial/store.py').read()
          ns = {}
          exec(source, ns)
          order = ns['Order'](ns['Customer']('Alice', 'alice@example.com'))
          first = ns['Product']('Pen', 2.5, 3)
