            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Customer\\b))(?![\\s\\S]*(?:^class[ \\t]+Customer\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+__init__\\b[^\\n]*\\n(?:(?!^\\S|^ {1,4}\\S)[\\s\\S])*?self\\.))[\\s\\S]*$/m"
