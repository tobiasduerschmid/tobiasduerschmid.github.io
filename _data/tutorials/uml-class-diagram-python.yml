            condition: "code_matches: /(?<![\\s\\S])(?=[\\s\\S]*(?:^class[ \\t]+Product\\b))(?=[\\s\\S]*(?:^class[ \\t]+Product\\b[^\\n]*\\n(?:(?!^\\S)[\\s\\S])*?^ {4}def[ \\t]+is_available\\b[^\\n]*\\n(?:(?!^\\S|^ {1,4}\\S)[\\s\\S])*?\\breturn\\b))[\\s\\S]*$/m"
      - description: Product reduces stock by one per call
        command: |
