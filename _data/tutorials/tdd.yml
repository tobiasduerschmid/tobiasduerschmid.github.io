      `ImportError: cannot import name 'ScoringEvent'` — the test forces you to *name* the event class before writing it. That's the design pressure of test-first thinking.
      </details>

      <details markdown="1"><summary>Reveal — one shape for the smallest GREEN (open after you've tried)</summary>

      A hardcoded `if dice == [1]:` branch returning a `BattleReport` with one `ScoringEvent`. Yes, it's ugly, and cycle 3 will duplicate it. A loop written now would also decide how `[1, 1]` or `[2]` score, and no test says that yet.
      </details>

      > **Why "allow the hard-code" is a TDD discipline.** The instinct is to extract a rule, write a loop, build the abstraction now. But a general rule decides cases your tests don't cover yet: how `[1, 1]` scores, whether a lone `2` scores, which order events come in. Until a test pins those down, the abstraction is a guess. **Generalize only what your tests already pin down.**

