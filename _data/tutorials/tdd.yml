title: "TDD with pytest — Dragon Dice Battle"
description: "Live the Red-Green-Refactor rhythm by growing a fantasy dice-scoring engine from scratch — seven small cycles, one design pressure at a time, plus a final transfer cycle (FizzBuzz) to practice the rhythm on a new problem. Tests drive design, refactors stay safe, and the rules of the game emerge as code."

# Authoring-time Bloom-verb objectives. Not yet rendered to students.
learning_objectives:
  - "Apply the Red-Green-Refactor rhythm to grow a small system one test at a time."
  - "Write a failing test FIRST (Red) and explain what each failing test is asking the design to clarify."
  - "Make the failing test pass with the minimum code (Green) without overshooting."
  - "Refactor while tests stay green — distinguishing safe refactors from risky ones."
  - "Decide when a generalization is safe: only when the tests already pin down everything it decides."
  - "Choose the next test by aiming it at a boundary no earlier test reached."
  - "Apply the same rhythm to a new domain (FizzBuzz) and confirm the technique transfers."

backend: pyodide
debugger: true
pytest: true

# Editor IDE features:
#   linter: true      → live pyflakes diagnostics in the Monaco gutter
#                       (squigglies for undefined names, unused imports, etc.)
#   git_gutter: true  → +/-/~ markers next to changed lines vs HEAD
#                       (requires git_graph; see below)
linter: true
git_gutter: true

# Show code (left) and tests (right) side by side. Files prefixed `test_`
# auto-route to the right pane; `scorer.py` lands on the left.
editor_split: true

# Compact output panel — most action is in the editors. The strip below the
# editors is just for skimming pytest's pass/fail summary.
output_height: "25%"

require_tests: true
autosave_type: files

# Live git visualization next to the editor — students can switch to the Git
# Graph view at any time and commit each Red-Green-Refactor step to watch the
# DAG grow. The embedded terminal accepts a small set of git commands.
git_graph: /tutorial
git_setup:
  - "git config user.name 'Student'"
  - "git config user.email 'student@example.com'"

# Global setup: install pytest, expose /tutorial on sys.path, and patch the
# pytest module cache so each `pytest.main(...)` call sees the latest source
# rather than a stale import. The module name list MUST include every project
# module the student edits — `scorer` for cycles 1-7, `fizzbuzz` for the
# transfer cycle.
setup_commands:
  - "import pyodide_js; await pyodide_js.loadPackage('pytest')"
  - "import sys; sys.path.insert(0, '/tutorial')"
  - |
    import pytest as _pytest, sys as _sys
    def _make_pytest_patch():
        _orig = _pytest.main
        _sysmod = _sys
        def _patched(*a, **kw):
            for m in list(_sysmod.modules):
                if m.startswith('test_') or m in ('scorer', 'fizzbuzz'):
                    del _sysmod.modules[m]
            return _orig(*a, **kw)
        return _patched
    _pytest.main = _make_pytest_patch()

  - |
    import sys, types
    from pyodide.http import pyfetch
    _grading_response = await pyfetch('/assets/tutorials/python_test_grading.py')
    _grading_response.raise_for_status()
    _grading_module = types.ModuleType('tutorial_test_grading')
    exec(await _grading_response.string(), _grading_module.__dict__)
    sys.modules['tutorial_test_grading'] = _grading_module
  - |
    # Keep helpers in a module: the worker clears execution globals between checks.
    def _install_tdd_checks():
        import ast
        import importlib
        import sys
        import pytest
        from tutorial_test_grading import check_suite

        reference_template = '''
    from collections import Counter
    from dataclasses import dataclass

    @dataclass(frozen=True)
    class ScoringEvent:
        name: str
        dice_used: tuple
        damage: int

    @dataclass(frozen=True)
    class BattleReport:
        events: tuple = ()
        @property
        def total_damage(self):
            return sum(event.damage for event in self.events)

    def score(dice):
        cycle = CYCLE
        singles = {1: ("Dragon Flame", 100), 5: ("Lightning Spark", 50)}
        combos = {1: ("Dragon Blast", 1000), 2: ("Goblin Swarm", 200),
                  3: ("Orc Charge", 300), 4: ("Troll Smash", 400),
                  5: ("Lightning Storm", 500), 6: ("Demon Strike", 600)}
        events = []
        if cycle <= 4:
            for die in dice:
                if (die == 1 and cycle >= 2) or (die == 5 and cycle >= 3):
                    name, damage = singles[die]
                    events.append(ScoringEvent(name, (die,), damage))
        else:
            counts = Counter(dice)
            for face, (name, damage) in combos.items():
                if cycle == 5 and face != 1:
                    continue
                groups = counts[face] // 3
                if cycle < 7:
                    groups = min(groups, 1)
                for _ in range(groups):
                    events.append(ScoringEvent(name, (face,) * 3, damage))
                counts[face] -= groups * 3
            for face, (name, damage) in singles.items():
                events.extend(ScoringEvent(name, (face,), damage)
                              for _ in range(counts[face]))
        return BattleReport(tuple(events))
    '''
        fizzbuzz_reference = '''
    def fizzbuzz(n):
        if n < 0:
            raise ValueError("n must be non-negative")
        return [("Fizz" * (i % 3 == 0) + "Buzz" * (i % 5 == 0)) or str(i)
                for i in range(1, n + 1)]
    '''

        def reference(cycle):
            return reference_template.replace('CYCLE', str(cycle))

        def load_reference(source):
            namespace = {'__name__': '_tdd_reference'}
            exec(source, namespace)
            return namespace

        def fresh_module(name):
            sys.modules.pop(name, None)
            importlib.invalidate_caches()
            return importlib.import_module(name)

        def check_score(cycle):
            scorer = fresh_module('scorer')
            expected_score = load_reference(reference(cycle))['score']
            cases = [[]]
            if cycle >= 2:
                cases += [[1]]
            if cycle >= 3:
                cases += [[5]]
            if cycle >= 4:
                cases += [[1, 1], [1, 5], [5, 5], [2, 3, 4, 6]]
            if cycle >= 5:
                cases += [[1, 1, 1], [1, 1, 1, 1, 5], [5, 1], [5, 1, 2, 1, 1, 1]]
            if cycle >= 6:
                cases += [[face] * 3 for face in range(2, 7)]
                cases += [[5, 2, 5, 1, 2, 5, 2, 5]]
            if cycle >= 7:
                cases += [[face] * count for face in range(1, 7)
                          for count in (6, 7)]
            for dice in cases:
                actual = scorer.score(list(dice))
                expected = expected_score(dice)
                actual_events = tuple((e.name, e.dice_used, e.damage) for e in actual.events)
                expected_events = tuple((e.name, e.dice_used, e.damage) for e in expected.events)
                assert isinstance(actual.events, tuple), "BattleReport.events must be a tuple."
                assert actual.total_damage == expected.total_damage, (
                    f"score({dice}) has damage {actual.total_damage}; expected {expected.total_damage}.")
                assert actual_events == expected_events, (
                    f"score({dice}) has events {actual_events}; expected {expected_events}.")
            check_suite('/tutorial/test_scorer.py', 'scorer')

        def check_score_test(cycle, dice_cases):
            # The whole suite must pin down damage and events for each roll, so
            # learners may name and arrange their tests however they like.
            source = reference(cycle)
            check_suite('/tutorial/test_scorer.py', 'scorer', source)
            for dice in dice_cases:
                for field in ('damage', 'events'):
                    mutant = source + '''
    from types import SimpleNamespace
    _correct_score = score
    def score(dice):
        report = _correct_score(dice)
        if list(dice) == TARGET:
            return SimpleNamespace(
                total_damage=report.total_damage + (FIELD == 'damage'),
                events=((tuple(ScoringEvent("Incorrect event", e.dice_used, e.damage)
                               for e in report.events) or (ScoringEvent("Incorrect event", (), 0),))
                        if FIELD == 'events' else report.events))
        return report
    '''.replace('TARGET', repr(dice)).replace('FIELD', repr(field))
                    try:
                        check_suite('/tutorial/test_scorer.py', 'scorer', mutant,
                                    expect_failure=True)
                    except AssertionError as error:
                        raise AssertionError(
                            f"No test rejects incorrect {field} for score({dice}). "
                            "Assert the promised value, not just a type or non-negative result.\n"
                            f"{error}") from error

        def score_loops_over_roll():
            # True when score() iterates over its dice in a for statement or a
            # comprehension (`for d in sorted(dice)` counts as well).
            tree = ast.parse(open('/tutorial/scorer.py').read())
            score_fn = next((n for n in ast.walk(tree)
                             if isinstance(n, ast.FunctionDef) and n.name == 'score'), None)
            assert score_fn is not None, "Define a `score` function in scorer.py"
            param = score_fn.args.args[0].arg if score_fn.args.args else 'dice'
            return any(
                isinstance(n, (ast.For, ast.comprehension))
                and any(isinstance(name, ast.Name) and name.id == param
                        for name in ast.walk(n.iter))
                for n in ast.walk(score_fn))

        def check_fizzbuzz():
            actual = fresh_module('fizzbuzz').fizzbuzz
            expected = load_reference(fizzbuzz_reference)['fizzbuzz']
            for n in (0, 1, 2, 3, 5, 14, 15, 16, 30, 31):
                assert actual(n) == expected(n), (
                    f"fizzbuzz({n}) must return exactly {n} correctly transformed strings.")
            check_suite('/tutorial/test_fizzbuzz.py', 'fizzbuzz')

        def fizzbuzz_reference_for_learner():
            # Negative n is an optional extension with no single required
            # behavior, so the reference defers it to the learner's own code.
            return fizzbuzz_reference + '''
    _required_fizzbuzz = fizzbuzz
    _learner = {'__name__': 'learner_fizzbuzz'}
    try:
        exec(compile(LEARNER_SOURCE, 'fizzbuzz.py', 'exec'), _learner)
    except Exception:
        pass  # A broken draft fails the implementation check, not this one.
    def fizzbuzz(n):
        if n < 0 and callable(_learner.get('fizzbuzz')):
            return _learner['fizzbuzz'](n)
        return _required_fizzbuzz(n)
    '''.replace('LEARNER_SOURCE', repr(open('/tutorial/fizzbuzz.py').read()))

        # One wrong implementation per required partition; each check reports one.
        fizzbuzz_mutants = {
            'empty input': "return ['1'] if n == 0 else _correct_fizzbuzz(n)",
            'requested length': "return _correct_fizzbuzz(15)",
            'numbers as strings':
                "return [int(v) if v.isdigit() else v for v in _correct_fizzbuzz(n)]",
            'multiples of 3':
                "return [str(i) if v == 'Fizz' else v for i, v in enumerate(_correct_fizzbuzz(n), 1)]",
            'multiples of 5':
                "return [str(i) if v == 'Buzz' else v for i, v in enumerate(_correct_fizzbuzz(n), 1)]",
            'multiples of 15':
                "return ['Fizz' if v == 'FizzBuzz' else v for v in _correct_fizzbuzz(n)]",
        }

        def check_fizzbuzz_tests_agree():
            check_suite('/tutorial/test_fizzbuzz.py', 'fizzbuzz', fizzbuzz_reference_for_learner())

        def check_fizzbuzz_tests_detect(behavior):
            # Each check also needs the passing reference run, so a suite that
            # fails everywhere cannot earn detection credit.
            reference = fizzbuzz_reference_for_learner()
            check_suite('/tutorial/test_fizzbuzz.py', 'fizzbuzz', reference)
            mutant = (reference + '\n_correct_fizzbuzz = fizzbuzz\ndef fizzbuzz(n):\n    '
                      + fizzbuzz_mutants[behavior] + '\n')
            try:
                check_suite('/tutorial/test_fizzbuzz.py', 'fizzbuzz', mutant, expect_failure=True)
            except AssertionError as error:
                raise AssertionError(f"Your tests must detect incorrect {behavior}.\n{error}") from error

        pytest._tdd_check_score = check_score
        pytest._tdd_check_score_test = check_score_test
        pytest._tdd_score_loops_over_roll = score_loops_over_roll
        pytest._tdd_check_fizzbuzz = check_fizzbuzz
        pytest._tdd_check_fizzbuzz_tests_agree = check_fizzbuzz_tests_agree
        pytest._tdd_check_fizzbuzz_tests_detect = check_fizzbuzz_tests_detect

    _install_tdd_checks()

steps:

  # ==========================================================================
  # CYCLE 1 — Empty roll creates an empty battle report
  #
  # The first cycle is split into THREE separate tutorial steps so that
  # students live each phase of Red-Green-Refactor as a distinct moment, not
  # a slogan. No quiz appears until after the REFACTOR step — the goal here
  # is to *feel* the rhythm before being asked to reason about it.
  # ==========================================================================

  # --------------------------------------------------------------------------
  # STEP 1 — Cycle 1 RED: write the failing test
  # Pedagogy:
  #   Worked example      — the test is given; student types it and runs.
  #   PRIMM (Predict)     — student predicts what failure they will see.
  #   Threshold concept   — TDD is design, not verification (set up here).
  #   Cognitive load      — only ONE moving part: the test. No code yet.
  #   Misconception fix   — "failing test = bad test" is named and refuted.
  # --------------------------------------------------------------------------
  - title: "Cycle 1 — RED: Write the Failing Test"
    instructions: |
      ### Why this matters

      RED is the moment TDD looks weirdest: you deliberately write a test that *cannot* pass yet, and you make the failure happen on purpose. That inversion is the threshold concept — a *failing* test is the goal, not the accident, because it's the first place where the spec gets pinned down before any implementation exists. Learning to read a failure for the *right reason* is the foundation everything else in this tutorial sits on.

      ### 🎯 You will learn to

      - Apply the four-part pytest test shape (import, define, arrange-act, assert) to translate a one-sentence spec into a runnable failing test
      - Analyze a pytest failure and distinguish a *right-reason* RED (`ImportError` / `AssertionError` on the assertion you wrote) from a *wrong-reason* RED (typo / missing colon)
      - Evaluate why a surprise *green* on a brand-new test should be treated as a Liar test until proven otherwise

      > **Prerequisite:** [Testing Foundations](/SEBook/testing/testing-foundations-tutorial) — pytest discovery, `assert`, partitions, behavior-not-implementation. If those feel new, do that one first.

      ## What you're building — *Dragon Dice*

      **Dragon Dice** is a (fictional) tabletop combat game. The mechanic is simple: a player rolls a handful of six-sided dice, and certain face values and combinations trigger named *combat events* — *Dragon Flame*, *Lightning Spark*, *Goblin Swarm*, and so on — each worth a damage number. A turn's roll is just a Python list of dice values, e.g. `[1, 1, 1, 1, 5]`.

      Two kinds of scoring happen on every roll:

      - **Singles** — a `1` becomes one *Dragon Flame* (100 damage); a `5` becomes one *Lightning Spark* (50). Other face values, on their own, score nothing.
      - **Triples (combos)** — three matching dice trigger a bigger event that *consumes* its dice. Three 1s become **one** *Dragon Blast* (1000) instead of three Dragon Flames; three 2s become a *Goblin Swarm*; and so on. Whatever the combos don't consume keeps scoring as singles, so `[1, 1, 1, 1, 5]` produces *one* Dragon Blast (consuming three 1s) **plus** a leftover Dragon Flame **plus** a Lightning Spark — for 1150 total damage. The full ruleset is in the table further down.

      Your goal across the seven Dragon-Dice cycles is to grow a `score(dice)` function that turns any roll into a `BattleReport` — its `total_damage` and the ordered tuple of `ScoringEvent`s it produced. **You will not look at the full ruleset and write it all at once.** TDD adds **one rule at a time**, each one earned by a test that demands it. After cycle 7 an eighth *transfer* cycle reapplies the same rhythm to a totally unrelated problem (FizzBuzz), to practice the discipline beyond this domain.

      ## Test-Driven Development in one minute

      TDD is a **design** technique that uses tests as the medium of pressure. You write code in short cycles of three phases:

      | Phase | What you do | Why this phase exists |
      |---|---|---|
      | 🔴 **RED** | Write **one** failing test that names a behavior you want | Forces the interface and expected behavior to be decided *before* any logic exists |
      | 🟢 **GREEN** | Write the **smallest** code that makes the test pass | Resists speculative design; only build what a test demands |
      | 🔵 **REFACTOR** | Improve the code while all tests stay green | The safety net lets you reshape structure without fear of regression |

      Each phase of cycle 1 is its own tutorial step so the rhythm becomes a *felt sequence*, not a slogan. From cycle 2 onward, each cycle is one step containing all three phases.

      ## Why a *failing* test is the goal of RED

      ![A wizard pointing at a screen showing "BUILD SUCCESSFUL — TEST CASES: 25, PASS: 25, FAIL: 0" and shouting "YOU SHALL NOT PASS!"](/img/you_shall_not_pass.jpg)

      Most testing intuition is the opposite: green = good, red = bad. TDD inverts that *for the first run of every cycle*. If you write a brand-new test against code that doesn't exist yet — and pytest reports `PASSED` — something is **wrong**. Maybe the import silently failed. Maybe the assertion is vacuous. Maybe you're running an old cached version. A surprise green is a *Liar test* until proven otherwise; the wizard is right to block it.

      A failing test is **not a bug** — RED is the expected starting state of every cycle. But the failure has to come from the *behavior under test*, not from a typo:

      - **Right reason** — `ImportError`, `AttributeError`, a value-mismatch on the assertion you wrote. The test correctly says *"this behavior does not exist yet."*
      - **Wrong reason** — `SyntaxError`, missing colon, misspelled `test_` prefix. The test never ran. You've learned nothing about the unit, only about your typing.

      Students commonly delete a failing test to make the bar green. We're leaning into that discomfort instead. **Learning to read the failure** is what TDD trains.

      <details markdown="1"><summary>🤔 But why <em>test-first</em>? Why not just write the code, then test it?</summary>

      The honest answer: most developers' instinct is to write the code first. *That* is the habit TDD is replacing — and it deserves a real argument, not just a style claim.

      **A small concrete scenario.** Suppose you skip the test and just write `score()` directly. You're confident it's right; you eyeball-check it in a REPL with `score([1])` and `score([1, 5])`, see plausible numbers, ship. Two weeks later your teammate adds a `triple 1s = Dragon Blast` rule by inserting an `elif` branch that *fires before* the per-die loop. The `elif` only matches *exactly* `[1, 1, 1]`; rolls like `[1, 1, 1, 5]` silently fall through and score wrong.

      A test for exactly three 1s would not catch that leftover bug. You also need a case with a triple and leftover singles. Writing those expected results from the rules gives you a way to check both behaviors before shipping; test-first alone does not guarantee you choose every necessary case.

      **The general pattern.** Deciding expected results before implementation can help keep tests anchored to requirements. Tests written afterward can also be rigorous, but need the same independence from the implementation. Test-first gives you a recurring prompt to make that behavioral commitment early. Notice your own sequence during the exercise: did you decide the expected result before implementing it? That is something you can check directly.

      So you might still resist test-first today. Notice the resistance. The goal of these seven cycles is to give you the *felt experience* of small-step rhythm — after which you'll be choosing test-first because it works, not because we said so. (And per Fucci et al. 2017: even if you sometimes write the code an instant before the test, fine granularity and regular rhythm were associated with better outcomes in that study. So don't worry about being a purist; worry about being incremental.)
      </details>

      ## The shape of every pytest test

      Every pytest test you write has the same four-part structure:

      | Part | What it does |
      |---|---|
      | **Import** the unit under test | Tells Python what code you'll call |
      | **Define** a function whose name starts with `test_` | pytest only discovers functions matching this pattern |
      | **Arrange + act** | Set up any input and call the unit |
      | **Assert** an observable property of the result | Pin down one thing the spec promises |

      The pattern generalizes; the *specifics* (what to import, call, and assert) come from the spec — and only from the spec.

      ## The dragon dice rules (reference for all seven cycles)

      | Roll | Event | Damage |
      |------|-------|--------|
      | Single 1 | Dragon Flame | 100 |
      | Single 5 | Lightning Spark | 50 |
      | Triple 1 | Dragon Blast | 1000 |
      | Triple 2 | Goblin Swarm | 200 |
      | Triple 3 | Orc Charge | 300 |
      | Triple 4 | Troll Smash | 400 |
      | Triple 5 | Lightning Storm | 500 |
      | Triple 6 | Demon Strike | 600 |

      Triples consume three dice; leftover 1s and 5s still score as singles. Dice are integers 1–6. **Today you implement only the empty-roll case.** Six more cycles add the rest, and a final **transfer cycle** (a different problem entirely) lets you practice the rhythm again.

      ## Commit after every step (the safety-net habit)

      The editor has a **Git Graph** view next to it and an embedded terminal that accepts a small set of shell commands (`git`, `python`, `pytest`, plus `&&`/`||`/`;` chains). **Commit at the end of each step** with a short message naming the phase (`RED:`, `GREEN:`, `REFACTOR:`, `Cycle N:`). Two reasons it earns its keep:

      - **Atomic safety net.** Every GREEN or REFACTOR commit is a *known-green* state you can `git reset --hard` back to if a refactor goes sideways (a RED commit deliberately records a failing test). The habit to build: never refactor on top of uncommitted code.
      - **Visible history.** The Git Graph view shows your DAG growing one node per phase — a literal picture of "Red, Green, Refactor, Red, Green, Refactor…" that mirrors what your editor just did.

      Cycle 1's three steps each give you the **exact command** to type. From Cycle 2 onwards, the commit prompt only suggests the *message* — you write the `git add <files> && git commit -m "..."` yourself. (Always stage the specific files you touched, e.g. `git add scorer.py test_scorer.py`. Avoid `git add -A` — it sweeps in junk you didn't mean to commit.)

      ## Your test list (Canon TDD step 1)

      Kent Beck's *Canon TDD* (December 2023) starts with **a written list of behaviors you want the code to have** — *before* writing any tests. The list isn't a contract; it's a thinking tool. New behaviors get appended as they occur to you; ones you finish get struck through; ones that turn out to be already-implemented (the mixed-dice guardrail in cycle 4, the leftover guardrail in cycle 5) get a checkmark with no code change.

      Here are the first three items, *in the order the cycles will tackle them*:

      - ☐ Cycle 1 — Empty roll → no damage, no events
      - ☐ Cycle 2 — A single 1 → one Dragon Flame event
      - ☐ Cycle 3 — A single 5 → one Lightning Spark event
      - ☐ Cycle 4 — …

      More items appear as we work through them — Beck's discipline is to *not* pre-resolve them all. Pick the next item, turn *only that one* into a runnable test, make it pass, optionally refactor, repeat. He names two mistakes explicitly: converting every list item into a test up front (it invites rework, plus "depression and/or boredom" when nothing passes for a while), and mixing refactoring into making a test pass (the "wearing two hats" problem). Until cycle 7 the steps pick the next item for you; in cycle 7 you choose it, and in the final FizzBuzz cycle you write the whole list.

      ## Cycle 1's spec

      > **An empty roll produces a battle report with zero damage and no events.**

      That sentence names everything you need: a function `score`, a return value with `total_damage` and `events` attributes. Translate it into a pytest test using the four-part shape.

      ## Your task

      1. In **`test_scorer.py`** (right pane), fill in the three sub-goal comments. Leave **`scorer.py`** empty — its code belongs to the GREEN step.
      2. **Predict** the *category* of failure you'll see — `ImportError`, `AttributeError`, or `AssertionError`? Write it down.
      3. Click **▶ Test** in the Output panel to run pytest (**Test My Work** checks the whole step). Compare the actual failure to your prediction.

      <details markdown="1"><summary>Reveal — what we expected (open after running)</summary>

      `ImportError: cannot import name 'score'` because the existing `scorer.py` has no `score` function. **That IS the deliverable** — RED for the right reason.
      </details>

      <details markdown="1"><summary>Why `()` and not `[]`? (open if you wondered)</summary>

      Tuples are immutable — they can't be mutated by accident, and they're safe dataclass defaults (cycle 2 uses that). Every test in this tutorial that pins down events uses a tuple.
      </details>

      <details markdown="1"><summary>📚 References</summary>

      - [pytest — Get started](https://docs.pytest.org/en/stable/getting-started.html)
      - [Python — `assert` statement](https://docs.python.org/3/reference/simple_stmts.html#the-assert-statement)
      </details>

      ---

      ### 📦 Commit your progress

      Before moving on, lock this step into the safety net. In the embedded terminal:

      ```bash
      git add test_scorer.py && git commit -m "RED: failing test for empty roll"
      ```

