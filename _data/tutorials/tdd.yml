      - description: "Your tests detect a wrong result for multiples of 5"
        command: |
          import pytest
          pytest._tdd_check_fizzbuzz_tests_detect('multiples of 5')
        hints:
          - title: "A multiple of 5 that isn't a multiple of 3"
