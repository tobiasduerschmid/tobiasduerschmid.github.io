    # comes after the REFACTOR step (the next-next step).


  # --------------------------------------------------------------------------
  # STEP 2 — Cycle 1 GREEN: smallest code that passes
  # Pedagogy:
  #   Worked example       — full GREEN code shown, with subgoal labels.
  #   Transformation Priority Premise — start at "constant" before "variable".
  #   Misconception fix    — GREEN means MINIMAL, not "production-ready".
  #   Cognitive load       — frozen dataclass, @property, default tuple — each
  #                          element labeled separately so they don't collide.
  # --------------------------------------------------------------------------
  - title: "Cycle 1 — GREEN: Make It Pass"
    instructions: |
      ### Why this matters

      The instinct on GREEN is to "build it right" — anticipate the next cycle, generalize early, reach for the elegant abstraction. That instinct is how TDD quietly degrades into test-after: code gets written before any test asks for it. The GREEN rule asks for the *smallest* code that satisfies *this one test*, even if it looks embarrassingly trivial — because every line you write without a test demanding it is a guess, not a discovery.

      ### 🎯 You will learn to

      - Apply the GREEN rule by writing the smallest code that satisfies the current failing test (no speculative branches, no premature abstraction)
      - Analyze a pytest test as a contract for observable attributes, then distinguish that contract from implementation choices such as dataclasses and properties
      - Evaluate a candidate GREEN against the Transformation Priority Premise — preferring lower-cost transformations (constant → variable) over higher-cost ones (loop / class)

      > **The GREEN rule:** write the **smallest** code that makes the failing test pass. Anything more is *speculative design* — code with no test demanding it.

      ## The test is your contract

      Every line of the test is an obligation your code must satisfy:

      | Line of the test | What your code must provide |
      |---|---|
      | `from scorer import score` | A `score` name in `scorer.py` |
      | `report = score([])` | `score` returns *something* |
      | `assert report.total_damage == 0` | That something exposes `total_damage`, equal to `0` |
      | `assert report.events == ()` | …and `events`, equal to `()` |

      ## Two Python tools, in this *new context*

      These tools are convenient design choices for our value objects; the test does not require their exact implementation:

      - `@dataclass` — generates `__init__`, `__eq__`, and `__repr__` by default. Its field-based equality makes cycle 2's event comparisons convenient. Adding `frozen=True` prevents ordinary field assignment; freezing is separate from equality. We choose frozen value objects throughout this exercise.
      - `@property` — exposes a computed value through attribute access. A stored `total_damage` attribute could also satisfy the test. Computing it from `events` avoids storing a second value that could become inconsistent.

      The test specifies the observable result; these tools are one way to implement it. ([dataclasses](https://docs.python.org/3/library/dataclasses.html) · [property](https://docs.python.org/3/library/functions.html#property) if you want a refresher.)

      ## The Transformation Priority Premise — why "smallest" beats "best"

      Robert Martin's TPP lists code transformations from simplest to most complex: nothing → constant → variable → conditional → loop. As a heuristic, prefer the *simpler* transformation that passes the current failing test, even when you "know" a more general one is coming.

      For cycle 1, the test only mentions the empty case, so `score` can return a constant empty report — no loop over `dice` yet. That loop arrives when a test (cycle 4) actually demands it. For `total_damage`, a constant `0` is the TPP-smallest GREEN; computing it from `events` (for example with `sum`) is the design choice described above. Either passes, and if you start with the constant, cycle 2's test will force the computation.

      ## Your task

      1. In **`scorer.py`** (left pane), replace each sub-goal comment with the matching line. Re-read the test for the contract.
      2. **Before you click ▶ Test**, identify *one* way your code could be wrong. (A misplaced default? A forgotten decorator? A method where the test reads an attribute?) Run, then check whether your prediction matched.
      3. Resist any "improvement" beyond what the test demands — the next step is REFACTOR, and it only earns work that has somewhere to go.

      <details markdown="1"><summary>🛟 Stuck? Common shapes that fail (open if pytest is red)</summary>

      - **`events: list = []`** — Python rejects mutable defaults in dataclasses with `ValueError`. What immutable alternative matches the test's `events == ()` assertion?
      - **Forgetting `@property`** — without it, `report.total_damage` is a *bound method object*, not a number; the assertion fails in a weird way.
      - **`@dataclass` without `frozen=True`** — still generates field-based equality. It permits field assignment, so add `frozen=True` to follow this exercise's immutable-value-object design.
      - **`if not dice: ...`** — speculative branching. The empty-tuple default already handles the empty case.

      </details>

      ---

      ### 📦 Commit your progress

      🔍 **Before you commit, glance at the gutter.** The `+`/`~`/`-` markers in the left margin of each editor pane show what changed *since your last commit* (the RED step). The diff should be exactly the production code you just wrote — nothing else. If you see surprises, investigate before staging.

      Then, in the embedded terminal:

      ```bash
      git add scorer.py test_scorer.py && git commit -m "GREEN: empty BattleReport with zero damage"
      ```

