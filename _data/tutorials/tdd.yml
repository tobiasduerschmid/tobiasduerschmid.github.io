  - title: "Cycle 3 — Single 5 → Lightning Spark"
    instructions: |
      ### Why this matters

      Duplication tempts you to generalize, but a generalization is only safe when your tests already pin down everything it decides. Telling a safe refactor (restating tested behavior) from a guess (deciding untested behavior) keeps a test-driven design honest.

      ### 🎯 You will learn to

      - Apply the cycle-2 test shape to a new example, deriving the expected values from the rules table yourself
      - Evaluate a proposed generalization by asking what it decides that no test pins down yet
      - Distinguish a safe refactor (a face-to-event lookup) from a guess (a loop over every die)

      > **Spec:** a single die showing **5** creates a *Lightning Spark* event worth 50 damage.

      ## Your task

      1. **🔴 RED** — add a test for the spec, shaped like your cycle-2 test. This time the TODO names only the roll: take the expected event and damage from the spec and the rules table.
      2. **🟢 GREEN** — make it pass with the smallest change. A second hardcoded branch is fine.
      3. **🔵 REFACTOR** — the two branches now share a shape. Before you change anything, **predict**: if you replaced both branches with `for die in dice:`, what would `score([1, 1])` return? Which of your tests pins that down? Then open the reveal.

      <details markdown="1"><summary>Reveal — what a loop would decide (open after predicting)</summary>

      Two Dragon Flames, 200 damage — plausible, but none of your tests says so. The same loop would turn `[1, 1, 1]` into three Flames, which the rules table says is wrong. A loop over the dice decides how *several* dice combine before any test pins that down: a guess.

      A lookup from face to event that still handles one die at a time is different. It only restates what your two tests already pin down, so it is a safe refactor if you want it. Cycle 4's `[1, 1]` test will pin down how several dice combine, and then the loop restates tested behavior too.
      </details>

      > **The rule this tutorial follows.** The number of examples isn't what makes a generalization safe; what matters is whether your tests already pin down everything it decides. Before you generalize, ask what the new code decides that no test pins down yet. If the answer is "nothing", refactor on green; if it's "something", wait for the test that pins it down. **Generalize only what your tests already pin down.**

