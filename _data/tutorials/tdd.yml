            2: "Python doesn't rewrite `if` statements; that's invented language behavior. (And version-blame is a common dodge for design questions — the language is rarely the actual culprit.) The bug is in the *algorithm*, which Python executes faithfully on every version."
            3: "Counter doesn't re-order operations. (Made-up implementation detail, again.) In this example, the extraction preserved the same one-shot algorithm, so the defect predates the abstraction. The fix has to be in the algorithm, no matter where the algorithm lives."
