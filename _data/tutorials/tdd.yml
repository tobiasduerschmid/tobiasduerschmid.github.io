            This is a behavior-changing bug fix: it preserves the previously correct four-of-a-kind result and corrects the six-of-a-kind result. Refactoring, by contrast, preserves observable behavior. The earlier extraction into ComboRule was a refactor; replacing one-shot combo scoring with repeated combo scoring changes behavior.

