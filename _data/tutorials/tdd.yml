    solution:
      files:
        - path: "scorer.py"
          content: |
            from dataclasses import dataclass


            @dataclass(frozen=True)
            class BattleReport:
                events: tuple = ()

                @property
                def total_damage(self) -> int:
                    return sum(event.damage for event in self.events)


            def score(dice: list[int]) -> BattleReport:
                return BattleReport()
          language: "python"

        - path: "test_scorer.py"
          content: |
            """Cycle 1 — first failing test."""
            from scorer import score


            def test_empty_roll_has_zero_damage_and_no_events():
                report = score([])

                assert report.total_damage == 0
                assert report.events == ()
          language: "python"
      explanation: |
        One GREEN shape: a frozen dataclass with an empty-tuple default for events
        and a property that sums damage across events. A constant `return 0` is
        even smaller under TPP; cycle 2's test would then force the sum. The score
        function ignores its argument for now — the only behavior the current test
        pins down is "an empty roll has no events and no damage."

