    quiz:
      title: "Step 3 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            What is the **correct** order of phases in a single TDD cycle?
          type: single
          options:
            - "GREEN → RED → REFACTOR — write code, then prove it works with a test, then clean up"
            - "RED → GREEN → REFACTOR — failing test, then minimum code, then clean up the design"
            - "RED → REFACTOR → GREEN — failing test, design the structure, then make it pass"
            - "REFACTOR → RED → GREEN — clean up first, then write a test, then implement the behavior"
          correct_index: 1
          option_feedback:
            0: "This is **test-after development**, not TDD. Writing code first means you've already committed to a design before the test gets a chance to challenge it — the test becomes a rubber stamp. RED-first forces the design to emerge under the pressure of \"how do I want to call this?\""
            2: "REFACTOR before GREEN means refactoring code that doesn't yet make the new test pass — there's nothing to refactor *toward* and no safety net. The rule is: only refactor when **all** tests are green, so any regression is caught immediately."
            3: "Refactoring before RED means changing structure without a failing test motivating the change. You lose the link between *why* the design changed and *what* behavior demanded it. New behavior should drive new structure, not the other way around."
          explanation: |
            RED → GREEN → REFACTOR. The order is load-bearing. RED proves the test reveals
            missing behavior. GREEN proves the code now satisfies that behavior. REFACTOR
            improves the code while the safety net (the green test) protects you.

        - question: |
            You write a new test and run pytest. The bar is **immediately green** without you having to write any production code. What is the most defensible interpretation?
          type: single
          options:
            - "Celebrate — the existing code already implements this behavior, so there is nothing to do this cycle"
            - "Be suspicious — verify by temporarily breaking the production code and checking the test fails for the right reason"
            - "Delete the test — a test that passes immediately is redundant and only adds runtime cost"
            - "Rewrite the test until it fails, since the rule is `RED → GREEN → REFACTOR` and you cannot enter GREEN without first being RED"
          correct_index: 1
          option_feedback:
            0: "Premature celebration. A test that passes immediately could be a *Liar* — vacuously true and would pass against any code. Without verifying (the mutation move), you have no evidence the test catches anything. Cycle 4's mixed-dice guardrail test is built specifically around this trap."
            2: "Deleting passing tests cuts holes in your safety net. The test documents *intended* behavior, even when current code already provides it; future refactors might break that behavior, and only the test will catch it. Runtime cost on a passing assertion is microseconds — not a real reason to remove documentation of a contract."
            3: "Forcing artificial RED breaks the test/spec relationship. The test should describe the behavior the spec demands, not the failure your sequence rule expects. If the spec is already implemented, a *deliberately* failing test would be testing the wrong thing on purpose."
          explanation: |
            Both halves matter. Sometimes a test passes immediately because a prior refactor
            generalized behavior — that is a *positive* outcome, and the test still earns its
            place by documenting that the behavior is intended. Other times the test is
            vacuously true. The way to tell is to break the production code on purpose: a
            real test will catch the break.

        - question: |
            In the GREEN phase, you have *two* implementations in mind: one ignores `dice` and returns a hardcoded empty `BattleReport()`, the other is a generic loop. The hardcoded version passes the current test. What does TDD discipline say to do?
          type: single
          options:
            - "Write the generic loop — it will be needed eventually, and writing it now saves work in the next cycle"
            - "Write the hardcoded version — GREEN asks only for what passes the *current* failing test"
            - "Skip GREEN entirely and design the loop as part of REFACTOR — the cycle is flexible about which phase contains the new logic"
            - "It does not matter — both choices satisfy the test, and the difference is purely stylistic"
          correct_index: 1
          option_feedback:
            0: "Writing the loop early assumes you already know what the next test will require. That is speculation, not design pressure from a failing test. A speculative loop is also code with no test motivating it; if it is wrong, no test will catch the mistake."
            2: "REFACTOR is for cleaning *passing* code, not introducing new logic. New logic without a failing test demanding it is the antithesis of TDD — and a refactor that adds behavior breaks the rule that REFACTOR preserves observable behavior."
            3: "Stylistic equivalence misses the **Transformation Priority Premise**. Both choices pass the *current* test, but only the simpler one keeps the code under genuine test pressure. The generic loop is a guess; the hardcoded version forces a future test to *earn* the loop."
          explanation: |
            This is the Transformation Priority Premise in action: prefer simpler
            transformations. The hardcoded version is fine as long as a future test will
            challenge it. That challenge — and the design pressure it creates — is exactly
            what cycle 4 of this tutorial will hand you.

        - question: |
            Why is REFACTOR worth entering even when there is nothing to clean up?
          type: single
          options:
            - "Because pytest requires every cycle to have all three phases or it will skip the test in the next run"
            - "The pause-to-look is the discipline — skip it and duplication accumulates silently"
            - "Because REFACTOR is the only phase where you can add new tests without breaking the cycle's contract"
            - "Because the GREEN code is always wrong on the first attempt and must be revised before moving on"
          correct_index: 1
          option_feedback:
            0: "pytest has no opinion about TDD phases — it just runs whatever tests it finds. If a tool were enforcing the cycle, the discipline wouldn't be about you. The cycle is a *practitioner* discipline, not a framework requirement."
            2: "New tests belong to the **next** cycle's RED, never to REFACTOR. Adding tests during REFACTOR mixes the two-hats Beck explicitly warns against (Canon TDD: never add behavior during refactor; never restructure during GREEN)."
            3: "Saying GREEN is \"always wrong\" misframes TPP. GREEN is *deliberately* simple — that's the point. It isn't wrong; it's *unfinished*, and it stays unfinished until a future test demands more. Refactor exists to clean accumulated structure, not to repair a defective GREEN."
          explanation: |
            Skipping REFACTOR whenever the code "looks fine" lets small duplications and
            unclear names pile up unnoticed. Every cycle is a checkpoint where you ask
            "what do I see now?" Most cycles, the answer is mostly fine. But you only know
            that because you looked.

        - question: |
            A teammate says: *"TDD is just unit testing — write your tests first instead of last."* What is the **most accurate** correction?
          type: single
          options:
            - "They are right — TDD is a workflow ordering decision; the resulting tests and code are otherwise indistinguishable from test-after"
            - "TDD is a design technique — the test forces interface decisions before implementation, and REFACTOR is where the design payoff lands"
            - "TDD is primarily a refactoring technique, and the tests exist only as a regression safety net for the refactoring"
            - "TDD requires writing all tests for a feature first, then all the code at once — which is the opposite of unit testing's incremental style"
          correct_index: 1
          option_feedback:
            0: "This misses the **threshold concept**. Test-first changes which questions you ask first (\"how should this be called?\") and what pressure shapes the design. The resulting code is often *very* different — typically more decoupled, with interfaces that didn't exist before the test demanded them."
            2: "Refactoring is *one* phase; framing TDD as primarily-refactoring inverts the order. The tests do far more than catch regressions: they specify behavior, drive interface decisions, and force you to decompose problems incrementally. Calling them just a safety net misses the design pressure they exert."
            3: "This describes **upfront test design**, which Beck's Canon TDD lists as a mistake: converting every list item into a test before any pass invites rework, plus \"depression and/or boredom.\" TDD is *one test at a time* — granular and incremental, the opposite of all-at-once."
          explanation: |
            This is the threshold concept: TDD is design first, testing second. The test
            forces you to decide the public interface (function name, parameters, return
            shape) before any logic exists. The REFACTOR phase is where the design that
            emerged under pressure gets shaped intentionally. Calling it "unit testing in
            reverse order" misses both halves.


