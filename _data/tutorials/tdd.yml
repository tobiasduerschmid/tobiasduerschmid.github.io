  - title: "Cycle 4 — Repeated Singles → First Real Refactor"
    instructions: |
      ### Why this matters

      Refactoring means changing a program's structure while every test stays green, and those passing tests are what make even a sweeping change safe. Refactoring only on green, then checking the safety net with a deliberate break, keeps design changes from turning into regressions.

      ### 🎯 You will learn to

      - Apply a real refactor on green: replace hardcoded branches with a loop while every test stays green
      - Evaluate when a generalization is safe: when your tests already pin down what it decides
      - Apply the *mutation move* (break a line, watch a test fail, revert) to check that a test guards what it claims

      > **Spec:** `score([1, 1])` returns total damage 200 with **two** Dragon Flame events.

      The first **design-breaking** test: neither `dice == [1]` nor `dice == [5]` matches `[1, 1]`.

      ## Your task

      1. **🔴 RED** — add a test for the spec. The TODO only names the roll, so name the test after the behavior. Predict the failure, then run.
      2. **🟢 GREEN** — make it pass with the smallest change. A third hardcoded branch is fine: GREEN is about passing, not about design.
      3. **🔵 REFACTOR (on green)** — your three branches now share one rule that your tests pin down: each 1 is a Dragon Flame, each 5 a Lightning Spark, and every die scores on its own. **Predict first:** without a loop, how many more branches would `[1, 5]`, `[5, 5]`, and `[1, 1, 5]` need? Then replace the branches with a loop over the dice. Re-run after each small edit: the bar stays green the whole time. That is what makes this a refactor rather than a rewrite.
      4. **🟢 Guardrail test (required)** — add a test for the mixed roll `[1, 5]` (one Flame, then one Spark). **Predict** whether `scorer.py` needs to change. It should pass for free, so prove the test isn't vacuous with the *mutation move*: temporarily break a line in `scorer.py` (e.g., `if die == 5:` → `if die == 6:`), re-run, watch the test fail, then **revert**. A test that doesn't fail when the production code breaks is a *Liar test*.

      🪞 **Pause (after the refactor):** in *one sentence*, what did the passing test results just tell you that you'd otherwise have had to verify by hand? Hold your answer; the cycle quiz returns to it.

      <details markdown="1"><summary>Reveal — why not keep adding branches? (open after predicting)</summary>

      One more branch for each: a hardcoded branch covers exactly one roll, so `[1, 5]`, `[5, 5]`, and `[1, 1, 5]` would each need their own, and so would every roll that contains a 2, 3, 4, or 6. The loop states the rule your four tests already pin down: dice score one at a time, 1s as Flames and 5s as Sparks. In cycle 3 no test said how several dice combine; now `[1, 1]` does. The mixed roll `[1, 5]` is the case the loop extends to that no test names yet, which is why the guardrail test comes next.
      </details>

      <details markdown="1"><summary>Why the mutation move matters</summary>

      A passing test means *one* of two things: (a) the code is correct, or (b) the test is vacuous and would pass against *any* code. The **Liar test** smell (from James Carr's TDD anti-pattern catalog) is silent — pytest reports green either way. The 10-second mutation move — break the production code, watch the test fail, revert — is the cheap, durable defense. Use it whenever a test passes for a reason you didn't fully expect (especially the mixed-dice guardrail, which passes "for free" thanks to the loop).
      </details>

      ---

      ### 📦 Commit your progress

      Before moving on, commit this cycle. Stage **only the files you actually changed** (scorer.py test_scorer.py) and write a short message — recommended: `Cycle 4: per-die loop + mixed-dice guardrail`.

