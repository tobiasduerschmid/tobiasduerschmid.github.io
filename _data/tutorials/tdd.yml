      questions:

        - question: |
            What does "listening to the test" mean as a refactoring heuristic?
          type: single
          options:
            - "Read every test out loud before running it, to catch typos in the test names that pytest cannot detect"
            - "Treat the pain of writing or extending a test as a signal that the production code's structure is wrong"
            - "Use only test names that the codebase's audit log specifically asks for, ignoring the developer's own intuition about what to call them"
            - "Run pytest with `--log-cli-level=DEBUG` and inspect the trace, since that output reveals the next refactor"
          correct_index: 1
          option_feedback:
            0: "This is a literal-reading of \"listen.\" The phrase is a metaphor — it means *let the felt difficulty of writing and maintaining tests be a diagnostic signal*. Reading aloud catches typos but says nothing about design pressure, which is the point."
            2: "There's no \"audit log\" of approved test names. This treats TDD like a compliance procedure rather than a design discipline. The whole skill is *your* judgment about what to test and what to call it — that's where the design happens."
            3: "DEBUG logs are runtime diagnostics, not design diagnostics. The signal you're listening for is in *your own experience* of writing the code: pain in adding a branch, awkwardness in the test setup, repetition in the assertions. Logs tell you nothing about your own friction."
          explanation: |
            "Listen to the test" is a foundational TDD heuristic: when adding a test or a
            branch hurts disproportionately, the structure is telling you something. In
            cycle 6, the pain of imagining six more `if counts[X] >= 3:` branches was the
            signal. The fix was a structural shift to data, not more code.

        - question: |
            Why is putting rules in a `COMBO_RULES` tuple of `ComboRule` instances **better** than keeping them as `if counts[X] >= 3:` branches inside `score()`?
          type: single
          options:
            - "It is not better — it is just stylistically different. The byte code emitted is identical and the runtime cost is the same"
            - "Adding a new rule is one data row, with no edit to `score()` — the Open-Closed Principle in action"
            - "Tuples are faster than lists in Python, so the rule-object form is a performance optimisation"
            - "Python's import system caches tuples but not function bodies, so subsequent test runs are quicker"
          correct_index: 1
          option_feedback:
            0: "Bytecode is irrelevant — design is about *who has to change what when*. Phase F of this cycle gave you concrete evidence: with the rule-object form, four new combos cost zero edits to `score()`. With the if-branch form, four new combos cost four edits. That's the OCP win, not a stylistic flourish."
            2: "Tuple-vs-list performance differences are nanoseconds and never the design driver. (You may be remembering that tuples are immutable; that matters for *correctness* in some contexts, not for the OCP win at issue here.)"
            3: "Python's import system has no such asymmetric caching policy. Made-up runtime mechanism. The actual win is structural: `score()` doesn't have to change when behaviors are added — and that property has nothing to do with import caching."
          explanation: |
            The Open-Closed Principle (OCP) says modules should be open for extension and
            closed for modification. The rule-object refactor is the OCP in five lines:
            `score()` no longer changes when you add a new triple combo — only the data
            does. Phase F of this cycle demonstrated the payoff by adding *four* combos at once.

        - question: |
            A teammate says: *"You should have done the rule-object refactor in cycle 5, when you first introduced combos. Why wait?"* What is the **most defensible** answer?
          type: single
          options:
            - "The rule-object shape only became visible at cycle 6 with two combos — refactoring with one is a guess"
            - "Cycle 5 was technically possible but pytest had not yet released support for dataclasses, so the refactor would have failed at import time"
            - "It is a stylistic preference — both orderings produce identical code in the end and one is not measurably better than the other"
            - "Earlier refactoring is always better; the tutorial's order is artificial and you should always do the biggest refactor as soon as you can"
          correct_index: 0
          option_feedback:
            1: "Pytest supports dataclasses (and has for years), and pytest support wouldn't dictate when to refactor anyway. This invents history to dodge the design question. The answer has to be about *information available to the designer*, not tooling availability."
            2: "Order matters because *what you knew when* matters. With one combo (cycle 5), the abstraction is a guess; with two (cycle 6), the common shape is *visible*. Refactoring at cycle 5 picks the shape based on speculation; refactoring at cycle 6 picks it based on evidence. Same final code, very different epistemic standing."
            3: "\"Earlier is always better\" is the universal-rule trap. With one combo you can't tell which parts of the block are rule data, so refactoring then commits you to a guess the next cycle may invalidate. Generalize when your tests show what varies, not \"as soon as possible.\""
          explanation: |
            With only `Dragon Blast` (cycle 5), you'd be guessing which parts of the block
            are rule data and which are fixed structure. Cycle 6's `Goblin Swarm` shows
            that the die, the name, and the damage vary while the threshold stays 3, and
            only then is the rule object's shape a *discovery* rather than a *guess*.
            Generalize only what your tests already pin down.

        - question: |
            After the rule-object refactor, all eight previous tests still pass. Why is this expected, and what does it confirm about the previous tests?
          type: single
          options:
            - "It is unexpected — refactoring should always break something. If nothing broke, the previous tests must have been weak"
            - "Expected — the previous tests assert on return values, not internals, so they survive structural rewrites"
            - "It is expected because pytest skips tests whose names contain numbers — and several of the previous tests do"
            - "It is unexpected because Python's import order changed, so most tests should have failed to import"
          correct_index: 1
          option_feedback:
            0: "Inverted heuristic. Tests *staying green* during a refactor is the *good* outcome: it proves observable behavior was preserved. If tests broke, you'd suspect either a real regression OR brittle (implementation-coupled) tests. Survival is evidence of robustness, not weakness."
            2: "Pytest doesn't skip tests by name pattern (the only name-based discovery rule is the `test_` prefix). This invents framework behavior to explain a green bar — but the green bar means what it says: every test ran and passed."
            3: "Python's import order didn't change in any way that would affect imports. The refactor added new classes but didn't move anything that breaks `from scorer import score`. (And if imports *had* broken, you'd see ImportError, not a green bar.)"
          explanation: |
            The eight previous tests asserted on `report.total_damage`, `report.events`,
            and `ScoringEvent` instances. None of them asserted on internal structure.
            That is precisely why they survived a refactor that *replaced the entire
            implementation strategy*. The Refactoring Litmus Test: behavior tests survive
            structural change; implementation tests don't.

        - question: |
            Phase F adds the row `[5, 5, 5]` → one *Lightning Storm* to the parametrized test, yet a single 5 is also a *Lightning Spark*. Why does the refactored `score()` emit one Lightning Storm and no Lightning Sparks for this roll?
          type: single
          options:
            - "`COMBO_RULES` run first, and the Lightning Storm rule's `apply` removes the three 5s from the counts"
            - "`SingleRule` skips every face that also appears in `COMBO_RULES`, so 5s never score as singles"
            - "`score()` returns as soon as any combo rule emits an event, so the single rules never run"
            - "The parametrized test checks only `total_damage`, so extra Sparks would go unnoticed anyway"
          correct_index: 0
          option_feedback:
            1: "If singles skipped every combo face, a lone 5 would never score, yet `score([5])` still yields a Lightning Spark. Singles see only the dice the combos left in the counts."
            2: "`score()` runs every rule, combos and then singles, before returning. `[1, 1, 1, 1, 5]` produces both kinds of event in one report."
            3: "The parametrized test also asserts `report.events == (expected_event,)`, so an extra Spark would fail it. No Spark appears because the combo consumed the 5s."
          explanation: |
            Order plus consumption: every combo rule runs before any single rule, and
            `ComboRule.apply` subtracts the dice it uses from the shared `Counter`. By the time
            the Lightning Spark rule looks, `counts[5]` is 0. This is the cycle-5 rule — combos
            consume their dice; leftovers score as singles — now carried by data instead of
            branches.


  # --------------------------------------------------------------------------
  # STEP 9 — Cycle 7: Six 1s = TWO Dragon Blasts (HIDDEN EDGE CASE) + QUIZ
  # Pedagogy:
  #   Productive failure   — the "obvious" code has a bug; the test reveals it.
  #   Boundary thinking    — three is enough; six is two combos worth.
  #   Test selection       — learners choose the next test before seeing the spec
  #                          (Canon TDD step 2), the first time they pick one.
  #   Quiz                 — checks "TDD finds bugs you didn't know you had."
  # --------------------------------------------------------------------------
  - title: "Cycle 7 — The Next Test → A Hidden Bug"
    instructions: |
      ### Why this matters

      Choosing which test to write next decides what your suite can catch. Aiming the next test at a boundary no earlier test reached is how you find the bugs a green bar hides.

      ### 🎯 You will learn to

      - Analyze your test list to choose the next test, aiming at a boundary no earlier test reached
      - Analyze the gap between line coverage and behavioral correctness — coverage locates under-tested code; it does not measure correctness
      - Create a fix to `ComboRule.apply` so it emits zero-or-more combos per call with correct leftover bookkeeping

      ## Choose the next test

      Your tests pin down the empty roll, single and repeated singles, a mixed roll, one triple of every face, leftover 1s after a triple, and event order. The rules table says every three matching dice form a combo. **Which roll would you test next to find out whether the design is really finished?**

      - (a) `[2, 2, 2, 2]` — a triple with one leftover 2
      - (b) `[1, 1, 1, 1, 1, 1]` — six of one face
      - (c) `[3, 3, 3, 5]` — a triple plus a scoring single
      - (d) `[6, 6, 6]` — the highest-damage triple

      Commit to a letter and a one-sentence reason, *then* open the reveal.

      <details markdown="1"><summary>Reveal — the next test (open after choosing)</summary>

      **(b) Six of one face.** Every combo test so far had exactly three of a face, or four in the leftover guardrail; none had enough dice for a *second* triple. That is the boundary no test has reached yet. Rolls (a) and (c) repeat the triple-plus-leftover shape the cycle-5 guardrail already pins down, and (d) is already one of your Phase F rows.
      </details>

      > **Spec:** `score([1, 1, 1, 1, 1, 1])` produces **two** Dragon Blasts (2000 damage).

      🪞 **Predict first (don't open the reveal yet).** Look at your `ComboRule.apply` and trace through six 1s by hand. *Write down the damage your current code produces.* The whole pedagogical value of this step depends on the order: predict before peeking.

      <details markdown="1"><summary>Reveal — what the current code actually does (open AFTER tracing)</summary>

      The `if counts[1] >= 3:` runs once. It emits one Blast and `counts[1] -= 3` leaves `counts[1] == 3`. Those three 1s fall through to `SingleRule`, emitting three Flames. Total: 1000 + 300 = **1300 damage**.

      But six 1s should be *two* Blasts → 2000 damage. **The code is wrong** — and no previous test caught it, because every prior combo test used exactly three of a face.

      This is the kind of bug TDD literature reports: a defect the developer doesn't know exists in code they wrote themselves. The test surfaces it.
      </details>

      ## Your task

      1. **🔴 RED** — add a test for the spec, named after the behavior. Run; see the wrong events tuple.
      2. **🟢 GREEN** — fix `ComboRule.apply` so it can emit *zero or more* combos per call, with the correct leftover bookkeeping. *Before you code*, write the formula on paper for: how many full combos do `n` dice of one face produce? How many leftover dice?
      3. **🔵 REFACTOR (on green)** — walk the checklist. One candidate: if your `apply` builds `dice_used` with `tuple([self.die] * self.count)`, it creates a list only to turn it into a tuple; `(self.die,) * self.count` says the same thing directly. Make the change, re-run, and stay green. (Cycle 5's leftover guardrail still passes too: the fix changed behavior only on rolls no earlier test pinned down.)

      <details markdown="1"><summary>Why this matters: coverage vs. boundary thinking</summary>

      Every previous combo test used *exactly* `count` dice (three 1s, three 2s, etc.). The bug only manifests at `2 × count` and beyond. *Line coverage* told you the `if` ran. It didn't tell you the line was right *for all relevant inputs*.

      That's the gap between coverage and **boundary-value analysis**: every behavior has boundaries (`0`, `exactly N`, `2N`, `between N and 2N`) and a healthy suite probes each. Coverage is a *locator of under-tested code*; it isn't a measure of correctness. **The rule that travels:** if a behavior isn't on the test list, code for it isn't earned.
      </details>

      ---

      ### 📦 Commit your progress

      Before moving on, commit this cycle. Stage **only the files you actually changed** (scorer.py test_scorer.py) and write a short message — recommended: `Cycle 7: fix multi-combo bug (six 1s = two Blasts)`.

    files:
      - path: "scorer.py"
        content: |
          from collections import Counter
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class ScoringEvent:
              name: str
              dice_used: tuple
              damage: int


          @dataclass(frozen=True)
          class BattleReport:
              events: tuple = ()

              @property
              def total_damage(self) -> int:
                  return sum(event.damage for event in self.events)


          @dataclass(frozen=True)
          class ComboRule:
              die: int
              count: int
              name: str
              damage: int

              def apply(self, counts: Counter) -> list[ScoringEvent]:
                  events = []

                  if counts[self.die] >= self.count:
                      dice_used = tuple([self.die] * self.count)
                      events.append(ScoringEvent(self.name, dice_used, self.damage))
                      counts[self.die] -= self.count

                  return events


          @dataclass(frozen=True)
          class SingleRule:
              die: int
              name: str
              damage: int

              def apply(self, counts: Counter) -> list[ScoringEvent]:
                  events = []

                  for _ in range(counts[self.die]):
                      events.append(ScoringEvent(self.name, (self.die,), self.damage))

                  return events


          COMBO_RULES = (
              ComboRule(1, 3, "Dragon Blast", 1000),
              ComboRule(2, 3, "Goblin Swarm", 200),
              ComboRule(3, 3, "Orc Charge", 300),
              ComboRule(4, 3, "Troll Smash", 400),
              ComboRule(5, 3, "Lightning Storm", 500),
              ComboRule(6, 3, "Demon Strike", 600),
          )

          SINGLE_RULES = (
              SingleRule(1, "Dragon Flame", 100),
              SingleRule(5, "Lightning Spark", 50),
          )


          def score(dice: list[int]) -> BattleReport:
              counts = Counter(dice)
              events = []

              for rule in COMBO_RULES:
                  events.extend(rule.apply(counts))

              for rule in SINGLE_RULES:
                  events.extend(rule.apply(counts))

              return BattleReport(tuple(events))
        language: "python"

