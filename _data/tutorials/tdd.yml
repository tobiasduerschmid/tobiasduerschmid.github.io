  # --------------------------------------------------------------------------
  # STEP 7 — Cycle 5: Three 1s = Dragon Blast + DESIGN-MOMENT QUIZ
  # Pedagogy:
  #   Design pressure       — combos require grouping and consumption bookkeeping.
  #   Counter -> structure  — counting + leftover bookkeeping replaces iteration.
  #   Threshold concept     — "tests force structural change, not just lines."
  #   Rewrite vs. refactor  — GREEN rewrites on purpose; guardrail tests pin
  #                           down what the rewrite changed (leftovers, order).
  #   Quiz                  — checks the design-pressure interpretation.
  # --------------------------------------------------------------------------
  - title: "Cycle 5 — Triple 1s → Dragon Blast (Design Moment)"
    instructions: |
      ### Why this matters

      The cycle-4 loop scores each die independently. A triple overlaps those single-die rules, so scoring now needs information about a group. A special-case branch or a loop with additional state could handle it; neither is impossible. In this exercise we choose a `Counter`-based count-then-emit design because it makes consumed dice and leftovers explicit. The previous five tests should survive this rewrite because they assert on observable behavior, not on internals.

      ### 🎯 You will learn to

      - Analyze the extra group information a combo requires, and explain why a `Counter` is a useful design choice
      - Evaluate the *Refactoring Litmus Test*: which property of the previous tests allowed them to survive a full rewrite of `score`?
      - Apply guardrail tests to pin down behavior a rewrite changed (leftover dice, event order), checking each with the mutation move

      > **Spec:** three 1s in a roll combine into one *Dragon Blast* (1000 damage) instead of three Dragon Flames. In the count-then-emit design, emit combos in rule-table order, then leftover Dragon Flames, then Lightning Sparks; the input order does not affect that event order.

      The new test exposes a limitation of scoring dice independently: some dice must be grouped before the remaining singles score. It creates **design pressure**, without dictating one uniquely correct algorithm.

      ## Your task

      1. **🔴 RED** — add a test for the spec (the TODO names only the roll). **Predict** what kind of failure pytest will show (`ImportError`, `AttributeError`, `AssertionError` — and what the message will likely contain). Run.
      2. **🟢 GREEN** — *before reaching for code*: open the per-die loop in `score()`. **Spend 90 seconds writing a one-sentence answer to:** *what information must scoring retain to recognize a triple and avoid counting its dice again as singles?* Then implement the count-then-emit design using `collections.Counter`. This GREEN is a **rewrite**, not a refactor: it changes behavior on purpose, and your five earlier tests check that nothing you meant to keep broke.
      3. **🟢 Guardrail tests (required)** — a rewrite can also change behavior that no test checks. Pin down two such behaviors, and prove each new test can fail with the mutation move:
         - **Leftovers:** your code subtracts the consumed dice (`counts[1] -= 3`) so leftover 1s still score. Test `[1, 1, 1, 1, 5]` (one Blast, one leftover Flame, one Spark: 1150), then mutate `counts[1] -= 3` to `counts[1] -= 4`, watch the test fail, and revert.
         - **Event order:** **predict** what `score([5, 1])` returned with the cycle-4 loop and what it returns now. The spec fixes the order, so test it, then temporarily emit Sparks before Flames, watch the test fail, and revert.
      4. **🔵 REFACTOR (on green)** — walk the cycle-1 checklist. The two singles loops repeat one shape. Extracting them now would be a safe refactor, but cycle 6 extracts singles and combos together once a second combo shows what a rule needs, so noting it is enough. Check names and magic numbers too.

      <details markdown="1"><summary>Reveal — one shape that handles per-face-count thinking (open after you've tried)</summary>

      Stop iterating dice in order. **Count** how many of each face appeared (`collections.Counter`), then decide what to emit. Combos consume dice; leftovers still score as singles.
      </details>

      <details markdown="1"><summary>Reveal — <code>score([5, 1])</code> before and after the rewrite (open after predicting)</summary>

      The cycle-4 loop scored dice in roll order: Lightning Spark, then Dragon Flame. Count-then-emit scores by face, so it now returns Dragon Flame, then Lightning Spark, the order the spec asks for. None of your earlier tests rolled a 5 before a 1, so the rewrite changed this behavior silently. Tests protect only what they check.
      </details>

      🪞 **Pause (after green):** all five previous tests still pass after the rewrite. **Spend 30 seconds writing down: why?** What property of *the previous tests* allowed them to survive a full body rewrite of `score`?

      <details markdown="1"><summary>Compare your answer — the property that survived</summary>

      They assert on **observable behavior** (`total_damage == 100`, `events == (event,)`), not on internals (which loop, which variable name). Behavior tests survive structural rewrites; implementation-tests don't. This is the *Refactoring Litmus Test* — and it's the rule that travels: write tests against contracts, not against shapes.
      </details>

      ---

      ### 📦 Commit your progress

      Before moving on, commit this cycle. Stage **only the files you actually changed** (scorer.py test_scorer.py) and write a short message — recommended: `Cycle 5: triple 1s = Dragon Blast (Counter)`.

