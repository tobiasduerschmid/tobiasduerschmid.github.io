              Picture each break: which of your assertions would catch it?
          - title: "Pin both promised values"
            text: |
              The spec promises two things about the roll: its `total_damage`
              and its exact `events`. A test that checks only one of them, or
              only a type, a length, or `>= 0`, still passes when the other is wrong.
          - title: "Compare with exact expected values"
            text: |
              Compare `report.total_damage` with an exact number and
              `report.events` with the exact tuple the rules table implies
              (whole `ScoringEvent(...)` values, or `()` when nothing scores).
              The check also runs your tests against a correct `score`, so
              they must expect exactly what the rules say.

