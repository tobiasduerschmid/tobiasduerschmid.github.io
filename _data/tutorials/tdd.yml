    instructions: |
      ### Why this matters

      Writing the smallest code that passes, even a hard-coded special case, keeps every line answerable to a test: a general rule written now would decide how other faces and several dice score before any test says. Tolerating that ugliness for a while is what keeps test-driven designs from filling up with guesses.

      ### 🎯 You will learn to

      - Apply the full RED-GREEN-REFACTOR rhythm as a single packaged cycle, translating a one-sentence spec into a test, the smallest passing code, and a deliberate REFACTOR pause
      - Analyze why the first GREEN may look ugly: one example pins down almost nothing about the general rule
      - Evaluate a tempting generalization by asking what it would decide that no test pins down yet

      > **Spec:** a single die showing **1** creates a *Dragon Flame* event worth 100 damage.

      From now on, each cycle is **one step with three tasks** (RED → GREEN → REFACTOR). Same discipline as cycle 1 — tighter packaging.

      ## Your task

      1. **🔴 RED** — add `test_single_one_creates_dragon_flame_event` in `test_scorer.py`. The TODO spells out this first event test in full, because `ScoringEvent(name, dice_used, damage)` is the event shape the rest of the tutorial relies on; later cycles give you less. Read each part against the spec before you type it. **Predict** the failure category (`ImportError`? `AttributeError`? `AssertionError`?) before running.
      2. **🟢 GREEN** — pick the smallest code that turns the test green. Resist any abstraction beyond what cycle 2's single test demands. After you've made your choice, open the reveal below to compare.
      3. **🔵 REFACTOR** — walk the cycle-1 checklist. Resist generalizing: no test says yet how other faces or several dice score.

      Name each new test after the behavior it pins down. The checks look at what your tests *detect*, not at their names.

