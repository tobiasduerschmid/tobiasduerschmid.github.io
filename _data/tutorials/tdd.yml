    quiz:
      title: "Step 10 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            FizzBuzz's `multiple of 15` test most directly parallels which Dragon-Dice cycle — and why?
          type: single
          options:
          - Cycle 5 (Triple 1s) — both introduce an overlapping rule that must take precedence over simpler cases.
          - Cycle 1 (Empty roll). Both are the simplest case anyone could write.
          - Cycle 4 (Repeated singles). Both are about handling duplicates of the same input.
          - Cycle 6 (Goblin Swarm). Both are about adding a second example that reveals an abstraction.
          correct_index: 0
          option_feedback:
            1: The empty-roll case has no overlapping rules. Multiples of 15 satisfy both the multiple-of-3 and multiple-of-5 rules, so the combined case needs explicit handling.
            2: Repeated singles extend the number of scored items. Multiples of 15 instead require combining or prioritizing rules that overlap on the same input.
            3: The common feature here is overlapping rules, not necessarily extracting an abstraction. A leading `% 15 == 0` branch is a valid local fix.
          explanation: |
            The parallel is rule precedence: a triple must score before its dice are consumed as singles, and a multiple of 15 must produce FizzBuzz rather than just Fizz or Buzz. A leading combined-case branch or a compositional string builder can both work. This example does not prove that a structural redesign is necessary.

        - question: |
            A teammate, who has never done TDD, pushes back: *"FizzBuzz is just trivia — the real work is the algorithm. Why did you spend 12 minutes on the cycles instead of 30 seconds typing the obvious solution?"* Pick the strongest reply.
          type: single
          options:
            - "The small problem lets us practice the cycle cheaply and retain tests that can catch later regressions"
            - "TDD is faster than typing the obvious solution because pytest's parallelism speeds up small test runs."
            - "The 'obvious' solution might be wrong; TDD is more correct because tests catch all bugs."
            - "TDD is a religious commitment — the question isn't worth answering."
          correct_index: 0
          option_feedback:
            1: "Speed-by-parallelism is a fabricated technical justification. Pytest parallelism (with `pytest-xdist`) saves seconds on large suites — nowhere near the order of magnitude that would make TDD net-faster than typing. The argument has to stand on *durable design value*, not on runtime tricks."
            2: "Tests don't catch all bugs. Cycle 7 of this tutorial (the hidden six-1s bug) showed a defect surviving two cycles of green tests. The honest claim is that tests catch the behaviors they actually check, which is narrower than \"all bugs\" and still enormously valuable for regression."
            3: "Dismissing the question avoids the engineering tradeoff. TDD's case is empirical (Microsoft/IBM, Erdogmus, Janzen & Saiedian — all measured studies), not faith-based. A teammate who hears \"it's a religion\" walks away thinking the practice has no defense; that's the opposite of what the evidence supports."
          explanation: |
            FizzBuzz is a low-cost practice task: the point is to rehearse writing a
            behavioral test, observe its failure, make it pass, and review the design.
            A retained suite can catch later regressions, but it does not guarantee
            fewer defects or equal development time. Nagappan et al.'s four industrial
            case studies reported lower defect density than comparison projects;
            those results are context-specific associations, not a promised payoff.

        - question: |
            Which observation would provide the strongest evidence that you can transfer the TDD process to FizzBuzz?
          type: single
          options:
            - "Unaided, you choose a behavior, write its test, diagnose the failure, and make a focused fix"
            - "FizzBuzz felt easier than Dragon Dice, so the rhythm must already be automatic for you"
            - "Your finished `fizzbuzz.py` matches the model solution in the reveal line for line"
            - "All of your FizzBuzz tests pass against your own implementation at the end of the step"
          correct_index: 0
          option_feedback:
            1: "A feeling of ease is weak evidence: it can come from familiarity with FizzBuzz itself rather than with the process. What you did on the task says more than how it felt."
            2: "Matching a known solution shows the end product, not how it was reached — it could have been recalled or copied. Transfer is about the process: choosing tests, reading failures, and making focused changes."
            3: "A green suite at the end is equally consistent with writing all the code first and the tests afterward. It shows the code and tests agree, not that the tests drove the design."
          explanation: |
            Transfer is demonstrated by what you do on the new task: choosing test
            cases, diagnosing failures, and making focused changes. Feeling comfortable
            can be useful self-feedback, but is not proof of mastery. If the rhythm still
            feels effortful, compare your process with those concrete actions and practice
            the part that needs support.

        - question: |
            Your first FizzBuzz test asserts `fizzbuzz(0) == []`, and `fizzbuzz.py` is still empty. Under the Transformation Priority Premise, what is the smallest GREEN?
          type: single
          options:
            - "`def fizzbuzz(n): return []` — a constant; a loop waits until a test needs n > 0"
            - "A loop over `range(1, n + 1)` that appends nothing yet, ready for the next rules"
            - "`if n == 0: return []`, then raise `NotImplementedError` for every other n"
            - "The full `% 15`, `% 3`, `% 5` chain, since the spec already lists every rule"
          correct_index: 0
          option_feedback:
            1: "No test has asked for any element yet, so the loop guesses at a shape the next test may not need. A constant passes and leaves that decision to the test that demands it."
            2: "The branch adds a conditional, a costlier transformation than a constant, and the error path is code no test asked for. A plain `return []` passes with less."
            3: "Knowing the whole spec differs from having tests for it. Writing every rule now skips the one-test-at-a-time rhythm, and none of the new branches has a failing test behind it."
          explanation: |
            Prefer the simplest transformation that passes the current failing test: here, a
            constant. The next test (`fizzbuzz(1) == ["1"]`) forces a change, and a later one
            forces the loop — the same progression as Dragon Dice's cycles 1 through 4.

        - question: |
            A FizzBuzz suite has exactly three tests: `fizzbuzz(3)[-1] == "Fizz"`, `fizzbuzz(5)[-1] == "Buzz"`, and `fizzbuzz(15)[-1] == "FizzBuzz"`. Which broken implementation would this suite fail to catch?
          type: single
          options:
            - 'One that returns ordinary numbers as integers, so `fizzbuzz(3)` is `[1, 2, "Fizz"]`'
            - 'One that labels multiples of 15 as `"Fizz"` because the `% 3` check comes first'
            - 'One that swaps the labels, returning `"Buzz"` for multiples of 3 and `"Fizz"` for 5'
            - 'One that ignores `n` and always returns the 15-element list for `fizzbuzz(15)`'
          correct_index: 0
          option_feedback:
            1: "`fizzbuzz(15)[-1] == \"FizzBuzz\"` fails for that implementation, so the suite catches it."
            2: "`fizzbuzz(3)[-1]` would be `\"Buzz\"` instead of `\"Fizz\"`, so the first test catches the swap."
            3: "`fizzbuzz(3)[-1]` would be `\"FizzBuzz\"`, the last element of the 15-element list, so the suite catches it."
          explanation: |
            Every test checks only a last element, and each of those is a Fizz, Buzz, or
            FizzBuzz label. No test ever looks at an ordinary number, so a bug in that
            partition survives — the same lesson as cycle 7, where no test reached six of a
            kind. A test such as `fizzbuzz(2) == ["1", "2"]` closes the gap; a quick mutation
            confirms it.


  # ==========================================================================
  # STEP 11 — THE BIG PICTURE
  #
  # Synthesizes the journey: seven Dragon-Dice cycles plus the FizzBuzz
  # transfer. When TDD shines vs. when it doesn't, the anti-pattern taxonomy,
  # the empirical case, and a final quiz that mixes spaced retrieval across
  # earlier cycles with new application questions requiring analysis and evaluation.
  # Pedagogy:
  #   Synthesis              — "synthesise yourself" prompt before any reveals.
  #   Spaced retrieval       — final quiz mixes recall across earlier cycles.
  #   Bjork's desirable difficulty — confidence recalibration before answers.
  #   Transfer probe         — name a real piece of student code where TDD helps.
  # ==========================================================================
  - title: "The Big Picture — Seven Cycles and a Transfer"
    instructions: |
      ### Why this matters

      The cycles taught the rhythm one beat at a time; this step asks whether you can hear the *whole song*. You'll synthesize the journey from memory before any reveals, recalibrate your own confidence in writing, and probe whether the discipline transfers to a real piece of code from your own work — not "I'd write more tests" but a specific bug it would have caught. The final quiz is mixed retrieval across all seven cycles, the way Bjork's spacing principle predicts will make the rhythm last.

      ### 🎯 You will learn to

      - Analyze the seven-cycle journey by recalling, from memory, three design moves and the test that forced each one
      - Evaluate your own confidence to apply Red-Green-Refactor *unaided* on a problem you haven't seen before
      - Apply the rhythm to one specific piece of your own code — naming what TDD would have prevented in concrete terms

      Seven Dragon-Dice cycles. Then an eighth on a totally different problem — FizzBuzz — driven by you with no scaffolding. Every line in your final `scorer.py` is justified by a test; every line in your `fizzbuzz.py` is too; and the rhythm that produced both is the *same rhythm*.

      ---

      ### 🪞 Synthesise yourself (≈5 min, before opening any reveals or taking the quiz)

      The recap material — takeaways, journey table, anti-patterns, empirical case — is collapsed below. **You only get one shot at synthesising while it's still fresh.** Do this part with your editor scrolled away from `scorer.py`.

      **(1) Recall three design moves, from memory.** Name three cycles and, for each, the design move the test forced. Don't say "the loop refactor" — say *which test broke the previous structure and why*.

      **(2) Pick the cycle that surprised you.** Which cycle's RED moment changed how you thought about a structural choice? *Why?* (One sentence.)

      **(3) Confidence recalibration — write a number on a sticky note (or in chat).** On a 1–5 scale: *"I could apply Red-Green-Refactor to a problem I haven't seen before, this week, without this tutorial open."* Pick a number; **anchor it in writing**. Re-firing on a remembered number isn't recalibration. We'll re-check after the quiz.

      **(4) Transfer probe.** Name **one specific piece of code or project of yours** — a class assignment, a side project, a past bug — where the rhythm you just learned would have helped, and *what specifically* it would have prevented. ("It would have caught X" is concrete; "I'd write more tests" is not.)

      ---

      ### Then take the quiz below — *before* opening any of the reveals.

      The reveals after the quiz are for *comparison*, not for study. Treat them like an answer key: open them after committing to your own answers.

      ---

      <details markdown="1"><summary>Reveal — fill-in-the-blank journey table (open after recall #1)</summary>

      *Cover the right column and predict the lesson for each cycle from memory. Then read across.*

      | Cycle | Behavior | Design move | Lesson |
      |---|---|---|---|
      | 1 | Empty roll | First class + function | RED for the right reason |
      | 2 | Single 1 | `ScoringEvent` introduced | Allow the ugly first GREEN |
      | 3 | Single 5 | Second hardcoded branch (a lookup is fine; a loop is a guess) | Generalize only what tests pin down |
      | 4 | Repeated and mixed singles | Third branch, then a per-die loop on green | First real refactor; mutation-check the safety net |
      | 5 | Triple 1s + leftover and order guardrails | `Counter` rewrite (count-then-emit) | A rewrite changes behavior; pin down what it changed |
      | 6 | Triple 2s, then other triples | Extract rule objects on green; add rules through new RED–GREEN cycles | Extension as data; parametrized cases |
      | 7 | Six 1s (your choice of next test) | Repeat combos per call (e.g. `//` and `%=`) | Aim the next test at an unreached boundary; coverage is not correctness |
      | Transfer | **FizzBuzz** | (different domain) | The rhythm transfers — TDD isn't problem-specific |
      </details>

      <details markdown="1"><summary>Reveal — six takeaways that travel</summary>

      1. **TDD is design, not testing.** The test is the contract; the implementation emerges under its pressure.
      2. **Generalize only what your tests already pin down.** A refactor on green restates tested behavior, like cycle 6's rule objects after two combos; a generalization that decides untested behavior is a guess, like a cycle-3 loop over every die. The Rule of Three is a cautious default when you can't tell which is which.
      3. **Tests enable change.** Behavior-level assertions survive structural rewrites; implementation-coupled tests don't.
      4. **Coverage ≠ correctness; complement with boundary-value analysis** (zero, exactly N, 2N, between).
      5. **Listen to the test.** Pain in writing a test usually points at the production code.
      6. **If a behavior isn't on the test list, code for it isn't earned.** Speculative scaffolding (validation, error handling, hypothetical inputs) waits until a test demands it.
      </details>

      <details markdown="1"><summary>Reveal — when TDD shines, when it's overkill</summary>

      **Pick one. One minute each.** Which would TDD have helped *less*?

      *(a)* You're writing a function that classifies an image as cat-or-dog by calling a pretrained model. The output is a probability, judged by humans on edge cases.

      *(b)* You're writing a function that adds a new currency to a payment processor. The behavior is precisely specified.

      <details markdown="1"><summary>Compare your answer</summary>

      **TDD shines on (b)**: new features with clear behavioral requirements; complex logic with branching cases; long-lived code modified by multiple people; API design; domains where regressions hurt (payments, scoring, calculations).

      **TDD is overkill on (a)**: one-off throwaway scripts; exploratory prototyping; UI layout; non-binary outcomes (ML accuracy, image recognition); Jupyter research.

      Even on (a), *some* tests pay off — the question is whether to write them *first*. Kent Beck has described skipping tests on an early product when they didn't help him validate experiments faster ([InfoQ coverage of his 2009 remarks](https://www.infoq.com/news/2009/06/test-or-not)).
      </details>
      </details>

      <details markdown="1"><summary>Reveal — TDD anti-pattern taxonomy (cover the right column; predict the antidote)</summary>

      | Level | Anti-pattern | What it looks like | Antidote (predict before reading) |
      |---|---|---|---|
      | I | *The Liar* | Test passes but asserts vacuously (`isinstance(x, int)` only) | Cycle 4's mutation move |
      | I | *The Nitpicker* | Asserts on private attributes / implementation details | Assert on observable behavior |
      | II | *Success Against All Odds* | New test passes immediately, with no investigation | Verify with mutation |
      | II | *Skip-the-Refactor* | Stop at green; never enter REFACTOR | Make the look mandatory |
      | III | *The Giant* | One test asserts dozens of behaviors | One behavior per test |
      | III | *Excessive Setup* | 30+ lines of fixture before one assertion | Decouple production code |
      | IV | *The Mockery* | More mock setup than test logic | Listen — the design is wrong |
      | IV | *Modify-the-Test* | AI rewrites the test to match buggy code | Own the spec yourself |

      Higher level = more architectural smell. Listen to the test.
      </details>

      <details markdown="1"><summary>Reveal — the empirical case for TDD</summary>

      | Study | Finding |
      |---|---|
      | Microsoft & IBM (Nagappan et al., 2008) | Four TDD projects had **39–91% lower pre-release defect density** than selected comparison projects; nonrandomized case studies |
      | Same studies | Management estimated **15–35% longer** initial development; the study did not measure a universal net time saving |
      | Erdogmus et al. (2005) | Test-first students wrote **more tests**, and students who wrote more tests tended to be **more productive** |
      | Your transfer exercise | Independent performance on a second problem is evidence to reflect on, not a measurement of long-term mastery |
      | Fucci et al. (2017) | Better outcomes were associated with **granularity + uniformity** in an observational study; sequencing showed no important influence |

      These studies differ in participants, tasks, and methods. Associations and case-study comparisons do not guarantee the same effect in another project. In particular, the [Microsoft/IBM case-study paper](https://www.microsoft.com/en-us/research/wp-content/uploads/2009/10/Realizing-Quality-Improvement-Through-Test-Driven-Development-Results-and-Experiences-of-Four-Industrial-Teams-nagappan_tdd.pdf) did not randomly assign teams or study payment processing.
      </details>

      <details markdown="1"><summary>Reveal — what to learn next (the same rhythm, scaled up)</summary>

      - **Fixtures** (`@pytest.fixture`) for reusable setup of objects, DBs, mock APIs
      - **Mocks, fakes, stubs** — with a strong default toward *fakes* over mocks
      - **Property-based testing** with Hypothesis — `score(any list of 1–6)` should always satisfy invariants
      - **Mutation testing** with `mutmut` or `cosmic-ray` — automate the cycle-4 mutation move across the whole suite
      - **The Outside-In / Double-Loop pattern** (Percival, *Obey the Testing Goat*) — high-level acceptance tests drive unit tests

      Each lives inside the same Red-Green-Refactor rhythm you just internalised.
      </details>

      ---

      ### 🪞 Recalibrate (after the quiz)

      Re-rate confidence on the same 1–5 prompt. **Look at your sticky.** The *gap* is the data — feelings of progress are unreliable; the gap is signal.

      And revisit your transfer probe answer: is the code you named *still* the right next place to apply this, or did the quiz/recap shift it? Whichever piece of code you end up picking — start it RED.

