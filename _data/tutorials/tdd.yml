              The test compares `events` with `()`: which immutable default
              would match it?
            condition: "output_contains: mutable default"

      - description: "Implementation is minimal — no speculative dice handling yet"
        command: |
          import pytest
          source = open('/tutorial/scorer.py').read()
          # The current test does not need any of these. Adding them would be
          # speculative design — code with no test demanding it.
          for forbidden in ['ScoringEvent', 'Counter(', 'COMBO_RULES', 'SINGLE_RULES']:
              assert forbidden not in source, \
                  f"`{forbidden}` is not yet demanded by any test — remove it. The GREEN rule is *smallest* code that passes. Future cycles will add what they need."
          if 'def score' in source:
              assert not pytest._tdd_score_loops_over_roll(), \
                  "No test says how a non-empty roll scores yet, so `score` should not loop over the dice."
        hints:
          - title: "Only build what a test asks for"
            text: |
              The one test so far is about the empty roll. Events, counters,
              rule tables, and loops over the dice all decide things no test
              asks about yet; remove them, and later cycles will add each one
              when a test demands it.

    # NO QUIZ — the first quiz follows the REFACTOR step.


  # --------------------------------------------------------------------------
  # STEP 3 — Cycle 1 REFACTOR + FIRST QUIZ
  # Pedagogy:
  #   Misconception fix     — "REFACTOR is optional" / "REFACTOR is for later".
  #   Threshold concept     — REFACTOR is a *phase you must enter*, even when
  #                           there is nothing to clean up.
  #   Cognitive apprentice. — instructor models what they look at on REFACTOR.
  #   First quiz            — checks the rhythm before the rhythm scales up.
  # --------------------------------------------------------------------------
  - title: "Cycle 1 — REFACTOR: The Pause That Counts"
    instructions: |
      ### Why this matters

      Beginners skip REFACTOR when they "don't see anything to clean up" — and that habit is exactly how TDD silently decays into write-test-then-write-code. REFACTOR is a *phase you enter every cycle*, with a deliberate look-around through a checklist; the answer "nothing this time" is a fine outcome, but skipping the look is not. Today's cycle 1 has almost nothing to clean — that's why it's the right moment to install the discipline of *looking anyway*.

      ### 🎯 You will learn to

      - Apply the five-line REFACTOR checklist (duplication, names, test names, magic constants, imports) as a deliberate pause at the end of every cycle
      - Evaluate when "nothing to clean this time" is the correct outcome — and notice that *entering and looking* is the discipline, not finding something
      - Analyze a quiz question on the rhythm to confirm RED-GREEN-REFACTOR is now reasoned about, not just slogan-recited

      > **The discipline:** REFACTOR is a phase you **enter every cycle** — even when the answer is *"nothing to clean this time."* Entering and looking is the discipline. Skipping the look is how duplication and unclear names pile up unnoticed.

      ## The REFACTOR checklist (you'll re-use this every cycle)

      | Category | Question to ask | Your cycle 1 answer |
      |---|---|---|
      | **Duplication** | Two pieces of code expressing the same idea? | _____ |
      | **Names** | Do names describe what they *mean*, not how they work? | _____ |
      | **Test names** | Does each test name read as a behavior sentence? | _____ |
      | **Magic constants** | Unexplained numbers or strings? | _____ |
      | **Imports** | Conventional order, no dead imports? | _____ |

      Fill the right column from your code *before* opening the reveal. The discipline is the looking, not the finding.

      ## Your task

      1. Re-read your code with the checklist. Spend 30 seconds — don't rush.
      2. Make any tiny improvement you spot (e.g., a module docstring); keep the bar green.
      3. Open the reveal below to compare your answers. Then take the **first quiz**.

      <details markdown="1"><summary>Reveal — one possible cycle-1 answer column</summary>

      | Category | Cycle 1 answer |
      |---|---|
      | **Duplication** | No — only one piece of code |
      | **Names** | `BattleReport`, `total_damage`, `events`, `score` — all domain words |
      | **Test names** | `test_empty_roll_has_zero_damage_and_no_events` — long but unambiguous |
      | **Magic constants** | None yet |
      | **Imports** | Just `from dataclasses import dataclass` — clean |

      For cycle 1, every row is "fine." That's a real outcome of a REFACTOR phase — and *recognising it without skipping the look* is the win.
      </details>

      <details markdown="1"><summary>Why REFACTOR is the most-skipped phase</summary>

      Martin Fowler writes that "the most common way that I hear to screw up TDD is neglecting the third step" — refactoring. When the green bar feels like the finish line, duplication accumulates within a few cycles and the test suite ages — exactly because nobody paused at REFACTOR to look. By making "enter the phase even when there's nothing to do" a habit now, you defend against that drift for the rest of the tutorial.
      </details>

      ---

      ### 📦 Commit your progress

      Before moving on, lock this step into the safety net. In the embedded terminal:

      ```bash
      git add scorer.py test_scorer.py && git commit -m "REFACTOR: cycle 1 (nothing to clean)"
      ```

