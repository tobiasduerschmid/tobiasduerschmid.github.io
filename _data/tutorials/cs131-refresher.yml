    solution:
      files:
        - path: "linked_list_lab.py"
          language: "python"
          content: |
            class List:
                """Python port of the C++ singly linked list."""

                class Node:
                    def __init__(self, v):
                        self.val = v
                        self.next = None

                def __init__(self):
                    self.head = None

                def add_to_front(self, val):
                    new_node = self.Node(val)
                    new_node.next = self.head
                    self.head = new_node

                def values(self):
                    result = []
                    p = self.head
                    while p is not None:
                        result.append(p.val)
                        p = p.next
                    return result

                def print_items(self):
                    for val in self.values():
                        print(val)

                # No destructor needed - see the quiz below for why.


            lst = List()
            lst.add_to_front(1)
            lst.add_to_front(2)
            lst.add_to_front(3)
            print(lst.values())  # expect [3, 2, 1]
            lst.print_items()
      explanation: |
        Line for line, `add_to_front` and the chain walk are the C++ originals
        with `->` becoming `.` and `nullptr` becoming `None`. The algorithm
        didn't change, because the algorithm was never the C++-specific part.

        A few key things to note:

        - In Python, everything is public by default. There's no need for the
          `public` or `private` specifiers, and the `Node` class is nested
          purely to say where it belongs.
        - Memory management in Python is done automatically using a garbage
          collector, so there's no need for explicit memory deallocation as in
          C++. No `new`, no `delete`, and no destructor is needed.
        - The nested Node class in Python is defined similarly to how it's done
          in C++, but we use the `self` keyword in methods to refer to instance
          variables or other methods.

        That's the whole refresher in one class: same structure, same traversal,
        and a completely different answer to who is responsible for the memory.
