        hints:
          - text: "If this check fails, the function is doing more than reassigning. It's reaching through the names and editing the objects themselves."
          - text: "Swapping `a.x_` with `b.x_` changes the shared objects, so the caller does see it. This step wants the version that only moves the local names."
            condition: "code_contains: .x_"

    quiz:
