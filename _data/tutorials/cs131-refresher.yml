        hints:
          - text: "This step needs the broken version to actually exist. An empty body proves nothing, so the checker looks for a real attempt at the swap."
          - text: "Python swaps two names in one statement, with both names on the left of the `=` and both on the right in the other order."
            condition: "code_contains: pass"
      - description: "swap_points leaves the caller's two variables unswapped"
