        command: "sed 's|//.*||' /tutorial/cs131/recursion.cpp | awk '/index_of_biggest[[:space:]]*\\(/{f=1} f{print} f&&/^}/{exit}' | tr '\\n' ' ' | grep -qE 'n[[:space:]]*(==|<=|<)[[:space:]]*[12]' && sed 's|//.*||' /tutorial/cs131/recursion.cpp | awk '/index_of_biggest[[:space:]]*\\(/{f=1} f{print} f&&/^}/{exit}' | grep -qE '([A-Za-z_][A-Za-z0-9_]*[[:space:]]*\\[[^]]*\\][[:space:]]*[<>]|[<>][[:space:]]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\\[)'"
        hints:
          - text: "The base case here returns an index, not a value. When one element is left, what index is the biggest one at?"
          - text: "You can't compare indices to decide which is bigger. You have to compare the values those indices point at, which means two array lookups in the comparison."
            condition: "code_missing: >"
          - text: "Here's the shape: `if (n == 1) return 0;` then `int rest = index_of_biggest(arr + 1, n - 1) + 1;` then return `rest` or `0` depending on how `arr[rest]` compares with `arr[0]`."

