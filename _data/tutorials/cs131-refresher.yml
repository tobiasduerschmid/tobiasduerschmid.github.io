            0: "`append` changes the list object itself, and both names refer to that same object."
            1: "Assigning to a key changes the dictionary object itself. It doesn't reassign `d`."
            2: "`+` builds a brand new list, and `=` points the local name at it. The caller's list is never touched. `xs += [4]` would be the version that does change it."
            3: "Integers can't be changed in place, so `+=` computes a new one and points the local name at it."
          explanation: "A change survives the call when it changes the shared object. Any statement that just points a parameter name at a different object is invisible to the caller."
        - type: single
          difficulty: advanced
          question: |
            Back to Step 1 again. A C++ function is declared `void f(Point p)`
            and its body is `p.x_ = 99;`. The caller runs
            `Point pt(1, 1); f(pt); pt.display();`

            How does that compare with the Python call `f(pt)`, where
            `def f(p): p.x_ = 99`?
          options:
            - "C++ prints `(1, 1)`, but Python's `pt.x_` becomes 99"
            - "Both leave the caller's point at `(1, 1)`"
            - "Both set the caller's `x_` to 99"
            - "C++ sets `x_` to 99, but Python leaves it at 1"
          correct_index: 0
          option_feedback:
            1: "Python never copies the object on a call, so the write lands on the caller's object."
            2: "A C++ by-value parameter is a real copy made by the copy constructor, so the write lands on that copy and is thrown away."
            3: "This has the two languages backwards. Copying is what C++ does when you pass by value, and Python is the one that shares the object."
          explanation: "Passing by value in C++ copies the object, so the function edits a copy. Python has no such mode. The function always gets a reference to the same object, so attribute writes are shared."
        - type: single
          difficulty: advanced
          question: |
            A colleague fixes the broken swap like this:

            ```python
