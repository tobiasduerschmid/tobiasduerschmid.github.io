        `p = Point(20, 30)` rebinds the local name and leaves `pt` referring to
        the original point. Object references explain the similar behavior;
        Python does not expose C++ pointer dereferencing or pointer arithmetic.
  # =========================================================================
  # STEP 3 — Object references and rebinding (HW0 problem 2c)
  # =========================================================================
  # Pedagogy: productive failure (Bjork) — the student is asked to write the
  # naive swap that a pass-by-reference language would allow, watch it fail,
  # and only then generalize the rule. Also spaced practice on Step 1.
  - title: "Mutation Versus Rebinding"
    backend: pyodide
    instructions: |
      ### Why this matters

      In Homework 0, the `modify()` Python function changes a point's member variable but cannot use assignment to change the caller's original object:

      ```
      def modify(p):
          p = Point(20, 30) # does not change the caller's point object

      q = Point(10,10)
      modify(q)
      # q still points to point 10, 10
      ```

      Let's try
      the same distinction with a swap: what changes when we swap member variables,
      and what changes when we swap local names?

      ### 🎯 You will learn to

      - Apply the change-it versus reassign-it rule to say which changes survive a call
      - Explain why assigning parameters does not swap the caller's variables

      ### The rule

      A call to a function copies the argument's values into the paramaters.
      In Python, all variables and parameters are pointers to objects, also called "object references". 
      Therefore, during the call the parameters point at the original object(s) being passed in.

      Two very different things can happen next:

      - **You change the object.** `p.x_ = 50`, `items.append(3)`, `d["k"] = 1`.
        You reach through the parameter object reference to the object itself. The caller is holding
        that same object, so the caller sees the change to the original object.
      - **You reassign the parameter.** `p = Point(20, 30)`, `items = []`. You point
        the function's own parameter / variable at a different object. The caller's variable never
        changes.

      ### 🔧 Your task

      Open **`references_lab.py`** and write two functions.

      1. `swap_coords(p)` — swap one point's own `x_` and `y_` in place. The
         caller has to see the change without reassigning anything.
      2. `swap_points(a, b)` — write the naive version on purpose: the one you'd
         write the naive version on purpose: the one you’d write if you thought that python parameters worked like C++ references.
         Reassign `a` and `b` to each other and nothing else. Don't
         touch their member variables.

      Writing the broken one deliberately is the point of this step. The checker
      verifies that `swap_coords` works, that `swap_points` really does attempt
      the swap, and that the caller's variables come back **unswapped**.

      ### ✏️ Predict before you run

      After `swap_coords(first)` and then `swap_points(first, second)`, what do
      the three `display()` calls print?

      <details>
      <summary>Reveal &mdash; after you have run it</summary>
      <p><code>(2, 1)</code>, then <code>(2, 1)</code> and <code>(3, 4)</code>.</p>
      <p><code>swap_coords</code> changes the object, so the change sticks.
      <code>swap_points</code> reassigns two local names that disappear at the
      <code>return</code>, so <code>first</code> and <code>second</code> in the
      caller never move. During the call, <code>a</code> and <code>b</code>
      really were pointing at the caller's objects. Python just gives you no way
      to reach back through a parameter to the caller's variable.</p>
      <p>To swap the caller's names, write
      <code>first, second = second, first</code> in the caller, or return a pair
      and assign that result there.</p>
      </details>
