                  sys.setprofile(previous)
              bad_lines = sorted(loop_lines & function_lines)
              assert not bad_lines, f"{name} uses a loop or comprehension on line {bad_lines[0]}; use recursion instead"
              assert recursive_calls, f"Calling {name} must actually use recursion; a recursive helper is welcome"
          check_recursive('del_item', ([2, 1, 2, 3], 2))
        hints:
          - text: A helper function may perform the recursion. It must actually call recursively while solving the input.
          - text: A for or while statement, comprehension, or generator expression repeats by looping, including inside a helper.
          - text: Choose a smaller input for the next call, then combine its result with the item left out. A function containing an unused self-call does not practice recursion.

    quiz:
      title: "Step 6 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: multiple
          difficulty: advanced
          question: |
            Start with a fresh `x = [1, 2, 3]` for each option. Which expressions
            leave `x` unchanged?
          options:
            - "`x[1:]`"
            - "`[0] + x`"
            - "`x.append(4)`"
            - "`x.pop()`"
          correct_indices: [0, 1]
          option_feedback:
            0: "Slicing is the workhorse of this step. It reads from `x` and builds a separate list."
            1: "`+` builds a third list and never writes into either of the two it was given."
            2: "`append` changes the list in place. It returns `None` precisely so you don't treat it as producing a new list."
            3: "`pop` removes the last element from `x` and returns it, so the list is one shorter afterwards."
          explanation: "Slicing and concatenation create new lists without changing `x`. Both `append` and `pop` change `x`; a method's return value alone does not tell you whether it mutates its receiver."
        - type: single
          difficulty: "intermediate"
          question: |
            Which feature of this solution illustrates the approach to immutable
            data we will practice in functional programming?
          options:
            - "It builds a result while preserving the input"
            - "It uses recursion rather than a loop"
            - "It takes the item to delete as a parameter"
            - "It returns a list rather than printing one"
          correct_index: 0
          option_feedback:
            1: "Recursion does not by itself prevent mutation. A recursive function can still change a shared list."
            2: "Taking a parameter is ordinary good design in any language and says nothing about how the function treats state."
            3: "Returning rather than printing is a step in the right direction, but a function can return a value and still have changed something on the way."
          explanation: "Preserving the input and returning a result illustrates working with immutable data. Recursion is a way to express the traversal; it is not by itself a guarantee that a function has no side effects."
    solution:
      files:
        - path: "del_item_lab.py"
          language: "python"
          content: |
            def del_item(values, item):
                """Return a NEW list with every occurrence of item removed."""
                if len(values) == 0:
                    return []

                if values[0] != item:
                    return [values[0]] + del_item(values[1:], item)

                return del_item(values[1:], item)


            x = [1, 2, 3, 1, 4]
            y = del_item(x, 1)
            print(y)  # expect [2, 3, 4]
            print(x)  # expect [1, 2, 3, 1, 4]
      explanation: |
        Read the three returns as three sentences. An empty list has nothing to
        delete, so the answer is a new empty list. If the first item is a keeper,
        the answer is that item glued onto whatever the rest produces. Otherwise
        the answer is just whatever the rest produces, and the item gets dropped
        simply by not being glued back on.

        Nothing is ever removed from `values`. `values[1:]` reads, `[a] + b`
        builds, and we never assign to the original list or call a method that
        changes it. That's why `print(x)` still shows `[1, 2, 3, 1, 4]` after the
        call, and it's the same habit functional programming will ask for on
        every data structure, not just lists.
