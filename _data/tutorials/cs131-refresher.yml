              "add_to_front should link the node in place, not return the list"
        hints:
          - text: "The exercise is the chain itself. Backing the class with a Python list would work, but it would skip the thing we're asking you to build."
          - text: "Each call makes exactly one node and changes exactly one thing about the list, which is the node at the front."

    quiz:
      title: "Step 8 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: |
            The C++ `List` needs `~List()` to walk the chain calling `delete`.
            Why does the Python version need nothing like it?
          options:
            - "Python frees an object once nothing refers to it any more"
            - "Python allocates nodes on the stack, so they die with the function"
            - "Python's garbage collector runs at exit and frees everything then"
            - "Nested classes are freed together with the class that contains them"
          correct_index: 0
          option_feedback:
            1: "Every Python object lives on the heap. What's different from C++ is who decides when it gets released, not where it was allocated."
            2: "Waiting until the program exits would be a leak for anything long-running. Nodes get reclaimed as soon as the list stops referring to them."
            3: "Nesting just says where the class lives. It has nothing to do with how long the objects made from it stick around."
          explanation: "Python counts how many references reach each object and frees it when that count hits zero, with a cycle collector for the leftovers. Dropping the list drops the reference to `head`, and that cascades all the way down the chain."
        - type: single
          difficulty: intermediate
          question: |
            Inside `add_to_front`, does the order of these two lines matter?

            ```python
            new_node.next = self.head
            self.head = new_node
            ```
          options:
            - "Yes, swapping them makes the new node point at itself and loses the rest"
            - "No, both assignments happen before the method returns"
            - "Yes, swapping them raises an AttributeError on the first call"
            - "No, Python evaluates both right sides before assigning"
          correct_index: 0
          option_feedback:
            1: "Both lines do run, but the second one reads a value the first one already overwrote, so the old chain is gone before we can hang on to it."
            2: "It fails quietly rather than loudly. `self.head` is a perfectly valid node by then, so nothing raises. The list just becomes a one-element loop."
            3: "That's how assigning a pair works, but these are two separate statements, so the first one's effect is visible to the second."
          explanation: "The first line has to grab the old front while `self.head` still points at it. Reversing the order overwrites `self.head` first, so the new node ends up linked to itself and every earlier node becomes unreachable."
        - type: single
          difficulty: advanced
          question: |
            Back to Steps 1 through 3. Two variables refer to the same `List`:

            ```python
            a = List()
            b = a
            b.add_to_front(5)
            print(a.values())
            ```

            What is printed?
          options:
            - "`[5]`"
            - "`[]`"
            - "`[5, 5]`"
            - "An AttributeError"
          correct_index: 0
          option_feedback:
            1: "`b = a` copies a reference, not the object. There's only one list here, and `add_to_front` changes it."
            2: "Only one node was added, and only one list exists, so there's nothing to duplicate."
            3: "Both names refer to a fully built `List`, so every attribute access works normally."
          explanation: "Assignment between names never copies an object. `a` and `b` are two names for one list, so a change through either one is visible through both. It's the same shared-object rule from Step 3, one level up from attributes."
        - type: multiple
          difficulty: advanced
          question: |
            Which C++ features in the original `List` have no Python
            counterpart?
          options:
            - "`delete` on each node"
            - "`private:` hiding `head_` and `Node` from callers"
            - "The `while` loop that walks the chain"
            - "`Node *next;` linking one node to the next"
          correct_indices: [0, 1]
          option_feedback:
            0: "This is the headline difference. Freeing memory by hand has no Python equivalent at all."
            1: "Python has a naming convention for \"please don't touch this\", but nothing enforces it, so everything stays reachable."
            2: "The walk ports over unchanged. `while` exists in both languages and means the same thing."
            3: "The link ports over as an ordinary attribute holding either another node or `None`. The structure is identical, and only the syntax changes."
          explanation: "The two things that vanish are both about control that C++ gives you: freeing memory yourself, and enforced access restrictions. The data structure itself, a node holding a value and a link and walked by a loop, survives the translation intact."
        - type: parsons
          difficulty: intermediate
          question: |
            Put `add_to_front` together so that the existing chain survives.
          lines:
            - "def add_to_front(self, val):"
            - "    new_node = self.Node(val)"
            - "    new_node.next = self.head"
            - "    self.head = new_node"
          distractors:
            - "    self.head = new_node"
