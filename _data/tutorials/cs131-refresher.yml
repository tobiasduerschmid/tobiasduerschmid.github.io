  # STEP 5 — The same two algorithms in Python (HW0 problem 3a-3b, Python half)
  # =========================================================================
  # Pedagogy: worked example with fading + interleaving. The algorithm was
  # designed on Step 4 in C++; here its Python version executes against
  # varied inputs, so a wrong algorithm can surface as a failing test.
  - title: "The Same Recursion in Python"
    backend: pyodide
    instructions: |
      ### Why this matters

      Now write the same two algorithms in Python and try them on different
      inputs. If a result differs from your prediction, trace the base case and
      the value returned by each recursive call. Compare that reasoning with
      your C++ version.

      ### 🎯 You will learn to

      - Turn pointer-and-count recursion into Python's slice-based recursion
      - Check a recursive algorithm against inputs chosen to break it

      ### Slices replace pointer arithmetic

      Here are some hints to help you if you haven't worked with lists in Python
      before. Python lists know their own length, so the count parameter goes
      away:

      | C++ | Python |
      |---|---|
      | `find_biggest(arr + 1, n - 1)` | `find_biggest(values[1:])` |
      | `n == 1` | `len(values) == 1` |
      | `arr[0]` | `values[0]` |

      Given a list `x`, to obtain everything but the first item (that is, the
      tail of the list) you write `x[1:]`. To get the length of a list, use
      `len()`. One real difference from C++: `values[1:]` builds a **new list**
      every call, where `arr + 1` was just an address. That makes the translation easy to read, but adds copying work. An
      index-based recursive helper can avoid those repeated slices.

      ### 🔧 Your task

      Open **`recursion_lab.py`** and implement both functions using recursion.
      Each receives a non-empty list of numbers. `find_biggest` returns the
      largest value, including when values repeat. `index_of_biggest` returns
      its zero-based index; for that function, assume there are no duplicates.

      No loops or comprehensions are allowed. You may write recursive helpers, use a slice
      or an index to describe the remaining input, and compare two candidates `a` and `b`
      with `max(a, b)`. The traversal must be recursive; a call to `max(values)` or
      `sorted(values)` alone does not meet the task.

      ```python
      find_biggest([-1, 10, 3])      # 10
      index_of_biggest([-1, 10, 3])  # 1
      ```

      The tests run your functions on all-negative lists, single-element lists,
      and lists whose largest value sits at the front, the middle, and the end.
      Before you test, explain why `[1, 2, 3]` alone would miss a solution that
      starts its largest value at zero, or always returns the last element.
