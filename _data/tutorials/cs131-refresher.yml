        command: "[ $(sed 's|//.*||' /tutorial/cs131/recursion.cpp | awk '/find_biggest[[:space:]]*\\(/{f=1} f{print} f&&/^}/{exit}' | grep -c 'find_biggest') -ge 2 ]"
        hints:
          - text: "A recursive function mentions its own name twice, once in the signature and once in the body."
          - text: "The recursive call has to ask about a smaller problem: the same array shifted forward by one, with the count reduced by one."
      - description: "find_biggest has a base case on n and compares array elements"
        command: "sed 's|//.*||' /tutorial/cs131/recursion.cpp | awk '/find_biggest[[:space:]]*\\(/{f=1} f{print} f&&/^}/{exit}' | tr '\\n' ' ' | grep -qE 'n[[:space:]]*(==|<=|<)[[:space:]]*[12]' && sed 's|//.*||' /tutorial/cs131/recursion.cpp | awk '/find_biggest[[:space:]]*\\(/{f=1} f{print} f&&/^}/{exit}' | grep -qE '([A-Za-z_][A-Za-z0-9_]*[[:space:]]*\\[[^]]*\\][[:space:]]*[<>]|[<>][[:space:]]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\\[)'"
