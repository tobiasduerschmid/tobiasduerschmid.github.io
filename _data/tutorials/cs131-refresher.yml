        replaced by `values[1:]` and `n == 1` replaced by `len(values) == 1`.
        The algorithm didn't change at all. Only the way we say "the rest of the
        list" changed.

        There are two details the test inputs are built to catch. Starting from
        `values[0]` instead of from `0` is what makes the all-negative case
        work. And the `+ 1` on the recursive index is what makes `[1, 2, 3]`
        return 2 instead of 1, which is the same off-by-one you thought about
        before writing any code.

  # =========================================================================
  # STEP 6 — Recursive list building (HW0 problem 3c)
  # =========================================================================
  # Pedagogy: PRIMM Make — this is the step that transfers directly to the
  # functional-programming unit, so it is the one with the least scaffolding.
  - title: "Building New Lists Recursively"
    backend: pyodide
    instructions: |
      ### Why this matters

      The last two steps looked at a list. This one transforms one, without
      changing the original. As it turns out, the way we solve this problem in
      Python is very similar to the way we'd solve it in a functional
      programming language, so really try to wrap your head around this one and
      it'll help your functional programming skills immensely.

      ### 🎯 You will learn to

      - Build a new list recursively instead of changing an existing one
      - Pick a base case for a function that can legitimately be handed an empty list

      ### Building, not removing

      The instinct from CS31 is to walk the list and delete the matches. Nothing
      here deletes anything. Instead, each call answers one question. Does the
      first item belong in the output? Then it glues its answer onto whatever
      the rest of the list produced. Here are the list operations you'll need:

      ```python
      x = [10, 20, 30]
      x[1:]        # [20, 30]          the rest of the list
      [5] + x      # [5, 10, 20, 30]   a NEW list, x is untouched
      len(x)       # 3
      ```

      Note the difference between `[5] + x` and `x.append(5)`. The first builds
      a new list and leaves `x` alone. The second changes the list the caller is
      holding. This step needs the first one.

      ### 🔧 Your task

      Open **`del_item_lab.py`** and write `del_item(values, item)`, which takes
      a list of values as its first parameter and an item to delete as its
      second. Without changing the values list, and without using loops of any
      kind, your function must return an output list that removes all of the
      occurrences of item from the input list:

      ```python
      x = [1, 2, 3, 1, 4]
      y = del_item(x, 1)
      print(y)   # prints [2, 3, 4]
      print(x)   # still prints [1, 2, 3, 1, 4]
      ```

      No comprehensions either. Three cases decide the whole function: the list
      is empty, the first item matches, and the first item doesn't.

      ### ✏️ Predict before you run

      This one starts with a base case for the **empty** list, not for a
      one-element list like the previous step. Why can't `len(values) == 1`
      work here?

      <details>
      <summary>Reveal</summary>
      <p>Two reasons. First, <code>del_item([], x)</code> is a legal call. Unlike
      the previous problems, nothing guarantees a non-empty list.</p>
      <p>Second, and more importantly, even starting from a non-empty list the
      recursion reaches the empty list on its way down.
      <code>del_item([7], 7)</code> has to return <code>[]</code>, so the empty
      list is a real answer this function has to be able to produce, not an
      error case.</p>
      </details>
