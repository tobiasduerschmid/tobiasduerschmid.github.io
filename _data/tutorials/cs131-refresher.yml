    solution:
      files:
        - path: "references_lab.py"
          language: "python"
          content: |
            class Point:
                def __init__(self, x=0, y=0):
                    self.x_ = x
                    self.y_ = y

                def display(self):
                    print(f"({self.x_}, {self.y_})")


            def swap_coords(p):
                """Swap this point's own x_ and y_, in place."""
                p.x_, p.y_ = p.y_, p.x_


            def swap_points(a, b):
                """Deliberately naive: rebind a and b to each other."""
                a, b = b, a


            first = Point(1, 2)
            second = Point(3, 4)

            swap_coords(first)
            first.display()

            swap_points(first, second)
            first.display()
            second.display()
      explanation: |
        `swap_coords` works for two reasons. The pair on the right, `(p.y_, p.x_)`,
        is built before either assignment happens, so neither value gets thrown
        away mid-swap. And assigning to an attribute reaches the object the
        caller is holding too.

        `swap_points` fails for a reason that has nothing to do with pairs.
        `a, b = b, a` reassigns two names that stop existing at the `return`.
        During the call those names really did refer to the caller's objects.
        Python just has no way to reach back through a parameter and change the
        caller's variable. This may be surprising, but it's true, and it's the
        #1 mistake beginning Python programmers make. C++ gives you two ways to
        do it (`Point &p` and `*p = ...`). Python gives you none.

  # =========================================================================
  # STEP 4 — Recursion in C++ (HW0 problem 3a-3b, C++ half)
  # =========================================================================
  # Pedagogy: generation / productive failure — the student derives the
  # recursive shape in C++ from reasoning alone (no compiler), then validates
  # the same algorithm empirically in Python on Step 5. Writing it before
  # being able to test it is the desirable difficulty.
  - title: "Recursion With No Loops Allowed"
    backend: v86
    step_dir: /tutorial/cs131
    instructions: |
      ### Why this matters

      In this step we'll drill you on basic recursion (shudder). As we'll soon
      learn, functional programming is entirely based on recursion — there are
      no loops — so it's important to brush up on your recursion before we
      start class.

      ### 🎯 You will learn to

      - Write a recursive function whose base case stops on every input
      - Break an array traversal into "the first item" plus "the rest"

      ### The shape of every array recursion

      A C++ array doesn't know its own length, so recursion on arrays uses a
      pointer and a count. `arr + 1` is the same array starting one element
      later. This is the pointer arithmetic from CS31, and it's how you say "the
      rest of the array" without copying anything:

      | Concept | C++ | Python |
      |---|---|---|
      | the first item | `arr[0]` | `values[0]` |
      | everything but the first | `arr + 1, n - 1` | `values[1:]` |
      | is there only one item left? | `n == 1` | `len(values) == 1` |

      Here's the recipe for any array recursion:

      1. **Base case.** What's the answer when there's exactly one item left?
         Both functions here are guaranteed at least one item, so `n == 1` is a
         safe place to stop.
      2. **Recursive case.** Ask the same function for the answer to
         `arr + 1, n - 1`, then combine that answer with `arr[0]`.

      ### ✏️ Predict before you write

      For `index_of_biggest`, the recursive call answers a question about the
      sub-array starting at `arr + 1`. If that call returns `2`, what is that 2
      an index into?

      - **(a)** The original array, so use it as is
      - **(b)** The sub-array, so the original index is one higher
      - **(c)** The sub-array, so the original index is one lower

      This is the classic off-by-one in this exact problem, so it's worth
      deciding before you type.

      <details>
      <summary>Reveal</summary>
      <p><strong>(b).</strong> The recursive call knows nothing about the element
      you sliced off. Index 2 of <code>arr + 1</code> is index 3 of
      <code>arr</code>. So every index that comes back from recursion needs
      <code>+ 1</code> before you can compare it against <code>arr[0]</code> or
      return it.</p>
      <p>That's why <code>find_biggest</code> is easier than
      <code>index_of_biggest</code>. Values mean the same thing no matter which
      sub-array they came from. Indices don't.</p>
      </details>

      ### 🔧 Your task

      Open **`recursion.cpp`** and write both functions. Given an array that is
      guaranteed to have at least one item, `find_biggest` returns the largest
      value in the array, and `index_of_biggest` returns the index of the
      largest value, where the first item is at index zero. Assume there are no
      duplicate numbers. **No looping allowed!** The checker enforces that.

      ```cpp
      int arr[] = {-1, 10, 3};
      find_biggest(arr, 3);      // 10
      index_of_biggest(arr, 3);  // 1
      ```

      Remember that this VM has no C++ compiler, so the checker reads structure:
      recursive, no loops, a real base case, a real comparison. **Step 5 asks
      you for the same two algorithms in Python, where they actually run**, so
      treat this step as designing the algorithm and the next one as proving it
      works.
