        Read the three returns as three sentences. An empty list has nothing to
        delete, so the answer is a new empty list. If the first item is a keeper,
        the answer is that item glued onto whatever the rest produces. Otherwise
        the answer is just whatever the rest produces, and the item gets dropped
        simply by not being glued back on.

        Nothing is ever removed from `values`. `values[1:]` reads, `[a] + b`
        builds, and we never assign to the original list or call a method that
        changes it. That's why `print(x)` still shows `[1, 2, 3, 1, 4]` after the
        call, and it's the same habit functional programming will ask for on
        every data structure, not just lists.

  # =========================================================================
  # STEP 7 — Inheritance and polymorphism (HW0 problem 4)
  # =========================================================================
  # Pedagogy: PRIMM — Predict, then Make (extend the hierarchy).
  # Also a deliberate interleave: comedy_club takes Person& , so this step
  # re-tests Step 1's reference semantics inside a new topic.
  - title: "Virtual Dispatch and Object Slicing"
    backend: v86
    step_dir: /tutorial/cs131
    instructions: |
      ### Why this matters

      In this step we'll explore inheritance and polymorphism using C++. This is
      the CS32 idea CS131 pulls apart most thoroughly, because every language
      you meet this quarter answers "which function body actually runs?"
      differently. The C++ answer has two moving parts: whether the function is
      `virtual`, and how the object was passed. Mix them up and you get output
      that looks like the compiler is broken.

      ### 🎯 You will learn to

      - Trace which version of a function runs when a base-class reference names a derived object
      - Evaluate how a parameter's declared form changes that choice
      - Add a new subclass to an existing hierarchy

      ### The comedy club

      Consider the following classes, which represent regular people and people
      who giggle (a subclass of people) when they attend a comedy club:

      ```cpp
      class Person {
      public:
        Person(const std::string& name) { name_ = name; }
        void listen_to_joke() { laugh(); }
        virtual void laugh()  { cout << "haha!\n"; }
        virtual void heckle() { cout << "that's dumb!\n"; }
      private:
        std::string name_;
      };

      class GigglyPerson : public Person {
      public:
        GigglyPerson(const std::string& name) : Person(name) { }
        virtual void laugh()  { cout << "giggle giggle!\n"; }
        virtual void heckle() { cout << "that's... giggle... dumb... giggle!\n"; }
      };
      ```

      Now consider the following code that uses our classes:

      ```cpp
      void comedy_club(Person& p) {
        p.listen_to_joke();
        p.heckle();
      }

      int main() {
        Person p("Leia");
        comedy_club(p);

        GigglyPerson g("Sanjay");
        comedy_club(g);
      }
      ```

      Notice what `listen_to_joke` is: a **non-virtual** function, defined only
      on `Person`, that calls `laugh()`. Nobody overrides it. Keep that in mind
      for the prediction.

      ### ✏️ Predict before you read on

      What will this program print? Why? Don't just compile and run this code.
      Instead, try to reason out what is printed and why that's the case. If you
      get it wrong, dive in and figure out the root cause of your
      misunderstanding! Four lines come out, so write all four down before you
      open the reveal.

      - **(a)** `haha!`, `that's dumb!`, `haha!`, `that's... giggle... dumb... giggle!`
      - **(b)** `haha!`, `that's dumb!`, `giggle giggle!`, `that's... giggle... dumb... giggle!`
      - **(c)** `haha!`, `that's dumb!`, `haha!`, `that's dumb!`

      <details>
      <summary>Reveal</summary>
      <p><strong>(b).</strong></p>
      <pre><code>haha!&#10;that's dumb!&#10;giggle giggle!&#10;that's... giggle... dumb... giggle!</code></pre>
      <p>Line 3 is the interesting one. <code>comedy_club(g)</code> binds the
      reference <code>p</code> to the <code>GigglyPerson</code> object
      <code>g</code>. There's no copy and nothing gets sliced off, because
      <code>p</code> is a reference, which is version B from Step 1.
      <code>p.listen_to_joke()</code> runs <code>Person</code>'s only copy of
      that function, and inside it the bare call <code>laugh()</code> means
      <code>this-&gt;laugh()</code>. <code>this</code> points at a
      <code>GigglyPerson</code> and <code>laugh</code> is <code>virtual</code>,
      so the overridden version in <code>GigglyPerson</code> is the one that
      runs.</p>
      <p>The non-virtual function didn't need to be overridden. It only needed to
      call something virtual. This dynamic method dispatch is a key feature of
      object-oriented programming.</p>
      </details>

      ### 🔧 Your task

      Open **`comedy_club.cpp`** and add a third kind of audience member:
      `StonePerson`, who is unimpressed by everything.

      - Inherit publicly from `Person`.
      - Forward the name to the `Person` constructor in an initializer list.
        `Person` has no default constructor, so this isn't optional.
      - Override **both** `laugh` and `heckle`. The joke gets `...silence...`,
        and the heckle gets something equally deadpan. The exact strings are up
        to you.
      - In `main`, send a `StonePerson` through `comedy_club` alongside the
        other two.

      Then predict your own program's six lines before you press Test. Still no
      compiler here, so the checker reads structure.
