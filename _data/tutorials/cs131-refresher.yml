        hints:
          - text: "The caller keeps its own name for the object and never reassigns it, so whatever you do has to happen to the object's attributes."
          - text: "Writing `p.x_ = p.y_` first throws away the value you still need. Python can assign both at once, from a pair built before either assignment happens."
            condition: "code_missing: ,"
          - text: "Here's the shape. One line, two targets, two sources: `p.x_, p.y_ = ..., ...`"
            condition: "code_contains: pass"
      - description: "swap_points really does rebind both of its parameters"
        command: |
          import ast
          src = open('/tutorial/references_lab.py').read()
          tree = ast.parse(src)
          fn = next((n for n in ast.walk(tree)
                     if isinstance(n, ast.FunctionDef) and n.name == 'swap_points'), None)
          assert fn is not None, "No function named swap_points was found"
          params = {a.arg for a in fn.args.args}
          rebound = set()
          for node in ast.walk(fn):
              if isinstance(node, (ast.Assign, ast.AugAssign)):
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  for tgt in targets:
                      elts = tgt.elts if isinstance(tgt, (ast.Tuple, ast.List)) else [tgt]
                      for e in elts:
                          if isinstance(e, ast.Name):
