    quiz:
      title: "Step 7 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: |
            `listen_to_joke` is not virtual, and `GigglyPerson` never
            overrides it. So why does `comedy_club(g)` still print
            `giggle giggle!`?
          options:
            - "`listen_to_joke` calls `laugh()`, which is virtual, on a GigglyPerson"
            - "Any function called on a derived object dispatches dynamically"
            - "`GigglyPerson` inherits `listen_to_joke` and recompiles it against its own `laugh`"
            - "Passing by reference makes every member function behave as if virtual"
          correct_index: 0
          option_feedback:
            1: "Only functions declared `virtual` in the base class are chosen at run time. A non-virtual call is decided at compile time, from the declared type."
            2: "Inheritance shares one compiled function. It doesn't make a separate copy per subclass. The choice happens at run time, through the virtual call inside it."
            3: "References do prevent slicing, which is what gives dispatch anything to choose between, but the choosing itself still requires `virtual`."
          explanation: "The bare `laugh()` inside `listen_to_joke` means `this->laugh()`. `this` points at a `GigglyPerson` and `laugh` is virtual, so the overridden version runs even though the function around it is an ordinary one."
        - type: single
          difficulty: advanced
          question: |
            Back to Step 1. Someone changes the signature to
            `void comedy_club(Person p)`, by value instead of by reference.
            What does `comedy_club(g)` print now?
          options:
            - "`haha!` then `that's dumb!`, because the GigglyPerson part is sliced off"
            - "`giggle giggle!` then `that's... giggle... dumb... giggle!`, unchanged"
            - "Nothing, because the call no longer compiles"
            - "`haha!` then `that's... giggle... dumb... giggle!`"
          correct_index: 0
          option_feedback:
            1: "Passing by value builds a `Person`-sized object using `Person`'s copy constructor, so the overrides don't come along."
            2: "It compiles without complaint, because a `GigglyPerson` is a `Person` and the copy is perfectly legal. That silence is what makes this bug so hard to spot."
            3: "The choice isn't made per call. Once the parameter is a `Person` object, every virtual call on it finds `Person`'s version."
          explanation: "This is object slicing. The copy constructor builds a plain `Person` out of the `Person` part of `g` and throws the rest away. The parameter really is a `Person`, so both virtual calls find `Person`'s bodies."
        - type: single
          difficulty: advanced
          question: |
            Which parameter types let `comedy_club` reach an overridden
            version in a subclass?
          options:
            - "`Person&` and `Person*` only"
            - "All three of `Person`, `Person&` and `Person*`"
            - "`Person*` only, because dispatch needs an address"
            - "`Person` and `Person&`, but not `Person*`"
          correct_index: 0
          option_feedback:
            1: "Passing by value is exactly the one that can't. It copies a `Person`-shaped object and loses the subclass part before any call happens."
            2: "A reference is an address underneath too, and it names the original object just like a pointer does. Both keep the real type intact."
            3: "This has it backwards. A pointer keeps the real type, and passing by value is the one that destroys it."
          explanation: "Dynamic dispatch needs the original subclass object to still be there behind the parameter. References and pointers both name it. A by-value parameter is a new, smaller object with no subclass part left to dispatch to."
        - type: multiple
          difficulty: advanced
          question: |
            Which of these would stop `StonePerson`'s overrides from being
            reached through `comedy_club`?
          options:
            - "Declaring the class as `class StonePerson : Person`"
            - "Naming the override `void laugh(int volume)`"
            - "Writing `void laugh() { cout << \"...silence...\\n\"; }` without `virtual`"
            - "Giving `StonePerson` a constructor that forwards the name to `Person`"
          correct_indices: [0, 1]
          option_feedback:
            0: "A `class` inherits privately unless you say `public`, and a private base means the conversion to `Person&` isn't allowed."
            1: "Signatures have to match. Adding a parameter defines an unrelated function, so the base version keeps winning the virtual call."
            2: "An override is virtual whether or not you repeat the keyword. Writing it again is a readability choice, not a behavior change."
            3: "That's required for the class to compile at all, since `Person` has no default constructor. It enables the overrides rather than blocking them."
          explanation: "An override is reached only when the subclass converts publicly to the base and the function's signature matches the virtual one exactly. Repeating `virtual` is optional. Getting either of those two wrong quietly falls back to the base version."
        - type: single
          difficulty: expert
          question: |
            Back to Steps 2 and 3. If you translated this hierarchy to Python,
            which C++ mechanism would you no longer have to worry about?
          options:
            - "Object slicing on assignment or parameter passing"
            - "Calling a base-class method from a subclass"
            - "Overriding a method in a subclass"
            - "Constructing the base part of a subclass instance"
          correct_index: 0
          option_feedback:
            1: "Python writes this as `super().method()`, which does the same job as the qualified `Person::method()` call."
            2: "Python overrides by name in the subclass body, and every method is dispatched dynamically, so this exists in Python and is simpler there."
            3: "Python writes this as `super().__init__(...)`, which does the same job as C++'s constructor initializer list."
          explanation: "Slicing happens because C++ objects have a fixed size and get copied by value. Python names always refer to whole objects and never copy on assignment or on a call, so there's no way to lose the subclass part."
    solution:
      files:
        - path: "cs131/comedy_club.cpp"
          language: "cpp"
          content: |
            #include <iostream>
            #include <string>
            using namespace std;

            class Person {
            public:
              Person(const std::string& name) { name_ = name; }
              void listen_to_joke() { laugh(); }
              virtual void laugh()  { cout << "haha!\n"; }
              virtual void heckle() { cout << "that's dumb!\n"; }
            private:
              std::string name_;
            };

            class GigglyPerson : public Person {
            public:
              GigglyPerson(const std::string& name) : Person(name) { }
              virtual void laugh()  { cout << "giggle giggle!\n"; }
              virtual void heckle() { cout << "that's... giggle... dumb... giggle!\n"; }
            };

            class StonePerson : public Person {
            public:
              StonePerson(const std::string& name) : Person(name) { }
              virtual void laugh()  { cout << "...silence...\n"; }
              virtual void heckle() { cout << "i've heard better.\n"; }
            };

            void comedy_club(Person& p) {
              p.listen_to_joke();
              p.heckle();
            }

            int main() {
              Person p("Leia");
              comedy_club(p);

              GigglyPerson g("Sanjay");
              comedy_club(g);

              StonePerson s("Wren");
              comedy_club(s);
            }
      explanation: |
        `StonePerson` is `GigglyPerson` with different strings, and that's the
        point. Adding a third behavior meant changing nothing in `Person` and
        nothing in `comedy_club`. That's what dynamic method dispatch buys you.

        Two details are easy to miss, and both are about matching. The class
        header needs `public`, because a `class` inherits privately by default
        and a private base makes `Person&` unreachable. And each override needs
        the exact signature of the virtual function it replaces: `void laugh()`,
        no parameters. A near miss like `void laugh(int)` compiles fine and
        silently does nothing, which is why this shows up on exams so often.

        The initializer list isn't a style choice here. `Person` declares a
        constructor that takes a name, so it has no default constructor, and the
        base part can't be built without `: Person(name)`.

  # =========================================================================
  # STEP 8 — Linked list in Python (HW0 problem 5)
  # =========================================================================
  # Pedagogy: worked example with fading (full C++ source given, Python
  # written from scratch) + interleaving — the capstone quiz reaches back to
  # references, recursion, and dispatch.
  - title: "Linked Lists Without a Destructor"
    backend: pyodide
    instructions: |
      ### Why this matters

      Here's a linked list class written in C++. Write the equivalent class in
      Python, so you can learn how linked lists work in Python. A linked list is
      the smallest data structure where "who owns this memory?" has a real
      answer, and C++ and Python answer it completely differently.

      ### 🎯 You will learn to

      - Write a singly linked list in Python with a nested node class
      - Explain why the C++ destructor has no Python equivalent

      ### The C++ original

      ```cpp
      class List {
      private:
        struct Node {
          Node(int v) { val = v; next = nullptr; }
          int val;
          Node *next;
        };

        Node *head_;
      public:
        List() { head_ = nullptr; }
        ~List() {
          while (head_ != nullptr) {
            Node *temp = head_->next;
            delete head_;
            head_ = temp;
          }
        }
        void add_to_front(int val) {
          Node *new_node = new Node(val);
          new_node->next = head_;
          head_ = new_node;
        }
        void print() {
          Node *p = head_;
          while (p) {
            cout << p->val << endl;
            p = p->next;
          }
        }
      };
      ```

      Three of those four members port across almost unchanged. One of them
      disappears entirely.

      | C++ | Python |
      |---|---|
      | `struct Node { ... };` nested and private | a `class Node:` nested inside `List` |
      | `Node *head_;` set to `nullptr` | `self.head = None` |
      | `new Node(val)` | `self.Node(val)` |
      | `~List()` walking the chain calling `delete` | *nothing at all* |

      ### 🔧 Your task

      Open **`linked_list_lab.py`** and finish the class:

      - `Node` stays **nested inside `List`**, with attributes `val` and `next`,
        mirroring the C++ layout.
      - `List.__init__` starts with `self.head = None`.
      - `add_to_front(val)` links a new node in at the front. It returns nothing.
      - `values()` returns a plain Python list of the values, **front to back**,
        by walking the chain.
      - `print_items()` prints one value per line, front to back.

      Loops are welcome again on this step. The no-loops rule belonged to the
      recursion problems, not to this one.

      ### ✏️ Predict before you run

      You add 1, then 2, then 3, each to the front. What does `values()` return,
      and which end of the chain is `head`?

      <details>
      <summary>Reveal</summary>
      <p><code>[3, 2, 1]</code>. Every insertion goes in front of whatever was
      already there, so the newest item is always <code>head</code> and the list
      comes out in reverse insertion order. That's why
      <code>add_to_front</code> is so cheap, and why a stack is the natural
      thing to build out of one of these.</p>
      </details>
