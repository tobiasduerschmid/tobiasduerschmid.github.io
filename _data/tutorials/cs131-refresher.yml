  - title: "Building New Lists Recursively"
    backend: pyodide
    instructions: |
      ### Why this matters

      This problem asks you to transform a list without changing the original.
      The recursive solution is similar to one we'll use in functional
      programming: decide what to keep, then build the result from those values.

      ### 🎯 You will learn to

      - Build a new list recursively instead of changing an existing one
      - Pick a base case for a function that can legitimately be handed an empty list

      ### A New List From the Remaining Values

      Imagine we want to write a function that is going to extract some subset of 
      values from an existing list and construct a new list with those values.
      One approach is to ask whether the first item belongs in the output, then
      combine that value with the recursive result for the rest of the list. These operations can
      help you build a separate list:

      ```python
      x = [10, 20, 30]
      x[1:]        # [20, 30]          the rest of the list
      [5] + x      # [5, 10, 20, 30]   a NEW list, x is untouched
      len(x)       # 3
      ```

      Note the difference between `[5] + x` and `x.append(5)`. The first builds
      a new list with 5 in the front and leaves `x` unchanged. 
      The second changes the list the caller is holding. 
      You may never change the original (i.e., treating the list as "immuatable") but instead create a new list with changed values; 
      the restriction is that the input list must stay unchanged.

      ### 🔧 Your task

      Open **`del_item_lab.py`** and write `del_item(values, item)`, which takes
      a list of values as its first parameter and an item to delete as its
      second. Without changing the values list, and without using loops of any
      kind, your function must return an output list that removes all of the
      occurrences equal to `item` from the input list.
      Do **not** use comprehensions either. Three cases decide the whole function: the list
      is empty, the first item matches, and the first item doesn't.
       Preserve the order of
      the remaining values, and return a new list even when the input is empty
      or nothing matches. Recursive helpers are welcome:

      ```python
      x = [1, 2, 3, 1, 4]
      y = del_item(x, 1)
      print(y)   # prints [2, 3, 4]
      print(x)   # still prints [1, 2, 3, 1, 4]
      ```

      

      ### ✏️ Predict before you run

      Suppose the only base case is `if len(values) == 1: return values`.
      What happens for `del_item([], 7)` and `del_item([7], 7)`?

