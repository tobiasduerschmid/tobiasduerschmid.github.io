  # =========================================================================
  # STEP 4 — Recursion in C++ (HW0 problem 3a-3b, C++ half)
  # =========================================================================
  # Pedagogy: generation / productive failure — the student derives the
  # recursive shape in C++ before checking examples, then compares the
  # same algorithm in Python on Step 5. Manual review also checks that the
  # solution uses recursion, not only that the example output matches.
  - title: "Recursion With No Loops Allowed"
    backend: cpp
    instructions: |
      ### Why this matters

      In this step we'll review basic recursion. Recursive definitions will be
      important in the functional programming part of CS131, so we'll practice
      solving a smaller problem and using its answer without writing a loop.

      ### 🎯 You will learn to

      - Write a recursive function that covers every permitted input
      - Think about the base case and the recursive case 
      - Break an array traversal into "the first item" plus "the rest"

      ### Recursion on the Rest of an Array

      An `int arr[]` function parameter is treated as a pointer, so these
      functions also receive an element count. `arr + 1` points one element
      later in the same array. This is the pointer arithmetic from CS31, and it's how you say "the
      rest of the array" without copying anything:

      | Concept | C++ | Python |
      |---|---|---|
      | the first item | `arr[0]` | `values[0]` |
      | everything but the first | `arr + 1, n - 1` | `values[1:]` |
      | is there only one item left? | `n == 1` | `len(values) == 1` |

      Here's one way to organize both functions (look at `find_biggest` and `index_of_biggest` on the right):

      1. **Base case.** What's the answer when there's exactly one item left?
         Both functions here are guaranteed at least one item, so `n == 1` is a
         safe place to stop.
      2. **Recursive case.** Ask the same function for the answer to
         `arr + 1, n - 1`, then combine that answer with `arr[0]`.

      ### ✏️ Predict before you write

      For `index_of_biggest`, the recursive call answers a question about the
      sub-array starting at `arr + 1`. If that call returns `2`, what is that 2
      an index into?

      - **(a)** The original array, so use it as is
      - **(b)** The sub-array starting at `arr+1`, so the original index is one higher
      - **(c)** The sub-array starting at `arr+1`, so the original index is one lower

      This is the classic off-by-one in this exact problem, so it's worth
      deciding before you type.

      <details>
      <summary>Reveal</summary>
      <p><strong>(b).</strong> The recursive call knows nothing about 0-th element that you sliced off.
      If the recursive call returned 2 while processing <code>arr+1</code>, <code>n-1</code> then 
      that means that the index of the biggest is actually at position 3 when considering 
      the whole array including the 0-th element.
      Compare <code>arr[rest]</code> with <code>arr[0]</code>,
      where <code>rest</code> is the adjusted index.</p>
      <p>That's why <code>find_biggest</code> is easier than
      <code>index_of_biggest</code>. Values mean the same thing no matter which
      sub-array they came from. Indices don't.</p>
      </details>

      ### 🔧 Your task

      Open **`recursion.cpp`** and write both functions. Given an array that is
      guaranteed to have at least one item, `find_biggest` returns the largest
      value in the array, and `index_of_biggest` returns the index of the
      largest value, where the first item is at index zero. Both functions
      receive at least one item. For `index_of_biggest`, assume there are no
      duplicate numbers. **No looping allowed!** Recursive helpers are welcome.

      ```cpp
      int arr[] = {-1, 10, 3};
      find_biggest(arr, 3);      // 10
      index_of_biggest(arr, 3);  // 1
      ```

      Choose **Run** to compile and run `recursion.cpp` as C++17 in the browser.
      The supplied `main()` prints the largest value and its index for
      `{-1, 10, 3}`. Replace the placeholder returns as you implement each
      function, and edit the array in `main()` to try the cases below. Update
      the element count in both calls when you change the array's length.

      This step uses manual review: compare the output with the expected
      answers and trace your recursive calls. Step 5 has automatic checks for
      the Python versions; those checks do not grade this C++ implementation.

      ### Check your work (manual review)

      For each input, write the returned value and the returned index:

      | Array | `find_biggest` | `index_of_biggest` |
      |---|---|---|
      | `{5}` | `5` | `0` |
      | `{-5, -2, -9}` | `-2` | `1` |
      | `{9, 2, 3}` | `9` | `0` |
      | `{1, 2, 9}` | `9` | `2` |

      Check that every recursive call receives a smaller problem, that the base
      case is checked before recursing, and that an index is measured from the
      right starting address. For the array `{7, 7, 2}`, `find_biggest` should return `7`;
      the no-duplicates guarantee applies only to `index_of_biggest`.
    files:
      - path: "cs131/recursion.cpp"
        language: "cpp"
        content: |
          #include <iostream>

          // Return the largest value in arr[0..n-1].
          // Guaranteed: n >= 1. No loops allowed.
          int find_biggest(int arr[], int n) {
              // TODO: base case, then combine arr[0] with the answer for the rest
              return 0; // Placeholder: replace this with your recursive implementation.
