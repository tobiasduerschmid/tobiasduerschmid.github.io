            def find_biggest(values):
                """Return the largest value in values. Assumes at least one item."""
                if len(values) == 1:
                    return values[0]
                rest = find_biggest(values[1:])
                if rest > values[0]:
                    return rest
                return values[0]


            def index_of_biggest(values):
                """Return the index of the largest value in values."""
                if len(values) == 1:
