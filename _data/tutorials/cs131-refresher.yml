                a.x_, b.x_ = b.x_, a.x_
                a.y_, b.y_ = b.y_, a.y_
            ```

            Does the caller now see `first` and `second` swapped?
          options:
            - "The contents swap, but each variable still names the object it started with"
            - "Yes, and this is the idiomatic Python fix"
            - "No, assigning to an attribute is still reassigning, so nothing survives"
            - "Only if both points were created in the same function"
          correct_index: 0
