              def __init__(self, x=0, y=0):
                  self.x_ = x
                  self.y_ = y

              def display(self):
                  print(f"({self.x_}, {self.y_})")


          def swap_coords(p):
              """Swap this point's own x_ and y_, in place.

              The caller must see the swap without reassigning anything.
              """
              # TODO
