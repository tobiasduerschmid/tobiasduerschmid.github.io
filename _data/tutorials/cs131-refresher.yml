            2: "A return value of 0 just means \"the first one\". An empty array never reaches this code, because the base case stops the recursion first."
            3: "`arr[0]` is exactly the element we sliced off before the recursive call, so the recursion couldn't have been talking about it."
          explanation: "Every index that comes back from a recursive call is counted from the sub-array that call received. To turn it into an index into the original array, add 1 for each element you sliced off, which is exactly one here."
        - type: multiple
          difficulty: advanced
          question: |
            Back to Steps 1 through 3. `find_biggest(int arr[], int n)` is
            called as `find_biggest(scores, 5)`. Which statements are true?
          options:
            - "`arr` inside the function is a pointer, not a copy of the array"
            - "Writing `arr[0] = 99` inside the function changes the caller's array"
            - "`arr + 1` creates a copy of the array minus its first element"
            - "Passing the array copies all 5 elements onto the stack"
          correct_indices: [0, 1]
          option_feedback:
            0: "An array parameter is silently rewritten as a pointer. That's also why `n` has to be passed separately, since the pointer doesn't know the length."
            1: "The function is holding the caller's address, so writing through a subscript reaches the caller's array."
            2: "Pointer arithmetic produces a new address, not new storage. `arr + 1` is a different starting point into the same array."
            3: "C++ never copies an array on a call. That's exactly why you can't get the length back out of `arr` and have to pass it separately."
          explanation: "An array argument turns into a pointer to its first element, so the function shares the caller's array. It's the same reach-through-an-address behavior you traced in Step 1, and it's why `arr + 1, n - 1` costs nothing."
    solution:
      files:
        - path: "cs131/recursion.cpp"
          language: "cpp"
          content: |
            // Return the largest value in arr[0..n-1].
            // Guaranteed: n >= 1. No loops allowed.
            int find_biggest(int arr[], int n) {
                if (n == 1) return arr[0];
                int rest = find_biggest(arr + 1, n - 1);
                if (rest > arr[0])
                    return rest;
                else
                    return arr[0];
            }

            // Return the INDEX (into arr) of the largest value in arr[0..n-1].
            // Guaranteed: n >= 1, no duplicate values. No loops allowed.
            int index_of_biggest(int arr[], int n) {
                if (n == 1) return 0;
                int rest = index_of_biggest(arr + 1, n - 1) + 1;
                if (arr[rest] > arr[0])
                    return rest;
                else
                    return 0;
            }
      explanation: |
        Both functions have the same shape. Check the base case first, make one
        recursive call on a smaller problem, then combine the two answers.

        The only real difference is the `+ 1`. `find_biggest` can use the
        recursive answer as is, because a value means the same thing no matter
        which sub-array it came from. `index_of_biggest` can't. The index it
        gets back is measured from `arr + 1`, so we have to shift it before we
        compare or return it. The other place this problem trips people up is
        the comparison: we compare `arr[rest] > arr[0]`, which compares values,
        not indices.

  # =========================================================================
  # STEP 5 — The same two algorithms in Python (HW0 problem 3a-3b, Python half)
  # =========================================================================
  # Pedagogy: worked example with fading + interleaving. The algorithm was
  # designed on Step 4 in a language that could not run it; here it executes
  # against real inputs, so a wrong design surfaces as a failing test.
  - title: "The Same Recursion in Python"
    backend: pyodide
    instructions: |
      ### Why this matters

      You designed both algorithms on the last step without ever running them.
      Now they run. If your C++ version had an off-by-one or a base case in the
      wrong place, this is where you find out, and the fix carries straight back
      to the C++ you already wrote.

      ### 🎯 You will learn to

      - Turn pointer-and-count recursion into slice-based recursion
      - Check a recursive algorithm against inputs chosen to break it

      ### Slices replace pointer arithmetic

      Here are some hints to help you if you haven't worked with lists in Python
      before. Python lists know their own length, so the count parameter goes
      away:

      | C++ | Python |
      |---|---|
      | `find_biggest(arr + 1, n - 1)` | `find_biggest(values[1:])` |
      | `n == 1` | `len(values) == 1` |
      | `arr[0]` | `values[0]` |

      Given a list `x`, to obtain everything but the first item (that is, the
      tail of the list) you write `x[1:]`. To get the length of a list, use
      `len()`. One real difference from C++: `values[1:]` builds a **new list**
      every call, where `arr + 1` was just an address. Same answer, more
      copying, and it's a trade CS131 will keep making in favor of never
      changing anything in place.

      ### 🔧 Your task

      Open **`recursion_lab.py`** and write both functions. Still no loops, and
      now no comprehensions either, since a comprehension is just a loop in
      disguise and the checker treats it as one.

      ```python
      find_biggest([-1, 10, 3])      # 10
      index_of_biggest([-1, 10, 3])  # 1
      ```

      The tests run your functions on all-negative lists, single-element lists,
      and lists whose largest value sits at the front, the middle, and the end.
      Two of those catch bugs that a quick check on `[1, 2, 3]` never would.
      Think about which two before you press Test.
