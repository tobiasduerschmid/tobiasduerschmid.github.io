title: "CS131 Refresher: Parameter Passing, Recursion & Objects"
description: |
  This optional refresher reviews parameter passing, recursion, inheritance and polymorphism, linked lists, and basic Python from CS31, CS32, and CS35L. It follows CS131 Homework 0 and assumes you have seen these topics before. Python and C++17 exercises run in the browser, with automatic parameter-passing checks and examples to review. You can continue without passing the tests or answering the knowledge checks correctly.
# Bloom-verb objectives. Authoring-time metadata for self-audit; the runtime
# does not render this list.
learning_objectives:
  - "Predict what a C++ function prints when its parameter is passed by value, by reference, and by pointer."
  - "Explain the difference between changing a pointer and changing what the pointer points to."
  - "Apply Python's single parameter passing scheme to say which changes the caller sees and which it doesn't."
  - "Write recursive functions with no loops, using base cases that cover the stated input domain."
  - "Write a recursive function that returns a new list instead of changing the one it was given."
  - "Explain how virtual dispatch and passing by value or reference affect which C++ method runs."
  - "Write a linked list class in Python and explain why it needs no destructor."

backend: multiple
require_tests: false
require_quiz: false
autosave_type: files
linter: true
font_size: 16

setup_commands_by_backend:
  pyodide:
    - "import sys; sys.path.insert(0, '/tutorial')"

steps:
  # =========================================================================
  # STEP 1 — C++ parameter passing (HW0 problem 1a-1d)
  # =========================================================================
  # Pedagogy: PRIMM — Predict before Run, then Make.
  # Variation Theory: four variants of one call, exactly one critical feature
  # (how the parameter is bound) varies between them, so the difference the
  # student must notice is isolated.
  - title: "Value, Reference, and Pointer Semantics"
    backend: cpp
    instructions: |
      ### Why this matters

      This refresher is meant to help you review concepts from CS31, CS32, and
      CS35L before we start CS131. We'll begin with parameter passing: which
      changes inside a function affect the caller, and why?

      This is optional practice. You don't need to turn anything
      in. The tests and knowledge checks provide feedback; you can continue
      without passing them and return to a problem later.

      ### 🎯 You will learn to

      - Work out whether an assignment inside a function is visible to the caller
      - Tell the difference between changing a pointer and changing what it points to
      - Write the reference and pointer versions of a function that modifies its argument

      ### The Point class

      Everything on this step uses the following Point class, which makes all of
      its members public for simplicity:

      ```cpp
      class Point {
      public:
          Point(int x = 0, int y = 0) { x_ = x; y_ = y; }
          void display() const { cout << "(" << x_ << ", " << y_ << ")" << endl; }
          int x_, y_;
      };
      ```

      Here's how each version below gets used:

      ```cpp
      Point pt(10, 10);
      modify(pt);       // or modify(&pt) for the pointer versions
      pt.display();
      ```

      Each version sets `x_` to 50 on line A. Line B either assigns a new
      `Point(20, 30)` to an object or reassigns the local pointer. Compare both
      the parameter declaration and the left side of line B:

      ```cpp
      // Version A - pass by value
      void modify(Point p) {
          p.x_ = 50;          // line A
          p = Point(20, 30);  // line B
      }

      // Version B - pass by reference
      void modify(Point &p) {
          p.x_ = 50;          // line A
          p = Point(20, 30);  // line B
      }

      // Version C - pass by pointer, reassigning the pointer
      void modify(Point *p) {
          p->x_ = 50;             // line A
          p = new Point(20, 30);  // line B
      }

      // Version D - pass by pointer, writing through the pointer
      void modify(Point *p) {
          p->x_ = 50;         // line A
          *p = Point(20, 30); // line B
      }
      ```

      ### ✏️ Predict before you read on

      For each version, figure out what will be printed and try to explain why
      you get that result. Don't just compile and run the code to get answers,
      but try to understand what's really happening under the hood.

      Write down all four answers before you open the reveal. Each one is:

      - **(a)** `(10, 10)` — the caller sees neither line
      - **(b)** `(50, 10)` — the caller sees line A but not line B
      - **(c)** `(20, 30)` — the caller sees both lines

      Versions C and D are the interesting ones. Their parameter lists are
      identical and their line A is identical. Only line B is different.

      <details>
      <summary>Reveal &mdash; all four answers</summary>
      <p><strong>A prints (10, 10).</strong> Why? Because when we pass by value
      we make a copy of the original <code>pt</code> variable and pass that in.
      Both lines modify a temporary copy, and the copy dies at the closing
      brace, so no changes are made to the original <code>pt</code>.</p>
      <p><strong>B prints (20, 30).</strong> Why? Because when you pass by
      reference, the formal parameter <code>p</code> is essentially an alias for
      the passed-in variable <code>pt</code>. Any change, including assigning a
      whole new value to <code>p</code>, modifies the original <code>pt</code>
      as if you'd referred to it instead of <code>p</code>.</p>
      <p><strong>C prints (50, 10).</strong> Why? Because here we're passing the
      address of <code>pt</code> into modify. Think of <code>pt</code> as a house
      that holds some stuff (the values <code>x_</code> and <code>y_</code>), and
      think of <code>p</code> as a piece of paper where we wrote down the address
      of that house. Line A uses the address on the paper to find the house and
      change its <code>x_</code> to 50, so that change sticks. But line B only
      scratches out the address on our paper and writes down the address of a
      brand new house. That does nothing to the contents of the original house,
      so <code>pt.y_</code> is still 10. We also have a memory leak, since we
      never delete the memory we allocated with <code>new</code>.</p>
      <p><strong>D prints (20, 30).</strong> Why? Because <code>*p = Point(20, 30);</code>
      creates a temporary new Point at 20, 30 and copies its contents into the
      memory pointed to by <code>p</code>, which is the <code>pt</code> variable.
      Using our analogy again: we read the address on the paper, drive to that
      address (that's what the <code>*</code> means), and update the contents of
      the house.</p>
      <p>C and D are the whole lesson. <code>p = ...</code> changes where the
      arrow points. <code>*p = ...</code> changes what it points at.</p>
      </details>

      ### 🔧 Now write two of them yourself

      Use **Run** to compile and run the current C++17 program in the browser.
      The output panel shows compiler messages and anything your program prints.
      After editing, choose **Run** again to compile the new version. If compilation
      fails, fix the first reported error and try again.

      Open **`param_passing.cpp`**. `modify_by_value` is already written for you
      as a worked example. Fill in the other two so that **both leave the
      caller's point at `(20, 30)`**.

      - `modify_by_reference` — you pick how the parameter is declared.
      - `modify_by_pointer` — the parameter is already `Point *p`. Reach the
        caller's object on every assignment. Don't point `p` somewhere else.

      The supplied `main()` creates a separate `Point(10, 10)` for each call
      and displays the result. Run the starter once, then compare its output with
      your prediction as you complete the two functions. You can change the
      starting coordinates in `main()` to try more examples.

      ### Check your work

      Choose **Test My Work** to compile and call each function on separate
      `Point(10, 10)` and `Point(-4, 7)` objects. The automatic checks verify that:

      - `modify_by_value` leaves the caller's coordinates unchanged.
      - `modify_by_reference` leaves the caller's point at `(20, 30)`.
      - `modify_by_pointer`, called with the point's address, leaves it at `(20, 30)`.

      The checks inspect the actual coordinates, so changing the display format
      or printing the expected answers cannot change the result. They do not
      require particular parameter names or a particular way of assigning the
      coordinates. You can continue without passing these checks.

      For each assignment, explain whether its left side names a local copy,
      the caller's object, or the local pointer. This reflection is for your own
      review; the automatic checks do not grade your explanation.
    files:
      - path: "cs131/param_passing.cpp"
        language: "cpp"
        content: |
          #include <iostream>
          using namespace std;

          class Point {
          public:
              Point(int x = 0, int y = 0) {
                  x_ = x;
                  y_ = y;
              }
              void display() const {
                  cout << "(" << x_ << ", " << y_ << ")" << endl;
              }

              int x_, y_;
          };

          // Version A - by value. Finished for you.
          // The caller still sees (10, 10) after this returns.
          void modify_by_value(Point p) {
              p.x_ = 50;
              p = Point(20, 30);
          }

          // Version B - by reference.
          // Goal: after this returns, the CALLER's point is (20, 30).
          // You choose how the parameter is bound.
          void modify_by_reference(Point p) {
          }

          // Version D - by pointer, written so the caller sees both lines.
          // Goal: after this returns, the CALLER's point is (20, 30).
          // The parameter is already a pointer. Do not make it point elsewhere.
          void modify_by_pointer(Point *p) {
          }

          int main() {
              Point by_value(10, 10);
              modify_by_value(by_value);
              cout << "by value: ";
              by_value.display();

              Point by_reference(10, 10);
              modify_by_reference(by_reference);
              cout << "by reference: ";
              by_reference.display();

              Point by_pointer(10, 10);
              modify_by_pointer(&by_pointer);
              cout << "by pointer: ";
              by_pointer.display();
              return 0;
          }

    open_file: "cs131/param_passing.cpp"
    run_file: "cs131/param_passing.cpp"

    tests:
      - description: modify_by_value preserves the caller’s coordinates for Point(10, 10) and Point(-4, 7)
        command: |
          #include <iostream>
          // Keep a learner-written driver from replacing the check's entry point.
          #define main cs131_student_main
          #include "cs131/param_passing.cpp"
          #undef main

          int main() {
              const int starting_points[][2] = {{10, 10}, {-4, 7}};
              bool passed = true;
              for (const auto& start : starting_points) {
                  Point point(start[0], start[1]);
                  modify_by_value(point);
                  const int expected_x = start[0];
                  const int expected_y = start[1];
                  if (point.x_ != expected_x || point.y_ != expected_y) {
                      std::cerr << "modify_by_value with Point(" << start[0] << ", " << start[1]
                                << "): expected the caller's point to be (" << expected_x
                                << ", " << expected_y << "), but got (" << point.x_
                                << ", " << point.y_ << ").\n";
                      passed = false;
                  }
              }
              return passed ? 0 : 1;
          }
        hints:
          - text: Passing by value gives the function a copy of the caller’s point.
          - text: Compare the parameter declaration with the reference version. Which declaration creates an alias?
          - text: Keep changes inside the function confined to its own Point parameter.
      - description: modify_by_reference sets the caller’s coordinates to (20, 30), from both starting points
        command: |
          #include <iostream>
          // Keep a learner-written driver from replacing the check's entry point.
          #define main cs131_student_main
          #include "cs131/param_passing.cpp"
          #undef main

          int main() {
              const int starting_points[][2] = {{10, 10}, {-4, 7}};
              bool passed = true;
              for (const auto& start : starting_points) {
                  Point point(start[0], start[1]);
                  modify_by_reference(point);
                  const int expected_x = 20;
                  const int expected_y = 30;
                  if (point.x_ != expected_x || point.y_ != expected_y) {
                      std::cerr << "modify_by_reference with Point(" << start[0] << ", " << start[1]
                                << "): expected the caller's point to be (" << expected_x
                                << ", " << expected_y << "), but got (" << point.x_
                                << ", " << point.y_ << ").\n";
                      passed = false;
                  }
              }
              return passed ? 0 : 1;
          }
        hints:
          - text: This function must change the point owned by its caller.
          - text: Choose a parameter declaration that makes the parameter another name for the caller’s object.
          - text: After choosing the binding, update both coordinates or assign a whole Point value through that binding.
      - description: modify_by_pointer sets the caller’s coordinates to (20, 30), from both starting points
        command: |
          #include <iostream>
          // Keep a learner-written driver from replacing the check's entry point.
          #define main cs131_student_main
          #include "cs131/param_passing.cpp"
          #undef main

          int main() {
              const int starting_points[][2] = {{10, 10}, {-4, 7}};
              bool passed = true;
              for (const auto& start : starting_points) {
                  Point point(start[0], start[1]);
                  modify_by_pointer(&point);
                  const int expected_x = 20;
                  const int expected_y = 30;
                  if (point.x_ != expected_x || point.y_ != expected_y) {
                      std::cerr << "modify_by_pointer with Point(" << start[0] << ", " << start[1]
                                << "): expected the caller's point to be (" << expected_x
                                << ", " << expected_y << "), but got (" << point.x_
                                << ", " << point.y_ << ").\n";
                      passed = false;
                  }
              }
              return passed ? 0 : 1;
          }
        hints:
          - text: The caller passes the address of its point. Follow that address to change the point.
          - text: Assigning a different address to the local pointer does not replace the caller’s point.
          - text: 'Check the left side of each assignment: is it the pointer itself, or a coordinate/object reached through it?'

    quiz:
      title: "Step 1 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: |
            A function is declared `void bump(Point *p)` and its whole body is
            the single line `p = new Point(0, 0);`. The caller runs:

            ```cpp
            Point pt(7, 7);
            bump(&pt);
            pt.display();
            ```

            What gets printed, and what happens to the heap object?
          options:
            - "`(7, 7)`; the heap object is leaked"
            - "`(0, 0)`; the heap object becomes `pt`"
            - "`(7, 7)`; the heap object is freed at the closing brace"
            - "`(0, 0)`; the heap object is leaked"
          correct_index: 0
          option_feedback:
            1: "Assigning to `p` only rewrites the address the parameter holds. `pt` still lives at the old address and never gets written to, so its members keep their original values."
            2: "C++ frees local variables at the closing brace, but `new` allocates on the heap. Only a matching `delete` frees that, and there isn't one here."
            3: "The leak half is right, but not the printed half. The only thing the assignment changed was the parameter's own copy of the address."
          explanation: "The parameter is a copy of an address. Overwriting it points the local copy somewhere else and leaves the caller's object alone, and the new Point is never freed, so it leaks."
        - type: single
          difficulty: advanced
          question: |
            You want `resize` to be able to replace the caller's whole `Point`,
            and you'd rather write `resize(pt)` at the call site than
            `resize(&pt)`. Which parameter list does that?
          options:
            - "`void resize(Point &p)`"
            - "`void resize(Point p)`"
            - "`void resize(Point *p)`"
            - "`void resize(const Point &p)`"
          correct_index: 0
          option_feedback:
            1: "A by-value parameter is a copy. Replacing it replaces the copy, and the copy is thrown away when the function returns."
            2: "This one can replace the caller's object, but only through `*p`, and it forces the call site to say `resize(&pt)`, which is what the question rules out."
            3: "`const` is the problem. It makes the alias read-only, so the compiler rejects any assignment to `p` or its members."
          explanation: "A non-const reference parameter is an alias for the caller's object, so assigning to it replaces that object. And references need no `&` at the call site."
        - type: multiple
          difficulty: advanced
          question: |
            `void f(Point *p)` is called as `f(&pt)`, with `Point pt(1, 1)`.
            Consider each option independently as the entire function body.
            Which bodies change the caller's point?
          options:
            - "`p->y_ = 9;`"
            - "`*p = Point(4, 4);`"
            - "`p = new Point(4, 4);`"
            - "`Point q = *p; q.y_ = 9;`"
          correct_indices: [0, 1]
          option_feedback:
            0: "This is the most common write of all. The arrow follows the address to the caller's object before assigning, so the caller sees it."
            1: "This is the version C versus version D difference again. Dereferencing on the left side copies the new Point into the caller's object."
            2: "This only rewrites the parameter's own copy of the address. The caller's object never gets written to."
            3: "`Point q = *p;` makes a brand new local copy. Changes to `q` never travel back through `p`."
          explanation: "Only statements that go through the address change the caller's object: `p->member` and `*p` on the left side. Assigning to `p` itself, or to a copy made from `*p`, stays local."
    solution:
      files:
        - path: "cs131/param_passing.cpp"
          language: "cpp"
          content: |
            #include <iostream>
            using namespace std;

            class Point {
            public:
                Point(int x = 0, int y = 0) {
                    x_ = x;
                    y_ = y;
                }
                void display() const {
                    cout << "(" << x_ << ", " << y_ << ")" << endl;
                }

                int x_, y_;
            };

            // Version A - by value. Finished for you.
            // The caller still sees (10, 10) after this returns.
            void modify_by_value(Point p) {
                p.x_ = 50;
                p = Point(20, 30);
            }

            // Version B - by reference. `p` is a second NAME for the caller's
            // object, so both statements land on the caller's point.
            void modify_by_reference(Point &p) {
                p.x_ = 50;
                p = Point(20, 30);
            }

            // Version D - by pointer. Every assignment goes THROUGH the
            // address, so the caller sees both statements.
            void modify_by_pointer(Point *p) {
                p->x_ = 50;
                *p = Point(20, 30);
            }

            int main() {
                Point by_value(10, 10);
                modify_by_value(by_value);
                cout << "by value: ";
                by_value.display();

                Point by_reference(10, 10);
                modify_by_reference(by_reference);
                cout << "by reference: ";
                by_reference.display();

                Point by_pointer(10, 10);
                modify_by_pointer(&by_pointer);
                cout << "by pointer: ";
                by_pointer.display();
                return 0;
            }
      explanation: |
        Both bodies do exactly what `modify_by_value` does: set `x_`, then
        replace the whole object. The reference version changes the parameter binding. The pointer
        version also uses dereferencing so that its assignments reach the object.

        `Point &p` makes `p` an alias. There is no second object, so
        `p = Point(20, 30)` really is `pt = Point(20, 30)`.

        `Point *p` gives you a copy of an address. Both `p->x_` and `*p` follow
        that address to the caller's object, so both reach `pt`. The tempting
        wrong move is `p = new Point(20, 30)`, which only rewrites the address
        on our piece of paper. That leaves `pt` at `(50, 10)` and leaks the
        memory we allocated.

        Keep versions C and D in mind for the next two steps. Python has exactly
        one parameter passing scheme, and it behaves like one of these four.
  # =========================================================================
  # STEP 2 — The Point class in Python (HW0 problem 2a-2b)
  # =========================================================================
  # Pedagogy: PRIMM — Predict before Run. The prediction is the payoff of
  # Step 1: the student must map Python onto one of four C++ variants they
  # have just reasoned through, then run the code and find out.
  - title: "The Point Class in Python"
    backend: pyodide
    instructions: |
      ### Why this matters

      For this step we'll explore classes and parameter passing in Python to get
      a feel for how it's similar to and different from C++. As it turns out,
      Python has one parameter passing scheme: object references. Compare
      the caller-visible behavior with the four C++ examples from Step 1.

      ### 🎯 You will learn to

      - Write a C++ class in Python 3.x syntax
      - Explain which C++ example has the same caller-visible behavior

      ### From C++ to Python

      Same class, different syntax. Three things change:

      | C++ | Python | Why |
      |---|---|---|
      | `Point(int x = 0, int y = 0) { ... }` | `def __init__(self, x=0, y=0):` | The constructor has a fixed name, and the object it's working on is an explicit first parameter |
      | `x_ = x;` | `self.x_ = x` | This assignment creates an instance attribute; assigning to bare `x_` inside the method would create a local variable |
      | `public:` / `private:` | *(nothing)* | In Python, everything is public by default |

      ### ✏️ Predict before you run

      `point_lab.py` already contains the Python version of the driver from
      Step 1:

      ```python
      def modify(p):
          p.x_ = 50          # line A
          p = Point(20, 30)  # line B

      pt = Point(10, 10)
      modify(pt)
      pt.display()
      ```

      Once you've written the class and pressed **Run**, what gets printed?

      - **(a)** `(10, 10)` — like C++ version A, Python copies the object
      - **(b)** `(50, 10)` — like C++ version C, line A lands but line B doesn't
      - **(c)** `(20, 30)` — like C++ version B or D, both lines land
      - **(d)** A `TypeError` — you can't assign to a parameter in Python

      Pick a letter before you press Run, then see whether the machine agrees
      with you.

      ### 🔧 Your task

      Open **`point_lab.py`** and write an equivalent version of the Point class
      in Python 3.x syntax. Fill in `__init__` and `display`.

      - Store the coordinates as `self.x_` and `self.y_`, keeping the C++ names
        so the two files are easy to compare. Preserve the default values so
        `Point()` creates a point at `(0, 0)`.
      - `display` must **print** the point's two coordinates, separated by a
        comma, and return `None`. Parentheses and whitespace are up to you:
        `(50, 10)` and `50, 10` are both accepted.

      ### Run your Python code here

      Finish your edits in `point_lab.py`, then click **Run** above the output
      panel. There is no separate compile command for these Python steps.
      Run executes the file, including the driver at the bottom; once your
      class is complete, this driver should print `(50, 10)`.

      After each edit, click **Run** again to see the new result. If Python
      reports an error, use the file name and line number in the traceback to
      find the problem, then fix it and rerun. **Clear** clears the output;
      it does not change your code.

      Use the same workflow on the later Python steps. **Test My Work** runs
      additional checks on different inputs, so matching the driver's output
      alone does not mean every case is correct. Both running your code and
      passing the checks are optional; **Next** lets you continue.
    files:
      - path: "point_lab.py"
        language: "python"
        content: |
          class Point:
              """Python twin of the C++ Point from Step 1."""

              def __init__(self, x=0, y=0):
                  # TODO: give this instance its two coordinates, named x_ and y_
                  pass

              def display(self):
                  # TODO: print this point in the same format as the C++ version,
                  # e.g. a point at x=50, y=10 prints as:  (50, 10)
                  pass


          def modify(p):
              p.x_ = 50          # line A
              p = Point(20, 30)  # line B


          # The Python twin of the C++ driver from Step 1.
          pt = Point(10, 10)
          modify(pt)
          pt.display()

    open_file: "point_lab.py"

    tests:
      - description: Point stores each instance's coordinates independently
        command: |
          import io, contextlib
          path = '/tutorial/point_lab.py'
          src = open(path).read()
          ns = {'__name__': '__cs131_check__'}
          with contextlib.redirect_stdout(io.StringIO()):
              exec(compile(src, path, 'exec'), ns)
          Point = ns['Point']
          for x, y in ((3, 4), (-7, 0), (0, 9), (12, -5)):
              p = Point(x, y)
              other = Point(y, x)
              assert (getattr(p, 'x_', None), getattr(p, 'y_', None)) == (x, y), \
                  f"Point({x}, {y}) should retain its own coordinates after another Point is created"
              other.x_ = 99
              assert p.x_ == x, "Changing one Point must not change another Point"
        hints:
          - text: For this class, assigning through `self` creates an instance attribute on that particular point.
          - text: "`__init__` gets the object it's building as its first parameter. The two coordinates arrive as the second and third."
            condition: "code_missing: self.x_"
          - text: "Here's the shape. Two assignments, no `return`: `self.x_ = ...` and `self.y_ = ...`"
            condition: "code_contains: pass"
      - description: The default coordinates are zero, including Point(x)
        command: |
          import io, contextlib
          path = '/tutorial/point_lab.py'
          src = open(path).read()
          ns = {'__name__': '__cs131_check__'}
          with contextlib.redirect_stdout(io.StringIO()):
              exec(compile(src, path, 'exec'), ns)
          Point = ns['Point']
          for args, want in (((), (0, 0)), ((7,), (7, 0))):
              p = Point(*args)
              got = (getattr(p, 'x_', None), getattr(p, 'y_', None))
              assert got == want, f"Point{args} should have coordinates {want}, got {got}"
        hints:
          - text: The C++ constructor said `int x = 0, int y = 0`, and the starter signature already has the Python equivalent. Make sure you assign the parameters instead of hard-coding numbers.
          - text: Default arguments supply values only when the caller omits them. Point(7) supplies x and relies on the default for y.
          - text: Check the constructor signature for two independent defaults, then make sure the body stores the received coordinates.
      - description: display() prints the current coordinates in order
        command: |
          import io, contextlib
          path = '/tutorial/point_lab.py'
