      - description: "values() returns the values front to back, and [] for an empty list"
        command: |
          import io, contextlib
          src = open('/tutorial/linked_list_lab.py').read()
          ns = {}
          with contextlib.redirect_stdout(io.StringIO()):
              exec(src, ns)
          List = ns['List']
          def assert_acyclic(lst):
              # Walking a cyclic chain would hang the runtime, so turn the
              # classic add_to_front ordering bug into a readable failure.
              node, seen = lst.head, set()
              while node is not None:
                  assert id(node) not in seen, \
                      "The chain loops back on itself — check the order of the two assignments in add_to_front"
                  seen.add(id(node))
                  node = node.next
          assert List().values() == [], f"An empty List should give [], got {List().values()!r}"
          lst = List()
          for v in (1, 2, 3):
              lst.add_to_front(v)
          assert_acyclic(lst)
          assert lst.values() == [3, 2, 1], \
              f"After adding 1, 2, 3 to the front, values() should be [3, 2, 1], got {lst.values()!r}"
