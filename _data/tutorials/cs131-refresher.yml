title: "CS131 Refresher: Parameter Passing, Recursion & Objects"
description: >-
  This tutorial is meant to refresh your memory about the key concepts from
  CS31, CS32 and CS35L that you might have forgotten: parameter passing by
  value, reference and pointer; recursion; inheritance and polymorphism;
  linked lists; and basic Python. The goal is to make sure you're ready to hit
  the ground running once we start CS131. C++ steps run in a Linux VM, Python
  steps run live in the browser.

# Bloom-verb objectives. Authoring-time metadata for self-audit; the runtime
# does not render this list.
learning_objectives:
  - "Predict what a C++ function prints when its parameter is passed by value, by reference, and by pointer."
  - "Explain the difference between changing a pointer and changing what the pointer points to."
  - "Apply Python's single parameter passing scheme to say which changes the caller sees and which it doesn't."
  - "Write recursive functions with no loops of any kind, using a base case that stops on every input."
  - "Write a recursive function that returns a new list instead of changing the one it was given."
  - "Evaluate how a C++ parameter's declared type decides which version of a virtual function runs."
  - "Write a linked list class in Python and explain why it needs no destructor."

backend: multiple
require_tests: true
autosave_type: files
linter: true
font_size: 16

setup_commands_by_backend:
  pyodide:
    - "import sys; sys.path.insert(0, '/tutorial')"
  v86:
    - "mkdir -p /tutorial/cs131"

steps:
  # =========================================================================
  # STEP 1 — C++ parameter passing (HW0 problem 1a-1d)
  # =========================================================================
  # Pedagogy: PRIMM — Predict before Run, then Make.
  # Variation Theory: four variants of one call, exactly one critical feature
  # (how the parameter is bound) varies between them, so the difference the
  # student must notice is isolated.
  - title: "Value, Reference, and Pointer Semantics"
    backend: v86
    step_dir: /tutorial/cs131
    instructions: |
      ### Why this matters

      CS131 spends the whole quarter on one question: what does a name actually
      refer to? C++ is the last language you'll use that makes you answer that
      question out loud, in the parameter list, every single time. In past
      quarters plenty of students had gotten rusty on this and it caused them to
      fall behind, so let's fix it now.

      ### 🎯 You will learn to

      - Work out whether an assignment inside a function is visible to the caller
      - Tell the difference between changing a pointer and changing what it points to
      - Write the reference and pointer versions of a function that modifies its argument

      ### The Point class

      Everything on this step uses the following Point class, which makes all of
      its members public for simplicity:

      ```cpp
      class Point {
      public:
          Point(int x = 0, int y = 0) { x_ = x; y_ = y; }
          void display() const { cout << "(" << x_ << ", " << y_ << ")" << endl; }
          int x_, y_;
      };
      ```

      Here's how each version below gets used:

      ```cpp
      Point pt(10, 10);
      modify(pt);       // or modify(&pt) for the pointer versions
      pt.display();
      ```

      Every version does the same two things to its parameter. It sets `x_` to
      50 on line A, then assigns a whole new `Point(20, 30)` over it on line B.
      The only thing that changes between them is how the parameter is declared:

      ```cpp
      // Version A - pass by value
      void modify(Point p) {
          p.x_ = 50;          // line A
          p = Point(20, 30);  // line B
      }

      // Version B - pass by reference
      void modify(Point &p) {
          p.x_ = 50;          // line A
          p = Point(20, 30);  // line B
      }

      // Version C - pass by pointer, reassigning the pointer
      void modify(Point *p) {
          p->x_ = 50;             // line A
          p = new Point(20, 30);  // line B
      }

      // Version D - pass by pointer, writing through the pointer
      void modify(Point *p) {
          p->x_ = 50;         // line A
          *p = Point(20, 30); // line B
      }
      ```

      ### ✏️ Predict before you read on

      For each version, figure out what will be printed and try to explain why
      you get that result. Don't just compile and run the code to get answers,
      but try to understand what's really happening under the hood.

      Write down all four answers before you open the reveal. Each one is:

      - **(a)** `(10, 10)` — the caller sees neither line
      - **(b)** `(50, 10)` — the caller sees line A but not line B
      - **(c)** `(20, 30)` — the caller sees both lines

      Versions C and D are the interesting ones. Their parameter lists are
      identical and their line A is identical. Only line B is different.

      <details>
      <summary>Reveal &mdash; all four answers</summary>
      <p><strong>A prints (10, 10).</strong> Why? Because when we pass by value
      we make a copy of the original <code>pt</code> variable and pass that in.
      Both lines modify a temporary copy, and the copy dies at the closing
      brace, so no changes are made to the original <code>pt</code>.</p>
      <p><strong>B prints (20, 30).</strong> Why? Because when you pass by
      reference, the formal parameter <code>p</code> is essentially an alias for
      the passed-in variable <code>pt</code>. Any change, including assigning a
      whole new value to <code>p</code>, modifies the original <code>pt</code>
      as if you'd referred to it instead of <code>p</code>.</p>
      <p><strong>C prints (50, 10).</strong> Why? Because here we're passing the
      address of <code>pt</code> into modify. Think of <code>pt</code> as a house
      that holds some stuff (the values <code>x_</code> and <code>y_</code>), and
      think of <code>p</code> as a piece of paper where we wrote down the address
      of that house. Line A uses the address on the paper to find the house and
      change its <code>x_</code> to 50, so that change sticks. But line B only
      scratches out the address on our paper and writes down the address of a
      brand new house. That does nothing to the contents of the original house,
      so <code>pt.y_</code> is still 10. We also have a memory leak, since we
      never delete the memory we allocated with <code>new</code>.</p>
      <p><strong>D prints (20, 30).</strong> Why? Because <code>*p = Point(20, 30);</code>
      creates a temporary new Point at 20, 30 and copies its contents into the
      memory pointed to by <code>p</code>, which is the <code>pt</code> variable.
      Using our analogy again: we read the address on the paper, drive to that
      address (that's what the <code>*</code> means), and update the contents of
      the house.</p>
      <p>C and D are the whole lesson. <code>p = ...</code> changes where the
      arrow points. <code>*p = ...</code> changes what it points at.</p>
      </details>

      ### 🔧 Now write two of them yourself

      > **Heads up: there is no C++ compiler in this VM.** That's on purpose.
      > On C++ steps the checker reads the **structure** of your code, not its
      > output, so you have to reason your way to the answer instead of
      > compiling until it works. You still get a terminal for `cat`, `grep` and
      > `less` so you can inspect your own files. The Python steps that follow
      > do run, and it turns out Python behaves like one of the four versions
      > above, so you'll get an answer you can check there.

      Open **`param_passing.cpp`**. `modify_by_value` is already written for you
      as a worked example. Fill in the other two so that **both leave the
      caller's point at `(20, 30)`**.

      - `modify_by_reference` — you pick how the parameter is declared.
      - `modify_by_pointer` — the parameter is already `Point *p`. Reach the
        caller's object on every assignment. Don't point `p` somewhere else.

      There's no `main()` in the file; the driver is the snippet above.
    files:
      - path: "cs131/param_passing.cpp"
        language: "cpp"
        content: |
          #include <iostream>
          using namespace std;

          class Point {
          public:
              Point(int x = 0, int y = 0) {
                  x_ = x;
                  y_ = y;
              }
              void display() const {
                  cout << "(" << x_ << ", " << y_ << ")" << endl;
              }

              int x_, y_;
          };

          // Version A - by value. Finished for you.
          // The caller still sees (10, 10) after this returns.
          void modify_by_value(Point p) {
              p.x_ = 50;
              p = Point(20, 30);
          }

          // Version B - by reference.
          // Goal: after this returns, the CALLER's point is (20, 30).
          // You choose how the parameter is bound.
          void modify_by_reference() {
          }

          // Version D - by pointer, written so the caller sees both lines.
          // Goal: after this returns, the CALLER's point is (20, 30).
          // The parameter is already a pointer. Do not make it point elsewhere.
          void modify_by_pointer(Point *p) {
          }

    open_file: "cs131/param_passing.cpp"

    tests:
      - description: "modify_by_reference binds its parameter as a Point reference"
        command: "sed 's|//.*||' /tutorial/cs131/param_passing.cpp | grep -qE 'modify_by_reference[[:space:]]*\\([[:space:]]*Point[[:space:]]*&[[:space:]]*[A-Za-z_]'"
        hints:
          - text: "All four versions differ only in the parameter list. Look back at the version that printed `(20, 30)` without any pointer syntax in its body, and copy the shape of its parameter."
          - text: "C++ writes \"another name for the caller's object\" as a single character between the type and the parameter name."
            condition: "code_missing: &"
          - text: "You have the right character. Make sure it's inside the parentheses of `modify_by_reference`, between `Point` and the parameter name: `Point ?p`."
            condition: "code_contains: &"
      - description: "modify_by_reference sets x_ to 50 and then assigns a whole new Point through the alias"
        command: "sed 's|//.*||' /tutorial/cs131/param_passing.cpp | awk '/modify_by_reference/,/^}/' | tr '\\n' ' ' | grep -qE '\\.[[:space:]]*x_[[:space:]]*=[[:space:]]*50.*=[[:space:]]*Point[[:space:]]*\\([[:space:]]*20'"
        hints:
          - text: "The body isn't the interesting part here. Line A and line B are already written for you in `modify_by_value` just above. The point is that with the parameter declared differently, those same two lines now reach the caller."
          - text: "Both statements from the worked example belong here, in the same order. The checker looks for the `x_ = 50` write and the whole-object assignment."
            condition: "code_missing: 20, 30"
          - text: "Here's the shape. Two statements, no pointer syntax: `p.x_ = ...;` then `p = Point(..., ...);`"
            condition: "code_missing: x_ = 50"
      - description: "modify_by_pointer writes through the pointer instead of rebinding it"
        command: "sed 's|//.*||' /tutorial/cs131/param_passing.cpp | awk '/modify_by_pointer/,/^}/' | tr '\\n' ' ' | grep -qE '(->[[:space:]]*x_|\\([[:space:]]*\\*[A-Za-z_]+[[:space:]]*\\)[[:space:]]*\\.[[:space:]]*x_)[[:space:]]*=[[:space:]]*50'"
        hints:
          - text: "`p` holds an address. To change the object at that address you have to follow the address first. Reading or writing `p` itself only touches the piece of paper the address is written on."
          - text: "There are two ways to write \"the x_ of the object p points at\". One uses an arrow. The other dereferences first and then uses a dot. Either one works."
            condition: "code_missing: ->"
      - description: "modify_by_pointer copies a new Point into the caller's object (no `new`, no rebind)"
        command: "sed 's|//.*||' /tutorial/cs131/param_passing.cpp | awk '/modify_by_pointer/,/^}/' | tr '\\n' ' ' | grep -qE '\\*[[:space:]]*[A-Za-z_]+[[:space:]]*=[[:space:]]*Point[[:space:]]*\\([[:space:]]*20' && ! sed 's|//.*||' /tutorial/cs131/param_passing.cpp | awk '/modify_by_pointer/,/^}/' | grep -qE '=[[:space:]]*new[[:space:]]+Point'"
        hints:
          - text: "This is exactly the version C versus version D difference from the reveal. One of them leaves the caller at `(50, 10)`. You want the other one."
          - text: "`p = something` scratches out the address on the paper, and the caller never finds out. You want the assignment whose left side names the house, not the paper."
            condition: "code_contains: new Point"
          - text: "Here's the shape. The left side of your second statement is one character followed by the parameter name: `?p = Point(20, 30);`"
            condition: "code_missing: 20, 30"

    quiz:
      title: "Step 1 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: |
            A function is declared `void bump(Point *p)` and its whole body is
            the single line `p = new Point(0, 0);`. The caller runs:

            ```cpp
            Point pt(7, 7);
            bump(&pt);
            pt.display();
            ```

            What gets printed, and what happens to the heap object?
          options:
            - "`(7, 7)`; the heap object is leaked"
            - "`(0, 0)`; the heap object becomes `pt`"
            - "`(7, 7)`; the heap object is freed at the closing brace"
            - "`(0, 0)`; the heap object is leaked"
          correct_index: 0
          option_feedback:
            1: "Assigning to `p` only rewrites the address the parameter holds. `pt` still lives at the old address and never gets written to, so its members keep their original values."
            2: "C++ frees local variables at the closing brace, but `new` allocates on the heap. Only a matching `delete` frees that, and there isn't one here."
            3: "The leak half is right, but not the printed half. The only thing the assignment changed was the parameter's own copy of the address."
          explanation: "The parameter is a copy of an address. Overwriting it points the local copy somewhere else and leaves the caller's object alone, and the new Point is never freed, so it leaks."
        - type: single
          difficulty: advanced
          question: |
            You want `resize` to be able to replace the caller's whole `Point`,
            and you'd rather write `resize(pt)` at the call site than
            `resize(&pt)`. Which parameter list does that?
          options:
            - "`void resize(Point &p)`"
            - "`void resize(Point p)`"
            - "`void resize(Point *p)`"
            - "`void resize(const Point &p)`"
          correct_index: 0
          option_feedback:
            1: "A by-value parameter is a copy. Replacing it replaces the copy, and the copy is thrown away when the function returns."
            2: "This one can replace the caller's object, but only through `*p`, and it forces the call site to say `resize(&pt)`, which is what the question rules out."
            3: "`const` is the problem. It makes the alias read-only, so the compiler rejects any assignment to `p` or its members."
          explanation: "A non-const reference parameter is an alias for the caller's object, so assigning to it replaces that object. And references need no `&` at the call site."
        - type: multiple
          difficulty: advanced
          question: |
            `void f(Point *p)` is called as `f(&pt)`, where the caller holds
            `Point pt(1, 1)`. Which statements inside `f` does the caller see
            after `f` returns?
          options:
            - "`p->y_ = 9;`"
            - "`*p = Point(4, 4);`"
            - "`p = new Point(4, 4);`"
            - "`Point q = *p; q.y_ = 9;`"
          correct_indices: [0, 1]
          option_feedback:
            0: "This is the most common write of all. The arrow follows the address to the caller's object before assigning, so the caller sees it."
            1: "This is the version C versus version D difference again. Dereferencing on the left side copies the new Point into the caller's object."
            2: "This only rewrites the parameter's own copy of the address. The caller's object never gets written to."
            3: "`Point q = *p;` makes a brand new local copy. Changes to `q` never travel back through `p`."
          explanation: "Only statements that go through the address change the caller's object: `p->member` and `*p` on the left side. Assigning to `p` itself, or to a copy made from `*p`, stays local."
    solution:
      files:
        - path: "cs131/param_passing.cpp"
          language: "cpp"
          content: |
            #include <iostream>
            using namespace std;

            class Point {
            public:
                Point(int x = 0, int y = 0) {
                    x_ = x;
                    y_ = y;
                }
                void display() const {
                    cout << "(" << x_ << ", " << y_ << ")" << endl;
                }

                int x_, y_;
            };

            // Version A - by value. Finished for you.
            // The caller still sees (10, 10) after this returns.
            void modify_by_value(Point p) {
                p.x_ = 50;
                p = Point(20, 30);
            }

            // Version B - by reference. `p` is a second NAME for the caller's
            // object, so both statements land on the caller's point.
            void modify_by_reference(Point &p) {
                p.x_ = 50;
                p = Point(20, 30);
            }

            // Version D - by pointer. Every assignment goes THROUGH the
            // address, so the caller sees both statements.
            void modify_by_pointer(Point *p) {
                p->x_ = 50;
                *p = Point(20, 30);
            }
      explanation: |
        Both bodies do exactly what `modify_by_value` does: set `x_`, then
        replace the whole object. The only thing that changed is how the
        parameter is declared.

        `Point &p` makes `p` an alias. There is no second object, so
        `p = Point(20, 30)` really is `pt = Point(20, 30)`.

        `Point *p` gives you a copy of an address. Both `p->x_` and `*p` follow
        that address to the caller's object, so both reach `pt`. The tempting
        wrong move is `p = new Point(20, 30)`, which only rewrites the address
        on our piece of paper. That leaves `pt` at `(50, 10)` and leaks the
        memory we allocated.

        Keep versions C and D in mind for the next two steps. Python has exactly
        one parameter passing scheme, and it behaves like one of these four.

  # =========================================================================
  # STEP 2 — The Point class in Python (HW0 problem 2a-2b)
  # =========================================================================
  # Pedagogy: PRIMM — Predict before Run. The prediction is the payoff of
  # Step 1: the student must map Python onto one of four C++ variants they
  # have just reasoned through, then run the code and find out.
  - title: "The Point Class in Python"
    backend: pyodide
    instructions: |
      ### Why this matters

      For this step we'll explore classes and parameter passing in Python to get
      a feel for how it's similar to and different from C++. As it turns out,
      Python only has a single parameter passing scheme, not three different
      approaches like C++. Python's approach is like one of C++'s approaches.
      See if you can figure out which one it uses.

      ### 🎯 You will learn to

      - Write a C++ class in Python 3.x syntax
      - Work out which C++ parameter passing scheme Python's single scheme matches

      ### From C++ to Python

      Same class, different syntax. Three things change:

      | C++ | Python | Why |
      |---|---|---|
      | `Point(int x = 0, int y = 0) { ... }` | `def __init__(self, x=0, y=0):` | The constructor has a fixed name, and the object it's working on is an explicit first parameter |
      | `x_ = x;` | `self.x_ = x` | Nothing is declared in a class body. An attribute springs into existence the first time you assign to it through `self` |
      | `public:` / `private:` | *(nothing)* | In Python, everything is public by default |

      ### ✏️ Predict before you run

      `point_lab.py` already contains the Python version of the driver from
      Step 1:

      ```python
      def modify(p):
          p.x_ = 50          # line A
          p = Point(20, 30)  # line B

      pt = Point(10, 10)
      modify(pt)
      pt.display()
      ```

      Once you've written the class and pressed **Run**, what gets printed?

      - **(a)** `(10, 10)` — like C++ version A, Python copies the object
      - **(b)** `(50, 10)` — like C++ version C, line A lands but line B doesn't
      - **(c)** `(20, 30)` — like C++ version B or D, both lines land
      - **(d)** A `TypeError` — you can't assign to a parameter in Python

      Pick a letter before you press Run, then see whether the machine agrees
      with you.

      ### 🔧 Your task

      Open **`point_lab.py`** and write an equivalent version of the Point class
      in Python 3.x syntax. Fill in `__init__` and `display`.

      - Store the coordinates as `self.x_` and `self.y_`, keeping the C++ names
        so the two files are easy to compare.
      - `display` must **print** the point, not return it, in the same format the
        C++ `display()` used: `(50, 10)`.
    files:
      - path: "point_lab.py"
        language: "python"
        content: |
          class Point:
              """Python twin of the C++ Point from Step 1."""

              def __init__(self, x=0, y=0):
                  # TODO: give this instance its two coordinates, named x_ and y_
                  pass

              def display(self):
                  # TODO: print this point in the same format as the C++ version,
                  # e.g. a point at x=50, y=10 prints as:  (50, 10)
                  pass


          def modify(p):
              p.x_ = 50          # line A
              p = Point(20, 30)  # line B


          # The Python twin of the C++ driver from Step 1.
          pt = Point(10, 10)
          modify(pt)
          pt.display()

    open_file: "point_lab.py"

    tests:
      - description: "Point stores the coordinates passed to it as x_ and y_"
        command: |
          import io, contextlib
          src = open('/tutorial/point_lab.py').read()
          ns = {}
          with contextlib.redirect_stdout(io.StringIO()):
              exec(src, ns)
          Point = ns['Point']
          p = Point(3, 4)
          assert getattr(p, 'x_', None) == 3 and getattr(p, 'y_', None) == 4, \
              f"Point(3, 4) should have x_ == 3 and y_ == 4, got x_={getattr(p, 'x_', None)!r}, y_={getattr(p, 'y_', None)!r}"
        hints:
          - text: "In Python nothing is declared ahead of time. An attribute exists on an object the moment you assign to it through `self`."
          - text: "`__init__` gets the object it's building as its first parameter. The two coordinates arrive as the second and third."
            condition: "code_missing: self.x_"
          - text: "Here's the shape. Two assignments, no `return`: `self.x_ = ...` and `self.y_ = ...`"
            condition: "code_contains: pass"
      - description: "Point() with no arguments defaults to (0, 0)"
        command: |
          import io, contextlib
          src = open('/tutorial/point_lab.py').read()
          ns = {}
          with contextlib.redirect_stdout(io.StringIO()):
              exec(src, ns)
          p = ns['Point']()
          assert getattr(p, 'x_', None) == 0 and getattr(p, 'y_', None) == 0, \
              f"Point() should default to (0, 0), got ({getattr(p, 'x_', None)!r}, {getattr(p, 'y_', None)!r})"
        hints:
          - text: "The C++ constructor said `int x = 0, int y = 0`, and the starter signature already has the Python equivalent. Make sure you assign the parameters instead of hard-coding numbers."
      - description: "display() prints the point as (x, y)"
        command: |
          import io, contextlib
          src = open('/tutorial/point_lab.py').read()
          ns = {}
          with contextlib.redirect_stdout(io.StringIO()):
              exec(src, ns)
          buf = io.StringIO()
          p = ns['Point'](3, 4)
          with contextlib.redirect_stdout(buf):
              result = p.display()
          printed = buf.getvalue()
          assert ''.join(printed.split()) == '(3,4)', \
              f"display() should print (3, 4) — got {printed!r}"
          assert result is None, "display() should print the point, not return it"
        hints:
          - text: "Compare with the C++ version. It printed a parenthesis, the x value, a comma and a space, the y value, then a closing parenthesis. Yours has to produce the same characters."
          - text: "An f-string is the cleanest way to mix attribute values in with the punctuation."
            condition: "code_missing: print("
          - text: "Here's the shape: `print(f\"({...}, {...})\")`. Fill in the two attributes."
            condition: "code_contains: print("
      - description: "Running the file prints (50, 10) — Python matches exactly one C++ variant"
        command: |
          output = __run_capture('/tutorial/point_lab.py')
          assert ''.join(output.split()) == '(50,10)', \
              f"Expected the driver to print (50, 10) — got {output!r}"

    quiz:
      title: "Step 2 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: |
            The driver prints `(50, 10)`. Which of the four C++ versions from
            Step 1 does Python's parameter passing behave like?
          options:
            - "Version C, pass by pointer, then reassign the pointer"
            - "Version A, pass by value, copying the whole object"
            - "Version B, pass by reference, an alias for the caller"
            - "Version D, pass by pointer, writing through the pointer"
          correct_index: 0
          option_feedback:
            1: "If Python had copied the object, line A would have been hidden too and we'd have seen `(10, 10)`. The 50 got through, so no copy was made."
            2: "An alias would have let line B through too, printing `(20, 30)`. Line B got lost, so `p` isn't a second name for `pt`."
            3: "Writing through a pointer gets both lines across. Line B here reassigns the local name instead of writing into the caller's object."
          explanation: "Python hands the function a copy of a reference to the object. Attribute writes travel through that reference to the caller's object, but assigning to the parameter only points the function's own name somewhere else. That's exactly what version C did."
        - type: single
          difficulty: advanced
          question: |
            Is there any way to update just line B so that Python changes the
            value of the `pt` variable through assignment in `modify()`?
          options:
            - "No, assigning to a parameter can never reach the caller's variable"
            - "Yes, write `global p` above line B first"
            - "Yes, write `p := Point(20, 30)` using the walrus operator"
            - "Yes, write `p = &Point(20, 30)` to take a reference"
          correct_index: 0
          option_feedback:
            1: "`global` applies to module-level names. `pt` is one here, but the parameter is called `p`, so this would create or reassign a module-level `p` and leave `pt` alone."
            2: "The walrus operator is still assignment. It just also produces a value, and it reassigns the local name exactly like `=` does."
            3: "Python has no address-of operator. `&` means bitwise AND between integers, so this line would raise a `TypeError`."
          explanation: "No! Python has no ability to use assignment to change a variable like `pt` from within a different function than `pt` was defined in. We can change the members of `pt` using code like `p.x_ = 50`, or return a new value and let the caller reassign, but not assignment to `p` itself."
        - type: single
          difficulty: basic
          question: |
            Back to Step 1 for a moment. C++ wrote `x_ = x;` inside the
            constructor with nothing in front of it. Why does Python need
            `self.x_ = x` instead?
          options:
            - "Without `self.`, `x_` is just a local that dies at the return"
            - "`self` is a keyword Python requires before every assignment"
            - "`self.` marks the attribute public, like C++'s `public:` label"
            - "Python needs it to allocate storage for the attribute in advance"
          correct_index: 0
          option_feedback:
            1: "`self` is an ordinary parameter name, not a keyword, and you only need it when you mean an attribute rather than a local variable."
            2: "Python has no access control to opt into. Every attribute is reachable from outside the class no matter how it was assigned."
            3: "Nothing is declared ahead of time in Python. The attribute appears the moment you first assign to it through `self`."
          explanation: "C++ member functions have an implicit `this`, so a bare `x_` finds the member. Python has no implicit `this`. A bare name is always a local variable, so you have to name the object explicitly with `self`."
    solution:
      files:
        - path: "point_lab.py"
          language: "python"
          content: |
            class Point:
                """Python twin of the C++ Point from Step 1."""

                def __init__(self, x=0, y=0):
                    self.x_ = x
                    self.y_ = y

                def display(self):
                    print(f"({self.x_}, {self.y_})")


            def modify(p):
                p.x_ = 50          # line A
                p = Point(20, 30)  # line B


            # The Python twin of the C++ driver from Step 1.
            pt = Point(10, 10)
            modify(pt)
            pt.display()
      explanation: |
        `self.x_ = x` inside `__init__` is what brings the attribute into
        existence. There's no declaration anywhere, and no `public:` either,
        because in Python everything is public by default.

        The output is `(50, 10)`, just like our result in version C, which means
        that Python uses pointers to pass values to functions! In Python we call
        these pointers "object references", but they're nearly identical to
        pointers in C++. Following the reference with `p.x_ = 50` reaches the
        caller's object. Assigning a whole new object to `p` does not.

  # =========================================================================
  # STEP 3 — Object references and rebinding (HW0 problem 2c)
  # =========================================================================
  # Pedagogy: productive failure (Bjork) — the student is asked to write the
  # naive swap that a pass-by-reference language would allow, watch it fail,
  # and only then generalize the rule. Also spaced practice on Step 1.
  - title: "Mutation Versus Rebinding"
    backend: pyodide
    instructions: |
      ### Why this matters

      "Why didn't my function change my variable?" is the most common Python
      question we get, and it's the #1 mistake beginning Python programmers
      make. There's one rule behind all of it, and once you've written the
      broken version yourself you won't get it wrong again.

      ### 🎯 You will learn to

      - Apply the change-it versus reassign-it rule to say which changes survive a call
      - Explain why a simple `swap(a, b)` can't work in Python

      ### The rule

      A call binds the function's parameter names to the same objects the caller
      passed in. Two very different things can happen next:

      - **You change the object.** `p.x_ = 50`, `items.append(3)`, `d["k"] = 1`.
        You reach through the name to the object itself. The caller is holding
        that same object, so the caller sees the change.
      - **You reassign the name.** `p = Point(20, 30)`, `items = []`. You point
        the function's own name at a different object. The caller's name never
        moved.

      ### 🔧 Your task

      Open **`references_lab.py`** and write two functions.

      1. `swap_coords(p)` — swap one point's own `x_` and `y_` in place. The
         caller has to see the change without reassigning anything.
      2. `swap_points(a, b)` — write the naive version on purpose: the one you'd
         write in a language where parameters are aliases for the caller's
         variables. Reassign `a` and `b` to each other and nothing else. Don't
         touch their attributes.

      Writing the broken one deliberately is the point of this step. The checker
      verifies that `swap_coords` works, that `swap_points` really does attempt
      the swap, and that the caller's variables come back **unswapped**.

      ### ✏️ Predict before you run

      After `swap_coords(first)` and then `swap_points(first, second)`, what do
      the three `display()` calls print?

      <details>
      <summary>Reveal &mdash; after you have run it</summary>
      <p><code>(2, 1)</code>, then <code>(2, 1)</code> and <code>(3, 4)</code>.</p>
      <p><code>swap_coords</code> changes the object, so the change sticks.
      <code>swap_points</code> reassigns two local names that disappear at the
      <code>return</code>, so <code>first</code> and <code>second</code> in the
      caller never move. During the call, <code>a</code> and <code>b</code>
      really were pointing at the caller's objects. Python just gives you no way
      to reach back through a parameter to the caller's variable.</p>
      <p>The fix isn't a different kind of parameter, because Python doesn't have
      one. It's <code>first, second = second, first</code> at the call site, or
      having the function return the pair.</p>
      </details>
    files:
