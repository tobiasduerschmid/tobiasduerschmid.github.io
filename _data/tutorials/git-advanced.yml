title: 'Advanced Git: Debugging, History Rewriting, and Submodules'
description: Go beyond the basics — master detached HEAD, git's object model, stash, cherry-pick, blame, bisect, rebase (including interactive), squash merge, and submodules. Every step is grounded in a real scenario you will meet on the job.

# Authoring-time Bloom-verb objectives. Not yet rendered to students.
learning_objectives:
  - "Predict what a given Git command does to the commit DAG before running it."
  - "Apply `git stash`, `cherry-pick`, `bisect`, `rebase`, `revert`, and `submodule` commands to debug and rewrite history safely."
  - "Recover 'lost' work using `git reflog` — and explain why no commit is truly lost without a force-push."
  - "Evaluate when to use `revert` (safe, additive) vs. history-rewriting commands (rebase, reset, amend) on shared branches."
  - "Use submodules to compose repos and update submodule references without losing the parent's pin."

backend: v86
require_tests: true
autosave_type: commands-and-files
reset_type: commands
git_graph: /tutorial/myproject
git_gutter: true  # +/-/~ markers in the editor gutter vs HEAD
setup_commands:
- "echo 'export LANG=C.UTF-8' >> ~/.bashrc\necho 'export LESSCHARSET=utf-8' >> ~/.bashrc\nexport LANG=C.UTF-8\nexport LESSCHARSET=utf-8\ngit config --global user.email 'diligent-student@cs.ucla.edu'\ngit config --global user.name 'Soon-to-be Git Hero'\ngit config --global init.defaultBranch main\ngit config --global advice.detachedHead false\ngit config --global protocol.file.allow always\n# Git opens nano (not busybox vi) whenever it needs a commit message.\ngit config --global core.editor nano\n# Pre-build a small calculator repo (idempotent via sentinel).\n# Two commits on `main`, one on a `feature-divide` branch —\n# enough history to explore pointers, detached HEAD, etc.\ncd /tutorial\nif [ -d myproject/.git ] && git -C myproject log main --oneline 2>/dev/null | grep -q 'Add add function'; then\n  exit 0\nfi\nrm -rf myproject\ngit init -q myproject\ncd myproject\necho '\"\"\"A simple calculator module.\"\"\"' > calculator.py\ngit add calculator.py\ngit commit -qm 'Initial commit'\necho 'def add(a, b): return a + b' >> calculator.py\ngit commit -qam 'Add add function'\ngit switch -qc feature-divide\necho 'def divide(a, b): return a / b' >> calculator.py\ngit commit -qam 'Add divide function'\ngit switch -q main\n"
steps:
# Pedagogy: PRIMM — Predict and Investigate (lift the hood on the data model)
- title: Branches, HEAD, and Detached HEAD
  view: git_graph
  instructions: |
    ### 🎯 You will learn to
    - **Explain** why branch creation is O(1) — no files get copied.
    - **Tell** attached from detached HEAD by reading `.git/HEAD`.
    - **Anticipate** where orphaned commits come from, setting up the reflog rescue.

    <details markdown="1"><summary>📚 The 15-step arc (open once, then close)</summary>

    | Phase | Steps | What you build |
    |---|---|---|
    | **Foundations** | 1–3 | Mental model: branches are pointers; commits are immutable hashed snapshots |
    | **Daily tools** | 4–7 | Stash, cherry-pick, blame, bisect — used weekly on real teams |
    | **History rewriting** | 8–11 | Rebase, interactive rebase, squash-merge, revert — when to use each |
    | **Submodules** | 12–14 | Nested repos, the gitlink, six-step publish ceremony |
    | **Capstone** | 15 | Compose 5+ tools under pressure with no hand-holding |

    Steps 1–3 are foundational — every later step refers back. After Step 7, take a break before Step 8 (spacing helps consolidation).

    </details>

    ### Why this matters

    You already know `init`, `add`, `commit`, `branch`, `merge`, remotes.
    This tutorial lifts the hood — object database, refs, HEAD — so every
    "scary" command becomes a safe, predictable pointer move.

    Two antipatterns to retire on sight:

    | Antipattern | What it looks like |
    |---|---|
    | **Blind-testing** | Typing random `add/commit/push/pull` permutations until errors stop |
    | **Burning down the repo** | Deleting the folder, copying files out, re-cloning, force-pushing |

    Both come from an inaccurate mental model. Each step fixes one piece.

    ### Habits from prior tools that mislead in Git

    If you came to Git from a Google Docs "save = commit" mental model, or a GUI-build-in IDE, 
    retire these instincts before they bite:

    | Bad instinct | Why Git breaks it | Right reflex |
    |---|---|---|
    | "`git pull` is always safe" | `git pull` is `git fetch` plus an integration step. When you and the remote both have new commits, current Git stops ("Need to specify how to reconcile divergent branches") until you choose merge or rebase, and either choice can conflict. | `git fetch`, inspect with `git log`, then integrate on purpose: `git pull --rebase` on your own branch, `git pull --no-rebase` to merge |
    | "Force-push is fine on my own branch" | Other people may have based work on yours, or CI may have tagged commits. Force-push rewrites history, breaking everyone downstream. | `git push --force-with-lease` *and* coordinate before doing it on a shared branch — never on `main`. |
    | "Save = commit" (from auto-saving IDEs) | A commit is a *snapshot* with author + message; once pushed, it stays in shared history. Filling history with `update`, `wip`, `oops` pollutes blame and bisect for the rest of the repo's life. | Commit *meaningful* units with descriptive messages. Use `git stash` for in-progress work. |
    | "If something goes wrong, just delete the folder and re-clone" | Committed work survives almost anything short of deleting `.git`, but uncommitted edits don't: `git restore` and `git reset --hard` discard them for good. Re-cloning teaches you nothing — you'll hit the same problem next time. | `git reflog` is your safety net for commits (Step 2). Commit or stash before risky commands. |

    The rest of this tutorial assumes you've internalized these. If any feel like brand-new ideas, slow down here before continuing.

    ### Prerequisite self-check

    Answer from memory. Any shaky? Revisit the basic tutorial.

    1. New file is red in `git status`. State name? Command to green?
    2. After a commit + one more edit, what does bare `git diff` compare?
    3. `main` and `feature` have diverged. Can `merge feature` fast-forward?
    4. Teammate pushed a buggy commit to shared `main`. `reset --hard + force-push`, or `revert`?
    5. Staged a `.env` with secrets. Does adding to `.gitignore` now help?

    <details markdown="1"><summary>Expected answers</summary>

    1. **Untracked** → `git add` stages it.
    2. **Working tree vs. index.** Index matches HEAD (nothing staged), so you see unstaged edits.
    3. **No** — diverged branches need a merge commit with two parents.
    4. **`git revert`.** Additive; doesn't break teammates' clones.
    5. **No.** `.gitignore` only blocks *future* tracking. Use `git rm --cached` + rotate the secret.

    </details>

    ### Task 1: What is a branch internally?

    Git stores all data in files inside the `.git` folder. 
    The branch `main` is stored in `.git/refs/heads/main`.
    **Predict first:** what's inside the file `.git/refs/heads/main`? A commit list? A snapshot?

    ```bash
    cat .git/refs/heads/main
    cat .git/refs/heads/feature-divide
    cat .git/HEAD
    ```

    Each branch file is **one line** — a commit hash (aka commit SHA). `HEAD` is
    `ref: refs/heads/main` — a pointer to a pointer.

    ```gitgraph
    @startuml
    branch main:
      A "Initial commit"
      B "Add add function"
    head main
    @enduml
    ```

    That indirection lets `commit` advance the branch pointer while `HEAD`
    auto-follows — no HEAD rewrite needed.

    ### Task 2: Detach HEAD and feel the difference

    ```bash
    git switch --detach HEAD~1
    cat .git/HEAD        # now a raw SHA, not a ref
    ```

    **Detached HEAD** = HEAD pinned to a commit, not a branch. Watch the
    graph: HEAD floats on the commit node itself.

    > **Museum-archive analogy.** You can read any document, but notes
    > left without a label have nowhere to go when you leave.
    > `git switch -c <name>` is that label.

    Any commit you make here is anchored to nothing. `git switch`ing away
    orphans it. The next step shows how to rescue orphans.

    ### Cleanup

    ```bash
    git switch main
    ```
  solution:
    commands:
    - git switch --detach HEAD~1
    - git switch main
    explanation: |
      - **Branch = 41-byte pointer file:** `.git/refs/heads/main` literally contains one line — the commit SHA. No file copies, no timeline duplication. Creating a branch is a single `fwrite()`.
      - **HEAD = symbolic reference:** `.git/HEAD` contains `ref: refs/heads/main`, not the commit SHA directly. That indirection lets `git commit` update the branch pointer while `HEAD` follows automatically.
      - **Detached HEAD:** `HEAD` holds a raw SHA rather than a ref. Any commits made here are reachable only from `HEAD` — once you move `HEAD`, they are orphaned. The rescue tool (`git reflog`) is the subject of the next step.
  tests:
  - description: HEAD was detached onto a commit during this step
    command: |
      cd /tutorial/myproject
      # A checkout whose target is not a branch name left HEAD detached.
      { git for-each-ref --format='B %(refname:short)' refs/heads
        git reflog --format='%gs' | sed -n 's/^checkout: moving from .* to /T /p'
      } | awk '$1 == "B" { branch[$2] = 1; next } $1 == "T" && !($2 in branch) { found = 1 } END { exit !found }'
    hints:
    - title: Detach HEAD onto a commit
      text: 'Task 2 moves `HEAD` onto a commit instead of a branch. `git switch --detach` accepts any commit reference, for example the parent of `main`.'
    - title: What this check reads
      text: 'While detached, `cat .git/HEAD` prints a raw SHA instead of `ref: refs/heads/main`. The check finds that detour in `git reflog`, so it still passes after you switch back.'
  - description: Back on main (HEAD attached to a branch again)
    command: cd /tutorial/myproject && git symbolic-ref -q HEAD | grep -q 'refs/heads/main'
    hints:
    - title: Re-attach HEAD to main
      text: '`git switch main` re-attaches HEAD. Afterwards `cat .git/HEAD` prints `ref: refs/heads/main` again.'
    - title: Committed while detached?
      text: 'If you made a commit while detached, give it a branch first (`git switch -c rescue`), then switch back to `main`. Step 2 shows how to rescue commits you have already left behind.'
  quiz:
    title: "Step 1 — Knowledge Check"
    min_score: 0.8
    shuffle: true
    questions:
    - question: What is a Git branch, physically speaking?
      options:
      - A full copy of all project files, stored under `.git/branches/`
      - A small file in `.git/refs/heads/` with one SHA
      - A separate network connection to a remote server
      - A compressed archive of your working directory
      correct_index: 1
      option_feedback:
        0: This answer treats a branch like a folder copy — branch creation never duplicates files; only one ref file is written.
        2: This answer confuses a branch with a remote; branches are local refs in `.git/refs/heads/`, not network connections.
        3: This answer treats a branch like a backup archive rather than a single-line pointer file.
      explanation: A branch is just a tiny file holding a SHA. That is why `git switch -c new-branch` is instantaneous — Git does not copy files, it writes one line of text.
    - question: Which statements about **Detached HEAD** state are true? (Select all that apply)
      type: multiple
      options:
      - '`HEAD` points directly to a commit hash instead of a branch name'
      - Any commit you make in detached HEAD is automatically saved to the nearest branch
      - Commits made here are orphaned unless you anchor them with a branch before leaving
      - '`.git/HEAD` contains a commit SHA rather than a line like `ref: refs/heads/main`'
      correct_indices:
      - 0
      - 2
      - 3
      option_feedback:
        1: This answer assumes Git auto-anchors detached-HEAD commits to a branch — it doesn't, which is the whole reason orphans happen.
      explanation: Detached HEAD stores a raw SHA in `.git/HEAD`. No branch tracks commits made here. Before leaving, create a branch (`git switch -c rescue`) — otherwise the commits become orphaned and the next step's reflog is your recovery path.
    - question: Why can `HEAD` point to a branch name rather than a commit SHA?
      options:
      - Branch names are shorter and easier to type
      - Commits then move only the branch ref, not HEAD
      - Git requires it for compatibility with GitHub
      - It stops commits landing on the wrong branch
      correct_index: 1
      option_feedback:
        0: This answer mistakes ergonomics for mechanism — the indirection exists so commits can update the branch ref without rewriting HEAD.
        2: This answer assumes a remote constraint drives a local design decision; symbolic refs predate any hosting service.
        3: This answer treats indirection as a safety feature; it's actually a mechanism for cheap commits, not a guard rail.
      explanation: The pointer chain is `HEAD → refs/heads/branch → commit`. A commit only needs to rewrite the branch file — HEAD dereferences through it. This indirection is the engineering reason branches are cheap.
    - question: You want to inspect a commit from last week without risking any accidental edits. Which is the safest approach?
      options:
      - '`git switch --detach <old-sha>`, then `git switch main`'
      - '`git reset --hard <old-sha>` — rewinds your current branch to that point'
      - '`git checkout <old-sha> .` — overwrite files in working directory'
      - '`rm -rf .git && git clone <old-sha>` — start fresh'
      correct_index: 0
      option_feedback:
        1: This answer confuses inspection with rewinding — `reset --hard` mutates the current branch's pointer, the opposite of read-only inspection.
        2: This answer overwrites working-tree files without moving HEAD; not destructive to history but stomps your editor state.
        3: This answer is the "burning down the repo" antipattern — far more destructive than the read-only detached HEAD it replaces.
      explanation: '`git switch --detach` enters read-only-feeling detached HEAD at any commit. You can look around freely; `git switch main` returns you unchanged. `git reset --hard` would rewrite your current branch — destructive. `git checkout <sha> .` overwrites files without moving HEAD.'
    # Apply-level: students must reason from the "branches are 41-byte pointers"
    # concept to a quantitative scenario. Every wrong answer maps to a specific
    # broken mental model (file copy, merge-time penalty, pre-commit cost).
    - question: 'Your project is 500 MB on disk (working tree + history). You create 50 new branches, all pointing at the same commit, without making any commits. Roughly how much *additional* disk space does Git use?'
      options:
      - About 50 × 500 MB = 25 GB — each branch is a full snapshot
      - About 50 × 500 MB = 25 GB at merge time, copy-on-write until then
      - About 2 KB — 50 one-line ref files of 41 bytes each
      - About 50 × the average commit size — Git makes a fresh commit per branch
      correct_index: 2
      option_feedback:
        0: This answer treats a branch like a folder copy — the very mental model this step exists to retire. `git branch` writes one line; nothing is duplicated.
        1: This answer invents a copy-on-write scheme; Git never copies files for branches, with or without merging.
        3: This answer assumes `git branch` creates a commit — it doesn't. Branch creation only writes one tiny ref file; the commit object is shared across all branches that point at it.
      explanation: 'Each branch is a single text file in `.git/refs/heads/` containing one 40-character SHA + newline = 41 bytes. 50 branches × 41 bytes ≈ 2 KB. Same commit object, same trees, same blobs — only the *pointers* multiply. This is why teams can keep hundreds of feature branches without storage concerns, and why `git switch -c` is instantaneous on a multi-GB repo.'
# Pedagogy: PRIMM — Predict + Investigate (productive failure: lose work, then recover it)
- title: "Rescuing Lost Work with git reflog"
  view: git_graph
  instructions: |
    ### Why this matters

    The fear of "losing commits" is what drives blind-testing and the burning-down-the-repo antipattern. Once you've used `git reflog` to rescue an orphaned commit yourself, that fear vanishes and you stop padding workflows with WIP commits "just in case". Reflog is the safety net that makes later history rewrites (rebase, amend, `reset` to an older commit) recoverable — for committed work. Uncommitted edits have no such net.

    ### 🎯 You will learn to
    - **Recover** commits lost to bad rebases, hard resets, and detached-HEAD orphans.
    - **Tell** what `git log --all` can see from what `git reflog` can see.
    - **Know reflog's limits** — it covers commits only, stays local, and disappears with the clone.

    ### 🤔 Predict first

    You make an experimental commit in detached HEAD, then `git switch main`
    away without creating a branch. Can `git log --all` find that commit?
    Can anything?

    ### `log --all` vs `reflog` — the load-bearing distinction

    | Question | `git log --all` | `git reflog` |
    |---|---|---|
    | Walks | Commits reachable from refs | Every position HEAD occupied |
    | Sees orphans? | No (unreachable = invisible) | Yes (reachability irrelevant) |
    | Shared across clones? | Yes | **No — local only** |

    ### Task 1: Deliberately lose work

    ```bash
    cd /tutorial/myproject
    git switch --detach HEAD
    echo "# experimental note" >> calculator.py
    git add calculator.py && git commit -m "Experimental: add note in detached HEAD"
    git switch main
    git log --all --oneline      # the Experimental commit is GONE from this view
    ```

    It's orphaned — no ref reaches it, so `log --all` walks right past.

    ### Task 2: Find the orphan

    ```bash
    git reflog
    ```

    Each line: `<sha>  HEAD@{n}: <action>: <description>`.

    | Expression | Meaning |
    |---|---|
    | `HEAD@{0}` | where HEAD is now |
    | `HEAD@{1}` | where HEAD was one move ago |
    | `HEAD@{n}` | n moves ago |

    The detached-HEAD commit is at `HEAD@{1}`.

    ### Task 3: Anchor it with a branch

    ```bash
    git branch rescued-work HEAD@{1}
    git log rescued-work --oneline
    ```

    **The universal recipe:** `git reflog` → note the SHA or `HEAD@{n}` →
    `git branch <name> <sha>` anchors it as reachable. Works for dropped
    commits after interactive rebase, botched resets, failed rebases —
    any "lost" commit that's still in `.git/objects`.
  setup_commands:
  - cd /tutorial/myproject
  - git switch -q main 2>/dev/null; true
  - git branch -D rescued-work 2>/dev/null; true
  solution:
    commands:
    - cd /tutorial/myproject
    - 'git show-ref --verify --quiet refs/heads/rescued-work || (git switch --detach HEAD && echo ''# experimental note'' >> calculator.py && git add calculator.py && git commit -m ''Experimental: add note in detached HEAD'' && git switch main)'
    - 'git show-ref --verify --quiet refs/heads/rescued-work || (EXP_SHA=$(git reflog | grep -m1 ''Experimental: add note'' | awk ''{print $1}'') && git branch rescued-work $EXP_SHA)'
    explanation: |
      - **`git log --all` vs `git reflog`:** the former walks the commit graph from every ref; the latter keeps a local diary of every HEAD position. Only reflog sees orphans.
      - **Reflog recovery recipe:** `git reflog` → copy the target SHA or use `HEAD@{n}` → `git branch <name> <sha>` anchors the orphan as a reachable commit.
      - **`HEAD@{n}` syntax:** "where HEAD was n movements ago." Works anywhere Git expects a commit ref — no SHA copy-pasting needed.
      - **Local only:** reflog lives in `.git/logs/HEAD`. Destroying a clone destroys its reflog. Unpublished work is only protected by backups, not by Git itself.
  tests:
  - description: Currently on main branch (not detached)
    command: cd /tutorial/myproject && git symbolic-ref -q HEAD | grep -q 'refs/heads/main'
    hints:
    - title: Return to main after the rescue
      text: 'Still detached? `git switch main` re-attaches HEAD. The `rescued-work` branch you created stays where it is.'
    - title: Check where HEAD points
      text: '`git status` should say "On branch main", and `cat .git/HEAD` should print `ref: refs/heads/main`, not a raw SHA.'
  - description: rescued-work branch exists and points to an experimental commit (proves reflog rescue)
    command: cd /tutorial/myproject && git log rescued-work --oneline 2>/dev/null | grep -qi 'experimental'
    hints:
    - title: Anchor the orphan with a branch
      text: 'You need a branch named `rescued-work` whose tip is the "Experimental" commit. `git log --all` no longer shows that commit, but the reflog still lists it.'
    - title: Read the reflog entry
      text: 'In `git reflog`, find the line whose message mentions "Experimental: add note". Its SHA, or its `HEAD@{n}` position, is the start point for `git branch rescued-work <start-point>`.'
    - title: Anchored the wrong commit?
      text: 'If `git log rescued-work --oneline` does not show the experimental commit, delete the branch (`git branch -D rescued-work`) and create it again from the SHA whose reflog message mentions "Experimental".'
  quiz:
    title: "Step 2 — Knowledge Check"
    min_score: 0.8
    shuffle: true
    questions:
    - question: You made three commits in detached HEAD state, then ran `git switch main` without creating a branch. A teammate asks if the commits are lost. What do you tell them?
      options:
      - Yes, they are permanently gone — detached HEAD commits are deleted by `git switch`
      - 'Not lost: `git reflog` still lists them, and `git branch` can anchor them'
      - Git automatically migrated them to the `main` branch when we switched
      - They are stored in a hidden recovery folder we can copy from
      correct_index: 1
      option_feedback:
        0: This answer assumes `git switch` deletes data — it only moves HEAD; the commit objects stay in `.git/objects/` until `git gc` decides to prune them.
        2: This answer assumes Git auto-attaches detached commits to a branch on switch — it doesn't, which is exactly why we need the rescue.
        3: This answer invents a recovery folder that doesn't exist; orphans live in the same `.git/objects/` as every other commit.
      explanation: Orphaned commits remain in `.git/objects/` until `git gc` prunes them. `git reflog` shows every position HEAD has been at, including the orphaned one. `git branch rescue <sha>` rescues the work.
    - question: In one sentence, why can `git reflog` show commits that `git log --all` cannot?
      options:
      - '`log --all` follows refs; `reflog` logs every HEAD position'
      - '`git reflog` is a newer, more powerful version of `git log`'
      - '`git log --all` is broken by default'
      - '`reflog` reads the remote; `log` reads only local'
      correct_index: 0
      option_feedback:
        1: This answer treats reflog as "log v2" — they're different tools answering different questions (graph traversal vs. HEAD-position diary).
        2: This answer assumes a default tool is broken; both work correctly, they differ only in *what* they walk.
        3: This answer confuses reflog with remote history; reflog is purely local, while `log --all` walks any ref including remote-tracking ones.
      explanation: This is the load-bearing distinction. `git log --all` is a graph traversal starting at refs; an unreachable commit is invisible to it. `git reflog` is a literal diary of HEAD positions — reachability is irrelevant. An orphan is reachable from no ref but still recorded in the reflog as a past HEAD position, so its SHA is recoverable. Internalize this or later destructive commands will feel unpredictable.
    - question: What does `HEAD@{2}` mean?
      options:
      - The second commit on the current branch
      - Where HEAD was two moves ago
      - The second parent of HEAD (like `HEAD^2`)
      - A tag named `HEAD@{2}`
      correct_index: 1
      option_feedback:
        0: This answer confuses `HEAD@{2}` (a reflog position) with `HEAD~2` (a parent walk along commit history).
        2: This answer confuses `HEAD@{2}` with `HEAD^2` — three similar-looking suffixes (`~`, `^`, `@{}`) all mean different things.
        3: This answer treats `@{n}` as part of a name rather than reflog syntax.
      explanation: '`HEAD@{n}` is reflog syntax — n movements back in the HEAD-position log. Different from `HEAD~n` (n commits back along first-parent chain) and `HEAD^n` (nth parent of HEAD). Three similar-looking but semantically different suffixes — get them wrong and you will end up at a different commit than you intended.'
    - question: Reflog is **local only**. Which of these destroys your reflog and the rescue path with it? (Select all that apply)
      type: multiple
      options:
          ["Deleting the original .git directory or the whole original clone","Cloning the same remote into a separate new directory while keeping the original clone","git push --force to a remote","Expiring the relevant local reflog entries with git reflog expire"]
      correct_indices:
        [0,3]
      option_feedback:
          {"1":"A separate clone has its own reflog and does not delete the original clone or its reflog.","2":"Force-push changes remote refs; it does not delete the local reflog."}
      explanation: "Reflogs are local. Deleting the original repository removes its reflogs, and expiry can remove the entries you need. A new clone does not copy those entries, but it also does not destroy the original. Recovering an old commit still requires its object to exist; reflog expiry and object pruning are separate operations."
- title: Relative Commit Addresses & Git's Object Database
  view: git_graph
  instructions: |
    ### Why this matters

    Step 3 is the conceptual hinge of the whole tutorial. Every later command (rebase, cherry-pick, bisect, submodules) becomes obvious *or* mysterious depending on whether the snapshot-and-hash object model clicks here. Naming commits with `HEAD~n` and `BRANCH^` is the daily-driver vocabulary; proving content-addressability with your own hands is what cements the mental model so the rest of the tutorial sticks.

    ### 🎯 You will learn to
    - **Name any commit without a SHA** using `HEAD~n`, `BRANCH^`, and `rev-parse`.
    - **Prove Git's history model is snapshot-based** — commits point to trees that point to blobs holding full file bytes — by hashing content directly.
    - **Predict** that one changed byte gives a new blob SHA, while every existing commit keeps its SHA.

    ### 🚪 This is the threshold step

    Step 3 is the conceptual hinge of the whole tutorial. Every later
    step (rebase, cherry-pick, bisect, submodules) becomes obvious *or*
    mysterious depending on whether the object model clicks here.

    If it doesn't click on the first read, that's expected — threshold
    concepts (Meyer & Land) are *transformative* (they reframe the whole
    domain) and *troublesome* (they resist quick mastery). Re-read,
    re-run the hashing experiment, sleep on it. Most learners need two
    passes. The recall prompt at the bottom is your self-check.

    ### Relative references

    | Expression | Meaning |
    |---|---|
    | `HEAD~n` | n commits back along first-parent chain |
    | `BRANCH^` | shorthand for `BRANCH~1` |
    | `BRANCH^2` | **second** parent of a merge commit |

    ```gitgraph
    @startuml
    branch main:
      A "Oldest commit"
      B "main~2"
      C "HEAD~1"
      D "HEAD / main"
    head main
    @enduml
    ```

    ### Task 1: Practice

    ```bash
    cd /tutorial/myproject
    git rev-parse HEAD        # current SHA
    git rev-parse HEAD~1      # parent
    git rev-parse main        # same as HEAD
    ```

    Now create a branch named `parent-of-main` that points at `main`'s
    parent. Name the commit with a relative reference from the table, not
    a copied SHA.

    ### Task 2: Prove content-addressability

    Every object in `.git/objects/` is **addressed by the SHA-1 of its
    content**. Three object kinds:

    | Object | Stores |
    |---|---|
    | **blob** | Raw file bytes (no filename) |
    | **tree** | Directory: filename → blob/tree SHA |
    | **commit** | Tree SHA + parent SHAs + author + message |

    Hash the same bytes in two unrelated repos:

    ```bash
    echo "hello world" | git hash-object -w --stdin   # -w also stores the blob here
    git cat-file -p <that-sha>                         # read it back by its address
    cd /tmp && git init -q bob-repo && cd bob-repo
    echo "hello world" | git hash-object --stdin
    cd /tutorial/myproject
    ```

    **Identical SHA.** Same bytes → same hash, always, everywhere.
    That's why Git deduplicates across branches and history for free.

    ### Task 3: Byte-exact means byte-exact

    **Predict:** hashing `"hello world "` with one trailing space — same SHA?

    ```bash
    printf 'hello world \n' | git hash-object --stdin
    ```

    **Different.** One whitespace byte → a new blob SHA. Committing it
    would also create a new tree and a new commit, but every existing
    commit keeps its SHA: Git adds objects, it never edits old ones.
    (Step 6 shows the side effect for `blame`: a whitespace-only commit
    becomes the last commit to touch every line it reformatted.)

    ### ✍️ Before moving on (the unifying invariant)

    Close this and answer from memory:

    > *"What's the one property of existing commit objects that lets every later step in this tutorial work?"*

    <details markdown="1"><summary>The invariant (peek only after attempting)</summary>

    **Existing commit objects are immutable.** Git changes history by
    creating new objects and/or moving references — never by editing old
    commits in place.

    Every Git command falls into one of these operation categories:

    | Operation type | Examples | What changes |
    |---|---|---|
    | **Create immutable objects** | `hash-object`, `commit`, `stash`, `cherry-pick`, `revert` | New blob / tree / commit objects |
    | **Move refs** | `branch`, `reset`, fast-forward `merge`, finalizing a successful `rebase` | Branch / ref points to a different commit |
    | **Update index** | `add`, conflicted-resolution staging, `merge --squash` | Staging area changes |
    | **Update working tree** | `switch`, `restore`, `checkout`, `stash pop`, `submodule update` | Files on disk change |
    | **Transfer objects/refs** | `fetch`, `push`, `pull` | Local/remote object/ref sets change |

    Most everyday commands combine categories (e.g., `commit` creates a
    commit object **and** moves a branch ref **and** leaves the index matching the new commit).
    The point isn't that operations are pure — it's that *no operation
    rewrites existing commit objects*. Whenever a later step feels
    confusing, ask: *what objects is this creating? what refs is it
    moving? what's still in `.git/objects` that I could recover?*

    </details>
  setup_commands:
  - cd /tutorial/myproject && git switch main 2>/dev/null; true
  solution:
    commands:
    - cd /tutorial/myproject
    - git branch -f parent-of-main main~1
    - echo "hello world" | git hash-object -w --stdin
    explanation: |
      - **`HEAD~n`:** n commits back along the first-parent chain. `HEAD~0` is HEAD itself, `HEAD~1` is its parent, `HEAD~2` its grandparent. `HEAD^` is equivalent to `HEAD~1`. For a merge commit, `HEAD^2` accesses the *second* parent (the merged-in branch tip).
      - **`git rev-parse`:** Converts any ref (relative, symbolic, short SHA) into a full SHA. Plumbing-level tool used internally by nearly every porcelain command.
      - **`git hash-object`:** Computes the SHA Git would assign to content. Feeding the same bytes always produces the same hash — that is what makes Git content-addressable.
      - **Why it matters:** Every advanced command later (rebase, cherry-pick, bisect) is just moving ref pointers across this immutable object graph. Once you see commits as *hashed snapshots*, not *edits*, nothing in Git is mysterious.
  tests:
  - description: A branch named parent-of-main points at main's parent
    command: |
      cd /tutorial/myproject
      [ "$(git rev-parse -q --verify refs/heads/parent-of-main)" = "$(git rev-parse main~1)" ]
    hints:
    - title: Name the parent without a SHA
      text: 'Which suffix in the relative-references table walks one commit back along the first parent?'
    - title: Branches accept any start point
      text: '`git branch <name> <start-point>` creates a branch at whatever commit `<start-point>` names: a SHA, a branch, or a relative reference built from `main`.'
    - title: Compare with the log
      text: '`git rev-parse parent-of-main` should match the second line of `git log --oneline main`. If it doesn''t, delete the branch (`git branch -D parent-of-main`) and create it again.'
  - description: The "hello world" blob is stored in myproject's object database
    command: |
      cd /tutorial/myproject
      sha=$(printf 'hello world\n' | git hash-object --stdin)
      [ "$(git cat-file -t "$sha" 2>/dev/null)" = blob ]
    hints:
    - title: Hashing alone stores nothing
      text: 'Plain `git hash-object --stdin` only prints the address. Task 2 adds `-w`, which also writes the blob into this repo''s `.git/objects`.'
    - title: Run it inside myproject
      text: 'Run the `-w` command from `/tutorial/myproject`, not from `/tmp/bob-repo`, then read the blob back with `git cat-file -p <sha>`.'
  quiz:
    title: "Step 3 — Knowledge Check"
    min_score: 0.8
    shuffle: true
    questions:
    - question: You want the commit **two before** `main`. Which reference is correct?
      options:
      - '`main^2`'
      - '`main~2`'
      - '`main-2`'
      - '`main..2`'
      correct_index: 1
      option_feedback:
        0: This answer confuses `^2` (the second parent of a merge) with `~2` (two commits back along the first-parent chain).
        2: This answer invents a syntax — Git uses `~` and `^`, never `-` for relative addressing.
        3: This answer confuses `..` (a range expression) with single-commit addressing.
      explanation: '`main~2` walks back 2 commits along the first-parent chain. `main^2` means the *second parent* of a merge commit — completely different. `main-2` and `main..2` are not valid syntax.'
    - question: What does `git hash-object` do?
      options:
      - Uploads the file to GitHub
      - Computes the object SHA for that content
      - Encrypts the file with a hash
      - Compresses the file for storage
      correct_index: 1
      option_feedback:
        0: This answer confuses a local plumbing command with a network operation; `hash-object` never touches a remote.
        2: This answer confuses cryptographic hashing (one-way fingerprint) with encryption (reversible).
        3: This answer confuses content hashing (identity) with compression (size reduction).
      explanation: '`git hash-object` is the low-level plumbing that every commit uses internally. Because identical content always yields the same SHA, Git deduplicates identical files across the entire history for free.'
    - question: Which statements about Git objects are true? (Select all that apply)
      type: multiple
      options:
      - A commit object stores a reference to a tree, not the files themselves
      - A blob stores file content without the filename
      - Trees map filenames to blob or sub-tree SHAs
      - Git stores file differences (deltas) between commits, not full snapshots
      correct_indices:
      - 0
      - 1
      - 2
      option_feedback:
        3: This answer confuses Git's snapshot-based history *model* with its later pack-file *storage* layer; delta compression is a storage optimization, not the model.
      explanation: 'Git''s **history model is snapshot-based**: each commit points to a tree, which points to blobs holding full file content. Storage may later be packed and delta-compressed (`git gc` produces pack files using delta encoding) without changing the model — the abstraction commits expose is always whole snapshots. Filenames live in tree objects, not in blobs, so two files with identical content share one blob.'
    - question: 'You are in detached HEAD at a commit that is 4 back from `main`. Which command prints only that commit''s SHA, without copying it from `git log`?'
      options:
      - '`git rev-parse main~4`'
      - '`git log main --limit 4`'
      - '`git checkout main~4`'
      - '`git show main~4`'
      correct_index: 0
      option_feedback:
        1: This answer invents a flag — `git log` uses `-n` or `--max-count`, not `--limit`.
        2: This answer moves HEAD instead of just printing the SHA; the prompt asked for the SHA without checkout.
        3: This answer prints the whole commit and its diff, not just the SHA; `git show` displays a commit rather than resolving a name.
      explanation: '`git rev-parse` is the universal ''ref → SHA'' translator. It accepts relative (`main~4`), symbolic (`main`), short (`a73f`), or branch/tag references. `git show` displays the full commit diff, not just the SHA. `git log --limit` is not valid syntax.'
    - question: Why does `git branch feature` complete in milliseconds even on a 10-GB repo?
      options:
      - Git compresses the whole working directory in parallel
      - It writes one small ref file; nothing is copied
      - Branches are stored on the remote server, not locally
      - Git skips adding the branch until you commit to it
      correct_index: 1
      option_feedback:
        0: This answer assumes branch creation involves heavyweight work; it's just a `fwrite()` of 41 bytes — no traversal, no compression.
        2: This answer confuses local branches with remote refs; local branch creation is purely local and offline-capable.
        3: This answer assumes lazy initialization; the branch is created and ready immediately, no commit required.
      explanation: A branch creation is a single `fwrite()` of 41 bytes. No copying, no traversal, no network. Once you see branches as tiny pointer files, their speed and cheapness stops being mysterious.
    - question: 'You enter detached HEAD at an old commit, make one exploratory commit, and switch away without creating a branch. In terms of Git objects, what happens to that commit?'
      options:
      - Git deletes the commit object immediately on switch
      - It stays in `.git/objects`, unreachable; `gc` may prune it later
      - The commit is moved into a `.git/orphans` directory for recovery
      - The commit is downgraded to a blob without parent or message
      correct_index: 1
      option_feedback:
        0: This answer assumes Git is eager about cleanup; objects survive until `git gc` decides to prune unreachable ones.
        2: This answer invents a `.git/orphans` directory; orphans live in the same `.git/objects/` as everything else.
        3: This answer assumes Git mutates the object type; commits stay commits, they just lose their refs.
      explanation: 'Objects in Git live until garbage collection. An orphaned commit is not ''deleted'' — it is just unreachable from any ref. `git reflog` still records HEAD''s path through it, which is how `git branch rescue <sha>` can rescue it. This links Step 2''s reflog safety net to Step 3''s object-model view: unreachable ≠ deleted.'
    - question: Put in order the commands that prove Git is content-addressable (same bytes → same SHA, across unrelated repos).
      type: parsons
      display: block
      lines:
      - 'sha_a=$(echo "hello world" | git hash-object --stdin)'
      - 'cd /tmp && git init -q other && cd other'
      - 'sha_b=$(echo "hello world" | git hash-object --stdin)'
      - 'test "$sha_a" = "$sha_b"'
      distractors:
      - 'git push origin main'
      - 'git config user.email alice'
      - 'git commit -m "hello"'
      explanation: Content-addressability is a property of *bytes hashed*, independent of repo, branch, or user. `git push origin main` is irrelevant — hashes are local. `git config user.email alice` affects commit objects but not blob hashes. `git commit -m "hello"` creates a commit object whose SHA depends on parent + time + author — not the cleanest demo of blob deduplication.
# Pedagogy: PRIMM — Predict + Run (mistake-based familiarization with the "stash missed my new file" trap)
- title: Saving Work Temporarily with git stash
  view: git_graph
  instructions: |
    ### Why this matters

    Mid-feature interruptions are constant on real teams: a hotfix lands, a teammate needs a reproduction, your lead asks you to switch contexts. Without `git stash`, every interruption tempts you into WIP commits or `git restore` — both leave scars in history or destroy work. Stash is the day-one daily-driver tool that lets you context-switch cleanly, and the untracked-files footgun is the most common cause of "I lost my work" tickets.

    ### 🎯 You will learn to
    - **Context-switch cleanly** mid-feature without polluting history with WIP commits.
    - **Pick** `pop` vs. `apply` correctly.
    - **Diagnose** the classic "stash missed my new file" footgun.

    ### Scenario

    You're mid-feature when your lead yells **"hotfix on main, now!"**
    Your options without stash are all bad: WIP commit (pollutes history),
    `git restore` (destroys work), or stay put (can't isolate the fix).

    `git stash` is the escape hatch.

    ### 🤔 Predict first

    After `git stash`, where does your in-progress work end up — in the
    index, in the working tree, in a private commit, or deleted? And what
    will `git status` say about your working tree?

    ### Task 1: See the dirty tree

    A half-finished `power` function is already sitting near the top of `calculator.py`:

    ```python
    def power(a, b):
        # TODO: add input validation
        return a ** b
    ```

    ```bash
    cd /tutorial/myproject
    git status
    git diff
    ```

    ### Task 2: Stash it

    ```bash
    git stash
    git status           # clean!
    git stash list       # your WIP is here
    ```

    <details markdown="1"><summary>💡 How stash works internally (Step 3 callback)</summary>

    A stash is a merge commit at `refs/stash` — first parent is HEAD at stash
    time, second parent records the index (and a third parent records untracked
    files when you use `-u`). Same object model as every other commit, which is
    why `git stash apply <sha>` works on any historical stash.

    </details>

    ### Task 3: Do the hotfix on a dedicated branch

    ```bash
    git switch -c hotfix-divide-zero
    ```

    In the editor, append a `safe_divide` function to `calculator.py`. Its
    goal: same behavior as `divide`, but raise a clear `ValueError` instead
    of letting a zero denominator crash with `ZeroDivisionError`. Skeleton:

    ```python
    def safe_divide(a, b):
        """Divide a by b, raising ValueError on zero denominator."""
        # TODO: guard the zero case, then return a / b
        ...
    ```

    ```bash
    git add calculator.py
    git commit -m "Hotfix: add safe_divide to prevent zero-division errors"
    git switch main
    git merge hotfix-divide-zero --no-edit
    git branch -d hotfix-divide-zero
    ```

    ### Task 4: Restore your WIP

    ```bash
    git stash pop
    git stash list       # empty — pop removed it
    ```

    `pop` = apply + drop. Use `apply` instead if you want to keep the stash
    (e.g. to apply it on multiple branches).

    <details markdown="1"><summary>📋 Full stash cheat sheet (other flags)</summary>

    | Command | Effect |
    |---|---|
    | `git stash` | Save tracked mods + staged; clean tree |
    | `git stash pop` | Restore **and drop** the top stash |
    | `git stash apply` | Restore but **keep** the stash |
    | `git stash drop` | Delete without applying |
    | `git stash push -m "msg"` | Save with a message |
    | `git stash -u` | Also include **untracked** files |

    **Gotcha:** plain `git stash` skips untracked (never-`add`-ed) files. Use
    `-u` to include them — the most common stash footgun.

    **Gotcha 2:** if `git stash pop` hits a conflict, Git keeps the stash
    entry. Resolve the file, `git add` it, then `git stash drop`.

    </details>

    ### Task 5: Finish the feature

    Replace the seeded `power` body with real input validation, then commit
    (message must include "power"). Goal: reject non-numeric arguments
    early with a clear `TypeError`; otherwise return `a ** b`. Skeleton:

    ```python
    def power(a, b):
        """Return a raised to the power of b."""
        # TODO: validate that a and b are numbers; raise TypeError if not
        ...
    ```
  watch_files:
  - myproject/calculator.py
  open_file: myproject/calculator.py
  setup_commands:
  - |
    cd /tutorial/myproject
    git switch -q main 2>/dev/null
    ! git stash list 2>/dev/null | grep -q . && grep -q 'def power' calculator.py && exit 0
    git stash clear -q 2>/dev/null
    if ! grep -q 'def power' calculator.py; then
      # Seed the WIP just below the module docstring, away from the end of the
      # file where the hotfix gets appended, so `git stash pop` applies cleanly.
      { head -n 1 calculator.py; printf '\ndef power(a, b):\n    # TODO: add input validation\n    return a ** b\n\n'; tail -n +2 calculator.py; } > calculator.py.tmp && mv calculator.py.tmp calculator.py
    fi
  solution:
    files:
    - path: myproject/calculator.py
      content: "\"\"\"A simple calculator module.\"\"\"\n\ndef power(a, b):\n    \"\"\"Return a raised to the power of b.\"\"\"\n    if not isinstance(a, (int, float)) or not isinstance(b, (int, float)):\n        raise TypeError(\"Arguments must be numbers\")\n    return a ** b\n\ndef add(a, b): return a + b\n\ndef safe_divide(a, b):\n    \"\"\"Divide a by b, raising ValueError on zero denominator.\"\"\"\n    if b == 0:\n        raise ValueError(\"Cannot divide by zero\")\n    return a / b\n"
      language: python
    commands:
    # The harness applies solution.files BEFORE these commands. Start from a
    # clean HEAD, then replay the real stash → hotfix → pop workflow. The WIP
    # sits below the docstring and the hotfix at the end of the file, so the
    # pop applies cleanly, as it does for learners.
    - cd /tutorial/myproject && git switch main
    - git reset --hard HEAD
    - git clean -fdq
    - while git stash list 2>/dev/null | grep -q .; do git stash drop -q 2>/dev/null || break; done
    - git branch -D hotfix-divide-zero 2>/dev/null; true
    - |
      { head -n 1 calculator.py; printf '\ndef power(a, b):\n    # TODO: add input validation\n    return a ** b\n\n'; tail -n +2 calculator.py; } > calculator.py.tmp && mv calculator.py.tmp calculator.py
    - git stash
    - git switch -c hotfix-divide-zero
    - printf '\ndef safe_divide(a, b):\n    """Divide a by b, raising ValueError on zero denominator."""\n    if b == 0:\n        raise ValueError("Cannot divide by zero")\n    return a / b\n' >> calculator.py
    - "git add calculator.py && git commit -m 'Hotfix: add safe_divide to prevent zero-division errors'"
    - git switch main && git merge hotfix-divide-zero --no-edit
    - git branch -D hotfix-divide-zero 2>/dev/null; true
    - git stash pop
    - |
      cat > calculator.py <<'PY'
      """A simple calculator module."""

      def power(a, b):
          """Return a raised to the power of b."""
          if not isinstance(a, (int, float)) or not isinstance(b, (int, float)):
              raise TypeError("Arguments must be numbers")
          return a ** b

      def add(a, b): return a + b

      def safe_divide(a, b):
          """Divide a by b, raising ValueError on zero denominator."""
          if b == 0:
              raise ValueError("Cannot divide by zero")
          return a / b
      PY
    - git add calculator.py && git commit -m 'Add power function with input validation'
    explanation: |
      - **`git stash`:** snapshots tracked modifications and staged changes into a stash commit in `.git/refs/stash`, then resets the working tree to match HEAD. Untracked files are **not** included unless you use `git stash -u`.
      - **`git stash pop`:** applies the top stash and removes it. Conflicts surface exactly like merge conflicts — resolve them, then `git add` and commit (or drop the stash manually).
      - **Why not just `git commit -m "WIP"`?** A WIP commit pollutes shared history if pushed. The stash is *private, local, and temporary* — no risk of shipping half-baked work.
      - **Internal:** a stash is stored as a merge commit reachable via `refs/stash`. Its **first parent** is HEAD at stash time; its **second parent** is a commit recording the **index** state. With `git stash -u`, a **third parent** records the untracked files. This is why `git stash apply <sha>` works even on detached stashes.
  tests:
  - description: Stash is empty (work was popped and committed)
    command: cd /tutorial/myproject && [ $(git stash list | wc -l) -eq 0 ]
    hints:
    - text: '`git stash list` still shows entries. After popping your work and committing, there should be nothing left. `git stash drop` removes stale entries.'
  - description: calculator.py contains the safe_divide hotfix
    command: cd /tutorial/myproject && grep -q 'def safe_divide' calculator.py
    hints:
    - text: 'No `safe_divide` in `calculator.py`. The hotfix lives on `hotfix-divide-zero` — after `git switch main`, merge it in (`git merge hotfix-divide-zero`).'
      condition: 'code_missing: def safe_divide'
    - text: '`safe_divide` is in the file but the test still reports it missing. Did you save and switch back to `main`?'
      condition: 'code_contains: def safe_divide'
  - description: power function was committed AFTER the hotfix (verifies the stash → hotfix → pop → commit flow really happened)
    command: |
      cd /tutorial/myproject
      if ! git log --oneline | grep -qi 'power'; then
        echo "The 'power' commit is missing from main's history. After popping your stash, did you commit?"
        exit 1
      fi
      # Pickaxe each function to find the commit that introduced it.
      hotfix_sha=$(git log --oneline -S 'def safe_divide' 2>/dev/null | head -1 | awk '{print $1}')
      power_sha=$(git log --oneline -S 'def power' 2>/dev/null | head -1 | awk '{print $1}')
      if [ -z "$hotfix_sha" ]; then
        echo "Couldn't find a commit that introduced 'def safe_divide'. The hotfix should be a separate commit."
        exit 1
      fi
      if [ -z "$power_sha" ]; then
        echo "Couldn't find a commit that introduced 'def power'."
        exit 1
      fi
      if [ "$hotfix_sha" = "$power_sha" ]; then
        echo "safe_divide and power are in the SAME commit. The stash workflow requires the hotfix to be its own commit, then power separately."
        echo "Redo: stash your power work first, do the hotfix as its own commit, merge to main, pop the stash, then commit power on top."
        exit 1
      fi
      if ! git merge-base --is-ancestor "$hotfix_sha" "$power_sha"; then
        echo "The hotfix commit ($hotfix_sha) isn't an ancestor of the power commit ($power_sha). Expected order: hotfix (safe_divide) → power (HEAD)."
        exit 1
      fi
    hints:
    - title: Bring the WIP back
      text: 'No `power` in the file: `git stash pop` brings your stashed work back.'
      condition: 'code_missing: def power'
    - title: Commit the finished feature
      text: 'If `git status` shows `calculator.py` as modified, commit the finished `power`: `git add calculator.py && git commit -m "Add power function"`.'
      condition: 'code_contains: def power'
    - title: Hotfix and feature in one commit?
      text: '`git log --oneline -S "def power"` and `git log --oneline -S "def safe_divide"` name the commits that introduced each function. If both name the same commit, redo the flow: stash `power`, commit the hotfix on its own branch, merge it, pop, then commit `power`.'
  - description: Working tree is clean
    command: cd /tutorial/myproject && git diff --quiet && git diff --cached --quiet
    hints:
    - text: 'Uncommitted changes remain. `git status` tells you what; commit or discard to finish the step.'
  - description: safe_divide and power contain the required validation logic
    # Direct post-pop forensic proof of `git stash` is not durable: Git removes
    # refs/stash and its reflog when the final entry is popped/dropped. Object
    # scans can find the dropped stash commit, but they exceed the browser VM's
    # 15s test-runner safety timer. The preceding history-order gate verifies
    # the workflow shape; this shell-only gate verifies the resulting function
    # bodies without pinning exception messages, whitespace, or one guard style.
    command: |
      cd /tutorial/myproject
      safe_body=$(awk '
        /^def[ \t]+safe_divide[ \t]*\(/ { body=""; capture=1; next }
        capture && /^def[ \t]+[A-Za-z_][A-Za-z0-9_]*[ \t]*\(/ { capture=0 }
        capture { line=$0; sub(/#.*/, "", line); body=body line "\n" }
        END { print body }
      ' calculator.py | tr -d '[:space:]')
      power_body=$(awk '
        /^def[ \t]+power[ \t]*\(/ { body=""; capture=1; next }
        capture && /^def[ \t]+[A-Za-z_][A-Za-z0-9_]*[ \t]*\(/ { capture=0 }
        capture { line=$0; sub(/#.*/, "", line); body=body line "\n" }
        END { print body }
      ' calculator.py | tr -d '[:space:]')
      case "$safe_body" in
        *'ifb==0'*'raiseValueError'*'returna/b'*|*'if0==b'*'raiseValueError'*'returna/b'*|*'ifnotb:'*'raiseValueError'*'returna/b'*|*'ifb!=0'*'returna/b'*'raiseValueError'*|*'try:'*'returna/b'*'exceptZeroDivisionError'*'raiseValueError'*) safe_ok=1 ;;
      esac
      case "$power_body" in
        *'raiseTypeError'*'returna**b'*|*'raiseTypeError'*'returnpow(a,b)'*) power_ok=1 ;;
      esac
      [ "${safe_ok:-0}" = 1 ] && [ "${power_ok:-0}" = 1 ]
    hints:
    - title: Two finished functions
      text: 'This step ends with two working pieces: the hotfix `safe_divide` and the resumed feature `power`.'
    - title: What each function must do
      text: '`safe_divide` should raise `ValueError` for a zero denominator and otherwise return `a / b`. `power` should raise `TypeError` for non-numeric inputs and otherwise return `a ** b`.'
  quiz:
    title: "Step 4 — Knowledge Check"
    min_score: 0.8
    shuffle: true
    questions:
    - question: You are mid-edit on `app.py` when your lead asks for an urgent hotfix on `main`. You have NOT staged your changes yet. Which approach keeps your tree clean for the hotfix **without** losing your in-progress work?
      options:
      - '`git restore app.py` — discards the edits'
      - '`git commit -m ''WIP''` — commits the half-finished changes'
      - '`git stash` — parks edits aside and cleans the tree'
      - '`git reset --hard` — resets everything so you can restart later'
      correct_index: 2
      option_feedback:
        0: This answer destroys the in-progress work the question wants to preserve.
        1: This answer pollutes shared history if pushed; the prompt asks to keep the tree clean *without* losing work.
        3: This answer wipes the in-progress changes entirely — the opposite of preserving them.
      explanation: '`git stash` is built for this: save tracked modifications and staged changes to a private stack, reset the tree, let you context-switch cleanly. Recovered with `git stash pop`.'
    - question: What does `git status` report immediately after `git stash`?
      options:
      - Your modified files appear staged and ready to commit
      - Your modified files appear untracked — Git has forgotten about them
      - '`nothing to commit, working tree clean`'
      - An error, because `git status` cannot be run after stashing
      correct_index: 2
      option_feedback:
        0: This answer confuses stash with staging — stash moves changes to a private commit at `refs/stash`, not the index.
        1: This answer assumes Git forgets the changes; they're safe in a stash commit, the working tree just matches HEAD.
        3: This answer assumes stash breaks `git status`; status works fine after stashing.
      explanation: '`git stash` resets the working tree to match HEAD — so `git status` reports clean. Your changes are safe in the stash commit at `refs/stash`.'
    - question: Difference between `git stash pop` and `git stash apply`?
      options:
      - '`pop` restores and removes the entry; `apply` keeps it'
      - '`pop` takes only the oldest entry; `apply` any'
      - '`apply` creates a new commit; `pop` does not'
      - They are identical
      correct_index: 0
      option_feedback:
        1: This answer reverses the constraint; both verbs work on any entry, the difference is whether the entry is removed afterward.
        2: This answer confuses applying a stash with creating a commit; neither pop nor apply produces a new commit.
        3: This answer ignores the actual difference (whether the entry survives or is dropped).
      explanation: Use `pop` for the usual workflow. Use `apply` when you want the same stash on multiple branches — the entry stays in the list until you manually `git stash drop`.
    - question: You ran `git stash` but your brand-new file `feature.py` (never `git add`-ed) is still there. Why?
      options:
      - The file is too large to stash
      - Plain `git stash` skips untracked files; use `git stash -u`
      - '`git stash` needs a message for untracked files; use `git stash push -m`'
      - Git ignores files starting with `.`
      correct_index: 1
      option_feedback:
        0: This answer invents a size restriction — stash has no size limit; the issue is tracked vs. untracked.
        2: This answer confuses message annotation with the inclusion of untracked files; `-u` is the relevant flag, not `-m`.
        3: This answer confuses `.gitignore` rules with stash's tracked-files default; dot-files aren't ignored by default.
      explanation: Plain `git stash` only captures what Git is tracking — modified tracked files and staged changes. For brand-new files, use `git stash -u` (`--include-untracked`).
    - question: 'A teammate says: ''I never use stash — I just commit with `WIP` and squash later.'' Best evaluation?'
      options:
      - WIP is better — stashes can be dropped by accident
      - Equivalent — personal preference only
      - Both work; trade-offs differ around history hygiene.
      - WIP is wrong — Git rejects commits with that message
      correct_index: 2
      option_feedback:
        0: This answer ignores the cost of WIP commits polluting shared history if pushed.
        1: This answer flattens a real distinction (private/local stash vs. potentially-pushed WIP commits) into mere preference.
        3: This answer assumes Git rejects messages — it doesn't; the practice is just discouraged, not blocked.
      explanation: Both preserve work. The difference is visibility. Pushed WIP commits enter shared history and degrade `git log`, `git bisect`, and code review. Stash is private — no pollution, but you can forget it. Neither is universally right.
    - question: 'You stashed work in progress on `main`, then ran `git switch --detach HEAD~2` to inspect old code. Where should you pop the stash, and why?'
      options:
      - Right here — a stash can be popped onto any commit
      - On `main` again — the stash was made from that code
      - Nowhere — the stash was tied to `main` and is lost
      - Run `git stash apply detached` to redirect it
      correct_index: 1
      option_feedback:
        0: Popping here works, but it lays `main`-based work onto older code, so conflicts are likelier and you would still have to carry the changes back to `main`.
        2: Stashes aren't tied to a branch; `refs/stash` survives switches and can be applied from any HEAD state.
        3: This answer invents a syntax — `git stash apply` takes a stash reference such as `stash@{0}`, not a HEAD state.
      explanation: A stash records the commit it was made from. Popping it onto that same code (`main`) applies cleanly and puts the work back where you will keep developing. Detached HEAD is fine for inspecting old code; switch back to `main` first, then pop.
    - question: 'Where does Git physically store a stash entry?'
      options:
      - As a plain text file in `.git/stash.txt`
      - As a commit object under `refs/stash`
      - In RAM only; restarting the shell loses it
      - In the remote repository
      correct_index: 1
      option_feedback:
        0: This answer invents a `stash.txt` file; stash uses the regular Git object database, not a separate text store.
        2: This answer assumes stash is volatile; it survives reboots because it's a real commit anchored at `refs/stash`.
        3: This answer confuses local stash with remote sync; stash is local-only by design.
      explanation: A stash is a proper commit in the object database, anchored by `refs/stash`. This is why `git stash` survives across terminals and reboots, and why `git stash apply <sha>` works with any historical stash. Same object model as Step 3 — stash is not a special case.
    - question: Put in order the complete "stash → hotfix → resume" workflow from Task 3 of this step.
      type: parsons
      display: block
      lines:
      - 'git stash'
      - 'git switch -c hotfix-xyz'
      - 'git commit -am "Hotfix: ..."'
      - 'git switch main && git merge hotfix-xyz --no-edit'
      - 'git branch -d hotfix-xyz'
      - 'git stash pop'
      distractors:
      - 'git commit -m "WIP"'
      - 'git restore .'
      - 'git stash drop'
      - 'git push origin stash'
      explanation: The canonical context-switch sequence. Each distractor is a common novice mistake — committing WIP pollutes shared history; `git restore` destroys work; dropping the stash before popping loses it; stashes are local-only (no push). Learn this six-line sequence as a unit.
# Pedagogy: PRIMM — Predict (apply Step 3's object model to predict new-SHA outcome)
- title: 'Cherry-Pick: Copy One Specific Commit'
  view: git_graph
  instructions: |
    ### Why this matters

    Real backport scenarios are weekly: one bugfix on `experimental` belongs on `main`, but the rest of `experimental` is half-baked. Cherry-pick is the surgical tool — and it's also the first place Step 3's object model pays off, because the copied commit *must* have a new SHA. Getting the conflict-resolution muscle memory here transfers directly to rebase later (same marker dance, different final verb).

    ### 🎯 You will learn to
    - **Pick** cherry-pick for one-commit backports; reject it for many-commit integration.
    - **Resolve** a cherry-pick conflict end-to-end (same marker dance as merge — different final verb).
    - **Explain** why the copied commit has a new SHA (apply Step 3's object model).

    ### Scenario

    Lead: *"The `absolute` helper on `experimental` is useful on `main` too.
    Bring that one commit over — leave the half-baked multiply behind."*

    ### 🤔 Predict first

    You're about to cherry-pick the `Add absolute value function` commit
    `A` from `experimental` onto `main`. Apply the Step 3 object model:

    1. **Parents.** What is the parent of the original commit `A` on
       `experimental`? What is the parent of the *new* commit `A'` that
       lands on `main`?
    2. **Refs.** Which branch ref points at `A` after the cherry-pick?
       Which points at `A'`? Where is `HEAD`?
    3. **SHA.** Why must `A'` have a different SHA than `A`, even though
       the patch is byte-identical?

    Commit to all three answers — *then* run cherry-pick and verify with
    `git log --oneline --all --graph`. The trap most students fall into:
    "the original moves to main." Step 3's object model says it can't —
    each commit hashes its parent + tree + metadata, so a same-patch
    commit with a different parent is a *different* commit object.

    `cherry-pick <sha>` replays one commit's patch on top of HEAD as a
    **new commit** (new parent → new SHA, same message + diff).

    <div data-git-command-lab role="region" aria-label="Interactive commit-graph demo: cherry-pick copies a Fix-parse commit from a hotfix branch onto main as a new commit with a new SHA, leaving the original untouched.">
    <script type="application/json">
    {
      "command": "git cherry-pick hotfix-parse",
      "description": "A different scenario to reinforce the pattern: `hotfix-parse` has one critical `Fix parse` commit the team wants on `main` *without* dragging along the WIP `Try tokens` commit below it.\n\n`H'` lands on `main` with the same patch as `H` but a new parent → new SHA. `hotfix-parse` is untouched. Same mechanic you'll apply to your `experimental` branch in the hands-on task.",
      "before": {
        "log": "C000000000000000000000000000000000000000|B000000000000000000000000000000000000000|Refactor|HEAD -> main\nH000000000000000000000000000000000000000|W000000000000000000000000000000000000000|Fix parse|hotfix-parse\nW000000000000000000000000000000000000000|B000000000000000000000000000000000000000|Try tokens (WIP)|\nB000000000000000000000000000000000000000|A000000000000000000000000000000000000000|Add parser|\nA000000000000000000000000000000000000000||Init|",
        "branches": "* main\n  hotfix-parse",
        "head": "refs/heads/main",
        "highlights": {
          "H000000000000000000000000000000000000000": { "color": "#003B5C", "secondary": "#FFD100" }
        }
      },
      "after": {
        "log": "H'00000000000000000000000000000000000000|C000000000000000000000000000000000000000|Fix parse|HEAD -> main\nC000000000000000000000000000000000000000|B000000000000000000000000000000000000000|Refactor|\nH000000000000000000000000000000000000000|W000000000000000000000000000000000000000|Fix parse|hotfix-parse\nW000000000000000000000000000000000000000|B000000000000000000000000000000000000000|Try tokens (WIP)|\nB000000000000000000000000000000000000000|A000000000000000000000000000000000000000|Add parser|\nA000000000000000000000000000000000000000||Init|",
        "branches": "* main\n  hotfix-parse",
        "head": "refs/heads/main",
        "highlights": {
          "H000000000000000000000000000000000000000": { "color": "#003B5C", "secondary": "#FFD100" },
          "H'00000000000000000000000000000000000000": { "color": "#003B5C", "secondary": "#FFD100" }
        }
      }
    }
    </script>
    </div>

    ### Task 1: Inspect

    The pre-built `experimental` has two commits: a half-baked
    `experimental_multiply` in `experimental.py`, then a reusable
    `absolute` in `calculator.py`.

    ```bash
    cd /tutorial/myproject
    git log experimental --oneline
    ```

    You only want the second commit.

    ### Task 2: Cherry-pick the tip

    A branch name resolves to its tip commit — no SHA copy needed:

    ```bash
    git switch main
    git cherry-pick experimental
    git log --oneline
    ```

    A new commit `Add absolute value function` sits on `main` with a
    **different SHA** from the original. Same patch, new parent → new SHA.

    > 💡 **Schema check (Step 3 callback).** Cherry-pick *creates* a new
    > immutable object and *moves* the branch pointer to it. The original
    > commit on `experimental` is untouched — Git never edits commits in
    > place. This pattern repeats in every step from here on.

    > 🔍 **Contrast — what's *not* like cherry-pick.** `git branch foo` at
    > the same commit creates **zero** new objects (just a 41-byte ref file).
    > Both move pointers; only cherry-pick also creates a new commit. That's
    > why branch creation is instant and cherry-pick can fail with a conflict.

    ### Task 3: Produce and resolve a conflict

    Make the same line differ on both branches:

    **On `main`,** edit `calculator.py` so `def add(a, b): return a + b` becomes:

    ```python
    def add(a, b):
        """Return the sum of two numbers."""
        return a + b
    ```

    ```bash
    git add calculator.py && git commit -m "Document add function"
    ```

    **On `experimental`,** change the same line differently:

    ```bash
    git switch experimental
    ```

    Edit to:

    ```python
    def add(a, b): return a + b  # simple addition
    ```

    ```bash
    git add calculator.py && git commit -m "Inline comment on add"
    git switch main
    git cherry-pick experimental      # CONFLICT
    git status
    ```

    You'll see `<<<<<<<` / `=======` / `>>>>>>>` in the file. Conflicts
    are **not failures** — Git is asking a human to combine two valid
    changes.

    Edit the block to keep **both** sides:

    ```python
    def add(a, b):
        """Return the sum of two numbers."""
        return a + b  # simple addition
    ```

    ```bash
    git add calculator.py
    git cherry-pick --continue     # NOT `git commit` — use the cherry-pick verb
    ```

    Git opens the **nano** editor with the original commit message. Press
    `Ctrl+X` to keep it and finish the pick. (If you changed the message,
    nano asks whether to save: press `Y`, then Enter.)

    <details markdown="1"><summary>🆘 Stuck on the conflict?</summary>

    1. Open `calculator.py` and find the `<<<<<<<` / `=======` / `>>>>>>>` block.
    2. The block has two halves: above `=======` is **what you have** (HEAD), below is **what's coming in** (the cherry-picked commit).
    3. Edit so the result keeps the docstring **and** the inline comment, then delete all three marker lines.
    4. `git add calculator.py` → `git cherry-pick --continue` → `Ctrl+X` in nano.
    5. To bail at any point: `git cherry-pick --abort` resets cleanly.

    </details>
  watch_files:
  - myproject/calculator.py
  open_file: myproject/calculator.py
  setup_commands:
  - |
    cd /tutorial/myproject
    [ -e .git/CHERRY_PICK_HEAD ] && git cherry-pick --abort 2>/dev/null
    git switch -q main 2>/dev/null
    if git log experimental --oneline 2>/dev/null | grep -q 'Add absolute value function'; then
      exit 0
    fi
    git branch -D experimental 2>/dev/null
    git switch -qc experimental
    # The half-baked helper lives in its own file, so the absolute commit's
    # patch applies to main cleanly without dragging the helper along.
    printf 'def experimental_multiply(a, b):\n    # half-baked — uses addition in a loop\n    result = 0\n    for _ in range(b):\n        result += a\n    return result\n' > experimental.py
    git add experimental.py
    git commit -qm 'Add experimental multiply (not ready)'
    printf '\ndef absolute(x):\n    """Return |x| — handles negatives, zero, and positives."""\n    return x if x >= 0 else -x\n' >> calculator.py
    git commit -qam 'Add absolute value function'
    git switch -q main
  solution:
    # Task 2 replays the real, conflict-free pick. The runtime can't script the
    # Task 3 conflict edit, so the solution rebuilds that end state directly:
    # the docstring commit, then the inline comment with both sides kept.
    commands:
    - cd /tutorial/myproject && git switch main
    - '[ -e .git/CHERRY_PICK_HEAD ] && git cherry-pick --abort 2>/dev/null'
    - '[ -e .git/MERGE_HEAD ] && git merge --abort 2>/dev/null'
    - git reset --hard HEAD
    - git clean -fdq
    - "git log --oneline | grep -q 'Add absolute value function' || git cherry-pick 'experimental^{/Add absolute value function}'"
    - |
      grep -q 'Return the sum of two numbers' calculator.py || { sed -i 's/^def add(a, b): return a + b$/def add(a, b):\n    """Return the sum of two numbers."""\n    return a + b/' calculator.py && git commit -qam 'Document add function'; }
    - |
      grep -q 'simple addition' calculator.py || { sed -i 's/^    return a + b$/    return a + b  # simple addition/' calculator.py && git commit -qam 'Inline comment on add'; }
    explanation: |
      - **Cherry-pick = patch + replay:** Git diffs the target commit against its parent, applies the diff on top of HEAD, creates a new commit. The original commit is untouched.
      - **New SHA:** The cherry-picked commit has a different parent on main, so its content and SHA differ from the source. This is fine for isolated fixes but means `git log` will show it as "new" even though the patch is identical.
      - **Conflicts:** When the patch does not apply cleanly, Git pauses the cherry-pick. Resolve conflicts in the working tree, `git add` the files, then `git cherry-pick --continue`. Use `--abort` to bail out and restore the pre-cherry-pick state.
      - **Use cases:** Backporting a fix to a release branch, pulling a reviewed commit into main while leaving the rest of the branch, un-stashing one commit from a rejected pull request.
  tests:
  - description: On main branch
    command: cd /tutorial/myproject && git symbolic-ref -q HEAD | grep -q 'refs/heads/main'
    hints:
    - text: 'Cherry-pick while on the target branch. `git switch main` first, then cherry-pick.'
  - description: main contains the absolute value function (cherry-picked)
    command: cd /tutorial/myproject && grep -q 'def absolute' calculator.py && git log --oneline | grep -qi 'absolute value'
    hints:
    - text: 'Cherry-pick the tip of `experimental` — a branch name resolves to its tip, so `git cherry-pick experimental` works.'
      condition: 'code_missing: def absolute'
    - text: 'The function is there but the commit message does not mention "absolute value". Did you edit the message during cherry-pick?'
      condition: 'code_contains: def absolute'
  - description: main does NOT contain experimental_multiply
    command: cd /tutorial/myproject && ! git grep -q 'def experimental_multiply' main --
    hints:
    - text: 'You cherry-picked the wrong commit — `experimental_multiply` should have stayed on `experimental`. Undo with `git reset --hard HEAD~1` and pick the correct SHA.'
  - description: main has your "Document add function" commit
    command: cd /tutorial/myproject && git log main --format=%s | grep -qi 'document'
    hints:
    - title: Make the main-side edit
      text: 'On `main`, turn the one-line `add` into the docstring version from Task 3, then commit it with a message that starts with "Document".'
      condition: 'code_missing: Return the sum'
    - title: Commit the docstring
      text: 'The docstring is in the file but not in a "Document ..." commit yet: `git commit -am "Document add function"`.'
      condition: 'code_contains: Return the sum'
  - description: The conflicting "Inline comment on add" commit was picked onto main
    command: cd /tutorial/myproject && git log main --format=%s | grep -qi 'inline comment'
    hints:
    - title: Pick the conflicting commit
      text: 'After committing the inline comment on `experimental`, switch to `main` and run `git cherry-pick experimental` again. A conflict is expected: that is the point of Task 3.'
    - title: Finish with the cherry-pick verb
      text: 'After resolving and `git add calculator.py`, run `git cherry-pick --continue` and press `Ctrl+X` in nano to keep the message. A plain `git commit` leaves the pick unfinished.'
  - description: The resolved add keeps both the docstring and the inline comment
    command: |
      cd /tutorial/myproject
      git show main:calculator.py | grep -q 'Return the sum of two numbers' && git show main:calculator.py | grep -q 'simple addition'
    hints:
    - title: Keep both sides
      text: 'The resolved block should contain the docstring line and `return a + b  # simple addition`. Delete only the three marker lines, then `git add` the file and continue the pick.'
  - description: No cherry-pick in progress and no conflict markers remain
    command: cd /tutorial/myproject && [ ! -e .git/CHERRY_PICK_HEAD ] && ! grep -E '^(<{7}|={7}|>{7})' calculator.py
    hints:
    - text: 'Conflict markers still in `calculator.py`. Keep both the docstring and the inline comment, remove the `<<<` / `===` / `>>>` lines, then `git add calculator.py && git cherry-pick --continue`.'
      condition: 'code_contains: <<<<<<<'
    - text: '`git cherry-pick --abort` bails if you want to start over — it resets cleanly.'
  quiz:
    title: "Step 5 — Knowledge Check"
    min_score: 0.8
    shuffle: true
    questions:
    - question: What does `git cherry-pick <sha>` do?
      options:
      - Moves the commit off its original branch onto this one
      - Replays that commit's patch as a new commit on the current branch
      - Merges the entire branch containing that commit
      - Renames the commit on the current branch
      correct_index: 1
      option_feedback:
        0: This answer assumes cherry-pick mutates the source branch; it's a copy, not a move — the source commit is untouched.
        2: This answer confuses single-commit cherry-pick with whole-branch merge.
        3: This answer treats cherry-pick as a metadata edit; it actually creates a new commit object with a new SHA.
      explanation: Cherry-pick replays one commit as a *new* commit on HEAD. The source commit is unchanged. The new commit has the same patch and message but a new parent and therefore a new SHA.
    - question: You cherry-pick commit `abc123` from `experimental` onto `main`. Afterwards, what is on `experimental`?
      options:
      - '`abc123` has been removed from `experimental`'
      - '`abc123` is still there, unchanged'
      - '`experimental` now points to `main`'
      - '`experimental` has been deleted'
      correct_index: 1
      option_feedback:
        0: This answer assumes cherry-pick removes the source commit; cherry-pick is purely additive and doesn't touch the source.
        2: This answer assumes branches got rewired; cherry-pick only adds to the current branch.
        3: This answer assumes cherry-pick is destructive on the source; it isn't.
      explanation: Cherry-pick is a copy operation. The source commit stays where it is. Two commits with the same patch now live in two branches with different SHAs.
    - question: During a cherry-pick, Git reports a conflict. Which sequence correctly completes it?
      options:
      - Delete the conflicted file and run `git cherry-pick --continue`
      - Fix the markers, `git add`, then `git cherry-pick --continue`
      - Run `git cherry-pick --force` to override the conflict
      - Run `git commit --amend` to finalize the cherry-pick
      correct_index: 1
      option_feedback:
        0: This answer destroys the work instead of resolving the conflict.
        2: This answer invents a flag; Git has no `--force` option for cherry-pick.
        3: This answer breaks the cherry-pick flow — `--amend` rewrites the previous commit, not the cherry-pick in progress.
      explanation: 'Standard conflict resolution: edit the file to remove the `<<<<<<<` markers, `git add` to mark it resolved, then `git cherry-pick --continue`. From a terminal, Git opens your editor with the original message so you can keep or change it. `--abort` bails and restores HEAD.'
    - question: 'After a cherry-pick, the new commit has a different SHA from the source. Why?'
      options:
      - Cherry-pick mutates the patch content
      - Different parent → different SHA inputs.
      - Git randomly regenerates SHAs for safety
      - The new commit has no parent at all
      correct_index: 1
      option_feedback:
        0: This answer assumes cherry-pick rewrites content; the patch is identical, only the parent differs.
        2: This answer assumes randomness; SHAs are deterministic hashes of (tree + parents + metadata).
        3: This answer assumes the new commit is parentless; it has the current HEAD as its parent.
      explanation: A commit's SHA is `SHA-1(tree + parent(s) + author + committer + message)`. Same patch on a different parent → different tree (possibly) and definitely different parent reference → different SHA. Step 3's object model makes this inevitable.
    - question: Which scenario is a **bad** fit for cherry-pick?
      options:
      - Backporting a single bugfix from main to a release branch
      - Pulling one reviewed commit from a colleague's branch while the rest is still in review
      - Integrating all 50 commits of a long-running feature branch into main
      - Applying the same emergency patch to three parallel maintenance branches
      correct_index: 2
      option_feedback:
        0: This answer rejects cherry-pick's canonical use case; one-commit backports are exactly what it's for.
        1: This answer rejects cherry-pick's other canonical use case (surgical extraction from a partial branch).
        3: This answer rejects another canonical use case; cherry-picking the same fix into multiple maintenance branches is standard practice.
      explanation: For integrating many commits, use `git merge` or `git rebase` — cherry-picking 50 commits by hand is laborious and loses merge base information, which complicates future merges. Cherry-pick is surgical — reserve it for one or a few commits.
    - question: "Mid-cherry-pick, a conflict pauses Git. You are willing to discard your partial conflict-resolution edits and restart the pick later. Which sequence cancels the operation so you can work on another branch?"
      options:
      - '`git stash` — stashes work across branches, including mid-cherry-pick state'
      - '`git cherry-pick --abort`, switch, do the other task, then re-run the pick.'
      - Just `git switch other-branch` — Git will remember the cherry-pick
      - '`git commit -m ''WIP conflict'' --allow-empty` to save the mid-state'
      correct_index: 1
      option_feedback:
        0: This answer assumes stash captures Git's internal cherry-pick state (CHERRY_PICK_HEAD, conflicted index); it doesn't.
        2: This answer assumes Git tolerates mid-cherry-pick switches; it doesn't, the index is in an unmergeable state.
        3: This answer corrupts the cherry-pick state by inserting a foreign commit into its in-progress flow.
      explanation: "git cherry-pick --abort returns to the state before the cherry-pick sequence and discards partial conflict-resolution edits. After switching back later, rerun the pick and resolve again. If you need to preserve partial edits, save a separate copy before aborting; abort itself does not preserve them."
    - question: Put in order the commands that resolve a conflicted cherry-pick end-to-end.
      type: parsons
      display: block
      lines:
      - 'git switch main'
      - 'git cherry-pick <sha>'
      - 'git status'
      - 'edit <file> to remove <<<<<<<, =======, >>>>>>> markers'
      - 'git add <file>'
      - 'git cherry-pick --continue'
      distractors:
      - 'git commit -m "resolve conflict"'
      - 'git cherry-pick --force'
      - 'git merge --continue'
      - 'git reset --hard'
      explanation: The post-conflict verb is `cherry-pick --continue`, not `commit`. The other distractors are common reflex mistakes — `--force` doesn't exist here; `merge --continue` is a different operation; `reset --hard` discards rather than finalizes. Use `--abort` to bail out cleanly.
# Pedagogy: PRIMM — Investigate + negative-transfer callout (blame is for context, not accusation)
- title: 'git blame: Who Last Changed This Line (and Why)?'
  view: editor
  instructions: |
    ### Why this matters

    "Why does this line exist?" is the question every code reviewer, every on-caller, every refactorer asks weekly. Plain `git blame` answers it 90% of the time — but the other 10% (reformatter commits masking the real author) is where engineers waste hours blaming the wrong person. Knowing when blame lies, and the one flag that defuses it, is what separates competent forensic work from frustrating archaeology.

    ### 🎯 You will learn to
    - **Answer "why does this line exist?"** by chaining `blame -L` → `show <sha>`.
    - **Predict when plain blame lies** — reformatter commits mask real authors.
    - **Defuse** the lie with `-w` or `blame.ignoreRevsFile`.
    - **Recognize blame's blind spot:** it can only see *existing* lines.

    ### The two-command forensic workflow

    1. `git blame -L <start>,<end> <file>` → find the SHA that last touched the line.
    2. `git show <sha>` → read the commit message and diff — the **why** lives here.

    Blame is for *context*, not accusation.

    ### Task 1: Why does this line exist?

    ```bash
    git blame -L 7,7 calculator.py
    # Copy the SHA from the first column, then:
    git show <that-sha>
    ```

    Who, when, why — covered. That chain is 90% of real blame use.

    ### Task 2: The reformatter-masked authorship case

    Setup planted: **Bob** wrote `clip`. **CI-Bot** later ran whitespace
    normalization (no logic change).

    **Predict:** who will plain blame name as the last author of `def clip`?

    ```bash
    git blame -L 1,$(wc -l < calculator.py) calculator.py | grep -i 'clip'
    ```

    Last-toucher wins — blame names **CI-Bot**, masking Bob. Inspect:

    ```bash
    git show <ci-bot-sha>     # pure whitespace diff
    ```

    Add `-w` to skip whitespace-only changes:

    ```bash
    git blame -w -L 1,$(wc -l < calculator.py) calculator.py | grep -i 'clip'
    ```

    Now the author is Bob — the real logic author. For recurring
    formatters, persist this. The file accepts only **full** 40-character
    SHAs, so let `git rev-parse` expand the short one that `blame` printed:

    ```bash
    git rev-parse <ci-bot-sha> >> .git-blame-ignore-revs
    git config blame.ignoreRevsFile .git-blame-ignore-revs
    git add .git-blame-ignore-revs
    git commit -m "Ignore CI formatter commit in blame"
    ```

    Committing the file shares it with your team, and GitHub's web blame
    honors it automatically. Each clone still opts in with the
    `git config` line.

    ### Task 3: Default blame vs. `HEAD --` blame

    **Predict first:** if your working tree has uncommitted edits to a
    file, will plain `git blame <file>` show those uncommitted lines or
    hide them?

    ```bash
    echo "# uncommitted note" >> calculator.py
    git blame calculator.py | tail        # the uncommitted line is shown — with a zero SHA "Not Committed Yet"
    git blame HEAD -- calculator.py | tail # only what's committed at HEAD
    git restore calculator.py             # discard the experimental edit
    ```

    **The distinction.** Default `git blame <file>` annotates the **file
    as it currently is on disk** — uncommitted lines included, marked
    with the zero SHA `00000000` and the author "Not Committed Yet".
    `git blame HEAD -- <file>` instead asks "who last touched this line
    in the version recorded at HEAD?" Different question, different
    answer when the working tree is dirty.

    **Still a real blind spot, though.** Blame can only attribute *existing*
    lines (in either mode). A bug caused by a *deleted* line is invisible.
    For deletions, reach for `git log -p`, `git log -S` (pickaxe search),
    or `git bisect` (next step) — the official Git docs are explicit that
    deleted/replaced lines require diff- or pickaxe-style history search.

    <details markdown="1"><summary>📋 Full flag cheat sheet (`-C`, `-M`, `ignoreRevsFile`)</summary>

    | Flag | Use when |
    |---|---|
    | `-L start,end` | You know which lines matter (avoid scanning 1000 lines) |
    | `-w` | A reformatter was the last toucher |
    | `-C -M` | A line moved or was copied across files |
    | `blame.ignoreRevsFile` | Permanently skip known reformat commits |

    </details>

    <details markdown="1"><summary>💡 Sanity check: when `-w` is a no-op (try it)</summary>

    ```bash
    git blame -L 1,$(wc -l < calculator.py) calculator.py | grep -i 'def add'
    ```

    Plain blame already shows the real author — `-w` is identical here.
    **Rule:** `-w` matters only when a reformatter was the last toucher.

    </details>
  setup_commands:
  - |
    cd /tutorial/myproject
    git switch main 2>/dev/null || true
    if ! git log --all --oneline 2>/dev/null | grep -q 'auto-format via whitespace-normalize'; then
      if ! grep -q 'def clip' calculator.py; then
        printf '\ndef clip(x, lo, hi):    \n    """Clip x to [lo, hi]."""    \n    if x < lo:\n        return lo\n    if x > hi:\n        return hi\n    return x\n' >> calculator.py
      fi
      if ! git diff --quiet calculator.py; then
        GIT_AUTHOR_NAME=Bob GIT_AUTHOR_EMAIL=bob@example.com GIT_COMMITTER_NAME=Bob GIT_COMMITTER_EMAIL=bob@example.com git commit -qam 'feat: add clip function'
      fi
      sed -i 's/ *$//' calculator.py
      if ! git diff --quiet calculator.py; then
        GIT_AUTHOR_NAME=CI-Bot GIT_AUTHOR_EMAIL=ci@example.com GIT_COMMITTER_NAME=CI-Bot GIT_COMMITTER_EMAIL=ci@example.com git commit -qam 'CI: auto-format via whitespace-normalize'
      fi
    fi
  solution:
    commands:
    - cd /tutorial/myproject
    - git --no-pager blame -L 1,3 calculator.py >/dev/null 2>&1; true
    - |
      cibot_sha=$(git log --all --author=CI-Bot --format=%H -n 1)
      if [ -n "$cibot_sha" ]; then
        printf '%s\n' "$cibot_sha" > .git-blame-ignore-revs
        git config blame.ignoreRevsFile .git-blame-ignore-revs
        git add .git-blame-ignore-revs
        git diff --cached --quiet || git commit -qm 'Ignore CI formatter commit in blame'
      else
        echo "CI-Bot formatter commit not found"
      fi
    explanation: |
      - **`git blame <file>`:** Shows, for every line, the SHA / author / timestamp of the commit that last modified it.
      - **`-L start,end`:** Restrict to a line range — avoids hundreds of irrelevant lines on large files.
      - **`-w`:** Ignore whitespace-only changes so reformatting commits do not shadow the real author.
      - **`-C -M`:** Follow moves and copies across the file; essential when a line was refactored into a new location.
      - **Workflow:** use blame to find the SHA, then `git show <sha>` to read the full commit message and diff. That is where the *why* lives.
  tests:
  # Task 2 is the substantive gate: the reformatter-masked-authorship case.
  # Each check below fails until the learner has done its part of that task.
  - description: '.git-blame-ignore-revs lists the CI-Bot reformat commit by its full SHA'
    command: |
      cd /tutorial/myproject
      cibot_sha=$(git log --all --author=CI-Bot --format=%H -n 1)
      [ -n "$cibot_sha" ] && [ -f .git-blame-ignore-revs ] && grep -q "^[[:space:]]*$cibot_sha" .git-blame-ignore-revs
    hints:
    - title: Find the formatter's SHA
      text: 'Plain `git blame` on the `clip` lines shows the CI-Bot commit''s short SHA; `git log --all --author=CI-Bot --oneline` lists it too.'
    - title: Store the full SHA
      text: 'The ignore file accepts only full 40-character SHAs. `git rev-parse <short-sha>` prints the full one; append that line to `.git-blame-ignore-revs` from `/tutorial/myproject`.'
  - description: git blame runs with the ignore file configured
    command: |
      cd /tutorial/myproject
      [ -n "$(git config blame.ignoreRevsFile)" ] && git blame -L 1,1 calculator.py >/dev/null 2>&1
    hints:
    - title: Point blame at the file
      text: '`git config blame.ignoreRevsFile .git-blame-ignore-revs` makes every `git blame` in this clone skip the listed commits. Re-run blame on `clip`: Bob should appear even without `-w`.'
    - title: Every line must be a full SHA
      text: 'If `git blame` now fails with `invalid object name`, the file holds an abbreviated SHA. Replace its contents with the full one: `git rev-parse <short-sha> > .git-blame-ignore-revs`.'
  - description: .git-blame-ignore-revs is committed so the team shares it
    command: cd /tutorial/myproject && git ls-files --error-unmatch .git-blame-ignore-revs >/dev/null 2>&1
    hints:
    - title: Share the list with the team
      text: 'Commit the file (`git add .git-blame-ignore-revs`, then `git commit`) so teammates and GitHub''s web blame skip the same formatter commits.'
  quiz:
    title: "Step 6 — Knowledge Check"
    min_score: 0.8
    shuffle: true
    questions:
    - question: What does `git blame calculator.py` show?
      options:
      - A list of bugs that were found in `calculator.py`
      - For each line, the last commit that changed it
      - The remote collaborators who have access to the file
      - The diff of the most recent commit that touched the file
      correct_index: 1
      option_feedback:
        0: This answer treats `git blame` as static analysis; blame is purely about line provenance, not bug detection.
        2: This answer confuses authorship-of-lines with access-control of the file.
        3: This answer confuses blame's per-line view with `git show`'s per-commit view.
      explanation: 'Blame gives per-line provenance — the last-touching commit and author. Combined with `git show <sha>`, you see the full context: why the line was written this way.'
    - question: You need to know the commit message for line 42's last modification. Which sequence gets you there fastest?
      options:
      - '`git log calculator.py | grep 42`'
      - '`git blame -L 42,42`, then `git show <sha>`'
      - '`git diff calculator.py` to see what changed'
      - '`git status calculator.py`'
      correct_index: 1
      option_feedback:
        0: This answer treats line numbers as a search string; `git log` doesn't index by line number, only `blame` does.
        2: This answer shows uncommitted changes, not authorship of committed lines.
        3: This answer reports working-tree state, not historical authorship.
      explanation: '`git blame -L 42,42` restricts output to line 42 only — instant. The first column is the SHA; pipe that SHA into `git show` for the full message. This two-step recipe is idiomatic.'
    - question: A colleague recently ran `black` across the whole repository. Now `git blame` shows them as the author of every line. How do you see the *real* last-meaningful author?
      options:
      - Revert the `black` commit to restore the previous attribution
      - Use `git blame -w` or `blame.ignoreRevsFile` to skip the reformat
      - The reformat masks the author for good; nothing recovers it
      - Use `git reflog` to rewind blame to before the reformat
      correct_index: 1
      option_feedback:
        0: This answer is needlessly destructive; `-w` and `blame.ignoreRevsFile` solve this without rewriting history.
        2: This answer assumes the reformatter has masked the data permanently; it hasn't, blame just needs the right flags.
        3: This answer confuses reflog (HEAD-position diary) with blame's commit-by-line attribution.
      explanation: '`-w` ignores whitespace-only changes, hiding pure reformatting from blame. For recurring formatters, add the reformat commit SHAs to a file referenced by `blame.ignoreRevsFile` — now everyone skips them consistently.'
    - question: 'When `git blame` prints a SHA for a line, what kind of object does that SHA refer to?'
      options:
      - A blob object containing just that one line
      - A tree object for the file's containing directory
      - The commit that last modified that line
      - A stash entry
      correct_index: 2
      option_feedback:
        0: This answer confuses commit objects with blob objects; blame attributes to commits, not blobs.
        1: This answer confuses commit objects with tree objects; blame's SHAs are commit SHAs.
        3: This answer confuses commits with stash entries; blame doesn't reference stashes.
      explanation: Blame attributes lines to commits. The SHA printed is a commit SHA — run `git cat-file -t <sha>` to confirm it reports `commit`. You then use `git show <sha>` to read it.
    - question: When is `git blame` the **wrong** tool for finding a bug?
      options:
      - When the bug comes from a line someone deleted
      - When you need to know who last modified a specific line
      - When you need the timestamp of a line
      - When you need the commit message behind a line
      correct_index: 0
      option_feedback:
        1: This answer states blame's *core use case* — the question asked when blame is the *wrong* tool.
        2: This answer states another core blame use case; blame prints timestamps for every line.
        3: This answer describes the standard blame → show chain; it's blame's strength, not its weakness.
      explanation: Blame only tells you about *existing* lines. A bug caused by a *deleted* line (say, a removed `validate()` call) leaves blame blind. For regressions introduced by a missing line, use `git bisect` (next step) or `git log -p` to scan history.
    - question: 'Give a concrete bug where `git blame` would mislead you even though the culprit line IS in the file. Which of the following fits best?'
      options:
      - A one-character typo fixed by a teammate — blame shows the typo's original commit, not the fix
      - A buggy line later reformatted by a CI bot — blame names the bot
      - A commit that was cherry-picked to `main` from `experimental`
      - A commit that was merged via a merge commit
      correct_index: 1
      option_feedback:
        0: This answer assumes blame keeps showing the original typo; once fixed, blame attributes the line to the fixer.
        2: This answer assumes cherry-pick fools blame; the new commit has its own SHA but blame still attributes correctly.
        3: This answer assumes merge commits mask authorship; standard merges leave per-line history intact.
      explanation: 'Reformatter commits are the classic blame-mislead scenario. The CI bot''s commit ''last touched'' every line, so blame attributes all lines to the bot — hiding the real author who introduced the logic bug. Defense: `git blame -w` to skip whitespace-only changes, or `blame.ignoreRevsFile` to skip known reformat commits.'
    - question: 'Your working tree has an uncommitted edit to `calculator.py`. You run plain `git blame calculator.py`. What do you see for the modified line?'
      options:
      - Nothing — Git refuses to run blame on a dirty file
      - The line appears with a zero SHA labeled "Not Committed Yet"
      - The line appears with the SHA of the last commit that touched the file — uncommitted edits are invisible to blame
      - An error about a detached working tree
      correct_index: 1
      option_feedback:
        0: This answer assumes Git refuses dirty trees; blame works fine, it just shows the uncommitted line specially.
        2: This answer assumes blame ignores the working tree; default blame uses the working-tree copy, only `blame HEAD --` restricts to committed lines.
        3: This answer invents an error condition; "detached" applies to HEAD, not to working trees.
      explanation: Default `git blame <file>` annotates the **file as it currently is** — so an uncommitted line appears with the zero SHA `00000000` and author "Not Committed Yet". To restrict to the committed version of the file, use `git blame HEAD -- <file>`. Two different questions ("who touched what I'm reading right now?" vs. "who touched what's recorded at HEAD?"); two different commands. Note this is separate from the *deletion* blind spot — a line that no longer exists in the file is invisible to either mode of blame.
    - question: Put in order the "forensic chain" for understanding why a specific line in `parser.py` exists.
      type: parsons
      display: block
      lines:
      - 'git blame -L 42,42 parser.py'
      - 'copy <that-sha> from the first column'
      - 'git show <that-sha>'
      - 'if the commit is a reformatter, rerun blame with -w'
      - 'git blame -w -L 42,42 parser.py'
      distractors:
      - 'git log parser.py | grep 42'
      - 'git diff HEAD parser.py'
      - 'git status parser.py'
      explanation: The blame → show chain answers "why does this line exist?" The `-w` fallback defuses reformatter masking. The distractors are all plausible-looking commands that don't answer the authorship question — common cul-de-sacs when learners panic-grep instead of reaching for blame.
# Pedagogy: PRIMM — Predict (estimate log₂(N) before running) + worked example with fading
- title: 'git bisect: Binary Search for the Commit That Broke Things'
  view: editor
  instructions: |
    ### Why this matters

    "Some commit in the last 1000 broke prod" is a real on-call scenario, and the difference between bisect-fluent and bisect-novice engineers is hours of debug time. Binary search turns 1000 commits into ~10 tests, and `git bisect run` automates the whole thing. Skipping this step costs you on every regression hunt for the rest of your career.

    ### 🎯 You will learn to
    - **Decide** when bisect is worth reaching for (rule: ≥ ~5 commits or slow tests).
    - **Run an automated bisect** end-to-end and **always reset** afterward.
    - **Spot regressions blame cannot find** — deletions, behavioral changes, and anything involving missing lines.

    ### 🤔 Predict first

    A regression appeared somewhere in the last **1000 commits**.
    Roughly how many tests would `git bisect` need to find the exact
    breaking commit? Pick one before reading on: 1000, 500, 100, or ~10.

    ### Why bisect beats every alternative

    Reading 30 diffs by hand is slow. `blame` can't see missing lines.
    `log --grep="fix"` is wishful thinking.

    Bisect runs **binary search** on history: `log₂(30) ≈ 5` tests to pin
    the exact culprit. 1000 commits → **~10 tests**. Scales forever.

    <div data-git-command-lab-multi role="region" aria-label="Interactive multi-step commit-graph demo: bisect narrows a regression in five commits to one in just two tests by binary search; HEAD detaches to a midpoint while bisect/bad and bisect/good refs mark the boundaries.">
    <script type="application/json">
    {
      "description": "Different scenario from the hands-on: a regression in `sort()` hides somewhere in the last 5 commits. Bisect pinpoints it in **just 2 tests** (log₂(5) ≈ 2.3).\n\n**Watch the labels.** Red = known bad, green = known good. `bisect/bad` and `bisect/good` refs mark the current boundaries. `HEAD` detaches to the midpoint Git wants you to test. You will apply this same algorithm below on the calculator `absolute` bug.",
      "initialState": {
        "log": "F000000000000000000000000000000000000000|E000000000000000000000000000000000000000|Lint|HEAD -> main\nE000000000000000000000000000000000000000|D000000000000000000000000000000000000000|Docs|\nD000000000000000000000000000000000000000|C000000000000000000000000000000000000000|Skip stable (BUG)|\nC000000000000000000000000000000000000000|B000000000000000000000000000000000000000|Add compare|\nB000000000000000000000000000000000000000|A000000000000000000000000000000000000000|Add sort|\nA000000000000000000000000000000000000000||Init|",
        "branches": "* main",
        "head": "refs/heads/main"
      },
      "steps": [
        {
          "command": "git bisect start HEAD HEAD~5",
          "description": "One-shot form: mark `HEAD` (F) **bad** and `HEAD~5` (A) **good** in a single command. Git prints:\n\n```\nBisecting: 2 revisions left to test after this (roughly 2 steps)\n```\n\nSuspects: {B, C, D, E, F} — 5 commits. Git picks the balanced midpoint **D** (2 ancestors B,C; 2 descendants E,F) and detaches HEAD to D for you to test.",
          "state": {
            "log": "F000000000000000000000000000000000000000|E000000000000000000000000000000000000000|Lint|main, bisect/bad\nE000000000000000000000000000000000000000|D000000000000000000000000000000000000000|Docs|\nD000000000000000000000000000000000000000|C000000000000000000000000000000000000000|Skip stable (BUG)|HEAD\nC000000000000000000000000000000000000000|B000000000000000000000000000000000000000|Add compare|\nB000000000000000000000000000000000000000|A000000000000000000000000000000000000000|Add sort|\nA000000000000000000000000000000000000000||Init|bisect/good",
            "branches": "  main",
            "head": "detached",
            "highlights": {
              "F000000000000000000000000000000000000000": { "color": "#C0392B", "secondary": "#fff" },
              "A000000000000000000000000000000000000000": { "color": "#27AE60", "secondary": "#fff" }
            }
          }
        },
        {
          "command": "./test_sort.sh  →  exit 1  →  git bisect bad",
          "description": "Tests **fail** at D, so D is bad. `refs/bisect/bad` now points at D (the tighter bad boundary). Git prints:\n\n```\nBisecting: 1 revision left to test after this (roughly 1 step)\n```\n\nSuspects narrow to {B, C, D} — 3 commits. Midpoint **C**; HEAD moves there. E and F are now *inferred bad* (descendants of a bad D) — shown red even though you didn't test them.",
          "state": {
            "log": "F000000000000000000000000000000000000000|E000000000000000000000000000000000000000|Lint|main\nE000000000000000000000000000000000000000|D000000000000000000000000000000000000000|Docs|\nD000000000000000000000000000000000000000|C000000000000000000000000000000000000000|Skip stable (BUG)|bisect/bad\nC000000000000000000000000000000000000000|B000000000000000000000000000000000000000|Add compare|HEAD\nB000000000000000000000000000000000000000|A000000000000000000000000000000000000000|Add sort|\nA000000000000000000000000000000000000000||Init|bisect/good",
            "branches": "  main",
            "head": "detached",
            "highlights": {
              "F000000000000000000000000000000000000000": { "color": "#C0392B", "secondary": "#fff" },
              "E000000000000000000000000000000000000000": { "color": "#C0392B", "secondary": "#fff" },
              "D000000000000000000000000000000000000000": { "color": "#C0392B", "secondary": "#fff" },
              "A000000000000000000000000000000000000000": { "color": "#27AE60", "secondary": "#fff" }
            }
          }
        },
        {
          "command": "./test_sort.sh  →  exit 0  →  git bisect good",
          "description": "Tests **pass** at C, so C is good. C (good) and D (bad) are now adjacent — the answer is pinned. Git prints:\n\n```\nD is the first bad commit\ncommit D…\n    Skip stable (BUG)\n```\n\nB is *inferred good* (ancestor of a good C). HEAD stays on C (last tested). Run `git show D` to read the culprit's full diff and message.",
          "state": {
            "log": "F000000000000000000000000000000000000000|E000000000000000000000000000000000000000|Lint|main\nE000000000000000000000000000000000000000|D000000000000000000000000000000000000000|Docs|\nD000000000000000000000000000000000000000|C000000000000000000000000000000000000000|Skip stable (BUG)|bisect/bad\nC000000000000000000000000000000000000000|B000000000000000000000000000000000000000|Add compare|HEAD, bisect/good\nB000000000000000000000000000000000000000|A000000000000000000000000000000000000000|Add sort|\nA000000000000000000000000000000000000000||Init|bisect/good",
            "branches": "  main",
            "head": "detached",
            "highlights": {
              "F000000000000000000000000000000000000000": { "color": "#C0392B", "secondary": "#fff" },
              "E000000000000000000000000000000000000000": { "color": "#C0392B", "secondary": "#fff" },
              "D000000000000000000000000000000000000000": { "color": "#C0392B", "secondary": "#fff" },
              "C000000000000000000000000000000000000000": { "color": "#27AE60", "secondary": "#fff" },
              "B000000000000000000000000000000000000000": { "color": "#27AE60", "secondary": "#fff" },
              "A000000000000000000000000000000000000000": { "color": "#27AE60", "secondary": "#fff" }
            }
          }
        },
        {
          "command": "git bisect reset",
          "description": "**Non-negotiable final step.** Re-attaches `HEAD` from the detached midpoint back to `main` and deletes every `refs/bisect/*` ref. Skip it and your working tree looks mysteriously stale (HEAD stuck on C).\n\nThe diagram keeps D highlighted as a reminder of the culprit. In a real terminal, `git bisect log` captures the verdict — paste it into the PR description.",
          "state": {
            "log": "F000000000000000000000000000000000000000|E000000000000000000000000000000000000000|Lint|HEAD -> main\nE000000000000000000000000000000000000000|D000000000000000000000000000000000000000|Docs|\nD000000000000000000000000000000000000000|C000000000000000000000000000000000000000|Skip stable (BUG)|\nC000000000000000000000000000000000000000|B000000000000000000000000000000000000000|Add compare|\nB000000000000000000000000000000000000000|A000000000000000000000000000000000000000|Add sort|\nA000000000000000000000000000000000000000||Init|",
            "branches": "* main",
            "head": "refs/heads/main",
            "highlights": {
              "D000000000000000000000000000000000000000": { "color": "#C0392B", "secondary": "#fff" },
              "C000000000000000000000000000000000000000": { "color": "#27AE60", "secondary": "#fff" },
              "B000000000000000000000000000000000000000": { "color": "#27AE60", "secondary": "#fff" },
              "A000000000000000000000000000000000000000": { "color": "#27AE60", "secondary": "#fff" }
            }
          }
        }
      ]
    }
    </script>
    </div>

    ### Task 1: See the regression

    Setup planted 5 commits; one of them broke `absolute(-4) == 4`.

    ```bash
    cd /tutorial/myproject
    git log --oneline -7
    grep -q 'return x if x >= 0 else -x' calculator.py  # exits non-zero while broken
    ```

    ### Task 2: Manual bisect (feel the motion)

    ```bash
    git bisect start
    git bisect bad HEAD
    git bisect good HEAD~5
    # Git checks out a midpoint. Test it:
    grep -q 'return x if x >= 0 else -x' calculator.py
    # exit 0 → git bisect good ;  exit ≠ 0 → git bisect bad
    # Repeat until Git prints "<sha> is the first bad commit"
    git bisect reset
    ```

    ### Task 3: Automated bisect (the real-world default)

    ```bash
    git bisect start HEAD HEAD~5
    git bisect run sh -c "grep -q 'return x if x >= 0 else -x' calculator.py"
    git bisect reset
    ```

    `bisect run` uses the script's exit code (0 = good, non-zero = bad)
    to drive the search. Always finish with `reset` — otherwise HEAD
    stays on the last midpoint.

    ### Task 4: Fix the bug

    Bisect points at exactly one commit — let's call its SHA `<sha>`. Look at
    what that commit changed:

    ```bash
    git show <sha>                          # what got introduced
    git show <sha>~1:calculator.py          # how absolute looked just BEFORE
    ```

    The diff names the regression directly. Bisect's promise: the *commit*
    is the suspect; the *diff* is the fingerprint.

    Now repair `absolute(x)` in the editor so it returns the magnitude of
    `x` (non-negative for any input). One line is enough — pick whichever
    Python style reads cleanest to you. Then commit on top of `main`, and
    name the culprit so reviewers can trace the regression:

    ```bash
    git commit -am "Fix: restore negation in absolute (regressed in <sha>)"
    # Then click Test My Work. The gate accepts abs(x), a sign-check ternary,
    # or an if/else branch, as long as negatives become positive.
    ```

    > 💡 Bisect points; it doesn't repair. Reading the culprit's diff
    > (Step 6's habit) is what tells you *what* to put back.

    <details markdown="1"><summary>⚠️ Test-portability caveat (real-world bisects)</summary>

    Bisect runs the test at *every historical commit* in range. If the test
    itself was added mid-range, older commits won't have it and bisect breaks.
    Restore the modern test each iteration:

    ```bash
    git bisect run -- bash -c 'cp /tmp/test.py . && python3 test.py'
    ```

    </details>

    ### 🌙 Halftime: take a break before Step 8

    You've finished the **daily tools** phase (stash, cherry-pick, blame, bisect).
    Steps 8–11 are **history rewriting** — denser and structurally riskier.

    **Walk away for at least 30 minutes** (overnight is better) before continuing.
    Spaced practice is one of the most replicated findings in cognitive science:
    a 30-minute break before harder material produces measurably better retention
    than pushing straight through. Your hippocampus consolidates while you're not
    studying.

    When you come back, predict from memory: *what does `git stash` actually save?
    Why does cherry-pick create a new SHA?* If those don't come fast, re-do the
    step. If they do, Step 8 awaits.

  watch_files:
  - myproject/calculator.py
  - myproject/test_calculator.py
  open_file: myproject/calculator.py
  setup_commands:
  # NOTE: the planted bug commit's message must NOT reveal the bug — bisect's
  # job is to find it, not the student's eyes. Match the capstone's tell-free
  # naming ("Simplify absolute return path"). Same for any in-file comment.
  - "cd /tutorial/myproject\n[ -e .git/BISECT_START ] && git bisect reset 2>/dev/null\ngit switch -q main 2>/dev/null\nif git log main --oneline 2>/dev/null | grep -q 'Simplify absolute return path'; then\n  exit 0\nfi\nif ! grep -q 'def absolute' calculator.py; then\n  printf '\\ndef absolute(x):\\n    \"\"\"Return |x|.\"\"\"\\n    return x if x >= 0 else -x\\n' >> calculator.py\n  git add calculator.py\n  git commit -qm 'Seed: add absolute function' 2>/dev/null\nfi\nprintf 'from calculator import add, divide, absolute\\nassert add(2, 3) == 5\\nassert divide(10, 2) == 5\\nassert absolute(-4) == 4\\nprint(\"all tests pass\")\\n' > test_calculator.py\ngit add test_calculator.py\ngit diff --cached --quiet || git commit -qm 'Add regression tests'\necho '# commit A: refactor docstring' >> calculator.py\ngit commit -qam 'Refactor: tidy docstring'\necho '# commit B: new helper' >> calculator.py\ngit commit -qam 'Add unused helper comment'\nsed -i 's/return x if x >= 0 else -x/return x/' calculator.py\nif git diff --quiet calculator.py; then\n  sed -i 's/def absolute(x):/def absolute(x):\\n    return x\\n    pass  # unreachable/' calculator.py\nfi\ngit commit -qam 'Simplify absolute return path'\necho '# commit D: later tweak' >> calculator.py\ngit commit -qam 'Later tweak'\necho '# commit E: even later' >> calculator.py\ngit commit -qam 'Even later tweak'\n"
  solution:
    # Interactive instructions teach bisect + repair. Automated solution appends
    # a final correct definition; in Python the later definition wins.
    commands:
    - cd /tutorial/myproject
    - git bisect reset 2>/dev/null; true
    - git switch -q main 2>/dev/null
    - git reset --hard HEAD
    - printf '\ndef absolute(x):\n    """Return |x|."""\n    return x if x >= 0 else -x\n' >> calculator.py
    - |
      culprit=$(git log --format=%h --grep='Simplify absolute return path' -n 1)
      git add calculator.py && (git diff --cached --quiet || git commit -m "Fix: restore negation in absolute (regressed in $culprit)")
    explanation: |
      - **Binary search:** bisect halves the candidate range each step. `log₂(n)` tests find the exact breaking commit — 5 tests for 30 commits, 10 tests for 1000.
      - **`git bisect start` / `bad` / `good`:** establishes the range. Git checks out the midpoint and waits for your verdict.
      - **`git bisect run <cmd>`:** automates the search. The command runs at each candidate; exit 0 = good, non-zero = bad. Git iterates until one commit remains, prints it, and stops.
      - **`git bisect reset`:** returns HEAD to the pre-bisect state and cleans up. **Always run this at the end**, even after `run` — otherwise you may end up on a commit in the middle of history and wonder why your code looks weird.
      - **Test portability:** The test script must work at every commit in the range. If the test file itself was added partway through, copy it from outside the range for each iteration.
  tests:
  - description: Bisect has been cleaned up (no active bisect)
    command: cd /tutorial/myproject && [ ! -f .git/BISECT_LOG ]
    hints:
    - title: End every bisect with reset
      text: '`git bisect reset` ends the session and returns HEAD to the branch you started from. It works whether the search succeeded, failed, or got stuck.'
    - title: Check for a paused bisect
      text: 'If `git status` says "You are currently bisecting", run `git bisect reset` from `/tutorial/myproject`.'
  # Setup seeds the history and the regression test, so only the repair, its
  # commit, and the cleanup above are evidence of the learner's work.
  - description: main's committed absolute() is repaired (handles negatives, zero, and positives)
    # v86's test execution path cannot rely on Python being installed in the
    # VM image. Extract the effective (last) absolute() body from main's commit
    # and accept common correct repairs instead of pinning one exact string.
    command: |
      cd /tutorial/myproject
      body=$(git show main:calculator.py | awk '
        /^def[ \t]+absolute[ \t]*\(/ { body=""; capture=1; next }
        capture && /^def[ \t]+[A-Za-z_][A-Za-z0-9_]*[ \t]*\(/ { capture=0 }
        capture { line=$0; sub(/#.*/, "", line); body=body line "\n" }
        END { print body }
      ' | tr -d '[:space:]')
      case "$body" in
        *'returnabs(x)'*|*'returnmax(x,-x)'*|*'returnmax(-x,x)'*|*'returnxifx>=0else-x'*|*'returnxifx>0else-x'*|*'return-xifx<0elsex'*|*'return-xifx<=0elsex'*) abs_ok=1 ;;
      esac
      case "$body" in
        *'ifx<0:'*'return-x'*'returnx'*|*'ifx<=0:'*'return-x'*'returnx'*|*'ifx>0:'*'returnx'*'return-x'*|*'ifx>=0:'*'returnx'*'return-x'*) abs_ok=1 ;;
      esac
      [ "${abs_ok:-0}" = 1 ]
    hints:
    - title: Bisect points, you repair
      text: 'Bisect names the culprit commit but doesn''t fix it. Repair `absolute(x)` on top of `main`, then commit the fix; this check reads the committed version.'
    - title: Read what the culprit removed
      text: 'Read the bad commit''s diff with `git show <sha>`: what was removed? Restoring it is one option (`git show <sha>~1:calculator.py` shows the old version); a clean rewrite using `abs()` or a sign check is another.'
      condition: 'code_contains: def absolute'
    - title: absolute() is missing
      text: '`def absolute` is gone entirely. Re-add it: it takes one number and returns its magnitude (non-negative for any input). The body is a one-liner — pick whichever Python style you find clearest.'
      condition: 'code_missing: def absolute'
  - description: Your fix commit names the culprit commit that bisect found
    command: |
      cd /tutorial/myproject
      culprit=$(git log main --format=%H --grep='^Simplify absolute return path' -n 1)
      [ -n "$culprit" ] && git log --format=%B "$culprit..main" | grep -q "$(printf %s "$culprit" | cut -c1-7)"
    hints:
    - title: Name the culprit in your fix
      text: 'Bisect''s last message names the first bad commit. Put at least its first 7 characters in your fix commit''s message, for example `Fix: restore negation in absolute (regressed in <sha>)`.'
    - title: Already committed without it?
      text: '`git commit --amend -m "..."` rewrites the message of your newest commit, as long as you haven''t pushed it.'
  quiz:
    title: "Step 7 — Knowledge Check"
    min_score: 0.8
    shuffle: true
    questions:
    - question: A regression appeared somewhere in the last **50 commits**. Roughly how many tests does `git bisect` need to find the exact breaking commit?
      options:
      - 50 — one per commit
      - 25 — approximately half
      - '~6 — log₂(50) ≈ 6'
      - 1 — bisect inspects all commits at once
      correct_index: 2
      option_feedback:
        0: This answer assumes linear search; bisect halves candidates each step (log₂(50) ≈ 6, not 50).
        1: This answer halves only once; bisect halves repeatedly until one commit remains.
        3: This answer assumes a single oracle; bisect needs one test per midpoint to drive the search.
      explanation: 'Binary search halves the range each test: 50 → 25 → 13 → 7 → 4 → 2 → 1. About 6 iterations. For 1000 commits, ~10 tests. This scaling is why bisect is irreplaceable on long-running projects.'
    - question: Which sequence correctly runs an automated bisect?
      options:
      - '`bisect start` naming no commits, then `bisect run <cmd>`'
      - Mark one bad and one good commit, then `bisect run <cmd>`
      - '`bisect run <cmd> HEAD HEAD~50` (boundaries on `run`)'
      - '`bisect <cmd>` runs everything in one verb'
      correct_index: 1
      option_feedback:
        0: This answer skips the range; without a known-bad and a known-good commit, bisect has nothing to halve, and `run` refuses to start.
        2: This answer puts boundaries in the wrong place; `start` takes them, `run` takes a command.
        3: This answer omits both `start` and `run`; bisect needs both for automation.
      explanation: Bisect needs a range first — one known-bad and one known-good commit, either given to `start` (`git bisect start HEAD HEAD~5`) or marked with `bad` and `good`. Only then can `run` automate the search; the command's exit code (0 = good, nonzero = bad) drives each step.
    - question: You ran `git bisect run` successfully. What must you do afterwards?
      options:
      - Nothing — bisect cleans itself up automatically
      - '`git bisect reset` to return HEAD to your branch'
      - '`git stash` to preserve the bisect state for later'
      - '`git push` so teammates see the bisect result'
      correct_index: 1
      option_feedback:
        0: This answer assumes auto-cleanup; HEAD stays at the last midpoint until you `bisect reset`.
        2: This answer confuses stash (working-tree shelving) with bisect cleanup.
        3: This answer assumes the bisect result needs to be shared via push; the result is local diagnostic info.
      explanation: '`git bisect reset` is non-negotiable. It restores HEAD to where you started and removes bisect''s temporary refs. Skipping it leaves HEAD on a random historical commit — a common cause of ''why is my code weird?'' panic.'
    - question: Which test property is **required** for `git bisect run` to work?
      options:
      - The test must produce JSON output that bisect parses
      - Exit 0 on pass / non-zero on fail, runnable at every commit
      - The test must be written in a scripting language
      - The test must only exist in the latest commit on the branch
      correct_index: 1
      option_feedback:
        0: This answer invents an output-format requirement; bisect cares about exit codes, not output format.
        2: This answer invents a language requirement; bisect runs any executable.
        3: This answer is backwards; the test must work at *every* commit in the range, not just the latest.
      explanation: 'Bisect uses the exit code as its oracle. Also critical: the test must actually run at every historical commit — if the test file was added mid-range, older commits will fail to even find the test, confusing bisect. Use `git bisect run -- bash -c ''cp /tmp/test.py . && python3 test.py''` to work around this.'
    - question: 'In the middle of a manual bisect, Git leaves HEAD at a historical commit while you decide good/bad. What HEAD state are you in, and why is that OK?'
      options:
      - Detached HEAD — bisect manages it, and `git bisect reset` restores you.
      - Attached to a `bisect/working` branch Git creates for you
      - Detached HEAD — and any `git commit` you make here will corrupt history
      - Attached to `main` — bisect only moves the working tree, not HEAD
      correct_index: 0
      option_feedback:
        1: This answer invents a `bisect/working` branch; bisect uses internal refs (`refs/bisect/*`), not a magic branch.
        2: This answer assumes detached-HEAD commits are dangerous; bisect's transient state is safe and `reset` undoes it.
        3: This answer assumes HEAD doesn't move; bisect explicitly checks out historical commits at each midpoint.
      explanation: During bisect, HEAD is detached at whichever historical commit Git picked as midpoint. That is fine because bisect's own refs (`refs/bisect/*`) and `.git/BISECT_LOG` track progress. `git bisect reset` restores the pre-bisect HEAD. Same detached-HEAD concept as Step 1 — just used in service of a search.
    - question: 'A bug appears because a line that *used to exist* was deleted. Which tool finds the deletion commit?'
      options:
      - '`git blame` — it lists every line''s last-touching commit'
      - '`git bisect` — it finds the commit where behavior changed'
      - '`git log --grep=''delete''` — it filters commits by message text'
      - '`git cherry-pick --find-deletion` — it locates deleted-line commits'
      correct_index: 1
      option_feedback:
        0: This answer ignores blame's deletion blind spot; absent lines are invisible to blame regardless of mode.
        2: This answer assumes the commit message contains "delete"; commit messages don't reliably announce deletions.
        3: This answer invents a flag that doesn't exist on cherry-pick.
      explanation: 'Blame only attributes *existing* lines. A deletion is invisible to blame (the line isn''t there!). Bisect operates on *behavior*, not lines: if the test failed after commit X and passed at commit X-1, X is the culprit, regardless of whether X added, modified, or deleted code.'
    - question: Put in order the commands for an automated bisect that finds a regression in the last 100 commits and returns HEAD to normal.
      type: parsons
      display: block
      lines:
      - 'grep -q "return x if x >= 0 else -x" calculator.py'
      - 'git bisect start HEAD HEAD~100'
      - 'git bisect run sh -c "grep -q ''return x if x >= 0 else -x'' calculator.py"'
      - 'git bisect reset'
      distractors:
      - 'git bisect stop'
      - 'git bisect --force'
      - 'git reflog'
      - 'git bisect run -- sh test.sh HEAD HEAD~100'
      explanation: Bisect needs boundaries first (`start <bad> <good>`), *then* `run`. The `run` script's exit code (0 = good, nonzero = bad) drives the binary search — ~log₂(100) ≈ 7 iterations. `reset` is non-negotiable; skipping it leaves HEAD on a historical midpoint commit and your code "looks weird."
# Pedagogy: PRIMM — Investigate + worked example with fading (rebase = cherry-pick a series)
- title: 'Rebase: Integrate Changes Without a Merge Commit'
  view: git_graph
  instructions: |
    ### Why this matters

    Most teams' history shape is decided by one habit: do engineers `merge` or `rebase` short feature branches? Rebase produces linear, blame-friendly history; merge produces honest-but-cluttered diamonds. Choosing wrongly on shared branches breaks teammates' clones; choosing wrongly on private ones costs nothing. This step is where you internalize the rule and gain confidence to recover from bad rebases via reflog.

    ### 🎯 You will learn to
    - **Pick** rebase for short local branches, merge for shared/long-lived ones — and say *why*.
    - **Produce linear history** with rebase + fast-forward merge (no diamond).
    - **Resolve a rebase conflict** — same marker dance as merge, but finish with `rebase --continue`.
    - **Recover** from a bad rebase using reflog (Step 2's safety net applied).

    ### Mental model: the video-editor timeline cut

    Select the clips (commits) unique to your feature, cut, move playhead to
    `main`'s tip, paste. Each paste is a **new commit object** — same patch,
    new parent, new SHA. Originals stay in `.git/objects` (reflog recovers).

    > 💡 **Schema check (Step 3 callback).** Rebase = "cherry-pick a *series*"
    > under the hood. New objects, branch pointer moved. Same mechanic Step 5
    > used on one commit; Step 8 just iterates.

    > 🔍 **Contrast — what's *not* like rebase.** A **fast-forward merge**
    > on a strict-extension branch creates **zero** new commits — `main`'s
    > pointer just slides forward to the feature tip. Rebase + ff-merge
    > together produce linear history because rebase did all the
    > new-commit-creation up front; the merge has nothing left to do.

    <div data-git-command-lab role="region" aria-label="Interactive commit-graph demo: rebase replays a topic-branch commit T onto the new main tip as a new commit T-prime, with the same patch but a new parent and new SHA. The original T remains in the object database, recoverable via reflog.">
    <script type="application/json">
    {
      "command": "git rebase main",
      "description": "Different scenario from the hands-on: `topic` has one commit (`Add cache`); meanwhile `main` moved forward with `Update docs` and `Fix typo`. Rebasing replays `T` on top of the new `main` tip as **T'** (same patch, new parent, new SHA).\n\nThe old `T` commit lives on in `.git/objects` — reflog recovers it. The branch pointer just moves to the replayed copy. Below, you will apply this same mechanic to `feature-sqrt`.",
      "before": {
        "log": "D000000000000000000000000000000000000000|C000000000000000000000000000000000000000|Fix typo|main\nC000000000000000000000000000000000000000|B000000000000000000000000000000000000000|Update docs|\nT000000000000000000000000000000000000000|B000000000000000000000000000000000000000|Add cache|HEAD -> topic\nB000000000000000000000000000000000000000|A000000000000000000000000000000000000000|Add API|\nA000000000000000000000000000000000000000||Init|",
        "branches": "  main\n* topic",
        "head": "refs/heads/topic",
        "highlights": {
          "T000000000000000000000000000000000000000": { "color": "#003B5C", "secondary": "#FFD100" }
        }
      },
      "after": {
        "log": "T'00000000000000000000000000000000000000|D000000000000000000000000000000000000000|Add cache|HEAD -> topic\nD000000000000000000000000000000000000000|C000000000000000000000000000000000000000|Fix typo|main\nC000000000000000000000000000000000000000|B000000000000000000000000000000000000000|Update docs|\nB000000000000000000000000000000000000000|A000000000000000000000000000000000000000|Add API|\nA000000000000000000000000000000000000000||Init|",
        "branches": "  main\n* topic",
        "head": "refs/heads/topic",
        "highlights": {
          "T'00000000000000000000000000000000000000": { "color": "#003B5C", "secondary": "#FFD100" }
        }
      }
    }
    </script>
    </div>

    ### Task 1: Inspect the divergence

    Pre-built: `feature-sqrt` has `square_root`; `main` later got
    `Bump version notes` + `Add identity helper`.

    ```bash
    cd /tutorial/myproject
    git log --all --oneline --graph --decorate
    ```

    ### Task 2: Rebase and fast-forward

    **Predict before running:** how many parents will the feature tip have after rebase?

    ```bash
    git switch feature-sqrt
    git rebase main
    git switch main
    git merge feature-sqrt        # fast-forward, no merge commit
    git branch -d feature-sqrt
    ```

    Result: one linear line on the graph. No diamond.

    ### Task 3: Rebase through a conflict (desirable difficulty)

    Real rebases conflict when upstream touched the same lines.
    Produce one deliberately:

    ```bash
    git switch -c feature-trailer main~1
    echo '# end-of-module trailer' >> calculator.py
    git commit -am 'Add trailer comment at end of file'
    git rebase main       # CONFLICT — both sides appended at EOF
    git status
    ```

    Conflicts aren't failures — they're "two valid changes touched the
    same lines; a human must combine them." Edit `calculator.py` so the
    bottom keeps **both** the `square_root` function from `main` and your
    trailer comment, removing the `<<<` / `===` / `>>>` markers.

    ```bash
    git add calculator.py
    git rebase --continue         # NOT `git commit` — use the rebase verb
    git switch main
    git branch -D feature-trailer
    ```

    `git rebase --continue` opens nano with the commit's message, just like
    `cherry-pick --continue` in Step 5: press `Ctrl+X` to keep it.

    > **Remember:** rebase conflict = merge conflict mechanics, but finalize
    > with `git rebase --continue`. Bail with `git rebase --abort`.

    ### When to rebase vs merge

    | Situation | Prefer |
    |---|---|
    | Short feature branch (hours–days), only you | **Rebase** |
    | Long-lived or already-pushed branch used by teammates | **Merge** |
    | Cardinal rule | Never rebase **shared** history |
  setup_commands:
  - |
    cd /tutorial/myproject
    { [ -e .git/rebase-merge ] || [ -e .git/rebase-apply ]; } && git rebase --abort 2>/dev/null
    git switch -q main 2>/dev/null
    n=$(git log --all --oneline 2>/dev/null | grep -cE 'Add square_root function|Add identity helper')
    if [ $n -ge 2 ]; then
      exit 0
    fi
    git branch -D feature-sqrt 2>/dev/null
    if git log main --oneline | grep -q 'Add identity helper'; then
      git reset --hard HEAD~2 2>/dev/null
    fi
    git switch -qc feature-sqrt
    printf '\nimport math\ndef square_root(x):\n    """Return the square root of x; raises ValueError if negative."""\n    if x < 0:\n        raise ValueError("Cannot take sqrt of negative")\n    return math.sqrt(x)\n' >> calculator.py
    git commit -qam 'Add square_root function'
    git switch -q main
    # main's upstream work edits the top of the file, away from the end where
    # feature-sqrt appended, so Task 2's rebase replays without a conflict.
    { head -n 1 calculator.py; echo '# version 1.1 notes'; tail -n +2 calculator.py; } > calculator.py.tmp && mv calculator.py.tmp calculator.py
    git commit -qam 'Bump version notes'
    { head -n 2 calculator.py; echo 'def identity(x): return x'; tail -n +3 calculator.py; } > calculator.py.tmp && mv calculator.py.tmp calculator.py
    git commit -qam 'Add identity helper'
  solution:
    # The interactive instructions teach rebase + ff-merge + rebase-through-conflict.
    # The automated solution rebuilds the same end state deterministically:
    # square_root on main without a feature-sqrt merge commit.
    commands:
    - cd /tutorial/myproject && git switch main
    - '{ [ -e .git/rebase-merge ] || [ -e .git/rebase-apply ]; } && git rebase --abort 2>/dev/null'
    - '[ -e .git/MERGE_HEAD ] && git merge --abort 2>/dev/null'
    - git reset --hard HEAD
    - git clean -fdq
    - git branch -D feature-sqrt 2>/dev/null; true
    - git branch -D feature-trailer 2>/dev/null; true
    # Append square_root to main directly (equivalent to rebase + ff-merge end state)
    - "grep -q 'def square_root' calculator.py || (printf '\\nimport math\\ndef square_root(x):\\n    \"\"\"Return the square root of x; raises ValueError if negative.\"\"\"\\n    if x < 0:\\n        raise ValueError(\"Cannot take sqrt of negative\")\\n    return math.sqrt(x)\\n' >> calculator.py && git add calculator.py && git commit -m 'Add square_root function')"
    # Task 3: a trailer branch from main~1 conflicts at the end of the file;
    # keep both sides and finish the rebase without opening an editor.
    - git switch -c feature-trailer main~1
    - "echo '# end-of-module trailer' >> calculator.py && git commit -qam 'Add trailer comment at end of file'"
    - git rebase main || true
    - "sed -i -e '/^<<<<<<< /d' -e '/^=======$/d' -e '/^>>>>>>> /d' calculator.py && git add calculator.py && GIT_EDITOR=true git rebase --continue"
    - git switch main && git branch -D feature-trailer
    explanation: |
      - **Rebase = replay:** Git takes the commits on your branch that are not on the target (`feature-sqrt` commits not on `main`), computes their patches, resets the branch pointer to the target tip, and replays each patch as a *new* commit on top.
      - **New SHAs:** Because each replayed commit has a new parent, its SHA is different. Old commits remain in `.git/objects` and `git reflog` — nothing is ever truly lost, but anyone who fetched the old SHAs sees divergence.
      - **Fast-forward merge:** After a successful rebase, the feature branch is a strict extension of main. `git merge feature-sqrt` on main simply moves the main pointer forward — no merge commit.
      - **Rebase conflicts (Task 3):** When upstream and your branch touched the same lines, rebase pauses at the first problem commit. Resolution is identical to a merge conflict — edit the file, remove markers, `git add`, then `git rebase --continue` (*not* `git commit`). `git rebase --abort` bails out at any point.
      - **The rule:** rebase only local/private branches. Rewriting pushed history requires `--force-with-lease` and annoys everyone who already pulled.
  tests:
  - description: On main branch
    command: cd /tutorial/myproject && git symbolic-ref -q HEAD | grep -q 'refs/heads/main'
    hints:
    - text: 'After rebase + merge, end on `main`. `git switch main` if you drifted.'
  - description: feature-sqrt branch was merged and deleted
    command: cd /tutorial/myproject && ! git branch | grep -q 'feature-sqrt'
    hints:
    - text: 'After the fast-forward merge, delete the branch: `git branch -d feature-sqrt`. Safe because its commits are now reachable from `main`.'
  - description: square_root function is on main
    command: cd /tutorial/myproject && grep -q 'def square_root' calculator.py && git log --oneline main | grep -qi 'square_root'
    hints:
    - title: Rebase, then fast-forward
      text: 'Rebase replays `feature-sqrt` onto `main`''s tip; a plain `git merge feature-sqrt` on `main` then just slides `main` forward. `git log --oneline main` shows whether `square_root` arrived.'
    - title: Still on the feature branch?
      text: 'If `git branch` shows `* feature-sqrt`, the rebase is done but `main` hasn''t moved yet: `git switch main`, then `git merge feature-sqrt`. A non-fast-forward complaint means the rebase was skipped.'
  - description: History is linear (no merge commit for feature-sqrt)
    command: cd /tutorial/myproject && [ $(git log --merges --oneline main | grep -ci 'Merge branch.*feature-sqrt') -eq 0 ]
    hints:
    - title: Why a merge commit appeared
      text: 'A merge commit for `feature-sqrt` means the merge wasn''t a fast-forward: either `--no-ff` was used, or the rebase was skipped. `git log --oneline --graph main` shows the diamond.'
    - title: Redo it as rebase + fast-forward
      text: 'Find the pre-merge `main` in `git reflog` and `git reset --hard <sha>` to it. Then `git switch feature-sqrt`, `git rebase main`, `git switch main`, `git merge feature-sqrt`; this time the merge fast-forwards.'
  - description: The Task 3 rebase was resolved and continued, not aborted or skipped
    command: |
      cd /tutorial/myproject
      git reflog --format=%gs | grep -A1 '^rebase (finish): returning to refs/heads/feature-trailer$' | grep -q '^rebase (continue): '
    hints:
    - title: Produce the conflict first
      text: 'Task 3 branches `feature-trailer` from `main~1`, appends a trailer comment, commits, and rebases onto `main`. The rebase should stop with a conflict.'
    - title: Resolve, then continue
      text: 'Keep both the `square_root` function and the trailer, delete the marker lines, `git add calculator.py`, then `git rebase --continue` and press `Ctrl+X` in nano. Aborting or skipping the commit doesn''t count.'
  - description: No rebase is in progress and no conflict markers remain (Task 3 resolved)
    command: cd /tutorial/myproject && [ ! -d .git/rebase-merge ] && [ ! -d .git/rebase-apply ] && ! grep -E '^(<{7}|={7}|>{7})' calculator.py
    hints:
    - title: Finish or abort the paused rebase
      text: 'If `git status` says a rebase is in progress, edit the file, remove the `<<<` / `===` / `>>>` lines, `git add` it, then `git rebase --continue` (not `git commit`). `git rebase --abort` starts over.'
  quiz:
    title: "Step 8 — Knowledge Check"
    min_score: 0.8
    shuffle: true
    questions:
    - question: What does `git rebase main` do when run on `feature-sqrt`?
      options:
      - Moves `main` to point at the tip of `feature-sqrt`
      - Replays its own commits on top of `main`
      - Merges `main` into `feature-sqrt` with a merge commit
      - Deletes `main` and renames `feature-sqrt` to `main`
      correct_index: 1
      option_feedback:
        0: This answer reverses the direction; running `rebase main` on feature-sqrt rebases *feature-sqrt*, not main.
        2: This answer confuses rebase with merge; rebase is the linearizing alternative, no merge commit involved.
        3: This answer assumes destructive renaming; rebase moves the current branch's commits, never deletes other branches.
      explanation: 'Rebase rewrites the branch: feature-sqrt''s unique commits become *new* commits on top of main. This linearizes history but changes SHAs — so never rebase pushed branches others are using.'
    - question: After rebasing, why does the rebased commit have a **different SHA** than before?
      options:
      - Git renumbers SHAs for visual clarity after a rebase
      - Different parent changes the inputs to the SHA hash
      - Rebase encrypts each commit with a fresh per-rebase key
      - Rebase rewrites the commit message to mark it as rebased
      correct_index: 1
      option_feedback:
        0: This answer treats SHAs as cosmetic choices; they're deterministic content hashes, not chosen for clarity.
        2: This answer confuses content hashing with encryption.
        3: This answer assumes rebase rewrites text; the message is preserved, only the parent (and thus the SHA) changes.
      explanation: 'Step 3 again: `SHA(commit) = SHA-1(tree + parent(s) + author + committer + message)`. Change the parent → new SHA. Same patch, new identity.'
    - question: When is `git rebase` a **bad** idea?
      options:
      - On a personal feature branch that only you have checked out
      - On a short-lived local branch before opening a PR
      - On a shared branch teammates have already pulled
      - To linearize history before a fast-forward merge
      correct_index: 2
      option_feedback:
        0: This answer rejects rebase's canonical safe use case (private feature branch).
        1: This answer rejects another canonical safe use case (short-lived local branch before PR).
        3: This answer rejects rebase's exact intended workflow (linearize then ff-merge).
      explanation: Rebase rewrites history. If others have the old SHAs, their branches will diverge and they will get ugly conflicts. Stick to merge for anything pushed and shared, rebase for local linearization.
    - question: 'You rebased `feature-sqrt` and realized it broke everything. Before pushing. How do you recover the pre-rebase state?'
      options:
      - The pre-rebase commits are gone — rebase is permanent
      - '`git reset --hard` to the pre-rebase SHA from reflog'
      - Run `git stash pop` to retrieve the old commits
      - Clone a fresh copy of the repository from the remote
      correct_index: 1
      option_feedback:
        0: This answer ignores reflog's safety net; rebase only abandons refs, the old commits are still in `.git/objects/`.
        2: This answer confuses stash (working-tree shelving) with reflog (HEAD-position history).
        3: This answer is the "burning down the repo" antipattern when reflog can rescue locally.
      explanation: Rebase is only 'destructive' in the sense of changing branch pointers — the original commits remain in `.git/objects` until garbage collection. `git reflog` records every HEAD position including the pre-rebase tip; `git reset --hard` restores it. Your safety net, earned in Step 2.
    - question: After rebasing a feature onto `main`, you run `git merge feature` on `main`. What happens?
      options:
      - A merge commit with two parents is created (a diamond in the graph)
      - 'A fast-forward: `main` moves to the feature tip'
      - The rebase is reversed and the diamond merge is recreated
      - Git reports an error because `feature` was already rebased
      correct_index: 1
      option_feedback:
        0: This answer ignores that rebase made feature a strict extension of main, so merge fast-forwards instead of creating a merge commit.
        2: This answer assumes merge undoes rebase; they compose, they don't reverse.
        3: This answer assumes Git rejects this; it's actually the canonical "rebase + ff merge" workflow.
      explanation: 'After rebase, feature is a strict linear extension of main. The merge reduces to just advancing the main pointer (fast-forward) — no merge commit, no diamond. This is the whole reason many teams rebase before merging: clean, linear history.'
    - question: Which statements about rebase are true? (Select all that apply)
      type: multiple
      options:
      - Rebase creates new commits with new SHAs for each replayed commit
      - Rebase can cause conflicts at each replayed commit, requiring you to resolve one at a time with `git rebase --continue`
      - Rebase automatically pushes the updated branch
      - Rebase can be aborted with `git rebase --abort`, restoring the branch to its pre-rebase state
      correct_indices:
      - 0
      - 1
      - 3
      option_feedback:
        2: This answer confuses local rewriting with publication; push is always a separate step from rebase.
      explanation: Rebase applies each patch in turn and can conflict at any of them — you resolve, `git add`, `git rebase --continue`. `--abort` restores the pre-rebase state. Rebase does **not** push anything; that is a separate `git push` step (often needing `--force-with-lease` on rebased branches, which is where collaborator pain happens).
    - question: 'You had two choices for bringing a colleague''s single fix into `main`: cherry-pick or rebase. Both create new commits with new SHAs. What is the key difference in intent?'
      options:
      - Cherry-pick replays one commit; rebase replays the whole series
      - Cherry-pick is destructive to its source; rebase is not destructive
      - Cherry-pick requires the commit to be on a branch; rebase does not
      - They are identical aliases under the hood with the same semantics
      correct_index: 0
      option_feedback:
        1: This answer assumes cherry-pick mutates the source; it's purely additive, just like rebase's commit creation.
        2: This answer invents a constraint; cherry-pick takes any commit-ish, branch or not.
        3: This answer ignores the scope difference (one commit vs. a series).
      explanation: 'Under the hood they use the same machinery — patch out, replay on new parent, new SHA. The difference is *scope*: cherry-pick = one commit, rebase = a series. Step 5''s cherry-pick and Step 8''s rebase are the same technique at different scales.'
    - question: 'A rebase finished, and `git reflog` now lists `rebase (finish)`, two `rebase (pick)` lines, then `rebase (start)`, newest first. Which entry holds the branch''s pre-rebase tip?'
      options:
      - The entry just below `rebase (start)`
      - '`HEAD@{0}`, the `rebase (finish)` entry'
      - '`HEAD@{1}`, the newest `rebase (pick)` entry'
      - The oldest entry in the whole reflog
      correct_index: 0
      option_feedback:
        1: '`rebase (finish)` records where the rebase ended: the rewritten tip, not the original one.'
        2: A pick entry is a commit the rebase just created, so after a multi-commit rebase `HEAD@{1}` is still rewritten history.
        3: The oldest entry is where the reflog began, usually long before this rebase.
      explanation: The reflog lists newest first. Everything from `rebase (start)` upward is the rebase's own work, so the entry just below it is where HEAD stood before the rebase began. Right after the rebase, `ORIG_HEAD` (or `<branch>@{1}`) names the same commit, so `git reset --hard ORIG_HEAD` undoes a finished, unpushed rebase.
    - question: 'You edit a conflicted file during a `git rebase`, remove the `<<<<<<<` / `=======` / `>>>>>>>` markers, and run `git add`. What is the **next** command to finalize this one commit of the rebase?'
      options:
      - '`git commit` — same as finishing a merge'
      - '`git rebase --continue`, which resumes the replay'
      - '`git merge --continue` since you resolved merge markers'
      - '`git push` to publish the resolution'
      correct_index: 1
      option_feedback:
        0: This answer treats a rebase conflict like a merge conflict's final step; rebase needs `--continue`, not `commit`.
        2: This answer uses the wrong verb; this is a rebase, not a merge.
        3: This answer skips finalizing the rebase entirely.
      explanation: A rebase conflict uses the *same* markers and the *same* `git add` step as a merge conflict (basic tutorial Step 11). The *only* difference is the final verb — `git rebase --continue` tells Git to replay the remaining commits, which `git commit` would not. Running `git commit` by reflex here often leaves the rebase half-done. `git rebase --abort` at any point restores the pre-rebase state.
    - question: Put in order the commands to rebase a private 3-commit `feature` branch onto the latest `main` and fast-forward merge, with nothing leftover on disk.
      type: parsons
      display: block
      lines:
      - 'git switch feature'
      - 'git rebase main'
      - 'git switch main'
      - 'git merge feature'
      - 'git branch -d feature'
      distractors:
      - 'git push --force'
      - 'git merge feature --no-ff'
      - 'git rebase feature'
      - 'git reset --hard feature'
      explanation: Rebase the branch you are working on (`feature`) onto the branch you integrate into (`main`). Running `rebase feature` from main does the opposite — it rebases main onto feature, rewriting commits you didn't mean to touch. `--no-ff` prevents fast-forward (that's the point of this strategy — a linear, no-merge-commit result). `--force` has no place in a local pre-PR workflow.
# Pedagogy: PRIMM — Modify + Make (the second threshold step: reshape history with intent)
- title: 'Interactive Rebase: Edit, Squash, Reorder, Drop'
  view: git_graph
  instructions: |
    ### Why this matters

    Interactive rebase is what separates engineers who *use* Git from engineers who *shape* Git history. PR reviewers shouldn't see your seven WIP commits — they should see one clean commit per logical change. This step also covers the worst-case scenario: you accidentally committed a secret. Knowing how to drop a commit (and recover it from reflog if you need to rotate the secret) turns a panic moment into a routine fix.

    ### 🎯 You will learn to
    - **Squash** messy WIP commits into one clean commit before opening a PR.
    - **Drop** an accidentally-committed secret (and recover it from reflog if needed).
    - **Reword** a commit message retroactively without changing its diff.
    - **Pick the right verb** (`pick`/`reword`/`squash`/`fixup`/`drop`/`edit`) for the rewriting goal.

    ### 🚪 This is the second threshold step

    Step 9 is the densest step in the tutorial — eight verbs, several edge
    cases, and the most "wait, what?" moments in real Git. That's not a
    bug; it's where most engineers' command of Git plateaus. *Crossing*
    this threshold is what separates "I use Git" from "I shape Git
    history." Plan two passes. Don't worry if Task 4 needs a re-read.

    ### ⚠️ Safe zone only

    Interactive rebase **rewrites history** (Step 3: new parents → new SHAs).
    Run it only on commits that (a) are unpushed, or (b) live on a feature
    branch **only you** use. For public history, use `git revert` (next).

    ### 🤔 Predict first

    After `rebase -i` collapses four messy commits into one clean commit,
    do the original four still exist anywhere — and could you recover one
    of them with `git reflog`?

    > 💡 **Schema check.** Same pattern as Steps 5 & 8: every rewriting verb
    > here (`squash`, `drop`, `reword`, `edit`) creates new commit objects
    > and moves the branch pointer. The "old" commits don't disappear —
    > they're just unreferenced. Reflog finds them.

    <div data-git-command-lab role="region" aria-label="Interactive commit-graph demo: rebase -i with three squash directives collapses four messy WIP commits on a feature-login branch into one clean commit before opening a pull request.">
    <script type="application/json">
    {
      "command": "git rebase -i HEAD~4   (squash into one)",
      "description": "Different scenario from the hands-on: four messy commits on `feature-login` — `Add login`, plus three nit fixes — collapse into one clean commit **W+F+F+M** before the PR reviewer sees them. Line 1 must stay `pick` because `squash` melds **into the previous** line; line 1 has no previous.\n\nYou'll apply the same `pick/squash/squash/squash` pattern to `refactor-power` below.",
      "rebaseFile": "pick   W Add login\nsquash F Fix indent\nsquash F Fix lint\nsquash M Fix nit\n\n# Rebase abc1234..M onto abc1234 (4 commands)\n#\n# Commands:\n# p, pick   = use commit as-is\n# s, squash = meld into previous commit\n# f, fixup  = squash, discard this commit's message\n# d, drop   = remove commit",
      "before": {
        "log": "M000000000000000000000000000000000000000|F200000000000000000000000000000000000000|Fix nit|HEAD -> feature-login\nF200000000000000000000000000000000000000|F100000000000000000000000000000000000000|Fix lint|\nF100000000000000000000000000000000000000|W000000000000000000000000000000000000000|Fix indent|\nW000000000000000000000000000000000000000|B000000000000000000000000000000000000000|Add login|\nB000000000000000000000000000000000000000|A000000000000000000000000000000000000000|Add API|main\nA000000000000000000000000000000000000000||Init|",
        "branches": "  main\n* feature-login",
        "head": "refs/heads/feature-login",
        "highlights": {
          "W000000000000000000000000000000000000000": { "color": "#003B5C", "secondary": "#FFD100" },
          "F100000000000000000000000000000000000000": { "color": "#003B5C", "secondary": "#FFD100" },
          "F200000000000000000000000000000000000000": { "color": "#003B5C", "secondary": "#FFD100" },
          "M000000000000000000000000000000000000000": { "color": "#003B5C", "secondary": "#FFD100" }
        }
      },
      "after": {
        "log": "WFFM000000000000000000000000000000000000|B000000000000000000000000000000000000000|Add login feature|HEAD -> feature-login\nB000000000000000000000000000000000000000|A000000000000000000000000000000000000000|Add API|main\nA000000000000000000000000000000000000000||Init|",
        "branches": "  main\n* feature-login",
        "head": "refs/heads/feature-login",
        "highlights": {
          "WFFM000000000000000000000000000000000000": { "color": "#003B5C", "secondary": "#FFD100" }
        }
      }
    }
    </script>
    </div>

    <div data-git-command-lab role="region" aria-label="Interactive commit-graph demo: rebase -i with drop removes a commit that leaked an API token from branch history. The dropped commit still exists in the object database, recoverable via reflog until garbage collection runs.">
    <script type="application/json">
    {
      "command": "git rebase -i HEAD~2   (drop)",
      "description": "Different scenario from the hands-on: one commit accidentally **leaked an API token**; the next one added tests. `drop` removes the leak commit from branch history; `Add tests` replays as **T'** on top of the pre-leak tip. The dropped commit is **not deleted** — it lives in `.git/objects`, reachable via reflog until `git gc`.\n\nYou'll use the same `drop` verb on the `SECRET_API_KEY` commit in the hands-on.",
      "rebaseFile": "drop S Leak token\npick T Add tests\n\n# Rebase abc1234..T onto abc1234 (2 commands)\n#\n# Commands:\n# p, pick = use commit\n# d, drop = remove commit",
      "before": {
        "log": "T000000000000000000000000000000000000000|S000000000000000000000000000000000000000|Add tests|HEAD -> feature-login\nS000000000000000000000000000000000000000|R000000000000000000000000000000000000000|Leak token|\nR000000000000000000000000000000000000000||Add login feature|",
        "branches": "* feature-login",
        "head": "refs/heads/feature-login",
        "highlights": {
          "S000000000000000000000000000000000000000": { "color": "#C0392B", "secondary": "#fff" },
          "T000000000000000000000000000000000000000": { "color": "#003B5C", "secondary": "#FFD100" }
        }
      },
      "after": {
        "log": "T'00000000000000000000000000000000000000|R000000000000000000000000000000000000000|Add tests|HEAD -> feature-login\nR000000000000000000000000000000000000000||Add login feature|",
        "branches": "* feature-login",
        "head": "refs/heads/feature-login",
        "highlights": {
          "T'00000000000000000000000000000000000000": { "color": "#003B5C", "secondary": "#FFD100" }
        }
      }
    }
    </script>
    </div>

    ### The four verbs you'll use here

    | Verb | Effect |
    |---|---|
    | `pick` | Use commit as-is (default) |
    | `squash` | Meld into previous; combine messages |
    | `drop` | Remove commit |
    | `reword` | Edit message only |

    <details markdown="1"><summary>📋 All six core verbs (`fixup`, `edit`)</summary>

    | Verb | Effect |
    |---|---|
    | `pick` | Use commit as-is (default) |
    | `reword` | Edit message only |
    | `edit` | Pause so you can `commit --amend` or add fixes / **split** |
    | `squash` | Meld into previous; combine messages |
    | `fixup` | Like squash, drop this commit's message |
    | `drop` | Remove commit |

    Two more verbs exist for advanced workflows: `break` (pause mid-rebase
    so you can poke around, then `git rebase --continue`) and `exec <cmd>`
    (run a shell command after each replayed commit, e.g. `exec pytest`).
    See `git help rebase` if you need them.

    </details>

    <details markdown="1"><summary>🛠 Why the todo edits use scripted `sed`</summary>

    Real workflow: `git rebase -i HEAD~N` opens your editor (nano in this
    VM) on the todo list; you change the action words, save, and exit. Here
    we script that edit with `GIT_SEQUENCE_EDITOR="sed -i …"` so each run is
    exact and you can check it against your prediction. Git still opens nano
    whenever it needs a commit message: press `Ctrl+X` to keep the message
    it shows.

    **The skill is knowing what to change, not typing the `sed`.** For each
    task: (1) predict the edit on paper, (2) run the scripted version,
    (3) verify the log matches your prediction.

    </details>

    ### Task 1: Inspect the messy branch

    ```bash
    cd /tutorial/myproject
    git log --oneline -5           # 4 ugly commits on refactor-power
    ```

    ### Task 2: Squash four commits into one

    The current branch has one substantive commit at the bottom of `HEAD~4`
    and three increasingly trivial typo-fixes on top. Goal: collapse the
    typo-fixes into the substantive commit so `git log` shows one clean entry.

    **Predict before you peek:**
    - Which line of the rebase todo (1 = oldest, 4 = newest) must stay `pick`?
    - Which verb from the table melds a commit into the *previous* one and
      keeps both messages for the editor?
    - What's the line *range* the verb applies to?

    Commit to your three answers, *then* run the corresponding scripted rebase.

    <details markdown="1"><summary>Reveal the matching sed and verify</summary>

    ```bash
    GIT_SEQUENCE_EDITOR="sed -i '2,4s/^pick/squash/'" git rebase -i HEAD~4
    git commit --amend -m "Refactor: cleanup notes in calculator.py"
    git log --oneline -3
    ```

    During the rebase, Git opens nano with all four messages combined.
    Press `Ctrl+X` to keep them; the `--amend` line then replaces them with
    one clean message.

    Lines 2–4 get `squash` (they meld up into line 1). Line 1 must stay
    `pick` — it's the anchor each later commit melds into. If you predicted
    `fixup`, you'd lose the typo-fix commit messages silently; `squash`
    keeps them so `commit --amend` can rewrite a clean unified message.

    </details>

    ### Task 3: Drop a secret-leaking commit

    Create `secrets.env` containing `SECRET_API_KEY=oops` and commit it:
    `git add secrets.env && git commit -m "Accidentally add secret (should be dropped)"`.

    Then append `def placeholder(): pass` to `calculator.py` and commit:
    `git commit -am "Add placeholder function"`.

    **Predict:** of the two commits in `HEAD~2..HEAD`, which line of the
    rebase todo (1 = older, 2 = newer) is the secret? Which verb removes a
    commit entirely while leaving the rest?

    <details markdown="1"><summary>Reveal the matching sed and verify</summary>

    ```bash
    GIT_SEQUENCE_EDITOR="sed -i '1s/^pick/drop/'" git rebase -i HEAD~2
    git grep SECRET_API_KEY || echo "secret is gone from branch"
    ```

    The secret is the older of the two — line 1. `drop` removes it; the
    placeholder commit on line 2 stays as `pick` and is replayed on top
    of the unchanged base.

    </details>

    ### Task 3b: Prove reflog rescues the "dropped" commit

    Dropped ≠ deleted (Step 3 again).

    ```bash
    git reflog -n 10
    SECRET_SHA=$(git reflog | grep -m1 'Accidentally add secret' | awk '{print $1}')
    git branch secret-backup $SECRET_SHA
    git log secret-backup --oneline
    ```

    <details markdown="1"><summary>⚠️ For *real* secrets: drop+rescue is the wrong workflow</summary>

    Drop + rescue leaves *more* copies of the secret, not fewer. For an actual
    leaked credential:

    1. Rotate the credential immediately (the only step that truly mitigates).
    2. Scrub with `git filter-repo` or BFG.
    3. Ask collaborators to re-clone.

    Use `drop` only for non-sensitive cleanup (debug prints, experiments).

    </details>

    ### Task 4: Reword a message

    **Predict:** when you `reword` a commit, Git opens *two* editors in
    sequence — first to let you change the verb in the rebase todo, then
    to let you rewrite the actual commit message. In v86 we replace each
    with a scripted `sed`. Which env var drives which editor?

    <details markdown="1"><summary>Reveal the matching sed and verify</summary>

    ```bash
    GIT_SEQUENCE_EDITOR="sed -i '2s/^pick/reword/'" \
      GIT_EDITOR="sed -i '1s/.*/Add placeholder for upcoming helpers/'" \
      git rebase -i HEAD~2
    git log --oneline -3
    ```

    `GIT_SEQUENCE_EDITOR` controls the *todo list* (line 2's `pick` becomes
    `reword`, so the placeholder commit is the one reworded). `GIT_EDITOR`
    controls the *message editor* (it rewrites the first line of that
    commit's message). In real life you'd hand-edit both;
    here we script them with one-line `sed` substitutions.

    </details>

    ### Wrap-up: rule of thumb

    - **Local, unpushed** history → `rebase -i` (any verb).
    - **Shared, pushed** history → `git revert` only (next step).

    Rewriting public history forces every collaborator to reconcile.
  watch_files:
  - myproject/calculator.py
  open_file: myproject/calculator.py
  setup_commands:
  - "cd /tutorial/myproject\n{ [ -e .git/rebase-merge ] || [ -e .git/rebase-apply ]; } && git rebase --abort 2>/dev/null\ngit switch -q main 2>/dev/null\nif git log refactor-power --oneline 2>/dev/null | grep -q 'More typo fixes'; then\n  git switch -q refactor-power 2>/dev/null\n  exit 0\nfi\ngit branch -D refactor-power 2>/dev/null\ngit switch -qc refactor-power\necho '# WIP: try new power approach' >> calculator.py\ngit commit -qam 'WIP'\nsed -i 's/# WIP: try new power approach/# starting refactor/' calculator.py\ngit commit -qam 'Fix typo'\necho '# TODO: edge cases' >> calculator.py\ngit commit -qam 'Fix typo again'\necho '# done iterating' >> calculator.py\ngit commit -qam 'More typo fixes'\n"
  solution:
    # The interactive instructions teach `rebase -i` with squash, drop, and
    # reword. The automated solution rebuilds the same end state directly:
    # refactor-power has no WIP/typo commits, no SECRET_API_KEY, and a
    # secret-backup branch points to a 'Accidentally add secret' commit.
    commands:
    - cd /tutorial/myproject
    - '{ [ -e .git/rebase-merge ] || [ -e .git/rebase-apply ]; } && git rebase --abort 2>/dev/null'
    - '[ -e .git/CHERRY_PICK_HEAD ] && git cherry-pick --abort 2>/dev/null'
    - git switch -q main 2>/dev/null
    - git reset --hard HEAD
    - git clean -fdq
    # Recreate refactor-power with a single clean commit (replaces the WIP/typo mess)
    - git branch -D refactor-power 2>/dev/null; true
    - git switch -c refactor-power
    - "echo '# starting refactor' >> calculator.py && git add calculator.py && git commit -m 'Refactor: cleanup notes in calculator.py'"
    # Make a transient secret commit, anchor secret-backup to it, then drop it
    - "echo 'SECRET_API_KEY=oops' > secrets.env && git add secrets.env && git commit -m 'Accidentally add secret (should be dropped)'"
    - git branch -f secret-backup HEAD
    - git reset --hard HEAD~1
    # Add the placeholder, then reword it with a real interactive rebase
    - "echo 'def placeholder(): pass' >> calculator.py && git commit -qam 'Add placeholder function'"
    - |
      GIT_SEQUENCE_EDITOR="sed -i '2s/^pick/reword/'" GIT_EDITOR="sed -i '1s/.*/Add placeholder for upcoming helpers/'" git rebase -i HEAD~2
    explanation: |
      > ⚠️ **Note on this automated solution.** The `commands` above *rebuild the
      > squash and drop end states* directly — only the reword replays the
      > `rebase -i` motion the step is teaching. If you click "Show
      > solution" and run these commands, you'll pass the gates without ever
      > experiencing the interactive todo-list editor. **For the lesson to
      > stick, redo the step by hand** with `GIT_SEQUENCE_EDITOR="sed -i …"
      > git rebase -i HEAD~N` (or open the todo list in your real editor).
      > The Tutorial-runtime can't replicate mid-flow editor edits inside an
      > automated solution, so we rebuild the end state — but that shortcut
      > skips the verb you came here to learn.

      - **`git rebase -i HEAD~N`:** opens the todo list for the last N commits. You mark each with one of six core verbs (`pick`, `reword`, `squash`, `fixup`, `edit`, `drop`); two more (`break`, `exec`) exist for advanced workflows — see `git help rebase`.
      - **`squash` vs `fixup`:** both meld with the previous commit. `squash` combines messages (editor opens); `fixup` silently drops the squashed commit's message. Use `fixup` for tiny typos, `squash` when the message has information worth keeping.
      - **`drop`:** deletes the commit from history. Useful for removing accidentally-committed secrets, debug prints, or experiments that did not pan out. The dropped commit remains in reflog for recovery.
      - **`reword`:** edits the message without touching content. Fixes typos in commit messages retroactively.
      - **Recovery:** right after a rebase, `ORIG_HEAD` (or `<branch>@{1}`) is the pre-rebase tip, so `git reset --hard ORIG_HEAD` restores the branch exactly. `HEAD@{1}` is not that commit after a multi-commit rebase: it is one of the rebase's own steps.
  tests:
  - description: On refactor-power branch
    command: cd /tutorial/myproject && git symbolic-ref -q HEAD | grep -q 'refs/heads/refactor-power'
    hints:
    - text: '`git switch refactor-power` before rebasing. Interactive rebase rewrites the *current* branch.'
  - description: The secret was committed, then dropped from the branch's files
    command: |
      cd /tutorial/myproject
      git reflog --format=%gs | grep -qi '^commit: accidentally add secret' && ! git grep -q SECRET_API_KEY HEAD --
    hints:
    - title: Commit the secret first
      text: 'Task 3 starts by committing `secrets.env` with the message "Accidentally add secret (should be dropped)", then a placeholder commit on top.'
    - title: Drop the secret commit
      text: 'During `rebase -i HEAD~2`, change the secret commit''s `pick` to `drop`. Scripted: `GIT_SEQUENCE_EDITOR="sed -i ''1s/^pick/drop/''" git rebase -i HEAD~2`.'
  - description: The secret commit is gone from the branch's history
    command: |
      cd /tutorial/myproject
      git reflog --format=%gs | grep -qi '^commit: accidentally add secret' && ! git log --oneline | grep -qi 'Accidentally add secret'
    hints:
    - text: 'The commit is still in `git log`. Run the interactive rebase with `drop` (not `pick`) on the secret commit''s line.'
  - description: secret-backup branch rescued the 'dropped' commit via reflog (proves reflog safety net)
    command: cd /tutorial/myproject && git log secret-backup --oneline 2>/dev/null | grep -qi 'Accidentally add secret'
    hints:
    - text: '`git reflog` → find the SHA of the dropped "Accidentally add secret" commit → `git branch secret-backup <sha>`. The dropped commit is still in `.git/objects`; you''re just anchoring it.'
  - description: The 4 messy WIP/typo commits were squashed into fewer commits
    command: cd /tutorial/myproject && [ $(git log --oneline refactor-power | grep -ciE '(WIP|Fix typo|More typo)') -le 1 ]
    hints:
    - title: Fold lines 2–4 into line 1
      text: 'Rebase with `squash` (or `fixup`) on lines 2–4 to fold them into the pick on line 1. After the rebase, the WIP/typo commits should be folded together.'
  - description: The placeholder commit was reworded with rebase -i
    command: |
      cd /tutorial/myproject
      git reflog --format=%gs | grep -q '^rebase (reword): ' && git grep -q 'def placeholder' HEAD -- && ! git log refactor-power --format=%s | grep -qx 'Add placeholder function'
    hints:
    - title: Reword the newer commit
      text: 'In `rebase -i HEAD~2`, the placeholder commit is line 2 (the newer one). Mark that line `reword`, then supply the new message.'
    - title: Two editors, two variables
      text: '`GIT_SEQUENCE_EDITOR` edits the todo list and `GIT_EDITOR` edits the commit message. Task 4 scripts both with `sed`.'
  quiz:
    title: "Step 9 — Knowledge Check"
    min_score: 0.8
    shuffle: true
    questions:
    - question: Which interactive-rebase action **keeps the commit** but lets you change only its message?
      options:
      - '`pick`'
      - '`reword`'
      - '`squash`'
      - '`drop`'
      correct_index: 1
      option_feedback:
        0: This answer doesn't change anything; `pick` is a no-op that uses the commit as-is.
        2: This answer melds two commits; the question asks for a message-only edit on one commit.
        3: This answer deletes the commit instead of editing it.
      explanation: '`reword` keeps the commit content identical but opens the editor to change the message. `pick` is no-op, `squash` melds into the previous commit, `drop` deletes it.'
    - question: What is the difference between `squash` and `fixup`?
      options:
      - 'Only `squash` keeps the melded message'
      - '`squash` rewrites hash; `fixup` preserves it'
      - '`fixup` can only be used on merge commits'
      - They are identical
      correct_index: 0
      option_feedback:
        1: This answer confuses 'rewrites the SHA' (both do, all rebase verbs do) with the actual difference (message handling).
        2: This answer invents a constraint; fixup works on any commit, not just merges.
        3: This answer ignores the actual difference (whether the editor opens for the squashed message).
      explanation: Both meld into the previous commit. `squash` opens the editor so you can combine messages; `fixup` just drops the squashed commit's message. Use `fixup` for trivial typos, `squash` when both messages are meaningful.
    - question: You just ran `git rebase -i HEAD~3` and realized you dropped a commit you needed. Nothing is pushed. How do you get it back?
      options:
      - You can't — dropped commits are deleted
      - '`git reset --hard ORIG_HEAD` restores the pre-rebase tip'
      - '`git rebase --undo` reverses the last rebase'
      - '`git reset --hard HEAD@{1}`, the previous HEAD position'
      correct_index: 1
      option_feedback:
        0: This answer ignores reflog's safety net; the dropped commit is unreferenced, not deleted.
        2: This answer invents a subcommand; `git rebase` has no `--undo`.
        3: After `rebase -i`, the newest reflog entries are the rebase's own steps, so `HEAD@{1}` is still rewritten history, not the pre-rebase tip.
      explanation: Right after a rebase, `ORIG_HEAD` (or `<branch>@{1}`, from the branch's own reflog) is the pre-rebase tip, so `git reset --hard ORIG_HEAD` restores it. In `git reflog`, the same commit is the entry just below `rebase (start)`. Dropped commits remain in `.git/objects` until garbage collection prunes them — **this is the safety net.**
    - question: 'After an interactive rebase, the rewritten commits have new SHAs even if their patches are identical. Why?'
      options:
      - Interactive rebase randomly generates SHAs
      - A new parent means a new hash
      - Interactive rebase encrypts commits
      - Git renames the commits for clarity
      correct_index: 1
      option_feedback:
        0: This answer assumes randomness; SHAs are deterministic content + parent hashes.
        2: This answer confuses hashing with encryption.
        3: This answer treats SHAs as cosmetic; they're determined by content + parents, not chosen for clarity.
      explanation: 'Same answer as for simple rebase: different parent → different SHA. The object model does not allow ''editing'' a commit — all that changes is which commit the branch pointer references.'
    - question: Which of these is the **most dangerous** use of interactive rebase?
      options:
      - On a local branch to `squash` WIP commits before opening a PR
      - On a local branch to drop a commit that accidentally included a secret
      - On shared `main`, dropping a week-old commit
      - On a personal experiment branch that nobody else has cloned
      correct_index: 2
      option_feedback:
        0: This answer rejects interactive rebase's canonical safe use case (local WIP cleanup before PR).
        1: This answer flags a safe-zone use; rewriting unpushed history is the right context for `drop`.
        3: This answer flags another safe-zone use; nobody else holds the old SHAs on a personal experiment branch.
      explanation: Rewriting shared history is the nuclear option. Everyone who fetched the old commits now has a conflicting local copy of main; their pulls fail spectacularly. For public history, use `git revert` (which creates a new *anti-matter* commit) instead. Reserve interactive rebase for local cleanup.
    - question: You want to split one giant commit into three smaller ones during interactive rebase. Which action lets you do that?
      options:
      - '`pick` — keeps the commit as-is for later editing'
      - '`squash` — combines several commits into a smaller set'
      - '`edit` — pauses there so you can re-commit in pieces'
      - '`reword` — opens the editor so you can describe the split'
      correct_index: 2
      option_feedback:
        0: This answer keeps the commit as-is; splitting requires pausing and recomposing.
        1: This answer merges commits; splitting goes the other direction.
        3: This answer changes the message; splitting changes the commit count.
      explanation: '`edit` pauses rebase at that commit with HEAD there. You then `git reset HEAD~` (un-commit but keep changes staged/unstaged), split the changes into multiple `git add` + `git commit` cycles, and finally `git rebase --continue`. The original one commit is replaced by your new sequence.'
    - question: 'In Task 3b you ''rescued'' a dropped commit. In terms of the object database, what did `git branch secret-backup <sha>` actually do?'
      options:
      - It copied the dropped commit from `.git/trash` back into `.git/objects`
      - It wrote one ref file pointing at the commit
      - It recreated the commit from the reflog's textual record
      - It undid the rebase
      correct_index: 1
      option_feedback:
        0: This answer invents a `.git/trash` directory; Git has none — nothing was ever moved out of `.git/objects/`.
        2: This answer assumes reflog reconstructs commits from text; the commits were never gone, only unreachable.
        3: This answer assumes branch creation is a global undo; it only adds one ref (no rebase reversal).
      explanation: Same mechanic as Step 2's rescued-work branch. The dropped commit was never deleted — only unreferenced. Creating a branch (one 41-byte file) re-anchors it as reachable. Now `git gc` won't prune it. This is the same reflog + branch recipe, applied to a different scenario (rebase-drop vs detached-HEAD-orphan).
    - question: 'You are about to interactive-rebase a branch. You have uncommitted edits you want to keep but not carry through the rebase. Safest workflow?'
      options:
      - Commit them as WIP then rebase — they will survive
      - '`git stash` them, rebase, then `git stash pop` onto the rebased branch'
      - Run rebase with `--ignore-uncommitted`
      - Git rebase will refuse to start if you have uncommitted changes, so nothing to worry about
      correct_index: 1
      option_feedback:
        0: This answer pollutes history; the question explicitly says "keep but not carry through" — WIP commits get carried through.
        2: This answer invents a flag; rebase has no `--ignore-uncommitted` option.
        3: This answer is half-true (rebase does refuse) but doesn't address how to handle the uncommitted work the question wants preserved.
      explanation: 'Rebase refuses to start with dirty working tree — so Git is already stopping you. Stash is the clean pattern: preserve the work-in-progress (Step 4), do the rebase, pop the stash onto the rebased branch. This composes tools across steps — recognizing when two tools work together is the mark of Git fluency.'
    - question: Put in order the steps to squash 4 messy commits on a local branch into one clean commit (assuming you're using the scripted VM editor).
      type: parsons
      display: block
      lines:
      - 'git log --oneline -5'
      - 'GIT_SEQUENCE_EDITOR="sed -i ''2,4s/^pick/squash/''" git rebase -i HEAD~4'
      - 'git commit --amend -m "Refactor: cleanup notes in calculator.py"'
      - 'git log --oneline -3'
      distractors:
      - 'git push --force'
      - 'git rebase -i HEAD~4 --squash-all'
      - 'git reset --hard HEAD~4'
      - 'git merge --squash HEAD~4'
      explanation: The canonical pre-PR cleanup. `git push --force` breaks the cardinal rule. `git rebase -i HEAD~4 --squash-all` invents a flag. `git reset --hard HEAD~4` discards instead of squashing (no single commit preserves the combined patch). `git merge --squash HEAD~4` is for *branch-to-branch* collapse, not for cleaning up commits on the current branch.
# Pedagogy: PRIMM — Predict + Investigate (parents-count prediction reveals bisect implications)
- title: 'Squash Merge: Collapse a Feature Into a Single Commit'
  view: git_graph
  instructions: |
    ### Why this matters

    Many teams default to GitHub's "Squash and merge" button without understanding the trade-off they just made. Squash gives you a beautifully clean `main` log — at the cost of intra-feature `bisect` precision later. Knowing the trade-off (and how to recover individual commits when bisect needs them) is what makes you the reviewer who picks the right strategy per PR rather than rubber-stamping the default.

    ### 🎯 You will learn to
    - **Pick** squash vs. rebase vs. merge based on how `main`'s log should read.
    - **Anticipate the trade-off:** clean main, lost intra-feature `bisect` precision.
    - **Recover** individual feature commits if a regression needs fine-grained blame.

    `git merge --squash <branch>` collapses a multi-commit feature into **one
    new commit** on `main`. The feature branch is untouched.

    ### 🤔 Predict first

    After `git merge --squash feature` followed by `git commit`, how many
    parents does the new commit on `main` have — one, two, or three? And
    what does that imply for `git bisect` later?

    <details markdown="1"><summary>📋 Three merge strategies side by side (Steps 8 + 10 unified)</summary>

    | Method | main's graph | Use when |
    |---|---|---|
    | `git merge feature` | Merge commit, 2 parents (diamond) | Long-lived branch; preserve merge context |
    | `rebase + merge` (ff) | Linear, each commit preserved | Short feature; keep individual commits |
    | `git merge --squash` | **One new commit**, branch untouched | Want `main` to read as one commit per feature |

    </details>

    <div data-git-command-lab role="region" aria-label="Interactive commit-graph demo: git merge --squash followed by git commit collapses a feature branch's three commits into one new commit on main. The feature branch and its individual commits remain untouched, available for later fine-grained bisect.">
    <script type="application/json">
    {
      "command": "git merge --squash feature-auth && git commit",
      "description": "Different scenario from the hands-on: collapse `feature-auth`'s three commits (`Add signin`, `Add logout`, `Add session`) into **one** new commit on `main`. The feature branch is **untouched** — its commits still exist there, valuable later when `bisect` needs fine-grained precision inside the feature.\n\nCompare to rebase (Step 8): rebase produces **three** new commits on main; squash produces **one**. Same feature, different main-log shape. You'll apply this below to `feature-stats`.",
      "before": {
        "log": "C000000000000000000000000000000000000000|B000000000000000000000000000000000000000|Refactor|HEAD -> main\nS300000000000000000000000000000000000000|S200000000000000000000000000000000000000|Add session|feature-auth\nS200000000000000000000000000000000000000|S100000000000000000000000000000000000000|Add logout|\nS100000000000000000000000000000000000000|B000000000000000000000000000000000000000|Add signin|\nB000000000000000000000000000000000000000|A000000000000000000000000000000000000000|Add API|\nA000000000000000000000000000000000000000||Init|",
        "branches": "* main\n  feature-auth",
        "head": "refs/heads/main",
        "highlights": {
          "S100000000000000000000000000000000000000": { "color": "#003B5C", "secondary": "#FFD100" },
          "S200000000000000000000000000000000000000": { "color": "#003B5C", "secondary": "#FFD100" },
          "S300000000000000000000000000000000000000": { "color": "#003B5C", "secondary": "#FFD100" }
        }
      },
      "after": {
        "log": "Σ000000000000000000000000000000000000000|C000000000000000000000000000000000000000|Add auth module|HEAD -> main\nC000000000000000000000000000000000000000|B000000000000000000000000000000000000000|Refactor|\nS300000000000000000000000000000000000000|S200000000000000000000000000000000000000|Add session|feature-auth\nS200000000000000000000000000000000000000|S100000000000000000000000000000000000000|Add logout|\nS100000000000000000000000000000000000000|B000000000000000000000000000000000000000|Add signin|\nB000000000000000000000000000000000000000|A000000000000000000000000000000000000000|Add API|\nA000000000000000000000000000000000000000||Init|",
        "branches": "* main\n  feature-auth",
        "head": "refs/heads/main",
        "highlights": {
          "Σ000000000000000000000000000000000000000": { "color": "#003B5C", "secondary": "#FFD100" }
        }
      }
    }
    </script>
    </div>

    ### Task 1: Inspect the feature

    ```bash
    cd /tutorial/myproject
    git log feature-stats --oneline -5     # three focused commits
    ```

    ### Task 2: Squash-merge

    ```bash
    git switch main
    git merge --squash feature-stats
    git status       # staged changes, but NO commit yet — squash stops here
    git commit -m "Add descriptive statistics module (mean, variance, stddev)"
    ```

    ### Task 3: Confirm + clean up

    ```bash
    git log --oneline main            # one new commit for the feature
    git branch -D feature-stats       # -D because not ff-merged in Git's view
    ```

    <details markdown="1"><summary>⚠️ The cost: bisect granularity</summary>

    `bisect` on `main` can only narrow to the *whole* feature commit, not one
    of its three internal commits. Deleting the branch (as Task 3 does)
    removes your easy handle on those commits. Teams that delete
    squash-merged branches rely on their hosting service keeping each pull
    request's commits; your local reflog helps only for a few weeks, because
    entries for unreachable commits expire after 30 days by default.

    </details>
  setup_commands:
  - "cd /tutorial/myproject\n[ -e .git/MERGE_HEAD ] && git merge --abort 2>/dev/null\ngit switch -q main 2>/dev/null\nif git log feature-stats --oneline 2>/dev/null | grep -q 'Add stddev function'; then\n  exit 0\nfi\ngit branch -D feature-stats 2>/dev/null\ngit switch -qc feature-stats\nprintf '\\ndef mean(values):\\n    return sum(values) / len(values)\\n' >> calculator.py\ngit commit -qam 'Add mean function'\nprintf '\\ndef variance(values):\\n    m = mean(values)\\n    return sum((x - m) ** 2 for x in values) / len(values)\\n' >> calculator.py\ngit commit -qam 'Add variance function'\nprintf '\\nimport math as _math\\ndef stddev(values):\\n    return _math.sqrt(variance(values))\\n' >> calculator.py\ngit commit -qam 'Add stddev function'\ngit switch -q main\n"
  solution:
    commands:
    - cd /tutorial/myproject
    - '{ [ -e .git/rebase-merge ] || [ -e .git/rebase-apply ]; } && git rebase --abort 2>/dev/null'
    - '[ -e .git/MERGE_HEAD ] && git merge --abort 2>/dev/null'
    - git switch -q main 2>/dev/null
    - git reset --hard HEAD
    - git clean -fdq
    # If feature-stats wasn't created by setup, build the equivalent end state
    - "if git rev-parse --verify feature-stats 2>/dev/null; then git merge --squash feature-stats && git commit -m 'Add descriptive statistics module (mean, variance, stddev)'; else printf '\\ndef mean(values):\\n    return sum(values) / len(values)\\n\\ndef variance(values):\\n    m = mean(values)\\n    return sum((x - m) ** 2 for x in values) / len(values)\\n\\nimport math as _math\\ndef stddev(values):\\n    return _math.sqrt(variance(values))\\n' >> calculator.py && git add calculator.py && git commit -m 'Add descriptive statistics module (mean, variance, stddev)'; fi"
    - git branch -D feature-stats 2>/dev/null; true
    explanation: |
      - **`git merge --squash <branch>`:** applies the cumulative diff of `<branch>` vs main's merge base, stages it, but **does not commit**. You then `git commit` with a fresh message. Main gains one commit; `<branch>` is untouched.
      - **One commit per feature:** main's history reads cleanly (one commit = one feature). Trade-off: you lose fine-grained intra-feature history, making `git bisect` less precise within the feature.
      - **Branch cleanup:** after a squash merge, the feature branch was *not* ff-merged in Git's eyes (its commits are not on main — only a new combined commit is). Use `git branch -D` (capital D, force) to delete it.
  tests:
  - description: On main branch
    command: cd /tutorial/myproject && git symbolic-ref -q HEAD | grep -q 'refs/heads/main'
    hints:
    - text: 'Squash-merge lands on `main`. `git switch main` first, then `git merge --squash feature-stats`.'
  - description: feature-stats branch has been deleted
    command: cd /tutorial/myproject && ! git branch | grep -q 'feature-stats'
    hints:
    - text: 'After the squash commit on `main`, `git branch -D feature-stats` removes the branch. Use `-D` (not `-d`) — squash-merge leaves the branch looking "unmerged" to Git.'
  - description: mean, variance, and stddev are on main
    command: cd /tutorial/myproject && grep -q 'def mean' calculator.py && grep -q 'def variance' calculator.py && grep -q 'def stddev' calculator.py
    hints:
    - text: 'All three functions should land in one commit. `git merge --squash feature-stats` stages the combined changes — remember to `git commit -m "Add stats module"` afterward.'
  - description: The three feature commits are NOT in main's history (only one combined commit)
    command: cd /tutorial/myproject && [ $(git log --oneline main | grep -ciE 'Add (mean|variance|stddev) function') -eq 0 ]
    hints:
    - text: 'Individual feature commits are on `main` — looks like a regular merge, not `--squash`. Reset with `git reset --hard ORIG_HEAD` and redo with `git merge --squash`.'
  quiz:
    title: "Step 10 — Knowledge Check"
    min_score: 0.8
    shuffle: true
    questions:
    - question: What does `git merge --squash feature` do?
      options:
      - Creates a two-parent merge commit, keeping the feature's history
      - Stages the combined diff without committing — you write one commit
      - Deletes the feature branch after merging it into the current one
      - Rebases the feature branch on top of the current branch's tip
      correct_index: 1
      option_feedback:
        0: This answer confuses regular merge with squash-merge; squash deliberately *avoids* the second parent.
        2: This answer assumes squash-merge cleans up the source; the feature branch is untouched.
        3: This answer confuses squash (one combined commit) with rebase (replays each commit).
      explanation: Squash stages a combined patch but does not commit — you supply the message. The result is *one* new commit on main containing all of the feature's changes; the feature's individual commits never appear on main.
    - question: After `git merge --squash feature; git commit`, what is true of the feature branch?
      options:
      - It no longer exists — squash deleted it
      - It's unchanged; its commits aren't on main
      - It points at the new squash commit on main
      - Its commits have been rewritten
      correct_index: 1
      option_feedback:
        0: This answer assumes squash deletes the source branch; squash leaves it intact.
        2: This answer assumes branches got rewired; squash only adds a commit to the *current* branch.
        3: This answer assumes squash modifies the feature's history; only the current branch gets a new commit.
      explanation: Squash merge does not touch the feature branch. It is still there with its full history. To delete it after squashing, use `git branch -D feature` (force, because it is not ff-merged by Git's definition).
    - question: 'You have a 3-commit feature. You merge it three ways. Which output is correct?'
      options:
      - plain `merge` → 1 new commit on main; `rebase + merge` → 3 new commits on main; `--squash + commit` → 3 new commits on main
      - plain `merge` → 1 merge commit (3 parents); `rebase + merge` → 3 new commits; `--squash + commit` → 1 new commit
      - plain `merge` → 1 two-parent merge commit; `rebase + merge` → 3 linear commits; `--squash + commit` → 1 new commit.
      - All three approaches produce identical history
      correct_index: 2
      option_feedback:
        0: This answer gets squash backwards (squash produces 1 commit, not 3) and confuses plain merge's parent count.
        1: This answer invents a 3-parent merge commit; standard merges have exactly 2 parents.
        3: This answer ignores the actual differences between strategies — they produce visibly different histories.
      explanation: Plain merge = 1 merge commit (2 parents). Rebase linearizes so merge ff-forwards 3 commits. Squash collapses the 3 into 1 new commit. Team preference decides which is right for the project.
    - question: Why might a team **reject** squash merge as a default policy?
      options:
      - It forces an extra merge commit they would rather avoid
      - It hides per-commit history from `bisect` and blame
      - Git rejects squash merges on protected branches like `main`
      - It requires a paid GitHub subscription to use on private repos
      correct_index: 1
      option_feedback:
        0: This answer is backwards; squash *avoids* merge commits.
        2: This answer invents a Git restriction; squash works on any branch.
        3: This answer confuses Git mechanics with hosting service pricing.
      explanation: With squash, `git bisect` can only narrow to 'this whole feature', not to which intermediate commit caused the regression. Intermediate authors also disappear from main's history. Some teams prefer rebase/merge for richer history.
    - question: You squash-merged `feature-stats` into main. The next day you discover one of the three internal commits had a bug. How do you fix only that part?
      options:
      - Git tracks internal commits automatically — run `git revert --internal <sha>`
      - Find it on the feature branch (or reflog), then fix it on `main`
      - Use `git bisect run` to revert automatically
      - Delete main and re-merge with `git merge --no-squash`
      correct_index: 1
      option_feedback:
        0: This answer invents a flag; revert has no `--internal`, and Git doesn't track squash-internal commits on main.
        2: This answer combines two unrelated tools; bisect doesn't auto-fix or auto-revert.
        3: This answer ignores that the squashed commit is already on main; you can't unmerge a commit.
      explanation: Squash hides internal granularity on main. But the original commits still exist where the feature branch was (or via reflog). You can cherry-pick a fix or write a small revert patch on main. This is the classic squash trade-off — convenience on main, less surgical control later.
    - question: 'A regression is reported on `main` three months after a feature was **squash-merged** in; the team kept the feature branch. `git bisect` on `main` narrows the culprit to the squash commit. What is your next move?'
      options:
      - Declare the feature author guilty and revert the whole squash commit
      - Bisect on the kept feature branch's own commits
      - Bisect is unreliable after squash — read every line of the squash commit's diff
      - Re-run bisect with `--squash-aware`
      correct_index: 1
      option_feedback:
        0: This answer is too broad; the question asks for fine-grained resolution, not whole-feature reversion.
        2: This answer ignores the available finer-grained source on the feature branch.
        3: This answer invents a bisect flag; bisect operates on commits, and the feature branch already has the granularity.
      explanation: Squash flattens *main's* history, not the feature branch's. Because the branch was kept, its fine-grained commits are still there, and bisect on it pinpoints the exact internal commit. After three months a deleted branch could not be recovered from your local reflog, whose entries for unreachable commits expire after 30 days by default; hosting services that keep pull-request commits are the usual fallback.
    - question: 'After `git merge --squash feature; git commit`, the new squash commit on main is a Git commit object like any other. What are its **parents**?'
      options:
      - 'Two parents: the tip of main and the tip of feature (like a merge commit)'
      - 'Three parents: main, feature, and their common ancestor'
      - 'One parent: the previous tip of main'
      - Zero parents — squash commits are parentless root commits
      correct_index: 2
      option_feedback:
        0: This answer treats squash as a merge; squash deliberately gives only one parent (the prior HEAD), not two.
        1: This answer invents a three-parent commit type; standard merges are 2-parent and squash is 1-parent.
        3: This answer treats squash as a root commit; it has the prior HEAD as parent.
      explanation: 'A squash commit has exactly one parent: the prior HEAD of the branch you ran `merge --squash` on. The feature branch tip is not referenced as a parent — which is why `git log main` shows a clean linear history and why `git bisect` on main cannot drill into the feature. Same object-model: the commit records exactly the parents it was given, nothing more.'
    - question: Put in order the commands to squash-merge a 3-commit `feature-stats` branch into main, then clean up.
      type: parsons
      display: block
      lines:
      - 'git switch main'
      - 'git merge --squash feature-stats'
      - 'git status'
      - 'git commit -m "Add statistics module (mean, variance, stddev)"'
      - 'git branch -D feature-stats'
      distractors:
      - 'git merge feature-stats'
      - 'git branch -d feature-stats'
      - 'git cherry-pick feature-stats'
      - 'git push --force'
      explanation: '`--squash` stages but does NOT commit — the extra `git commit` step is intentional so you write a fresh, whole-feature message. Use capital `-D` to delete: Git''s fast-forward definition says the feature branch is not merged (only a *new* combined commit landed on main), so lowercase `-d` refuses. `git cherry-pick feature-stats` would only copy the *tip* commit''s patch, not the cumulative diff of the whole branch.'
# Pedagogy: PRIMM — Predict + negative-transfer callout (reset --hard + force-push is the wrong reflex)
- title: 'Revert: Safely Undo a Pushed Commit'
  view: git_graph
  instructions: |
    ### Why this matters

    The reflex to `reset --hard + force-push` after a bad merge is one of the most destructive habits in collaborative Git — it breaks every teammate's clone. Revert is the additive, public-safe undo: no SHAs change, no force-push, no pain. Internalizing the one-question rule (*has this been pushed?*) is what saves you from being the engineer who breaks production *and* the team's history at 2 AM.

    ### 🎯 You will learn to
    - **Reach for revert** — not `reset --hard` — whenever a bad commit is already on a shared branch.
    - **Read the anti-matter pattern** in the graph: the original stays; a new commit negates it.
    - **Decide** between revert (public safety) and rebase-drop (private cleanup) by asking one question: *has this been pushed?*

    ### Scenario

    You pushed `Refactor: rename divide → div` to `main`. Ten teammates
    already pulled. Then CI discovers every import of `divide` now breaks.

    ### 🤔 Predict first

    You have two options on the table:

    - **A.** `git reset --hard HEAD~1` + `git push --force`
    - **B.** `git revert HEAD` + `git push`

    Which one breaks every teammate's clone? Why? (Step 3's schema is the key —
    *what changes existing SHAs?*)

    ### The answer

    `reset --hard` + `push --force` would **fix your clone** but break every
    teammate's — their local `main` still points at the rewritten SHA. Not acceptable.

    `git revert <sha>` is the **additive, public-safe** undo. It computes
    the inverse patch of the target commit and commits *that* as a new
    commit. No existing SHAs change; no force-push; no collaborator pain.

    <div data-git-command-lab role="region" aria-label="Interactive commit-graph demo: git revert appends a new anti-matter commit that negates a problematic Strip-logs commit. The original commit is still in history; the revert is purely additive, so teammates fast-forward cleanly with no force-push.">
    <script type="application/json">
    {
      "command": "git revert HEAD",
      "description": "Different scenario from the hands-on: a `Strip logs` commit accidentally removed production logging and has already been pushed. Revert computes the **inverse patch** (every `-` becomes `+`, every `+` becomes `-`) and lands it as a brand-new commit **¬R**. The original **R** is still there; history grows by one. Everyone's clones stay consistent — `pull` just fast-forwards.\n\nCompare with `rebase -i drop` (Step 9): drop *removes* R and rewrites everything after. Revert *appends* an undo and touches nothing existing. Same end-state, opposite effect on collaborators. Below, you will apply revert to the `rename divide → div` regression.",
      "before": {
        "log": "R000000000000000000000000000000000000000|C000000000000000000000000000000000000000|Strip logs (BUG)|HEAD -> main\nC000000000000000000000000000000000000000|B000000000000000000000000000000000000000|Add stats|\nB000000000000000000000000000000000000000|A000000000000000000000000000000000000000|Add API|\nA000000000000000000000000000000000000000||Init|",
        "branches": "* main",
        "head": "refs/heads/main",
        "highlights": {
          "R000000000000000000000000000000000000000": { "color": "#C0392B", "secondary": "#fff" }
        }
      },
      "after": {
        "log": "¬R00000000000000000000000000000000000000|R000000000000000000000000000000000000000|Revert \"Strip logs\"|HEAD -> main\nR000000000000000000000000000000000000000|C000000000000000000000000000000000000000|Strip logs (BUG)|\nC000000000000000000000000000000000000000|B000000000000000000000000000000000000000|Add stats|\nB000000000000000000000000000000000000000|A000000000000000000000000000000000000000|Add API|\nA000000000000000000000000000000000000000||Init|",
        "branches": "* main",
        "head": "refs/heads/main",
        "highlights": {
          "R000000000000000000000000000000000000000": { "color": "#C0392B", "secondary": "#fff" },
          "¬R00000000000000000000000000000000000000": { "color": "#27AE60", "secondary": "#fff" }
        }
      }
    }
    </script>
    </div>

    ### Task 1: See the bad commit

    Setup planted a "pushed" refactor that broke callers.

    ```bash
    cd /tutorial/myproject
    git log --oneline -5
    grep -c 'def divide\|def div' calculator.py
    ```

    ### Task 2: Revert it

    ```bash
    git revert HEAD --no-edit
    git log --oneline -5
    ```

    Two commits visible: the bad one **and** its revert. `git log` is now
    a truthful record of what happened.

    ### Task 3: Prove the reachable commit count

    **Predict:** did revert delete anything? (Answer: no — history grew by 1.)

    ```bash
    git rev-list --count HEAD
    git cat-file -p HEAD          # examine the revert commit object
    git cat-file -p HEAD^         # the original bad commit, still reachable
    ```

    ### The single rule

    **If anyone else has it, revert. If only you have it, rebase is fair game.**

    <details markdown="1"><summary>📋 Revert vs. reset vs. rebase-drop, side by side</summary>

    | Goal | Pushed? | Tool |
    |---|---|---|
    | Remove a bad commit from shared history | **Yes** | `git revert <sha>` (additive) |
    | Clean up a local WIP branch before PR | No | `rebase -i` with `drop` |
    | Nuke local branch to a prior state | No | `reset --hard <sha>` |

    </details>

    <details markdown="1"><summary>💡 Reverting a *merge* commit (`-m 1`)</summary>

    Merge commits have two parents; revert needs to know which side is the
    "mainline" (the side you want to keep). `git revert -m 1 <merge-sha>`
    keeps the first-parent side and undoes the merged-in branch. Get the
    number wrong and you revert the wrong side.

    </details>
  setup_commands:
  - |
    cd /tutorial/myproject
    [ -e .git/REVERT_HEAD ] && git revert --abort 2>/dev/null
    git switch -q main 2>/dev/null
    # Plant the buggy rename if missing. `divide` only exists on feature-divide,
    # so give main its own divide first, then rename it in the "pushed" commit.
    if ! git log main --oneline 2>/dev/null | grep -q 'rename divide'; then
      if ! grep -q '^def divide(' calculator.py; then
        printf '\ndef divide(a, b): return a / b\n' >> calculator.py
        git commit -qam 'Add divide function'
      fi
      sed -i 's/^def divide(/def div(/' calculator.py
      git commit -qam 'Refactor: rename divide → div (BROKE imports)'
    fi
  solution:
    commands:
    - cd /tutorial/myproject
    - '[ -e .git/REVERT_HEAD ] && git revert --abort 2>/dev/null'
    - '{ [ -e .git/rebase-merge ] || [ -e .git/rebase-apply ]; } && git rebase --abort 2>/dev/null'
    - '[ -e .git/MERGE_HEAD ] && git merge --abort 2>/dev/null'
    - git switch -q main 2>/dev/null
    - git reset --hard HEAD
    - git clean -fdq
    # If setup didn't plant the buggy rename, plant it ourselves so the test has something to revert
    - "git log main --oneline | grep -q 'rename divide' || { grep -q '^def divide(' calculator.py || { printf '\\ndef divide(a, b): return a / b\\n' >> calculator.py && git commit -qam 'Add divide function'; }; sed -i 's/^def divide(/def div(/' calculator.py && git commit -qam 'Refactor: rename divide → div (BROKE imports)'; }"
    - git revert HEAD --no-edit
  tests:
  - description: On main branch
    command: cd /tutorial/myproject && git symbolic-ref -q HEAD | grep -q 'refs/heads/main'
    hints:
    - title: Revert from main
      text: 'Run the revert from `main`. If `git status` shows a detached HEAD or another branch, `git switch main` first.'
  - description: The newest commit on main reverts the bad rename
    command: |
      cd /tutorial/myproject
      bad=$(git log main --format=%H --grep='^Refactor: rename divide' -n 1)
      [ -n "$bad" ] && git log -1 --format=%B main | grep -q "This reverts commit $bad"
    hints:
    - title: Append the anti-commit
      text: '`git revert HEAD --no-edit` creates a new commit that undoes the bad rename. The rename itself stays in history.'
    - title: Reverted the wrong commit?
      text: '`git log -1` should start with `Revert "Refactor: rename divide`. If you reverted something else and haven''t pushed, `git reset --hard HEAD~1` drops that local revert; then revert the rename by its SHA.'
  - description: Both the bad commit and its revert are reachable (revert is additive)
    command: cd /tutorial/myproject && git log --oneline | grep -qi 'rename divide' && git log --oneline | grep -qiE 'Revert.*rename'
    hints:
    - title: Revert keeps history
      text: '`git log --oneline` should list the original "rename divide → div" commit and, above it, a "Revert ..." commit. If the rename is gone, it was removed with `reset`, not reverted.'
    - title: Bring the rename back
      text: 'If you used `git reset --hard`, find the rename''s SHA in `git reflog`, `git reset --hard <sha>` to restore it, then run `git revert HEAD --no-edit`.'
  - description: divide() is back on main
    command: cd /tutorial/myproject && git show main:calculator.py | grep -q '^def divide('
    hints:
    - title: The revert restores the old name
      text: 'Reverting the rename brings back `def divide(` in `calculator.py`. `git show HEAD --stat` shows which file the revert changed.'
  quiz:
    title: "Step 11 — Knowledge Check"
    min_score: 0.8
    shuffle: true
    questions:
    - question: Why is `git revert` safe on shared branches where `git reset --hard + push --force` is not?
      options:
      - Revert doesn't actually change anything in the repository
      - Revert appends a new commit and leaves existing SHAs untouched
      - Revert encrypts the inverse patch so push cannot break it
      - GitHub blocks `git push --force` on protected branches by default
      correct_index: 1
      option_feedback:
        0: This answer is too strong; revert *does* change history (adds a new commit), it just doesn't *rewrite* existing SHAs.
        2: This answer invents encryption; revert is plain commit semantics.
        3: This answer relies on remote-side enforcement; the safety property is intrinsic to revert vs. reset, not a platform policy.
      explanation: 'The rule compresses to one property: *does this operation change existing SHAs?* Revert — no. Reset/rebase/amend — yes. Changed SHAs break anyone who already fetched the old ones. Revert is the only undo that preserves shared-history safety.'
    - question: What does `git revert <sha>` physically add to history?
      options:
      - Nothing — it merely hides the commit from view
      - A new commit whose patch is the inverse of `<sha>`'s
      - A deletion marker object pointing at `<sha>`
      - A tag `revert/<sha>` pointing at the original
      correct_index: 1
      option_feedback:
        0: This answer treats revert as visibility-only; revert adds a real commit that changes the working tree.
        2: This answer invents a "tombstone" object type; Git has none — revert is a regular commit.
        3: This answer confuses commits with tags; revert produces a commit on the branch, not a tag ref.
      explanation: Revert computes the inverse diff of `<sha>` and lands it as a regular commit on the current branch. The new commit's parent is whatever HEAD was when you ran the command — when you revert HEAD, that happens to be `<sha>`, but when you revert an older commit it isn't. `git log` shows both the bad commit and its undo, which is the honest story of what happened.
    - question: You accidentally pushed a bad commit to `main`. Three teammates have pulled. Best move?
      options:
      - '`git reset --hard HEAD~1` + `git push --force` (or `--force-with-lease`)'
      - '`git revert HEAD` + `git push`'
      - '`git rebase -i HEAD~1` with `drop`, then force-push'
      - Delete the whole repository and re-clone
      correct_index: 1
      option_feedback:
        0: This answer rewrites shared history; teammates with the old SHAs will see divergence and their pulls will fail.
        2: This answer also rewrites shared history (rebase-drop is a rewrite); same breakage as reset + force.
        3: This answer is the "burning down the repo" antipattern — needlessly destructive.
      explanation: Shared history was already distributed. Revert appends an undo; teammates' next `pull` fast-forwards cleanly. Force-pushing after reset or rebase makes teammates' branches diverge and their pulls fail — exactly what we avoid.
    - question: 'Rebase-drop and revert both "undo" a commit. Which is correct about their effect on SHAs?'
      options:
      - Both create new SHAs for all later commits
      - Drop rewrites later SHAs; revert only adds
      - Both are non-destructive
      - Revert rewrites SHAs; rebase-drop doesn't
      correct_index: 1
      option_feedback:
        0: This answer ignores that revert leaves all existing commits' SHAs unchanged; only one new commit is added.
        2: This answer ignores rebase-drop's rewriting of every subsequent commit's SHA.
        3: This answer reverses the additive/destructive distinction — revert is the additive one.
      explanation: The destructive/additive distinction is the heart of this step. Rebase-drop replays every commit after the dropped one on a new parent — new SHAs cascading. Revert just appends one new commit. Same apparent outcome (the bad change is gone); completely different impact on collaborators.
    - question: You want to revert a **merge commit** (one with two parents). What additional flag do you need?
      options:
      - '`--merge` to mark the operation as a merge revert'
      - '`-m N` to tell Git which parent is the mainline'
      - '`--force` because merge reverts overwrite shared state'
      - None — `git revert` figures it out from the parents
      correct_index: 1
      option_feedback:
        0: This answer invents a flag; revert has no `--merge` option.
        2: This answer invents a flag; revert has no `--force` option.
        3: This answer ignores that merge commits have two parents and revert needs to know which side is mainline.
      explanation: 'Merge commits have two parents; revert needs to know which side is "mainline" (the version you want to keep). `-m 1` means "first parent is mainline; undo the second-parent branch." Getting this wrong reverts the wrong side.'
    - question: Put in order the safe public-undo workflow after discovering a bad commit on shared `main`. Distractors rewrite history.
      type: parsons
      display: block
      lines:
      - 'git log --oneline -5'
      - 'git revert <bad-sha> --no-edit'
      - 'git log --oneline -3'
      - 'git push'
      distractors:
      - 'git reset --hard <bad-sha>^'
      - 'git push --force-with-lease'
      - 'git rebase -i <bad-sha>^ drop'
      - 'rm -rf .git && git clone <url>'
      explanation: '**Revert-and-push** is the only sequence that leaves every existing SHA untouched. Each distractor rewrites history in some way — which is exactly the failure mode revert exists to avoid. Run the safe one often enough that it becomes reflex.'
# Pedagogy: PRIMM — Predict + Investigate (the gitlink reveals submodules are pointers, not photocopies)
- title: 'Git Submodules: Add & Clone'
  view: editor
  instructions: |
    ### Why this matters

    Submodules are the canonical "I learned wrong and now I'm afraid of them" Git feature — most engineers experience the empty-folder-after-clone footgun once and avoid them forever. The fix is the same as Step 3's: see the gitlink as a pointer (a 41-byte commit SHA in a tree entry), not a photocopy. Once you grasp the pinned-SHA model, submodules are simple, deterministic, and the right tool for vendoring a specific edition of a library.

    ### 🎯 You will learn to
    - **Add** a submodule to an existing repo with one command.
    - **Clone** a submodule-using repo **correctly** (`--recursive`) — or recover after forgetting.
    - **Recognize** the gitlink (mode `160000`) + `.gitmodules` as the two structural differences from a regular file.
    - **Pick** submodules vs. package manager vs. monorepo based on the actual problem.

    ### 🤔 Predict first

    When you `git submodule add` a 200-MB repo, how much storage does the
    *outer* repo's tracked tree gain — a few hundred megabytes, or a few
    hundred bytes?

    <details markdown="1"><summary>📖 Three core terms (open before reading further)</summary>

    | Term | What it is |
    |---|---|
    | **Submodule** | A nested Git repo inside an outer Git repo |
    | **`.gitmodules`** | Plain-text config file in the outer repo listing each submodule's path + URL |
    | **Gitlink** | A tree entry with mode `160000` whose "content" is a commit SHA (instead of file bytes) |

    Two more terms (`Pinned SHA`, `--recursive`) are introduced inline as
    they come up; the full glossary is at the bottom of this step.

    </details>

    ### Mental model: library subscription

    A submodule is a **subscription to a specific edition of a library**:

    - No photocopy — no file duplication.
    - You record the **book title + edition number** (`.gitmodules` URL + pinned SHA).
    - Anyone with your note fetches the same edition.
    - Upgrade by changing the edition number.

    Edition number = commit SHA. Book = the submodule's Git repo hosted elsewhere.

    ### On-disk layout

    ```folder-tree
    @startuml
    main-repo/
      .git/
        modules/
          math-utils/  ← submodule's actual git data (objects, refs, HEAD…)
      .gitmodules      ← where Git should fetch each submodule
      src/
      vendor/
        math-utils/    ← nested Git repo (the working tree)
          .git         ← gitfile: "gitdir: ../../.git/modules/math-utils"
          utils.py
    @enduml
    ```

    ### Task 1: Inspect the "upstream" library

    Pre-built: `/tutorial/math-utils-src/` (working repo, `double`+`triple`)
    and `/tutorial/math-utils.git` (bare clone acting as the remote URL).

    ```bash
    cat /tutorial/math-utils-src/utils.py
    ```

    ### Task 2: Add the submodule

    ```bash
    cd /tutorial/myproject
    git switch main
    git submodule add /tutorial/math-utils.git vendor/math-utils
    git status                            # TWO new entries
    ```

    Open `.gitmodules` in the editor. **Predict before scrolling the answers:**

    1. How many lines per submodule?
    2. Is the pinned **SHA** stored here?
    3. What breaks if the file is deleted?

    <details markdown="1"><summary>Answers</summary>

    1. **3 lines** (header + `path` + `url`). Tiny by design.
    2. **URL yes, SHA no.** The SHA is the gitlink in the tree
       (see below). Two independent facts: *where* to fetch vs.
       *which commit* to check out.
    3. **Teammates can't clone the submodule.** `.gitmodules` is the
       subscription directory; without it, `clone --recursive` has no URL.

    </details>

    <details markdown="1"><summary>⚠️ Submodule URL drift — the year-three nightmare</summary>

    The `url = …` line in `.gitmodules` is *plain text*, committed once,
    forgotten forever. Then someone in the wider community moves the
    submodule:

    - the upstream repo migrates from GitHub to GitLab,
    - the org renames itself,
    - the maintainer transfers ownership,
    - the SaaS shuts down (RIP `gitorious`),
    - or the corporate VPN restricts access to a different mirror URL.

    Three years later, *your* `.gitmodules` still points at the old URL.
    A new teammate runs `git clone --recursive` and gets a
    `repository not found` error. Some teammates patched their `.gitmodules`
    locally (now their local file disagrees with `origin`); others used
    `git config --global url.<new>.insteadOf <old>` to silently rewrite
    the URL in their checkout. Result: a single repo with three different
    submodule URLs in the wild, and no one quite remembers which one is
    canonical.

    **This is "submodule URL drift."** Fix early: when a submodule moves,
    open a PR that updates `.gitmodules`, run `git submodule sync` (which
    propagates the new URL into each clone's `.git/config`), and tell
    everyone to `git submodule sync && git submodule update`. Skipping
    this is how submodule setups become unmaintainable.

    </details>

    Inspect the gitlink:

    ```bash
    git ls-files -s vendor/math-utils    # mode 160000 = submodule
    git commit -m "Add math-utils submodule at v0.1.0"
    ```

    ### Task 3: Clone with `--recursive`

    ```bash
    cd /tutorial
    git clone --recursive myproject colleague-clone
    ls colleague-clone/vendor/math-utils
    ```

    Without `--recursive`, the folder exists empty until the teammate
    runs `git submodule update --init --recursive`.

    <details markdown="1"><summary>💡 When submodules are the *right* tool</summary>

    **Yes:** versioned code you *own* shared across several repos.

    **No:** third-party deps (use a package manager — npm, pip, cargo),
    or single config files (use config management).

    </details>

    <details markdown="1"><summary>📋 Submodule glossary (full)</summary>

    | Term | What it is |
    |---|---|
    | **Submodule** | A nested Git repo inside an outer Git repo |
    | **`.gitmodules`** | Plain-text config file in the outer repo listing each submodule's path + URL |
    | **Gitlink** | A tree entry with mode `160000` whose "content" is a commit SHA (instead of file bytes) |
    | **Pinned SHA** | The exact commit of the submodule the outer repo wants checked out at the gitlink path |
    | **`--recursive`** | Clone flag that fetches submodules at clone-time (otherwise the folder is empty) |

    </details>
  setup_commands:
  - "cd /tutorial/myproject && git switch -q main 2>/dev/null\nif [ -d /tutorial/math-utils.git ] && git --git-dir=/tutorial/math-utils.git log --oneline 2>/dev/null | grep -q 'Initial utils' && [ -x /tutorial/publish-math-utils-v0.2.sh ]; then\n  exit 0\nfi\nrm -rf /tutorial/math-utils-src /tutorial/math-utils.git /tutorial/colleague-clone\nmkdir -p /tutorial/math-utils-src\ncd /tutorial/math-utils-src\ngit init -q\nprintf 'def double(x):\\n    return x * 2\\n\\ndef triple(x):\\n    return x * 3\\n' > utils.py\ngit add utils.py\ngit commit -qm 'Initial utils'\ncd /tutorial\ngit clone -q --bare math-utils-src math-utils.git\n# Install the \"upstream publishes v0.2\" helper.\ncat > /tutorial/publish-math-utils-v0.2.sh << 'SCRIPT'\n#!/bin/bash\nset -e\ncd /tutorial/math-utils-src\nif grep -q 'def quadruple' utils.py; then\n  echo 'upstream math-utils already at v0.2'\n  exit 0\nfi\nprintf '\\ndef quadruple(x):\\n    return x * 4\\n' >> utils.py\ngit commit -qam 'Add quadruple'\n# Push to the bare 'remote' so submodule fetch sees it\nBR=$(git rev-parse --abbrev-ref HEAD)\ngit push -q /tutorial/math-utils.git $BR:$BR 2>/dev/null || \\\n  git push -q /tutorial/math-utils.git HEAD:master 2>/dev/null || \\\n  git push -q /tutorial/math-utils.git HEAD:main 2>/dev/null || true\necho 'upstream math-utils is now at v0.2 (adds quadruple)'\nSCRIPT\nchmod +x /tutorial/publish-math-utils-v0.2.sh\n"
  solution:
    commands:
    # Single batched command to fit the v86 _runVisible 30s prompt timeout.
    # Idempotent: only adds submodule if .gitmodules doesn't exist; only
    # clones colleague-clone if it doesn't exist.
    - "cd /tutorial/myproject && git switch -q main 2>/dev/null && git reset --hard HEAD; if [ ! -f .gitmodules ]; then git submodule add /tutorial/math-utils.git vendor/math-utils && git commit -m 'Add math-utils submodule at v0.1.0'; fi; if [ ! -d /tutorial/colleague-clone ]; then cd /tutorial && git clone --recursive myproject colleague-clone; fi"
    explanation: |
      - **`git submodule add <url> <path>`:** Clones the URL into the path AND creates a `.gitmodules` entry describing that submodule (its path + URL). Both the `.gitmodules` file and the gitlink pointer must be committed.
      - **Gitlink vs regular file:** a submodule entry has Git mode `160000` (instead of `100644` for a regular file). Its content is not bytes — it is a commit SHA indicating *which commit* of the submodule's repo should be checked out here.
      - **`git clone --recursive`:** Clones the outer repo and all submodules in one command. Forgetting this leaves empty submodule folders until `git submodule update --init --recursive`.
  tests:
  - description: myproject has a math-utils submodule
    command: cd /tutorial/myproject && [ -f .gitmodules ] && grep -q 'math-utils' .gitmodules
    hints:
    - text: '`git submodule add /tutorial/math-utils.git vendor/math-utils` creates both `.gitmodules` and the submodule directory.'
  - description: .gitmodules has been committed
    command: cd /tutorial/myproject && git log --oneline -- .gitmodules | grep -q '.'
    hints:
    - text: '`git submodule add` stages `.gitmodules` and the gitlink but does not commit. `git commit -m "Add math-utils submodule"` finishes it.'
  - description: Submodule content is checked out
    command: '[ -f /tutorial/myproject/vendor/math-utils/utils.py ]'
    hints:
    - text: 'Submodule folder is empty. `git submodule update --init --recursive` populates it from the pinned SHA.'
  - description: vendor/math-utils is tracked as a gitlink (mode 160000)
    command: cd /tutorial/myproject && git ls-files -s vendor/math-utils | grep -q '^160000'
    hints:
    - text: 'Something committed `vendor/math-utils` as a regular directory rather than a gitlink. Remove it from the index (`git rm -r --cached vendor/math-utils`) and re-run `git submodule add`.'
  - description: colleague-clone was created successfully with its submodule populated
    command: '[ -f /tutorial/colleague-clone/vendor/math-utils/utils.py ]'
    hints:
    - text: '`git clone --recurse-submodules <url> /tutorial/colleague-clone` clones and populates in one shot. Without `--recurse-submodules`, the submodule directory is empty.'
  quiz:
    title: "Step 12 — Knowledge Check"
    min_score: 0.8
    shuffle: true
    questions:
    - question: What does a Git submodule actually store in the outer repository's commits?
      options:
      - A full copy of the submodule's files tracked like normal files
      - A gitlink with the pinned SHA, plus a `.gitmodules` URL
      - Nothing — submodules are purely a runtime concept
      - A symbolic link (`ln -s`) to the submodule's directory
      correct_index: 1
      option_feedback:
        0: This answer confuses submodule working tree content with outer-repo gitlink state; the outer repo only stores a SHA + URL, never the files.
        2: This answer assumes submodules are runtime-only; the outer repo records the gitlink and `.gitmodules` persistently.
        3: This answer confuses a gitlink (mode `160000`) with a filesystem symlink — the gitlink is a tree entry, not a symlink.
      explanation: The outer repo stores ONE SHA per submodule (the pinned commit) plus a `.gitmodules` entry for the URL. The submodule's working files are checked out in the submodule path; its git data (objects, refs, HEAD) lives in the outer repo's `.git/modules/<name>/` — the submodule directory itself contains only a `.git` text file (a "gitfile") pointing there, NOT a full `.git/` directory.
    - question: A teammate clones your repo normally with `git clone <url>`. What do they see at the submodule path?
      options:
      - The submodule's full contents, checked out automatically
      - An empty folder until a `submodule update --init`
      - An error that aborts `git clone` before it finishes
      - A warning but the content downloads lazily on first access
      correct_index: 1
      option_feedback:
        0: This answer assumes plain `git clone` fetches submodules; it doesn't, by default — only `--recursive` (or a follow-up `submodule update`) populates them.
        2: This answer assumes the clone fails; plain clone succeeds, the submodule folder is just empty.
        3: This answer invents lazy fetching; submodule content fetches require explicit `submodule update`.
      explanation: Plain `git clone` records the submodule entries but does not fetch their content. The folder exists but is empty. `git clone --recursive <url>` or `git submodule update --init --recursive` after the fact populates it.
    - question: Which statements about submodules are true? (Select all that apply)
      type: multiple
      options:
      - A submodule is a full Git repository nested inside another
      - '`git clone --recursive <url>` clones both outer and submodules'
      - The outer repo stores full copies of the submodule's files
      - The outer repo tracks a submodule with a special gitlink entry (mode `160000`) containing the pinned commit SHA
      correct_indices:
      - 0
      - 1
      - 3
      option_feedback:
        2: This answer confuses submodule working tree content with outer-repo gitlink state; the outer repo only stores the SHA pin, not file copies.
      explanation: The outer repo stores only a pinned SHA (gitlink, mode 160000) and a `.gitmodules` entry — not file copies. The submodule is a genuine nested repo.
    - question: 'Why is it internally consistent that a submodule is ''just a pinned commit SHA''?'
      options:
      - One commit SHA already identifies a whole-project snapshot.
      - Because submodules cannot have their own branches
      - Because submodules are always read-only
      - Git keeps submodules in a proprietary database
      correct_index: 0
      option_feedback:
        1: This answer is irrelevant — submodules can have branches; the question is about content addressing.
        2: This answer invents a constraint; submodules can be edited and committed to like any nested repo.
        3: This answer invents a separate database; submodules use the same Git object format as everything else.
      explanation: Back to the object model (Step 3). A commit SHA uniquely identifies a whole-project snapshot (commit → tree → blobs). Pinning a commit SHA is enough to reconstruct the submodule's entire content. No file duplication is necessary — exactly the same property that makes branches cheap (Step 1).
    - question: 'A submodule''s pinned SHA is 40 characters, just like a regular commit SHA. In terms of Git objects, what kind of object does it point to?'
      options:
      - A blob object in the outer repo's database
      - A tree object in the outer repo's database
      - A commit in the submodule's own repo
      - A tag object in the outer repo's database
      correct_index: 2
      option_feedback:
        0: This answer confuses commit objects with blob objects; gitlinks pin commits, which then resolve to trees and blobs.
        1: This answer confuses commit objects with tree objects; only a commit captures parents, author, and message.
        3: This answer confuses commit objects with tag objects; tags reference commits, they aren't stored in gitlinks.
      explanation: A gitlink pins a *commit* SHA — which (via the commit's tree and blobs) uniquely determines the submodule's entire file state. The commit lives in the submodule's `.git/objects/`, not the outer repo's. This is exactly the same commit-SHA-as-snapshot-identity property rebase relies on (Step 8) and that makes the whole object model coherent.
    - question: Put in order the commands a teammate runs to add a submodule, commit it, and set up a colleague's workstation so the submodule files appear. Distractors are verb-variants that look right but fail.
      type: parsons
      display: block
      lines:
      - 'cd /tutorial/myproject'
      - 'git submodule add /tutorial/math-utils.git vendor/math-utils'
      - 'git commit -m "Add math-utils submodule at v0.1.0"'
      - 'cd /tutorial && git clone --recursive myproject colleague-clone'
      distractors:
      - 'git submodule init /tutorial/math-utils.git vendor/math-utils'
      - 'git clone myproject colleague-clone'
      - 'git submodule fetch /tutorial/math-utils.git'
      - 'git merge /tutorial/math-utils.git'
      explanation: '`git submodule add` combines clone + config in one step; `init` without `update` is half the story. Plain `git clone` creates an empty submodule folder. `git submodule fetch` is invented. `git merge` on a URL is a syntax error. Verb selection is what separates a working submodule workflow from a broken one.'
# Pedagogy: PRIMM — Predict + Modify (the two-step dance: inner repo first, outer repo second)
- title: 'Updating Submodules: Upstream Bumps & Resync'
  view: editor
  instructions: |
    ### Why this matters

    "I pulled but the submodule didn't update" is the most common submodule support ticket on every team. The fix is the two-step dance: a submodule update touches both the inner repo (fetch + checkout) *and* the outer repo (add + commit). Knowing this dance — and knowing the one-command resync that fixes any drift — turns submodule updates from a recurring trap into a routine post-pull habit.

    ### 🎯 You will learn to
    - **Upgrade** a submodule to new upstream work via the two-step dance (fetch/checkout inside, `add`/`commit` outside).
    - **Diagnose and fix** the "teammate forgot `submodule update`" trap — muscle memory for post-pull.
    - **Force-resync** any drifted submodule back to the pinned SHA with one deterministic command.

    ### 🤔 Predict first

    Upstream publishes new commits. After you `git pull` the outer repo,
    will your local submodule's working directory show the new content
    automatically — or do you have to do something extra?

    ### Task 1: Upstream publishes v0.2

    ```bash
    /tutorial/publish-math-utils-v0.2.sh
    git --git-dir=/tutorial/math-utils.git log --oneline --all
    cd /tutorial/myproject
    git status            # nothing changed here — push doesn't propagate
    ```

    ### Task 2: Fetch + checkout inside the submodule

    A submodule is a nested repo. Use normal `git` inside it:

    ```bash
    cd /tutorial/myproject/vendor/math-utils
    git fetch
    git checkout origin/HEAD
    cd /tutorial/myproject
    git status            # vendor/math-utils (new commits)
    git diff vendor/math-utils
    ```

    The outer diff is exactly **one line** — `-Subproject commit <old>` /
    `+Subproject commit <new>`. Line-level diffs live in the submodule's
    own object database.

    ### Task 3: Bump the pinned SHA in the outer repo

    ```bash
    git add vendor/math-utils
    git commit -m "Bump math-utils to v0.2.0 (adds quadruple)"
    ```

    ### Task 4: The teammate trap

    ```bash
    cd /tutorial/colleague-clone
    git pull
    cat vendor/math-utils/utils.py     # still v0.1 on disk!
    ```

    `pull` updated the pinned SHA in the tree, but **did not touch**
    their submodule working directory. Code that imports `quadruple`
    now fails. Fix:

    ```bash
    git submodule update --init --recursive
    cat vendor/math-utils/utils.py     # now has quadruple
    ```

    <details markdown="1"><summary>💡 Make this a habit (one-time config)</summary>

    After every `pull` that might touch submodule paths, run
    `git submodule update --init --recursive`. Or, one-time setup:

    ```bash
    git config --global submodule.recurse true
    ```

    Now `pull` and `checkout` do the right thing automatically.

    </details>

    ### Task 5: Force-resync a drifted submodule

    Simulate drift:

    ```bash
    cd /tutorial/colleague-clone/vendor/math-utils
    git checkout HEAD~1
    cd /tutorial/colleague-clone
    git status            # modified: vendor/math-utils (new commits)
    git submodule update --init --recursive
    git status            # clean — pinned SHA restored
    ```

    Same command works for never-initialized, partially-fetched, or
    drifted submodules.
  setup_commands:
  - "cd /tutorial/myproject\ngit switch -q main 2>/dev/null\nif [ ! -f .gitmodules ] || ! grep -q math-utils .gitmodules 2>/dev/null; then\n  git submodule add -f /tutorial/math-utils.git vendor/math-utils 2>/dev/null\n  git commit -qm 'Add math-utils submodule at v0.1.0' 2>/dev/null\nfi\nif [ ! -d /tutorial/colleague-clone ]; then\n  (cd /tutorial && git clone -q --recursive myproject colleague-clone 2>/dev/null)\nfi\ngit submodule update --init --recursive 2>/dev/null\n"
  solution:
    commands:
    # Single batched command to fit the v86 _runVisible 30s prompt timeout.
    - "/tutorial/publish-math-utils-v0.2.sh 2>/dev/null; cd /tutorial/myproject/vendor/math-utils && git fetch 2>/dev/null && (git checkout origin/HEAD 2>/dev/null || git checkout -q origin/main 2>/dev/null || git checkout -q origin/master 2>/dev/null); cd /tutorial/myproject && git add vendor/math-utils && (git diff --cached --quiet || git commit -m 'Bump math-utils to v0.2.0 (adds quadruple)')"
    explanation: |
      - **Two-step upgrade:** Inside the submodule, `git fetch && git checkout origin/HEAD` moves the submodule's HEAD to the new upstream commit. Outside, `git add <submodule-path> && git commit` records the new pinned SHA in the outer repo. Skipping the outer step means the upgrade is local to you and never reaches teammates.
      - **Why outer `git pull` does NOT auto-update submodules:** pull updates the *pinned SHA* (because that is what the tree records) but does not touch submodule working directories. Teammates must run `git submodule update --init --recursive` (or configure `submodule.recurse=true`) to actually reflect the new pinned SHA on disk.
      - **`git submodule update --init --recursive`:** the deterministic-state command. Clones missing submodules, forces every submodule's HEAD to the pinned SHA. The cure for every "my submodule is in a weird state" moment.
  tests:
  - description: Submodule working directory has the new quadruple function
    command: grep -q 'def quadruple' /tutorial/myproject/vendor/math-utils/utils.py
    hints:
    - title: Fetch upstream inside the submodule
      text: 'Upstream v0.2 lives on the submodule''s remote. Inside `vendor/math-utils`, run `git fetch`, then check out `origin/HEAD`. Don''t edit `utils.py` by hand: that leaves "modified content" instead of a new pinned commit.'
    - title: Did upstream publish yet?
      text: 'Task 1''s `/tutorial/publish-math-utils-v0.2.sh` creates the v0.2 commit on the remote. `git --git-dir=/tutorial/math-utils.git log --oneline --all` should list "Add quadruple".'
  - description: Outer repo has a commit bumping the submodule SHA
    command: cd /tutorial/myproject && git log --oneline | grep -qiE 'bump|v0.2|quadruple'
    hints:
    - text: 'Inner work done but outer repo still pins the old SHA. `cd /tutorial/myproject && git add vendor/math-utils && git commit -m "Bump math-utils to add quadruple"`.'
  - description: Outer repo is clean (no pending submodule modifications)
    command: cd /tutorial/myproject && git diff --quiet && git diff --cached --quiet
    hints:
    - text: 'Usually `modified: vendor/math-utils (new commits)` — inner commit landed but outer bump is missing. Finish the outer commit.'
  # Note: removed a "remote has quadruple" gate that the publish-math-utils-v0.2.sh
  # helper passed before the student touched anything. The next step (Submodule
  # Internals) verifies the *student's* inner commit was actually pushed.
  quiz:
    title: "Step 13 — Knowledge Check"
    min_score: 0.8
    shuffle: true
    questions:
    - question: You bumped a submodule to v0.2 and pushed. A teammate pulls your change and reports tests failing because `quadruple` does not exist. Most likely cause?
      options:
      - The submodule's remote is temporarily unreachable
      - They skipped `git submodule update` after pulling
      - Their installed Git version is too old for the new submodule
      - The repo's `.gitmodules` file is corrupt or out of sync
      correct_index: 1
      option_feedback:
        0: This answer blames infrastructure; the submodule's pinned SHA is fine, the working tree just needs `submodule update`.
        2: This answer blames version; standard `pull` semantics have always required explicit submodule sync.
        3: This answer assumes file corruption; the symptom is normal post-pull behavior, not corruption.
      explanation: Classic trap. `git pull` on the outer repo updates the **pinned SHA in the tree** but does NOT touch the submodule working directory. They need `git submodule update --init --recursive` to actually reflect the new SHA on disk. Configure `git config submodule.recurse true` to make pull do this automatically.
    - question: You wrote a fix inside a submodule and want teammates to get it. How many `git commit` calls does that take in total, inside and outside?
      options:
      - Zero — `git submodule update` commits for you
      - One — only the outer-repo SHA bump
      - Two — one inside, one for the outer pin
      - Three — submodule, `.gitmodules`, and outer tree
      correct_index: 2
      option_feedback:
        0: This answer assumes `submodule update` commits for you; it only resets working state, never commits.
        1: One outer commit is enough when you only pull in upstream work; your own fix must first be committed (and pushed) inside the submodule.
        3: This answer adds a `.gitmodules` commit; that file changes only when adding or removing a submodule, not when updating one.
      explanation: 'Authoring the change takes two commits: commit (and push) inside the submodule, then commit the bumped pin in the outer repo. When you only pull in upstream work, the inner commit already exists and the outer SHA bump is the only commit you make.'
    - question: '`git status` in the outer repo shows `modified: vendor/math-utils (new commits)`. What does it mean?'
      options:
      - The `.gitmodules` file has been edited
      - The submodule's HEAD isn't the pinned SHA
      - The submodule is broken
      - Git is about to garbage-collect the submodule
      correct_index: 1
      option_feedback:
        0: This answer confuses submodule SHA changes with `.gitmodules` config edits.
        2: This answer assumes corruption; `new commits` is normal divergence between pinned and actual HEAD.
        3: This answer invents a GC warning; `git status` doesn't report on `gc` operations.
      explanation: 'The outer repo compares the pinned SHA with the submodule''s actual HEAD. Mismatch → `new commits`. Fix: `git add <path>` + commit to pin the new SHA, or `git submodule update` to snap the submodule back to the pinned SHA.'
    - question: 'Why doesn''t `git pull` automatically update submodule working directories — what Git principle is respected by this design?'
      options:
      - Pull is inherently broken for submodules and skips them
      - 'Separation: an outer pull won''t move the inner HEAD'
      - Pull is always read-only and writes nothing to disk
      - It would violate the SHA-1 collision resistance guarantee
      correct_index: 1
      option_feedback:
        0: This answer assumes a tool defect; the design is intentional separation between outer and inner repos.
        2: This answer is wrong on its face — `pull` writes to local refs and the working tree.
        3: This answer invents a cryptographic justification; the design is about repo-boundary respect, not hash collisions.
      explanation: 'Git keeps the outer/inner repo boundary strict: an outer `pull` updates the pinned SHA (a fact about the outer tree) but does not reach into the inner repo and move its HEAD. You opt in with `git submodule update` (or `submodule.recurse=true`), because moving a submodule''s HEAD can strand work in progress inside it.'
    - question: 'The outer repo''s diff for a submodule change is always just one line: `-Subproject commit <old>` / `+Subproject commit <new>`. Why is that enough?'
      options:
      - Git is being lazy and skipping the real diff
      - One commit SHA pins the whole snapshot
      - Git compresses submodule diffs into a single line for display
      - Submodules don't actually change content between pinned versions
      correct_index: 1
      option_feedback:
        0: This answer treats minimal diff as laziness; it's the maximally accurate representation given that a SHA is equivalent to a full snapshot.
        2: This answer invents compression; the diff is genuinely a one-line SHA bump, not compressed-then-expanded.
        3: This answer ignores that the SHA pin's change *is* equivalent to a content change.
      explanation: Step 3's object-model insight applied again. A commit SHA resolves to a deterministic snapshot. Pinning a new SHA is, by construction, equivalent to changing the entire content — no further diff data is needed in the outer commit. Minimum information, maximum fidelity.
    - question: 'A teammate says: ''After every `git pull` I always run `git submodule update --init --recursive`, even on repos without submodules. Paranoia, or sensible?'''
      options:
      - Waste of time — it does nothing on non-submodule repos
      - Sensible — a no-op without submodules, drift-catcher with them.
      - Harmful — it can corrupt repositories that don't use submodules
      - Only useful on teams larger than 10 contributors
      correct_index: 1
      option_feedback:
        0: This answer assumes the command fails or churns on non-submodule repos; it's a fast no-op.
        2: This answer assumes the command can corrupt repos; it does nothing without submodules and only checks submodules out at their pinned commits.
        3: This answer scopes the command to team size; it works regardless of how many collaborators are involved.
      explanation: 'Without submodules the command does nothing; with them it moves each submodule to its pinned commit, so commit or stash work inside a submodule first. As a post-pull habit it prevents the most common submodule bug (a stale working directory). Equivalent hardening: `git config --global submodule.recurse true` makes pull/checkout do it automatically.'
    - question: Upstream publishes a v0.2 commit. Put in order the commands that land it as a pinned version bump in your outer repo. Distractors are verb-variants that look right but fail or do the wrong thing.
      type: parsons
      display: block
      lines:
      - 'cd /tutorial/myproject/vendor/math-utils'
      - 'git fetch'
      - 'git checkout origin/HEAD'
      - 'cd /tutorial/myproject'
      - 'git add vendor/math-utils'
      - 'git commit -m "Bump math-utils to v0.2.0"'
      distractors:
      - 'git pull'
      - 'git submodule update'
      - 'git commit -am "Bump"'
      - 'git merge origin/HEAD'
      explanation: '`git submodule update` is exactly the *wrong* verb here — it resets the submodule back to whatever the *outer* tree pins, erasing the new checkout. That''s the single most common submodule confusion, and getting the direction right is the heart of this step. `git pull` in detached HEAD is unreliable. `-am` would include unrelated changes. `merge` creates a commit structure we don''t want inside the submodule.'
# Pedagogy: PRIMM — Investigate (status messages map directly to SHA-comparison outcomes)
- title: 'Submodule Internals: What ''Content Changed'' Means'
  view: editor
  instructions: |
    ### Why this matters

    `git status` says "modified content" *and* "new commits" on the same submodule and engineers freeze. The cure is the simple SHA-comparison rule: outer pinned SHA vs. inner HEAD SHA tells you exactly which message to expect, and which fix applies. Owning the six-step publish ceremony — and avoiding the detached-HEAD trap inside submodules — is what makes you the person teammates DM when their submodules go weird.

    ### 🎯 You will learn to
    - **Read `modified content` vs. `new commits`** straight from `git status` and pick the right fix.
    - **Execute the six-step publish ceremony** without falling into the detached-HEAD trap.
    - **Resync** any weird submodule state deterministically with one command.
    - **Reason from first principles** — outer repo tracks one SHA; inner repo is a full Git repo; they're independent.

    ### 🤔 Predict first

    You edit `vendor/math-utils/utils.py` directly without `cd`-ing into
    the submodule. What does the *outer* repo's `git status` say about
    `vendor/math-utils` — `modified content`, `new commits`, both, or
    nothing?

    ### The mental model

    The outer repo stores **exactly one thing** per submodule (besides
    `.gitmodules`): the **pinned commit SHA**. On every `git status`, Git compares:

    ```
    SHA the outer tree pins   vs    SHA at the submodule's current HEAD
        (gitlink, mode 160000)         (what's actually checked out)
    ```

    | Condition | Message |
    |---|---|
    | SHAs match, nothing edited inside | clean |
    | Submodule committed new SHA | `new commits` |
    | Submodule working tree dirty | `modified content` (edited files) or `untracked content` (new files) |
    | Both | both messages |

    Nothing else can cause a "modified" submodule.

    ### Task 1: Clean starting state

    ```bash
    cd /tutorial/myproject
    git submodule status
    ```

    Prefix: ` ` clean, `+` HEAD ≠ pinned, `-` not initialized.

    ### Task 2: Dirty the submodule working tree

    Open `vendor/math-utils/utils.py`. Append:

    ```python
    def halve(x):
        return x / 2
    ```

    Save. Back in outer:

    ```bash
    cd /tutorial/myproject
    git status                      # modified content
    git diff vendor/math-utils      # no real line diff — just a summary
    cd vendor/math-utils && git diff   # the real diff lives here
    ```

    ### Task 3: Commit inside the submodule — then try to push

    ```bash
    # inside vendor/math-utils
    git add utils.py
    git commit -m "Add halve helper"
    git push                        # FAILS — predict the error
    ```

    Likely: `fatal: You are not currently on a branch` (detached HEAD from
    `submodule update`) or `no upstream branch`. This is the top submodule
    footgun — Step 1's detached-HEAD concept, encountered here.

    Fix:

    ```bash
    git switch -c update-halve 2>/dev/null || git switch update-halve
    git log --oneline -2
    git push -u origin update-halve              # ← uncommented: this *actually* runs
    git log --oneline origin/update-halve -2     # confirm the remote saw it
    ```

    The submodule's `origin` is a real local bare clone in this VM
    (`/tutorial/math-utils.git`), so `git push` to it works just like a real
    network remote — same protocol, same arguments, same surprise on detached
    HEAD if you forget to `switch -c` first. Try it: the push only succeeds
    after you've moved off detached HEAD.

    Back in outer:

    ```bash
    cd /tutorial/myproject
    git status                      # now: new commits (not modified content)
    ```

    ### Task 4: Bump the pinned SHA

    ```bash
    git add vendor/math-utils
    git commit -m "Bump math-utils: add halve helper"
    git log -1 -p vendor/math-utils   # shows ONE line: -Subproject commit ... / +Subproject commit ...
    ```

    <details markdown="1"><summary>💡 The six commands are six invariants — derive them yourself</summary>

    The ceremony looks arbitrary; each step preserves one invariant:

    | # | Command | Invariant preserved |
    |---|---|---|
    | 1 | `cd sub; git switch -c <branch>` | HEAD is branch-attached (not detached) |
    | 2 | `git commit` inside sub | Your change is a commit object |
    | 3 | `git push` inside sub | New SHA exists on the sub's remote |
    | 4 | `cd ../..; git add <path>` | Outer tree stages the new pinned SHA |
    | 5 | `git commit` outer | Outer records a commit pinning the new SHA |
    | 6 | `git push` outer | New pin is visible to teammates |

    Know the invariants and the commands derive themselves — no memorization needed.

    </details>

    ### Task 5: Force-resync (the universal fix)

    ```bash
    git submodule update --init --recursive
    # add --force if local submodule changes should be discarded
    ```

    ### 🧭 Fixes 95% of "my submodule is weird" moments

    ```bash
    git submodule update --init --recursive
    ```

    It does nothing without submodules. With them, it moves each submodule
    to its pinned commit, so commit or stash work inside a submodule first.
    Set `git config --global submodule.recurse true` to make
    `pull`/`checkout` do it automatically.
  watch_files:
  - myproject/vendor/math-utils/utils.py
  open_file: myproject/vendor/math-utils/utils.py
  setup_commands:
  - "cd /tutorial/myproject\ngit switch -q main 2>/dev/null\nif [ ! -d vendor/math-utils/.git ] && [ ! -f vendor/math-utils/.git ]; then\n  git submodule add -f /tutorial/math-utils.git vendor/math-utils 2>/dev/null\n  git commit -qm 'Add math-utils submodule' 2>/dev/null\nfi\ngit submodule update --init --recursive 2>/dev/null\n"
  solution:
    commands:
    # Single batched command to fit the v86 _runVisible 30s prompt timeout.
    # The push step is required so the inner halve commit reaches math-utils.git
    # — without it, teammates can't fetch what the outer repo now pins.
    - "cd /tutorial/myproject && git switch -q main 2>/dev/null; cd /tutorial/myproject/vendor/math-utils && (grep -q 'def halve' utils.py || (printf '\\ndef halve(x):\\n    return x / 2\\n' >> utils.py && git add utils.py && git commit -m 'Add halve helper')); (git symbolic-ref -q HEAD >/dev/null || git switch -c update-halve); git push -u origin HEAD 2>/dev/null; cd /tutorial/myproject && git add vendor/math-utils && (git diff --cached --quiet || git commit -m 'Bump math-utils: add halve helper')"
    explanation: |
      - **`modified: <path> (modified content)`:** tracked files inside the submodule have uncommitted changes (brand-new untracked files show as `(untracked content)` instead). The outer repo cannot show the diff; `cd` into the submodule and run plain `git diff`.
      - **`modified: <path> (new commits)`:** the submodule's HEAD has moved to a new commit, but the outer repo still points at the old pinned SHA. Resolve by either `git add <path>` + commit (to bump) or `git submodule update` (to reset the submodule back to the pinned SHA).
      - **The outer diff for a submodule is always just one line:** `-Subproject commit <old>` / `+Subproject commit <new>`. That is the only thing the outer repo records about a submodule change — two SHAs.
      - **`git submodule update --init --recursive`:** deterministic reset. Every submodule is forced back to the SHA the outer tree pins. Run after every `git pull` that touches submodule-tracked paths.
  tests:
  - description: On main branch
    command: cd /tutorial/myproject && git symbolic-ref -q HEAD | grep -q 'refs/heads/main'
    hints:
    - text: 'You''re probably still inside the submodule. `cd /tutorial/myproject && git switch main`.'
  - description: Submodule contains a halve helper
    command: cd /tutorial/myproject && grep -q 'def halve' vendor/math-utils/utils.py
    hints:
    - text: 'Append `def halve(x): return x / 2` to `vendor/math-utils/utils.py`. The edit goes in the submodule''s file.'
      condition: 'code_missing: def halve'
  - description: Submodule's inner commit for halve exists
    command: cd /tutorial/myproject/vendor/math-utils && git log --oneline | grep -qi 'halve'
    hints:
    - text: 'You edited the file but never committed *inside* the submodule. `cd vendor/math-utils && git add utils.py && git commit -m "Add halve helper"`.'
      condition: 'code_contains: def halve'
  # The student's inner commit must reach the math-utils.git remote — that's
  # the whole point of Task 3's "switch -c → push -u" recovery from detached HEAD.
  # We require the pushed commit's author to match the local user.email so a
  # student who skipped the push (or accidentally pushed a stale commit from
  # the seeding helper) doesn't pass.
  - description: Inner halve commit was pushed to math-utils.git as the student (Task 3)
    command: |
      cd /tutorial/myproject/vendor/math-utils
      student_email=$(git config user.email 2>/dev/null)
      if [ -z "$student_email" ]; then
        student_email=$(git -C /tutorial/myproject config user.email 2>/dev/null)
      fi
      if [ -z "$student_email" ]; then
        echo "Couldn't read your git user.email. Set one with 'git config --global user.email \"you@example.com\"' and retry."
        exit 1
      fi
      # Find a commit on math-utils.git whose subject mentions halve AND was authored by this user.
      hit=$(git --git-dir=/tutorial/math-utils.git log --all --pretty='%ae|%s' \
              | awk -F'|' -v e="$student_email" 'tolower($2) ~ /halve/ && $1==e {print; exit}')
      if [ -z "$hit" ]; then
        echo "math-utils.git has no halve commit authored by $student_email."
        echo "After committing inside the submodule, push it: 'git switch -c update-halve' (if detached)"
        echo "then 'git push -u origin update-halve' from inside vendor/math-utils."
        exit 1
      fi
    hints:
    - title: Publish the inner commit
      text: 'Task 3 ends with `git push -u origin update-halve` *inside* the submodule. Without that push, the new SHA only exists in your clone, so the bumped pin in the outer repo would point to a commit teammates can''t fetch.'
    - title: Push from a branch, not detached HEAD
      text: 'Inside `vendor/math-utils`, `git status` should say "On branch ...". If it says "HEAD detached", run `git switch -c update-halve` first; your commit comes along. Then `git push -u origin update-halve`.'
  - description: Outer repo has a commit that bumps the submodule SHA
    command: cd /tutorial/myproject && git log --oneline | grep -qiE 'bump|halve'
    hints:
    - text: 'Outer repo still pins the old SHA. `cd /tutorial/myproject && git add vendor/math-utils && git commit -m "Bump math-utils: add halve helper"`.'
  - description: Outer repo is clean (no pending submodule modifications)
    command: cd /tutorial/myproject && git diff --quiet && git diff --cached --quiet
    hints:
    - text: 'Usually `modified: vendor/math-utils (new commits)` — inner landed, outer bump is missing. Finish it.'
  quiz:
    title: "Step 14 — Knowledge Check"
    min_score: 0.8
    shuffle: true
    questions:
    - question: 'You see `modified: vendor/math-utils (modified content)` in the outer `git status`. What caused it?'
      options:
      - The submodule's HEAD differs from the pinned SHA
      - The submodule's working directory has uncommitted changes
      - The repo's `.gitmodules` configuration file was edited
      - The submodule's remote has new commits ready to fetch
      correct_index: 1
      option_feedback:
        0: This answer confuses "modified content" (dirty inner working tree) with "new commits" (HEAD/pin divergence).
        2: This answer confuses submodule status messages with `.gitmodules` file edits.
        3: This answer requires a fetch first; remote state isn't reflected without one, and even then status would show "new commits", not "modified content".
      explanation: '`modified content` means tracked files inside the submodule have uncommitted changes; brand-new untracked files show as `untracked content` instead. The HEAD may still match the pinned SHA. Running `git status` *inside* the submodule shows the dirty files.'
    - question: 'You see `modified: vendor/math-utils (new commits)` in the outer `git status`. What caused it?'
      options:
      - A file inside the submodule was edited but not committed
      - The submodule's HEAD is no longer the pinned commit
      - The outer repo's branch pointer moved to a new commit
      - The submodule is corrupted and needs to be re-cloned
      correct_index: 1
      option_feedback:
        0: This answer describes "modified content" (dirty inner working tree), not "new commits" (HEAD/pin divergence).
        2: This answer is irrelevant; this status compares pinned SHA vs. submodule HEAD, not the outer branch pointer.
        3: This answer assumes corruption; the symptom is normal pin-divergence, not a broken repo.
      explanation: '`new commits` means: inside the submodule, HEAD advanced (someone committed, or checked out a different SHA). The outer repo still records the OLD pinned SHA, so it flags the divergence. Fix: `git add <path>` + commit to bump the pinned SHA, or `git submodule update` to reset the submodule back to the pinned SHA.'
    - question: You run `git diff vendor/math-utils` in the outer repo after making and committing a change in the submodule. What do you see?
      options:
      - A full line-by-line diff of what changed inside the submodule
      - 'Only the gitlink change: old vs. new `Subproject commit`'
      - An error message from the outer repo
      - The diff of the outer repo's `.gitmodules` file
      correct_index: 1
      option_feedback:
        0: This answer assumes the outer repo can show inner content diffs; it can't — the inner repo owns those diffs.
        2: This answer assumes failure; outer diff works, it's just minimal (one SHA-bump line).
        3: This answer confuses the gitlink-SHA diff with config-file edits.
      explanation: The outer repo's diff for a submodule path is always the gitlink SHA change — one line. To see content-level diffs, `cd` into the submodule and run plain `git diff` there. Two repos, two diff domains.
    - question: Which commands reset a submodule's working directory and HEAD to exactly the SHA the outer repo pins?
      options:
      - '`git submodule update --init --recursive`'
      - '`git pull` in the outer repo to refresh both sides'
      - '`git reset --hard` in the outer repo to discard changes'
      - '`rm -rf vendor/math-utils && git clone` for a clean state'
      correct_index: 0
      option_feedback:
        1: This answer updates the pinned SHA but doesn't touch the submodule working tree.
        2: This answer resets the outer tree but doesn't reach into submodule HEADs (Git keeps the boundary strict).
        3: This answer is destructive when `submodule update` does the same job non-destructively.
      explanation: '`git submodule update --init --recursive` is the deterministic reset (add `--force` to discard local changes inside submodules). It clones missing submodules and checks out each one at the outer tree''s pinned SHA. `git reset --hard` in the outer repo does NOT affect submodule working directories — Git treats them as separate repos.'
    - question: 'Why is it consistent that the outer repo records ONLY a pinned SHA for each submodule — not the submodule''s files?'
      options:
      - Because file content inside a submodule is always confidential
      - The SHA already pins every file; copies would be redundant
      - Because submodules are always read-only by design
      - Because Git uses a separate database for submodule content
      correct_index: 1
      option_feedback:
        0: This answer assumes a privacy reason; the design is about deduplication, not confidentiality.
        2: This answer invents a constraint; submodules are read-write like any nested repo.
        3: This answer invents a separate storage system; submodules use the same Git object format.
      explanation: Same object-model insight as Step 3. A commit SHA points at a tree that points at blobs — one SHA resolves to a deterministic snapshot. Storing the SHA is equivalent to storing the files. No duplication is needed.
    - question: 'You edited `vendor/math-utils/utils.py` and saved. Your teammate pulls your branch and sees a clean `git status`. Why didn''t your edit get to them?'
      options:
      - Git hid the change because it was inside a submodule
      - It was never committed inside and pinned outside
      - Your teammate's installed Git version is out of date
      - Submodules never sync changes between collaborators
      correct_index: 1
      option_feedback:
        0: This answer assumes Git silently drops submodule edits; it doesn't, you just have to publish them via the two-step ceremony.
        2: This answer blames version; the issue is missing publish steps, not tooling.
        3: This answer overstates the problem; submodule changes do sync once properly published.
      explanation: 'An edit to a submodule file affects only your working tree until you perform the two-step commit: (1) commit inside the submodule and push its new commit to the submodule''s remote, (2) `git add <path>` + commit in the outer repo to bump the pinned SHA. Skip either step and the change never reaches teammates.'
    - question: 'You edit a file inside a submodule, run `git add && git commit` inside the submodule, then `git push`. Git errors with something like `fatal: You are not currently on a branch`. What Step-1 concept explains this?'
      options:
      - Detached HEAD at the pinned SHA, so no branch to push
      - Merge conflicts left over from a previous submodule operation
      - A missing upstream tracking branch on the submodule's remote
      - Submodules are read-only by default and reject pushes
      correct_index: 0
      option_feedback:
        1: This answer invents a conflict; the issue is detached-HEAD's lack of branch context for push.
        2: This answer is partial; even with an upstream, detached HEAD can't push without a branch.
        3: This answer invents a permission model; submodules are writable.
      explanation: 'After `git submodule update`, submodules are in detached HEAD at the pinned SHA (because that''s what the outer tree specified — no branch context). Any commit you make there is anchored to nothing. Fix: `git switch -c <branch>` inside the submodule **before** committing. Same detached-HEAD pattern as Step 1, encountered in a submodule setting.'
    - question: 'You ran `git rebase main` inside a submodule and rewrote three of its commits. The outer repo''s `git status` says `modified: vendor/math-utils (new commits)`. Is anything wrong with this?'
      options:
            ["Not necessarily: verify remote availability of the intended pin","The old commits are necessarily unfindable as soon as rebase finishes","Git forbids rebasing in submodules","Rebase deletes the submodule from the outer repository"]
      correct_index: 0
      option_feedback:
          {"1":"Rebase creates new commits; it does not immediately erase the old ones. Old pins can remain available in the submodule or on its remote.","2":"A submodule is a Git repository and permits rebase.","3":"Rebase does not remove the outer gitlink."}
      explanation: "The status says only that the checked-out submodule commit differs from the recorded gitlink. Verify that every pinned commit teammates need is available from the submodule remote. Commit the new pin in the outer repository when the new revision is intended. Rebase alone does not make the old SHA unfindable."
    - question: The full "publish a submodule change" ceremony. Put the six required commands in order. Distractors are verb-variants that break one or more of the ceremony's causal invariants.
      type: parsons
      display: block
      lines:
      - 'cd vendor/math-utils'
      - 'git switch -c update-halve'
      - 'git commit -am "Add halve helper"'
      - 'git push -u origin update-halve'
      - 'cd ../..'
      - 'git add vendor/math-utils && git commit -m "Bump math-utils: add halve"'
      distractors:
      - 'git add vendor/math-utils/utils.py'
      - 'git submodule update --init --recursive'
      - 'git push --force origin update-halve'
      - 'git rebase origin/main'
      explanation: 'Each ceremony step preserves one invariant — branch-attached HEAD, commit-exists-in-submodule, SHA-on-remote, SHA-pinned-in-outer. Each distractor breaks one: `git add vendor/math-utils/utils.py` fails because the outer repo tracks only the gitlink, not the files inside; `submodule update` resets the submodule to the old pin; `--force` is a shared-history violation; `rebase` rewrites the commits you just tried to publish. Committing while detached also works if you `switch -c` before anything moves HEAD, as Task 3 shows. Knowing the invariants is the schema that makes the recipe stick.'
# Pedagogy: productive failure (Bjork) — compose 5+ tools under pressure with no hand-holding
- title: 'Capstone: On-Call Debugging Under Pressure'
  view: git_graph
  instructions: |
    ### Why this matters

    Every prior step taught one tool in isolation. Real on-call work demands you compose them under time pressure: stash → bisect → blame → branch → squash → merge → revert if needed → restore → verify. The capstone is where you discover whether the individual skills became *fluent* (you reach for them automatically) or stayed *acquired but slow*. This is also the integration test for the Step 3 object model — every choice you make rests on it.

    ### 🎯 You will learn to
    - **Compose** 5+ advanced Git tools into one realistic end-to-end workflow — without step-by-step instruction.
    - **Pick** squash/rebase/merge based on the history shape you want, not memorized rules.
    - **Trust the reflog safety net** after chaining several destructive operations.
    - **Read state first, act second** — the professional habit that defeats blind-testing.

    <details markdown="1"><summary>🩺 30-second readiness check — answer before starting</summary>

    Without scrolling, answer from memory. If any feels shaky, revisit the
    listed step *before* attempting the capstone. Component-skill research
    (Lovett 2001, Ambrose et al. 2010): 45 min on a weak skill beats hours
    on the integrated task.

    1. Where do orphaned commits live, and how do you anchor one as a branch?
       *Shaky? → revisit Step 2 (reflog).*
    2. What's the *physical* difference between `git rebase` and `git revert`
       in terms of which existing SHAs change?
       *Shaky? → revisit Step 11 (revert) — or really, Step 3.*
    3. Why does `git stash` not include `feature.py` if you never `git add`-ed it?
       *Shaky? → revisit Step 4 (stash gotchas).*
    4. What's the verb to finish a paused cherry-pick after resolving conflicts? A paused rebase?
       *Shaky? → revisit Step 5 or Step 8.*
    5. After `git bisect run`, what's the **non-negotiable** final command, and why?
       *Shaky? → revisit Step 7 (bisect).*

    All five clear? Proceed. Two or more shaky? Spend 15 minutes on the
    weak step *first*. The capstone is an integration exercise — fragile
    components compound into frustration.

    </details>

    ### Scenario — no hand-holding

    You're on-call. Page: **`absolute(-4) == 4` fails on `main`.** CI red.
    Teammate left a dirty tree with an unrelated note. Nobody knows which
    of ~6 recent commits broke things.

    Your checklist:

    1. **Shelve** the unrelated in-progress note (tree must be clean for bisect).
    2. **Find** the bad commit via binary search.
    3. **Read** its message and diff before touching code (author intent).
    4. **Fix** on a dedicated branch. Messy WIP commits expected.
    5. **Clean up** so `main` sees **one** focused commit.
    6. **Merge** to `main`.
    7. **Restore** the shelved note.
    8. **Verify** reflog could still recover everything you rewrote.

    Nothing new — every command came earlier. The point is **choice and composition under pressure**.

    > **Style.** Loop: *read state → decide → act → re-read state*.
    > `git status`, `git log --oneline --graph --all`, `git reflog` are
    > your dashboard. Lost? Re-read state, don't guess.

    ### The state you walk into

    ```bash
    cd /tutorial/myproject
    git status
    git log --oneline --graph --all -12
    grep -q 'return x if x >= 0 else -x' calculator.py
    ```

    ### Hints — open only if stuck for a minute

    <details markdown="1"><summary>Task 1 (shelve WIP)</summary>
    Step 4. One command, noun form. Bisect needs a clean tree.
    </details>

    <details markdown="1"><summary>Task 2 (find the culprit)</summary>
    Step 7, automated. Test exits 0 = good, non-zero = bad. Always end with reset.
    </details>

    <details markdown="1"><summary>Task 3 (read intent)</summary>
    Step 6's chain: `git blame` + `git show <sha>`.
    </details>

    <details markdown="1"><summary>Task 4 (messy fix branch)</summary>
    Branch off `main`, iterate, make any number of WIP commits, get tests green.
    </details>

    <details markdown="1"><summary>Task 5 (squash into one)</summary>
    Step 9 `rebase -i` + `squash`, or Step 10 `merge --squash`. Either is fine.
    </details>

    <details markdown="1"><summary>Task 6 (merge)</summary>
    Whatever strategy leaves `main` with one clean fix commit on top.
    </details>

    <details markdown="1"><summary>Task 7 (restore note)</summary>
    Step 4. Inverse of Task 1. Leave uncommitted.
    </details>

    <details markdown="1"><summary>Task 8 (reflog verify)</summary>
    Step 2. Read-only check: `git reflog` still sees your pre-squash commits.
    </details>

    ### Success criteria

    - Run Tests reports that `absolute()` handles negatives, zero, and positives.
    - `main` ends with exactly **one** new fix commit.
    - `calculator.py` still has your uncommitted `# TODO: add clamp helper` note.
    - `git reflog` retains your intermediate messy commits.

    ### The "burning down the repo" callback

    From Step 1's antipattern: panic = delete the folder, re-clone, force-push.
    You did the opposite:

    | Situation | What you did | What novices do |
    |---|---|---|
    | Dirty tree | **stash** | delete folder |
    | Unknown-culprit regression | **bisect** | read 30 diffs |
    | Author intent | **blame + show** | guess |
    | Messy intermediates | **rebase / squash** | rewrite from scratch |
    | "Lost" commits | **reflog** | panicked `rm -rf` |

    Same competence gap you'll see on every team for the rest of your career.

    ### 🏔️ Stretch (optional, not auto-tested)

    Re-run with one extra wrinkle: the shelved note conflicts with the
    bug-fix line on `stash pop`. Resolve the conflict, pick keep-both
    or keep-fix, verify tests + reflog. This is the capstone's capstone.

    ### 🗺️ The unifying schema — one picture

    Most commands from the basic tutorial and these 14 advanced steps fall
    into one of three categories, by what they do to existing commits.
    **Only category 3 is dangerous to push.** Internalize this picture and
    you can predict the push-safety of an unfamiliar Git command at a glance.

    <pre><code class="diagram-freeform">@startuml
    layout vertical
    box "1. ALWAYS SAFE - reads state or moves refs without changing history\nNo new SHAs, no force-push needed\n- git blame, git log, git show, git diff, git status\n- git branch (create), git switch, git checkout (read mode)" as Safe
    box "2. SAFE TO PUSH - appends new SHAs without changing existing ones\nAdditive only - teammates fast-forward cleanly\n- git commit\n- git cherry-pick\n- git revert (the anti-matter commit)\n- git merge (with or without merge commit)\n- git merge --squash + git commit\n- git stash (local by design, never pushed)" as Additive
    box "3. DANGEROUS TO PUSH - rewrites or abandons existing SHAs\nLocal/unpushed branches only - needs --force on shared\n- git rebase\n- git rebase -i (squash, drop, fixup, edit, reword)\n- git commit --amend\n- git reset --hard / --mixed / --soft\n(reset --hard also discards uncommitted work, even locally)" as Rewriting
    @enduml</code></pre>

    The single decision rule: *before pushing, ask "did I rewrite or abandon
    any existing SHAs?"* If yes, the command lives in category 3 and your
    teammates' clones will diverge. Reach for category 2 (`revert`, `merge`,
    `cherry-pick`) when undoing pushed work.

    ### 🌱 What to do this week (post-tutorial spaced retrieval)

    Without spaced retrieval, ~50% of what you learned today is gone in a
    week. Twenty minutes total over the next month locks it in:

    | When | What |
    |---|---|
    | **Tomorrow (10 min)** | Recreate the capstone from a blank slate — same scenario, same tools, no scrolling back. If you stumble, re-do that step (not the whole capstone). |
    | **In 1 week (5 min)** | Pick any 3 commands from this tutorial. From memory: state name, scenario, and the Step 3 schema (creates objects? moves pointers? both?). |
    | **In 1 month (5 min)** | The next time you face a real "lost commit" or "messy branch" at work, reach for `git reflog` *first* and `rm -rf .git` *never*. That moment is the highest-value retrieval practice you'll do. |

    The Cepeda meta-analysis (254 studies, 14,000+ participants) shows
    spaced practice produces ~2× better retention than equal-duration
    massed practice — and the gap *widens* with delay. This 20 minutes is
    your highest-ROI study time.
  watch_files:
  - myproject/calculator.py
  - myproject/test_calculator.py
  open_file: myproject/calculator.py
  setup_commands:
  - |
    cd /tutorial/myproject
    { [ -e .git/rebase-merge ] || [ -e .git/rebase-apply ]; } && git rebase --abort 2>/dev/null
    [ -e .git/CHERRY_PICK_HEAD ] && git cherry-pick --abort 2>/dev/null
    [ -e .git/MERGE_HEAD ] && git merge --abort 2>/dev/null
    [ -e .git/BISECT_START ] && git bisect reset 2>/dev/null
    git switch -q main 2>/dev/null
    # Clean up any leftover capstone branches from a previous attempt.
    for br in capstone-fix capstone-wip; do git branch -D $br 2>/dev/null; done
    # Drop any leftover stashes from previous capstone attempts.
    while git stash list | grep -q 'capstone'; do git stash drop -q 2>/dev/null || break; done
    # If the capstone has already been completed successfully, don't rebuild.
    if git log main --oneline -1 2>/dev/null | grep -qi 'capstone.*fix\|fix.*absolute.*capstone'; then
      exit 0
    fi
    # Learners repair absolute() in Step 7 in any style. Reset it to one known
    # form (unless that is already the only definition) so the planted
    # regression below always applies.
    if [ "$(grep -c '^def absolute' calculator.py)" != 1 ] || ! awk '/^def[ \t]+absolute[ \t]*\(/ { p = 1; next } p && /^[^ \t]/ { p = 0 } p' calculator.py | grep -q 'return x if x >= 0 else -x'; then
      awk '/^def[ \t]+absolute[ \t]*\(/ { skip = 1; next } skip && /^[^ \t]/ { skip = 0 } !skip' calculator.py > calculator.py.tmp && mv calculator.py.tmp calculator.py
      printf '\ndef absolute(x):\n    """Return |x|."""\n    return x if x >= 0 else -x\n' >> calculator.py
      git add calculator.py
      git commit -qm 'Seed: reset absolute baseline for capstone'
    fi
    # Install the regression test if missing.
    printf 'from calculator import absolute\nassert absolute(-4) == 4, f"expected 4, got {absolute(-4)}"\nassert absolute(3) == 3\nassert absolute(0) == 0\nprint("all tests pass")\n' > test_calculator.py
    git add test_calculator.py
    git diff --cached --quiet || git commit -qm 'Capstone: add regression tests'
    # Plant 5 commits, one of which silently breaks absolute().
    echo '# refactor: formatting pass' >> calculator.py
    git commit -qam 'Capstone: formatting pass'
    echo '# refactor: docstring cleanup' >> calculator.py
    git commit -qam 'Capstone: docstring cleanup'
    # Plant the bug: replace `return x if x >= 0 else -x` with a broken version.
    sed -i 's|return x if x >= 0 else -x|return x  # simplification|' calculator.py
    git commit -qam 'Capstone: simplify absolute return path'
    echo '# refactor: trailing whitespace' >> calculator.py
    git commit -qam 'Capstone: tidy trailing whitespace'
    echo '# refactor: reorder helpers' >> calculator.py
    git commit -qam 'Capstone: reorder helper comments'
    # Dirty the working tree with an unrelated uncommitted note.
    if ! grep -q 'TODO: add clamp helper' calculator.py; then
      echo '# TODO: add clamp helper' >> calculator.py
    fi
  solution:
    # Interactive scenario teaches the FULL composition: stash → bisect → fix
    # on dedicated branch → rebase-fixup → merge → stash-pop. Automated
    # solution rebuilds the same end state directly. Single batched command
    # to fit the v86 _runVisible 30s prompt timeout.
    commands:
    - "cd /tutorial/myproject; { [ -e .git/rebase-merge ] || [ -e .git/rebase-apply ]; } && git rebase --abort 2>/dev/null; [ -e .git/BISECT_START ] && git bisect reset 2>/dev/null; [ -e .git/MERGE_HEAD ] && git merge --abort 2>/dev/null; git switch -q main 2>/dev/null; git reset --hard HEAD; git stash clear -q 2>/dev/null; git branch -D capstone-fix 2>/dev/null; sed -i 's|return x  # simplification|return x if x >= 0 else -x|' calculator.py; git diff --quiet || (git add calculator.py && git commit -m 'Capstone fix: restore negation in absolute'); echo '# TODO: add clamp helper' >> calculator.py"
    explanation: |
      - **Tool choices (many right answers).** The solution shown uses stash → automated bisect → branch + two WIP commits → interactive-rebase fixup → regular merge → stash pop → reflog check. An equally valid path: stash → manual bisect → fix with one commit directly → squash-merge to main → stash pop → reflog check. The tests only verify the end state, not the path.
      - **Why stash first, always.** Bisect moves HEAD across historical commits; a dirty working tree would either block bisect or carry uncommitted edits across arbitrary commits. Same principle as Step 4's "clean tree for context switch."
      - **Why bisect.** Manually reading 5 diffs would work here but would not work at 500. The point is the habit: for regressions, bisect is the default reach, even for small histories.
      - **Why read the culprit's intent.** Step 6's warning: the author wasn't malicious. Their commit message and diff may reveal which part of the change was intended and which was the accidental regression — informing whether you fix the bug or revert the whole commit.
      - **Why clean the fix branch before merging.** Main's history is read during future bisects (this one's regression will be someone else's bisect in six months). Each commit on main should be one reason, not "WIP, WIP, WIP, real fix."
      - **Why reflog at the end.** Proof that the desirable-difficulty exercise did not actually destroy anything. This is the Step 2 safety-net claim, cashed in on a composite workflow.
  tests:
  - description: 'On main branch (cleanup verified)'
    command: cd /tutorial/myproject && git symbolic-ref -q HEAD | grep -q 'refs/heads/main'
    hints:
    - text: 'End on `main`. `git switch main` if you''re still on a fix branch or detached.'
  - description: 'No bisect or rebase still in progress'
    command: cd /tutorial/myproject && [ ! -f .git/BISECT_LOG ] && [ ! -d .git/rebase-merge ] && [ ! -d .git/rebase-apply ]
    hints:
    - text: '`git status` names the paused operation. `git bisect reset`, `git rebase --abort`, or `git merge --abort` as appropriate.'
  - description: 'absolute() body has the correct return (handles negatives, zero, positives)'
    # Shell-only equivalent of the behavioral check. It extracts the effective
    # (last) absolute() body and accepts common correct repairs such as abs(x),
    # sign-check ternaries, and if/else branches.
    command: |
      cd /tutorial/myproject
      body=$(awk '
        /^def[ \t]+absolute[ \t]*\(/ { body=""; capture=1; next }
        capture && /^def[ \t]+[A-Za-z_][A-Za-z0-9_]*[ \t]*\(/ { capture=0 }
        capture { line=$0; sub(/#.*/, "", line); body=body line "\n" }
        END { print body }
      ' calculator.py | tr -d '[:space:]')
      case "$body" in
        *'returnabs(x)'*|*'returnmax(x,-x)'*|*'returnmax(-x,x)'*|*'returnxifx>=0else-x'*|*'returnxifx>0else-x'*|*'return-xifx<0elsex'*|*'return-xifx<=0elsex'*) abs_ok=1 ;;
      esac
      case "$body" in
        *'ifx<0:'*'return-x'*'returnx'*|*'ifx<=0:'*'return-x'*'returnx'*|*'ifx>0:'*'returnx'*'return-x'*|*'ifx>=0:'*'returnx'*'return-x'*) abs_ok=1 ;;
      esac
      [ "${abs_ok:-0}" = 1 ]
    hints:
    - text: 'Bisect should have pointed at the capstone''s simplify-absolute commit. `git show <sha>` to see what was removed, then restore the magnitude logic in `absolute(x)`.'
  - description: "main's committed absolute() is repaired (not just the working tree)"
    command: |
      cd /tutorial/myproject
      body=$(git show main:calculator.py | awk '
        /^def[ \t]+absolute[ \t]*\(/ { body=""; capture=1; next }
        capture && /^def[ \t]+[A-Za-z_][A-Za-z0-9_]*[ \t]*\(/ { capture=0 }
        capture { line=$0; sub(/#.*/, "", line); body=body line "\n" }
        END { print body }
      ' | tr -d '[:space:]')
      case "$body" in
        *'returnabs(x)'*|*'returnmax(x,-x)'*|*'returnmax(-x,x)'*|*'returnxifx>=0else-x'*|*'returnxifx>0else-x'*|*'return-xifx<0elsex'*|*'return-xifx<=0elsex'*) abs_ok=1 ;;
      esac
      case "$body" in
        *'ifx<0:'*'return-x'*'returnx'*|*'ifx<=0:'*'return-x'*'returnx'*|*'ifx>0:'*'returnx'*'return-x'*|*'ifx>=0:'*'returnx'*'return-x'*) abs_ok=1 ;;
      esac
      [ "${abs_ok:-0}" = 1 ]
    hints:
    - title: Commit the repair on main
      text: 'The repaired `absolute()` must be in a commit on `main`, not only in your working tree. Shelve the clamp note before you commit the fix, then restore it at the end.'
  - description: 'Exactly one fix commit landed on main since the seeded capstone history (no WIP/iteration commits leaked)'
    command: |
      cd /tutorial/myproject
      # Count only student/solution commits after setup's final seeded commit.
      baseline_sha=$(git log main --oneline | grep -i 'Capstone: reorder helper comments' | head -1 | awk '{print $1}')
      if [ -z "$baseline_sha" ]; then
        echo "Couldn't locate the capstone setup baseline commit ('Capstone: reorder helper comments'). Did setup_commands run?"
        exit 1
      fi
      new_count=$(git log "${baseline_sha}..main" --oneline | wc -l | tr -d ' ')
      if [ "$new_count" -eq 0 ]; then
        echo "No new commits on main after the bug. You haven't landed the fix yet."
        exit 1
      fi
      if [ "$new_count" -gt 1 ]; then
        echo "Found $new_count new commits on main after the bug commit. The capstone wants exactly ONE clean fix commit landed on main — not the iteration history."
        echo "Collapse into one: 'git rebase -i' + 'squash', or 'git merge --squash' + commit, or land via squash-merge."
        echo
        echo "What landed:"
        git log "${baseline_sha}..main" --oneline
        exit 1
      fi
      # Negative: also reject 'WIP'/'wip'/'oops'/'tweak'/'try'/'temp' as the message of that single commit.
      msg=$(git log -1 main --pretty=%s)
      if echo "$msg" | grep -qiE '^\s*(wip|oops|tweak|try|temp|update|junk|iter)\b'; then
        echo "The single commit on main has a vague message: '$msg'. The capstone wants a *meaningful* fix commit (e.g., 'Fix: restore negation in absolute'). Reword it: 'git commit --amend' if it's the tip, or 'git rebase -i' to reword."
        exit 1
      fi
    hints:
    - title: One commit on main for the fix
      text: '`git log --oneline main` should show exactly one new commit above "Capstone: reorder helper comments". If your fix branch has several WIP commits, collapse them with `rebase -i` + `squash`, or land the branch with `git merge --squash` and one `git commit`.'
    - title: Give the fix a real message
      text: 'A message such as "WIP" or "tweak" fails this check. Name the change, for example "Fix: restore negation in absolute". `git commit --amend -m "..."` rewrites the newest commit if you haven''t pushed it.'
  - description: 'The in-progress clamp note survived the session (still in working tree, uncommitted)'
    command: "cd /tutorial/myproject && grep -q 'TODO: add clamp helper' calculator.py && ! git log main --oneline | grep -qi 'clamp'"
    hints:
    - text: 'The TODO note is missing from `calculator.py`. You stashed it for the bisect — `git stash pop` restores it. Leave it uncommitted.'
      condition: 'source_missing: TODO: add clamp'
    - text: 'The note got committed to `main`. The capstone wants it uncommitted. `git reset HEAD~1` if it''s the tip, then leave the edit dirty.'
      condition: 'source_contains: TODO: add clamp'
  quiz:
    title: "Step 15 — Knowledge Check"
    min_score: 0.8
    shuffle: true
    questions:
    - question: |
        Match each scenario to the **single best** tool. Which option pairs all four correctly?

        - (a) Backport one bug-fix commit to three release branches
        - (b) Integrate 50 commits of a long feature into main
        - (c) Clean up 10 WIP commits before opening a PR
        - (d) Land a feature branch as one commit on main
      options:
      - 'a→merge, b→cherry-pick each, c→rebase -i, d→merge --no-ff'
      - 'a→cherry-pick, b→merge, c→rebase -i, d→merge --squash'
      - 'All four → merge'
      - 'a→rebase, b→cherry-pick, c→merge, d→rebase'
      correct_index: 1
      option_feedback:
        0: This answer rejects cherry-pick's canonical use case (one-commit backports) and uses merge for WIP cleanup, which doesn't collapse history.
        2: This answer collapses all distinctions into one tool; the four scenarios genuinely call for different verbs.
        3: This answer reverses the typical scope-to-tool mapping (rebase for surgery, cherry-pick for bulk).
      explanation: Cherry-pick is surgical (one commit), merge is bulk (many commits), interactive rebase is for history cleanup, squash-merge collapses a branch into one commit. Steps 5, 8, 9, 10 each framed this table; this question just asks you to recognize when to use which. The others mis-apply cherry-pick (wrong for 50 commits) or merge (doesn't clean WIP).
    - question: 'Which of these operations create commits with **new SHAs** even when the patch is identical to an earlier commit? Select all that apply.'
      type: multiple
      options:
      - '`git cherry-pick <sha>` onto a different branch'
      - '`git rebase main` (non-interactive) on a feature branch'
      - '`git rebase -i HEAD~5` that reorders commits'
      - '`git merge --squash feature` followed by `git commit`'
      - '`git merge feature` (fast-forward) — just moves the branch pointer'
      - '`git branch feature` — creates a branch pointer at the current commit'
      correct_indices:
      - 0
      - 1
      - 2
      - 3
      option_feedback:
        4: This answer treats fast-forward merge as creating commits; it only advances a ref pointer — no new SHAs.
        5: This answer treats `git branch` as creating commits; it only writes a 41-byte ref file — no new SHAs.
      explanation: 'A commit''s SHA hashes its tree + parent(s) + author + committer + message. **Change any of those and the SHA changes.** Cherry-pick, rebase, interactive-rebase, and squash-merge all create new commit objects with different parents or combined trees. Fast-forward merge and `git branch` do NOT create commits — they only move pointers (Step 1''s whole point). This is the deep schema: commits are immutable; "moving" a commit is always "copy + move pointer to copy."'
    - question: 'You performed three destructive-feeling operations in sequence: `git reset --hard HEAD~3`, then `git rebase -i` dropping a commit, then entering detached HEAD and making a throwaway commit. Which **single** tool can recover commits lost in all three cases?'
      options:
      - '`git revert` — it reverses any recent operation'
      - '`git reflog`, then `git branch <name> <sha>`'
      - '`git stash pop` — stash tracks destructive operations automatically'
      - 'Nothing — destructive operations are final once executed'
      correct_index: 1
      option_feedback:
        0: This answer ignores that revert applies to one commit's *effects*, not arbitrary HEAD movements; reflog is the cross-cutting tool.
        2: This answer confuses stash (working-tree shelving) with reflog (HEAD-position history).
        3: This answer ignores reflog's universal HEAD-position record; "destructive" only means refs moved, not data deleted.
      explanation: Reflog is the universal safety net because it records HEAD's position history, not the cause. Whether HEAD moved via reset, rebase drop, or leaving detached HEAD, the SHA it was at is recorded. Branch that SHA back into reachability and the "lost" work is found. This is the Step 2 lesson cashed in on a composite workflow — and the reason the tutorial framed destructive commands as "less scary than they sound."
    - question: 'You hit a conflict during `git rebase main`. You edit the file, remove all `<<<<<<<` / `=======` / `>>>>>>>` markers, and run `git add`. Which command finishes **this one commit''s** resolution?'
      options:
      - '`git commit` — identical to finishing a merge conflict'
      - '`git rebase --continue` to resume the replay'
      - '`git merge --continue` since you resolved merge markers'
      - '`git push --force` to publish the resolved tree'
      correct_index: 1
      option_feedback:
        0: This answer treats rebase like merge; rebase needs `--continue`, not `commit` — `commit` would leave the rebase half-done.
        2: This answer uses the wrong verb; this is a rebase, not a merge.
        3: This answer skips finalizing the rebase entirely.
      explanation: A rebase conflict is identical in mechanics to a merge conflict — same markers, same `git add` to mark resolved — but the final verb differs because rebase is *replaying*, not *merging*. Reflex-typing `git commit` here is the single most common mistake; it leaves the rebase half-done. `git rebase --abort` at any point restores the pre-rebase state.
    - question: 'A bug appeared because someone **removed** a line of validation that used to prevent it. Which investigation tool finds the commit that introduced the bug?'
      options:
      - '`git blame` — it shows the author of every existing line'
      - '`git bisect` — deletions still change behavior'
      - '`git log --grep="delete"` — it finds commits with "delete" in the message'
      - '`git show HEAD` — it shows the most recent commit'
      correct_index: 1
      option_feedback:
        0: This answer ignores blame's deletion blind spot; absent lines are invisible to blame.
        2: This answer assumes the commit message reliably announces deletions; messages don't index by content.
        3: This answer shows only the most recent commit, not the historical regression spanning many commits.
      explanation: Blame attributes *existing* lines only — a missing line is invisible to it. Bisect operates on behavioral outcomes (did the test pass or fail?) regardless of whether the change was an addition, modification, or deletion. This is why the capstone you just finished started with bisect, not blame — the bug could just as easily have been a deletion, and starting with bisect generalizes.
    - question: 'A submodule is stored in the outer repo as a gitlink entry (mode `160000`) containing a SHA. That SHA references which kind of Git object?'
      options:
      - A blob object containing the submodule's files
      - A tree object for the submodule's root directory
      - A commit in the submodule's own repo
      - A tag object
      correct_index: 2
      option_feedback:
        0: This answer confuses commit objects with blob objects; gitlinks pin commits, which then resolve to trees and blobs.
        1: This answer confuses commit objects with tree objects; only a commit captures the snapshot identity.
        3: This answer confuses commit objects with tag objects; tags reference commits but aren't stored in gitlinks.
      explanation: 'The gitlink pins a *commit* SHA (in the submodule''s repo). That commit deterministically resolves to a tree, which resolves to blobs — so one SHA is equivalent to a full content snapshot. Same object-model reasoning as Step 3 — snapshot-identity is carried by the commit SHA, which is why "one pin" is enough information to reconstruct the entire submodule''s state.'
    - question: 'Which of these operations are **forbidden** on a branch that has been pushed and is shared with teammates? Select all that apply.'
      type: multiple
      options:
      - '`git rebase main` on the shared branch (rewrites its SHAs)'
      - '`git rebase -i HEAD~5` on the shared branch (rewrites its SHAs)'
      - '`git commit --amend` on the tip of the shared branch (new SHA)'
      - '`git push --force` (or `--force-with-lease`) to overwrite the remote'
      - '`git revert <sha>` (appends an anti-commit, rewrites nothing)'
      - '`git merge feature` into the shared branch (appends a merge commit)'
      correct_indices:
      - 0
      - 1
      - 2
      - 3
      option_feedback:
        4: This answer correctly classifies revert as additive; selecting it would overstate revert's risk on shared branches.
        5: This answer correctly classifies merge as additive; selecting it would conflate adding history with rewriting it.
      explanation: 'The cardinal rule — anything that **rewrites** published commits is forbidden on shared branches, because teammates holding the old SHAs will diverge. That rules out rebase (any flavor), amend, and force-push. Revert and merge are *additive* (they only append new commits without changing existing history), so they are safe. Same rule, different commands. Memorize the property (rewrite = dangerous), not the per-command list.'
    - question: 'You rebased `feature` locally, then `git push` was rejected because teammate Alice had pushed to `feature` in the meantime. What is the safe recovery sequence?'
      type: parsons
      display: block
      lines:
      - 'git reflog'
      - 'git reset --hard <pre-rebase-sha>'
      - 'git pull --no-rebase'
      - 'git push'
      distractors:
      - 'git push --force'
      - 'git rebase --abort'
      - 'git revert HEAD'
      - 'rm -rf .git && git clone'
      explanation: 'When rebasing a shared branch goes wrong, the fix is always — *undo your rewrite first*, then integrate normally. Reflog finds the pre-rebase SHA; `reset --hard` restores it; `git pull --no-rebase` merges Alice''s work (plain `git pull` stops when the branches have diverged and no `pull.rebase` setting says how to integrate); push succeeds. The distractors represent the antipatterns Step 1 named — `push --force` overwrites Alice''s work; `rebase --abort` does not apply after the rebase is complete; `revert` is for undoing a single commit, not a rebase; `rm -rf .git && clone` is the "burning down the repo" antipattern.'
    - question: 'You are mid-edit on a feature when a teammate asks you to bisect a regression on `main`. Your working tree has uncommitted changes you want to keep. Two tools from this tutorial compose to solve this cleanly — which pair?'
      options:
      - '`git commit -m "WIP"` then `git bisect` — commit your WIP so bisect has a clean tree'
      - '`git stash`, `git bisect`, then `git stash pop` once you are back on a named branch'
      - '`git restore .` then `git bisect` — discards your WIP so bisect has a clean tree'
      - '`git bisect` then `git stash` — stash shelves the bisect state for you'
      correct_index: 1
      option_feedback:
        0: This answer pollutes history if pushed; the question prefers a private alternative for in-progress work.
        2: This answer destroys the WIP that the question wants to preserve.
        3: This answer reverses the order; stash must come before bisect to give it a clean tree to walk.
      explanation: Bisect moves HEAD across arbitrary historical commits — a dirty working tree either blocks it or carries your edits into commits they don't belong in. Stash is designed exactly for this — private, local, temporary. Committing WIP pollutes history if pushed; `git restore .` destroys your work. Recognize the compose-two-tools pattern — most real Git tasks chain more than one command.
    - question: 'Three months ago your team squash-merged a `feature-search` branch into `main` and kept the branch. A regression has surfaced that bisect on `main` narrows down to the squash commit. The squash commit changed 800 lines. What is your next move?'
      options:
      - Revert the whole squash commit from `main` and re-investigate later
      - Read every line of the 800-line squash diff until you find the bug
      - '`git bisect` along the kept `feature-search` branch'
      - Give up — squash merge permanently discards internal commits
      correct_index: 2
      option_feedback:
        0: This answer is too broad; the question asks for fine-grained resolution, not whole-feature reversion.
        1: This answer ignores the available finer-grained source on the feature branch's preserved commits.
        3: This answer assumes squash discards internal commits; it only flattens *main's* history, the feature branch keeps them.
      explanation: Squash-merge collapses *main's* history, not the feature branch's. Because the team kept `feature-search`, its commits still exist, and bisect there pinpoints the exact internal commit. Three months on, a deleted branch couldn't come back from your local reflog (entries for unreachable commits expire after 30 days by default), which is the pragmatic case for keeping merged branches or relying on a host that keeps pull-request commits. Step 10's quiz framed this; this question checks that you can *reach* for the recovery without being reminded.
    - question: 'After working through the whole advanced tutorial, which statement best captures what every command you learned actually does?'
      options:
      - Git commands either delete old state or create new state, never both
      - Existing commits are immutable; commands add new objects and move refs
      - Git is magic — just memorize the common commands
      - Commands behave unpredictably depending on remote configuration
      correct_index: 1
      option_feedback:
        0: Most operations do both, creating objects and moving refs; the real invariant is that existing commits are never rewritten.
        2: This answer abandons the underlying invariant for rote learning; the schema is what makes Git predictable.
        3: This answer mistakes per-command behavior for a remote-config sensitivity that doesn't exist.
      explanation: "This is the load-bearing invariant from Step 3 cashed in across all 15 steps. Branch creation moves a ref. Commit creates an object + moves a ref + leaves the index matching the new commit. Rebase creates a *series* of new objects + moves a ref. Cherry-pick creates one new object + moves a ref. git merge --squash prepares the combined index/worktree result; the subsequent git commit creates a commit and moves a ref. History-rewriting operations leave old commits available until retention and pruning remove them; reflogs can help find those commits. Working-tree changes discarded by reset --hard are a separate risk. If you internalize *immutability of existing commits*, nothing in Git is mysterious."
    - question: 'A junior teammate says: "Destructive Git commands like rebase and reset are too dangerous to use; I''ll stick with merge and revert only." Evaluate this position.'
      options:
        ["Correct — rebase and reset should be avoided by anyone who isn't a Git expert","Shared-history risks differ; local use still needs backups of uncommitted work","Incorrect — there is no difference between local and shared branches","Incorrect — reflog auto-recovers destructive operations immediately in all cases"]
      correct_index: 1
      option_feedback:
        0: This answer absolutizes a context-dependent rule; rebase/reset are routine on local branches.
        2: This answer denies the very local/shared distinction that resolves the safety question.
        3: This answer overstates reflog's reach; it works within retention windows on local repos, not as a universal undo.
      explanation: "Rebase and reset are useful when their effects fit the task. Rewriting history that others use requires coordination. Local reflogs can help recover recent commits while their objects still exist, but do not back up never-committed working-tree edits discarded by reset --hard. Inspect status and save work before destructive operations even on an unpushed branch."
