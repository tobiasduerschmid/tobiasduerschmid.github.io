  # --------------------------------------------------------------------------
  # STEP 8 — "A Suggested Daily-Digest Model"
  # Pedagogy:
  #   Worked-model comparison follows the learner's independent proposal.
  #   Self-explanation connects responsibility and ordering to requirements.
  #   Apply — implement the suggested model; check traces and boundary cases.
  #   Spaced retrieval — quiz reviews the notation from Steps 1-5.
  # --------------------------------------------------------------------------
  - title: "A Suggested Daily-Digest Model"
    key: moderated-broadcast
    instructions: |
      ### Why this matters

      You have a proposal of your own. Comparing it with a worked model makes the design choices visible: who knows the subscriber count, who decides what to broadcast, and what must happen exactly once. Implement the suggested model after that comparison, then use traces and tests to check the behavior.

      ### 🎯 You will learn to

      - Evaluate your proposal against a suggested design and explain a revision or a defensible alternative
      - Create Python code whose inferred sequence model matches the suggested interaction and its behavioral requirements

      ### Compare Your Proposal First

      Reopen `digest-design.md` and read your original proposal before studying the target. As you compare, add one choice you would keep and one you would revise, with reasons tied to a requirement or trace. If your proposal already agrees, explain one alternative you rejected. Preserve your original notes.

      The requirements from Step 7 still apply: one opening record of the current subscriber count, one exclusive outcome per post, and the original order and text preserved even for repeated posts. The following is **one suggested design** for those requirements. For this implementation exercise, use its supplied interfaces so the live diagram and checks can give you specific feedback.

      ### The Suggested Target Diagram

      <div class="uml-class-diagram-container" data-uml-type="sequence" data-uml-spec="@startuml
      layout landscape
      participant Main as : Main
      participant bot: DiscordBot
      participant channel: Channel

      activate Main
      create bot
      Main --> bot: <<create>>
      activate bot
      deactivate bot
      create channel
      Main --> channel: <<create>>
      activate channel
      deactivate channel
      Main -> bot: run_digest(channel, posts)
      activate bot
      bot -> channel: get_subscriber_count()
      activate channel
      channel --> bot: count: Integer
      deactivate channel
      bot -> bot: log_start(count)
      activate bot
      deactivate bot
      loop [for each post in posts]
      bot -> bot: is_announcement(post)
      activate bot
      deactivate bot
      alt [bot.is_announcement(post)]
      bot -> channel: broadcast(post)
      activate channel
      deactivate channel
      else [else]
      bot -> bot: log_skip(post)
      activate bot
      deactivate bot
      end
      end
      deactivate bot
      deactivate Main
      @enduml"></div>

      Notice every concept from Steps 1-5 appears:

      - **Lifelines and creation (Step 1):** `Main`, `bot: DiscordBot`, `channel: Channel`, with two `<<create>>` arrows.
      - **Return value (Step 2):** the dashed arrow labeled `count: int` from `channel` back to `bot` after `get_subscriber_count()` — the generator labels the captured result with its bound variable name and annotated type.
      - **Self-call with nested activation (Step 3):** `_log_start` before the loop, `_is_announcement` before each choice, and `_log_skip` in the `else` branch.
      - **Conditional fragment (Step 4):** one `alt` inside the loop.
      - **Loop fragment (Step 5):** one outer `loop` over `posts`.

      ### Why This Design Is Clean

      - **Responsibilities stay identifiable.** `Channel` knows its subscriber count and performs broadcasts. `DiscordBot` coordinates the digest, classifies posts, and records its decisions. The bot can ask for the count without depending on how the channel stores it.
      - **Invocation work stays outside per-post work.** The count query and opening log occur once, before the loop. An empty digest still records its start, without repeating the query and opening log for every post.
      - **Each occurrence gets one decision.** The loop preserves input order, including repeated text. Its inner `alt` makes broadcast and skip mutually exclusive for the current post; a decision outside the loop would incorrectly classify the whole batch at once.
      - **Small helpers give the intent a name.** `_is_announcement`, `_log_start`, and `_log_skip` separate classification and message formatting from coordination. Changing the announcement rule or log wording has a clear home without obscuring the digest's ordering.

      Here, one outer loop and one inner choice make the requirements easy to follow. This is a design choice for this interaction, not a general UML nesting limit or the only acceptable architecture.

      ### Your Task

      1. **Compare.** Finish the comparison section in `digest-design.md`. For the empty input, identify what remains outside the loop; for the repeated announcement, explain why it must appear twice in the runtime trace.
      2. **Implement.** Open `step6/chatbot.py`. Its helper methods are supplied. Complete `DiscordBot.run_digest(channel, posts)` so its inferred diagram matches the suggested target. Capture the count returned by the channel, preserve the target's message order and nesting, and use the supplied classifier and logging helpers.
      3. **Connect the scenario.** In `__main__`, create one bot and one channel, then invoke the digest once with `posts`.
      4. **Check.** Run the code and the checks. Compare the generated diagram and observed events with your written traces. Try an empty list, zero subscribers, mixed posts, and repeated announcements; explain any revision in your notes.

      Equivalent loop forms or a negated guard with exchanged branch bodies are valid if they preserve the outer loop, inner alternatives, message order, and behavior. The structural checks target this suggested model; the design rationale in your notes needs your own review.

      The diagram summarizes possible interactions: it shows a loop body and alternatives, while an execution trace records the particular messages that actually occur. Use both when checking your model.

