    quiz:
      title: "Step 8 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            **Review of Step 1.** Your diagram shows three lifelines: `Main`, `bot: DiscordBot`, and `channel: Channel`. If you changed `__main__` to create **two** bots and one channel, how many lifelines would the diagram show (including `Main`)?
          type: single
          options:
            - "2 — DiscordBot and Channel"
            - "3 — Main, DiscordBot, Channel"
            - "4 — Main, both bots, and the channel"
            - "1 — only Main"
          correct_index: 2
          explanation: |
            Lifelines are **instances**, not classes. Two `DiscordBot()` calls produce two distinct lifelines, plus `Main` and `channel` — four in total. This is the same rule from Step 1; it still applies no matter how complex the rest of the diagram is.

        - question: |
            **Review of Step 2.** Why does the `channel.get_subscriber_count()` call produce a dashed return arrow, while the `channel.broadcast(post)` call does not?
          type: single
          options:
            - "`broadcast`'s method name is longer than `get_subscriber_count`"
            - "Only `get_subscriber_count` returns a captured non-`None` value"
            - "The analyzer only draws return arrows for methods named `get_*`"
            - "Return-arrow rendering is non-deterministic between runs"
          correct_index: 1
          explanation: |
            Both calls cross from bot to channel. The analyzer's remaining conditions are a non-`None` return annotation and a captured result. `get_subscriber_count` meets them (`-> int` + assignment); `broadcast` does not (`-> None`).

        - question: |
            **Review of Step 3.** Why do `self._log_start(count)` and `self._log_skip(post)` appear **nested** inside the activation box for `run_digest`?
          type: single
          options:
            - "Because they share the same underscored method-name prefix"
            - "Because `run_digest` has not returned yet — their frames stack on top"
            - "Because both methods are private (underscore-prefixed) helpers"
            - "Because `__main__` is the lifeline that ultimately calls them"
          correct_index: 1
          explanation: |
            `run_digest` is still executing when it calls `_log_start` or `_log_skip`. The nested activations show those execution intervals on the same lifeline; the nested Python stack frames explain this synchronous case.

        - question: |
            **Review of Steps 4 & 5.** The target has a `loop` fragment containing an `alt` fragment. What Python control-flow structure produces this layout?
          type: single
          options:
            - "A `while` loop nested inside an `if`"
            - "An `if`/`else` nested inside a `for` loop"
            - "Two separate methods"
            - "A `try`/`except` block"
          correct_index: 1
          explanation: |
            The outer box is `loop` (a `for`) and the inner box is `alt` (an `if`/`else` with both branches non-empty). Python indentation = fragment nesting: *whichever block is innermost in the code is innermost in the diagram.*

        - question: |
            **Design judgment.** A reviewer needs to compare three mutually exclusive outcomes for each post: broadcast, skip, or hold for moderator review. Each outcome is one message and all three fit legibly in the current diagram. Which extension best supports this comparison?
          type: single
          options:
            - "Add a third guarded compartment to the existing `alt`."
            - "Nest another `alt` inside each existing compartment."
            - "Draw separate diagrams and omit the shared decision."
            - "Draw all three messages in sequence outside the `alt`."
          correct_index: 0
          option_feedback:
            1: "Nesting expresses a decision within another outcome. These three outcomes are alternatives at the same level."
            2: "Separate diagrams can help explain long paths, but this reviewer needs to compare a short, shared decision."
            3: "A flat message sequence suggests all three actions happen; the requirements make them mutually exclusive."
          explanation: |
            A third compartment adds an alternative without increasing the nesting depth. Here it keeps the three short outcomes together for comparison. A separate diagram can be appropriate when a path needs substantially more detail; that is a communication decision, not a UML requirement.
