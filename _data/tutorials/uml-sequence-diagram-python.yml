    quiz:
      title: "Step 2 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            What does a **dashed arrow with an open arrowhead** mean in a sequence diagram?
          type: single
          options:
            - "An asynchronous message that the caller does not wait for"
            - "A return message — the callee handing a value back to the caller"
            - "A deleted object whose lifeline has just ended"
            - "A broken or lost connection between two participants"
          correct_index: 1
          explanation: |
            Dashed line + open arrowhead = **return message**. Solid line + filled arrowhead = synchronous call. The two visually distinct styles let you see "went in" vs. "came out" at a glance.

        - question: |
            Why does **this** call NOT produce a return arrow on the diagram, even though it is syntactically a Python call?

            ```python
            bot.send("Hello")
            ```
          type: single
          options:
            - "Because `send` returns `None`, so there is nothing meaningful to show"
            - "Because the argument is too short to be worth annotating"
            - "Because Python implicitly hides all return values from diagrams"
            - "Because return arrows are drawn in a separate diagram type"
          correct_index: 0
          explanation: |
            For this cross-lifeline call, the analyzer also requires a non-`None` return annotation and a captured value. `send` has neither here, so the analyzer omits its reply. UML itself does not require those display conventions.

        - question: |
            **Predict.** Each snippet runs in Main and calls the bot on a different lifeline. Which produces a dashed return arrow in this tutorial?

            ```python
            # A
            bot.get_member_count()

            # B
            count = bot.get_member_count()  # get_member_count is annotated `-> int`

            # C
            x = bot.send("hi")              # send is annotated `-> None`
            ```
          type: single
          options:
            - "Only A"
            - "Only B"
            - "Both B and C"
            - "All three"
          correct_index: 1
          explanation: |
            **Only B.** `A` calls the method but throws the return value away, so no arrow. `C` captures the return, but `-> None` means there is no meaningful value to show. The calls already cross lifelines; `B` also has the required non-`None` return annotation and captured value.

        - question: |
            In Python, `self` is the first parameter of every instance method. How is `self` drawn in a sequence diagram?
          type: single
          options:
            - "As an extra participant alongside the method's owner"
            - "As a thick colored arrow drawn before the call"
            - "It is not drawn — the lifeline itself *is* the self reference"
            - "As a dotted arrow on the lifeline pointing to itself"
          correct_index: 2
          explanation: |
            `self` is implicit in the diagram — a lifeline **is** the object, so there is no need to draw `self` separately. You will see `self` again in the next step when an object calls one of its *own* methods — that is when the lifeline points an arrow at itself.


  # --------------------------------------------------------------------------
  # STEP 3 — "Self-Calls and Nested Activation"
  # Pedagogy:
  #   Constructivism — leverage students' existing call stack mental model
  #     (from C / Python debugging) to explain nested activation boxes.
  #   Threshold concept — activation boxes as stack frames (not decoration).
  #   Worked Example + light fading — student writes a method that delegates
  #     to two helpers on the same object.
  #   Bloom's — Apply (refactor to self-calls), Analyze (why nested activation).
  # --------------------------------------------------------------------------
  - title: "Self-Calls and Nested Activation"
    key: self-calls
    instructions: |
      ### Why this matters

      Methods often delegate work to helpers on the same object. Showing those calls makes the order of work and the responsibility of the outer method visible. For the synchronous Python calls in this step, the call stack helps explain why one activation can remain open while another starts inside it.

      ### 🎯 You will learn to

      - Explain nested synchronous activation using the Python call stack
      - Apply self-message notation to produce nested activation from Python code

      ### The Call Stack, Drawn

      You already know the call stack from debugging Python: every time a function calls another function, a new **stack frame** is pushed; when the function returns, the frame is popped.

      An **activation box** marks an execution interval on a lifeline. In these synchronous examples, it begins when a method starts and ends when that method returns. A call to a helper can occur while the outer execution is still in progress.

      > **Mental model for synchronous calls:** A nested self-call corresponds to a new stack frame while the outer call is still active. Read vertical position as event order: the height of an activation box does **not** measure elapsed time unless the diagram explicitly includes a time scale or timing constraints.

      ### Self-Messages

      When an object calls a method on **itself** (`self.some_method()`), the arrow loops back to the same lifeline — and a **new activation box stacks on top of the current one**. This is exactly how your Python interpreter works: a recursive or internal call pushes a fresh frame.

      ### Example — A Method That Delegates

      Consider an `Order` object whose `checkout()` method calls its own `_validate()` helper:

      <div class="uml-class-diagram-container" data-uml-type="sequence" data-uml-spec='@startuml
      participant Main as : Main
      participant order: Order
      Main -> order: checkout()
      activate order
      order -> order: validate()
      activate order
      deactivate order
      deactivate order
      @enduml'></div>

      Notice the arrow from `order` to **itself**, and how it sits inside the outer activation box for `checkout()`. The small nested box marks `validate()` (Python's `_validate()`) executing while `checkout()` is still active, matching the nested stack frames in this synchronous code.

      ### Your Target Diagram

      In `step3/chatbot.py`, `handle_message()` should coordinate the bot's existing operations. Read the target to determine their order and which object performs them:

      <div class="uml-class-diagram-container" data-uml-type="sequence" data-uml-spec="@startuml
      layout landscape
      participant Main as : Main
      participant bot: DiscordBot

      activate Main
      create bot
      Main --> bot: <<create>>
      activate bot
      deactivate bot
      Main -> bot: handle_message('hi there')
      activate bot
      bot -> bot: log(message)
      activate bot
      deactivate bot
      bot -> bot: send(message)
      activate bot
      deactivate bot
      deactivate bot
      deactivate Main
      @enduml"></div>

      Three arrows — one from `Main` to `bot`, and two from `bot` to **itself**. Visually, the two self-calls are nested inside the `handle_message` activation box because they happen while that method is still running.

      ### Your Task

      The starter file defines `DiscordBot` with `_log()` and `send()` methods, but `handle_message()` is empty:

      1. **Trace** the target's outer call and nested activations. Identify the receiver and order of each message.
      2. **Implement** `handle_message()` using the supplied operations, preserving the input message and the target's nesting.
      3. **Start** the target's `"hi there"` scenario from Main. Main should initiate only the outer interaction after constructing the bot; the handler coordinates its internal work.

      > **Check the receiver:** A self-message invokes a method on the current object. Compare each call's receiver with the target's lifeline; an unqualified function call does not express that same relationship.

