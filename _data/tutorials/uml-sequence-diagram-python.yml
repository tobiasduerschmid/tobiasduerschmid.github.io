      - description: "The digest models a guarded choice inside a loop"
        command: |
          import ast
          source = open('/tutorial/step6/chatbot.py').read()
          tree = ast.parse(source)
          bot_cls = next((n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'DiscordBot'), None)
          method = next((m for m in bot_cls.body if isinstance(m, ast.FunctionDef) and m.name == 'run_digest'), None)
          loop = next((s for s in method.body if isinstance(s, (ast.For, ast.While))), None)
          assert loop is not None, \
              "run_digest must iterate over posts with a for loop — that is what produces the outer `loop` fragment."
          inner_if = next((s for s in loop.body if isinstance(s, ast.If)), None)
          assert inner_if is not None, \
              "Inside the for loop, add an `if` — that produces the nested `alt` (or `opt`) fragment."
          assert inner_if.orelse, \
              "Use `if ... else ...`, not a bare `if`. The target diagram shows an `alt` with two compartments."
          ok = any(isinstance(node, ast.Call)
              and isinstance(node.func, ast.Attribute)
              and node.func.attr == '_is_announcement'
              and isinstance(node.func.value, ast.Name)
              and node.func.value.id == 'self' for node in ast.walk(inner_if.test))
          assert ok, "Use the supplied announcement classifier in the loop's guard."
        hints:
          - text: "Compare the outer and inner boxes in the target. Which Python construct repeats work, and which one selects an outcome for one post?"
            condition: "code_not_matches: /def run_digest\\b[^\\n]*:\\n(?:(?!\\n[ \\t]{0,4}\\S)[\\s\\S])*?\\b(?:for|while)\\s/"
          - text: "The choice applies separately to each post. Trace the indentation: is the decision inside the repeated body?"
