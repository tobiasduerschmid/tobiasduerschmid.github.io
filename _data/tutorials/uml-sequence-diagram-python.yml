    quiz:
      title: "Step 3 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            In this synchronous Python example, what does a **nested activation box** (a smaller box stacked on top of a larger one) represent?
          type: single
          options:
            - "An object that contains another object (composition)"
            - "A new stack frame pushed while a previous call is still executing"
            - "A syntax error in the diagram or its source"
            - "A parallel thread running alongside the outer call"
          correct_index: 1
          explanation: |
            Here the inner execution begins before the outer method returns. The Python **call stack** explains this nesting: the inner call pushes a new frame while the outer one is still present. When the inner method returns, the inner box ends; when the outer returns, the outer box ends.

        - question: |
            Which line of Python produces a **self-arrow** (an arrow from a lifeline back to itself)?
          type: single
          options:
            - "`bot.send(\"hi\")`  — called from outside the class"
            - "`self.send(message)`  — called inside a method"
            - "`send(message)`  — a call with no receiver"
            - "`bot = DiscordBot()`  — a constructor"
          correct_index: 1
          explanation: |
            `self.<method>(...)` is what the analyzer recognizes as "same object." The `self.` prefix matters — without it, the call would not be recognized as a method on the current object.

        - question: |
            **Predict.** Given this code, how many arrows appear in the diagram?

            ```python
            class Bot:
                def a(self) -> None: self.b()
                def b(self) -> None: pass

            if __name__ == "__main__":
                bot = Bot()
                bot.a()
            ```
          type: single
          options:
            - "1 — only Main calling bot once"
            - "2 — Main to bot, and bot's self-call"
            - "3 — creation, outer call, and self-call"
            - "0 — `pass` produces no arrows at all"
          correct_index: 2
          explanation: |
            **Three arrows.** (1) The `<<create>>` dashed arrow when `bot = Bot()`. (2) `Main -> bot: a()` for the outer call. (3) `bot -> bot: b()` for the self-call inside `a()`. The `pass` in `b()` is an empty body, so no further arrows come from there.

        - question: |
            **Review of Step 2.** Suppose `b()` had been annotated `def b(self) -> int:` and `a()` had written `x = self.b()`. How many arrows would the diagram now show?
          type: single
          options:
            - "3 — same as before; self-calls don't get return arrows"
            - "4 — creation, `a()`, `b()`, plus a dashed return arrow from `b` back to `a`"
            - "2 — the return arrow replaces the call arrow"
            - "5 — two call arrows and two return arrows"
          correct_index: 0
          explanation: |
            Step 2's renderer rule applies: this analyzer draws separate return arrows **only across different lifelines**. The self-call still returns, but its nested activation ends without a dashed arrow. This is a display convention of the analyzer, not a prohibition in UML.


  # --------------------------------------------------------------------------
  # STEP 4 — "Conditional Fragments: opt and alt"
  # Pedagogy:
  #   One-concept-per-step — decide-then-branch is taught alone; iteration
  #     comes in Step 5. Keeps element interactivity within working-memory
  #     limits (CLT / Sweller).
  #   Variation Theory — opt (if only) and alt (if/else) appear side by side;
  #     the *single* feature that varies is the presence of `else`.
  #   Bloom's — Apply (write the two forms), Analyze (choose which fits).
  # --------------------------------------------------------------------------
  - title: "Conditional Fragments: opt and alt"
    key: conditional-fragments
    instructions: |
      ### Why this matters

      Real behavior almost always branches — spam vs. legitimate traffic, cache hit vs. miss, authorised vs. denied. A sequence diagram that only shows a single straight-line trace cannot communicate any of that. The `opt` and `alt` interaction fragments communicate optional execution and alternatives. This analyzer maps a plain Python `if` to `opt` and an `if`/`else` to `alt`, giving you a concrete way to explore the difference.

      ### 🎯 You will learn to

      - Analyze when to choose `opt` vs. `alt` based on the Python control flow
      - Apply `if` and `if/else` to produce each fragment in a sequence diagram

      ### Combined Fragments Are Boxes Around Messages

      So far every diagram has been a straight top-to-bottom trace. But real systems **branch** — sometimes they do X, other times Y. UML handles this with **combined fragments**: labeled boxes drawn *around* the messages they contain.

      For this tutorial's Python examples, compare these two conditional fragments:

      | Fragment | Label | Python | Meaning |
      |---|---|---|---|
      | **opt** | `opt` | `if ...` (no `else`) | *Zero or one* execution — inside runs only if the guard is true |
      | **alt** | `alt` / `else` | `if ... else ...` | Alternatives: in this exhaustive Python choice, exactly one branch runs |

      Both fragments wrap their region of the diagram in a thin rectangle with a guard condition (the Boolean test) in square brackets in the top-left corner.

      ### Example — An `opt` Fragment

      A bot decides whether to welcome a new member — *only* if they are not already subscribed. If they are subscribed, nothing happens:

      <div class="uml-class-diagram-container" data-uml-type="sequence" data-uml-spec='@startuml
      participant Main as : Main
      participant bot: DiscordBot
      participant channel: Channel
      Main -> bot: welcome(user)
      activate bot
      opt [not bot.is_subscribed(user)]
      bot -> channel: send_welcome(user)
      activate channel
      deactivate channel
      end
      deactivate bot
      @enduml'></div>

      The `opt` box says: *"either this message happens, or nothing does — depending on the guard."* There is no second compartment.

      ### Example — An `alt` Fragment

      A spam filter: *if* spam, block; *otherwise*, forward. **Two compartments**, exactly one runs:

      <div class="uml-class-diagram-container" data-uml-type="sequence" data-uml-spec='@startuml
      participant Main as : Main
      participant bot: DiscordBot
      participant channel: Channel
      Main -> bot: handle("hi")
      activate bot
      bot -> bot: is_spam("hi")
      activate bot
      deactivate bot
      alt [bot.is_spam("hi")]
      bot -> bot: block()
      activate bot
      deactivate bot
      else [else]
      bot -> channel: broadcast("hi")
      activate channel
      deactivate channel
      end
      deactivate bot
      @enduml'></div>

      Here exactly one branch runs because the `else` covers every case not selected by the `if`. In UML generally, an `alt` selects **at most one** operand: if no guard is true and there is no `else` operand, none executes.

      > **The choice rule:** `opt` for a single conditional message, `alt` for mutually-exclusive branches. If your `else` would be empty, use `opt`; if both branches do something, use `alt`. These Python shapes control what this analyzer draws; a hand-authored UML model describes the alternatives relevant to its audience.

      ### Your Target Diagram

      The bot has a `handle(channel, message)` method that:

      - **If the message is spam:** blocks it via `self._block(message)`.
      - **Otherwise:** forwards it to the channel via `channel.broadcast(message)`.

      That's a two-way split — an `alt`.

      <div class="uml-class-diagram-container" data-uml-type="sequence" data-uml-spec="@startuml
      layout landscape
      participant Main as : Main
      participant bot: DiscordBot
      participant channel: Channel

      activate Main
      create bot
      Main --> bot: <<create>>
      activate bot
      deactivate bot
      create channel
      Main --> channel: <<create>>
      activate channel
      deactivate channel
      Main -> bot: handle(channel, 'buy now cheap')
      activate bot
      bot -> bot: is_spam(message)
      activate bot
      deactivate bot
      alt [bot.is_spam(message)]
      bot -> bot: block(message)
      activate bot
      deactivate bot
      else [else]
      bot -> channel: broadcast(message)
      activate channel
      deactivate channel
      end
      deactivate bot
      deactivate Main
      @enduml"></div>

      ### Your Task

      The starter code has `handle(channel, message)` written with **no branching** — it unconditionally forwards everything:

      1. **Read** the target's guard and alternatives. Determine which outcome applies to spam and which applies to other messages.
      2. **Implement** those mutually exclusive outcomes using the supplied classifier and operations. Block spam without broadcasting it; broadcast other messages without blocking them.
      3. **Check** one input in each category and compare the resulting `alt` structure with the target.

      Either guard polarity is valid if its branch bodies preserve the two outcomes. The compartment order and guard label may differ.

      > **Note on `_is_spam`:** It is already defined — a simple classifier. Its self-call appears **before** the `alt` fragment because Python evaluates the condition before choosing a branch. The guard label states which result selects the first compartment.

