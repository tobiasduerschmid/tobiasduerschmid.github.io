    quiz:
      title: "Step 4 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            An **alt** fragment on a sequence diagram represents what Python construct?
          type: single
          options:
            - "A `try` / `except` block with an exception path"
            - "`if` / `elif` / `else` — exactly one branch runs"
            - "A `for` loop iterating over a sequence"
            - "A function or method definition"
          correct_index: 1
          explanation: |
            This analyzer maps an `if/else` choice to `alt`. An `elif` can appear as a nested choice in the `else` compartment, because Python evaluates its condition only after the preceding condition was false. An exhaustive Python choice takes exactly one branch. UML `alt` allows at most one operand; without an applicable guard or `else`, none executes.

        - question: |
            You wrote `if user.is_new: bot.send_welcome(user)` with **no** `else`. Which fragment appears on the diagram?
          type: single
          options:
            - "alt — all `if` statements draw alt"
            - "opt — a plain `if` with no `else` produces an `opt` fragment"
            - "loop — because `if` can be skipped"
            - "No fragment — the renderer only draws `if/else`"
          correct_index: 1
          explanation: |
            `opt` is the fragment for "maybe run this; maybe not." It has one compartment. `alt` is for mutually-exclusive branches (two or more compartments). For the Python constructs used here, adding `else` changes the analyzer's output from `opt` to `alt`.

        - question: |
            Why does the `_is_spam(message)` self-call appear **before** the `alt` fragment?
          type: single
          options:
            - "Python evaluates the condition before selecting a branch."
            - "Python executes both branches before checking the condition."
            - "The call constructs another bot before choosing a branch."
            - "The call schedules both branches to execute concurrently."
          correct_index: 0
          explanation: |
            Python needs the classifier's result to select a branch. The self-call shows that evaluation; the guard label describes the choice using its result. The label does not cause the classifier to run again.


  # --------------------------------------------------------------------------
  # STEP 5 — "Loops: Doing the Same Thing Many Times"
  # Pedagogy:
  #   Fixer-Upper — starter writes a single call; student wraps it in a for.
  #   Contrast with Step 4 — same visual grammar (boxed fragment, guard in
  #     square brackets), different keyword. Variation Theory: the feature
  #     that varies is "repeats vs. picks."
  #   Bloom's — Apply (rewrite to iterate), Analyze (when loop vs. alt).
  # --------------------------------------------------------------------------
  - title: "Loops: Doing the Same Thing Many Times"
    key: loops
    instructions: |
      ### Why this matters

      Iteration is in nearly every real interaction — broadcasting to every subscriber, processing each item in a queue, retrying until success. A sequence diagram cannot duplicate the same arrow ten times to mean "this happens for every item"; it uses the `loop` fragment instead. The visual grammar is identical to `opt` and `alt` from Step 4 — a thin rectangle, a keyword, a guard in square brackets — only the meaning changes from *pick* to *repeat*. Once you see that pattern, you will recognise every fragment on sight.

      ### 🎯 You will learn to

      - Apply `for` and `while` loops in Python to produce a `loop` fragment in the diagram
      - Analyze when the right answer is one fragment vs. multiple smaller diagrams

      ### The `loop` Fragment

      Step 4 taught the two *branching* fragments (`opt` and `alt`). There is one more fragment you will use constantly: **`loop`**, for iteration.

      | Fragment | Label | Python | Meaning |
      |---|---|---|---|
      | **loop** | `loop` | `for` / `while` | Contents run *zero or more times* |

      The visual grammar is identical to `opt` and `alt` — a thin rectangle, a keyword in the top-left, a guard in square brackets. The only thing that changes is the keyword and the meaning: *repeat* instead of *pick*.

      ### Example — A `loop` Fragment

      Sending a welcome to every member — the message is sent once *per iteration*:

      <div class="uml-class-diagram-container" data-uml-type="sequence" data-uml-spec='@startuml
      participant Main as : Main
      participant bot: DiscordBot
      participant channel: Channel
      Main -> bot: welcome_all(members)
      activate bot
      loop [for each member in members]
      bot -> channel: notify(member)
      activate channel
      deactivate channel
      end
      deactivate bot
      @enduml'></div>

      The `loop` box says: *"the message(s) inside run once for every item in the collection."* If the collection is empty, the box still appears, but the messages inside run zero times.

      ### Your Target Diagram

      The bot has a `broadcast_all(channel, messages)` method that sends *each* message in the list to the channel.

      <div class="uml-class-diagram-container" data-uml-type="sequence" data-uml-spec="@startuml
      layout landscape
      participant Main as : Main
      participant bot: DiscordBot
      participant channel: Channel

      activate Main
      create bot
      Main --> bot: <<create>>
      activate bot
      deactivate bot
      create channel
      Main --> channel: <<create>>
      activate channel
      deactivate channel
      Main -> bot: broadcast_all(channel, ['hi', 'hello', ...)
      activate bot
      loop [for each msg in messages]
      bot -> channel: send_to_all(msg)
      activate channel
      deactivate channel
      end
      deactivate bot
      deactivate Main
      @enduml"></div>

      ### Your Task (Fixer-Upper)

      The starter code has `broadcast_all` written as a **flat sequence** — one unconditional call. That produces one bare arrow in the diagram. Your job:

      1. **Interpret** the target's loop: identify the repeated interaction and which value changes on each repetition.
      2. **Implement** `broadcast_all` so every supplied message reaches the channel exactly once, in input order. Empty input must send nothing.
      3. **Check** empty input, several messages, and a repeated message. Compare both the live loop fragment and the actual sends with the contract.

      Both `for` and `while` loops are valid. Their guard labels may differ, but they must express the same repeated interaction and preserve every occurrence.

