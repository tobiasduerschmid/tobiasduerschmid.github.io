      - description: "Main creates one bot and one channel and starts one digest"
        command: |
          import ast
          source = open('/tutorial/step6/chatbot.py').read()
          ns = {'__name__': 'tutorial_check'}
          exec(source, ns)
          tree = ast.parse(source)
          main_nodes = [node for node in tree.body if isinstance(node, ast.If)
                        and any(isinstance(part, ast.Name) and part.id == '__name__' for part in ast.walk(node.test))]
          assert main_nodes, 'Keep the __main__ entry point for this scenario.'
          main_code = compile(ast.Module(body=main_nodes, type_ignores=[]), '<main>', 'exec')
          bots, channels, entries = [], [], []
          class ObservedBot(ns['DiscordBot']):
              def __init__(self):
                  super().__init__()
                  bots.append(self)
              def run_digest(self, channel, posts):
                  entries.append((self, channel, list(posts)))
                  return super().run_digest(channel, posts)
          class ObservedChannel(ns['Channel']):
              def __init__(self):
                  super().__init__()
                  channels.append(self)
          ns.update(DiscordBot=ObservedBot, Channel=ObservedChannel, __name__='__main__')
          exec(main_code, ns)
          assert len(bots) == len(channels) == 1, 'Main must create one bot and one channel for this scenario.'
          assert 'posts' in ns, 'Keep the supplied posts in Main.'
          assert entries == [(bots[0], channels[0], ns['posts'])], \
              'Invoke the digest once on the created bot, using the created channel and the supplied posts.'
        hints:
          - text: "The target starts with two creation arrows. Identify their classes and where Main should create those participants."
            condition: "code_not_matches: /if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bDiscordBot\\s*\\(/"
