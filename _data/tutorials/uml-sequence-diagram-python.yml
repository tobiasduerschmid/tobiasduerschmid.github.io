title: "UML Sequence Diagrams in Python"
description: "Learn to read and create UML sequence diagrams by writing Python code that matches target diagrams. Starting from a few objects exchanging messages and building up to branches and loops, you will propose your own interaction design, compare it with a suggested model, and implement that model."

# Authoring-time Bloom-verb objectives. Not yet rendered to students.
learning_objectives:
  - "Read a UML sequence diagram and write Python code that produces the same call ordering."
  - "Distinguish synchronous calls from return arrows; match each return value to its originating call."
  - "Use sequence-diagram `opt` and `alt` fragments to express conditional execution."
  - "Use `loop` fragments to express iteration."
  - "Design an interaction from behavioral requirements and justify its participants, message order, and decision boundaries."
  - "Compare an original proposal with a suggested sequence model, then implement and verify the model."
  - "Evaluate when a sequence diagram earns its place vs. when prose or a class diagram would communicate better."

backend: pyodide
linter: true  # live pyflakes diagnostics in the Monaco gutter
uml_diagram: true
uml_position: bottom-left
uml_default_view: true
uml_default_type: sequence
require_tests: true
autosave_type: files
progress_version: 1
legacy_step_keys:
  - first-sequence
  - return-values
  - self-calls
  - conditional-fragments
  - loops
  - moderated-broadcast
  - sequence-reference

setup_commands:
  - "import sys; sys.path.insert(0, '/tutorial')"

steps:

  # --------------------------------------------------------------------------
  # STEP 1 — "Your First Sequence Diagram"
  # Pedagogy:
  #   Spiral — introduce a complete-but-simple diagram on day one.
  #   Toy Box — a chat bot scenario that sophomores recognize instantly.
  #   Show It Running — the diagram is generated from real Python code.
  #   Component Skill Isolation — only lifelines and synchronous calls.
  #   Bloom's — Remember (identify participants), Apply (write the calls).
  # --------------------------------------------------------------------------
  - title: "Your First Sequence Diagram"
    key: first-sequence
    instructions: |
      ### Why this matters

      Class diagrams show what *exists* in a system; sequence diagrams show what *happens at runtime* — which object calls which method, in what order. As soon as you start designing or debugging real interactions (logins, API handshakes, message flows), you need a way to describe behavior over time, not just structure. This first step gives you the smallest complete sequence diagram and shows you how Python code on the page becomes a picture you can read.

      ### 🎯 You will learn to

      - Apply the lifeline notation by identifying participants in a sequence diagram
      - Create Python code that produces synchronous messages between two object instances

      ### Where Class Diagrams End, Sequence Diagrams Begin

      You already know class diagrams — they show what *exists*: classes, attributes, methods, relationships. A sequence diagram shows what **happens at runtime**: which object calls which method, and in what order.

      Think of it as the difference between a floor plan (class diagram) and a security camera recording (sequence diagram). Same building, very different question.

      Both live views describe the current source. **Design focus** uses shared UML types, drops Python's leading name markers, and describes iteration as `for each … in …`; **Implementation details** shows Python spellings. The target diagrams use Design focus. Switching views preserves participants and call order. Compare one reply in both views: does changing its type label change who receives it?

      ### Four Pieces of Notation

      | Element | What it looks like | What it means |
      |---|---|---|
      | **Participant** (lifeline) | A box at the top, with a dashed line below | A specific **object instance** active during the scenario |
      | **Synchronous message** | Solid arrow with a **filled** arrowhead → | One object calls a method on another, and **waits** for it to finish |
      | **Activation box** | A thin rectangle on the lifeline | An execution is in progress; nested synchronous calls can be understood using the call stack |
      | **Time** | Top-to-bottom | Earlier events are higher up; later events are lower |

      > **Key distinction:** A lifeline is **not** a class. `bot: DiscordBot` means *"this particular bot instance"*. If your code creates two bots, you get two lifelines — even though there is only one `DiscordBot` class.

      ### A Simpler Example First

      Here is a minimal diagram — a `user` object calls `login()` on an `auth` object:

      <div class="uml-class-diagram-container" data-uml-type="sequence" data-uml-spec='@startuml
      participant user: User
      participant auth: AuthService
      user -> auth: login(password)
      activate auth
      deactivate auth
      @enduml'></div>

      Two lifelines, one synchronous call. That is a complete sequence diagram. Read the arrow as a sentence: *"user calls login(password) on auth, and waits for it to finish."*

      ### Your Target Diagram

      Now let us build one together. Write Python code until the live **Sequence Diagram** panel matches this target:

      <div class="uml-class-diagram-container" data-uml-type="sequence" data-uml-spec="@startuml
      layout landscape
      participant Main as : Main
      participant bot: DiscordBot
      participant channel: Channel

      activate Main
      create bot
      Main --> bot: <<create>>
      activate bot
      deactivate bot
      create channel
      Main --> channel: <<create>>
      activate channel
      deactivate channel
      Main -> bot: send('Hello, world!')
      activate bot
      deactivate bot
      Main -> channel: notify_members('Welcome')
      activate channel
      deactivate channel
      deactivate Main
      @enduml"></div>

      **Reading the target:**

      - `Main` is the script itself — any code outside a class or function (specifically, the body of `if __name__ == "__main__":`) becomes a synthetic lifeline labeled *Main*. You didn't declare it; the analyzer did, to represent "whoever is starting the scenario."
      - `bot: DiscordBot` is a specific bot instance created by `bot = DiscordBot()`
      - `channel: Channel` is a specific channel instance
      - The two dashed `<<create>>` arrows appear because `Main` constructs each object
      - The two solid arrows are synchronous calls — `Main` calls `send(...)` on `bot`, then `notify_members(...)` on `channel`

      > **Note — `Main` is a learning scaffold, not real-world practice.** In this tutorial every diagram starts from `__main__`, giving you a concrete Python anchor for every arrow. Professional sequence diagrams almost never do this. A real diagram focuses on a **specific interaction between objects that are already alive** — it picks up the story at an interesting method call and does not trace from program startup. You would not see a `Main` lifeline in a diagram drawn on a whiteboard during a design meeting; instead you might see `user`, `authService`, and `database` — all assumed to exist — with the scenario beginning at `user -> authService: login(password)`. The `Main` lifeline is here purely to make Python execution explicit while you are learning the notation.

      ### Your Task

      The file `step1/chatbot.py` already defines `DiscordBot` and `Channel`. Complete its `if __name__ == "__main__":` block:

      1. **Read** the target from top to bottom. Identify the participants Main creates, then the receiver, method, and argument for each solid arrow.
      2. **Implement** that scenario using the supplied classes. Use the target's participant names and message text, preserving event order.
      3. **Check** the live diagram against the target, including who sends each message and which lifeline receives it.

      Watch the **Sequence Diagram** panel — it updates live as you type!

      > **Heads up:** Variable names become participant names. If you write `dbot = DiscordBot()` instead of `bot = DiscordBot()`, the diagram will show `dbot: DiscordBot`. Pick meaningful names — they end up in the picture.

    uml_files:
      - step1/chatbot.py

    files:
      - path: step1/chatbot.py
        content: |
          class DiscordBot:
              def send(self, message: str) -> None:
                  print(f"[BOT] {message}")


          class Channel:
              def notify_members(self, message: str) -> None:
                  print(f"[CHANNEL] {message}")


          if __name__ == "__main__":
              # TODO: Translate the target's participants and ordered messages
              # into an executable scenario.
              pass
        language: python

    open_file: step1/chatbot.py

    solution:
      files:
        - path: step1/chatbot.py
          content: |
            class DiscordBot:
                def send(self, message: str) -> None:
                    print(f"[BOT] {message}")


            class Channel:
                def notify_members(self, message: str) -> None:
                    print(f"[CHANNEL] {message}")


            if __name__ == "__main__":
                bot = DiscordBot()
                channel = Channel()
                bot.send("Hello, world!")
                channel.notify_members("Welcome")
          language: python
      explanation: |
        Each Python line in `__main__` maps directly to a line in the diagram:

        - `bot = DiscordBot()` → new lifeline `bot: DiscordBot`, creation arrow from `Main`
        - `channel = Channel()` → new lifeline `channel: Channel`, creation arrow from `Main`
        - `bot.send(...)` → synchronous message `Main -> bot: send(...)`
        - `channel.notify_members(...)` → synchronous message `Main -> channel: notify_members(...)`

        The `Main` lifeline represents the code inside the `if __name__ == "__main__":` guard. In the next step we will see what happens when a call **returns a value** — the diagram gains a new kind of arrow.

    tests:
      - description: "bot is a DiscordBot instance"
        command: |
          source = open('/tutorial/step1/chatbot.py').read()
          ns = {'__name__': 'tutorial_check'}
          exec(source, ns)
          ns['__name__'] = '__main__'
          exec(source, ns)
          assert isinstance(ns.get('bot'), ns['DiscordBot']), 'The bot lifeline needs a DiscordBot instance named bot.'
        hints:
          - text: "Find the participant labeled bot in the target. Its label contains an instance name and a class name; which belongs on each side of an assignment?"
            condition: "code_not_matches: /if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bbot\\s*=/"
          - text: "An assignment creates a name, but what value does that name refer to? Compare bot with the class named on its lifeline."
            condition: "code_matches: /^(?=[\\s\\S]*if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bbot\\s*=)(?![\\s\\S]*if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bbot\\s*=\\s*DiscordBot\\s*\\()/"
          - text: "Trace the construction line: does bot receive a new object, the class itself, or a string? Which expression creates an instance?"
            condition: "code_matches: /^(?=[\\s\\S]*if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bbot\\s*=)(?=[\\s\\S]*if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bbot\\s*=\\s*DiscordBot\\s*\\()/"

      - description: "channel is a Channel instance"
        command: |
          source = open('/tutorial/step1/chatbot.py').read()
          ns = {'__name__': 'tutorial_check'}
          exec(source, ns)
          ns['__name__'] = '__main__'
          exec(source, ns)
          assert isinstance(ns.get('channel'), ns['Channel']), 'The channel lifeline needs a Channel instance named channel.'
        hints:
          - text: "The target has a second object lifeline. Read its instance and class names, then locate where Main creates it."
            condition: "code_not_matches: /if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bchannel\\s*=/"
          - text: "Inspect what channel refers to after its assignment. A lifeline stands for an instance of the class shown after the colon."
            condition: "code_matches: /^(?=[\\s\\S]*if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bchannel\\s*=)(?![\\s\\S]*if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bchannel\\s*=\\s*Channel\\s*\\()/"
          - text: "Compare the two creation arrows with the values held by bot and channel. Which construction line needs changing?"
            condition: "code_matches: /^(?=[\\s\\S]*if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bchannel\\s*=)(?=[\\s\\S]*if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bchannel\\s*=\\s*Channel\\s*\\()/"

      - description: "Main sends both messages in the target order"
        command: |
          import ast
          source = open('/tutorial/step1/chatbot.py').read()
          ns = {'__name__': 'tutorial_check'}
          exec(source, ns)
          tree = ast.parse(source)
          main_nodes = [node for node in tree.body if isinstance(node, ast.If)
                        and any(isinstance(part, ast.Name) and part.id == '__name__' for part in ast.walk(node.test))]
          assert main_nodes, 'Keep the __main__ entry point for this scenario.'
          main_code = compile(ast.Module(body=main_nodes, type_ignores=[]), '<main>', 'exec')
          events = []
          class ObservedBot(ns['DiscordBot']):
              def send(self, message: str) -> None:
                  events.append(('send', message))
                  return super().send(message)
          class ObservedChannel(ns['Channel']):
              def notify_members(self, message: str) -> None:
                  events.append(('notify', message))
                  return super().notify_members(message)
          ns.update(DiscordBot=ObservedBot, Channel=ObservedChannel, __name__='__main__')
          exec(main_code, ns)
          assert events == [('send', 'Hello, world!'), ('notify', 'Welcome')], \
              'Run both target calls once, with their shown messages, in top-to-bottom order.'
        hints:
          - text: "Read the target from top to bottom after the creation arrows. Which object receives the first ordinary message?"
            condition: "code_not_matches: /if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bbot\\s*\\.\\s*send\\s*\\(/"
          - text: "One interaction has been added. Follow the remaining arrow to its receiver and compare its label with that class's methods."
            condition: "code_matches: /^(?=[\\s\\S]*if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bbot\\s*\\.\\s*send\\s*\\()(?![\\s\\S]*if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bchannel\\s*\\.\\s*notify_members\\s*\\()/"
          - text: "Make a two-row trace with columns receiver, argument, and order. Compare your actual calls with both arrows in the target; comments and unreachable calls do not execute."
            condition: "code_matches: /^(?=[\\s\\S]*if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bbot\\s*\\.\\s*send\\s*\\()(?=[\\s\\S]*if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bchannel\\s*\\.\\s*notify_members\\s*\\()/"

    quiz:
      title: "Step 1 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            In a sequence diagram, what does a **single lifeline** represent?
          type: single
          options:
            - "A class definition for one of the participating types"
            - "A specific object instance alive during the scenario"
            - "A Python source file containing one of the classes"
            - "A free function defined somewhere in the code"
          correct_index: 1
          explanation: |
            A lifeline represents **one object instance**, not a class. If your code does `a = Dog()` and `b = Dog()`, you get **two** lifelines (`a: Dog` and `b: Dog`) even though there is only one `Dog` class. This is the single most common confusion when switching from class diagrams to sequence diagrams.

        - question: |
            What does a **solid arrow with a filled arrowhead** (→) mean?
          type: single
          options:
            - "A documentation comment attached to a participant"
            - "A synchronous call — the caller waits for the callee to finish"
            - "An asynchronous call that returns to the caller immediately"
            - "A return value flowing back to the original caller"
          correct_index: 1
          explanation: |
            A solid line with a filled arrowhead is a **synchronous message** — a normal method call where the caller blocks until the callee returns. This matches Python's default behavior: every `x.method()` call waits for `method()` to finish before the next line executes.

        - question: |
            **Predict before you look.** Given this Python `__main__` block, how many lifelines will the sequence diagram show (including `Main`)?

            ```python
            if __name__ == "__main__":
                a = DiscordBot()
                b = DiscordBot()
                c = Channel()
                a.send("hi")
            ```
          type: single
          options:
            - "2 — just DiscordBot and Channel"
            - "3 — Main, DiscordBot, and Channel"
            - "4 — Main, a, b, and c"
            - "1 — only Main"
          correct_index: 2
          explanation: |
            **Four lifelines.** `Main`, plus one for each object that gets created: `a: DiscordBot`, `b: DiscordBot`, `c: Channel`. Even though `a` and `b` are the same class, each instance gets its own lifeline. This is the lifelines-are-instances rule in action.

        - question: |
            In a sequence diagram, how is **time** represented?
          type: single
          options:
            - "Left to right across the horizontal axis"
            - "Top to bottom — earlier events higher"
            - "By numeric labels placed on each arrow"
            - "By color — green is first, red is last"
          correct_index: 1
          explanation: |
            **Top to bottom.** The horizontal axis shows *who* is involved (the lifelines); the vertical axis shows *when*. This means the order of your Python statements directly controls the vertical order of the arrows.


  # --------------------------------------------------------------------------
  # STEP 2 — "Return Values: The Dashed Arrow"
  # Pedagogy:
  #   Worked Example — full code with type annotations shown first.
  #   Constructivism — bridge Python `x = obj.method()` to dashed return arrow.
  #   Targeted misconception correction — students often assume EVERY call has
  #     a visible return; actually only captured, non-void returns get drawn
  #     (Ambler: "Label return messages only when not obvious").
  #   Bloom's — Apply (add return type + capture), Analyze (when does a return
  #     arrow appear vs. not).
  # --------------------------------------------------------------------------
  - title: "Return Values: The Dashed Arrow"
    key: return-values
    instructions: |
      ### Why this matters

      Most useful methods *give something back* — a count, a status, a result — and the diagram has to show those returns without burying the reader in noise. UML permits return arrows when they help explain an interaction. This tutorial's analyzer uses specific rules to decide which ones to draw; those are renderer conventions, not requirements of UML. Get this right and your diagrams stay readable; miss it and either important data disappears or trivial returns clutter the picture.

      ### 🎯 You will learn to

      - Analyze when a return message appears on a sequence diagram (and when it does not)
      - Apply Python type annotations and assignments to produce a dashed return arrow

      ### Return Arrows in This Tutorial

      A **return message** is drawn as a **dashed arrow with an open arrowhead** (⇠). It points *back* from the callee to the caller, at the moment the method finishes.

      The analyzer omits some returns to reduce clutter. For a visible return in this tutorial, these conditions must hold:

      1. The method has a **non-`None` return type** (annotate it: `-> int`, `-> str`, etc.)
      2. The caller **captures** the return value in a variable (`count = bot.get_count()`)
      3. The caller and callee are **different lifelines**; the analyzer omits separate return arrows for self-calls.

      If you just write `bot.send("hi")` and ignore any return, no dashed arrow appears — because "the call finished and came back" is already implied by the activation box ending. A hand-authored UML diagram can show an uncaptured return or a self-call return when that information matters.

      ### Example — With and Without Capture

      **Without capture** — a solid call and an activation box, but no dashed return:

      <div class="uml-class-diagram-container" data-uml-type="sequence" data-uml-spec='@startuml
      participant caller: Main
      participant api: API
      caller -> api: log("event")
      activate api
      deactivate api
      @enduml'></div>

      **With capture** — solid arrow going in, dashed arrow coming back:

      <div class="uml-class-diagram-container" data-uml-type="sequence" data-uml-spec='@startuml
      participant caller: Main
      participant api: API
      caller -> api: get_status()
      activate api
      api --> caller: String
      deactivate api
      @enduml'></div>

      Read the dashed arrow as *"the method finished and handed back a value of this type."*

      ### Your Target Diagram

      Extend the chat bot from Step 1. Now `DiscordBot` has a method that reports the current member count, and `Main` captures it to decide what to say:

      <div class="uml-class-diagram-container" data-uml-type="sequence" data-uml-spec="@startuml
      layout landscape
      participant Main as : Main
      participant bot: DiscordBot
      participant channel: Channel

      activate Main
      create bot
      Main --> bot: <<create>>
      activate bot
      deactivate bot
      create channel
      Main --> channel: <<create>>
      activate channel
      deactivate channel
      Main -> bot: get_member_count()
      activate bot
      bot --> Main: count: Integer
      deactivate bot
      Main -> channel: notify_members('{count} members ...)
      activate channel
      deactivate channel
      deactivate Main
      @enduml"></div>

      Notice the new dashed arrow from `bot` back to `Main` labeled `count: Integer` — that is the return arrow. Python spells its type `int`. The old call to `channel.notify_members(...)` has **no** dashed return arrow because its source return type is `None`.

      ### Your Task

      Open `step2/chatbot.py`. The method is supplied, but the starter's notification is hardcoded:

      1. **Trace** the target's returned information from the bot to Main and then to the channel. Compare that data flow with the starter.
      2. **Update** Main so the notification uses the bot's current returned count, with wording `<count> members online` (for example, `7 members online` when the count is 7).
      3. **Check** the return arrow and notification. Try a different count, including zero, to verify the message depends on the returned value.

      > **Renderer constraint:** Keep the supplied `-> int` annotation. For this renderer to draw the reply, the call must cross lifelines and Main must retain its result in a variable. Choose how to use that value in the notification.

    uml_files:
      - step2/chatbot.py

    files:
      - path: step2/chatbot.py
        content: |
          class DiscordBot:
              def send(self, message: str) -> None:
                  print(f"[BOT] {message}")

              def get_member_count(self) -> int:
                  return 5


          class Channel:
              def notify_members(self, message: str) -> None:
                  print(f"[CHANNEL] {message}")


          if __name__ == "__main__":
              bot = DiscordBot()
              channel = Channel()

              # TODO: Connect the returned information to the later notification.
              bot.get_member_count()

              # TODO: Keep this notification accurate when the count changes.
              channel.notify_members("5 members online")
        language: python

    open_file: step2/chatbot.py

    solution:
      files:
        - path: step2/chatbot.py
          content: |
            class DiscordBot:
                def send(self, message: str) -> None:
                    print(f"[BOT] {message}")

                def get_member_count(self) -> int:
                    return 5


            class Channel:
                def notify_members(self, message: str) -> None:
                    print(f"[CHANNEL] {message}")


            if __name__ == "__main__":
                bot = DiscordBot()
                channel = Channel()
                count = bot.get_member_count()
                channel.notify_members(f"{count} members online")
          language: python
      explanation: |
        Two small changes in the source, one big change in the diagram:

        - `count = bot.get_member_count()` — the assignment makes the **return value "used"**. Combined with the existing `-> int` annotation and the call across different lifelines, this triggers the dashed return arrow.
        - `f"{count} members online"` — not required for the diagram, but it shows a realistic reason to capture the return.

        Compare the earlier call `bot.send(...)` in Step 1: its return type is `None`, so even if you wrote `x = bot.send("hi")`, no dashed arrow would appear. This analyzer omits that return; a hand-authored UML diagram may show a reply whenever it helps explain the interaction.

    tests:
      - description: "get_member_count() has a return type annotation"
        command: |
          import ast
          source = open('/tutorial/step2/chatbot.py').read()
          tree = ast.parse(source)
          bot_cls = next((n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'DiscordBot'), None)
          assert bot_cls is not None, "DiscordBot class must exist"
          method = next((m for m in bot_cls.body if isinstance(m, ast.FunctionDef) and m.name == 'get_member_count'), None)
          assert method is not None, "get_member_count method must exist"
          ret = method.returns
          assert ret is not None and isinstance(ret, ast.Name) and ret.id == 'int', \
              "Keep the `-> int` return type annotation on get_member_count — without it, the diagram won't draw the return arrow"
        hints:
          - text: "The return-arrow rule has a condition on the method declaration. Locate that declaration before changing the caller."
            condition: "code_not_matches: /def get_member_count\\b/"
          - text: "The body returns an integer. Which part of the signature tells the analyzer the type of that return value?"
            condition: "code_matches: /^(?=[\\s\\S]*def get_member_count\\b)(?![\\s\\S]*def get_member_count\\b[^\\n]*->)/"
          - text: "Compare the signature's return annotation with the value returned by the method. Parameter annotations describe inputs, not the returned value."
            condition: "code_matches: /^(?=[\\s\\S]*def get_member_count\\b)(?=[\\s\\S]*def get_member_count\\b[^\\n]*->)/"

      - description: "The return value of get_member_count() is captured"
        command: |
          import ast
          source = open('/tutorial/step2/chatbot.py').read()
          tree = ast.parse(source)
          captured = False
          main_nodes = [node for node in tree.body if isinstance(node, ast.If)
                        and any(isinstance(part, ast.Name) and part.id == '__name__' for part in ast.walk(node.test))]
          for node in ast.walk(ast.Module(body=main_nodes, type_ignores=[])):
              if isinstance(node, (ast.Assign, ast.AnnAssign)):
                  val = node.value
                  if (val is not None and isinstance(val, ast.Call)
                          and isinstance(val.func, ast.Attribute)
                          and val.func.attr == 'get_member_count'):
                      captured = True
          assert captured, \
