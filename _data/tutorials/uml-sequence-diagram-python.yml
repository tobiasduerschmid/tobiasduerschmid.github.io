    solution:
      files:
        - path: step6/chatbot.py
          content: |
            class Channel:
                def broadcast(self, message: str) -> None:
                    print(f"[BROADCAST] {message}")

                def get_subscriber_count(self) -> int:
                    return 42


            class DiscordBot:
                def _is_announcement(self, post: str) -> bool:
                    return post.startswith("@all")

                def _log_start(self, count: int) -> None:
                    print(f"[DIGEST] starting for {count} subscribers")

                def _log_skip(self, post: str) -> None:
                    print(f"[DIGEST] skipped: {post}")

                def run_digest(self, channel: Channel, posts: list) -> None:
                    count = channel.get_subscriber_count()
                    self._log_start(count)
                    for post in posts:
                        if self._is_announcement(post):
                            channel.broadcast(post)
                        else:
                            self._log_skip(post)


            if __name__ == "__main__":
                posts = [
                    "@all staff meeting at 3pm",
                    "just saying hi",
                    "@all remember to stretch",
                ]
                bot = DiscordBot()
                channel = Channel()
                bot.run_digest(channel, posts)
          language: python
      explanation: |
        Every line of `run_digest` maps to one visual element:

        - `count = channel.get_subscriber_count()` → sync arrow to `channel`, dashed return arrow labeled `count: int` back to `bot` (Step 2).
        - `self._log_start(count)` → self-arrow stacked on top of the outer `run_digest` activation box (Step 3).
        - `for post in posts:` → `loop` fragment (Step 5).
        - `if self._is_announcement(post): ... else: ...` → a classifier self-call followed by an `alt` fragment with two compartments (Step 4).
        - `channel.broadcast(post)` → sync message to `channel` (Step 1).
        - `self._log_skip(post)` → another self-arrow (Step 3).

        With no posts, the count query and opening log still run once, while the loop contributes no per-post calls. With repeated announcements, each occurrence reaches `broadcast` in its original position. The `else` prevents an announcement from also being logged as skipped.

        Compare these facts with the proposal you wrote before seeing the target. The model is clean because its responsibilities and control-flow boundaries make those requirements easy to inspect. Passing the checks supports this implementation's behavior; your trace-based comparison explains the design judgment.

    tests:
      - description: "run_digest captures channel.get_subscriber_count()"
        command: |
          import ast
          source = open('/tutorial/step6/chatbot.py').read()
          tree = ast.parse(source)
          bot_cls = next((n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'DiscordBot'), None)
          assert bot_cls is not None, "DiscordBot must exist"
          method = next((m for m in bot_cls.body if isinstance(m, ast.FunctionDef) and m.name == 'run_digest'), None)
          assert method is not None, "DiscordBot.run_digest must exist"
          captured_names = set()
          for stmt in method.body:
              targets, val = [], None
              if isinstance(stmt, ast.Assign):
                  targets, val = stmt.targets, stmt.value
              elif isinstance(stmt, ast.AnnAssign) and stmt.value is not None:
                  targets, val = [stmt.target], stmt.value
              if (val is not None and isinstance(val, ast.Call)
                      and isinstance(val.func, ast.Attribute)
                      and val.func.attr == 'get_subscriber_count'):
                  for t in targets:
                      if isinstance(t, ast.Name):
                          captured_names.add(t.id)
          assert captured_names, \
              "Capture the subscriber count in run_digest so the analyzer can show its return arrow."
        hints:
          - text: "Locate the first call leaving the bot in the target. What information does the channel return before the digest begins?"
            condition: "code_not_matches: /def run_digest\\b[^\\n]*:\\n(?:(?!\\n[ \\t]{0,4}\\S)[\\s\\S])*?get_subscriber_count\\s*\\(/"
          - text: "The returned number is needed by a later self-call. Where can run_digest retain it between those two interactions?"
            condition: "code_matches: /^(?=[\\s\\S]*def run_digest\\b[^\\n]*:\\n(?:(?!\\n[ \\t]{0,4}\\S)[\\s\\S])*?get_subscriber_count\\s*\\()(?![\\s\\S]*def run_digest\\b[^\\n]*:\\n(?:(?!\\n[ \\t]{0,4}\\S)[\\s\\S])*?\\b\\w+(?:\\s*:\\s*\\w+)?\\s*=\\s*channel\\.get_subscriber_count\\s*\\()/"
          - text: "Trace the assignment inside run_digest rather than a driver or unused helper. Which local variable receives the value returned on the dashed arrow?"
            condition: "code_matches: /^(?=[\\s\\S]*def run_digest\\b[^\\n]*:\\n(?:(?!\\n[ \\t]{0,4}\\S)[\\s\\S])*?get_subscriber_count\\s*\\()(?=[\\s\\S]*def run_digest\\b[^\\n]*:\\n(?:(?!\\n[ \\t]{0,4}\\S)[\\s\\S])*?\\b\\w+(?:\\s*:\\s*\\w+)?\\s*=\\s*channel\\.get_subscriber_count\\s*\\()/"

      - description: "The digest logs the current subscriber count before processing posts"
        command: |
          source = open('/tutorial/step6/chatbot.py').read()
          ns = {'__name__': 'tutorial_check'}
          exec(source, ns)
          for subscriber_count in (0, 7):
              events = []
              class ObservedChannel(ns['Channel']):
                  def get_subscriber_count(self):
                      events.append(('count',))
                      return subscriber_count
              class ObservedBot(ns['DiscordBot']):
                  def _log_start(self, count):
                      events.append(('start', count))
                      return super()._log_start(count)
              ObservedBot().run_digest(ObservedChannel(), [])
              assert events == [('count',), ('start', subscriber_count)], \
                  'Fetch the current count and log it once, even when there are no posts.'
        hints:
