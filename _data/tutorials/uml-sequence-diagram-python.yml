          for message in ('hi there', 'meeting moved', ''):
              events = []
              class ObservedBot(ns['DiscordBot']):
                  def _log(self, message):
                      events.append(('log', message))
                      return super()._log(message)
                  def send(self, message: str) -> None:
                      events.append(('send', message))
