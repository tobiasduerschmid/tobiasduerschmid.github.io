    quiz:
      title: "Step 5 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            A **loop** fragment on a sequence diagram represents what Python construct?
          type: single
          options:
            - "A recursive function call wrapping itself"
            - "A `try`/`except` block with a guarded body"
            - "`for` or `while` — the contents run zero or more times"
            - "Repeated object creation in a single scenario"
          correct_index: 2
          explanation: |
            `loop` wraps messages that repeat. It maps to Python's `for` and `while`. The guard can describe the iteration (e.g., `[for each message]`).

        - question: |
            **Review of Step 4.** Your method body is `for x in items: if x.valid: bot.send(x)`. Which two fragments appear, and in what order?
          type: single
          options:
            - "`opt` on the outside with `loop` nested inside it"
            - "`loop` outside, `opt` inside — matching the Python indentation"
            - "`alt` outside with `loop` nested inside it"
            - "Only `loop` — a bare `if` produces no fragment"
          correct_index: 1
          explanation: |
            The outer construct in Python is `for`, so the outer box is `loop`. Inside, the `if` without `else` produces `opt`. Fragment nesting mirrors the nesting of your Python code — read the indentation to predict the diagram.

        - question: |
            You have this (made-up) diagram nesting:

            ```
            loop
              alt
                opt
                  alt
                    ...
                  end
                end
              end
            end
            ```

            What is the right reaction?
          type: single
          options:
            - "Perfect — this captures the full conditional logic"
            - "Add even more fragments to cover every edge case"
            - "Refactor — too deeply nested; split into smaller, focused diagrams"
            - "Switch to asynchronous arrows to flatten the nesting"
          correct_index: 2
          explanation: |
            Deeply nested fragments become unreadable fast. Ambler's *UML Style* rule of thumb: if you are past two levels of nesting, split the diagram. Sequence diagrams are for communicating behavior, not for encoding every branch of your code.

        - question: |
            A sequence diagram should typically focus on **one** scenario at a time. Which is the better choice?
          type: single
          options:
            - "One giant diagram covering every possible execution path"
            - "Multiple small diagrams, each showing one scenario"
            - "A single diagram with many nested alt fragments for every condition"
            - "Skip the diagram — the code is enough"
          correct_index: 1
          explanation: |
            **Multiple small, focused diagrams.** Each one answers a single question: "What happens when a valid user logs in?" or "What happens when payment fails?" This is a direct application of the Single Responsibility Principle to your diagrams.


  # --------------------------------------------------------------------------
  # STEP 6 — "Sequence Diagram Reference"
  # Pedagogy:
  #   Retrieval practice / summary — consolidates notation learned.
  #   Serves as a quick-reference card students can revisit.
  # --------------------------------------------------------------------------
  - title: "Sequence Diagram Reference"
    key: sequence-reference
    instructions: |
      ### Why this matters

      You have practiced lifelines, synchronous calls, returns, self-calls, and conditional and loop fragments. Retrieve those ideas before combining them in a design of your own. Use this reference again when you need a notation reminder in the final two steps.

      ### 🎯 You will learn to

      - Evaluate your own recall of every notation element introduced in Steps 1–5
      - Apply this reference card as a quick lookup when designing future diagrams

      ### Self-check (close this page first)

      Before you scroll to the tables below, try to answer these from memory. Look back only when you are stuck:

      1. What does a **lifeline** represent — a class, an instance, or a file?
      2. What three conditions does this analyzer require to display a dashed return arrow?
      3. Why does a self-call produce a *nested* activation box?
      4. If your Python method is `for x in xs: if x.valid: bot.send(x)` (no `else`), what two fragments appear — and in which order?

      Retrieval before review is the learning — just reading the tables again is not.

      ---

      ### The Core Pieces

      | Element | Looks like | Python that produces it |
      |---|---|---|
      | **Lifeline** | box on top, dashed line below | any object instance: `bot = DiscordBot()` |
      | **Activation box** | thin rectangle on the lifeline | a method call — begins when the call arrives, ends when it returns |
      | **Synchronous message** | solid line, filled arrowhead → | `x.method(...)` — caller waits |
      | **Return message** | dashed line, open arrowhead ⇠ | `y = x.method()` **and** `method` returns a non-`None` type *and* caller ≠ callee |
      | **Self-message** | arrow looping back to the same lifeline | `self.method(...)` inside a method |
      | **Creation** | dashed arrow with `<<create>>` label to a new lifeline | constructor: `bot = DiscordBot()` |

      ### The Three Fragments You Will Use Most

      | Fragment | Meaning | Python |
      |---|---|---|
      | **opt** | zero or one execution | `if ...` (no `else`) |
      | **alt** | at most one operand; exactly one for an exhaustive Python choice | `if ... elif ... else ...` |
      | **loop** | repeat zero or more times | `for` / `while` |

      ### Fragments You May Encounter Later

      - **par** — parallel branches execute concurrently (e.g., `asyncio.gather`)
      - **break** — when its guard holds, execute this operand instead of the remainder of the enclosing interaction fragment; this is different from Python's loop `break`
      - **ref** — an "interaction use"; a named sub-scenario referenced from another diagram
      - **critical** — an atomic region
      - **neg** — an invalid trace (what **must not** happen)

      ---

      ### Arrow Cheat Sheet

      <div class="uml-class-diagram-container" data-uml-type="sequence" data-uml-spec='@startuml
      participant a: A
      participant b: B
      a -> b: sync_call()
      activate b
      b --> a: return
      deactivate b
      a ->> b: async_call()
      activate b
      deactivate b
      a -> a: self_call()
      activate a
      deactivate a
      @enduml'></div>

      - `->` synchronous (caller blocks)
      - `-->` return (dashed, open arrow)
      - `->>` asynchronous (caller keeps going — you will meet this later)
      - `-> self` self-call

      ---

      ### Guidelines You Should Remember

      1. **Lifelines are instances, not classes.** Two `Dog()` calls → two lifelines.
      2. **Activation boxes mark execution intervals.** Nested synchronous self-calls can be understood using stack frames. Box height does not measure elapsed time.
      3. **Do not draw every `if` and `for`.** One or two fragment levels is usually enough — split deeply-branching logic into multiple diagrams.
      4. **One scenario per diagram.** A sequence diagram answers a single question. Happy path, error path, and edge cases typically belong in separate diagrams.
      5. **Only draw return arrows when the value matters.** UML is about communication — if the return is `None` or implied by the activation box ending, skip the dashed arrow.
      6. **Choose the scenario's starting point.** Include `Main` and creation messages when startup matters to the interaction, as in this tutorial's runnable examples. For objects that are already running, you can start at the interesting method call instead. A login diagram might begin with `user -> authService: login(password)` and omit construction. Choose the boundary that answers the reader's question.

      ---

      ### What Sequence Diagrams Are Good For

      - **Designing an interaction** before you write the code
      - **Explaining a specific scenario** to a teammate or reviewer (much faster than prose)
      - **Documenting a protocol** (API handshake, auth flow, publish/subscribe)
      - **Finding a bug** — draw the diagram of what you *expect* vs. what actually happens

      And what they are **not** good for: showing the complete behavior of a system. Use a *class* diagram for structure and use *multiple small* sequence diagrams for specific runtime scenarios.

      Next, propose a daily-digest interaction from requirements. In the final step, compare your proposal with a suggested design and build its Python model.

