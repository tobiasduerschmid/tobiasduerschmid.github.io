        language: python

    open_file: step3/chatbot.py

    solution:
      files:
        - path: step3/chatbot.py
          content: |
            class DiscordBot:
                def _log(self, message: str) -> None:
                    print(f"[LOG] received: {message}")

                def send(self, message: str) -> None:
                    print(f"[BOT] {message}")

                def handle_message(self, message: str) -> None:
                    self._log(message)
                    self.send(message)


            if __name__ == "__main__":
                bot = DiscordBot()
                bot.handle_message("hi there")
          language: python
      explanation: |
        Three calls, three mappings:

        - `bot.handle_message("hi there")` in `__main__` → `Main -> bot: handle_message(...)`
        - `self._log(message)` inside `handle_message` → `bot -> bot: _log(...)`
        - `self.send(message)` inside `handle_message` → `bot -> bot: send(...)`

        The two self-arrows sit **inside** the activation box for `handle_message` because the Python interpreter has not returned from `handle_message` yet when it pushes the `_log` and `send` frames onto the stack. The nested activations communicate those overlapping execution intervals; the call stack is a useful explanation for this synchronous example.

        In the next step we will add **branches and loops** with interaction fragments.

