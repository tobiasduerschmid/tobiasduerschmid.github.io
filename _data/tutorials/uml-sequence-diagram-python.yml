          - text: "The target has one entry arrow from Main. Use its label to choose the bot operation Main should invoke."
            condition: "code_matches: /^(?=[\\s\\S]*if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bbot\\s*=)(?![\\s\\S]*if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bbot\\s*\\.\\s*handle_message\\s*\\()/"
          - text: "Trace only Main, ignoring method bodies for a moment. Count the entry calls and compare the message argument with the target."
            condition: "code_matches: /^(?=[\\s\\S]*if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bbot\\s*=)(?=[\\s\\S]*if\\s+__name__\\s*==\\s*[\\\"\\x27]__main__[\\\"\\x27]\\s*:\\n(?:(?!\\n\\S)[\\s\\S])*?\\bbot\\s*\\.\\s*handle_message\\s*\\()/"

      - description: "Main does NOT call bot._log or bot.send directly"
        command: |
          import ast
          source = open('/tutorial/step3/chatbot.py').read()
          tree = ast.parse(source)
          main_body = None
