  # --------------------------------------------------------------------------
  # STEP 7 — "Daily-Digest Design Proposal"
  # Pedagogy: Generation before a worked model; self-explanation and self-review.
  #   Learners choose participants and message structure from requirements.
  #   The next step supplies feedback through comparison, then implementation.
  # --------------------------------------------------------------------------
  - title: "Daily-Digest Design Proposal"
    key: digest-design
    instructions: |
      ### Why this matters

      Reading a finished diagram and deciding what belongs in it are different skills. Make a small design proposal now, while the behavior is specified but the interaction structure is still yours to choose. You will compare your reasoning with a suggested design in the final step.

      ### 🎯 You will learn to

      - Create an interaction proposal from behavioral requirements
      - Justify message order and decision boundaries using concrete traces

      ### The Daily-Digest Requirements

      A chat bot processes a supplied list of posts for a channel. Design one digest invocation with these observable behaviors:

      - **Opening record:** record the channel's current subscriber count once, before processing any posts. This record is required even for an empty list; zero subscribers is a valid count.
      - **Announcements:** each post whose text starts with `@all` is broadcast to the channel. It receives no skip record.
      - **Other posts:** each other post is recorded as skipped and is not broadcast.
      - **Order and occurrences:** process posts in their supplied order and preserve their original text. Repeated text represents separate posts, so every occurrence must receive its own outcome.

      ### Your Task

      Open `digest-design.md`. Spend about 5–8 minutes making a proposal before opening the final step. Use short prose and an ordered message list; you may also sketch a diagram on paper.

      1. **Choose participants.** Name the objects involved, what each is responsible for, and which participant starts this scenario. Distinguish object instances from class names.
      2. **Propose the interaction.** List the messages and any returned information. Decide what happens once per invocation, what repeats, and where choices belong. Choose and explain any fragment boundaries yourself.
      3. **Trace examples.** Write the ordered events for `["@all update", "hello", "@all update"]`. Then describe the empty-list case and the case where the channel has zero subscribers.
      4. **Defend a choice.** Describe one alternative allocation of work or message structure and explain why you prefer your proposal. Point to a requirement or trace, not just a diagram's appearance.

      ### Self-Review Before Continuing

      Check your notes against each requirement. Can a reader identify who owns each responsibility, follow every message, and tell which events occur for each example? Does your proposal preserve repeated posts and make the two outcomes exclusive? Revise any gap you find.

      **Complete your proposal and self-review before selecting Next.** This is a design exercise with no automatic grade. Different proposals may satisfy the requirements; the next step gives you a suggested model to compare and a concrete implementation to check. Keep your original reasoning in the notes so the comparison shows what changed.

