    tests:
      - description: Every scenario step follows a relationship or answers an earlier request
        c4:
          checks:
            max_errors: 0
            rules: [xlevel/scenario-step]
        hints:
          - title: Steps Ride on Relationships
            text: 'Every step in a scenario has to run along a relationship in the model, or answer a request made earlier in the scenario. Which step has neither?'
          - title: Neither Relationship Nor Request
            condition:
              c4:
                exists:
                  step: {scenario: enroll, from: seats, to: web}
            text: 'The step from the Seat Gateway to the Planner Web App has neither: no relationship joins them, and the web app sent the gateway no request. Which requests did the Seat Gateway receive earlier in this scenario, and from whom?'
          - title: The Shape of a Reply
            condition:
              c4:
                exists:
                  step: {scenario: enroll, from: seats, to: coordinator}
            text: 'A reply goes from the element that received a request back to the one that sent it, after the request it answers. Which request did the Planner Web App send, and which element received it?'
      - description: The happy path keeps its participants
        c4:
          view:
            view: dynamic enroll
            shows: [web, coordinator, policy, seats, billing-gateway]
        hints:
          - title: Keep the Happy Path
            text: 'The success branch still needs every participant of the original scenario. Check that the scenario `enroll` still exists and still involves the web app, the coordinator, the policy, and both gateways.'
          - title: Find the Missing Participant
            condition:
              c4:
                view:
                  view: dynamic enroll
                  shows: [web, coordinator]
            text: 'The Explain panel describes the dynamic view in words. Which of the five original participants no longer appears, and which step used to involve it?'
          - title: Fragments Hold Steps
            condition:
              c4:
                view:
                  view: dynamic enroll
                  hides: [billing-gateway]
            text: 'Inside an `alt`, each branch has a `when` condition and its own `steps` list. A step that happens only in one case belongs in that case’s branch; restructuring keeps it in the scenario.'
      # Spec §8 scenario-step query: a reply from the coordinator to the web app inside an alt branch.
      - description: 'Failure branch: the Planner Web App learns which section was full, without a new relationship'
        c4:
          exists:
            step: {scenario: enroll, from: coordinator, to: web, in_fragment: alt, reply: true}
        hints:
          - title: The Student Must Find Out
            text: 'FR-23 says the student learns which section was full. Which participant shows the student anything, and does the case of a full section end with a step to it?'
          - title: A Shortcut Is Not a Repair
            condition:
              c4:
                exists:
                  relationship: {from: seats, to: web}
            text: 'A relationship from the Seat Gateway to the Planner Web App makes the scenario check quiet, but it gives a database interfacer a conversation with the browser. Remove it and send the report through the element that received the plan.'
          - title: Only When a Section Is Full
            condition:
              c4:
                exists:
                  step: {scenario: enroll, from: coordinator, to: web}
            text: 'A report from the coordinator reaches the Planner Web App, but not yet as a reply inside a branch of an `alt`: it runs on every attempt, sits in another fragment such as an `opt`, or is a call along a relationship rather than a reply. Put it in the `alt` branch for a full section, as an answer to a request the web app made.'
          - title: Answer the Request
            condition:
              c4:
                exists:
                  step: {scenario: enroll, from: seats, to: coordinator}
            text: 'The coordinator now knows which section was full. Which request in this scenario can its report answer?'
      # Spec §8 scenario-step query: the billing step sits inside an alt branch.
      - description: Tuition is requested only inside a branch
        c4:
          exists:
            step: {scenario: enroll, from: coordinator, to: billing-gateway, in_fragment: alt}
        hints:
          - title: No Seat, No Tuition
            text: 'FR-23 says no tuition is requested when a section is full. Does the billing step run on every attempt, or only in one case?'
          - title: Move It Into a Branch
            condition:
              c4:
                exists:
                  step: {scenario: enroll, in_fragment: alt}
            text: 'Your scenario has an `alt`, but the billing step is not inside any of its branches, so it still runs on every attempt. Which branch is the case in which tuition should be requested?'
          - title: Keep the Billing Step
            condition:
              c4:
                view:
                  view: dynamic enroll
                  hides: [billing-gateway]
            text: 'The billing step is gone. Restructuring keeps it in the scenario, inside the branch where every seat is held.'
