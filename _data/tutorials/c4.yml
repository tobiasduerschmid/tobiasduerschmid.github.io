        hints:
          - title: The Worked Example Went Missing
            text: 'The Registration API’s open-seats KNOW was given as a worked example. Is a container responsibility that refines the system’s open-seats KNOW still in the model?'
          # The worked example is found by its wording, not its id: a learner may rename the id (wrong-19), and an
          # unresolved id makes a condition false (spec §8). The needles name a count of open seats, not any mention of
          # "open", so a full-section KNOW such as "no open seats" or "unavailable" is not taken for it (wrong-21).
          # The two conditions are complements.
          - title: Check the Link
            condition:
              c4:
                exists:
                  responsibility: {of: api, kind: know, text_any: [how many, number of, count of, seat count, still open, still available]}
            text: 'The Registration API still has the worked example, its KNOW of how many seats are open, but the tray counts no refinement of open seats: its `refines` link is missing or names another responsibility.'
          - title: Restore It
            condition:
              c4:
                absent:
                  responsibility: {of: api, kind: know, text_any: [how many, number of, count of, seat count, still open, still available]}
            text: 'The Registration API no longer has the worked example, its KNOW of how many seats are still open in each section: it was deleted or reworded past recognition. Add it back as a KNOW of the Registration API, with `refines:` pointing to the system’s open-seats responsibility.'
      - description: No decision runs in the browser app
        c4:
          absent:
            responsibility: {of: web, kind: decide}
        hints:
          - title: Where the Browser Runs
            text: 'The Planner Web App runs on the student’s own computer. Can a rule enforced only there protect the university’s prerequisites?'
          - title: Two Owners for One Decision
            condition:
              c4:
                exists:
                  responsibility: {of: {type: container, kind: application}, kind: decide, refines: sys-eligibility}
            text: 'A server-side container now refines the enrollment decision, so the browser’s DECIDE makes a second owner. The browser may show the decision’s result, which is a DO, without deciding.'
          - title: Flagging Is Not Deciding
            condition:
              c4:
                exists:
                  responsibility: {of: web, kind: decide, refines: sys-eligibility}
            text: 'The Planner Web App now refines the system’s decision, so the browser owns it. The web app can still flag a missing prerequisite by showing an answer it receives; which container runs where the university controls it?'
      - description: Every container names its technology, even if it is still to be decided
        c4:
          every: {type: container, in: registration}
          satisfies: {technology: present}
        hints:
          - title: Containers Name What They Are Built With
            text: 'Which containers have no technology yet? Read the Technology field of each container in Course Registration, the database included; the Problems panel does not list every one.'
          - title: Data Stores Too
            condition:
              c4:
                every: {type: container, in: registration, kind: application}
                satisfies: {technology: present}
            text: 'The server application names its technology. A database container also names one, such as the database product it uses.'
          - title: Undecided Is Allowed
            condition:
              c4:
                every: {type: container, in: registration, kind: database}
                satisfies: {technology: present}
            text: 'If the team has not chosen a container’s technology yet, write `TBD`. The checker treats it as a recorded open decision rather than a gap.'
      - description: Every technology names what a container is built with, not where it runs
        c4:
          checks:
            max_warnings: 0
            rules: [c4/infrastructure-container]
        hints:
          - title: Built With, Not Run On
            text: 'Which container’s technology names a way of packaging or running software rather than what the container is built with? The Problems panel names it.'
          - title: Applications Name Their Language
            condition:
              c4:
                exists:
                  element: {type: container, kind: application, technology_any: [docker, kubernetes, container image, virtual machine]}
            text: 'A server application names what it is written in, a language and a framework, the way the Planner Web App does. The machine or the container image that runs it belongs in a deployment view.'
          - title: Databases Name Their Product
            condition:
              c4:
                exists:
                  element: {type: container, kind: database, technology_any: [docker, kubernetes, container image, virtual machine]}
            text: 'A database container names its database product. The server or the container image that hosts it belongs in a deployment view.'
      - description: The Planner Web App sends plans to the Registration API, with a technology
        c4:
          exists:
            relationship: {from: web, to: api, technology: present, derived: exclude}
        hints:
          - title: Who Sends the Plan
            text: 'A student builds a plan in the Planner Web App, and the Registration API enrolls it. Which relationship carries the plan between them, and does it exist yet?'
          - title: How It Travels
            condition:
              c4:
                exists:
                  relationship: {from: web, to: api, derived: exclude}
            text: 'The relationship crosses from the student’s browser to a server, so it names how it travels, as the API’s relationships to the database and to the Billing System do.'
          - title: Read It From the Sender
            condition:
              c4:
                exists:
                  relationship: {from: api, to: web, derived: exclude}
            text: 'The new relationship starts at the Registration API. Read it aloud: Planner Web App … Registration API. The arrow starts at the element that asks.'
      - description: Every relationship says what it asks for
        c4:
          checks:
            max_warnings: 0
            rules: [rdd/no-reason, c4/vague-relationship]
        hints:
          - title: Read Every Arrow Aloud
            text: 'Read each relationship aloud from the element that asks, as the API’s relationship to the database reads. Which one does not make a sentence?'
          - title: A Verb and a Preposition
            condition:
              c4:
                exists:
                  relationship: {from: web, to: api, derived: exclude}
            text: 'Say what the Planner Web App asks the Registration API to do, starting with a verb and ending with a word such as to, from, or through. A label such as “uses” fits any arrow.'
    quiz:
      title: 'Step 5 — Knowledge Check'
      min_score: 0.8
      questions:
        - type: single
          difficulty: advanced
          # objectives: 6, 2 (spaced retrieval of step 1)
          question: 'A teammate’s C4 model refines Course Registration’s enrollment decision in the Registration Database container, as a trigger. Every check in this step passes. What should a reviewer conclude?'
          options:
            - 'The model is consistent, but a data store should not own a decision.'
            - 'The design is sound, because every check in the step passed.'
            - 'The checks are faulty, because they let a wrong design pass.'
            - 'The decision should move to the browser app instead.'
          correct_index: 0
          option_feedback:
            1: 'Passing checks show that the model satisfies the rules they encode: coverage, technology, and one ownership rule written for this step, no decision in the browser. Whether a server-side owner is the right one is a design judgment that no general rule makes.'
            2: 'The checks do what they claim: each encodes one rule, such as “no decision in the browser”. None claims that a passing model has the right owners; that judgment belongs to the designer and the reviewer.'
            3: 'The browser is the other wrong owner, because the student controls it. The decision belongs in a server-side application.'
          explanation: 'Consistency is not adequacy. A data store has custody of data, not authority over policy; a trigger hides the rule in the schema and can answer a rejected row only with a database error: the problems from step 1. Checks catch only what their rules describe.'
    solution:
      files:
        - path: design.yml
          language: yaml
          content: |
            schema: c4-design/1
            name: Course Registration
            description: Students plan a term schedule and enroll in every section of it, or in none.

            requirements:
              FR-21: A student can enroll in a section only after passing the section's prerequisite courses.
              FR-22: A student can see how many seats are still open in each section of a plan.
              FR-23: If a section fills up while a student is enrolling in a plan, the student keeps no seat from that plan and learns which section was full.
              FR-24: A student can rearrange a draft schedule without waiting for the server.

            people:
              student:
                name: Student
                description: Plans and confirms one term schedule.
                collaborators:
                  web: plans a schedule and enrolls using
              adviser:
                name: Academic Adviser
                description: Reviews students' planned schedules before they enroll.
                collaborators:
                  web: reviews a student's planned schedule using

            systems:
              registration:
                name: Course Registration
                description: Plans term schedules and enrolls students in their sections.
                responsibilities:
                  - decide: whether a student may enroll in a section
                    id: sys-eligibility
                    requirements: [FR-21]
                  - know: how many seats are still open in each section
                    id: sys-open-seats
                    requirements: [FR-22]
                  - do: hold a seat in every section of a plan, or in none
                    id: sys-holds
                    requirements: [FR-23]
                  - know: which section was full when an enrollment attempt fails
                    id: sys-full-section
                    requirements: [FR-23]
                  - do: let a student rearrange a draft schedule without waiting for the server
                    id: sys-drafts
                    requirements: [FR-24]
                containers:
                  web:
                    name: Planner Web App
                    description: Lets students and advisers compare draft schedules, and flags missing prerequisites while a student plans.
                    kind: browser_app
                    technology: TypeScript, React
                    responsibilities:
                      - do: let students and advisers compare draft schedules
                      - do: let a student rearrange a draft schedule in the browser, with no server round trip
                        refines: sys-drafts
                      - do: show a student the API's answer about missing prerequisites while they plan
                    collaborators:
                      api: {description: submits plans to, technology: JSON/HTTPS}
                  api:
                    name: Registration API
                    description: Checks each enrollment attempt and holds the seats it needs.
                    technology: Python, FastAPI
                    responsibilities:
                      - decide: whether a student may enroll in a section
                        id: api-eligibility
                        refines: sys-eligibility
                      - know: how many seats are still open in each section
                        id: api-open-seats
                        refines: sys-open-seats
                      - do: hold a seat in every section of a plan, or in none
                        id: api-holds
                        refines: sys-holds
                      - know: which section was full when an enrollment attempt fails
                        id: api-full-section
                        refines: sys-full-section
                    collaborators:
                      db: {description: reads and writes seat holds in, technology: SQL/TCP}
                      billing:
                        description: requests tuition charges from
                        technology: AMQP
                        connector: message
                  db:
                    name: Registration Database
                    description: Durably stores plans, enrollment attempts, and seat holds.
                    kind: database
                    technology: PostgreSQL 16
                    responsibilities:
                      - do: durably store plans, enrollment attempts, and seat holds
              billing:
                name: Billing System
                description: Charges tuition and fees for the university.
                external: true
      explanation: |
        The Registration API refines the enrollment decision, the all-or-nothing hold, and the knowledge of which section was full: it runs on servers the university controls, and it is the container that attempts the holds. The Planner Web App keeps the rearranging promise, because only code in the browser can answer without the server. The teammate's DECIDE became a DO: the web app may flag a missing prerequisite, but only by showing the API's answer. The database stores; it never decides.

        Python with FastAPI and PostgreSQL 16 are the reference technologies; `TBD` passes as well. Docker would say where a container runs, not what it is built with.

  # Pedagogy: faded worked example (coordinator and billing gateway given; policy and seat gateway stubbed); delegated control style.
  # Subgoal 4 of the chapter's worked example (zoom in: repeat subgoals 1-3 one level down).
  # Objectives: 2 (refinement, one writer), 3 (requests name a responsibility the target has), 1 (components run inside one
  # container and are never deployed alone).
  # Minutes: 12 (spec §11, step 6).
  - title: Inside the Registration API
    key: inside-the-api
    instructions: |
      ### Why this matters

      Inside a container the questions change: which part decides, which part knows, and who asks whom. A coordinator that sequences the work while specialists decide keeps each rule beside the knowledge it needs, but only if every request reaches a part that has the help it asks for.

      ### 🎯 You will learn to

      - Refine container responsibilities into components without moving decisions into the coordinator.
      - Match each collaboration to a responsibility that its target has.

      **Subgoal 4 of 4: Zoom in**, the last step of [the chapter's worked example](/SEBook/architecture/c4#worked-example-requirements-to-components): identify, assign, and connect again, one level down.

      The editor opens on the Registration API's component view. All four components run inside the API's process and ship with it; none is deployed on its own, which is what makes them components of one container. Part of this view is done for you:

      - **Given:** the Registration Coordinator and the Billing Gateway are complete. Each of the coordinator's relationships names the help it requests in a `responsibility:` slot: the id of a responsibility that the target, or one of its children, has. For example:

        ```yaml
        collaborators:
          policy: {description: asks for an eligibility decision from, responsibility: policy-eligibility}
        ```

        The Billing Gateway already has `billing-request`. The Planner Web App now sends plans to the coordinator.
      - **Stubbed:** the Enrollment Policy and the Seat Gateway have a name, a technology, and a stereotype, and nothing else.
      - **Recorded:** the Registration API lists `seat holds` under `owns`, which means no other container writes seat holds.

      1. **Read the worked part:** For each of the coordinator's relationships, read the sentence aloud, then its `responsibility` id. What must the target promise for that request to make sense?
      2. **Complete the stubs:** Give the Enrollment Policy and the Seat Gateway the responsibilities they are asked for, each with the requested `id`, a kind, and the API responsibility it refines. Then add what else each one must know, so that every API responsibility has a component that refines it and each decision maker knows what its decision needs.
      3. **One writer:** Decide which single component writes seat holds, record that in its `owns`, and move the API's relationship to the Registration Database down to that component: select the Registration API, choose **Move to…** beside that relationship under **Relationships in this view** in the inspector, and pick the component under **New source**. The relationship keeps its sentence and technology.
      4. **Check:** Choose **Check now** to fill the Problems panel, then **Test My Work**.

      The checks confirm the structure: that the coordinator stays out of the eligibility decision, which component makes it, which component owns and writes seat holds, that every API responsibility is refined, and that every request names a responsibility its target has; they cannot judge whether your wording matches what each request asks for, whether each decision maker knows what its decision needs, or whether each relationship starts at the component that actually sends it.
    c4:
      view: components of api
      scaffolds:
        definitions: false
        sentenceFrames: false
        inlineLint: false
        carryDown: false
        trace: false
        emptyStateGuide: false
      checks:
        display: on-request
      locked_fields:
        - systems.registration.containers.api.responsibilities
        - systems.registration.containers.api.components.billing-gateway
    files:
      - path: design.yml
        language: yaml
        reseed: true
        content: |
          schema: c4-design/1
          name: Course Registration
