      explanation: |
        The Enrollment Policy has `policy-eligibility`, a DECIDE ("whether a student meets every enrollment rule for a section") that refines `api-eligibility`, and it knows which courses each section requires: private knowledge with no `refines`, which its decision needs. The Seat Gateway has `seats-hold-all`, a DO that refines `api-holds`, and two KNOWs refine the open-seats and full-section knowledge. Every API responsibility now has exactly one component that refines it.

