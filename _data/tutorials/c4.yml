      In words: the Registration Controller sequences each attempt, decides the prerequisite rule itself, knows which courses each section requires, and asks the Seat Gateway and the Billing Gateway for help. A's controller also promises an invariant: *checks every eligibility rule itself before any seat is held*.

      **Design B** is the delegated design from step 6, and it is the model in the editor:

