      In words: the Registration Coordinator sequences each attempt and asks the Enrollment Policy, the Seat Gateway, and the Billing Gateway for help; the Enrollment Policy decides whether a student meets every enrollment rule and knows which courses each section requires. B's coordinator promises: *never decides eligibility or writes seat state*.

      Both designs offer the Planner Web App the same interface, the **Enrollment API**: one operation, `submit-plan` (`POST /v1/enrollments`), which takes a student's plan for one term and returns an outcome for the whole plan. Its description sits under `provides:` on the Registration API in the YAML; the view `interface enrollment-api` shows it as a description card. An interface description says how a client calls an element and how to read its answer ([Interface Descriptions](/SEBook/architecture/c4#interface-descriptions)); for this step you need only the outcome's `status` and `reason`. This team's Enrollment API is smaller than the chapter's: it reports a full section as its own status and leaves out the unit count and the decision time.

      1. **Open the description:** Open the view `interface enrollment-api` and read what its outcome returns, then come back to the component view.
      2. **Predict:** For each design, list the elements whose responsibilities, collaborators, or invariants must change to add the rule, and say whether the Enrollment API must change. Write the list down before you edit anything.
      3. **Implement in B:** Make the change without changing what clients of the Enrollment API see: its description under `provides:` stays exactly as it is. Add the rule to design B as its own DECIDE, in the element your prediction names, refining the API's eligibility decision. Add what that element must know to decide. Leave everything else as it is.
      4. **Check:** Choose **Check now**, then **Test My Work**.
      5. **Compare:** Open the reveal below and compare it with your prediction.

      <details markdown="1">
      <summary>Compare your prediction (step 7)</summary>

      - **Design A:** only the Registration Controller changes, but it is the element that sequences every attempt and sends every request. It gains a DECIDE for the cap and a KNOW of each major's cap, and its invariant keeps its words while covering one more rule: every new rule grows the hub.
      - **Design B:** only the Enrollment Policy changes, with one more DECIDE that refines the API's eligibility decision and the caps it must know. The coordinator, both gateways, and every relationship stay as they were.
      - **The difference** is not how many elements change, one in each design, but which one: in A, the element every attempt passes through; in B, the element whose only job is eligibility.
      - **The Enrollment API** changes in neither design. A plan over the cap is one more refusal: the outcome's `status` is `refused`, and its free-text `reason` already says why, so the Planner Web App shows the new refusal without any change. That free text is the room for change the interface left. A new optional output field would also be a compatible extension, although every client team would read a new description. Reason codes in a new version would let clients react to each cause in code, at the cost of a change in every client: interoperability bought with changeability.

      </details>

      The checks confirm where the new decision lives and that the coordinator and the Enrollment API are unchanged since the step began; they cannot judge your prediction for design A, whether the policy knows what the new rule needs, or whether a cap per major is the rule the registrar actually wants. The interface check counts any edit to the description as a change, so it cannot tell a compatible extension from one that breaks clients.
