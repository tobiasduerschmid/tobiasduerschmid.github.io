  # Pedagogy: PRIMM — Predict what the checker reports for a teammate's draft and whether a reply is reported (a trap), Run the draft
  # with Check now, Modify (repair the routing inside the alt branch), then explain the routing.
  # Reasoning check: one written prompt with a gated comparison. Objectives: 3 (scenario steps follow relationships), 6.
  # Tests 3 and 4 and three hint conditions use the spec §8 scenario-step query (`step:`).
  # Minutes: 8 (spec §11, step 8).
  - title: A Failed Seat Hold
    key: failed-seat-hold
    instructions: |
      ### Why this matters

      A static view says who can talk to whom; a dynamic view says what happens, in order, in one scenario. Checking that each step follows a relationship in the model catches stories that need a collaboration nobody designed.

      ### 🎯 You will learn to

      - Model a failure branch in a dynamic view with an `alt` fragment.
      - Predict which scenario steps the checker accepts, and route a report through the element that owns the conversation.

      The editor opens on the dynamic view of `enroll`, the happy path of an enrollment (a dynamic view shows one scenario step by step; see [the chapter's Dynamic View](/SEBook/architecture/c4#dynamic-view)). FR-23's failure case is missing: a section fills up during the attempt, the Seat Gateway holds no seat, no tuition is requested, and the student learns which section was full. A teammate drafted the branch to replace the last step of `enroll`:

      ```yaml
      - alt:
          - when: every seat is held
            steps:
              - coordinator -> billing-gateway: asks for tuition charges through
          - when: a section is full
            steps:
              - seats -> web: reports which section was full to
      ```

      1. **Predict:** Write down your answers to both parts.
         - (i) Which step of the draft will `xlevel/scenario-step` report, and which relationship will it say is missing?
         - (ii) Suppose the failure branch began instead with `seats -> coordinator: reports which section was full to`. Would the checker report that step? (a) Yes: no relationship runs from the Seat Gateway to the coordinator. (b) No: it travels back along the coordinator's earlier request to the Seat Gateway. (c) No: steps inside a fragment are never checked.
      2. **Run:** Choose **YAML** in the Visual / YAML switch, replace the last step of `enroll` with the teammate's draft, and choose **Check now**. Compare the report with your answer to (i).
      3. **Repair:** Change the failure branch so that the student learns which section was full and every step runs along a relationship the model already has, or answers a request made earlier in the scenario. Try the step from (ii) first and choose **Check now** again, then finish the route to the Planner Web App.
      4. **Check:** Choose **Test My Work**.
      5. **Write it down:** In two sentences: why should the report reach the Planner Web App through the coordinator, and why would declaring the missing relationship make the check pass but the design worse?

      <details markdown="1">
      <summary>Compare your predictions and explanation (step 8)</summary>

      - **(i)** The checker reports `seats -> web`: no relationship joins the Seat Gateway and the Planner Web App, and the web app never sent the gateway a request, so the step is not a reply either.
      - **(ii)** (b). The coordinator asked the Seat Gateway to reserve seats earlier in the scenario, along a call, so a step back from the gateway to the coordinator is a reply. A reply needs no relationship of its own, even inside a branch that starts after the request.
      - **Explanation:** The coordinator received the plan from the Planner Web App, so it owns that conversation, and the report is its reply. Declaring a relationship from the Seat Gateway to the Planner Web App would silence the check, but it would give a component whose job is the database a second job talking to the browser, and the browser would have to accept calls it never asked for.

      </details>

      The checks confirm that each step follows a relationship or answers an earlier request, that the happy path keeps its participants, that a branch reports the failure to the Planner Web App without a new relationship, and that tuition is requested only inside a branch; they cannot see which branch each step sits in, whether your conditions cover every case, or whether each step's wording says what the student needs.
