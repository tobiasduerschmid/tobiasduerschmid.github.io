  - title: Change Impact Across Control Styles
    key: change-impact
    instructions: |
      ### Why this matters

      Designs are judged by how they absorb change. Predicting which elements a new rule touches, before you edit anything, shows whether a design keeps each decision in one place or piles every change onto a hub.

      ### 🎯 You will learn to

      - Predict which elements' responsibilities, collaborators, invariants, and interfaces a change touches under two control styles.
      - Implement the change in the delegated design without disturbing its coordinator.

      The new rule is **unit caps per major**: each major sets the most units its students may take in a term, such as 21 for engineering and 19 for every other major. In this team's version of Course Registration, the Enrollment Policy checks prerequisites only; the chapter's version also checked a unit cap. Here are two designs of the Registration API with the same container responsibilities.

      **Design A** keeps the decisions in a central controller:

      ```c4
