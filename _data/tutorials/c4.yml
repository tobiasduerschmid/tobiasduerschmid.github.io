# Interactive C4 model tutorial (spec docs/superpowers/specs/2026-11-08-c4-model-design.md §11; plan 2026-11-08-c4-tutorial.md).
# Grading is structural (spec §8): predicates read element types, ids, refines links, owners, relationships, views, and rule
# results; hint conditions are structural predicates too.
# Expected results for every seed, solution, alternative, and wrong model: scripts/tests/fixtures/c4-tutorial/c4/expectations.md.
# Step 8 uses the spec §8 scenario-step query (`step:`); step 7 guards the Enrollment API with `same_as_seed: {interface: …}` (§8, §11).
# Hint ladders: each test keeps one unconditional orientation hint; diagnosis and scaffold hints carry conditions that only a
# partial attempt reaches, because the runtime shows every applicable hint of a failed test at once.
title: 'The C4 Model in Practice'
description: 'Predict, investigate, repair, and extend a course-registration design in the C4 editor, giving every responsibility one owner at each level, then transfer the method to a new domain. For readers of the C4 model chapter; no modeling-tool experience is needed. Allow about 90 minutes, with an optional break after step 5.'
learning_objectives:
  - Distinguish person, software system, container, component, and code, and classify real artifacts, such as a single-page application, a database schema, a library, or a serverless function, at the right level.
  - Write KNOW, DO, and DECIDE responsibilities with one owner for each KNOW and DECIDE, and refine them across levels.
  - Write relationships as sentences with direction, intent, and technology where it matters.
  - Choose the views and levels a named audience needs for its question, and justify the levels left out.
  - Critique a view against the C4 review checklist and Responsibility-Driven Design heuristics, and repair it.
  - Explain what automated consistency checks can and cannot establish.
backend: c4
require_tests: true
progress_version: 1
autosave_type: files
reset_type: files
c4:
  file: design.yml
  profile: novice
  # Credit for consistency comes only from checks: tests (spec §8), so a checks.ignore entry in design.yml must not
  # silence a graded rule. No step teaches justified suppression.
  checks:
    honorFileIgnores: false
steps:
  # Pedagogy: PRIMM — Predict. Quiz-only pretest (generation before instruction); step 2 confirms the prediction in the model.
  # Objectives: 2 (one owner per DECIDE), 1 (what sits inside a system box).
  # Minutes: 5 (spec §11, step 1).
  - title: The Owner of a Decision
    key: owner-of-a-decision
    instructions: |
      ### Why this matters

      A rule enforced in the wrong place can be skipped, duplicated, or forgotten the next time it changes. Choosing one owner for each decision before you draw a box's insides keeps every rule where you can find it and protect it.

      ### 🎯 You will learn to

      - Evaluate candidate owners for a DECIDE responsibility.
      - Explain what goes wrong when a decision lives in the browser or in the database.

      Course Registration lets students plan a term schedule and enroll in its sections. Here is its system context view, the zoom level at which the whole system is one box:

      ```c4
      # caption: System context view of Course Registration. Its two responsibilities fill the system box; which part inside the box should own the enrollment decision is not visible at this level.
      view: context of registration
      name: Course Registration
      description: Students plan a term schedule and enroll in every section of it, or in none.
      people:
        student:
          name: Student
          description: Plans and confirms one term schedule.
          collaborators:
            registration: plans a schedule and enrolls using
      systems:
        registration:
          name: Course Registration
          responsibilities:
            - decide: whether a student may enroll in a section
            - do: hold a seat in every section of a plan, or in none
          collaborators:
            billing: requests tuition charges from
        billing:
          name: Billing System
          description: Charges tuition and fees for the university.
          external: true
      ```

      In words: the Student plans a schedule and enrolls using Course Registration, which requests tuition charges from the Billing System, an external system. Course Registration's box lists its two responsibilities.

      The box promises to DECIDE whether a student may enroll in a section; today, that means checking that the student has passed the section's prerequisites. Zoom in, and three places could make that check:

      - **The web form** in the student's browser, before the plan is sent.
      - **The Registration API** on university servers, which receives every enrollment attempt.
      - **A trigger in the Registration Database**, which rejects an enrollment row when a prerequisite is missing.

      1. **Predict:** Which one should own the decision? For each of the other two, write one sentence about what goes wrong. Commit in writing before you continue.
      2. **Check:** Choose **Next** to open the knowledge check. In step 2 you open the full model and confirm your answer inside it.

      The editor already holds this context model, read-only, so you can look around without changing it. This step has no model checks: the knowledge check can confirm your choice of owner, but it cannot read the reasons you wrote down, so compare them with its feedback.
    c4:
      view: context of registration
      read_only: true
      scaffolds:
        definitions: false
        sentenceFrames: false
        inlineLint: false
        carryDown: false
        trace: false
        emptyStateGuide: false
    files:
      - path: design.yml
        language: yaml
        reseed: true
        content: |
          schema: c4-design/1
          name: Course Registration
          description: Students plan a term schedule and enroll in every section of it, or in none.

          people:
            student:
              name: Student
              description: Plans and confirms one term schedule.
              collaborators:
                registration: plans a schedule and enrolls using

          systems:
            registration:
              name: Course Registration
              responsibilities:
                - decide: whether a student may enroll in a section
                - do: hold a seat in every section of a plan, or in none
              collaborators:
                billing: requests tuition charges from
            billing:
              name: Billing System
              description: Charges tuition and fees for the university.
              external: true
    quiz:
      title: 'Step 1 — Knowledge Check'
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          # objective: 2 (one owner per DECIDE); spec §11 step 1 asks for the owner and what goes wrong with the other two.
          question: 'In Course Registration, three places could check whether a student has passed a section’s prerequisites: the web form in the browser, the server-side Registration API, or a trigger in the Registration Database. Which owner, with which reasoning, holds up?'
          options:
            - 'The API: a browser check can be skipped by the student, and a trigger hides the rule where few developers look.'
            - 'The web form: it catches the problem first, so the API and the trigger would only repeat its answer later.'
            - 'The trigger: it is the last step before data is written, so checks in the form or the API can be bypassed.'
            - 'All three: each layer catches what the others miss, so no single change to the rule can break enrollment.'
          correct_index: 0
          option_feedback:
            1: 'Catching a problem early helps the student, but the browser runs on the student’s computer, so a check there can be skipped or edited. The form can still warn early by showing the API’s answer.'
            2: 'Enrollment requests reach the database only through the API, so the API is not bypassed. A trigger mixes policy into storage: the database has custody of enrollments, not authority over who may enroll, and a rejected row explains nothing to the student.'
            3: 'Three copies of one rule drift apart the first time the rule changes, and then nobody can say which copy is right. One element decides; the others can show or store its answer.'
          explanation: 'A DECIDE responsibility needs one owner that runs where the rule can be protected and changed in one place. The Registration API runs on university servers, receives every enrollment attempt, and can send the reason for a refusal back to the web form, which shows it without deciding.'
    solution:
      files:
        - path: design.yml
          language: yaml
          content: |
            schema: c4-design/1
            name: Course Registration
            description: Students plan a term schedule and enroll in every section of it, or in none.

            people:
              student:
                name: Student
                description: Plans and confirms one term schedule.
                collaborators:
                  registration: plans a schedule and enrolls using

            systems:
              registration:
                name: Course Registration
                responsibilities:
                  - decide: whether a student may enroll in a section
                  - do: hold a seat in every section of a plan, or in none
                collaborators:
                  billing: requests tuition charges from
              billing:
                name: Billing System
                description: Charges tuition and fees for the university.
                external: true
      explanation: |
        The **Registration API** should own the enrollment decision, prerequisite check included. A check in the browser runs on the student's computer and can be skipped or edited. A database trigger hides a policy inside the schema, where few developers look for one, mixes authority over enrollment into a store that only has custody of it, and can answer a rejected row with nothing more than a database error. The web form can still show the API's answer, and the database still stores enrollments: showing and storing are not deciding.

  # Pedagogy: PRIMM — Run/Investigate with reveal on request (commit, then look), then a small Modify (point a saved view at the
  # level a reviewer needs; the view entry is seeded so the decision, not YAML block authoring, is the task).
  # Reasoning check: one written prompt with a gated comparison. Objectives: 4 (choose the view for a question), 2 (refinement chain).
  # Minutes: 8 (spec §11, step 2).
  - title: Zooming In to Confirm
    key: zooming-in
    instructions: |
      ### Why this matters

      A C4 model answers different questions at different zoom levels. Knowing which level settles a question, and how to follow a responsibility down through the levels, is what lets a reviewer check a design instead of trusting it.

      ### 🎯 You will learn to

      - Navigate a model from the system context down to components.
      - Choose the view that answers a reviewer's question, and save it.

      The editor holds the registration team's current design. It opens on the context view with the inside hidden, so your step 1 prediction stays honest until you look.

      1. **Recall:** Before you reveal anything, write down which container, and which part inside it, you expect to own the enrollment decision.
      2. **Zoom in:** Choose **Show inside**, then zoom into Course Registration and into the container you predicted: choose a box's zoom badge, or press <kbd>Enter</kbd> on a focused box. (A double-click edits the text you point at instead.) To zoom out, choose a breadcrumb or, with focus in the canvas, press <kbd>Alt+↑</kbd> (<kbd>Option+↑</kbd> on a Mac). At each level, find the DECIDE about enrollment and the element that carries it. Selecting a responsibility highlights its refinements above and below, and the inspector lists them under **Refines** and **Refined by**.
      3. **Point the saved view:** A reviewer will ask, "Which part of the system decides whether a student may enroll?" The file already has a saved view named `who-decides`, which still shows the context view. Choose **YAML** in the Visual / YAML switch above the editor, find `who-decides` at the end of the file, and change two lines: its `view:` selector, to the built-in view that answers the question, and its `description:`, to who reads the view and which question it answers. A built-in selector names a level, the word `of`, and an element's id, as `context of registration` does. Choose **Visual** to see the view again.
      4. **Check:** Choose **Test My Work**, or press <kbd><abbr data-platform-modifier title="Control" data-no-tooltip="true">Ctrl</abbr>+Enter</kbd> in the canvas.
      5. **Write it down:** In two or three sentences: how does the model let a reviewer follow the decision from Course Registration down to its owner, and why can the container view alone not settle who decides?

      <details markdown="1">
      <summary>Compare your explanation (step 2)</summary>

      Each level's decision has an id, and the level below `refines` it: the Registration API's DECIDE refines the system's, and the Enrollment Policy's DECIDE refines the API's. The container view draws the whole API as one box, so it shows only that the API decides. The component view shows that the Enrollment Policy makes the decision and knows the course requirements it needs, and that the Registration Coordinator only asks for it.

      </details>

      The check confirms only that your saved view shows the component that decides; it cannot judge your explanation, or whether your view's description names a real reader and question.
    c4:
      view: context of registration
      reveal: on-request
      scaffolds:
        definitions: true
        sentenceFrames: true
        inlineLint: true
        carryDown: true
        trace: true
        emptyStateGuide: true
    files:
      - path: design.yml
        language: yaml
        reseed: true
        content: |
          schema: c4-design/1
          name: Course Registration
          description: Students plan a term schedule and enroll in every section of it, or in none.
          status: proposed
          enterprise: University of California, Los Angeles

          requirements:
            FR-07: A student who lacks a prerequisite is refused before any seat is held, and is told why.
            FR-09: A student is enrolled in every section of a plan, or in none.

          people:
            student:
              name: Student
              description: Plans and confirms one term schedule.
              collaborators:
                web: plans a schedule and enrolls using

          systems:
            registration:
              name: Course Registration
              description: Plans term schedules and enrolls students in their sections.
              responsibilities:
                - decide: whether a student may enroll in a section
                  id: sys-eligibility
                  requirements: [FR-07]
                - do: hold a seat in every section of a plan, or in none
                  id: sys-holds
                  requirements: [FR-09]
              containers:
                web:
                  name: Planner Web App
                  description: Lets students compare draft schedules in the browser.
                  kind: browser_app
                  technology: TypeScript, React
                  responsibilities:
                    - do: let students compare draft schedules
                  collaborators:
                    coordinator: {description: submits plans to, technology: JSON/HTTPS}
                api:
                  name: Registration API
                  description: Decides eligibility and enrolls students atomically.
                  technology: Python, FastAPI
                  responsibilities:
                    - decide: whether a student may enroll in a section
                      id: api-eligibility
                      refines: sys-eligibility
                    - do: hold a seat in every section of a plan, or in none
                      id: api-holds
                      refines: sys-holds
                  components:
                    coordinator:
                      name: Registration Coordinator
                      technology: Python module
                      stereotypes: [coordinator]
                      responsibilities:
                        - do: sequence one enrollment attempt
                        - decide: which step of the attempt runs next
                      collaborators:
                        policy: asks for an eligibility decision from
                        seats: reserves all seats or none through
                        billing-gateway: asks for tuition charges through
                      invariants: [never decides eligibility or writes seat state]
                    policy:
                      name: Enrollment Policy
                      technology: Python module
                      stereotypes: [service_provider]
                      responsibilities:
                        - decide: whether a student meets every enrollment rule for a section
                          refines: api-eligibility
                        - know: which courses each section requires
                    seats:
                      name: Seat Gateway
                      technology: Python module
                      stereotypes: [interfacer]
                      responsibilities:
                        - know: which seats are held for each attempt
                        - do: hold every requested seat atomically, or none
                          refines: api-holds
                      collaborators:
                        db: {description: reads and writes seat holds in, technology: SQL/TCP}
                      owns: [seat holds]
                    billing-gateway:
                      name: Billing Gateway
                      technology: Python module
                      stereotypes: [interfacer]
                      responsibilities:
                        - do: request tuition charges for a completed enrollment
                      collaborators:
                        billing:
                          description: requests tuition charges from
                          technology: AMQP
                          connector: message
                db:
                  name: Registration Database
                  description: Durably stores plans, enrollment attempts, and seat holds.
                  kind: database
                  technology: PostgreSQL 16
                  responsibilities:
                    - do: durably store plans, enrollment attempts, and seat holds
            billing:
              name: Billing System
              description: Charges tuition and fees for the university.
              external: true

          views:
            who-decides:
              view: context of registration
              description: '<who reads this view, and which question it answers>'
    tests:
      - description: The saved view who-decides shows the component that decides enrollment
        c4:
          view:
            view: who-decides
            shows: [policy]
        hints:
          - title: The Level That Answers the Question
            text: 'Zoom in until the element that decides appears as its own box. The level where you found it is the level `who-decides` should show.'
          # Found by name, not id: an id that no longer resolves makes a condition fail, not hold (wrong-3).
          - title: The Policy Is Gone
            condition:
              c4:
                absent:
                  element: {type: component, name_any: [policy]}
            text: 'The Enrollment Policy is no longer in the model, so no view can show it. Undo the deletion, or reset the step, before you choose the view.'
          - title: A View That Stops Too Early
            condition:
              c4:
                view:
                  view: who-decides
                  shows: [api]
                  hides: [{type: component}]
            text: 'Your saved view draws the Registration API as a single box, so it can say only that the API decides. Which view’s boxes include the Enrollment Policy?'
          - title: Level and Scope Together
            condition:
              c4:
                view:
                  view: who-decides
                  shows: [api]
                  hides: [{type: component}]
            text: 'Zooming in changes both parts of a selector: the level word and the element after `of`. Which level lists the parts inside one container, and in which container did you find the part that decides?'
    solution:
      files:
        - path: design.yml
          language: yaml
          content: |
            schema: c4-design/1
            name: Course Registration
            description: Students plan a term schedule and enroll in every section of it, or in none.
            status: proposed
            enterprise: University of California, Los Angeles

            requirements:
              FR-07: A student who lacks a prerequisite is refused before any seat is held, and is told why.
              FR-09: A student is enrolled in every section of a plan, or in none.

            people:
              student:
                name: Student
                description: Plans and confirms one term schedule.
                collaborators:
                  web: plans a schedule and enrolls using

            systems:
              registration:
                name: Course Registration
                description: Plans term schedules and enrolls students in their sections.
                responsibilities:
                  - decide: whether a student may enroll in a section
                    id: sys-eligibility
                    requirements: [FR-07]
                  - do: hold a seat in every section of a plan, or in none
                    id: sys-holds
                    requirements: [FR-09]
                containers:
                  web:
                    name: Planner Web App
                    description: Lets students compare draft schedules in the browser.
                    kind: browser_app
                    technology: TypeScript, React
                    responsibilities:
                      - do: let students compare draft schedules
                    collaborators:
                      coordinator: {description: submits plans to, technology: JSON/HTTPS}
                  api:
                    name: Registration API
                    description: Decides eligibility and enrolls students atomically.
                    technology: Python, FastAPI
                    responsibilities:
                      - decide: whether a student may enroll in a section
                        id: api-eligibility
                        refines: sys-eligibility
                      - do: hold a seat in every section of a plan, or in none
                        id: api-holds
                        refines: sys-holds
                    components:
                      coordinator:
                        name: Registration Coordinator
                        technology: Python module
                        stereotypes: [coordinator]
                        responsibilities:
                          - do: sequence one enrollment attempt
                          - decide: which step of the attempt runs next
                        collaborators:
                          policy: asks for an eligibility decision from
                          seats: reserves all seats or none through
                          billing-gateway: asks for tuition charges through
                        invariants: [never decides eligibility or writes seat state]
                      policy:
                        name: Enrollment Policy
                        technology: Python module
                        stereotypes: [service_provider]
                        responsibilities:
                          - decide: whether a student meets every enrollment rule for a section
                            refines: api-eligibility
                          - know: which courses each section requires
                      seats:
                        name: Seat Gateway
                        technology: Python module
                        stereotypes: [interfacer]
                        responsibilities:
                          - know: which seats are held for each attempt
                          - do: hold every requested seat atomically, or none
                            refines: api-holds
                        collaborators:
                          db: {description: reads and writes seat holds in, technology: SQL/TCP}
                        owns: [seat holds]
                      billing-gateway:
                        name: Billing Gateway
                        technology: Python module
                        stereotypes: [interfacer]
                        responsibilities:
                          - do: request tuition charges for a completed enrollment
                        collaborators:
                          billing:
                            description: requests tuition charges from
                            technology: AMQP
                            connector: message
                  db:
                    name: Registration Database
                    description: Durably stores plans, enrollment attempts, and seat holds.
                    kind: database
                    technology: PostgreSQL 16
                    responsibilities:
                      - do: durably store plans, enrollment attempts, and seat holds
              billing:
                name: Billing System
                description: Charges tuition and fees for the university.
                external: true

            views:
              who-decides:
                view: components of api
                description: For design reviewers, shows which part of the Registration API decides whether a student may enroll, and which part asks for that decision.
      explanation: |
        `components of api` is the built-in view that shows the Enrollment Policy as its own box; the custom view `who-decides` saves it with a description of its reader and question. The context view hides everything inside Course Registration, and the container view draws the Registration API as one box.

        Follow the chain with the trace: the system's `sys-eligibility` is refined by the API's `api-eligibility`, which the Enrollment Policy's DECIDE refines. The policy also knows which courses each section requires, which its decision needs. The Registration Coordinator decides only which step runs next; it asks the policy for the eligibility decision. That is your step 1 answer, one level deeper.

  # Pedagogy: mistake-based familiarization (find, then fix) against the review checklist; kept parts must survive the repair.
  # The Find task uses live lint honestly: two problems are flagged, two are not (retrieval of the chapter's "What Checks Can and
  # Cannot Establish"). The flaw kinds are spec §11's; the instances differ from the chapter's find-the-flaw figures.
  # Objectives: 5 (critique and repair), 1 (data store is a container, not a system), 3 (labeled relationship), 6.
  # Minutes: 10 (spec §11, step 3).
  - title: Context View Repair
    key: context-repair
    instructions: |
      ### Why this matters

      The context view is the one diagram everyone reads, so its mistakes travel furthest: a wrong box invites someone to build an integration nobody needs, and an unlabeled arrow hides what one team expects from another.

      ### 🎯 You will learn to

      - Critique a context view against the review checklist.
      - Repair a model while keeping the parts that were right.

      A new teammate redrew Course Registration from memory before a design review. Two facts they had:

      - The registration team builds and runs everything in this model except the Billing System.
      - The team has a new requirement, **FR-12:** *An academic adviser can review a student's planned schedule before the student enrolls.*

      The editor opens on the context view. The model behind it has four problems: one about what kind of element something is, one about an arrow, one about a name, and one about who is missing. Three questions from [the review checklist in the C4 model chapter](/SEBook/architecture/c4#review-checklist) (your work here is saved) will find them: Does every box have a specific name, and a type that matches who builds and runs it? Does every arrow read as a sentence that says what is asked? Does every role in the requirements appear?

      1. **Find:** Read the context view, then zoom into Course Registration. The Problems panel flags two of the four problems. Before you look at it, find the two that no rule can flag; then compare with the panel. Name all four before you change anything.
      2. **Repair:** Fix each problem in the model. Keep what was right: the student, the Planner Web App, the Billing System, the stored data, and what each existing element is responsible for. Editor moves for this step:
         - **Add a person:** drag the palette's Person tile onto the canvas, choose the tile, or press <kbd>A</kbd> in the canvas for the Add menu.
         - **Add a relationship:** drag from a box's connect handle onto its target, or choose **Add relationship** (<kbd>C</kbd>) and pick the target; then write the sentence.
         - **Rename:** press <kbd>F2</kbd> on the selected box, choose its name, or edit the **Name** field in the inspector. The editor keeps the id, and the checks use ids.
         - **Change a container's kind:** the **Kind** field in the inspector.
         - **Delete:** press <kbd>Delete</kbd> on the selected box, or use the inspector's **Delete** button; the confirmation lists every reference it removes.
      3. **Check:** Choose **Test My Work**. Each check covers one repair, or one part that has to survive the repairs.

      The checks see element types, connections, ids, and the rules they run. They cannot judge whether a new name says what its container does, or whether your relationship sentences are true, so read each one aloud. And no rule flags a data store drawn as its own software system: only the facts about who builds and runs it reveal that, which is why the check for it is written for this model.
    c4:
      view: context of registration
      scaffolds:
        definitions: false
        sentenceFrames: true
        inlineLint: true
        carryDown: false
        trace: false
        emptyStateGuide: false
      checks:
        display: live
        severity:
          c4/generic-name: warning
    files:
      - path: design.yml
        language: yaml
        reseed: true
        content: |
          schema: c4-design/1
          name: Course Registration
          description: Students plan a term schedule and enroll in every section of it, or in none.

          requirements:
            FR-12: An academic adviser can review a student's planned schedule before the student enrolls.

          people:
            student:
              name: Student
              description: Plans and confirms one term schedule.
              collaborators:
                web: plans a schedule and enrolls using

          systems:
            registration:
              name: Course Registration
              description: Plans term schedules and enrolls students in their sections.
              responsibilities:
                - decide: whether a student may enroll in a section
                  id: sys-eligibility
                - do: hold a seat in every section of a plan, or in none
                  id: sys-holds
              containers:
                web:
                  name: Planner Web App
                  description: Lets students compare draft schedules in the browser.
                  kind: browser_app
                  technology: TypeScript, React
                  responsibilities:
                    - do: let students compare draft schedules
                  collaborators:
                    backend: {description: submits plans to, technology: JSON/HTTPS}
                backend:
                  name: Backend
                  description: Checks each enrollment attempt and holds the seats it needs.
                  technology: Python, FastAPI
                  responsibilities:
                    - decide: whether a student may enroll in a section
                      refines: sys-eligibility
                    - do: hold a seat in every section of a plan, or in none
                      refines: sys-holds
                  collaborators:
                    records: {description: reads and writes attempts and seat holds in, technology: SQL/TCP}
                    billing: {technology: AMQP, connector: message}
            records:
              name: Enrollment Records
              description: Keeps each submitted plan, the seats it held, and how the attempt ended.
              responsibilities:
                - do: durably keep every plan, seat hold, and attempt outcome
            billing:
              name: Billing System
              description: Charges tuition and fees for the university.
              external: true
    tests:
      # name_any synonym set (documented, spec §8): adviser, advisor, counselor, counsellor.
      - description: 'People: every role in the requirements appears in the context view'
        c4:
          view:
            view: context of registration
            shows:
              - {type: person, name_any: [adviser, advisor, counselor, counsellor]}
        hints:
          - title: The Role in FR-12
            text: 'Read FR-12 again. Which role does it name, and is that role drawn as a person anywhere in the model?'
          - title: Name and Connection
            condition:
              c4:
                count: {element: {type: person}}
                at_least: 2
            text: 'A role counts as drawn on the context view when a person carries the role’s name and has a relationship to Course Registration or to something inside it. Which of the two does your new person still lack?'
          - title: The Name Readers Expect
            condition:
              c4:
                count: {relationship: {from: {type: person}, derived: exclude}}
                at_least: 2
            text: 'Your second person has a relationship. If it reaches Course Registration or something inside it, readers still find the role by its name: name the person after the role FR-12 uses, and put the goal in the description. If it reaches only another system, the person stays off this view.'
      - description: 'People: each role has a person of its own'
        c4:
          absent:
            element: {id: student, name_any: [adviser, advisor, counselor, counsellor]}
        hints:
          - title: One Box per Role
            text: 'A person box stands for one role with one goal. Read the student’s name: does it still stand for one role?'
          - title: Two Goals, Two People
            condition:
              c4:
                count: {element: {type: person}}
                at_most: 1
            text: 'The student’s name now covers the adviser’s role too. A student plans and enrolls; an adviser reviews someone else’s plan. Two goals need two people, each with a relationship of their own.'
          - title: Give the Student Back Its Name
            condition:
              c4:
                count: {element: {type: person}}
                at_least: 2
            text: 'Another person exists, but the student’s name still names the adviser’s role. Rename the student so the name fits one role, and give the adviser’s role to a person of its own, named after the role FR-12 uses.'
      - description: 'Relationships: every relationship says what it asks for'
        c4:
          checks:
            max_warnings: 0
            rules: [rdd/no-reason, c4/vague-relationship]
        hints:
          - title: Read Every Arrow Aloud
            text: 'Read each arrow in the context and container views aloud, starting with the element that asks. Which one does not make a sentence?'
          - title: An Arrow With No Words
            condition:
              c4:
                checks:
                  max_warnings: 0
                  rules: [c4/vague-relationship]
            text: 'One relationship has no description at all. Read it from the element that asks: what does that element request from its target?'
          - title: Words That Fit Any Arrow
            condition:
              c4:
                checks:
                  max_warnings: 0
                  rules: [rdd/no-reason]
            text: 'A description of one or two words, or a generic verb such as “uses” or “calls”, would fit any arrow in the diagram. Say what is requested, so the label reads as a sentence about this pair only.'
      - description: 'Kept parts: Course Registration still sends requests to the Billing System'
        c4:
          exists:
            relationship: {from: registration, to: billing}
        hints:
          - title: Keep What Was Right
            text: 'The relationship to the Billing System lacked words, not a reason to exist. Is there still a relationship from Course Registration, or from something inside it, to the Billing System?'
          - title: Restore the Request
            condition:
              c4:
                absent:
                  relationship: {to: billing}
            text: 'Nothing sends anything to the Billing System any more. Add the relationship back on the container that requests charges, with the technology and message connector it had at the start of the step, and describe it from the sender’s side.'
          - title: From the Right Sender
            condition:
              c4:
                exists:
                  relationship: {to: billing}
            text: 'Something reaches the Billing System, but not from Course Registration or anything inside it. Which container requests tuition charges?'
      - description: 'Names: no element has a generic name'
        c4:
          checks:
            max_warnings: 0
            rules: [c4/generic-name]
        hints:
          - title: Names That Fit Any System
            text: 'Which box’s name would fit almost any server in any company? A reader learns nothing about this system from it.'
          - title: Name It After Its Job
            condition:
              c4:
                checks:
                  max_warnings: 0
                  rules: [rdd/no-reason, c4/vague-relationship]
            text: 'Read the generically named box’s responsibilities aloud: they describe one job. A good name says that job in two or three words, the way “Planner Web App” says what the web app is for.'
          - title: Change the Name, Keep the Id
            condition:
              c4:
                count: {element: {type: person}}
                at_least: 2
            text: 'Rename the box in place, so its id stays; then let its one-sentence description say what the container does, and check that the name still fits that sentence.'
      - description: 'Element types: each box’s type matches who builds and runs it'
        c4:
          count: {element: {type: system}}
          equals: 2
        hints:
          - title: Who Builds It?
            text: 'Compare each box on the context view with the two facts in the brief. Which box’s type claims an owner that it does not have?'
          # c4/isolated-element keeps this quiet once the learner adds the database container: until its relationship
          # is moved, the new container is isolated; after that, the old box is ("Now Remove the Old Box" takes over).
          - title: One Level Down
            condition:
              c4:
                checks:
                  max_warnings: 0
                  rules: [c4/generic-name, rdd/no-reason, c4/isolated-element]
            text: 'Both problems the Problems panel flagged are fixed, and this one remains. A data store that this team runs only for Course Registration is part of that system: it belongs inside Course Registration, as one of its containers, and the old box goes.'
          - title: External Means Another Owner
            condition:
              c4:
                count: {element: {type: system, external: true}}
                at_least: 2
            text: 'Marking a box external says another team owns it, which is true of nothing here except the Billing System. A data store this team runs only for Course Registration is part of that system.'
          - title: Now Remove the Old Box
            condition:
              c4:
                exists:
                  element: {type: container, kind: database, in: registration}
            text: 'The data store now exists inside Course Registration. If a relationship still uses the old box, point it at the new container; then delete the old box, so the data has one home.'
      - description: 'Kept parts: the stored data survives your repairs'
        c4:
          exists:
            element: {type: container, kind: database, in: registration}
        hints:
          - title: Keep the Data
            text: 'This check protects data that the model keeps. Which element keeps data, and does your repaired model still have it, inside the system it belongs to?'
          - title: Shape and Type Text
            condition:
              c4:
                count: {element: {type: container, in: registration}}
                at_least: 3
            text: 'A new container exists inside Course Registration, but nothing marks it as a data store yet. Its kind sets both its shape and its type text.'
          - title: Inside the Right System
            condition:
              c4:
                exists:
                  element: {type: container, kind: database}
            text: 'A data store exists, but inside another system. It belongs to the system whose team runs it for its own use.'
      - description: 'Kept parts: the student, the Planner Web App, and the Billing System still appear in the container view'
        c4:
          view:
            view: containers of registration
            shows: [student, web, billing]
        hints:
          - title: Something Right Went Missing
            text: 'A repair removed or disconnected a part that was right. Look for the student, the Planner Web App, and the Billing System in the container view.'
          - title: The Billing System Dropped Out
            condition:
              c4:
                view:
                  view: containers of registration
                  hides: [billing]
            text: 'The Billing System still exists, but no container of Course Registration has a relationship to it, so the container view leaves it out. Which container requests tuition charges?'
          - title: The Student Dropped Out
            condition:
              c4:
                view:
                  view: containers of registration
                  hides: [student]
            text: 'The student still exists but no longer appears, so the student’s relationship to a container is gone. Which container does a student plan with?'
    quiz:
      title: 'Step 3 — Knowledge Check'
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          # objective: 1 (system versus container; a Docker container is not a C4 container)
          question: 'In a C4 model of Course Registration, which of these belongs on the system context view as a separate software system?'
          options:
            - 'The university’s single sign-on service, which central IT runs for every campus system'
            - 'A Redis cache of open-seat counts that the registration team runs for its API'
            - 'The registration team’s job queue, which hands enrollment attempts to a worker'
            - 'A replica of the Registration Database, running in a second Docker container'
          correct_index: 0
          option_feedback:
            1: 'The registration team runs the cache for Course Registration alone, so it is part of that system: a data-store container, one zoom level down.'
            2: 'A queue that the team runs between its own applications is a container of Course Registration, of the queue kind, not a system with an owner of its own.'
            3: 'A Docker container is one way to package and run a C4 container, not a C4 container itself. The replica is a second running instance of the one Registration Database, and instances belong in a deployment view.'
          explanation: 'A separate software system has an owner of its own. Central IT builds and runs single sign-on for many systems, so Course Registration uses it from outside. The cache, the queue, and the database replica are all run by the registration team for Course Registration: containers of it, or a running instance of one.'
    solution:
      files:
        - path: design.yml
          language: yaml
          content: |
            schema: c4-design/1
            name: Course Registration
            description: Students plan a term schedule and enroll in every section of it, or in none.

            requirements:
              FR-12: An academic adviser can review a student's planned schedule before the student enrolls.

            people:
              student:
                name: Student
                description: Plans and confirms one term schedule.
                collaborators:
                  web: plans a schedule and enrolls using
              adviser:
                name: Academic Adviser
                description: Reviews students' planned schedules before they enroll.
                collaborators:
                  web: reviews a student's planned schedule using

            systems:
              registration:
                name: Course Registration
                description: Plans term schedules and enrolls students in their sections.
                responsibilities:
                  - decide: whether a student may enroll in a section
                    id: sys-eligibility
                  - do: hold a seat in every section of a plan, or in none
                    id: sys-holds
                containers:
                  web:
                    name: Planner Web App
                    description: Lets students and advisers compare draft schedules in the browser.
                    kind: browser_app
                    technology: TypeScript, React
                    responsibilities:
                      - do: let students compare draft schedules
                      - do: let advisers review a student's planned schedule
                        requirements: [FR-12]
                    collaborators:
                      backend: {description: submits plans to and loads students' plans from, technology: JSON/HTTPS}
                  backend:
                    name: Registration API
                    description: Checks each enrollment attempt and holds the seats it needs.
                    technology: Python, FastAPI
                    responsibilities:
                      - decide: whether a student may enroll in a section
                        refines: sys-eligibility
                      - do: hold a seat in every section of a plan, or in none
                        refines: sys-holds
                    collaborators:
                      enrollment-records: {description: reads and writes attempts and seat holds in, technology: SQL/TCP}
                      billing: {description: requests tuition charges from, technology: AMQP, connector: message}
                  enrollment-records:
                    name: Enrollment Records
                    description: Keeps each submitted plan, the seats it held, and how the attempt ended.
                    kind: database
                    technology: PostgreSQL 16
                    responsibilities:
                      - do: durably keep every plan, seat hold, and attempt outcome
              billing:
                name: Billing System
                description: Charges tuition and fees for the university.
                external: true
      explanation: |
        Four repairs, and nothing else changed:

        - **Element type:** Enrollment Records is a container of Course Registration with `kind: database`, because this team runs it for this system. The relationship that read and wrote it now targets the container.
        - **Arrow:** the relationship to the Billing System says what is asked, "requests tuition charges from", and keeps its technology.
        - **Name:** "Backend" fits any server; "Registration API" names this container's job. Its id stayed `backend`, as an in-place rename keeps it.
        - **Missing person:** the Academic Adviser reviews plans using the Planner Web App, which puts the adviser on the context view. The web app's new responsibility traces to FR-12, and its relationship to the API now also says that it loads students' plans.

  # Pedagogy: Make with sentence frames and live lint; generation of responsibilities from requirements, including a failure case.
  # Subgoal 1 of the chapter's worked example (identify responsibilities). The knowledge check transfers to a new domain.
  # Objectives: 2 (KNOW/DO/DECIDE, traced to requirements), 6 (what the live checks do and do not establish).
  # Minutes: 10 (spec §11, step 4).
  - title: Responsibilities from Requirements
    key: system-responsibilities
    instructions: |
      ### Why this matters

      Requirements say what users need; responsibilities say what your system promises to know, do, or decide. Writing that translation down, with a trace back to each requirement, lets a reviewer see that nothing was dropped and nothing was invented.

      ### 🎯 You will learn to

      - Derive KNOW, DO, and DECIDE responsibilities from requirements, including a failure case.
      - Trace each responsibility to the requirement it serves.

      **Subgoal 1 of 4: Identify responsibilities**, the first step of [the chapter's worked example](/SEBook/architecture/c4#worked-example-requirements-to-components).

      The registration team's next release has three requirements:

      - **FR-21:** A student can enroll in a section only after passing the section's prerequisite courses.
      - **FR-22:** A student can see how many seats are still open in each section of a plan.
      - **FR-23:** If a section fills up while a student is enrolling in a plan, the student keeps no seat from that plan and learns which section was full.

      The editor holds a fresh model at the system level. A teammate has already written one responsibility for Course Registration; you will judge it in item 2.

      1. **Classify:** For each requirement, ask what it obliges Course Registration to know, do, or decide. A judgment that applies a rule is a DECIDE, information the system can provide is a KNOW, and an action or a guarantee is a DO. FR-23 is a failure case: ask what must stay true when it happens, and what the student must find out.
      2. **Write:** Select Course Registration and add its responsibilities with the responsibility editor; its sentence frames start each statement for you. Write each one as a promise in plain words, not as a field, a method, or a screen action, and hold the teammate's statement to the same standard: rewrite it or remove it if it fails. Give each responsibility an `id`, because step 5 will refine them, and list the requirements it serves. In YAML, one responsibility looks like this:

         ```yaml
         responsibilities:
           - <know | do | decide>: <the promise, in plain words>
             id: <a short id>
             requirements: [<requirement id>]
         ```

      3. **Check:** Watch the Problems panel as you write, then choose **Test My Work**.

      The checks confirm that every requirement is referenced, that Course Registration owns at least one decision, that no responsibility reads like a field, a method, or a screen action, and that none sits on the Billing System; they cannot judge whether your KNOW, DO, and DECIDE kinds fit the requirements or whether each requirement's meaning survived your wording.
    c4:
      view: context of registration
      scaffolds:
        definitions: false
        sentenceFrames: true
        inlineLint: true
        carryDown: false
        trace: false
        emptyStateGuide: false
      checks:
        display: live
        severity:
          rdd/uncovered-requirement: warning
      locked_fields: [requirements]
    files:
      - path: design.yml
        language: yaml
        reseed: true
        content: |
          schema: c4-design/1
          name: Course Registration
          description: Students plan a term schedule and enroll in every section of it, or in none.

          requirements:
            FR-21: A student can enroll in a section only after passing the section's prerequisite courses.
            FR-22: A student can see how many seats are still open in each section of a plan.
            FR-23: If a section fills up while a student is enrolling in a plan, the student keeps no seat from that plan and learns which section was full.

          people:
            student:
              name: Student
              description: Plans and confirms one term schedule.
              collaborators:
                registration: plans a schedule and enrolls using
            adviser:
              name: Academic Adviser
              description: Reviews students' planned schedules before they enroll.
              collaborators:
                registration: reviews a student's planned schedule using

          systems:
            registration:
              name: Course Registration
              description: Plans term schedules and enrolls students in their sections.
              responsibilities:
                - do: click Enroll for every section in a plan
              collaborators:
                billing: requests tuition charges from
            billing:
              name: Billing System
              description: Charges tuition and fees for the university.
              external: true
    tests:
      - description: Every requirement is traced to a responsibility
        c4:
          checks:
            max_warnings: 0
            rules: [rdd/uncovered-requirement]
        hints:
          - title: One Requirement at a Time
            text: 'Take each requirement and ask what it obliges the system to know, do, or decide. The Problems panel names every requirement that nothing traces to yet.'
          - title: Traces Need the Map Form
            condition:
              c4:
                count: {responsibility: {of: registration}}
                at_least: 2
            text: 'If a responsibility is written as one plain string, it cannot carry a `requirements:` list. Use the map form shown in the step, with the requirement ids under `requirements`.'
          - title: The Failure Case Counts Too
            condition:
              c4:
                count: {responsibility: {of: registration}}
                at_least: 3
            text: 'If the Problems panel still names FR-23, read it again: it asks what must stay true about the student’s seats when a section fills, and what the student finds out afterwards. Each answer is a responsibility with its own trace.'
      - description: Course Registration owns at least one decision
        c4:
          exists:
            responsibility: {of: registration, kind: decide}
        hints:
          - title: Spot the Judgment
            text: 'Which requirement asks the system to apply a rule to a student’s situation and settle an outcome? Applying that rule is a DECIDE.'
          - title: Knowing Is Not Deciding
            condition:
              c4:
                exists:
                  responsibility: {of: registration, kind: know}
            text: 'A yes-or-no answer found by looking up or deriving facts, such as whether a student passed a course, is a KNOW. A DECIDE applies a rule to such facts and settles an outcome for the student. Which outcome does FR-21 ask Course Registration to settle?'
          - title: Write the Judgment
            condition:
              c4:
                count: {responsibility: {of: registration}}
                at_least: 3
            text: 'Write the judgment as a DECIDE that starts with “whether”, names who and what the rule is about, and lists the requirement it serves.'
      - description: Every responsibility is an obligation, not a field, method, or screen action
        c4:
          checks:
            max_warnings: 0
            rules: [rdd/not-an-obligation]
        hints:
          - title: Promises, Not Parts
            text: 'Read each responsibility after the words “Course Registration promises to…”. A field name, a method call such as `openSeats()`, get or set, or a screen action such as “click Enroll” does not finish that sentence.'
          - title: Find the Flagged Statement
            condition:
              c4:
                count: {responsibility: {of: registration}}
                at_least: 2
            text: 'The Problems panel marks which responsibility reads like a field, a method, or a screen step. Ask what the student relies on behind it (an outcome, a piece of information, or a choice), and whether another responsibility already promises it.'
          - title: A Rewriting Pattern
            condition:
              c4:
                count: {responsibility: {of: registration}}
                at_least: 4
            text: 'DO names an action with its guarantee, KNOW names information the system can provide, and DECIDE names a choice that applies a policy. A “which” or “whether” question answered by looking up facts is a KNOW, so a draft such as `getHolds()` becomes a KNOW about which seats are held.'
      - description: Every responsibility belongs to the system you are designing
        c4:
          absent:
            responsibility: {of: billing}
        hints:
          - title: Your System, Not Its Neighbors
            text: 'Which system are you designing, and which one belongs to another team?'
          - title: Split Across Two Systems
            condition:
              c4:
                exists:
                  responsibility: {of: registration}
            text: 'Some responsibilities sit on the Billing System. Responsibilities describe what the software you design promises; another team’s system is described by its description and by your relationships to it.'
          - title: All on the Wrong Box
            condition:
              c4:
                absent:
                  responsibility: {of: registration}
            text: 'Every responsibility sits on the Billing System. Move each one to Course Registration, keeping its id and its requirements.'
    quiz:
      title: 'Step 4 — Knowledge Check'
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          # objective: 2 (a failure case as a guarantee plus knowledge; transfer to a new domain)
          question: 'An online shop’s requirement says: “If a card payment is declined at checkout, the cart keeps every item and the shopper learns which card failed.” Which pair of the shop system’s responsibilities captures it?'
          options:
            - 'DO keep every cart item when a payment fails; KNOW which card was declined'
            - 'DECIDE whether a card is declined; DO show an error message on the page'
            - 'KNOW each card’s balance; DO retry the declined card until it succeeds'
            - 'DO roll back the order transaction; KNOW the payment provider’s error code'
          correct_index: 0
          option_feedback:
            1: 'Whether a card is declined is decided by the payment provider, another system; the shop only learns the answer. And showing an error message is a screen action, not a promise.'
            2: 'Retrying changes the requirement, which says the cart keeps its items, not that the shop keeps charging the card. Card balances are the provider’s information, not the shop’s.'
            3: 'Those are implementation steps. A responsibility states the guarantee, every item kept, that any implementation has to keep, and the knowledge the shopper needs afterwards.'
          explanation: 'A failure case usually yields a guarantee that must hold when things go wrong, here a DO that keeps the cart intact, and the knowledge the user needs afterwards, a KNOW. Neither names a screen, a retry policy, or a mechanism.'
    solution:
      files:
        - path: design.yml
          language: yaml
          content: |
            schema: c4-design/1
            name: Course Registration
            description: Students plan a term schedule and enroll in every section of it, or in none.

            requirements:
              FR-21: A student can enroll in a section only after passing the section's prerequisite courses.
              FR-22: A student can see how many seats are still open in each section of a plan.
              FR-23: If a section fills up while a student is enrolling in a plan, the student keeps no seat from that plan and learns which section was full.

            people:
              student:
                name: Student
                description: Plans and confirms one term schedule.
                collaborators:
                  registration: plans a schedule and enrolls using
              adviser:
                name: Academic Adviser
                description: Reviews students' planned schedules before they enroll.
                collaborators:
                  registration: reviews a student's planned schedule using

            systems:
              registration:
                name: Course Registration
                description: Plans term schedules and enrolls students in their sections.
                responsibilities:
                  - decide: whether a student may enroll in a section
                    id: sys-eligibility
                    requirements: [FR-21]
                  - know: how many seats are still open in each section
                    id: sys-open-seats
                    requirements: [FR-22]
                  - do: hold a seat in every section of a plan, or in none
                    id: sys-holds
                    requirements: [FR-23]
                  - know: which section was full when an enrollment attempt fails
                    id: sys-full-section
                    requirements: [FR-23]
                collaborators:
                  billing: requests tuition charges from
              billing:
                name: Billing System
                description: Charges tuition and fees for the university.
                external: true
      explanation: |
        One reference answer:

        - **FR-21** asks for a judgment that applies the prerequisite rule: DECIDE whether a student may enroll in a section. Knowing which courses a student has passed would be a KNOW that the decision uses.
        - **FR-22** is information the system can provide: KNOW how many seats are still open in each section.
        - **FR-23** gives two responsibilities: a guarantee that holds when a section fills (DO hold a seat in every section of a plan, or in none) and what the student learns afterwards (KNOW which section was full).

        Your wording can differ. The kinds, the one-owner promises, and the traces to requirements are what step 5 builds on.

  # Pedagogy: completion problem (worked example with fading): one allocation given, four to complete with the carry-down tray;
  # owners differ (three on the server, one in the browser), and a teammate's browser DECIDE must be judged.
  # Subgoals 2 and 3 of the chapter's worked example (assign owners, then name collaborations: one relationship to write).
  # Objectives: 2 (allocation and refinement), 3 (the web app's relationship to the API as a sentence with a technology),
  # 1 (technology is what a container is built with, not Docker), 6 (what passing checks do not prove; spaced retrieval of step 1).
  # Minutes: 12 (spec §11, step 5; the Connect item adds about 2 to the earlier 10, and the Inspect item was shortened).
  - title: Allocation to Containers
    key: container-allocation
    instructions: |
      ### Why this matters

      A system responsibility is a promise; a container is where the promise is kept. Giving each promise exactly one owner container, and naming what each container is built with, turns a list of obligations into something teams can build, deploy, and own.

      ### 🎯 You will learn to

      - Allocate system responsibilities to containers with refinement links.
      - Apply the rule that a decision runs where it can be protected.

      **Subgoals 2 and 3 of 4: Assign owners, then name collaborations**, the second and third steps of [the chapter's worked example](/SEBook/architecture/c4#worked-example-requirements-to-components).

      Step 4's responsibilities are now the system's, with fixed ids, and the release gained one more requirement, **FR-24:** *A student can rearrange a draft schedule without waiting for the server*, whose system responsibility is already written. The editor opens on the container view. The Registration API already refines the open-seats KNOW: use it as a worked example, with `refines` pointing up to the system's id.

      1. **Inspect:** Open the carry-down tray with the **Responsibilities to refine** button at the top of Course Registration; it counts the container responsibilities that refine each system responsibility. A teammate added a responsibility to the Planner Web App: read it.
      2. **Allocate:** Give each of the four unrefined system responsibilities an owner container, with a responsibility that refines it. Drag a tray item onto a container, or use its **Refine into…** menu, then adjust the wording to the container's level. For each one, ask: where can this promise be kept, and protected, for every student? Judge the teammate's responsibility by the same question, and rewrite or remove it if it fails.
      3. **Connect:** The Planner Web App must send plans to the Registration API. Add that relationship as a sentence read from the web app, with the technology it uses: select the web app and choose **Add relationship** (<kbd>C</kbd>), or drag from its connect handle onto the API. The API's relationships to the database and to the Billing System are worked examples.
      4. **Name the technology:** Every container names what it is built with, such as a language and framework, or a database product. Docker, Kubernetes, or a virtual machine says where a container runs, which belongs in a deployment view, and the checker warns about it. If the team has not chosen yet, write `TBD` (to be decided): a recorded open decision beats a silent gap.
      5. **Check:** Choose **Test My Work**.

      **Break point:** your work is saved, and step 6 starts from a fresh model, so after this step's knowledge check is a good place to pause.

      The checks confirm that each system responsibility is refined by some container, that the promise made without the server is kept where no server is needed, that the browser app makes no decision, that the web app's relationship to the API names a technology, that no relationship is vague, and that every container names a technology that is not infrastructure; they cannot judge whether the owner you chose is a good one, for example whether a data store should ever decide.
    c4:
      view: containers of registration
      scaffolds:
        definitions: false
        sentenceFrames: false
        inlineLint: true
        carryDown: true
        trace: false
        emptyStateGuide: false
      checks:
        display: live
      locked_fields: [requirements, systems.registration.responsibilities]
