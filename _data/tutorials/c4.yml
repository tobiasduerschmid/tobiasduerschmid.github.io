    tests:
      - description: The coordinator refines nothing about the API’s eligibility decision
        c4:
          absent:
            responsibility: {of: coordinator, refines: api-eligibility}
        hints:
          - title: Sequencing Is Not Deciding
            text: 'The coordinator decides which step of an attempt runs next. Does it also need to decide whether a student may enroll, or can it ask for that decision?'
          - title: The Request Already Exists
            condition:
              c4:
                exists:
                  responsibility: {of: coordinator, kind: decide, refines: api-eligibility}
            text: 'The coordinator already asks another component for an eligibility decision. If it also makes that decision, two parts own one judgment: undo your change to the coordinator and put the decision where its request points.'
          - title: Asking Is Not Refining
            condition:
              c4:
                count: {responsibility: {of: coordinator}}
                at_least: 3
            text: 'The coordinator gained a responsibility that refines the eligibility decision. Refining means helping to make the decision; the coordinator only asks for it. Move whatever the decision needs to the component that makes it.'
      - description: The component the coordinator asks for an eligibility decision makes that decision, and no other component does
        c4:
          every:
            type: component
            has_responsibility: {kind: decide, refines: api-eligibility}
          satisfies: {id: policy}
        hints:
          - title: Follow the Request
            text: 'Read the coordinator’s request for an eligibility decision. Which component does it ask, and what does that component promise so far?'
          - title: The Policy Is Gone
            condition:
              c4:
                absent:
                  element: {type: component, name_any: [policy]}
            text: 'The coordinator still asks the Enrollment Policy for an eligibility decision, but the policy is gone. Undo the deletion: the decision belongs in the component the request names.'
          # Nesting the parent filter joins the two facts: the policy has a DECIDE, and the API's eligibility decision
          # is refined by no component (false on wrong-10, where the policy's link is right).
          - title: Link It Upward
            condition:
              c4:
                exists:
                  element: {id: policy, has_responsibility: {kind: decide}, parent: {id: api, has_responsibility: {id: api-eligibility, leaf: true}}}
            text: 'The Enrollment Policy decides something, but no component refines the API’s eligibility decision yet: the policy’s DECIDE does not name it in `refines`. Which id does the API’s eligibility decision have?'
          - title: One Decision, One Owner
            condition:
              c4:
                count: {responsibility: {of: {type: component}, kind: decide, refines: api-eligibility}}
                at_least: 2
            text: 'More than one component refines the API’s eligibility decision with a DECIDE. Keep the decision in the component the coordinator asks; the others can know or do what the decision needs.'
      - description: Exactly one component owns seat holds
        c4:
          # owns_any synonym set (documented, spec §8): seat hold, held seat, seat reservation, reserved seat.
          count: {element: {type: component, in: api, owns_any: [seat hold, held seat, seat reservation, reserved seat]}}
          equals: 1
        hints:
          - title: Who Writes Seat Holds?
            text: 'The API records one fact that only it writes. Inside the API, which component should be the only one that writes it, and where does a component record that?'
          - title: Only One Writer
            condition:
              c4:
                count: {element: {type: component, in: api, owns_any: [seat hold, held seat, seat reservation, reserved seat]}}
                at_least: 2
            text: 'Two components now claim to be the only writer. Keep the claim on the one whose job is talking to the database; the other can ask that one.'
          - title: The Same Fact at Both Levels
            condition:
              c4:
                exists:
                  relationship: {from: {type: component, in: api}, to: db}
            text: 'A component now writes to the database. The API alone writes seat holds, and inside it exactly one component should: that one records them in its own `owns`, under the same name the API’s list uses, so readers see one fact at both levels. How many components claim seat holds now?'
      - description: The component that owns seat holds is the one that writes them to the database
        c4:
          exists:
            relationship:
              from: {type: component, in: api, owns_any: [seat hold, held seat, seat reservation, reserved seat]}
              to: db
        hints:
          - title: Owner and Writer
            text: 'The only writer of a fact is the one that writes it to the database. Which component should send seat holds to the Registration Database?'
          - title: A Claim Without a Write
            condition:
              c4:
                exists:
                  element: {type: component, in: api, owns_any: [seat hold, held seat, seat reservation, reserved seat]}
            text: 'A component records that it alone writes seat holds, but it has no relationship to the Registration Database. Either the claim or the relationship sits on the wrong component.'
          - title: Claim and Relationship Together
            condition:
              c4:
                exists:
                  relationship: {from: {type: component, in: api}, to: db}
            text: 'A component writes to the Registration Database, but no component that writes there names seat holds in its `owns`. The claim and the relationship belong together, on the component whose job is talking to the database.'
      - description: Every responsibility of the Registration API is refined by a component
        c4:
          absent:
            responsibility: {of: api, leaf: true}
        hints:
          - title: One Refinement Each
            text: 'For each of the Registration API’s responsibilities, look for a component responsibility whose `refines` names it. Which has none yet?'
          # Both conditions require an unrefined API KNOW through the parent filter (false on wrong-8, wrong-9, and
          # wrong-10, where only a DO or a DECIDE is unrefined); the second also requires a Seat Gateway KNOW.
          - title: What Else Must It Know?
            condition:
              c4:
                exists:
                  element: {id: seats, has_responsibility: {kind: do}, parent: {id: api, has_responsibility: {kind: know, leaf: true}}}
            text: 'The Seat Gateway holds seats, and at least one of the API’s KNOW responsibilities has no component KNOW refining it yet. Which of them can the component that writes seat holds answer as well?'
          - title: Knowledge Needs a Link Too
            condition:
              c4:
                exists:
                  element: {id: seats, has_responsibility: {kind: know}, parent: {id: api, has_responsibility: {kind: know, leaf: true}}}
            text: 'The Seat Gateway knows something, yet an API KNOW is still unrefined. A KNOW that repeats the API’s words without `refines` does not count. Check that each component KNOW names the API responsibility it helps answer.'
      - description: Every request names a responsibility that its target, or one of its children, has
        c4:
          checks:
            max_errors: 0
            rules: [model/responsibility-owner, model/unknown-reference]
        hints:
          - title: Read the Requests
            text: 'Each of the coordinator’s relationships names a target and a `responsibility` id. Choose **Check now**: the Problems panel lists every request whose target, or whose responsibility on that target, it cannot find.'
          - title: The Id Must Match
            condition:
              c4:
                exists:
                  responsibility: {of: policy}
            text: 'A request is answered only by a responsibility with exactly the id the request names, on the component the request targets or one of its children. Check both for each request.'
          # Shown only when no reference is unknown, so the failure is model/responsibility-owner: a requested id
          # exists, but on a component the request does not target (wrong-13; false on wrong-3 and wrong-6).
          - title: On the Target, Not a Sibling
            condition:
              c4:
                checks:
                  max_errors: 0
                  rules: [model/unknown-reference]
            text: 'Every id the requests name exists, but at least one sits on a component the request does not target. The component named in the relationship, or one of its children, must have it.'
    quiz:
      title: 'Step 6 — Knowledge Check'
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          # objective: 3
          question: 'In a C4 `design.yml`, the Registration Coordinator’s relationship to the Seat Gateway names `responsibility: seats-hold-all`. A teammate moves the `seats-hold-all` responsibility out of the Seat Gateway and into the coordinator, and leaves the relationship as it is. What does the model now say?'
          options:
            - 'It asks the Seat Gateway for help that the gateway no longer has.'
            - 'Nothing changes, because the coordinator sends the same request.'
            - 'The coordinator now owns seat holds, so the request is harmless.'
            - 'The Seat Gateway now refines the coordinator’s responsibility.'
          correct_index: 0
          option_feedback:
            1: 'The request names the help it needs by id. Once the target no longer has that responsibility, the request asks for a promise the target does not make, and the checker reports an error.'
            2: 'Having a responsibility is not owning a fact: `owns` lists facts that an element alone writes. And a request must still name help that its own target has.'
            3: 'Refinement links an element’s responsibility to one of an ancestor. Siblings, such as two components of one container, never refine each other.'
          explanation: 'A collaborator’s `responsibility` names the help being requested, and the target, or one of its children, must have a responsibility with that id. That is what makes a relationship a request for help the target promises rather than an arbitrary arrow.'
