  # Pedagogy: far transfer to an unpracticed domain, with the containers given as a fact so the step assesses allocation and
  # ownership; two named readers drive view and level choice; self-assessment with a rubric (rows in subgoal order) before delayed
  # feedback (after-submit), one revision, then compare two reference designs and explain the difference as a design decision.
  # Objectives: all six, especially 4 (audience and levels), 5 (self-review), 6 (rubric versus diagnostics).
  # Minutes: 15 (spec §11, step 9): build about 10, self-review 2, revision 1, comparison 2.
  - title: 'Transfer: Makerspace Equipment Loans'
    key: makerspace-transfer
    instructions: |
      ### Why this matters

      A method pays off when you can use it on the next system. A new domain shows whether you can find responsibilities, owners, and levels without a worked example, and whether you review your own model before a tool does.

      ### 🎯 You will learn to

      - Create a context and container model from written requirements in a new domain, with a view for each reader.
      - Evaluate your model against a rubric before automated checks, then revise it once.
      - Explain a difference between two reasonable designs as a design decision.

      **The brief.** The campus makerspace lends tools such as drills, cameras, and sewing machines to its members, students and staff who have signed up. Desk staff hand tools out and take them back at the front desk, where members tap their campus ID card, and the Campus Card System says whose card it is. Makerspace staff teach each tool's safety training themselves. The university's Safety Training Records system stores training completions for many departments and accepts completions from any of them. The makerspace team will build three containers: a Desk App in the browser at the front desk, one Loans API on a server, and one Loans Database. The editor holds the three requirements, which are fixed:

      - **MS-1:** A member can borrow a tool only after completing that tool's safety training.
      - **MS-2:** Each tool is lent to at most one member at a time, and desk staff can see who has each tool.
      - **MS-3:** A member who returns a tool more than two days late cannot borrow any tool for the next seven days.

      Two people will read your model: the **makerspace manager**, who approves the system and asks *which campus systems will it depend on, and who uses it?*, and the **developer building the borrowing rule**, who asks *which application decides whether a member may borrow, and what does it need to ask other systems?*

      1. **Build** (about 10 minutes, in the chapter's subgoal order). Sentence frames are off; switch them back on in the editor if you want them. Diagnostics stay hidden until you choose **Submit for review** in item 3.
         1. **Context** (2 minutes): the people, Makerspace Loans, and the systems it depends on, with labeled relationships.
         2. **Identify responsibilities** (3 minutes): Makerspace Loans' KNOW, DO, and DECIDE responsibilities, each with an `id` and traced to MS-1 to MS-3.
         3. **Assign owners** (3 minutes): the three containers from the brief, with responsibilities that refine the system's.
         4. **Name collaborations, then save views** (2 minutes): relationships between containers as sentences with a technology; then one saved view for each reader under `views:`, whose description names the reader, their question, and the level you left out for them.
      2. **Self-review:** Score your model against the rubric before you see any diagnostics.

         | Subgoal | Ask yourself |
         |---|---|
         | Context and readers | Does each reader's view stop at the level that answers their question, and does its description say which level you left out, and why? |
         | Identify responsibilities | Is each requirement served by a KNOW, DO, or DECIDE written as a promise, not as a field, a method, or a screen step? |
         | Assign owners | Does each KNOW and DECIDE have one owner container, with `refines` pointing up? Does a data store decide anything? Is every responsibility on Makerspace Loans or its containers, none on people or other teams' systems? |
         | Name collaborations | Does each arrow read as a sentence from the element that asks, with a technology between containers? |

      3. **Submit for review:** Choose **Submit for review** to see the editor's diagnostics. Which did your self-review already catch?
      4. **Revise once:** Make one pass through what the rubric and the diagnostics found, then choose **Test My Work**.
      5. **Compare, then write it down:** After your revision, open the reveal. State the difference between the two reference designs as a design decision: the question it answers, both options, and what each costs. Then say which option your model took, and why.

      <details markdown="1">
      <summary>The two reference designs (open after your revision)</summary>

      Both reference designs give the borrowing decision to a server-side Loans API, keep exactly one holder per tool, trace all three requirements, and save the same two views. Their structures differ in one place:

      - In one, desk staff record each completed training through the Desk App, the Loans API records it, and the Loans Database stores completions beside loans and returns.
      - In the other, desk staff record completions in Safety Training Records; the Loans API asks that system which trainings a member completed, and the Loans Database stores only loans and returns.

      <details markdown="1">
      <summary>Compare your explanation (step 9)</summary>

      **The decision:** which element is the single source of truth for training completions? Owning them in the Loans API keeps training checks working when Safety Training Records is down and keeps training data with one team, but it creates a second record of trainings that the rest of campus cannot see, which drifts if staff ever report completions in both places. Leaving them in Safety Training Records gives the campus one source of truth and lets other departments rely on makerspace trainings, but it adds a second external system, beside the Campus Card System, to every checkout's path, so the desk needs a plan for its outages.

      In both designs the Loans API owns the KNOW and the DECIDE; what moves is the single source of truth for training completions (`owns`): the Loans API in the first design, Safety Training Records in the second. Knowing does not mean storing.

      </details>

      </details>

      The checks confirm only that your model has no errors and that every requirement is traced; they cannot judge your views, your owners, your relationship sentences, or your explanation, which is what the rubric and the comparison are for.
    c4:
      scaffolds:
        definitions: true
        sentenceFrames: false
        inlineLint: false
        carryDown: true
        trace: true
        emptyStateGuide: true
      checks:
        display: after-submit
        severity:
          rdd/uncovered-requirement: warning
      locked_fields: [requirements]
    files:
      - path: design.yml
        language: yaml
        reseed: true
        content: |
          schema: c4-design/1
          name: Makerspace Equipment Loans
          description: Members borrow tools from the campus makerspace.

          requirements:
            MS-1: A member can borrow a tool only after completing that tool's safety training.
            MS-2: Each tool is lent to at most one member at a time, and desk staff can see who has each tool.
            MS-3: A member who returns a tool more than two days late cannot borrow any tool for the next seven days.
    tests:
      - description: The model has no errors
        c4:
          checks:
            max_errors: 0
        hints:
          - title: Read the Diagnostics
            text: 'After **Submit for review**, each error names the element or saved view it is about. Errors usually mean a broken reference: an id that does not exist, a saved view whose selector names an element that does not exist, or a `refines` that points to a responsibility outside the element’s ancestors. An error on a person’s `responsibilities` means the text belongs in the person’s description: responsibilities belong to the software you design.'
          # Each of the next two holds only when every error left comes from one rule: a `refines` outside the
          # element's ancestors (wrong-2), or a saved view's selector that names nothing (wrong-5).
          - title: Refinement Points Up
            condition:
              c4:
                checks: {max_errors: 0, disable: [model/refines-not-ancestor]}
            text: 'Every error left names a `refines`. Check where each one points: a container responsibility can refine only a responsibility of its own system, never one of a sibling container.'
          - title: A Saved View Names Nothing
            condition:
              c4:
                checks: {max_errors: 0, disable: [view/unknown-selector]}
            text: 'Every error left is about a saved view: its selector names an element that the model does not have. Compare each name in the selector with the names and ids of your elements.'
      - description: Every requirement is traced to a responsibility
        c4:
          checks:
            max_warnings: 0
            rules: [rdd/uncovered-requirement]
        hints:
          - title: Every Requirement Has a Home
            text: 'For each of MS-1 to MS-3, which responsibility serves it? That responsibility lists the requirement’s id under `requirements`.'
          - title: Map Form Carries Traces
            condition:
              c4:
                exists:
                  responsibility: {of: {type: system}}
            text: 'If a responsibility is written as one plain string, it cannot list requirements. Use the map form, with a `requirements:` list. If every responsibility is already in map form, look for the requirement that no `requirements:` list names yet.'
          - title: Every Part Needs a Trace
            condition:
              c4:
                count: {responsibility: {of: {type: system}}}
                at_least: 3
            text: 'Read each requirement the Problems panel still names, part by part. MS-2 has two halves, and MS-3 links a late return to a later limit on borrowing. One responsibility may trace to several requirements, and one requirement may need several responsibilities.'
    solution:
      files:
        - path: design.yml
          language: yaml
          content: |
            schema: c4-design/1
            name: Makerspace Equipment Loans
            description: Members borrow tools from the campus makerspace.

            requirements:
              MS-1: A member can borrow a tool only after completing that tool's safety training.
              MS-2: Each tool is lent to at most one member at a time, and desk staff can see who has each tool.
              MS-3: A member who returns a tool more than two days late cannot borrow any tool for the next seven days.

            people:
              member:
                name: Member
                description: A student or staff member who borrows tools from the makerspace.
                collaborators:
                  desk: taps a campus ID card to borrow and return tools at
              staff:
                name: Desk Staff
                description: Hands tools out, takes them back, and teaches tool trainings.
                collaborators:
                  desk: lends tools, takes returns, and records completed trainings using

            systems:
              loans:
                name: Makerspace Loans
                description: Lends tools to trained members and tracks who has each tool.
                responsibilities:
                  - decide: whether a member may borrow a tool
                    id: sys-may-borrow
                    requirements: [MS-1, MS-3]
                  - know: which members completed each tool's safety training
                    id: sys-trainings
                    requirements: [MS-1]
                  - do: lend each tool to at most one member at a time
                    id: sys-one-holder
                    requirements: [MS-2]
                  - know: which member has each tool
                    id: sys-holders
                    requirements: [MS-2]
                  - know: which members returned a tool more than two days late, and when
                    id: sys-late-returns
                    requirements: [MS-3]
                containers:
                  desk:
                    name: Desk App
                    description: Lets desk staff lend tools, take returns, and record completed trainings.
                    kind: browser_app
                    technology: TypeScript, React
                    responsibilities:
                      - do: let desk staff lend tools, take returns, and record completed trainings
                    collaborators:
                      api:
                        description: sends loans, returns, and training completions to
                        technology: JSON/HTTPS
                  api:
                    name: Loans API
                    description: Decides who may borrow and records every loan, return, and completed training.
                    technology: Java, Spring Boot
                    responsibilities:
                      - decide: whether a member may borrow a tool
                        refines: sys-may-borrow
                      - know: which members completed each tool's safety training
                        refines: sys-trainings
                      - do: lend each tool to at most one member at a time
                        refines: sys-one-holder
                      - know: which member has each tool
                        refines: sys-holders
                      - know: which members returned a tool more than two days late, and when
                        refines: sys-late-returns
                    collaborators:
                      db: {description: reads and writes loans and training completions in, technology: SQL/TCP}
                      card: {description: asks whose campus ID card was tapped from, technology: JSON/HTTPS}
                    owns: [loans, training completions]
                  db:
                    name: Loans Database
                    description: Durably stores loans, returns, and completed trainings.
                    kind: database
                    technology: PostgreSQL 16
                    responsibilities:
                      - do: durably store loans, returns, and completed trainings
              card:
                name: Campus Card System
                description: Identifies students and staff by their campus ID cards.
                external: true

            views:
              for-manager:
                view: context of loans
                description: For the makerspace manager approving the system, shows who uses Makerspace Loans and which campus systems it depends on. The container view is left out, because technology choices do not change the approval.
              for-developer:
                view: containers of loans
                description: For the developer building the borrowing rule, shows which application decides whether a member may borrow and what it asks other systems. A component view is left out until the Loans API's insides are designed.
      explanation: |
        The solution file is reference design 1: the **Loans API owns training completions**. Desk staff record each completed training through the Desk App, and the Loans Database stores it. Reference design 2 changes only the entries below; everything else, including all five system responsibilities, their refinements, and the two saved views, is identical:

        ```yaml
        people:
          staff:
            collaborators:
              desk: lends tools and takes returns using
              training: records completed tool trainings in
        systems:
          loans:
            containers:
              desk:
                description: Lets desk staff lend tools and take returns.
                responsibilities:
                  - do: let desk staff lend tools and take returns
                collaborators:
                  api: {description: sends loans and returns to, technology: JSON/HTTPS}
              api:
                description: Decides who may borrow and records every loan and return.
                collaborators:
                  db: {description: reads and writes loans and returns in, technology: SQL/TCP}
                  card: {description: asks whose campus ID card was tapped from, technology: JSON/HTTPS}
                  training: {description: asks which tool trainings a member completed from, technology: JSON/HTTPS}
                owns: [loans]
              db:
                description: Durably stores loans and returns.
                responsibilities:
                  - do: durably store loans and returns
          training:
            name: Safety Training Records
            description: Stores safety-training completions for departments across campus.
            external: true
        ```

        The decision between the two designs, and what each one costs, is in the step's reveal.
