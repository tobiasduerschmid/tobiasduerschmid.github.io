    tests:
      - description: A container refines the enrollment decision
        c4:
          exists:
            responsibility: {of: {type: container}, refines: sys-eligibility}
        hints:
          - title: Follow the Tray
            text: 'The carry-down tray counts the container responsibilities that refine each system responsibility. For each one still at zero, copy the shape of the worked example: a kind, a promise worded for the container, and `refines:` with the system id. Which container keeps each promise is your decision.'
          - title: A Link, Not a Lookalike
            condition:
              c4:
                exists:
                  responsibility: {of: {type: container, kind: application}, kind: decide}
            text: 'A container responsibility refines a system responsibility only when its `refines` names that responsibility’s id. One with the same words and no link is not a refinement.'
          - title: Let the Tray Write the Link
            condition:
              c4:
                exists:
                  element: {type: container, kind: application, has_responsibility: {kind: decide}, responsibilities_at_least: 4}
            text: 'Dragging a tray item onto a container, or choosing its **Refine into…** menu, writes the `refines` link for you. In YAML, add `refines:` with the system id under the responsibility.'
      - description: A container refines the all-or-nothing seat hold
        c4:
          exists:
            responsibility: {of: {type: container}, refines: sys-holds}
        hints:
          - title: Follow the Tray
            text: 'The carry-down tray counts the container responsibilities that refine each system responsibility. For each one still at zero, copy the shape of the worked example: a kind, a promise worded for the container, and `refines:` with the system id. Which container keeps each promise is your decision.'
          - title: A Link, Not a Lookalike
            condition:
              c4:
                count: {responsibility: {of: {type: container, kind: application}, kind: do}}
                at_least: 1
            text: 'A container responsibility refines a system responsibility only when its `refines` names that responsibility’s id. One with the same words and no link is not a refinement.'
          - title: Let the Tray Write the Link
            condition:
              c4:
                exists:
                  element: {type: container, kind: application, has_responsibility: {kind: do}, responsibilities_at_least: 4}
            text: 'Dragging a tray item onto a container, or choosing its **Refine into…** menu, writes the `refines` link for you. In YAML, add `refines:` with the system id under the responsibility.'
      - description: A container refines knowing which section was full
        c4:
          exists:
            responsibility: {of: {type: container}, refines: sys-full-section}
        hints:
          - title: Follow the Tray
            text: 'The carry-down tray counts the container responsibilities that refine each system responsibility. For each one still at zero, copy the shape of the worked example: a kind, a promise worded for the container, and `refines:` with the system id. Which container keeps each promise is your decision.'
          - title: A Link, Not a Lookalike
            condition:
              c4:
                count: {responsibility: {of: {type: container, kind: application}, kind: know}}
                at_least: 2
            text: 'A container responsibility refines a system responsibility only when its `refines` names that responsibility’s id. One with the same words and no link is not a refinement.'
          - title: Let the Tray Write the Link
            condition:
              c4:
                exists:
                  element: {type: container, kind: application, has_responsibility: {kind: know}, responsibilities_at_least: 4}
            text: 'Dragging a tray item onto a container, or choosing its **Refine into…** menu, writes the `refines` link for you. In YAML, add `refines:` with the system id under the responsibility.'
      - description: A container refines rearranging drafts without waiting for the server
        c4:
          exists:
            responsibility: {of: {type: container, kind: browser_app}, refines: sys-drafts}
        hints:
          - title: Follow the Tray
            text: 'The carry-down tray counts the container responsibilities that refine each system responsibility. For each one still at zero, copy the shape of the worked example: a kind, a promise worded for the container, and `refines:` with the system id. Which container keeps each promise is your decision.'
          # Names the Registration API, not every application container: on wrong-10 the web app itself became one.
          - title: Waiting for the Server
            condition:
              c4:
                exists:
                  responsibility: {of: api, refines: sys-drafts}
            text: 'FR-24 says the student does not wait for the server. A container that runs on the server cannot keep that promise; which container runs on the student’s own computer?'
          - title: Where It Runs
            condition:
              c4:
                absent:
                  element: {id: web, kind: browser_app}
            text: 'The Planner Web App’s kind no longer says it runs in the browser. Its kind is what tells readers where its responsibilities run: put `browser_app` back.'
          # Holds only when the browser app has a DO worded like the drafts promise (wrong-22), not for any two DOs.
          - title: A Link, Not a Lookalike
            condition:
              c4:
                exists:
