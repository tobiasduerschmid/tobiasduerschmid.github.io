title: "Haskell 1: Expressions, Types, and Recursion"
description: "For CS131 students who know functions, conditionals, and lists in Python or C++: build pure Haskell functions through prediction, debugging, and independent practice. Allow 90–110 minutes, with a break after Step 5."
backend: haskell
require_tests: true

# Preserve matching saved lessons without crediting replacements at the same index.
progress_version: 2
legacy_step_keys: [expressions, numeric-conversions, guards, local-bindings, tuples, lists, list-patterns, recursion, comprehensions, budget]
learning_objectives:
  - "Analyze function application and distinguish grouping from evaluation order."
  - "Derive type signatures from parameter and result constraints."
  - "Create complete conditional definitions with guards and local bindings."
  - "Analyze tuple, list, and string patterns without assuming mutable variables."
  - "Create recursive list transformations with complete base cases."
  - "Evaluate boundary cases and build a budget-limited prefix selector independently."
# Course source: intro_to_functional_programming_and_haskell_v10_handouts.pdf.
# Page references below are physical PDF pages. The supplied handout PPTX
# supplements display harnesses (slide 14) and div notation (39).
# Assessments guide task families; prerequisites come from the supplied lectures.
# Original practice, with exact coverage in docs/haskell-course-source-map.md.
# Each step is an independent exercise. Reseeding Main.hs prevents one step's
# definitions from silently replacing the next step's starter.
steps:
  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf pp. 5–8, 13–18.
  # Display harness: intro_to_functional_programming_and_haskell_v10_handouts.pptx slide 14.
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx P3b — application/parentheses prerequisite for list recursion.
  # Pedagogy: PRIMM — contrast application grouping, Run, then Modify.
  - title: "Functions as Expressions"
    key: session-time
    instructions: |
      ### Why this matters

      Haskell asks a different question: what value does this expression describe? Start with one small function, and you can explore that shift without installing anything.

      ### 🎯 You will learn to

      - Analyze how function calls group with arithmetic
      - Modify a pure function while keeping output in `main`

      This is Part 1 of a three-part path. You need functions, conditionals,
      and lists from Python or C++; you do not need any Haskell. Plan for
      90–110 minutes, and take a break after Step 5.

      ### A tiny worked example

      ```haskell
      remainingTime :: Int -> Int -> Int
      remainingTime available used = available - used
      ```

      `::` introduces a type signature: this function accepts two `Int`
      arguments and produces an `Int`. `=` defines the result; it does not
      assign a new value to either parameter.
      The body is an expression, so there is no `return` statement.
      Call it with `remainingTime 45 12`, which gives `33`. Names of functions and bindings
      start with a lowercase letter; type names such as `Int` start uppercase.
      `--` starts a comment.

      Function application binds more tightly than arithmetic:
      `remainingTime 45 12 * 2` means `(remainingTime 45 12) * 2`. Use parentheses when an argument
      is itself an expression. `f x y` groups as `(f x) y`; that grouping
      rule does **not** specify which expression Haskell evaluates first.

      ### Predict before you Run!

      The starter's `afterTwoSessions 45 12` should report the time left
      after two sessions of 12 minutes each, starting with 45 minutes.
      Will it print `21`, `66`, or a type error? Think about your prediction,
      then choose **Run**.

      <details markdown="1"><summary>Click for explanation</summary>

      It prints `66`: the starter subtracts one session, then doubles the
      remaining time. The doubled duration must be the second argument.

      </details>

      ### Your challenge

      Repair `afterTwoSessions available duration` to subtract two session
      durations from the available time. Inputs are nonnegative `Int` values
      in the small ranges used here; a negative result reports an overrun.
      Try a zero duration and an overrun before choosing **Test My Work**.

      `main = print (...)` is the supplied display harness. Your function computes
      a value, and `main` displays it. Leave the harness's type signature alone.
      The browser uses MicroHs, a compact
      Haskell implementation; course-style definitions go in `Main.hs`, not
      interpreter commands such as `:load`.

      A failing check is information about one input, not a verdict on your
      ability. Read its description, make a prediction, and change one idea.
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where

          remainingTime :: Int -> Int -> Int
          remainingTime available used = available - used

          afterTwoSessions :: Int -> Int -> Int
          afterTwoSessions available duration = remainingTime available duration * 2

          main :: IO ()
          main = print (afterTwoSessions 45 12)
    open_file: Main.hs
    run_file: Main.hs
    tests:
      - description: "Two sessions subtract both durations, including zero, exact fit, and overrun"
        command: "afterTwoSessions 45 12 == 21 && afterTwoSessions 30 15 == 0 && afterTwoSessions 20 12 == (-4) && afterTwoSessions 17 0 == 17 && afterTwoSessions 0 3 == (-6)"
        hints:
          - text: "Which argument represents time used: one session duration or the combined duration?"
          - text: "Application groups before multiplication. Parentheses can make a whole expression one argument."
          - text: "Use `remainingTime available (...)`, placing the combined duration in parentheses."
    quiz:
      title: "Step 1 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "With `remainingTime available used = available - used`, what is `remainingTime 18 4 * 2`?"
          options: ["`28`", "`10`", "A type error"]
          correct_index: 0
          option_feedback:
            1: "That would be `remainingTime 18 (4 * 2)`. Without those parentheses, multiplication applies to the result."
            2: "A function result can be used in arithmetic; the call and multiplication both produce compatible numbers."
          explanation: "The expression groups as `(remainingTime 18 4) * 2`, giving 14 * 2."
        - type: single
          difficulty: basic
          question: "What does `remainingTime available used = available - used` do with available?"
          options:
            - "Replaces it with the remaining time"
            - "Defines a result using its value"
            - "Prints it before subtracting used"
          correct_index: 1
          option_feedback:
            0: "A parameter binding stays the same. The expression computes the function's result."
            2: "Subtraction is pure; displaying the result requires a separate output action."
          explanation: "The definition describes a value for each input, without modifying the input."
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where
            remainingTime :: Int -> Int -> Int
            remainingTime available used = available - used
            afterTwoSessions :: Int -> Int -> Int
            afterTwoSessions available duration = remainingTime available (duration * 2)
            main :: IO ()
            main = print (afterTwoSessions 45 12)
      explanation: |
        The parentheses make the combined duration the second argument. Directly
        writing `available - 2 * duration` is also correct; the checks assess
        the result, not which helper you use.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf pp. 13–15, 25–27.
  # Assessment: [Midterm] F24 V1 (Public).pdf P3A p. 5 — derive a signature from fixed numeric inputs and a comparison.
  # Pedagogy: mistake-based familiarization — separate a well-typed numerical bug from a type mismatch.
  - title: "Types and Numeric Boundaries"
    key: fractional-shares
    instructions: |
      ### Why this matters

      A program can compile and still calculate the wrong answer.
      Types help you decide what a value can represent, but you still choose the operation.

      ### 🎯 You will learn to

      - Apply a numeric type signature to a fractional calculation
      - Derive a result type from the expression being computed

      `Int` represents whole numbers, and `Double` represents approximate
      floating-point numbers, including fractional values.
      `Bool` has the values `True` and `False`. `'x'` is a `Char`, while
      `"x"` is a `String`. A type is part of the program even when its
      signature is omitted: Haskell infers types before executing your code.

      `/` performs fractional division. With a `Double` result, `7 / 2`
      gives `3.5`. In this exercise, both inputs already have type `Double`;
      the literal `7` can be used where a `Double` is expected.

      Derive a signature by tracking **input types** and the **whole result**.
      For `fits first second space = first + second <= space`, assume all
      three inputs are `Int` values. Addition produces an `Int`, but the
      comparison produces `Bool`: `fits :: Int -> Int -> Int -> Bool`.
      The result type describes the comparison's answer, not its operands.

      ### Thinking time!

      A team splits seven points between two players. The starter divides
      by `players + 1`. Will it return `3.5` or about `2.33`? Identify
      the denominator before running.

      <details markdown="1"><summary>Check the denominator</summary>

      The starter divides by three, so it returns about `2.33`. Its types
      are consistent; the numerical rule is wrong.

      </details>

      ### Your challenge

      Repair `pointsPerPlayer total players` so it returns the fractional
      share. Assume `total >= 0` and a positive whole-number player count
      represented as a `Double`. The total may contain a fraction, such as
      `7.5`. Use the provided types; the checks allow floating-point rounding error.

      For a short debugging experiment, replace an argument in `main` with
      `True` and run. Read the type error, explain the mismatch, then undo
      that experiment before testing your work. Type errors and incorrect
      numerical results are two different kinds of feedback.
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where
          pointsPerPlayer :: Double -> Double -> Double
          pointsPerPlayer total players = total / (players + 1)
          main :: IO ()
          main = print (pointsPerPlayer 7 2)
    open_file: Main.hs
    run_file: Main.hs
    tests:
      - description: "Shares preserve fractional totals, fractional results, exact divisions, and zero totals"
        command: "abs (pointsPerPlayer 7 2 - 3.5) < 1e-9 && abs (pointsPerPlayer 7.5 3 - 2.5) < 1e-9 && abs (pointsPerPlayer 10 4 - 2.5) < 1e-9 && abs (pointsPerPlayer 9 3 - 3) < 1e-9 && abs (pointsPerPlayer 0 5) < 1e-9 && abs (pointsPerPlayer 1 3 - 1/3) < 1e-9"
        hints:
          - text: "Compare the number of players in the story with the number used by the starter."
          - text: "The numerator is the total to share. The denominator counts the people receiving a share."
          - text: "Use one division expression with the two supplied parameters; no extra recipient is part of the rule."
    quiz:
      title: "Step 2 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "Assume total, each, and groups are Ints. Which signature fits `leftover total each groups = total - each * groups`?"
          options: ["`Int -> Int -> Int -> Bool`", "`Int -> Int -> Int -> Int`", "`Int -> Int -> Bool -> Int`"]
          correct_index: 1
          option_feedback:
            0: "There is no comparison here. Both multiplication and subtraction produce an Int result."
            2: "groups participates in multiplication and is specified as an Int; it is not a Boolean condition."
          explanation: "All three inputs are Ints. The final subtraction also returns an Int, so the signature has three Int inputs and an Int result."
        - type: single
          difficulty: basic
          question: "A definition omits its type signature. What does Haskell do?"
          options:
            - "Changes its type on every call"
            - "Waits for its first runtime value"
            - "Infers its type before execution"
          correct_index: 2
          option_feedback:
            0: "Omitting a signature does not make a binding dynamically typed."
            1: "Inference uses the definition and its constraints; it does not wait for the first call."
          explanation: "Type inference supplies a static type. Some inferred types can be polymorphic, as later steps explore."
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where
            pointsPerPlayer :: Double -> Double -> Double
            pointsPerPlayer total players = total / players
            main :: IO ()
            main = print (pointsPerPlayer 7 2)
      explanation: |
        Both operands and the result have type Double. Dividing by the actual
        player count gives each share; the positive-player precondition avoids
        division by zero. The signature checks compatibility, not the formula.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf pp. 20–24.
  # Assessment: [Midterm] F24 V1 (Public).pdf P1 p. 2 — guard selection prerequisite for conditional recursion.
  # Pedagogy: PRIMM — contrast old and proposed state, then test both clamp boundaries.
  - title: Conditional Values and Guards
    key: stock-adjustment
    instructions: |
      ### Why this matters

      Several valid conditions can overlap. Guards let you state which rule
      wins and choose a value without changing a variable in place.

      ### 🎯 You will learn to

      - Analyze guard conditions at a boundary
      - Create a complete calculation with lower and upper limits

      An `if` is an expression: `if locked then 0 else available`.
      It needs both branches, and their types must agree. Comparisons use
      `==`, `<`, `<=`, `>`, and `>=`; Boolean combinations use `&&`
      and `||`. Notice the distinction between defining with `=` and
      comparing with `==`.

      Guards can express a calculation with several possible results:

      ```haskell
      refund returned damaged
        | damaged = 0
        | returned = 12
        | otherwise = 0
      ```

      Read from the top. The first true guard supplies the result. If both
      Boolean inputs are `True`, the damaged-item rule wins and the refund is 0.
      `otherwise` is the Boolean value `True`, so it provides a final fallback.

      ### Thinking time!

      A storage bin holds at most 10 items. It currently holds 8, and a proposed
      adjustment adds 5. Will the starter's `adjustStock 8 5 10` return 10 or 13?
      Check whether its guards examine the old count or the proposed new count.

      ### Your challenge

      Repair `adjustStock stock change capacity`. First calculate the proposed
      count `stock + change`. Return 0 if that is below 0, return `capacity` if
      it exceeds capacity, and otherwise return the proposed count.

      The capacity is nonnegative; the starting stock is between 0 and capacity.
      The signed change can add or remove items. Every input is an `Int` in the
      small ranges used here. The function returns a new count; it does not
      modify its arguments. Test exact limits as well as crossing each limit.
      Guards or an equivalent nested `if` are both valid.
    files:
    - path: Main.hs
      language: haskell
      reseed: true
      content: |
        module Main where
        adjustStock :: Int -> Int -> Int -> Int
        adjustStock stock change capacity
          | stock < 0 = 0
          | stock > capacity = capacity
          | otherwise = stock + change
        main :: IO ()
        main = print (adjustStock 8 5 10)
    open_file: Main.hs
    run_file: Main.hs
    tests:
    - description: Adjustments respect both capacity limits and preserve valid intermediate counts
      command: adjustStock 8 5 10 == 10 && adjustStock 2 (-5) 10 == 0 && adjustStock 3 4 10 == 7 && adjustStock 3
        (-3) 10 == 0 && adjustStock 3 7 10 == 10 && adjustStock 6 0 10 == 6 && adjustStock 0 4 0 == 0 && adjustStock
        0 (-4) 0 == 0
      hints:
      - text: The starting stock is already valid. Which quantity could fall outside the permitted range?
      - text: Each boundary guard must examine the proposed count after applying the signed change.
      - text: Use the same expression, stock + change, in both comparisons and in the unrestricted result.
    quiz:
      title: Step 3 — Knowledge Check
      min_score: 0.8
      questions:
      - type: single
        difficulty: intermediate
        question: Why can moving an `otherwise` guard to the top change a function's result?
        options:
        - Every later rule runs first
        - It always matches immediately
        - It only matches invalid inputs
        correct_index: 1
        option_feedback:
          0: Guards are considered from top to bottom, not in reverse order.
          2: otherwise has no built-in notion of invalid input; it is True.
        explanation: An unconditional true guard at the top prevents later alternatives from being selected.
      - type: single
        difficulty: intermediate
        question: What is wrong with `if locked then 0 else False`?
        options:
        - The branches have incompatible types
        - The condition needs an integer result
        - The else branch executes before then
        correct_index: 0
        option_feedback:
          1: The condition must be Bool; a Boolean parameter such as locked provides that. The incompatible result
            branches are the problem.
          2: Only the selected branch supplies the value. The problem is the branches' types.
        explanation: One expression must have one consistent type; a numeric result and Bool cannot serve as its alternatives.
    solution:
      files:
      - path: Main.hs
        language: haskell
        content: |
          module Main where
          adjustStock :: Int -> Int -> Int -> Int
          adjustStock stock change capacity
            | stock + change < 0 = 0
            | stock + change > capacity = capacity
            | otherwise = stock + change
          main :: IO ()
          main = print (adjustStock 8 5 10)
      explanation: |
        Each guard checks the proposed count, not the already valid starting
        stock. Counts inside the limits pass through unchanged; attempts to cross
        a limit return that limit. Equality is already valid and needs no adjustment.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf pp. 25–31;
  # supporting div notation: intro_to_functional_programming_and_haskell_v10_handouts.pptx slide 39.
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx P3c — local-binding prerequisite for helper-function reasoning.
  # Pedagogy: worked example with fading — name intermediate values, repair one relation.
  - title: "Local Bindings"
    key: local-bindings
    instructions: |
      ### Why this matters

      A long expression can hide a simple idea. Local names let you explain
      the pieces without turning them into mutable variables.

      ### 🎯 You will learn to

      - Apply `let` and `where` to name intermediate results
      - Analyze a calculation as a set of relationships

      A `let` expression binds names and uses them after `in`:

      ```haskell
      minutesAfter hours minutes =
        let perHour = 60
        in hours * perHour + minutes
      ```

      A `where` clause attaches local definitions to an equation, including
      its guards:

      ```haskell
      minutesAfter hours minutes = hours * perHour + minutes
        where perHour = 60
      ```

      Keep definitions in the same block aligned; indentation is meaningful.
      Both forms can define helper functions as well as data. A helper can
      refer to the surrounding function's parameters. Neither form is a
      sequence of assignments: naming one result does not change another binding.

      This billing rule uses integral division: ``subtotal `div` 4`` means
      divide the nonnegative subtotal by four and discard its fractional
      part. For example, ``35 `div` 4`` is `8`. Backticks let the two-argument
      function appear between its arguments; `div 35 4` means the same thing.

      ### Thinking time!

      Four snacks cost 8 points each. A group order of at least four snacks
      gets a discount of one quarter of the subtotal, rounded down. Delivery
      costs 3 points. Should the total be 24, 27, or 35? Work through each
      named amount, then run the starter and locate the missing relationship.

      ### Your challenge

      Repair `snackBill count unitCost fee` to charge the subtotal minus
      the discount, **plus the fee once**. Inputs are nonnegative integers.
      The discount applies when `count >= 4`; even an empty order retains
      the supplied fee. Keep intermediate names that make the rule readable.

      After the checks pass, rewrite your definition using `let ... in`
      instead of `where` and run the checks again. Explain why moving the
      definitions on the page does not change the answer.
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where
          snackBill :: Int -> Int -> Int -> Int
          snackBill count unitCost fee = subtotal - discount
            where
              subtotal = count * unitCost
              discount = if count >= 4 then subtotal `div` 4 else 0
          main :: IO ()
          main = print (snackBill 4 8 3)
    open_file: Main.hs
    run_file: Main.hs
    tests:
      - description: "Bills apply the group discount at four snacks and add one delivery fee"
        command: "snackBill 4 8 3 == 27 && snackBill 3 8 3 == 27 && snackBill 5 7 2 == 29 && snackBill 0 9 4 == 4 && snackBill 4 0 2 == 2 && snackBill 2 5 0 == 10"
        hints:
          - text: "List the amounts that appear in the specification. Which one never contributes to the starter's result?"
          - text: "The discount applies to snacks; the fee belongs after that discount and is charged once."
          - text: "The final expression combines `subtotal`, `discount`, and `fee`. Check each sign against the rule."
    quiz:
      title: "Step 4 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: |
            What value does this expression produce?

            ```haskell
            let x = 5
                y = x + 2
            in x + y
            ```
          options: ["`12`", "`14`", "`7`"]
          correct_index: 0
          option_feedback:
            1: "Binding y to x + 2 does not change x; x remains 5."
            2: "The expression after in adds both bindings; it does not return only the newest binding."
          explanation: "x denotes 5 and y denotes 7, so their sum is 12. Binding y does not change x."
        - type: single
          difficulty: intermediate
          question: "A local helper needs the enclosing function's parameter. What can it do?"
          options:
            - "Read that parameter directly"
            - "Use only global definitions"
            - "Replace that parameter's value"
          correct_index: 0
          option_feedback:
            1: "Local definitions are in the enclosing lexical scope, so parameters are available."
            2: "Visibility permits reading a binding, not mutating it."
          explanation: "The enclosing parameter is visible to local helpers. Later, returning such a helper will let us explore closures."
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where
            snackBill :: Int -> Int -> Int -> Int
            snackBill count unitCost fee = subtotal - discount + fee
              where
                subtotal = count * unitCost
                discount = if count >= 4 then subtotal `div` 4 else 0
            main :: IO ()
            main = print (snackBill 4 8 3)
      explanation: |
        Local definitions describe the subtotal and discount; the final
        expression combines them with the fee. An equivalent let expression
        changes scope syntax, not the billing rule.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf pp. 34–35, 63, 72–74.
  # Assessment: [Midterm] F23 (Public).pdf P3a p. 6 — tuple/list type-shape prerequisite for extract2nd.
  # Pedagogy: PRIMM — project a field and attach a status, then update a different tuple and derive a type.
  - title: "Tuples and Type Variables"
    key: tuples
    instructions: |
      ### Why this matters

      A score usually belongs to someone. A tuple keeps related values
      together while allowing each position to have its own type.

      ### 🎯 You will learn to

      - Analyze tuple shapes and polymorphic type variables
      - Create a new tuple that preserves one field and changes another

      `("Mina", 40)` has type `(String, Int)` when its score is an `Int`.
      Tuple size and position types are fixed: a pair is different from a
      triple. A tuple parameter is one argument, even though it contains
      several components.

      ```haskell
      markSeen :: (a, b) -> (a, Bool)
      markSeen (value, label) = (value, True)
      ```

      `(value, label)` is a **pattern** that names the two components.
      Lowercase type variables `a` and `b` describe arbitrary types. Reusing
      the same letter requires the same type; different letters permit
      different types but do not require them to differ. Thus `markSeen`
      accepts both `(True, 'x')` and `(3, 4)`, retaining the first field
      and replacing the second with `True`.

      To derive `markSeen`'s type, call the first component's type `a` and
      the second component's type `b`. The parameter pattern needs `(a, b)`;
      the result keeps a value of type `a` and adds a `Bool`. The unused
      label can have any type `b`. Connect the input and result with `->`.

      ### Thinking time!

      The starter defines `original = ("Mina", 40)` and calls `addBonus 5 original`.
      After the repair, should printing `original` give 40 or 45 as its score?
      Commit to an answer before you change the function.

      ### Your challenge

      Implement `addBonus bonus (name, score)` so it returns the same name
      paired with `score + bonus`. Bonuses may be negative. Preserve the
      original pair; creating an updated result does not mutate it.

      Run the starter, repair it, and run again. The supplied `do` block
      sequences two print actions so you can compare the new pair and the
      original. For now, leave that display harness alone.

      Before moving on, explain `(a, a)` versus `(a, b)` without looking back.
      This is a good stopping point: take a break, then recall that distinction
      before starting lists.
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where
          markSeen :: (a, b) -> (a, Bool)
          markSeen (value, label) = (value, True)
          addBonus :: Int -> (String, Int) -> (String, Int)
          addBonus bonus (name, score) = (name, score)
          original :: (String, Int)
          original = ("Mina", 40)
          main :: IO ()
          main = do
            print (addBonus 5 original)
            print original
    open_file: Main.hs
    run_file: Main.hs
    tests:
      - description: "Bonuses change only the returned score and work for arbitrary names and signs"
        command: "addBonus 5 (\"Mina\", 40) == (\"Mina\", 45) && addBonus (-3) (\"Noor\", 12) == (\"Noor\", 9) && addBonus 0 (\"\", 0) == (\"\", 0) && addBonus 8 (\"Kai\", -2) == (\"Kai\", 6) && original == (\"Mina\", 40)"
        hints:
          - text: "The tuple pattern already gives names to the two fields. Which field does the task permit you to change?"
          - text: "Construct a new pair from the unchanged name and the calculated score."
          - text: "The result has the shape `(name, ...)`; combine the old score with the supplied bonus."
    quiz:
      title: "Step 5 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "Which argument fits a parameter of type `(a, a)`?"
          options: ["`(True, 'x')`", "`('x', 'y')`", "`(\"x\", 'x')`"]
          correct_index: 1
          option_feedback:
            0: "Bool and Char cannot instantiate the same type variable in this pair."
            2: "String and Char are different types, even when the string has one character."
          explanation: "Both positions must have the same type. Two Char values meet that requirement."
        - type: single
          difficulty: intermediate
          question: "Recall `remainingTime available used = available - used`. What does `remainingTime 30 (4 * 3)` return?"
          options: ["`78`", "`26`", "`18`"]
          correct_index: 2
          option_feedback:
            0: "That is `(remainingTime 30 4) * 3`, with the multiplication outside the second argument."
            1: "That subtracts only 4. The grouped argument supplies the full product 4 * 3."
          explanation: "The grouped second argument is 12, leaving 18. Parentheses also group a tuple used as one argument."
        - type: single
          difficulty: intermediate
          question: "Which most general type fits `repeatFirst (x, y) = (x, x)`?"
          options:
            - "`(a, a) -> (a, a)`"
            - "`(a, b) -> (a, b)`"
            - "`(a, b) -> (a, a)`"
          correct_index: 2
          option_feedback:
            0: "Nothing compares or combines x with y, so their input types need not agree. This type is unnecessarily restrictive."
            1: "Both output positions contain x; the second result has x's type, not the unrelated type of y."
          explanation: "The input components can have independent types. Reusing x in both output positions requires the same type variable in both."
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where
            markSeen :: (a, b) -> (a, Bool)
            markSeen (value, label) = (value, True)
            addBonus :: Int -> (String, Int) -> (String, Int)
            addBonus bonus (name, score) = (name, score + bonus)
            original :: (String, Int)
            original = ("Mina", 40)
            main :: IO ()
            main = do
              print (addBonus 5 original)
              print original
      explanation: |
        Pattern matching exposes the old components. The result constructs a
        new pair; original remains ("Mina", 40).

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf pp. 35–40, 72–74.
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx P3a–b — shared list element type and cons construction.
  # Pedagogy: contrast — a list of strings versus one string; generalization across element types.
  - title: "Lists and Strings"
    key: lists
    instructions: |
      ### Why this matters

      Lists describe collections whose length can vary. Their element type
      stays consistent, which lets one operation work for songs, numbers, or characters.

      ### 🎯 You will learn to

      - Distinguish cons from list concatenation
      - Apply a polymorphic list transformation to strings and other lists

      `[2, 4, 6]` is a list of numbers; `["tea", "mochi"]` is a list of
      strings. Unlike tuples, every element of one list has the same type.
      `[]` is empty. `String` is another name for `[Char]`: `"hi"` and
      `['h', 'i']` represent the same string.

      `x : xs` puts **one element** at the front of a list.
      `xs ++ ys` joins **two lists**, preserving their order.
      For example, `1 : [2,3]` and `[1] ++ [2,3]` both give `[1,2,3]`.
      `"tea" : ["mochi"]` is a list of strings; `"tea" ++ "mochi"` is one string.

      `take 2 xs` keeps up to the first two items; `drop 2 xs` removes up
      to the first two. `length xs` counts items, `null xs` tests whether
      the list is empty, and ``x `elem` xs`` tests whether it contains `x`.
      `head xs` returns the first item and `tail xs` returns the remaining
      list; both require a nonempty list.
      Enumerations such as `[1..4]` and `[2,4..10]` include the endpoint
      when the step reaches it.

      ### Thinking time!

      What are the lengths of `"tea"`, `["tea"]`, and `[]`? Predict 3/1/0
      or 1/3/0, then use `main` to check. Explain what counts as an element.

      ### Your challenge

      Implement `bookend item items`: place `item` at both ends, preserving
      every existing element in its original order. Empty input still gets
      two copies of the item. The type `[a]` should work for any element type.

      Try `bookend '!' "hi"` and `bookend "intro" ["song"]`. Predict each
      result's type before running. The original input list stays unchanged.
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where
          bookend :: a -> [a] -> [a]
          bookend item items = items
          main :: IO ()
          main = do
            print (length "tea", length ["tea"], length ([] :: [Int]))
            print (bookend '!' "hi")
            print (bookend "intro" ["song"])
    open_file: Main.hs
    run_file: Main.hs
    tests:
      - description: "Bookends preserve the entire list, including the empty and nested-list cases"
        command: "bookend (9 :: Int) [1,2] == [9,1,2,9] && bookend True [] == [True,True] && bookend '!' \"hi\" == \"!hi!\" && bookend \"intro\" [\"song\",\"outro\"] == [\"intro\",\"song\",\"outro\",\"intro\"] && bookend (0 :: Int) [0] == [0,0,0]"
        hints:
          - text: "Treat the supplied item as one element, even when that element is itself a string."
          - text: "Cons adds one element at the front. Concatenation can add a singleton list at the end."
          - text: "Build the result from three pieces: the first item, all the original items, and a list containing the final item."
    quiz:
      title: "Step 6 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "What is the result of `\"a\" : [\"bc\"]`?"
          options: ["`\"abc\"`", "`[\"a\", \"bc\"]`", "`[\"ab\", \"c\"]`"]
          correct_index: 1
          option_feedback:
            0: "Cons adds the whole string as one element. Joining the characters would require string concatenation."
            2: "Cons does not split or redistribute the characters inside existing elements."
          explanation: "The result has two String elements, so its type is [String]."
        - type: single
          difficulty: intermediate
          question: "Which most general type fits `keepWith (x, y) xs = x : xs`?"
          options: ["`(a, b) -> [a] -> [a]`", "`(a, b) -> [b] -> [b]`", "`(a, a) -> [a] -> [a]`"]
          correct_index: 0
          option_feedback:
            1: "The inserted element is x. Its type a must match the list elements; y's type b does not determine them."
            2: "The unused y can have a different type from x. Requiring both tuple components to have type a restricts valid inputs."
          explanation: "The tuple components may differ. Cons connects x's type to both the input list's element type and the result's element type."
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where
            bookend :: a -> [a] -> [a]
            bookend item items = item : (items ++ [item])
            main :: IO ()
            main = do
              print (length "tea", length ["tea"], length ([] :: [Int]))
              print (bookend '!' "hi")
              print (bookend "intro" ["song"])
      explanation: |
        Cons constructs the front; concatenation preserves the middle and adds
        the final singleton. `[item] ++ items ++ [item]` is also correct.
        The element type stays arbitrary because the operation neither
        compares nor calculates with the elements.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf pp. 62–69, 72–74.
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx P3a–b — type consistency and complete list cases.
  # Pedagogy: worked example with fading — replace one list entry, then reconstruct a two-entry prefix.
  - title: Complete List Patterns
    key: swap-front
    instructions: |
      ### Why this matters

      A list might be empty, short, or much longer than your example.
      Patterns expose those shapes directly, so missing cases become easier to spot.

      ### 🎯 You will learn to

      - Analyze exact-length and nonempty-list patterns
      - Reconstruct a list while preserving its remaining elements

      Compare a list's construction with its decomposition. `x : xs`
      constructs a list; the parameter pattern `(x:xs)` extracts its first
      element into `x` and its remaining **list** into `xs`.

      This function replaces an existing first element without adding one to
      an empty list:

      ```haskell
      replaceHead replacement [] = []
      replaceHead replacement (_:rest) = replacement : rest
      ```

      Equations are tried from top to bottom. `[]` matches an empty list,
      `[x]` exactly one element, `[x,y]` exactly two, and `(x:y:rest)` at
      least two. `_` matches a value you do not need to name.

      Derive `replaceHead`'s type before checking its signature in the starter.
      If the input is `[a]`, then rest is also `[a]`. Cons requires replacement
      to have type `a`, and the result is another `[a]`. State how this connects
      the two arguments and result.

      ### Thinking time!

      A waiting list is `["Ada","Bo","Cy"]`. A rule matching `[first,second]`
      will not handle it, but `(first:second:rest)` will. Name all three bindings,
      then predict what `second : first : rest` constructs. The `:` expressions
      build one list whose order starts with second, then first.

      ### Your challenge

      Implement `swapFront values`: exchange the first two elements, preserving
      the full remaining tail in its original order. Empty and singleton lists
      must stay unchanged. The function must work for any element type.

      The starter leaves every list unchanged. Replace that catch-all with
      complete equations. Try an empty list, one item, exactly two items, and a
      longer list. Explain why an exact two-item pattern would miss a valid input.
    files:
    - path: Main.hs
      language: haskell
      reseed: true
      content: |
        module Main where
        replaceHead :: a -> [a] -> [a]
        replaceHead replacement [] = []
        replaceHead replacement (_:rest) = replacement : rest
        swapFront :: [a] -> [a]
        swapFront values = values
        main :: IO ()
        main = print (swapFront ["Ada", "Bo", "Cy"])
    open_file: Main.hs
    run_file: Main.hs
    tests:
    - description: Swap only the first two entries, preserving short inputs, duplicates, and every tail entry
      command: 'swapFront ([] :: [Int]) == [] && swapFront [5 :: Int] == [5] && swapFront [5 :: Int,7] == [7,5] &&
        swapFront [5 :: Int,7,9,11] == [7,5,9,11] && swapFront "abcd" == "bacd" && swapFront ["Ada","Bo","Cy"] ==
        ["Bo","Ada","Cy"] && swapFront [True,True,False] == [True,True,False]'
      hints:
      - text: Separate lists with fewer than two entries from those with at least two.
      - text: A cons pattern can name the first two entries and leave the remaining tail as a list.
      - text: For (x:y:rest), construct the new prefix with y followed by x, then reuse rest. Handle empty and singleton
          lists separately.
    quiz:
      title: Step 7 — Knowledge Check
      min_score: 0.8
      questions:
      - type: single
        difficulty: intermediate
        question: 'After matching `(first:second:rest)` against `[[1],[2,3],[]]`, what does `second : rest` construct?'
        options:
        - '`[2,3]`'
        - '`[[2,3],[]]`'
        - '`[[2,3]]`'
        correct_index: 1
        option_feedback:
          0: second is one list-valued element. Cons places that whole element before rest; it does not flatten it.
          2: rest still contains the final empty list. Reconstructing the list must preserve that element.
        explanation: 'second is [2,3] and rest is [[]]. Cons produces a two-element outer list: [[2,3],[]].'
      - type: single
        difficulty: intermediate
        question: A catch-all equation appears before specific list patterns. Which rule applies?
        options:
        - Haskell chooses the most specific pattern
        - Haskell tries each rule until the last match
        - Haskell chooses the first matching pattern
        correct_index: 2
        option_feedback:
          0: Pattern specificity does not override source order. A catch-all can hide every later equation.
          1: Selection stops at the first matching equation rather than remembering a later match.
        explanation: As with the earlier guard example, place specific cases before an unconditional fallback.
    solution:
      files:
      - path: Main.hs
        language: haskell
        content: |
          module Main where
          replaceHead :: a -> [a] -> [a]
          replaceHead replacement [] = []
          replaceHead replacement (_:rest) = replacement : rest
          swapFront :: [a] -> [a]
          swapFront [] = []
          swapFront [x] = [x]
          swapFront (x:y:rest) = y : x : rest
          main :: IO ()
          main = print (swapFront ["Ada", "Bo", "Cy"])
      explanation: |
        The empty and singleton equations preserve inputs that cannot be swapped.
        The final pattern guarantees two entries; constructing y : x : rest
        exchanges just that prefix and preserves the entire tail.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf pp. 41–45, 63, 67–69.
  # Assessment: [Midterm] F24 V1 (Public).pdf P1 p. 2 — keep counting after a nonmatching element;
  # CS131 Fall 25 Quiz 1 v2.docx P3b — base case and recursion on the list tail.
  # Pedagogy: worked recursion example, trace prediction, then independent modification.
  - title: "Structural Recursion"
    key: recursion
    instructions: |
      ### Why this matters

      You already know how to process one item. Recursion connects that
      small decision to the rest of a collection, without a loop counter to mutate.

      ### 🎯 You will learn to

      - Analyze the base case and progress of a recursive definition
      - Create a list reduction from a per-element decision

      Here is a complete function that joins several rows, preserving their order:

      ```haskell
      joinRows [] = []
      joinRows (row:rows) = row ++ joinRows rows
      ```

      The empty outer list supplies an empty result immediately. The nonempty
      case joins its first row to the result for **fewer rows**.
      For `[[4],[],[2,3]]`, expand `[4] ++ joinRows [[],[2,3]]`, then
      `[4] ++ ([] ++ ([2,3] ++ joinRows []))`, producing `[4,2,3]`.
      An empty row contributes nothing but does not stop the recursion.
      Each call has its own parameter bindings.

      ### Thinking time!

      Suppose `joinRows` used `[0]` as its base result instead of `[]`.
      Would `joinRows [[4],[],[2,3]]` produce `[4,2,3]` or `[4,2,3,0]`?
      Explain where the extra element enters the result before running.

      ### Your challenge

      Implement `countAtLeast threshold scores`: count every score greater
      than or equal to the threshold, including repeated scores. Return
      zero for an empty list. Scores and the threshold can be negative.

      Run the starter, which currently reports zero for every input.
      Use the same smaller-input structure, but calculate a count: decide
      whether the first score contributes zero or one, then add the tail's count. Recursion
      is the practice focus; any behaviorally equivalent implementation passes.

      Before testing, trace `[60,59,60]` with threshold 60. Name the input
      that gets smaller and the value supplied by the base case. If a
      program keeps running, use **Stop**, then check whether the recursive
      call receives the tail rather than the original list.
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where
          joinRows :: [[Int]] -> [Int]
          joinRows [] = []
          joinRows (row:rows) = row ++ joinRows rows
          countAtLeast :: Int -> [Int] -> Int
          countAtLeast threshold scores = 0
          main :: IO ()
          main = print (countAtLeast 60 [60, 59, 60])
    open_file: Main.hs
    run_file: Main.hs
    tests:
      - description: "Counts include equality, duplicates, negatives, all-match, and no-match cases"
        command: "countAtLeast 60 [] == 0 && countAtLeast 60 [59] == 0 && countAtLeast 60 [60] == 1 && countAtLeast 60 [60,59,60] == 2 && countAtLeast (-2) [-3,-2,0,-2] == 3 && countAtLeast 0 [0,1,2] == 3 && countAtLeast 9 [1,2,3] == 0"
        hints:
          - text: "Decide the answer for no scores before considering the first score of a nonempty list."
          - text: "One score contributes either zero or one. The remaining count comes from the tail using the same threshold."
          - text: "Use the shape `countAtLeast threshold (x:xs) = contribution + countAtLeast threshold xs`; define contribution from the comparison."
    quiz:
      title: "Step 8 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: |
            This counter should count every value at least 5. What belongs
            in the blank so a smaller value does not hide later matches?

            ```haskell
            countHits :: [Int] -> Int
            countHits [] = 0
            countHits (x:xs)
              | x >= 5 = 1 + countHits xs
              | otherwise = ______
            ```
          options:
            - "`countHits xs`"
            - "`0`"
            - "`countHits (x:xs)`"
          correct_index: 0
          option_feedback:
            1: "Returning zero stops here. On [4,5], it would lose the later qualifying 5."
            2: "The call receives the same input, so it repeatedly encounters the same nonmatching head and never reaches the base case."
          explanation: "The head contributes zero, but the tail still needs processing. On [4,5], the result is countHits [5] = 1."
        - type: single
          difficulty: intermediate
          question: "A counter uses `x > threshold`. Which input best reveals the missing equality case?"
          options:
            - "`threshold = 5`, `scores = [6]`"
            - "`threshold = 5`, `scores = [5]`"
            - "`threshold = 5`, `scores = [4]`"
          correct_index: 1
          option_feedback:
            0: "Both > and >= accept 6, so that input cannot distinguish the rules."
            2: "Both > and >= reject 4. The disagreement is exactly on the boundary."
          explanation: "At equality, the required >= rule counts one while > counts zero. This reuses the guard-boundary strategy."
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where
            joinRows :: [[Int]] -> [Int]
            joinRows [] = []
            joinRows (row:rows) = row ++ joinRows rows
            countAtLeast :: Int -> [Int] -> Int
            countAtLeast threshold [] = 0
            countAtLeast threshold (x:xs) = contribution + countAtLeast threshold xs
              where contribution = if x >= threshold then 1 else 0
            main :: IO ()
            main = print (countAtLeast 60 [60, 59, 60])
      explanation: |
        The empty list contributes zero. Each score contributes one precisely
        when it meets the threshold, and the recursive call handles every
        remaining occurrence. The comparison includes equality.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf pp. 38, 48–56.
  # Assessment: preparatory list construction for [Midterm] F23 (Public).pdf P3 pp. 6–7;
  # comprehensions themselves are not a direct requirement of that map/filter/fold task family.
  # Pedagogy: PRIMM — combine heterogeneous supplied collections with independent validity rules.
  - title: List Comprehensions
    key: route-candidates
    instructions: |
      ### Why this matters

      Sometimes a collection is easiest to describe by the candidates you
      allow. A comprehension names those candidates, filters them, and builds a result.

      ### 🎯 You will learn to

      - Analyze generator order and inclusive numeric ranges
      - Create structured results from two supplied collections

      ```haskell
      [(label, length label) | label <- ["oak", "", "pine"], length label > 0]
      ```

      Read it as: visit each label, keep the nonempty ones, and pair each with
      its length. The answer is `[("oak",3),("pine",4)]`. `<-` introduces a
      generator; a Boolean qualifier filters candidates. The expression before
      `|` constructs each output element.

      With two generators, the right one varies fastest:
      `[(flag,label) | flag <- [True,False], label <- ["r","s"]]` produces
      `[(True,"r"),(True,"s"),(False,"r"),(False,"s")]`.
      The result enumerates combinations rather than pairing list positions.

      ### Thinking time!

      A later generator can use an earlier value. Predict
      `[(word,c) | word <- ["go","!"], c <- word]`.
      Remember that a String is a list of characters. How many pairs does each
      word contribute, and what is each pair's second-component type?
      Print the expression to compare with your prediction.

      ### Your challenge

      Implement `routeCandidates routes platforms` for a dispatch board.
      Every nonempty route name can use every positive platform number. Return
      a `(platform, route)` pair for each permitted combination. Visit routes
      in their input order; for each route, visit platforms in their input order.
      Keep repeated entries if the inputs contain them. Do not sort either input.

      For example, `routeCandidates ["Cedar","","Bay"] [3,0,1]` is
      `[(3,"Cedar"),(1,"Cedar"),(3,"Bay"),(1,"Bay")]`.
      Either empty input produces no combinations.

      The starter forms every combination, including invalid ones. Repair its
      qualifiers. `length route > 0` identifies a nonempty route; the other rule
      concerns the platform number. Comprehensions are the practice focus;
      equivalent recursive solutions are accepted. Explain which part determines
      tuple shape, which determines order, and which removes invalid candidates.
    files:
    - path: Main.hs
      language: haskell
      reseed: true
      content: |
        module Main where
        routeCandidates :: [String] -> [Int] -> [(Int, String)]
        routeCandidates routes platforms = [(platform,route) | route <- routes, platform <- platforms]
        main :: IO ()
        main = print (routeCandidates ["Cedar","","Bay"] [3,0,1])
    open_file: Main.hs
    run_file: Main.hs
    tests:
    - description: Candidates filter both inputs while preserving route-first order and repeated entries
      command: routeCandidates ["Cedar","","Bay"] [3,0,1] == [(3,"Cedar"),(1,"Cedar"),(3,"Bay"),(1,"Bay")] && routeCandidates
        [] [1,2] == [] && routeCandidates ["Bay"] [] == [] && routeCandidates ["","Bay"] [-2,0] == [] && routeCandidates
        [""] [4] == [] && routeCandidates ["Bay","Bay"] [2,2] == [(2,"Bay"),(2,"Bay"),(2,"Bay"),(2,"Bay")] && routeCandidates
        ["Zoo","Ash"] [5,2] == [(5,"Zoo"),(2,"Zoo"),(5,"Ash"),(2,"Ash")]
      hints:
      - text: Identify one invalid route and one invalid platform that appear in the starter result.
      - text: Use a separate Boolean qualifier for each input rule. Keep the generator order so every platform is
          considered for one route before the next route.
      - text: After the two generators, require length route > 0 and platform > 0. Keep (platform,route) as the result
          expression.
    quiz:
      title: Step 9 — Knowledge Check
      min_score: 0.8
      questions:
      - type: single
        difficulty: intermediate
        question: What does `[(n,n-1) | n <- [2,4..8], n > 4]` produce?
        options:
        - '`[(6,5),(8,7)]`'
        - '`[(6,5)]`'
        - '`[(5,4),(6,5),(7,6),(8,7)]`'
        correct_index: 0
        option_feedback:
          1: The endpoint is included when the arithmetic step reaches it; this sequence reaches 8.
          2: The first two range values set a step of 2. The generator never produces 5 or 7.
        explanation: The generator gives 2, 4, 6, 8. The qualifier retains 6 and 8, then each becomes a pair with
          its predecessor.
      - type: single
        difficulty: intermediate
        question: Which result describes `[(name,flag) | flag <- [True,False], name <- ["A","B"]]`?
        options:
        - '`[("A",True),("B",False)]`'
        - '`[("A",True),("B",True),("A",False),("B",False)]`'
        - '`[("A",True),("A",False),("B",True),("B",False)]`'
        correct_index: 1
        option_feedback:
          0: Two generators enumerate all combinations; they do not pair corresponding positions.
          2: The rightmost generator varies fastest, so both names are produced for True before moving to False.
        explanation: The result expression controls the order inside each tuple, but the generators control the order
          of tuples. For each flag, visit every name.
    solution:
      files:
      - path: Main.hs
        language: haskell
        content: |
          module Main where
          routeCandidates :: [String] -> [Int] -> [(Int, String)]
          routeCandidates routes platforms = [(platform,route) | route <- routes, platform <- platforms, length route > 0, platform > 0]
          main :: IO ()
          main = print (routeCandidates ["Cedar","","Bay"] [3,0,1])
      explanation: |
        The two qualifiers remove empty route names and nonpositive platform
        numbers. The outer route generator sets route-first order even though the
        result tuple puts the platform first. Empty inputs supply no combinations;
        repeated inputs legitimately create repeated output entries.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf pp. 67–69.
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx P3b — distinguish stopping cases and update a numeric parameter while consuming the tail.
  # Pedagogy: Make — faded, independent transfer; retrieval of guards, patterns, and recursion.
  - title: "The Snack Budget Challenge"
    key: budget
    instructions: |
      ### Why this matters

      A technique is useful when you can recognize when to use it.
      This challenge combines the pieces without giving you the next line to write.

      ### 🎯 You will learn to

      - Create a recursive solution from a behavioral specification
      - Evaluate a stopping rule using contrasting inputs

      ### Your challenge

      Implement `takeBudget budget costs`. Walk the snack prices in the
      given order and return the longest **prefix** you can afford in total.
      Once the next snack costs more than the remaining budget, stop.
      Do not skip it to buy cheaper snacks later. Budgets and prices are
      nonnegative integers, and free snacks are allowed.

      Examples of the specification:

      - `takeBudget 7 [3,4,1]` gives `[3,4]`.
      - `takeBudget 5 [6,1,1]` gives `[]`.
      - `takeBudget 0 [0,0,2]` gives `[0,0]`.

      ### Thinking time!

      Before editing, predict `takeBudget 5 [2,4,1]`. Choose `[2]`, `[2,1]`,
      or `[2,4]`, and justify it from the word **prefix**. Run the starter
      to see which tempting but incomplete strategy it currently follows.

      Write your own plan as three cases: empty input, an affordable first
      snack, and an unaffordable first snack. Decide what information the
      smaller recursive problem needs. Then implement and test your plan.
      You may use helpers or library functions; the checks measure the stated
      behavior. Resist reading a solution before you have tried a complete plan.

      ### A short return visit

      Tomorrow, recreate this function without looking at today's code.
      Then explain why its stopping rule differs from selecting every
      individually cheap snack. If you study with someone, exchange one
      input that would expose the other's likely bug and explain it.

      Continue with [Part 2: Functions and Laziness](/SEBook/tools/haskell-functions-tutorial).
      It turns recurring list patterns into reusable higher-order functions.
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where
          takeBudget :: Int -> [Int] -> [Int]
          takeBudget budget costs = [cost | cost <- costs, cost <= budget]
          main :: IO ()
          main = print (takeBudget 5 [2,4,1])
    open_file: Main.hs
    run_file: Main.hs
    tests:
      - description: "Selection tracks the remaining total and stops at the first unaffordable snack"
        command: "takeBudget 7 [3,4,1] == [3,4] && takeBudget 5 [2,4,1] == [2] && takeBudget 5 [6,1,1] == [] && takeBudget 20 [3,4,1] == [3,4,1] && takeBudget 4 [2,2,2] == [2,2]"
        hints:
          - text: "Distinguish an affordable prefix from a filter that inspects each price against the original budget."
          - text: "After buying one snack, solve the tail with the remaining budget. On an unaffordable snack, return immediately."
          - text: "Separate `[]` from `(cost:rest)`. In the affordable case, cons cost onto the result of a smaller-budget call."
      - description: "Empty input and free snacks behave correctly even at a zero budget"
        command: "takeBudget 5 [] == [] && takeBudget 0 [] == [] && takeBudget 0 [0,0,2] == [0,0] && takeBudget 2 [2,0,0,1] == [2,0,0] && takeBudget 0 [1,0] == []"
        hints:
          - text: "An empty budget and an empty list are different conditions. Can a zero-priced item still be afforded?"
          - text: "Compare the next cost with the budget before deciding to stop; equality is affordable."
          - text: "Use empty input as the unconditional base case. Let the price comparison handle zero budgets."
    quiz:
      title: "Step 10 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: advanced
          question: "Why does testing `takeBudget 8 [3,4]` alone miss a function that checks each price against 8?"
          options:
            - "Both strategies buy every item in that input"
            - "The correct strategy reverses this input list"
            - "The input has the wrong numeric element type"
          correct_index: 0
          option_feedback:
            1: "The specification preserves order. Reversing would be a separate defect."
            2: "The input has the required type; the issue is that it does not distinguish the two strategies."
          explanation: "Both items cost at most 8 and their total is only 7. Use an input whose total exceeds the budget to separate the strategies."
        - type: single
          difficulty: intermediate
          question: "What must remain true after accepting the first cost?"
          options:
            - "The tail receives the original budget"
            - "The input list is changed in place"
            - "The tail receives the unspent budget"
          correct_index: 2
          option_feedback:
            0: "Reusing the original budget can spend the same points more than once."
            1: "The function builds a new result. Recursion does not require changing the input list."
          explanation: "Passing the remaining budget carries the needed information into the smaller problem."
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where
            takeBudget :: Int -> [Int] -> [Int]
            takeBudget budget [] = []
            takeBudget budget (cost:rest)
              | cost <= budget = cost : takeBudget (budget - cost) rest
              | otherwise = []
            main :: IO ()
            main = print (takeBudget 5 [2,4,1])
      explanation: |
        Empty input gives an empty prefix. Buying an affordable snack reduces
        the budget for the recursive tail. An unaffordable snack ends the
        prefix immediately, so later cheap items cannot sneak into the result.
        A zero budget can still buy a zero-priced snack.
