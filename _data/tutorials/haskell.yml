        - condition: "code_matches: /^(?=[\\s\\S]*(?:^|\\n)snackBill\\b(?![ \\t]*::)[^\\n]*(?:=|\\n[ \\t]+\\|))(?![\\s\\S]*(?:(?:^|\\n)snackBill\\b[^\\n]*=\\s*(?:\\(\\s*)*0(?:\\s*\\))*[ \\t]*(?:\\n|$)|(?:^|\\n)snackBill\\b(?:[ \\t]+[a-z_][\\w']*)*[ \\t]*=\\s*(?:\\(\\s*)*(?:undefined|_|error[ \\t]+\"[^\"\\n]*\")(?:\\s*\\))*[ \\t]*(?:\\n|$)))(?=[\\s\\S]*(?:^|\\n)snackBill\\b(?![ \\t]*::)(?:(?!\\n\\S)[\\s\\S])*?\\bdiscount[ \\t]*=[ \\t]*0(?:[ \\t]*\\n|$))[\\s\\S]*$/"
