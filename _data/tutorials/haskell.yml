      explanation: |
        Pattern matching exposes the old components. The result constructs a
        new pair; original remains ("Mina", 40).

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf pp. 35–40, 72–74.
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx P3a–b — shared list element type and cons construction.
  # Pedagogy: diagnose element/list confusion, then construct the entire polymorphic list result.
  - title: "Lists and Strings"
    key: lists
    instructions: |
      ### Why this matters

      **One list model works across many kinds of data**, from a playlist of
      songs to the characters in a message. Building new lists while preserving
      the originals lets you reuse transformations without changing data
      another part of the program still needs.

      ### 🎯 You will learn to

      - Distinguish cons from list concatenation
      - Apply a polymorphic list transformation to strings and other lists

      The snack-run list is `["tea", "mochi"]`: two strings, two things to
      pick up. `[2, 4, 6]` is a list of numbers.

      - **Same element type:** unlike tuples, every element of one list has the same type.
      - **Empty list:** `[]` is empty.
      - **Strings are lists:** `String` is another name for `[Char]`; `"hi"` and
        `['h', 'i']` represent the same string.

      Two ways to build lists:

      - `x : xs` puts **one element** at the front of a list.
        For example, `1 : [2,3]` gives `[1,2,3]`.
      - `xs ++ ys` joins **two lists**, preserving their order.
        For example, `[1] ++ [2,3]` also gives `[1,2,3]`.

      Compare the result types: `"tea" : ["mochi"]` is a list of strings;
      `"tea" ++ "mochi"` is one string.

      Useful list operations:

      - `take 2 xs` keeps up to the first two items; `drop 2 xs` removes up
        to the first two.
      - `length xs` counts items; `null xs` tests whether the list is empty.
      - ``x `elem` xs`` tests whether the list contains `x`.
      - `head xs` returns the first item; `tail xs` returns the remaining
        list. **Both require a nonempty list.**
      - Enumerations such as `[1..4]` and `[2,4..10]` include the endpoint
        when the step reaches it.

      ### Thinking time! Diagnose the element type

      Your snack-list app must count **items, not letters**.

      1. Predict the lengths of `"tea"`, `["tea"]`, and `[]`.
      2. Explain what counts as one element in each case.

      A teammate tries to put one opening clip onto a playlist:

      ```haskell
      addOpening :: String -> [String] -> [String]
      addOpening clip clips = clip ++ clips
      ```

      Identify the types on both sides of `++`. Should this compile, or does it
      confuse a clip's characters with the playlist's elements? Write a corrected
      definition that keeps the supplied type signature, then predict the result
      of `addOpening "intro" ["song"]`.
      Explain your correction in terms of **one element versus a list of elements**,
      not just which operator changed.

      Make your prediction, then click **Show answer and explanation** to
      compare your reasoning.

      <details markdown="1">
      <summary>Show answer and explanation</summary>

      **The lengths are `3`, `1`, and `0`.** `"tea"` contains three `Char`
      elements; `["tea"]` contains one `String` element; `[]` contains none.

      The proposed `addOpening` does **not** compile. Its left operand,
      `clip`, has type `String` (`[Char]`), while `clips` has type `[String]`
      (`[[Char]]`). Both operands of `++` must be lists with the same
      element type.

      One corrected definition is:

      ```haskell
      addOpening clip clips = clip : clips
      ```

      Here `clip` is one element of a list of strings. Another valid form
      is `addOpening clip clips = [clip] ++ clips`: `[clip]` and `clips`
      are both lists of strings. Either gives `["intro","song"]` for the
      sample call.

      </details>


      ### Your challenge: construct the complete result

      Now write `bookend item items` yourself, starting from its type and contract:

      - Place `item` at **both ends**.
      - Preserve every existing element in its original order.
      - Give empty input **two copies** of the item.
      - Work for **any element type**, including an element that is itself a list.
      - Leave the original input unchanged.

      The starter's `[]` is only a **placeholder**. Replace the entire equation
      with your definition; no construction steps are supplied this time.

      Before running, predict the **value and type** of each result:

      - `bookend '!' "hi"` — matching punctuation around a message.
      - `bookend "intro" ["song"]` — matching opening and closing clips.
      - An empty-input example of your own.

      Run your examples and the checks. Explain why the same definition handles
      both characters and whole strings without changing either input type.
    files:
    - path: Main.hs
      language: haskell
      reseed: true
      content: |
        module Main where
        bookend :: a -> [a] -> [a]
        -- TODO: replace this placeholder with your complete definition.
        bookend item items = []
        main :: IO ()
        main = do
          print (length "tea", length ["tea"], length ([] :: [Int]))
          print (bookend '!' "hi")
          print (bookend "intro" ["song"])
    open_file: Main.hs
    run_file: Main.hs
    tests:
      - description: "Bookends cover ordering, empty inputs, and nested elements"
        command: "bookend (9 :: Int) [1,2] == [9,1,2,9] && bookend True [] == [True,True] && bookend '!' \"hi\" == \"!hi!\" && bookend \"intro\" [\"song\",\"outro\"] == [\"intro\",\"song\",\"outro\",\"intro\"] && bookend (0 :: Int) [0] == [0,0,0]"
        hints:
          # Stages: empty placeholder; concatenation treats item as a list; other outer-list constructions.
