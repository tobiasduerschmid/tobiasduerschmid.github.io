          text: "A longer-input equation can start `swapFront (first:second:rest) = ...`. Decide how those pieces belong in the result and choose separate coverage for the short inputs."
    - description: "Front swaps retain element-type flexibility"
      command: >-
        let result = swapFront [(+1) :: Int -> Int, (*2), (\x -> x - 1)] in
        length result == 3 && head result 3 == 6 && head (tail result) 3 == 4 && head (drop 2 result) 3 == 2
      hints:
        # Stages: empty placeholder; value comparison/constraint; other element-type restrictions.
        - condition: "code_matches: /^(?:(?![\\s\\S]*(?:^|\\n)swapFront\\b(?![ \\t]*::)[^\\n]*(?:=|\\n[ \\t]+\\|))|(?=[\\s\\S]*(?:(?:^|\\n)swapFront\\b[ \\t]+[a-z_][\\w']*[ \\t]*=\\s*(?:\\(\\s*)*\\[\\](?:\\s*\\))*[ \\t]*(?:\\n|$)|(?:^|\\n)swapFront\\b(?:[ \\t]+[a-z_][\\w']*)*[ \\t]*=\\s*(?:\\(\\s*)*(?:undefined|_|error[ \\t]+\"[^\"\\n]*\")(?:\\s*\\))*[ \\t]*(?:\\n|$))))[\\s\\S]*$/"
          text: "This check uses function-valued elements. First replace the placeholder with a positional reconstruction, then ask whether any decision inspects an element value."
        - condition: "code_matches: /^(?=[\\s\\S]*(?:^|\\n)swapFront\\b(?![ \\t]*::)[^\\n]*(?:=|\\n[ \\t]+\\|))(?![\\s\\S]*(?:(?:^|\\n)swapFront\\b[ \\t]+[a-z_][\\w']*[ \\t]*=\\s*(?:\\(\\s*)*\\[\\](?:\\s*\\))*[ \\t]*(?:\\n|$)|(?:^|\\n)swapFront\\b(?:[ \\t]+[a-z_][\\w']*)*[ \\t]*=\\s*(?:\\(\\s*)*(?:undefined|_|error[ \\t]+\"[^\"\\n]*\")(?:\\s*\\))*[ \\t]*(?:\\n|$)))(?=[\\s\\S]*(?:(?:^|\\n)swapFront\\b(?![ \\t]*::)(?:(?!\\n\\S)[\\s\\S])*?(?:==|/=|<=|>=|(?<![-<$])>(?![=>])|(?<![<$])<(?![=>$]))|(?:^|\\n)swapFront\\b[ \\t]*::[^\\n]*\\b(?:Eq|Ord)\\b))[\\s\\S]*$/"
          text: "An equality or ordering requirement can come from a comparison even when numeric examples pass. Trace the comparison back to the output-position choice it controls."
        - condition: "code_matches: /^(?=[\\s\\S]*(?:^|\\n)swapFront\\b(?![ \\t]*::)[^\\n]*(?:=|\\n[ \\t]+\\|))(?![\\s\\S]*(?:(?:^|\\n)swapFront\\b[ \\t]+[a-z_][\\w']*[ \\t]*=\\s*(?:\\(\\s*)*\\[\\](?:\\s*\\))*[ \\t]*(?:\\n|$)|(?:^|\\n)swapFront\\b(?:[ \\t]+[a-z_][\\w']*)*[ \\t]*=\\s*(?:\\(\\s*)*(?:undefined|_|error[ \\t]+\"[^\"\\n]*\")(?:\\s*\\))*[ \\t]*(?:\\n|$)))(?![\\s\\S]*(?:(?:^|\\n)swapFront\\b(?![ \\t]*::)(?:(?!\\n\\S)[\\s\\S])*?(?:==|/=|<=|>=|(?<![-<$])>(?![=>])|(?<![<$])<(?![=>$]))|(?:^|\\n)swapFront\\b[ \\t]*::[^\\n]*\\b(?:Eq|Ord)\\b))[\\s\\S]*$/"
          text: "If no value-based decision remains, trace the result positions with function-valued elements. Sketch a list pattern and result using the same element type throughout, and inspect the declaration for a restriction. Check equal leading values alongside two distinct ones without inspecting their contents."
    quiz:
      title: Step 7 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
        - type: single
          difficulty: intermediate
          bloom: apply
          question: "A row-editing tool matches `(first:second:rest)` against `[[1],[2,3],[]]` and keeps `second : rest`. Predict the retained rows, including empty ones."
          options:
