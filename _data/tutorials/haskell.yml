        - condition: "code_matches: /^(?=[\\s\\S]*(?:^|\\n)routeCandidates\\b(?![ \\t]*::)[^\\n]*(?:=|\\n[ \\t]+\\|))(?![\\s\\S]*(?:(?:^|\\n)routeCandidates\\b[ \\t]+[a-z_][\\w']*[ \\t]+[a-z_][\\w']*[ \\t]*=\\s*(?:\\(\\s*)*\\[\\](?:\\s*\\))*[ \\t]*(?:\\n|$)|(?:^|\\n)routeCandidates\\b(?:[ \\t]+[a-z_][\\w']*)*[ \\t]*=\\s*(?:\\(\\s*)*(?:undefined|_|error[ \\t]+\"[^\"\\n]*\")(?:\\s*\\))*[ \\t]*(?:\\n|$)))(?=[\\s\\S]*(?:^|\\n)routeCandidates\\b(?![ \\t]*::)(?:(?!\\n\\S)[\\s\\S])*?<-[ \\t]*platforms\\b(?:(?!\\n\\S)[\\s\\S])*<-[ \\t]*routes\\b)[\\s\\S]*$/"
          text: "Trace a two-route, two-platform input by hand. Record the order of candidates separately from the order of fields inside each result pair."
        - condition: "code_matches: /^(?=[\\s\\S]*(?:^|\\n)routeCandidates\\b(?![ \\t]*::)[^\\n]*(?:=|\\n[ \\t]+\\|))(?![\\s\\S]*(?:(?:^|\\n)routeCandidates\\b[ \\t]+[a-z_][\\w']*[ \\t]+[a-z_][\\w']*[ \\t]*=\\s*(?:\\(\\s*)*\\[\\](?:\\s*\\))*[ \\t]*(?:\\n|$)|(?:^|\\n)routeCandidates\\b(?:[ \\t]+[a-z_][\\w']*)*[ \\t]*=\\s*(?:\\(\\s*)*(?:undefined|_|error[ \\t]+\"[^\"\\n]*\")(?:\\s*\\))*[ \\t]*(?:\\n|$)))(?![\\s\\S]*(?:^|\\n)routeCandidates\\b(?![ \\t]*::)(?:(?!\\n\\S)[\\s\\S])*?<-[ \\t]*platforms\\b(?:(?!\\n\\S)[\\s\\S])*<-[ \\t]*routes\\b)[\\s\\S]*$/"
          text: "Use `[<result> | <outer generator>, <inner generator>, <qualifiers>]` as a planning scaffold. Fill the roles from your trace and validity rules, then test one empty input and one invalid entry; the labels are not Haskell syntax."
    quiz:
      title: Step 9 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
        - type: single
          difficulty: intermediate
          bloom: analyze
          question: |
            A timetable should list both slots for each room before moving to the next room. Write the first two results before deciding whether this comprehension meets that requirement.

            ```haskell
            [(room,slot) | slot <- [1,2], room <- ["A","B"]]
            ```
          options:
            - "Yes: the tuple puts `room` first, so rooms determine the order."
            - "No: the first two results are `(\"A\",1)` and `(\"B\",1)`."
            - "No: it pairs positions and produces only `(\"A\",1)` and `(\"B\",2)`."
          correct_index: 1
          option_feedback:
            0: The output tuple controls each item’s shape, not the order in which generators visit values.
            2: Two generators enumerate combinations rather than pairing matching positions.
          explanation: The right generator varies fastest, so both rooms appear for slot 1 before slot 2. Put the room generator first to meet the required room-by-room ordering without changing the tuple shape.
        - type: single
          difficulty: intermediate
          bloom: analyze
          question: A scheduling helper uses `[2,4..limit]`. A refactoring uses `[2,4..limit-1]`, claiming to produce the same slots. Which pair of limits tests both an endpoint that should be included and an upper bound that is not reached? Predict both original lists before choosing.
          options:
            - "`limit = 6` and `limit = 8`"
            - "`limit = 7` and `limit = 8`"
            - "`limit = 7` and `limit = 9`"
          correct_index: 1
          option_feedback:
            0: Both endpoints are reached by steps of two. These tests expose the missing endpoint but do not check an upper bound between generated values.
            2: Neither endpoint is reached by steps of two, so both versions return the same lists. These tests miss the omitted-even-endpoint bug.
          explanation: "The original gives [2,4,6] for limit 7 and [2,4,6,8] for limit 8. The refactoring drops 8 from the second result: a range already stops before exceeding its bound, and includes the bound when its step reaches it."
    solution:
      files:
      - path: Main.hs
        language: haskell
        content: |
          module Main where
          routeCandidates :: [String] -> [Int] -> [(Int, String)]
          routeCandidates routes platforms = [(platform,route) | route <- routes, platform <- platforms, length route > 0, platform > 0]
          main :: IO ()
          main = print (routeCandidates ["Cedar","","Bay"] [3,0,1])
      explanation: |
        The two qualifiers remove empty route names and nonpositive platform
        numbers. The outer route generator sets route-first order even though the
        result tuple puts the platform first. Empty inputs supply no combinations;
        repeated inputs legitimately create repeated output entries.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf pp. 67–69.
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx P3b — distinguish stopping cases and update a numeric parameter while consuming the tail.
  # Pedagogy: independent integration; learner plans cases, writes the function, and creates a test.
  - title: "The Snack Budget Challenge"
    key: budget
    instructions: |
      ### Why this matters

      Real tasks combine decisions about **what to keep, when to stop, and what
      information to carry forward**. Turning an ordered snack wishlist into an
      affordable prefix brings together guards, list patterns, and recursion,
      an approach you can reuse whenever earlier choices affect what is possible next.

      ### 🎯 You will learn to

      - Create a recursive solution from a behavioral specification
      - Evaluate a stopping rule using contrasting inputs

      ### Your challenge

      The group chat has ranked its movie-night snacks. How far down the
      wishlist will the shared budget stretch? Write `takeBudget budget costs`.

      - Walk the snack prices **in the given order** and return the longest
        **prefix** you can afford in total.
      - **Stop** once the next snack costs more than the remaining budget.
        Do not skip it to buy cheaper snacks later.
      - Budgets and prices are **nonnegative integers**, and free snacks are allowed.

      Examples of the specification:

      - `takeBudget 7 [3,4,1]` gives `[3,4]`: the first two snacks use the whole budget.
      - `takeBudget 5 [6,1,1]` gives `[]`: the top-priority snack is already too expensive.
      - `takeBudget 0 [0,0,2]` gives `[0,0]`: free samples still fit an empty budget.

      ### Thinking time!

      1. **Before editing**, predict `takeBudget 5 [2,4,1]`. Choose `[2]`, `[2,1]`,
         or `[2,4]`, and justify it from the word **prefix**.
      2. Explain why checking each individual price against the original budget
         could disagree with the specification. Invent one more input that
         would reveal that difference.

      Make a short plan in your own words:

      - What situations must your function distinguish?
      - What information would a smaller version of this problem need?
      - Which example would show that your stopping rule is wrong?

      Make your prediction, then click **Show answer and explanation** to
      compare your reasoning.

      <details markdown="1">
      <summary>Show answer and explanation</summary>

      **The required result is `[2]`.** After buying the first snack,
      3 remains. The next price, 4, does not fit, so processing stops.
      `[2,1]` skips an item and is not a prefix; `[2,4]` costs more than 5.
      The unchanged starter returns `[]` because it is a placeholder.

      Checking prices independently against the original budget can
      overspend and ignore the stopping rule. For example,
      `takeBudget 5 [3,3]` must return `[3]`, even though each price is
      individually at most 5.

      A suitable plan distinguishes an empty wishlist, an unaffordable
      next item, and an affordable next item. In the last case, keep that
      item and solve the smaller problem using the remaining budget and
      remaining prices. Stop at the first unaffordable item. Free items
      still fit when the remaining budget is zero.

      </details>

      ### Your implementation

      **This time you design the complete function.** The starter supplies its
      type and a display harness. The `[]` result is an unfinished placeholder;
      replace the whole equation with your implementation.

      Implement your plan, then run your own examples and the supplied checks.
      You may use helpers or library functions; the checks measure the stated
      behavior. **Try a complete plan before opening hints or a solution.**

      ### A short return visit

      Tomorrow:

      1. Recreate this function **without looking at today's code**.
      2. Explain why its stopping rule differs from selecting every individually cheap snack.
      3. If you study with someone, exchange one input that would expose the other's
         likely bug and explain it.

      Continue with [Part 2: Functions and Laziness](/SEBook/tools/haskell-functions-tutorial).
      It turns recurring list patterns into reusable higher-order functions.
