    quiz:
      title: Step 10 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
        - type: single
          difficulty: intermediate
          bloom: analyze
          question: "`takeBudget` must take an affordable prefix and stop at the first unaffordable item. For budget 6 and prices `[4,3,1]`, compare that rule with skipping unaffordable items and with checking every price against the original budget. Work out each result before reading the options."
          options:
            - "Prefix: `[4]`; skip: `[4,1]`; original budget: `[4,3,1]`."
            - "Prefix: `[4,1]`; skip: `[4]`; original budget: `[4,3,1]`."
            - "Prefix: `[4]`; skip: `[4,1]`; original budget: `[4,1]`."
          correct_index: 0
          option_feedback:
            1: A prefix cannot omit the middle item and then resume. That is the skip strategy.
            2: Each individual price is at most 6, so comparing each with the original budget accepts all three and overspends.
          explanation: After spending 4, only 2 remains; the required strategy stops at price 3. Each alternative may suit a different task, but only the prefix rule preserves this wishlist’s stated priority.
        - type: single
          difficulty: intermediate
          bloom: evaluate
          question: A proposed optimization stops immediately whenever the remaining budget is zero. Prices may be zero. Which test is the strongest reason to reject this change?
          options:
            - "`takeBudget 0 [0,2]` should return `[0]`."
            - "`takeBudget 0 [2,0]` should return `[]`."
            - "`takeBudget 1 [2,0]` should return `[]`."
          correct_index: 0
          option_feedback:
            1: Both the proposed optimization and the correct rule return an empty list here, so this test cannot distinguish them.
            2: This checks an unaffordable item but never starts with zero budget, so it does not expose the proposed early stop.
          explanation: Zero budget does not imply that the next item is unaffordable. The stopping decision must consider the next price; boundary tests should include allowed values such as free items.
        - type: single
          difficulty: advanced
          bloom: evaluate
          question: A new request asks the function to buy the greatest number of snacks, allowing it to skip and reorder prices. A teammate proposes keeping `takeBudget` unchanged because it already respects a budget. Which response best assesses reuse?
          options:
            - "Reuse it unchanged: any affordable result meets the new goal."
            - "Revise the strategy: an affordable prefix can miss more items."
            - Keep the original order, but skip unaffordable prices.
          correct_index: 1
          option_feedback:
            0: Being affordable is necessary but does not maximize the number bought. The new request changes the selection criterion.
            2: Skipping only after an item is unaffordable can still spend the budget on an early expensive item. With budget 4 and [4,2,2], it buys one instead of the possible two.
          explanation: With budget 4 and prices `[4,2,2]`, the prefix buys one item while choosing the last two buys two. This counterexample shows why a correct function for one specification may need a different strategy for another.
    solution:
      files:
      - path: Main.hs
        language: haskell
        content: |
          module Main where
          takeBudget :: Int -> [Int] -> [Int]
          takeBudget budget [] = []
          takeBudget budget (cost:rest)
            | cost <= budget = cost : takeBudget (budget - cost) rest
            | otherwise = []
          main :: IO ()
          main = print (takeBudget 5 [2,4,1])
      explanation: |
        Empty input gives an empty prefix. Buying an affordable snack reduces
        the budget for the recursive tail. An unaffordable snack ends the
        prefix immediately, so later cheap items cannot sneak into the result.
        A zero budget can still buy a zero-priced snack.
