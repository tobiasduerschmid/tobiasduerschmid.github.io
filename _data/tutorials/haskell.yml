        - condition: "code_matches: /^(?=[\\s\\S]*(?:^|\\n)matchCoins\\b(?![ \\t]*::)[^\\n]*(?:=|\\n[ \\t]+\\|))(?![\\s\\S]*(?:(?:^|\\n)matchCoins\\b[ \\t]+won[ \\t]+practiceMode\\s*\\|\\s*(?:\\(\\s*)*won(?:\\s*\\))*\\s*=\\s*(?:\\(\\s*)*12(?:\\s*\\))*\\s*\\|\\s*(?:\\(\\s*)*practiceMode(?:\\s*\\))*\\s*=\\s*(?:\\(\\s*)*0(?:\\s*\\))*\\s*\\|\\s*otherwise\\s*=\\s*(?:\\(\\s*)*0(?:\\s*\\))*|(?:^|\\n)matchCoins\\b(?:[ \\t]+[a-z_][\\w']*)*[ \\t]*=\\s*(?:\\(\\s*)*(?:undefined|_|error[ \\t]+\"[^\"\\n]*\")(?:\\s*\\))*[ \\t]*(?:\\n|$)))(?![\\s\\S]*(?:^|\\n)matchCoins\\b(?![ \\t]*::)(?:(?!\\n\\S)[\\s\\S])*?\\|[ \\t]*won\\b(?:(?!\\n\\S)[\\s\\S])*\\|[ \\t]*practiceMode\\b)[\\s\\S]*$/"
          text: "Build a four-row table for the two Boolean inputs and the required rewards. Use the overlapping row to decide guard priority, then check that your change preserves the other rows."
    - description: "Stock adjustments cover both limits and interior counts"
      command: adjustStock 8 5 10 == 10 && adjustStock 2 (-5) 10 == 0 && adjustStock 3 4 10 == 7 && adjustStock 3 (-3)
        10 == 0 && adjustStock 3 7 10 == 10 && adjustStock 6 0 10 == 6 && adjustStock 0 4 0 == 0 && adjustStock 0 (-4)
        0 == 0 && adjustStock 6 (-2) 10 == 4 && adjustStock 4 (-1) 6 == 3 && adjustStock 1 1 1 == 1
      hints:
        # Stages: supplied lower guard/fallback; comparison uses original stock; other clamp attempts.
        - condition: "code_matches: /^(?:(?![\\s\\S]*(?:^|\\n)adjustStock\\b(?![ \\t]*::)[^\\n]*(?:=|\\n[ \\t]+\\|))|(?=[\\s\\S]*(?:(?:^|\\n)adjustStock\\b[ \\t]+stock[ \\t]+change[ \\t]+capacity\\s*\\|\\s*(?:\\(\\s*)*(?:\\(\\s*)*stock\\s*\\+\\s*change(?:\\s*\\))*\\s*<\\s*(?:\\(\\s*)*0(?:\\s*\\))*(?:\\s*\\))*\\s*=\\s*(?:\\(\\s*)*0(?:\\s*\\))*\\s*\\|\\s*otherwise\\s*=\\s*(?:\\(\\s*)*0(?:\\s*\\))*|(?:^|\\n)adjustStock\\b(?:[ \\t]+[a-z_][\\w']*)*[ \\t]*=\\s*(?:\\(\\s*)*(?:undefined|_|error[ \\t]+\"[^\"\\n]*\")(?:\\s*\\))*[ \\t]*(?:\\n|$))))[\\s\\S]*$/"
          text: "Find whether the failing input is below the permitted range, above it, or still inside it. The supplied lower-limit case does not distinguish the other two situations."
        - condition: "code_matches: /^(?=[\\s\\S]*(?:^|\\n)adjustStock\\b(?![ \\t]*::)[^\\n]*(?:=|\\n[ \\t]+\\|))(?![\\s\\S]*(?:(?:^|\\n)adjustStock\\b[ \\t]+stock[ \\t]+change[ \\t]+capacity\\s*\\|\\s*(?:\\(\\s*)*(?:\\(\\s*)*stock\\s*\\+\\s*change(?:\\s*\\))*\\s*<\\s*(?:\\(\\s*)*0(?:\\s*\\))*(?:\\s*\\))*\\s*=\\s*(?:\\(\\s*)*0(?:\\s*\\))*\\s*\\|\\s*otherwise\\s*=\\s*(?:\\(\\s*)*0(?:\\s*\\))*|(?:^|\\n)adjustStock\\b(?:[ \\t]+[a-z_][\\w']*)*[ \\t]*=\\s*(?:\\(\\s*)*(?:undefined|_|error[ \\t]+\"[^\"\\n]*\")(?:\\s*\\))*[ \\t]*(?:\\n|$)))(?=[\\s\\S]*(?:^|\\n)adjustStock\\b(?![ \\t]*::)(?:(?!\\n\\S)[\\s\\S])*?\\bstock[ \\t]*(?:<=|>=|<|>))[\\s\\S]*$/"
          text: "Write down stock, change, proposed count, and capacity for one failing input. Check whether each condition examines the original stock or the proposed count."
        - condition: "code_matches: /^(?=[\\s\\S]*(?:^|\\n)adjustStock\\b(?![ \\t]*::)[^\\n]*(?:=|\\n[ \\t]+\\|))(?![\\s\\S]*(?:(?:^|\\n)adjustStock\\b[ \\t]+stock[ \\t]+change[ \\t]+capacity\\s*\\|\\s*(?:\\(\\s*)*(?:\\(\\s*)*stock\\s*\\+\\s*change(?:\\s*\\))*\\s*<\\s*(?:\\(\\s*)*0(?:\\s*\\))*(?:\\s*\\))*\\s*=\\s*(?:\\(\\s*)*0(?:\\s*\\))*\\s*\\|\\s*otherwise\\s*=\\s*(?:\\(\\s*)*0(?:\\s*\\))*|(?:^|\\n)adjustStock\\b(?:[ \\t]+[a-z_][\\w']*)*[ \\t]*=\\s*(?:\\(\\s*)*(?:undefined|_|error[ \\t]+\"[^\"\\n]*\")(?:\\s*\\))*[ \\t]*(?:\\n|$)))(?![\\s\\S]*(?:^|\\n)adjustStock\\b(?![ \\t]*::)(?:(?!\\n\\S)[\\s\\S])*?\\bstock[ \\t]*(?:<=|>=|<|>))[\\s\\S]*$/"
