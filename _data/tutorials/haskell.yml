        [] [1,2] == [] && routeCandidates ["Bay"] [] == [] && routeCandidates ["","Bay"] [-2,0] == [] && routeCandidates
        [""] [4] == [] && routeCandidates ["Bay","Bay"] [2,2] == [(2,"Bay"),(2,"Bay"),(2,"Bay"),(2,"Bay")] && routeCandidates
        ["Zoo","Ash"] [5,2] == [(5,"Zoo"),(2,"Zoo"),(5,"Ash"),(2,"Ash")] && routeCandidates [" Bay ",""] [1]
        == [(1," Bay ")]
      hints:
        # Stages: empty placeholder; platform traversal precedes route traversal; other candidate attempts.
        - condition: "code_matches: /^(?:(?![\\s\\S]*(?:^|\\n)routeCandidates\\b(?![ \\t]*::)[^\\n]*(?:=|\\n[ \\t]+\\|))|(?=[\\s\\S]*(?:(?:^|\\n)routeCandidates\\b[ \\t]+[a-z_][\\w']*[ \\t]+[a-z_][\\w']*[ \\t]*=\\s*(?:\\(\\s*)*\\[\\](?:\\s*\\))*[ \\t]*(?:\\n|$)|(?:^|\\n)routeCandidates\\b(?:[ \\t]+[a-z_][\\w']*)*[ \\t]*=\\s*(?:\\(\\s*)*(?:undefined|_|error[ \\t]+\"[^\"\\n]*\")(?:\\s*\\))*[ \\t]*(?:\\n|$))))[\\s\\S]*$/"
