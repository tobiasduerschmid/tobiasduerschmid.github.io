  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf pp. 41–45, 63, 67–69.
  # Assessment: [Midterm] F24 V1 (Public).pdf P1 p. 2 — keep counting after a nonmatching element;
  # CS131 Fall 25 Quiz 1 v2.docx P3b — base case and recursion on the list tail.
  # Pedagogy: predict the smaller call's result and explain how it combines with the current input;
  # worked recursion example and supplied base case; learner writes the recursive case.
  - title: "Structural Recursion"
    key: recursion
    instructions: |
      ### Why this matters

      Counting scores or combining playlists should work for more than one
      fixed list length: **solve one part and reuse the solution for the rest**.
      A base case and a smaller recursive input help you reason about both the
      result and when processing stops.

      ### 🎯 You will learn to

      - Analyze the base case and progress of a recursive definition
      - Write a recursive case from the meaning of a smaller problem's result

      Friends send picks for a shared playlist. Each number identifies a song;
      each row holds one friend's picks. `joinRows` combines the rows in order,
      so nobody's picks jump the queue:

      ```haskell
      joinRows [] = []
      joinRows (row:rows) = row ++ joinRows rows
      ```

      - **Base case:** the empty outer list supplies an empty result immediately.
      - **Recursive case:** `joinRows rows` solves the same task for fewer rows;
        `++` combines that result with the current row.
      - **Separate bindings:** every call has its own `row` and `rows`. Calling
        the function again does not update the calling function's parameters.

      For `joinRows [[4],[],[2,3]]`, the outer call has `row = [4]` and
      `rows = [[],[2,3]]`. **Predict the smaller call's result first:** what
      list does `joinRows rows` denote? Then explain how `[4]` contributes
      to the whole result. Do not discard it when considering the smaller call.

      <details markdown="1"><summary>Trace the recursive results and their combinations</summary>

      | Input to this call | Result of the smaller call | Result of this call |
      | --- | --- | --- |
      | `[]` | No smaller call | `[]` |
      | `[[2,3]]` | `[]` | `[2,3] ++ []` gives `[2,3]` |
      | `[[],[2,3]]` | `[2,3]` | `[] ++ [2,3]` gives `[2,3]` |
      | `[[4],[],[2,3]]` | `[2,3]` | `[4] ++ [2,3]` gives `[4,2,3]` |

      Read upward to identify smaller inputs, then downward to justify each
      complete result. Every row describes a separate call with its own
      bindings. An empty **inner row** contributes nothing; only an empty
      **outer list** selects the base case.

      This table explains the values using the function's equations. It
      does not say Haskell must compute each complete list in this order;
      later we will examine how much of a list a caller demands.

      </details>

      ### Thinking time!

      Suppose `joinRows` used `[0]` as its base result instead of `[]`.

      - Would `joinRows [[4],[],[2,3]]` produce `[4,2,3]` or `[4,2,3,0]`?
      - Explain where the extra element enters the result **before opening the reveal**.

      Make your prediction, then click **Show answer and explanation** to
      compare your reasoning.

      <details markdown="1">
      <summary>Show answer and explanation</summary>

      **The changed function produces `[4,2,3,0]`.** Once recursion reaches
      the empty outer list, the changed base case supplies `[0]`. The
      recursive calls concatenate their rows onto that result:

      ```haskell
      [4] ++ ([] ++ ([2,3] ++ [0]))
      ```

      The zero comes from the base result, not the empty inner row.
      Using `[]` as the base result adds no extra element.

      </details>


      ### Your challenge

      After a rhythm-game session, count the rounds that met your target.
      Implement `countAtLeast threshold scores` with these rules:

