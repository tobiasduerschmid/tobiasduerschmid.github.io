            text: "Keep the price at 12.50 and predict results for budgets 12.49, 12.50, and 12.51. Compare the three outcomes with the task contract to isolate a type restriction from an equality-boundary bug."
    quiz:
      title: Step 2 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
        - type: single
          difficulty: intermediate
          bloom: analyze
          question: |
            `isSoldOut :: Int -> Bool` checks a slice count. A teammate says this helper returns the answer because it names the checker. Before choosing a repair, identify the current body’s type and the promised result type.

            ```haskell
            orderBlocked :: Int -> Bool
            orderBlocked slices = isSoldOut
            ```
          options:
            - Use `isSoldOut slices` as the body.
            - Change the result type to `Int`.
            - Remove the signature and keep the body.
          correct_index: 0
          option_feedback:
            1: The caller needs a Boolean answer, not another count. Changing the result type also does not supply the missing argument.
            2: Inference would allow a helper that returns a function, but that changes the promised interface rather than producing the Boolean answer.
          explanation: "`isSoldOut` has type `Int -> Bool`; `isSoldOut slices` has type `Bool`. The parameter must reach the checker before the body can supply the answer."
        - type: single
          difficulty: intermediate
          bloom: apply
          question: |-
            A snack checker uses three `Int` inputs:

            ```haskell
            canBuySnacks price guests budget = price * guests <= budget
            ```

            Derive the whole function’s type. Which signature records the inputs and the final result?
          options:
            - "`Int -> Int -> Int -> Int`"
            - "`Int -> Int -> Bool -> Bool`"
            - "`Int -> Int -> Int -> Bool`"
          correct_index: 2
          option_feedback:
            0: The intermediate product is numeric, but the whole body compares it with the budget and returns a Boolean.
            1: The budget is an amount, not a Boolean. Only the final comparison produces a Boolean.
          explanation: Three numeric inputs feed a comparison, so the result is `Bool`. When deriving a type, follow the whole expression rather than stopping at its first operation.
        - type: single
          difficulty: intermediate
          bloom: apply
          question: An affordability checker should compare numeric amounts. With no declared signature, `budget >= price` also accepts strings and can compare their characters. Which change catches accidental text arguments before execution?
          options:
            - Declare `Double -> Double -> Bool`; quoted inputs are rejected.
            - Keep inference alone; it will recognize the intended price units.
            - Declare `Double -> Double -> Bool`; quoted inputs become numbers.
          correct_index: 0
          option_feedback:
            1: Inference checks that the operations and values agree in type. Comparing two strings is consistent even when it answers the wrong question.
            2: A signature checks representations; it does not parse or convert text.
          explanation: The numeric signature expresses an intended restriction that inference cannot recover from the comparison alone. It sacrifices support for text comparisons to catch accidental text inputs at the boundary.
        - type: multiple
          difficulty: intermediate
          bloom: analyze
          question: |
            Consider the intended interface below. Which mistakes can still compile and therefore need examples or other reasoning about behavior? Select all that apply.

            ```haskell
            canAfford :: Double -> Double -> Bool
            canAfford budget price = budget >= price
            ```
          options:
            - Swapping the numeric budget and price at a call site.
            - Passing `"9.50"` as the budget at a call site.
            - Replacing `>=` with `>` in the comparison body.
            - Returning the numeric budget instead of the comparison.
          correct_indices:
            - 0
            - 2
          option_feedback:
            0: Both argument positions accept `Double`, so the signature does not distinguish their roles.
            1: A quoted value has type `String`, which conflicts with the declared input type.
            2: Both operators produce `Bool`. An exact-budget example is needed to distinguish their behavior.
            3: The declared result is `Bool`; the budget is a `Double`.
          explanation: Types rule out incompatible kinds of value, but not swapped roles or the wrong comparison between compatible values. Check a budget below the price and one exactly equal to it; predict both expected answers before running.
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where

            sampleBudget = 9.50
            samplePrice = 12.00

            canAffordPizza :: Double -> Double -> Bool
            canAffordPizza budget price = budget >= price

            main :: IO ()
            main = print (canAffordPizza sampleBudget samplePrice)
      explanation: |
        The original code compared two String values. Its True result was
        consistent with text ordering but wrong for the intended price check.
        Changing the sample values to numeric literals lets the comparison
        answer the numeric question: 9.50 does not cover 12.00, so it prints False.

        The signature documents and checks two Double inputs and a Bool result.
        It prevents quoted text from silently selecting a different comparison;
        it does not parse text or convert it to a number. The same comparison
        correctly accepts exact budgets because it uses >= rather than >.

        Removing the signature still leaves type inference and checking active.
        The behavior checks pass for a correct inferred implementation, but
        the separate signature check requires the explicit numeric interface.
        Whitespace, line breaks, and redundant parentheses do not change that
        interface. Explaining why it rejects quoted prices is still your task.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf pp. 20–24.
  # Assessment: [Midterm] F24 V1 (Public).pdf P1 p. 2 — guard selection prerequisite for conditional recursion.
  # Pedagogy: diagnose guard priority, then complete the last two branches of a new calculation.
  - title: Conditional Values and Guards
    key: stock-adjustment
    instructions: |
      ### Why this matters

      Game rewards and inventory limits can have several rules that overlap.
      **Explicit conditions and a clear fallback** let you check which rule wins
      and ensure the calculation supplies a result for every allowed input.

      ### 🎯 You will learn to

      - Analyze guard conditions at a boundary
      - Create a complete calculation with lower and upper limits

      **Your task is to change both `matchCoins` AND `adjustStock` in `Main.hs`.**
      Repair the reward calculation and complete the inventory calculation.

      Unlike in Python or C++ where an `if` is a statement, in Haskell an `if` is always an expression: `if locked then 0 else available`.
      It needs both branches, and **their types must agree**.

      - **Comparisons:** `==`, `<`, `<=`, `>`, and `>=`.
      - **Boolean combinations:** `&&` and `||`.
      - **Definition versus comparison:** `=` defines; `==` compares.

      Guards are another way to choose a function's result. Each guard has the
      form `| condition = result`.

      - **Read from the top:** the first true guard supplies the result.
      - **Order matters:** a later true guard does not overwrite that result.
      - **Fallback:** `otherwise` is the Boolean value `True`, so a final
        `otherwise` guard covers any cases not handled earlier.
      - **Result:** the selected expression supplies the function's value;
        no `return` statement is needed.

      ### Part 1: repair `matchCoins`

      `matchCoins won practiceMode` calculates how many coins a player earns
      from one match. `won` says whether the player won; `practiceMode` says
      whether this was a practice match. Both inputs are `Bool` values, and
      the result is an `Int` coin reward. The required behavior is:

      - **Win a regular match:** earn 12 coins.
      - **Play a practice match:** earn 0, even if you win.
      - **Lose:** earn 0.

      The starter does not satisfy all of these rules.

      1. **Predict before running:** what will it return for `True False` and
         `True True`? Compare those predictions with the reward rules.
      2. Run the starter. Identify the first true guard for each call.
      3. Change `matchCoins` to satisfy every reward rule. Explain how your
         definition handles overlapping conditions, and check all four
         combinations of the two Boolean inputs.

      ### Part 2: complete `adjustStock`

      `adjustStock stock change capacity` calculates the new number of healing
      potions in a backpack after collecting or using some. `stock` is the
      current count, `change` is the amount collected (positive) or used
      (negative), and `capacity` is the most the backpack can hold. The function
      returns the new count, keeping it between zero and capacity.

      Your game backpack holds at most 10 healing potions. You already have
      8 and collect 5 more; extras cannot fit. **Predict the allowed new count**
      before changing `adjustStock`.

      The required behavior is:

      - Collecting more than fits leaves the backpack full; extras are discarded.
      - Using more than you have leaves the backpack empty.
      - Otherwise, the new count reflects the full amount collected or used.

      Input and result requirements:

      - **Valid starting state:** capacity is nonnegative; starting stock is between 0 and capacity.
      - **Signed changes:** positive changes collect potions; negative changes use them.
        Attempting to use more than you have leaves 0, never a negative inventory.
      - **Types:** every input is an `Int` in the small ranges used here.
      - **No mutation:** return a new count; do not modify the arguments.

      The `TODO` result is a **temporary placeholder**, not a proposed algorithm.
      Complete the missing branches, using guards or an equivalent nested `if`.
      **Test exact limits as well as crossing each limit.** Explain why a
      within-limits result must include the change even though no clamping is needed.

      `main` runs and prints sample calls to both functions so you can inspect
      their results. You may add sample calls, but completing this step requires
      fixing **both `matchCoins` and `adjustStock`** and passing both checks.
    files:
    - path: Main.hs
      language: haskell
      reseed: true
      content: |
        module Main where
        matchCoins :: Bool -> Bool -> Int
        matchCoins won practiceMode
          | won = 12
          | practiceMode = 0
          | otherwise = 0
        adjustStock :: Int -> Int -> Int -> Int
        adjustStock stock change capacity
          | stock + change < 0 = 0
          -- TODO: handle the upper limit and the within-limits result.
          | otherwise = 0
        main :: IO ()
        main = do
          print (matchCoins True False, matchCoins True True)
          print (adjustStock 8 5 10)
    open_file: Main.hs
    run_file: Main.hs
    tests:
    - description: "Match rewards follow mode and outcome rules"
      command: matchCoins True False == 12 && matchCoins True True == 0 && matchCoins False False == 0 && matchCoins
        False True == 0
