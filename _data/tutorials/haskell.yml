  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf pp. 25–31;
  # supporting div notation: intro_to_functional_programming_and_haskell_v10_handouts.pptx slide 39.
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx P3c — local-binding prerequisite for helper-function reasoning.
  # Pedagogy: contrast bindings with updates; complete local relationships with only subtotal supplied.
  - title: "Local Bindings"
    key: local-bindings
    instructions: |
      ### Why this matters

      A long expression can hide which piece of a bill or score is wrong.
      **Naming intermediate results** makes the calculation easier to explain
      and inspect, while local bindings keep those details close to the function
      that uses them.

      ### 🎯 You will learn to

      - Apply `let` and `where` to name intermediate results
      - Analyze a calculation as a set of relationships

      Your study playlist is 1 hour and 35 minutes long. To compare it with
      your study time, convert that to minutes.

      A **`let ... in ...` expression** puts local definitions **before** the
      expression that uses them. The expression after `in` determines the
      value of the whole `let` expression:

      ```haskell
      minutesAfter hours minutes =
        let perHour = 60
        in hours * perHour + minutes
      ```

      A **`where` clause** puts local definitions **after** the function equation
      they support. Write the result expression first, then explain its local
      names below it. There is **no `in`**:

      ```haskell
      minutesAfter hours minutes = hours * perHour + minutes
        where perHour = 60
      ```

      Both versions give `minutesAfter 1 35 == 95`. The conversion factor
      gets a name, so the calculation explains itself.

      The difference is **placement and scope** (where a name is available),
      not the arithmetic or the order of execution:

      - **`let` belongs to an expression.** You can use it wherever an expression
        is allowed, such as one branch of an `if` or an argument to a function.
        Its names are available within that binding group and the expression
        after `in`, but not outside the whole `let` expression. A name introduced
        by a `let` inside the `then` branch is not available in the `else` branch.
      - **`where` belongs to the enclosing equation.** Its names are available
        in that equation's result and all of its guards, as well as within the
        local definitions themselves. This is useful when several guards need
        the same intermediate value. A `where` clause cannot stand alone as
        an expression, and its names do not extend to other equations for the
        same function.
      - **Neither makes names global.** In both versions above, `perHour` is
        local to that definition; `main` cannot refer to it directly.

      - **Alignment matters:** keep definitions in the same block aligned;
        indentation is meaningful.
      - **Helpers are local too:** both forms can define helper functions as well
        as data. A helper can refer to the surrounding function's parameters.
      - **Bindings are not assignments:** naming one result does not change another binding.

      Next, split a group snack order into named amounts. The billing rule
      uses **integral division**:

      - ``subtotal `div` 4`` divides the nonnegative subtotal by four and
        discards its fractional part.
      - For example, ``35 `div` 4`` is `8`.
      - Backticks put a two-argument function between its arguments;
        `div 35 4` means the same thing.

      ### Thinking time! Names describe values

      A teammate expects this expression to return 45 because the second binding
      "updates the score":

      ```haskell
      let score = 40
          nextScore = score + 5
      in score
      ```

      1. **Predict the value of the expression shown above.**
      2. Now imagine replacing only `in score` with `in nextScore`. Predict
         the new value without changing the editor.
      3. Explain which name denotes each value. Would moving the two aligned
         definitions into the opposite order turn either one into an assignment?

      Make your prediction, then click **Show answer and explanation** to
      compare your reasoning.

      <details markdown="1">
      <summary>Show answer and explanation</summary>

      **The original expression returns `40`; changing `in score` to
      `in nextScore` returns `45`.** `score` denotes 40, while `nextScore`
      denotes the separate value `score + 5`. The expression after `in`
      chooses which value the whole expression returns.

      Reversing the two aligned definitions does not change either result.
      Names in the same binding group can refer to one another regardless
      of their written order. Neither definition assigns a new value to
      `score`.

      </details>


      ### Your challenge: complete the local calculation

      The study group places a snack order. Write `snackBill count unitCost fee`
      using these rules:

