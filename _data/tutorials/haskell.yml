      title: Step 4 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
        - type: single
          difficulty: intermediate
          bloom: analyze
          question: |
            A refactoring reverses the two aligned definitions in this binding group. What should a behavior check expect? Explain using the value denoted by each name.

            ```haskell
            let gross = 20
                net = gross - 3
            in gross + net
            ```
          options:
            - "`37` in both versions; the names describe related values."
            - "`34` in both versions; binding `net` changes `gross`."
            - An error after reordering; definitions execute top to bottom.
          correct_index: 0
          option_feedback:
            1: "`net` denotes 17 and `gross` still denotes 20. Defining one name does not assign to the other."
            2: These local definitions form one binding group. Their dependency is expressed by the use of `gross`, not by assignment order.
          explanation: The result remains `20 + 17`. Compare each name’s meaning before and after a refactoring; the last definition written is not automatically the returned value.
        - type: single
          difficulty: intermediate
          bloom: evaluate
          question: A helper `cost n = n * unitPrice` is local to `bill unitPrice count`, where it uses `unitPrice`. Two other functions now need the same helper. Which change makes that dependency explicit while allowing each caller its own price?
          options:
            - Move `cost n` unchanged to the top level.
            - Move it as `cost unitPrice n` and pass the price.
            - Move it with one fixed global `unitPrice` value.
          correct_index: 1
          option_feedback:
            0: At the top level, the helper can no longer see the enclosing function’s parameter.
            2: A fixed global price removes each caller’s ability to choose its own price.
          explanation: An explicit parameter carries the dependency across the new scope boundary. A local helper avoids repeating that argument, while a shared helper needs callers to supply it; neither arrangement is best for every use.
    solution:
      files:
      - path: Main.hs
        language: haskell
        content: |
          module Main where
          snackBill :: Int -> Int -> Int -> Int
          snackBill count unitCost fee = subtotal - discount + fee
            where
              subtotal = count * unitCost
              discount = if count >= 4 then subtotal `div` 4 else 0
          main :: IO ()
          main = print (snackBill 4 8 3)
      explanation: |
        Each local name denotes one value. Defining discount does not mutate
        subtotal; the function's result explicitly combines subtotal, discount,
        and fee. For four snacks at 8 points, the subtotal is 32, the discount
        is 8, and the fee is 3, giving a total of 27.

        An equivalent let expression keeps the definitions together and uses
        subtotal - discount + fee after in. Reordering these definitions within
        the group does not turn them into sequential assignments. Moving a
        helper outside the function can remove its access to count or unitCost;
        those values would then need to be passed as parameters.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf pp. 34–35, 63, 72–74.
  # Assessment: [Midterm] F23 (Public).pdf P3a p. 6 — tuple/list type-shape prerequisite for extract2nd.
  # Pedagogy: contrast type relationships within one use with fresh instantiation across uses;
  # fade the target pattern and entire body; predict new and original tuple values.
  - title: "Tuples and Type Variables"
    key: tuples
    instructions: |
      ### Why this matters

      A leaderboard entry needs to keep a name and score together, even though
      they have different types. **Tuples preserve that relationship**, and type
      variables let you write helpers for many kinds of pairs while keeping
      track of which types must agree.

      ### 🎯 You will learn to

      - Analyze tuple shapes and polymorphic type variables
      - Create a new tuple that preserves one field and changes another

      Mina finishes a rhythm-game round with 40 points. Her leaderboard entry,
      `("Mina", 40)`, has type `(String, Int)` when its score is an `Int`.

      - **Fixed shape:** tuple size and position types are fixed; a pair is different from a triple.
      - **One argument:** a tuple parameter is one argument, even though it contains several components.

      For a watchlist, a different pair might hold a video identifier and a
      label such as `"watch later"`. Keep the identifier and replace the label
      with a watched flag:

      ```haskell
      markSeen :: (a, b) -> (a, Bool)
      markSeen (value, label) = (value, True)
      ```

      - **Pattern:** `(value, label)` names the two components.
      - **Type variables:** lowercase `a` and `b` describe arbitrary types.
      - **Same letter, same type:** reusing a type variable requires the same type.
      - **Different letters may still be the same type:** `a` and `b` permit different
        types but do not require them to differ.

      **Predict each result and its type:** `markSeen (True, 'x')` and
      `markSeen ('q', False)`. Can both calls appear in one program, or does
      the first call fix `a` for every later call?

      <details markdown="1"><summary>Compare the two uses of the same signature</summary>

      | Call | Result | Result type |
      | --- | --- | --- |
      | `markSeen (True, 'x')` | `(True, True)` | `(Bool, Bool)` |
      | `markSeen ('q', False)` | `('q', True)` | `(Char, Bool)` |

      Each use of this polymorphic function can choose suitable types for
      `a` and `b`. **Within one use**, the input's first component and the
      result's first component share `a`. The next call can use a different
      type for `a`; the first call does not change the function's signature.
      `markSeen (True, False)` is valid too: different letters permit, but
      do not require, different types.

      </details>

      To derive `markSeen`'s type:

      1. Call the first component's type `a` and the second component's type `b`.
      2. The tuple argument has type `(a, b)`; the unused label can have any type `b`.
      3. The result keeps a value of type `a` and adds a `Bool`.
      4. Connect the input and result with `->`.

      ### Thinking time!

      Mina earns a 5-point bonus. The starter defines `original = ("Mina", 40)`
      and prints the result of `addBonus 5 original`, followed by `original`.

      **Predict both pairs after your implementation is complete.** Should their
      scores be the same? Explain which expression denotes the old pair and which
      will construct a new one.

      Make your prediction, then click **Show answer and explanation** to
      compare your reasoning.

      <details markdown="1">
      <summary>Show answer and explanation</summary>

      **The completed program prints `("Mina",45)` and then `("Mina",40)`.**
      `addBonus 5 original` constructs a new pair with the same name and a
      score five points higher. `original` still denotes the old pair.
      Returning a new pair does not mutate the input, so the two scores
      differ. The unchanged starter instead prints the old pair twice.

      </details>


      ### Your challenge: write the whole definition

      Implement `addBonus` from its supplied type and these requirements:

      - **Inputs:** a bonus and a pair containing a name and a score.
      - **Result:** keep the name and add the bonus to the score.
      - **Allow negative bonuses.**
      - **Preserve the original pair:** constructing a new result does not mutate it.

      1. Replace the entire placeholder equation. **Choose your own parameter
         pattern and result expression**; `markSeen` is a related worked example.
      2. Run the supplied two-print display harness and compare both pairs with
         your prediction. Leave that `do` block intact; it only displays the results.
      3. Add one negative-bonus example of your own, predict it, then run the checks.

      Unlike the previous step, no part of the target calculation is supplied.
      The placeholder only returns its input so the starter can run.

      Before moving on:

      - **Recall:** explain `(a, a)` versus `(a, b)` without looking back.
      - **Take a break:** this is a good stopping point. Recall that distinction
        again before starting lists.
    files:
    - path: Main.hs
      language: haskell
      reseed: true
      content: |
        module Main where
        markSeen :: (a, b) -> (a, Bool)
        markSeen (value, label) = (value, True)
        addBonus :: Int -> (String, Int) -> (String, Int)
        -- TODO: replace this pass-through with your complete definition.
        addBonus bonus entry = entry
        original :: (String, Int)
        original = ("Mina", 40)
        main :: IO ()
        main = do
          print (addBonus 5 original)
          print original
    open_file: Main.hs
    run_file: Main.hs
    tests:
    - description: "Bonus results preserve tuple fields across names and signs"
      command: addBonus 5 ("Mina", 40) == ("Mina", 45) && addBonus (-3) ("Noor", 12) == ("Noor", 9) && addBonus 0 ("",
        0) == ("", 0) && addBonus 8 ("Kai", -2) == ("Kai", 6) && addBonus 0 ("Lee", 9) == ("Lee", 9)
        && addBonus 5 ("", 7) == ("", 12) && addBonus (-8) ("Kai", 3) == ("Kai", -5) && original == ("Mina", 40)
      hints:
        # Stages: pass-through pair; negative bonus clamped or made positive; other tuple reconstructions.
        - condition: "code_matches: /^(?:(?![\\s\\S]*(?:^|\\n)addBonus\\b(?![ \\t]*::)[^\\n]*(?:=|\\n[ \\t]+\\|))|(?=[\\s\\S]*(?:(?:^|\\n)addBonus\\b[^\\n]*=\\s*(?:\\(\\s*)*entry(?:\\s*\\))*[ \\t]*(?:\\n|$)|(?:^|\\n)addBonus\\b(?:[ \\t]+[a-z_][\\w']*)*[ \\t]*=\\s*(?:\\(\\s*)*(?:undefined|_|error[ \\t]+\"[^\"\\n]*\")(?:\\s*\\))*[ \\t]*(?:\\n|$))))[\\s\\S]*$/"
          text: "Read the input pair field by field. Which field should be reused, and which field needs a calculation involving the separate bonus argument?"
        - condition: "code_matches: /^(?=[\\s\\S]*(?:^|\\n)addBonus\\b(?![ \\t]*::)[^\\n]*(?:=|\\n[ \\t]+\\|))(?![\\s\\S]*(?:(?:^|\\n)addBonus\\b[^\\n]*=\\s*(?:\\(\\s*)*entry(?:\\s*\\))*[ \\t]*(?:\\n|$)|(?:^|\\n)addBonus\\b(?:[ \\t]+[a-z_][\\w']*)*[ \\t]*=\\s*(?:\\(\\s*)*(?:undefined|_|error[ \\t]+\"[^\"\\n]*\")(?:\\s*\\))*[ \\t]*(?:\\n|$)))(?=[\\s\\S]*(?:^|\\n)addBonus\\b(?![ \\t]*::)(?:(?!\\n\\S)[\\s\\S])*?\\b(?:abs|max)\\b)[\\s\\S]*$/"
          text: "Trace a negative bonus on a pair with a different name. Compare the input components with the returned components to locate a field-selection or arithmetic error."
        - condition: "code_matches: /^(?=[\\s\\S]*(?:^|\\n)addBonus\\b(?![ \\t]*::)[^\\n]*(?:=|\\n[ \\t]+\\|))(?![\\s\\S]*(?:(?:^|\\n)addBonus\\b[^\\n]*=\\s*(?:\\(\\s*)*entry(?:\\s*\\))*[ \\t]*(?:\\n|$)|(?:^|\\n)addBonus\\b(?:[ \\t]+[a-z_][\\w']*)*[ \\t]*=\\s*(?:\\(\\s*)*(?:undefined|_|error[ \\t]+\"[^\"\\n]*\")(?:\\s*\\))*[ \\t]*(?:\\n|$)))(?![\\s\\S]*(?:^|\\n)addBonus\\b(?![ \\t]*::)(?:(?!\\n\\S)[\\s\\S])*?\\b(?:abs|max)\\b)[\\s\\S]*$/"
          text: "Try the incomplete equation `addBonus bonus (name, score) = (..., ...)`. Choose each result component yourself, then compare the printed original with the new result."
    quiz:
      title: Step 5 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
        - type: single
          difficulty: intermediate
          bloom: apply
          question: A scoreboard starts with `original = ("Rae", 20)`. `addBonus bonus (name, score) = (name, score + bonus)`. Predict the scores in `addBonus (3 * 2) original` and in `original`, in that order.
          options:
            - "`26` and `20`"
            - "`26` and `26`"
            - "`23` and `20`"
          correct_index: 0
          option_feedback:
            1: Constructing the result pair does not change the pair denoted by `original`.
            2: The grouped bonus is the complete product `3 * 2`, not just its first number.
          explanation: The new pair has score 26; the old pair still has score 20. Parentheses group the bonus expression, while the tuple groups the name and score into one argument.
        - type: single
          difficulty: intermediate
          bloom: evaluate
          question: "A library helper duplicates the first component and ignores the second: `repeatFirst (x, y) = (x, x)`. It should accept mixed-type pairs without changing either component’s representation. Which signature best preserves that flexibility?"
          options:
            - "`(a, a) -> (a, a)`"
            - "`(a, b) -> (a, b)`"
            - "`(a, b) -> (a, a)`"
          correct_index: 2
          option_feedback:
            0: Requiring matching input types rules out useful calls such as `repeatFirst (True, 'x')`, even though the body can handle them.
            1: Both output positions contain `x`, so the second output cannot promise the independent type of `y`.
          explanation: The input types are independent, while both output positions share the first input’s type. A more restrictive signature may compile but unnecessarily reduce where the helper can be reused.
        - type: multiple
          difficulty: intermediate
          bloom: analyze
          question: "`tagged :: a -> (a, Bool)` and `tagged x = (x, True)`. Which conclusions follow for uses in one program? Select all that apply."
          options:
            - "`tagged True` and `tagged 'q'` can have different result types."
            - "`tagged True` is invalid because its two result types coincide."
            - "`tagged 'q'` preserves the character rather than converting it."
            - Calling `tagged True` fixes `a` as `Bool` for later calls.
          correct_indices:
            - 0
            - 2
          option_feedback:
            0: Each use can instantiate `a` independently; the results are `(Bool, Bool)` and `(Char, Bool)`.
            1: An arbitrary type variable may be `Bool`. Different type expressions do not require different types.
            2: The same `a` connects the input with the result’s first component.
            3: A polymorphic function’s first call does not change its signature for later uses.
          explanation: Type variables express relationships within a use, while independent uses can choose different types. As a self-check, predict the result type of `tagged "q"` and explain how it differs from `tagged 'q'`.
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where
            markSeen :: (a, b) -> (a, Bool)
            markSeen (value, label) = (value, True)
            addBonus :: Int -> (String, Int) -> (String, Int)
            addBonus bonus (name, score) = (name, score + bonus)
            original :: (String, Int)
            original = ("Mina", 40)
            main :: IO ()
            main = do
              print (addBonus 5 original)
