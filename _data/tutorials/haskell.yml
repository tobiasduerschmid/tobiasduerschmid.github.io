    quiz:
      title: Step 3 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
        - type: single
          difficulty: intermediate
          bloom: analyze
          question: |
            A delivery fee should be zero whenever `waived` is true, even for urgent orders. Which input exposes the priority error in this definition? Predict the required and actual fee for your chosen input.

            ```haskell
            fee urgent waived
              | urgent = 5
              | waived = 0
