      language: haskell
      reseed: true
      content: |
        module Main where
        replaceHead :: a -> [a] -> [a]
        replaceHead replacement [] = []
        replaceHead replacement (_:rest) = replacement : rest
        swapFront :: [a] -> [a]
        -- TODO: Replace this placeholder equation with your complete definition.
        swapFront values = []
        main :: IO ()
        main = print (swapFront ["Ada", "Bo", "Cy"])
