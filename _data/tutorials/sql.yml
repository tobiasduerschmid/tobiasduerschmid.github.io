title: "SQL Essentials"
description: "Learn to query with SQL in about 35 minutes, then create and change data in two extra steps (about 10 minutes). SQLite runs in your browser; no installation."

learning_objectives:
  - "Select columns and filter and sort rows to answer a question."
  - "Handle missing values with IS NULL and explain why ordinary comparisons omit them."
  - "Match related rows with JOIN and preserve unmatched rows with LEFT JOIN."
  - "Summarize groups with COUNT and AVG, distinguishing WHERE from HAVING."
  - "Compose and check a multi-table report from a short specification."
  - "Create and populate a table with a primary key and required values."
  - "Update or delete selected rows and distinguish DELETE from DROP TABLE."

backend: sql
require_tests: true
autosave_type: files

# The previous checks could pass incorrect SQL, so old completions must be
# rechecked. Distinct lesson keys and filenames preserve old drafts without
# treating their checks as evidence for this revised sequence.
progress_version: 1
legacy_step_keys: [explore-v1, join-v1, filter-v1, aggregate-v1, create-v1, modify-v1, capstone-v1]

# Read-only query dataset. The extensions use a separate, restartable table.
setup_commands:
  - |
    DROP TABLE IF EXISTS students;
    CREATE TABLE students (
      id      INTEGER PRIMARY KEY,
      name    TEXT    NOT NULL,
      year    INTEGER,
      major   TEXT,
      gpa     REAL
    );
    INSERT INTO students VALUES
      (1, 'Mango',      2, 'CS',      3.90),
      (2, 'Watermelina',3, 'Math',    3.40),
      (3, 'Bananito',   1, 'CS',      3.70),
      (4, 'Coconick',   4, 'Physics', 2.80),
      (5, 'Kiwi',       2, 'CS',      3.50),
      (6, 'Grapenzo',   3, 'Math',    3.10),
      (7, 'Cherrita',   1, 'Physics', 3.60),
      (8, 'Orangelo',   4, 'CS',      3.20),
      (9, 'Blue Bella', 3, NULL,      3.00);

    DROP TABLE IF EXISTS majors;
    CREATE TABLE majors (
      code       TEXT PRIMARY KEY,
      department TEXT NOT NULL,
      advisor    TEXT NOT NULL
    );
    INSERT INTO majors VALUES
      ('CS',      'Engineering',   'Dr. Hopper'),
      ('Math',    'Sciences',      'Dr. Noether'),
      ('Physics', 'Sciences',      'Dr. Curie'),
      ('Bio',     'Life Sciences', 'Dr. McClintock');


steps:
  # Pedagogy: Run a complete example immediately, then make a two-word edit.
  # Core time budget: 3 + 5 + 5 + 5 + 7 + 10 = 35 minutes, including quizzes.
  - key: select-columns
    title: "Selecting Columns"
    instructions: |
      ### Why this matters

      SQL describes the data you want. The database finds it for you.

      ### 🎯 You will learn to

      - Select the columns a result needs.

      ### Try it — 3 minutes

      **Run `columns.sql` now.** It shows all 9 students and 5 columns: `id`, `name`, `year`, `major`, `gpa`.

      `SELECT` chooses columns; `FROM` names the table; `*` means all columns.

      **Change only `*` to `name, major`.** Predict the new column count mentally, Run, then **Test My Work**. No written explanation needed.

      **Your route:** Steps 1–6 take about **35 minutes**, including two short checks. Steps 7–8 add about **10 minutes** for creating and changing data. These are estimates, not time limits.

    files:
      - path: columns.sql
        content: |
          SELECT * FROM students;
        language: sql
    open_file: columns.sql
    solution:
      files:
        - path: columns.sql
          content: |
            SELECT name, major FROM students;
          language: sql
      explanation: |
        The result still has 9 rows, but now only 2 columns. Choosing columns does not filter rows. Explicit column lists make the output you need clear.
    tests:
      - description: "Return all nine students with only name and major, in that column order"
        command: |
          __assert_result(db.exec(__read_file('columns.sql')), {
            columns: ['name', 'major'],
            values: [['Mango','CS'],['Watermelina','Math'],['Bananito','CS'],['Coconick','Physics'],['Kiwi','CS'],['Grapenzo','Math'],['Cherrita','Physics'],['Orangelo','CS'],['Blue Bella',null]]
          });
        hints:
          - text: "The star selects every column. Replace it with the two requested column names."
            condition: "code_contains: *"
          - text: "Keep FROM students; change the column list after SELECT. Separate names with a comma."
            condition: "code_missing: name"
          - text: "The output must contain name first, then major, for every student. Check for extra columns or rows."
            condition: "code_contains: name"

  # Pedagogy: Contrast AND with OR on the same familiar data; repair one clause.
  - key: filter-sort
    title: "Filtering and Sorting"
    instructions: |
      ### Why this matters

      Most questions need a subset of rows. An explicit sort makes their order reliable.

      ### 🎯 You will learn to

      - Combine conditions with `AND` or `OR` and sort results.

      ### Two small repairs — 5 minutes

      ```sql
      SELECT name, gpa FROM students
      WHERE major = 'CS'
      ORDER BY gpa DESC;
      ```

      `WHERE` keeps matching rows. `AND` requires **both** conditions; `OR` accepts **either**. `DESC` sorts highest first; `ASC` sorts lowest first. Without `ORDER BY`, row order is not guaranteed.

      1. **`cs-students.sql`:** return `name, gpa` for CS students with GPA **at least 3.5**, highest GPA first. Repair the connector and sort direction.
      2. **`either.sql`:** return `name, major` for students in **Math or Physics**, in any order. Repair one connector.

      Predict whether each repair returns more or fewer rows, then Run each file and Test My Work.
    files:
      - path: cs-students.sql
        content: |
          SELECT name, gpa FROM students
          WHERE major = 'CS' OR gpa >= 3.5
          ORDER BY gpa ASC;
        language: sql
      - path: either.sql
        content: |
          SELECT name, major FROM students
          WHERE major = 'Math' AND major = 'Physics';
        language: sql
    open_file: cs-students.sql
    solution:
      files:
        - path: cs-students.sql
          content: |
            SELECT name, gpa FROM students
            WHERE major = 'CS' AND gpa >= 3.5
            ORDER BY gpa DESC;
          language: sql
        - path: either.sql
          content: |
            SELECT name, major FROM students
            WHERE major = 'Math' OR major = 'Physics';
          language: sql
      explanation: |
        Both conditions give Mango (3.9), Bananito (3.7), and Kiwi (3.5), in that order. A student has one major, so Math OR Physics returns four students; Math AND Physics returns none.
    tests:
      - description: "Return exactly the three qualifying CS students, highest GPA first"
        command: |
          __assert_result(db.exec(__read_file('cs-students.sql')), {
            columns: ['name','gpa'], values: [['Mango',3.9],['Bananito',3.7],['Kiwi',3.5]], ordered: true
          });
          // Ensure the requested sort is not just the table's incidental order.
          db.run('UPDATE students SET gpa = 3.6 WHERE id = 1');
          __assert_result(db.exec(__read_file('cs-students.sql')), {
            columns: ['name','gpa'], values: [['Bananito',3.7],['Mango',3.6],['Kiwi',3.5]], ordered: true
          });
        hints:
          - text: "A high GPA alone is not enough: both the major and GPA conditions must hold."
            condition: "code_contains: major = 'CS' OR"
          - text: "ASC puts the smallest GPA first. Which direction puts the largest first?"
            condition: "code_contains: ASC"
          - text: "Include the boundary: Kiwi's GPA is exactly 3.5. Return only name and gpa."
            condition: "code_contains: major = 'CS' AND"
      - description: "Return every Math or Physics student, with no other majors"
        command: |
          __assert_result(db.exec(__read_file('either.sql')), {
            columns: ['name','major'], values: [['Watermelina','Math'],['Coconick','Physics'],['Grapenzo','Math'],['Cherrita','Physics']]
          });
        hints:
          - text: "One value cannot equal Math and Physics at the same time. The student may belong to either."
            condition: "code_contains: major = 'Math' AND"
          - text: "Each comparison needs a column, an operator, and a quoted value."
            condition: "code_missing: major"
          - text: "Check that both majors are present and that each qualifying student appears once."
            condition: "code_contains: OR"

  # Pedagogy: Make a missing row visible; retrieve selection/filtering in a short quiz.
  - key: missing-values
    title: "Missing Values"
    instructions: |
      ### Why this matters

      Missing data is common. A comparison can silently leave those rows out.

      ### 🎯 You will learn to

      - Find missing values and include them deliberately in a filter.

      ### Find the missing student — 3 minutes + 2-minute check

      Blue Bella has no recorded major: its value is **`NULL`**. It is not the text `'NULL'` or an empty string.

      Comparisons such as `major = NULL` and `major != 'CS'` are **unknown** for that row. `WHERE` keeps only true conditions. Use `IS NULL` to find missing values; `IS NOT NULL` finds known values.

      1. **`missing.sql`:** repair the comparison to return `name` for students with no major.
      2. **`outside-cs.sql`:** include students whose major is **not CS or is missing**. Keep `name, major`; any row order is fine. Add one condition.

      Run and check both files. Next opens a five-question checkpoint; four correct answers pass.
    files:
      - path: missing.sql
        content: |
          SELECT name FROM students WHERE major = NULL;
        language: sql
      - path: outside-cs.sql
        content: |
          SELECT name, major FROM students
          WHERE major != 'CS';
        language: sql
    open_file: missing.sql
    solution:
      files:
        - path: missing.sql
          content: |
            SELECT name FROM students WHERE major IS NULL;
          language: sql
        - path: outside-cs.sql
          content: |
            SELECT name, major FROM students
            WHERE major != 'CS' OR major IS NULL;
          language: sql
      explanation: |
        `missing.sql` returns Blue Bella. `outside-cs.sql` returns the four Math/Physics students plus Blue Bella. `IS NULL` is true for the missing value, so the OR condition includes it.
    tests:
      - description: "Find Blue Bella by the missing major"
        command: |
          __assert_result(db.exec(__read_file('missing.sql')), { columns: ['name'], values: [['Blue Bella']] });
          db.run("UPDATE students SET major = 'Bio' WHERE id = 9; UPDATE students SET major = NULL WHERE id = 5;");
          __assert_result(db.exec(__read_file('missing.sql')), { columns: ['name'], values: [['Kiwi']] });
        hints:
          - text: "An equals comparison cannot test for missing data. Use SQL's missing-value predicate."
            condition: "code_contains: = NULL"
          - text: "Quoted 'NULL' is text. A missing value uses the unquoted keyword NULL."
            condition: "code_contains: 'NULL'"
          - text: "Filter by whether major is missing, not by a particular student's name."
            condition: "code_contains: IS NULL"
      - description: "Include all five students outside CS, including the missing major"
        command: |
          __assert_result(db.exec(__read_file('outside-cs.sql')), {
            columns: ['name','major'], values: [['Watermelina','Math'],['Coconick','Physics'],['Grapenzo','Math'],['Cherrita','Physics'],['Blue Bella',null]]
          });
        hints:
          - text: "The existing comparison includes only known non-CS majors. Add a separate missing-value condition."
            condition: >-
              code_not_matches: /major\s*!=\s*'CS'[^;]*\bIS\s+NULL\b/i
          - text: "Known non-CS and missing are two alternatives. A row need satisfy only one."
            condition: "code_contains: AND"
          - text: "Keep both cases: a known major different from CS, or a missing major."
            condition: "code_contains: OR"
    quiz:
      title: "Step 3 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:
        - type: single
          difficulty: basic
          question: "A table has 9 rows and 5 columns. What does `SELECT name, major FROM students` return?"
          options: ["9 rows and 2 columns", "2 rows and 5 columns", "9 rows and 5 columns"]
          correct_index: 0
          explanation: "SELECT chooses columns. Without a row filter, all nine rows remain."
          option_feedback:
            1: "A column list does not choose how many rows to return."
            2: "Only the two named columns are selected."
        - type: single
          difficulty: basic
          question: "A student has one major. Which condition includes Math students and Physics students?"
          options: ["`major = 'Math' AND major = 'Physics'`", "`major = 'Math' OR major = 'Physics'`", "`major != 'Math' AND major != 'Physics'`"]
          correct_index: 1
          explanation: "OR accepts either major. AND would require one value to equal both."
          option_feedback:
            2: "This excludes both requested majors."
        - type: single
          difficulty: basic
          question: "GPAs are 3.1, 3.9, and 3.5. Which order does `ORDER BY gpa DESC` request?"
          options: ["3.1, 3.5, 3.9", "3.9, 3.5, 3.1", "3.1, 3.9, 3.5"]
          correct_index: 1
          explanation: "DESC means descending: largest first."
          option_feedback:
            0: "This is ascending order."
            2: "The input order does not determine a descending sort."
        - type: single
          difficulty: intermediate
          question: "A row's major is NULL. What happens under `WHERE major != 'CS'`?"
          options: ["The row is included because its major is not CS.", "The row is omitted because the comparison is unknown.", "The query fails because NULL cannot be compared."]
          correct_index: 1
          explanation: "The comparison is valid but unknown. WHERE retains only true conditions."
          option_feedback:
            0: "A missing value is not a known different value."
            2: "This is a missing-row problem, not a syntax error."
        - type: single
          difficulty: basic
          question: "Which condition finds rows with no recorded major?"
          options: ["`major = 'NULL'`", "`major = NULL`", "`major IS NULL`"]
          correct_index: 2
          explanation: "IS NULL tests for a missing value."
          option_feedback:
            0: "Quotes turn NULL into text."
            1: "Equality with NULL yields unknown, not true."

  # Pedagogy: Contrast a Cartesian product, matched rows and a left join.
  - key: join-tables
    title: "Matching Tables"
    instructions: |
      ### Why this matters

      Related facts often live in different tables. A join brings them into one result.

      ### 🎯 You will learn to

      - Match rows by a key and preserve unmatched students when needed.

      ### Match, then keep the missing row — 5 minutes

      `majors(code, department, advisor)` has four rows: CS, Math, Physics, and Bio. `students.major` matches `majors.code`.

      ```sql
      FROM students AS s
      JOIN majors AS m ON s.major = m.code
      ```

      `s` and `m` are short names for the tables. `ON` specifies which rows match. Without a matching condition, 9 students × 4 majors produces **36 pairs**.

      1. **`advisors.sql`:** repair the FROM clause using the pattern above. Return `name, advisor` for the **8 matched students**.
      2. **`all-advisors.sql`:** change `JOIN` to **`LEFT JOIN`** to keep **all 9 students**. The unmatched advisor becomes `NULL`.

      Predict which student appears only in the second result. Run each file; row order does not matter.
    files:
      - path: advisors.sql
        content: |
          SELECT s.name, m.advisor
          FROM students AS s, majors AS m;
        language: sql
      - path: all-advisors.sql
        content: |
          SELECT s.name, m.advisor
          FROM students AS s
          JOIN majors AS m ON s.major = m.code;
        language: sql
    open_file: advisors.sql
    solution:
      files:
        - path: advisors.sql
          content: |
            SELECT s.name, m.advisor
            FROM students AS s
            JOIN majors AS m ON s.major = m.code;
          language: sql
        - path: all-advisors.sql
          content: |
            SELECT s.name, m.advisor
            FROM students AS s
            LEFT JOIN majors AS m ON s.major = m.code;
          language: sql
      explanation: |
        The inner join returns eight students with their own major's advisor. The left join also returns Blue Bella with a NULL advisor. Bio has no students, so it adds no student rows to either result.
    tests:
      - description: "Match each of the eight students to the correct advisor, once each"
        command: |
          __assert_result(db.exec(__read_file('advisors.sql')), {
            columns: ['name','advisor'],
            values: [['Mango','Dr. Hopper'],['Watermelina','Dr. Noether'],['Bananito','Dr. Hopper'],['Coconick','Dr. Curie'],['Kiwi','Dr. Hopper'],['Grapenzo','Dr. Noether'],['Cherrita','Dr. Curie'],['Orangelo','Dr. Hopper']]
          });
        hints:
          - text: "The comma pairs every student with every major. Add the condition connecting major to code."
            condition: >-
              code_matches: /FROM\s+students\s+(?:AS\s+)?s\s*,\s*majors/i
          - text: "The matching columns are students.major and majors.code; student IDs are unrelated to major codes."
            condition: "code_missing: s.major"
          - text: "Look for repeated names: each matched student should have exactly their own advisor."
            condition: "code_contains: ON"
      - description: "Keep all nine students, with NULL for Blue Bella's advisor"
        command: |
          __assert_result(db.exec(__read_file('all-advisors.sql')), {
            columns: ['name','advisor'],
            values: [['Mango','Dr. Hopper'],['Watermelina','Dr. Noether'],['Bananito','Dr. Hopper'],['Coconick','Dr. Curie'],['Kiwi','Dr. Hopper'],['Grapenzo','Dr. Noether'],['Cherrita','Dr. Curie'],['Orangelo','Dr. Hopper'],['Blue Bella',null]]
          });
        hints:
          - text: "An ordinary JOIN keeps only matches. Which join preserves every row from students?"
            condition: "code_missing: LEFT"
          - text: "Students must be the left-hand table when every student should survive."
            condition: "code_missing: FROM students"
          - text: "Keep the matching condition. Do not filter out the NULL advisor afterward."
            condition: "code_contains: LEFT"

  # Pedagogy: A worked grouping example, then contrasting row/group filters.
  - key: group-summaries
    title: "Group Summaries"
    instructions: |
      ### Why this matters

      Reports often need one row per group. Aggregate functions turn many rows into a count or average.

      ### 🎯 You will learn to

      - Count and average groups, then filter the groups with `HAVING`.

      ### Summarize the students — 7 minutes

      ```sql
      SELECT major, COUNT(*) AS n, AVG(gpa) AS avg_gpa
      FROM students
      GROUP BY major;
      ```

      `GROUP BY` makes one row per major. `AS` names an output column. `COUNT(*)` counts rows; `COUNT(major)` counts only non-NULL majors. `AVG(gpa)` averages known GPAs.

      1. **`summary.sql`:** count **every student** in each group, including the missing-major group. Return `major, n, avg_gpa`, highest average first. Repair the count and sort direction.
      2. **`groups.sql`:** return only **named majors averaging at least 3.25**, in the same column order and highest-average-first order. Repair the boundary comparison.

      **`WHERE` filters rows before grouping; `HAVING` filters groups afterward.** Filtering individual GPAs would change the average you are calculating.

      <details markdown="1"><summary>Optional: DISTINCT and NULL</summary>

      `SELECT DISTINCT major FROM students` returns four rows: CS, Math, Physics, and NULL. `SELECT COUNT(DISTINCT major) FROM students` returns **3** because COUNT ignores NULL. Bio exists in `majors`, but no student has that major.

      </details>
    files:
      - path: summary.sql
        content: |
          SELECT major, COUNT(major) AS n, AVG(gpa) AS avg_gpa
          FROM students
          GROUP BY major
          ORDER BY avg_gpa ASC;
        language: sql
      - path: groups.sql
        content: |
          SELECT major, COUNT(*) AS n, AVG(gpa) AS avg_gpa
          FROM students
          WHERE major IS NOT NULL
          GROUP BY major
          HAVING AVG(gpa) > 3.25
          ORDER BY avg_gpa DESC;
        language: sql
    open_file: summary.sql
    solution:
      files:
        - path: summary.sql
          content: |
            SELECT major, COUNT(*) AS n, AVG(gpa) AS avg_gpa
            FROM students
            GROUP BY major
            ORDER BY avg_gpa DESC;
          language: sql
        - path: groups.sql
          content: |
            SELECT major, COUNT(*) AS n, AVG(gpa) AS avg_gpa
            FROM students
            WHERE major IS NOT NULL
            GROUP BY major
            HAVING AVG(gpa) >= 3.25
            ORDER BY avg_gpa DESC;
          language: sql
      explanation: |
        All groups: CS has 4 students averaging 3.575; Math has 2 averaging 3.25; Physics has 2 averaging 3.2; the NULL group has 1 averaging 3.0. The second query retains CS and Math. Math is exactly on the 3.25 boundary.
    tests:
      - description: "Count all students in all four groups and sort by average, highest first"
        command: |
          __assert_result(db.exec(__read_file('summary.sql')), {
            columns: ['major','n','avg_gpa'], values: [['CS',4,3.575],['Math',2,3.25],['Physics',2,3.2],[null,1,3]], ordered: true
          });
        hints:
          - text: "The missing-major group contains a real student. Count rows, not non-NULL major values."
            condition: "code_contains: COUNT(major)"
          - text: "Descending order puts the largest average first."
            condition: "code_contains: ASC"
          - text: "Keep one row per major, including NULL. Select the group name plus its count and average."
            condition: "code_missing: GROUP BY"
      - description: "Keep CS and Math, with their full-group counts and averages"
        command: |
          __assert_result(db.exec(__read_file('groups.sql')), {
            columns: ['major','n','avg_gpa'], values: [['CS',4,3.575],['Math',2,3.25]], ordered: true
          });
          db.run("UPDATE students SET gpa = 3.8 WHERE major = 'Math'; UPDATE students SET gpa = 4 WHERE major IS NULL;");
          __assert_result(db.exec(__read_file('groups.sql')), {
            columns: ['major','n','avg_gpa'], values: [['Math',2,3.8],['CS',4,3.575]], ordered: true
          });
        hints:
          - text: "At least includes equality. Math's average is exactly 3.25."
            condition: "code_missing: >="
          - text: "A threshold on a group's average belongs in HAVING, after GROUP BY."
            condition: "code_missing: HAVING"
          - text: "Average all students in each named major; do not remove lower GPAs before calculating it."
            condition: "code_contains: WHERE"

  # Pedagogy: Fade to two independent queries; use different output contracts.
  - key: query-report
    title: "Putting Queries Together"
    instructions: |
      ### Why this matters

      Real questions combine several clauses. These two small reports let you choose the clauses yourself.

      ### 🎯 You will learn to

      - Compose a grouped report and a contact list from a specification.

      ### Your two reports — 8 minutes + 2-minute check

      The original **9 students** and **4 majors** are still available. Write one query in each file; the column names below are the required output headers.

      1. **`report.sql`:** for students in **year 2 or later**, report each matched major and its advisor. Keep groups with average GPA **at least 3.2**. Return **`major, advisor, avg_gpa, n`**, highest average first. Include every qualifying student's GPA in the average. Raw averages or rounding to two decimal places are accepted.
      2. **`contacts.sql`:** list students whose **major is missing or GPA is at least 3.8**, including those with no advisor. Return **`name, advisor`**, alphabetically by student name.

      Run each query and Test My Work. Use hints if you get stuck; you do not need a written plan.

      <details markdown="1"><summary>Hint: a clause checklist</summary>

      For the report: match tables, filter years, group by major and advisor, filter averages, then sort. For contacts: keep unmatched students, choose either condition, then sort. `AS avg_gpa` and `AS n` name calculated columns.

      </details>

      **After the checkpoint, the 35-minute query core is complete.** Continue to Steps 7–8 for creating and changing data (about 10 more minutes), or stop here and return later.
    files:
      - path: report.sql
        content: |
          -- Return: major, advisor, avg_gpa, n
          -- Students in year >= 2; group average >= 3.2; highest average first.
        language: sql
      - path: contacts.sql
        content: |
          -- Return: name, advisor
          -- Missing major OR gpa >= 3.8; alphabetical by name; keep unmatched students.
        language: sql
    open_file: report.sql
    solution:
      files:
        - path: report.sql
          content: |
            SELECT s.major, m.advisor, AVG(s.gpa) AS avg_gpa, COUNT(*) AS n
            FROM students AS s
            JOIN majors AS m ON s.major = m.code
            WHERE s.year >= 2
            GROUP BY s.major, m.advisor
            HAVING AVG(s.gpa) >= 3.2
            ORDER BY avg_gpa DESC;
          language: sql
        - path: contacts.sql
          content: |
            SELECT s.name, m.advisor
            FROM students AS s
            LEFT JOIN majors AS m ON s.major = m.code
            WHERE s.major IS NULL OR s.gpa >= 3.8
            ORDER BY s.name;
          language: sql
      explanation: |
        The report returns CS / Dr. Hopper / 3.5333… / 3, then Math / Dr. Noether / 3.25 / 2. CS averages Mango (3.9), Kiwi (3.5), and Orangelo (3.2); Math averages Watermelina (3.4) and Grapenzo (3.1). The contacts are Blue Bella / NULL, then Mango / Dr. Hopper. The left join preserves Blue Bella.
    tests:
      - description: "Report both qualifying majors with the correct advisor, average and count, in order"
        command: |
          __assert_result(db.exec(__read_file('report.sql')), {
            columns: ['major','advisor','avg_gpa','n'],
            values: [['CS','Dr. Hopper',3.533333333333333,3],['Math','Dr. Noether',3.25,2]],
            ordered: true, tolerances: { avg_gpa: 0.005 }
          });
          db.run("UPDATE students SET gpa = 3.8 WHERE major = 'Math'");
          __assert_result(db.exec(__read_file('report.sql')), {
            columns: ['major','advisor','avg_gpa','n'],
            values: [['Math','Dr. Noether',3.8,2],['CS','Dr. Hopper',3.533333333333333,3]],
            ordered: true, tolerances: { avg_gpa: 0.005 }
          });
        hints:
          - text: "Start with the tables: each student's major matches a code in majors. Select the major and advisor."
            condition: >-
              code_not_matches: /SELECT[^;]*\bavg_gpa\b/i
          - text: "Only year 2 or later contributes to each group's count and average. Filter those rows before grouping."
            condition: >-
              code_not_matches: /WHERE[^;]*\byear\b/i
          - text: "Filter group averages after grouping. Count students, and sort the result by average descending."
            condition: "code_missing: HAVING"
          - text: "Check both numeric columns separately. Math has two qualifying students; average their GPAs rather than counting them."
            condition: "code_contains: HAVING"
      - description: "List Blue Bella with no advisor, then Mango with Dr. Hopper"
        command: |
          __assert_result(db.exec(__read_file('contacts.sql')), {
            columns: ['name','advisor'], values: [['Blue Bella',null],['Mango','Dr. Hopper']], ordered: true
          });
          db.run('UPDATE students SET gpa = 3.8 WHERE id = 1');
          __assert_result(db.exec(__read_file('contacts.sql')), {
            columns: ['name','advisor'], values: [['Blue Bella',null],['Mango','Dr. Hopper']], ordered: true
          });
        hints:
          - text: "A student without a major still needs a row. Preserve the students side of the join."
            condition: "code_missing: LEFT"
          - text: "Missing major and high GPA are alternatives, not simultaneous requirements."
            condition: "code_missing: OR"
          - text: "Alphabetical by name needs an explicit sort. Keep the advisor NULL when it is unknown."
            condition: "code_contains: OR"
    quiz:
      title: "Step 6 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:
        - type: single
          difficulty: intermediate
          question: "A student has no matching major. What does `students LEFT JOIN majors` retain for that student?"
          options: ["No student row", "One row with NULL major-table fields", "One row for each major"]
          correct_index: 1
          explanation: "A left join keeps the left-side student and fills unmatched right-side fields with NULL."
          option_feedback:
            0: "This describes an inner join."
            2: "Pairing with every major would be a Cartesian product."
        - type: single
          difficulty: intermediate
          question: "Three rows have major values CS, CS, and NULL. Across these rows, what are `COUNT(*)` and `COUNT(major)`?"
          options: ["3 and 2", "3 and 3", "2 and 1"]
          correct_index: 0
          explanation: "COUNT(*) counts all rows; COUNT(major) skips the missing value. Neither removes duplicates."
          option_feedback:
            1: "COUNT(major) does not count NULL."
            2: "COUNT does not imply DISTINCT."
        - type: single
          difficulty: intermediate
          question: "Which selects students in year 2 or later, then keeps majors averaging at least 3.5?"
          options:
            - "`WHERE year >= 2` ... `HAVING AVG(gpa) >= 3.5`"
            - "`WHERE gpa >= 3.5` ... `HAVING AVG(year) >= 2`"
            - "`WHERE AVG(gpa) >= 3.5` ... `HAVING year >= 2`"
          correct_index: 0
          explanation: "WHERE selects contributing rows; HAVING selects the resulting groups."
          option_feedback:
            1: "Filtering individual GPAs changes which students contribute to the average."
            2: "The group average does not exist at the WHERE stage."
        - type: single
          difficulty: intermediate
          question: "A major has GPAs 4.0 and 2.0. You want its overall average. What goes wrong if you first use `WHERE gpa >= 3.0`?"
          options:
            - "The average becomes 4.0 instead of 3.0."
            - "The average stays 3.0 after filtering."
            - "The average becomes 2.0 instead of 3.0."
          correct_index: 0
          explanation: "WHERE removes the 2.0 row before AVG runs, leaving only 4.0."
          option_feedback:
            1: "AVG sees only rows that survive WHERE."
            2: "The smaller GPA is removed, not retained."
        - type: single
          difficulty: intermediate
          question: "A query runs successfully and returns the expected number of rows. What is still worth checking?"
          options:
            - "Which records, values and order it returns"
            - "Whether its keywords use uppercase letters"
            - "Whether it uses the example's exact aliases"
          correct_index: 0
          explanation: "A logical error can produce the right row count with wrong people or numbers. Equivalent SQL need not look identical."
          option_feedback:
            1: "SQL keyword case does not determine the result."
            2: "Table aliases can differ without changing the answer."

  # Pedagogy: Optional extension in the same tutorial. Complete DDL is a worked
  # example; learners add one constraint and one row. Every Run is restartable.
  - key: create-insert
    title: "Creating and Populating a Table"
    instructions: |
      ### Why this matters

      Applications need a place to store new records. A table defines their columns and basic rules.

      ### 🎯 You will learn to

      - Create a table with required values and insert a new row.

      ### Extension — about 5 more minutes

      The query core is complete. This step and the next use **`practice_students`**, leaving the original `students` and `majors` data intact.

      Run the provided `create.sql`. `CREATE TABLE` defines columns; `INTEGER`, `TEXT`, and `REAL` describe their types. `PRIMARY KEY` identifies each row uniquely. `INSERT INTO ... VALUES` adds records.

      1. Add **`NOT NULL`** after `name TEXT` so a name is required.
      2. Add **`(10, 'Papaya', 3.8)`** as a third row in the INSERT. Separate tuples with commas.

      Run again and Test My Work. The opening `DROP TABLE IF EXISTS` removes only the practice table, so every run starts fresh. It is a reset for this exercise, not a step to copy when saving real data.
    files:
      - path: create.sql
        content: |
          -- Restart this practice table on every Run.
          DROP TABLE IF EXISTS practice_students;
          CREATE TABLE practice_students (
            id INTEGER PRIMARY KEY,
            name TEXT,
            gpa REAL
          );
          INSERT INTO practice_students (id, name, gpa) VALUES
            (1, 'Mango', 3.9),
            (5, 'Kiwi', 3.5);
          SELECT id, name, gpa FROM practice_students ORDER BY id;
        language: sql
    open_file: create.sql
    solution:
      files:
        - path: create.sql
          content: |
            DROP TABLE IF EXISTS practice_students;
            CREATE TABLE practice_students (
              id INTEGER PRIMARY KEY,
              name TEXT NOT NULL,
              gpa REAL
            );
            INSERT INTO practice_students (id, name, gpa) VALUES
              (1, 'Mango', 3.9),
              (5, 'Kiwi', 3.5),
              (10, 'Papaya', 3.8);
            SELECT id, name, gpa FROM practice_students ORDER BY id;
          language: sql
      explanation: |
        The table contains Mango, Kiwi, and Papaya with distinct IDs. A repeated ID violates the primary key; a NULL name violates NOT NULL. Values follow the explicit INSERT column order.
    tests:
      - description: "Create and display the three requested practice records in ID order"
        command: |
          __assert_result(db.exec(__read_file('create.sql')), {
            columns: ['id','name','gpa'], values: [[1,'Mango',3.9],[5,'Kiwi',3.5],[10,'Papaya',3.8]], ordered: true
          });
          __assert_result(db.exec('SELECT id, name, gpa FROM practice_students ORDER BY id'), {
            columns: ['id','name','gpa'], values: [[1,'Mango',3.9],[5,'Kiwi',3.5],[10,'Papaya',3.8]], ordered: true
          });
        hints:
          - text: "Add the new tuple to VALUES, separating it from Kiwi's tuple with a comma."
            condition: "code_missing: Papaya"
          - text: "Use a new ID for Papaya, and put values in the order id, name, gpa."
            condition: "code_contains: Papaya"
          - text: "Keep the final SELECT so you can inspect the stored records."
            condition: "code_missing: SELECT"
      - description: "Reject duplicate IDs and missing names"
        command: |
          db.exec(__read_file('create.sql'));
          let duplicateRejected = false;
          try { db.run("INSERT INTO practice_students VALUES (1, 'Duplicate', 3.0)"); }
          catch (error) { duplicateRejected = /UNIQUE|PRIMARY KEY/.test(error.message); }
          assert(duplicateRejected, 'IDs must be unique.');
          let missingRejected = false;
          try { db.run('INSERT INTO practice_students VALUES (11, NULL, 3.0)'); }
          catch (error) { missingRejected = /NOT NULL/.test(error.message); }
          assert(missingRejected, 'A missing name must be rejected.');
        hints:
          - text: "A name is required. Place the constraint after the name column's type."
            condition: "code_missing: NOT NULL"
          - text: "The ID identifies a row uniquely. Keep its PRIMARY KEY constraint."
            condition: "code_missing: PRIMARY KEY"
          - text: "NOT NULL belongs on name, not only on another column. Rerun the full CREATE script after changing it."
            condition: "code_contains: NOT NULL"

  # Pedagogy: Contrast UPDATE/DELETE/DROP with minimal edits. Reset the exercise
  # fixture in the learner's script so a broad UPDATE cannot poison later runs.
  - key: update-delete-drop
    title: "Changing and Removing Data"
    instructions: |
      ### Why this matters

      Stored records change over time. A WHERE condition controls which records a change affects.

      ### 🎯 You will learn to

      - Update and delete selected rows, and remove a whole table.

      ### Extension — about 5 more minutes

      `UPDATE ... SET ... WHERE ...` changes matching rows. `DELETE FROM ... WHERE ...` removes matching rows. **Without WHERE, both affect every row.** `DROP TABLE` removes the table itself, including its rows.

      `changes.sql` creates its own practice data on every Run, so you can recover from a wrong change by fixing the code and running again.

      Repair three statements near the end:

      1. Update **only Kiwi (id 5)** to GPA **3.6**. Keep all other GPAs.
      2. Delete **only Coconick (id 4)**. Keep Mango, Kiwi, and Papaya.
      3. Remove the **`draft_notes` table itself**, rather than just its rows.

      Run and inspect the remaining records, then Test My Work. For real data, first preview the affected rows with `SELECT ... WHERE` using the same condition.
    files:
      - path: changes.sql
        content: |
          -- Restartable practice data; the original students table is untouched.
          DROP TABLE IF EXISTS practice_students;
          CREATE TABLE practice_students (id INTEGER PRIMARY KEY, name TEXT NOT NULL, gpa REAL);
          INSERT INTO practice_students VALUES
            (1, 'Mango', 3.9), (4, 'Coconick', 2.8), (5, 'Kiwi', 3.5), (10, 'Papaya', 3.8);
          DROP TABLE IF EXISTS draft_notes;
          CREATE TABLE draft_notes (note TEXT);
          INSERT INTO draft_notes VALUES ('temporary');

          -- Repair these three statements.
          UPDATE practice_students SET gpa = 3.6;
          DELETE FROM practice_students WHERE id = 5;
          DELETE FROM draft_notes;

          SELECT id, name, gpa FROM practice_students ORDER BY id;
        language: sql
    open_file: changes.sql
    solution:
      files:
        - path: changes.sql
          content: |
            DROP TABLE IF EXISTS practice_students;
            CREATE TABLE practice_students (id INTEGER PRIMARY KEY, name TEXT NOT NULL, gpa REAL);
            INSERT INTO practice_students VALUES
              (1, 'Mango', 3.9), (4, 'Coconick', 2.8), (5, 'Kiwi', 3.5), (10, 'Papaya', 3.8);
            DROP TABLE IF EXISTS draft_notes;
            CREATE TABLE draft_notes (note TEXT);
            INSERT INTO draft_notes VALUES ('temporary');

            UPDATE practice_students SET gpa = 3.6 WHERE id = 5;
            DELETE FROM practice_students WHERE id = 4;
            DROP TABLE draft_notes;

            SELECT id, name, gpa FROM practice_students ORDER BY id;
          language: sql
      explanation: |
        Mango remains at 3.9, Kiwi changes to 3.6, and Papaya remains at 3.8. Coconick's row is gone; draft_notes no longer exists. The original nine students still support every earlier query.
    tests:
      - description: "Keep Mango and Papaya unchanged, update Kiwi, and remove only Coconick"
        command: |
          __assert_result(db.exec(__read_file('changes.sql')), {
            columns: ['id','name','gpa'], values: [[1,'Mango',3.9],[5,'Kiwi',3.6],[10,'Papaya',3.8]], ordered: true
          });
          __assert_result(db.exec('SELECT id, name, gpa FROM practice_students ORDER BY id'), {
            columns: ['id','name','gpa'], values: [[1,'Mango',3.9],[5,'Kiwi',3.6],[10,'Papaya',3.8]], ordered: true
          });
        hints:
          - text: "The UPDATE needs its own WHERE condition. A WHERE on the DELETE does not restrict the UPDATE."
            condition: "code_contains: SET gpa = 3.6;"
          - text: "The row to delete is Coconick (id 4); Kiwi (id 5) should remain with a new GPA."
            condition: "code_contains: DELETE FROM practice_students WHERE id = 5"
          - text: "Check every surviving GPA, not just Kiwi's. Rerunning the complete script restores the starting data first."
            condition: "code_contains: UPDATE"
      - description: "Remove the draft_notes table, not just its rows"
        command: |
          db.exec(__read_file('changes.sql'));
          assert(__run_query("SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'draft_notes'").length === 0, 'DROP TABLE removes the table; DELETE removes its rows.');
        hints:
          - text: "DELETE removes rows but leaves the table available. Use the command that removes a table."
            condition: "code_contains: DELETE FROM draft_notes"
          - text: "Only remove draft_notes. The practice_students table must remain for the final SELECT."
            condition: "code_contains: DROP TABLE"
          - text: "The reset at the top drops an old table, then creates it again. Remove this new table at the end."
            condition: "code_contains: CREATE TABLE draft_notes"
