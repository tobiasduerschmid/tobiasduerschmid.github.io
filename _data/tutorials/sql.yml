title: "SQL Essentials"
description: "Learn to query with SQL in about 35 minutes, then create and change data in two extra steps (about 10 minutes). SQLite runs in your browser; no installation."

learning_objectives:
  - "Select columns and filter and sort rows to answer a question."
  - "Handle missing values with IS NULL and explain why ordinary comparisons omit them."
  - "Match related rows with JOIN and preserve unmatched rows with LEFT JOIN."
  - "Summarize groups with COUNT and AVG, distinguishing WHERE from HAVING."
  - "Compose and check a multi-table report from a short specification."
  - "Create and populate a table with a primary key and required values."
  - "Update or delete selected rows and distinguish DELETE from DROP TABLE."

backend: sql
require_tests: true
autosave_type: files

# The previous checks could pass incorrect SQL, so old completions must be
# rechecked. Distinct lesson keys and filenames preserve old drafts without
# treating their checks as evidence for this revised sequence.
progress_version: 1
legacy_step_keys: [explore-v1, join-v1, filter-v1, aggregate-v1, create-v1, modify-v1, capstone-v1]

# Read-only query dataset. The extensions use a separate, restartable table.
setup_commands:
  - |
    DROP TABLE IF EXISTS students;
    CREATE TABLE students (
      id      INTEGER PRIMARY KEY,
      name    TEXT    NOT NULL,
      year    INTEGER,
      major   TEXT,
      gpa     REAL
    );
    INSERT INTO students VALUES
      (1, 'Mango',      2, 'CS',      3.90),
      (2, 'Watermelina',3, 'Math',    3.40),
      (3, 'Bananito',   1, 'CS',      3.70),
      (4, 'Coconick',   4, 'Physics', 2.80),
      (5, 'Kiwi',       2, 'CS',      3.50),
      (6, 'Grapenzo',   3, 'Math',    3.10),
      (7, 'Cherrita',   1, 'Physics', 3.60),
      (8, 'Orangelo',   4, 'CS',      3.20),
      (9, 'Blue Bella', 3, NULL,      3.00);

    DROP TABLE IF EXISTS majors;
    CREATE TABLE majors (
      code       TEXT PRIMARY KEY,
      department TEXT NOT NULL,
      advisor    TEXT NOT NULL
    );
    INSERT INTO majors VALUES
      ('CS',      'Engineering',   'Dr. Hopper'),
      ('Math',    'Sciences',      'Dr. Noether'),
      ('Physics', 'Sciences',      'Dr. Curie'),
      ('Bio',     'Life Sciences', 'Dr. McClintock');


steps:
  # Pedagogy: Explore a worked example, then choose a narrower result.
  # Core time budget: 3 + 5 + 5 + 5 + 7 + 10 = 35 minutes, including quizzes.
  - key: select-columns
    title: "Selecting Columns"
    instructions: |
      ### Why this matters

      SQL describes the data you want. The database finds it for you.

      ### 🎯 You will learn to

      - Select the columns a result needs.

      ### Try it — 3 minutes

      **Run `columns.sql`.** Inspect the students and the five columns: `id`, `name`, `year`, `major`, `gpa`.

      `SELECT` chooses columns (separate names with commas); `FROM` names the table; `*` means all columns.

      **Your task:** return every student's name and major, in that column order, with no extra columns. Will choosing fewer columns also remove students? Predict, edit, then Run and **Test My Work**.

      **Stuck?** Try the check, then open **Hints** for help with your attempt. Revise and check again.

      **Your route:** about **35 minutes** for Steps 1–6, including brief knowledge checks; about **10 more minutes** for Steps 7–8. These are estimates, not time limits.

    files:
      - path: columns.sql
        content: |
          SELECT * FROM students;
        language: sql
    open_file: columns.sql
    solution:
      files:
        - path: columns.sql
          content: |
            SELECT name, major FROM students;
          language: sql
      explanation: |
        The result still has 9 rows, but now only 2 columns. Choosing columns does not filter rows. Explicit column lists make the output you need clear.
    tests:
      - description: "Return all nine students with only name and major, in that column order"
        command: |
          __assert_result(db.exec(__read_file('columns.sql')), {
            columns: ['name', 'major'],
            values: [['Mango','CS'],['Watermelina','Math'],['Bananito','CS'],['Coconick','Physics'],['Kiwi','CS'],['Grapenzo','Math'],['Cherrita','Physics'],['Orangelo','CS'],['Blue Bella',null]]
          });
        hints:
          - text: "Compare the output headers with the requested information. Which part of the query controls columns?"
            condition: >-
              code_matches: /SELECT\s+\*/i
          - text: "Sketch two slots for the output headers. Fill them from the task, then compare that list with your SELECT list."
            condition: >-
              code_not_matches: /SELECT\s+(?:\*|[^;]*\bname\b)/i
          - text: "Check columns and rows separately: changing the displayed fields should not remove any students."
            condition: >-
              code_matches: /SELECT\s+(?!\*)[^;]*\bname\b/i
    quiz:
      title: "Step 1 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:
        - type: single
          difficulty: intermediate
          question: "A songs table has 6 rows. What does `SELECT title FROM songs` return?"
          options: ["6 rows, 1 column", "1 row, 6 columns", "Only rows with unique titles"]
          correct_index: 0
          explanation: "Choosing one column keeps all six rows, even if some titles repeat."
          option_feedback:
            1: "The SELECT list chooses columns, not how many rows remain."
            2: "Selecting a column does not remove repeated values."

  # Pedagogy: Diagnose contrasting filters on familiar data.
  - key: filter-sort
    title: "Filtering and Sorting"
    instructions: |
      ### Why this matters

      Most questions need a subset of rows. An explicit sort makes their order reliable.

      ### 🎯 You will learn to

      - Combine conditions with `AND` or `OR` and sort results.

      ### Two small repairs — 5 minutes

      ```sql
      SELECT name, year FROM students
      WHERE year >= 3
      ORDER BY name;
      ```

      `WHERE` keeps matching rows. `AND` requires **both** conditions; `OR` accepts **either**. `DESC` sorts highest first; `ASC` sorts lowest first. Without `ORDER BY`, row order is not guaranteed.

      1. **`cs-students.sql`:** return `name, gpa` for CS students with GPA **at least 3.5**, highest GPA first.
      2. **`either.sql`:** return `name, major` for students in **Math or Physics**, in any order.

      Predict whether each starter includes too many or too few students. Run, compare with the requirements, then repair and Test My Work.
    files:
      - path: cs-students.sql
        content: |
          SELECT name, gpa FROM students
          WHERE major = 'CS' OR gpa >= 3.5
          ORDER BY gpa ASC;
        language: sql
      - path: either.sql
        content: |
          SELECT name, major FROM students
          WHERE major = 'Math' AND major = 'Physics';
        language: sql
    open_file: cs-students.sql
    solution:
      files:
        - path: cs-students.sql
          content: |
            SELECT name, gpa FROM students
            WHERE major = 'CS' AND gpa >= 3.5
            ORDER BY gpa DESC;
          language: sql
        - path: either.sql
          content: |
            SELECT name, major FROM students
            WHERE major = 'Math' OR major = 'Physics';
          language: sql
      explanation: |
        Both conditions give Mango (3.9), Bananito (3.7), and Kiwi (3.5), in that order. A student has one major, so Math OR Physics returns four students; Math AND Physics returns none.
    tests:
      - description: "Return exactly the three qualifying CS students, highest GPA first"
        command: |
          __assert_result(db.exec(__read_file('cs-students.sql')), {
            columns: ['name','gpa'], values: [['Mango',3.9],['Bananito',3.7],['Kiwi',3.5]], ordered: true
          });
          // Ensure the requested sort is not just the table's incidental order.
          db.run('UPDATE students SET gpa = 3.6 WHERE id = 1');
          __assert_result(db.exec(__read_file('cs-students.sql')), {
            columns: ['name','gpa'], values: [['Bananito',3.7],['Mango',3.6],['Kiwi',3.5]], ordered: true
          });
        hints:
          - text: "Trace Cherrita: a Physics student with GPA 3.6. Should that row qualify under the task? Does your filter agree?"
            condition: >-
              code_matches: /SELECT\s+name\s*,\s*gpa\b[^;]*\bOR\b/i
          - text: "Compare the first and last GPA in cs-students.sql's result. Which one should be larger?"
            condition: >-
              code_matches: /SELECT\s+name\s*,\s*gpa\b(?![^;]*\bOR\b)[^;]*\bASC\b/i
          - text: "Check three cases separately: the wrong major, a GPA exactly on the boundary, and two qualifying GPAs in different orders."
            condition: >-
              code_not_matches: /SELECT\s+name\s*,\s*gpa\b[^;]*\b(?:OR|ASC)\b/i
      - description: "Return every Math or Physics student, with no other majors"
        command: |
          __assert_result(db.exec(__read_file('either.sql')), {
            columns: ['name','major'], values: [['Watermelina','Math'],['Coconick','Physics'],['Grapenzo','Math'],['Cherrita','Physics']]
          });
        hints:
          - text: "Take a Math student. Evaluate each comparison separately, then ask whether your connector keeps that row."
            condition: >-
              code_matches: /SELECT\s+name\s*,\s*major\b[^;]*'Math'\s+AND\b/i
          - text: "Make a three-row case list: Math, Physics, CS. Mark which should qualify before writing the filter."
            condition: >-
              code_not_matches: /SELECT\s+name\s*,\s*major\b[^;]*'Math'/i
          - text: "Compare your result against both requested majors. A filter can admit one group while accidentally excluding the other."
            condition: >-
              code_matches: /SELECT\s+name\s*,\s*major\b(?![^;]*'Math'\s+AND\b)[^;]*'Math'/i
    quiz:
      title: "Step 2 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:
        - type: single
          difficulty: intermediate
          question: "A track has genre 'Jazz' and rating 2. Does `genre = 'Jazz' OR rating >= 4` include it?"
          options: ["Yes, one condition is true.", "No, both conditions must be true.", "No, the rating condition takes priority."]
          correct_index: 0
          explanation: "OR accepts a row when either condition is true; this track matches the genre."
          option_feedback:
            1: "Requiring both conditions describes AND."
            2: "Neither side of OR overrides the other."

  # Pedagogy: Make a missing row visible; retrieve selection/filtering in a short quiz.
  - key: missing-values
    title: "Missing Values"
    instructions: |
      ### Why this matters

      Missing data is common. A comparison can silently leave those rows out.

      ### 🎯 You will learn to

      - Find missing values and include them deliberately in a filter.

      ### Find the missing student — 3 minutes + 2-minute check

      Blue Bella has no recorded major: its value is **`NULL`**. It is not the text `'NULL'` or an empty string.

      Comparisons such as `major = NULL` and `major != 'CS'` are **unknown** for that row. `WHERE` keeps only true conditions. Use `IS NULL` to find missing values; `IS NOT NULL` finds known values.

      1. **`missing.sql`:** return `name` for students with no recorded major.
      2. **`outside-cs.sql`:** return `name, major` for students whose major is **not CS or is missing**, in any order.

      Predict whether Blue Bella appears in each starter's result. Run, revise, and check both files. Next opens a five-question checkpoint; four correct answers pass.
    files:
      - path: missing.sql
        content: |
          SELECT name FROM students WHERE major = NULL;
        language: sql
      - path: outside-cs.sql
        content: |
          SELECT name, major FROM students
          WHERE major != 'CS';
        language: sql
    open_file: missing.sql
    solution:
      files:
        - path: missing.sql
          content: |
            SELECT name FROM students WHERE major IS NULL;
          language: sql
        - path: outside-cs.sql
          content: |
            SELECT name, major FROM students
            WHERE major != 'CS' OR major IS NULL;
          language: sql
      explanation: |
        `missing.sql` returns Blue Bella. `outside-cs.sql` returns the four Math/Physics students plus Blue Bella. `IS NULL` is true for the missing value, so the OR condition includes it.
    tests:
      - description: "Find students with a missing major, even when records change"
        command: |
          __assert_result(db.exec(__read_file('missing.sql')), { columns: ['name'], values: [['Blue Bella']] });
          db.run("UPDATE students SET major = 'Bio' WHERE id = 9; UPDATE students SET major = NULL WHERE id = 5;");
          __assert_result(db.exec(__read_file('missing.sql')), { columns: ['name'], values: [['Kiwi']] });
        hints:
          - text: "What truth value does an ordinary comparison produce when one side is missing? Revisit which values WHERE retains."
            condition: >-
              code_matches: /SELECT\s+name\s+FROM\b[^;]*=\s*NULL\b/i
          - text: "Compare a missing value with the four-character text 'NULL'. Which one is actually stored in this dataset?"
            condition: >-
              code_matches: /SELECT\s+name\s+FROM\b[^;]*'NULL'/i
          - text: "Imagine a different student lost their major. Check that your query follows the missing data, rather than a name or ID."
            condition: >-
              code_not_matches: /SELECT\s+name\s+FROM\b[^;]*(?:=\s*NULL\b|'NULL')/i
      - description: "Include known non-CS majors and missing majors"
        command: |
          __assert_result(db.exec(__read_file('outside-cs.sql')), {
            columns: ['name','major'], values: [['Watermelina','Math'],['Coconick','Physics'],['Grapenzo','Math'],['Cherrita','Physics'],['Blue Bella',null]]
          });
        hints:
          - text: "Trace the filter for Blue Bella. Is its result true, false, or unknown—and which values does WHERE keep?"
            condition: >-
              code_not_matches: /SELECT\s+name\s*,\s*major\b[^;]*\bNULL\b/i
          - text: "Try one Math student and one student with no major. Does each satisfy both tests, or just one?"
            condition: >-
              code_matches: /SELECT\s+name\s*,\s*major\b[^;]*\bAND\b[^;]*\bNULL\b/i
          - text: "Make a small truth table for CS, another major, and missing data. Compare the result of your whole condition with the task."
            condition: >-
              code_matches: /SELECT\s+name\s*,\s*major\b(?![^;]*\bAND\b)[^;]*\bNULL\b/i
    quiz:
      title: "Step 3 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:
        - type: single
          difficulty: basic
          question: "A table has 9 rows and 5 columns. What does `SELECT name, major FROM students` return?"
          options: ["9 rows and 2 columns", "2 rows and 5 columns", "9 rows and 5 columns"]
          correct_index: 0
          explanation: "SELECT chooses columns. Without a row filter, all nine rows remain."
          option_feedback:
            1: "A column list does not choose how many rows to return."
            2: "Only the two named columns are selected."
        - type: single
          difficulty: basic
          question: "A student has one major. Which condition includes Math students and Physics students?"
          options: ["`major = 'Math' AND major = 'Physics'`", "`major = 'Math' OR major = 'Physics'`", "`major != 'Math' AND major != 'Physics'`"]
          correct_index: 1
          explanation: "OR accepts either major. AND would require one value to equal both."
          option_feedback:
            2: "This excludes both requested majors."
        - type: single
          difficulty: basic
          question: "GPAs are 3.1, 3.9, and 3.5. Which order does `ORDER BY gpa DESC` request?"
          options: ["3.1, 3.5, 3.9", "3.9, 3.5, 3.1", "3.1, 3.9, 3.5"]
          correct_index: 1
          explanation: "DESC means descending: largest first."
          option_feedback:
            0: "This is ascending order."
            2: "The input order does not determine a descending sort."
        - type: single
          difficulty: intermediate
          question: "A row's major is NULL. What happens under `WHERE major != 'CS'`?"
          options: ["The row is included because its major is not CS.", "The row is omitted because the comparison is unknown.", "The query fails because NULL cannot be compared."]
          correct_index: 1
          explanation: "The comparison is valid but unknown. WHERE retains only true conditions."
          option_feedback:
            0: "A missing value is not a known different value."
            2: "This is a missing-row problem, not a syntax error."
        - type: single
          difficulty: basic
          question: "Which condition finds rows with no recorded major?"
          options: ["`major = 'NULL'`", "`major = NULL`", "`major IS NULL`"]
          correct_index: 2
          explanation: "IS NULL tests for a missing value."
          option_feedback:
            0: "Quotes turn NULL into text."
            1: "Equality with NULL yields unknown, not true."

  # Pedagogy: Contrast a Cartesian product, matched rows and a left join.
  - key: join-tables
    title: "Matching Tables"
    instructions: |
      ### Why this matters

      Related facts often live in different tables. A join brings them into one result.

      ### 🎯 You will learn to

      - Match rows by a key and preserve unmatched students when needed.

      ### Match, then keep the missing row — 5 minutes

      `majors(code, department, advisor)` lists CS, Math, Physics, and Bio. Students store their major in `students.major`.

      **Example with different tables:**

      ```sql
      FROM tracks AS t
      JOIN albums AS a ON t.album_id = a.id
      ```

      `AS` gives a table a short name; `ON` defines a match. `JOIN` (an inner join) keeps matches; `LEFT JOIN` also keeps unmatched rows from the left table, filling right-side fields with `NULL`.

      1. **`advisors.sql`:** return `name, advisor` for students who have a matching major, once each.
      2. **`all-advisors.sql`:** return the same columns for **every student**, even without an advisor.

      The comma in each starter pairs every student with every major. Choose the matching rule and join for each task. Predict which students each result keeps, then Run and Test My Work. Any row order is fine.
    files:
      - path: advisors.sql
        content: |
          SELECT s.name, m.advisor
          FROM students AS s, majors AS m;
        language: sql
      - path: all-advisors.sql
        content: |
          SELECT s.name, m.advisor
          FROM students AS s, majors AS m;
        language: sql
    open_file: advisors.sql
    solution:
      files:
        - path: advisors.sql
          content: |
            SELECT s.name, m.advisor
            FROM students AS s
            JOIN majors AS m ON s.major = m.code;
          language: sql
        - path: all-advisors.sql
          content: |
            SELECT s.name, m.advisor
            FROM students AS s
            LEFT JOIN majors AS m ON s.major = m.code;
          language: sql
      explanation: |
        The inner join returns eight students with their own major's advisor. The left join also returns Blue Bella with a NULL advisor. Bio has no students, so it adds no student rows to either result.
    tests:
      - description: "Match students to their own major's advisor, once each"
        command: |
          __assert_result(db.exec(__read_file('advisors.sql')), {
            columns: ['name','advisor'],
            values: [['Mango','Dr. Hopper'],['Watermelina','Dr. Noether'],['Bananito','Dr. Hopper'],['Coconick','Dr. Curie'],['Kiwi','Dr. Hopper'],['Grapenzo','Dr. Noether'],['Cherrita','Dr. Curie'],['Orangelo','Dr. Hopper']]
          });
        hints:
          - text: "Pick one student in advisors.sql's output. Why do they appear beside advisors from unrelated majors?"
            condition: >-
              code_matches: /FROM\s+students\s+(?:AS\s+)?s\s*,\s*majors/i
          - text: "Compare sample values in each table. Which pair of fields describes the same fact, even though the field names differ?"
            condition: >-
              code_not_matches: /FROM\s+students\s+(?:AS\s+)?s\s*,\s*majors|\bON\b/i
          - text: "Trace one proposed pair through your matching condition. Then check a pair from different majors: should both survive?"
            condition: >-
              code_matches: /^(?![\s\S]*FROM\s+students\s+(?:AS\s+)?s\s*,\s*majors)[\s\S]*\bON\b/i
      - description: "Preserve every student, including those without an advisor"
        command: |
          __assert_result(db.exec(__read_file('all-advisors.sql')), {
            columns: ['name','advisor'],
            values: [['Mango','Dr. Hopper'],['Watermelina','Dr. Noether'],['Bananito','Dr. Hopper'],['Coconick','Dr. Curie'],['Kiwi','Dr. Hopper'],['Grapenzo','Dr. Noether'],['Cherrita','Dr. Curie'],['Orangelo','Dr. Hopper'],['Blue Bella',null]]
          });
        hints:
          - text: "In all-advisors.sql, inspect a student who has no matching major. Which join behavior could keep that student?"
            condition: >-
              code_not_matches: /\bLEFT\s+(?:OUTER\s+)?JOIN\b/i
          - text: "A left join preserves one side of the relationship. Compare the table on that side with the people the report must keep."
            condition: >-
              code_matches: /FROM\s+majors\b[^;]*\bLEFT\s+(?:OUTER\s+)?JOIN\b/i
          - text: "Follow an unmatched student from the join to any later filter. At which stage could the row disappear?"
            condition: >-
              code_matches: /FROM\s+students\b[^;]*\bLEFT\s+(?:OUTER\s+)?JOIN\b/i
    quiz:
      title: "Step 4 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:
        - type: single
          difficulty: intermediate
          question: "Three orders reference customers. Two have a matching customer; one does not. How many rows does an inner join return if each customer ID is unique?"
          options: ["2 rows", "3 rows", "6 rows"]
          correct_index: 0
          explanation: "An inner join returns the two matching pairs. The unmatched order contributes no row."
          option_feedback:
            1: "Keeping the unmatched order would require different join behavior."
            2: "The matching condition prevents every order from pairing with every customer."

  # Pedagogy: A worked grouping example, then contrasting row/group filters.
  - key: group-summaries
    title: "Group Summaries"
    instructions: |
      ### Why this matters

      Reports often need one row per group. Aggregate functions turn many rows into a count or average.

      ### 🎯 You will learn to

      - Count and average groups, then filter the groups with `HAVING`.

      ### Summarize the students — 7 minutes

      ```sql
      SELECT year, COUNT(*) AS n
      FROM students
      GROUP BY year;
      ```

      This example counts students per year. `AS` names an output column. `COUNT(*)` counts rows; `COUNT(column)` counts known values; `AVG(column)` averages known values.

      1. **`summary.sql`:** count **every student** in each major, including the missing-major group. Return `major, n, avg_gpa`, highest average first.
      2. **`groups.sql`:** return only **named majors averaging at least 3.25**, with the same columns and ordering.

      **`WHERE` filters rows before grouping; `HAVING` filters groups afterward.** Filtering individual GPAs would change the average you are calculating.

      Check a missing value and an average exactly at the threshold. Which starter requirements fail? Repair, Run, and Test My Work.

    files:
      - path: summary.sql
        content: |
          SELECT major, COUNT(major) AS n, AVG(gpa) AS avg_gpa
          FROM students
          GROUP BY major
          ORDER BY avg_gpa ASC;
        language: sql
      - path: groups.sql
        content: |
          SELECT major, COUNT(*) AS n, AVG(gpa) AS avg_gpa
          FROM students
          WHERE major IS NOT NULL
          GROUP BY major
          HAVING AVG(gpa) > 3.25
          ORDER BY avg_gpa DESC;
        language: sql
    open_file: summary.sql
    solution:
      files:
        - path: summary.sql
          content: |
            SELECT major, COUNT(*) AS n, AVG(gpa) AS avg_gpa
            FROM students
            GROUP BY major
            ORDER BY avg_gpa DESC;
          language: sql
        - path: groups.sql
          content: |
            SELECT major, COUNT(*) AS n, AVG(gpa) AS avg_gpa
            FROM students
            WHERE major IS NOT NULL
            GROUP BY major
            HAVING AVG(gpa) >= 3.25
            ORDER BY avg_gpa DESC;
          language: sql
      explanation: |
        All groups: CS has 4 students averaging 3.575; Math has 2 averaging 3.25; Physics has 2 averaging 3.2; the NULL group has 1 averaging 3.0. The second query retains CS and Math. Math is exactly on the 3.25 boundary.
    tests:
      - description: "Count all students in all four groups and sort by average, highest first"
        command: |
          __assert_result(db.exec(__read_file('summary.sql')), {
            columns: ['major','n','avg_gpa'], values: [['CS',4,3.575],['Math',2,3.25],['Physics',2,3.2],[null,1,3]], ordered: true
          });
        hints:
          - text: "The missing-major group contains a student. Compare what each counting form measures when its argument is missing."
            condition: >-
              code_matches: /COUNT\s*\(\s*major\s*\)/i
          - text: "Compare the first and last averages in summary.sql's output. Does their order answer the report's question?"
            condition: >-
              code_matches: /SELECT\b(?![^;]*COUNT\s*\(\s*major\s*\))[^;]*\bASC\b/i
          - text: "Check the result in three passes: one row per group, a count of its students, then the order of group averages."
            condition: >-
              code_not_matches: /COUNT\s*\(\s*major\s*\)|\bASC\b/i
      - description: "Keep qualifying named majors with full-group counts and averages"
        command: |
          __assert_result(db.exec(__read_file('groups.sql')), {
            columns: ['major','n','avg_gpa'], values: [['CS',4,3.575],['Math',2,3.25]], ordered: true
          });
          db.run("UPDATE students SET gpa = 3.8 WHERE major = 'Math'; UPDATE students SET gpa = 4 WHERE major IS NULL;");
          __assert_result(db.exec(__read_file('groups.sql')), {
            columns: ['major','n','avg_gpa'], values: [['Math',2,3.8],['CS',4,3.575]], ordered: true
          });
        hints:
          - text: "Test three imagined averages: 3.24, 3.25, and 3.26. Which should pass the stated threshold?"
            condition: >-
              code_matches: /HAVING\s+AVG\s*\(\s*gpa\s*\)\s*>\s*3\.25/i
          - text: "Does this condition describe an individual student or a completed group's summary? Locate the clause that operates at that stage."
            condition: >-
              code_not_matches: /\bHAVING\b/i
          - text: "For one retained major, list the GPAs contributing to its average. Check that filtering has not changed that list."
            condition: >-
              code_matches: /\bHAVING\b(?!\s+AVG\s*\(\s*gpa\s*\)\s*>\s*3\.25)/i
    quiz:
      title: "Step 5 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:
        - type: single
          difficulty: intermediate
          question: "A club has scores 2 and 8. What average remains after `WHERE score >= 5` filters its rows?"
          options: ["8", "5", "2"]
          correct_index: 0
          explanation: "The filter removes the score 2 before averaging, leaving only 8."
          option_feedback:
            1: "That is the average before the row filter."
            2: "The condition keeps the larger score, not the smaller one."

  # Pedagogy: Fade to two independent queries; use different output contracts.
  - key: query-report
    title: "Putting Queries Together"
    instructions: |
      ### Why this matters

      Real questions combine several clauses. These two small reports let you choose the clauses yourself.

      ### 🎯 You will learn to

      - Compose a grouped report and a contact list from a specification.

      ### Your two reports — 8 minutes + 2-minute check

      The original **9 students** and **4 majors** are still available. Write one query in each file; the column names below are the required output headers.

      1. **`report.sql`:** for students in **year 2 or later**, report each matched major and its advisor. Keep groups with average GPA **at least 3.2**. Return **`major, advisor, avg_gpa, n`**, highest average first. Include every qualifying student's GPA in the average. Raw averages or rounding to two decimal places are accepted.
      2. **`contacts.sql`:** list students whose **major is missing or GPA is at least 3.8**, including those with no advisor. Return **`name, advisor`**, alphabetically by student name.

      Predict which rows contribute to each report. Run and Test My Work; open **Hints** for a failed check, then revise.

      **After the checkpoint, the 35-minute query core is complete.** Continue to Steps 7–8 for creating and changing data (about 10 more minutes), or stop here and return later.
    files:
      - path: report.sql
        content: |
          -- Return: major, advisor, avg_gpa, n
        language: sql
      - path: contacts.sql
        content: |
          -- Return: name, advisor
        language: sql
    open_file: report.sql
    solution:
      files:
        - path: report.sql
          content: |
            SELECT s.major, m.advisor, AVG(s.gpa) AS avg_gpa, COUNT(*) AS n
            FROM students AS s
            JOIN majors AS m ON s.major = m.code
            WHERE s.year >= 2
            GROUP BY s.major, m.advisor
            HAVING AVG(s.gpa) >= 3.2
            ORDER BY avg_gpa DESC;
          language: sql
        - path: contacts.sql
          content: |
            SELECT s.name, m.advisor
            FROM students AS s
            LEFT JOIN majors AS m ON s.major = m.code
            WHERE s.major IS NULL OR s.gpa >= 3.8
            ORDER BY s.name;
          language: sql
      explanation: |
        The report returns CS / Dr. Hopper / 3.5333… / 3, then Math / Dr. Noether / 3.25 / 2. CS averages Mango (3.9), Kiwi (3.5), and Orangelo (3.2); Math averages Watermelina (3.4) and Grapenzo (3.1). The contacts are Blue Bella / NULL, then Mango / Dr. Hopper. The left join preserves Blue Bella.
    tests:
      - description: "Report qualifying majors with the correct advisor, average and count, in order"
        command: |
          __assert_result(db.exec(__read_file('report.sql')), {
            columns: ['major','advisor','avg_gpa','n'],
            values: [['CS','Dr. Hopper',3.533333333333333,3],['Math','Dr. Noether',3.25,2]],
            ordered: true, tolerances: { avg_gpa: 0.005 }
          });
          db.run("UPDATE students SET gpa = 3.8 WHERE major = 'Math'");
          __assert_result(db.exec(__read_file('report.sql')), {
            columns: ['major','advisor','avg_gpa','n'],
            values: [['Math','Dr. Noether',3.8,2],['CS','Dr. Hopper',3.533333333333333,3]],
            ordered: true, tolerances: { avg_gpa: 0.005 }
          });
        hints:
          - text: "For report.sql, label each requested output as a stored field or a calculated summary. Which source data does each need?"
            condition: >-
              code_not_matches: /SELECT[^;]*\bavg_gpa\b/i
          - text: "Trace a year-1 student. At what stage should that student stop contributing to the report's count and average?"
            condition: >-
              code_matches: /SELECT\b(?=[^;]*\bavg_gpa\b)(?![^;]*\bWHERE\b[^;]*\byear\b)/i
          - text: "Classify the two thresholds: one concerns a student and one a group. Which can be evaluated before the average exists?"
            condition: >-
              code_matches: /SELECT\b(?=[^;]*\bavg_gpa\b)(?=[^;]*\bWHERE\b[^;]*\byear\b)(?![^;]*\bHAVING\b)/i
          - text: "Hand-check one major: list eligible students, then calculate its count and average separately. Compare both numbers and their output headers."
            condition: >-
              code_matches: /\bHAVING\b/i
      - description: "List qualifying contacts alphabetically, preserving students without advisors"
        command: |
          __assert_result(db.exec(__read_file('contacts.sql')), {
            columns: ['name','advisor'], values: [['Blue Bella',null],['Mango','Dr. Hopper']], ordered: true
          });
          db.run('UPDATE students SET gpa = 3.8 WHERE id = 1');
          __assert_result(db.exec(__read_file('contacts.sql')), {
            columns: ['name','advisor'], values: [['Blue Bella',null],['Mango','Dr. Hopper']], ordered: true
          });
        hints:
          - text: "For contacts.sql, trace a student with no major through the table-matching step. Is the row still available to filter?"
            condition: "code_missing: LEFT"
          - text: "Try a student with a missing major and GPA 3.0, then a named major and GPA 3.8. Decide eligibility before evaluating your connector."
            condition: >-
              code_matches: /SELECT\s+(?:\w+\.)?name\b[^;]*\bLEFT\s+(?:OUTER\s+)?JOIN\b(?![^;]*\bOR\b)/i
          - text: "Check the threshold boundary and then compare the returned names alphabetically. Does the result preserve an unknown advisor as missing data?"
            condition: >-
              code_matches: /SELECT\s+(?:\w+\.)?name\b[^;]*\bLEFT\s+(?:OUTER\s+)?JOIN\b[^;]*\bOR\b/i
    quiz:
      title: "Step 6 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:
        - type: single
          difficulty: intermediate
          question: "A student has no matching major. What does `students LEFT JOIN majors` retain for that student?"
          options: ["No student row", "One row with NULL major-table fields", "One row for each major"]
          correct_index: 1
          explanation: "A left join keeps the left-side student and fills unmatched right-side fields with NULL."
          option_feedback:
            0: "This describes an inner join."
            2: "Pairing with every major would be a Cartesian product."
        - type: single
          difficulty: intermediate
          question: "Three rows have major values CS, CS, and NULL. Across these rows, what are `COUNT(*)` and `COUNT(major)`?"
          options: ["3 and 2", "3 and 3", "2 and 1"]
          correct_index: 0
          explanation: "COUNT(*) counts all rows; COUNT(major) skips the missing value. Neither removes duplicates."
          option_feedback:
            1: "COUNT(major) does not count NULL."
            2: "COUNT does not imply DISTINCT."
        - type: single
          difficulty: intermediate
          question: "Which selects students in year 2 or later, then keeps majors averaging at least 3.5?"
          options:
            - "`WHERE year >= 2` ... `HAVING AVG(gpa) >= 3.5`"
            - "`WHERE gpa >= 3.5` ... `HAVING AVG(year) >= 2`"
            - "`WHERE AVG(gpa) >= 3.5` ... `HAVING year >= 2`"
          correct_index: 0
          explanation: "WHERE selects contributing rows; HAVING selects the resulting groups."
          option_feedback:
            1: "Filtering individual GPAs changes which students contribute to the average."
            2: "The group average does not exist at the WHERE stage."
        - type: single
          difficulty: intermediate
          question: "A major has GPAs 4.0 and 2.0. You want its overall average. What goes wrong if you first use `WHERE gpa >= 3.0`?"
          options:
            - "The average becomes 4.0 instead of 3.0."
            - "The average stays 3.0 after filtering."
            - "The average becomes 2.0 instead of 3.0."
          correct_index: 0
          explanation: "WHERE removes the 2.0 row before AVG runs, leaving only 4.0."
          option_feedback:
            1: "AVG sees only rows that survive WHERE."
            2: "The smaller GPA is removed, not retained."
        - type: single
          difficulty: intermediate
          question: "A query runs successfully and returns the expected number of rows. What is still worth checking?"
          options:
            - "Which records, values and order it returns"
            - "Whether its keywords use uppercase letters"
            - "Whether it uses the example's exact aliases"
          correct_index: 0
          explanation: "A logical error can produce the right row count with wrong people or numbers. Equivalent SQL need not look identical."
          option_feedback:
            1: "SQL keyword case does not determine the result."
            2: "Table aliases can differ without changing the answer."

  # Pedagogy: Optional extension in the same tutorial. Complete DDL is a worked
  # example; learners add one constraint and one row. Every Run is restartable.
  - key: create-insert
    title: "Creating and Populating a Table"
    instructions: |
      ### Why this matters

      Applications need a place to store new records. A table defines their columns and basic rules.

      ### 🎯 You will learn to

      - Create a table with required values and insert a new row.

      ### Extension — about 5 more minutes

      The query core is complete. This step and the next use **`practice_students`**, leaving the original `students` and `majors` data intact.

      Run `create.sql` and inspect its two records. `CREATE TABLE` defines columns; `INTEGER`, `TEXT`, and `REAL` describe their types. `PRIMARY KEY` identifies rows uniquely; `NOT NULL` requires a value. `INSERT INTO ... VALUES` adds records in the listed column order.

      1. Make the table reject a missing student name while preserving unique IDs.
      2. Store **Papaya**, with **ID 10** and **GPA 3.8**, alongside the existing students. Keep the final display in ID order.

      Run again and Test My Work. The opening `DROP TABLE IF EXISTS` removes only the practice table, so every run starts fresh. It is a reset for this exercise, not a step to copy when saving real data.
    files:
      - path: create.sql
        content: |
          -- Restart this practice table on every Run.
          DROP TABLE IF EXISTS practice_students;
          CREATE TABLE practice_students (
            id INTEGER PRIMARY KEY,
            name TEXT,
            gpa REAL
          );
          INSERT INTO practice_students (id, name, gpa) VALUES
            (1, 'Mango', 3.9),
            (5, 'Kiwi', 3.5);
          SELECT id, name, gpa FROM practice_students ORDER BY id;
        language: sql
    open_file: create.sql
    solution:
      files:
        - path: create.sql
          content: |
            DROP TABLE IF EXISTS practice_students;
            CREATE TABLE practice_students (
              id INTEGER PRIMARY KEY,
              name TEXT NOT NULL,
              gpa REAL
            );
            INSERT INTO practice_students (id, name, gpa) VALUES
              (1, 'Mango', 3.9),
              (5, 'Kiwi', 3.5),
              (10, 'Papaya', 3.8);
            SELECT id, name, gpa FROM practice_students ORDER BY id;
          language: sql
      explanation: |
        The table contains Mango, Kiwi, and Papaya with distinct IDs. A repeated ID violates the primary key; a NULL name violates NOT NULL. Values follow the explicit INSERT column order.
    tests:
      - description: "Create and display the three requested practice records in ID order"
        command: |
          __assert_result(db.exec(__read_file('create.sql')), {
            columns: ['id','name','gpa'], values: [[1,'Mango',3.9],[5,'Kiwi',3.5],[10,'Papaya',3.8]], ordered: true
          });
          __assert_result(db.exec('SELECT id, name, gpa FROM practice_students ORDER BY id'), {
            columns: ['id','name','gpa'], values: [[1,'Mango',3.9],[5,'Kiwi',3.5],[10,'Papaya',3.8]], ordered: true
          });
        hints:
          - text: "Compare the records in the task with those stored by create.sql. Which record is not represented yet?"
            condition: "code_missing: Papaya"
          - text: "Label each inserted value with the column above it. Do those field-value pairs match the requested record?"
            condition: >-
              code_matches: /INSERT\b(?=[^;]*'Papaya')(?=[\s\S]*\bSELECT\b)/i
          - text: "Inserting data and displaying it are separate operations. How will you inspect the stored records after your change?"
            condition: >-
              code_matches: /INSERT\b(?=[^;]*'Papaya')(?![\s\S]*\bSELECT\b)/i
      - description: "Reject duplicate IDs and missing names"
        command: |
          db.exec(__read_file('create.sql'));
          let duplicateRejected = false;
          try { db.run("INSERT INTO practice_students VALUES (1, 'Duplicate', 3.0)"); }
          catch (error) { duplicateRejected = /UNIQUE|PRIMARY KEY/.test(error.message); }
          assert(duplicateRejected, 'IDs must be unique.');
          let missingRejected = false;
          try { db.run('INSERT INTO practice_students VALUES (11, NULL, 3.0)'); }
          catch (error) { missingRejected = /NOT NULL/.test(error.message); }
          assert(missingRejected, 'A missing name must be rejected.');
        hints:
          - text: "A column type describes values; a constraint rejects unwanted records. Which unwanted record must the name column reject?"
            condition: "code_missing: NOT NULL"
          - text: "Consider inserting two students with the same ID. Which part of the table definition is responsible for distinguishing rows?"
            condition: >-
              code_matches: /^(?=[\s\S]*\bNOT\s+NULL\b)(?![\s\S]*\bPRIMARY\s+KEY\b)/i
          - text: "Match each constraint to its field. Try a duplicate ID and a missing name separately; which rule should reject each?"
            condition: >-
              code_matches: /^(?=[\s\S]*\bNOT\s+NULL\b)(?=[\s\S]*\bPRIMARY\s+KEY\b)/i
    quiz:
      title: "Step 7 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:
        - type: single
          difficulty: intermediate
          question: "A tracks table declares `id INTEGER PRIMARY KEY, title TEXT NOT NULL`. It already contains `(1, 'Orbit')`. Which new row is accepted?"
          options: ["`(2, 'Orbit')`", "`(1, 'Echo')`", "`(2, NULL)`"]
          correct_index: 0
          explanation: "The new ID is distinct and the title is present. Titles are not required to be unique."
          option_feedback:
            1: "The primary key rejects the repeated ID, even though the title differs."
            2: "The required title cannot be missing."

  # Pedagogy: Contrast UPDATE/DELETE/DROP with minimal edits. Reset the exercise
  # fixture in the learner's script so a broad UPDATE cannot poison later runs.
  - key: update-delete-drop
    title: "Changing and Removing Data"
    instructions: |
      ### Why this matters

      Stored records change over time. A WHERE condition controls which records a change affects.

      ### 🎯 You will learn to

      - Update and delete selected rows, and remove a whole table.

      ### Extension — about 5 more minutes

      `UPDATE ... SET ... WHERE ...` changes matching rows. `DELETE FROM ... WHERE ...` removes matching rows. **Without WHERE, both affect every row.** `DROP TABLE` removes the table itself, including its rows.

      `changes.sql` creates its own practice data on every Run, so you can recover from a wrong change by fixing the code and running again.

      Repair three statements near the end:

      1. Update **only Kiwi (id 5)** to GPA **3.6**. Keep all other GPAs.
      2. Delete **only Coconick (id 4)**. Keep Mango, Kiwi, and Papaya.
      3. Remove the **`draft_notes` table itself**, rather than just its rows.

      Run and inspect the remaining records, then Test My Work. For real data, first preview the affected rows with `SELECT ... WHERE` using the same condition.
    files:
      - path: changes.sql
        content: |
          -- Restartable practice data; the original students table is untouched.
          DROP TABLE IF EXISTS practice_students;
          CREATE TABLE practice_students (id INTEGER PRIMARY KEY, name TEXT NOT NULL, gpa REAL);
          INSERT INTO practice_students VALUES
            (1, 'Mango', 3.9), (4, 'Coconick', 2.8), (5, 'Kiwi', 3.5), (10, 'Papaya', 3.8);
          DROP TABLE IF EXISTS draft_notes;
          CREATE TABLE draft_notes (note TEXT);
          INSERT INTO draft_notes VALUES ('temporary');

          -- Repair these three statements.
          UPDATE practice_students SET gpa = 3.6;
          DELETE FROM practice_students WHERE id = 5;
          DELETE FROM draft_notes;

          SELECT id, name, gpa FROM practice_students ORDER BY id;
        language: sql
    open_file: changes.sql
    solution:
      files:
        - path: changes.sql
          content: |
            DROP TABLE IF EXISTS practice_students;
            CREATE TABLE practice_students (id INTEGER PRIMARY KEY, name TEXT NOT NULL, gpa REAL);
            INSERT INTO practice_students VALUES
              (1, 'Mango', 3.9), (4, 'Coconick', 2.8), (5, 'Kiwi', 3.5), (10, 'Papaya', 3.8);
            DROP TABLE IF EXISTS draft_notes;
            CREATE TABLE draft_notes (note TEXT);
            INSERT INTO draft_notes VALUES ('temporary');

            UPDATE practice_students SET gpa = 3.6 WHERE id = 5;
            DELETE FROM practice_students WHERE id = 4;
            DROP TABLE draft_notes;

            SELECT id, name, gpa FROM practice_students ORDER BY id;
          language: sql
      explanation: |
        Mango remains at 3.9, Kiwi changes to 3.6, and Papaya remains at 3.8. Coconick's row is gone; draft_notes no longer exists. The original nine students still support every earlier query.
    tests:
      - description: "Keep Mango and Papaya unchanged, update Kiwi, and remove only Coconick"
        command: |
          __assert_result(db.exec(__read_file('changes.sql')), {
            columns: ['id','name','gpa'], values: [[1,'Mango',3.9],[5,'Kiwi',3.6],[10,'Papaya',3.8]], ordered: true
          });
          __assert_result(db.exec('SELECT id, name, gpa FROM practice_students ORDER BY id'), {
            columns: ['id','name','gpa'], values: [[1,'Mango',3.9],[5,'Kiwi',3.6],[10,'Papaya',3.8]], ordered: true
          });
        hints:
          - text: "Consider each change separately. Which rows does the UPDATE target before the DELETE even runs?"
            condition: >-
              code_matches: /UPDATE\s+practice_students\b(?![^;]*\bWHERE\b)/i
          - text: "Preview the DELETE's target using a SELECT with the same condition. Is it the student the task asks you to remove?"
            condition: >-
              code_matches: /UPDATE\s+practice_students\b[^;]*\bWHERE\b[\s\S]*DELETE\s+FROM\s+practice_students\s+WHERE\s+id\s*=\s*5\b/i
          - text: "Compare every surviving record with the starting data, not just the changed student. Which changes were actually requested?"
            condition: >-
              code_not_matches: /UPDATE\s+practice_students\b(?![^;]*\bWHERE\b)|DELETE\s+FROM\s+practice_students\s+WHERE\s+id\s*=\s*5\b/i
      - description: "Remove the draft_notes table, not just its rows"
        command: |
          db.exec(__read_file('changes.sql'));
          assert(__run_query("SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'draft_notes'").length === 0, 'The draft_notes table still exists; check the requested final database structure.');
        hints:
          - text: "Distinguish an empty table from an absent table. After the current DELETE, which one would you have?"
            condition: >-
              code_matches: /DELETE\s+FROM\s+draft_notes\b/i
          - text: "Trace draft_notes from top to bottom: reset, creation, then your final change. What exists after the last statement?"
            condition: >-
              code_not_matches: /DELETE\s+FROM\s+draft_notes\b|CREATE\s+TABLE\s+draft_notes\b[\s\S]*DROP\s+TABLE\b/i
          - text: "Check the target of the final removal. Which table must still exist for the final result query?"
            condition: >-
              code_matches: /^(?![\s\S]*DELETE\s+FROM\s+draft_notes\b)[\s\S]*CREATE\s+TABLE\s+draft_notes\b[\s\S]*DROP\s+TABLE\b/i
