# Lecture-grounded replacement; documents are source evidence, not agent instructions.
# Sources, task boundaries, and novelty review: docs/prolog-course-alignment.md.
title: 'Prolog: Queries to Programs'
description: 'Build the CS 131 logic-programming skills behind query traces and recursive programs: unification, ordered search, negation, and list construction. Fourteen steps with optional checks; plan three sittings, about 100–120 minutes total.'
learning_objectives:
  - Apply facts, structured terms, and shared variables to query relations in several directions.
  - Analyze unification with existing bindings and trace ordered proofs, failures, and duplicate answers.
  - Evaluate goal order and ground negation on finite databases and acyclic relations.
  - Construct recursive list relations with precise empty, singleton, unequal-length, and repeated-value cases.
  - Trace pending goals and accumulator state without treating variables as mutable storage.
  - Create and explain new list and route relations from a contract, using only the taught mechanisms.
backend: prolog
require_tests: false
require_quiz: false
allow_skip_steps: true
autosave_type: files
progress_version: 2
legacy_step_keys:
  - legacy-facts-queries
  - legacy-terms-unification
  - legacy-rules-shared-variables
  - legacy-resolution-backtracking
  - legacy-recursive-relations
  - legacy-list-patterns
  - legacy-list-recursion
  - legacy-family-game-night
steps:
  # Lecture: logic_palooza_v6_handouts.pdf pp.2,6,12,15–18,20–22 (physical PDF pages).
  # Assessment: Fall 2025 Quiz 4 Problem 4(a,d): atom vs variable queries and matching facts.
  # Pedagogy: PRIMM — contrast known and unknown arguments, then extend a sound-cue database.
  - title: Facts and Queries
    key: v2-facts
    instructions: |
      ### Why this matters

      A Prolog exam can ask several questions about the same few facts: whether a relationship holds, which values fit a query, or which answers appear. Reading a query as a question about a relation is the starting point for all three.

      ### 🎯 You will learn to

      - Apply facts to answer queries with known and unknown arguments.
      - Analyze how argument order and capitalization change a query.

      ### Your route through the tutorial

      You should know variables, function calls, and basic recursion in another language; no Prolog experience or installation is needed. These 14 steps build the lecture skills used in short query traces and longer rule-writing problems. Budget **100–120 minutes**, as a planning estimate, across three sessions: steps 1–4, 5–9, and 10–14. At the start of a later session, explain one earlier example from memory before running it again.

      Tests and knowledge checks give feedback; they are optional. You can revisit or select any numbered step. If a check finds an error, use a hint, revise your explanation or code, and try a new query. A green check verifies the tested behavior; your explanation tells you whether you can reproduce the reasoning on paper.

      ### A database describes relationships

      We will describe a tiny sound setup. No audio knowledge is needed: a **clip** is a named sound, and a **channel** is an output named left or right.

      ```prolog
      cue(rain, left).
      cue(bell, right).
      ```

      We define `cue(Clip, Channel)` to mean that the clip plays through that channel. The argument order is part of that meaning. These are **facts**, not calls that execute a function. A period ends a fact, and `%` begins a comment. Lowercase names such as `rain` and `left` are **atoms**, which name particular things.

      A **query** asks Prolog to prove a goal from the current program. `cue(rain, left)` succeeds; `cue(rain, right)` fails in this database. Failure means that the program has no proof of that goal. It does not measure a physical sound system.

      A variable starts with an uppercase letter, such as `Sound`. The query `cue(Sound, right)` finds `Sound = bell`. That variable is a place for an answer; it does not need an initial value. `cue(bell, Channel)` asks the same relation a different question.

      ### Predict, run, investigate

      In the starter database, predict both `cue(Clip, left)` and `cue(clip, left)`. Will both find rain, both fail, or behave differently? Explain what each first argument means before running them.

      Enter just the goal in **Query ?-**, without typing `?-`; the final period is optional here. Select **Run**. The workspace consults the current step's file afresh and automatically requests successive answers, so you do not need to type semicolons. Changing the query does not add a fact to the file.

      <details markdown="1">
      <summary>After running: compare your predictions</summary>

      `Clip` can be bound to `rain`. Lowercase `clip` is a specific atom, so that query fails: no fact routes a sound named `clip` through the left channel. Capitalization changed the question, not just the spelling of a local name.

      </details>

      ### Make a small database

      Keep the two starter facts. Add exactly these two relationships: **bell also plays through left; hum plays through right**. Use one fact per relationship, each appearing once. Then ask for all of bell's channels and all clips playing through right. Before Run, write down the bindings you expect; use **Test My Work** to check the database when ready.

      The lectures use SWI-Prolog. This workspace uses Tau Prolog for the course features practiced here; implementation-specific extensions and error wording can differ.
    default_query: cue(Clip, left)
    files:
    - path: prolog-v2/01-facts.pl
      language: prolog
      content: |
        % cue(Clip, Channel): Clip plays through Channel.
        cue(rain, left).
        cue(bell, right).

        % Add the two sound-routing facts described in the task.
    open_file: prolog-v2/01-facts.pl
    run_file: prolog-v2/01-facts.pl
    tests:
    - description: The database has exactly the four requested sound routes, each once.
      command: |
        assert((await __query("findall(pair(C,H), cue(C,H), Pairs), Pairs = [_,_,_,_], sort(Pairs, Sorted), Sorted == [pair(bell,left),pair(bell,right),pair(hum,right),pair(rain,left)].")).length === 1, "Keep the starter sound routes, add bell through left and hum through right, and include no duplicate or reversed facts.");
      hints:
      - title: One route per fact
        text: Each sentence in the task describes a sound clip and a channel. Compare that ordered pair with the starter
          facts.
      - title: The meaning of each position
        text: The first position names the clip; the second names the channel. Lowercase atoms name the specific clips
          and channels.
      - title: Two missing pairs
        text: Use the shape cue(clip_atom, channel_atom). Complete it once for each missing relationship, without
          replacing the existing facts.
    quiz:
      title: Step 1 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
      - id: prolog-v2-facts-question
        type: single
        difficulty: intermediate
        bloom: apply
        question: |
          With only these facts, which query discovers what plays through `rear`?

          ```prolog
          cue(chime, rear).
          cue(click, front).
          ```
        options:
        - '`cue(Sound, rear)`'
        - '`cue(rear, Sound)`'
        - '`cue(sound, rear)`'
        correct_index: 0
        option_feedback:
          1: The clip belongs in the first position. This query instead treats rear as a clip.
          2: Lowercase sound names a specific atom. It does not request a binding.
        explanation: '`Sound` is a variable in the clip position, so the matching fact gives `Sound = chime`.'
      - id: prolog-v2-facts-supported
        type: multiple
        difficulty: intermediate
        bloom: analyze
        question: |
          Select every query that succeeds at least once with this entire database.

          ```prolog
          cue(chime, rear).
          cue(click, front).
          ```
        options:
        - '`cue(chime, Channel)`'
        - '`cue(Clip, front)`'
        - '`cue(front, click)`'
        - '`cue(chime, front)`'
        correct_indices:
        - 0
        - 1
        option_feedback:
          0: A variable may occupy the channel position; the chime fact can supply its value.
          1: The front-channel fact can supply a value for the clip variable.
          2: Reversing the arguments changes the relationship being asked about.
          3: A fact about click using front does not establish that chime uses front.
        explanation: The facts support chime through rear and click through front. A variable can stand for either
          value at the corresponding position, while fixed atoms must match.
    solution:
      files:
      - path: prolog-v2/01-facts.pl
        language: prolog
        content: |
          % cue(Clip, Channel): Clip plays through Channel.
          cue(rain, left).
          cue(bell, right).
          cue(bell, left).
          cue(hum, right).
      explanation: |
        Each new fact describes one ordered pair. `cue(bell, Channel)` produces `Channel = right`, then `Channel = left` with this file order. `cue(Clip, right)` produces `Clip = bell`, then `Clip = hum`. A different fact order describes the same sound routes, though it can change answer order. The check accepts any fact order.
  # Lecture: logic_palooza_v6_handouts.pdf pp.6,24–41,47–48.
  # Assessment: F24 V1 Final Problem 7(A.2) p.23; F23 Final Problem 8(a)(ii) p.22.
  # Pedagogy: Variation Theory — nested audio-format structure, repeated vs independent variables.
  - title: Terms and Unification
    key: v2-unification
    instructions: |
      ### Why this matters

      Prolog matching works inside structured values. A reliable trace must preserve both the shape of those values and the bindings already chosen; otherwise later answers can look plausible while being impossible.

      ### 🎯 You will learn to

      - Analyze bindings in nested compound terms.
      - Create a pattern that requires shared values while ignoring irrelevant ones.

      ### Match corresponding positions

      A **term** may be an atom, number, variable, or compound term such as `audio(44100, stereo)`. Here that term stores two format labels: a numeric sample rate and a channel layout. Their audio interpretation is irrelevant to the exercise; matching requires both labels to agree.

      The term's **functor** is `audio` and its **arity** is 2, the number of arguments. `audio/2` and `audio/3` have different shapes. A compound term is data here, not a function call that computes a return value.

      **Unification** finds consistent variable bindings that make two terms identical. The `=` goal performs unification. For example:

      ```prolog
      clip(rain, audio(44100, stereo)) = clip(Name, audio(Rate, Channels))
      ```

      The outer functors match, then corresponding arguments match: `Name = rain`, `Rate = 44100`, and `Channels = stereo`. Matching `clip(Name, Format)` instead would bind `Format` to the whole term `audio(44100, stereo)`.

      A variable can be bound to another variable, too: `X = Y, Y = mono` makes both names refer to `mono`. Comma means **and**: both goals must succeed using consistent bindings. Unification does not overwrite an existing binding.

      Repeated occurrences of the same variable name in one query or clause share a value. Each plain `_` is a separate **anonymous variable**, useful when a position may contain anything. Variables in different clauses are independent.

      ### Predict, run, investigate

      Predict the outcomes of `pair(X, X) = pair(mono, stereo)` and `pair(_, _) = pair(mono, stereo)`. For each, identify which positions must agree, then run the goals separately.

      <details markdown="1">
      <summary>After running: follow the shared binding</summary>

      The repeated `X` would have to be both `mono` and `stereo`, so that goal fails. Each plain `_` is independent, so the anonymous-variable goal succeeds. It does not request named answer bindings.

      </details>

      The starter's worked pattern `sample_rate(audio(Rate, _), Rate).` relates a format term to its sample rate. Variables in a fact describe all instances of the pattern, without enumerating individual rates.

      ### Make a structural relation

      Define **`same_format(Clip1, Clip2)`**. Each argument must have the shape `clip(Name, audio(Rate, Channels))`. The relation should succeed exactly when both sample rates and both channel layouts unify; clip names may differ. It must also discover a missing rate or layout through unification. A single pattern fact is enough.

      Try two differently named clips with the same format, two clips with the same rate but different layouts, and a query with one unknown rate. Write down the expected bindings before Run. Then explain why matching only the rate would accept too much.
    default_query: sample_rate(audio(44100, stereo), Rate)
    files:
    - path: prolog-v2/02-unification.pl
      language: prolog
      content: |
        % Worked pattern: expose the rate and allow any channel layout.
        sample_rate(audio(Rate, _), Rate).

        % Define same_format(Clip1, Clip2) for the required nested shape.
    open_file: prolog-v2/02-unification.pl
    run_file: prolog-v2/02-unification.pl
    tests:
    - description: The pattern requires matching rates and layouts, while clip names may differ.
      command: |
        assert((await __query("same_format(clip(rain,audio(44100,stereo)),clip(bell,audio(44100,stereo))), same_format(clip(rain,audio(44100,stereo)),clip(rain,audio(44100,stereo))), \\+ same_format(clip(rain,audio(44100,stereo)),clip(bell,audio(48000,stereo))), \\+ same_format(clip(rain,audio(44100,stereo)),clip(bell,audio(44100,mono))), \\+ same_format(clip(rain,stereo),clip(bell,stereo)), \\+ same_format(audio(44100,stereo),audio(44100,stereo)).")).length > 0, "Require the clip(...,audio(...,...)) shape and a shared rate and channel layout, without requiring shared clip names.");
      hints:
      - title: Which values must agree?
        text: The format has two identifying parts. The two clip names are irrelevant to whether the format is the
          same.
      - title: Shared and independent variables
        text: Repeat a named variable for each value that must agree. Use independent variables for values allowed
          to differ.
      - title: Work from the outside in
        text: Each argument needs a clip(..., audio(..., ...)) pattern. Match corresponding rate and layout positions
          across those two patterns.
    - description: The pattern discovers unknown format parts in either argument.
      command: |
        assert((await __query("findall(pair(R,C), same_format(clip(rain,audio(R,C)),clip(bell,audio(22050,mono))), A), sort(A,AS), AS == [pair(22050,mono)], findall(pair(R,C), same_format(clip(rain,audio(96000,stereo)),clip(hum,audio(R,C))), B), sort(B,BS), BS == [pair(96000,stereo)].")).length === 1, "The relation should bind missing format parts in either argument and work for rates and layouts not listed in the examples.");
      hints:
      - title: Unknowns are part of the task
        text: A relation can find a missing value as well as check two known values.
      - title: General patterns
        text: Specific facts for 44100 and stereo cannot account for a new rate or discover its layout.
      - title: Let matching connect the values
        text: Put shared variables at matching positions. The query supplies their values when it matches the pattern.
    quiz:
      title: Step 2 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
      - id: prolog-v2-unification-whole-part
        type: single
        difficulty: intermediate
        bloom: apply
        question: What does `parcel(label(green), box(4)) = parcel(Tag, box(Size))` bind?
        options:
        - '`Tag = green`, `Size = 4`'
        - '`Tag = label(green)`, `Size = 4`'
        - '`Tag = label(green)`, `Size = box(4)`'
        correct_index: 1
        option_feedback:
          0: Tag corresponds to the whole first argument, including its label functor.
          2: Size is inside the matching box term, so it corresponds to 4 rather than to box(4).
        explanation: Matching the outer parcel terms pairs Tag with label(green). Matching the inner box terms then
          pairs Size with 4.
      - id: prolog-v2-unification-consistency
        type: multiple
        difficulty: intermediate
        bloom: analyze
        question: Select every goal that succeeds. Treat each goal as a fresh query.
        options:
        - '`pair(X, X) = pair(lab, lab)`'
        - '`pair(_, _) = pair(lab, hall)`'
        - '`pair(X, X) = pair(lab, hall)`'
        - '`pair(X, Y) = pair(lab)`'
        correct_indices:
        - 0
        - 1
        option_feedback:
          0: Both occurrences of X can share the single binding lab.
          1: The two plain anonymous variables are independent.
          2: The repeated X cannot simultaneously be lab and hall.
          3: The functor matches, but the arity differs; missing arguments are not filled automatically.
        explanation: Unification preserves compound shape and all repeated-variable constraints. Independent anonymous
          variables do not require equal values.
    solution:
      files:
      - path: prolog-v2/02-unification.pl
        language: prolog
        content: |
          sample_rate(audio(Rate, _), Rate).

          same_format(clip(_, audio(Rate, Channels)),
                      clip(_, audio(Rate, Channels))).
      explanation: |
        Both arguments require a clip term containing an audio term. Repeating `Rate` and `Channels` enforces equality of the complete format. The independent `_` positions allow different clip names. A missing format part is bound when it matches the corresponding part on the other side; no list of supported formats is needed.
  # Lecture: logic_palooza_v6_handouts.pdf pp.7–12,20–23,32–42.
  # Assessment: S23 V1 Final Problem 5 p.11: shared intermediate relations; Quiz 4 Problem 4: consistent bindings.
  # Pedagogy: PRIMM — trace a worked join, diagnose disconnected format variables, repair playback compatibility.
  - title: Joined Rules
    key: v2-joins
    instructions: |
      ### Why this matters

      A rule can connect facts that share a value. Many exam predicates are small combinations of existing relations; the main reasoning work is deciding which positions must refer to the same thing.

      ### 🎯 You will learn to

      - Apply a rule by carrying a shared structured value across its goals.
      - Analyze and repair a rule that combines unrelated facts.

      ### A rule connects subgoals

      The editor describes audio files and device capabilities. `recorded_format(Clip, Format)` says that a version of the clip is available in that format. `device_format(Device, Format)` says that the device accepts that exact format. These are the complete rules of this small model; no audio conversion is implied.

      This worked rule relates a clip to one of its sample rates:

      ```prolog
      available_rate(Clip, Rate) :-
          recorded_format(Clip, Format), sample_rate(Format, Rate).
      ```

      Read `:-` as **if**. The **head** says what relationship the rule establishes; its **body** contains the goals that must hold. A collection of facts or rules with the same name and arity is a **predicate**; this one is `available_rate/2`.

      The shared `Format` connects the two subgoals. For rain, the first goal supplies `Format = audio(44100, stereo)`. The next goal matches the pattern from step 2 and finds `Rate = 44100`. An answer requires every goal in the body to succeed with consistent bindings.

      ### Predict, run, investigate

      Predict all rates found by `available_rate(bell, Rate)` from the starter file. Then inspect the unfinished `playable_on/2` rule: it uses separate variables `F1` and `F2`. Predict whether `playable_on(rain, mono_speaker)` succeeds even though the rate agrees but the channel layout differs. Run both queries and explain why the result exposes a bug.

      <details markdown="1">
      <summary>After running: inspect the connection</summary>

      Bell has versions at rates 48000 and 44100. The starter `playable_on/2` incorrectly lets any recorded clip match any listed device: choosing a recording gives F1 a value but places no restriction on F2. Different variable names may end up equal, but nothing requires them to be.

      </details>

      ### Repair the relationship

      Repair **`playable_on(Clip, Device)`** so it holds exactly when a recording of that clip has a format accepted by that device. The full `audio(Rate, Channels)` format must match. Keep the supplied facts. Derive the connection from the requirement; do not list the individual answer pairs.

      After the repair, query all devices that can play bell, all clips playable on headphones, and all clip–device pairs. Explain how the same rule answers each question without declaring arguments to be inputs or outputs. For these finite facts, reversing the two body goals still describes the same relationship; later we will examine when goal order changes execution.
    default_query: available_rate(bell, Rate)
    files:
    - path: prolog-v2/03-joins.pl
      language: prolog
      content: |
        recorded_format(rain, audio(44100, stereo)).
        recorded_format(bell, audio(48000, mono)).
        recorded_format(bell, audio(44100, stereo)).
        recorded_format(hum, audio(22050, mono)).

        device_format(headphones, audio(44100, stereo)).
        device_format(speaker, audio(48000, mono)).
        device_format(mono_speaker, audio(44100, mono)).
        device_format(phone, audio(22050, mono)).

        sample_rate(audio(Rate, _), Rate).
        available_rate(Clip, Rate) :-
            recorded_format(Clip, Format), sample_rate(Format, Rate).

        % Repair this relation so a recorded format matches an accepted format.
        playable_on(Clip, Device) :-
            recorded_format(Clip, F1), device_format(Device, F2).
    open_file: prolog-v2/03-joins.pl
    run_file: prolog-v2/03-joins.pl
    tests:
    - description: Only devices accepting a clip's recorded format are related to that clip.
      command: |
        assert((await __query("findall(pair(C,D), playable_on(C,D), Pairs), sort(Pairs, Sorted), Sorted == [pair(bell,headphones),pair(bell,speaker),pair(hum,phone),pair(rain,headphones)].")).length === 1, "Connect recorded and accepted formats; unrelated clip-device pairs must not appear.");
      hints:
      - title: Name the missing connection
        text: A clip having some format and a device accepting some format do not establish that those formats match.
      - title: Track one complete format
        text: Follow the audio(...) term chosen by the recording goal. The device goal must accept that same term.
      - title: Align corresponding positions
        text: Write the roles for recorded_format(clip, format) and device_format(device, format), then decide which
          variable should occur in both format positions.
    - description: Known clips, known devices, and unsupported pairs all use the same relation.
      command: |
        assert((await __query("findall(D, playable_on(bell,D), A), sort(A,AS), AS == [headphones,speaker], findall(C, playable_on(C,headphones), B), sort(B,BS), BS == [bell,rain], playable_on(hum,phone), \\+ playable_on(rain,speaker), \\+ playable_on(rain,mono_speaker), \\+ playable_on(unknown,headphones).")).length > 0, "The rule must work with either argument known and fail when no shared format supports the pair.");
      hints:
      - title: Ask the relation both ways
        text: Neither argument is permanently an output. Fixing a device should let the rule discover playable clips.
      - title: Keep facts as the source of answers
        text: A general rule should use recorded_format/2 and device_format/2 so every query follows the same connection.
      - title: Trace one successful pair
        text: For bell and headphones, identify one complete format that satisfies both body goals. A proposed pair
          without such a format must fail.
    quiz:
      title: Step 3 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
      - id: prolog-v2-joins-connection
        type: single
        difficulty: intermediate
        bloom: analyze
        question: |
          `member(Person, Club)` and `meets(Club, Day)` are facts. Which body makes `busy_on(Person, Day)` mean that the person belongs to a club meeting that day?
        options:
        - '`member(Person, Club), meets(Club, Day)`'
        - '`member(Person, Club), meets(Other, Day)`'
        - '`member(Person, Day), meets(Club, Day)`'
        correct_index: 0
        option_feedback:
          1: Unrelated Club and Other variables allow a different club's meeting day to satisfy the rule.
          2: The second argument of member is a club, so this incorrectly requires the club name to equal the day.
        explanation: The intermediate club value belongs in both subgoals. Person and Day remain in the positions
          that the two relations define.
      - id: prolog-v2-joins-earlier-bindings
        type: multiple
        difficulty: intermediate
        bloom: analyze
        question: |
          The current proof has `Club = chess`. Select every fact that can match the next goal `meets(Club, Day)` while preserving that binding. Treat each fact as a separate alternative.
        options:
        - '`meets(chess, monday).`'
        - '`meets(go, friday).`'
        - '`meets(chess, friday).`'
        - '`meets(monday, chess).`'
        correct_indices:
        - 0
        - 2
        option_feedback:
          0: The first argument agrees with the existing Club binding and Day can become monday.
          1: Continuing this proof cannot change Club from chess to go.
          2: A different meeting day is another valid alternative for the same club.
          3: This fact puts monday in the club position, conflicting with Club = chess.
        explanation: Applying the current binding gives meets(chess, Day). Only facts whose first argument is chess
          can extend this proof.
    solution:
      files:
      - path: prolog-v2/03-joins.pl
        language: prolog
        content: |
          recorded_format(rain, audio(44100, stereo)).
          recorded_format(bell, audio(48000, mono)).
          recorded_format(bell, audio(44100, stereo)).
          recorded_format(hum, audio(22050, mono)).

          device_format(headphones, audio(44100, stereo)).
          device_format(speaker, audio(48000, mono)).
          device_format(mono_speaker, audio(44100, mono)).
          device_format(phone, audio(22050, mono)).

          sample_rate(audio(Rate, _), Rate).
          available_rate(Clip, Rate) :-
              recorded_format(Clip, Format), sample_rate(Format, Rate).

          playable_on(Clip, Device) :-
              recorded_format(Clip, Format), device_format(Device, Format).
      explanation: |
        One shared `Format` joins the relations, requiring the complete nested term to match. Bell has two recordings, which yield speaker and headphones with this goal order. Asking for headphone-compatible clips instead finds rain and bell. Two unrelated format variables admit extra pairs because they do not require a common format. A rule with the body goals reversed also passes: this task requires the relation, not a particular answer order.
  # Lecture: logic_palooza_v6_handouts.pdf pp.20–23,24–42.
  # Assessment: Fall 2025 Quiz 4 Problem 4(b–d): ordered duplicate outputs; F23 Final Problem 8(b) p.23: resolution trace.
  # Pedagogy: PRIMM — trace a failed branch, repair membership direction, reconstruct chronological binding rollback.
  - title: Proof Order and Backtracking
    key: v2-proof-order
    instructions: |
      ### Why this matters

      Past questions ask for the exact sequence of Prolog answers, including duplicates. Knowing which answers are logically possible is only part of that task: you also need to track how the search reaches them.

      ### 🎯 You will learn to

      - Analyze ordered proofs by tracing goals and bindings.
      - Explain why backtracking removes a failed branch's bindings and can repeat an answer.

      ### Search one branch at a time

      Prolog tries matching facts and rules **from top to bottom**. For a rule body or query, it attempts goals **from left to right**. It follows the current branch until that branch succeeds or cannot continue. When a branch fails or another answer is requested, **backtracking** returns to the most recent remaining alternative and undoes bindings made since that choice.

      Consider this complete miniature example of packages containing items:

      ```prolog
      includes(demo, notes).
      includes(demo, effects).
      includes(effects, chime).
      ```

      For `includes(demo, Mid), includes(Mid, Item)`, the first goal initially binds `Mid = notes`. There is no `includes(notes, Item)`, so that branch fails. Backtracking releases `Mid = notes` and tries `Mid = effects`. The second goal can now bind `Item = chime`, giving the first answer. The failed notes binding does not remain as a conflicting requirement.

      Facts and rules are alternatives for proving a predicate. Multiple rules with the same head name and arity act as alternative ways to prove it; a successful rule does not erase later alternatives. Different proofs can yield the same final bindings, and Prolog keeps those duplicate answers.

      ### Predict, run, investigate

      In the editor, `includes(Pack, Item)` describes **direct** membership in an audio catalog. A pack can include another pack; different packs can include the same item. Predict the sequence of `Mid` and `Item` bindings for this query before Run:

      ```prolog
      includes(release, Mid), includes(Mid, Item)
      ```

      Record the failed branch too, without listing it as an answer. Then run the query. If an item appears twice, identify the two different intermediate packs that proved it. Notice that facts for beats are written before facts for pads, even though release lists pads before beats.

      <details markdown="1">
      <summary>After running: compare the proofs</summary>

      `Mid = readme` reaches a dead end. The next proof is `Mid = pads, Item = noise`. Then `Mid = beats, Item = noise`, followed by `Mid = beats, Item = kick`. The first goal's choice of a middle pack determines which membership facts can match the second goal; Prolog does not collect every second-level fact first.

      </details>

      ### Repair and explain a two-layer rule

      The starter **`two_layers(Pack, Item)`** reverses one membership relationship. Repair it to mean that Pack includes some middle pack which directly includes Item: **exactly two membership links**. Preserve the supplied facts and their order. Search Pack's direct members before searching the chosen middle pack's members, so answers follow that proof order and retain every proof.

      Before testing, predict all answers for `two_layers(release, Item)` and `two_layers(Pack, hiss)`. Also try a pack with no listed members. Explain why a directly included item is not enough, and why an item included through two different packs still has two proofs.
    default_query: includes(release, Mid), includes(Mid, Item)
    files:
    - path: prolog-v2/04-proof-order.pl
      language: prolog
      content: |
        includes(release, readme).
        includes(release, pads).
        includes(release, beats).
        includes(beats, noise).
        includes(beats, kick).
        includes(pads, noise).
        includes(noise, hiss).

        % Repair the membership direction while preserving the requested proof order.
        two_layers(Pack, Item) :-
            includes(Pack, Middle), includes(Item, Middle).
    open_file: prolog-v2/04-proof-order.pl
    run_file: prolog-v2/04-proof-order.pl
    tests:
    - description: Two-layer answers follow proof order and preserve duplicate proofs.
      command: |
        assert((await __query("findall(I, two_layers(release,I), A), A == [noise,noise,kick], findall(P, two_layers(P,hiss), B), B == [beats,pads].")).length === 1, "From release, ordered items are noise, noise, kick; the packs containing hiss through one middle pack are beats, pads. Keep separate proofs and the specified search order.");
      hints:
      - title: Read the two membership relationships
        text: The first relationship names the middle pack as a member. The second must name that middle pack as the
          containing pack.
      - title: Carry the binding forward
        text: After the first subgoal, Middle has a chosen value. Identify which position of the next includes fact
          represents its containing pack.
      - title: Follow one branch fully
        text: Enumerate the direct members of release in file order, then all direct members of the chosen middle
          pack before trying the next middle. Do not remove a repeated item.
    - description: Exactly two membership links are required, including for other packs.
      command: |
        assert((await __query("findall(pair(P,I), two_layers(P,I), Pairs), Pairs = [_,_,_,_,_], sort(Pairs, Sorted), Sorted == [pair(beats,hiss),pair(pads,hiss),pair(release,kick),pair(release,noise)], \\+ two_layers(readme,_), \\+ two_layers(release,pads), \\+ two_layers(release,hiss).")).length === 1, "Require exactly two membership links, fail at dead ends, and preserve distinct proofs for the same pair.");
      hints:
      - title: Count membership links
        text: Reaching a direct member uses one link. Reaching hiss from release uses three. Neither meets the two-link
          requirement.
      - title: Connect both subgoals
        text: The middle variable must join the member position of the first relationship to the containing-pack position
          of the second.
      - title: Keep the relation general
        text: Use the rule arguments at the outer endpoints instead of naming release or one particular item.
    quiz:
      title: Step 4 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
      - id: prolog-v2-proof-order-rollback
        type: parsons
        difficulty: intermediate
        bloom: apply
        question: |
          Arrange the events leading to the **first answer** for `link(a, Mid), link(Mid, End)` with the facts below. Leave out the event that does not occur.

          ```prolog
          link(a, b).
          link(a, c).
          link(c, d).
          ```
        lines:
        - Match link(a, b), binding Mid to b.
        - Try link(b, End); no fact matches, so this branch fails.
        - Backtrack to the first goal and release Mid = b.
        - Match link(a, c), binding Mid to c.
        - Match link(c, d), binding End to d.
        - Report the answer Mid = c, End = d.
        distractors:
        - Keep Mid = b when trying the next fact for the first goal.
        explanation: The second goal must finish before an answer can be reported. Its failure returns search to the
          earlier choice; the failed branch's Mid binding is removed before the alternative binds Mid to c.
      - id: prolog-v2-proof-order-duplicates
        type: single
        difficulty: intermediate
        bloom: apply
        question: |
          What sequence does `pick(X)` produce when all answers are requested?

          ```prolog
          fruit(pear).
          fruit(plum).
          pick(X) :- fruit(X).
          pick(pear).
          ```
        options:
        - '`pear`, `plum`, `pear`'
        - '`pear`, `plum`'
        - '`pear`, `pear`, `plum`'
        correct_index: 0
        option_feedback:
          1: The later pick(pear) fact supplies a second proof of the pear answer; duplicates are not automatically
            removed.
          2: Search exhausts the fruit alternatives in the rule before moving to the later pick fact.
        explanation: Prolog first proves pick through its rule, yielding pear and plum. It then tries the later pick(pear)
          fact, yielding pear again.
      - id: prolog-v2-proof-order-stable-bindings
        type: multiple
        difficulty: intermediate
        bloom: analyze
        question: |
          With exactly the facts below, select every statement supported by the query `pair(X, Y), pair(Y, X)`.

          ```prolog
          pair(red, blue).
          pair(blue, red).
          pair(red, green).
          ```
        options:
        - The first answer is `X = red, Y = blue`.
        - The next answer is `X = blue, Y = red`.
        - A later answer is `X = red, Y = green`.
        - The two goals can use unrelated values for `Y`.
        correct_indices:
        - 0
        - 1
        option_feedback:
          0: The first fact binds X and Y; the reversed second goal is proved by pair(blue, red).
          1: After the first proof, backtracking can choose pair(blue, red) for the first goal and pair(red, blue)
            for the second.
          2: This candidate needs pair(green, red) for the second goal, and that fact is absent.
          3: Both occurrences of Y share one binding within a proof. Backtracking may replace that binding for a different
            proof.
        explanation: The first two candidate pairs have matching reverse facts. The red–green candidate reaches a
          dead end. A shared variable is consistent within a proof, even though its binding can change after backtracking.
    solution:
      files:
      - path: prolog-v2/04-proof-order.pl
        language: prolog
        content: |
          includes(release, readme).
          includes(release, pads).
          includes(release, beats).
          includes(beats, noise).
          includes(beats, kick).
          includes(pads, noise).
          includes(noise, hiss).

          two_layers(Pack, Item) :-
              includes(Pack, Middle), includes(Middle, Item).
      explanation: |
        The first goal finds a member of Pack and names it Middle. The second finds a member of that same Middle. From release, readme fails; pads produces noise; beats produces noise then kick. Asking for packs that contain hiss through one middle pack finds beats and pads, in the order of their includes facts. The first goal chooses the middle pack before the second searches its members; reversing those goals changes the release answer order to noise, kick, noise.

  # Lecture: logic_palooza_v6_handouts.pdf pp.16–19,22,42. Assessment: F23 Final P8(c), p.24.
  # Pedagogy: PRIMM and contrasting cases — join schedules with slot and event exclusions.
  - title: Ground Negation
    key: v2-ground-negation
    instructions: |
      ### Why this matters

      A pop-up exhibition may offer a demo even when its time slot is closed or the demo has been cancelled. Finding usable offers requires joining those facts before checking what is absent.

      ### 🎯 You will learn to

      - Analyze negation as a finite search for a proof.
      - Apply candidate generation before a negative condition.
      - Create a rule that filters joined facts using two different exclusions.

      ### A negative check needs a concrete candidate

      A **ground** term contains no unbound variables. For a ground goal, `not(Goal)` tries to prove `Goal`: if a proof exists, `not` fails; if the search finishes without one, `not` succeeds. A search that runs forever has not established failure.

      The worked rule `usable_slot(Demo) :- scheduled(Demo, Slot), not(closed_slot(Slot)).` first obtains a demo and its slot, then checks that slot. Every fact in this exercise is ground and the database is finite.

      ### Predict, run, and investigate

      Before Run, predict all answers to `usable_slot(Demo)`. Then compare these two queries:

      ```prolog
      scheduled(Demo, Slot), not(closed_slot(Slot))
      not(closed_slot(Slot)), scheduled(Demo, Slot)
      ```

      Does reversing the goals find the same demos, none, or all of them? Commit before running.

      <details markdown="1">
      <summary>After running: explain the difference</summary>

      The first query produces `robots` and `music`. The second produces no answers: with Slot unbound, `closed_slot(Slot)` can prove `closed_slot(morning)`, so its negation fails immediately. It never reaches the schedule. Negation does not generate the missing slots.

      </details>

      A related operator is `X \= Y`: it succeeds when those terms **cannot unify now**. For the ground atoms used in our later list tasks, it tests that they differ. With an unbound X, `X \= morning` fails because X could unify with morning; it does not save a “must differ later” constraint. Try `morning \= noon`, `morning \= morning`, and `X \= morning`.

      ### Your task

      Keep the facts and the worked `usable_slot` rule. Define **`available(Demo)`** to enumerate exactly the scheduled demos whose slot is not closed **and** which are not cancelled. It must also check a proposed ground demo name. A name absent from the schedule must fail, even if no cancellation mentions it.

      Notice that the two exclusions inspect different values: slot closure is about Slot, while cancellation is about Demo. Predict `available(Demo)`, `available(puzzles)`, and `available(dance)` before running. Explain why checking `closed_slot(Demo)` would ask the wrong question. All negated goals in your intended rule should be ground when they run.
    default_query: usable_slot(Demo)
    files:
    - path: prolog-v2/05-negation.pl
      language: prolog
      content: |
        scheduled(puzzles, morning).
        scheduled(robots, noon).
        scheduled(music, evening).
        closed_slot(morning).
        cancelled(music).

        usable_slot(Demo) :- scheduled(Demo, Slot), not(closed_slot(Slot)).

        % Define available(Demo) using schedule, slot status, and cancellation.
    open_file: prolog-v2/05-negation.pl
    run_file: prolog-v2/05-negation.pl
    tests:
    - description: Available demos pass both slot and cancellation checks.
      command: |
        assert((await __query("findall(D, available(D), Demos), sort(Demos, UniqueDemos), UniqueDemos == [robots].")).length >= 1, "Only robots is scheduled in an open slot and not cancelled.");
      hints:
      - title: Two different reasons to exclude an offer
        text: Check the slot of the scheduled demo and the cancellation status of the demo itself.
      - title: Bind both values first
        text: The schedule relation supplies a demo and a slot before either negative condition runs.
      - title: Keep the argument roles distinct
        text: Use the slot variable inside the closure check and the demo variable inside the cancellation check.
    - description: Ground checks reject closed, cancelled, and unscheduled demos.
      command: |
        assert((await __query("available(robots), not(available(puzzles)), not(available(music)), not(available(dance)).")).length >= 1, "robots is available; puzzles, music, and unscheduled dance must fail.");
      hints:
      - title: No cancellation is not a schedule
        text: An unknown demo is not an available offer merely because no cancellation names it.
      - title: One relation supplies the candidates
        text: Retain the schedule test even when a query supplies a ground name.
      - title: Read the conjunction aloud
        text: Check that the body says “scheduled in a slot AND that slot is not closed AND the demo is not cancelled,”
          without a fallback that skips a condition.
    quiz:
      title: Step 5 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
      - type: single
        difficulty: intermediate
        bloom: apply
        question: |
          Given only `signed_up(lee). signed_up(mo). paid(lee).`, what does `signed_up(P), not(paid(P))` produce?
        options:
        - P = lee
        - P = mo
        - No answers
        correct_index: 1
        option_feedback:
          0: A proof of paid(lee) makes its negation fail.
          2: signed_up first supplies mo, and paid(mo) then fails finitely.
        explanation: The positive goal supplies each known person. Only mo has no proof of payment in this database.
      - type: multiple
        difficulty: intermediate
        bloom: analyze
        question: Select every goal that succeeds. Evaluate each goal separately with no initial bindings.
        options:
        - '`blue \= red`'
        - '`X \= red`'
        - '`pair(X,X) = pair(blue,blue)`'
        - '`pair(X,X) = pair(blue,red)`'
        correct_indices:
        - 0
        - 2
        option_feedback:
          0: Distinct ground atoms cannot unify, so the inequality check succeeds.
          1: An unbound X can unify with red, so this check fails now.
          2: Both occurrences can consistently use the binding X = blue.
          3: The same X cannot be both blue and red in one proof.
        explanation: Inequality checks current unifiability. A repeated variable still requires one consistent
          binding, as in the earlier unification step.
    solution:
      files:
      - path: prolog-v2/05-negation.pl
        language: prolog
        content: |
          scheduled(puzzles, morning).
          scheduled(robots, noon).
          scheduled(music, evening).
          closed_slot(morning).
          cancelled(music).

          usable_slot(Demo) :- scheduled(Demo, Slot), not(closed_slot(Slot)).

          available(Demo) :- scheduled(Demo, Slot), not(closed_slot(Slot)), not(cancelled(Demo)).
      explanation: Candidate generation binds both the demo and its slot. puzzles is excluded by the closure
        of morning, music by its cancellation, and robots passes both checks. dance never matches a schedule
        fact. The same variable must connect each exclusion to the correct argument of scheduled.
  # Lecture: logic_palooza_v6_handouts.pdf pp.13–14,21–23,42–44. Assessment: S23 Final P5, p.11.
  # Pedagogy: worked example with fading — recursive paths composed with a distinct target filter.
  - title: Recursive Relations
    key: v2-recursive-relations
    instructions: |
      ### Why this matters

      A course can prepare a student for several different program tracks. To find the courses relevant to one track, we need both an indirect dependency chain and a fact saying where that track ends.

      ### 🎯 You will learn to

      - Create a relation for a path of one or more edges.
      - Analyze recursive progress and pending goals.
      - Create a second relation that joins reachability to a track goal.

      ### From one edge to a chain

      `prerequisite(A,B)` means A is an immediate prerequisite of B. The supplied graph is finite and has no cycles. Define `needed_before(A,B)` to mean **one or more** prerequisite edges lead from A to B. Merely being the same course does not qualify.

      A recursive relation needs two reasons to succeed:

      - A direct edge already connects the requested endpoints.
      - One edge reaches an intermediate course, and that course has a path to the destination.

      The two reasons become separate clauses. The recursive reason needs a shared intermediate variable to connect its two subgoals. Consume an edge **before** asking about the remaining path. Fresh variables are created on every use of a clause, even when its source uses the same names.

      ### Predict, run, and investigate

      The starter implements only the direct reason. Before Run, predict `needed_before(intro, Target)`. Would it include `languages` yet? Run it and explain what is missing.

      Consider the tempting body `needed_before(A, Mid), prerequisite(Mid, B)`. Its first goal asks for another path before moving along an edge. Repeated expansion can revisit the same search forever. A base clause placed first may produce initial answers but does not make complete enumeration terminate. Do not run this version as your solution; the workspace's inference limit is a safety bound, not a proof of failure.

      ### Your task

      Keep the facts and the direct case. Add the recursive case for **`needed_before(A,B)`**. It must work for ground course pairs and for queries with one or both course arguments unbound, over this finite acyclic database. It should find each reachable pair; different paths may justify the same pair. Answer order and duplicate-proof counts are not part of this step's contract.

      Then define **`needed_for(Course, Track)`**: Course must be one or more edges before a target named by `track_goal(Track, Target)`. A target course itself is not its own prerequisite. Reuse needed_before rather than enumerating named courses. This adds a separate decision: a reachable course only counts when it leads toward the requested track's target.

      Predict `needed_before(intro, Target)` and `needed_before(Source, languages)`, then run them. Also test `needed_before(languages, intro)` and `needed_before(intro, intro)`: neither has a path.

      Predict which courses `needed_for(Course, software)` will find, and why discrete is excluded even though it is reachable from intro. Then test that query and `needed_for(discrete, software)`.

      On paper, expand the recursive case for `needed_before(intro, languages)` into its two pending goals. After the first edge matches, record the intermediate binding and the remaining goal. This trace is separate from the automatic behavior checks.
    default_query: needed_before(intro, Target)
    files:
    - path: prolog-v2/06-recursion.pl
      language: prolog
      content: |
        prerequisite(intro, structures).
        prerequisite(structures, systems).
        prerequisite(structures, discrete).
        prerequisite(systems, languages).
        track_goal(software, languages).
        track_goal(theory, discrete).

        needed_before(A, B) :- prerequisite(A, B).
        % Add the indirect reason using one edge and a smaller path query.

        % Define needed_for(Course, Track) by connecting a track goal to the path relation.
    open_file: prolog-v2/06-recursion.pl
    run_file: prolog-v2/06-recursion.pl
    tests:
    - description: Direct and multi-edge prerequisite paths succeed.
      command: |
        assert((await __query("needed_before(intro, structures), needed_before(intro, languages), needed_before(structures, languages).")).length >= 1, "Support the direct edge and paths spanning two or three edges.");
      hints:
      - title: A direct case is only the start
        text: The existing clause already covers one edge. A longer path needs a second reason to succeed.
      - title: One shared intermediate course
        text: Relate the start to an intermediate course using a fact, then relate that intermediate course to
          the destination recursively.
      - title: Progress before recursion
        text: In the recursive body, place the immediate prerequisite goal first and the needed_before goal second.
          The intermediate variable connects them.
    - description: Variable queries enumerate exactly the reachable courses in either direction.
      command: |
        assert((await __query("findall(T, needed_before(intro,T), Ts), sort(Ts, UniqueTs), UniqueTs == [discrete,languages,structures,systems].")).length === 1, "From intro, reach structures, systems, discrete, and languages, with no unrelated course.");
        assert((await __query("findall(S, needed_before(S,languages), Ss), sort(Ss, UniqueSs), UniqueSs == [intro,structures,systems].")).length === 1, "The prerequisites of languages are intro, structures, and systems.");
      hints:
      - title: Queries may leave either end unknown
        text: The rule relates two endpoints; it must not be specialized to intro or languages.
      - title: Preserve the requested destination
        text: Only the starting point of the remaining path changes after consuming an edge.
      - title: Follow the argument meanings
        text: Check each argument as start, intermediate, or destination. The same intermediate name must appear
          at the end of the edge and the start of the recursive goal.
    - description: Reverse, unrelated, and zero-edge paths fail finitely.
      command: |
        assert((await __query("not(needed_before(languages,intro)), not(needed_before(discrete,systems)), not(needed_before(intro,intro)), not(needed_before(unknown,languages)).")).length === 1, "Do not invent reverse edges, a zero-edge path, or paths from unknown courses.");
      hints:
      - title: Reachability has direction
        text: A prerequisite of a course is not automatically a course that depends on it.
      - title: One or more edges
        text: The contract excludes a fact that declares every course reachable from itself.
      - title: Exhaust the finite branches
        text: Each recursive branch must begin with an actual edge from the current start. If none exists, that
          branch should fail rather than recurse unchanged.
    - description: Track queries include only courses that lead to that track's target.
      command: |
        assert((await __query("findall(C, needed_for(C,software), Cs), sort(Cs, Set), Set == [intro,structures,systems], needed_for(structures,theory), not(needed_for(discrete,software)), not(needed_for(languages,software)), not(needed_for(intro,unknown)).")).length >= 1, "Find indirect prerequisites of a track goal, excluding unrelated branches, the goal itself, and unknown tracks.");
      hints:
      - title: The target is a separate fact
        text: The path relation alone does not say which destination belongs to which track.
      - title: Join through the target course
        text: Use the target from track_goal as the destination argument of needed_before.
      - title: Keep the public argument meanings
        text: The output candidate Course is the path's start. Track selects a target; it is not itself a course
          in the prerequisite graph.
    quiz:
      title: Step 6 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
      - type: parsons
        difficulty: intermediate
        bloom: apply
        question: |
          Arrange the events for the first answer to `reach(a, X)`. Omit the unused event.

          ```prolog
          edge(a,b).
          edge(b,c).
          reach(A,B) :- edge(A,B).
          reach(A,B) :- edge(A,M), reach(M,B).
          ```
        lines:
        - Match reach(a, X) to the direct clause.
        - Replace that goal with edge(a, X).
        - Match edge(a, X) to edge(a, b), binding X = b.
        - Report X = b because no goals remain.
        distractors:
        - Follow edge(b, c) before reporting the direct answer.
        explanation: The direct clause is tried first. Its one subgoal succeeds with X = b, so that proof is
          reported before a later recursive proof is explored.
      - type: single
        difficulty: advanced
        bloom: analyze
        question: |
          A direct base clause is followed by `path(A,B) :- path(A,M), edge(M,B).`. Why can asking for every answer fail to finish even on a finite acyclic edge database?
        options:
        - The recursive goal may repeat before an edge narrows it.
        - The base clause removes all later recursive alternatives.
        - Every finite graph requires a visited-node list.
        correct_index: 0
        option_feedback:
          1: Prolog explores later clauses when more answers are requested; a base case does not remove them.
          2: For the finite acyclic input contract, consuming an edge first can make progress without a visited
            list.
        explanation: Search order matters. Here the recursive call comes before the edge that could make progress,
          so deeper calls can repeat the same broad search.
    solution:
      files:
      - path: prolog-v2/06-recursion.pl
        language: prolog
        content: |
          prerequisite(intro, structures).
          prerequisite(structures, systems).
          prerequisite(structures, discrete).
          prerequisite(systems, languages).
          track_goal(software, languages).
          track_goal(theory, discrete).

          needed_before(A, B) :- prerequisite(A, B).
          needed_before(A, B) :- prerequisite(A, Mid), needed_before(Mid, B).

          needed_for(Course, Track) :- track_goal(Track, Target), needed_before(Course, Target).
      explanation: |-
        The direct clause proves a path of length one. The recursive clause removes its first edge and asks for the remaining path. The finite acyclic contract bounds path lengths, so both variable and ground searches finish. Starting from intro, the program reports structures, systems, discrete, then languages. Other correct clause arrangements can produce a different order; the task's tests check reachable values rather than imposing this solution's ordering.

        The needed_for relation first identifies the requested track's target, then asks which courses have a nonempty path to it. discrete lies on a different branch, so it is needed for theory but not software.
  # Lecture: logic_palooza_v6_handouts.pdf pp.46–49. Assessment: F22 Final Q22; F23 Final P8(a).
  # Pedagogy: Variation Theory — decompose a structured badge, then transfer to prefix and tail patterns.
  - title: List Patterns
    key: v2-list-patterns
    instructions: |
      ### Why this matters

      Recursive list questions start with a smaller skill: identifying which value each variable matches. A nested list is one element, while a tail is the list of everything left after a prefix is removed.

      ### 🎯 You will learn to

      - Apply head/tail patterns to ordinary and nested lists.
      - Analyze repeated and anonymous variables in list patterns.
      - Create relations that extract a fixed prefix without recursion.

      ### One element, then the rest

      `[]` is the empty list. `[Head|Tail]` matches a nonempty list: `Head` receives its first **element**, and `Tail` receives the remaining **list**. `[A,B|Rest]` consumes two elements. In contrast, `[A,B]` is a list of exactly two elements.

      ```prolog
      badge_head([badge(Name,Color)|_], Name, Color).
      ```

      This fact extracts two fields from a badge at the front of a queue. Its head combines a list pattern with the nested compound pattern `badge(Name,Color)`. Each plain `_` is a fresh anonymous variable: it can match something without forcing later `_` positions to match the same thing. A named variable such as `_Tail` still shares a binding when repeated.

      ### Predict, run, and investigate

      Before running the default query, predict the two bindings. Does Name receive the atom aurora or the whole badge term? Then try these unifications in the Query field:

      ```prolog
      [H|T] = [[a,b],c]
      [A,B|Rest] = [red,blue,green]
      [H|T] = []
      ```

      <details markdown="1">
      <summary>After running: check the boundaries</summary>

      In the first query, `H = [a,b]` and `T = [c]`; list matching does not flatten the nested head. In the second, `A = red`, `B = blue`, and `Rest = [green]`. The third fails because an empty list has no head.

      </details>

      ### Your task

      Keep `badge_head`. Define two relations for finite proper lists:

      - **`first_two(List, A, B)`** relates a list of at least two elements to its first and second elements. It fails on lists of length zero or one.
      - **`drop_two(List, Rest)`** relates a list of at least two elements to the list remaining after exactly two elements. It also fails when fewer than two elements exist.

      Use pattern facts; these tasks do not need recursion. The two ignored elements in `drop_two` may be different. Elements may be atoms, numbers, or nested lists. Predict both results for `[[a,b], c, d]`, then test them. Check the exactly-two-element boundary as well.
    default_query: badge_head([badge(aurora,green),badge(ocean,blue)], Name, Color)
    files:
    - path: prolog-v2/07-patterns.pl
      language: prolog
      content: |
        badge_head([badge(Name,Color)|_], Name, Color).

        % Define first_two(List, A, B).
        % Define drop_two(List, Rest).
    open_file: prolog-v2/07-patterns.pl
    run_file: prolog-v2/07-patterns.pl
    tests:
    - description: The first two elements are extracted without flattening or accepting short lists.
      command: |
        assert((await __query("findall(pair(A,B), first_two([red,blue,green],A,B), Pairs), sort(Pairs,PS), PS == [pair(red,blue)], findall(pair(A,B), first_two([[a,b],c],A,B), Nested), sort(Nested,NS), NS == [pair([a,b],c)], not(first_two([],_,_)), not(first_two([red],_,_)).")).length >= 1, "Extract two elements, preserve nested values, and reject inputs shorter than two.");
      hints:
      - title: Element positions
        text: A list whose first element is itself a list still has just one element in that position.
      - title: A two-element prefix
        text: Match two named elements before the bar, with a tail after it.
      - title: Connect input to output arguments
        text: Reuse the names for the first and second elements in the other two arguments. Ignore the remainder
          with an anonymous variable.
    - description: Dropping two elements preserves the exact tail, including an empty tail.
      command: |
        assert((await __query("findall(R, drop_two([a,b,c,d],R), Tails), sort(Tails,TS), TS == [[c,d]], findall(R, drop_two([[a,b],c,d],R), Nested), sort(Nested,NS), NS == [[d]], findall(R, drop_two([a,b],R), Empty), sort(Empty,ES), ES == [[]], not(drop_two([], _)), not(drop_two([a], _)).")).length >= 1, "Remove exactly two elements; the remaining tail is a list and may be empty.");
      hints:
      - title: The rest is already a list
        text: There is no need to wrap the tail in another pair of brackets.
      - title: Ignore independently
        text: The two discarded elements need not be equal, so do not constrain them with one repeated named
          variable.
      - title: Share the tail
        text: Put the same tail variable after the bar in the input pattern and in the output argument.
    quiz:
      title: Step 7 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
      - type: multiple
        difficulty: intermediate
        bloom: analyze
        question: After `[H|T]` unifies with `[[red,blue], green]`, select every correct binding.
        options:
        - H = red
        - H = [red,blue]
        - T = green
        - T = [green]
        correct_indices:
        - 1
        - 3
        option_feedback:
          0: The head is the whole first element, which is the nested list [red,blue].
          1: The nested list occupies one outer-list element.
          2: A tail is the list of the remaining elements, even if only one remains.
          3: After taking the head, the remaining list contains green.
        explanation: Head/tail matching removes one outer element and leaves the remaining outer list intact.
      - type: single
        difficulty: intermediate
        bloom: apply
        question: Which pattern matches exactly a nonempty list whose first and second elements agree, followed
          by any remaining tail? The list must have at least two elements.
        options:
        - '[X,Y|Tail]'
        - '[X,X|Tail]'
        - '[X,X]'
        correct_index: 1
        option_feedback:
          0: Separate names do not require the two elements to agree.
          2: This pattern accepts only lists of exactly two elements.
        explanation: Repeating X constrains the first two elements to unify; Tail permits any remaining list.
    solution:
      files:
      - path: prolog-v2/07-patterns.pl
        language: prolog
        content: |
          badge_head([badge(Name,Color)|_], Name, Color).
          first_two([A,B|_], A, B).
          drop_two([_,_|Rest], Rest).
      explanation: |
        Each clause uses unification to expose the needed positions. The first two named variables are returned as elements. The tail variable in drop_two already denotes a list, so returning it directly avoids accidental nesting. Separate anonymous variables leave the discarded values independent.
  # Lecture: logic_palooza_v6_handouts.pdf pp.48,50–54. Assessment: F23 P8(a), F24 P7(C).
  # Pedagogy: worked example with fading — frame each item, then change output shape to duplicate each item.
  - title: Recursive List Construction
    key: v2-list-construction
    instructions: |
      ### Why this matters

      A recursive predicate describes how the output relates to the input. The key step is connecting a recursively produced tail to the prefix produced by the current clause, rather than thinking of a hidden return statement.

      ### 🎯 You will learn to

      - Trace how recursive calls bind output arguments.
      - Apply empty and nonempty cases to construct a list.
      - Create a new transformation from a worked recursive pattern.

      ### A complete worked example

      ```prolog
      frame_items([], []).
      frame_items([H|T], [frame(H)|Rest]) :- frame_items(T, Rest).
      ```

      The empty list yields no frames. For a nonempty input, the output begins with the compound term `frame(H)`, recording that one item has been framed. The subgoal relates the input tail `T` to the output tail `Rest`. The rule does not assign a function result to Rest: that argument is a variable whose value the recursive proof discovers.

      For `frame_items([a,b], Out)`, the outer output is `[frame(a)|Rest1]`. The next call relates `[b]` to `[frame(b)|Rest2]`. The base case binds `Rest2 = []`; consequently `Rest1 = [frame(b)]` and `Out = [frame(a),frame(b)]`. Fresh names here make the distinct clause applications visible.

      ### Predict, run, and investigate

      Predict `frame_items([[a,b],c], Out)` before Run. Does a nested input item become one frame containing that list, or separate frames for its inner elements? Run, then query `frame_items([a], [frame(b)])` and explain why a relation can check a proposed output as well as produce one.

      ### Your task

      Complete **`double_each(Input, Output)`**. For a finite proper ground list, the output contains each input element twice consecutively in the same order: `[a,b]` becomes `[a,a,b,b]`. A nested list counts as one element, so `[[a,b],c]` becomes `[[a,b],[a,b],c,c]`. Produce one answer for each such input.

      The empty case is supplied. Derive the nonempty case from `frame_items`: identify the output prefix contributed by one head, and connect it to the output of processing the tail. Do not list individual sample answers as facts.

      Before testing, trace `[a,b]` with fresh output-tail names, then predict the singleton, empty, repeated-element, and nested-element cases. Explain why recursing on the entire original input would not make progress.
    default_query: frame_items([[a,b],c], Out)
    files:
    - path: prolog-v2/08-construction.pl
      language: prolog
      content: |
        frame_items([], []).
        frame_items([H|T], [frame(H)|Rest]) :- frame_items(T, Rest).

        double_each([], []).
        % Add the nonempty case: transform one element and process the tail.
    open_file: prolog-v2/08-construction.pl
    run_file: prolog-v2/08-construction.pl
    tests:
    - description: Empty and singleton inputs produce one exact output each.
      command: |
        assert((await __query("findall(R, double_each([],R), Empty), Empty == [[]], findall(R, double_each([a],R), One), One == [[a,a]].")).length === 1, "The empty result is []; a singleton becomes two copies of its element, with no extra answers.");
      hints:
      - title: Two input shapes
        text: The empty list and a head with a tail need different clauses.
      - title: The current head's contribution
        text: One input head contributes two output elements before the recursive result.
      - title: Prefix plus recursive tail
        text: Build an output pattern with the head variable in two element positions and a separate tail variable
          after the bar.
    - description: Longer inputs preserve order, repeated values, and nested elements.
      command: |
        assert((await __query("findall(R, double_each([a,b,a],R), Answers), Answers == [[a,a,b,b,a,a]], findall(R, double_each([[a,b],c],R), Nested), Nested == [[[a,b],[a,b],c,c]].")).length === 1, "Duplicate each position without flattening nested elements or removing repeats.");
      hints:
      - title: Process positions, not unique values
        text: A repeated input value still contributes twice at each position where it appears.
      - title: Keep the element whole
        text: Head matching already gives the entire element, including a nested list. Reuse that value instead
          of unpacking it again.
      - title: Connect the right two tails
        text: The recursive goal relates the input tail to the output tail. The current head belongs in the outer
          output prefix, not in the recursive input.
    quiz:
      title: Step 8 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
      - type: parsons
        difficulty: intermediate
        bloom: apply
        question: |
          Arrange the events in the first proof of `frame_items([a,b], Out)` using the worked definition. R1 and R2 are fresh output-tail variables. Omit the unused event.
        lines:
        - Match the outer clause, with Out = [frame(a)|R1], and call frame_items([b], R1).
        - Match the next clause, with R1 = [frame(b)|R2], and call frame_items([], R2).
        - Match the empty clause, binding R2 = [].
        - Report Out = [frame(a),frame(b)] after all goals succeed.
        distractors:
        - Bind R1 = frame(b) because b is the next head.
        explanation: R1 is an output list tail, so it becomes [frame(b)], not the single frame(b) term. The empty
          base completes the chain of bindings.
      - type: single
        difficulty: intermediate
        bloom: analyze
        question: A copied rule recurses on `[H|T]` instead of `T`. What is the main problem for a nonempty ground
          input?
        options:
        - The input gets larger on every call.
        - The recursive input never gets smaller.
        - The output loses its first element.
        correct_index: 1
        option_feedback:
          0: Reusing [H|T] preserves the input's size; it does not add another element.
          2: The immediate problem is repeated expansion of the same input, before a final output can be established.
        explanation: Structural recursion reaches the empty case by processing a shorter tail. Repeating the
          same nonempty input prevents that progress.
    solution:
      files:
      - path: prolog-v2/08-construction.pl
        language: prolog
        content: |
          frame_items([], []).
          frame_items([H|T], [frame(H)|Rest]) :- frame_items(T, Rest).

          double_each([], []).
          double_each([H|T], [H,H|Rest]) :- double_each(T, Rest).
      explanation: |
        The base relates two empty lists. The recursive clause contributes two copies of H and asks for the transformed tail in Rest. Reusing H preserves nested elements as values. The two clauses match disjoint input shapes, so each finite ground input has exactly one proof and one output.
  # Lecture: logic_palooza_v6_handouts.pdf pp.22,42,51–54. Assessment: recursive output/proof reasoning in F23 P8(a).
  # Pedagogy: contrast and repair — choose an eligible queue position and return a compound ticket with its remainder.
  - title: Removal and Extra Answers
    key: v2-removal-answers
    instructions: |
      ### Why this matters

      A reward kiosk must offer every eligible choice while leaving the other items available. The same remaining queue can arise from different choices of position, so the number of proofs can matter even when output lists look identical.

      ### 🎯 You will learn to

      - Analyze the full answer stream of overlapping clauses.
      - Create a relation that chooses one eligible position and constructs its remainder.
      - Distinguish identical output values from different proofs.

      ### Inspect all proofs

      The starter's `claim_demo(Queue, Ticket, Rest)` has a flaw. It can issue a `ticket(Item)` for an eligible head, or preserve the head and search later. Its empty clause also permits `none` without claiming anything.

      Before Run, predict **every pair** of Ticket and Rest for `claim_demo([leaf,locked,leaf], Ticket, Rest)`. Both leaf positions are eligible; locked is not. Will search eventually produce a none ticket as well?

      <details markdown="1">
      <summary>After running: locate the extra proof</summary>

      The answers are `ticket(leaf)` with `[locked,leaf]`, then `ticket(leaf)` with `[leaf,locked]`, then `none` with the unchanged `[leaf,locked,leaf]`. The recursive clause can keep searching after an earlier claim succeeds. If it preserves every head, the empty clause succeeds without choosing a reward.

      </details>

      This task needs **every eligible position**, not just the first eligible value. A match may be kept while search reaches another matching position later. The recursive clause therefore must not reject a head merely because that head is eligible.

      ### Your task

      Complete **`claim_badge(Queue, Ticket, Rest)`**. Queue is a finite proper ground list of atoms; Ticket and Rest are initially unbound or proposed results. Choose exactly one position whose atom satisfies `offered/1`, produce its compound ticket `ticket(Atom)`, and remove only that position from Rest. Preserve every other position in order.

      Enumerate chosen positions from left to right. If no position is eligible or the queue is empty, fail. Keep duplicate proofs: `[leaf,leaf]` has two eligible positions, so it gives `ticket(leaf)` and `[leaf]` twice. There must be no none ticket and no unchanged queue.

      The head-choice clause is supplied. Add the case that preserves a head while a claim happens later in the queue. Do not add an empty-success case or change the offered facts.

      Predict results for `[leaf,stone,leaf]`, `[locked,stone]`, `[locked]`, and `[]` before testing. Explain why the output is a pair of a chosen ticket and a remaining list, and why the chosen ticket must come from the same proof that constructs that remainder.
    default_query: claim_demo([leaf,locked,leaf], Ticket, Rest)
    files:
    - path: prolog-v2/09-removal.pl
      language: prolog
      content: |
        offered(leaf).
        offered(stone).

        claim_demo([], none, []).
        claim_demo([Item|Tail], ticket(Item), Tail) :- offered(Item).
        claim_demo([Head|Tail], Ticket, [Head|Rest]) :- claim_demo(Tail, Ticket, Rest).

        claim_badge([Item|Tail], ticket(Item), Tail) :- offered(Item).
        % Add the case that preserves a head while a claim happens later.
    open_file: prolog-v2/09-removal.pl
    run_file: prolog-v2/09-removal.pl
    tests:
    - description: Each eligible position yields its matching ticket and exact remainder in positional order.
      command: |
        assert((await __query("findall(choice(T,R), claim_badge([leaf,stone,leaf],T,R), Answers), Answers == [choice(ticket(leaf),[stone,leaf]),choice(ticket(stone),[leaf,leaf]),choice(ticket(leaf),[leaf,stone])], findall(choice(T,R), claim_badge([locked,stone],T,R), Later), Later == [choice(ticket(stone),[locked])].")).length === 1, "Offer every eligible position and connect each ticket to the list with that position removed.");
      hints:
      - title: A choice and a remainder
        text: An answer is not just a ticket. It must carry the list after that same chosen position has been
          removed.
      - title: Preserve skipped positions
        text: The later-choice case keeps the current head and asks the shorter tail to produce a ticket and
          a remaining tail.
      - title: Connect the two outputs
        text: Pass one ticket variable to the recursive call, and use its remaining-list variable as the tail
          of the outer remainder.
    - description: Empty or ineligible queues fail, while equal eligible positions keep their duplicate proofs.
      command: |
        assert((await __query("findall(choice(T,R), claim_badge([],T,R), Empty), Empty == [], findall(choice(T,R), claim_badge([locked],T,R), Missing), Missing == [], findall(choice(T,R), claim_badge([leaf,leaf],T,R), Repeated), Repeated == [choice(ticket(leaf),[leaf]),choice(ticket(leaf),[leaf])], not(claim_badge([leaf],none,[leaf])), not(claim_badge([leaf],ticket(stone),[])).")).length === 1, "Claim exactly one eligible position; reject none or unrelated tickets, and retain both proofs for [leaf,leaf].");
      hints:
      - title: Every success needs a claim
        text: Reaching the end without choosing anything must fail rather than return a none ticket.
      - title: Eligibility applies at the chosen position
        text: The head-choice case checks offered; skipped items do not have to be eligible.
      - title: Do not commit to a value
        text: Keeping an eligible head lets search claim another position later, including a second occurrence
          of the same value.
    quiz:
      title: Step 9 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
      - type: single
        difficulty: intermediate
        bloom: apply
        question: What is the full answer sequence for `claim_badge([leaf,leaf,locked], Ticket, Rest)` under
          the task contract?
        options:
        - ticket(leaf) with [leaf,locked], once
        - ticket(leaf) with [leaf,locked], twice
        - ticket(locked) with [leaf,leaf], once
        correct_index: 1
        option_feedback:
          0: Either leaf position can be claimed. Equal outputs still come from different proofs.
          2: locked has no offered fact, so that position cannot issue a ticket.
        explanation: The first and second leaf are separate eligible positions. Each claim produces ticket(leaf)
          and leaves [leaf,locked], so both proofs are reported.
      - type: multiple
        difficulty: advanced
        bloom: evaluate
        question: Which changes would violate the claim_badge contract for some allowed queue? Select every such
          change.
        options:
        - Add an empty case that returns none and [].
        - Rename every variable consistently within a clause.
        - Skip a head only if it is not offered.
        - Keep separate proofs with identical ticket and remainder.
        correct_indices:
        - 0
        - 2
        option_feedback:
          0: Empty success permits an answer in which no eligible position was claimed.
          1: Consistent variable renaming preserves the pattern and relation.
          2: This suppresses later choices whenever an earlier head was eligible.
          3: The contract requires each eligible position, even when outputs coincide.
        explanation: A valid proof chooses exactly one eligible position, and search offers all such choices.
          Empty success and a restriction on skipping eligible heads would change those behaviors.
    solution:
      files:
      - path: prolog-v2/09-removal.pl
        language: prolog
        content: |
          offered(leaf).
          offered(stone).

          claim_demo([], none, []).
          claim_demo([Item|Tail], ticket(Item), Tail) :- offered(Item).
          claim_demo([Head|Tail], Ticket, [Head|Rest]) :- claim_demo(Tail, Ticket, Rest).

          claim_badge([Item|Tail], ticket(Item), Tail) :- offered(Item).
          claim_badge([Head|Tail], Ticket, [Head|Rest]) :- claim_badge(Tail, Ticket, Rest).
      explanation: The head-choice clause establishes eligibility and binds the ticket to the chosen atom. The
        recursive clause preserves an unchosen head while the same Ticket variable connects to a later claim.
        Without empty success, every proof must choose an eligible position exactly once. Source-order search
        offers the current position before later positions, retaining duplicate proofs when equal items occur
        at different positions.

  # Lecture: logic_palooza_v6_handouts.pdf pp. 47–49, 52–54 (patterns and recursive construction); ground inequality was taught in step 5.
  # Assessment: CS131 Fall 25 Quiz 4.docx, Problem 5, consecutive duplicate removal.
  # Pedagogy: worked example with fading — distinguish neighboring runs from global uniqueness.
  - title: Adjacent Runs
    key: v2-adjacent-runs
    instructions: |
      ### Why this matters

      “Remove duplicates” can describe different operations. A correct recursive program starts with a precise example of what stays and what disappears.

      ### 🎯 You will learn to

      - Analyze overlapping list patterns and choose a smaller recursive input.
      - Create a relation that collapses consecutive equal elements without removing later runs.

      ### One run at a time

      A media player records its current track after each screen refresh. Repeated adjacent records are one uninterrupted play; a replay after another track must remain visible. A **run** is a consecutive group of equal values. Collapsing runs turns `[red,red,blue,red,red]` into `[red,blue,red]`: the final red belongs to a different run. This is not the task of keeping each value only once.

      We will use finite, proper lists of **ground atoms**. Thus comparing two heads with `X \= Y` is a test of different known values, as in step 5. A repeated variable in `[X,X|Tail]` identifies two equal neighboring elements.

      To design `collapse(Input,Output)`, split the inputs into four cases: empty, singleton, two equal initial elements, and two different initial elements. In each recursive case, decide what the recursive call must receive and what the current clause contributes to the output.

      ### Predict, then investigate

      For the equal-head case on `[red,red,red,blue]`, compare recursive inputs `[red,red,blue]` and `[red,blue]`. Both are smaller, but which still works for the shorter input `[red,red]` while retaining one red? Write your reasoning before editing. Do not assume every shorter input preserves the contract.

      For the unequal-head case, trace `[red,blue,blue]` on paper. The first red must stay. The remaining recursion must still compare the two blue elements.

      ### Your task

      Implement `collapse/2` for the stated input mode: Input is a finite ground list and Output is initially unbound or is a proposed result. It must yield one proof of exactly the collapsed list, with no alternative wrong outputs. The starter gives the two terminal cases; write the recursive cases. Do not modify the input list or sort it.

      Try empty and singleton lists, one long run, alternating values, and a value that reappears after another value. Use **Test My Work**, then explain which of these cases would expose a solution that removes all repeated values globally.
    default_query: collapse([red,red,blue,red,red], Out)
    files:
      - path: prolog-v2/10-runs.pl
        language: prolog
        content: |
          % collapse(Input, Output): retain one atom from each adjacent run.
          % Input is a finite ground proper list.
          collapse([], []).
          collapse([X], [X]).
          % Add the two recursive cases.
    open_file: prolog-v2/10-runs.pl
    run_file: prolog-v2/10-runs.pl
    tests:
      - description: Empty, singleton, and repeated runs retain exactly their required elements.
        command: |
          assert((await __query("findall(R,collapse([],R),A), A == [[]], findall(R,collapse([a],R),B), B == [[a]], findall(R,collapse([a,a,a],R),C), C == [[a]].")).length === 1, "Check empty, singleton, and one-run inputs; keep one copy of each run.");
        hints:
          - title: The smallest inputs
            text: An empty input contributes nothing. A singleton contributes its one element.
          - title: A run still needs a representative
            text: In the equal-head case, drop only one of the two equal heads before recurring.
          - title: The recursive input
            text: Match two equal heads. Keep one of them at the front of the recursive input so it can be compared with the following element.
      - description: Separated runs stay separate and the relation has no extra answers.
        command: |
          assert((await __query("findall(R,collapse([a,a,b,a,a],R),A), A == [[a,b,a]], findall(R,collapse([a,b,a,b],R),B), B == [[a,b,a,b]], findall(R,collapse([x,y,y,z,z],R),C), C == [[x,y,z]], \\+ collapse([a,a,b],[a,a,b]).")).length === 1, "Preserve later runs and the unequal first head; do not permit an unchanged duplicate-filled answer.");
        hints:
          - title: Different neighbors
            text: When the first two atoms differ, the first one belongs in the output.
          - title: A disjoint case
            text: Guard the different-head clause so it cannot also handle equal neighbors.
          - title: Rebuild the prefix
            text: Relate the processed tail to the output tail, then preserve the current first element in front of it.
    quiz:
      title: Step 10 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
        - type: single
          difficulty: intermediate
          bloom: analyze
          question: Which input distinguishes collapse of adjacent runs from global duplicate removal?
          options: ['`[a,a,a]`', '`[a,b,a]`', '`[a,b,c]`']
          correct_index: 1
          option_feedback:
            0: Both operations leave one a for this single run.
            2: Neither operation removes anything when every atom is different.
          explanation: Adjacent collapse preserves [a,b,a]; global duplicate removal cannot retain both occurrences of a.
        - type: multiple
          difficulty: intermediate
          bloom: analyze
          question: In the earlier reward-kiosk exercise, what must hold when `claim_badge([leaf,locked,stone], ticket(stone), Rest)` succeeds? Select all that apply.
          options: ['Rest retains leaf and locked.', 'Rest can remain `[leaf,locked,stone]`.', 'Rest has exactly one fewer element.']
          correct_indices: [0, 2]
          option_feedback:
            0: Only the requested occurrence is removed; its surrounding elements remain.
            1: An unchanged answer violates the exact-one-removal contract.
            2: One removal shortens the list by one, even though the recursion visits a prefix.
          explanation: Recursive traversal does not itself remove elements. Only the chosen occurrence disappears; other heads must be rebuilt.
    solution:
      files:
        - path: prolog-v2/10-runs.pl
          language: prolog
          content: |
            collapse([], []).
            collapse([X], [X]).
            collapse([X,X|T], R) :- collapse([X|T], R).
            collapse([X,Y|T], [X|R]) :- X \= Y, collapse([Y|T], R).
      explanation: |
        The equal case discards one copy but leaves the other for the next comparison. The unequal case emits the first head and continues from the second. Empty and singleton patterns cannot overlap either recursive pattern. For ground atoms, the equal and unequal cases are disjoint, so each input has one result. Every recursive input is one element shorter.

  # Lecture: logic_palooza_v6_handouts.pdf pp. 48–55 (list construction, recursive clauses, reverse); accumulator is an application of those skills.
  # Assessment: [Final] F24 V1 (Public).pdf, Problem 7(A–B), pp. 23–24, pending goals and accumulator reversal.
  # Pedagogy: PRIMM — trace a supplied invariant, diagnose a state-update error, then repair.
  - title: Accumulator State
    key: v2-accumulator
    instructions: |
      ### Why this matters

      A recursive call can carry a partial result as an argument. Tracing that argument prevents the common mistake of treating Prolog variables as mutable slots.

      ### 🎯 You will learn to

      - Analyze the input and accumulator of a recursive list relation.
      - Repair a clause while preserving the meaning of its recursive state.

      ### First, trace the pending goals

      A different reversal strategy processes the tail, then joins a singleton to its end. Here `join/3` has the lecture's `append/3` meaning, written using the list patterns you already know:

      ```prolog
      join([], Ys, Ys).
      join([H|T], Ys, [H|Out]) :- join(T, Ys, Out).
      replay([], []).
      replay([H|T], Out) :- replay(T, R), join(R, [H], Out).
      ```

      On paper, expand `replay([clip(chime),clip(wind)], [clip(wind),clip(bell)])` **once**. Record the recursive head's bindings and the two pending goals, in order. Does matching that head already prove the entire query?

      <details markdown="1">
      <summary>After your trace: compare the pending goals</summary>

      The head matches with `H = clip(chime)`, `T = [clip(wind)]`, and `Out = [clip(wind),clip(bell)]`. Using a fresh R, the pending goals are `replay([clip(wind)], R)` followed by `join(R, [clip(chime)], [clip(wind),clip(bell)])`. The first proves `R = [clip(wind)]`; the second fails because its required final item is clip(chime), not clip(bell). Head unification starts a possible proof; all body goals must still succeed.

      </details>

      ### A result built along the way

      `reverse_into(Remaining, Acc, Result)` should place the reversal of Remaining in front of Acc. The accumulator is an ordinary list term. Each call has its own variables; a later call receives a new list rather than assigning a new value to an earlier variable.

      For `reverse_into([a,b], [end], R)`, the intended call states are:

      | Remaining | Accumulator | Reason |
      | --- | --- | --- |
      | `[a,b]` | `[end]` | Initial query |
      | `[b]` | `[a,end]` | Move a to the front of the accumulated result |
      | `[]` | `[b,a,end]` | Move b to the front |

      At the empty input, the accumulator is the completed result. A wrapper starts the accumulator at `[]` when the desired operation is ordinary reversal.

      ### Predict before running

      The starter mistakenly nests the accumulator as a list element. Predict whether reversing `[a,b]` produces a flat list or nested lists. Run it, then locate the first recursive call where the accumulator violates the table's meaning.

      Recall the list-pattern distinction: `[Head|Tail]` extends a list; `[Head,Tail]` constructs a two-element list whose second element may itself be a list.

      ### Your task

      Repair `reverse_into/3` for any finite ground proper list and any finite ground accumulator list. Its result must be the reversal of the input followed by the original accumulator. Both the helper and the wrapper must produce one proof of the required result in these input modes. Keep the public predicate names and wrapper behavior; equivalent clause implementations are welcome.

      Before testing, predict `reverse_into([sun,moon], [star], R)` and write the intermediate accumulator. Then verify empty input, repeated elements, and a list containing a nested list. No arithmetic, mutation, or special reversal primitive is needed.
    default_query: reverse_list([a,b], R)
    files:
      - path: prolog-v2/11-accumulator.pl
        language: prolog
        content: |
          reverse_list(Input, Output) :- reverse_into(Input, [], Output).
          reverse_into([], Acc, Acc).
          % The following clause builds the wrong accumulator shape.
          reverse_into([H|T], Acc, R) :- reverse_into(T, [H,Acc], R).
    open_file: prolog-v2/11-accumulator.pl
    run_file: prolog-v2/11-accumulator.pl
    tests:
      - description: Reversal preserves all elements without nesting the accumulator.
        command: |
          assert((await __query("findall(R,reverse_list([],R),A), A == [[]], findall(R,reverse_list([a,b,c],R),B), B == [[c,b,a]], findall(R,reverse_list([a,a,b],R),C), C == [[b,a,a]], findall(R,reverse_list([[a],b],R),D), D == [[b,[a]]].")).length === 1, "Reverse the outer list, retain duplicates, and do not add new nesting.");
        hints:
          - title: The list shape
            text: Compare the first incorrect accumulator with the first intended accumulator in the table.
          - title: An element or a tail
            text: The accumulated list should become the tail of the extended list, not its second element.
          - title: The next call
            text: Pass the input tail onward and prepend the current head to the accumulator using the list-tail pattern already taught.
      - description: A supplied accumulator stays at the end of the result.
        command: |
          assert((await __query("findall(R,reverse_into([], [z],R),A), A == [[z]], findall(R,reverse_into([a,b], [x,y],R),B), B == [[b,a,x,y]], \\+ reverse_into([a,b],[z],[b,a]).")).length === 1, "The base case returns the entire accumulator, including the suffix supplied by the caller.");
        hints:
          - title: The full contract
            text: The helper is more general than reversing from an empty accumulator.
          - title: What is already done
            text: When the remaining input is empty, all elements of the accumulator are already part of the answer.
          - title: A suffix test
            text: Trace two calls with a nonempty accumulator and check that none of its elements disappear or move ahead of the reversed input.
    quiz:
      title: Step 11 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
        - type: parsons
          difficulty: intermediate
          bloom: apply
          question: Arrange the states of the repaired `reverse_into([a,b], [z], R)` computation in execution order. Use only states/events that occur.
          lines:
            - 'Remaining = [a,b], Acc = [z]'
            - 'Remaining = [b], Acc = [a,z]'
            - 'Remaining = [], Acc = [b,a,z]'
            - 'The base case binds R = [b,a,z]'
          distractors:
            - 'Remaining = [b], Acc = [[a],z]'
            - 'The base case binds R = []'
          explanation: Each recursive call consumes one head and prepends it to the accumulator. Once Remaining is empty, the accumulated list becomes R.
        - type: single
          difficulty: intermediate
          bloom: analyze
          question: Why does unifying `Acc = [x|Acc]` not implement an ordinary accumulator update?
          options:
            - It asks one term to contain itself.
            - It assigns a fresh list to Acc.
            - It removes the old head from Acc.
          correct_index: 0
          option_feedback:
            1: Unification constrains a variable; it does not overwrite an existing binding as assignment would.
            2: The equation does not decompose and discard an old head.
          explanation: The same variable occurs on both sides. The intended algorithm instead passes a new list to a new recursive call. This tutorial uses finite lists and does not require reasoning about cyclic terms or an implementation's occurs check.
    solution:
      files:
        - path: prolog-v2/11-accumulator.pl
          language: prolog
          content: |
            reverse_list(Input, Output) :- reverse_into(Input, [], Output).
            reverse_into([], Acc, Acc).
            reverse_into([H|T], Acc, R) :- reverse_into(T, [H|Acc], R).
      explanation: |
        The bar uses Acc as a list tail. Each call has a fresh local Acc variable receiving that new term. The invariant is “Result equals the reversal of Remaining followed by Acc”; moving the next head to the front of Acc preserves it. At Remaining = [], Result is Acc. This reasoning also covers a caller-supplied suffix and nested elements.

  # Lecture: logic_palooza_v6_handouts.pdf pp. 47–49, 52–54 (patterns and recursion).
  # Assessment: [Final] F24 V1 (Public).pdf, Problem 7(C), p. 25, two-list interleaving.
  # Pedagogy: faded construction — independently choose terminal cases for a new two-input relation.
  - title: Uneven Interleaving
    key: v2-interleave
    instructions: |
      ### Why this matters

      A two-list recursion must account for either input ending first. Testing only equal-length inputs can hide a missing part of the specification.

      ### 🎯 You will learn to

      - Create a recursive relation from an input/output contract.
      - Evaluate terminal cases for missing suffixes and overlapping proofs.

      ### Your task

      Two people contribute a queue of songs. Define `weave(Left,Right,Out)` to alternate their items, beginning with Left, then append whichever input still has items. Both inputs are finite ground proper lists; Out is a result or a proposed result. Preserve nested elements and duplicates as individual elements.

      - `[a,b]` and `[x,y,z]` produce `[a,x,b,y,z]`.
      - `[a,b,c]` and `[x]` produce `[a,x,b,c]`.
      - An empty input contributes nothing; the other list remains intact.

      There must be **one proof of the answer** for these input modes, including when both inputs are empty. Before coding, partition the inputs by which lists are empty. Explain how your terminal cases avoid handling the both-empty input twice. Then decide how many elements a recursive step consumes and emits.

      Start from the contract and your earlier list-construction work; no completed recursive clause is supplied. Check a case in each partition before selecting **Test My Work**. If a test fails, first identify the missing case rather than changing every clause at once.

      This is a good stopping point for a study break. On return, reconstruct the terminal cases from memory before continuing to the final two challenges.
    default_query: weave([a,b], [x,y,z], Out)
    files:
      - path: prolog-v2/12-interleave.pl
        language: prolog
        content: |
          % weave(Left, Right, Out): alternate, then retain the longer suffix.
          % Left and Right are finite ground proper lists.
          % Define the relation from the contract.
    open_file: prolog-v2/12-interleave.pl
    run_file: prolog-v2/12-interleave.pl
    tests:
      - description: Empty-side cases keep the other list and both-empty has only one proof.
        command: |
          assert((await __query("findall(R,weave([],[],R),A), A == [[]], findall(R,weave([],[a,b],R),B), B == [[a,b]], findall(R,weave([a,b],[],R),C), C == [[a,b]].")).length === 1, "Check both empty, only Left empty, and only Right empty; the terminal cases must not duplicate an answer.");
        hints:
          - title: Three terminal observations
            text: Write the intended output for each combination in the test description before designing clauses.
          - title: Overlapping heads
            text: Two unconstrained empty-side clauses both match when the inputs are empty. Restrict one so its other input must be nonempty.
          - title: Separate the cases
            text: Use patterns for an empty Left, for a nonempty Left with empty Right, and for two nonempty inputs.
      - description: Both longer-side cases, equal lengths, repeated items, and nested items are preserved.
        command: |
          assert((await __query("findall(R,weave([a,b],[x,y,z],R),A), A == [[a,x,b,y,z]], findall(R,weave([a,b,c],[x],R),B), B == [[a,x,b,c]], findall(R,weave([a,b],[x,y],R),C), C == [[a,x,b,y]], findall(R,weave([a,a],[[b]],R),D), D == [[a,[b],a]].")).length === 1, "Alternate Left then Right while both exist; retain the complete remainder without flattening its elements.");
        hints:
          - title: One pair at a time
            text: Match a head and tail from each nonempty input.
          - title: The smaller problem
            text: The recursive call processes the two tails. Its output follows the current two heads.
          - title: A constructed prefix
            text: The output pattern needs two head positions followed by one tail variable, rather than a nested list holding the recursive answer.
    quiz:
      title: Step 12 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
        - type: multiple
          difficulty: intermediate
          bloom: analyze
          question: 'A candidate uses `weave([],R,R).` and `weave(L,[],L).` as its terminal clauses. Which observations follow? Select all that apply.'
          options:
            - '`weave([],[],Out)` has two successful proofs.'
            - 'Both proofs bind Out to the empty list.'
            - 'The second proof appends an extra element.'
          correct_indices: [0, 1]
          option_feedback:
            0: Both clause heads match the both-empty query, giving separate proofs.
            1: Each clause unifies the output with an empty input.
            2: Another proof repeats a binding; it does not mutate the result from the earlier proof.
          explanation: Identical bindings can arise from different proofs. Disjoint terminal patterns avoid duplicating this answer.
        - type: single
          difficulty: intermediate
          bloom: evaluate
          question: A solution passes every equal-length example but discards either input's unused suffix. Which pair is the best next test?
          options: ['`[a,b]` and `[x,y]`', '`[]` and `[]`', '`[a,b,c]` and `[x]`']
          correct_index: 2
          option_feedback:
            0: Both lists end together, so this does not expose a discarded suffix.
            1: There is no suffix to preserve in this case.
          explanation: The correct output is [a,x,b,c]. Losing b and c exposes the incomplete terminal behavior.
    solution:
      files:
        - path: prolog-v2/12-interleave.pl
          language: prolog
          content: |
            weave([], R, R).
            weave([H|T], [], [H|T]).
            weave([L|Ls], [R|Rs], [L,R|Out]) :- weave(Ls, Rs, Out).
      explanation: |
        The first terminal clause handles every empty-Left input, including both empty. The second requires nonempty Left, making it disjoint. The recursive clause removes one element from each input and reconstructs them in the specified order. All three input-shape cases are disjoint and cover every pair of proper lists.

  # Lecture: logic_palooza_v6_handouts.pdf pp. 16–19, 48–54 (ground negation, membership, list recursion).
  # Assessment: [Final] F23 (Public).pdf, Problem 8(c), p. 24, uniqueness by testing the suffix.
  # Pedagogy: independent transfer — contrast a new retention policy with adjacent-run removal.
  - title: Last Occurrences
    key: v2-last-occurrences
    instructions: |
      ### Why this matters

      Similar-looking list tasks need different decisions. Keeping the last occurrence of each item requires inspecting the unprocessed suffix, not just the next neighbor.

      ### 🎯 You will learn to

      - Create a list transformation that combines membership, ground negation, and recursion.
      - Distinguish adjacent-run removal from retention of last occurrences.

      ### A supplied building block

      The starter supplies `contains_once(Item,List)` for a ground Item and finite ground List. Its first clause matches the head; its second searches the tail only when that head differs. These cases are disjoint for ground atoms, so it checks membership with at most one proof. In this input mode, `not(contains_once(Item,List))` succeeds exactly when the item is absent.

      The guard is deliberate: an unrestricted membership relation can produce one proof per occurrence. Here we only need a yes/no check for an already known atom. This helper is not intended to enumerate the elements of a list with an unbound first argument. For your transformation, any proof order is acceptable; the distinct output lists must match the contract.

      ### Your task

      A search box logs terms in chronological order. Build its recent-search list by keeping the most recent entry for each term. Implement `keep_last(Input,Output)` for finite ground proper lists of atoms. Keep exactly the **last occurrence** of each atom, retaining the relative order of those last occurrences.

      Examples: `[a,b,a,c,b]` becomes `[a,c,b]`; `[a,b,a]` becomes `[b,a]`; `[a,a,a]` becomes `[a]`.

      Before running anything, draw a line through the non-last occurrences in the first example. Then decide whether its initial a belongs in the output. Use that same decision on each recursive suffix. Define the empty case and the two keep/drop cases yourself. You may use the supplied membership relation; do not sort, because sorting can change the required order.

      After your tests pass, explain why reusing `collapse/2` from step 10 does not solve this problem. Revisit the ground-input restriction from step 5: this task is not a promise that negation will enumerate missing values for unknown inputs.
    default_query: keep_last([a,b,a,c,b], Out)
    files:
      - path: prolog-v2/13-last-occurrences.pl
        language: prolog
        content: |
          contains_once(X, [X|_]).
          contains_once(X, [Y|T]) :- X \= Y, contains_once(X, T).

          % Define keep_last(Input, Output) for finite ground lists of atoms.
    open_file: prolog-v2/13-last-occurrences.pl
    run_file: prolog-v2/13-last-occurrences.pl
    tests:
      - description: Empty and repeated inputs keep the required last occurrences.
        command: |
          assert((await __query("findall(R,keep_last([],R),A), sort(A,AS), AS == [[]], findall(R,keep_last([a],R),B), sort(B,BS), BS == [[a]], findall(R,keep_last([a,a,a],R),C), sort(C,CS), CS == [[a]].")).length === 1, "Keep one last occurrence of repeated values and an empty result for empty input.");
        hints:
          - title: A decision about the head
            text: Ask whether the current head appears anywhere in the remaining tail.
          - title: Two complementary cases
            text: A head that appears later must be dropped; a head absent from the tail must be retained.
          - title: Reuse the smaller answer
            text: Both cases process the tail. Only the keep case places the current head in front of that recursive result.
      - description: Nonadjacent duplicates are removed while last-occurrence order is retained.
        command: |
          assert((await __query("findall(R,keep_last([a,b,a,c,b],R),A), sort(A,AS), AS == [[a,c,b]], findall(R,keep_last([a,b,a],R),B), sort(B,BS), BS == [[b,a]], findall(R,keep_last([c,a,b],R),C), sort(C,CS), CS == [[c,a,b]], \\+ keep_last([a,b,a],[a,b]).")).length === 1, "Keep the last occurrence, preserve its order, and reject extra output lists.");
        hints:
          - title: Last is different from first
            text: In [a,b,a], the first a disappears and the final a stays after b.
          - title: The suffix question
            text: Membership is tested against the remaining tail, not against the output built so far.
          - title: Preserve order
            text: Recursive construction can keep the selected elements in their original order; a global sort cannot establish this contract.
    quiz:
      title: Step 13 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
        - type: single
          difficulty: intermediate
          bloom: apply
          question: What is the required `keep_last` result for `[blue,red,blue,green,red]`?
          options: ['`[blue,green,red]`', '`[blue,red,green]`', '`[green,red,blue]`']
          correct_index: 0
          option_feedback:
            1: That retains first-occurrence order. The surviving red is after green.
            2: The surviving blue occurs before green; the result is not reversed or sorted.
          explanation: The last blue is at position 3, green at 4, and the last red at 5. Preserve that order.
        - type: single
          difficulty: intermediate
          bloom: analyze
          question: 'A learner tries `not(contains_once(X,[a,b]))` before binding X. Why is it unsuitable for generating atoms absent from the list?'
          options:
            - 'Negation finds a new atom outside the list.'
            - 'The inner goal can succeed, so negation fails.'
            - 'Negation returns every atom in reverse order.'
          correct_index: 1
          option_feedback:
            0: Negation as failure does not invent a complementary set of values.
            2: It tests whether a proof exists; it does not transform or enumerate a list.
          explanation: The inner membership goal succeeds for X = a, so its negation fails. Generate or bind the candidate before a ground absence test.
    solution:
      files:
        - path: prolog-v2/13-last-occurrences.pl
          language: prolog
          content: |
            contains_once(X, [X|_]).
            contains_once(X, [Y|T]) :- X \= Y, contains_once(X, T).
            keep_last([], []).
            keep_last([H|T], R) :- contains_once(H, T), keep_last(T, R).
            keep_last([H|T], [H|R]) :- not(contains_once(H, T)), keep_last(T, R).
      explanation: |
        Membership of H in the tail means this occurrence is not last, so discard it. Absence means this is its last occurrence, so retain it before the processed tail. The two decisions are complementary for the stated finite ground inputs. The supplied helper answers a ground membership test once, preventing repeated occurrences from multiplying identical recursive work. This exercise grades distinct outputs; the earlier proof-order exercises grade multiplicity where specified.

  # Lecture: logic_palooza_v6_handouts.pdf pp. 9–10, 16–23, 42–44, 48–54 (joins, negation, search and recursive list construction).
  # Assessment: [Final] S23 V1 (Public).pdf, Problem 5, p. 11 (recursive prerequisite relation); [Final] F24 V1 (Public).pdf, Problem 7(A–C), pp. 23–25 (trace and construct recursive relations).
  # Pedagogy: independent integration and delayed retrieval — a new contract, no implementation skeleton.
  - title: Open Route Challenge
    key: v2-open-route
    instructions: |
      ### Why this matters

      A longer exam problem combines skills that looked separate in practice. Here you must choose how a relation searches, filters, and builds an output list.

      ### 🎯 You will learn to

      - Create a recursive relation from a new contract using earlier lecture mechanisms.
      - Explain a successful proof and a rejected branch without running them first.

      ### Your task

      A campus event has directed connections `path(From,To)` and closed checkpoints `closed(Place)`. The supplied graph is finite and has no cycles.

      Define **`open_route(From,To,Stops)`**. The caller supplies From as a known open checkpoint; checking the starting checkpoint is outside this contract. The relation should discover every route of **one or more edges** that enters only open checkpoints. Stops lists the places entered, in travel order, including To but excluding From. To and Stops may be unknown or proposed answers. Any answer order is acceptable; every distinct valid route must be discoverable.

      Keep the supplied facts unchanged. Use the mechanisms already practiced: unification, joined goals, ground negation after finding a checkpoint, recursion, and list construction. No graph library, visited-set algorithm, cut, or new language feature is required.

      Before coding, list the routes from gate to exit on paper. Cross out routes that enter stage. Write one successful sequence of pending goals and identify exactly where the rejected branch fails. This explanation is for your self-check; the automatic tests inspect your relation's answers.

      Implement the relation from the contract. Try a direct route, a longer route, an unreachable destination, and a terminal starting place. If the editor reports an inference limit, your search is unfinished; it is not evidence that the query is false. Inspect whether each call follows an edge toward the end of the acyclic graph.

      ### After the independent attempt

      Use the graduated hints only after writing a first attempt. Once the checks pass, explain how your terminal case differs from the recursive case and why closed checkpoints are tested after their names are bound. The model solution is available through the existing instructor reveal.

      For a later study session, reconstruct one list relation from steps 10–13 with no editor hints, then try a full past-paper question. These exercises practice component and integration skills; passing them does not guarantee performance under exam conditions. The separate [Prolog Lists and Search tutorial](/SEBook/tools/prolog-search-tutorial) offers optional broader practice, including topics beyond this lecture-bounded path.
    default_query: open_route(gate, exit, Stops)
    files:
      - path: prolog-v2/14-open-route.pl
        language: prolog
        content: |
          path(gate, cafe).
          path(gate, stage).
          path(gate, gallery).
          path(cafe, garden).
          path(stage, garden).
          path(gallery, garden).
          path(garden, exit).
          closed(stage).

          % Define open_route(From, To, Stops) from the task contract.
    open_file: prolog-v2/14-open-route.pl
    run_file: prolog-v2/14-open-route.pl
    tests:
      - description: Both open routes to exit are discoverable in their travel order.
        command: |
          assert((await __query("findall(R,open_route(gate,exit,R),A), sort(A,AS), AS == [[cafe,garden,exit],[gallery,garden,exit]], open_route(cafe,garden,[garden]).")).length >= 1, "Retain both open branches; Stops includes entered checkpoints in order and excludes the starting point.");
        hints:
          - title: One edge or more
            text: Separate a direct path to the destination from a route with a remaining suffix.
          - title: The intermediate place
            text: A recursive route joins a first edge to a smaller route starting at the checkpoint that edge reaches.
          - title: The output prefix
            text: The first entered checkpoint is the head of Stops; the recursive route supplies its tail.
      - description: Unknown destinations enumerate every valid nonempty route and no closed branch.
        command: |
          assert((await __query("findall(pair(T,R),open_route(gate,T,R),A), sort(A,AS), AS == [pair(cafe,[cafe]),pair(exit,[cafe,garden,exit]),pair(exit,[gallery,garden,exit]),pair(gallery,[gallery]),pair(garden,[cafe,garden]),pair(garden,[gallery,garden])].")).length === 1, "Return direct and longer routes, allow To to be discovered, and exclude routes through stage.");
        hints:
          - title: Candidate before absence
            text: The next checkpoint comes from a path fact before its closure status can be tested.
          - title: A destination is also entered
            text: Both direct and recursive cases must exclude a closed next checkpoint.
          - title: A relation, not a single answer
            text: Leave destinations and route tails available for unification; do not commit to only the first matching path.
      - description: Empty, unreachable, and closed routes fail rather than inventing an answer.
        command: |
          assert((await __query("\\+ open_route(gate,stage,_), \\+ open_route(gate,gate,_), \\+ open_route(exit,_,_), \\+ open_route(gate,exit,[stage,garden,exit]), \\+ open_route(gate,exit,[cafe,exit]).")).length === 1, "A route uses at least one real edge, visits only open places, and includes every entered checkpoint.");
        hints:
          - title: The route's minimum size
            text: A zero-edge identity answer is outside this contract.
          - title: Evidence for every move
            text: Every new place in the output needs a corresponding path fact from the preceding place.
          - title: A terminal start
            text: With no outgoing edge, neither a direct route nor the first step of a longer route can be proved.
    quiz:
      title: Step 14 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
        - type: parsons
          difficulty: advanced
          bloom: analyze
          question: |
            For the displayed program, arrange events up to the first answer to `pick(X)`. Use only events that occur.

            ```prolog
            candidate(a).
            candidate(b).
            blocked(a).
            pick(X) :- candidate(X), not(blocked(X)).
            ```
          lines:
            - 'candidate(X) first binds X = a'
            - 'blocked(a) succeeds, so not(blocked(a)) fails'
            - 'Backtracking removes X = a and resumes candidate(X)'
            - 'candidate(X) next binds X = b'
            - 'blocked(b) finitely fails, so pick(X) returns X = b'
          distractors:
            - 'The original X = a remains while candidate(X) tries b'
            - 'not(blocked(X)) invents the atom b'
          explanation: Candidate generation supplies ground values. A rejected branch releases its binding before the next candidate is tried; finite failure of blocked(b) then permits b.
        - type: multiple
          difficulty: intermediate
          bloom: evaluate
          question: Which statements justify the termination argument for the supplied open-route task? Select all that apply.
          options:
            - 'The graph is finite and acyclic.'
            - 'Every recursive call follows an outgoing edge.'
            - 'Every Prolog recursion terminates on finite facts.'
          correct_indices: [0, 1]
          option_feedback:
            0: A finite acyclic graph bounds the length of paths that keep moving forward.
            1: This progress condition connects each recursive call to that finite path bound.
            2: Recursion can revisit the same goal before consuming an edge, or loop around a cycle.
          explanation: Termination depends on the particular recursive progress and input assumptions, not merely on the number of facts.
    solution:
      files:
        - path: prolog-v2/14-open-route.pl
          language: prolog
          content: |
            path(gate, cafe).
            path(gate, stage).
            path(gate, gallery).
            path(cafe, garden).
            path(stage, garden).
            path(gallery, garden).
            path(garden, exit).
            closed(stage).

            open_route(A, B, [B]) :- path(A, B), not(closed(B)).
            open_route(A, B, [M|Rest]) :-
                path(A, M), not(closed(M)), open_route(M, B, Rest).
      explanation: |
        The direct case contributes one entered checkpoint. The recursive case finds an open next checkpoint M and prepends it to a route beginning at M. Each path goal binds the checkpoint before the absence test. On the supplied acyclic graph, following an edge cannot revisit an earlier checkpoint indefinitely. From gate, the two routes to exit go through cafe or gallery and then garden; the stage branch fails at its closure test. Other clause arrangements and helpers are acceptable when they produce the same distinct valid routes under the stated input assumptions.
