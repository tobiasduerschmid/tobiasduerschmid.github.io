# Course-aligned adaptation. Source wording is a style reference, not a set of instructions.
# See docs/prolog-course-alignment.md for provenance, scope, and corrected source simplifications.
title: Prolog Foundations
description: 'For programmers new to Prolog: build and trace facts, rules, unification, backtracking,
  and recursive list relations. A CS 131 practice path in eight steps, about 75–100 minutes.'
learning_objectives:
- Apply facts and compound terms to model relationships and query them in several directions.
- Analyze unification, repeated variables, arity, and anonymous variables.
- Create rules that join relationships through shared variables.
- Trace resolution and backtracking to predict answer order and duplicate proofs.
- Evaluate recursive goal order and explain termination on finite acyclic inputs.
- Create recursive list relations and compose them in a small recommendation program.
backend: prolog
require_tests: true
autosave_type: files
steps:
  # Pedagogy: PRIMM — predict a reverse query, run a worked fact, then modify the database. Sources: Logic-palooza handout pp. 2–20; Homework LOGIC2 A–B.
  - title: Facts and Queries
    instructions: |
      ### Why this matters

      Suppose we have a family database. We could write a different function for “find children” and “find parents,” or describe the parent relationship once and ask it different questions. Prolog lets us do the latter.

      ### 🎯 You will learn to

      - Apply facts to record a relationship with a precise argument order.
      - Analyze the bindings returned by forward and reverse queries.

      ### The big picture

      This is the first of two tutorials based on the CS 131 logic-programming lectures, homework, quizzes, and past finals. Allow **75–100 minutes** for these eight steps. You should know variables, function calls, and basic recursion in one language; no Prolog or installation is needed.

      A **knowledge base** contains facts and rules. A **query** asks the inference engine to prove a goal using that knowledge base. Here is one fact:

      ```prolog
      parent(tom, bob).
      ```

      Here we define it to mean Tom is a parent of Bob. Prolog does not supply that English meaning; we document the argument order and use it consistently. `parent(bob, tom)` asks a different question. The period ends a clause; `%` starts a comment.

      `tom` and `bob` are **atoms**: names for specific things. A name beginning with an uppercase letter, such as `Child`, is a **variable** whose value Prolog can discover.

      ### Thinking time

      With the starter's single fact, predict `parent(Who, bob)`: does it find `Who = tom`, fail, or complain that `Who` has no value? Write a prediction and one reason in a `%` comment before running it.

      Enter the goal in **Query ?-**, then select **Run**. Type the goal itself; the prompt is already supplied. A final period is optional here. This workspace requests successive answers for you; it does not require the semicolon key used by some Prolog consoles.

      <details>
      <summary>After running: compare your prediction</summary>

      The answer is `Who = tom`: matching the second argument let Prolog discover the first. A variable can be a place for an answer, so it need not already have a value.

      </details>

      Facts are tried from top to bottom. With several matching facts, this workspace displays each answer in that order. A successful query with no variables reports `true`; if its search finishes without a proof, it reports `false`.

      Try `parent(ann,tom)` before adding any facts. Failure means this database cannot prove the relationship, not that it has settled who Ann's parents are in the real world. This is the **closed-world assumption** applied to this program's knowledge.

      ### Your task

      Keep the existing fact. Extend the database to say that **Bob is a parent of Ann and of Pat**, with no other parent relationships. Then investigate `parent(bob, Child)`, `parent(Parent, ann)`, and `parent(Parent, Child)`. Explain why one database answers all three.

      Use **Test My Work** to check the task. Hints provide increasing help; the knowledge check follows **Next**. Mistakes are useful evidence: compare the relationship you intended with the one your arguments actually describe.

      The course uses SWI-Prolog. This workspace uses Tau Prolog and supports the course features exercised here; implementation-specific extensions and error wording can differ. Program text runs in a browser worker.
    default_query: parent(tom, X)
    files:
    - path: family.pl
      language: prolog
      content: |
        % parent(Parent, Child): Parent is a parent of Child.
        parent(tom, bob).

        % Add the two relationships described in the task.
    open_file: family.pl
    run_file: family.pl
    tests:
    - description: The database contains exactly the three specified parent relationships.
      command: |
        assert((await __query("findall(pair(P,C), parent(P,C), Pairs), sort(Pairs, Sorted), Sorted == [pair(bob,ann),pair(bob,pat),pair(tom,bob)].")).length === 1, "The database contains exactly the three specified parent relationships.");
      hints:
      - title: Direction matters
        text: Read each fact as “the first person is a parent of the second.”
      - title: Two new relationships
        text: Keep Tom’s relationship and add one fact for each of Bob’s children.
      - title: The fact shape
        text: Use parent(ParentName, ChildName). with lowercase names and a final period; choose each argument
          from the task.
    quiz:
      title: Step 1 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
      - type: single
        difficulty: intermediate
        question: |
          With `likes(ren, tacos).` and `likes(mia, tacos).`, what does `likes(Person, tacos)` discover?
        options:
        - Only `Person = ren`
        - '`ren`, then `mia`'
        - '`Person = tacos`'
        correct_index: 1
        option_feedback:
          0: The first matching fact does not rule out later matches. The workspace keeps asking for answers.
          2: The variable occupies the first argument. The second argument is already fixed to tacos.
        explanation: |
          Each fact provides a proof. The workspace asks for successive proofs and shows the corresponding binding.
      - type: single
        difficulty: basic
        question: |
          The only known fact about Ren is `outgoing(ren).` The query `outgoing(mia)` fails. What has been established?
        options:
        - Mia is not outgoing in the real world.
        - Mia needs a variable declaration.
        - This database cannot prove the goal.
        correct_index: 2
        option_feedback:
          0: The knowledge base may be incomplete. Failure reports what can be proved from this program.
          1: Lowercase mia is an atom, so no variable declaration is involved.
        explanation: |
          Under the closed-world assumption, a terminating unsuccessful search is treated as failure. Missing knowledge does not establish a fact about the real world.
    solution:
      files:
      - path: family.pl
        language: prolog
        content: |
          parent(tom, bob).
          parent(bob, ann).
          parent(bob, pat).
      explanation: |
        Each parent fact describes one ordered pair. Querying either argument with a variable changes the question, not the database. Enumerating all pairs checks that the two new facts did not accidentally reverse their arguments or describe extra relationships.
  # Pedagogy: Variation Theory — contrast repeated and anonymous variables; fade a nested pattern example. Sources: Logic-palooza handout pp. 24–41, 47; Homework LOGIC4; Quiz 4 Q4a.
  - title: Terms and Unification
    instructions: |
      ### Why this matters

      A query can match an entire structured value, not just a name. Once you can track that matching, nested data and repeated variables stop looking like special cases.

      ### 🎯 You will learn to

      - Analyze unification of compound terms and repeated variables.
      - Apply anonymous variables when individual names do not need to agree.

      ### Names, structures, and mappings

      A **term** can be an atom, a number, a variable, or a compound such as `pet(dog, koda)`. A compound has a **functor** (`pet`) and an **arity** (two arguments). `pet/2` names that functor and arity; `pet/3` has a different shape. A nested term might be `owns(carey, pet(dog, koda))`.

      **Unification** asks whether two terms can be made identical by consistently binding variables. In the Query field, try:

      ```prolog
      owns(carey, pet(dog, koda)) = owns(Person, pet(Kind, Name))
      ```

      The mappings are `Person = carey`, `Kind = dog`, and `Name = koda`. No arithmetic or function call happens inside these terms.

      An uppercase name or a name beginning with `_` is a variable. Lowercase `x` is an atom. Repeated occurrences of `X` in one clause share a binding. Each plain `_` is a fresh anonymous variable; two occurrences of `_Name` still share one variable. Variables in separate clauses are independent.

      ### Thinking time

      Predict these two queries separately: `pair(X,X) = pair(dog,cat)` and `pair(_,_) = pair(dog,cat)`. Which can succeed? Record the bindings that would be required, then run both.

      <details>
      <summary>After running: compare repeated and anonymous variables</summary>

      The repeated `X` would have to equal two different atoms, so the first goal fails. Each `_` is independent, allowing the second goal to succeed without reporting a named binding.

      </details>

      ### Your task

      The worked fact `pet_name(pet(_, Name), Name).` extracts a name while ignoring the species. A fact with variables describes every instance of its pattern.

      Define **`same_species(Pet1, Pet2)`**. A pattern fact is sufficient; derive its structure from the worked example. It should relate two `pet(Species, Name)` terms exactly when their species unify; their names may differ. It must work when a species is unknown, too. Do not enumerate individual dogs and cats.

      Try matching two dogs with different names, a dog and a cat, and `same_species(pet(Kind, ada), pet(cat, max))`. Explain which positions must share a variable and which can vary independently.
    default_query: pet_name(pet(dog, koda), Name)
    files:
    - path: /tutorial/terms.pl
      language: prolog
      content: |
        % Worked example: ignore the species, expose the name.
        pet_name(pet(_, Name), Name).

        % Define a pattern relating two pets of the same species.
    open_file: /tutorial/terms.pl
    run_file: /tutorial/terms.pl
    tests:
    - description: Matching species succeed with different names; different species fail.
      command: |
        assert((await __query("same_species(pet(dog,ada),pet(dog,max)), same_species(pet(cat,ada),pet(cat,ada)), \\+ same_species(pet(dog,ada),pet(cat,ada)), \\+ same_species(dog,pet(dog,max)), \\+ same_species(pet(dog,ada),pet(dog)).")).length > 0, "Matching species succeed with different names; different species fail.");
      hints:
      - title: The changing feature
        text: Two pets may have different names and still have the same species.
      - title: A shared position
        text: Use the same named variable in the two species positions, and independent variables in the
          name positions.
      - title: A nested pattern
        text: The outer fact has two pet(..., ...) arguments. Make only the species slots share a name.
    - description: The pattern discovers species in both directions and accepts new species.
      command: |
        assert((await __query("findall(K, same_species(pet(K,ada),pet(fox,max)), A), sort(A,AS), AS == [fox], findall(K, same_species(pet(owl,ada),pet(K,max)), B), sort(B,BS), BS == [owl].")).length === 1, "The pattern discovers species in both directions and accepts new species.");
      hints:
      - title: A relation can discover
        text: An unknown species should be bound by the other pet.
      - title: Keep the rule general
        text: A fact listing only dog and cat cannot answer questions about a fox or an owl.
      - title: Matching does the work
        text: Use variables inside the two pet terms instead of a fixed species or an identity comparison.
    quiz:
      title: Step 2 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
      - type: single
        difficulty: intermediate
        question: |
          What happens when `color(X,X)` is unified with `color(red,blue)`?
        options:
        - It succeeds with `X = blue`.
        - It fails when the bindings conflict.
        - It returns both atoms as answers.
        correct_index: 1
        option_feedback:
          0: Unification does not overwrite an existing binding.
          2: These are simultaneous requirements, not alternative proofs.
        explanation: |
          The first position requires X to be red, while the second requires the same X to be blue. One variable cannot satisfy both requirements within the same attempted match.
      - type: single
        difficulty: intermediate
        question: |
          Which pair can unify?
        options:
        - '`pet(dog,koda)` and `pet(dog)`'
        - '`pet(dog,koda)` and `owns(dog,koda)`'
        - '`pet(dog,koda)` and `pet(Kind,Name)`'
        correct_index: 2
        option_feedback:
          0: 'The number of arguments differs: pet/2 and pet/1 have different shapes.'
          1: Equal arguments do not compensate for different functor names.
        explanation: |
          Matching compound terms require the same functor and arity, followed by compatible arguments.
    solution:
      files:
      - path: /tutorial/terms.pl
        language: prolog
        content: |
          pet_name(pet(_, Name), Name).
          same_species(pet(Species, _), pet(Species, _)).
      explanation: |
        The repeated Species variable enforces the shared structure, while each `_` is independent. Unification can bind the species from either side. A ground dog/cat counterexample checks the restriction; queries with unknown and unfamiliar species check that this is a general pattern rather than a list of examples.
  # Pedagogy: Worked example with fading — derive two-link relationships after studying one-link rules. Sources: Logic-palooza handout pp. 7–15; Homework LOGIC2 B–LOGIC3; S23 final solutions Q5 pp. 11–12.
  - title: Rules and Shared Variables
    instructions: |
      ### Why this matters

      Facts give us individual relationships. Rules let us derive new relationships without recording every case by hand, and shared variables specify how those facts connect.

      ### 🎯 You will learn to

      - Apply conjunction to connect two relationships through one intermediate value.
      - Analyze the difference between a rule body and alternative clauses.

      ### From facts to rules

      Consider this worked rule:

      ```prolog
      has_child(Person) :- parent(Person, Child).
      ```

      Read `:-` as **“if”**: Person has a child if a matching parent fact exists. The part before `:-` is the **head**; the part after it is the **body**. The body contains goals to prove. The variable `Child` need not appear in the head: finding some matching child is enough.

      A comma means **and**, with goals tried left to right. The same variable name connects occurrences within the clause. The engine gives variables fresh identities each time it tries a clause, so separate calls do not share a hidden global `Child`.

      Separate clauses offer alternatives. These say someone can play if they like chess **or** they like go:

      ```prolog
      can_play(Person) :- likes(Person, chess).
      can_play(Person) :- likes(Person, go).
      ```

      A semicolon also expresses alternatives inside a body: `(likes(Person,chess); likes(Person,go))`. Parentheses make the grouping clear. Someone satisfying both alternatives can have two proofs; Prolog does not automatically remove duplicates.

      ### Thinking time

      The starter defines `has_child/1`. Predict whether `has_child(Person)` will report Bob once or twice. Run it, then connect each reported binding to the parent fact that proves it.

      ### Your task

      Define **`grandparent(Grandparent, Grandchild)`** using `parent/2`. The person connecting the two parent relationships must be the same person. A grandparent is **exactly two parent links away**, not any ancestor.

      The starter's `fail` goal always fails; it is a placeholder to replace. Keep the supplied facts. Try `grandparent(tom, Who)` and the reverse query `grandparent(Who, ann)`. Before testing, explain why Tom should not be his own grandparent and why Bob should not count as Tom's grandchild.
    default_query: has_child(Person)
    files:
    - path: /tutorial/rules.pl
      language: prolog
      content: |
        parent(tom, bob).
        parent(bob, ann).
        parent(bob, pat).
        parent(ann, lena).

        has_child(Person) :- parent(Person, Child).

        grandparent(Grandparent, Grandchild) :- fail.
    open_file: /tutorial/rules.pl
    run_file: /tutorial/rules.pl
    tests:
    - description: Grandparent relates exactly the people two parent links apart, in either direction.
      command: |
        assert((await __query("findall(pair(G,C), grandparent(G,C), Pairs), sort(Pairs,S), S == [pair(bob,lena),pair(tom,ann),pair(tom,pat)].")).length === 1, "Grandparent relates exactly the people two parent links apart, in either direction.");
      hints:
      - title: Two links, one person
        text: Name the parent between the grandparent and grandchild.
      - title: The join matters
        text: The second argument of the first parent relationship must also be the first argument of the
          second relationship.
      - title: Two body goals
        text: Use two parent/2 goals separated by a comma. The head supplies the two endpoints; one new
          variable joins them.
    - description: Ground and reverse queries prove exactly the same two-link relationship.
      command: |
        assert((await __query("findall(C,grandparent(tom,C),A), sort(A,AS), AS == [ann,pat], findall(G,grandparent(G,lena),B), sort(B,BS), BS == [bob], once(grandparent(tom,ann)), \\+ grandparent(tom,bob), \\+ grandparent(tom,lena), \\+ grandparent(ann,tom).")).length === 1, "Ground and reverse queries prove exactly the same two-link relationship.");
      hints:
      - title: The same relationship
        text: Knowing one endpoint or both endpoints should only narrow the answers.
      - title: Exactly two links
        text: Tom is Bob's parent and Lena's ancestor, but neither pair is a grandparent pair.
      - title: Shared endpoints
        text: Connect the endpoints from the head through one intermediate variable, letting unification use any supplied values.
    quiz:
      title: Step 3 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
      - type: single
        difficulty: intermediate
        question: |
          For `grandparent(G,C) :- parent(G,P), parent(P,C).`, what is the role of `P`?
        options:
        - An intermediate person shared by both goals
        - A global variable kept for the next query
        - A second answer returned independently of C
        correct_index: 0
        option_feedback:
          1: Rule variables are local to an attempted clause use, not global state.
          2: The body must prove both goals with the same P. They do not produce independent final answers.
        explanation: |
          P joins the two parent links. Each attempted use of the rule gets its own fresh variables.
      - type: single
        difficulty: intermediate
        question: |
          A person likes both chess and go. With the two `can_play/1` clauses above, how many proofs does that person have?
        options:
        - 'One: later clauses are skipped after success.'
        - 'Two: either clause can prove the goal.'
        - 'Zero: “or” excludes people who like both.'
        correct_index: 1
        option_feedback:
          0: Finding one proof does not discard remaining alternatives.
          2: 'These alternatives are inclusive: both may succeed.'
        explanation: |
          Alternative clauses give independent ways to prove the same goal. Both are available during backtracking.
    solution:
      files:
      - path: /tutorial/rules.pl
        language: prolog
        content: |
          parent(tom, bob).
          parent(bob, ann).
          parent(bob, pat).
          parent(ann, lena).

          has_child(Person) :- parent(Person, Child).

          grandparent(Grandparent, Grandchild) :-
              parent(Grandparent, Parent),
              parent(Parent, Grandchild).
      explanation: |
        The Parent variable joins the two relationships, so it must occur in both body goals. Using two unrelated variables would combine any two parent facts. Using only one link would describe a parent, and arbitrary recursion would describe an ancestor rather than exactly a grandparent.
  # Pedagogy: PRIMM — predict, diagnose a direction bug, trace all proofs including duplicates. Sources: Quiz 4 Q4; Logic-palooza handout pp. 20–42; F23 final solutions Prolog part b p. 29.
  - title: Resolution and Backtracking
    instructions: |
      ### Why this matters

      A relation can have the right possible answers and still surprise you about which answer appears first. Following the pending goals and variable mappings explains the course's execution-tracing questions.

      ### 🎯 You will learn to

      - Analyze clause order, goal order, and binding rollback during resolution.
      - Repair a relation and predict its complete ordered answer sequence.

      ### How a proof is built

      **Resolution** repeatedly takes the leftmost pending goal, tries clauses from top to bottom, and unifies the goal with a clause head. A matching fact discharges that goal. A matching rule replaces it with its body goals, ahead of the remaining work. No pending goals means one complete proof.

      On failure, Prolog **backtracks** to the most recent available alternative and undoes bindings made since that choice. A clause that does not unify is skipped; it does not end the whole search. This is depth-first search through possible proofs.

      For example, suppose `parent(tom,bob)`, `parent(tom,mia)`, and `parent(mia,ren)` are the only facts. In `parent(tom,P), parent(P,C)`, the first goal initially binds `P = bob`. If Bob has no child, the second goal fails. Prolog returns to the first goal, tries `P = mia`, and then discovers `C = ren`. The failed attempt's Bob binding does not stick.

      ### Thinking time

      Read the directed `link/2` facts. On paper, find every place reachable from `a` by **exactly two links**. Work through each possible intermediate place in fact order. Is `d` reached once or twice?

      Run the starter's `two_hops(a, End)`. Its second goal follows the final link in the wrong direction. A mismatch between your prediction and the output is the bug to diagnose.

      ### Your task

      Repair **`two_hops(Start, End)`**. Keep the facts in their given order and search the first link before the second link. Report **one answer for each two-link proof**, including duplicates; do not sort or remove duplicates.

      A direct `a`-to-`b` link does not qualify as a two-link route. Compare your repaired program with the trace below after writing your prediction.

      <details>
      <summary>After your repair: the complete two-link trace</summary>

      The query from `a` reports **`d`, `e`, `d`**, in that order. The intermediate `b` leads to `d` and `e`; then the intermediate `c` leads to `d` again. Both proofs ending at `d` count.

      </details>

      Finally, swap the two body goals temporarily and predict whether the answer sequence changes. If it stays the same, compare the intermediate choices: could the arrangement of these facts explain that coincidence? Restore the specified goal order before testing. Goal order is an execution decision even when the finite relation has the same possible endpoint pairs.
    default_query: two_hops(a, End)
    files:
    - path: /tutorial/search-order.pl
      language: prolog
      content: |
        link(a, b).
        link(a, c).
        link(b, d).
        link(b, e).
        link(c, d).
        link(d, f).

        % Intended: a directed path of exactly two links.
        two_hops(Start, End) :-
            link(Start, Middle),
            link(End, Middle).
    open_file: /tutorial/search-order.pl
    run_file: /tutorial/search-order.pl
    tests:
    - description: Two-link answers from a are d, e, d, preserving proof order and duplicates.
      command: |
        assert((await __query("findall(E, two_hops(a,E), Answers), Answers == [d,e,d].")).length === 1, "Two-link answers from a are d, e, d, preserving proof order and duplicates.");
      hints:
      - title: Follow an arrow
        text: Read link(X,Y) as a link going from X to Y.
      - title: The second starting point
        text: After finding the intermediate place, the second link must start there.
      - title: Two linked positions
        text: Start belongs in the first goal’s first slot; End belongs in the second goal’s second slot.
          Connect the remaining slots.
    - description: The repaired relation also handles other starts and reverse queries.
      command: |
        assert((await __query("findall(E, two_hops(b,E), A), A == [f], findall(S, two_hops(S,f), B), B == [b,c], \\+ two_hops(f,_), \\+ two_hops(a,b).")).length === 1, "The repaired relation also handles other starts and reverse queries.");
      hints:
      - title: Beyond the first example
        text: The same rule should connect b through d to f.
      - title: Keep endpoints variable
        text: Do not hard-code a or an expected answer in the rule.
      - title: A local connection
        text: Use the same intermediate variable in both goals, leaving the two endpoint variables from
          the head unchanged.
    quiz:
      title: Step 4 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
      - type: single
        difficulty: intermediate
        question: |
          A later goal fails after an earlier goal bound `Place = cafe`. Another earlier choice could bind it to park. What does backtracking do?
        options:
        - It preserves cafe and skips the later goal.
        - It overwrites every variable in the program.
        - It undoes that choice and tries park.
        correct_index: 2
        option_feedback:
          0: A failed required goal cannot simply be skipped.
          1: Only bindings made along the abandoned branch are undone.
        explanation: |
          Backtracking restores the bindings and pending work associated with the choice point, then explores an alternative.
      - type: single
        difficulty: intermediate
        question: |
          Given two different successful proofs with the same final binding, what does ordinary answer enumeration show?
        options:
        - Both proofs, with a repeated binding
        - Only one proof, because answers form a set
        - An error, because bindings must be unique
        correct_index: 0
        option_feedback:
          1: A set is a separate abstraction; ordinary query enumeration does not deduplicate.
          2: Different proof paths may legitimately produce the same binding.
        explanation: |
          Prolog enumerates proofs. Duplicate bindings remain unless the program deliberately collects or filters them.
    solution:
      files:
      - path: /tutorial/search-order.pl
        language: prolog
        content: |
          link(a, b).
          link(a, c).
          link(b, d).
          link(b, e).
          link(c, d).
          link(d, f).

          two_hops(Start, End) :-
              link(Start, Middle),
              link(Middle, End).
      explanation: |
        From a, the first link chooses b. The second link then chooses d and e before the first link advances to c, whose outgoing link reaches d again. From b and c, the intermediate d leads to f. Keeping a shared intermediate variable and the intended direction makes the rule work for these other modes too.
  # Pedagogy: Mistake-based familiarization — correct a terminating-search defect; retrieve Step 1 querying. Sources: Logic-palooza handout pp. 13–14, 43–44; Homework LOGIC6; S23 final Q5.
  - title: Recursive Relations and Termination
    instructions: |
      ### Why this matters

      “Exactly two links” is useful for grandparents. “Any positive number of links” needs recursion, and in Prolog the order of recursive work can decide whether the search ever finishes.

      ### 🎯 You will learn to

      - Apply a base case and recursive case to define ancestry.
      - Evaluate whether recursive goals make progress before calling themselves.

      ### One link or more links

      An ancestor is either a direct parent, or a parent of somebody who is an ancestor. Those are two alternative clauses. For this exercise, the family is finite and has no cycles; **a person is not their own ancestor**.

      The direct-parent case is already written. In the recursive case, consuming one parent link before recurring moves the search down this finite family. The starter instead recurs on the same unconstrained starting person before consuming that link.

      ### Thinking time

      Predict `ancestor(tom, Person)` in the starter: no answers, some answers followed by unfinished search, or all answers followed by normal completion? Explain which recursive subgoal fails to make progress.

      Run it. The workspace bounds search so an unfinished proof search reports a limit instead of requiring an endless wait. **Stop** also cancels a running program. A limit is not the same as `false`: the search has not finished establishing whether more answers exist.

      The direct clause can produce answers before the bad recursive branch keeps expanding. Seeing a correct early answer does not establish termination.

      ### Your task

      Repair **`ancestor/2`** so that a parent goal constrains the intermediate person before recursion. Keep the direct-parent clause first and the supplied facts unchanged. It must find every ancestor–descendant pair reachable by one or more links and terminate on this family, including when there is no match.

      Predict the complete answers for `ancestor(tom, Person)`, keeping the direct-parent clause first and exploring parent facts in their given order.

      <details>
      <summary>After your repair: the complete ancestry trace</summary>

      The answers are **`bob`, `ann`, `pat`, `lena`**, in that order. In a version that chooses a child and then finds that child's descendants, the recursive call for Bob tries its direct-parent clause for both children before descending again. The output follows the proof clauses, not a generic family-tree traversal.

      </details>

      Then try `ancestor(Person, lena)` and `ancestor(pat, Person)`. Explain why “move the recursive clause last” alone would not fix a body that recurs before making progress. With cyclic facts, even the repaired rule would need additional cycle handling.
    default_query: ancestor(tom, Person)
    files:
    - path: /tutorial/ancestors.pl
      language: prolog
      content: |
        parent(tom, bob).
        parent(bob, ann).
        parent(bob, pat).
        parent(ann, lena).

        ancestor(X, Z) :- parent(X, Z).
        ancestor(X, Z) :- ancestor(X, Y), parent(Y, Z).
    open_file: /tutorial/ancestors.pl
    run_file: /tutorial/ancestors.pl
    tests:
    - description: All and only ancestor pairs are found, including deeper descendants.
      command: |
        assert((await __query("findall(pair(A,D), ancestor(A,D), P), sort(P,S), S == [pair(ann,lena),pair(bob,ann),pair(bob,lena),pair(bob,pat),pair(tom,ann),pair(tom,bob),pair(tom,lena),pair(tom,pat)].")).length === 1, "All and only ancestor pairs are found, including deeper descendants.");
      hints:
      - title: The shrinking problem
        text: Name the link that moves the current ancestor one generation closer to a descendant.
      - title: Progress before recursion
        text: Use a parent goal to constrain the intermediate person before asking the recursive ancestry question.
      - title: Two clause roles
        text: Keep the one-link clause. In the other clause, arrange parent(..., Intermediate) before ancestor(Intermediate,
          ...).
    - description: Answer order follows the specified clauses, and a leaf query terminates.
      command: |
        assert((await __query("findall(P, ancestor(tom,P), A), A == [bob,ann,pat,lena], findall(P,ancestor(P,lena),B), sort(B,BS), BS == [ann,bob,tom], once(ancestor(tom,lena)), \\+ ancestor(tom,tom), \\+ ancestor(lena,tom), \\+ ancestor(pat,_).")).length === 1, "Answer order follows the specified clauses, and a leaf query terminates.");
      hints:
      - title: Early success is incomplete evidence
        text: Request the whole answer sequence, not just its first answer.
      - title: Two different orders
        text: Both clause order and goal order matter. The direct-parent clause should stay before the recursive
          clause.
      - title: The call that changes
        text: Connect the recursive goal to the intermediate person found by the preceding parent goal; do not repeat the original unconstrained question.
    quiz:
      title: Step 5 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
      - type: single
        difficulty: advanced
        question: |
          Why can the starter return an answer and still fail to finish?
        options:
        - Every answer permanently binds all rule variables.
        - A base proof succeeds before a recursive branch diverges.
        - Prolog refuses to report failure after any success.
        correct_index: 1
        option_feedback:
          0: Variables are fresh for each attempted use of a rule.
          2: A finite successful search can finish normally after all alternatives are exhausted.
        explanation: |
          A depth-first search can encounter complete proofs before it reaches an infinitely expanding branch. Later answers may be inaccessible behind that branch.
      - type: single
        difficulty: basic
        question: |
          Recall the first step: the database has `parent(tom,bob).` What does `parent(Person,bob)` ask?
        options:
        - Who is a parent of Bob?
        - Who is a child of Bob?
        - Whether Person was declared earlier
        correct_index: 0
        option_feedback:
          1: Children of Bob would place bob in the first slot.
          2: Prolog discovers a variable’s binding while proving a query.
        explanation: |
          Argument order defines the relation. A variable in the first slot asks for parents of the known child.
    solution:
      files:
      - path: /tutorial/ancestors.pl
        language: prolog
        content: |
          parent(tom, bob).
          parent(bob, ann).
          parent(bob, pat).
          parent(ann, lena).

          ancestor(X, Z) :- parent(X, Z).
          ancestor(X, Z) :- parent(X, Y), ancestor(Y, Z).
      explanation: |
        The recursive case consumes one parent link before recursing on the intermediate person. On this finite acyclic database that bounds recursion depth. A base case is necessary, but its presence alone does not prevent an earlier or later recursive branch from diverging. The tests check complete enumeration and a no-answer leaf query.
  # Pedagogy: Variation Theory — contrast element/tail and exact/minimum length patterns. Sources: Logic-palooza handout pp. 46–49; Homework LOGIC4 A.8–A.10; F22 final Q22.
  - title: List Patterns
    instructions: |
      ### Why this matters

      A list is structured data, so the unification rules you already know still apply. Head–tail patterns expose part of that structure without an index or a loop.

      ### 🎯 You will learn to

      - Analyze the difference between one element and the remaining list.
      - Apply a list pattern that selects a position without restricting later elements.

      ### One element and the rest

      `[]` is an empty list. `[chess, uno, go]` is a list of three atoms. Lists can contain numbers or nested lists, too.

      The pattern `[Head | Tail]` separates the first element from the remaining list. For `[chess, uno, go]`, `Head = chess` and `Tail = [uno, go]`. For `[chess]`, the tail is `[]`. The empty list cannot match a head–tail pattern.

      `[First, Second | Rest]` requires at least two elements. It differs from `[First, Second]`, which requires exactly two. A variable in one element position can bind to a whole nested list.

      ### Thinking time

      Predict `[Head | Tail] = [[chess,uno],go]`. Is Head `chess` or `[chess,uno]`? Is Tail `go` or `[go]`? Write both bindings, then run the query and check whether the outer list structure stays intact.

      The worked `first_item/2` fact shows how a pattern connects a list and a selected element. Query it with a known list or a known item.

      ### Your task

      Define **`second_item(Item, List)`**. A pattern fact is sufficient. It must succeed exactly when List has at least two elements and Item unifies with its second element. Later elements must not be dropped or constrained, and a nested second element must stay intact.

      Try lists with zero, one, two, and four elements. Then query `second_item(uno, [chess, X, go])` and explain how the same fact fills a missing list element. We will add recursion next; this task only needs a pattern.
    default_query: first_item(Item, [[chess,uno],go])
    files:
    - path: /tutorial/list-patterns.pl
      language: prolog
      content: |
        first_item(Item, [Item | _]).

        % Relate Item to the second element of a list.
        second_item(Item, List) :- fail.
    open_file: /tutorial/list-patterns.pl
    run_file: /tutorial/list-patterns.pl
    tests:
    - description: Second-item matching handles short, long, and nested lists without flattening.
      command: |
        assert((await __query("findall(X,second_item(X,[a,b]),A), sort(A,AS), AS == [b], findall(X,second_item(X,[a,[b,c],d,e]),B), sort(B,BS), BS == [[b,c]], \\+ second_item(_,[]), \\+ second_item(_,[a]), \\+ second_item(a,[a,b]).")).length === 1, "Second-item matching handles short, long, and nested lists without flattening.");
      hints:
      - title: A minimum length
        text: An empty list and a singleton have no second element.
      - title: Expose two slots
        text: A pattern with two element positions before the bar leaves any later elements in the tail.
      - title: One shared slot
        text: 'Use second_item(Item, [First, Second | Rest]). as a shape: choose which position should share
          the head’s Item variable and which positions to ignore.'
    - description: The relation can also discover an unknown second element.
      command: |
        assert((await __query("second_item(uno,[chess,X,go]), X == uno.")).length > 0, "The relation can also discover an unknown second element.");
      hints:
      - title: Matching works both ways
        text: The known item can fill an unknown element in the list.
      - title: Use a pattern
        text: No arithmetic or explicit assignment is needed to connect the positions.
      - title: Reuse the variable
        text: The item position in the fact’s head and the second list slot need the same variable.
    quiz:
      title: Step 6 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
      - type: single
        difficulty: intermediate
        question: |
          What are the bindings for `[H|T] = [[a,b],c]`?
        options:
        - '`H = a`, `T = [b,c]`'
        - '`H = [a,b]`, `T = c`'
        - '`H = [a,b]`, `T = [c]`'
        correct_index: 2
        option_feedback:
          0: Head–tail matching removes one outer element, not one innermost value.
          1: The tail is the remaining list, even when it contains just one element.
        explanation: |
          The outer list has two elements. Its first element is itself a list; the remaining outer list contains c.
      - type: single
        difficulty: intermediate
        question: |
          Which pattern requires at least two elements and permits any remaining tail?
        options:
        - '`[A,B]`'
        - '`[A,B|Rest]`'
        - '`[A|B]`'
        correct_index: 1
        option_feedback:
          0: Without a tail variable, this pattern requires exactly two elements.
          2: This pattern requires only one element; B can be the empty list.
        explanation: |
          Two element slots before the bar require two elements, while Rest can be any remaining tail.
    solution:
      files:
      - path: /tutorial/list-patterns.pl
        language: prolog
        content: |
          first_item(Item, [Item | _]).
          second_item(Item, [_, Item | _]).
      explanation: |
        Sharing Item with the second list slot exposes that element. The first anonymous variable ignores the first element, and the tail variable accepts every remaining element. The empty and singleton lists cannot unify with this structure; a nested second element binds as one term.
  # Pedagogy: Worked example with fading — complete recursive membership and retrieve termination reasoning. Sources: Logic-palooza handout p. 50; Homework LOGIC5 and LOGIC7 (structural-recursion transfer).
  - title: Recursive List Relations
    instructions: |
      ### Why this matters

      The second-item pattern visits one fixed position. To ask whether a value occurs anywhere, combine head–tail matching with a recursive relation that makes the list smaller.

      ### 🎯 You will learn to

      - Apply structural recursion to enumerate list members.
      - Analyze why membership can check values or generate them, including duplicates.

      ### Two ways to be a member

      An item is in a list if it matches the head, **or** if it occurs in the tail. The first case is a pattern fact; the second case is a rule.

      The starter supplies the head case. On `[chess,uno,go]`, it can currently discover chess but cannot yet reach later elements. Recursing on the tail gives the same question a smaller list. On a finite list, eventually there is no head to match.

      There is no success fact for membership in `[]`: no item belongs to an empty list. A base case can be success for one relation and failure for another; choose it from the meaning of the relation.

      ### Thinking time

      Once the recursive case is complete, predict `list_member(Game, [uno,chess,uno])`. Does it report uno twice, remove the repeat, or fail because a value repeats? Commit to the full sequence, then compare after your repair.

      ### Your task

      Complete **`list_member(Item, List)`**. It must enumerate each element of a finite list from head to tail, with **one proof per occurrence**. It must also check known values and handle a nested list as one element. Keep the supplied head clause first.

      Try `list_member(uno,[chess,uno])`, `list_member(go,[])`, and `list_member(Item,[[a,b],c])`. Then explain why the recursive call must use the **tail**, rather than the original list or its head.

      The course's `is_member/2` has this same structure. Names can differ while the underlying relation stays the same. Later we will use the library's `member/2` once this mechanism is no longer a black box.
    default_query: list_member(Item, [uno,chess,uno])
    files:
    - path: /tutorial/list-recursion.pl
      language: prolog
      content: |
        list_member(Item, [Item | _]).
        list_member(Item, [_ | Tail]) :- fail.
    open_file: /tutorial/list-recursion.pl
    run_file: /tutorial/list-recursion.pl
    tests:
    - description: Membership enumerates every occurrence in order and preserves nested elements.
      command: |
        assert((await __query("findall(X,list_member(X,[uno,chess,uno]),A), A == [uno,chess,uno], findall(X,list_member(X,[[a,b],c]),B), B == [[a,b],c].")).length === 1, "Membership enumerates every occurrence in order and preserves nested elements.");
      hints:
      - title: An alternative proof
        text: If the head is not the desired occurrence, the rest of the list may contain it.
      - title: A smaller version
        text: Ask the same membership question about Tail, preserving the requested Item.
      - title: The recursive argument
        text: The body needs list_member(..., ...). Its first slot keeps the head’s Item, and its second
          slot is the smaller list.
    - description: Empty lists and absent items fail; checking a repeated known item has two proofs.
      command: |
        assert((await __query("\\+ list_member(_,[]), \\+ list_member(go,[uno,chess]), findall(ok,list_member(uno,[uno,chess,uno]),P), P == [ok,ok], list_member(last,[first,middle,last]).")).length === 1, "Empty lists and absent items fail; checking a repeated known item has two proofs.");
      hints:
      - title: Failure is meaningful
        text: No clause should claim that every item occurs in an empty list.
      - title: Keep alternatives
        text: A matching head does not forbid another occurrence later in the tail.
      - title: Head case then tail case
        text: Keep both clauses available. The recursive case discards one list element and preserves the
          item being sought.
    quiz:
      title: Step 7 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
      - type: single
        difficulty: intermediate
        question: |
          What should `list_member(Item, [])` do for a finite empty list?
        options:
        - Succeed with Item unbound
        - Fail because no element can match
        - Create a new list element
        correct_index: 1
        option_feedback:
          0: A success with an unconstrained Item would claim every value belongs to the empty list.
          2: This query fixes the list to empty; proving membership does not mutate it.
        explanation: |
          The relation means Item occurs in the given list. There is no occurrence in an empty list.
      - type: single
        difficulty: intermediate
        question: |
          How does this recursion avoid the ancestry starter’s termination problem?
        options:
        - The recursive goal receives a shorter list.
        - The Item variable is assigned a new value.
        - Prolog ignores recursive clauses after a match.
        correct_index: 0
        option_feedback:
          1: The item sought stays the same; progress comes from shrinking the list.
          2: Recursive alternatives remain available after a match, which allows later occurrences.
        explanation: |
          Each recursive call removes one outer list element. That gives a finite bound for the finite input lists used here.
    solution:
      files:
      - path: /tutorial/list-recursion.pl
        language: prolog
        content: |
          list_member(Item, [Item | _]).
          list_member(Item, [_ | Tail]) :- list_member(Item, Tail).
      explanation: |
        The head fact contributes the first occurrence. Backtracking into the recursive clause searches the tail for additional occurrences. There is no empty-list success clause, so an exhausted list ends that branch. This is a relation: it checks a supplied Item or discovers one from a supplied list.
  # Pedagogy: Independent transfer — integrate earlier schemas; self-explain, test counterexamples, plan spaced recall. Sources: original integration task combining Logic-palooza handout pp. 13–15, 50; Homework LOGIC3 and LOGIC6; F23 final Prolog tracing/list tasks.
  - title: Family Game Night
    instructions: |
      ### Why this matters

      Now use the pieces together. A small recommendation relation needs structured facts, recursive relationships, and membership, but it can still answer several questions without separate search functions.

      ### 🎯 You will learn to

      - Create a relation by composing ancestry and list membership.
      - Evaluate a solution with missing-answer and extra-answer counterexamples.

      ### Your brief

      Tom is planning a game night. A guest is eligible if they are a **descendant of Tom by one or more parent links**. A game is a match if it appears in **both Tom’s favorites and that guest’s favorites**. Tom is the host, so he is not an eligible guest.

      The starter provides the family, favorite lists, and the two recursive relations you already studied. Define **`game_guest(Guest, Game)`** using those facts and relations. Preserve the supplied data. The rule must work whether Guest, Game, both, or neither is already known. Report every matching guest–game pair; their order is not part of this task.

      ### Thinking time

      Before writing code, list the expected pairs from the data. Which of these belong, and which fail a condition: Tom’s own games, Pat’s go, Bob’s uno, and Zoe’s uno? Explain each decision from the brief rather than from the code you hope to write.

      ### From brief to relation

      Write a `%` comment that names the conditions a pair must satisfy. Then implement them. No new language construct is needed: connect the conditions using shared variables and already-known predicates. This time the editor gives you no partial body to fill in.

      Investigate three modes: `game_guest(Guest, Game)`, `game_guest(bob, Game)`, and `game_guest(Guest, uno)`. A correct definition must also reject pairs that fail one condition. Choose a counterexample that checks eligibility, and a different counterexample that checks a game preference.

      For a final ungraded experiment, give Lena a favorite that Tom also likes. Predict the new answer before running it; then restore the supplied data before testing.

      ### After this session

      Without looking at the code, explain how a query becomes pending goals, how unification creates mappings, and how backtracking revisits choices. Tomorrow, reconstruct membership on a blank page and trace one grandparent query before checking your work.

      Continue with [Prolog Lists and Search](/SEBook/tools/prolog-search-tutorial) for relational list construction, arithmetic, negation, accumulators, and a search task. Take a break between the two sessions; bring back these core relations from memory.
    default_query: game_guest(Guest, Game)
    files:
    - path: /tutorial/game-night.pl
      language: prolog
      content: |
        parent(tom, bob).
        parent(bob, ann).
        parent(bob, pat).
        parent(ann, lena).
        parent(iris, zoe).

        favorites(tom, [uno, chess]).
        favorites(bob, [chess, uno]).
        favorites(ann, [go, uno]).
        favorites(pat, [go]).
        favorites(lena, []).
        favorites(zoe, [uno]).

        ancestor(X, Z) :- parent(X, Z).
        ancestor(X, Z) :- parent(X, Y), ancestor(Y, Z).

        list_member(Item, [Item | _]).
        list_member(Item, [_ | Tail]) :- list_member(Item, Tail).

        % Define game_guest(Guest, Game) from the brief.
        game_guest(Guest, Game) :- fail.
    open_file: /tutorial/game-night.pl
    run_file: /tutorial/game-night.pl
    tests:
    - description: The relation finds exactly Ann–uno, Bob–chess, and Bob–uno.
      command: |
        assert((await __query("findall(pair(P,G),game_guest(P,G),Pairs), sort(Pairs,S), S == [pair(ann,uno),pair(bob,chess),pair(bob,uno)].")).length === 1, "The relation finds exactly Ann\u2013uno, Bob\u2013chess, and Bob\u2013uno.");
      hints:
      - title: Two independent requirements
        text: A guest must be a descendant, and a game must be liked by both guest and host.
      - title: Connect lists to people
        text: Retrieve each person’s favorite list before asking whether a shared game occurs in it.
      - title: The shared game variable
        text: The head has one Game variable. Both membership goals must constrain that same Game, using
          different favorite lists.
    - description: Known-guest and known-game queries work, and unrelated or incompatible pairs fail.
      command: |
        assert((await __query("findall(G,game_guest(bob,G),A), sort(A,AS), AS == [chess,uno], findall(P,game_guest(P,uno),B), sort(B,BS), BS == [ann,bob], once(game_guest(bob,chess)), once(game_guest(ann,uno)), \\+ game_guest(tom,uno), \\+ game_guest(pat,go), \\+ game_guest(ann,chess), \\+ game_guest(unknown,uno), \\+ game_guest(zoe,uno), \\+ game_guest(lena,_).")).length === 1, "Known-guest and known-game queries work, and unrelated or incompatible pairs fail.");
      hints:
      - title: Check the near misses
        text: Pat is eligible but go is not shared. Zoe likes uno but belongs to another family. Tom is the host.
      - title: One rule, several modes
        text: Keep both head arguments as variables and let the body constrain them.
      - title: Every condition must hold
        text: 'Read the body as a conjunction: descendant, host list, guest list, and a membership check
          in each list.'
    quiz:
      title: Step 8 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      questions:
      - type: single
        difficulty: advanced
        question: |
          A proposed solution accepts a descendant’s favorite even when Tom dislikes it. Which test best diagnoses the missing condition?
        options:
        - An unknown person requesting uno
        - Pat requesting go
        - Tom requesting uno
        correct_index: 1
        option_feedback:
          0: An unknown person chiefly checks eligibility and whether a favorite list exists.
          2: Tom checks the rule excluding the host, not whether a guest’s game is shared.
        explanation: |
          Pat is a descendant and likes go, but Tom does not. This counterexample isolates the missing host-preference check.
      - type: single
        difficulty: intermediate
        question: |
          Which explanation connects the whole tutorial’s execution model?
        options:
        - Rules return arrays; variables index the arrays.
        - Queries mutate facts; lists hold the changed state.
        - Goals unify with clauses; backtracking explores proofs.
        correct_index: 2
        option_feedback:
          0: A relation can produce several bindings without returning an array.
          1: Querying these pure relations does not modify the facts.
        explanation: |
          Unification consistently binds variables, resolution expands goals, and backtracking explores alternative proof paths. Relations become useful in several modes when their operational behavior permits those queries.
    solution:
      files:
      - path: /tutorial/game-night.pl
        language: prolog
        content: |
          parent(tom, bob).
          parent(bob, ann).
          parent(bob, pat).
          parent(ann, lena).
          parent(iris, zoe).

          favorites(tom, [uno, chess]).
          favorites(bob, [chess, uno]).
          favorites(ann, [go, uno]).
          favorites(pat, [go]).
          favorites(lena, []).
          favorites(zoe, [uno]).

          ancestor(X, Z) :- parent(X, Z).
          ancestor(X, Z) :- parent(X, Y), ancestor(Y, Z).

          list_member(Item, [Item | _]).
          list_member(Item, [_ | Tail]) :- list_member(Item, Tail).

          game_guest(Guest, Game) :-
              ancestor(tom, Guest),
              favorites(tom, HostGames),
              favorites(Guest, GuestGames),
              list_member(Game, HostGames),
              list_member(Game, GuestGames).
      explanation: |
        The ancestry goal restricts Guest to Tom’s descendants. The two favorites goals fetch distinct lists; using one Game variable in both membership goals requires a shared game. Bob contributes chess and uno; Ann contributes uno; Pat and Lena contribute none. Zoe shares uno with Tom but is outside his descendant relation. Reordering these finite positive goals can be correct because this task specifies the resulting pairs, not their order.
