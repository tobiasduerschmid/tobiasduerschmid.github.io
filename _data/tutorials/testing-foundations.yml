title: "Testing Foundations with pytest"
description: "Build the core testing skills you need BEFORE learning TDD: write meaningful assertions, choose test cases using partitions and boundaries, and test behavior instead of implementation."

# Authoring-time Bloom-verb objectives. Not yet rendered to students.
learning_objectives:
  - "Apply pytest's assert-style assertions to verify single, observable behaviors."
  - "Choose test cases using equivalence partitioning and boundary analysis."
  - "Distinguish strong oracles (catch real bugs) from weak oracles (pass on wrong solutions)."
  - "Recognize and avoid the Liar Test antipattern — a test that always passes regardless of implementation."
  - "Test behavior (the contract) rather than implementation (internal structure) so refactors don't break tests."

backend: pyodide
linter: true  # live pyflakes diagnostics in the Monaco gutter
debugger: true
pytest: true

# Show code (left) and tests (right) side by side — students can toggle back
# to tabbed view with the button above the editors. Files prefixed `test_`
# route to the right pane automatically; everything else lands on the left.
editor_split: true

# Keep the output panel compact — most interaction happens in the editors,
# and students only need a short strip to skim pytest's pass/fail summary.
output_height: "25%"

require_tests: true
autosave_type: files

# Global setup: install pytest, add /tutorial to sys.path, patch module cache
setup_commands:
- import pyodide_js; await pyodide_js.loadPackage('pytest')
- import sys; sys.path.insert(0, '/tutorial')
- |
  import pytest as _pytest, sys as _sys
  def _make_pytest_patch():
      _orig = _pytest.main
      _sysmod = _sys
      def _patched(*a, **kw):
          for m in list(_sysmod.modules):
              if m.startswith('test_') or m in ('streaks','leveling','squad','playlist','loot','streaming'):
                  del _sysmod.modules[m]
          return _orig(*a, **kw)
      return _patched
  _pytest.main = _make_pytest_patch()
- |
  import sys, types
  from pyodide.http import pyfetch
  response = await pyfetch('/assets/tutorials/python_test_grading.py')
  response.raise_for_status()
  grading = types.ModuleType('tutorial_test_grading')
  exec(await response.string(), grading.__dict__)
  sys.modules['tutorial_test_grading'] = grading

steps:

  # --------------------------------------------------------------------------
  # STEP 1 — Why Test? The Bug That Got Away
  # Pedagogy:
  #   Generation Effect     — predict outputs before running.
  #   Worked-example effect — students READ pre-written pytest tests before
  #                           being asked to write any (faded scaffolding
  #                           continues into Step 2 where they write their own
  #                           tests for the first time.
  #   Productive failure    — one calibrated RED test, with a specific message,
  #                           on the boundary value the student just predicted.
  #   Safety-net metaphor   — tests catch regressions before they reach production.
  #   Forward-pointer       — streak bug IS a boundary bug (covered in Step 2).
  # (Note: this is testing, NOT TDD. TDD has its own tutorial: tdd.yml.)
  # --------------------------------------------------------------------------
  - title: "Why Test? The Bug That Got Away"
    instructions: |
      ### Why this matters

      Imagine you've kept your Duolingo streak alive for **100 days straight**. You open the app expecting the 💯 badge — and it shows you 🔥 instead. One missing `=` sign in the badge logic, and the milestone you actually earned silently disappeared. The code runs cleanly, prints no error, and a million 100-day-streakers feel slightly betrayed. *That* is what tests prevent.

      ### 🎯 You will learn to

      - Apply pytest's pass/fail loop: read a failing test, understand what it expects, and fix production code until it passes.
      - Analyze what a test specifies about a function's behavior versus what it merely happens to observe.

      > 🧭 **Heads-up — a shift coming.** By the end of this tutorial you'll think about tests differently than most beginners do: not as *"checking your homework"* but as *executable specifications of behavior*. Notice the shift as it happens.

      ### 💡 Why test?

      Many students think testing is about **finding bugs after you write code**. That's half the story. Tests also:

      - **Specify behavior** — a test says *"this function should do X"*
      - **Prevent regressions** — a *regression* is a bug that comes back after being fixed; once a passing test guards a behavior, any future change that breaks that behavior immediately fails the test
      - **Enable fearless refactoring** — change code confidently because the suite catches breakage immediately

      Think of tests as a **safety net**: once a test passes, it stays in place to catch you. If a future change breaks the behavior the test guards, the test fails — the regression is caught before users feel it.

      ### 🔍 Predict first

      Don't run anything yet. Open `streaks.py` and read it.

      - What will `streak_badge(150)` return? *(deep into 💯 territory)*
      - And `streak_badge(50)`? *(in the 🔥 zone)*
      - And `streak_badge(100)` — exactly on the line between 🔥 and 💯?

      Hold those three predictions in your head.

      ### 📂 What you have

      Two files are already set up for you:

      - **`streaks.py`** — the production code (with a real bug).
      - **`test_streaks.py`** — three tests, **already written for you**. Each is a Python function whose name starts with `test_`. That naming is how `pytest` finds and runs them. Each body **calls** `streak_badge` and **asserts** what it should return. *(In Step 2 you'll write your own from scratch.)*

      ⚙️ **Task**:

      1. **Read `test_streaks.py`.** What behavior is each test checking? Notice the third test pins down `streak_badge(100)` — the spec says 100 days and up earns 💯.
      2. **Run the tests** (Run button). One test will fail. **That's a win** 🎯 — the test just caught a real bug. Read the failure carefully: pytest tells you exactly which assertion failed and what value came back instead.
      3. **Fix `streaks.py`** so all three tests pass. *Don't touch the test file* — production code is what we change; tests describe what the code *should* do.
      4. **Run again.** Three passing tests. The fix is now permanently guarded by the test — if anyone ever reverts to the old comparison, the safety net catches it instantly.

      That whole loop is the rhythm you'll see in every later step:

      ```mermaid
      flowchart LR
          predict["1. Predict<br/>(don't run yet)"]:::neutral
          red["2. Run pytest<br/>see RED ✗"]:::bad
          fix["3. Fix streaks.py<br/>(production code, not the test)"]:::neutral
          green["4. Run pytest<br/>see GREEN ✓"]:::good
          guard["5. Test guards behavior<br/>future regressions caught"]:::good
          predict --> red --> fix --> green --> guard
          classDef good fill:#e8f5e9,stroke:#2e7d32,color:#1b5e20
          classDef bad fill:#ffebee,stroke:#c62828,color:#b71c1c
          classDef neutral fill:#fafafa,stroke:#bdbdbd,color:#424242
      ```

      <details markdown="1"><summary>🎯 Why this bug matters (read after solving)</summary>

      The bug lives at *exactly* `100` days — the line between 🔥 and 💯. That's no coincidence. Bugs love **boundaries** — the values where behavior changes. They're the natural home of off-by-one errors (`>` vs `>=`, `<` vs `<=`). You'll hunt boundaries systematically in **Step 2**.
      </details>

      🧭 **Pause — name what just happened.** You ran a test, read a failure, fixed code, and confirmed it with a re-run. In one sentence: what did that test *specify* about `streak_badge`? Use the words "specification" or "behavior" rather than "check." Then go one level deeper: *why* does writing the assertion first (before seeing whether the code passes) mean the test reflects intended behavior rather than observed behavior? What would change if you wrote the assertion after reading the output?

      > 🔭 **Coming in Step 2:** Not all *inputs* are equally useful for finding bugs. The streak bug at exactly day 100 wasn't a coincidence — bugs cluster at **boundaries**, the values where one behavior turns into another. You'll learn how to find them systematically before they ship.

    files:
      - path: "streaks.py"
        content: |
          def streak_badge(days: int) -> str:
              """Pick the streak badge for a daily-app streak (Duolingo / Snapchat / BeReal style).

              Spec:
                days >= 100 -> "💯"   (century club)
                days >=  30 -> "🔥"   (on fire)
                days >=   7 -> "⚡"   (lit week)
                days >=   1 -> "✨"   (just started)
                else        -> ""     (no streak)
              """
              if days > 100:
                  return "💯"
              if days >= 30:
                  return "🔥"
              if days >= 7:
                  return "⚡"
              if days >= 1:
                  return "✨"
              return ""
        language: "python"

      - path: "test_streaks.py"
        content: |
          """Tests for streaks.streak_badge — pre-written for you in this step.
          In Step 2 you'll write your own from scratch."""
          import pytest
          from streaks import streak_badge


          def test_well_above_century_is_diamond():
              # 150 days is deep in the 💯 range — this should never be in doubt.
              assert streak_badge(150) == "💯"


          def test_inside_fire_range_is_fire():
              # 50 days is comfortably in the 🔥 range (30-99).
              assert streak_badge(50) == "🔥"


          def test_exactly_at_century_boundary_is_diamond():
              # The spec says: 100 days and up earns 💯.
              # 100 is the *boundary* — the value where 🔥 turns into 💯.
              # Boundary bugs (off-by-one) love values like this. (More in Step 2.)
              assert streak_badge(100) == "💯"


        language: "python"

    open_file: "streaks.py"
    run_file: "test_streaks.py"

    solution:
      files:
        - path: "streaks.py"
          content: |
            def streak_badge(days: int) -> str:
                """Pick the streak badge for a daily-app streak (Duolingo / Snapchat / BeReal style).

                Spec:
                  days >= 100 -> "💯"   (century club)
                  days >=  30 -> "🔥"   (on fire)
                  days >=   7 -> "⚡"   (lit week)
                  days >=   1 -> "✨"   (just started)
                  else        -> ""     (no streak)
                """
                if days >= 100:
                    return "💯"
                if days >= 30:
                    return "🔥"
                if days >= 7:
                    return "⚡"
                if days >= 1:
                    return "✨"
                return ""
          language: "python"
      explanation: |
        The bug was `days > 100` instead of `days >= 100`. The spec says 100
        days earns 💯, but the buggy comparison let exactly-100 fall through
        to the 🔥 branch. We fixed `streaks.py` — never the test file. Tests
        describe what the code *should* do; production code is what we change.

    tests:
    - description: The century boundary and its neighbors
      command: |
        import importlib, sys
        sys.modules.pop("streaks", None)
        from streaks import streak_badge
        for days, expected in [(99, '🔥'), (100, '💯'), (101, '💯')]:
            assert streak_badge(days) == expected, f"Badge does not match the contract at {days} days."
      hints:
      - title: The badge contract
        text: Locate the rule for the first day of the century range. Which outputs are required on either side?
        condition: 'code_missing: def streak_badge'
      - title: Trace the equality case
        text: Trace the conditional at exactly 100. Compare its truth value with the branch selected at 101.
        condition: 'code_matches: days\s*>\s*100\b'
      - title: Keep the neighboring ranges
        text: Compare each threshold with the next lower badge. Check the first and last day in each range before changing
          more code.
        condition: 'code_not_matches: days\s*>\s*100\b'
    - description: The remaining badge ranges
      command: |
        import importlib, sys
        sys.modules.pop("streaks", None)
        from streaks import streak_badge
        for days, expected in [(0, ''), (1, '✨'), (6, '✨'), (7, '⚡'), (29, '⚡'), (30, '🔥'), (150, '💯')]:
            assert streak_badge(days) == expected, f"Badge does not match the contract at {days} days."
      hints:
      - title: The badge contract
        text: Locate the rule for the first day of the century range. Which outputs are required on either side?
        condition: 'code_missing: def streak_badge'
      - title: Trace the equality case
        text: Trace the conditional at exactly 100. Compare its truth value with the branch selected at 101.
        condition: 'code_matches: days\s*>\s*100\b'
      - title: Keep the neighboring ranges
        text: Compare each threshold with the next lower badge. Check the first and last day in each range before changing
          more code.
        condition: 'code_not_matches: days\s*>\s*100\b'

    quiz:
      title: "Step 1 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            A teammate says: *"I only write tests after I finish all my code, to check for bugs."*

            What is the main limitation of this approach?
          type: single
          options:
            - "There is no real limitation — writing tests after code is the industry standard, and the test suite ends up identical either way since you cover the same behaviors"
            - "Waiting loses early design feedback and can encourage copying the implementation into the expected results"
            - "Writing tests afterward is fine as long as you achieve 100% coverage, which ensures all behavior is verified"
            - "The main problem is that it takes slightly longer because you have to context-switch back to code you already wrote"
          correct_index: 1
          option_feedback:
            0: "Tests written after implementation can still check its specification. Waiting nevertheless loses feedback during the initial implementation and creates a risk of deriving expectations from existing code instead of requirements."
            1: "A later test can use an independent specification, but it cannot provide feedback during development that already happened. Derive expected results from requirements regardless of when the test is written."
            2: "Coverage measures which lines *ran*, not whether their behavior was *checked*. A weak oracle (`assert result is not None`) hits 100% coverage and verifies almost nothing. You'll see this exact failure mode in Step 3."
            3: "Context-switching can cost time, but the larger lost opportunity is feedback during initial development. Later tests can still check the specification if their expectations are derived independently."
          explanation: |
            Tests written afterward can verify intended behavior when their expectations come from the specification.
            They cannot provide feedback during the earlier development, and reading existing code can bias the expected results.

        - question: |
            What does this code do?
            ```python
            assert len(result) == 3, "Expected 3 items"
            ```
          type: single
          options:
            - "It prints 'Expected 3 items' to the console, then continues execution normally"
            - "It checks that `result` has 3 elements; if not, it raises an `AssertionError` with the message"
            - "It creates a new list called `result` and populates it with exactly 3 items"
            - "It evaluates the condition but silently continues even if the condition is `False`"
          correct_index: 1
          option_feedback:
            0: "`assert` is not a print statement. The string after the comma is the *failure message* — it only appears when the assertion is `False` and Python raises an `AssertionError`."
            1: "Right. The condition is evaluated; if `True`, execution continues silently. If `False`, Python raises `AssertionError` with the message string as the error detail."
            2: "`assert` doesn't create or modify variables — it just evaluates a condition. The `result` here must already exist when `assert` runs, or you'd get a `NameError` first."
            3: "A `False` assertion does *not* silently continue — it raises `AssertionError`. (Python's `-O` flag *does* strip asserts, but in normal execution they always raise on failure.)"
          explanation: |
            `assert condition, message` evaluates the condition. If `True`, nothing happens and
            execution continues. If `False`, Python raises an `AssertionError` with the message.

        - question: |
            Dijkstra wrote: *"Testing can show the presence of bugs, but never their absence."*

            Applied to automated test suites, this means:
          type: single
          options:
            - "Tests are only useful if you already suspect a bug — otherwise they're wasted effort"
            - "Passing tests confirm the tested behaviors, but cannot rule out bugs in untested inputs"
            - "If all tests pass, the code is safe to deploy without further review"
            - "Tests guarantee correctness once you reach 100% line coverage"
          correct_index: 1
          option_feedback:
            0: "Tests aren't just useful when you already suspect a bug — they document expected behavior and catch regressions you didn't anticipate. The Dijkstra quote is about the *ceiling* of what tests guarantee, not about when to bother writing them."
            1: "Exactly. Passing tests show the tested behaviors work as specified. They cannot show that *untested* behaviors work — the guarantee only extends as far as the suite covers."
            2: "Even with a full passing suite, untested behaviors could still harbor bugs. Tests prove only what they test. Code review, static analysis, and other practices complement testing precisely because no suite is exhaustive."
            3: "Coverage measures which lines *ran*, not whether their behavior was *verified*. Full coverage with weak oracles (`is not None` everywhere) passes for almost any return value and proves almost nothing. Dijkstra's quote applies regardless of coverage level."
          explanation: |
            Tests confirm the behaviors they test, but cannot guarantee zero bugs overall.
            Dijkstra's observation means: your suite is only as trustworthy as the inputs it
            exercises and the oracles it uses. A suite with three strong tests knows three
            things; a suite with three weak tests knows almost nothing.

        - question: |
            The "safety net" metaphor for testing means:
          type: single
          options:
            - "Tests should be run automatically on every commit, like a security camera scanning each code change"
            - "Each passing test stays in place to catch regressions, so you can refactor fearlessly"
            - "You should aim for 100% test coverage as a safety baseline before each release"
            - "Tests should be written in a strict mechanical order: unit tests first, then integration, then end-to-end"
          correct_index: 1
          option_feedback:
            0: "This describes *continuous integration* (running tests automatically on every commit) — that's about the trigger, not the metaphor. The safety-net image is about what each *passing* test does for you: it stays in place to catch later breakage."
            1: "Right. Each passing test permanently guards that behavior against future regressions — that's the safety net. If a future change breaks a guarded behavior, the test fails before users feel it."
            2: "The safety-net image isn't about a coverage number. A test suite with 100% line coverage but weak oracles is full of holes; a smaller suite with strong oracles on the critical paths is a tighter net. Coverage and the safety-net principle are different ideas (more in Step 4)."
            3: "This describes the *testing pyramid* (a way of layering test types), not the safety-net metaphor. The safety net is about *passing tests as permanent guards against regression*, regardless of what level of the pyramid they sit at."
          explanation: |
            The safety-net metaphor captures
            the key psychological benefit of testing: each passing test stays in place to catch
            regressions you might otherwise introduce. With a thick safety net of tests, you can
            refactor and add features fearlessly — if you break something, the net catches it
            before users do.


  # --------------------------------------------------------------------------
  # STEP 2 — Choosing What to Test: Partitions & Boundaries
  # Pedagogy:
  #   First hands-on writing — also introduces the pytest-test SHAPE
  #                            (test_ prefix, AAA, single assertion).
  #   Black-box thinking     — derive tests from spec, not implementation.
  #   Callback to Step 1     — the streak bug WAS a boundary bug (retrieval).
  #   Variation Theory       — partition structure held constant, boundaries
  #                            vary — so "boundary value" is what stands out.
  #   Worked example         — three tests given (representative + both boundaries)
  #                            instead of two; reduces cold-start load.
  #   Faded scaffold         — student writes only 3 tests (down from 4) so the
  #                            cognitive budget can absorb pytest-shape teaching.
  #   Setup for Step 3       — `is True` introduces the IDEA of strong-vs-weak;
  #                            Step 3 generalizes to any return type.
  # --------------------------------------------------------------------------
  - title: "Choosing What to Test: Partitions & Boundaries"
    instructions: |
      ### Why this matters

      That `streak_badge` bug at *exactly* day 100 from Step 1 wasn't random — it lived at a **boundary**, the value where one behavior turns into another. Bugs cluster at boundaries, so guessing inputs misses them. This step teaches you to find those boundary values systematically, before they ship.

      ### 🎯 You will learn to

      - Apply equivalence partitioning to divide a function's input space into meaningful groups.
      - Analyze numeric specs to pinpoint the boundary values where off-by-one bugs hide.
      - Create your own pytest tests from scratch — `test_` prefix, AAA shape, single assertion.

      🔍 **Retrieve first.** Scan the three tests you inherited in Step 1 (`test_streaks.py`). Each test calls `streak_badge` and asserts something with `==`. Notice the *shape* of each — same structure, different inputs. You're about to write tests just like these.

      ### 📝 The shape of a pytest test

      A pytest test is just a function whose name starts with `test_`, containing one or more plain `assert` statements. Here's the shape on a *different* function so you can see the pattern without seeing today's answer:

      ```python
      # The function under test (in some module):
      def add(a: int, b: int) -> int:
          return a + b

      # The pytest test for it:
      def test_add_two_positives():
          assert add(2, 3) == 5
      ```

      Three things to notice:

      - The test is just a regular function — no class, no boilerplate.
      - The body **calls** the function under test and **asserts** the expected return value with `==`.
      - The test name reads like a one-line bug report (*"add_two_positives FAILED"* tells the next reader exactly what broke).

      **pytest convention**: name test functions `test_...`; test files use `test_*.py` or `*_test.py`.

      Every test has three parts — **Arrange** (set up inputs), **Act** (call the function), **Assert** (verify the result). For the boundary tests below, all three sit on a single line each: the input string is the Arrange, the call to `squad_name_valid(...)` is the Act, and `is True` / `is False` is the Assert.

      ### 💡 The principle: equivalence partitions and boundaries

      An **equivalence partition** is a set of inputs that should behave the same. **Boundaries** are the values where partitions meet — and where off-by-one faults can appear (remember the `> 100` vs `>= 100` streak bug from Step 1).

      Today's function: `squad_name_valid(name)` — checking if a Fortnite / Roblox / Discord squad name is the right length. Rule: `3 ≤ len ≤ 12` characters.

      🔍 **Before writing any code:** Looking only at the spec (`3 ≤ len ≤ 12`), list the 4 input lengths you would test. Don't run anything. For each one, write a single word explaining *why this specific length matters more than its neighbor*. Hold your list — check it against the disclosure below after writing your tests.

      ⚙️ **Task** (`test_squad.py`): **Three** worked tests are provided so you can see the pattern from multiple angles before writing your own. Read all three first, then write three more.

      💬 **Self-explain first** (do this *before* writing): Read the three provided tests carefully. *Why* did the author pick length `5` for "valid representative", `2` for "just below min", and `12` for "boundary at max valid"? What is *the same* about all three tests, and what is *different*? Articulating both sides primes you to make your own.

      Now **write three more tests**. The three stubs in the file name what each test must check; you decide the input string and the expected return value.

      | Test name | What partition or boundary it pins down |
      |---|---|
      | `test_boundary_min_valid` | the **smallest** length the spec says is valid |
      | `test_too_long_just_above_max` | one length **past** the upper bound |
      | `test_empty_string` | the empty string |

      For each, decide from the spec `3 ≤ len ≤ 12`:

      - What concrete input string has the right length?
      - Should `squad_name_valid` return `True` or `False` for it? (Read the rule — don't guess.)
      - Then write the assertion using the same `is True` / `is False` pattern as the worked examples.

      💡 **Strong oracles on a Boolean return**: `squad_name_valid` returns `True`/`False`. `assert squad_name_valid("epic") is True` is strong (identity comparison — only `True` itself passes). `assert squad_name_valid("epic")` with no comparison is weak — `1`, `"yes"`, or any truthy value would slip through. (You'll generalize this idea — *strong vs. weak assertions* — to any return type in Step 3.)

      <details markdown="1"><summary>📖 Quick aside: <code>is True</code> vs <code>== True</code></summary>

      `is` checks **object identity** (same object in memory); `==` checks **equality** (same value). For Booleans these almost always agree, but `is True` is *strictly stricter* — only the literal `True` object passes. If a function were (incorrectly) refactored to return `1` or `"yes"` instead of `True`:

      | Assertion | Result |
      |---|---|
      | `assert result is True` | ✗ fails — `1 is True` is `False` |
      | `assert result == True` | ✓ passes — `1 == True` is `True` |
      | `assert result` (no comparison) | ✓ passes — `1` is truthy |

      For a function whose contract says "returns a Boolean", use `is True` / `is False` — the test then catches *both* wrong values *and* wrong types. (For non-Boolean returns, prefer `==` with the exact expected value — that's Step 3.)
      </details>

      <details markdown="1"><summary>📐 Reveal — check your 4 input lengths (open AFTER you've written them)</summary>

      The 4 critical lengths sit *exactly* where partitions transition:

      ```mermaid
      flowchart LR
          L2["len 2<br/>❌ reject"]:::bad
          L3["len 3<br/>✅ accept"]:::good
          Mid["...middle of valid<br/>partition..."]:::neutral
          L12["len 12<br/>✅ accept"]:::good
          L13["len 13<br/>❌ reject"]:::bad
          L2 --> L3 --> Mid --> L12 --> L13
          classDef good fill:#e8f5e9,stroke:#2e7d32,color:#1b5e20
          classDef bad fill:#ffebee,stroke:#c62828,color:#b71c1c
          classDef neutral fill:#fafafa,stroke:#bdbdbd,color:#757575
      ```

      | Length | Expected | What this catches |
      |---|---|---|
      | **2** | reject | A lower bound accidentally relaxed from 3 to 2 |
      | **3** | accept | An inclusive lower bound `3 <= length` changed to `3 < length` |
      | **12** | accept | A `<= 12` written as `< 12` |
      | **13** | reject | A `< 13` written as `<= 13` (off-by-one above) |

      The *middle* of the valid partition isn't in the list — one representative there is enough. The same heuristic works for **any** numeric range: lengths, ages, prices, retry counts.
      </details>

      ### 📖 Equivalence partitioning — the deeper "why"

      The input space splits into three regions, each with the **same expected behavior**:

      ```mermaid
      flowchart LR
          A["<b>too short</b><br/>len 0, 1, 2<br/>↦ reject"]:::bad
          B["<b>valid</b><br/>len 3 ... 12<br/>↦ accept"]:::good
          C["<b>too long</b><br/>len 13+<br/>↦ reject"]:::bad
          A --- B --- C
          classDef good fill:#e8f5e9,stroke:#2e7d32,color:#1b5e20
          classDef bad fill:#ffebee,stroke:#c62828,color:#b71c1c
      ```

      If `"a"` (length 1) is rejected, `"ab"` (length 2) probably is too — same partition, same expected behavior. So **one representative per partition** is enough for the *middle* of the partition. Spend your test budget on the **boundaries** instead — that's where `> 12` vs `>= 12` bugs hide.

      **Heuristic for any range `[min, max]`**:
      1. *Partition* the input space.
      2. *Pick one representative* per partition.
      3. *Test every boundary* — last invalid before each transition, first valid after.

      <details markdown="1"><summary>📖 Test names ARE documentation</summary>

      Notice that good test names *describe the behavior they verify*: `test_valid_representative`, `test_boundary_max_valid`, `test_too_long_just_above_max`. A failing test should read like a one-line bug report: *"boundary_max_valid FAILED — assert False is True"*. If you can read your test names without opening the code and still know what the suite covers, your tests double as documentation.

      Anti-example: `test_1`, `test_squad`, `test_works`. These tell the next reader nothing.
      </details>

      <details markdown="1"><summary>📖 Why pytest beats raw `assert`</summary>

      Raw `assert` halts at the first failure; you only learn about one bug at a time. pytest discovers all tests, runs them all, names each one, and shows the *exact* mismatched value when one fails — e.g. `assert False is True`. No classes, no boilerplate — just functions starting with `test_`.
      </details>

      🔗 **Connect to your own code.** Think of the last function you wrote before this tutorial. What inputs did you test it with? Apply the partition + boundary method: identify the partitions in that function's input space and name at least one boundary you probably didn't test. If you weren't testing at all before this tutorial, name what your first test for that function would be.

      > 🔭 **Coming in Step 3:** The `is True` / `is False` move you used here is one example of a *strong oracle* — an assertion that pins exactly the expected value. Step 3 generalizes this to any return type — strings, numbers, lists, dicts — and shows the three flavors of *weak* oracle that look productive but verify almost nothing.


