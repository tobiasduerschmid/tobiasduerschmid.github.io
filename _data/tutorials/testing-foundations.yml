    quiz:
      title: "Step 3 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            Two tests check the same `build_loot_card` call. Which assertion is **strongest** (most likely to catch a bug)?

            **A.**
            ```python
            def test_a():
                result = build_loot_card("Healing Potion", 3, "common")
                assert "name" in result
            ```

            **B.**
            ```python
            def test_b():
                result = build_loot_card("Healing Potion", 3, "common")
                assert result == {
                    "name": "Healing Potion", "qty": 3, "rarity": "common",
                    "label": "3× Common Healing Potion", "is_rare": False,
                }
            ```
          type: single
          options:
            - "A — checking presence is more flexible because it doesn't break on output changes"
            - "B — it pins every spec-mandated field. A passes for any dict with a `name` key"
            - "Both are equally strong — both succeed for the correct call"
            - "Neither — strong oracles always need multiple `assert` statements, not a single `==`"
          correct_index: 1
          option_feedback:
            0: "Flexibility-to-future-changes is exactly the wrong success criterion. A *should* fail when `qty`, `rarity`, `label`, or `is_rare` is wrong — but it doesn't, because the assertion only references `name`. The reason A 'survives' is that it's verifying almost nothing, not that it's well-designed."
            1: "Right. B is the strong oracle: only the exact spec-mandated dict satisfies it. A is the *presence* weak oracle: any dict with a `name` key — including `{\"name\": \"Wrong\", \"qty\": 0, ...}` — passes. Liar-test territory."
            2: "Two assertions on the same call can differ wildly in bug-catching power. A passes for thousands of wrong dicts; B passes for exactly one (the correct one). 'Both succeed for the correct call' just means both don't false-positive — it doesn't mean both catch bugs."
            3: "Strong oracles aren't about *count* of assertions — they're about *precision*. One precise `assert result == {...}` pins the entire output exactly. Adding more checks doesn't strengthen the oracle; it just adds noise."
          explanation: |
            B is a strong oracle: only the exact expected dict satisfies it. A is the
            *presence* weak oracle — any dict with a `name` key passes, including ones
            where `qty`, `rarity`, `label`, and `is_rare` are all wrong.

        - question: |
            For `build_loot_card("Excalibur", 1, "legendary")`, which assertion is the **weakest** (catches the fewest bugs)?
          type: single
          options:
            - "`assert isinstance(result, dict)`"
            - "`assert result[\"is_rare\"] is True`"
            - "`assert result == { ... }` (full dict, all 5 fields)"
            - "`assert result[\"name\"] == \"Excalibur\" and result[\"qty\"] == 1`"
          correct_index: 0
          option_feedback:
            0: "Right. `isinstance(result, dict)` is the *type* weak oracle — any dict at all passes, including `{}` and dicts with completely wrong values. It's the canonical Liar test for dict-returning functions."
            1: "This is the *single-field* weak oracle — better than `isinstance` (it at least checks one specific field), but the other four fields could all be wrong. It checks an expected field value rather than only the container type."
            2: "Full-dict equality is the *strong* oracle — only the exact spec-mandated dict satisfies it. (Step 4 will show the ceiling on this — but for now, this is the strongest of the four options.)"
            3: "Two-field `==` is stronger than `isinstance` (which checks no values at all). It's still weaker than full-dict equality because it lets `rarity`, `label`, and `is_rare` be wrong — but it's not the *weakest* of the four."
          explanation: |
            `isinstance(result, dict)` accepts any dict whatsoever — `{}` passes, a totally
            wrong dict passes. This is the canonical *type* weak oracle. The other options
            check at least one value; only `isinstance` checks no values at all.

        - question: |
            **(Spaced review — Step 2)** A teammate writes `assert squad_name_valid("epic")` (no `is True`). The test passes against the current code. Why is this oracle still weak?
          type: single
          options:
            - "It is not weak — the test passes, so the oracle is doing its job"
            - "It passes for any *truthy* return (`1`, `\"yes\"`, `[1, 2]`) — use `is True` for an exact Boolean."
            - "It is weak because pytest assertions need an explicit message string after the comma"
            - "It is weak because the input string is too short to be representative"
          correct_index: 1
          option_feedback:
            0: "*Currently passing* is a weaker claim than *correctly testing*. A bare `assert squad_name_valid(\"epic\")` passes today only because `squad_name_valid` happens to return `True`. The day someone refactors it to return the name string `\"epic\"` (still truthy!), the oracle will still pass — but now it's verifying nothing meaningful. Same Liar-test family as the dict checks above."
            1: "Right. A bare `assert <expr>` passes for any truthy return — `1`, `\"epic\"`, `[True]` would all pass, even though none of them are `True`. `is True` uses identity comparison and accepts *only* the `True` singleton. It's the Boolean-return version of full-dict equality: pin the exact value."
            2: "pytest assertion messages are optional. The oracle's strength has nothing to do with whether you supplied a failure message; it has everything to do with which return values would *fail* the assertion. Bare `assert <expr>` is satisfied by every truthy value, which is the weakness here."
            3: "The input length isn't the issue — `\"epic\"` is a perfectly valid length-4 input. The oracle weakness is structural: `assert <expr>` (no comparison) accepts any truthy return value, regardless of the input."
          explanation: |
            A bare `assert <expr>` succeeds for any truthy value — same Liar-test family
            as the dict checks. `is True` (identity comparison) is the strong form for
            Boolean returns; `== {full dict}` is the strong form for dicts. Same lesson,
            different shapes.

        - question: |
            **(Spaced review — Step 1)** A passing test stays in the suite. Why?
          type: single
          options:
            - "Symmetry — every code change should ship with a matching test addition or removal"
            - "Each passing test is a permanent regression guard — if a bug is re-introduced, it fails first."
            - "Removing tests after a feature ships keeps the suite small and fast"
            - "Tests get noisy over time and need to be deleted to keep the signal clean"
          correct_index: 1
          option_feedback:
            0: "There's no symmetry rule. The *purpose* of a test is to guard a specific behavior; the question is whether that behavior is still worth guarding (it almost always is). Symmetry between code changes and test deletions isn't a real principle."
            1: "Right. The *safety-net* idea from Step 1: each passing test stays in place to catch the regression no one anticipated. Delete the test and you cut a hole in the net at exactly the spot a future bug would land."
            2: "Speed is sometimes a reason to *split* test suites (fast unit tests vs. slow integration), but never a reason to *delete* a passing test that guards real behavior. The cost of running it is tiny; the cost of a regression slipping through is large."
            3: "Test noise is a real problem, but the fix is usually to *strengthen* weak oracles or remove duplicates — not to delete passing tests for shipped behavior. A test guarding shipped behavior is the opposite of noise."
          explanation: |
            The safety-net principle: each passing test permanently guards its behavior.
            Deleting it cuts a hole in the net. If someone later re-introduces the bug,
            there's nothing to catch it.


  # --------------------------------------------------------------------------
  # STEP 4 — Test Behavior, Not Implementation (with the over-specification trap)
  # Pedagogy:
  #   Threshold concept   — tests verify the SPEC: no less (weak oracle), no more
  #                         (over-specification or internal coupling).
  #   Contrasting cases   — brittle vs robust on the same class.
  #   AAA pattern         — scaffolded structure for robust tests.
  #   Coverage ≠ quality  — same executed lines, different assertion strength.
  #   Tension with Step 3 — "strongest oracle wins" has an upper bound: the spec.
  # --------------------------------------------------------------------------
  - title: "Test Behavior, Not Implementation"
    instructions: |
      ### Why this matters

      Step 3 said: *strong oracles beat weak ones — pin the exact value*. That's true, but only up to a ceiling: **the spec**. Going *below* the spec is a weak oracle (Step 3's lesson). Going *above* it — asserting on things the spec doesn't mandate — is the **over-specification trap**, and it produces tests that break during clean refactors. The cure is to assert on exactly what the spec says, no more, no less.

      ### 🎯 You will learn to

      - Analyze a test for two species of "above the spec" — internal coupling (peeking at private state) and over-specification (pinning unmandated output fields).
      - Apply the Refactoring Litmus Test: a pure refactor with unchanged behavior should never break a well-written test.
      - Evaluate test smells like Excessive Setup as prompts to inspect production responsibilities and test scope.

      This step covers both halves of "above the spec":

      - **(a) Internal coupling** — the test peeks at private state (`obj._tracks`). A pure rename of the internal attribute breaks the test even though no observable behavior changed.
      - **(b) Over-specification** — the test pins output fields the spec doesn't mandate (e.g., a full-dict equality that includes a `created_at` timestamp the spec never promised). Adding an unspecified field breaks the test even though every spec-mandated field is still correct.

      Both make tests depend on details outside the contract. The cure is the same: **assert on exactly what the spec says, no more, no less.**

      ## Part A — Internal coupling (the rename experiment)

      ⚙️ **Task** (`test_brittle_audit.py`): Four tests for a `PlaylistQueue` (think Spotify / Apple Music queue). All four currently pass. You'll *discover* which are **brittle** (break on pure refactoring even when behavior is unchanged) and which are **robust** (survive any refactoring that preserves the public behavior).

      1. **Read the four tests** in `test_brittle_audit.py`. Before running anything: *classify each test* — does it access internal state (looks inside the object) or only the public interface (calls methods that don't start with `_`)? Write your classification as a comment next to each test.
      2. **Run the suite as-is** — all four tests pass. Good. Now do the experiment:
      3. **Refactor the production code without changing behavior**: in `playlist.py`, rename the private attribute `self._tracks` to `self._queue` (everywhere — the constructor and the five methods). There are exactly 6 occurrences; use find/replace to catch all of them. The class's public behavior is unchanged: `add`, `total_duration`, `track_count`, `titles`, `durations` still produce the same outputs.
      4. **Before re-running:** predict how many tests will fail and which ones.
      5. **Re-run the suite**. The tests that fail are brittle — they coupled to the implementation detail (the attribute name). The ones that survived only touched the public API. Compare to your prediction. Whether you were right or wrong: write one sentence tracing the causal chain — from "I renamed `_tracks`" to "exactly these tests fail." The explanation should work without running the code.
      6. **Rewrite each broken test** using only the public API — methods that don't start with `_`. The public surface of `PlaylistQueue` is: `add`, `track_count()`, `titles()`, `durations()`, `total_duration`. Anything starting with `_` is internal and off-limits to tests. When all four pass against the refactored code, you have evidence that they tolerate this storage rename. Keep their behavior checks intact as you repair them.

      ### 📦 Two Python tools used in this step: `@dataclass` and `@property`

      **`@dataclass` — auto-generated value objects**

      `playlist.py` stores each track as a `Track` instance declared with `@dataclass(frozen=True)`:

      ```python
      from dataclasses import dataclass

      @dataclass(frozen=True)
      class Track:
          title: str
          duration_seconds: int
      ```

      `@dataclass` reads the annotated fields and auto-generates `__init__`, `__repr__`, and `__eq__`. `frozen=True` makes instances immutable — a `Track` can't have its title changed after creation, and two `Track`s with identical fields compare equal with `==` out of the box.

      Without `@dataclass` you'd write all this by hand:
      ```python
      class Track:
          def __init__(self, title: str, duration_seconds: int) -> None:
              self.title = title
              self.duration_seconds = duration_seconds
          def __eq__(self, other): ...
          def __repr__(self): ...
      ```
      Same result, far more boilerplate.

      **`@property` — a method that reads like an attribute**

      `PlaylistQueue.total_duration` is declared with `@property`:

      ```python
      @property
      def total_duration(self) -> int:
          return sum(t.duration_seconds for t in self._tracks)
      ```

      Because of `@property`, callers write `queue.total_duration` (no parentheses) instead of `queue.total_duration()`. Use `@property` for *derived* values — ones that are computed from stored state rather than stored themselves — that read naturally as a noun.

      Contrast with `track_count()`, `titles()`, and `durations()`, which are regular methods. Rule of thumb: if the value *feels like a fixed attribute of the object* (total duration is a property of the queue's current state), make it a `@property`. If it *feels like an action or a lookup with side effects*, keep it a method.

      You'll see `@dataclass` and `@property` again in the TDD tutorial — where `ScoringEvent`, `BattleReport`, and `total_damage` follow the same patterns.

      💡 **Why this matters**: When a test only touches the public API, the production code stays free to evolve internally. The experiment you just ran is a live demonstration of the Refactoring Litmus Test (expand below to name what you discovered).

      💡 **This principle extends beyond classes.** For top-level functions, the public contract may include return values, exceptions, and specified side effects. Assert on those observable obligations, rather than incidental intermediate variables or private storage.

      <details markdown="1"><summary>🔬 The Refactoring Litmus Test — name what you just discovered</summary>

      > **A robust suite should survive a refactor that preserves its specified behavior. Passing one refactor is useful evidence, not proof that every test is robust.**
      > **If tests break after a pure refactoring (no behavior change) → they're testing implementation.**

      That breakage is the symptom; the fix is to rewrite the tests, not to revert the refactor.

      Both types of test were checking the same observable behavior: *the track was added*. They differed only in **how** they verified it. The brittle test peeked at implementation details (`_tracks[0].title`). The robust test used the public interface (`titles()`). Compare that to this pair:

      ```python
      # 🚨 BRITTLE — peeks at private state
      assert board._scores[0] == ("alice", 1000)

      # ✅ ROBUST — uses the public API
      assert board.top_player() == "alice"
      ```

      The brittle version breaks the moment `_scores` is renamed, restructured, or replaced — even if the top-player behavior is unchanged. The robust version only breaks when the **behavior itself** changes — which is exactly when you *want* it to fail.
      </details>

      <details markdown="1"><summary>📊 What the experiment reveals — expand after completing step 5</summary>

      The rename changed the *implementation* but **not** the public behavior, yet only the robust tests survive:

      ```mermaid
      flowchart TB
          subgraph before["BEFORE — all tests pass"]
              direction LR
              b1["Brittle test<br/>queue._tracks[0].title"]:::brittle
              b2["Robust test<br/>queue.titles()"]:::robust
              b1 --> bp1["✓"]:::good
              b2 --> bp2["✓"]:::good
          end
          subgraph after["AFTER — _tracks renamed to _queue"]
              direction LR
              a1["Brittle test<br/>queue._tracks[0].title"]:::brittle
              a2["Robust test<br/>queue.titles()"]:::robust
              a1 --> ap1["✗ AttributeError"]:::bad
              a2 --> ap2["✓ still passes"]:::good
          end
          before --> after
          classDef brittle fill:#fff3e0,stroke:#e65100,color:#bf360c
          classDef robust fill:#e8f5e9,stroke:#2e7d32,color:#1b5e20
          classDef good fill:#e8f5e9,stroke:#2e7d32,color:#1b5e20
          classDef bad fill:#ffebee,stroke:#c62828,color:#b71c1c
      ```
      </details>

      <details markdown="1"><summary>📖 Arrange-Act-Assert (AAA) — the structure of a clean test</summary>

      ```python
      def test_total_duration_sums_track_lengths():
          # Arrange — set up the world
          queue = PlaylistQueue()
          queue.add("Espresso", 175)
          queue.add("Vampire", 218)

          # Act — read the ONE derived value under test
          result = queue.total_duration   # property — no ()

          # Assert — verify the observable outcome
          assert result == 393
      ```

      Arrange–Act–Assert is a useful structure for these focused tests. Difficulty separating the sections is a reason to inspect the test scope and production responsibilities; it is not proof of a design defect.
      </details>

      ### 🚩 When Arrange dominates — the *Excessive Setup* smell

      You just learned the AAA shape. The size of each section is itself a signal — and the *Arrange* section is the loudest.

      Here's a test that compiles, runs, and passes. Read it, then ask: *what's wrong?*

      ```python
      def test_checkout_succeeds_for_valid_card():
          # Arrange — 22 lines
          db = InMemoryDatabase(); db.connect()
          user = User(id=1, name="Alex", email="a@x.io")
          db.users.insert(user)
          address = Address(user_id=1, line1="221B Baker St", country="UK")
          db.addresses.insert(address)
          card = Card(user_id=1, last4="4242", expiry="12/30")
          db.cards.insert(card)
          cart = Cart(user_id=1); db.carts.insert(cart)
          item = Item(sku="A1", name="Vinyl", price=20.0)
          db.items.insert(item); cart.add(item)
          tax_service = FakeTaxService(rate=0.08)
          payment_gateway = StubGateway(approves=True)
          email_service = NullEmailService()
          audit_log = InMemoryAuditLog()
          fraud_check = AlwaysPassFraudCheck()
          inventory = StubInventory(in_stock=True)
          feature_flags = FlagSet(enable_new_taxes=False)

          # Act — 1 line
          result = checkout(user.id, payment_gateway, tax_service, email_service,
                            audit_log, fraud_check, inventory, feature_flags)

          # Assert — 1 line
          assert result.status == "ok"
      ```

      The **Arrange** deserves investigation: many collaborators and database records are prepared for one outcome. For a focused unit test, that may indicate too much responsibility; a broader integration scenario may legitimately need more setup.

      This may be the *Excessive Setup* smell. Dependencies can require corresponding fixtures. Elaborate scaffolding is a reason to investigate both the production responsibilities and the scope of the test.

      > 🪞 **Tests are also a design tool, not just a verifier.** A large Arrange section can reveal coupling in the production code or unnecessary breadth in a test. Inspect the dependencies before deciding what to refactor.

      A `setup_world()` helper can reduce repetition, but it does not by itself remove coupling. First check which dependencies the behavior actually needs; then use focused fixtures or helpers for legitimate repeated setup.

      One possible improvement, if checkout mixes responsibilities, is to split it: a `compute_total(cart, tax)` that needs two collaborators, a `charge(payment_gateway, total)` that needs one, plus a thin orchestrator. Each piece is then testable with a 2-line Arrange:

      ```python
      def test_total_includes_tax():
          # Arrange
          cart = Cart(items=[Item(price=20.0)])
          tax = FakeTaxService(rate=0.08)

          # Act
          total = compute_total(cart, tax)

          # Assert
          assert total == 21.60
      ```

      Same domain. Same kind of assertion. *Different production design* — and the test difficulty plummets.

      ✍️ **Active prompt** (write your answer before reading on): a teammate's PR adds a test with 40 lines of Arrange before a single `assert`. Which dependencies are necessary for the intended test scope? What evidence would lead you to simplify the fixture, split a production responsibility, or keep the setup? The wrap-up quiz revisits this judgment.

      ## Part B — Over-specification (the upper bound of oracle strength)

      Step 3 showed that full-dict equality detects incorrect values in every field. It also asserts that no extra fields exist. Now check that additional assumption against the specification when the implementation grows a new output field.

      The same `build_loot_card(name, qty, rarity)` from Step 3 is back in `loot.py` — but the production team has added a `created_at` timestamp to the returned dict for analytics. **The spec hasn't changed.** Every field a caller relies on is still computed correctly. But the test from Step 3 — written with full-dict equality — now fails:

      ```python
      # Step-3-style test (full dict equality):
      def test_legendary_drop():
          result = build_loot_card("Excalibur", 1, "legendary")
          assert result == {
              "name": "Excalibur", "qty": 1, "rarity": "legendary",
              "label": "1× Legendary Excalibur", "is_rare": True,
          }
      # ✗ FAILS — result now also has "created_at": 1730000000
      ```

      The assertion was *too strong*. It pinned the entire output, including fields the spec never promised. That extra precision is the over-specification trap: the test breaks during clean refactors that don't change observable behavior.

      ⚙️ **Task** (`test_loot_overspec.py`): Two tests use full-dict equality. Run them — they fail against the new `build_loot_card` even though every spec-mandated field is correct. Rewrite each test to **assert on exactly the spec-mandated fields** (`name`, `qty`, `rarity`, `label`, `is_rare`) and **not** on `created_at`. When the same refactor (adding a new field) ships next month, your suite stays green.

      💡 **The rule of thumb**: re-read the spec. List the fields it *explicitly* mandates. Assert on each one with `==`. Don't full-equality the whole dict unless the spec promises *exactly that shape and nothing else* — and most specs don't.

      <details markdown="1"><summary>📐 The rule of "no less, no more" — visualized</summary>

      ```mermaid
      flowchart TB
          spec["✅ THE SPEC<br/>(what callers can rely on)"]:::good
          weak["❌ Weak oracle<br/>(asserts LESS than the spec)<br/>misses real bugs"]:::bad
          strong["✅ Right oracle<br/>(asserts EXACTLY the spec)<br/>catches real bugs, survives refactors"]:::good
          overspec["❌ Over-specified oracle<br/>(asserts MORE than the spec —<br/>private state OR unmandated fields)<br/>breaks on clean refactors"]:::bad
          weak --- strong --- overspec
          classDef good fill:#e8f5e9,stroke:#2e7d32,color:#1b5e20
          classDef bad fill:#ffebee,stroke:#c62828,color:#b71c1c
      ```

      "Strong" isn't a one-way arrow. The right oracle sits *exactly* on the spec — anything beyond it is just as harmful as anything below it.
      </details>

      ### 🎓 Coverage ≠ quality

      **Suite A — the same production lines executed, weak oracle:**
      ```python
      def test_total_duration_runs():
          q = PlaylistQueue(); q.add("Espresso", 175); q.add("Vampire", 218)
          assert q.total_duration is not None   # passes for any non-None return
      ```

      **Suite B — the same production lines executed, strong oracle:**
      ```python
      def test_total_duration_sums_track_lengths():
          q = PlaylistQueue(); q.add("Espresso", 175); q.add("Vampire", 218)
          assert q.total_duration == 393
      ```

      If a bug makes `total_duration` return `0`, **Suite A still passes** (`0 is not None`). Suite B catches it. Coverage measures which lines *ran*, not whether you *checked* their behavior. The same logic explains why Step 4's brittle tests passed before the rename: running the assertion is not the same as verifying the right thing.


    files:
