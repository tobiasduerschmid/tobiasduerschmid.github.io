    quiz:
      title: "Step 5 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            **(Spaced review — all steps)** A function ships free for orders **≥ $50** and charges $5 otherwise. Which test pair is the *single most important*?
          type: single
          options:
            - "`order = $25` and `order = $200` — one in the middle of each partition"
            - "`order = $49.99` and `order = $50` — one just below the boundary, one exactly at it"
            - "`order = $0` and `order = $1,000,000` — the extreme edges"
            - "`order = $50` only — one boundary test is enough"
          correct_index: 1
          option_feedback:
            0: "$25 and $200 are deep inside their partitions. They both behave correctly under either `>= 50` or `> 50`, since 25 clearly charges and 200 clearly ships free. Boundary bugs *only* surface at the boundary itself."
            1: "Right. $49.99 and $50 straddle the `>= $50` threshold — the same test-pair structure as the streak bug at day 100. Two values straddling a threshold expose the `>` vs `>=` family of bugs."
            2: "Extreme inputs can catch other faults, but they do not distinguish `>= 50` from `> 50`. Include the threshold itself when checking that operator choice."
            3: "The test at $50 does distinguish `>` from `>=`. Adding $49.99 also checks the charged side, rejecting other faults such as an implementation that always ships free."
          explanation: |
            The boundary is $50. Testing $49.99 (just below) and $50 (exactly at) catches the
            classic `>=` vs `>` off-by-one bug — the same family as the streak_badge bug
            from Step 1.

        - question: |
            A teammate adds `assert result is not None` for `calculate_total()` and says, "Great — the function works." What's the right response?
          type: single
          options:
            - "Agree — the function passes its test, so the function works as intended."
            - "*Weak oracle*: replace `is not None` with `== <expected>`."
            - "Disagree because we don't have 100% line coverage yet for this function."
            - "Disagree — the test is fine but the function name should change."
          correct_index: 1
          option_feedback:
            0: "Tests passing only tells you what their *assertions* held. `assert result is not None` holds for any non-`None` value, including buggy ones. The teammate is reading the **PASS** result and skipping the question of *what was actually verified*."
            1: "Exactly. The fix is to pin the exact expected value with `==`. `is not None` only tells you the function returned *something* — the strong oracle tells you it returned the *right thing*."
            2: "Coverage isn't the issue here — the issue is *oracle strength*. The function might be running with full coverage *and* returning the wrong value entirely; this assertion couldn't tell you. Push back on the assertion, not on coverage."
            3: "The function name might also need work, but that's a separate critique. The immediate problem is that the test doesn't verify the function's behavior in any meaningful way — even a perfect function name wouldn't fix a `is not None` oracle."
          explanation: |
            Weak oracles look productive but verify nothing. The fix is the *strong oracle*:
            pin the exact expected value.

        - question: |
            You need to write your first test for a new function `parse_username(s)`. The spec: accept usernames of length 3–20, reject everything else.

            What is your **first step** when designing the test suite?
          type: single
          options:
            - "Open `parse_username`'s source code and write assertions that confirm each code path runs"
            - "Write `assert parse_username('alice') is not None` — if it runs without crashing, the function works"
            - "Identify partitions and boundaries from the spec; pick boundary inputs and one per partition"
            - "Start with a single test using a random username and check if it passes"
          correct_index: 2
          option_feedback:
            0: "Starting from the implementation makes your tests confirm what the code *does*, not what it *should* do — the same post-hoc trap from Step 1. Start from the spec: identify the partitions, then find the boundaries."
            1: "`is not None` is the canonical weak oracle: it passes for any non-`None` return, including wrong values. You've replaced it with strong `==` assertions precisely to avoid this."
            2: "Exactly. Partition `s` by length: too-short (< 3), valid (3–20), too-long (> 20). The boundaries sit at lengths 2, 3, 20, 21. Pick one representative per partition plus those four boundary values — that's the Step 2 method applied cold."
            3: "A single random test is equivalent to one middle-of-partition sample — it misses all boundaries. The skill from Step 2 is to choose inputs *deliberately*, not arbitrarily."
          explanation: |
            Start from the spec, not the implementation. Partition `s` by length:
            too-short (< 3), valid (3–20), too-long (> 20). Test boundary values 2, 3, 20, 21
            and one representative in the middle. That's the Step 2 method applied directly
            to a new function — no peeking at the implementation required.

        - question: |
            **(Spaced review — Step 4)** You rename a private attribute `_cache` to `_store` in a class without changing any public method behavior. Three tests break immediately.

            What does this tell you?
          type: single
          options:
            - "The rename introduced a bug — renaming always risks changing behavior"
            - "Those tests read `_cache` directly — they test implementation, not behavior"
            - "You should revert the rename to restore the previously passing tests"
            - "Private attributes must never be renamed once a release has shipped"
          correct_index: 1
          option_feedback:
            0: "The question specifies 'without changing any public method behavior' — behavior is unchanged by definition. Failures after a pure rename signal the tests themselves are the problem, not the rename."
            1: "Correct. Tests that read or write private members (`_cache`, `_tracks`, `_data`) break the moment those internals are renamed or restructured — even when no behavior changes. This is the Refactoring Litmus Test: if a pure internal refactor breaks tests, those tests are brittle."
            2: "Reverting a sound refactor because tests are brittle inverts the correct response. The refactor is valid; the tests are the problem. Rewrite the broken tests to verify behavior through the public API."
            3: "There's no such rule — private attributes can and should be renamed freely as designs evolve. The issue is not the rename but the tests that depend on the old name instead of the public contract."
          explanation: |
            A pure refactor (no behavior change) should never break well-written tests.
            If it does, the broken tests were coupled to internal implementation details.
            Rewrite them to assert on observable behavior through the public API — then the
            same refactor (or any future one) leaves the suite green.
