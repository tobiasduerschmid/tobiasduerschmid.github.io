      questions:

        - question: |
            Which file name will pytest **automatically discover** as a test file?
          type: single
          options:
            - "`testing_squad.py`"
            - "`test_squad.py`"
            - "`check_squad.py`"
            - "`squad_tests.py`"
          correct_index: 1
          option_feedback:
            0: "pytest discovers files starting with `test_` (note the underscore) or ending with `_test.py`. `testing_squad.py` matches *neither* pattern — pytest will silently skip it."
            1: "Correct. `test_squad.py` starts with `test_` and ends with `.py` — it matches the discovery rule. Functions inside must also start with `test_`."
            2: "There's no convention `check_*` in pytest. The discovery rule is `test_*` prefix or `*_test.py` suffix only."
            3: "Close — but pytest looks for `*_test.py` (singular) or `test_*` prefix. `squad_tests.py` (plural \"tests\") doesn't match either."
          explanation: |
            pytest discovers files whose names start with `test_` or end with `_test.py`.
            Functions inside must also start with `test_`.

        - question: |
            A function accepts **whole-dollar integer order amounts only**. Its spec reads: *"A discount applies for orders of strictly more than $50 and up to $500 inclusive."*

            Which four values are the **most important** boundaries to test?
          type: single
          options:
          - $0, $50, $100, $500 — round numbers at each end of the range
          - $50, $51, $500, $501 — the two integer values straddling each eligibility boundary
          - $1, $25, $250, $1000 — one sample from each quartile to get wide coverage
          - $49.99, $50.01, $499.99, $500.01 — cents around each boundary to check decimal precision
          correct_index: 1
          option_feedback:
            0: $0 and $100 sit deep inside the *no-discount* and *yes-discount* partitions — they don't pin down where the boundaries are. The spec defines the discount cutoffs at $50 (`>` flips) and $500 (`≤` flips); your boundary tests must straddle those exact values.
            1: Correct. $50/$51 straddles the `> $50` flip and $500/$501 straddles the `≤ $500` flip — one just-below and one at-or-just-above each boundary, which is exactly where `>` vs `>=` bugs surface.
            2: This is "spread your bets across the input range" — useful for a smoke test, useless for catching off-by-one bugs. Off-by-one bugs *only* manifest at the boundary itself; quartile samples will all behave correctly even when the comparison operator is wrong.
            3: These cent-valued inputs are outside this question's integer domain. For a cents-based API, use adjacent cent values instead, including the exact cutoff values.
          explanation: |
            Test *just on each side* of every boundary: 50/51 (where `> 50` flips) and 500/501
            (where `≤ 500` flips). Catches the canonical off-by-one (`>= 50` vs `> 50`).

        - question: |
            A developer's test suite has 12 tests for `squad_name_valid`. Every test uses a name of length 5, 6, 7, or 8. All tests pass. Can you trust the suite?
          type: single
          options:
            - "Yes — 12 tests is plenty of coverage, and they all exercise the function with realistic inputs"
            - "No — every test is in the middle of one partition. Boundaries and invalid inputs are untested"
            - "Yes — as long as the tests pass, the function is guaranteed correct for all inputs in the tested range"
            - "No — 12 tests is too few for any real function; you need at least 50 tests to be confident"
          correct_index: 1
          option_feedback:
            0: "Test *count* is not a measure of test *quality*. 12 tests in the same partition is roughly equivalent to one test repeated 12 times — they all hit the same code path and miss the same bugs. One boundary test catches more than ten middle-of-partition tests."
            1: "Right. All 12 tests cluster in the middle of the valid partition (lengths 5–8). The boundaries at 2, 3, 12, and 13 are entirely untested — a `len < 12` bug instead of `len <= 12` would pass every test and slip to production."
            2: "Passing tests prove the function works *for the inputs tested*, never for inputs the suite never exercises. The classic boundary bug at length 12 (`len < 12` instead of `len <= 12`) sits *exactly* in the gap this suite leaves uncovered."
            3: "There's no magic test-count threshold for confidence. A 5-test suite with one test per partition + boundary will catch more bugs than a 50-test suite that all clusters in the middle. Quality of input choice beats quantity."
          explanation: |
            The tests cover the middle of *one* partition only. A bug like `len < 12` instead of
            `len <= 12` would pass all 12 tests but fail in production at length 12. One test per
            boundary catches far more bugs than many tests clustered in the easy middle.

        - question: |
            An equivalence partition is:
          type: single
          options:
            - "A set of inputs that the function processes in parallel on multi-core hardware"
            - "A set of inputs that all produce the same *kind* of behavior"
            - "A set of inputs that are mathematically equal (e.g., `1.0` and `1`)"
            - "A sub-range of inputs created by dividing the domain into equal-sized chunks"
          correct_index: 1
          option_feedback:
            0: "This is conflating *partition* (a testing concept — a group of inputs with the same expected behavior) with *parallelism* (a runtime concept — work happening simultaneously). The two ideas have nothing in common; the word \"partition\" is overloaded across CS subfields."
            1: "Correct. Inputs that all produce the same kind of behavior form one equivalence partition — testing one representative per partition is enough for the *middle*, and you spend your test budget on the *boundaries* between partitions."
            2: "Mathematical equality (`1.0 == 1`) is about value, not about *behavioral expectation*. Equivalence partitioning groups inputs that should *behave the same* under the function — different values can still be in the same partition (e.g. `\"alice\"` and `\"bob\"` are both length-5 valid usernames)."
            3: "This describes equal-width binning (a statistics concept). Equivalence partitions are defined by *behavioral boundary* — wherever the function's output classification flips — not by chopping the domain into uniform chunks."
          explanation: |
            Equivalence partitions group inputs by *expected behavior*, not by value. If `"abc"`
            is accepted, `"abcd"` almost certainly is too — same partition. Spend your test
            budget on the *boundaries between* partitions, not the middles.

        - question: |
            **(Spaced review — Step 1)** Recall the bug in `streak_badge`: `days > 100` instead of `days >= 100`. Which is the **most specific supported** classification of this bug?
          type: single
          options:
          - A type error — `days` should be a float but is being compared as an integer
          - A boundary bug — it fails only at one exact value on a partition edge
          - A logic error — the wrong branch of the `if` statement is being taken
          - A regression — the function worked correctly before someone introduced the bug
          correct_index: 1
          option_feedback:
            0: 'The type is not the issue here: `days` is compared as an integer in both the spec (`>= 100`) and the buggy code (`> 100`). The bug is in the comparison operator.'
            1: Correct. The bug only surfaces at exactly `days == 100` — the single boundary value where the `> 100` operator gives the wrong answer. That one-specific-value signature is the definition of a boundary bug.
            2: 'This is also a logic error, but boundary bug is more specific: only the equality case at 100 changes behavior.'
            3: A regression is a loss of previously working behavior; it need not be a recurrence of a previously fixed bug. The stem gives no version history, so it does not establish a regression.
          explanation: |
            Boundary bugs manifest only at the exact value where partitions meet.
            `days > 100` works for 101, 150, 365 — but fails at 100 itself. This is exactly
            the kind of bug that Boundary Value Analysis is designed to expose, and it
            is why you test values *just on each side* of every boundary in a spec.


  # --------------------------------------------------------------------------
  # STEP 3 — Oracle Strength: Strong, Weak, and the Liar Test
  # Pedagogy:
  #   Bridge from Step 2  — `is True` was a strong oracle for booleans;
  #                         now generalize to any return type.
  #   Variation Theory    — three flavors of weak oracle (presence/type/field)
  #                         held against the SAME function and SAME inputs, so
  #                         the only thing that varies is assertion shape.
  #   Liar test heuristic — weak oracles are productive-looking but verify
  #                         almost nothing.
  #   Setup for Step 4    — strong oracles win up to a ceiling (the spec).
  #                         Step 4 reveals the over-specification trap.
  # --------------------------------------------------------------------------
  - title: "Oracle Strength: Strong, Weak, and the Liar Test"
    instructions: |
      ### Why this matters

      In Step 2 you wrote `assert squad_name_valid("epic") is True`. That's a *strong* oracle on a Boolean: only the `True` singleton satisfies it, so any wrong return — `False`, `1`, `"yes"` — fails the test. For richer return types (numbers, strings, lists, dicts), it's much easier to write an assertion that *looks* productive but lets wrong answers slip through. This step makes the difference between strong and *deceptively* weak oracles concrete.

      ### 🎯 You will learn to

      - Analyze an assertion to spot the three weak-oracle anti-patterns: presence, type, and single-field.
      - Apply the strong-oracle form (`assert result == <exact expected value>`) to any return type so wrong values fail loudly.
      - Evaluate whether a passing test actually verifies the spec or merely looks like it does.

      Today's function returns something richer than a Boolean — a **dict**. Open `loot.py` and read the spec. `build_loot_card(name, qty, rarity)` returns a five-field dict: `name`, `qty`, `rarity`, `label`, `is_rare`. The test surface is bigger now — and that's exactly where weak oracles get tempting.

      🔍 **Predict first.** Open `test_loot.py`. Three tests are written and **all three pass** against the current code. Don't run them yet. For each one, ask: *"If a bug made `build_loot_card` return a slightly wrong dict, would this assertion catch it?"* Hold your three answers — you'll check them against the table below.

      ### 📖 Oracle strength — three flavors of weak

      The **oracle** is the assertion that decides pass/fail. The same function call can be checked at very different strengths. Watch the same input — `build_loot_card("Healing Potion", 3, "common")` — under four assertions:

      | Strength | Assertion | What still passes (i.e., what it *misses*) |
      |---|---|---|
      | **Weak — presence** | `assert "name" in result` | Any dict with a `name` key. `{"name": "Wrong Name", ...}` passes. |
      | **Weak — type** | `assert isinstance(result, dict)` | Any dict whatsoever. `{}` passes. |
      | **Weak — single-field** | `assert result["is_rare"] is False` | The other four fields could all be wrong. |
      | **Strong — full equality** | `assert result == {"name": "Healing Potion", "qty": 3, "rarity": "common", "label": "3× Common Healing Potion", "is_rare": False}` | Only that exact dict satisfies it; it also rules out any extra fields. |

      Each weak form is satisfying to write — the test reports **PASS** — and each verifies almost nothing. That's the **Liar test** anti-pattern: an assertion that *looks* like a test but lies about how thoroughly the function was checked. Rushed engineers and AI assistants gravitate to weak oracles because they almost always pass. The cost shows up later, when a real bug ships and the passing test couldn't have caught it.

      Notice what the table holds constant: same function, same inputs. Only the **assertion** varies. That's the dimension you're learning here — and it lives independently of *which inputs to pick* (Step 2's lesson). A great test gets both right.

      ⚙️ **Task — strengthen the three weak oracles** (file: `test_loot.py`):

      Each test starts with a different flavor of weak oracle. Your job for each:

      1. **Read the spec** in `loot.py` — the docstring lists the five fields and the rule for each.
      2. **Compute** what the dict should be for the test's specific inputs (compute `label` and `is_rare` yourself from the rule).
      3. **Replace** the weak assertion with checks for all five spec-mandated field values. Full-dict equality is concise, but also asserts that there are no extra fields; field-by-field checks avoid that extra assumption.

      💬 **Required:** Above each new strong oracle, add a Python comment in this form:
      ```python
      # Weak version (___) would also pass for: ___
      ```
      Name the *flavor* of the original weak oracle (presence / type / single-field) and a specific *wrong dict* the weak oracle would have accepted. This forces the Liar-test pattern into your hands — you can't write the comment without seeing what the weak form misses.

      <details markdown="1"><summary>🧠 Why a *dict* makes the contrast visible (and an int doesn't)</summary>

      Imagine the function returned a single integer — say `3`. The weak forms are still definable (`assert result is not None`, `assert isinstance(result, int)`), but the strong form (`assert result == 3`) feels trivial: of course you write the answer.

      A dict has *structure*. The output has five fields, each with its own correctness condition. That structure is what makes weak oracles tempting and deceptive: an `assert "name" in result` looks like *real* testing — there's a key reference, a substantive-looking check — but it accepts thousands of different wrong dicts. The richer the return type, the more disciplined the oracle has to be. Dicts, lists, and formatted strings are where weak oracles do the most damage in real codebases.
      </details>

      <details markdown="1"><summary>📖 Why pytest beats raw <code>assert</code></summary>

      Raw `assert` halts at the first failure; you only learn about one bug at a time. pytest discovers all tests, runs them all, names each one, and shows the *exact* mismatched value when one fails — e.g. `assert {...} == {...}`, with the differing keys highlighted. For a dict-returning function, that diff is gold: you immediately see *which field* is wrong, which is far more debuggable than a generic `AssertionError`.
      </details>

      > 🔭 **Coming in Step 4:** Strong oracles beat weak ones — but is the *strongest possible* oracle always the right answer? You'll see what happens when "I pinned the entire output" goes a step too far, and how the right oracle sits *exactly* on the spec, no less *and* no more.


    files:
      - path: "loot.py"
        reseed: true
        content: |
          """Loot card generator — Diablo / Borderlands / Genshin Impact style."""


          def build_loot_card(name: str, qty: int, rarity: str) -> dict:
              """Create the inventory card for a piece of loot.

              Spec (the public contract — what callers can rely on):
                name    -> the input name, unchanged
                qty     -> the input qty, unchanged
                rarity  -> the input rarity, lowercased
                label   -> "{qty}× {Rarity-capitalized} {name}"
                is_rare -> True if and only if rarity is "rare", "epic", or "legendary"
              """
              normalized = rarity.lower()
              return {
                  "name": name,
                  "qty": qty,
                  "rarity": normalized,
                  "label": f"{qty}× {rarity.capitalize()} {name}",
                  "is_rare": normalized in {"rare", "epic", "legendary"},
              }
        language: "python"

