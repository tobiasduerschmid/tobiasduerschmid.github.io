    quiz:
      title: "Step 4 — Knowledge Check"
      min_score: 0.8
      shuffle: true
      questions:

        - question: |
            A `UserProfile` class stores user data. Two tests check that a name is stored after creation. Which test is **more robust**?

            **Test A:**
            ```python
            def test_a():
                profile = UserProfile("alice")
                assert profile._data["name"] == "alice"
            ```

            **Test B:**
            ```python
            def test_b():
                profile = UserProfile("alice")
                assert profile.get_name() == "alice"
            ```
          type: single
          options:
            - "Test A — directly reading the storage is the most reliable way to verify the value was saved"
            - "Test B — it goes through the public API; Test A breaks if the storage key changes"
            - "Both are equally robust since both assertions check the same underlying fact"
            - "Neither — storing a name should be tested by checking the return value of the constructor itself"
          correct_index: 1
          option_feedback:
            0: "Direct storage access (`_data`) is exactly the brittleness we saw with `_tracks`. The underscore signals 'implementation detail.' The day someone renames `_data` to `_store`, or changes the structure, Test A breaks even though the observable behavior (you can retrieve the name you stored) is unchanged."
            1: "Right. Test B verifies through the public contract (`get_name()`). Internal storage can be restructured freely without breaking it. Test A is coupled to `_data` — a pure rename breaks it even when behavior is unchanged."
            2: "They differ fundamentally under refactoring. Test A is coupled to the dict structure `_data[\"name\"]`. Test B is coupled only to the observable contract: 'after creating a profile with \"alice\", `get_name()` returns \"alice\".' One breaks during internal restructuring; the other survives it."
            3: "Calling `UserProfile(...)` returns an instance; its `__init__` method must return `None`. Merely checking that an instance exists does not verify the stored name. Read that behavior through `get_name()`."
          explanation: |
            Test A peeks at `_data`, an internal implementation detail. If someone refactors
            `UserProfile` to store data differently, Test A breaks — even though the behavior
            is unchanged. Test B tests through the public method `get_name()`, which is the
            contract the class makes with callers. The Refactoring Litmus Test: does it
            survive a pure internal refactor? Test B does. Test A does not.

        - question: |
            You change a function's internal sorting algorithm without changing any specified behavior (return values, exceptions, or side effects). Two deterministic tests break only because they inspect the old internal representation. What does this tell you?
          type: single
          options:
          - The refactoring introduced a bug — changing the algorithm likely changed the output in a subtle way
          - The broken tests check implementation details, not behavior. Rewrite them to assert on outputs
          - You should revert the refactoring since passing tests must never be broken, even temporarily
          - The tests are too strict — you should lower the assertion precision or add tolerance margins
          correct_index: 1
          option_feedback:
            0: The premise says all specified behavior is preserved and locates the failure in checks of the old representation.
              Those tests are coupled to the implementation.
            1: Correct. Tests breaking on a pure refactor are the diagnostic signature of brittle tests — they're coupled
              to the implementation (internal variable names, algorithm choice) rather than the observable behavior. Rewrite
              them; keep the refactor.
            2: Reverting a sound refactor because *the tests* are too tightly coupled inverts who's in charge. The refactor
              is correct; the tests are the problem. Keep the refactor, fix the tests to assert on observable behavior,
              and you end up with cleaner code *and* a stronger suite.
            3: Loosening assertions or adding tolerance is exactly the wrong direction — that hides the brittleness rather
              than fixing it. The tests aren't *too strict* in what they assert; they're asserting on *the wrong thing*
              (implementation, not behavior). Rewrite, don't dilute.
          explanation: |
            If the function's behavior (inputs → outputs) is unchanged but tests break,
            those tests are coupled to the implementation. The fix is to rewrite the tests
            to assert on observable behavior, not internal details.

        - question: |
            A test you wrote needs **40 lines of setup code** before the single `assert` statement. What is this test telling you?
          type: single
          options:
          - Nothing — large setups are fine as long as the assertion verifies the right thing in the end
          - The large Arrange section is a reason to inspect production dependencies and the scope of this test
          - You should move the setup into a helper function so the test file looks shorter; the underlying design is fine
          - You should add more assertions to make the heavy setup feel justified — one assert is not enough for 40 lines
            of arrangement
          correct_index: 1
          option_feedback:
            0: Passing verifies the asserted outcome, but setup cost can still reveal unnecessary coupling. Investigate
              before accepting it as inevitable.
            1: Yes. Many dependencies may indicate a production responsibility worth splitting, an unnecessarily broad test,
              or legitimate integration setup. The line count alone cannot decide which.
            2: A helper can reduce legitimate duplication, but hiding lines does not establish that all dependencies are
              needed. Inspect the test scope and responsibilities first.
            3: Add assertions because they check relevant behavior, not to justify setup length. First investigate why the
              setup is necessary.
          explanation: |
            Excessive Setup is a signal to investigate, not a diagnosis by line count. Consider production responsibilities, test scope, and necessary fixtures before choosing a repair.

        - question: |
            Two suites call the same function with the same inputs and execute the same production lines. Suite A checks only `assert result is not None`; Suite B checks the correct expected value for each input. Which statement is correct?
          type: single
          options:
          - Suite A is stronger — accepting any non-None value makes tests more resilient
          - Suite B rejects incorrect non-None results that Suite A accepts
          - Both are equally strong — both execute the function, which is all that matters for catching bugs
          - Neither is strong — industry standard is ≥95% coverage AND mutation testing, so anything less is unacceptable
          correct_index: 1
          option_feedback:
            0: Accepting incorrect results is weak detection, not useful resilience. Robust tests tolerate permitted implementation
              changes while rejecting wrong specified behavior.
            1: Correct. The inputs and executed lines are held constant. Exact expected-value assertions reject wrong values
              that a presence check accepts.
            2: 'Calling the function is not enough: the assertion determines which wrong results the test detects.'
            3: No universal coverage percentage decides this comparison. The stated difference is the strength of the assertions
              on the same inputs.
          explanation: |
            Coverage reports which production lines ran. Here both suites run the same lines; the stronger assertions distinguish correct results from incorrect non-None results. This does not establish how either suite handles inputs it never exercises.

        - question: |
            A function `build_user_profile(name, age)` has this spec:

            > Returns a dict with `name` (input), `age` (input), and `is_adult` (True if and only if age ≥ 18).

            The current implementation also returns a `cached_at` timestamp for internal caching. The spec doesn't mention `cached_at`. Which assertion is **right** — strong on the spec but not over-specified?
          type: single
          options:
            - "`assert build_user_profile(\"alice\", 30) is not None` — survives any future change"
            - "`assert build_user_profile(\"alice\", 30) == {\"name\": \"alice\", \"age\": 30, \"is_adult\": True, \"cached_at\": 1730000000}` — pins everything"
            - "`assert result[\"name\"] == \"alice\"`, `assert result[\"age\"] == 30`, `assert result[\"is_adult\"] is True` — one assert per spec-mandated field"
            - "`assert isinstance(build_user_profile(\"alice\", 30), dict)` — the type guarantee is enough"
          correct_index: 2
          option_feedback:
            0: "`is not None` is the weak-oracle Liar — any dict, including a wrong one, passes. The 'survives any future change' framing is exactly the trap: a test that survives every change because it asserts almost nothing isn't robust, it's empty."
            1: "This is the over-specification trap. `cached_at` is *not in the spec* — it's an internal caching detail. Pinning it means the test fails every time the cache fires (i.e., every second), even though every spec-mandated field is correct."
            2: "Right. Three asserts, one per spec-mandated field. `cached_at` is unspecified, so we don't pin it. The test stays green when the cache implementation evolves and red when any spec-mandated field regresses."
            3: "Type checks are medium oracles — they catch wrong types, never wrong values. `build_user_profile(\"alice\", 30)` could return `{\"name\": \"bob\", \"age\": 0, \"is_adult\": False}` and `isinstance(..., dict)` is happy. The right oracle pins each spec-mandated field."
          explanation: |
            The right oracle sits *exactly* on the spec — no less (weak/medium), no more
            (over-specified). Field-by-field equality on spec-mandated fields catches
            real regressions and survives changes to unspecified internal fields like
            `cached_at`.

        - question: |
            **(Spaced review — Step 3)** Which assertion is the *strongest* oracle for `compute_total([1.50, 2.00])`?
          type: single
          options:
            - "`assert compute_total([1.50, 2.00]) is not None`"
            - "`assert isinstance(compute_total([1.50, 2.00]), float)`"
            - "`assert compute_total([1.50, 2.00]) > 0`"
            - "`assert compute_total([1.50, 2.00]) == 3.50`"
          correct_index: 3
          option_feedback:
            0: "`is not None` is the canonical *weak oracle*. Any non-`None` return passes — `0.0`, `\"banana\"`, `[]`. It tells you the function returned *something*, not whether it returned *the right thing*."
            1: "Type checks catch type errors only. The function could return `42.0` (wrong sum) and `isinstance` is happy. Step 3 named this the *medium-strength* oracle — better than `is not None`, still wrong-value-blind."
            2: "`> 0` is a property check, not a value check. The function could return `0.01`, `42.0`, `1000000.0` — all positive, all wrong. Property assertions are useful when you genuinely don't know the exact expected value, but for a deterministic function whose answer you can compute, pin the value."
            3: "Exactly. `== 3.50` is the only strong oracle here — any wrong return value (`0.0`, `1.5`, `42.0`) would fail it. The other options accept large families of wrong answers."
          explanation: |
            A strong oracle pins the exact expected value — only `3.50` satisfies it. The
            others would still pass if the function returned `0.0`, `42.0`, or any positive
            float — exactly the *Liar test* anti-pattern from Step 3.

        - question: |
            **(Spaced review — Step 2)** For a function `charge_fee(amount)` with rule *"fee is 2% if amount is 100 or more, else free"*, which test pair exposes the most bugs?
          type: single
          options:
            - "`amount = 50` and `amount = 200` — one value on each side, well away from the boundary"
            - "`amount = 99` and `amount = 100` — straddle the boundary, catching `>` vs `>=` off-by-ones"
            - "`amount = 0` and `amount = 1000000` — extreme values at the edges of the representable range"
            - "`amount = 1` and `amount = 2` — two adjacent low values to check precision at the small end"
          correct_index: 1
          option_feedback:
            0: "$50 and $200 are both *deep inside* their partitions — both will pass under either `> 100` or `>= 100`, since 50 is clearly free and 200 clearly charges the fee. Boundary bugs *only* manifest at the boundary; values away from it never expose them."
            1: "Right. 99 and 100 straddle the `>= 100` threshold. The canonical boundary bug here is `> 100` vs `>= 100` — it produces the wrong answer at exactly `amount = 100` and nowhere else."
            2: "Extreme-value tests catch overflow / representation bugs (rare in this kind of spec) but completely miss the off-by-one risk at $100. The most common bug here — confusing `>= 100` with `> 100` — produces correct behavior at $0 and $1,000,000. You'd ship the bug."
            3: "$1 and $2 are both in the *same partition* (free), so they verify the same path twice and never approach the boundary. This is the same anti-pattern as the Step 2 quiz: many tests crowded in one partition is roughly one test repeated."
          explanation: |
            The boundary is at 100. Testing 99 and 100 catches the canonical off-by-one
            (`> 100` vs `>= 100`). Picking values far from the boundary misses exactly
            the bugs that Boundary Value Analysis is designed to expose.

        - question: |
            **(Spaced review — Step 2)** A test reads `assert is_age_valid(18) == True`. A colleague says to use `is True` instead. What is the reason?

            ```python
            # Option A (current):
            assert is_age_valid(18) == True

            # Option B:
            assert is_age_valid(18) is True
            ```
          type: single
          options:
            - "No difference — `== True` and `is True` behave identically for Boolean-returning functions"
            - "`is True` rejects truthy non-Booleans like `1`; `== True` accepts them (`1 == True`)."
            - "`is True` is faster at runtime, which matters in large test suites"
            - "`== True` is a syntax error in pytest; `is True` is the required form"
          correct_index: 1
          option_feedback:
            0: "They behave the same *if the function returns exactly `True` or `False`*. But if someone refactors `is_age_valid` to return `1` (truthy but not Boolean), `== True` still passes (`1 == True` is `True` in Python) while `is True` fails. For a function whose contract is 'returns Boolean', that's the gap you want covered."
            1: "Correct. `is True` uses identity — only the exact `True` singleton passes. `== True` uses equality — `1 == True` evaluates to `True` in Python, so truthy non-Booleans slip through. For specs that say 'returns Boolean', `is True` is the precise form."
            2: "Runtime performance is not the reason. The reason is oracle precision: `is` checks identity (is this the exact `True` object?), while `==` checks equality (is this value equal to `True`?). For booleans these differ on truthy non-Boolean values."
            3: "`== True` is valid pytest syntax. The distinction is about precision, not syntax. Both forms compile and run; only their bug-catching power differs."
          explanation: |
            `is True` uses identity comparison — only the literal `True` object passes.
            `== True` uses equality — `1`, `True`, and any value where `v == True` all pass.
            For functions whose spec says "returns a Boolean", use `is True` / `is False`
            so the test catches both wrong values *and* wrong return types.


  # --------------------------------------------------------------------------
  # STEP 5 — Putting It All Together
  # Pedagogy:
  #   Variation Theory FUSION  — partitions + oracles + behavior in one task.
  #   Dehaene Pillar 4         — consolidation: name what changed.
  #   Transfer test            — novel domain forces generalization.
  #   Metacognitive prompt     — self-monitoring of skill gaps.
  # --------------------------------------------------------------------------
  - title: "Putting It All Together"
    instructions: |
      ### Why this matters

      Steps 1–4 each isolated one dimension of test design: behavior specification, partition choice, oracle strength, and testing the spec no-more-no-less. Real test design weaves all four together on every new function you encounter. This step lets you fuse them on a brand-new spec — designing a complete suite from scratch and feeling the four skills compose.

      ### 🎯 You will learn to

      - Create a complete test suite for an unfamiliar function from scratch — partitions, representative inputs, and strong oracles.
      - Evaluate your own suite against deliberately broken implementations to confirm each partition is actually probed.

      ✍️ **Before reading on, write your own recap.** In one or two sentences each, answer from memory (no scrolling back):

      1. What did Step 1 teach you about *what tests are for*?
      2. What did Step 2 teach you about *which inputs to pick*?
      3. What did Step 3 teach you about *the assertion*?
      4. What did Step 4 teach you about *what to assert — and what NOT to assert*?

      Write all four sentences *before* expanding the disclosure below — the comparison is only useful if you retrieved first, not read first.

      Once you've written your four sentences, expand the box below and compare. If your version names the same ideas in different words, you've consolidated the schema. If a step is fuzzy, that's where to revisit.

      <details markdown="1"><summary>📖 Compare with our recap</summary>

      - **Step 1 — what tests are for**: tests are *executable specifications of behavior* and a *safety net* against regressions, not "checking your homework."
      - **Step 2 — which inputs to pick**: partition the input space, then test the *boundaries* between partitions — the places where inclusivity and threshold mistakes can appear.
      - **Step 3 — the assertion**: oracle strength is one independent dimension. A strong oracle pins exactly what the spec mandates; weak oracles pass for almost any return.
      - **Step 4 — what to assert against**: the spec, no less *and no more*. Don't peek at private state (internal coupling), and don't pin output fields the spec doesn't mandate (over-specification). Robust tests survive refactors.

      The skill underneath all four: *making the gap between what code does and what it should do visible and automatic*.
      </details>

      ⚙️ **Final challenge** — `streaming.py` defines `streaming_price(price, plan)` — the kind of pricing logic Spotify, Netflix, and YouTube Premium actually run:

      | `plan` | Discount |
      |---|---|
      | `"student"` | 50% off |
      | `"family"` | 30% off |
      | anything else | none |

      > 🔒 **You are writing tests for a fixed function — don't modify `streaming.py`.** The validator runs your tests *not* against the `streaming.py` you can see, but against a hidden reference implementation **plus deliberately broken versions** (missing discounts, a wrong percentage in either discount branch, and a wrong result for unknown plans). To get full credit, your suite must:
      >
      > - **pass** against the reference (your assertions match the spec), AND
      > - **fail** against each broken version (your tests actually probe each partition).
      >
      > That's the working definition of "your tests cover the partitions" — they catch bugs in each one. If a check fails, the message names *which* broken version your suite missed, so you know which partition to add a test for.

      In `test_streaming.py`, **design a test suite from scratch**:

      1. **Articulate first** *(before any code)*: at the top of `test_streaming.py`, write a comment listing the partitions you see in the spec, like this:
         ```
         # Partitions of plan:
         # 1) ...
         # 2) ...
         ```
         Self-check that your comment names every behavior in the table. The automatic checks assess your executable tests; a comment alone cannot demonstrate the reasoning.
      2. Pick a representative input for each partition.
      3. For each input, **compute** the expected return value and write a test with a **strong oracle** (an exact `==` on the computed value, not an `is not None` check).

      You are now applying everything from Steps 1–4: behavior specification (1), partitions (2), oracle strength (3), and testing the spec — no more, no less (4).

      💡 **No numeric range, so no boundary values — but partitions still apply.** Step 2's boundary heuristic needed an *ordered* domain: lengths, ages, scores. Here `plan` is categorical — `"student"`, `"family"`, anything else — no numeric ordering, so there are no `>=` / `>` comparison operators and therefore no off-by-one boundary values to probe. But equivalence partitioning still applies: you test one representative per category. This is a Separation of two ideas you've used together: boundaries are a *special case* of partitioning that kicks in only when the domain is ordered.

      Ask yourself: for `streaming_price`, are there any "edge-of-category" inputs worth testing beyond the three named categories? What about an unexpected string like `"premium"`, or an empty string `""`? These are the categorical equivalents of boundary probing — checking the edges of the decision logic for inputs the spec doesn't explicitly name.

      💡 **Two-parameter functions:** When a function takes two parameters, partition each dimension independently, then pick deliberate combinations — not all combinations (that grows exponentially), but enough to represent each partition at least once. Here, use a nonzero representative price (e.g., 20) across the plan tests: at zero, both a missing discount and a correct discount return zero, so the input would hide the difference. If `price` had its own threshold (e.g., "discount only for orders ≥ $5"), you'd apply boundary testing to that dimension too.

      💡 **Floating-point equality:** When the expected value is computed by multiplication (e.g., `20 * 0.50`), standard `==` usually works for simple fractions, but for arbitrary floats use `assert result == pytest.approx(expected)` to avoid rounding surprises (e.g., `assert streaming_price(13.99, "student") == pytest.approx(6.995)`).

      🪞 **Recalibrate**: Rate your confidence in designing a test suite from scratch, then compare that feeling with evidence: can you explain which bug each test catches? Confidence is a self-report, not a measure of learning. Use the optional new practice problem below to check independent performance.

      🧭 **Threshold check** — compare then and now: look back at the first test you encountered in Step 1. What did that test *specify* about the function? Now look at the tests you just wrote. What do they *specify*? Write one sentence naming what changed in how you think about what a test is *for*. Then explain *why* that shift matters for the next function you write — what will you do differently tomorrow that you wouldn't have done before this tutorial?

      ### 🪞 Two independent dimensions of test design

      Across this tutorial, two *separate* dimensions of test design have been mixed together. Naming them apart makes both clearer:

      ```mermaid
      flowchart LR
          subgraph Dim1["DIMENSION 1 — what to test (input choice)"]
              direction TB
              D1A["Boundaries<br/>partition transitions"]
              D1B["Representative<br/>middle of partition"]
              D1C["Special cases<br/>empty, None, zero"]
          end
          subgraph Dim2["DIMENSION 2 — how strong the assertion (oracle)"]
              direction TB
              D2A["Strong<br/>== exact value"]
              D2B["Medium<br/>type / range check"]
              D2C["Weak<br/>is not None"]
          end
          Dim1 -.->|"a good test<br/>gets BOTH right"| Dim2
      ```

      A test can be *strong on input choice* (boundary-aware) but *weak on oracle* (`is not None`) — and vice versa. **Excellence is the cross-product**: pick a meaningful input *and* assert the precise expected outcome. That's why the streaming-price task above checks both partitions covered AND oracles strong.

      <details markdown="1"><summary>🧰 When to reach for which technique (a quick decision guide)</summary>

      You'll meet new functions in the wild. Use this to decide which testing tool to pull out:

      | If the function… | Reach for… | Pattern from |
      |---|---|---|
      | Takes a numeric input with a valid range (`min ≤ x ≤ max`) | **Boundary value analysis** — test `min-1, min, max, max+1` | Step 2 |
      | Takes an input from a small set of categories (`"student"`, `"family"`, …) | **Equivalence partitioning** — one test per category | Step 2 + Step 5 |
      | Returns a value (vs. mutates state) | **Strong-oracle equality** — `assert result == expected` | Step 3 |
      | Returns a float computed by multiplication/division | **`pytest.approx`** — `assert result == pytest.approx(expected)` to avoid floating-point rounding surprises | Step 3 + real projects |
      | Should raise an exception for certain inputs | **`pytest.raises`** — `with pytest.raises(ValueError): func(bad_input)` | Next tutorial |
      | Returns a dict / record | **Field-by-field equality on spec-mandated fields only** — `assert result["price"] == 5` for each field the spec names. Don't full-equality the whole dict (over-specification: it breaks when an unrelated field gets added) | Step 4 |
      | Returns a list | **Collection equality** — `assert result == [1, 2, 3]`; for order-independent: `assert sorted(result) == sorted(expected)` | Step 3 + real projects |
      | Mutates an object's state | **Public API behavior tests** — `obj.observable() == expected` | Step 4 |
      | Has internal state you're tempted to peek at | **Don't.** Add a public method instead, then test through it | Step 4 |
      | Is "trivial" and you think it doesn't need a test | It deserves at least one regression test — *today's* trivial is *tomorrow's* surprise dependency | from research |

      Most real functions hit several rows at once. Apply them all.
      </details>

      <details markdown="1"><summary>🎲 Want unguided practice on a different shape of function?</summary>

      The graded exercise above is `streaming_price`. Once you've completed it, try the same approach on one of these *self-graded* problems — copy the function below into a fresh file (e.g. `practice.py`) and write your own tests in `test_practice.py`. There's no validator here; judge your suite yourself against the partitioning + strong-oracle checklist you used above.

      ```python
      # Option A — numeric boundaries (more like Step 2)
      def shipping_fee(weight_kg: float) -> int:
          """Free if 0 < weight <= 1; $5 if 1 < weight <= 10; $20 above."""
          if weight_kg <= 0: return 0
          if weight_kg <= 1: return 0
          if weight_kg <= 10: return 5
          return 20

      # Option B — state-changing (more like Step 4)
      class StreakCounter:
          def __init__(self) -> None: self._n: int = 0
          def increment(self) -> None: self._n += 1
          def value(self) -> int: return self._n
      ```

      For Option A, your partitions are *numeric ranges*; boundary value analysis from Step 2 is the dominant tool. For Option B, the function under test mutates state, so each test follows the *behavior, not implementation* pattern from Step 4 (assert through `value()`, never reach for `_n`).
      </details>

      <details markdown="1"><summary>🚀 What's next — pytest features you'll meet in your next project</summary>

      You now have the *foundations* of testing. The pytest features below build on what you've learned — they don't replace it. None of them are needed for what you just did, but you'll see them everywhere in real codebases:

      | Feature | What it solves | When you'll want it |
      |---|---|---|
      | **`@pytest.fixture`** + `conftest.py` | Repeated Arrange logic across many tests (e.g. database connection, sample objects, mock services) | When two tests start with the same 5 lines of setup. |
      | **`@pytest.mark.parametrize`** | A family of similar tests on different inputs — *one function, many cases* | When you'd otherwise copy-paste the same test for `test_age_18`, `test_age_19`, `test_age_20`. The boundary-and-partition logic from Step 2 fits this perfectly. |
      | **`unittest.mock` / `pytest-mock`** | Testing code that calls external services (HTTP, database, file I/O) without actually hitting them | When the function under test would otherwise require network or disk to run. |
      | **`pytest-cov`** (coverage) | Measuring *which* lines of production code your tests execute | When you suspect a partition is missing — coverage shows untested branches. (Reminder from Step 4: coverage ≠ quality.) |
      | **Property-based testing** (`hypothesis`) | Auto-generating thousands of inputs to find edge cases your boundary tests missed | When the input space is too large for case-by-case enumeration. |

      Next pedagogical step: the **Test-Driven Development (TDD)** tutorial — where you write the test *before* the production code, and let failing tests drive the design. Everything from this tutorial (oracle strength, partitions, behavior testing) becomes a foundation that TDD layers a discipline on top of.

      For a different next step — the same testing concepts applied to a *whole React app through a real browser* — see the **[Playwright Tutorial](/SEBook/tools/playwright-tutorial)**. It picks up exactly where this one leaves off: AAA becomes navigate-interact-assert, partitions become user-path scenarios, oracle strength shows up in `toHaveText` vs `toBeVisible`, and the *behavior vs implementation* concept gets a tactile workout against UI refactors.

      Where to apply these in your own work: every new function you write deserves at least one boundary test and one partition representative test, with a strong oracle, through the public API. That's the four skills of this tutorial in 30 seconds per function — and it pays for itself the first time a refactor would have shipped a regression.
      </details>


    files:
      - path: "streaming.py"
        content: |
          def streaming_price(price: float, plan: str) -> float:
              """Apply a streaming-service plan discount.

              student -> 50% off  (Spotify Student / YouTube Premium Student style)
              family  -> 30% off  (Spotify Family / Apple Music Family style)
              other   -> no discount  (Individual, free, etc.)
              """
              if plan == "student":
                  return price * 0.50
              if plan == "family":
                  return price * 0.70
              return price
        language: "python"

