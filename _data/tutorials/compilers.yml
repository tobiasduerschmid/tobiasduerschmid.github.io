    open_file: compilers/go-v2/go-assignment-sequence/grammar.ebnf
    tests:
      - description: Several assignments retain source order and expression structure
        compiler:
          source: total2 = base + 3 * 7; result = (total2 - 2) * 4; count = 1
          ast:
            type: program
            children:
              - type: assignment
                children:
                  - type: IDENT
                    value: total2
                    children: []
                  - type: BinaryExpression
                    value: +
                    children:
                      - type: IDENT
                        value: base
                        children: []
                      - type: BinaryExpression
                        value: '*'
                        children:
                          - type: NUMBER
                            value: '3'
                            children: []
                          - type: NUMBER
                            value: '7'
                            children: []
              - type: assignment
                children:
                  - type: IDENT
                    value: result
                    children: []
                  - type: BinaryExpression
                    value: '*'
                    children:
                      - type: BinaryExpression
                        value: '-'
                        children:
                          - type: IDENT
                            value: total2
                            children: []
                          - type: NUMBER
                            value: '2'
                            children: []
                      - type: NUMBER
                        value: '4'
                        children: []
              - type: assignment
                children:
                  - type: IDENT
                    value: count
                    children: []
                  - type: NUMBER
                    value: '1'
                    children: []
        hints:
          - title: Locate the unconsumed statement
            text: Compare the end of the first assignment with the tokens that follow it.
            condition: 'source_matches: /program\s*=\s*assignment\s*;|^(?![\s\S]*program\s*=[^;]*;)/'
          - title: Trace a continuation
            text: After the first assignment, identify the separator and the next complete assignment. Then locate the same pair for a third statement.
            condition: 'source_matches: /^(?=[\s\S]*program\s*=[^;]*;)(?![\s\S]*program\s*=\s*assignment\s*;)(?![\s\S]*program\s*=[^;]*\{[^;]*;)/'
          - title: Allow repeated continuations
            text: Compare two assignments with three. A rule that permits only one extra statement needs a continuation that can occur more than once.
            condition: 'source_matches: /^(?![\s\S]*program\s*=\s*assignment\s*;)(?=[\s\S]*program\s*=[^;]*\{[^;]*;)/'
      - description: One assignment needs no separator
        compiler:
          source: answer = 7
          ast:
            type: program
            children:
              - type: assignment
                children:
                  - type: IDENT
                    value: answer
                    children: []
                  - type: NUMBER
                    value: '7'
                    children: []
        hints:
          - title: Check the shortest program
            text: One complete assignment already satisfies the requested language.
            condition: 'source_matches: /program\s*=\s*assignment\s*;|^(?![\s\S]*program\s*=[^;]*;)/'
          - title: Distinguish required and repeated parts
            text: Trace answer = 7 with no separator. Does your grammar demand an additional statement?
            condition: 'source_matches: /^(?=[\s\S]*program\s*=[^;]*;)(?![\s\S]*program\s*=\s*assignment\s*;)(?![\s\S]*program\s*=[^;]*\{[^;]*;)/'
          - title: Permit zero continuations
            text: The first assignment must be present, but the continuation may occur zero times. Inspect where that boundary falls in your rule.
            condition: 'source_matches: /^(?![\s\S]*program\s*=\s*assignment\s*;)(?=[\s\S]*program\s*=[^;]*\{[^;]*;)/'
      - description: Adjacent assignments require a separator
        compiler:
          source: first = 1 second = 2
          error: syntax
        hints:
          - title: Inspect the boundary between assignments
            text: A valid first assignment does not automatically allow another name to follow it.
            condition: 'source_matches: /program\s*=\s*assignment\s*;|^(?![\s\S]*program\s*=[^;]*;)/'
          - title: Compare with a valid sequence
            text: Insert one semicolon between the assignments, then remove it again. Which grammar part should distinguish the two cases?
            condition: 'source_matches: /^(?=[\s\S]*program\s*=[^;]*;)(?![\s\S]*program\s*=\s*assignment\s*;)(?![\s\S]*program\s*=[^;]*\{[^;]*;)/'
          - title: Keep the separator with its continuation
            text: An optional separator can let assignments run together. Check that every continuation consumes the separator before its assignment.
            condition: 'source_matches: /^(?![\s\S]*program\s*=\s*assignment\s*;)(?=[\s\S]*program\s*=[^;]*\{[^;]*;)/'
      - description: This fragment requires at least one assignment
        compiler:
          source: ''
          error: syntax
        hints:
          - title: Check the empty case
            text: This fragment requires at least one assignment; whitespace alone should not satisfy program.
            condition: 'source_matches: /program\s*=\s*assignment\s*;|^(?![\s\S]*program\s*=[^;]*;)/'
          - title: Inspect the minimum repetition count
            text: Braces permit zero repetitions. Does your rule place the entire program inside them?
            condition: 'source_matches: /^(?=[\s\S]*program\s*=[^;]*;)(?![\s\S]*program\s*=\s*assignment\s*;)(?![\s\S]*program\s*=[^;]*\{[^;]*;)/'
          - title: Require a first statement
            text: Separate the initial assignment from any later continuations. Only the continuation may be absent.
            condition: 'source_matches: /^(?![\s\S]*program\s*=\s*assignment\s*;)(?=[\s\S]*program\s*=[^;]*\{[^;]*;)/'
      - description: A final separator must not create an empty statement
        compiler:
          source: x = 1;
          error: syntax
        hints:
          - title: Distinguish the two semicolons
            text: 'The semicolon ending an EBNF production belongs to the grammar notation. A SEMI token belongs to the source: what should come after it?'
            condition: 'source_matches: /program\s*=\s*assignment\s*;|^(?![\s\S]*program\s*=[^;]*;)/'
          - title: Compare complete and incomplete sequences
            text: Trace x = 1; y = 2, then x = 1;. What is missing after the last separator in the second source?
            condition: 'source_matches: /^(?=[\s\S]*program\s*=[^;]*;)(?![\s\S]*program\s*=\s*assignment\s*;)(?![\s\S]*program\s*=[^;]*\{[^;]*;)/'
          - title: Inspect the end of the production
            text: Check whether an optional delimiter or an empty final statement can remain after the repeated continuations. A separator without another assignment must prevent completion.
            condition: 'source_matches: /^(?![\s\S]*program\s*=\s*assignment\s*;)(?=[\s\S]*program\s*=[^;]*\{[^;]*;)/'
