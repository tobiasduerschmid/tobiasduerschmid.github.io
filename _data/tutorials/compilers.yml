                  "pattern": "[A-Za-z_][A-Za-z0-9_]*"
                },
                {
                  "name": "NUMBER",
                  "pattern": "0|[1-9][0-9]*"
                },
                {
                  "name": "ASSIGN",
                  "pattern": "="
                },
                {
                  "name": "PLUS",
                  "pattern": "\\+"
                },
                {
                  "name": "MINUS",
                  "pattern": "-"
                },
                {
                  "name": "STAR",
                  "pattern": "\\*"
                },
                {
                  "name": "LPAREN",
                  "pattern": "\\("
                },
                {
                  "name": "RPAREN",
                  "pattern": "\\)"
                },
                {
                  "name": "SEMI",
                  "pattern": ";"
                },
                {
                  "name": "SPACE",
                  "pattern": "[ \\t\\r\\n]+",
                  "skip": true
                }
              ],
              "ast": {
                "discardTokens": [],
                "inlineRules": [],
                "foldRules": {}
              },
              "startRule": "program"
            }
        - path: compilers/go-v2/go-token-boundaries/grammar.ebnf
          language: plaintext
          content: |
            program = { IDENT | NUMBER | ASSIGN | PLUS | MINUS | STAR | LPAREN | RPAREN | SEMI } ;
        - path: compilers/go-v2/go-token-boundaries/source.txt
          language: plaintext
          content: |
            total2 = base + 3 * 7
      explanation: |
        The first character class requires a letter or underscore. Repetition permits letters, underscores, or digits afterward. Longest-match tokenization therefore keeps total2 together but begins 2total with a NUMBER.
    compiler_focus: tokens
  # Pedagogy: Compare ambiguous groupings; repair one precedence rule.
  - title: Operator Precedence
    key: go-precedence
    instructions: |
      ### Why this matters

      The same tokens can describe different groupings when a grammar is ambiguous.

      ### 🎯 You will learn to

      - Repair an expression grammar using precedence levels.

      **Predict → Run:** For `base + 3 * 7`, which operators could be the root under the starter grammar? Inspect every syntax tree.

      <details markdown="1">
      <summary>After running: compare</summary>

      Both `base + (3 * 7)` and `(base + 3) * 7` are possible. The starter does not enforce multiplication precedence.

      </details>

      **Read the rules:** EBNF uses `=` to define a production and `;` to end it. Adjacent items form a sequence, `|` offers alternatives, and `{ ... }` repeats zero or more times. The supplied `term` recognizes multiplication; `addop` recognizes addition/subtraction.

      **Modify:** Change only `expression` so multiplication binds more tightly than addition/subtraction. Build on the supplied rules. The lab already applies Go's left-to-right grouping at each operator level.

      Compare `base * 3 + 7` and `15 - 6 - 2`, then check your work. For subtraction, explain which operation is nested inside the other.
    compiler_files:
      tokens: compilers/go-v2/go-precedence/tokens.json
      grammar: compilers/go-v2/go-precedence/grammar.ebnf
      source: compilers/go-v2/go-precedence/source.txt
    files:
      - path: compilers/go-v2/go-precedence/tokens.json
        language: json
        content: |
          {
            "tokenRules": [
              {
                "name": "RESERVED",
                "pattern": "break|default|func|interface|select|case|defer|go|map|struct|chan|else|goto|package|switch|const|fallthrough|if|range|type|continue|for|import|return|var"
              },
              {
                "name": "IDENT",
                "pattern": "[A-Za-z_][A-Za-z0-9_]*"
              },
              {
                "name": "NUMBER",
                "pattern": "0|[1-9][0-9]*"
              },
              {
                "name": "ASSIGN",
                "pattern": "="
              },
              {
                "name": "PLUS",
                "pattern": "\\+"
              },
              {
                "name": "MINUS",
                "pattern": "-"
              },
              {
                "name": "STAR",
                "pattern": "\\*"
              },
              {
                "name": "LPAREN",
                "pattern": "\\("
              },
              {
                "name": "RPAREN",
                "pattern": "\\)"
              },
              {
                "name": "SEMI",
                "pattern": ";"
              },
              {
                "name": "SPACE",
                "pattern": "[ \\t\\r\\n]+",
                "skip": true
              }
            ],
            "ast": {
              "discardTokens": [
                "LPAREN",
                "RPAREN"
              ],
              "inlineRules": [
                "factor",
                "addop",
                "operator"
              ],
              "foldRules": {
                "expression": "left",
                "term": "left"
              }
            },
            "startRule": "expression"
          }
      - path: compilers/go-v2/go-precedence/grammar.ebnf
        language: plaintext
        content: |
          expression = expression operator expression | term ;
          term = factor { STAR factor } ;
          factor = IDENT | NUMBER ;
          addop = PLUS | MINUS ;
          operator = PLUS | MINUS | STAR ;
      - path: compilers/go-v2/go-precedence/source.txt
        language: plaintext
        content: |
          base + 3 * 7
    open_file: compilers/go-v2/go-precedence/grammar.ebnf
    tests:
      - description: Multiplication forms the addition operand
        compiler:
          source: base + 3 * 7
          ast:
            type: BinaryExpression
            value: +
            children:
              - type: IDENT
                value: base
                children: []
              - type: BinaryExpression
                value: '*'
                children:
                  - type: NUMBER
                    value: '3'
                    children: []
                  - type: NUMBER
                    value: '7'
                    children: []
        hints:
          - title: Find the competing groupings
            text: Compare the roots of the displayed alternatives. Which subtree keeps the multiplication together?
            condition: 'source_matches: /expression\s*=\s*expression\s+operator\s+expression\s*\|\s*term\s*;|^(?![\s\S]*expression\s*=[^;]*;)/'
          - title: Follow the multiplication rule
            text: Trace the tokens 3 * 7 through term. What can expression combine without splitting that complete unit?
            condition: 'source_matches: /^(?=[\s\S]*expression\s*=[^;]*;)(?![\s\S]*expression\s*=\s*expression\s+operator\s+expression\s*\|\s*term\s*;)(?![\s\S]*expression\s*=[^;]*\bterm\b[^;]*;)/'
          - title: Check the chain boundary
            text: Try one term, then two terms separated by addition. Identify the first required unit and what must travel together in each continuation.
            condition: 'source_matches: /^(?![\s\S]*expression\s*=\s*expression\s+operator\s+expression\s*\|\s*term\s*;)(?=[\s\S]*expression\s*=[^;]*\bterm\b[^;]*;)/'
      - description: Precedence also holds in the other source order
        compiler:
          source: base * 3 + 7
          ast:
            type: BinaryExpression
            value: +
            children:
              - type: BinaryExpression
                value: '*'
                children:
                  - type: IDENT
                    value: base
                    children: []
                  - type: NUMBER
                    value: '3'
                    children: []
              - type: NUMBER
                value: '7'
                children: []
        hints:
          - title: Compare both operator orders
            text: Use base * 3 + 7 and base + 3 * 7. Swapping the order should not swap precedence.
            condition: 'source_matches: /expression\s*=\s*expression\s+operator\s+expression\s*\|\s*term\s*;|^(?![\s\S]*expression\s*=[^;]*;)/'
          - title: Separate the grammar levels
            text: Inspect which production combines factors and which combines terms. Which level should be allowed to span the plus token?
            condition: 'source_matches: /^(?=[\s\S]*expression\s*=[^;]*;)(?![\s\S]*expression\s*=\s*expression\s+operator\s+expression\s*\|\s*term\s*;)(?![\s\S]*expression\s*=[^;]*\bterm\b[^;]*;)/'
          - title: Trace two complete terms
            text: Mark the tokens belonging to each term before combining them. Check that the grammar cannot move an addition inside a multiplication operand without parentheses.
            condition: 'source_matches: /^(?![\s\S]*expression\s*=\s*expression\s+operator\s+expression\s*\|\s*term\s*;)(?=[\s\S]*expression\s*=[^;]*\bterm\b[^;]*;)/'
      - description: Subtraction associates to the left
        compiler:
          source: 15 - 6 - 2
          ast:
            type: BinaryExpression
            value: '-'
            children:
              - type: BinaryExpression
                value: '-'
                children:
                  - type: NUMBER
                    value: '15'
                    children: []
                  - type: NUMBER
                    value: '6'
                    children: []
              - type: NUMBER
                value: '2'
                children: []
        hints:
          - title: Compare the two subtraction trees
            text: Locate the subtree containing 15 and 6, then the one containing 6 and 2. Which grouping follows Go?
            condition: 'source_matches: /expression\s*=\s*expression\s+operator\s+expression\s*\|\s*term\s*;|^(?![\s\S]*expression\s*=[^;]*;)/'
          - title: Inspect recursive choices
            text: Can either side of expression consume another subtraction? That freedom can preserve two interpretations even after tokenization succeeds.
            condition: 'source_matches: /^(?=[\s\S]*expression\s*=[^;]*;)(?![\s\S]*expression\s*=\s*expression\s+operator\s+expression\s*\|\s*term\s*;)(?![\s\S]*expression\s*=[^;]*\bterm\b[^;]*;)/'
          - title: Keep one operator level
            text: Describe the subtraction as an ordered chain of complete terms. Go groups that chain leftward; check whether the grammar still offers a competing nested expression.
            condition: 'source_matches: /^(?![\s\S]*expression\s*=\s*expression\s+operator\s+expression\s*\|\s*term\s*;)(?=[\s\S]*expression\s*=[^;]*\bterm\b[^;]*;)/'
      - description: An operator still requires its right operand
        compiler:
          source: base +
          error: syntax
        hints:
          - title: Find the missing operand
            text: The lexer recognizes the final plus token. Inspect what the grammar requires after it.
            condition: 'source_matches: /expression\s*=\s*expression\s+operator\s+expression\s*\|\s*term\s*;|^(?![\s\S]*expression\s*=[^;]*;)/'
          - title: Trace a shorter valid expression
            text: Compare base with base + 2. Which items were added together in the second case?
            condition: 'source_matches: /^(?=[\s\S]*expression\s*=[^;]*;)(?![\s\S]*expression\s*=\s*expression\s+operator\s+expression\s*\|\s*term\s*;)(?![\s\S]*expression\s*=[^;]*\bterm\b[^;]*;)/'
          - title: Do not make the operand optional
            text: Inspect optional or repeated parts around an operator. Every accepted continuation must consume an operand as well as its operator.
            condition: 'source_matches: /^(?![\s\S]*expression\s*=\s*expression\s+operator\s+expression\s*\|\s*term\s*;)(?=[\s\S]*expression\s*=[^;]*\bterm\b[^;]*;)/'
    solution:
      files:
        - path: compilers/go-v2/go-precedence/tokens.json
          language: json
          content: |
            {
              "tokenRules": [
                {
                  "name": "RESERVED",
                  "pattern": "break|default|func|interface|select|case|defer|go|map|struct|chan|else|goto|package|switch|const|fallthrough|if|range|type|continue|for|import|return|var"
                },
                {
                  "name": "IDENT",
                  "pattern": "[A-Za-z_][A-Za-z0-9_]*"
                },
                {
                  "name": "NUMBER",
                  "pattern": "0|[1-9][0-9]*"
                },
                {
                  "name": "ASSIGN",
                  "pattern": "="
                },
                {
                  "name": "PLUS",
                  "pattern": "\\+"
                },
                {
                  "name": "MINUS",
                  "pattern": "-"
                },
                {
                  "name": "STAR",
                  "pattern": "\\*"
                },
                {
                  "name": "LPAREN",
                  "pattern": "\\("
                },
                {
                  "name": "RPAREN",
                  "pattern": "\\)"
                },
                {
                  "name": "SEMI",
                  "pattern": ";"
                },
                {
                  "name": "SPACE",
                  "pattern": "[ \\t\\r\\n]+",
                  "skip": true
                }
              ],
              "ast": {
                "discardTokens": [
                  "LPAREN",
                  "RPAREN"
                ],
                "inlineRules": [
                  "factor",
                  "addop",
                  "operator"
                ],
                "foldRules": {
                  "expression": "left",
                  "term": "left"
                }
              },
              "startRule": "expression"
            }
        - path: compilers/go-v2/go-precedence/grammar.ebnf
          language: plaintext
          content: |
            expression = term { addop term } ;
            term = factor { STAR factor } ;
            factor = IDENT | NUMBER ;
            addop = PLUS | MINUS ;
            operator = PLUS | MINUS | STAR ;
        - path: compilers/go-v2/go-precedence/source.txt
          language: plaintext
          content: |
            base + 3 * 7
      explanation: |
        Expression combines complete terms, so multiplication remains nested inside addition/subtraction. The lab builds left-associated trees for each operator level: 15 - 6 - 2 groups as (15 - 6) - 2.
  # Pedagogy: Extend one grammar rule to recognize grouping.
  - title: Parenthesized Expressions
    key: go-parenthesized-expressions
    instructions: |
      ### Why this matters

      Parentheses let a programmer request a different grouping.

      ### 🎯 You will learn to

      - Extend a grammar to recognize parenthesized expressions.

      **Predict → Run:** The starter accepts `(3)`. Will it also accept `(base + 3) * 7`? Inspect `factor` before running.

      <details markdown="1">
      <summary>After running: compare</summary>

      Tokenization succeeds, but parsing fails. The parenthesized alternative allows only a number, so it cannot contain `base + 3`.

      </details>

      **Modify:** Change only `factor` so parentheses can enclose any expression. Keep ordinary names and numbers valid, and require both delimiters.

      Run `(base + 3) * 7` again. Predict its root, then follow the left branch. Compare it with `base + 3 * 7`: what changed the grouping?

      Try `15 - (6 - 2)` and an expression with a missing closing parenthesis, then check your work. Explain why the first should produce a tree and the second should fail.
    compiler_files:
      tokens: compilers/go-v2/go-parenthesized-expressions/tokens.json
      grammar: compilers/go-v2/go-parenthesized-expressions/grammar.ebnf
      source: compilers/go-v2/go-parenthesized-expressions/source.txt
    files:
      - path: compilers/go-v2/go-parenthesized-expressions/tokens.json
        language: json
        content: |
          {
            "tokenRules": [
              {
                "name": "RESERVED",
                "pattern": "break|default|func|interface|select|case|defer|go|map|struct|chan|else|goto|package|switch|const|fallthrough|if|range|type|continue|for|import|return|var"
              },
              {
                "name": "IDENT",
                "pattern": "[A-Za-z_][A-Za-z0-9_]*"
              },
              {
                "name": "NUMBER",
                "pattern": "0|[1-9][0-9]*"
              },
              {
                "name": "ASSIGN",
                "pattern": "="
              },
              {
                "name": "PLUS",
                "pattern": "\\+"
