# Lecture mapping and language subset: docs/compiler-lab.md.
title: 'Compilers Lab: A Small Go Front End'
exclude_from_index: true
description: 'Four short Go exercises: tokenize names, resolve ambiguous expressions, add parentheses, and parse assignments. Basic regex and trees; about 10–15 minutes.'
learning_objectives:
  - Recognize complete identifiers with regex.
  - Use grammar levels to control arithmetic grouping.
  - Extend a grammar to support parenthesized expressions and assignment sequences.
  - Distinguish lexical errors, syntax errors, and semantic questions.
backend: compiler
require_tests: false
require_quiz: false
allow_skip_steps: true
autosave_type: files
progress_version: 2
run_label: Run
steps:
  # Pedagogy: Predict token boundaries; repair one regex.
  - title: Identifier Boundaries
    key: go-token-boundaries
    instructions: |
      ### Why this matters

      A tokenizer must recognize `total2` as one name before a parser can use it.

      ### 🎯 You will learn to

      - Recognize a complete identifier with regex.

      This **10–15 minute** lab parses a small subset of [Go expressions and assignments](https://go.dev/ref/spec). You need basic regex and trees; no installation is required. Each step asks you to repair one rule.

      **Predict → Run:** Will the starter recognize `total2` as one token? Inspect the token names and matched text.

      <details markdown="1">
      <summary>After running: compare</summary>

      It emits `IDENT("total")` and `NUMBER("2")`: the identifier pattern stops before digits.

      </details>

      **Modify:** Edit only `IDENT` in **Tokenizer rules**:

      - First character: an ASCII letter or underscore.
      - Later characters: letters, underscores, or digits.

      Enter raw regex without slash delimiters. The lexer takes the longest match; row order breaks ties. Supplied rules handle numbers, keywords, punctuation, and whitespace.

      Try `_x9` and `@x`, then **Test My Work**. This step checks tokens; statement structure comes later.
    compiler_files:
      tokens: compilers/go-v2/go-token-boundaries/tokens.json
      grammar: compilers/go-v2/go-token-boundaries/grammar.ebnf
      source: compilers/go-v2/go-token-boundaries/source.txt
    files:
      - path: compilers/go-v2/go-token-boundaries/tokens.json
        language: json
        content: |
          {
            "tokenRules": [
              {
                "name": "RESERVED",
                "pattern": "break|default|func|interface|select|case|defer|go|map|struct|chan|else|goto|package|switch|const|fallthrough|if|range|type|continue|for|import|return|var"
              },
              {
                "name": "IDENT",
                "pattern": "[A-Za-z_]+"
              },
              {
                "name": "NUMBER",
                "pattern": "0|[1-9][0-9]*"
              },
              {
                "name": "ASSIGN",
                "pattern": "="
              },
              {
                "name": "PLUS",
                "pattern": "\\+"
              },
              {
                "name": "MINUS",
                "pattern": "-"
              },
              {
                "name": "STAR",
                "pattern": "\\*"
              },
              {
                "name": "LPAREN",
                "pattern": "\\("
              },
              {
                "name": "RPAREN",
                "pattern": "\\)"
              },
              {
                "name": "SEMI",
                "pattern": ";"
              },
              {
                "name": "SPACE",
                "pattern": "[ \\t\\r\\n]+",
                "skip": true
              }
            ],
            "ast": {
              "discardTokens": [],
              "inlineRules": [],
              "foldRules": {}
            },
            "startRule": "program"
          }
      - path: compilers/go-v2/go-token-boundaries/grammar.ebnf
        language: plaintext
        content: |
          program = { IDENT | NUMBER | ASSIGN | PLUS | MINUS | STAR | LPAREN | RPAREN | SEMI } ;
      - path: compilers/go-v2/go-token-boundaries/source.txt
        language: plaintext
        content: |
          total2 = base + 3 * 7
    open_file: compilers/go-v2/go-token-boundaries/tokens.json
    tests:
      - description: Trailing digits stay in the identifier
        compiler:
          source: total2=base+37
          tokens:
            - type: IDENT
              value: total2
            - type: ASSIGN
              value: '='
            - type: IDENT
              value: base
            - type: PLUS
              value: +
            - type: NUMBER
              value: '37'
        hints:
          - title: Find the token boundary
            text: Compare the token values with the original name. At which character does recognition stop?
            condition: 'source_matches: /"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"\[A-Za-z_\]\+"|^(?![\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"[^\"]*")/'
          - title: Trace a short name
            text: Try x and x2 separately. What must be allowed after the first letter?
            condition: 'source_matches: /^(?=[\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"[^\"]*")(?![\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"\[A-Za-z_\]\+")(?![\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"[^\"]*[0-9][^\"]*")/'
          - title: Separate the two positions
            text: List which characters may begin a name and which may continue it. Check your regex treats those positions differently.
            condition: 'source_matches: /^(?![\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"\[A-Za-z_\]\+")(?=[\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"[^\"]*[0-9][^\"]*")/'
      - description: Underscores and uppercase letters remain part of a name
        compiler:
          source: _Total_9
          tokens:
            - type: IDENT
              value: _Total_9
        hints:
          - title: Inspect each character class
            text: Trace the underscore, uppercase letter, and digit separately. All belong to this identifier.
            condition: 'source_matches: /"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"\[A-Za-z_\]\+"|^(?![\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"[^\"]*")/'
          - title: Try three smaller cases
            text: Compare _x, X, and x9. Which case does the current IDENT rule split or reject?
            condition: 'source_matches: /^(?=[\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"[^\"]*")(?![\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"\[A-Za-z_\]\+")(?![\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"[^\"]*[0-9][^\"]*")/'
          - title: Preserve the full name
            text: 'A later underscore is also legal: try x_9. Check both character classes and the repetition, rather than adding a separate underscore token.'
            condition: 'source_matches: /^(?![\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"\[A-Za-z_\]\+")(?=[\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"[^\"]*[0-9][^\"]*")/'
      - description: A leading digit begins a number token
        compiler:
          source: 2total
          tokens:
            - type: NUMBER
              value: '2'
            - type: IDENT
              value: total
        hints:
          - title: Locate the first match
            text: Read the first token type for 2total. Compare it with the rule for starting an identifier.
            condition: 'source_matches: /"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"\[A-Za-z_\]\+"|^(?![\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"[^\"]*")/'
          - title: Compare order and length
            text: Trace 2 and total separately. An identifier rule must not claim the digit just because it can match a longer string.
            condition: 'source_matches: /^(?=[\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"[^\"]*")(?![\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"\[A-Za-z_\]\+")(?![\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"[^\"]*[0-9][^\"]*")/'
          - title: Constrain the first character
            text: Digits belong in the continuation set, not the initial set. Check which part of your pattern is allowed to match at the current source position.
            condition: 'source_matches: /^(?![\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"\[A-Za-z_\]\+")(?=[\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"[^\"]*[0-9][^\"]*")/'
      - description: An unsupported character causes a lexical error
        compiler:
          source: total@2
          error: lexical
        hints:
          - title: Inspect the unsupported character
            text: Find which token rule, if any, claims @. It has no role in this fragment.
            condition: 'source_matches: /"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"\[A-Za-z_\]\+"|^(?![\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"[^\"]*")/'
          - title: Check the identifier set
            text: Try total and total@2. The second input should stop at @ rather than absorb it into a name.
            condition: 'source_matches: /^(?=[\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"[^\"]*")(?![\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"\[A-Za-z_\]\+")(?![\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"[^\"]*[0-9][^\"]*")/'
          - title: Avoid matching arbitrary characters
            text: Inspect any dot, negated class, or broad range in IDENT. Derive the allowed set from letters, underscores, and digits instead.
            condition: 'source_matches: /^(?![\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"\[A-Za-z_\]\+")(?=[\s\S]*"name"\s*:\s*"IDENT"\s*,\s*"pattern"\s*:\s*"[^\"]*[0-9][^\"]*")/'
    solution:
      files:
        - path: compilers/go-v2/go-token-boundaries/tokens.json
          language: json
          content: |
            {
              "tokenRules": [
                {
                  "name": "RESERVED",
