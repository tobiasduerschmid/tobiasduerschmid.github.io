  # Pedagogy: Transfer repetition to a statement sequence.
  - title: Statement Sequences
    key: go-assignment-sequence
    instructions: |
      ### Why this matters

      A small assignment rule can reuse an expression grammar.

      ### 🎯 You will learn to

      - Extend a grammar to recognize a sequence of assignments.

      The supplied assignment accepts a name, `=`, and an expression. This fragment requires explicit semicolons **between assignments**; Go's automatic semicolon insertion is outside the lab.

      **Predict → Run:** The source contains two assignments. Will tokenization fail, or does the grammar reject the sequence?

      <details markdown="1">
      <summary>After running: compare</summary>

      The tokens are valid, but `program` accepts only one assignment. The remaining tokens cause a syntax error.

      </details>

      **Modify:** Change only `program` to accept one or more assignments separated by semicolons. Empty input and trailing separators remain invalid.

      Try one assignment, three assignments, and a missing separator. Inspect the statement order in the syntax tree, then check your work.

      **Explain:** Why is `@total = 3` a lexical error, while `total = 3 +` is a syntax error? A tree for `total = unknown + 1` does not establish that `unknown` is declared; that requires semantic analysis.
