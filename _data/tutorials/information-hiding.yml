        - path: test_receipt.py
          language: python
          content: |
            from order import Order
            from receipt import Receipt


            class StubRewards:
                """Stands in for Rewards: awards a number today's rule could never give."""

                def points_for(self, total_cents):
                    return 99


            def test_receipt_shows_the_drink_and_the_points():
                lines = Receipt().lines(Order("Thai Tea", 500), StubRewards())
                assert lines == ["Thai Tea  $5.00", "You earned 99 points"]
      explanation: |
        One line changed: `earned = order.total_cents // 100` became `earned = rewards.points_for(order.total_cents)`, and `lines` gained the `rewards` parameter, so no refactoring tool and no forwarding method were involved. The test was written first and failed: its `StubRewards` answers 99, a number today's rule can never give for a 500-cent order. A receipt that copies the rule prints 5 and fails that test; only a receipt that asks `Rewards` prints 99, so the test proves the receipt asks instead of copying.

  # =========================================================================
  # STEP 5 — Change Impact Analysis
  # =========================================================================
  # Pedagogy: transfer to a new domain with interleaved leak kinds and minimal scaffolding; the lecture's four-step change impact analysis; testing: hand-rolled spy
  - title: "Change Impact Analysis"
    key: clubhub
    instructions: |
      ### Why this matters

      A change impact analysis lets you judge a design before it hurts: list the changes that could reasonably happen, weigh how likely each one is, count what each would touch, and redesign where a likely change is expensive.

      ### 🎯 You will learn to

      - **Evaluate** a design you have never seen with a change impact analysis
      - **Apply** the refactoring tools to the change that is both likely and expensive
      - **Create** a spy test for the interface you end up with

      ### The design

      ClubHub manages RSVPs for club events and texts the guests. It is new to you on purpose. The roadmap, with three possible changes, is in `change_impact.py`.

      ### Your tasks

      1. **Think.** Fill in `BEFORE` for changes A and B, then set `FIX_FIRST`.
      2. **Refactor A.** Give the texting decision one owner: `Notifier` gets an operation `send(phone, text)` that returns whether the text was delivered. Use the tools in `rsvp_service.py`, reuse the operation in `reminder_service.py`, then make the client private.
      3. **Fix B.** The rule for a full event already has an owner. Make `rsvp_service.py` ask it.
      4. **Test.** Add a test with a **spy**: a stand-in notifier that records every `send`. Check that an RSVP texts the right phone, with the right words, exactly once.
      5. **Reason.** Fill in `AFTER`.

      <details markdown="1">
      <summary>What you just did</summary>

      That was the whole method from lecture: list the changes, weigh how likely they are, count what they touch, and redesign where a likely change is expensive.

      Change C touches four files, and you left it alone. Nobody is asking for it yet. Write it down and move on: hiding a decision costs effort too.

      **Try it on your own project.** Pick one interface. Which design decisions does the module hide? Which ones can callers see? Would you change it now?

      </details>
    files:
      - path: change_impact.py
        language: python
        reseed: true
        content: |
          """Change impact analysis for ClubHub.

          Three changes are on the roadmap:

            A. "Textly doubled its prices. Switch to another texting provider."
               Decided. It happens next month.
            B. "Add a waitlist: an event should only count as full 5 guests later."
               Likely this quarter.
            C. "Store each event's guests in a database instead of a Python list."
               Someday. Nobody is asking for it yet. (We counted for you: 4 files.)

          For A and B, list every file of ours that someone would have to edit.
          textly_sdk.py is Textly's code, not ours. Test files count.
          """

          # Your analysis of the starting design.
          BEFORE = {
              "A": [],
              "B": [],
          }

          # Which change should the team design for first: "A", "B", or "C"?
          FIX_FIRST = ""

          # Fill this in after your refactoring passes the tests.
          AFTER = {
              "A": [],
              "B": [],
          }
      - path: rsvp_service.py
        language: python
        reseed: true
        content: |
          from event import Event
          from notifier import Notifier


          class RsvpService:
              def rsvp(self, notifier: Notifier, event: Event, phone: str) -> bool:
                  if len(event.guests) >= event.capacity:
                      return False
                  event.guests.append(phone)
                  text = f"You're in for {event.name}!"
                  session = notifier.textly.open_session()
                  receipt = notifier.textly.push(session, phone, text)
                  sent = receipt.delivered
                  return sent
      - path: reminder_service.py
        language: python
        reseed: true
        content: |
          from event import Event
          from notifier import Notifier


          class ReminderService:
              def remind_all(self, notifier: Notifier, event: Event) -> int:
                  reminded = 0
                  for phone in event.guests:
                      text = f"Reminder: {event.name} is tomorrow."
                      session = notifier.textly.open_session()
                      receipt = notifier.textly.push(session, phone, text)
                      if receipt.delivered:
                          reminded += 1
                  return reminded
      - path: notifier.py
        language: python
        reseed: true
        content: |
          from textly_sdk import TextlyClient


          class Notifier:
              """ClubHub's module for texting members."""

              def __init__(self) -> None:
                  self.textly = TextlyClient("clubhub")
      - path: event.py
        language: python
        reseed: true
        content: |
          class Event:
              def __init__(self, name: str, capacity: int) -> None:
                  self.name = name
                  self.capacity = capacity
                  self.guests: list[str] = []

              def is_full(self) -> bool:
                  return len(self.guests) >= self.capacity
      - path: textly_sdk.py
        language: python
        reseed: true
        content: |
          """Textly's texting SDK. Vendor code: you cannot edit this file.

          It is a small offline sandbox, so no real texts are sent.
          """


          class TextlyReceipt:
              def __init__(self, delivered: bool) -> None:
                  self.delivered = delivered


          class TextlyClient:
              """Textly's protocol: open a session, then push each text through it."""

              def __init__(self, api_key: str) -> None:
                  self.api_key = api_key

              def open_session(self) -> str:
                  return "session-" + self.api_key

              def push(self, session: str, phone: str, text: str) -> TextlyReceipt:
                  delivered = session.startswith("session-") and phone.startswith("555-")
                  return TextlyReceipt(delivered)
      - path: test_clubhub.py
        language: python
        reseed: true
        content: |
          from event import Event
          from notifier import Notifier
          from reminder_service import ReminderService
          from rsvp_service import RsvpService


          def test_rsvp_adds_the_guest_and_confirms():
              event = Event("Boba Social", 2)
              assert RsvpService().rsvp(Notifier(), event, "555-0100") is True
              assert event.guests == ["555-0100"]


          def test_a_full_event_turns_the_guest_away():
              event = Event("Boba Social", 1)
              RsvpService().rsvp(Notifier(), event, "555-0100")
              assert RsvpService().rsvp(Notifier(), event, "555-0101") is False
              assert event.guests == ["555-0100"]


          def test_reminders_count_the_guests_who_were_reached():
              event = Event("Boba Social", 3)
              event.guests.extend(["555-0100", "555-0101"])
              assert ReminderService().remind_all(Notifier(), event) == 2
