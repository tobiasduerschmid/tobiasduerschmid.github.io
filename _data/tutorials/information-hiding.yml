  # =========================================================================
  # STEP 2 — Private Is Not Hidden
  # =========================================================================
  # Pedagogy: misconception repair by prediction (private = hidden); completion problem (the learner chooses the lines); testing: behavior, not implementation
  - title: "Private Is Not Hidden"
    key: menu
    instructions: |
      ### Why this matters

      Making an attribute private does not hide a decision if a public operation hands it out anyway. What other code can depend on is decided by the whole interface: every public operation and everything it returns.

      ### 🎯 You will learn to

      - **Explain** why a private attribute can still leak a design decision
      - **Apply** the refactoring tools to take a data format out of an interface
      - **Evaluate** which tests survive when a hidden detail changes

      ### The design

      `Menu` loads the price list that our supplier sends. Look at its box in the class diagram: the attribute `__lines` is private.

      ### Your tasks

      1. **Think.** The change request: *"Our supplier is replacing the CSV export with JSON."* `__lines` is private, so is `menu.py` the only file that changes? Decide first. Then read `kiosk.py` and `test_kiosk.py`, and fill in `BEFORE` in `change_impact.py`.
      2. **Refactor.** In `kiosk.py`, find the lines that would break if a row stopped looking like `Taro Milk Tea,550,M|L`. Extract them into two methods named `price_cents` and `sizes`, and move each one to `Menu`.
      3. **Lock it.** `rows()` is the operation that handed the secret out. In `menu.py`, click on `rows` in the line `def rows(self)` and rename it to `__rows`.
      4. **Test.** Press **Test**. One test fails. It checked how the menu stores drinks, not what the menu does. Rewrite it so that it checks something the menu promises. Keep three tests.
      5. **Reason.** Fill in `AFTER`.

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-role="reference-design" data-uml-caption="Target: Menu promises names, prices, and sizes. The layout of a row is no longer part of any promise." data-uml-spec='@startuml
      layout horizontal
      class Kiosk {
        + total_cents(menu, drinks): int
        + offers_size(menu, drink, size): bool
      }
      class Menu {
        - __lines: list[str]
        - __rows(): list[str]
        + drink_names(): list[str]
        + price_cents(drink): int
        + sizes(drink): list[str]
      }
      Kiosk ..> Menu : price_cents, sizes
      @enduml'></div>

      <details markdown="1">
      <summary>What you just did</summary>

      `__lines` was private the whole time. The layout leaked anyway, through `rows()`: a public operation that returned the raw rows. Callers split those rows on commas, so they knew the layout too.

      **Information hiding is not about hiding data. It is about hiding design decisions.** An interface is a list of promises. `rows()` promised the file layout. Now `Menu` promises only what callers need: names, prices, and sizes.

      The failing test was a caller too. A good test passes for any correct implementation.

      </details>
