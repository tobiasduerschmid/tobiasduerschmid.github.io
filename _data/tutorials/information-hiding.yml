      - path: pickup_queue.py
        language: python
        reseed: true
        content: |
          class PickupQueue:
              """Orders waiting to be made: first come, first served."""

              def __init__(self) -> None:
                  self._waiting: list[str] = []

              def add(self, order_id: str) -> None:
                  self._waiting.append(order_id)

              def position(self, order_id: str) -> int:
                  """How many orders are ahead of this one (0 means it is next)."""
                  return self._waiting.index(order_id)
