      - path: kiosk.py
        language: python
        reseed: true
        content: |
          from menu import Menu


          class Kiosk:
              def total_cents(self, menu: Menu, drinks: list[str]) -> int:
                  total = 0
                  for drink in drinks:
                      price = 0
                      for row in menu.rows():
                          fields = row.split(",")
                          if fields[0] == drink:
                              price = int(fields[1])
                      total += price
                  return total

              def offers_size(self, menu: Menu, drink: str, size: str) -> bool:
                  available = []
                  for row in menu.rows():
                      fields = row.split(",")
                      if fields[0] == drink:
                          available = fields[2].split("|")
                  return size in available
