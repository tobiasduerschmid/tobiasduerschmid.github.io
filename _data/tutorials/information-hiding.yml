          assert _count == 2, "remind_all should count the guests who were reached."
          assert _notifier.sent == [("310-0100", "Reminder: Boba Social is tomorrow."), ("310-0101", "Reminder: Boba Social is tomorrow.")], "Each guest should get one reminder."
          assert ReminderService().remind_all(OtherNotifier(reachable=False), _event) == 0, "Guests who were not reached should not be counted."
        hints: *l5_provider
      - description: "The rule for a full event has one owner"
        command: |
          import sys
          for _name in list(sys.modules):
              if (getattr(sys.modules[_name], "__file__", "") or "").startswith("/tutorial/"):
                  del sys.modules[_name]

          class OtherNotifier:
              """A notifier from another provider. It has never heard of Textly."""
              def __init__(self, reachable=True):
                  self.sent = []
                  self._reachable = reachable
              def send(self, phone, text):
                  self.sent.append((phone, text))
                  return self._reachable

          from event import Event
          from rsvp_service import RsvpService
          class WaitlistEvent(Event):
              def is_full(self):
                  return len(self.guests) >= self.capacity + 5
          _event = WaitlistEvent("Boba Social", 1)
          _event.guests.append("310-0100")
          assert RsvpService().rsvp(OtherNotifier(), _event, "310-0101") is True, "rsvp should let the event decide whether it is full."
          class ClosedEvent(Event):
              def is_full(self):
                  return True
          assert RsvpService().rsvp(OtherNotifier(), ClosedEvent("Finals Party", 50), "310-0102") is False, "rsvp should turn the guest away when the event says it is full."
        hints: &l5_owner
          - title: "Who owns the rule?"
