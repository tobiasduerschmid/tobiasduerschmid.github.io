        hints: *l2_before
      - description: "The kiosk totals an order with a menu that is stored differently"
        command: |
          import sys
          for _name in list(sys.modules):
              if (getattr(sys.modules[_name], "__file__", "") or "").startswith("/tutorial/"):
                  del sys.modules[_name]

          class OtherMenu:
