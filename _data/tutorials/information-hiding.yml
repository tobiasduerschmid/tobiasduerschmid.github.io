    quiz:
      title: "Step 5 — Knowledge Check"
      min_score: 0.8
      questions:
        - question: "On the ClubHub roadmap, change C touches 4 files today and change A touches 3, yet the team designs for A first. Why?"
          type: single
          difficulty: advanced
          options:
            - "A touches vendor code, which is always the riskier kind of change"
            - "Smaller changes should come first, to build momentum"
            - "A is certain and costly; C is costly but unlikely"
            - "C cannot be hidden behind an interface"
          correct_index: 2
          option_feedback:
            0: "`textly_sdk.py` is Textly's code and is not on anyone's list. What ranks a change is how likely it is and how much it costs, not which kind of code it involves."
            1: "Size alone does not set the order. Change C is the biggest, and it still waits, because nobody is asking for it."
            3: "It can: `Event` could offer operations and keep its guests private. The team waits on C because it may never happen, and hiding a decision costs effort too."
          explanation: "A change impact analysis weighs likelihood and cost together. A is decided for next month and touches three files, so it is both likely and expensive. C touches more files, but it is only a someday idea, so the effort of redesigning for it may never pay off."
        - question: "After your refactoring, what is `Notifier`'s secret?"
          type: single
          difficulty: intermediate
          options:
            - "That ClubHub sends text messages to its members at all"
            - "Which texting provider it uses, and its protocol"
            - "The phone number that each text is sent to"
            - "Whether each text was actually delivered"
          correct_index: 1
          option_feedback:
            0: "That texts get sent is what callers rely on: it is the promise behind `send(phone, text)`. A promise is visible on purpose."
            2: "The caller passes the phone number in. It is the caller's data and part of the interface, not something `Notifier` hides."
            3: "`send` returns whether the text was delivered, so callers see that. How Textly reports it, through a receipt's `delivered` attribute, is what stays hidden."
          explanation: "The decision likely to change is the provider: Textly, with its open-a-session-then-push protocol. Only `Notifier` knows it now. That ClubHub sends texts, to which phone, and whether they arrived are part of the visible contract."
        - question: "You want a test that checks an RSVP texts the right phone, with the right words, exactly once. Which stand-in notifier fits?"
          type: single
          difficulty: basic
          options:
            - "A stub whose `send` always returns `True`"
            - "A spy whose `send` records every call it gets"
            - "The real `Notifier`, so the test sees what Textly delivers"
            - "No stand-in: check that `rsvp` returns `True`"
          correct_index: 1
          option_feedback:
            0: "A stub feeds the code an input. It keeps no record, so the test cannot see which phone was texted or how many times."
            2: "Textly only reports whether a text was delivered. The real notifier keeps no list of what was sent, and the test would depend on the vendor."
            3: "A service that texts the wrong phone can still return `True`, so the return value cannot catch that mistake."
          explanation: "The texts are indirect outputs: they leave the service through a collaborator, not through its return value. A spy records them, so the test can compare the whole list of calls with `==` and catch a wrong phone, wrong words, or a second text."
        - question: "Change C, storing guests in a database, touches 4 files because callers use `event.guests` directly. What would shrink it to one file?"
          type: single
          difficulty: advanced
          options:
            - "Rename `guests` to `__guests` and change nothing else"
            - "Move the guest list from `Event` into `RsvpService`"
            - "Store each event's guests in a dictionary instead of a list"
            - "Add `Event` operations for callers; make the list private"
          correct_index: 3
          option_feedback:
            0: "A rename alone only breaks the callers that still read `guests`. They need operations to call instead, or every one of them still knows how guests are stored."
            1: "That moves the decision into one caller. `ReminderService` and the tests would still need the list, so the change would spread again."
            2: "A dictionary is another storage choice that callers could still reach into. The number of files depends on who can see the storage, not on which one it is."
          explanation: "The fix follows the pattern from every lesson: let `Event` offer operations for what callers need, such as adding a guest or listing who to remind, and keep the list private. Then only `event.py` knows how guests are stored, and a database touches one file."
        - question: "To hide `Event`'s guest list, a teammate renames `guests` to `__guests` and adds a public `get_guests()` that returns that list. Is the guest list hidden now?"
          type: single
          difficulty: intermediate
          options:
            - "Yes, since two underscores make it private"
            - "Yes, since callers now go through a method"
            - "No, since the name should start with one underscore"
            - "No: `get_guests()` hands callers the same list"
          correct_index: 3
          option_feedback:
            0: "The attribute's name is private, but `get_guests()` returns the very same list. Callers can still loop over it and append to it."
            1: "A method that returns the raw list is the attribute under another name. Callers still depend on it being a Python list."
            2: "One underscore marks a name as protected, which hides even less. The number of underscores is not the problem: the getter that hands out the list is."
          explanation: "This is `rows()` from `Menu` again: private storage, handed out by a public operation. Hiding a decision means the interface no longer reveals it, so `Event` needs operations that answer callers' questions rather than one that returns its list."
