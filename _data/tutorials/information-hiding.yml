          from kiosk import Kiosk
          try:
              _total = Kiosk().total_cents(OtherMenu(), ["Taro Milk Tea", "Yuzu Soda", "Taro Milk Tea"])
          except AttributeError as _error:
              raise AssertionError(f"total_cents still needs something only the CSV menu has: {_error}")
          assert _total == 1575, "The total should be the sum of the menu's prices for the drinks ordered."
          assert Kiosk().total_cents(OtherMenu(), []) == 0, "An empty order should total 0."
        hints: &l2_provider
