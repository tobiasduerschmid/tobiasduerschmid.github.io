  # STEP 4 — The Secret Nobody Imported
  # =========================================================================
  # Pedagogy: productive failure (the diagram shows no arrow, so the first analysis is usually wrong); TDD red then green; testing: a stub value the copied rule cannot produce
  - title: "The Secret Nobody Imported"
    key: rewards
    instructions: |
      ### Why this matters

      Two modules can depend on the same decision without either one importing the other. Each simply contains its own copy of the rule. No arrow in a class diagram shows that, so the way to find it is to ask what a change would touch.

      ### 🎯 You will learn to

      - **Identify** a dependency that a class diagram does not show
      - **Apply** a test that proves a module asks the owner instead of copying its rule
      - **Evaluate** the change impact of a rule that has two copies

      ### The design

      `Rewards` awards loyalty points. `Receipt` prints how many points an order earned. Look at the class diagram: there is no arrow between them.

      ### Your tasks

      1. **Think.** The change request: *"Loyalty relaunch: customers earn 2 points per dollar."* Fill in `BEFORE` in `change_impact.py`.
      2. **Test first.** In `test_receipt.py`, hand `Receipt.lines` a second argument: a stub whose `points_for` returns a number that today's rule could never produce, like 99. Expect the receipt to show that number. Press **Test**. It fails.
      3. **Fix.** Change `Receipt.lines` to take `(order, rewards)` and to ask `rewards.points_for(...)` instead of dividing. Press **Test**. It passes. This is a one-line change, so you do not need a refactoring tool.
      4. **Reason.** Fill in `AFTER`, then look at the class diagram again.

      <details markdown="1">
      <summary>What you just did</summary>

      `Receipt` and `Rewards` had a **semantic dependency**: both implemented the same design decision. A **syntactic dependency**, such as an import or a call, shows up as an arrow. A semantic one does not, which makes it harder to find.

      The diagram now shows an arrow from `Receipt` to `Rewards`. That is an improvement: a dependency you can see replaced a copy you could not.

      Why a stub that answers 99? With the real `Rewards`, the copied rule and the real rule both say 5, so the test could not tell them apart.

      </details>
