            - "No: a receipt that divides by itself also prints 5"
            - "No: it should compare the whole list with `==`"
            - "Yes, since `lines` now takes the rewards module too"
          correct_index: 1
          option_feedback:
            0: "Passing `Rewards` in does not mean the receipt uses it. The copied rule and the real rule both give 5 points for 500 cents, so the line would be right either way."
            2: "Comparing the whole list is a good habit, but it does not help here: a receipt with the copied rule prints the same whole list."
            3: "Accepting a parameter is not the same as using it. A receipt can take `rewards` and still compute `total_cents // 100` on its own."
          explanation: "A test can only tell two implementations apart if they give different results for its input. With the real `Rewards`, the copy and the real rule agree, so the test passes for both. A stub that answers 99, a number the rule can never give for this order, makes them disagree."
        - question: "Which pair of Python classes has a semantic dependency?"
          type: single
          difficulty: intermediate
          options:
            - "`Kiosk` calls `menu.price_cents(drink)` and adds up the prices it gets"
            - "`Receipt` imports `Order` and reads `order.total_cents` for every receipt"
            - "`OrderDesk` writes `f\"B-{n:04d}\"` codes; `KitchenDisplay` reads `code[2:]`"
            - "`Payments` wraps PayPal's SDK, and `Notifier` wraps Textly's SDK"
          correct_index: 2
          option_feedback:
            0: "That is a syntactic dependency: a call, which the class diagram shows as an arrow. The kiosk does not know how `Menu` stores prices."
            1: "An import and an attribute read are syntactic dependencies, visible in code and in the diagram."
            3: "Both wrap a vendor, but they make different decisions. Switching texting providers would not touch `Payments`, so nothing ties them together."
          explanation: "`KitchenDisplay` only works because it knows how `OrderDesk` builds a code: `\"B-\"` plus a number. Neither class has to import the other, yet a new code format, such as `\"BR-0042\"`, breaks the display. That shared design decision is a semantic dependency."
        - question: "After your fix, the class diagram shows a new arrow from `Receipt` to `Rewards`. Is the design better or worse?"
          type: single
          difficulty: intermediate
          options:
            - "Better: a visible call replaced a hidden copy of the rule"
            - "Worse: a new arrow means the two classes are now more coupled"
            - "No different: the same two classes still depend on each other"
            - "Worse: `Receipt` can no longer be tested without the real `Rewards`"
          correct_index: 0
          option_feedback:
            1: "The classes were coupled before, just invisibly. The arrow shows a dependency that already existed, now on one small operation instead of on a copied rule."
            2: "The kind of dependency changed, and so did the cost: the relaunch now touches one file instead of three."
            3: "Your test hands `Receipt` a stub with one method, `points_for`. A dependency on a small interface is easy to replace in a test."
          explanation: "A dependency you can see, on a small interface, is better than a copy you cannot see. The arrow to `points_for` tells a reader exactly what `Receipt` needs, and the points rule now has one owner."
    solution:
      files:
        - path: receipt.py
          language: python
          content: |
            from order import Order
            from rewards import Rewards


            class Receipt:
                def lines(self, order: Order, rewards: Rewards) -> list[str]:
                    earned = rewards.points_for(order.total_cents)
                    return [
                        f"{order.drink}  ${order.total_cents / 100:.2f}",
