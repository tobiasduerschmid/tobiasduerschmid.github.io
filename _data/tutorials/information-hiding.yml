      - description: "RSVPs work with a notifier from another provider"
        command: |
          import sys
          for _name in list(sys.modules):
              if (getattr(sys.modules[_name], "__file__", "") or "").startswith("/tutorial/"):
                  del sys.modules[_name]

          class OtherNotifier:
              """A notifier from another provider. It has never heard of Textly."""
              def __init__(self, reachable=True):
                  self.sent = []
                  self._reachable = reachable
              def send(self, phone, text):
                  self.sent.append((phone, text))
                  return self._reachable

          from event import Event
          from rsvp_service import RsvpService
          _notifier = OtherNotifier()
          _event = Event("Boba Social", 2)
          try:
              _result = RsvpService().rsvp(_notifier, _event, "310-0100")
          except AttributeError as _error:
              raise AssertionError(f"rsvp still needs something only Textly has: {_error}")
          assert _result is True and _event.guests == ["310-0100"], "A successful RSVP should add the guest and return True."
          assert _notifier.sent == [("310-0100", "You're in for Boba Social!")], "rsvp should send the guest one confirmation."
          assert RsvpService().rsvp(OtherNotifier(reachable=False), Event("Game Night", 3), "310-0101") is False, "rsvp should return False when the text could not be delivered."
        hints: &l5_provider
          - title: "What the stand-in offers"
            text: "The check hands your service a notifier from another provider. It offers only `send(phone, text)`, which returns whether the text was delivered. What does your service still ask `Notifier` for?"
          - title: "The last line that knows Textly"
            text: "In the service, find the last line that only makes sense if you know Textly. Is that line inside the method you moved to `Notifier`?"
          - title: "Moved too few lines"
            text: "If a service still reads something from what `Notifier` returned, you moved too few lines. Undo the move and the extract, then extract through the line that produces a plain value. In the second service, call `send` instead of moving the lines again."
      - description: "Reminders work with a notifier from another provider"
        command: |
          import sys
          for _name in list(sys.modules):
              if (getattr(sys.modules[_name], "__file__", "") or "").startswith("/tutorial/"):
                  del sys.modules[_name]

          class OtherNotifier:
              """A notifier from another provider. It has never heard of Textly."""
              def __init__(self, reachable=True):
