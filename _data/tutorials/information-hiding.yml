          assert _result is True and _order.status == "refunded", "A successful refund should mark the order refunded and return True."
          assert _payments.calls == [("refund", 500)], "refund_order should ask payments to refund the order total once."
          _odd = Order("Mystery drink", 777)
          assert RefundService().refund_order(_payments, _odd) is False and _odd.status == "new", "A failed refund should leave the order unchanged and return False."
        hints:
