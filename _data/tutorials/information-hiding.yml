    quiz:
      title: "Step 2 — Knowledge Check"
      min_score: 0.8
      questions:
        - question: "In the starting design, `Menu.__lines` was private, yet `kiosk.py` still depended on the layout of a CSV row. What let the layout leak?"
          type: single
          difficulty: basic
          options:
            - "The public `rows()` returned the raw supplier rows"
            - "Python does not truly enforce names that start with two underscores"
            - "`drink_names()` splits each line on commas"
            - "The kiosk imported `SUPPLIER_EXPORT` from `menu.py`"
          correct_index: 0
          option_feedback:
            1: "The kiosk never touched `__lines` at all. It took the public route: `rows()` handed out the same strings, so the attribute's name did not matter."
            2: "That split happens inside `Menu`, and callers only get the names back. A detail that stays inside the owner is hidden, not leaked."
            3: "`kiosk.py` imports only `Menu`. The layout reached it through what a public operation returned, not through an import."
          explanation: "What other code can depend on is the whole interface: every public operation and what it returns. `rows()` returned rows like `Taro Milk Tea,550,M|L`, so every caller that split them learned the CSV layout. A private attribute cannot hide a decision that a public operation hands out."
        - question: |
            Callers of this Python `Roster` loop over `export()` and do `name, number, position = line.split(";")` on each line. Where does the line format leak?

            ```python
            class Roster:
                def __init__(self, lines):
                    self.__players = lines   # e.g. "Ana;7;forward"

                def export(self):
                    return self.__players
            ```
          type: single
          difficulty: intermediate
          options:
            - "In `__players`, because it stores lines in that format"
            - "Nowhere, since `__players` is private"
            - "In the callers' loop only; `Roster` itself is fine"
            - "In what `export()` returns to its callers"
          correct_index: 3
          option_feedback:
            0: "Storing the format inside `Roster` is fine: that is where the decision should live. It leaks only when something outside can see it."
            1: "Privacy of the attribute does not help when a public operation returns the same strings. Callers now split on `;`, so a new format would break all of them."
            2: "The callers split only because `export()` gave them raw strings. The fix belongs in `Roster`'s interface: operations that return names, numbers, and positions."
          explanation: "The return value of a public operation is part of the interface. `export()` returns `Ana;7;forward`-style strings, so the separator and the field order became promises that every caller relies on, just like `rows()` in `Menu`."
        - question: |
            A Python `Cart` with `add` and `count` operations keeps its items in a list called `_items`. It is changed to keep a dictionary of counts instead. Which of these tests still pass?

            ```python
            def test_a():
                c = Cart(); c.add("pen")
                assert c._items == ["pen"]

            def test_b():
                c = Cart(); c.add("pen")
                assert c.count("pen") == 1
            ```
          type: single
          difficulty: intermediate
          options:
            - "Both, since the cart still holds one pen"
            - "Only `test_a`"
            - "Only `test_b`"
            - "Neither, since tests must be rewritten after a storage change"
          correct_index: 2
          option_feedback:
            0: "`test_a` compares the stored list itself. After the change there is no such list, so the check fails even though the cart still holds one pen."
            1: "`test_a` is the one tied to storage: it reads `_items` and expects a list. `test_b` asks through `count`, which works the same for a list or a dictionary."
            3: "Only tests that read the storage need a rewrite. `test_b` asks through an operation the cart promises, so it passes for any correct storage."
          explanation: "`test_b` checks what the cart promises; `test_a` checks how it stores things. A good test passes for any correct implementation, so a change of storage is no reason to rewrite it. In this lesson, the test that read `rows()` was a `test_a`."
        - question: "After your refactoring, which of these is something `Menu` promises to its callers, rather than a detail it hides?"
          type: single
          difficulty: intermediate
          options:
            - "A row lists the name, then the price, then the sizes"
            - "The fields in a row are separated by commas"
            - "A drink has a price in cents"
            - "Prices are stored as text, such as `\"550\"`"
          correct_index: 2
          option_feedback:
            0: "Column order is part of the supplier's CSV layout. A JSON export has no column order at all, and no caller depends on it any more."
            1: "The comma separator belongs to the CSV export. After the refactoring, only `Menu` splits on it."
            3: "The CSV file does hold prices as text, but `price_cents` returns an `int`. Turning the text into a number is now `Menu`'s job, hidden from callers."
          explanation: "`price_cents(drink)` promises a price in cents, whatever the supplier sends. The layout of a row, its separator, and how prices are written in the file are hidden details: `Menu` can switch to JSON without breaking that promise."
    solution:
      files:
        - path: kiosk.py
          language: python
          content: |
            from menu import Menu


            class Kiosk:
                def total_cents(self, menu: Menu, drinks: list[str]) -> int:
                    total = 0
                    for drink in drinks:
                        price = menu.price_cents(drink)
                        total += price
                    return total
                def offers_size(self, menu: Menu, drink: str, size: str) -> bool:
                    available = menu.sizes(drink)
                    return size in available
        - path: menu.py
          language: python
          content: |
            SUPPLIER_EXPORT = """\
            Taro Milk Tea,550,M|L
            Thai Tea,500,M
            Matcha Latte,625,M|L
            """


            class Menu:
                """The drinks Boba Run sells, loaded from the supplier's CSV export.

                Each row looks like:  Taro Milk Tea,550,M|L
                """

                def __init__(self, csv_text: str) -> None:
                    self.__lines = [line for line in csv_text.splitlines() if line]

                def __rows(self) -> list[str]:
                    return self.__lines

                def drink_names(self) -> list[str]:
                    return [line.split(",")[0] for line in self.__lines]

                def price_cents(self, drink):
                    price = 0
                    for row in self.__rows():
                        fields = row.split(",")
                        if fields[0] == drink:
                            price = int(fields[1])
                    return price

                def sizes(self, drink: str):
                    available = []
                    for row in self.__rows():
                        fields = row.split(",")
                        if fields[0] == drink:
                            available = fields[2].split("|")
                    return available


            def load_menu() -> Menu:
                return Menu(SUPPLIER_EXPORT)
        - path: change_impact.py
          language: python
          content: |
            """Change impact analysis.

            Change request: "Our supplier is replacing the CSV export with JSON."

            List every file of ours that someone would have to edit to make that change.
            Test files count: a test that must be rewritten is part of the cost.
            """

            # Your analysis of the starting design.
            BEFORE = ["menu.py", "kiosk.py", "test_kiosk.py"]

            # Fill this in after your refactoring passes the tests.
            AFTER = ["menu.py"]
        - path: test_kiosk.py
          language: python
          content: |
            from kiosk import Kiosk
            from menu import load_menu


            def test_total_adds_the_price_of_each_drink():
                assert Kiosk().total_cents(load_menu(), ["Taro Milk Tea", "Thai Tea"]) == 1050


            def test_large_is_offered_only_where_the_menu_lists_it():
                kiosk = Kiosk()
                assert kiosk.offers_size(load_menu(), "Taro Milk Tea", "L") is True
                assert kiosk.offers_size(load_menu(), "Thai Tea", "L") is False


            def test_menu_knows_the_price_of_a_drink():
                assert load_menu().price_cents("Taro Milk Tea") == 550
      explanation: |
        In each kiosk method, the lines from `price = 0` (or `available = []`) through the end of the loop over `menu.rows()` moved to `Menu` as `price_cents` and `sizes`. Those lines are the ones that split and index a CSV row, and they end in a plain value, a price or a list of sizes, so the kiosk no longer sees a row. The forwarding methods that Move Method left in `Kiosk` were deleted, and renaming `rows` to `__rows` from its `def` line took the raw rows out of the interface. The test that read `rows()[0]` checked how `Menu` stores drinks; its replacement asks `price_cents("Taro Milk Tea")`, a promise that holds for the CSV menu and for a JSON one.

  # =========================================================================
  # STEP 3 — The Algorithm Is a Secret Too
  # =========================================================================
  # Pedagogy: faded practice (goal stated, steps not listed); second client reuses the owner's operation; testing: hand-rolled stub and both sides of a boundary
  - title: "The Algorithm Is a Secret Too"
    key: wait-times
    instructions: |
      ### Why this matters

      When several modules carry out the same calculation themselves, a new rule means editing all of them, plus every test that repeats the rule. Give the calculation one owner and let everyone else ask for the result.

      ### 🎯 You will learn to

      - **Identify** callers that carry out another module's algorithm themselves
      - **Apply** the same refactoring, then reuse the new operation from a second caller
      - **Create** tests with a stub, so that they do not depend on the algorithm

      ### The design

      `PickupScreen` and `TextMessage` both tell customers how long their order will take. Both work the number out themselves from what `WaitTimes` stores.

      ### Your tasks

      1. **Think.** The change request: *"Blended drinks take longer. Estimate the wait from the drinks in the queue, not a flat 3 minutes per order."* Fill in `BEFORE` in `change_impact.py`.
      2. **Refactor.** In `pickup_screen.py`, extract the lines that calculate the estimate into a method named `minutes_until_ready`, and move it to `WaitTimes`.
      3. **Reuse.** `text_message.py` has the same two lines. The estimate has an owner now, so don't move them again: replace them with a call to `wait_times.minutes_until_ready(order_id)`.
      4. **Test.** The tests expect 9 minutes because they repeat the 3-minute rule. Free them from it: in `test_pickup.py`, replace `WaitTimes` with a **stub**, a small stand-in class whose `minutes_until_ready` returns whatever number the test chooses. Test the screen once, and test both sides of the text message's boundary: 3 minutes and 4 minutes.
      5. **Reason.** Fill in `AFTER`.

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-role="reference-design" data-uml-caption="Target: both callers ask WaitTimes for the result. Neither knows how it is calculated." data-uml-spec='@startuml
      layout horizontal
      class PickupScreen {
        + message(wait_times, order_id): str
      }
      class TextMessage {
        + body(wait_times, order_id): str
      }
      class WaitTimes {
        + minutes_until_ready(order_id): int
      }
      PickupScreen ..> WaitTimes : minutes_until_ready
      TextMessage ..> WaitTimes : minutes_until_ready
      @enduml'></div>

      <details markdown="1">
      <summary>What you just did</summary>

      You have now hidden the three kinds of secret from lecture:

      | Kind of secret | Example | Owner |
      |---|---|---|
      | Library or technology | which payment provider we use | `Payments` |
      | Data format | the layout of the supplier's file | `Menu` |
      | Algorithm | how the wait is estimated | `WaitTimes` |

      With a stub, the test chooses the estimate directly. That is why hitting the boundary took one line instead of arranging a queue.

      </details>
    files:
      - path: pickup_screen.py
        language: python
        reseed: true
        content: |
          from wait_times import WaitTimes


          class PickupScreen:
              def message(self, wait_times: WaitTimes, order_id: str) -> str:
                  ahead = wait_times.queue.position(order_id)
                  minutes = (ahead + 1) * wait_times.minutes_per_drink
                  return f"Order {order_id}: ready in about {minutes} min"
