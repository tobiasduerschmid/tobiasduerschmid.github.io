          """Textly's texting SDK. Vendor code: you cannot edit this file.

          It is a small offline sandbox, so no real texts are sent.
          """


          class TextlyReceipt:
              def __init__(self, delivered: bool) -> None:
                  self.delivered = delivered


          class TextlyClient:
              """Textly's protocol: open a session, then push each text through it."""

              def __init__(self, api_key: str) -> None:
                  self.api_key = api_key

              def open_session(self) -> str:
                  return "session-" + self.api_key

              def push(self, session: str, phone: str, text: str) -> TextlyReceipt:
                  delivered = session.startswith("session-") and phone.startswith("555-")
                  return TextlyReceipt(delivered)
