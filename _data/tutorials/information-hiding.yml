          from pickup_queue import PickupQueue
          from pickup_screen import PickupScreen
          from text_message import TextMessage
          from wait_times import WaitTimes


          def queue_with(*order_ids):
              queue = PickupQueue()
              for order_id in order_ids:
                  queue.add(order_id)
              return queue


          def test_screen_shows_the_wait_for_the_third_order():
              wait_times = WaitTimes(queue_with("A10", "A11", "A12"))
              assert PickupScreen().message(wait_times, "A12") == "Order A12: ready in about 9 min"


          def test_text_says_next_when_no_one_is_ahead():
              wait_times = WaitTimes(queue_with("A10"))
              assert TextMessage().body(wait_times, "A10") == "Your boba is next!"
