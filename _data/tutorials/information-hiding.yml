        - path: rsvp_service.py
          language: python
          content: |
            from event import Event
            from notifier import Notifier


            class RsvpService:
                def rsvp(self, notifier: Notifier, event: Event, phone: str) -> bool:
                    if event.is_full():
                        return False
                    event.guests.append(phone)
                    text = f"You're in for {event.name}!"
                    sent = notifier.send(phone, text)
                    return sent
        - path: reminder_service.py
          language: python
          content: |
            from event import Event
            from notifier import Notifier


            class ReminderService:
                def remind_all(self, notifier: Notifier, event: Event) -> int:
                    reminded = 0
                    for phone in event.guests:
                        text = f"Reminder: {event.name} is tomorrow."
                        if notifier.send(phone, text):
                            reminded += 1
                    return reminded
        - path: notifier.py
          language: python
          content: |
            from textly_sdk import TextlyClient


            class Notifier:
                """ClubHub's module for texting members."""

                def __init__(self) -> None:
                    self.__textly = TextlyClient("clubhub")

                def send(self, phone: str, text):
                    session = self.__textly.open_session()
                    receipt = self.__textly.push(session, phone, text)
                    sent = receipt.delivered
                    return sent
        - path: test_clubhub.py
          language: python
          content: |
            from event import Event
            from notifier import Notifier
            from reminder_service import ReminderService
            from rsvp_service import RsvpService


            def test_rsvp_adds_the_guest_and_confirms():
                event = Event("Boba Social", 2)
                assert RsvpService().rsvp(Notifier(), event, "555-0100") is True
                assert event.guests == ["555-0100"]


            def test_a_full_event_turns_the_guest_away():
                event = Event("Boba Social", 1)
                RsvpService().rsvp(Notifier(), event, "555-0100")
                assert RsvpService().rsvp(Notifier(), event, "555-0101") is False
                assert event.guests == ["555-0100"]


            def test_reminders_count_the_guests_who_were_reached():
                event = Event("Boba Social", 3)
                event.guests.extend(["555-0100", "555-0101"])
                assert ReminderService().remind_all(Notifier(), event) == 2


            class SpyNotifier:
                """Stands in for Notifier and remembers every text it was asked to send."""

                def __init__(self):
                    self.sent = []

                def send(self, phone, text):
                    self.sent.append((phone, text))
                    return True


            def test_rsvp_texts_the_guest_one_confirmation():
                spy = SpyNotifier()
                RsvpService().rsvp(spy, Event("Boba Social", 2), "555-0100")
                assert spy.sent == [("555-0100", "You're in for Boba Social!")]
      explanation: |
        For change A, the three lines in `rsvp_service.py` from `session = …` through `sent = receipt.delivered` moved to `Notifier` as `send(phone, text)`, because they are the Textly protocol and end in a plain `True`/`False`. `reminder_service.py` now calls `send` instead of keeping a copy, the forwarding method left in `RsvpService` was deleted, and `textly` became `__textly`. For change B, a hand edit replaced `len(event.guests) >= event.capacity` with `event.is_full()`, the rule's existing owner. The spy test records every `send` and compares the whole list with `==`, so it fails for a text to the wrong phone and for a text sent twice; change C was written down and left alone because nobody is asking for it yet.
