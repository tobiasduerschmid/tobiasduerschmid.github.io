# Information Hiding in Python.
#
# The code blocks were GENERATED from a prototype that was run against the real
# refactoring engine (js/tutorial-refactorings.js) and against every grader
# below. Do not retype them. The design is in
# docs/superpowers/specs/2026-11-17-information-hiding-tutorial-design.md.
#
# The starter files are shaped for the editor's refactoring tools. Three limits
# of those tools are load-bearing, so keep these properties when editing code:
#   1. Extract Function/Method refuses a helper name that already appears in the
#      enclosing function (even as another object's attribute). That is why the
#      vendor SDKs say capture / reverse / vault / push and our modules say
#      charge / refund / save_card / send.
#   2. Move Method does not add imports to the target file. Every extracted
#      helper therefore takes only unannotated locals or built-in types.
#   3. Rename Symbol only rewrites the active file. Renaming a method must start
#      from its `def` line, never from a call.

title: "Information Hiding in Python: Who Knows the Secret?"
description: "Five small designs where a decision has leaked. For each one you work out which files a change would touch, move the knowledge into one module with the editor's refactoring tools, and let tests confirm that nothing broke. About 75 minutes. Builds on the Managing Complexity lecture and on the Python, testing, and UML class diagram tutorials."
instructions_footer_include: refactoring-tools-reference.html

# Authoring-time Bloom-verb objectives. Not yet rendered to students.
learning_objectives:
  - "Explain a module's secret as a design decision that is likely to change, and why a private attribute alone does not hide it."
  - "Identify where an interface or a client reveals a secret: a reached-through attribute, raw data in a return value, an algorithm carried out by callers, or a copied rule."
  - "Apply Extract Method, Move Method, and Rename with the editor's refactoring tools to give a leaked decision one owner while the tests stay green."
  - "Apply earlier testing skills to a refactoring: keep behavior tests as the safety net, rewrite a test that depends on a hidden detail, and write stub and spy tests at the new interface."
  - "Evaluate a design with a change impact analysis before and after a refactoring, and decide which likely change deserves a redesign."

backend: pyodide
linter: true  # live pyflakes diagnostics in the Monaco gutter
pytest: true

# Source on the left, tests on the right (files named test_* route right).
editor_split: true
output_height: "25%"

# Same layout as the refactoring tutorial: instructions and test output on the
# left, editors and the live class diagram on the right.
uml_diagram: true
uml_position: right
output_position: bottom-left
uml_default_view: true
uml_default_type: class
uml_class_layout: landscape

run_label: "Test"
require_tests: true
autosave_type: files

# Every lesson has a stable key. The eight lessons this tutorial replaces had no
# keys, so a save from the old version maps to no lesson: nothing is credited
# and the learner starts at the first lesson. Old drafts stay in storage unshown.
progress_version: 1

setup_commands:
  - "import pyodide_js; await pyodide_js.loadPackage('pytest')"
  - "import sys; sys.path.insert(0, '/tutorial')"
  - |
    import os as _os, pytest as _pytest, sys as _sys
    _TUTORIAL_DIR = '/tutorial'
    def _make_pytest_patch():
        # Bind every name _patched touches as a closure local, NOT a module
        # global. Each run() wipes globals() down to a whitelist before
        # executing (see js/pyodide-worker.js), so a global lookup of `os` or
        # the tutorial dir from inside _patched raises NameError at call time.
        # Closure cells live on the function object and survive the wipe.
        _orig = _pytest.main
        _sysmod = _sys
        _oslib = _os
        _tutdir = _TUTORIAL_DIR
        def _patched(*a, **kw):
            try:
                tutorial_modules = {f[:-3] for f in _oslib.listdir(_tutdir) if f.endswith('.py')}
            except FileNotFoundError:
                tutorial_modules = set()
            for m in list(_sysmod.modules):
                if m.startswith('test_') or m in tutorial_modules:
                    del _sysmod.modules[m]
            return _orig(*a, **kw)
        return _patched
    _pytest.main = _make_pytest_patch()
  - "import sys; sys.dont_write_bytecode = True"
  - |
    import sys, types
    from pyodide.http import pyfetch
    response = await pyfetch('/assets/tutorials/python_test_grading.py')
    response.raise_for_status()
    grading = types.ModuleType('tutorial_test_grading')
    exec(await response.string(), grading.__dict__)
    sys.modules['tutorial_test_grading'] = grading

steps:

  # =========================================================================
  # STEP 1 — A Decision Three Classes Know
  # =========================================================================
  # Pedagogy: worked example with fading (guided, then repeat, then on your own); tool pretraining on the lecture's own example; PRIMM (the BEFORE list is the prediction)
  - title: "A Decision Three Classes Know"
    key: payments
    instructions: |
      ### Why this matters

      A design decision that several modules know is expensive to change: every one of them has to be edited, and every edit can break something. Information hiding gives a decision one owner, so that changing it later touches one file.

      ### 🎯 You will learn to

      - **Identify** which modules know a design decision that is likely to change
      - **Apply** Extract Method and Move Method to give that decision one owner
      - **Evaluate** a design with a change impact analysis, before and after

      ### The design

      Boba Run lets you order boba ahead. This is the payment example from lecture: three services each run the PayPal protocol themselves, through the `paypal` client that `Payments` hands out.

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-role="reference-design" data-uml-caption="Today: count the arrows that reach PayPalClient. Every service has one." data-uml-spec='@startuml
      layout horizontal
      class OrderService {
        + checkout(payments, order): bool
      }
      class RefundService {
        + refund_order(payments, order): bool
      }
      class WalletService {
        + add_payment_method(payments, customer): str
      }
      class Payments {
        + paypal: PayPalClient
      }
      class PayPalClient <<PayPal SDK>> {
        + authenticate(): str
        + capture(token, cents): PayPalCharge
        + reverse(token, cents): PayPalCharge
        + vault(token, customer): str
      }
      OrderService ..> Payments
      RefundService ..> Payments
      WalletService ..> Payments
      OrderService ..> PayPalClient : runs the protocol
      RefundService ..> PayPalClient : runs the protocol
      WalletService ..> PayPalClient : runs the protocol
      Payments --> PayPalClient
      @enduml'></div>

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-role="reference-design" data-uml-caption="Target: only Payments reaches PayPalClient. Give your extracted methods the names shown on Payments." data-uml-spec='@startuml
      layout horizontal
      class OrderService {
        + checkout(payments, order): bool
      }
      class RefundService {
        + refund_order(payments, order): bool
      }
      class WalletService {
        + add_payment_method(payments, customer): str
      }
      class Payments {
        - __paypal: PayPalClient
        + charge(cents): bool
        + refund(cents): bool
        + save_card(customer): str
      }
      class PayPalClient <<PayPal SDK>> {
        + authenticate(): str
        + capture(token, cents): PayPalCharge
        + reverse(token, cents): PayPalCharge
        + vault(token, customer): str
      }
      OrderService ..> Payments : charge
      RefundService ..> Payments : refund
      WalletService ..> Payments : save_card
      Payments --> PayPalClient
      @enduml'></div>

      ### Your tasks

      1. **Think.** The change request: *"PayPal is raising its fees. Switch to Stripe."* Open `change_impact.py` and list in `BEFORE` every file of ours that someone would have to edit.
      2. **Test.** Press **Test**. All four tests pass. They check what the shop does, not how it pays, so they should stay green while you move code around.
      3. **Refactor `order_service.py`.**
         - Select the three lines that only make sense if you know PayPal: from `token = …` through `paid = …`.
         - Right-click, choose **Refactor: Extract Function/Method…**, and name the method `charge`. Check the preview, then accept it.
         - Click inside the new `charge` method. Right-click, choose **Refactor: Move Method…**, and pick `Payments`.
         - Press **Test**.
      4. **Refactor the other two services** the same way. This time you pick the lines. Name the methods `refund` and `save_card`.
      5. **Lock it.** Nobody outside `Payments` needs the client now. In `payments.py`, click on `paypal` in the line `self.paypal = …`, choose **Refactor: Rename Symbol…**, and rename it to `__paypal`. Press **Test**.
      6. **Reason.** Fill in `AFTER`: which files would the switch to Stripe touch now?

      Each move leaves a small forwarding method behind in the service. Nothing calls it, so you can delete it.

      <details markdown="1">
      <summary>What you just did</summary>

      Before, four files knew that Boba Run pays with PayPal. Now one does. `OrderService` can be read, tested, and changed by someone who has never heard of PayPal.

      `Payments` started as a **shallow module**: a class that hid nothing. It is deeper now: three small operations hide a whole protocol.

      The decision to use PayPal is the **secret** of `Payments`.

      </details>
    files:
      - path: order_service.py
        language: python
        reseed: true
        content: |
          from order import Order
          from payments import Payments


          class OrderService:
              def checkout(self, payments: Payments, order: Order) -> bool:
                  cents = order.total_cents
                  token = payments.paypal.authenticate()
                  result = payments.paypal.capture(token, cents)
                  paid = result.was_successful()
                  if paid:
                      order.status = "paid"
                  return paid
      - path: refund_service.py
        language: python
        reseed: true
        content: |
          from order import Order
          from payments import Payments


          class RefundService:
              def refund_order(self, payments: Payments, order: Order) -> bool:
                  cents = order.total_cents
                  token = payments.paypal.authenticate()
                  result = payments.paypal.reverse(token, cents)
                  refunded = result.was_successful()
                  if refunded:
                      order.status = "refunded"
                  return refunded
      - path: wallet_service.py
        language: python
        reseed: true
        content: |
          from payments import Payments


          class WalletService:
              def __init__(self) -> None:
                  self.saved_cards: dict[str, str] = {}

              def add_payment_method(self, payments: Payments, customer: str) -> str:
                  token = payments.paypal.authenticate()
                  card_id = payments.paypal.vault(token, customer)
                  self.saved_cards[customer] = card_id
                  return card_id
      - path: payments.py
        language: python
        reseed: true
        content: |
          from paypal_sdk import PayPalClient


          class Payments:
              """Boba Run's payments module."""

              def __init__(self) -> None:
                  self.paypal = PayPalClient("boba-run")
      - path: order.py
        language: python
        reseed: true
        content: |
          class Order:
              def __init__(self, drink: str, total_cents: int) -> None:
                  self.drink = drink
                  self.total_cents = total_cents
                  self.status = "new"
      - path: paypal_sdk.py
        language: python
        reseed: true
        content: |
          """PayPal's SDK. Vendor code: imagine it came from `pip install paypal`.

          You cannot edit this file. It is a small offline sandbox, so no real money
          moves, but its calls have the same shape as a real payment SDK.
          """


          class PayPalCharge:
              def __init__(self, transaction_id: str, succeeded: bool, fee_cents: int) -> None:
                  self.transaction_id = transaction_id
                  self.succeeded = succeeded
                  self.fee_cents = fee_cents

              def was_successful(self) -> bool:
                  return self.succeeded


          class PayPalClient:
              """PayPal's protocol: authenticate first, then pass the token to every call."""

              CARD_LIMIT_CENTS = 10_000

              def __init__(self, merchant_id: str) -> None:
                  self.merchant_id = merchant_id
                  self.transactions = 0

              def authenticate(self) -> str:
                  return "token-" + self.merchant_id

              def capture(self, token: str, cents: int) -> PayPalCharge:
                  self.transactions += 1
                  succeeded = token.startswith("token-") and 0 < cents <= self.CARD_LIMIT_CENTS
                  return PayPalCharge(f"{self.transactions:04d}", succeeded, cents * 3 // 100)

              def reverse(self, token: str, cents: int) -> PayPalCharge:
                  self.transactions += 1
                  succeeded = token.startswith("token-") and cents > 0
                  return PayPalCharge(f"{self.transactions:04d}", succeeded, 0)

              def vault(self, token: str, customer: str) -> str:
                  return "vault-" + customer
      - path: change_impact.py
        language: python
        reseed: true
        content: |
          """Change impact analysis.

          Change request: "PayPal is raising its fees. Switch Boba Run to Stripe."

          List every file of ours that someone would have to edit to make that change.
          - paypal_sdk.py is PayPal's code, not ours, so it never goes on a list.
          - Test files count: a test that must be rewritten is part of the cost.
          """

          # Your analysis of the starting design, for example ["order.py"].
          BEFORE = []

          # Fill this in after your refactoring passes the tests.
          AFTER = []
      - path: test_shop.py
        language: python
        reseed: true
        content: |
          from order import Order
          from order_service import OrderService
          from payments import Payments
          from refund_service import RefundService
          from wallet_service import WalletService


          def test_checkout_marks_the_order_paid():
              order = Order("Taro Milk Tea", 550)
              assert OrderService().checkout(Payments(), order) is True
              assert order.status == "paid"


          def test_checkout_over_the_card_limit_is_declined():
              order = Order("Boba for the whole lecture hall", 250_000)
              assert OrderService().checkout(Payments(), order) is False
              assert order.status == "new"


          def test_refund_marks_the_order_refunded():
              order = Order("Thai Tea", 500)
              assert RefundService().refund_order(Payments(), order) is True
              assert order.status == "refunded"


          def test_saving_a_card_remembers_it_for_the_customer():
              wallet = WalletService()
              card_id = wallet.add_payment_method(Payments(), "ana")
              assert wallet.saved_cards["ana"] == card_id
    open_file: order_service.py
    run_file: test_shop.py
    uml_files:
      - payments.py
      - order_service.py
      - refund_service.py
      - wallet_service.py
    tests:
      - description: "Before: the analysis lists every file that would need an edit"
        command: |
          _ns = {}
          exec(open("/tutorial/change_impact.py").read(), _ns)
          def _files(value):
              assert isinstance(value, (list, tuple, set)), "Keep each analysis as a list of file names."
              return {str(name).strip() for name in value}

          _truth = {"payments.py", "order_service.py", "refund_service.py", "wallet_service.py"}
          _missing = _truth - _files(_ns.get("BEFORE", []))
          assert not _missing, f"BEFORE is missing {len(_missing)} file(s) that use PayPal's calls."
        hints: &l1_before
          - title: "Would this file survive the switch?"
            text: "Go through the files one at a time and ask: if Boba Run switched from PayPal to Stripe, would this file still be correct exactly as written? If not, it belongs on the list."
          - title: "Search for PayPal's own words"
            text: "Search for PayPal's own words, such as the names of its calls, not for imports. A file can run PayPal's protocol without importing anything from PayPal."
          - title: "Tests and vendor code"
            text: "Tests are files too: does any test repeat a PayPal detail? PayPal's SDK is PayPal's code, not ours, so it never goes on the list."
      - description: "Before: the analysis lists no file that could stay as it is"
        command: |
          _ns = {}
          exec(open("/tutorial/change_impact.py").read(), _ns)
          def _files(value):
              assert isinstance(value, (list, tuple, set)), "Keep each analysis as a list of file names."
              return {str(name).strip() for name in value}

          _truth = {"payments.py", "order_service.py", "refund_service.py", "wallet_service.py"}
          _before = _files(_ns.get("BEFORE", []))
          assert _before, "BEFORE is still empty."
          _extra = _before - _truth
          assert not _extra, f"BEFORE lists {len(_extra)} file(s) that would not need an edit."
        hints: *l1_before
      - description: "Checkout works with a payments module from another provider"
        command: |
          import sys
          for _name in list(sys.modules):
              if (getattr(sys.modules[_name], "__file__", "") or "").startswith("/tutorial/"):
                  del sys.modules[_name]

          class OtherProvider:
              """A payments module from another provider. It has never heard of PayPal."""
              def __init__(self):
                  self.calls = []
              def charge(self, cents):
                  self.calls.append(("charge", cents))
                  return cents <= 2000
              def refund(self, cents):
                  self.calls.append(("refund", cents))
                  return cents != 777
              def save_card(self, customer):
                  self.calls.append(("save_card", customer))
                  return "card-of-" + customer

          from order import Order
          from order_service import OrderService
          _payments = OtherProvider()
          _order = Order("Taro Milk Tea", 550)
          try:
              _result = OrderService().checkout(_payments, _order)
          except AttributeError as _error:
              raise AssertionError(f"checkout still needs something only PayPal has: {_error}")
          assert _result is True and _order.status == "paid", "An accepted payment should mark the order paid and return True."
          assert _payments.calls == [("charge", 550)], "checkout should ask payments to charge the order total once."
          _big = Order("Boba for the whole lecture hall", 5000)
          assert OrderService().checkout(_payments, _big) is False and _big.status == "new", "A declined payment should leave the order new and return False."
        hints: &l1_provider
          - title: "What the stand-in offers"
            text: "The check hands your service a payments module from another provider. It offers only the operations shown on `Payments` in the target diagram, with those names. What does your service still ask `Payments` for?"
          - title: "The last line that knows PayPal"
            text: "In the service, find the last line that only makes sense if you know PayPal. Is that line inside the method you moved to `Payments`?"
          - title: "Moved too few lines"
            text: "If the service still calls a method on what `Payments` returned, you moved too few lines. Undo the move and the extract, then extract through the line that produces a plain value: a number, a string, or `True`/`False`."
      - description: "Refunds work with a payments module from another provider"
        command: |
          import sys
          for _name in list(sys.modules):
              if (getattr(sys.modules[_name], "__file__", "") or "").startswith("/tutorial/"):
                  del sys.modules[_name]

          class OtherProvider:
              """A payments module from another provider. It has never heard of PayPal."""
              def __init__(self):
                  self.calls = []
              def charge(self, cents):
                  self.calls.append(("charge", cents))
                  return cents <= 2000
              def refund(self, cents):
                  self.calls.append(("refund", cents))
                  return cents != 777
              def save_card(self, customer):
                  self.calls.append(("save_card", customer))
                  return "card-of-" + customer

          from order import Order
          from refund_service import RefundService
          _payments = OtherProvider()
          _order = Order("Thai Tea", 500)
          try:
              _result = RefundService().refund_order(_payments, _order)
          except AttributeError as _error:
              raise AssertionError(f"refund_order still needs something only PayPal has: {_error}")
          assert _result is True and _order.status == "refunded", "A successful refund should mark the order refunded and return True."
          assert _payments.calls == [("refund", 500)], "refund_order should ask payments to refund the order total once."
          _odd = Order("Mystery drink", 777)
          assert RefundService().refund_order(_payments, _odd) is False and _odd.status == "new", "A failed refund should leave the order unchanged and return False."
        hints: *l1_provider
      - description: "Saving a card works with a payments module from another provider"
        command: |
          import sys
          for _name in list(sys.modules):
              if (getattr(sys.modules[_name], "__file__", "") or "").startswith("/tutorial/"):
                  del sys.modules[_name]

          class OtherProvider:
              """A payments module from another provider. It has never heard of PayPal."""
              def __init__(self):
                  self.calls = []
              def charge(self, cents):
                  self.calls.append(("charge", cents))
                  return cents <= 2000
              def refund(self, cents):
                  self.calls.append(("refund", cents))
                  return cents != 777
              def save_card(self, customer):
                  self.calls.append(("save_card", customer))
                  return "card-of-" + customer

          from wallet_service import WalletService
          _payments = OtherProvider()
          _wallet = WalletService()
          try:
              _card = _wallet.add_payment_method(_payments, "ana")
          except AttributeError as _error:
              raise AssertionError(f"add_payment_method still needs something only PayPal has: {_error}")
          assert _card == "card-of-ana" and _wallet.saved_cards == {"ana": "card-of-ana"}, "The wallet should remember the card id that payments returns."
          assert _payments.calls == [("save_card", "ana")], "add_payment_method should ask payments to save the card once."
        hints: *l1_provider
      - description: "The shop still behaves the same with PayPal"
        command: |
          import sys
          for _name in list(sys.modules):
              if (getattr(sys.modules[_name], "__file__", "") or "").startswith("/tutorial/"):
                  del sys.modules[_name]

          from order import Order
          from order_service import OrderService
          from payments import Payments
          from refund_service import RefundService
          from wallet_service import WalletService
          try:
              _order = Order("Taro Milk Tea", 550)
              assert OrderService().checkout(Payments(), _order) is True and _order.status == "paid"
              _big = Order("Boba for the whole lecture hall", 250_000)
              assert OrderService().checkout(Payments(), _big) is False and _big.status == "new"
              _back = Order("Thai Tea", 500)
              assert RefundService().refund_order(Payments(), _back) is True and _back.status == "refunded"
              _wallet = WalletService()
              _card = _wallet.add_payment_method(Payments(), "ana")
              assert _card and _wallet.saved_cards == {"ana": _card}
          except (AttributeError, TypeError, NameError) as _error:
              raise AssertionError(f"The shop no longer runs with PayPal: {_error}")
        hints: &l1_same
          - title: "Read the first failing line"
            text: "Press **Test** and read the first failing line in the output. It tells you which file and which line broke."
          - title: "A call that does not match"
            condition: "code_missing: __paypal"
            text: "An `AttributeError` or a `TypeError` after an extract or a move means a service asks `Payments` for an operation it does not offer, or passes different arguments than the operation takes. Compare the call with the method's `def` line in `payments.py`."
          - title: "Back out the last refactoring"
            condition: "code_missing: __paypal"
            text: "You have not renamed `paypal` yet, so the failure comes from an extract or a move. Undo it in every file it changed, then try again with whole statements selected. Read the preview before you accept it."
          - title: "An attribute that went missing"
            condition: "code_contains: __paypal"
            text: "An `AttributeError` saying that `Payments` has no attribute `paypal` means the client was made private while code outside `Payments` still uses it."
          - title: "Move first, then rename"
            condition: "code_contains: __paypal"
            text: "If that is the error you see, undo the rename, finish moving the PayPal lines out of every service, then rename again. **Reset Current Step** brings back the starting code if undo gets confusing."
      - description: "Payments keeps its PayPal client to itself"
        command: |
          import sys
          for _name in list(sys.modules):
              if (getattr(sys.modules[_name], "__file__", "") or "").startswith("/tutorial/"):
                  del sys.modules[_name]

          from payments import Payments
          _exposed = [name for name, value in vars(Payments()).items()
                      if not name.startswith("_") and type(value).__module__ == "paypal_sdk"]
          assert not _exposed, "Payments still offers its PayPal client as a public attribute."
        hints: &l1_private
          - title: "Who can still reach it?"
            text: "Which public name on `Payments` still gives a caller the PayPal client?"
          - title: "Two underscores make it private"
            text: "Rename that attribute so its name starts with two underscores. Code outside the class can then no longer reach it by that name."
          - title: "Start where the name is defined"
            text: "Start **Refactor: Rename Symbol…** on the line where the attribute is defined, not on a line that uses it. The tool only rewrites the file you have open."
      - description: "After: only the payments module would need an edit"
        command: |
          _ns = {}
          exec(open("/tutorial/change_impact.py").read(), _ns)
          def _files(value):
              assert isinstance(value, (list, tuple, set)), "Keep each analysis as a list of file names."
              return {str(name).strip() for name in value}

          _after = _files(_ns.get("AFTER", []))
          assert _after, "AFTER is still empty."
          assert _after == {"payments.py"}, "AFTER should list exactly the files that still use PayPal's calls."
        hints: &l1_after
          - title: "Ask the Think question again"
            text: "Redo the Think question on the new code: if Boba Run switched to Stripe, which files would still be wrong as written?"
          - title: "Only files that still know the secret"
            text: "Only files that still contain a PayPal detail belong on the list. A file that calls `charge` does not need to know who carries it out."
          - title: "More than one file left?"
            text: "If more than one file is still on your list, a caller or a test still knows the secret. Find it and finish that part of the refactoring first."
    quiz:
      title: "Step 1 — Knowledge Check"
      min_score: 0.8
      questions:
        - question: "After your refactoring, `Payments` has a secret. What is it?"
          type: single
          difficulty: basic
          options:
            - "The card numbers that customers save in the wallet"
            - "The `PayPalClient` object stored in its attribute"
            - "The choice of PayPal and its protocol"
            - "The total of each order, in cents"
          correct_index: 2
          option_feedback:
