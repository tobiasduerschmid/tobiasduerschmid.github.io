            - "How the wait estimate is worked out"
          correct_index: 3
          option_feedback:
            0: "The screen needs the order id to show the right message; it is part of `message(wait_times, order_id)`. Knowing an input is not knowing a secret."
            1: "The wording is the screen's own job. No other module knows it, so it is not a leak."
            2: "Showing the minutes is exactly what the screen is for. The problem was that it also calculated them from the queue position and `minutes_per_drink`."
          explanation: "The screen read `queue.position` and `minutes_per_drink` and did the arithmetic itself, so it carried out `WaitTimes`' algorithm. An algorithm is a secret too: now the screen only asks `minutes_until_ready(order_id)`, and a new rule changes one file."
        - question: "In your tests, the stub's `minutes_until_ready` returns whatever number the test chooses. Why does that make the text message's boundary, 3 minutes against 4, easy to test?"
          type: single
          difficulty: intermediate
          options:
            - "The test sets the estimate itself instead of building a queue that leads to it"
            - "The stub responds faster than the real `WaitTimes` does"
            - "The stub checks that the text message asks for the estimate once"
            - "The stub repeats the 3-minutes-per-order rule, so the expected text is easy to work out"
          correct_index: 0
          option_feedback:
            1: "Speed is not the point: the real `WaitTimes` answers instantly too. What matters is who decides the number the text message receives."
            2: "Recording calls is what a spy does. This stub only answers with a number; it checks nothing."
            3: "The stub knows no rule at all. That is what frees the tests from it: the new blended-drink rule cannot break them."
          explanation: "The estimate is an indirect input to the text message: it comes from a collaborator, not from the test's arguments. A stub lets the test choose it in one line. With the real rule you would have to arrange a queue and work out the minutes, and today's rule cannot even produce 4 minutes, since it counts in steps of 3."
        - question: "A Python `SalesReport` has a public `to_rows()` that returns strings like `\"2026-11-17|Taro|12\"`. Three callers split them on `\"|\"`. Which kind of secret has leaked to those callers?"
          type: single
          difficulty: intermediate
          options:
            - "An algorithm"
            - "A data format"
            - "A library or technology choice"
            - "None, since returning strings is not a leak"
          correct_index: 1
          option_feedback:
            0: "The callers do not calculate anything the report should calculate. They decode the layout of its rows, which is a format."
            2: "No vendor or library is involved. The decision the callers depend on is how a row is written: the separator and the order of the fields."
            3: "Returning strings is fine; returning strings that callers must take apart is the leak. Switch the separator to a comma and all three callers break."
          explanation: "This is the `rows()` problem from `Menu` again: a public operation returns raw rows, so the row layout becomes part of the interface. The fix is the same too: operations that return plain values, so only `SalesReport` knows the format."
        - question: "The estimate will soon depend on which drinks are in the queue. Which operation on `WaitTimes` keeps that change inside `WaitTimes`?"
          type: single
          difficulty: advanced
          options:
            - "`estimate(orders_ahead, minutes_per_drink)`"
            - "`minutes_per_drink()`, which returns 3"
            - "`minutes_until_ready(order_id)`"
            - "`waiting_orders()`, which returns the queue"
          correct_index: 2
          option_feedback:
            0: "Callers would have to supply the algorithm's inputs. A drink-based rule needs different inputs, so every caller would change along with the signature."
            1: "Callers would still multiply by it themselves, so they would still carry out the rule, and a drink-based rule would break them all."
            3: "Handing out the queue invites every caller to work the estimate out itself, which is exactly the leak this lesson removed."
          explanation: "`minutes_until_ready(order_id)` asks only for what every caller already has, the order, and returns the answer. Which inputs the rule needs is part of the secret, so a drink-based rule changes `WaitTimes` and nothing else."
    solution:
      files:
        - path: pickup_screen.py
          language: python
          content: |
            from wait_times import WaitTimes


            class PickupScreen:
                def message(self, wait_times: WaitTimes, order_id: str) -> str:
                    minutes = wait_times.minutes_until_ready(order_id)
                    return f"Order {order_id}: ready in about {minutes} min"
        - path: text_message.py
          language: python
          content: |
            from wait_times import WaitTimes


            class TextMessage:
                def body(self, wait_times: WaitTimes, order_id: str) -> str:
                    minutes = wait_times.minutes_until_ready(order_id)
                    if minutes <= 3:
                        return "Your boba is next!"
                    return f"About {minutes} min until your boba is ready."
        - path: wait_times.py
          language: python
          content: |
            from pickup_queue import PickupQueue


            class WaitTimes:
                """Estimates how long an order will take."""

                def __init__(self, queue: PickupQueue) -> None:
                    self.queue = queue
                    self.minutes_per_drink = 3

                def minutes_until_ready(self, order_id: str):
                    ahead = self.queue.position(order_id)
                    minutes = (ahead + 1) * self.minutes_per_drink
                    return minutes
        - path: change_impact.py
          language: python
          content: |
            """Change impact analysis.

            Change request: "Blended drinks take longer to make. Estimate the wait from
            the drinks in the queue instead of a flat 3 minutes per order."

            List every file of ours that someone would have to edit to make that change.
            Test files count: a test that must be rewritten is part of the cost.
            """

            # Your analysis of the starting design.
            BEFORE = ["wait_times.py", "pickup_screen.py", "text_message.py", "test_pickup.py"]

            # Fill this in after your refactoring passes the tests.
            AFTER = ["wait_times.py"]
        - path: test_pickup.py
          language: python
          content: |
            from pickup_screen import PickupScreen
            from text_message import TextMessage


            class StubWaitTimes:
                """Stands in for WaitTimes: always answers with the minutes it was given."""

                def __init__(self, minutes):
                    self.minutes = minutes

                def minutes_until_ready(self, order_id):
                    return self.minutes


            def test_screen_shows_the_estimate_for_the_order():
                assert PickupScreen().message(StubWaitTimes(9), "A12") == "Order A12: ready in about 9 min"


            def test_text_says_next_at_three_minutes():
                assert TextMessage().body(StubWaitTimes(3), "A10") == "Your boba is next!"


            def test_text_gives_the_minutes_above_three():
                assert TextMessage().body(StubWaitTimes(4), "A10") == "About 4 min until your boba is ready."
      explanation: |
        In `pickup_screen.py`, the two lines that compute `ahead` and `minutes` moved to `WaitTimes` as `minutes_until_ready(order_id)`: together they are the whole rule, and they end in a plain number. `text_message.py` had the same two lines, so instead of moving them again it now calls `minutes_until_ready`; the forwarding method that Move Method left in `PickupScreen` was deleted. The new tests hand each caller a `StubWaitTimes` that returns a chosen number, so they check what the screen and the text do with any estimate: one screen test, and text tests at 3 and 4 minutes, the last value on each side of the cutoff. None of them knows the 3-minute rule, so they keep passing when the rule changes.

  # =========================================================================
  # STEP 4 — The Secret Nobody Imported
  # =========================================================================
  # Pedagogy: productive failure (the diagram shows no arrow, so the first analysis is usually wrong); TDD red then green; testing: a stub value the copied rule cannot produce
  - title: "The Secret Nobody Imported"
    key: rewards
    instructions: |
      ### Why this matters

      Two modules can depend on the same decision without either one importing the other. Each simply contains its own copy of the rule. No arrow in a class diagram shows that, so the way to find it is to ask what a change would touch.

      ### 🎯 You will learn to

      - **Identify** a dependency that a class diagram does not show
      - **Apply** a test that proves a module asks the owner instead of copying its rule
      - **Evaluate** the change impact of a rule that has two copies

      ### The design

      `Rewards` awards loyalty points. `Receipt` prints how many points an order earned. Look at the class diagram: there is no arrow between them.

      ### Your tasks

      1. **Think.** The change request: *"Loyalty relaunch: customers earn 2 points per dollar."* Fill in `BEFORE` in `change_impact.py`.
      2. **Test first.** In `test_receipt.py`, hand `Receipt.lines` a second argument: a stub whose `points_for` returns a number that today's rule could never produce, like 99. Expect the receipt to show that number. Press **Test**. It fails.
      3. **Fix.** Change `Receipt.lines` to take `(order, rewards)` and to ask `rewards.points_for(...)` instead of dividing. Press **Test**. It passes. This is a one-line change, so you do not need a refactoring tool.
      4. **Reason.** Fill in `AFTER`, then look at the class diagram again.

      <details markdown="1">
      <summary>What you just did</summary>

      `Receipt` and `Rewards` had a **semantic dependency**: both implemented the same design decision. A **syntactic dependency**, such as an import or a call, shows up as an arrow. A semantic one does not, which makes it harder to find.

      The diagram now shows an arrow from `Receipt` to `Rewards`. That is an improvement: a dependency you can see replaced a copy you could not.

      Why a stub that answers 99? With the real `Rewards`, the copied rule and the real rule both say 5, so the test could not tell them apart.

      </details>
    files:
      - path: receipt.py
        language: python
        reseed: true
        content: |
          from order import Order


          class Receipt:
              def lines(self, order: Order) -> list[str]:
                  earned = order.total_cents // 100
                  return [
                      f"{order.drink}  ${order.total_cents / 100:.2f}",
                      f"You earned {earned} points",
                  ]
      - path: rewards.py
        language: python
        reseed: true
        content: |
          class Rewards:
              """Loyalty points. Today's rule: 1 point for every full dollar spent."""

              def __init__(self) -> None:
                  self._balances: dict[str, int] = {}

              def points_for(self, total_cents: int) -> int:
                  return total_cents // 100

              def record_purchase(self, customer: str, total_cents: int) -> None:
                  self._balances[customer] = self.balance(customer) + self.points_for(total_cents)

              def balance(self, customer: str) -> int:
                  return self._balances.get(customer, 0)
      - path: order.py
        language: python
        reseed: true
        content: |
          class Order:
              def __init__(self, drink: str, total_cents: int) -> None:
                  self.drink = drink
                  self.total_cents = total_cents
                  self.status = "new"
      - path: change_impact.py
        language: python
        reseed: true
        content: |
          """Change impact analysis.

          Change request: "Loyalty relaunch: customers earn 2 points per dollar."

          List every file of ours that someone would have to edit to make that change.
          Test files count: a test that must be rewritten is part of the cost.
          """

          # Your analysis of the starting design.
          BEFORE = []

          # Fill this in after your change passes the tests.
          AFTER = []
      - path: test_receipt.py
        language: python
        reseed: true
        content: |
          from order import Order
          from receipt import Receipt


          def test_receipt_shows_the_drink_and_the_points():
              lines = Receipt().lines(Order("Thai Tea", 500))
              assert lines == ["Thai Tea  $5.00", "You earned 5 points"]
    open_file: receipt.py
    run_file: test_receipt.py
    uml_files:
      - rewards.py
      - receipt.py
    tests:
      - description: "Before: the analysis lists every file that would need an edit"
        command: |
          _ns = {}
          exec(open("/tutorial/change_impact.py").read(), _ns)
          def _files(value):
              assert isinstance(value, (list, tuple, set)), "Keep each analysis as a list of file names."
              return {str(name).strip() for name in value}

          _truth = {"rewards.py", "receipt.py", "test_receipt.py"}
          _missing = _truth - _files(_ns.get("BEFORE", []))
          assert not _missing, f"BEFORE is missing {len(_missing)} file(s) that contain the points rule or a number that comes from it."
        hints: &l4_before
          - title: "Would this file survive the relaunch?"
            text: "Go through the files one at a time and ask: if customers earned 2 points per dollar, would this file still be correct exactly as written? Imports and arrows do not decide this."
          - title: "Search for the rule itself"
            text: "Search for the rule itself: the arithmetic that turns cents into points, wherever it appears. A file can know the rule without importing the module that owns it."
          - title: "Tests are files too"
            text: "Tests are files too. Does any test expect a number of points that you could only work out by knowing the rule?"
      - description: "Before: the analysis lists no file that could stay as it is"
        command: |
          _ns = {}
          exec(open("/tutorial/change_impact.py").read(), _ns)
          def _files(value):
              assert isinstance(value, (list, tuple, set)), "Keep each analysis as a list of file names."
              return {str(name).strip() for name in value}

          _truth = {"rewards.py", "receipt.py", "test_receipt.py"}
          _before = _files(_ns.get("BEFORE", []))
          assert _before, "BEFORE is still empty."
          _extra = _before - _truth
          assert not _extra, f"BEFORE lists {len(_extra)} file(s) that would not need an edit."
        hints: *l4_before
      - description: "The receipt shows the points that the rewards module awards"
        command: |
          import sys
          for _name in list(sys.modules):
              if (getattr(sys.modules[_name], "__file__", "") or "").startswith("/tutorial/"):
                  del sys.modules[_name]

          from order import Order
          from receipt import Receipt
          class FixedRewards:
              def __init__(self):
                  self.asked = []
              def points_for(self, total_cents):
                  self.asked.append(total_cents)
                  return 42
          _rewards = FixedRewards()
          try:
              _lines = Receipt().lines(Order("Thai Tea", 500), _rewards)
          except TypeError as _error:
              raise AssertionError(f"Receipt.lines should accept the order and the rewards module: {_error}")
          assert _lines == ["Thai Tea  $5.00", "You earned 42 points"], "The points line should show what rewards.points_for returns."
          assert _rewards.asked == [500], "The receipt should ask rewards about the order's total."
        hints: &l4_owner
          - title: "What the stand-in offers"
            text: "The check hands the receipt a rewards module with its own rule. It offers only `points_for`. Does the receipt ask it, or work the points out by itself?"
          - title: "The line that copies the rule"
            text: "In `Receipt`, find the line that only makes sense if you know the points rule. That is the copy to replace."
          - title: "Let the owner answer"
            text: "If the check says the receipt does not accept the rewards module, add it as the second parameter of `lines`. Then let `points_for` answer for the order's total."
      - description: "The receipt is unchanged for today's rule"
        command: |
          import sys
          for _name in list(sys.modules):
              if (getattr(sys.modules[_name], "__file__", "") or "").startswith("/tutorial/"):
                  del sys.modules[_name]

          from order import Order
          from receipt import Receipt
          from rewards import Rewards
          try:
              _lines = Receipt().lines(Order("Thai Tea", 500), Rewards())
          except TypeError as _error:
              raise AssertionError(f"Receipt.lines should accept the order and the rewards module: {_error}")
          assert _lines == ["Thai Tea  $5.00", "You earned 5 points"]
          assert Receipt().lines(Order("Matcha Latte", 625), Rewards()) == ["Matcha Latte  $6.25", "You earned 6 points"]
        hints: &l4_same
          - title: "Read the first failing line"
            text: "Press **Test** and read the first failing line in the output. It tells you which file and which line broke."
          - title: "A call that does not match"
            text: "A `TypeError` means `Receipt.lines` does not take the order and the rewards module yet, or some code still calls it with only the order."
          - title: "Compare the text"
            text: "Compare each receipt line with the expected text, character by character. Only the points come from the rewards module now; the line with the drink and the price stays as it was."
      - description: "Your tests pass on your code"
        command: |
          from tutorial_test_grading import check_suite
          check_suite("/tutorial/test_receipt.py", "receipt", min_tests=1)
        hints: &l4_pass
          - title: "Read which test fails"
            text: "Press **Test** and read which test fails, and on which line."
          - title: "A test that calls lines the old way"
            text: "A `TypeError` saying that `lines()` is missing an argument means a test still calls `Receipt.lines` with only the order. Since your fix, `lines` also takes the rewards module, so every call must hand it one."
          - title: "How, not what"
            text: "A test that passes the real `Rewards` and expects 5 points checks the rule, not whether the receipt asks for the points. What did it want to guarantee?"
          - title: "Hand the receipt a stub"
            text: "Give `Receipt.lines` a stand-in with the one method it calls, `points_for`. Choose the number it returns yourself, so the test no longer depends on the rule."
      - description: "Your tests catch a receipt that works out the points by itself"
        command: |
          from tutorial_test_grading import check_suite
          _CHANGED = '''class Receipt:
              def lines(self, order, rewards):
                  earned = order.total_cents // 100
                  return [
                      f"{order.drink}  ${order.total_cents / 100:.2f}",
                      f"You earned {earned} points",
                  ]
          '''
          check_suite("/tutorial/test_receipt.py", "receipt", replacement_source=_CHANGED, expect_failure=True)
        hints: &l4_catch
          - title: "Which input tells them apart?"
            text: "Which number from your stub would make a receipt that asks and a receipt that divides by itself disagree?"
          - title: "A number the rule could never give"
            text: "If your stub returns what today's rule would give anyway, both receipts print the same line. Pick a number that the rule could never produce for that order."
          - title: "Assert the whole result"
            text: "Compare the whole list of lines with `==`, not just that some line mentions points."
      - description: "Your tests still pass when the points rule changes"
        command: |
          from tutorial_test_grading import check_suite
          _CHANGED = '''class Rewards:
              """Relaunched rule: 2 points for every full dollar spent."""

              def __init__(self) -> None:
                  self._balances = {}

              def points_for(self, total_cents: int) -> int:
                  return total_cents // 100 * 2

              def record_purchase(self, customer: str, total_cents: int) -> None:
                  self._balances[customer] = self.balance(customer) + self.points_for(total_cents)

              def balance(self, customer: str) -> int:
                  return self._balances.get(customer, 0)
          '''
          check_suite("/tutorial/test_receipt.py", "rewards", replacement_source=_CHANGED, min_tests=1)
        hints: *l4_pass
      - description: "After: only the rewards module would need an edit"
        command: |
          _ns = {}
          exec(open("/tutorial/change_impact.py").read(), _ns)
          def _files(value):
              assert isinstance(value, (list, tuple, set)), "Keep each analysis as a list of file names."
              return {str(name).strip() for name in value}

          _after = _files(_ns.get("AFTER", []))
          assert _after, "AFTER is still empty."
          assert _after == {"rewards.py"}, "AFTER should list exactly the files that still contain the points rule."
        hints: &l4_after
          - title: "Ask the Think question again"
            text: "Redo the Think question on the new code: if customers earned 2 points per dollar, which files would still be wrong as written?"
          - title: "Only files that still know the secret"
            text: "Only files that still contain the points rule belong on the list. A file that calls `points_for` does not need to know the rule."
          - title: "More than one file left?"
            text: "If more than one file is still on your list, a caller or a test still knows the secret. Find it and finish that part of the refactoring first."
    quiz:
      title: "Step 4 — Knowledge Check"
      min_score: 0.8
      questions:
        - question: "In the starting code, `Receipt` did not import `Rewards`, and the class diagram showed no arrow between them. What kind of dependency did they have?"
          type: single
          difficulty: basic
          options:
            - "None, since neither one imports or calls the other"
            - "A semantic dependency: both held the points rule"
            - "A syntactic dependency through the shared `Order` class"
            - "A syntactic dependency that the diagram left out"
          correct_index: 1
          option_feedback:
            0: "The relaunch to 2 points per dollar would have to touch both files. Whether two modules depend on each other is decided by what a change touches, not by imports."
            2: "`Rewards` does not use `Order` at all; it works with plain cents. And a shared import would show up as arrows, while this dependency had none."
            3: "A syntactic dependency is an import or a call, and the diagram does draw those. There was none here: each class simply contained its own copy of the rule."
          explanation: "`Receipt` computed `order.total_cents // 100` itself, the same rule as `Rewards.points_for`. Two modules that implement the same design decision have a semantic dependency: change the decision and both must change, yet no arrow shows it."
        - question: |
            Does this Python test show that `Receipt` asks `Rewards` for the points?

            ```python
            def test_receipt_asks_rewards():
                lines = Receipt().lines(Order("Thai Tea", 500), Rewards())
