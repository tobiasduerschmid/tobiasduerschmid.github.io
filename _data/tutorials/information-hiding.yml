    solution:
      files:
        - path: order_service.py
          language: python
          content: |
            from order import Order
            from payments import Payments


            class OrderService:
                def checkout(self, payments: Payments, order: Order) -> bool:
                    cents = order.total_cents
                    paid = payments.charge(cents)
                    if paid:
                        order.status = "paid"
                    return paid
        - path: refund_service.py
          language: python
          content: |
            from order import Order
            from payments import Payments


            class RefundService:
                def refund_order(self, payments: Payments, order: Order) -> bool:
                    cents = order.total_cents
                    refunded = payments.refund(cents)
                    if refunded:
                        order.status = "refunded"
                    return refunded
        - path: wallet_service.py
          language: python
          content: |
            from payments import Payments


            class WalletService:
                def __init__(self) -> None:
                    self.saved_cards: dict[str, str] = {}

                def add_payment_method(self, payments: Payments, customer: str) -> str:
                    card_id = payments.save_card(customer)
                    self.saved_cards[customer] = card_id
                    return card_id
        - path: payments.py
          language: python
          content: |
            from paypal_sdk import PayPalClient


            class Payments:
                """Boba Run's payments module."""

                def __init__(self) -> None:
                    self.__paypal = PayPalClient("boba-run")

                def charge(self, cents):
                    token = self.__paypal.authenticate()
                    result = self.__paypal.capture(token, cents)
                    paid = result.was_successful()
                    return paid

                def refund(self, cents):
                    token = self.__paypal.authenticate()
                    result = self.__paypal.reverse(token, cents)
                    refunded = result.was_successful()
                    return refunded

                def save_card(self, customer: str):
                    token = self.__paypal.authenticate()
                    card_id = self.__paypal.vault(token, customer)
                    return card_id
        - path: change_impact.py
          language: python
          content: |
            """Change impact analysis.

            Change request: "PayPal is raising its fees. Switch Boba Run to Stripe."

            List every file of ours that someone would have to edit to make that change.
            - paypal_sdk.py is PayPal's code, not ours, so it never goes on a list.
            - Test files count: a test that must be rewritten is part of the cost.
            """

            # Your analysis of the starting design, for example ["order.py"].
            BEFORE = ["payments.py", "order_service.py", "refund_service.py", "wallet_service.py"]

            # Fill this in after your refactoring passes the tests.
            AFTER = ["payments.py"]
      explanation: |
        In each service, the three lines from `token = …` through the `was_successful()` call moved to `Payments` as `charge`, `refund`, and `save_card`. Those are exactly the lines that only make sense if you know PayPal, and the last one produces a plain `True`/`False` or card id, so no PayPal object reaches a caller. The published `payments.py` is exactly what Extract, Move Method, and Rename Symbol produce; the forwarding methods that Move Method left in the services were deleted, though keeping them passes every check too. `test_shop.py` was not edited: its four behavior tests pass before and after, which is the evidence that the refactoring kept the shop's behavior.

  # =========================================================================
  # STEP 2 — Private Is Not Hidden
  # =========================================================================
  # Pedagogy: misconception repair by prediction (private = hidden); completion problem (the learner chooses the lines); testing: behavior, not implementation
  - title: "Private Is Not Hidden"
    key: menu
    instructions: |
      ### Why this matters

      Making an attribute private does not hide a decision if a public operation hands it out anyway. What other code can depend on is decided by the whole interface: every public operation and everything it returns.

      ### 🎯 You will learn to

      - **Explain** why a private attribute can still leak a design decision
      - **Apply** the refactoring tools to take a data format out of an interface
      - **Evaluate** which tests survive when a hidden detail changes

      ### The design

      `Menu` loads the price list that our supplier sends. Look at its box in the class diagram: the attribute `__lines` is private.

      ### Your tasks

      1. **Think.** The change request: *"Our supplier is replacing the CSV export with JSON."* `__lines` is private, so is `menu.py` the only file that changes? Decide first. Then read `kiosk.py` and `test_kiosk.py`, and fill in `BEFORE` in `change_impact.py`.
      2. **Refactor.** In `kiosk.py`, find the lines that would break if a row stopped looking like `Taro Milk Tea,550,M|L`. Extract them into two methods named `price_cents` and `sizes`, and move each one to `Menu`.
      3. **Lock it.** `rows()` is the operation that handed the secret out. In `menu.py`, click on `rows` in the line `def rows(self)` and rename it to `__rows`.
      4. **Test.** Press **Test**. One test fails. It checked how the menu stores drinks, not what the menu does. Rewrite it so that it checks something the menu promises. Keep three tests.
      5. **Reason.** Fill in `AFTER`.

      <div class="uml-class-diagram-container" data-uml-type="class" data-uml-role="reference-design" data-uml-caption="Target: Menu promises names, prices, and sizes. The layout of a row is no longer part of any promise." data-uml-spec='@startuml
      layout horizontal
      class Kiosk {
        + total_cents(menu, drinks): int
        + offers_size(menu, drink, size): bool
      }
      class Menu {
        - __lines: list[str]
        - __rows(): list[str]
        + drink_names(): list[str]
        + price_cents(drink): int
        + sizes(drink): list[str]
      }
      Kiosk ..> Menu : price_cents, sizes
      @enduml'></div>

      <details markdown="1">
      <summary>What you just did</summary>

      `__lines` was private the whole time. The layout leaked anyway, through `rows()`: a public operation that returned the raw rows. Callers split those rows on commas, so they knew the layout too.

      **Information hiding is not about hiding data. It is about hiding design decisions.** An interface is a list of promises. `rows()` promised the file layout. Now `Menu` promises only what callers need: names, prices, and sizes.

      The failing test was a caller too. A good test passes for any correct implementation.

      </details>
    files:
      - path: kiosk.py
        language: python
        reseed: true
        content: |
          from menu import Menu


          class Kiosk:
              def total_cents(self, menu: Menu, drinks: list[str]) -> int:
                  total = 0
                  for drink in drinks:
                      price = 0
                      for row in menu.rows():
                          fields = row.split(",")
                          if fields[0] == drink:
                              price = int(fields[1])
                      total += price
                  return total

              def offers_size(self, menu: Menu, drink: str, size: str) -> bool:
                  available = []
                  for row in menu.rows():
                      fields = row.split(",")
                      if fields[0] == drink:
                          available = fields[2].split("|")
                  return size in available
      - path: menu.py
        language: python
        reseed: true
        content: |
          SUPPLIER_EXPORT = """\
          Taro Milk Tea,550,M|L
          Thai Tea,500,M
          Matcha Latte,625,M|L
          """


          class Menu:
              """The drinks Boba Run sells, loaded from the supplier's CSV export.

              Each row looks like:  Taro Milk Tea,550,M|L
              """

              def __init__(self, csv_text: str) -> None:
                  self.__lines = [line for line in csv_text.splitlines() if line]

              def rows(self) -> list[str]:
                  return self.__lines

              def drink_names(self) -> list[str]:
                  return [line.split(",")[0] for line in self.__lines]


          def load_menu() -> Menu:
              return Menu(SUPPLIER_EXPORT)
      - path: change_impact.py
        language: python
        reseed: true
        content: |
