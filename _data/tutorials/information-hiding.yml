      - description: "The menu no longer hands out its supplier rows"
        command: |
          import sys
          for _name in list(sys.modules):
              if (getattr(sys.modules[_name], "__file__", "") or "").startswith("/tutorial/"):
                  del sys.modules[_name]

          import inspect
          import menu as _menu_module
          _menu = _menu_module.load_menu()
          _raw = [line for line in _menu_module.SUPPLIER_EXPORT.splitlines() if line]
          def _leaks(value):
              if isinstance(value, str):
                  return value in _raw
              if isinstance(value, (list, tuple)):
                  return any(_leaks(item) for item in value)
              return False
          _leaky = []
          for _name, _value in inspect.getmembers(_menu):
              if _name.startswith("_"):
                  continue
              if callable(_value):
                  try:
                      _required = [p for p in inspect.signature(_value).parameters.values()
                                   if p.default is p.empty and p.kind in (p.POSITIONAL_ONLY, p.POSITIONAL_OR_KEYWORD)]
                      if _required:
                          continue
                      _value = _value()
                  except Exception:
                      continue
              if _leaks(_value):
                  _leaky.append(_name)
          assert not _leaky, "A public part of Menu still returns the supplier's raw rows."
