            2: The lengths [0,1,0] read the same when reversed. Several items alone do not guarantee an informative test.
            3: The lengths [0,2,1] become [1,2,0] when prepended. Their asymmetric order exposes the difference.
          explanation: Both folds have the same input and output types, but only appendSize preserves the word-length
