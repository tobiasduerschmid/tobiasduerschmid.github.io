    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where

            digitsToNumber :: [Integer] -> Integer
            digitsToNumber = foldl (\acc digit -> acc * 10 + digit) 0

            main :: IO ()
            main = do
              print (foldl (\acc label -> "(" ++ acc ++ ")" ++ label) "" ["a","b"])
              print (digitsToNumber [3,0,7])
              -- For [1,0,2], accumulator values are 0, 1, 10, 102.
      explanation: |
        Multiplying the accumulated prefix by 10 shifts its digits one decimal position. Adding the next digit extends that prefix. The seed 0 handles both the empty list and leading zeroes. A recursive helper carrying the same accumulator is an equivalent solution.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 34,65–69,90–94,114,120–123.
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 3b–c (recursive cases and a seeded helper's type).
  # Original transfer: paired classification counts, rather than the lecture's generic foldl/sum body.
  # Pedagogy: contrast an order-sensitive string accumulator with conditional updates to paired state.
  - title: "Recursive Accumulators"
    key: recursive-accumulators
    instructions: |
      ### Why this matters

      A report may need both accepted and rejected record counts, and a
      parser may need both its current position and the result built so
      far. **An accumulator makes that evolving state explicit** as inputs
      to the next recursive call. Choosing what each component means helps
      you check that every branch updates the right facts and preserves
      the others. Here, a pair of counts gives you practice reasoning about
      several related pieces of state in one traversal.

      ### 🎯 You will learn to

      - Repair a recursive helper that carries two related counts through a list.
      - Infer the function type that remains after fixing the initial counts and predicate.

      ### An Accumulator Is a Parameter

      Here is a function that wraps a piece of text in a succession of named layers:

      ```haskell
      nestFrom inside [] = inside
      nestFrom inside (label:labels) =
        nestFrom (label ++ "(" ++ inside ++ ")") labels
      ```

      `nestFrom "seed" ["oak","ivy"]` carries "seed", then "oak(seed)", then "ivy(oak(seed))". The empty-list case returns the current text. Each recursive call gets a new value; it does not change an earlier binding.

      ### Thinking Time!

      In the starter, `tallyFrom (yes, no) predicate items` should count items that pass and fail a predicate, starting from the supplied counts. Trace the two branches on `["","oak",""]` with predicate `null`. The starter increments the same count in both branches. Predict its output before running, then compare it with the required result.

      ### Your Turn

      Fix `tallyFrom`. Its accumulator is a pair of `Int` counts `(yes, no)`. For each input item, add one to `yes` if the predicate returns `True`; otherwise add one to `no`. Leave the other count unchanged. Empty input returns the initial pair. Initial counts are nonnegative, and repeated items count separately.

      For example, `tallyFrom (2,1) null ["","oak",""]` returns `(4,2)`: two more empty strings and one more nonempty string. The same function must also accept predicates on numbers, Boolean values, or lists.

      Keep the call recursive and pass the updated pair to the tail call. Explain why each branch updates exactly one count. Then write the type of `tallyFrom (2,1) null` in a comment. The count pair is fixed, but the element type of each list tested by `null` remains arbitrary.

      Also derive the type of `tallyFrom (2,1)` with **only the seed supplied**. What arguments are still missing? Write your answer before opening the check. This is a manual type exercise; Test My Work checks the counting behavior.

      <details markdown="1">
      <summary>Check the type after supplying only the seed</summary>

      The remaining function still accepts a predicate and then a list:

      ```haskell
      tallyFrom (2,1) :: (a -> Bool) -> [a] -> (Int, Int)
      ```

      The predicate's input and the list's element must share `a`. Supplying `null :: [b] -> Bool` next makes that `a` a list type `[b]`, leaving `[[b]] -> (Int, Int)`. Fixing the numeric seed alone does not make the input items numeric.

      </details>
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where

          tallyFrom :: (Int, Int) -> (a -> Bool) -> [a] -> (Int, Int)
          tallyFrom counts predicate [] = counts
          tallyFrom (yes, no) predicate (x:xs)
            | predicate x = tallyFrom (yes + 1, no) predicate xs
            | otherwise   = tallyFrom (yes + 1, no) predicate xs

          main :: IO ()
          main = do
            print (tallyFrom (2,1) null ["","oak",""])
            print (tallyFrom (0,0) null [[],[1],[]])
    run_file: Main.hs
    tests:
      - description: "Seeded classification counts for mixed and repeated items"
        command: |
          tallyFrom (2,1) null ["","oak",""] == (4,2) && tallyFrom (3,4) null ([] :: [String]) == (3,4) && tallyFrom (0,0) (\n -> n < 0) [-1,0,1,-1 :: Int] == (2,2) && tallyFrom (1,2) (\flag -> flag) [False,True,False] == (2,4) && tallyFrom (0,0) null [[],[1],[]] == (2,1) && tallyFrom (0,0) (\_ -> True) [1,2,3 :: Int] == (3,0) && tallyFrom (0,0) (\_ -> False) [1,2,3 :: Int] == (0,3) && tallyFrom (2,3) (\f -> f 0 == 1) [(\n -> n + 1), (\n -> n), (\n -> n + 1)] == (4,4)
        hints:
          # Conditions: unchanged failure branch; discarded supplied counts; other branch updates.
          - title: "A Plausible Total Can Hide Wrong Categories"
            condition: "code_matches: /^(?:(?![\\s\\S]*(?:^|\\n)tallyFrom\\b(?![^\\n]*::))|(?=[\\s\\S]*(?:(?:^|\\n)tallyFrom\\b(?![^\\n]*::)(?:(?!\\n[A-Za-z_]\\w*\\s*(?:::|[^\\n]*=))[\\s\\S])*otherwise\\s*=\\s*tallyFrom\\s*\\(\\s*yes\\s*\\+\\s*1\\s*,\\s*no\\s*\\)|(?:^|\\n)tallyFrom\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*(?:undefined|error\\s+\"[^\"\\n]*\"|_)\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$))))/"
            text: "Inspect both components, not just their sum. The starter makes the same change in both branches, so a plausible total alone cannot show that successes and failures were classified correctly."
          - title: "Trace a Failure Followed by a Success"
            condition: "code_matches: /^(?=[\\s\\S]*(?:^|\\n)tallyFrom\\b(?![^\\n]*::))(?![\\s\\S]*(?:(?:^|\\n)tallyFrom\\b(?![^\\n]*::)(?:(?!\\n[A-Za-z_]\\w*\\s*(?:::|[^\\n]*=))[\\s\\S])*otherwise\\s*=\\s*tallyFrom\\s*\\(\\s*yes\\s*\\+\\s*1\\s*,\\s*no\\s*\\)|(?:^|\\n)tallyFrom\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*(?:undefined|error\\s+\"[^\"\\n]*\"|_)\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$)))(?=[\\s\\S]*(?:^|\\n)tallyFrom\\b(?![^\\n]*::)(?:(?!\\n[A-Za-z_]\\w*\\s*(?:::|[^\\n]*=))[\\s\\S])*(?:\\btallyFrom\\s*\\(\\s*0\\s*,\\s*0\\s*\\)|\\[\\s*\\]\\s*=\\s*\\(\\s*0\\s*,\\s*0\\s*\\)))/"
            text: "Use seed (2,1), predicate null, and input [\"oak\",\"\"]. Record the predicate result and the next count pair for each item. Compare your trace with the recursive calls; check that the supplied counts have not been discarded."
          - title: "Complete the Pair in the Tail Call"
            condition: "code_matches: /^(?=[\\s\\S]*(?:^|\\n)tallyFrom\\b(?![^\\n]*::))(?![\\s\\S]*(?:(?:^|\\n)tallyFrom\\b(?![^\\n]*::)(?:(?!\\n[A-Za-z_]\\w*\\s*(?:::|[^\\n]*=))[\\s\\S])*otherwise\\s*=\\s*tallyFrom\\s*\\(\\s*yes\\s*\\+\\s*1\\s*,\\s*no\\s*\\)|(?:^|\\n)tallyFrom\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*(?:undefined|error\\s+\"[^\"\\n]*\"|_)\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$)))(?![\\s\\S]*(?:^|\\n)tallyFrom\\b(?![^\\n]*::)(?:(?!\\n[A-Za-z_]\\w*\\s*(?:::|[^\\n]*=))[\\s\\S])*(?:\\btallyFrom\\s*\\(\\s*0\\s*,\\s*0\\s*\\)|\\[\\s*\\]\\s*=\\s*\\(\\s*0\\s*,\\s*0\\s*\\)))/"
            text: "Use `tallyFrom (...) predicate xs` as a partial recursive call. For the branch you are repairing, decide each component of the missing pair separately: which has a contribution from this item, and which must retain its current value? Check an input containing only that branch's category."
    quiz:
      title: Step 6 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
        - type: single
          bloom: apply
          difficulty: intermediate
          question: |-
            Given `tallyFrom :: (Int, Int) -> (a -> Bool) -> [a] -> (Int, Int)` and `null :: [b] -> Bool`, what type remains after `tallyFrom (2,1) null`?

            Track the item and result types before choosing. Compare your reasoning with the feedback afterward.
          options:
            - '`[[b]] -> (Int, Int)`'
            - '`[Bool] -> (Int, Int)`'
            - '`[b] -> Int`'
          correct_index: 0
          option_feedback:
            1: Null consumes a list rather than a Boolean. Each item in the outer input must therefore itself be a list.
            2: The result remains a pair of counts, and null requires each input item to have list type.
          explanation: Supplying the seed and predicate leaves only the list argument. Null fixes a to [b], so that remaining
            argument has type [[b]].
        - type: single
          bloom: analyze
          difficulty: intermediate
          question: 'A repaired `tallyFrom` passes a test where every input satisfies its predicate. In its failing branch,
            two proposed bugs remain possible: increment both counts, or reset the success count to zero. Which additional
            test exposes both bugs?'
          options:
            - '`tallyFrom (2,3) null ["x"] == (2,4)`'
            - '`tallyFrom (0,0) null [""] == (1,0)`'
            - '`tallyFrom (0,0) null ["x"] == (0,1)`'
          correct_index: 0
          option_feedback:
            1: An empty string takes the successful branch, leaving both suspected failing-branch bugs untested.
            2: 'This detects incrementing both counts but not resetting the success count: it is already zero.'
          explanation: 'A failing item with a nonzero success seed checks both requirements: increase only failures, and
            preserve earlier successes. The proposed bugs would give (3,4) and (0,4) instead.'
        - type: single
          bloom: evaluate
          difficulty: advanced
          question: A new report must count passing and failing items, retain supplied starting counts, and express both
            updates in one source-level traversal. A teammate proposes computing each count with a separate `filter` followed
            by `length`. Which review best fits the requirements?
          options:
            - Keep the pair helper; both counts share its recursive traversal.
            - Use separate filters; immutability makes their traversals shared.
            - Use separate filters; adding the seed combines their traversals.
          correct_index: 0
          option_feedback:
            1: Immutability concerns changing bindings, not combining source-level passes. The two filter calls describe
              separate selections.
            2: Adding the seed can preserve starting counts, but it does not combine the separate source-level traversals.
          explanation: Separate filters can compute correct counts when the seed is added. A recursive helper carrying
            both counts directly expresses the requested shared traversal; actual runtime work and memory use may depend
            on evaluation and compiler optimization.
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where

            tallyFrom :: (Int, Int) -> (a -> Bool) -> [a] -> (Int, Int)
            tallyFrom counts predicate [] = counts
            tallyFrom (yes, no) predicate (x:xs)
              | predicate x = tallyFrom (yes + 1, no) predicate xs
              | otherwise   = tallyFrom (yes, no + 1) predicate xs

            -- tallyFrom (2,1) null :: [[b]] -> (Int, Int)
            main :: IO ()
            main = do
              print (tallyFrom (2,1) null ["","oak",""])
              print (tallyFrom (0,0) null [[],[1],[]])
              print (tallyFrom (3,4) null ([] :: [String]))
      explanation: |
        The first example carries (2,1), (3,1), (3,2), then (4,2). The empty case returns that final pair. Each input contributes to exactly one component, and an empty input preserves both initial counts. After fixing the seed and null predicate, the function awaits a list of lists; it does not require their elements to have any particular type.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 8,36,38,54.
  # Assessment: CS131 Fall 25 Quiz 3 v2.docx, Problem 2 (reason about evaluation demand).
  # Pedagogy: PRIMM — finite-prefix prediction, bounded infinite-list practice,
  # and spaced retrieval of map/filter semantics.
  - title: "Lazy Lists"
    key: lazy-lists
    instructions: |
      ### Why this matters

      Finding the first few matches in a large sequence should not require
      constructing every possible candidate first. **Lazy lists let the
      requested result drive how much input is explored**, an idea you will
      also encounter with iterators and generators. But asking for a few
      results can still require an endless search if enough matches never
      appear. Reasoning about demand helps you design useful pipelines and
      explain why an apparently small request does not finish.

      ### 🎯 You will learn to

      - Predict the finite prefix produced from an unbounded range.
      - Create a bounded selection that works on finite and infinite lists.

      ### Demand Drives Evaluation

      Haskell is **lazy**: it evaluates expressions when their values are needed. `[1..]` describes an unbounded list, while `take 3 [1..]` only needs `[1,2,3]`. Printing the entire unbounded list or computing its length cannot finish.

      `take n` asks for at most `n` items. We can use each number in `[0..]` as a requested prefix length: `map (\n -> take n "road") [0..]` begins `["","r","ro","roa","road",...]`. Once the requested length exceeds the word length, each later prefix is still "road". Taking a finite number of these prefixes gives a finite result.

      ### Thinking Time!

      Predict the first two outputs in `main` before running. Does selecting prefixes of length at least two before taking two results give the same result as taking two prefixes before selecting? Write the two intermediate lists or prefixes that support your prediction.

      Record which input prefixes must be inspected to obtain two matching outputs, then open the reveal.

      <details markdown="1">
      <summary>Check the finite search through growing prefixes</summary>

      For `take 2 (filter longEnough prefixes)`, the needed part of the search is:

      | Requested prefix length | Generated prefix | Selection decision |
      | --- | --- | --- |
      | `0` | `""` | Reject |
      | `1` | `"r"` | Reject |
      | `2` | `"ro"` | Keep the first match |
      | `3` | `"roa"` | Keep the second match |

      The result is `["ro","roa"] :: [String]`. No later generated prefix is needed for this result; the intermediate filtered stream is not built in full.

      Reversing the nesting gives `filter longEnough (take 2 prefixes)`. Take supplies only `["","r"]`, so filter returns `[]`. A bound on input positions and a bound on matching outputs ask different questions.

      </details>

      ### Your Turn

      Fix `firstMatches n predicate items`. It must return up to the first `n` matching items in input order. It must stop once it has enough matches, even when the input continues forever. The count `n` is nonnegative; a count of zero returns `[]`, even if an infinite input has no matches: zero requested results require no search. If a finite input runs out, return the matches found so far.

      For example, requesting two prefixes of length at least two from the growing "road" prefixes should give `["ro","roa"]`. From the finite input `["a","oak","b"]`, requesting three strings of length at least two gives only `["oak"]`.

      Decide whether the bound applies before or after selection. Add a finite example with fewer matches than requested and a zero-count example to `main`. For positive counts, the checks use infinite inputs only when enough matches occur after a finite prefix.

      ### A Bound Still Needs Matches

      A finite requested output is not a guarantee of termination: searching the growing "road" prefixes for one longer than four characters will never find its first match. `take` stops after enough results arrive; it cannot make a predicate find a match that does not exist.

      ### Optional Rehearsal: A List of Functions

      Allow about five minutes. A supplied interval function passes its two endpoints to a function you choose. The endpoint values become a pair, a number, or another result only when that chosen function uses them:

      ```haskell
      interval start = \use -> use start (start + 2)
      intervals = map interval [0..]
      ```

      **Write before Run or opening the feedback:** implement `bounds item` to obtain an endpoint pair from one interval, and `midpoint item` to obtain its integer midpoint. Each helper must call `item` with a suitable lambda; use `div` for integer division. Then write expressions that obtain the first three endpoint pairs and the midpoints of the next two intervals after skipping three. Predict both resulting lists. Explain what kind of value `head intervals` is before either helper calls it.

      **Manual check:** Test My Work assesses `firstMatches`, not this rehearsal. Compare your two callbacks, list-operation order, and predictions with the feedback. You may temporarily add the definitions above `main` and print the two finite observations. Restore the main exercise afterward.

      <details markdown="1">
      <summary>Check how the interval functions produce results</summary>

      ```haskell
      bounds item = item (\start finish -> (start, finish))
      midpoint item = item (\start finish -> (start + finish) `div` 2)

      firstBounds = take 3 (map bounds intervals)
      laterMidpoints = take 2 (map midpoint (drop 3 intervals))
      ```

      The lists are `[(0,2),(1,3),(2,4)]` and `[4,5]`. `head intervals` is a function awaiting a consumer. It is neither an endpoint pair nor a midpoint yet. For example, `bounds (interval 0)` passes the pair-making lambda to the interval; the interval calls it with `0` and `2`.

      Each lambda binds `start` and `finish` to those supplied values. Choosing a different callback changes the interpretation without changing the interval. `map bounds` or `map midpoint` applies that interpretation to each function in the list. `drop 3` skips starts 0, 1, and 2; `take 2` then requests only starts 3 and 4. These finite observations need only a finite prefix of the unbounded input.

      </details>
