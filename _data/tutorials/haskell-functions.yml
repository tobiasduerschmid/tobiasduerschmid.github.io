            A fold should collect one word length per input word in the original order. Compare these reducers, both used with seed `[]`. Select every input that distinguishes them.

            ```haskell
            appendSize acc word = acc ++ [length word]
            prependSize acc word = length word : acc
            ```
          options:
            - '`["a","owl"]`'
            - '`["ox","hi"]`'
            - '`["","a",""]`'
            - '`["","to","x"]`'
