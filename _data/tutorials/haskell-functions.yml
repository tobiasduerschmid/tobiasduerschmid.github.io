# Course alignment: intro_to_functional_programming_and_haskell_v10_handouts.pdf,
# physical PDF pages 8,36,38–39,54,65–69,73–75,79–80,86–94,100–107,114,120–127.
# Assessment families: Fall 25 Quiz 1 Problems 3/5; Fall 25 Quiz 3 Problem 2;
# [Midterm] F23 (Public).pdf Problems 3/4; [Midterm] F24 V1 (Public).pdf Problem 3;
# [Final] F24 V1 (Public).pdf Problem 1. Exercises are original, not past questions.
# Pedagogical arc: distinguish transformations → bind behavior → infer types →
# reduce data → repair recursive accumulators → choose a pipeline independently.
title: "Haskell 2: Functions and Laziness"
description: "An interactive course for programmers who have completed Haskell 1 or can use lists, tuples, pattern matching, and recursion. Build higher-order functions, derive types, and trace accumulators and finite lazy-list results. Plan about 80–100 minutes."
learning_objectives:
  - "Apply map and filter according to whether a task transforms or selects values."
  - "Analyze lambda bindings, lexical scope, and the types of partially applied functions."
  - "Derive higher-order function types from relationships between arguments and results."
  - "Apply left folds and complete recursive helpers with structured accumulators."
  - "Predict finite results obtained by mapping, filtering, and taking from infinite ranges."
  - "Create a tested data-processing pipeline from an input and output contract."
backend: haskell
debugger: true
require_tests: true

# Preserve matching saved lessons without crediting replacements at the same index.
progress_version: 2
legacy_step_keys: [map-filter, lambdas, currying, composition, left-folds, right-folds, lazy-lists, playlist]

steps:
  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 86–89.
  # Assessment: [Midterm] F23 (Public).pdf, Problem 3a–b, p. 6 (map/filter);
  # CS131 Fall 25 Quiz 1 v2.docx, Problem 3b (complete recursive cases).
  # Pedagogy: PRIMM — contrast map/filter predictions, then combine known parts.
  - title: "Map and Filter"
    key: map-filter
    instructions: |
      ### Why this matters

      A lot of list recursion repeats the same walk through the list. Higher-order functions let us name that walk once and supply the part that changes: what to do with each item.

      ### 🎯 You will learn to

      - Analyze the difference between transforming values and selecting values.
      - Apply `map` and `filter` to a score list without changing the original.

      This is Part II of the Haskell course. You should be comfortable with functions, lists, tuples, and `(x:xs)` patterns. Plan about 80–100 minutes; after Higher-Order Types is a good stopping point. This is an estimate, not a time limit.

      ### A Function as an Argument

      A **higher-order function** accepts a function or returns a function. Haskell functions are **first-class values**: we can give them names, pass them around, and return them.

      ```haskell
      map    :: (a -> b)    -> [a] -> [b]
      filter :: (a -> Bool) -> [a] -> [a]
      ```

      `map f` transforms every item with `f`. `filter p` keeps the original items for which predicate `p` returns `True`. Both preserve the order of the items they produce; neither changes the input list.

      Two useful predicates: `even n` returns whether an integer is divisible by 2, and `null xs` returns whether a list is empty. Each returns a Boolean, so either can serve as the decision passed to `filter`.

      This recursive example selects ready entries and projects just their names:

      ```haskell
      readyNames [] = []
      readyNames ((name, ready):rest)
        | ready       = name : readyNames rest
        | otherwise   = readyNames rest
      ```

      Both branches continue with the tail. A passing entry contributes its name, not its Boolean flag or the whole pair. Selection and transformation are separate decisions even when one recursive function performs both.

      ### Thinking Time!

      The first two lines of `main` use the same predicate and the same input. Predict both outputs before selecting **Run**. Each request is a pair `(needed, available)`. Does mapping the `fits` predicate produce requests or Boolean decisions?

      After running, explain why one output has three items while the other has two. The function's result means “replacement value” to `map` and “keep this item?” to `filter`.

      ### Your Turn

      Fix `qualifiedScores`. It must keep scores **at least 10**, double each kept score, and return them in their original order. Keep repeated scores. For example, `[9,10,12]` should become `[20,24]`; an empty list should stay empty.

      The named helpers already describe the two decisions. Combine them, then add a boundary example of your own to `main`. Before testing, explain which operation must see the original scores.
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where

          qualifies :: Int -> Bool
          qualifies score = score >= 10

          doublePoints :: Int -> Int
          doublePoints score = score * 2

          fits :: (Int, Int) -> Bool
          fits (needed, available) = needed <= available

          qualifiedScores :: [Int] -> [Int]
          qualifiedScores scores = map doublePoints scores

          main :: IO ()
          main = do
            print (map fits [(3,5),(4,2),(0,0)])
            print (filter fits [(3,5),(4,2),(0,0)])
            print (qualifiedScores [9,10,12])
    run_file: Main.hs
    tests:
      - description: "Only original scores at least 10 are doubled, preserving order and repeats"
        command: |
          qualifiedScores [] == [] && qualifiedScores [9,10,11] == [20,22] && qualifiedScores [15,-4,10,15,0] == [30,20,30] && qualifiedScores [1,4,9] == []
        hints:
          - title: "Two Different Questions"
            text: "For each original score, first decide whether it belongs in the result. Only qualifying scores earn doubled points."
          - title: "The Input to the Transformation"
            text: "The list given to map should already contain only qualifying scores. The existing predicate expresses the boundary."
          - title: "Nested Calls"
            text: "The shape is `map transformation (filter predicate originalScores)`. Match each role to a helper in the file."
    quiz:
      title: "Step 1 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "What is `map null [[],[1],[2,3]]`?"
          options:
            - "`[True]`"
            - "`[True,False,False]`"
            - "`[False,True,True]`"
          correct_index: 1
          option_feedback:
            0: "Map retains every function result, including False. It does not use those results to decide which output items to keep."
            2: "Null returns True for the empty list and False for each nonempty list. This answer reverses that predicate."
          explanation: "The three calls to null return True, False, and False. Map can change the element type: here it turns lists into Booleans."
        - type: single
          difficulty: intermediate
          question: |
            Complete the missing branch so rejected entries do not prevent later ready names from appearing.

            ```haskell
            readyNames [] = []
            readyNames ((name, ready):rest)
              | ready       = name : readyNames rest
              | otherwise   = ___
            ```
          options:
            - "`[]`"
            - "`readyNames rest`"
            - "`name : readyNames rest`"
          correct_index: 1
          option_feedback:
            0: "One unready entry does not imply that every later entry is unready. Continue checking the tail."
            2: "This emits a name even though its entry is not ready. Only the passing branch should add that name."
          explanation: "The unready head contributes no name, but the remaining entries still need their own readiness checks."
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where

            qualifies :: Int -> Bool
            qualifies score = score >= 10

            doublePoints :: Int -> Int
            doublePoints score = score * 2

            fits :: (Int, Int) -> Bool
            fits (needed, available) = needed <= available

            qualifiedScores :: [Int] -> [Int]
            qualifiedScores scores = map doublePoints (filter qualifies scores)

            main :: IO ()
            main = do
              print (map fits [(3,5),(4,2),(0,0)])
              print (filter fits [(3,5),(4,2),(0,0)])
              print (qualifiedScores [9,10,12])
      explanation: |
        Filter applies the cutoff to the original scores. Map then doubles exactly those scores. Reversing the operations would let a score such as 9 qualify after doubling. The predicate, transformation, and traversal have separate responsibilities.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 100–107.
  # Assessment: [Final] F24 V1 (Public).pdf, Problem 1B, p. 3 (free names in a returned lambda);
  # [Midterm] F24 V1 (Public).pdf, Problem 3B, p. 5 (infer a map/lambda type).
  # Pedagogy: PRIMM — predict shadowing, investigate captures, then repair a closure.
  - title: "Lambdas and Lexical Scope"
    key: captured-settings
    instructions: |
      ### Why this matters

      Sometimes the behavior passed to `map` is too small to need a separate name. Sometimes that behavior also needs a setting chosen earlier. Lambdas and closures handle both cases.

      ### 🎯 You will learn to

      - Analyze which binding a name refers to inside a lambda.
      - Create a function that retains the settings supplied when it was created.

      ### Small Functions, Right Where We Need Them

      ```haskell
      withSize word = (word, length word)
      -- The same transformation without a function name:
      -- \word -> (word, length word)
      ```

      The backslash introduces a **lambda**, `word` is its parameter, and the expression after `->` is its result. For example, `map (\word -> (word, length word)) ["","elm"]` produces `[("",0),("elm",3)]`.

      A lambda can also use a name from its surrounding definition. In `skip start = \items -> drop start items`, the inner function uses `start` from outside its own parameters. A **closure** keeps a function together with the environment its free names need. A free name is a name used by the function but bound outside its own parameters or local definitions.

      Haskell uses **lexical scope**: the definition's nesting determines those bindings. An inner parameter with the same spelling **shadows** an outer name.

      ### Thinking Time!

      Predict `scopeProbe ["oak"]` from the starter. Does the lambda test the outer nonempty list or its own empty-list argument? Commit to a Boolean result, run it, and point to the binder for each occurrence of `items`.

      ### Your Turn

      Fix `makeWindow start count` so it returns a function that skips the first `start` items of its input and keeps at most the next `count` items. Both settings are nonnegative. The result preserves order and repeated items; short or empty inputs simply provide fewer items.

      Recall `drop n` skips the first n items, while `take n` keeps at most n items. For example, the window made with `1` and `2` maps `["sun","fog","rain","snow"]` to `["fog","rain"]`. A count of zero gives an empty window.

      Store two differently configured windows in local names in `main`, then call them on the same list. Explain why creating the second window cannot change the first one's settings. In the returned lambda, identify the bound parameter and the two settings captured from makeWindow. Keep `scopeProbe` as a reminder that a repeated name is not necessarily the same binding.

      For type inference, start with one element rather than guessing a whole signature. In `map (\x -> (x, True))`, call the input element's type `a`. The lambda returns `(a, Bool)`, so substitute that result type for `b` in `map :: (a -> b) -> [a] -> [b]`. The function still awaits a list.
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where

          scopeProbe :: [a] -> Bool
          scopeProbe items = (\items -> null items) []

          makeWindow :: Int -> Int -> ([a] -> [a])
          makeWindow start count = \items -> take count items

          main :: IO ()
          main = do
            print (scopeProbe ["oak"])
            print (makeWindow 1 2 ["sun","fog","rain","snow"])
    run_file: Main.hs
    tests:
      - description: "Each configured window preserves its offset, size, and input order across calls"
        command: |
          let first = makeWindow 1 2; second = makeWindow 2 1 in first ["sun","fog","rain","snow"] == ["fog","rain"] && second ["sun","fog","rain","snow"] == ["rain"] && first ["a","a","b","c"] == ["a","b"] && makeWindow 0 0 [True,False] == [] && makeWindow 4 2 [1,2 :: Int] == [] && makeWindow 1 5 [True,False] == [False] && makeWindow 1 2 ([] :: [Int]) == []
        hints:
          - title: "The Missing Setting"
            text: "The starter always begins at the first item. Which setting should determine how much input to skip before choosing the window?"
          - title: "Names from the Surrounding Definition"
            text: "The returned function can refer to start and count. They are supplied by makeWindow; only the input list is supplied later."
          - title: "The Window Rule"
            text: "First skip the prefix determined by start. Then keep at most count items from the remaining list; switching those operations can discard the whole window."
    quiz:
      title: "Step 2 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: |
            What is `choose "oak" "saved" ""`?

            ```haskell
            choose items tag = \items -> (null items, tag)
            ```
          options:
            - '`(False,"saved")`'
            - '`(True,"saved")`'
            - '`(True,"oak")`'
          correct_index: 1
          option_feedback:
            0: "The inner items shadows the first parameter. The returned function receives the empty string, which null recognizes as empty."
            2: "The tag comes from the second argument, saved. The outer items value oak is unused after the inner parameter shadows its name."
          explanation: 'The lambda tests its own empty items value and retains the surrounding tag, producing (True,"saved"). The outer items value is unused.'
        - type: single
          difficulty: intermediate
          question: |
            What is the result of this expression?

            ```haskell
            let limit = 2
                clip = \items -> take limit items
            in let limit = 99 in clip ["p","q","r"]
            ```
          options:
            - '`["p","q","r"]`'
            - '`["p","q"]`'
            - "A duplicate-binding error"
          correct_index: 1
          option_feedback:
            0: "A caller's local name does not replace a free name's binding in an already defined function."
            2: "The inner let creates a nested scope, so it may shadow the outer limit without redefining that outer binding."
          explanation: "The body of clip refers to limit in its definition's scope, where it is 2. The inner limit = 99 does not alter that binding."
        - type: single
          difficulty: intermediate
          question: |
            Infer the most general type of `duplicateItems` from its definition.

            ```haskell
            duplicateItems items = map (\item -> (item, item)) items
            ```
          options:
            - "`[a] -> [(a, a)]`"
            - "`[a] -> [[a]]`"
            - "`[a] -> [(a, b)]`"
          correct_index: 0
          option_feedback:
            1: "The lambda constructs a pair with parentheses, not an inner list with brackets. Map keeps that pair as one output element."
            2: "Both pair positions contain the same item, so their types must agree. The second component cannot have an unrelated type."
          explanation: "Each input has type a and becomes a pair (a,a). Mapping over [a] therefore returns [(a,a)]. No arithmetic or comparison constrains a."
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where

            scopeProbe :: [a] -> Bool
            scopeProbe items = (\items -> null items) []

            makeWindow :: Int -> Int -> ([a] -> [a])
            makeWindow start count = \items -> take count (drop start items)

            main :: IO ()
            main = do
              print (scopeProbe ["oak"])
              let middle = makeWindow 1 2
                  later = makeWindow 2 1
              print (middle ["sun","fog","rain","snow"])
              print (later ["sun","fog","rain","snow"])
              print (middle ["sun","fog","rain","snow"])
      explanation: |
        The lambda's free names start and count refer to the enclosing makeWindow invocation. Its items arrive in a later application. The middle window returns ["fog","rain"], the later window returns ["rain"], and calling middle again gives its original result. No element operation constrains a, so the same window rule works with strings, numbers, or other values.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 114,120–127.
  # Assessment: [Midterm] F24 V1 (Public).pdf, Problem 3D, p. 6 (explicit currying);
  # [Midterm] F23 (Public).pdf, Problem 4a–c, p. 8 (types after partial application).
  # Pedagogy: contrast curried/tuple types, then produce and trace nested lambdas.
  - title: "Currying and Partial Application"
    key: currying
    instructions: |
      ### Why this matters

      A function can be configured now and supplied its data later. Reading the remaining function type tells us exactly which arguments are still missing.

      ### 🎯 You will learn to

      - Analyze the type left after a function receives some of its arguments.
      - Rewrite a function as nested one-parameter lambdas without changing its behavior.

      ### One Argument at a Time

      These two interfaces supply a fallback item when a list is empty, but receive their arguments differently:

      ```haskell
      withFallback :: a -> [a] -> [a]
      withFallback fallback items = if null items then [fallback] else items

      pairFallback :: (a, [a]) -> [a]
      pairFallback (fallback, items) = if null items then [fallback] else items
      ```

      The arrow groups to the right: `a -> [a] -> [a]` means `a -> ([a] -> [a])`. Application groups to the left: `withFallback '?' "ink"` means `(withFallback '?') "ink"`. So `withFallback '?'` is a function awaiting a string. This is **partial application**. The curried interface makes it possible; `pairFallback` instead expects one complete pair.

      **Currying** represents a multiple-input operation as successive single-argument functions. Haskell's `withFallback fallback items = ...` already has curried form. Writing the lambdas makes that structure visible:

      ```haskell
      withFallback = \fallback -> (\items -> if null items then [fallback] else items)
      ```

      The outer lambda receives the fallback item. Its result is a function that remembers that item and awaits a list. A function-valued parameter still needs its parentheses: `(a -> b) -> [a] -> [b]` has a function as its first input.

      ### Thinking Time!

      Predict `map (withFallback '?') ["","ink"]` before running. First write the type of `withFallback '?'`, then its two results. Explain why `pairFallback '?'` would be a type error: the pair interface needs the fallback and the list together.

      ### Your Turn

      Fix `discountAll amount scores` to subtract `amount` from **each score**. Keep the order and repeats; do not clamp negative results. For example, discounting `[2,12]` by 10 should produce `[-8,2]`.

      Keep its curried interface so that `discountAll 10` can be reused as a list transformation. Repair the lambda's operand order, then rewrite the definition as `discountAll = ...` using one lambda for `amount` and another for `scores`. These are two spellings of the same interface; the tests check behavior rather than a particular spelling.

      Add a call that passes `discountAll 3` directly to `map` over a list of score lists. Determine the remaining function type and the result type before running.
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where

          withFallback :: a -> [a] -> [a]
          withFallback fallback items = if null items then [fallback] else items

          pairFallback :: (a, [a]) -> [a]
          pairFallback (fallback, items) = if null items then [fallback] else items

          discountAll :: Int -> [Int] -> [Int]
          discountAll amount scores = map (\score -> amount - score) scores

          main :: IO ()
          main = do
            print (withFallback '?' "", pairFallback ('?', ""))
            print (map (withFallback '?') ["","ink"])
            print (discountAll 10 [2,12])
    run_file: Main.hs
    tests:
      - description: "A configured discount subtracts from each score without reversing operands"
        command: |
          let discount = discountAll 10 in discount [2,12] == [-8,2] && discount [] == [] && discount [10,10,-2] == [0,0,-12] && discountAll 0 [3,-1] == [3,-1] && discountAll (-2) [0,3] == [2,5]
        hints:
          - title: "Which Value Loses Points?"
            text: "A score of 12 discounted by 10 becomes 2. Decide which value belongs before the subtraction sign."
          - title: "A Transformation Awaiting a Score"
            text: "Map needs a function from one original score to one discounted score. The amount is already known outside that function."
          - title: "A Named Operand"
            text: "Try giving the lambda parameter the name score. Write the arithmetic rule using score and amount in their required roles."
    quiz:
      title: "Step 3 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "Given `award :: Int -> Int -> [Int] -> [Int]`, what is the type of `award 2`?"
          options:
            - "`(Int, [Int]) -> [Int]`"
            - "`Int -> [Int] -> [Int]`"
            - "`[Int] -> [Int]`"
          correct_index: 1
          option_feedback:
            0: "The original curried interface does not turn the remaining arguments into a tuple. Its arrows stay in place."
            2: "Only one Int argument has been supplied. The second Int argument is still needed before the list argument."
          explanation: "Applying a function to one argument removes the first input arrow from its type. Award 2 still takes an Int and then a list."
        - type: parsons
          difficulty: intermediate
          question: |
            Arrange the five required fragments into an explicitly curried definition of `discountAll :: Int -> [Int] -> [Int]`. It must receive the amount first, then subtract that amount from every score. Discard the fragment that reverses the subtraction.
          display: inline
          lines:
            - 'discountAll = '
            - '\amount -> '
            - '\scores -> '
            - 'map (\score -> score - amount) '
            - 'scores'
          distractors:
            - 'map (\score -> amount - score) '
          explanation: "The first lambda binds the Int amount, the second binds the score list, and map applies a score-to-discounted-score function. Reversing the lambda order would contradict the stated argument order and type."
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where

            withFallback :: a -> [a] -> [a]
            withFallback fallback items = if null items then [fallback] else items

            pairFallback :: (a, [a]) -> [a]
            pairFallback (fallback, items) = if null items then [fallback] else items

            discountAll :: Int -> [Int] -> [Int]
            discountAll = \amount -> \scores -> map (\score -> score - amount) scores

            main :: IO ()
            main = do
              print (withFallback '?' "", pairFallback ('?', ""))
              print (map (withFallback '?') ["","ink"])
              print (discountAll 10 [2,12])
              print (map (discountAll 3) [[4,7],[1]])
      explanation: |
        The outer two lambdas receive amount and scores in that order. The map lambda captures amount and awaits one score. Writing `discountAll amount scores = map (\score -> score - amount) scores` has the same behavior. After `discountAll 3`, the remaining type is `[Int] -> [Int]`; mapping that function over `[[Int]]` produces `[[Int]]`.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 73–75,79–80,86,106–107.
  # Assessment: [Midterm] F23 (Public).pdf, Problem 3a, p. 6 (tuple projection/type);
  # [Midterm] F24 V1 (Public).pdf, Problem 3B–C, p. 5 (types through map and function application).
  # Pedagogy: worked type derivation fades to a polymorphic transformation with two element types.
  - title: "Higher-Order Types"
    key: higher-order-types
    instructions: |
      ### Why this matters

      A type signature records how values connect. Deriving those connections helps you decide which function can fill a missing argument, even before you run the program.

      ### 🎯 You will learn to

      - Derive a higher-order function's type from how it uses its arguments.
      - Apply a function to one field of each pair while preserving the other field.

      ### Follow One Value

      Consider `applyOne f value = f value`. Give `value` the type `a`. Because `f` receives it, `f` must take an `a`; call its result type `b`. Therefore:

      ```haskell
      applyOne :: (a -> b) -> a -> b
      ```

      The parentheses group the function-valued first argument. The input and output types need not match: `length` turns a list into an `Int`, while `null` turns a list into a `Bool`.

      For `map f values`, the same reasoning applies to each element. If `f :: a -> b`, then `values :: [a]` and the result has type `[b]`. Mapping does not require `a` and `b` to be numbers, or even to be the same type.

      ### Thinking Time!

      Predict both `main` outputs for a correct `convertPairs`. For the first call, identify the types of a label, an input value, and a converted value. Repeat for the second call. Which of these types does the function have to keep the same?

      The starter returns an empty list for both calls. Run it to confirm the missing behavior, then compare that result with your predictions.

      ### Your Turn

      Implement `convertPairs convert entries`. Given pairs `(label, value)`, return `(label, convert value)` for every pair in the same order. Keep repeated labels. The label stays unchanged, while the converted value may have a different type. Empty input returns `[]`.

      For example, `convertPairs length [("a","hi"),("a","")]` returns `[("a",2),("a",0)]`. In another call, labels could be Booleans and values could be lists of integers.

      First write its most general type signature, using separate type variables for the label, original value, and converted value. Then implement it with `map` and a lambda that unpacks a pair. Add one example where the conversion changes the value's type. The checks also accept an equivalent recursive implementation.
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where

          convertPairs convert entries = []

          main :: IO ()
          main = do
            print (convertPairs length [("a","hi"),("a","")] :: [(String, Int)])
            print (convertPairs null [(True,[1]),(False,[])] :: [(Bool, Bool)])
    run_file: Main.hs
    tests:
      - description: "Conversion changes only the second field and preserves every pair's order and label"
        command: |
          convertPairs length [("a","hi"),("a",""),("b","cat")] == [("a",2),("a",0),("b",3)] && convertPairs null [(True,[1 :: Int]),(False,[]),(True,[2,3])] == [(True,False),(False,True),(True,False)] && convertPairs (\n -> [n,n]) [(1,True),(2,False)] == [(1,[True,True]),(2,[False,False])] && convertPairs length ([] :: [(Bool, String)]) == ([] :: [(Bool, Int)])
        hints:
          - title: "Three Type Roles"
            text: "A label passes through unchanged. An input value goes into convert. Its result becomes the second field of the output pair; do not assume that result has the input value's type."
          - title: "Transform One Pair"
            text: "Give the lambda a pair pattern such as (label, value). Its result should be another pair with the same label and the function's result in the other position."
          - title: "Lift to the List"
            text: "Once your lambda handles one pair, map can apply it to every entry. Map preserves the empty case, order, and repeated labels without separate decisions."
    quiz:
      title: "Step 4 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: |
            What is the most general type of `measure`? Recall `length :: [a] -> Int`.

            ```haskell
            measure makeList value = length (makeList value)
            ```
          options:
            - "`(a -> [b]) -> a -> Int`"
            - "`(a -> b) -> [a] -> Int`"
            - "`([a] -> Int) -> a -> Int`"
          correct_index: 0
          option_feedback:
            1: "Length needs a list from makeList, so its result type cannot be an unconstrained b. Value itself need not be a list."
            2: "This makes makeList return Int, which length cannot consume. Length determines the result type after makeList returns its list."
          explanation: "MakeList receives a value of type a and produces a list of some element type b. Length consumes [b] and returns Int."
        - type: single
          difficulty: intermediate
          question: "After applying `convertPairs :: (a -> b) -> [(tag, a)] -> [(tag, b)]` to `null :: [x] -> Bool`, what type remains?"
          options:
            - "`[(tag, [x])] -> [(tag, Bool)]`"
            - "`[(tag, Bool)] -> [(tag, [x])]`"
            - "`[([x], tag)] -> [(Bool, tag)]`"
          correct_index: 0
          option_feedback:
            1: "Null consumes a list and returns Bool, so these input and output roles are reversed."
            2: "ConvertPairs transforms the second component. The label stays in the first component on both sides."
          explanation: "Substitute [x] for a and Bool for b. Supplying null removes the function argument, leaving a function from pairs with list values to pairs with Boolean values."
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where

            convertPairs :: (a -> b) -> [(tag, a)] -> [(tag, b)]
            convertPairs convert entries =
              map (\(label, value) -> (label, convert value)) entries

            main :: IO ()
            main = do
              print (convertPairs length [("a","hi"),("a","")] :: [(String, Int)])
              print (convertPairs null [(True,[1]),(False,[])] :: [(Bool, Bool)])
              print (convertPairs (\n -> [n,n]) [("first",True),("next",False)])
      explanation: |
        Convert has type a -> b. One input pair has type (tag,a), and the lambda returns (tag,b). Map therefore changes [(tag,a)] into [(tag,b)]. No operation constrains tag, a, or b to a specific type, and no equality or ordering test requires a type-class constraint. The first two outputs are [("a",2),("a",0)] and [(True,False),(False,True)].

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 90–94.
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 3c (recursive accumulator/type);
  # [Midterm] F23 (Public).pdf, Problem 3d, p. 7 (list reduction).
  # Pedagogy: worked example with fading — trace a reducer, derive an invariant.
  - title: "Left Folds"
    key: left-folds
    instructions: |
      ### Why this matters

      Some list tasks carry a result forward as each item is incorporated. A fold makes that accumulating rule explicit and gives the empty input a deliberate meaning.

      ### 🎯 You will learn to

      - Analyze a left fold by expanding its accumulator updates.
      - Create a reducer whose accumulator represents the prefix processed so far.

      ### A Result Built from a Prefix

      ```haskell
      foldl :: (b -> a -> b) -> b -> [a] -> b
      -- foldl step seed [x,y] = step (step seed x) y
      ```

      The reducer takes the **accumulator first**, then an item, and returns the next accumulator. Its type `b` can differ from the element type `a`. For example, a fold could consume characters and build an integer count.

      For example, the reducer `\acc word -> word ++ "/" ++ acc` builds a path by placing each new label before the existing path. Starting at "root", labels "oak" then "leaf" produce "oak/root" and then "leaf/oak/root". An empty list leaves the starting path unchanged. These are equations about grouping; they do not claim that every intermediate value is evaluated immediately.

      ### Thinking Time!

      Predict the first `main` output before running. Starting with "", the reducer wraps the current text in parentheses before appending each new label. Write the accumulator after "a", then after "b". Is the result "(()a)b" or "(a)(b)"?

      ### Your Turn

      Fix `digitsToNumber` to turn a finite list of decimal digits into its integer value. Inputs contain only digits 0 through 9. `[3,0,7]` means 307, leading zeroes are allowed, and `[]` means 0.

      Derive the reducer from this invariant: **the accumulator is the number represented by the prefix already consumed**. If that prefix represents 30, what must happen when the next digit is 7? Change the reducer, then write the accumulator values for `[1,0,2]` in a comment before testing.

      Retrieval pause: why does `map` alone not produce this one-number result? Explain using the type of `map` from memory before revisiting Step 1.
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where

          digitsToNumber :: [Integer] -> Integer
          digitsToNumber = foldl (\acc digit -> acc + digit) 0

          main :: IO ()
          main = do
            print (foldl (\acc label -> "(" ++ acc ++ ")" ++ label) "" ["a","b"])
            print (digitsToNumber [3,0,7])
    run_file: Main.hs
    tests:
      - description: "Decimal digits accumulate by place value, including empty input and zeroes"
        command: |
          digitsToNumber [] == 0 && digitsToNumber [7] == 7 && digitsToNumber [3,0,7] == 307 && digitsToNumber [0,0,4,2] == 42 && digitsToNumber [1,0,2] == 102
        hints:
          - title: "The Meaning of the Accumulator"
            text: "After reading [3,0], the accumulator should be 30, not 3. Treat it as a decimal number already built from the prefix."
          - title: "Space for the Next Digit"
            text: "Appending one decimal digit moves every existing digit one place to the left. Then the new digit occupies the units place."
          - title: "Two Arithmetic Operations"
            text: "The reducer needs a multiplication on acc followed by an addition of digit. Choose the multiplier from the number system's base."
    quiz:
      title: "Step 5 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "Which seed lets `foldl (*) seed` reproduce the number in every one-element list?"
          options:
            - "`0`"
            - "`1`"
            - "The first list item"
          correct_index: 1
          option_feedback:
            0: "Zero makes every product zero. It is the identity for addition, not multiplication."
            2: "Using the first item as the seed while also processing it in the list would multiply that item twice."
          explanation: "One times x is x, so a seed of 1 preserves every single-item product. It also supplies the conventional empty product."
        - type: single
          difficulty: intermediate
          question: 'Earlier we distinguished list size from element values. What is `length (map length ["ab","","q"])`?'
          options:
            - "`2`"
            - "`3`"
            - "`1`"
          correct_index: 1
          option_feedback:
            0: "Two input strings are nonempty, but map keeps a length result for every string, including the empty one."
            2: "There is one empty string, but that does not remove or merge any mapped output elements."
          explanation: "Map produces [2,0,1], which has three items. The numeric values of those items do not change how many items the list contains."
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where

            digitsToNumber :: [Integer] -> Integer
            digitsToNumber = foldl (\acc digit -> acc * 10 + digit) 0

            main :: IO ()
            main = do
              print (foldl (\acc label -> "(" ++ acc ++ ")" ++ label) "" ["a","b"])
              print (digitsToNumber [3,0,7])
              -- For [1,0,2], accumulator values are 0, 1, 10, 102.
      explanation: |
        Multiplying the accumulated prefix by 10 shifts its digits one decimal position. Adding the next digit extends that prefix. The seed 0 handles both the empty list and leading zeroes. A recursive helper carrying the same accumulator is an equivalent solution.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 34,65–69,90–94,114,120–123.
  # Assessment: CS131 Fall 25 Quiz 1 v2.docx, Problem 3b–c (recursive cases and a seeded helper's type).
  # Original transfer: paired classification counts, rather than the lecture's generic foldl/sum body.
  # Pedagogy: contrast an order-sensitive string accumulator with conditional updates to paired state.
  - title: "Recursive Accumulators"
    key: recursive-accumulators
    instructions: |
      ### Why this matters

      An accumulator can carry several facts at once. Choosing what it represents lets one recursive traversal build a result that would otherwise need separate passes.

      ### 🎯 You will learn to

      - Repair a recursive helper that carries two related counts through a list.
      - Infer the function type that remains after fixing the initial counts and predicate.

      ### An Accumulator Is a Parameter

      Here is a function that wraps a piece of text in a succession of named layers:

      ```haskell
      nestFrom inside [] = inside
      nestFrom inside (label:labels) =
        nestFrom (label ++ "(" ++ inside ++ ")") labels
      ```

      `nestFrom "seed" ["oak","ivy"]` carries "seed", then "oak(seed)", then "ivy(oak(seed))". The empty-list case returns the current text. Each recursive call gets a new value; it does not change an earlier binding.

      ### Thinking Time!

      In the starter, `tallyFrom (yes, no) predicate items` should count items that pass and fail a predicate, starting from the supplied counts. Trace the two branches on `["","oak",""]` with predicate `null`. The starter increments the same count in both branches. Predict its output before running, then compare it with the required result.

      ### Your Turn

      Fix `tallyFrom`. Its accumulator is a pair of `Int` counts `(yes, no)`. For each input item, add one to `yes` if the predicate returns `True`; otherwise add one to `no`. Leave the other count unchanged. Empty input returns the initial pair. Initial counts are nonnegative, and repeated items count separately.

      For example, `tallyFrom (2,1) null ["","oak",""]` returns `(4,2)`: two more empty strings and one more nonempty string. The same function must also accept predicates on numbers, Boolean values, or lists.

      Keep the call recursive and pass the updated pair to the tail call. Explain why each branch updates exactly one count. Then write the type of `tallyFrom (2,1) null` in a comment. The count pair is fixed, but the element type of each list tested by `null` remains arbitrary.
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where

          tallyFrom :: (Int, Int) -> (a -> Bool) -> [a] -> (Int, Int)
          tallyFrom counts predicate [] = counts
          tallyFrom (yes, no) predicate (x:xs)
            | predicate x = tallyFrom (yes + 1, no) predicate xs
            | otherwise   = tallyFrom (yes + 1, no) predicate xs

          main :: IO ()
          main = do
            print (tallyFrom (2,1) null ["","oak",""])
            print (tallyFrom (0,0) null [[],[1],[]])
    run_file: Main.hs
    tests:
      - description: "Each item updates one count while preserving the seed and counting repeated occurrences"
        command: |
          tallyFrom (2,1) null ["","oak",""] == (4,2) && tallyFrom (3,4) null ([] :: [String]) == (3,4) && tallyFrom (0,0) (\n -> n < 0) [-1,0,1,-1 :: Int] == (2,2) && tallyFrom (1,2) (\flag -> flag) [False,True,False] == (2,4) && tallyFrom (0,0) null [[],[1],[]] == (2,1) && tallyFrom (0,0) (\_ -> True) [1,2,3 :: Int] == (3,0) && tallyFrom (0,0) (\_ -> False) [1,2,3 :: Int] == (0,3)
        hints:
          - title: "One Item, One Category"
            text: "A nonempty string fails null. Starting from (yes,no), it must increase the failure count without increasing the success count."
          - title: "Keep Both Counts"
            text: "Every recursive call carries the full pair. Updating one component must retain the other component's current value, including the supplied seed."
          - title: "Update Before the Tail Call"
            text: "In the otherwise branch, construct a pair with the existing yes count and one more than the current no count. Pass that pair with the unchanged predicate and the tail."
    quiz:
      title: "Step 6 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "Given `tallyFrom :: (Int, Int) -> (a -> Bool) -> [a] -> (Int, Int)` and `null :: [b] -> Bool`, what type remains after `tallyFrom (2,1) null`?"
          options:
            - "`[[b]] -> (Int, Int)`"
            - "`[Bool] -> (Int, Int)`"
            - "`[b] -> Int`"
          correct_index: 0
          option_feedback:
            1: "Null consumes a list, not a Boolean. Each input item is itself a list, so the outer input has nested-list type."
            2: "The result remains a pair of counts. Null also requires each input item to have list type, adding the inner list layer."
          explanation: "The seed and predicate have both been supplied. Null fixes a to [b], leaving a list of such items, [[b]], as the remaining input. The result stays (Int,Int)."
        - type: single
          difficulty: intermediate
          question: |
            A classifier should count each item exactly once. What pair belongs in the failed-predicate branch?

            ```haskell
            tallyFrom (yes, no) predicate (x:xs)
              | predicate x = tallyFrom (yes + 1, no) predicate xs
              | otherwise   = tallyFrom ___ predicate xs
            ```
          options:
            - "`(yes, no + 1)`"
            - "`(yes + 1, no + 1)`"
            - "`(0, no + 1)`"
          correct_index: 0
          option_feedback:
            1: "One failed item would be counted in both categories. Only its failure count should increase."
            2: "This discards successes already accumulated, including a nonzero initial success count."
          explanation: "A failed item contributes one failure and no success. The recursive call preserves the existing success count and increments the failure count."
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where

            tallyFrom :: (Int, Int) -> (a -> Bool) -> [a] -> (Int, Int)
            tallyFrom counts predicate [] = counts
            tallyFrom (yes, no) predicate (x:xs)
              | predicate x = tallyFrom (yes + 1, no) predicate xs
              | otherwise   = tallyFrom (yes, no + 1) predicate xs

            -- tallyFrom (2,1) null :: [[b]] -> (Int, Int)
            main :: IO ()
            main = do
              print (tallyFrom (2,1) null ["","oak",""])
              print (tallyFrom (0,0) null [[],[1],[]])
              print (tallyFrom (3,4) null ([] :: [String]))
      explanation: |
        The first example carries (2,1), (3,1), (3,2), then (4,2). The empty case returns that final pair. Each input contributes to exactly one component, and an empty input preserves both initial counts. After fixing the seed and null predicate, the function awaits a list of lists; it does not require their elements to have any particular type.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 8,36,38,54.
  # Assessment: CS131 Fall 25 Quiz 3 v2.docx, Problem 2 (reason about evaluation demand).
  # Pedagogy: PRIMM — finite-prefix prediction, bounded infinite-list practice,
  # and spaced retrieval of map/filter semantics.
  - title: "Lazy Lists"
    key: lazy-lists
    instructions: |
      ### Why this matters

      An unbounded stream can still answer a finite question. To use it safely, we need to reason about what the consumer demands, not just whether the input looks infinite.

      ### 🎯 You will learn to

      - Predict the finite prefix produced from an unbounded range.
      - Create a bounded selection that works on finite and infinite lists.

      ### Demand Drives Evaluation

      Haskell is **lazy**: it evaluates expressions when their values are needed. `[1..]` describes an unbounded list, while `take 3 [1..]` only needs `[1,2,3]`. Printing the entire unbounded list or computing its length cannot finish.

      `take n` asks for at most `n` items. We can use each number in `[0..]` as a requested prefix length: `map (\n -> take n "road") [0..]` begins `["","r","ro","roa","road",...]`. Once the requested length exceeds the word length, each later prefix is still "road". Taking a finite number of these prefixes gives a finite result.

      ### Thinking Time!

      Predict the first two outputs in `main` before running. Does selecting prefixes of length at least two before taking two results give the same result as taking two prefixes before selecting? Write the two intermediate lists or prefixes that support your prediction.

      ### Your Turn

      Fix `firstMatches n predicate items`. It must return up to the first `n` matching items in input order. It must stop once it has enough matches, even when the input continues forever. The count `n` is nonnegative; a count of zero returns `[]`, even if an infinite input has no matches: zero requested results require no search. If a finite input runs out, return the matches found so far.

      For example, requesting two prefixes of length at least two from the growing "road" prefixes should give `["ro","roa"]`. From the finite input `["a","oak","b"]`, requesting three strings of length at least two gives only `["oak"]`.

      Decide whether the bound applies before or after selection. Add a finite example with fewer matches than requested and a zero-count example to `main`. For positive counts, the checks use infinite inputs only when enough matches occur after a finite prefix.

      ### A Bound Still Needs Matches

      A finite requested output is not a guarantee of termination: searching the growing "road" prefixes for one longer than four characters will never find its first match. `take` stops after enough results arrive; it cannot make a predicate find a match that does not exist.
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where

          firstMatches :: Int -> (a -> Bool) -> [a] -> [a]
          firstMatches n predicate items = take n items

          main :: IO ()
          main = do
            let prefixes = map (\n -> take n "road") [0..]
                longEnough word = length word >= 2
            print (take 2 (filter longEnough prefixes))
            print (filter longEnough (take 2 prefixes))
            print (firstMatches 2 longEnough prefixes)
    run_file: Main.hs
    tests:
      - description: "Selection returns up to the requested number of matches in input order"
        command: |
          firstMatches 3 even ([1..] :: [Integer]) == [2,4,6] && firstMatches 3 even [1,2,3] == [2] && firstMatches 2 even [1,2,4,6] == [2,4] && firstMatches 0 even [2,4] == [] && firstMatches 0 (\_ -> False) ([1..] :: [Integer]) == [] && firstMatches 2 even ([] :: [Int]) == [] && firstMatches 3 even [1,3,5] == [] && firstMatches 2 null ["go","","team",""] == ["",""]
        hints:
          - title: "A Bound on Matches"
            text: "The requested count describes matching results, not input positions. The first two generated prefixes are both too short to qualify."
          - title: "The Consumer of the Selected List"
            text: "Filter describes which items to keep. Take describes how much of that filtered result is needed. Decide which should receive the other's output."
          - title: "A Zero Demand"
            text: "The shape is `take count selectedItems`. Take handles a zero count by returning an empty list; let that behavior carry the stopping rule."
    quiz:
      title: "Step 7 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: 'What is `take 4 (map (\n -> take n "cat") [0..])`?'
          options:
            - '`["","c","ca","cat"]`'
            - '`["c","ca","cat","cat"]`'
            - '`["cat","cat","cat","cat"]`'
          correct_index: 0
          option_feedback:
            1: "The range begins at zero, so the first prefix has length zero. This answer starts from one instead."
            2: "Take n selects the requested prefix; it does not return the entire word when n is smaller than its length."
          explanation: "The four requested prefix lengths are 0, 1, 2 and 3. They produce the empty string, c, ca and cat."
        - type: multiple
          difficulty: intermediate
          question: 'Select every expression that produces `["","a","ab"]`.'
          options:
            - 'take 3 (map (\n -> take n "ab") [0..])'
            - 'map (\n -> take n "ab") (take 3 [0..])'
            - 'take 3 (filter null ["","a","ab"])'
            - 'take 3 (map null ["","a","ab"])'
          correct_indices: [0, 1]
          option_feedback:
            2: "Filtering with null keeps only the empty string, so the result has one item."
            3: "Mapping null returns [True,False,False], not the original strings."
          explanation: "Mapping preserves positions, so taking the first three requested lengths before or after this mapping gives the same three prefixes. Filter instead selects items, and mapping null changes their type."
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where

            firstMatches :: Int -> (a -> Bool) -> [a] -> [a]
            firstMatches n predicate items = take n (filter predicate items)

            main :: IO ()
            main = do
              let prefixes = map (\n -> take n "road") [0..]
                  longEnough word = length word >= 2
              print (take 2 (filter longEnough prefixes))
              print (filter longEnough (take 2 prefixes))
              print (firstMatches 2 longEnough prefixes)
              print (firstMatches 3 longEnough ["a","oak","b"])
              print (firstMatches 0 longEnough prefixes)
      explanation: |
        Take consumes only the needed prefix of filter's output. Filter inspects enough input to produce those matches; it does not build an entire intermediate list first. A zero count returns []. Reversing the order to filter after take would limit input positions and could miss required matches.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 34,86,88,91–94,106–107,114.
  # Assessment: [Midterm] F23 (Public).pdf, Problem 3a–c, pp. 6–7 (select/project/combine);
  # [Final] F24 V1 (Public).pdf, Problem 1A.1, p. 2 (derive relationships between function types).
  # Pedagogy: faded scaffolding — independent mixed transfer and later retrieval.
  - title: "The Playlist Report"
    key: playlist
    instructions: |
      ### Why this matters

      A new problem rarely arrives labeled “use filter” or “use a fold.” The next step is to choose operations from the contract and explain how their parts fit together.

      ### 🎯 You will learn to

      - Create a pipeline that selects, transforms, and aggregates structured data.
      - Evaluate a solution using boundary examples and type relationships.

      ### The Contract

      `playlistReport minimumScore bonus tracks` receives a finite list of `(title, score)` pairs and returns `(selectedTitles, totalPoints)`.

      - Select tracks whose **original score is at least minimumScore**.
      - Return selected titles in their input order. Repeated titles remain repeated.
      - Add `bonus` to each selected score and sum those adjusted scores.
      - With no selected tracks, return `([], 0)`. Scores, cutoffs, and bonuses can be negative.

      ### Thinking Time!

      For a cutoff of 10 and a bonus of 3, predict the report for `[("Intro",8),("Loop",10),("Loop",12)]`. Should the repeated title appear once or twice? Should the score 8 receive a bonus that makes it eligible?

      Write the exact expected pair in a comment. The starter currently returns an empty report; run it to see the gap before implementing your design.

      ### Your Turn

      Implement `playlistReport` using the techniques you can now choose among. The signature and a sample input are provided; the decomposition is yours. A tuple pattern such as `(title, score)` lets a helper access both fields. Alternatively, `fst` and `snd` obtain the first and second components of a pair.

      Before selecting **Test My Work**, add two examples to `main`: one that would expose a wrong cutoff boundary, and one that would expose counting each title only once. Add a short comment explaining the types between your chosen stages and why no input binding changes.

      ### A Later Retrieval Check

      Tomorrow, close these instructions and rebuild the report from its contract. Replace the domain with `(snack, price)` pairs and a maximum-price rule. Explain which parts change and which list-processing patterns stay the same.

      For one final type connection, reason about `twice f x = f (f x)`: the result of the inner `f` is an input to the outer `f`. That relationship forces `f` to consume and produce the same type. The last knowledge check asks you to use that connection.
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where

          playlistReport :: Int -> Int -> [(String, Int)] -> ([String], Int)
          playlistReport minimumScore bonus tracks = ([], 0)

          main :: IO ()
          main = print (playlistReport 10 3 [("Intro",8),("Loop",10),("Loop",12)])
    run_file: Main.hs
    tests:
      - description: "Selected titles preserve the cutoff boundary, order, and repeated occurrences"
        command: |
          fst (playlistReport 10 3 [("Intro",8),("Loop",10),("Loop",12)]) == ["Loop","Loop"] && fst (playlistReport 5 20 [("last",6),("skip",4),("first",5)]) == ["last","first"] && fst (playlistReport (-2) 0 [("a",-3),("b",-2),("c",0)]) == ["b","c"] && fst (playlistReport 10 0 []) == []
        hints:
          - title: "A Decision About the Whole Track"
            text: "Eligibility depends on the score, but the result still needs each selected title. Keep the pairs together during selection."
          - title: "The Original Score"
            text: "A predicate can unpack (title, score) and compare score with minimumScore. Do this before applying any bonus."
          - title: "Two Views of One Selection"
            text: "Name the selected list in a let or where binding. One result component can project its titles, while the other can use its scores."
      - description: "Total points include every selected occurrence and its bonus, including negative values"
        command: |
          snd (playlistReport 10 3 [("Intro",8),("Loop",10),("Loop",12)]) == 28 && snd (playlistReport 5 20 [("last",6),("skip",4),("first",5)]) == 51 && snd (playlistReport (-2) (-3) [("a",-3),("b",-2),("c",0)]) == -8 && playlistReport 10 5 [] == ([],0) && playlistReport 10 5 [("skip",9)] == ([],0)
        hints:
          - title: "A Bonus for Each Selection"
            text: "For two selected tracks, the bonus contributes twice. For no selected tracks, it contributes nothing."
          - title: "Transformation Followed by Aggregation"
            text: "Use a fold that accumulates each adjusted score, or transform the selected scores before folding them with addition. Both describe the required total."
          - title: "The Empty Report"
            text: "Trace your chosen total on an empty selected list. Its base result must be zero; no bonus should be added outside the per-track calculation."
    quiz:
      title: "Step 8 — Knowledge Check"
      min_score: 0.8
      questions:
        - type: single
          difficulty: intermediate
          question: "Which test best distinguishes an inclusive cutoff from an accidentally strict cutoff?"
          options:
            - "A track exactly at the cutoff"
            - "A track far above the cutoff"
            - "A track far below the cutoff"
          correct_index: 0
          option_feedback:
            1: "Both > and >= keep a score far above the cutoff, so that example cannot expose this particular error."
            2: "Both > and >= reject a score far below the cutoff. They disagree at equality."
          explanation: "At the boundary, >= includes the track and > excludes it. A focused example separates the two candidate rules."
        - type: single
          difficulty: advanced
          question: "Which is the most general type of `applyThen f g x = g (f (f x))`?"
          options:
            - "`(a -> b) -> (b -> c) -> a -> c`"
            - "`(a -> a) -> (a -> b) -> a -> b`"
            - "`(a -> a) -> (a -> a) -> a -> a`"
          correct_index: 1
          option_feedback:
            0: "The inner result is passed back into the same f. Its result type must therefore match its argument type, rather than being an unrelated b."
            2: "G is applied only once, so it may change the type. Requiring its output to match its input would be unnecessarily restrictive."
          explanation: "The repeated f calls require f :: a -> a. G then receives an a and may return a different type b, giving the whole function its final result type."
        - type: single
          difficulty: intermediate
          question: "To get the first two qualifying tracks from an infinite input, which design can finish when those tracks occur after a finite prefix?"
          options:
            - "Filter, then take two"
            - "Take two tracks, then filter"
            - "Map the predicate, then take two"
          correct_index: 0
          option_feedback:
            1: "The first two input tracks may not qualify. Taking input positions first can miss later qualifying tracks."
            2: "Mapping the predicate returns Booleans instead of the original tracks. Filter uses those decisions to retain tracks."
          explanation: "Filtering can produce matching items incrementally, and take can stop after consuming two. This extends the lazy selection pattern from the previous step."
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where

            playlistReport :: Int -> Int -> [(String, Int)] -> ([String], Int)
            playlistReport minimumScore bonus tracks = (titles, total)
              where
                selected = filter (\(_, score) -> score >= minimumScore) tracks
                titles = map fst selected
                total = foldl (\acc (_, score) -> acc + score + bonus) 0 selected

            main :: IO ()
            main = do
              print (playlistReport 10 3 [("Intro",8),("Loop",10),("Loop",12)])
              print (playlistReport 5 20 [("last",6),("skip",4),("first",5)])
              print (playlistReport (-2) (-3) [("a",-3),("b",-2),("c",0)])
      explanation: |
        Selected has type [(String, Int)]. Projecting fst gives [String]; the fold consumes each selected (String, Int) pair and accumulates an Int. Selection uses the original score, and each occurrence contributes its own bonus. All definitions describe new values; none changes tracks. A single fold returning a pair of accumulators can also satisfy the contract, provided it preserves the specified title order.
