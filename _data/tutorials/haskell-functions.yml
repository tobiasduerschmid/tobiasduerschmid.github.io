          - title: "Where the Bonus Enters the Calculation"
            condition: "code_matches: /^(?:(?![\\s\\S]*(?:^|\\n)playlistReport\\b(?![^\\n]*::))|(?=[\\s\\S]*(?:(?:^|\\n)playlistReport\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*\\(\\s*\\[\\s*\\]\\s*,\\s*0\\s*\\)\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$)|(?:^|\\n)playlistReport\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*(?:undefined|error\\s+\"[^\"\\n]*\"|_)\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$))))/"
            text: "Compare a report with no selected tracks to a report with one selected track. Identify what can contribute to each total before replacing the placeholder; distinguish a track contribution from an adjustment to the whole report."
          - title: "One Selection Versus Two Copies"
            condition: "code_matches: /^(?=[\\s\\S]*(?:^|\\n)playlistReport\\b(?![^\\n]*::))(?![\\s\\S]*(?:(?:^|\\n)playlistReport\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*\\(\\s*\\[\\s*\\]\\s*,\\s*0\\s*\\)\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$)|(?:^|\\n)playlistReport\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*(?:undefined|error\\s+\"[^\"\\n]*\"|_)\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$)))(?=[\\s\\S]*(?:^|\\n)playlistReport\\b(?![^\\n]*::)(?:(?!\\n[A-Za-z_]\\w*\\s*(?:::|[^\\n]*=))[\\s\\S])*(?:\\bsum\\b[^\\n]*\\+\\s*bonus\\b))/"
            text: "Compare one selected track with two identical selected copies. Predict how much the total should change and trace where your bonus logic contributes. Then try a negative bonus to detect an accidental clamp."
