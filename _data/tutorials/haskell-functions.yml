            Write the grouped subtraction before choosing. Compare your reasoning with the feedback afterward.
          options:
            - '`7`'
            - '`9`'
            - '`11`'
          correct_index: 0
          option_feedback:
            1: Nine accounts for the first item only. The second item still contributes another subtraction.
            2: Eleven comes from 10 - (1 - 2), which associates differently. This fold expands to (10 - 1) - 2.
          explanation: The fold associates as (10 - 1) - 2, giving 7. These equations describe grouping, without claiming
            that each intermediate value is evaluated immediately.
        - type: multiple
          bloom: analyze
