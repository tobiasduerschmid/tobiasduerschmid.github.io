    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where

            playlistReport :: Int -> Int -> [(String, Int)] -> ([String], Int)
            playlistReport minimumScore bonus tracks = (titles, total)
              where
                selected = filter (\(_, score) -> score >= minimumScore) tracks
                titles = map fst selected
                total = foldl (\acc (_, score) -> acc + score + bonus) 0 selected

            main :: IO ()
            main = do
              print (playlistReport 10 3 [("Intro",8),("Loop",10),("Loop",12)])
              print (playlistReport 5 20 [("last",6),("skip",4),("first",5)])
              print (playlistReport (-2) (-3) [("a",-3),("b",-2),("c",0)])
      explanation: |
        Selected has type [(String, Int)]. Projecting fst gives [String]; the fold consumes each selected (String, Int) pair and accumulates an Int. Selection uses the original score, and each occurrence contributes its own bonus. All definitions describe new values; none changes tracks. A single fold returning a pair of accumulators can also satisfy the contract, provided it preserves the specified title order.
