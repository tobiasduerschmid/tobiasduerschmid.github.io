# Course alignment: intro_to_functional_programming_and_haskell_v10_handouts.pdf,
# physical PDF pages 8,36,38–39,54,65–69,73–75,79–80,86–94,100–107,114,120–127.
# Assessment families: Fall 25 Quiz 1 Problems 3/5; Fall 25 Quiz 3 Problem 2;
# [Midterm] F23 (Public).pdf Problems 3/4; [Midterm] F24 V1 (Public).pdf Problem 3;
# [Final] F24 V1 (Public).pdf Problem 1. Exercises are original, not past questions.
# Pedagogical arc: distinguish transformations → bind behavior → infer types →
# reduce data → repair recursive accumulators → choose a pipeline independently.
title: "Haskell 2: Functions and Laziness"
description: "An interactive course for programmers who have completed Haskell 1 or can use lists, tuples, pattern matching, and recursion. Build higher-order functions, derive types, and trace accumulators and finite lazy-list results. Plan about 80–100 minutes. Optional written rehearsals add about 11 minutes."
learning_objectives:
  - "Apply map and filter according to whether a task transforms or selects values."
  - "Analyze lambda bindings, lexical scope, and the types of partially applied functions."
  - "Derive higher-order function types from relationships between arguments and results."
  - "Apply left folds and complete recursive helpers with structured accumulators."
  - "Predict finite results obtained by mapping, filtering, and taking from infinite ranges."
  - "Create a tested data-processing pipeline from an input and output contract."
backend: haskell
debugger: true
# Checks provide optional practice; students may visit any lesson.
require_tests: false
require_quiz: false
allow_skip_steps: true

# Preserve matching saved lessons without crediting replacements at the same index.
progress_version: 2
legacy_step_keys: [map-filter, lambdas, currying, composition, left-folds, right-folds, lazy-lists, playlist]

steps:
  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 86–89.
  # Assessment: [Midterm] F23 (Public).pdf, Problem 3a–b, p. 6 (map/filter);
  # CS131 Fall 25 Quiz 1 v2.docx, Problem 3b (complete recursive cases).
  # Pedagogy: PRIMM — contrast map/filter predictions, then combine known parts.
  - title: "Map and Filter"
    key: map-filter
    instructions: |
      ### Why this matters

      A data-processing task often needs to discard unwanted records and
      transform the remaining ones. Writing a fresh traversal for every
      task mixes those decisions with repeated list-handling code.
      **`map` and `filter` separate the traversal from the rule you supply**,
      so a reader can see whether a stage changes values or selects them.
      This lets you reuse a tested operation while concentrating on the
      application-specific rule, a pattern that also appears in Python
      and JavaScript collection processing.

      ### 🎯 You will learn to

      - Analyze the difference between transforming values and selecting values.
      - Apply `map` and `filter` to a score list without changing the original.

      This is Part II of the Haskell course. You should be comfortable with functions, lists, tuples, and `(x:xs)` patterns. Plan about 80–100 minutes; after Higher-Order Types is a good stopping point. This is an estimate, not a time limit.

      Code checks verify results and the type relationships they exercise. Review your predictions, explanations, and requested lambda or recursion forms yourself; a passing result does not assess those parts.

      ### A Function as an Argument

      A **higher-order function** accepts a function or returns a function. Haskell functions are **first-class values**: we can give them names, pass them around, and return them.

      ```haskell
      map    :: (a -> b)    -> [a] -> [b]
      filter :: (a -> Bool) -> [a] -> [a]
      ```

      `map f` transforms every item with `f`. `filter p` keeps the original items for which predicate `p` returns `True`. Both preserve the order of the items they produce; neither changes the input list.

      Two useful predicates: `even n` returns whether an integer is divisible by 2, and `null xs` returns whether a list is empty. Each returns a Boolean, so either can serve as the decision passed to `filter`.

      This recursive example selects ready entries and projects just their names:

      ```haskell
      readyNames [] = []
      readyNames ((name, ready):rest)
        | ready       = name : readyNames rest
        | otherwise   = readyNames rest
      ```

      Both branches continue with the tail. A passing entry contributes its name, not its Boolean flag or the whole pair. Selection and transformation are separate decisions even when one recursive function performs both.

      ### Thinking Time!

      The first two lines of `main` use the same predicate and the same input. Predict both outputs before selecting **Run**. Each request is a pair `(needed, available)`. Does mapping the `fits` predicate produce requests or Boolean decisions?

      After running, explain why one output has three items while the other has two. The function's result means “replacement value” to `map` and “keep this item?” to `filter`.

      Record each result's **value and element type**, then compare with the reveal.

      <details markdown="1">
      <summary>Check the map/filter prediction</summary>

      With `requests = [(3,5),(4,2),(0,0)] :: [(Int, Int)]`, the results are:

      | Expression | Value | Result type |
      | --- | --- | --- |
      | `map fits requests` | `[True,False,True]` | `[Bool]` |
      | `filter fits requests` | `[(3,5),(0,0)]` | `[(Int, Int)]` |

      Both call `fits` on pairs. Map keeps its Boolean results; filter uses those decisions to keep original pairs. The predicate's result type is therefore different from filter's element type.

      </details>

      ### Your Turn

      Fix `qualifiedScores`. It must keep scores **at least 10**, double each kept score, and return them in their original order. Keep repeated scores. For example, `[9,10,12]` should become `[20,24]`; an empty list should stay empty.

      The named helpers already describe the two decisions. Before combining them, write the value and type of the selected list for `[9,10,12]`, then the value and type after doubling. Use those intermediate results to decide which operation must see the original scores. Add a boundary example of your own to `main` before testing.
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where

          qualifies :: Int -> Bool
          qualifies score = score >= 10

          doublePoints :: Int -> Int
          doublePoints score = score * 2

          fits :: (Int, Int) -> Bool
          fits (needed, available) = needed <= available

          qualifiedScores :: [Int] -> [Int]
          qualifiedScores scores = map doublePoints scores

          main :: IO ()
          main = do
            print (map fits [(3,5),(4,2),(0,0)])
            print (filter fits [(3,5),(4,2),(0,0)])
            print (qualifiedScores [9,10,12])
    run_file: Main.hs
    tests:
      - description: "Score selection at the cutoff, with stable order and repeated values"
        command: |
          qualifiedScores [] == [] && qualifiedScores ([9,10,11] :: [Int]) == [20,22] && qualifiedScores [15,-4,10,15,0] == [30,20,30] && qualifiedScores [1,4,9] == []
        hints:
          # Conditions: unchanged transformation; selection after transformation; other attempted selection.
          - title: "An Unexpected Output Length"
            condition: "code_matches: /^(?:(?![\\s\\S]*(?:^|\\n)qualifiedScores\\b(?![^\\n]*::))|(?=[\\s\\S]*(?:(?:^|\\n)qualifiedScores\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*map\\s+[A-Za-z_]\\w*\\s+[A-Za-z_]\\w*\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$)|(?:^|\\n)qualifiedScores\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*(?:undefined|error\\s+\"[^\"\\n]*\"|_)\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$))))/"
            text: "If every input score still appears in the output, inspect whether your code makes any selection decision. Changing each item's value does not by itself remove an item."
          - title: "Track the Original Values"
            condition: "code_matches: /^(?=[\\s\\S]*(?:^|\\n)qualifiedScores\\b(?![^\\n]*::))(?![\\s\\S]*(?:(?:^|\\n)qualifiedScores\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*map\\s+[A-Za-z_]\\w*\\s+[A-Za-z_]\\w*\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$)|(?:^|\\n)qualifiedScores\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*(?:undefined|error\\s+\"[^\"\\n]*\"|_)\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$)))(?=[\\s\\S]*(?:^|\\n)qualifiedScores\\b(?![^\\n]*::)(?:(?!\\n[A-Za-z_]\\w*\\s*(?:::|[^\\n]*=))[\\s\\S])*(?:filter\\s+qualifies\\s*\\(?\\s*map\\s+doublePoints))/"
            text: "For [9,10], make two columns: eligibility of the original score and its awarded value if eligible. Compare these with the values your current code presents to qualifies. Can a transformation change that decision?"
          - title: "The Missing Input List"
            condition: "code_matches: /^(?=[\\s\\S]*(?:^|\\n)qualifiedScores\\b(?![^\\n]*::))(?![\\s\\S]*(?:(?:^|\\n)qualifiedScores\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*map\\s+[A-Za-z_]\\w*\\s+[A-Za-z_]\\w*\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$)|(?:^|\\n)qualifiedScores\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*(?:undefined|error\\s+\"[^\"\\n]*\"|_)\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$)))(?![\\s\\S]*(?:^|\\n)qualifiedScores\\b(?![^\\n]*::)(?:(?!\\n[A-Za-z_]\\w*\\s*(?:::|[^\\n]*=))[\\s\\S])*(?:filter\\s+qualifies\\s*\\(?\\s*map\\s+doublePoints))/"
            text: "One possible outer stage is `map doublePoints (...)`. Decide what list belongs in the blank and how the existing helpers could produce it. Check that a score immediately below the cutoff cannot enter that stage."
    quiz:
      title: Step 1 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
        - type: single
          bloom: apply
          difficulty: intermediate
          question: |-
            What value and type result from `map null [["hi"],[],[""]]`?

            Write your predicted value and type before choosing. Compare your reasoning with the feedback afterward.
          options:
            - '`[False,True,False] :: [Bool]`'
            - '`[[]] :: [[String]]`'
            - '`[False,True,True] :: [Bool]`'
          correct_index: 0
          option_feedback:
            1: Selecting original empty rows is the behavior of filter. Map instead retains one predicate result for every
              row.
            2: The last row contains one string, even though that string is empty. Null tests whether the row itself has
              any elements.
          explanation: The row lengths are 1, 0, and 1, so their emptiness decisions are False, True, and False. Map keeps
            all three decisions and changes the element type to Bool.
        - type: multiple
          bloom: analyze
          difficulty: intermediate
          question: |-
            Use the taught helpers `qualifies score = score >= 10` and `doublePoints score = score * 2`. Compare these two pipelines. Select every input that makes their results differ.

            ```haskell
            selectFirst xs = map doublePoints (filter qualifies xs)
            changeFirst xs = filter qualifies (map doublePoints xs)
            ```
          options:
            - '`[6]`'
            - '`[10,12]`'
            - '`[0,12]`'
            - '`[4,7]`'
          correct_indices:
            - 0
            - 3
          option_feedback:
            0: A score of 6 is initially ineligible but becomes 12 after doubling. The two pipelines disagree on whether
              to include it.
            1: Both original scores already qualify, so both pipelines return [20,24]. A passing test here cannot establish
              that the stage order is correct.
            2: Zero fails before and after doubling, while 12 passes both times. Both pipelines return [24].
            3: Seven crosses the cutoff when doubled, while four does not. The results are [] and [14], exposing selection
              on changed scores.
          explanation: A distinguishing input includes an originally ineligible score that becomes eligible after transformation.
            Keeping types compatible does not guarantee that rearranging stages preserves the contract.
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where

            qualifies :: Int -> Bool
            qualifies score = score >= 10

            doublePoints :: Int -> Int
            doublePoints score = score * 2

            fits :: (Int, Int) -> Bool
            fits (needed, available) = needed <= available

            qualifiedScores :: [Int] -> [Int]
            qualifiedScores scores = map doublePoints (filter qualifies scores)

            main :: IO ()
            main = do
              print (map fits [(3,5),(4,2),(0,0)])
              print (filter fits [(3,5),(4,2),(0,0)])
              print (qualifiedScores [9,10,12])
      explanation: |
        Filter applies the cutoff to the original scores. Map then doubles exactly those scores. Reversing the operations would let a score such as 9 qualify after doubling. The predicate, transformation, and traversal have separate responsibilities.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 100–107.
  # Assessment: [Final] F24 V1 (Public).pdf, Problem 1B, p. 3 (free names in a returned lambda);
  # [Midterm] F24 V1 (Public).pdf, Problem 3B, p. 5 (infer a map/lambda type).
  # Pedagogy: PRIMM — predict shadowing, investigate captures, then repair a closure.
  - title: "Lambdas and Lexical Scope"
    key: captured-settings
    instructions: |
      ### Why this matters

      A callback may run after the function that created it has returned,
      yet still need a setting chosen there, such as which slice of a
      result list to show. **A closure connects a function to the bindings
      it needs**, and lexical scope tells you which binding each name uses.
      Understanding that connection helps you write configurable callbacks
      and diagnose errors caused by shadowed names. The small functions
      here isolate the same reasoning you need when reading event handlers
      and other callback-based code.

      ### 🎯 You will learn to

      - Analyze which binding a name refers to inside a lambda.
      - Create a function that retains the settings supplied when it was created.

      ### Small Functions, Right Where We Need Them

      ```haskell
      withSize word = (word, length word)
      -- The same transformation without a function name:
      -- \word -> (word, length word)
      ```

      The backslash introduces a **lambda**, `word` is its parameter, and the expression after `->` is its result. For example, `map (\word -> (word, length word)) ["","elm"]` produces `[("",0),("elm",3)]`.

      A lambda can also use a name from its surrounding definition. In `skip start = \items -> drop start items`, the inner function uses `start` from outside its own parameters. A **closure** keeps a function together with the environment its free names need. A free name is a name used by the function but bound outside its own parameters or local definitions.

      Haskell uses **lexical scope**: the definition's nesting determines those bindings. An inner parameter with the same spelling **shadows** an outer name.

      ### Thinking Time!

      Predict `scopeProbe ["oak"]` from the starter. Does the lambda test the outer nonempty list or its own empty-list argument? Commit to a Boolean result, run it, and point to the binder for each occurrence of `items`.

      ### Your Turn

      Fix `makeWindow start count` so it returns a function that skips the first `start` items of its input and keeps at most the next `count` items. Both settings are nonnegative. The result preserves order and repeated items; short or empty inputs simply provide fewer items.

      Recall `drop n` skips the first n items, while `take n` keeps at most n items. For example, the window made with `1` and `2` maps `["sun","fog","rain","snow"]` to `["fog","rain"]`. A count of zero gives an empty window. Items may have any type; only their list positions determine the window.

      Store two differently configured windows in local names in `main`, then call them on the same list. Explain why creating the second window cannot change the first one's settings. In the returned lambda, identify the bound parameter and the two settings captured from makeWindow. Keep `scopeProbe` as a reminder that a repeated name is not necessarily the same binding.

      For type inference, start with one element rather than guessing a whole signature. In `map (\x -> (x, True))`, call the input element's type `a`. The lambda returns `(a, Bool)`, so substitute that result type for `b` in `map :: (a -> b) -> [a] -> [b]`. The function still awaits a list.
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where

          scopeProbe :: [a] -> Bool
          scopeProbe items = (\items -> null items) []

          makeWindow :: Int -> Int -> ([a] -> [a])
          makeWindow start count = \items -> take count items

          main :: IO ()
          main = do
            print (scopeProbe ["oak"])
            print (makeWindow 1 2 ["sun","fog","rain","snow"])
    run_file: Main.hs
    tests:
      - description: "Configured windows, short inputs, and independent calls"
        command: |
          let first = makeWindow (1 :: Int) (2 :: Int); second = makeWindow 2 1 in first ["sun","fog","rain","snow"] == ["fog","rain"] && second ["sun","fog","rain","snow"] == ["rain"] && first ["a","a","b","c"] == ["a","b"] && makeWindow 0 2 ["first","first","last"] == ["first","first"] && makeWindow 0 0 [True,False] == [] && makeWindow 4 2 [1,2 :: Int] == [] && makeWindow 1 5 [True,False] == [False] && makeWindow 1 2 ([] :: [Int]) == [] && (let [chosen] = makeWindow 1 1 [(\n -> n), (\n -> n + 2), (\n -> n + 3)] in chosen 5 == 7)
        hints:
          # Conditions: unused start; dropping after an already bounded prefix; other window attempts.
          - title: "A Setting with No Effect"
            condition: "code_matches: /^(?:(?![\\s\\S]*(?:^|\\n)makeWindow\\b(?![^\\n]*::))|(?=[\\s\\S]*(?:(?:^|\\n)makeWindow\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*\\\\[A-Za-z_]\\w*\\s*->\\s*take\\s+[A-Za-z_]\\w*\\s+[A-Za-z_]\\w*\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$)|(?:^|\\n)makeWindow\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*(?:undefined|error\\s+\"[^\"\\n]*\"|_)\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$))))/"
            text: "Vary start and count separately while keeping the input fixed. If either setting has no effect on the window, inspect where each captured setting participates in the returned function."
          - title: "Mark the Requested Positions"
            condition: "code_matches: /^(?=[\\s\\S]*(?:^|\\n)makeWindow\\b(?![^\\n]*::))(?![\\s\\S]*(?:(?:^|\\n)makeWindow\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*\\\\[A-Za-z_]\\w*\\s*->\\s*take\\s+[A-Za-z_]\\w*\\s+[A-Za-z_]\\w*\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$)|(?:^|\\n)makeWindow\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*(?:undefined|error\\s+\"[^\"\\n]*\"|_)\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$)))(?=[\\s\\S]*(?:^|\\n)makeWindow\\b(?![^\\n]*::)(?:(?!\\n[A-Za-z_]\\w*\\s*(?:::|[^\\n]*=))[\\s\\S])*(?:drop\\s+start\\s*\\(?\\s*take\\s+count))/"
            text: "Label the positions of [\"a\",\"b\",\"c\",\"d\"] from zero. With start 1 and count 2, mark the positions the contract requests. Trace the positions left after each list operation in your attempt."
          - title: "Complete the Lambda's Input"
            condition: "code_matches: /^(?=[\\s\\S]*(?:^|\\n)makeWindow\\b(?![^\\n]*::))(?![\\s\\S]*(?:(?:^|\\n)makeWindow\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*\\\\[A-Za-z_]\\w*\\s*->\\s*take\\s+[A-Za-z_]\\w*\\s+[A-Za-z_]\\w*\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$)|(?:^|\\n)makeWindow\\b(?![^\\n]*::)[^\\n]*=\\s*\\(*\\s*(?:undefined|error\\s+\"[^\"\\n]*\"|_)\\s*\\)*[ \\t]*(?:--[^\\n]*)?(?:\\n|$)))(?![\\s\\S]*(?:^|\\n)makeWindow\\b(?![^\\n]*::)(?:(?!\\n[A-Za-z_]\\w*\\s*(?:::|[^\\n]*=))[\\s\\S])*(?:drop\\s+start\\s*\\(?\\s*take\\s+count))/"
            text: "The starter's `\\items -> take count (...)` can be completed with an expression using the captured start setting and the lambda's items parameter. Choose that expression from the marked positions; then call two differently configured windows in alternating order to check their captured settings."
    quiz:
      title: Step 2 — Knowledge Check
      min_score: 0.8
      shuffle_questions: false
      shuffle_options: true
      questions:
        - type: single
          bloom: apply
          difficulty: intermediate
          question: |-
            What is `choose "oak" "saved" ""`?

            ```haskell
            choose items tag = \items -> (null items, tag)
            ```

            Identify the binding used by each name before choosing. Compare your reasoning with the feedback afterward.
          options:
            - '`(False,"saved")`'
            - '`(True,"saved")`'
            - '`(True,"oak")`'
          correct_index: 1
          option_feedback:
            0: The inner items shadows the first parameter. The returned function receives the empty string, which null
              recognizes as empty.
            2: Tag refers to the second argument, "saved". Shadowing items does not redirect the separate tag binding.
          explanation: The lambda tests its own empty items argument and retains the surrounding tag. The outer items
            argument is unused.
        - type: multiple
          bloom: analyze
          difficulty: advanced
          question: |-
            Each proposed edit is made separately. Select every edit that preserves this expression's result.

            ```haskell
            let limit = 2
                clip = \items -> take limit items
            in let limit = 99 in clip ["p","q","r"]
            ```
          options:
            - Rename the inner `limit = 99` binding to `cap = 99`.
            - Change the outer `limit = 2` binding to `limit = 1`.
            - Change the inner `limit = 99` binding to `limit = 1`.
            - Move `clip` into the inner `let` beside `limit = 99`.
          correct_indices:
            - 0
            - 2
          option_feedback:
            0: The inner limit is unused, so renaming it does not change which binding clip refers to.
            1: Clip uses the outer limit. Changing it to 1 changes the result to ["p"].
            2: The caller-side limit does not change the binding captured by clip. The result remains ["p","q"].
            3: Moving the definition changes its lexical surroundings. Clip would then use 99 and return all three items.
          explanation: Preserving a closure requires preserving the bindings its free names refer to. A name at the call
            site and a name at the definition site can have the same spelling but different roles.
        - type: single
          bloom: apply
          difficulty: intermediate
          question: |-
            Infer the most general type of `duplicateItems`.

            ```haskell
            duplicateItems items = map (\item -> (item, item)) items
            ```
          options:
            - '`[a] -> [(a, a)]`'
            - '`[a] -> [[a]]`'
            - '`[a] -> [(a, b)]`'
          correct_index: 0
          option_feedback:
            1: The lambda returns a pair as one output element, rather than an inner list. Map preserves that element
              structure.
            2: Both positions contain the same item, so their types agree. An unrelated b would promise independent types
              that this definition cannot produce.
          explanation: An input element of type a becomes a pair of type (a,a), giving [a] -> [(a,a)]. No numeric or comparison
            operation restricts the element type.
    solution:
      files:
        - path: Main.hs
          language: haskell
          content: |
            module Main where

            scopeProbe :: [a] -> Bool
            scopeProbe items = (\items -> null items) []

            makeWindow :: Int -> Int -> ([a] -> [a])
            makeWindow start count = \items -> take count (drop start items)

            main :: IO ()
            main = do
              print (scopeProbe ["oak"])
              let middle = makeWindow 1 2
                  later = makeWindow 2 1
              print (middle ["sun","fog","rain","snow"])
              print (later ["sun","fog","rain","snow"])
              print (middle ["sun","fog","rain","snow"])
      explanation: |
        The lambda's free names start and count refer to the enclosing makeWindow invocation. Its items arrive in a later application. The middle window returns ["fog","rain"], the later window returns ["rain"], and calling middle again gives its original result. No element operation constrains a, so the same window rule works with strings, numbers, or other values.

  # Lecture: intro_to_functional_programming_and_haskell_v10_handouts.pdf, pp. 114,120–127.
  # Assessment: [Midterm] F24 V1 (Public).pdf, Problem 3D, p. 6 (explicit currying);
  # [Midterm] F23 (Public).pdf, Problem 4a–c, p. 8 (types after partial application).
  # Pedagogy: contrast curried/tuple types, then produce and trace nested lambdas.
  - title: "Currying and Partial Application"
    key: currying
    instructions: |
      ### Why this matters

      Several parts of an application may need the same operation with
      different settings, such as a different fallback for an empty list.
      **Partial application turns one general function into a configured
      function** that you can pass on or reuse when data arrives. You can
      vary the policy without copying the operation's implementation.
      Reading the remaining type lets you check whether you have produced
      a result or a function still waiting for input.

      ### 🎯 You will learn to

      - Analyze the type left after a function receives some of its arguments.
      - Rewrite a function as nested one-parameter lambdas without changing its behavior.

      ### One Argument at a Time

      These two interfaces supply a fallback item when a list is empty, but receive their arguments differently:

      ```haskell
      withFallback :: a -> [a] -> [a]
      withFallback fallback items = if null items then [fallback] else items

      pairFallback :: (a, [a]) -> [a]
      pairFallback (fallback, items) = if null items then [fallback] else items
      ```

      The arrow groups to the right: `a -> [a] -> [a]` means `a -> ([a] -> [a])`. Application groups to the left: `withFallback '?' "ink"` means `(withFallback '?') "ink"`. So `withFallback '?'` is a function awaiting a string. This is **partial application**. The curried interface makes it possible; `pairFallback` instead expects one complete pair.

      **Currying** represents a multiple-input operation as successive single-argument functions. Haskell's `withFallback fallback items = ...` already has curried form. Writing the lambdas makes that structure visible:

      ```haskell
      withFallback = \fallback -> (\items -> if null items then [fallback] else items)
      ```

      The outer lambda receives the fallback item. Its result is a function that remembers that item and awaits a list. A function-valued parameter still needs its parentheses: `(a -> b) -> [a] -> [b]` has a function as its first input.

      ### Thinking Time!

      Predict `map (withFallback '?') ["","ink"]` before running. First write the type of `withFallback '?'`, then its two results. Explain why `pairFallback '?'` would be a type error: the pair interface needs the fallback and the list together.

      Write the fully grouped arrow type and application separately before opening the reveal.

      <details markdown="1">
      <summary>Check the grouping and remaining function</summary>

      - Grouped arrow type: `a -> ([a] -> [a])`.
      - Grouped application: `(withFallback '?') "ink"`.
      - Remaining function type: `withFallback '?' :: String -> String`.

      The first argument fixes `a` to `Char`. The resulting function still awaits `[Char]`, also called `String`. It returns "?" for "" and "ink" for "ink", so the mapped result is `["?","ink"] :: [String]`.

      Right-grouped arrows describe the function returned after an argument; left-grouped application supplies the next argument to that function. `pairFallback ('?', "ink")` supplies one pair instead.

      </details>

      ### Your Turn

      Fix `discountAll amount scores` to subtract `amount` from **each score**. Keep the order and repeats; do not clamp negative results. For example, discounting `[2,12]` by 10 should produce `[-8,2]`.

      Keep its curried interface so that `discountAll 10` can be reused as a list transformation. Repair the lambda's operand order, then rewrite the definition as `discountAll = ...` using one lambda for `amount` and another for `scores`. These are two spellings of the same interface; the tests check behavior rather than a particular spelling.

      Add a call that passes `discountAll 3` directly to `map` over a list of score lists. Determine the remaining function type and the result type before running.
    files:
      - path: Main.hs
        language: haskell
        reseed: true
        content: |
          module Main where

          withFallback :: a -> [a] -> [a]
          withFallback fallback items = if null items then [fallback] else items

          pairFallback :: (a, [a]) -> [a]
          pairFallback (fallback, items) = if null items then [fallback] else items

          discountAll :: Int -> [Int] -> [Int]
          discountAll amount scores = map (\score -> amount - score) scores

          main :: IO ()
          main = do
            print (withFallback '?' "", pairFallback ('?', ""))
            print (map (withFallback '?') ["","ink"])
            print (discountAll 10 [2,12])
