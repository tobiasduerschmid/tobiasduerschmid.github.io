# Prepared traces are generated by the real C++ producer, never hand-authored.
cpp_value_parameter:
  language: cpp
  title: A value parameter gets a copy
  prediction: >-
    Predict the final output. While decorate runs, how many string storage
    boxes exist? Which one changes after += and after =?
  code: |
    #include <iostream>
    #include <string>

    void decorate(std::string label) {
        label += "!";
        label = "replacement";
    }

    int main() {
        std::string original = "draft";
        decorate(original);
        std::cout << original << '\n';
    }
  explanation: >-
    The output is draft. The argument initializes a separate string object for
    label. Appending changes that copy to draft!; assignment then changes the
    copy to replacement. Neither operation changes original. Equal initial
    contents do not mean shared storage. The local copy disappears on return.
  variation: >-
    Change the parameter to std::string& label. Before tracing, predict whether
    +=, =, both, or neither will change original. Count storage boxes again.
  variation_explanation: >-
    Both operations now affect original, and the output is replacement. label
    is an alias for original's storage rather than a separate string copy.

cpp_reference_parameter:
  language: cpp
  title: A reference parameter aliases caller storage
  prediction: >-
    Predict original after each statement in decorate. Does assigning label
    make it refer to a different string, or change the string it already names?
  code: |
    #include <iostream>
    #include <string>

    void decorate(std::string& label) {
        label += "!";
        label = "replacement";
    }

    int main() {
        std::string original = "draft";
        decorate(original);
        std::cout << original << '\n';
    }
  explanation: >-
    The output is replacement. original and label name the same string storage:
    it changes from draft to draft!, then to replacement. Assignment through a
    reference changes the referred object; it does not reseat the reference.
    Returning removes the local alias while original's storage remains.
  variation: >-
    Make the parameter const std::string& label. Predict which statements the
    compiler rejects. Then replace the body with a statement that prints label.
  variation_explanation: >-
    Both modifications are rejected through a const reference. Printing label
    is allowed and still uses the caller's string without a value copy.
    const restricts this access path; it does not guarantee that no other
    alias can modify the object.

cpp_pointer_parameter:
  language: cpp
  title: Copy the pointer, share the pointed-to object
  prediction: >-
    Predict all three outputs. After label = other, which pointer's target changes?
    After *label = "changed", which caller string changes?
  code: |
    #include <iostream>
    #include <string>

    void redirect(std::string* label, std::string* other) {
        label = other;
        *label = "changed";
    }

    int main() {
        std::string first = "draft";
        std::string second = "review";
        std::string* selected = &first;
        redirect(selected, &second);
        std::cout << first << '\n';
        std::cout << second << '\n';
        std::cout << *selected << '\n';
    }
  explanation: >-
    The output is draft, changed, then draft. selected and label initially hold
    separate pointer values reaching first. Assigning label redirects only the
    local pointer to second. Writing through *label changes second's string.
    selected still points to first. Passing a pointer by value copies the
    pointer, not its target object, and does not alias the caller's pointer slot.
  variation: >-
    Remove label = other. Predict all three outputs and identify which pointer
    arrows will still share a target when *label is assigned.
  variation_explanation: >-
    The output becomes changed, review, then changed. label and selected still
    reach first, so writing through label is visible through selected as well.

cpp_copy_in_out:
  language: cpp
  title: Simulate copy-in and copy-out explicitly
  prediction: >-
    Predict quota while adjust runs, after it returns, and after quota = result.
    At which exact statement does the caller's storage change?
  code: |
    #include <iostream>

    int adjust(int local) {
        local += 5;
        return local;
    }

    int main() {
        int quota = 10;
        int result = adjust(quota);
        std::cout << quota << '\n';
        quota = result;
        std::cout << quota << '\n';
    }
  explanation: >-
    The output is 10, then 15. The call copies quota into local. Changes to
    local leave quota unchanged. Returning stores the computed value in result;
    the explicit quota = result statement performs the copy-out. This models
    the copy-in/copy-out idea with ordinary C++ value passing and assignment.
    It is not a native C++ parameter mode or a complete implementation of another
    language's value-result rules.
  variation: >-
    Insert quota = 100 after the first print and before quota = result. Predict
    the last output. Which value wins when the delayed copy-out occurs?
  variation_explanation: >-
    The final value is still 15: copy-out overwrites the intervening assignment
    of 100. With several copy-out parameters targeting one caller variable,
    the order of the explicit assignments would matter.

cpp_macro_precedence:
  language: cpp
  title: A macro substitutes tokens
  prediction: >-
    Expand SQUARE(2 + 3) on paper, then predict the two printed results. Does
    either macro invocation create a parameter variable named x?
  code: |
    #include <iostream>
    #define SQUARE(x) x * x
    #define GROUPED_SQUARE(x) ((x) * (x))

    int main() {
        int first = SQUARE(2 + 3);
        int second = GROUPED_SQUARE(2 + 3);
        std::cout << first << '\n';
        std::cout << second << '\n';
    }
  explanation: >-
    The output is 11, then 25. The first expansion is 2 + 3 * 2 + 3; ordinary
    operator precedence makes it 11. Parentheses in the second expansion give
    (2 + 3) * (2 + 3). x is a preprocessing placeholder, not a runtime parameter
    with its own storage. The diagram shows the resulting caller variables.
  variation: >-
    Replace both arguments with 4 - 1. Expand both expressions before checking
    their values. Explain why parentheses solve this issue but do not make a
    macro evaluate each argument only once.
  variation_explanation: >-
    The first becomes 4 - 1 * 4 - 1, which is -1; the grouped expression is 9.
    The argument tokens still appear twice in both expansions.

cpp_macro_repeated_evaluation:
  language: cpp
  title: Repeated tokens can repeat side effects
  prediction: >-
    Predict count after TWICE(++count), then after report_twice(++count).
    How many times does each argument expression run? Which call creates a
    local parameter box?
  code: |
    #include <iostream>
    #define TWICE(action) do { action; action; } while (false)

    void report_twice(int value) {
        std::cout << value << '\n';
        std::cout << value << '\n';
    }

    int main() {
        int count = 10;
        TWICE(++count);
        std::cout << count << '\n';
        report_twice(++count);
        std::cout << count << '\n';
    }
  explanation: >-
    The output is 12, 13, 13, then 13. TWICE expands to two separate ++count
    statements, executed in sequence. The function call evaluates ++count once,
    initializes value with 13, and prints that copy twice. The macro has no
    action parameter storage; the function has a real value parameter.
  variation: >-
    Replace TWICE(++count) with TWICE(count += 3). Predict the final count and
    explain why this example has defined sequencing even though an expression
    such as (++count) * (++count) does not.
  variation_explanation: >-
    The macro raises count to 16 in two separate statements; the function call
    raises it once more to 17. Each statement completes before the next begins.
    Two unsequenced modifications in the multiplication expression would have
    undefined behavior and no portable numeric prediction.

cpp_macro_capture:
  language: cpp
  title: A macro's local name can capture the caller's name
  prediction: >-
    Expand SWAP(a, temp) literally. Predict a and the caller's temp at the end.
    In the expanded block, which temp does each use name?
  code: |
    #include <iostream>
    #define SWAP(X, Y) { int temp = X; X = Y; Y = temp; }

    int main() {
        int a = 2;
        int temp = 17;
        SWAP(a, temp);
        std::cout << a << '\n';
        std::cout << temp << '\n';
    }
  explanation: >-
    The output is 2, then 17. Expansion gives a block containing int temp = a;
    a = temp; temp = temp;. The block's new temp shadows the caller's temp,
    so both assignments use the inner variable and the caller's 17 is untouched.
    Distinct scope labels in the diagram distinguish the two storage boxes.
  variation: >-
    Rename the caller's temp to b, including the invocation and print. Predict
    the result. Then explain why renaming the macro's temporary to an unusual
    name reduces collisions but does not make textual substitution hygienic.
  variation_explanation: >-
    With b, this invocation prints 17 and 2. A caller could still use whatever
    temporary name the macro chooses. An ordinary function with reference
    parameters, or std::swap for these values, avoids this textual capture.
