# Predict a consequence that needs reasoning about the code, then edit and
# compare. Keep answers in the collapsed explanation, not in the prompt.
visibility:
  title: Member visibility
  type: class
  explanation: "Only read access is lost from the public API: the field already excluded direct writes. Making the reading method non-public does not change the field's visibility. Python's underscore expresses a convention, not enforced privacy."
  java:
    task: "For an existing Student, would making only displayName() private remove public read access, write access, both, or neither? Predict, then change that method."
    code: |
      class Student {
          private String name;

          public String displayName() {
              return name;
          }
      }
  python:
    task: "Under Python's public-API convention, would renaming display_name() to _display_name() remove read access, write access, both, or neither for an existing Student? Predict, then rename only the method."
    code: |
      class Student:
          def __init__(self, name: str) -> None:
              self._name: str = name

          def display_name(self) -> str:
              return self._name

  cpp:
    task: "For an existing Student, would moving only displayName() into a private section remove public read access, write access, both, or neither? Predict, then move that method."
    code: |
      #include <string>

      class Student {
          std::string name;
      public:
          std::string displayName() {
              return name;
          }
      };

  typescript:
    task: "For an existing Student, would making only displayName() private remove public read access, write access, both, or neither? Predict, then change that method."
    code: |
      class Student {
          private name: string = "Ada";

          public displayName(): string {
              return this.name;
          }
      }

inheritance:
  title: Inheritance through a parent
  type: class
  explanation: "Puppy can still use speak() through Dog's inheritance from Animal. Its direct parent becomes Dog; Animal remains an ancestor. The direct links are Puppy to Dog and Dog to Animal."
  java:
    task: "If Puppy inherits from Dog instead of Animal directly, can a Puppy still speak()? Predict the direct inheritance links, then change its parent."
    code: |
      class Animal {
          void speak() { }
      }

      class Dog extends Animal { }

      class Puppy extends Animal { }
  python:
    task: "If Puppy inherits from Dog instead of Animal directly, can a Puppy still speak()? Predict the direct inheritance links, then change its parent."
    code: |
      class Animal:
          def speak(self) -> None:
              pass

      class Dog(Animal):
          pass

      class Puppy(Animal):
          pass

  cpp:
    task: "If Puppy inherits publicly from Dog instead of Animal directly, can a Puppy still speak()? Predict the direct inheritance links, then change its parent."
    code: |
      class Animal {
      public:
          void speak() { }
      };

      class Dog : public Animal { };

      class Puppy : public Animal { };

  typescript:
    task: "If Puppy inherits from Dog instead of Animal directly, can a Puppy still speak()? Predict the direct inheritance links, then change its parent."
    code: |
      class Animal {
          speak(): void { }
      }

      class Dog extends Animal { }

      class Puppy extends Animal { }

dependency:
  title: Keeping a reference
  type: class
  explanation: "Removing the stored reference leaves a dependency: the method signature still names Roster. Removing that now-unused parameter eliminates the dependency too. Both classes can remain."
  java:
    task: "After removing the roster field and its assignment, will Student be independent of Roster? Predict, then edit. What further change removes the coupling without deleting either class?"
    code: |
      class Roster { }

      class Student {
          private Roster roster;

          void keepRoster(Roster roster) {
              this.roster = roster;
          }
      }
  python:
    task: "After replacing self.roster: Roster = roster with pass, will Student be independent of Roster? Predict, then edit. What further change removes the coupling without deleting either class?"
    code: |
      class Roster:
          pass

      class Student:
          def keep_roster(self, roster: Roster) -> None:
              self.roster: Roster = roster

  cpp:
    task: "After removing the roster field and its assignment, will Student be independent of Roster? Predict, then edit. What further change removes the coupling without deleting either class?"
    code: |
      class Roster { };

      class Student {
          Roster* roster = nullptr;
      public:
          void keepRoster(Roster& roster) {
              this->roster = &roster;
          }
      };

  typescript:
    task: "After removing the roster field and its assignment, will Student be independent of Roster? Predict, then edit. What further change removes the coupling without deleting either class?"
    code: |
      class Roster { }

      class Student {
          private roster: Roster | null = null;

          keepRoster(roster: Roster): void {
              this.roster = roster;
          }
      }

collection_multiplicity:
  title: One reference or a collection
  type: class
  explanation: "An empty collection is a counterexample: the Member end permits zero or more (*), so the type does not enforce a nonempty team. A separate invariant and validation would be needed for a lower bound of one."
  java:
    task: "A team must have at least one member. Would replacing both members types with List<Member> enforce that rule? Predict the lower bound and look for a counterexample, then edit."
    code: |
      import java.util.List;

      class Member { }

      class Team {
          Member members;

          Team(Member members) {
              this.members = members;
          }
      }
  python:
    task: "A team must have at least one member. Would replacing both members annotations with list[Member] enforce that rule? Predict the lower bound and look for a counterexample, then edit."
    code: |
      class Member:
          pass

      class Team:
          def __init__(self, members: Member) -> None:
              self.members: Member = members

  cpp:
    task: "A team must have at least one member. Would replacing both Member& types with std::vector<Member*> enforce that rule? Predict the lower bound and look for a counterexample, then edit."
    code: |
      #include <vector>

      class Member { };

      class Team {
          Member& members;
      public:
          Team(Member& members) : members(members) { }
      };

  typescript:
    task: "A team must have at least one member. Would replacing both members annotations with Member[] enforce that rule? Predict the lower bound and look for a counterexample, then edit."
    code: |
      class Member { }

      class Team {
          members: Member;

          constructor(members: Member) {
              this.members = members;
          }
      }

message_order:
  title: Calls determine message order
  type: sequence
  explanation: "After the swap, Main calls refund(), then authorize(); payment calls its own capture() while handling authorize(). That nested call stays with authorize(), regardless of where capture() is declared."
  java:
    task: "After swapping the two calls in main, what will the full message order be, including calls inside methods? Predict who sends capture(), then make the swap."
    code: |
      class Payment {
          void capture() { }
          void authorize() {
              this.capture();
          }
          void refund() { }
      }

      class App {
          public static void main(String[] args) {
              Payment payment = new Payment();
              payment.authorize();
              payment.refund();
          }
      }
  python:
    task: "After swapping the two calls at the bottom, what will the full message order be, including calls inside methods? Predict who sends capture(), then make the swap."
    code: |
      class Payment:
          def capture(self) -> None:
              pass

          def authorize(self) -> None:
              self.capture()

          def refund(self) -> None:
              pass

      payment = Payment()
      payment.authorize()
      payment.refund()

  cpp:
    task: "After swapping the two calls in main, what will the full message order be, including calls inside methods? Predict who sends capture(), then make the swap."
    code: |
      class Payment {
      public:
          void capture() { }
          void authorize() {
              this->capture();
          }
          void refund() { }
      };

      int main() {
          Payment payment;
          payment.authorize();
          payment.refund();
      }

  typescript:
    task: "After swapping the two calls at the bottom, what will the full message order be, including calls inside methods? Predict who sends capture(), then make the swap."
    code: |
      class Payment {
          capture(): void { }
          authorize(): void {
              this.capture();
          }
          refund(): void { }
      }

      const payment = new Payment();
      payment.authorize();
      payment.refund();

self_calls:
  title: Calling another method
  type: sequence
  explanation: "validate() finishes first, then save(), then submit(). All three execute on the same checkout object, so their activations nest on one Checkout lifeline."
  java:
    task: "If submit() calls save(), which calls validate(), predict the completion order and the number of Checkout lifelines. Then rearrange the calls without creating an object."
    code: |
      class Checkout {
          void validate() { }
          void save() { }

          void submit() {
              this.validate();
          }
      }

      class App {
          public static void main(String[] args) {
              Checkout checkout = new Checkout();
              checkout.submit();
          }
      }
  python:
    task: "If submit() calls save(), which calls validate(), predict the completion order and the number of Checkout lifelines. Then rearrange the calls without creating an object."
    code: |
      class Checkout:
          def validate(self) -> None:
              pass

          def save(self) -> None:
              pass

          def submit(self) -> None:
              self.validate()

      checkout = Checkout()
      checkout.submit()

  cpp:
    task: "If submit() calls save(), which calls validate(), predict the completion order and the number of Checkout lifelines. Then rearrange the calls without creating an object."
    code: |
      class Checkout {
      public:
          void validate() { }
          void save() { }

          void submit() {
              this->validate();
          }
      };

      int main() {
          Checkout checkout;
          checkout.submit();
      }

  typescript:
    task: "If submit() calls save(), which calls validate(), predict the completion order and the number of Checkout lifelines. Then rearrange the calls without creating an object."
    code: |
      class Checkout {
          validate(): void { }
          save(): void { }

          submit(): void {
              this.validate();
          }
      }

      const checkout = new Checkout();
      checkout.submit();

message_receivers:
  title: Following a reference
  type: sequence
  explanation: "selected refers to the existing outdoor object, so outdoor receives read() and sends the reply. The Sensor lifeline count stays two: assigning a reference creates no new Sensor. Follow-up: compare a helper returning that object by reference with one constructing a new Sensor. The first preserves its lifeline; the second creates an object. C++ value returns may copy or move and are not assumed to preserve identity."
  java:
    task: "Change selected's initializer from indoor to outdoor, leaving selected.read() unchanged. Predict the number of Sensor lifelines and which object sends the reply before editing."
    code: |
      class Sensor {
          int read() {
              return 25;
          }
      }

      class App {
          public static void main(String[] args) {
              Sensor indoor = new Sensor();
              Sensor outdoor = new Sensor();
              Sensor selected = indoor;
              int reading = selected.read();
          }
      }
  python:
    task: "Change selected = indoor to selected = outdoor, leaving selected.read() unchanged. Predict the number of Sensor lifelines and which object sends the reply before editing."
    code: |
      class Sensor:
          def read(self) -> int:
              return 25

      indoor = Sensor()
      outdoor = Sensor()
      selected = indoor
      reading = selected.read()

  cpp:
    task: "Change selected's initializer from indoor to outdoor, keeping Sensor& and selected.read() unchanged. Predict the number of Sensor lifelines and which object sends the reply before editing."
    code: |
      class Sensor {
      public:
          int read() {
              return 25;
          }
      };

      int main() {
          Sensor indoor;
          Sensor outdoor;
          Sensor& selected = indoor;
          int reading = selected.read();
      }

  typescript:
    task: "Change selected = indoor to selected = outdoor, leaving selected.read() unchanged. Predict the number of Sensor lifelines and which object sends the reply before editing."
    code: |
      class Sensor {
          read(): number {
              return 25;
          }
      }

      const indoor = new Sensor();
      const outdoor = new Sensor();
      const selected = indoor;
      const reading = selected.read();

alternatives:
  title: Alternatives are possible paths
  type: sequence
  explanation: "The original if/else runs exactly one call. Two independent if statements with the same condition run both calls when accepted is true and neither when it is false. Their two opt frames expose the loss of mutual exclusion."
  java:
    task: "Replace else with a separate if (accepted). Will exactly one payment call still run for every input? Predict the calls for true and false before editing."
    code: |
      class Payment {
          void approve() { }
          void decline() { }
      }

      class Checkout {
          void pay(Payment payment, boolean accepted) {
              if (accepted) {
                  payment.approve();
              } else {
                  payment.decline();
              }
          }
      }

      class App {
          public static void main(String[] args) {
              Payment payment = new Payment();
              Checkout checkout = new Checkout();
              checkout.pay(payment, true);
          }
      }
  python:
    task: "Replace else with a separate if accepted. Will exactly one payment call still run for every input? Predict the calls for True and False before editing."
    code: |
      class Payment:
          def approve(self) -> None:
              pass

          def decline(self) -> None:
              pass

      class Checkout:
          def pay(self, payment: Payment, accepted: bool) -> None:
              if accepted:
                  payment.approve()
              else:
                  payment.decline()

      payment = Payment()
      checkout = Checkout()
      checkout.pay(payment, True)

  cpp:
    task: "Replace else with a separate if (accepted). Will exactly one payment call still run for every input? Predict the calls for true and false before editing."
    code: |
      class Payment {
      public:
          void approve() { }
          void decline() { }
      };

      class Checkout {
      public:
          void pay(Payment& payment, bool accepted) {
              if (accepted) {
                  payment.approve();
              } else {
                  payment.decline();
              }
          }
      };

      int main() {
          Payment payment;
          Checkout checkout;
          checkout.pay(payment, true);
      }

  typescript:
    task: "Replace else with a separate if (accepted). Will exactly one payment call still run for every input? Predict the calls for true and false before editing."
    code: |
      class Payment {
          approve(): void { }
          decline(): void { }
      }

      class Checkout {
          pay(payment: Payment, accepted: boolean): void {
              if (accepted) {
                  payment.approve();
              } else {
                  payment.decline();
              }
          }
      }

      const payment = new Payment();
      const checkout = new Checkout();
      checkout.pay(payment, true);

loop_boundary:
  title: The loop boundary matters
  type: sequence
  explanation: "Outside the loop, finish() runs once for either input. Inside, it runs zero times for zero items and twice for two items. An empty receipt is no longer finalized."
  java:
    task: "If finish() moves inside the loop after addItem(), how do its call counts change for zero items and two items? Predict both cases, then move it."
    code: |
      class Receipt {
          void addItem(String item) { }
          void finish() { }
      }

      class App {
          public static void main(String[] args) {
              Receipt receipt = new Receipt();
              for (String item : new String[] {"book", "pen"}) {
                  receipt.addItem(item);
              }
              receipt.finish();
          }
      }
  python:
    task: "If finish() moves inside the loop after add_item(), how do its call counts change for zero items and two items? Predict both cases, then move it."
    code: |
      class Receipt:
          def add_item(self, item: str) -> None:
              pass

          def finish(self) -> None:
              pass

      receipt = Receipt()
      for item in ["book", "pen"]:
          receipt.add_item(item)
      receipt.finish()
  cpp:
    task: "If finish() moves inside the loop after addItem(), how do its call counts change for zero items and two items? Predict both cases, then move it."
    code: |
      class Receipt {
      public:
          void addItem(int item) { }
          void finish() { }
      };

      int main() {
          Receipt receipt;
          int items[] = {1, 2};
          for (int item : items) {
              receipt.addItem(item);
          }
          receipt.finish();
      }

  typescript:
    task: "If finish() moves inside the loop after addItem(), how do its call counts change for zero items and two items? Predict both cases, then move it."
    code: |
      class Receipt {
          addItem(item: string): void { }
          finish(): void { }
      }

      const receipt = new Receipt();
      for (const item of ["book", "pen"]) {
          receipt.addItem(item);
      }
      receipt.finish();
