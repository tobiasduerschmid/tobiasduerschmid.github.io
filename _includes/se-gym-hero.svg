{% assign hero_variant = include.variant | default: "main" %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 -20 640 665" class="se-gym-hero-svg se-gym-hero-svg-{{ hero_variant }}" data-gym-hero-svg data-hero-body="average"{% if include.ready %} data-hero-avatar-ready="true"{% endif %} aria-hidden="true" focusable="false" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" color-interpolation="sRGB">
    <defs>
    <linearGradient id="suit-{{ hero_variant }}" x1=".08" y1="0" x2=".92" y2="1">
      <stop offset="0" stop-color="var(--hero-suit-specular, #dff7ff)"/>
      <stop offset=".12" stop-color="var(--hero-suit-light, #68c4ea)"/>
      <stop offset=".43" stop-color="var(--hero-suit, #1F8FBD)"/>
      <stop offset=".76" stop-color="var(--hero-suit-dark, #064b7b)"/>
      <stop offset="1" stop-color="var(--hero-suit-shadow, #03213d)"/>
    </linearGradient>
    <radialGradient id="suit-sheen-{{ hero_variant }}" cx=".5" cy="0" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="torso-rim-light-{{ hero_variant }}" gradientUnits="userSpaceOnUse" x1="324" y1="262" x2="476" y2="432"><stop offset="0" stop-color="var(--hero-suit-specular, #dff7ff)" stop-opacity=".58"/><stop offset=".18" stop-color="var(--hero-suit-rim, #b8eeff)" stop-opacity=".3"/><stop offset=".48" stop-color="var(--hero-suit-specular, #ffffff)" stop-opacity=".08"/><stop offset="1" stop-color="var(--hero-suit-specular, #ffffff)" stop-opacity="0"/></linearGradient>
    <radialGradient id="torso-core-glow-{{ hero_variant }}" gradientUnits="userSpaceOnUse" cx="386" cy="296" r="126"><stop offset="0" stop-color="var(--hero-suit-specular, #ffffff)" stop-opacity=".25"/><stop offset=".46" stop-color="var(--hero-suit-rim, #9be5ff)" stop-opacity=".16"/><stop offset="1" stop-color="var(--hero-suit-ambient, #9be5ff)" stop-opacity="0"/></radialGradient>
    <linearGradient id="suit-panel-{{ hero_variant }}" gradientUnits="userSpaceOnUse" x1="330" y1="260" x2="470" y2="430"><stop offset="0" stop-color="var(--hero-suit-rim, #94e3ff)" stop-opacity=".5"/><stop offset=".55" stop-color="var(--hero-suit-ambient, #2aa6d2)" stop-opacity=".22"/><stop offset="1" stop-color="var(--hero-suit-shadow, #062f54)" stop-opacity=".2"/></linearGradient>
    <linearGradient id="suit-deep-panel-{{ hero_variant }}" gradientUnits="userSpaceOnUse" x1="350" y1="260" x2="450" y2="560"><stop offset="0" stop-color="var(--hero-suit-dark, #052944)" stop-opacity=".22"/><stop offset=".65" stop-color="var(--hero-suit-shadow, #03213d)" stop-opacity=".58"/><stop offset="1" stop-color="var(--hero-suit-shadow, #06172c)" stop-opacity=".76"/></linearGradient>
    <linearGradient id="leg-rim-light-{{ hero_variant }}" gradientUnits="userSpaceOnUse" x1="352" y1="436" x2="448" y2="562"><stop offset="0" stop-color="var(--hero-suit-rim, #b7efff)" stop-opacity=".42"/><stop offset=".32" stop-color="var(--hero-suit-rim, #b7efff)" stop-opacity=".14"/><stop offset="1" stop-color="var(--hero-suit-specular, #ffffff)" stop-opacity="0"/></linearGradient>
    <linearGradient id="leg-inner-shadow-{{ hero_variant }}" gradientUnits="userSpaceOnUse" x1="372" y1="434" x2="428" y2="562"><stop offset="0" stop-color="var(--hero-suit-shadow, #001a2f)" stop-opacity="0"/><stop offset=".34" stop-color="var(--hero-suit-shadow, #001a2f)" stop-opacity=".14"/><stop offset="1" stop-color="var(--hero-suit-shadow, #001a2f)" stop-opacity=".46"/></linearGradient>
    <linearGradient id="cape-grad-{{ hero_variant }}" x1=".08" y1="0" x2=".92" y2="1"><stop offset="0" stop-color="var(--hero-cape-light, #4eb7df)"/><stop offset=".18" stop-color="var(--hero-cape, #0d5f91)"/><stop offset=".52" stop-color="var(--hero-cape-dark, #001F38)"/><stop offset=".74" stop-color="var(--hero-cape, #0d5f91)"/><stop offset="1" stop-color="var(--hero-cape-dark, #001F38)"/></linearGradient>
    <linearGradient id="cape-inner-{{ hero_variant }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--hero-cape-inner-light, #FFE470)"/><stop offset="1" stop-color="var(--hero-cape-inner, #B38B00)"/></linearGradient>
    <linearGradient id="gold-{{ hero_variant }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff9cf"/><stop offset=".14" stop-color="#ffe470"/><stop offset=".43" stop-color="#f3ba00"/><stop offset=".68" stop-color="#ffd94a"/><stop offset="1" stop-color="#876000"/></linearGradient>
    <radialGradient id="gold-radial-{{ hero_variant }}" cx=".38" cy=".32" r=".95"><stop offset="0" stop-color="#fff7c0"/><stop offset=".5" stop-color="#FFD100"/><stop offset="1" stop-color="#8a6a00"/></radialGradient>
    <linearGradient id="boot-cream-{{ hero_variant }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf0"/><stop offset=".5" stop-color="#f4f0d9"/><stop offset="1" stop-color="#cfc7a2"/></linearGradient>
    <linearGradient id="boot-shadow-{{ hero_variant }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f0d9" stop-opacity=".72"/><stop offset="1" stop-color="#6f5a18" stop-opacity=".52"/></linearGradient>
    <linearGradient id="boot-side-light-{{ hero_variant }}" gradientUnits="userSpaceOnUse" x1="336" y1="552" x2="392" y2="626"><stop offset="0" stop-color="#ffffff" stop-opacity=".48"/><stop offset=".22" stop-color="#fff7d2" stop-opacity=".24"/><stop offset="1" stop-color="#fff7d2" stop-opacity="0"/></linearGradient>
    <radialGradient id="boot-toe-gloss-{{ hero_variant }}" gradientUnits="userSpaceOnUse" cx="366" cy="592" r="34"><stop offset="0" stop-color="#ffffff" stop-opacity=".44"/><stop offset=".5" stop-color="#fff0b0" stop-opacity=".16"/><stop offset="1" stop-color="#fff0b0" stop-opacity="0"/></radialGradient>
    <linearGradient id="boot-sole-depth-{{ hero_variant }}" gradientUnits="userSpaceOnUse" x1="334" y1="616" x2="394" y2="634"><stop offset="0" stop-color="#4a3806" stop-opacity=".16"/><stop offset=".52" stop-color="#8f6c00" stop-opacity=".48"/><stop offset="1" stop-color="#fff6c0" stop-opacity=".2"/></linearGradient>
      <linearGradient id="boot-side-light-right-{{ hero_variant }}" gradientUnits="userSpaceOnUse" x1="464" y1="552" x2="408" y2="626"><stop offset="0" stop-color="#ffffff" stop-opacity=".48"/><stop offset=".22" stop-color="#fff7d2" stop-opacity=".24"/><stop offset="1" stop-color="#fff7d2" stop-opacity="0"/></linearGradient>
      <radialGradient id="boot-toe-gloss-right-{{ hero_variant }}" gradientUnits="userSpaceOnUse" cx="434" cy="592" r="34"><stop offset="0" stop-color="#ffffff" stop-opacity=".44"/><stop offset=".5" stop-color="#fff0b0" stop-opacity=".16"/><stop offset="1" stop-color="#fff0b0" stop-opacity="0"/></radialGradient>
      <linearGradient id="boot-sole-depth-right-{{ hero_variant }}" gradientUnits="userSpaceOnUse" x1="466" y1="616" x2="406" y2="634"><stop offset="0" stop-color="#4a3806" stop-opacity=".16"/><stop offset=".52" stop-color="#8f6c00" stop-opacity=".48"/><stop offset="1" stop-color="#fff6c0" stop-opacity=".2"/></linearGradient>
    <linearGradient id="milestone-metal-{{ hero_variant }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--hero-milestone-metal-light, #f5d2a5)"/><stop offset=".5" stop-color="var(--hero-milestone-metal, #b7793c)"/><stop offset="1" stop-color="var(--hero-milestone-metal-dark, #6b3e1d)"/></linearGradient>
    <radialGradient id="milestone-glow-{{ hero_variant }}" cx=".5" cy=".42" r=".58"><stop offset="0" stop-color="var(--hero-milestone-glow, #f5a35c)" stop-opacity=".34"/><stop offset=".65" stop-color="var(--hero-milestone-glow, #f5a35c)" stop-opacity=".12"/><stop offset="1" stop-color="var(--hero-milestone-glow, #f5a35c)" stop-opacity="0"/></radialGradient>
    <radialGradient id="milestone-jewel-{{ hero_variant }}" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#ffffff"/><stop offset=".42" stop-color="var(--hero-milestone-jewel, #f2a45d)"/><stop offset="1" stop-color="var(--hero-milestone-metal-dark, #6b3e1d)"/></radialGradient>
    <linearGradient id="skin-{{ hero_variant }}" gradientUnits="userSpaceOnUse" x1="356" y1="142" x2="446" y2="244"><stop offset="0" stop-color="var(--hero-skin-highlight-soft, #dfa07a)"/><stop offset=".38" stop-color="var(--hero-skin-light, #dfa07a)"/><stop offset=".78" stop-color="var(--hero-skin-mid, #c5815b)"/><stop offset="1" stop-color="var(--hero-skin, #b46a3d)"/></linearGradient>
    <linearGradient id="skin-patch-{{ hero_variant }}" gradientUnits="userSpaceOnUse" x1="358" y1="194" x2="431" y2="244">
      <stop offset="0" stop-color="color-mix(in srgb, #fae8d9 82%, var(--hero-skin-light, #dfa07a))"/>
      <stop offset="1" stop-color="color-mix(in srgb, #e4c7b4 78%, var(--hero-skin-mid, #c5815b))"/>
    </linearGradient>
    <radialGradient id="face-round-light-{{ hero_variant }}" gradientUnits="userSpaceOnUse" cx="380" cy="184" r="76"><stop offset="0" stop-color="var(--hero-skin-highlight, #fff1dc)" stop-opacity=".46"/><stop offset=".3" stop-color="var(--hero-skin-highlight-soft, #dfa07a)" stop-opacity=".34"/><stop offset=".72" stop-color="var(--hero-skin-light, #dfa07a)" stop-opacity=".06"/><stop offset="1" stop-color="var(--hero-skin-light, #dfa07a)" stop-opacity="0"/></radialGradient>
    <radialGradient id="face-form-shadow-{{ hero_variant }}" gradientUnits="userSpaceOnUse" cx="432" cy="226" r="68"><stop offset="0" stop-color="var(--hero-face-plane-shadow, #7a4a2a)" stop-opacity=".34"/><stop offset=".5" stop-color="var(--hero-face-plane-shadow, #7a4a2a)" stop-opacity=".14"/><stop offset="1" stop-color="var(--hero-face-plane-shadow, #7a4a2a)" stop-opacity="0"/></radialGradient>
    <radialGradient id="nose-form-{{ hero_variant }}" cx=".34" cy=".18" r=".92"><stop offset="0" stop-color="var(--hero-nose-highlight, #fff1dc)" stop-opacity=".72"/><stop offset=".48" stop-color="var(--hero-skin-mid, #c5815b)" stop-opacity=".46"/><stop offset="1" stop-color="var(--hero-nose-fill, #7a4a2a)" stop-opacity=".9"/></radialGradient>
    <linearGradient id="sclera-depth-{{ hero_variant }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef4f8"/><stop offset=".42" stop-color="#ffffff"/><stop offset=".78" stop-color="#f8fbfd"/><stop offset="1" stop-color="#d9e1e8"/></linearGradient>
    <radialGradient id="iris-depth-{{ hero_variant }}" cx=".34" cy=".28" r=".72"><stop offset="0" stop-color="var(--hero-eye-light, #756659)"/><stop offset=".44" stop-color="var(--hero-eye, #1f140c)"/><stop offset=".78" stop-color="var(--hero-eye-dark, #0b0704)"/><stop offset="1" stop-color="#000000"/></radialGradient>
    <radialGradient id="cheek-bloom-{{ hero_variant }}" cx=".42" cy=".42" r=".62"><stop offset="0" stop-color="var(--hero-cheek, #e87b6a)" stop-opacity=".84"/><stop offset=".5" stop-color="var(--hero-cheek, #e87b6a)" stop-opacity=".34"/><stop offset="1" stop-color="var(--hero-cheek, #e87b6a)" stop-opacity="0"/></radialGradient>
    <linearGradient id="stage-ring-{{ hero_variant }}" gradientUnits="userSpaceOnUse" x1="238" y1="120" x2="562" y2="560"><stop offset="0" stop-color="#8fdcff" stop-opacity=".18"/><stop offset=".34" stop-color="#2774ae" stop-opacity=".54"/><stop offset=".66" stop-color="#ffd100" stop-opacity=".44"/><stop offset="1" stop-color="#ffffff" stop-opacity=".08"/></linearGradient>
    <!-- User-space gradient so the upper arm and forearm share one continuous
         ramp: bounding-box units gave each segment its own light-to-dark run,
         which met at the elbow as a hard value seam. Spanning wrist (y 64) to
         shoulder (y 276) keeps the joint mid-tone on both sides. -->
    <linearGradient id="arm-suit-{{ hero_variant }}" gradientUnits="userSpaceOnUse" x1="400" y1="64" x2="400" y2="276"><stop offset="0" stop-color="var(--hero-arm-light, #68c4ea)"/><stop offset=".45" stop-color="var(--hero-arm, #1F8FBD)"/><stop offset="1" stop-color="var(--hero-arm-dark, #064b7b)"/></linearGradient>
    <linearGradient id="steel-{{ hero_variant }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#394451"/><stop offset=".16" stop-color="#8f9aa7"/><stop offset=".34" stop-color="#f6f8fa"/><stop offset=".48" stop-color="#b9c3cd"/><stop offset=".7" stop-color="#eef2f5"/><stop offset="1" stop-color="#303946"/></linearGradient>
    <linearGradient id="steel-dark-{{ hero_variant }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b6470"/><stop offset=".5" stop-color="#aab3be"/><stop offset="1" stop-color="#2a323d"/></linearGradient>
    <radialGradient id="plate-face-{{ hero_variant }}" cx=".38" cy=".3" r=".95"><stop offset="0" stop-color="#58bff4"/><stop offset=".52" stop-color="#1f82ce"/><stop offset="1" stop-color="#00345f"/></radialGradient>
    <radialGradient id="plate-face-dark-{{ hero_variant }}" cx=".4" cy=".32" r=".95"><stop offset="0" stop-color="#237fc2"/><stop offset=".55" stop-color="#0e4a87"/><stop offset="1" stop-color="#001428"/></radialGradient>
    <radialGradient id="plate-glow-{{ hero_variant }}" cx=".5" cy=".48" r=".62"><stop offset="0" stop-color="#7fdcff" stop-opacity=".18"/><stop offset=".72" stop-color="#3aa7ff" stop-opacity=".09"/><stop offset="1" stop-color="#3aa7ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="hero-stage-glow-{{ hero_variant }}" cx=".5" cy=".18" r=".78"><stop offset="0" stop-color="#edf7ff" stop-opacity=".16"/><stop offset=".42" stop-color="#82bde8" stop-opacity=".08"/><stop offset="1" stop-color="#081325" stop-opacity="0"/></radialGradient>
    <radialGradient id="brain-glow-{{ hero_variant }}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE470" stop-opacity=".55"/><stop offset=".55" stop-color="#FFD100" stop-opacity=".18"/><stop offset="1" stop-color="#FFD100" stop-opacity="0"/></radialGradient>
    <linearGradient id="hair-grad-{{ hero_variant }}" gradientUnits="userSpaceOnUse" x1="350" y1="112" x2="458" y2="252">
      <!-- The contrast-aware hero-hair-light token is intentionally desaturated
           (e.g. #776c64 for near-black hair), which read as a flat gray crown
           streak when used at full strength. color-mix re-warms the highlight
           toward the user's own hair base — safe for any hair color, blonde to
           black. User-space coordinates keep the key light on the crown instead
           of stretching the same metallic band across every lock and braid. -->
      <stop offset="0" stop-color="color-mix(in srgb, var(--hero-hair-light, #4a3220) 58%, var(--hero-hair, #1f140c))"/>
      <stop offset=".15" stop-color="color-mix(in srgb, var(--hero-hair-light, #4a3220) 26%, var(--hero-hair, #1f140c))"/>
      <stop offset=".38" stop-color="var(--hero-hair, #1f140c)"/>
      <stop offset=".78" stop-color="var(--hero-hair-dark, #0f0905)"/>
      <stop offset="1" stop-color="var(--hero-hair-dark, #0f0905)"/>
    </linearGradient>
    <linearGradient id="facial-hair-grad-{{ hero_variant }}" gradientUnits="userSpaceOnUse" x1="365" y1="208" x2="432" y2="258">
      <stop offset="0" stop-color="color-mix(in srgb, var(--hero-hair-light, #4a3220) 22%, var(--hero-hair, #1f140c))"/>
      <stop offset=".38" stop-color="var(--hero-hair, #1f140c)"/>
      <stop offset=".82" stop-color="var(--hero-hair-dark, #0f0905)"/>
      <stop offset="1" stop-color="color-mix(in srgb, var(--hero-hair-dark, #0f0905) 84%, var(--hero-hair, #1f140c))"/>
    </linearGradient>
    <radialGradient id="hair-luster-{{ hero_variant }}" cx=".4" cy=".25" r=".6">
      <stop offset="0" stop-color="color-mix(in srgb, var(--hero-hair-specular, #98785d) 68%, var(--hero-hair, #1f140c))" stop-opacity=".18"/>
      <stop offset=".25" stop-color="color-mix(in srgb, var(--hero-hair-light, #4a3220) 58%, var(--hero-hair, #1f140c))" stop-opacity=".34"/>
      <stop offset="1" stop-color="var(--hero-hair, #1f140c)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hair-sheen-{{ hero_variant }}" cx=".35" cy=".2" r=".8">
      <stop offset="0" stop-color="color-mix(in srgb, var(--hero-hair-specular, #98785d) 68%, var(--hero-hair, #1f140c))" stop-opacity=".24"/>
      <stop offset=".12" stop-color="color-mix(in srgb, var(--hero-hair-light, #4a3220) 58%, var(--hero-hair, #1f140c))" stop-opacity=".72"/>
      <stop offset=".45" stop-color="var(--hero-hair, #1f140c)" stop-opacity=".32"/>
      <stop offset="1" stop-color="var(--hero-hair, #1f140c)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair-comic-highlight-{{ hero_variant }}" gradientUnits="userSpaceOnUse" x1="360" y1="112" x2="440" y2="166">
      <stop offset="0" stop-color="color-mix(in srgb, var(--hero-hair-specular, #98785d) 68%, var(--hero-hair, #1f140c))" stop-opacity=".18"/>
      <stop offset=".36" stop-color="color-mix(in srgb, var(--hero-hair-light, #4a3220) 58%, var(--hero-hair, #1f140c))" stop-opacity=".54"/>
      <stop offset=".72" stop-color="color-mix(in srgb, var(--hero-hair-light, #4a3220) 58%, var(--hero-hair, #1f140c))" stop-opacity=".14"/>
      <stop offset="1" stop-color="color-mix(in srgb, var(--hero-hair-specular, #98785d) 68%, var(--hero-hair, #1f140c))" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hair-comic-shadow-{{ hero_variant }}" gradientUnits="userSpaceOnUse" x1="360" y1="158" x2="440" y2="176">
      <stop offset="0" stop-color="var(--hero-hair-dark, #0f0905)" stop-opacity=".1"/>
      <stop offset=".45" stop-color="var(--hero-hair-dark, #0f0905)" stop-opacity=".58"/>
      <stop offset="1" stop-color="var(--hero-hair-dark, #0f0905)" stop-opacity=".16"/>
    </linearGradient>
    <clipPath id="comic-crown-hair-clip-{{ hero_variant }}" clipPathUnits="userSpaceOnUse">
      <path d="M 350 180 C 346 140, 368 108, 400 106 C 432 108, 454 140, 450 180 C 436 166, 418 158, 400 158 C 382 158, 364 166, 350 180 Z"/>
    </clipPath>
    <g id="comic-crown-hair-detail-{{ hero_variant }}" clip-path="url(#comic-crown-hair-clip-{{ hero_variant }})">
      <!-- One off-centre key plate and one narrow occlusion plate keep the
           crown dimensional without creating stacked, helmet-like stripes. -->
      <path d="M 359 157 C 369 130, 387 116, 405 120 C 417 122, 424 129, 429 138 C 413 133, 398 135, 384 142 C 374 147, 366 153, 359 157 Z" fill="url(#hair-comic-highlight-{{ hero_variant }})" opacity=".34"/>
      <path d="M 355 171 C 373 162, 391 159, 408 162 C 420 164, 432 169, 444 177 C 429 171, 414 168, 399 169 C 383 168, 368 172, 355 178 Z" fill="url(#hair-comic-shadow-{{ hero_variant }})" opacity=".16"/>
    </g>
    <linearGradient id="bruin-fur-{{ hero_variant }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--hero-bruin-fur-light, #a06840)"/><stop offset=".55" stop-color="var(--hero-bruin-fur, #8b5a35)"/><stop offset="1" stop-color="var(--hero-bruin-fur-dark, #3d2515)"/></linearGradient>
    <radialGradient id="bruin-muzzle-{{ hero_variant }}" cx=".42" cy=".22" r=".85"><stop offset="0" stop-color="#fff2d4"/><stop offset=".58" stop-color="var(--hero-bruin-muzzle, #d0a070)"/><stop offset="1" stop-color="var(--hero-bruin-fur-light, #a06840)"/></radialGradient>
    <g id="hair-temple-roots-{{ hero_variant }}">
      <path d="M 350 160 C 356 158, 361 163, 361 171 C 357 178, 356 185, 358 190 C 353 186, 350 176, 350 160 Z" fill="url(#hair-grad-{{ hero_variant }})"/>
      <path d="M 450 160 C 444 158, 439 163, 439 171 C 443 178, 444 185, 442 190 C 447 186, 450 176, 450 160 Z" fill="url(#hair-grad-{{ hero_variant }})"/>
      <path d="M 356 165 C 353 174, 354 183, 358 189 M 444 165 C 447 174, 446 183, 442 189" stroke="var(--hero-hair-rim, #4a3220)" stroke-width="1.45" fill="none" stroke-linecap="round" opacity="var(--hero-hair-detail-opacity, .42)"/>
    </g>
    <g id="long-hair-backfill-{{ hero_variant }}">
      <path d="M 346 180 C 338 134, 361 100, 400 98 C 438 100, 462 134, 454 180 C 442 166, 424 158, 406 159 C 402 158, 398 158, 394 159 C 376 158, 358 166, 346 180 Z" fill="var(--hero-hair-dark, #0f0905)"/>
      <path d="M 344 174 C 335 214, 335 258, 340 297 C 344 326, 342 351, 336 369 C 347 380, 361 376, 368 359 C 373 330, 368 293, 367 258 C 365 226, 369 198, 378 182 C 365 174, 354 171, 344 174 Z" fill="url(#hair-grad-{{ hero_variant }})"/>
      <path d="M 456 174 C 465 210, 466 251, 460 288 C 456 317, 458 341, 464 359 C 452 371, 438 367, 431 351 C 426 323, 432 288, 433 255 C 435 224, 431 198, 422 182 C 435 174, 446 171, 456 174 Z" fill="url(#hair-grad-{{ hero_variant }})"/>
      <path d="M 353 208 C 348 252, 350 310, 355 349 M 447 205 C 452 246, 450 299, 444 341" stroke="var(--hero-hair-rim, #4a3220)" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="var(--hero-hair-detail-opacity, .24)"/>
    </g>
    <g id="shoulder-hair-backfill-{{ hero_variant }}">
      <path d="M 346 178 C 340 136, 363 104, 400 102 C 437 104, 460 136, 454 178 C 442 166, 423 158, 404 159 C 401 158, 399 158, 396 159 C 377 158, 358 166, 346 178 Z" fill="var(--hero-hair-dark, #0f0905)"/>
      <path d="M 344 174 C 334 214, 338 264, 354 296 C 362 304, 374 302, 380 290 C 368 256, 367 218, 378 182 C 364 174, 354 171, 344 174 Z" fill="url(#hair-grad-{{ hero_variant }})"/>
      <path d="M 456 174 C 466 214, 462 264, 446 296 C 438 304, 426 302, 420 290 C 432 256, 433 218, 422 182 C 436 174, 446 171, 456 174 Z" fill="url(#hair-grad-{{ hero_variant }})"/>
      <path d="M 356 200 C 350 232, 352 266, 362 292 M 444 200 C 450 232, 448 266, 438 292" stroke="var(--hero-hair-rim, #4a3220)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="var(--hero-hair-detail-opacity, .26)"/>
    </g>
    <!-- Reusable curl symbol per research: a small S-spiral that can be rotated/scaled into the silhouette. -->
