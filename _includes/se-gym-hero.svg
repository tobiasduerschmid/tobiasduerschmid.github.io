      <!-- Differential lower-face breath disabled: the whole face (eyes, brows,
           nose, mouth, glasses, ears) must move as ONE unit with the head via
           the shared head settle, so no feature drifts or scales relative to the
           others. Values are held at identity (kept rather than deleted so the
           rig stays self-documenting and trivially reversible). -->
      <g data-hero-motion="lower-face-breath-position">
        <animateTransform attributeName="transform" type="translate"
                          values="0 0;0 0;0 0"
                          keyTimes="0;0.55;1" dur="2.2s" begin="0s" repeatCount="indefinite"
                          additive="sum" calcMode="spline"
