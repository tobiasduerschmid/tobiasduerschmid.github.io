         HUMAN ARMS — Articulated skeleton (two rigid bones per arm).
         Drawn BEFORE the head-assembly so long hair drapes naturally
         OVER the arms. Arms never cross the face area (x=357–443),
         so face visibility is preserved at all rotation angles.
         Bones do not stretch or morph: they ROTATE around joints.
           • Upper arm bone (108 px) rotates around the SHOULDER joint
           • Forearm bone (109 px) rotates around the ELBOW joint
             (nested inside the upper arm so the elbow tracks it)
         Motion (2.2 s overhead-press cycle, sync'd with barbell-lift):
           • At t=0,1 (barbell UP):  α=−4°/+4°, β=+8°/−8° → soft lockout
           • At t=0.55 (barbell DOWN):
                LEFT:  α=−28°  β=+56°
                RIGHT: α=+28°  β=−56°
         The torso has only the small shared breathing lift; arms/bar rotate from joints.
         ============================================================ -->
    <g data-hero-kind-layer="human" data-hero-human-arms data-hero-body-fit-target="arms">
      <!-- ============================================================
           ARM MUSCLE TIERS — Six authored arm builds used as templates
           for the internal linear muscle-strength outline rig:
              none    — untrained, slim cylindrical sleeve
              bronze  — toned, faint bicep curve, hint of deltoid dome
              silver  — athletic, clear bicep peak, deltoid groove
              gold    — muscular, defined bicep belly + peak, brachialis
              diamond — elite, reduced below the maximum infinity build
              infinity — maximum superhero muscle, dramatic peak, rim light
           Construction follows the project's avatar-svg-design doctrine:
             1. ONE continuous cubic-Bezier silhouette path per arm
                (no `L` line commands — every edge is curved).
             2. Asymmetric anatomy — the LATERAL side (away from body
                centerline x=400) bulges more than the MEDIAL side, so
                arms read as real anatomy rather than mirror tubes.
             3. Cel-shaded FILL PLATES (not strokes) for primary form
                light/shadow — gives painted depth at any render size.
             4. Specular sheen — a thin near-white stroke on the bicep
                peak's apex sells the suit as a glossy surface and
                tracks the same lighting as the cape/boot speculars.
             5. Rim light (gold/diamond only) — a bright lateral edge
                stroke that separates the silhouette from the cape.
             6. Anatomy lines (gold/diamond) — thin dark grooves at the
                deltoid-bicep junction and brachialis edge.
           All shoulder (322/478, 268) and elbow (322/478, 162) pivots
           are identical across tiers so the overhead-press animation
           swaps tiers without recomputing rotation centres.
           ============================================================ -->
