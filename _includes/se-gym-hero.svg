    <style>
      .se-gym-hero-svg-{{ hero_variant }} [data-hero-slot="hair"]{clip-path:url(#hair-shoulder-clip-{{ hero_variant }});}
      .se-gym-hero-svg-{{ hero_variant }} [data-hero-slot="hair"][data-hero-option="long-braid"],
      .se-gym-hero-svg-{{ hero_variant }} [data-hero-slot="hair"][data-hero-option="side-braid"]{clip-path:url(#hair-braid-extended-clip-{{ hero_variant }});}
      .se-gym-hero-svg-{{ hero_variant }} [data-hero-slot="hairline"]{clip-path:url(#hair-foreground-safe-clip-{{ hero_variant }});}
      .se-gym-hero-svg-{{ hero_variant }} [data-hero-slot="hair"] path,
      .se-gym-hero-svg-{{ hero_variant }} [data-hero-slot="hairline"] path,
      .se-gym-hero-svg-{{ hero_variant }} [data-hero-slot="hair-root"] path{vector-effect:non-scaling-stroke;}
      .se-gym-hero-svg-{{ hero_variant }} [data-hero-slot="head-shape"] > path{stroke:var(--hero-face-line, #7a4a2a);}
      .se-gym-hero-svg-{{ hero_variant }} [data-hero-slot="hair"] path[stroke="#ffffff"],
      .se-gym-hero-svg-{{ hero_variant }} [data-hero-slot="hairline"] path[stroke="#ffffff"]{stroke:var(--hero-hair-specular, #c6a98d);}
      .se-gym-hero-svg-{{ hero_variant }} [data-hero-slot="eye-shape"] > ellipse[fill="#ffffff"],
      .se-gym-hero-svg-{{ hero_variant }} [data-hero-slot="eye-shape"] > path[fill="#ffffff"]{fill:url(#sclera-depth-{{ hero_variant }});stroke:var(--hero-face-line, #7a4a2a);stroke-width:.45;stroke-opacity:.14;paint-order:stroke fill;}
      .se-gym-hero-svg-{{ hero_variant }} [data-hero-slot="eye-shape"] g[clip-path] > circle[fill*="--hero-eye"]{fill:url(#iris-depth-{{ hero_variant }});stroke:var(--hero-eye-dark, #0b0704);stroke-width:.48;paint-order:stroke fill;}
      .se-gym-hero-svg-{{ hero_variant }} [data-hero-slot="eye-shape"] g[clip-path] circle[fill="#ffffff"]{opacity:0;}
      .se-gym-hero-svg-{{ hero_variant }} [data-hero-nose-layer] > [data-hero-slot="nose-shape"] > ellipse:first-of-type{fill:url(#nose-form-{{ hero_variant }});}
      .se-gym-hero-svg-{{ hero_variant }} .hero-milestone-shoe-plate{fill:url(#milestone-metal-{{ hero_variant }});stroke:var(--hero-milestone-metal-dark, #6b3e1d);stroke-linejoin:round;}
      .se-gym-hero-svg-{{ hero_variant }} .hero-milestone-shoe-line{fill:none;stroke:var(--hero-milestone-metal-light, #f5d2a5);stroke-linecap:round;}
      .se-gym-hero-svg-{{ hero_variant }} .hero-milestone-shoe-jewel{fill:url(#milestone-jewel-{{ hero_variant }});stroke:var(--hero-milestone-metal-light, #f5d2a5);}
      .se-gym-hero-svg-{{ hero_variant }} [data-hero-motion="eye-blink"],
      .se-gym-hero-svg-{{ hero_variant }} [data-hero-motion="eyelash-blink"],
      .se-gym-hero-svg-{{ hero_variant }} [data-hero-motion="lower-face-breath-position"]{transform-box:view-box;}
    </style>
