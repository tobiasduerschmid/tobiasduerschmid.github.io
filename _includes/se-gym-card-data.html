<script>
  var ALL_CARD_DATA = {{ site.data.se_gym_card_catalog | jsonify }};
  var SEGymDeckUrls = {{ site.data.se_gym_deck_urls | jsonify }};
  // Keep combined deck records shared with their source so loading a source
  // deck also supplies every combined deck that includes the same question.
  (function () {
    const references = {{ site.data.se_gym_master_decks | jsonify }};
    Object.keys(references).forEach(function (collection) {
      const field = collection === 'quizzes' ? 'questions' : 'cards';
      Object.entries(references[collection]).forEach(function (entry) {
        ALL_CARD_DATA[collection][entry[0]][field] = entry[1].flatMap(function (sourceId) {
          return ALL_CARD_DATA[collection][sourceId][field];
        });
      });
    });
  })();
</script>
