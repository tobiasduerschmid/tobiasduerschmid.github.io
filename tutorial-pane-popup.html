<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pane &mdash; Tutorial</title>
  {% include ai-training-opt-out-meta.html %}
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      if (p.get('dark') === '1') document.documentElement.classList.add('dark-mode');
    })();
  </script>
  <link rel="stylesheet" href="{{ '/css/tutorial.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/js/debugger/debugger.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/tutorial-popouts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/debugger-controls.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/smalltalk-browser.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/print-light.css' | relative_url }}">
</head>
<body>
  <main aria-label="Editor pane popout">
  <h1 class="sr-only">Editor pane popout</h1>
  <div class="tpp-bar">
    <span class="tpp-pane-name" id="paneNameEl">&hellip;</span>
    <span class="tpp-status" id="statusEl" role="status" aria-live="polite">Connecting&hellip;</span>
  </div>
  <div class="tvm-editor-tabs" id="tabBar"></div>
  <div class="tpp-wrap">
    <div id="editorRoot"></div>
    <div class="tpp-overlay" id="overlayEl">Waiting for tutorial&hellip;</div>
  </div>
  <div class="tpp-bar"><button class="tvm-btn" id="exitEditorBtn" type="button">Close window</button></div>
  </main>

  <script src="{{ '/js/tutorial-popout-client.js' | relative_url }}"></script>
  <script src="{{ '/js/monaco-sebook-langs.js' | relative_url }}"></script>
  <script src="{{ '/js/monaco-focus-exit.js' | relative_url }}"></script>
  <script src="{{ '/js/tutorial-refactorings.js' | relative_url }}"></script>
  <script src="{{ '/js/debugger/sync.js' | relative_url }}"></script>
  <script src="{{ '/js/debugger/editor-attach.js' | relative_url }}"></script>
  <script src="{{ '/js/smalltalk/protocol.js' | relative_url }}"></script>
  <script src="{{ '/js/smalltalk/workspace.js' | relative_url }}"></script>
  <script src="{{ '/js/smalltalk/popup.js' | relative_url }}"></script>
  <script src="{{ '/js/smalltalk/source-views.js' | relative_url }}"></script>
  <script src="{{ '/js/smalltalk/refactorings.js' | relative_url }}"></script>
  <script src="{{ '/js/smalltalk/refactoring-view.js' | relative_url }}"></script>
  <script src="{{ '/js/smalltalk/browser.js' | relative_url }}"></script>
  <script src="{{ '/js/smalltalk/inspector.js' | relative_url }}"></script>
  <script src="{{ '/js/popout/shared-editor.js' | relative_url }}"></script>
  <script src="{{ '/js/vendor/monaco-editor/0.44.0/min/vs/loader.js' | relative_url }}"></script>
  <script>
    SebookSharedEditor.bootForRole({
      smalltalk: new URLSearchParams(location.search).get('smalltalk') === '1',
      kind: 'pane',
      pane: new URLSearchParams(location.search).get('pane') || '',
      els: {
        paneName: document.getElementById('paneNameEl'),
        status:   document.getElementById('statusEl'),
        overlay:  document.getElementById('overlayEl'),
        tabBar:   document.getElementById('tabBar'),
        exit:     document.getElementById('exitEditorBtn'),
        editor:   document.getElementById('editorRoot'),
      },
    });
  </script>
</body>
</html>
