  hint: Only One Writer
  claims:
    - says: Two components now claim to be the only writer
      holds: {count: {element: {type: component, in: api, owns_any: [seat hold, held seat, seat reservation, reserved seat]}}, at_least: 2}
- step: 6
  test: 3
  hint: The Same Fact at Both Levels
  claims:
    - says: A component now writes to the database
      holds: {exists: {relationship: {from: {type: component, in: api}, to: db}}}
    - says: The API alone writes seat holds
      holds: {exists: {element: {id: api, owns_any: [seat hold]}}}
- step: 6
  test: 4
  hint: A Claim Without a Write
  claims:
    - says: A component records that it alone writes seat holds
      holds: {exists: {element: {type: component, in: api, owns_any: [seat hold, held seat, seat reservation, reserved seat]}}}
    - says: but it has no relationship to the Registration Database
      holds: {absent: {relationship: {from: {type: component, in: api, owns_any: [seat hold, held seat, seat reservation, reserved seat]}, to: db}}}
- step: 6
  test: 4
  hint: Claim and Relationship Together
  claims:
    - says: A component writes to the Registration Database
      holds: {exists: {relationship: {from: {type: component, in: api}, to: db}}}
    - says: no component that writes there names seat holds in its owns
      holds: {absent: {relationship: {from: {type: component, in: api, owns_any: [seat hold, held seat, seat reservation, reserved seat]}, to: db}}}
- step: 6
  test: 5
  hint: What Else Must It Know?
  claims:
    - says: The Seat Gateway holds seats
      holds: {exists: {responsibility: {of: seats, kind: do}}}
    - says: at least one of the API’s KNOW responsibilities has no component KNOW refining it yet
      holds: {exists: {responsibility: {of: api, kind: know, leaf: true}}}
- step: 6
  test: 5
  hint: Knowledge Needs a Link Too
  claims:
    - says: The Seat Gateway knows something
      holds: {exists: {responsibility: {of: seats, kind: know}}}
    - says: an API KNOW is still unrefined
      holds: {exists: {responsibility: {of: api, kind: know, leaf: true}}}
- step: 6
  test: 6
  hint: The Id Must Match
  states_nothing: States the rule a request's id must meet and asks the learner to check each request; the failure itself is what the test reports.
- step: 6
  test: 6
  hint: On the Target, Not a Sibling
  claims:
    - says: Every id the requests name exists
      holds: {checks: {max_errors: 0, rules: [model/unknown-reference]}}
    - says: at least one sits on a component the request does not target
      fails: {checks: {max_errors: 0, rules: [model/responsibility-owner]}}

