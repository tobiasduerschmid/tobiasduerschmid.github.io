# What each conditional hint of the C4 tutorial states about the learner's model: the hint-truth audit of
# scripts/tests/c4-tutorial-content.test.js. A hint shows when its test fails and its condition holds; each claim
# below must then be true of the model: its §8 predicate passes (holds) or fails (fails), evaluated as the tests are,
# with the step's checks configuration and its authored starter as seedModel. `says` quotes or paraphrases the
# statement the claim checks. A hint that asserts nothing about the model (advice, or a statement hedged by "if") has
# `states_nothing` with the reason. Unconditional hints may be documented too; conditional ones must be.
#
# The §8 forms have no negation, so a statement that something is wrong ("a relationship has no description") is a
# `fails` claim on the predicate that would hold if it were right.

# ---- Step 2: Zooming In to Confirm ---------------------------------------------------------------------------------
- step: 2
  test: 1
  hint: The Policy Is Gone
  claims:
    - says: The Enrollment Policy is no longer in the model
      holds: {absent: {element: {name_any: [policy]}}}
- step: 2
  test: 1
  hint: A View That Stops Too Early
  claims:
    - says: Your saved view draws the Registration API as a single box
      holds: {view: {view: who-decides, shows: [api], hides: [{type: component}]}}
- step: 2
  test: 1
  hint: Level and Scope Together
  claims:
    - says: you found the part that decides inside a container
      holds: {exists: {element: {type: component, name_any: [policy], parent: {type: container}}}}

# ---- Step 3: Context View Repair -----------------------------------------------------------------------------------
- step: 3
  test: 1
  hint: Name and Connection
  claims:
    - says: your new person (a second person exists)
      holds: {count: {element: {type: person}}, at_least: 2}
- step: 3
  test: 1
  hint: The Name Readers Expect
  claims:
    - says: Your second person (a second person exists)
      holds: {count: {element: {type: person}}, at_least: 2}
    - says: Your second person has a relationship (people have at least two relationships of their own)
      holds: {count: {relationship: {from: {type: person}, derived: exclude}}, at_least: 2}
- step: 3
  test: 2
  hint: Two Goals, Two People
  claims:
    - says: The student’s name now covers the adviser’s role too
      holds: {exists: {element: {id: student, name_any: [adviser, advisor, counselor, counsellor]}}}
- step: 3
  test: 2
  hint: Give the Student Back Its Name
  claims:
    - says: Another person exists
      holds: {count: {element: {type: person}}, at_least: 2}
    - says: the student’s name still names the adviser’s role
      holds: {exists: {element: {id: student, name_any: [adviser, advisor, counselor, counsellor]}}}
- step: 3
  test: 3
  hint: An Arrow With No Words
  claims:
    - says: One relationship has no description at all
      fails: {checks: {max_warnings: 0, rules: [rdd/no-reason]}}
    - says: One relationship (not several)
      holds: {checks: {max_warnings: 1, rules: [rdd/no-reason]}}
- step: 3
  test: 3
  hint: Words That Fit Any Arrow
  claims:
    - says: a description would fit any arrow in the diagram
      fails: {checks: {max_warnings: 0, rules: [c4/vague-relationship]}}
- step: 3
  test: 4
  hint: Restore the Request
  claims:
    - says: Nothing sends anything to the Billing System any more
      holds: {absent: {relationship: {to: billing}}}
    - says: the Billing System is still in the model
      holds: {exists: {element: {id: billing}}}
- step: 3
  test: 4
  hint: From the Right Sender
  claims:
    - says: Something reaches the Billing System
      holds: {exists: {relationship: {to: billing}}}
- step: 3
  test: 5
  hint: Name It After Its Job
  claims:
    - says: the generically named box (a box has a generic name)
      fails: {checks: {max_warnings: 0, rules: [c4/generic-name]}}
    - says: the generically named box’s responsibilities (the Backend container has responsibilities to read)
      holds: {exists: {element: {id: backend, responsibilities_at_least: 1}}}
- step: 3
  test: 5
  hint: Change the Name, Keep the Id
  states_nothing: Advice on how to rename the box the failed check names, keeping its id; it states no fact about the model.
- step: 3
  test: 6
  hint: One Level Down
  claims:
    - says: Both problems the Problems panel flagged are fixed
      holds: {checks: {max_warnings: 0, rules: [c4/generic-name, rdd/no-reason]}}
    - says: and the old box goes (the old Enrollment Records box is still there)
      holds: {exists: {element: {id: records}}}
- step: 3
  test: 6
  hint: External Means Another Owner
  claims:
    - says: a box other than the Billing System is marked external
      holds: {count: {element: {type: system, external: true}}, at_least: 2}
- step: 3
  test: 6
  hint: Now Remove the Old Box
  claims:
    - says: The data store now exists inside Course Registration
      holds: {exists: {element: {type: container, kind: database, in: registration}}}
    - says: then delete the old box (a third system is still there)
      holds: {count: {element: {type: system}}, at_least: 3}
- step: 3
  test: 7
  hint: Shape and Type Text
  claims:
    - says: A new container exists inside Course Registration
      holds: {count: {element: {type: container, in: registration}}, at_least: 3}
    - says: nothing marks it as a data store yet
      holds: {absent: {element: {type: container, kind: database, in: registration}}}
- step: 3
  test: 7
  hint: Inside the Right System
  claims:
    - says: A data store exists
      holds: {exists: {element: {type: container, kind: database}}}
    - says: but inside another system
      holds: {absent: {element: {type: container, kind: database, in: registration}}}
- step: 3
  test: 8
  hint: The Billing System Dropped Out
  claims:
    - says: The Billing System still exists
      holds: {exists: {element: {id: billing}}}
    - says: no container of Course Registration has a relationship to it
      holds: {absent: {relationship: {from: {type: container, in: registration}, to: billing}}}
    - says: so the container view leaves it out
      holds: {view: {view: containers of registration, hides: [billing]}}
- step: 3
  test: 8
  hint: The Student Dropped Out
  claims:
    - says: The student still exists
      holds: {exists: {element: {id: student}}}
    - says: the student’s relationship to a container is gone
      holds: {absent: {relationship: {from: student, to: {type: container, in: registration}}}}
    - says: no longer appears
      holds: {view: {view: containers of registration, hides: [student]}}

# ---- Step 4: Responsibilities from Requirements --------------------------------------------------------------------
- step: 4
  test: 1
  hint: Traces Need the Map Form
  states_nothing: Hedged ("If a responsibility is written as one plain string"); it states the map-form rule only.
- step: 4
  test: 1
  hint: The Failure Case Counts Too
  states_nothing: Hedged ("If the Problems panel still names FR-23"); it then explains what FR-23 asks.
- step: 4
  test: 2
  hint: Knowing Is Not Deciding
  claims:
    - says: the learner wrote a KNOW, which the hint contrasts with a DECIDE
      holds: {exists: {responsibility: {of: registration, kind: know}}}
- step: 4
  test: 2
  hint: Write the Judgment
  states_nothing: Advice on how to write the missing DECIDE, which the failed check reports.
- step: 4
  test: 3
  hint: Find the Flagged Statement
  claims:
    - says: The Problems panel marks which responsibility reads like a field, a method, or a screen step
      fails: {checks: {max_warnings: 0, rules: [rdd/not-an-obligation]}}
- step: 4
  test: 3
  hint: A Rewriting Pattern
  states_nothing: States the DO, KNOW, and DECIDE patterns and one example rewrite; nothing about the model.
- step: 4
  test: 4
  hint: Split Across Two Systems
  claims:
    - says: Some responsibilities sit on the Billing System
      holds: {exists: {responsibility: {of: billing}}}
    - says: split (others sit on Course Registration)
      holds: {exists: {responsibility: {of: registration}}}
- step: 4
  test: 4
  hint: All on the Wrong Box
  claims:
    - says: Every responsibility sits on the Billing System (none on Course Registration)
      holds: {absent: {responsibility: {of: registration}}}
    - says: Every responsibility sits on the Billing System (some do)
      holds: {exists: {responsibility: {of: billing}}}

