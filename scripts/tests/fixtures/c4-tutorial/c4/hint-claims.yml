      holds: {exists: {relationship: {from: coordinator, to: {type: component}, requests: policy-eligibility}}}
    - says: If it also makes that decision (it has a DECIDE that refines it)
      holds: {exists: {responsibility: {of: coordinator, kind: decide, refines: api-eligibility}}}
- step: 6
  test: 1
  hint: Asking Is Not Refining
  claims:
    - says: The coordinator gained a responsibility that refines the eligibility decision
      holds: {exists: {responsibility: {of: coordinator, refines: api-eligibility}}}
- step: 6
  test: 2
  hint: The Policy Is Gone
  claims:
    - says: the policy is gone
      holds: {absent: {element: {name_any: [policy]}}}
    - says: The coordinator still asks the Enrollment Policy (a request names an element that no longer exists)
      fails: {checks: {max_errors: 0, rules: [model/unknown-reference]}}
- step: 6
