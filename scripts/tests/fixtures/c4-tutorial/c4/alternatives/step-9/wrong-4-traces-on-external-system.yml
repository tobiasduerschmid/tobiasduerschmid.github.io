# WRONG DESIGN THAT PASSES (keyword-stuffed: every trace sits on the external Card System): must pass T1 and T2; only the rubric's scope question catches it.
schema: c4-design/1
name: Makerspace Equipment Loans
description: Members borrow tools from the campus makerspace.

requirements:
  MS-1: A member can borrow a tool only after completing that tool's safety training.
  MS-2: Each tool is lent to at most one member at a time, and desk staff can see who has each tool.
  MS-3: A member who returns a tool more than two days late cannot borrow any tool for the next seven days.

people:
  member:
    name: Member
    description: A student or staff member who borrows tools from the makerspace.
    collaborators:
      desk: taps a campus ID card to borrow and return tools at
  staff:
    name: Desk Staff
    description: Hands tools out, takes them back, and teaches tool trainings.
    collaborators:
      desk: lends tools, takes returns, and records completed trainings using

systems:
  loans:
    name: Makerspace Loans
    description: Lends tools to trained members and tracks who has each tool.
    containers:
      desk:
        name: Desk App
        description: Lets desk staff lend tools, take returns, and record completed trainings.
        kind: browser_app
        technology: TypeScript, React
        responsibilities:
          - do: let desk staff lend tools, take returns, and record completed trainings
        collaborators:
          api:
            description: sends loans, returns, and training completions to
            technology: JSON/HTTPS
      api:
        name: Loans API
        description: Decides who may borrow and records every loan, return, and completed training.
        technology: Java, Spring Boot
        responsibilities:
          - do: record every loan and return
        collaborators:
          db: {description: reads and writes loans and training completions in, technology: SQL/TCP}
          card: {description: asks whose campus ID card was tapped from, technology: JSON/HTTPS}
        owns: [loans, training completions]
      db:
        name: Loans Database
        description: Durably stores loans, returns, and completed trainings.
        kind: database
        technology: PostgreSQL 16
        responsibilities:
          - do: durably store loans, returns, and completed trainings
  card:
    name: Campus Card System
    description: Identifies students and staff by their campus ID cards.
    external: true
    responsibilities:
      - decide: whether a member may borrow a tool
        requirements: [MS-1, MS-3]
      - know: which member has each tool
        requirements: [MS-2]

views:
  for-manager:
    view: context of loans
    description: For the makerspace manager approving the system, shows who uses Makerspace Loans and which campus systems it depends on. The container view is left out, because technology choices do not change the approval.
  for-developer:
    view: containers of loans
    description: For the developer building the borrowing rule, shows which application decides whether a member may borrow and what it asks other systems. A component view is left out until the Loans API's insides are designed.
